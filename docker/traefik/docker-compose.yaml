# Traefik in front of the Workspace on the production server: HTTPS with
# Let's Encrypt (a wildcard certificate by DNS challenge at Cloudflare, which
# only hosts the DNS; no traffic goes through Cloudflare).
#
# Started on its own, before the Workspace: docker compose up -d here, with
# CF_DNS_API_TOKEN and ACME_EMAIL (the address Let's Encrypt writes to about
# the certificates) in the environment or in an .env file next to this one.
#
# Privacy (docs/datenschutz.md): there is deliberately no --accesslog, so
# Traefik writes no IP addresses of visitors; the Datenschutzerklärung says
# the logs contain none. What Traefik does write (start, certificates,
# errors) is overwritten after 3 × 10 MB, like the Workspace's services.

networks:
  proxy:
    external: true

services:
  traefik:
    networks:
      - proxy
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false

      - --log.level=INFO

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL missing, see the top of this file}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.dnschallenge.propagation.delaybeforechecks=10

    ports:
      - "80:80"
      - "443:443"

    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme/acme.json

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
