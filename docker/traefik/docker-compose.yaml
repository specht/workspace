# Traefik in front of the Workspace on the production server: HTTPS with
# Let's Encrypt, a wildcard certificate by DNS challenge at whoever hosts the
# DNS (which only hosts the names; no traffic goes through it).
#
# Started on its own, before the Workspace: docker compose up -d here, with an
# .env file next to this one (bootstrap/README.hetzner.centos.md, step 5):
#
#   DNS_PROVIDER=desec          deSEC e. V., Berlin, free; or cloudflare
#   DESEC_TOKEN=…               for desec; CF_DNS_API_TOKEN=… for cloudflare
#   ACME_EMAIL=…                the address Let's Encrypt writes to
#
# The whole .env goes into the container, so that the token of either
# provider reaches it. The same DNS host belongs in DNS_PROVIDER in
# credentials.rb, for the Datenschutzerklärung.
#
# Docker: Traefik reads which containers want to be reached (their labels)
# through a guard, not the Docker socket itself: the guard passes only what
# a watcher reads (DockerPolicy::READONLY in src/ruby/include/docker_policy.rb,
# GET on containers, networks, events, version) and refuses the rest, so a
# hole in Traefik is no way to start a container on the host. The guard is
# the Workspace's own (docker/docker-guard), started here with this compose.
#
# Privacy (docs/datenschutz.md): there is deliberately no --accesslog, so
# Traefik writes no IP addresses of visitors; the Datenschutzerklärung says
# the logs contain none. What Traefik does write (start, certificates,
# errors) is overwritten after 3 × 10 MB, like the Workspace's services.

networks:
  proxy:
    external: true

volumes:
  docker-guard:

services:
  docker-guard:
    image: ruby:3.4.10-alpine3.24
    container_name: traefik-docker-guard
    restart: unless-stopped
    command: ["ruby", "/guard/guard.rb"]
    environment:
      GUARD_MODE: readonly
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../docker-guard:/guard:ro
      - ../../src/ruby/include/docker_policy.rb:/policy/docker_policy.rb:ro
      - docker-guard:/run/docker-guard
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  traefik:
    networks:
      - proxy
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false

      - --log.level=INFO

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=unix:///run/docker-guard/docker.sock

      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL missing, see the top of this file}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=${DNS_PROVIDER:?DNS_PROVIDER missing, see the top of this file}
      - --certificatesresolvers.le.acme.dnschallenge.propagation.delaybeforechecks=10

    ports:
      - "80:80"
      - "443:443"

    env_file:
      - .env

    depends_on:
      - docker-guard

    volumes:
      - docker-guard:/run/docker-guard:ro
      - ./traefik/acme.json:/acme/acme.json

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
