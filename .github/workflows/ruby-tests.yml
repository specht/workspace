# The Ruby tests (src/ruby/test) on every push and pull request: the facts
# of the Datenschutzerklärung against the code, the roster, account deletion,
# task checks and their examples, and the rest. Tests that need tools not
# installed here (LaTeX, Graphviz and so on) skip themselves. The E2E suite
# (e2e/) needs the whole installation and runs by hand (docs/entwicklung.md).
name: Ruby tests

on:
  push:
  pull_request:

jobs:
  test:
    # two jobs side by side: the task examples take most of the time (about
    # nine minutes), all other tests together about four, so a mistake there
    # shows sooner
    strategy:
      fail-fast: false
      matrix:
        part: [quick, task-examples]
    name: ${{ matrix.part }}
    runs-on: ubuntu-latest
    container: ruby:3.4.10-bookworm
    steps:
      - uses: actions/checkout@v5
      - name: Tools the task examples need
        # what the Workspace has for them: Pillow, and SWI-Prolog for the
        # prolog checks
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-pil swi-prolog-nox default-libmysqlclient-dev
      - name: Gems as in the Ruby container
        # the versions of Gemfile.lock, so the tests see what production runs;
        # bundler and chunky_png as in docker/ruby/Dockerfile
        working-directory: src/ruby
        run: |
          gem install --no-document bundler --version 4.0.17
          gem install --no-document chunky_png --version 1.4.0
          bundle config set frozen true
          bundle install
      - name: Run every test file
        working-directory: src/ruby
        run: |
          failed=0
          if [ "${{ matrix.part }}" = task-examples ]; then
            files=test/task_examples_test.rb
          else
            files=$(ls test/*_test.rb | grep -v '^test/task_examples_test.rb$')
          fi
          for f in $files; do
            if ! ruby "$f" > /tmp/out.txt 2>&1; then
              echo "::error file=src/ruby/$f::$(tail -3 /tmp/out.txt | tr '\n' ' ')"
              failed=1
            fi
            echo "$f: $(tail -1 /tmp/out.txt)"
          done
          exit $failed
