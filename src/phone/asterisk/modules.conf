[modules]
autoload = yes
noload = chan_iax2.so
noload = chan_sip.so
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
noload = cdr_custom.so
noload = cdr_sqlite3_custom.so
noload = cel_sqlite3_custom.so
; Nothing a caller says is recorded or kept (the maintainer, 12 November
; 2026): only the keys count. Every module that records, listens in or
; takes messages is off; res_stasis_recording and res_stasis_snoop stay,
; because ARI's channels and bridges need them, but their folders in the
; image cannot be written (docker/phone-asterisk) and the runner never asks
; for them (runner.py, ARI_FORBIDDEN).
noload = app_mixmonitor.so
noload = app_record.so
noload = app_dictate.so
noload = app_chanspy.so
noload = app_voicemail.so
noload = app_voicemail_imap.so
noload = app_minivm.so
noload = res_ari_recordings.so
noload = res_pjsip_one_touch_record_info.so
noload = res_pjsip_send_to_voicemail.so
noload = res_agi.so
noload = bridge_builtin_features.so
; no list of calls either: call records (CDR, CEL) would keep each caller's
; number (cdr.conf switches them off as well)
noload = cdr_csv.so
noload = cdr_manager.so
noload = cel_custom.so
noload = cel_manager.so
; It never calls out (the maintainer, 12 November 2026): no application that
; dials, transfers or pages, no call files in the outgoing folder
; (pbx_spool), no »channel originate« on the console; the runner never
; asks ARI for a call (runner/ari_guard.py)
noload = app_dial.so
noload = app_originate.so
noload = app_followme.so
noload = app_queue.so
noload = app_page.so
noload = app_transfer.so
noload = app_blind_transfer.so
noload = app_attended_transfer.so
noload = app_directed_pickup.so
noload = pbx_spool.so
noload = res_clioriginate.so
