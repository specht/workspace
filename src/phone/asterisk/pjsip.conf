; Test telephones (a softphone in the local network, the test client).
; The trunk is added from credentials.rb when it is configured.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[test]
type = endpoint
context = from-test
disallow = all
allow = g722,alaw,ulaw
auth = test
aors = test
dtmf_mode = auto_info      ; RFC 4733 events, or SIP INFO (the test client)
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no

[test]
type = auth
auth_type = userpass
username = test
password = test

[test]
type = aor
max_contacts = 5
remove_existing = yes
