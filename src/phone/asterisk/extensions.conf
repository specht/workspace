; Every call goes to the runner (Stasis app "telefonspiel"); 600 is an echo
; test for a test telephone.
[from-trunk]
exten => _X.,1,Stasis(telefonspiel)
 same => n,Hangup()
; a call to the bare number arrives with the SIP user's name, letters
; included (easybell: K…T1; tested 12 November 2026); the runner gives it
; the menu
exten => _[A-Za-z+].,1,Stasis(telefonspiel)
 same => n,Hangup()
exten => s,1,Stasis(telefonspiel)
 same => n,Hangup()

[from-test]
exten => 100,1,Answer()
 same => n,Stasis(telefonspiel)
 same => n,Hangup()
; 100 with a game's number after it (and an extension after that), as a
; trunk passes it on (e2e.sh)
exten => _100XXX!,1,Answer()
 same => n,Stasis(telefonspiel)
 same => n,Hangup()
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
