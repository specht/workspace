; Every call goes to the runner (Stasis app "telefonspiel"); 600 is an echo
; test for a test telephone.
[from-trunk]
exten => _X.,1,Stasis(telefonspiel)
 same => n,Hangup()
exten => s,1,Stasis(telefonspiel)
 same => n,Hangup()

[from-test]
exten => 100,1,Answer()
 same => n,Stasis(telefonspiel)
 same => n,Hangup()
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
