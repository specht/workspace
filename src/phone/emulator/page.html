<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefonspiel</title>
<style>
:root {
    --bg: #f3f4f6; --card: #ffffff; --ink: #1f2933; --muted: #6b7280; --line: #e2e5ea;
    --key: #eef0f3; --key-hover: #e2e5ea; --game: #0e7490; --you: #a16207; --note: #6b7280;
    --green: #16a34a; --red: #dc2626; --warn-bg: #fef3c7; --warn-ink: #78350f;
    --bubble: #e3f2f6; --bubble-ink: #0b4a59; --cap: #ffffff; --cap-line: #d4d8de;
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #111418; --card: #1b2026; --ink: #e5e7eb; --muted: #9ca3af; --line: #2c333b;
        --key: #262c34; --key-hover: #313842; --game: #67c6dc; --you: #facc15; --note: #9ca3af;
        --warn-bg: #3b2f12; --warn-ink: #fde68a;
        --bubble: #173039; --bubble-ink: #d3eef5; --cap: #2a3038; --cap-line: #444c57;
        color-scheme: dark;
    }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; align-items: flex-start;
       padding: 24px 16px; max-width: 960px; margin: 0 auto; }
.phone { background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 22px 22px 26px;
         width: 300px; max-width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
.screen { text-align: center; min-height: 92px; margin-bottom: 14px; }
.screen h1 { font-size: 18px; margin: 4px 0 2px; }
.status { color: var(--muted); font-size: 14px; min-height: 21px; }
.wait { height: 4px; background: var(--line); border-radius: 2px; margin: 10px 18px 0; overflow: hidden; visibility: hidden; }
.wait.on { visibility: visible; }
.wait div { height: 100%; width: 100%; background: var(--you); transform-origin: left; }
.subtitle { min-height: 44px; margin: 8px 4px 0; font-size: 15px; line-height: 1.45; color: var(--game); }
.digits { font: 600 22px/1 ui-monospace, monospace; letter-spacing: .12em; min-height: 26px; margin-top: 8px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; justify-items: center; }
.keypad button { width: 68px; height: 68px; border-radius: 50%; border: 0; background: var(--key); color: var(--ink);
                 font: 500 26px/1 system-ui, sans-serif; cursor: pointer; transition: background .08s, transform .08s; }
.keypad button:hover { background: var(--key-hover); }
.keypad button.down { transform: scale(.93); background: var(--key-hover); }
.keypad button:disabled { opacity: .45; cursor: default; }
.call { display: flex; justify-content: center; margin-top: 18px; }
.call button { width: 68px; height: 68px; border-radius: 50%; border: 0; cursor: pointer; color: #fff; background: var(--green); }
.call button.hang { background: var(--red); }
.call button:focus:not(:focus-visible), .keypad button:focus:not(:focus-visible) { outline: none; }
.call .end, .call button.hang .dial { display: none; }
.call button.hang .end { display: inline; }
.call svg { width: 30px; height: 30px; vertical-align: middle; }
.log { flex: 1 1 320px; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
       padding: 16px 18px; min-height: 200px; max-height: calc(100vh - 48px); overflow-y: auto; }
.log h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
/* the conversation as a chat: the game left, the keys right */
#lines { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; padding: 8px 13px; border-radius: 18px; overflow-wrap: anywhere; animation: pop .22s ease-out; }
.msg.game { align-self: flex-start; background: var(--bubble); color: var(--bubble-ink); border-bottom-left-radius: 6px; min-width: 44px; }
.msg.you { align-self: flex-end; padding: 2px 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
.cap { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 7px;
       background: var(--cap); color: var(--ink); border: 1px solid var(--cap-line); border-bottom-width: 2px;
       font: 600 15px/1 ui-monospace, monospace; animation: pop .15s ease-out; }
.note { align-self: center; display: flex; align-items: center; gap: 6px; color: var(--note); font-size: 13px;
        text-align: center; animation: pop .22s ease-out; }
/* words appear as they are spoken; the dot is the cursor */
.w { animation: word .3s ease-out both; }
.cursor { display: inline-block; width: .6em; height: .6em; margin-left: .3em; border-radius: 50%; background: currentColor;
          vertical-align: .02em; animation: pulse 1s ease-in-out infinite; }
.msg .cursor:first-child { margin-left: 0; }
@keyframes word { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.75); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .w, .msg, .cap, .note { animation: none; } .cursor { animation: none; opacity: .7; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-bottom: 10px; }
kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.help { color: var(--muted); font-size: 13px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<main>
    <section class="phone" aria-label="Telefon">
        <div class="screen">
            <h1 id="title">Telefonspiel</h1>
            <div class="status" id="status">Verbinde mit dem Terminal …</div>
            <div class="subtitle" id="subtitle"></div>
            <div class="digits" id="digits" aria-live="polite"></div>
            <div class="wait" id="wait"><div id="wait-bar"></div></div>
        </div>
        <div class="keypad" id="keypad"></div>
        <div class="call"><button id="call" type="button" aria-label="Anrufen" disabled>
            <!-- Tabler Icons 3.49.0 (MIT License): filled/phone and outline/phone-off -->
            <svg class="dial" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3a1 1 0 0 1 .877 .519l.051 .11l2 5a1 1 0 0 1 -.313 1.16l-.1 .068l-1.674 1.004l.063 .103a10 10 0 0 0 3.132 3.132l.102 .062l1.005 -1.672a1 1 0 0 1 1.113 -.453l.115 .039l5 2a1 1 0 0 1 .622 .807l.007 .121v4c0 1.657 -1.343 3 -3.06 2.998c-8.579 -.521 -15.418 -7.36 -15.94 -15.998a3 3 0 0 1 2.824 -2.995l.176 -.005h4z" /></svg>
            <svg class="end" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l18 -18" /><path d="M5.831 14.161a15.946 15.946 0 0 1 -2.831 -8.161a2 2 0 0 1 2 -2h4l2 5l-2.5 1.5c.108 .22 .223 .435 .345 .645m1.751 2.277c.843 .84 1.822 1.544 2.904 2.078l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a15.963 15.963 0 0 1 -10.344 -4.657" /></svg>
        </button></div>
        <div class="help">Tasten auch mit <kbd>0</kbd>–<kbd>9</kbd>, <kbd>*</kbd>, <kbd>#</kbd>; <kbd>Enter</kbd> ruft an, <kbd>Esc</kbd> legt auf.</div>
    </section>
    <section class="log" id="log">
        <h2>Gespräch</h2>
        <div id="warnings"></div>
        <div id="lines"><div class="note">Klick auf den grünen Hörer: Dann startet dein Spiel im Terminal, und du hörst es hier.</div></div>
        <div class="sr" id="spoken" aria-live="polite"></div>
    </section>
</main>
<script>
// the same mixing as on the phone (src/phone/runner/mixer.py): the music
// loops, the speech plays on top, the music goes down to a quarter under
// the speech (in 80 ms) and comes back in 400 ms
const DUCK = 0.25, ATTACK = 0.08, RELEASE = 0.4;
const KEYS = '123456789*0#';
const TONES = { '1': [697, 1209], '2': [697, 1336], '3': [697, 1477], '4': [770, 1209], '5': [770, 1336],
    '6': [770, 1477], '7': [852, 1209], '8': [852, 1336], '9': [852, 1477], '*': [941, 1209], '0': [941, 1336], '#': [941, 1477] };

const $ = id => document.getElementById(id);
let ctx = null, musicGain, duckGain, musicSource = null, voice = null;
let inCall = false, call = 0, musicRequest = 0, started = 0, clock = null, warned = {}, keyBubble = null;

function audio() {
    if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        musicGain = ctx.createGain();
        duckGain = ctx.createGain();
        musicGain.connect(duckGain);
        duckGain.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
}

function duck(on) {
    const g = duckGain.gain, now = ctx.currentTime, from = g.value, target = on ? DUCK : 1;
    g.cancelScheduledValues(now);
    g.setValueAtTime(from, now);
    g.linearRampToValueAtTime(target, now + Math.abs(from - target) / (1 - DUCK) * (on ? ATTACK : RELEASE));
}

function post(path, body) {
    return fetch(path, { method: 'POST', body: body || '' }).catch(() => {});
}

function scroll() {
    $('log').scrollTop = $('log').scrollHeight;
}

function message(kind) {
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    $('lines').appendChild(div);
    if (kind !== 'you') keyBubble = null;
    scroll();
    return div;
}

function note(text) {
    const div = document.createElement('div');
    div.className = 'note';
    div.textContent = text;
    $('lines').appendChild(div);
    keyBubble = null;
    scroll();
    return div;
}

function warn(key, text, terminal) {
    if (warned[key]) return;
    warned[key] = true;
    const div = document.createElement('div');
    div.className = 'warn';
    div.textContent = text;
    $('warnings').appendChild(div);
    if (terminal) post('/problem', terminal);
}

async function fetchAudio(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(await response.text());
    return audio().decodeAudioData(await response.arrayBuffer());
}

function play(buffer) {
    return new Promise(resolve => {
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.onended = () => { if (voice === source) voice = null; resolve(); };
        voice = source;
        source.start();
    });
}

// without the speech service (outside the Workspace): the browser's own voice
function speakInBrowser(text) {
    return new Promise(resolve => {
        if (!window.speechSynthesis) { setTimeout(resolve, 60 * text.length); return; }
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE';
        u.onend = u.onerror = () => resolve();
        speechSynthesis.speak(u);
    });
}

// When each word is spoken. Piper tells no word timings, so they come from
// the sound: where the speech starts and ends, its pauses (put at the
// commas when there are as many of both), the words in between by length.
function wordTimes(buffer, words) {
    const data = buffer.getChannelData(0), hop = Math.round(buffer.sampleRate / 100), env = [];
    for (let i = 0; i < data.length; i += hop) {
        const end = Math.min(i + hop, data.length);
        let sum = 0;
        for (let j = i; j < end; j++) sum += data[j] * data[j];
        env.push(Math.sqrt(sum / (end - i)));
    }
    const peak = env.reduce((a, b) => Math.max(a, b), 0) || 1;
    const loud = env.map(e => e > peak * 0.06);
    let first = loud.indexOf(true), last = loud.lastIndexOf(true);
    if (first < 0) { first = 0; last = env.length - 1; }
    const pauses = [];
    for (let i = first, run = 0; i <= last; i++) {
        if (!loud[i]) run++;
        else { if (run >= 12) pauses.push([i - run, i]); run = 0; }
    }
    const breaks = [];
    words.forEach((w, i) => { if (i < words.length - 1 && /[,;:–—]$/.test(w)) breaks.push(i + 1); });
    const segments = [];                     // [from, to (in 10 ms), first word, end word]
    if (pauses.length && pauses.length === breaks.length) {
        let from = first, word = 0;
        pauses.forEach(([a, b], k) => { segments.push([from, a, word, breaks[k]]); from = b; word = breaks[k]; });
        segments.push([from, last + 1, word, words.length]);
    } else {
        segments.push([first, last + 1, 0, words.length]);
    }
    const times = [];
    for (const [from, to, w0, w1] of segments) {
        // a digit is spoken as a word (»drei«)
        const weights = words.slice(w0, w1).map(w => w.replace(/[^\p{L}]/gu, '').length + 4 * w.replace(/\D/g, '').length + 1.5);
        const total = weights.reduce((a, b) => a + b, 0);
        let sum = 0;
        for (const weight of weights) { times.push((from + (to - from) * sum / total) / 100); sum += weight; }
    }
    return times;
}

// the words of a sentence into the bubble and the phone's screen as they
// are spoken; now() is the time since the sentence started. Returns a
// function that shows the rest at once.
function typeSentence(bubble, words, times, now) {
    const cursor = bubble.querySelector('.cursor');
    $('subtitle').textContent = '';
    let next = 0, all = false;
    const step = () => {
        const t = now();
        while (next < words.length && (all || times[next] <= t)) {
            for (const [target, before] of [[bubble, cursor], [$('subtitle'), null]]) {
                if (target.querySelector('.w')) target.insertBefore(document.createTextNode(' '), before);
                const span = document.createElement('span');
                span.className = 'w';
                span.textContent = words[next];
                target.insertBefore(span, before);
            }
            next++;
            scroll();
        }
        if (next < words.length && !all) requestAnimationFrame(step);
    };
    step();
    return () => { all = true; step(); };
}

async function say(parts, id) {
    const mine = call;
    // the bubble shows the cursor alone until the first word is spoken
    const bubble = message('game');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bubble.appendChild(cursor);
    const buffers = parts.map(p => fetchAudio('/speech?text=' + encodeURIComponent(p)));
    buffers.forEach(b => b.catch(() => {}));
    duck(true);
    for (let i = 0; i < parts.length; i++) {
        const words = parts[i].split(' ');
        let finish = null;
        const start = (times, now) => {
            $('spoken').textContent = parts[i];
            post(`/playing?id=${id}&part=${i}`);       // the terminal shows the sentence now
            finish = typeSentence(bubble, words, times, now);
        };
        try {
            const buffer = await buffers[i];
            if (mine !== call) return;
            const t0 = ctx.currentTime;
            start(wordTimes(buffer, words), () => ctx.currentTime - t0);
            await play(buffer);
        } catch (error) {
            if (mine !== call) return;
            warn('speech', 'Die Stimme des Telefons ist gerade nicht erreichbar; der Browser liest vor. Auf dem echten Telefon klingt es anders.',
                 'Die Stimme ist nicht erreichbar, der Browser liest vor: ' + error.message);
            let chars = 0;
            const times = words.map(w => { const t = chars * 0.065; chars += w.length + 1; return t; });
            const t0 = performance.now();
            if (!finish) start(times, () => (performance.now() - t0) / 1000);
            await speakInBrowser(parts[i]);
        }
        if (finish) finish();
        if (mine !== call) return;
    }
    cursor.remove();
    duck(false);
    post('/heard?id=' + id);
}

// as loud as on the phone: the music's peaks (99.5 % of the samples below)
// at 0.7, as the runner and the speech service do (sounds.py, server.py)
function evenOut(buffer) {
    const data = buffer.getChannelData(0), bins = new Uint32Array(1000);
    for (let i = 0; i < data.length; i += 4) bins[Math.min(999, Math.floor(Math.abs(data[i]) * 1000))]++;
    let count = 0, total = Math.ceil(data.length / 4);
    for (let b = 0; b < 1000; b++) {
        count += bins[b];
        if (count >= total * 0.995) return b ? Math.min(8, 0.7 / ((b + 1) / 1000)) : 1;
    }
    return 1;
}

function stopMusic() {
    musicRequest++;
    if (musicSource) { try { musicSource.stop(); } catch (e) {} musicSource = null; }
}

// audio first: the page says nothing about the music; a problem goes only
// to the terminal
async function music(url, volume, id) {
    stopMusic();
    if (!url) return;
    const mine = ++musicRequest;
    try {
        const buffer = await fetchAudio(url);
        if (mine !== musicRequest || !inCall) return;
        musicSource = ctx.createBufferSource();
        musicSource.buffer = buffer;
        musicSource.loop = true;
        musicGain.gain.value = volume * evenOut(buffer);
        musicSource.connect(musicGain);
        musicSource.start();
    } catch (error) {
        const source = decodeURIComponent(url.split('source=')[1] || '');
        post('/problem', 'Die Musik ließ sich nicht laden (' + source + '): ' + error.message);
    } finally {
        if (id) post('/heard?id=' + id);           // the game goes on
    }
}

function tone(key) {
    if (!ctx) return;
    const gain = ctx.createGain(), now = ctx.currentTime;
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.setTargetAtTime(0, now + 0.1, 0.02);
    gain.connect(ctx.destination);
    for (const f of TONES[key]) {
        const o = ctx.createOscillator();
        o.frequency.value = f;
        o.connect(gain);
        o.start(now);
        o.stop(now + 0.2);
    }
}

function press(key) {
    const button = document.querySelector(`.keypad button[data-key="${key}"]`);
    button.classList.add('down');
    setTimeout(() => button.classList.remove('down'), 120);
    if (!inCall) return;
    tone(key);
    if (!keyBubble) keyBubble = message('you');
    const cap = document.createElement('span');
    cap.className = 'cap';
    cap.textContent = key;
    cap.setAttribute('aria-label', 'Taste ' + key);
    keyBubble.appendChild(cap);
    scroll();
    $('digits').textContent += key;
    post('/key?key=' + encodeURIComponent(key));
}

function waiting(count, timeout) {
    keyBubble = null;
    $('digits').textContent = '';
    $('status').textContent = count === 1 ? 'Das Spiel wartet auf eine Taste' : `Das Spiel wartet auf bis zu ${count} Tasten`;
    const bar = $('wait-bar');
    $('wait').classList.add('on');
    bar.style.transition = 'none';
    bar.style.transform = 'scaleX(1)';
    bar.offsetWidth;
    bar.style.transition = `transform ${timeout / 1000}s linear`;
    bar.style.transform = 'scaleX(0)';
}

function waited() {
    $('wait').classList.remove('on');
    $('status').textContent = talking();
}

function talking() {
    const s = Math.floor((Date.now() - started) / 1000);
    return `Verbunden ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function setCall(on) {
    inCall = on;
    call++;
    const button = $('call');
    button.classList.toggle('hang', on);
    button.setAttribute('aria-label', on ? 'Auflegen' : 'Anrufen');
    document.querySelectorAll('.keypad button').forEach(b => b.disabled = !on);
    clearInterval(clock);
    $('wait').classList.remove('on');
    $('digits').textContent = '';
    if (on) {
        started = Date.now();
        $('status').textContent = talking();
        clock = setInterval(() => { if (!$('wait').classList.contains('on')) $('status').textContent = talking(); }, 1000);
    } else {
        stopMusic();
        if (voice) { try { voice.stop(); } catch (e) {} voice = null; }
        $('subtitle').textContent = '';
        document.querySelectorAll('#lines .cursor').forEach(c => c.remove());
        if (window.speechSynthesis) speechSynthesis.cancel();
        if (duckGain) { duckGain.gain.cancelScheduledValues(0); duckGain.gain.value = 1; }
    }
}

function toggleCall() {
    if ($('call').disabled) return;
    if (inCall) {
        post('/hangup');
        return;
    }
    audio();
    $('lines').textContent = '';
    setCall(true);
    post('/call');
}

for (const key of KEYS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = key;
    b.dataset.key = key;
    b.disabled = true;
    b.addEventListener('click', () => press(key));
    $('keypad').appendChild(b);
}
$('call').addEventListener('click', e => {
    toggleCall();
    if (e.detail) e.currentTarget.blur();      // a mouse click: no focus ring while typing digits
});
document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (KEYS.includes(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === 'Enter' && !inCall) { toggleCall(); e.preventDefault(); }
    else if (e.key === 'Escape' && inCall) { toggleCall(); e.preventDefault(); }
});

const ENDED = { caller: 'Aufgelegt.', hangup: 'Das Spiel hat aufgelegt.', ended: 'Das Spiel ist zu Ende.', time: 'Die Zeit ist um.' };
const events = new EventSource('/events');
events.onmessage = message => {
    const e = JSON.parse(message.data);
    if (e.ready) {
        $('title').textContent = e.title || 'Telefonspiel';
        if (inCall) { setCall(false); note('Die Verbindung zum Terminal war weg; der Anruf ist beendet.'); }
        $('status').textContent = 'Bereit';
        $('call').disabled = false;
    } else if (e.replaced) {
        events.close();
        setCall(false);
        $('call').disabled = true;
        $('status').textContent = 'Das Telefon ist jetzt in einem anderen Tab offen.';
    } else if (e.say) {
        say(e.say, e.id);
    } else if ('music' in e) {
        music(e.music, e.volume, e.id);
    } else if (e.keys) {
        waiting(e.keys, e.timeout);
    } else if ('keysDone' in e) {
        waited();
    } else if (e.ended) {
        setCall(false);
        note(ENDED[e.ended] || 'Der Anruf ist beendet.');
        $('status').textContent = 'Bereit';
    }
};
events.onerror = () => {
    if (events.readyState === EventSource.CLOSED) return;
    $('call').disabled = true;
    $('status').textContent = 'Keine Verbindung zum Terminal: Läuft telefon noch?';
};
</script>
</body>
</html>
