<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefonspiel</title>
<style>
:root {
    --bg: #eef1f4; --card: #ffffff; --ink: #1f2933; --muted: #6b7280; --line: #e2e5ea;
    --note: #6b7280;
    --green: #16a34a; --red: #dc2626; --warn-bg: #fef3c7; --warn-ink: #78350f;
    --bubble: #e3f2f6; --bubble-ink: #0b4a59; --avatar: #0e7490; --cap: #ffffff; --cap-line: #d4d8de;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 18px 40px -12px rgba(16,24,40,.18);
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0f1216; --card: #1a1f25; --ink: #e5e7eb; --muted: #9ca3af; --line: #2b323a;
        --note: #9ca3af;
        --warn-bg: #3b2f12; --warn-ink: #fde68a;
        --bubble: #173039; --bubble-ink: #d3eef5; --avatar: #3fa9c2; --cap: #2a3038; --cap-line: #444c57;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 40px -12px rgba(0,0,0,.6);
        color-scheme: dark;
    }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
/* the line in the Telefonbuch: only the phone, on the page behind it */
body.line { background: transparent; }
body.line main { grid-template-columns: 310px; padding: 12px 15px 40px; }
body.line .log { display: none; }
/* a real phone shows no countdown while the other end waits for keys */
body.line .wait { display: none; }
main { display: grid; grid-template-columns: 310px minmax(0, 700px); gap: 24px; justify-content: center;
       padding: 24px 16px; margin: 0 auto; }
@media (max-width: 720px) { main { grid-template-columns: minmax(0, 340px); } }

/* the phone: a dark body with side buttons, the screen inside it, a camera
   island at the top and the home bar at the bottom; the screen of a call is dark
   in both colour schemes, as on a real phone */
.phone { position: relative; align-self: start; background: #0c0d10; border-radius: 50px; padding: 11px;
         box-shadow: 0 0 0 1.5px #3a3e46, 0 0 0 3px #15171b, var(--shadow); }
.phone::before, .phone::after { content: ''; position: absolute; width: 4px; border-radius: 2px; background: #2c3037; }
.phone::before { left: -6px; top: 120px; height: 56px; box-shadow: 0 72px 0 #2c3037; }   /* volume up and down */
.phone::after { right: -6px; top: 160px; height: 84px; }                               /* side button */
.glass { position: relative; border-radius: 40px; overflow: hidden; color: #f5f7fa; padding: 12px 22px 10px;
         display: flex; flex-direction: column; height: 646px;   /* a phone's 19.5:9 with the body */
         background: radial-gradient(120% 70% at 50% 0%, #2a3a46 0%, #141b21 55%, #0b0f12 100%); }
.island { width: 92px; height: 26px; border-radius: 13px; background: #000; margin: 0 auto 30px; }
.screen { position: relative; text-align: center; margin-bottom: 14px; padding-bottom: 9px; }
.screen h1 { font-size: 22px; margin: 0 0 4px; font-weight: 500; letter-spacing: .01em; }
.status { color: rgba(245,247,250,.62); font-size: 14px; min-height: 20px; font-variant-numeric: tabular-nums;
          display: flex; align-items: center; justify-content: center; gap: 6px; }
.status .live { width: 7px; height: 7px; border-radius: 50%; background: #34d399; display: none; }
.screen.on .status .live { display: inline-block; }
/* one row for the keys pressed (while the game waits) and the voice (while it speaks) */
.readout { position: relative; height: 30px; margin-top: 6px; }
.digits { position: absolute; inset: 0; display: grid; place-items: center; font: 300 28px/1 system-ui, -apple-system, sans-serif;
          letter-spacing: .08em; font-variant-numeric: tabular-nums; }
/* while the game speaks: bars on the screen (the voice, never the music) */
.voice { position: absolute; inset: 0; display: flex; gap: 3px; justify-content: center; align-items: center; opacity: 0; transition: opacity .2s; }
.voice i { width: 3px; height: 4px; border-radius: 2px; background: currentColor; }
.screen.speaking .voice { opacity: .85; }
.screen.speaking .digits { opacity: 0; }
.screen.speaking .voice i { animation: bar .9s ease-in-out infinite; }
.voice i:nth-child(2) { animation-delay: -.6s !important; } .voice i:nth-child(3) { animation-delay: -.3s !important; }
.voice i:nth-child(4) { animation-delay: -.75s !important; } .voice i:nth-child(5) { animation-delay: -.15s !important; }
@keyframes bar { 0%, 100% { height: 5px; } 50% { height: 20px; } }
.wait { position: absolute; left: 30px; right: 30px; bottom: 0; height: 3px; background: rgba(255,255,255,.15);
        border-radius: 2px; overflow: hidden; visibility: hidden; }
.wait.on { visibility: visible; }
.wait div { height: 100%; width: 100%; background: #fbbf24; transform-origin: left; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; justify-items: center; margin-top: auto; }
.keypad button { width: 66px; height: 66px; border-radius: 50%; border: 0; background: rgba(255,255,255,.13); color: #fff;
                 cursor: pointer; transition: background .08s, transform .08s; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: 2px; padding: 0; }
.keypad b { font: 400 30px/1 system-ui, -apple-system, sans-serif; }
.keypad small { font: 600 9px/1 system-ui, sans-serif; letter-spacing: .16em; color: rgba(255,255,255,.7); min-height: 9px; }
.keypad button:hover { background: rgba(255,255,255,.2); }
.keypad button.down { transform: scale(.93); background: rgba(255,255,255,.32); }
.keypad button:disabled { opacity: .45; cursor: default; }
.call { display: grid; grid-template-columns: 1fr 66px 1fr; align-items: center; justify-items: center; margin-top: 18px; }
.call #call { grid-column: 2; }
/* the line: digits dialled before the call, taken back one at a time */
.call .erase { grid-column: 3; width: 44px; height: 44px; background: none; color: rgba(255,255,255,.75); }
.call .erase:hover { color: #fff; }
.call .erase svg { width: 26px; height: 26px; }
.call button { position: relative; width: 66px; height: 66px; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
               background: var(--green); transition: background .15s; }
.call #call:disabled { opacity: .45; cursor: default; }
.call #call.hang { background: var(--red); }
/* ready to call: a ring that invites the click */
.call #call.ready::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--green);
                            animation: ring 2s ease-out infinite; }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.45); opacity: 0; } }
.call button:focus:not(:focus-visible), .keypad button:focus:not(:focus-visible) { outline: none; }
/* a tap on a phone: no blue highlight, no zoom on a quick second tap, no
   selected digits; the ring of :focus-visible stays for the keyboard */
.keypad button, .call button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.call .end, .call #call.hang .dial { display: none; }
.call #call.hang .end { display: inline; }
.call #call svg { width: 30px; height: 30px; vertical-align: middle; }
.home { width: 112px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.55); margin: 24px auto 0; }

/* the conversation as a chat: the game left, the keys right */
.log { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
       display: flex; flex-direction: column; min-height: 0; height: 100%; max-height: calc(100vh - 48px); overflow: hidden; }
@media (max-width: 720px) { .log { height: auto; min-height: 260px; max-height: 70vh; } }
.log header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
              padding: 13px 18px; border-bottom: 1px solid var(--line); }
.log h2 { font-size: 15px; margin: 0; font-weight: 650; }
.pill { font-size: 12px; font-weight: 600; color: var(--red); display: none; align-items: center; gap: 6px; }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.6s ease-in-out infinite; }
.log.on .pill { display: inline-flex; }
@keyframes blink { 50% { opacity: .3; } }
.scroll { flex: 1; overflow-y: auto; padding: 16px 18px; }
#lines { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; animation: pop .22s ease-out; }
.avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--avatar); color: #fff;
          display: grid; place-items: center; }
.avatar svg { width: 16px; height: 16px; }
.row + .row .avatar { visibility: hidden; }
.msg { padding: 8px 13px; border-radius: 18px; overflow-wrap: anywhere; }
.msg .mood { display: block; font-size: 12px; font-style: italic; opacity: .7; margin-bottom: 1px; }
.msg.game { background: var(--bubble); color: var(--bubble-ink); border-bottom-left-radius: 6px; min-width: 44px; }
.msg.you { align-self: flex-end; padding: 2px 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; animation: pop .22s ease-out; }
.cap { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 7px; border-radius: 8px;
       background: var(--cap); color: var(--ink); border: 1px solid var(--cap-line); border-bottom-width: 3px;
       font: 600 15px/1 system-ui, -apple-system, sans-serif; animation: pop .15s ease-out; }
.note { align-self: center; color: var(--note); font-size: 13px; text-align: center; animation: pop .22s ease-out; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 12px; color: var(--muted);
         text-align: center; font-size: 14px; }
.empty svg { width: 40px; height: 40px; opacity: .55; }
/* words appear as they are spoken; the dot is the cursor */
.w { animation: word .18s ease-out both; }
.cursor { display: inline-block; width: .6em; height: .6em; margin-left: .3em; border-radius: 50%; background: currentColor;
          vertical-align: .02em; animation: pulse 1s ease-in-out infinite; }
.msg .cursor:first-child { margin-left: 0; }
@keyframes word { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.75); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
    .w, .row, .msg, .cap, .note, .pill::before, .call button.ready::after { animation: none; }
    .cursor { animation: none; opacity: .7; } .screen.speaking .voice i { animation: none; height: 9px; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-bottom: 10px; }
.log footer { padding: 9px 18px 11px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
kbd { font: 11.5px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<main>
    <section class="phone" aria-label="Telefon">
        <div class="glass">
        <div class="island"></div>
        <div class="screen" id="screen">
            <h1 id="title">Telefonspiel</h1>
            <div class="status"><span class="live"></span><span id="status">Verbinde mit dem Terminal …</span></div>
            <div class="readout">
                <div class="digits" id="digits" aria-live="polite"></div>
                <div class="voice" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="wait" id="wait"><div id="wait-bar"></div></div>
        </div>
        <div class="keypad" id="keypad"></div>
        <div class="call"><button id="call" type="button" aria-label="Anrufen" disabled>
            <!-- Tabler Icons 3.49.0 (MIT License): outline/phone, outline/phone-off, outline/backspace -->
            <svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2" /></svg>
            <svg class="end" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l18 -18" /><path d="M5.831 14.161a15.946 15.946 0 0 1 -2.831 -8.161a2 2 0 0 1 2 -2h4l2 5l-2.5 1.5c.108 .22 .223 .435 .345 .645m1.751 2.277c.843 .84 1.822 1.544 2.904 2.078l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a15.963 15.963 0 0 1 -10.344 -4.657" /></svg>
        </button><button class="erase" id="erase" type="button" aria-label="Ziffer löschen" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-11l-5 -5a1.5 1.5 0 0 1 0 -2l5 -5z" /><path d="M12 10l4 4m0 -4l-4 4" /></svg>
        </button></div>
        <div class="home"></div>
        </div>
    </section>
    <section class="log" id="log">
        <header><h2>Gespräch</h2><span class="pill">Anruf läuft</span></header>
        <div class="scroll" id="scroll">
            <div id="warnings"></div>
            <div id="lines"></div>
        </div>
        <footer>Tasten auch mit <kbd>0</kbd>–<kbd>9</kbd>, <kbd>*</kbd> und <kbd>#</kbd>; <kbd>Enter</kbd> ruft an, <kbd>Esc</kbd> legt auf.</footer>
        <div class="sr" id="spoken" aria-live="polite"></div>
    </section>
</main>
<script>
// the same mixing as on the phone (src/phone/runner/mixer.py): the music
// loops, the speech plays on top, the music goes down to a quarter under
// the speech (in 80 ms) and comes back in 400 ms
const DUCK = 0.25, ATTACK = 0.08, RELEASE = 0.4;
const KEYS = '123456789*0#';
const TONES = { '1': [697, 1209], '2': [697, 1336], '3': [697, 1477], '4': [770, 1209], '5': [770, 1336],
    '6': [770, 1477], '7': [852, 1209], '8': [852, 1336], '9': [852, 1477], '*': [941, 1209], '0': [941, 1336], '#': [941, 1477] };

const $ = id => document.getElementById(id);
let ctx = null, musicGain, duckGain, musicSource = null, voice = null;
let dialed = '', inCall = false, call = 0, musicRequest = 0, started = 0, clock = null, warned = {}, keyBubble = null;
let skip = null;          // while a sentence a key may stop (say … interrupt) is spoken: stops it

function audio() {
    if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        musicGain = ctx.createGain();
        duckGain = ctx.createGain();
        musicGain.connect(duckGain);
        duckGain.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
}

function duck(on) {
    const g = duckGain.gain, now = ctx.currentTime, from = g.value, target = on ? DUCK : 1;
    g.cancelScheduledValues(now);
    g.setValueAtTime(from, now);
    g.linearRampToValueAtTime(target, now + Math.abs(from - target) / (1 - DUCK) * (on ? ATTACK : RELEASE));
}

// In the Telefonbuch (?line) this page is the public line (src/phone/line):
// only the phone, and a session of its own on every request. Addresses are
// relative, so the page works under any path (/telefonbuch/telefon/).
const LINE = new URLSearchParams(location.search).has('line');
// a game tried before it is published (/telefon-freigabe): the call button
// calls it without a number
const TRY = LINE ? (new URLSearchParams(location.search).get('try') || '') : '';
const SESSION = LINE ? Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('') : '';
if (LINE) document.body.classList.add('line');
function at(path) {
    const p = path.replace(/^\//, '');
    return SESSION ? p + (p.includes('?') ? '&' : '?') + 's=' + SESSION : p;
}

function post(path, body) {
    return fetch(at(path), { method: 'POST', body: body || '' }).catch(() => {});
}

function scroll() {
    $('scroll').scrollTop = $('scroll').scrollHeight;
}

// Tabler Icons 3.49.0 (MIT License): outline/phone, beside the game's bubbles
const PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2" /></svg>';

function message(kind) {
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    if (kind === 'game') {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<span class="avatar">${PHONE_ICON}</span>`;
        row.appendChild(div);
        $('lines').appendChild(row);
        keyBubble = null;
    } else {
        $('lines').appendChild(div);
    }
    scroll();
    return div;
}

function empty() {
    $('lines').innerHTML = `<div class="empty">${PHONE_ICON}<div>Klick auf den grünen Hörer: Dann startet dein Spiel im Terminal, und du hörst es hier.</div></div>`;
}

function note(text) {
    const div = document.createElement('div');
    div.className = 'note';
    div.textContent = text;
    $('lines').appendChild(div);
    keyBubble = null;
    scroll();
    return div;
}

function warn(key, text, terminal) {
    if (warned[key]) return;
    warned[key] = true;
    const div = document.createElement('div');
    div.className = 'warn';
    div.textContent = text;
    $('warnings').appendChild(div);
    if (terminal) post('/problem', terminal);
}

async function fetchAudio(url) {
    const response = await fetch(at(url));
    if (!response.ok) throw new Error(await response.text());
    return audio().decodeAudioData(await response.arrayBuffer());
}

function play(buffer) {
    return new Promise(resolve => {
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.onended = () => { if (voice === source) voice = null; resolve(); };
        voice = source;
        source.start();
    });
}

// without the speech service (outside the Workspace): the browser's own voice
function speakInBrowser(text) {
    return new Promise(resolve => {
        if (!window.speechSynthesis) { setTimeout(resolve, 60 * text.length); return; }
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE';
        u.onend = u.onerror = () => resolve();
        speechSynthesis.speak(u);
    });
}

// When each word is spoken. Piper tells no word timings, so they come from
// the sound: where the speech starts and ends, its pauses (put at the
// commas when there are as many of both), the words in between by length.
function wordTimes(buffer, words) {
    const data = buffer.getChannelData(0), hop = Math.round(buffer.sampleRate / 100), env = [];
    for (let i = 0; i < data.length; i += hop) {
        const end = Math.min(i + hop, data.length);
        let sum = 0;
        for (let j = i; j < end; j++) sum += data[j] * data[j];
        env.push(Math.sqrt(sum / (end - i)));
    }
    const peak = env.reduce((a, b) => Math.max(a, b), 0) || 1;
    const loud = env.map(e => e > peak * 0.06);
    let first = loud.indexOf(true), last = loud.lastIndexOf(true);
    if (first < 0) { first = 0; last = env.length - 1; }
    const pauses = [];
    for (let i = first, run = 0; i <= last; i++) {
        if (!loud[i]) run++;
        else { if (run >= 12) pauses.push([i - run, i]); run = 0; }
    }
    const breaks = [];
    words.forEach((w, i) => { if (i < words.length - 1 && /[,;:–—]$/.test(w)) breaks.push(i + 1); });
    const segments = [];                     // [from, to (in 10 ms), first word, end word]
    if (pauses.length && pauses.length === breaks.length) {
        let from = first, word = 0;
        pauses.forEach(([a, b], k) => { segments.push([from, a, word, breaks[k]]); from = b; word = breaks[k]; });
        segments.push([from, last + 1, word, words.length]);
    } else {
        segments.push([first, last + 1, 0, words.length]);
    }
    const times = [];
    for (const [from, to, w0, w1] of segments) {
        // a digit is spoken as a word (»drei«)
        const weights = words.slice(w0, w1).map(w => w.replace(/[^\p{L}]/gu, '').length + 4 * w.replace(/\D/g, '').length + 1.5);
        const total = weights.reduce((a, b) => a + b, 0);
        let sum = 0;
        for (const weight of weights) { times.push((from + (to - from) * sum / total) / 100); sum += weight; }
    }
    return times;
}

// the words of a sentence into the bubble as they are spoken; now() is the time since the sentence started. Returns a
// function that shows the rest at once.
function typeSentence(bubble, words, times, now, stopped = () => false) {
    const cursor = bubble.querySelector('.cursor');
    let next = 0, all = false;
    const step = () => {
        if (stopped() || !cursor.isConnected) return;    // a key stopped the sentence, or the call ended
        const t = now();
        while (next < words.length && (all || times[next] <= t)) {
            if (bubble.querySelector('.w')) bubble.insertBefore(document.createTextNode(' '), cursor);
            const span = document.createElement('span');
            span.className = 'w';
            span.textContent = words[next];
            bubble.insertBefore(span, cursor);
            next++;
            scroll();
        }
        if (next < words.length && !all) requestAnimationFrame(step);
    };
    step();
    return () => { all = true; step(); };
}

// the moods as stage directions above the bubble (say … mood:)
const MOODS = { neutral: 'neutral', amused: 'amüsiert', angry: 'wütend', disgusted: 'angewidert',
    drunk: 'betrunken', sleepy: 'müde', surprised: 'überrascht', whisper: 'flüsternd' };

async function say(parts, id, interrupt, mood) {
    const mine = call;
    let skipped = false;
    if (interrupt) skip = () => {
        skipped = true;
        skip = null;
        if (voice) { try { voice.stop(); } catch (e) {} }
        if (window.speechSynthesis) speechSynthesis.cancel();
    };
    // the bubble shows the cursor alone until the first word is spoken
    const bubble = message('game');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bubble.appendChild(cursor);
    if (mood && MOODS[mood]) {
        const label = document.createElement('span');
        label.className = 'mood';
        label.textContent = MOODS[mood];
        bubble.prepend(label);              // inside, above the words
    }
    const buffers = parts.map(p => fetchAudio('/speech?text=' + encodeURIComponent(p) + (mood ? '&mood=' + mood : '')));
    buffers.forEach(b => b.catch(() => {}));
    let ducked = false;
    for (let i = 0; i < parts.length; i++) {
        // phonemes in [[ … ]] are shown without the brackets
        const shown = parts[i].replace(/\[\[\s*(.*?)\s*\]\]/g, '$1');
        const words = shown.split(' ');
        let finish = null;
        const start = (times, now) => {
            // the music gives way when the voice starts, not while it is made
            if (!ducked) { duck(true); $('screen').classList.add('speaking'); ducked = true; }
            $('spoken').textContent = shown;
            post(`/playing?id=${id}&part=${i}`);       // the terminal shows the sentence now
            finish = typeSentence(bubble, words, times, now, () => skipped);
        };
        try {
            const buffer = await buffers[i];
            if (mine !== call) return;
            if (!skipped) {
                const t0 = ctx.currentTime;
                start(wordTimes(buffer, words), () => ctx.currentTime - t0);
                await play(buffer);
            }
        } catch (error) {
            if (mine !== call) return;
            warn('speech', 'Die Stimme des Telefons ist gerade nicht erreichbar; der Browser liest vor. Auf dem echten Telefon klingt es anders.',
                 'Die Stimme ist nicht erreichbar, der Browser liest vor: ' + error.message);
            let chars = 0;
            const times = words.map(w => { const t = chars * 0.065; chars += w.length + 1; return t; });
            const t0 = performance.now();
            if (!skipped) {
                if (!finish) start(times, () => (performance.now() - t0) / 1000);
                await speakInBrowser(shown);
            }
        }
        if (mine !== call) return;
        if (skipped) {
            // the rest is not heard, so it is not written either
            cursor.insertAdjacentText('beforebegin', ' …');
            break;
        }
        if (finish) finish();
    }
    if (interrupt && !skipped) skip = null;
    cursor.remove();
    $('screen').classList.remove('speaking');
    if (ducked) duck(false);
    post('/heard?id=' + id);
}

// as loud as on the phone: the music's peaks (99.5 % of the samples below)
// at 0.7, as the runner and the speech service do (sounds.py, server.py)
function evenOut(buffer) {
    const data = buffer.getChannelData(0), bins = new Uint32Array(1000);
    for (let i = 0; i < data.length; i += 4) bins[Math.min(999, Math.floor(Math.abs(data[i]) * 1000))]++;
    let count = 0, total = Math.ceil(data.length / 4);
    for (let b = 0; b < 1000; b++) {
        count += bins[b];
        if (count >= total * 0.995) return b ? Math.min(8, 0.7 / ((b + 1) / 1000)) : 1;
    }
    return 1;
}

function stopMusic() {
    musicRequest++;
    if (musicSource) { try { musicSource.stop(); } catch (e) {} musicSource = null; }
}

// audio first: the page says nothing about the music; a problem goes only
// to the terminal
// loop: [start, stop] in seconds for a file of the game (stop null: its
// end); a YouTube piece comes cut by the speech service
async function music(url, volume, id, loop) {
    stopMusic();
    if (!url) return;
    const mine = ++musicRequest;
    try {
        const buffer = await fetchAudio(url);
        if (mine !== musicRequest || !inCall) return;
        musicSource = ctx.createBufferSource();
        musicSource.buffer = buffer;
        musicSource.loop = true;
        musicGain.gain.value = volume * evenOut(buffer);
        musicSource.connect(musicGain);
        if (loop) {
            const from = Math.min(loop[0] || 0, buffer.duration);
            const to = loop[1] == null ? buffer.duration : Math.min(loop[1], buffer.duration);
            if (to > from) { musicSource.loopStart = from; musicSource.loopEnd = to; }
            musicSource.start(0, from);
        } else {
            musicSource.start();
        }
    } catch (error) {
        const source = decodeURIComponent(url.split('source=')[1] || '');
        post('/problem', 'Die Musik ließ sich nicht laden (' + source + '): ' + error.message);
    } finally {
        if (id) post('/heard?id=' + id);           // the game goes on
    }
}

// the key's two tones (DTMF), as loud and as long as on a phone: 150 ms
// with soft edges, not ducked
function tone(key) {
    if (!ctx) return;
    const gain = ctx.createGain(), now = ctx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.22, now + 0.005);
    gain.gain.setValueAtTime(0.22, now + 0.145);
    gain.gain.linearRampToValueAtTime(0, now + 0.15);
    gain.connect(ctx.destination);
    for (const f of TONES[key]) {
        const o = ctx.createOscillator();
        o.frequency.value = f;
        o.connect(gain);
        o.start(now);
        o.stop(now + 0.16);
    }
}

// the end of a call: the busy tone of German phones, 425 Hz, three times
// 240 ms with pauses as long
function hangupTone() {
    if (!ctx) return;
    const now = ctx.currentTime, gain = ctx.createGain(), o = ctx.createOscillator();
    gain.gain.setValueAtTime(0, now);
    for (let i = 0; i < 3; i++) {
        const t = now + 0.1 + i * 0.48;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.01);
        gain.gain.setValueAtTime(0.18, t + 0.23);
        gain.gain.linearRampToValueAtTime(0, t + 0.24);
    }
    o.frequency.value = 425;
    o.connect(gain);
    gain.connect(ctx.destination);
    o.start(now);
    o.stop(now + 1.6);
}

function press(key) {
    const button = document.querySelector(`.keypad button[data-key="${key}"]`);
    button.classList.add('down');
    setTimeout(() => button.classList.remove('down'), 120);
    if (!inCall) {
        // the line: up to four digits, then the call button dials them
        if (!LINE || $('call').disabled || dialed.length >= 4 || !/\d/.test(key)) return;
        audio();
        tone(key);
        if (!dialed) { $('title').textContent = ''; $('status').textContent = 'Bereit'; }
        dialed += key;
        showDialed();
        return;
    }
    tone(key);
    if (skip) skip();
    if (!keyBubble) keyBubble = message('you');
    const cap = document.createElement('span');
    cap.className = 'cap';
    cap.textContent = key;
    cap.setAttribute('aria-label', 'Taste ' + key);
    keyBubble.appendChild(cap);
    scroll();
    // the latest digits only, as a phone shows them
    $('digits').textContent = ($('digits').textContent + key).slice(-12);
    post('/key?key=' + encodeURIComponent(key));
}

function showDialed() {
    $('digits').textContent = dialed;
    $('erase').hidden = !dialed;
    $('call').classList.toggle('ready', !!dialed && !inCall && !$('call').disabled);
}

function erase() {
    dialed = dialed.slice(0, -1);
    showDialed();
}

// the keypad works during a call, and on the line also before one (to dial)
function enableKeys() {
    const on = inCall || (LINE && !$('call').disabled);
    document.querySelectorAll('.keypad button').forEach(b => b.disabled = !on);
}

function waiting(count, timeout) {
    keyBubble = null;
    $('digits').textContent = '';
    // the Workspace's phone says what the game waits for; the line just shows the bar
    if (!LINE) $('status').textContent = count === 1 ? 'Das Spiel wartet auf eine Taste' : `Das Spiel wartet auf bis zu ${count} Tasten`;
    const bar = $('wait-bar');
    $('wait').classList.add('on');
    bar.style.transition = 'none';
    bar.style.transform = 'scaleX(1)';
    bar.offsetWidth;
    bar.style.transition = `transform ${timeout / 1000}s linear`;
    bar.style.transform = 'scaleX(0)';
}

function waited() {
    $('wait').classList.remove('on');
    $('status').textContent = talking();
}

function talking() {
    const s = Math.floor((Date.now() - started) / 1000);
    return `Verbunden ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// during a call the screen stays on: a phone that turns it off suspends the
// page, its connection to the line closes, and the line hangs up (Screen
// Wake Lock; where the browser has none, the screen goes dark as before)
let wakeLock = null;
async function keepAwake(on) {
    try {
        if (on && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible') {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        } else if (!on && wakeLock) {
            await wakeLock.release();
            wakeLock = null;
        }
    } catch (e) {
        wakeLock = null;
    }
}
document.addEventListener('visibilitychange', () => { if (inCall) keepAwake(true); });

function setCall(on) {
    const wasInCall = inCall;
    inCall = on;
    call++;
    const button = $('call');
    button.classList.toggle('hang', on);
    button.classList.toggle('ready', !on && !button.disabled && (!LINE || !!TRY));
    $('screen').classList.toggle('on', on);
    $('log').classList.toggle('on', on);
    $('screen').classList.remove('speaking');
    button.setAttribute('aria-label', on ? 'Auflegen' : 'Anrufen');
    enableKeys();
    keepAwake(on);
    clearInterval(clock);
    $('wait').classList.remove('on');
    $('digits').textContent = '';
    if (on) {
        started = Date.now();
        $('status').textContent = talking();
        // the clock runs on, except where the display says what the game waits for
        clock = setInterval(() => { if (LINE || !$('wait').classList.contains('on')) $('status').textContent = talking(); }, 1000);
    } else {
        skip = null;
        stopMusic();
        if (voice) { try { voice.stop(); } catch (e) {} voice = null; }
        if (wasInCall) hangupTone();
        document.querySelectorAll('#lines .cursor').forEach(c => c.remove());
        if (window.speechSynthesis) speechSynthesis.cancel();
        if (duckGain) { duckGain.gain.cancelScheduledValues(0); duckGain.gain.value = 1; }
    }
}

function toggleCall() {
    if ($('call').disabled) return;
    if (inCall) {
        post('/hangup');
        return;
    }
    if (LINE && !dialed && !TRY) return;       // the line calls a number, as a real phone does
    audio();
    $('lines').textContent = '';
    const number = dialed;
    dialed = '';
    $('erase').hidden = true;
    if (LINE) $('title').textContent = number;
    setCall(true);
    post('/call' + (TRY ? '?try=' + encodeURIComponent(TRY) : number ? '?number=' + number : ''));
}

// the letters of a telephone keypad (ITU E.161) under the digits
const LETTERS = { '2': 'ABC', '3': 'DEF', '4': 'GHI', '5': 'JKL', '6': 'MNO', '7': 'PQRS', '8': 'TUV', '9': 'WXYZ', '0': '+' };
empty();
for (const key of KEYS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<b>${key}</b><small>${LETTERS[key] || ''}</small>`;
    b.setAttribute('aria-label', key);
    b.dataset.key = key;
    b.disabled = true;
    b.addEventListener('click', () => press(key));
    $('keypad').appendChild(b);
}
$('call').addEventListener('click', e => {
    toggleCall();
    if (e.detail) e.currentTarget.blur();      // a mouse click: no focus ring while typing digits
});
$('erase').addEventListener('click', erase);
document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (KEYS.includes(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace' && !inCall && dialed) { erase(); e.preventDefault(); }
    else if (e.key === 'Enter' && !inCall) { toggleCall(); e.preventDefault(); }
    else if (e.key === 'Escape' && inCall) { toggleCall(); e.preventDefault(); }
});

const ENDED = { caller: 'Aufgelegt.', hangup: 'Das Spiel hat aufgelegt.', ended: 'Das Spiel ist zu Ende.', time: 'Die Zeit ist um.',
    busy: 'Alle Leitungen sind belegt. Versuch es gleich noch einmal.', one: 'Von hier läuft schon ein Anruf.' };
// the line's display speaks of the other end, not of a game
if (LINE) Object.assign(ENDED, { hangup: 'Die Gegenseite hat aufgelegt.', ended: 'Der Anruf ist beendet.' });
const events = new EventSource(at('/events'));
events.onmessage = message => {
    const e = JSON.parse(message.data);
    if (e.ready) {
        $('title').textContent = LINE ? e.title || '' : e.title || 'Telefonspiel';
        if (inCall) { setCall(false); note('Die Verbindung zum Terminal war weg; der Anruf ist beendet.'); }
        $('status').textContent = 'Bereit';
        $('call').disabled = false;
        $('call').classList.toggle('ready', !inCall && (!LINE || !!TRY));
        enableKeys();
    } else if (e.replaced) {
        events.close();
        setCall(false);
        $('call').disabled = true;
        $('call').classList.remove('ready');
        $('status').textContent = 'Das Telefon ist jetzt in einem anderen Tab offen.';
        enableKeys();
    } else if (e.title) {
        $('title').textContent = e.title;
    } else if (e.say) {
        say(e.say, e.id, e.interrupt, e.mood);
    } else if ('music' in e) {
        music(e.music, e.volume, e.id, e.loop);
    } else if (e.keys) {
        waiting(e.keys, e.timeout);
    } else if ('keysDone' in e) {
        waited();
    } else if (e.ended) {
        setCall(false);
        note(ENDED[e.ended] || 'Der Anruf ist beendet.');
        // without the chat (the line) the display says why it ended
        $('status').textContent = LINE && ENDED[e.ended] && e.ended !== 'caller' ? ENDED[e.ended] : 'Bereit';
    }
};
events.onerror = () => {
    if (events.readyState === EventSource.CLOSED) return;
    $('call').disabled = true;
    $('call').classList.remove('ready');
    $('status').textContent = LINE ? 'Keine Verbindung. Versuch es gleich noch einmal.' : 'Keine Verbindung zum Terminal: Läuft telefon noch?';
    enableKeys();
};
</script>
</body>
</html>
