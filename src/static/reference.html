<div class='container'>
    <h1 class='mt-4'>Handbuch</h1>
    <p>Befehle, Formate und Handgriffe zum Nachsehen. Aktivitäten verweisen auf diese Abschnitte; hier stehen sie alle auf einen Blick.</p>
    #{print_content_overview(:reference)}
</div>
<script>
// Filters the Handbuch index: a card stays when its title or label contains
// every word typed (then with all its links), or when some of its links do
// (then only those).
(function () {
    var input = document.getElementById('reference-filter');
    if (!input) return;
    var norm = function (s) { return (s || '').toLowerCase().replace(/\u00ad/g, ''); };
    var cards = Array.prototype.slice.call(document.querySelectorAll('.reference-card'));
    var empty = document.querySelector('.reference-filter-empty');
    input.addEventListener('input', function () {
        var words = norm(input.value).split(/\s+/).filter(Boolean);
        var matches = function (text) { return words.every(function (w) { return text.indexOf(w) >= 0; }); };
        var any = false;
        cards.forEach(function (card) {
            var head = norm(card.querySelector('h2').textContent + ' ' + card.querySelector('.reference-card-label').textContent);
            var cardHit = words.length === 0 || matches(head);
            var itemHit = false;
            card.querySelectorAll('.reference-outline li').forEach(function (li) {
                var hit = cardHit || matches(norm(li.textContent));
                li.hidden = !hit;
                if (hit) itemHit = true;
            });
            card.hidden = !(cardHit || itemHit);
            if (!card.hidden) any = true;
        });
        if (empty) empty.hidden = any;
    });
})();
</script>
