<style>
    /* Bitstream Charter in Michael Sharpe's extension XCharter (free, see
       fonts/XCharter/LICENSE.txt), for the printed pages */
    /* The Telefonbuch (phone_games_api.rb, phone_book.js): the published
       Telefonspiele as the pages of a book, sorted by title; a click on a
       page turns it. Beside it the phone that plays the menu. */
    .phone-book-page {
        --pb-paper: #f8f2de;
        --pb-paper-edge: #e6dabb;
        --pb-under: #cbb98c;           /* the next sheet, in the shade of the fold */
        --pb-ink: #1d1a14;
        --pb-quiet: #5d5442;
        --pb-rule: #b9ab88;
        --pb-dim: none;
        --pb-cover: #c8a32c;
        --pb-shadow: 0 1px 2px rgba(40, 30, 10, .15), 0 18px 40px -16px rgba(40, 30, 10, .45);
    }
    [data-bs-theme='dark'] .phone-book-page {
        --pb-cover: #8c7420;
        /* the paper stays paper; at night it is just in less light */
        --pb-dim: brightness(.78) contrast(1.05);
        --pb-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -16px rgba(0, 0, 0, .8);
    }
    .phone-book-layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 2rem;
        align-items: start;
        margin-top: 1.5rem;
    }
    @media (max-width: 900px) {
        .phone-book-layout { grid-template-columns: minmax(0, 1fr); }
    }
    /* the phone: the line itself (src/phone/line), in a frame */
    .phone-book-line { display: block; width: 340px; height: 740px; max-width: 100%; border: 0; margin: -12px auto 0; background: transparent; }
    /* the book: two pages and a spine, one page on a phone */
    .phone-book {
        position: relative;
        perspective: 2200px;
        user-select: none;
    }
    .phone-book-spread {
        display: grid;
        grid-template-columns: 1fr 1fr;
        /* under the pages the next sheet of paper (seen where a dog-ear is
           folded), around them the cover */
        background: linear-gradient(var(--pb-under), var(--pb-under)) content-box, var(--pb-cover);
        padding: 10px;
        border-radius: 10px;
        box-shadow: var(--pb-shadow);
    }
    .phone-book-spread { filter: var(--pb-dim); }
    /* thin paper with grain and a few stains; the ink multiplied onto it */
    .phone-book-leaf {
        background:
            linear-gradient(90deg, rgba(120, 95, 40, .16), transparent 7%, transparent 93%, rgba(120, 95, 40, .16)),
            url('/include/phone-book-paper.webp') var(--pb-paper);
        background-size: auto, 384px 384px;
        color: var(--pb-ink);
        font-family: 'XCharter', 'Charter', 'Bitstream Charter', Georgia, serif;
        aspect-ratio: 1 / 1.414;              /* a page of A paper, at every width */
        padding: 1.6rem;
        position: relative;
        cursor: pointer;
        display: flex;
        flex-direction: column;
    }
    /* the entries of a page, and the remark at its foot (phone_book.js fills
       a page until this box overflows) */
    .pb-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .phone-book-leaf.left { border-radius: 6px 0 0 6px; box-shadow: inset -12px 0 16px -12px rgba(0, 0, 0, .35); }
    .phone-book-leaf.right { border-radius: 0 6px 6px 0; box-shadow: inset 12px 0 16px -12px rgba(0, 0, 0, .35); background-position: 0 0, 190px 140px; }
    .phone-book-leaf > * { mix-blend-mode: multiply; }
    .phone-book-leaf.empty { cursor: default; }
    .phone-book-head {
        display: flex;
        justify-content: space-between;
        border-bottom: 2px solid var(--pb-ink);
        padding-bottom: .3rem;
        margin-bottom: .8rem;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
        font-size: .8rem;
    }
    .phone-book-entry { padding: .45rem 0; border-bottom: 1px dotted var(--pb-rule); }
    .phone-book-entry .pb-line { display: flex; align-items: baseline; gap: .4rem; }
    .phone-book-entry .pb-title { font-weight: 700; font-size: 1.05rem; line-height: 1.3; text-align: left; }
    /* the leader sits on the baseline, as in a printed list */
    .phone-book-entry .pb-dots { flex: 1; align-self: baseline; height: 0; border-bottom: 2px dotted var(--pb-quiet); opacity: .6; }
    .phone-book-entry .pb-number { font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums lining-nums; letter-spacing: .04em; }
    /* a vanity number: the word, its digits small beside it (DINO 3466) */
    .phone-book-entry .pb-number small { font-weight: 400; font-size: .8em; color: var(--pb-quiet); margin-right: .2rem; }
    .phone-book-entry .pb-description { color: var(--pb-quiet); font-style: italic; font-size: .84rem; margin-top: .05rem; text-align: left; }
    /* the colophon: the notes on a page of their own, at its foot */
    .pb-remark { margin-top: auto; padding-top: .8rem; border-top: 1px solid var(--pb-ink); font-size: .92rem; font-style: italic; opacity: .62; }
    .pb-remark-head { font-variant: small-caps; letter-spacing: .06em; font-style: normal; margin-bottom: .4rem; }
    .phone-book-page .phone-book-leaf p { color: var(--pb-ink); }
    .pb-remark p { margin: 0 0 .4rem; text-align: left; hyphens: none; }
    .phone-book-page .pb-remark a { color: var(--pb-ink); text-decoration: underline; text-underline-offset: 2px; }
    .phone-book-page .phone-book-none { color: var(--pb-quiet); margin-top: 2rem; text-align: center; }
    /* the page that turns: narrow strips around the spine (phone_book.js),
       each with a face for the front and one for the back; a face shows its
       slice of a whole page, which is as many times as wide as the strip */
    .phone-book-turning {
        position: absolute;
        top: 10px;
        bottom: 10px;
        width: calc(50% - 10px);
        transform-style: preserve-3d;
        z-index: 2;
    }
    .phone-book-turning.forward { left: 50%; transform-origin: left center; }
    .phone-book-turning.backward { left: 10px; transform-origin: right center; }
    .pb-strip { position: absolute; top: 0; bottom: 0; transform-style: preserve-3d; }
    .phone-book-turning.forward .pb-strip { transform-origin: left center; }
    .phone-book-turning.backward .pb-strip { transform-origin: right center; }
    /* a hair wider than its strip, so the strips meet without a seam */
    .pb-face { position: absolute; inset: 0 -0.6px; overflow: hidden; backface-visibility: hidden; }
    .pb-face.back { transform: rotateY(180deg); }
    .pb-slice { position: absolute; top: 0; height: 100%; margin-left: 0.6px; }
    .pb-slice > .phone-book-leaf { height: 100%; aspect-ratio: auto; }
    .pb-shade {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        /* soft: darkest at the spine, fading out over the page */
        background: linear-gradient(90deg, rgba(40, 30, 10, .35), rgba(40, 30, 10, .12) 45%, rgba(40, 30, 10, 0) 85%);
    }
    /* a dog-ear: the corner of a page that turns, folded in. The page itself
       is cut along the fold (--ear-r, --ear-l: the size of the fold at the
       right and at the left corner), so what lies beneath shows through, also
       on a page that turns; the flap shows the back of the paper. It lifts now
       and then until a page has been turned, and when the page is pointed at. */
    @property --ear-r { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --ear-l { syntax: '<length>'; inherits: true; initial-value: 0px; }
    .phone-book-leaf.ear-r { --ear-r: 26px; }
    .phone-book-leaf.ear-l { --ear-l: 26px; }
    .phone-book-leaf.ear-r, .phone-book-leaf.ear-l {
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--ear-r)), calc(100% - var(--ear-r)) 100%,
                           var(--ear-l) 100%, 0 calc(100% - var(--ear-l)));
        transition: --ear-r .2s, --ear-l .2s;
    }
    .phone-book-leaf.ear-r { animation: pb-ear-lift-r 6s ease-in-out 2s infinite; }
    .phone-book-leaf.ear-l { animation: pb-ear-lift-l 6s ease-in-out 2s infinite; }
    .phone-book-leaf.ear-r.ear-l { animation: pb-ear-lift-r 6s ease-in-out 2s infinite, pb-ear-lift-l 6s ease-in-out 2s infinite; }
    .phone-book-leaf > .pb-ear {
        position: absolute;
        bottom: 0;
        mix-blend-mode: normal;
        pointer-events: none;
        filter: drop-shadow(-1px -1px 1.5px rgba(40, 30, 10, .35));
        background: linear-gradient(135deg, #fbf6e6 0%, var(--pb-paper-edge) 70%, #cbbd94 100%);
        clip-path: polygon(0 0, 100% 0, 0 100%);
    }
    .pb-ear.next { right: 0; width: var(--ear-r); height: var(--ear-r); }
    .pb-ear.prev { left: 0; width: var(--ear-l); height: var(--ear-l); transform: scaleX(-1); }
    /* pointed at: no lifting, the corner a little bigger */
    .phone-book-leaf.ear-r:hover, .phone-book-leaf.ear-l:hover { animation: none; }
    .phone-book-leaf.right.ear-r:hover { --ear-r: 34px; }
    .phone-book-leaf.left.ear-l:hover, .phone-book-leaf.right.ear-l:hover { --ear-l: 34px; }
    .phone-book.turned .phone-book-leaf { animation: none; }
    /* on the page that is turning, the ears hold still */
    .phone-book-turning .phone-book-leaf { animation: none; transition: none; }
    @keyframes pb-ear-lift-r {
        0%, 82%, 100% { --ear-r: 26px; }
        88% { --ear-r: 38px; }
        94% { --ear-r: 29px; }
    }
    @keyframes pb-ear-lift-l {
        0%, 82%, 100% { --ear-l: 26px; }
        88% { --ear-l: 38px; }
        94% { --ear-l: 29px; }
    }
    @media (max-width: 640px) {
        .phone-book-spread { grid-template-columns: 1fr; }
        .phone-book-leaf.left { display: none; }
        .phone-book-leaf.right { border-radius: 6px; }
        .phone-book-turning { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
        .phone-book-leaf.ear-r, .phone-book-leaf.ear-l { animation: none; }
    }
</style>
<div class='container phone-book-page'>
    <h1 class='visually-hidden'>Telefonbuch</h1>
    #{phone_book_page}
    <div class='phone-book-layout'>
        <div class='phone-book-phone'>
            <iframe class='phone-book-line' src='/telefonbuch/telefon/?line' title='Telefon' allow='autoplay; screen-wake-lock'></iframe>
        </div>
        <div class='phone-book-pages'>
            <div class='phone-book' id='phone-book'></div>
        </div>
    </div>
</div>
<script src='/include/phone_book.js?#{CACHE_BUSTER}#{DEVELOPMENT ? Time.now.to_i : nil}'></script>
