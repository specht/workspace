<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="umd.js"></script>
    <title>TIC-80 tiny computer</title>

    <style type="text/css">
        @font-face {
            font-family: '04b03Regular';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url(04B_03__.TTF) format('truetype');
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, .4);
            font-family: '04b03Regular';
        }

        .modal-content {
            font-size: min(5vw, 30px);
            background-color: rgba(0, 0, 0, .6);
            border-radius: 1em;
            box-shadow: 0 0 .2em #fff;
            backdrop-filter: blur(1em);
            position: relative;
            color: #fefefe;
            margin: auto;
            padding: .5em 1em;
            width: min(20em, 90vw);
        }

        .close {
            color: #ddd;
            float: right;
            font-size: 28px;
            font-weight: 700;
        }

        .close:focus, .close:hover {
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        #game-frame > div {
            font-size: 44px;
            font-family: monospace;
            font-weight: bold;
        }

        .game {
            width: 100vw;
            height: 100vh;
        }

        #upload-input {
            display: none;
        }

        .upload-label {
            cursor: pointer;
            opacity: .6;
        }

        .upload-label:hover {
            opacity: 1;
        }
    </style>
</head>
<body style="margin: 0; padding: 0;">
    <div class="game" style="margin: 0; position: relative; background: #1a1c2c;">
        <div id="game-frame" style="cursor: pointer; position: absolute; margin: 0 auto; opacity: 1; background: #1a1c2c; width: 100%; height: 100%;">
            <div style="text-align: center; color: white; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
                <p style="margin: 0; font-family: '04b03Regular';">- CLICK TO PLAY -</p>
            </div>
        </div>

        <canvas style="width: 100%; height: 100%; margin: 0 auto; display: block; image-rendering: pixelated;"
                id="canvas"
                oncontextmenu="event.preventDefault()"
                onmousedown="window.focus()"></canvas>
    </div>

    <div id="add-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p style="text-align: center;">Please choose a file to upload.</p>
            <p style="text-align: center;">
                <label class="upload-label" for="upload-input">Choose file...</label>
                <input type="file" id="upload-input">
            </p>
        </div>
    </div>

    <script type="text/javascript">
        var Module = {
            canvas: document.getElementById('canvas'),
        };

        const gameFrame = document.getElementById('game-frame');

        gameFrame.addEventListener('click', function() {
            const scriptTag = document.createElement('script');
            scriptTag.src = `tic80.js?v=${Date.now()}`;
            document.head.appendChild(scriptTag);

            this.remove();

            window.addEventListener('keydown', function(e) {
                if (e.ctrlKey && (e.code === 'KeyS' || e.code === 'KeyR' || e.code === 'KeyK')) {
                    e.preventDefault();
                }
            });
        }, {once: true});
    </script>
</body>
</html>
