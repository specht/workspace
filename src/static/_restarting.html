<!DOCTYPE html>
<!-- What nginx shows instead of its own 502 or 504 while the Ruby service does not
     answer, mostly during a restart (nginx_config.rb, location @ruby). Ruby
     cannot render anything then, so the page stands alone. It asks
     /api/ping every two seconds and loads the page again once Ruby answers;
     after ten minutes it stops asking. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Der Workspace startet neu</title>
<noscript><meta http-equiv="refresh" content="10"></noscript>
<link rel="stylesheet" href="/include/fonts.css">
<style>
    :root {
        color-scheme: light dark;
        --ink: #212529;
        --muted: #6c757d;
        --ground: #fff;
        --accent: #c9b458;
    }
    @media (prefers-color-scheme: dark) {
        :root { --ink: #dee2e6; --muted: #9aa0a6; --ground: #212529; }
    }
    body {
        margin: 0;
        padding: 0 1rem;
        background: var(--ground);
        color: var(--ink);
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        line-height: 1.5;
    }
    main {
        max-width: 32em;
        margin: 6em auto;
        text-align: center;
    }
    h1 { font-size: 1.6rem; margin: 1em 0 0.6em; }
    p { margin: 0.6em 0; }
    .restart-small { color: var(--muted); font-size: 0.9rem; }
    .restart-dots { display: inline-flex; gap: 0.5em; }
    .restart-dots span {
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        background: var(--accent);
        animation: restart-dot 1.2s infinite ease-in-out;
    }
    .restart-dots span:nth-child(2) { animation-delay: 0.2s; }
    .restart-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes restart-dot {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
        40% { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
        .restart-dots span { animation: none; opacity: 0.7; }
    }
</style>
</head>
<body>
<main>
    <div class="restart-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1>Der Workspace startet gerade neu</h1>
    <p id="restart-say">Das dauert meist nur ein paar Sekunden. Sobald er wieder antwortet, lädt diese Seite neu.</p>
    <p class="restart-small">Dein Workspace mit VS Code und deine Dateien sind davon nicht betroffen.</p>
</main>
<script>
(function () {
    var started = Date.now();
    function ask() {
        if (Date.now() - started > 10 * 60 * 1000) {
            document.getElementById('restart-say').textContent = 'Das dauert länger als sonst. Lade die Seite in ein paar Minuten neu.';
            return;
        }
        fetch('/api/ping', { cache: 'no-store' }).then(function (r) {
            if (r.ok) location.reload(); else setTimeout(ask, 2000);
        }, function () { setTimeout(ask, 2000); });
    }
    setTimeout(ask, 2000);
})();
</script>
</body>
</html>
