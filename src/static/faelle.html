#{ assert(admin_logged_in?) }
<style>
    /* Cases for the development (cases_page.rb): a card each */
    .cases-page { max-width: 60rem; }
    .cases-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
    .case-card { border: 1px solid var(--bs-border-color); border-radius: 0.5rem; padding: 0.9rem 1.1rem; }
    .case-card h2 { font-size: 1.15rem; margin: 0 0 0.3rem; }
    .case-card h2 small { font-size: 0.8em; margin-left: 0.4em; }
    .case-meta, .case-contents { color: var(--bs-secondary-color); margin: 0.2rem 0; }
    .case-note { margin: 0.4rem 0; white-space: pre-wrap; }
    .case-actions { margin: 0.5rem 0 0; display: flex; gap: 0.5rem; }
    .case-actions .bi { margin-right: 0.3em; }
</style>
<div class='container cases-page'>
    <h1 class='mt-4'>Fälle für die Entwicklung</h1>
    #{cases_page_html}
</div>
<script>
    // Delete a case after asking (cases_page.rb, /api/faelle/delete)
    document.addEventListener('click', function (e) {
        const button = e.target.closest('.case-delete');
        if (!button) return;
        const card = button.closest('.case-card');
        if (!window.confirm('Diesen Fall löschen? Das lässt sich nicht rückgängig machen.')) return;
        api_call('/api/faelle/delete', { id: card.dataset.id }, function (data) {
            if (data.success !== false) card.remove();
        });
    });
</script>
