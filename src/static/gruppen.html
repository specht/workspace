<div class='api_messages page-messages' style='display: none;' role='status' aria-live='polite'></div>
<div class='container'>
    <div class='row'>
        <div class='col-md-12'>
            <h1>Gruppen</h1>
            <p>
                Wer in einer Gruppe steht, kann sich anmelden; ein Konto entsteht, sobald jemand zum ersten Mal einen Anmelde-Code anfordert. Namen sind freiwillig und können
                auch später kommen. Die Gruppen erscheinen auf der <a href='/klasse'>Klassenseite</a>.
            </p>
            <div id='groups_school'></div>
            <div id='groups_new'></div>
            <div class='people-chips mb-2' id='groups_chips_row' role='group' aria-label='Nur diese Gruppen zeigen' style='display: none;'>
                <span class='people-chips-label'>Aufräumen:</span>
                <div id='groups_chips' class='d-flex flex-wrap gap-2'></div>
            </div>
            <div id='groups_chip_action' class='mb-2'></div>
            <input type='search' id='groups_filter' class='form-control mb-2' placeholder='Gruppe, Name oder Adresse suchen' autocomplete='off' aria-label='Gruppen durchsuchen' style='display: none;'>
            <div id='groups_here'><p class='text-body-secondary'>Einen Moment …</p></div>
        </div>
    </div>
</div>

<script src='/include/groups.js?#{CACHE_BUSTER}#{DEVELOPMENT ? Time.now.to_i : nil}'></script>
<script>
    // What used to be »Aufräumen« on /personen for groups: filters with counts.
    const GROUP_CHIPS = [
        { key: 'ended', label: 'Nach ihrem Ende', icon: 'bi-calendar-x', test: g => g.ends_on && g.ends_on < today(),
          note: 'Gruppen, deren Enddatum vorbei ist; ihre Lehrkräfte haben einmal eine Erinnerung bekommen. Zum Ende des Schuljahres: löschen, was nicht weitergeht; wer danach in keiner Gruppe steht, ist nicht mehr eingeladen.' },
        { key: 'never', label: 'Mit nie Angemeldeten', icon: 'bi-envelope-slash', test: g => never_logged_in(g).length > 0,
          note: 'Gruppen mit Eingeladenen, die nie einen Code angefordert haben, etwa aus einer Liste der ganzen Schule. Herausnehmen löscht nichts: ein Konto gibt es nicht.' },
        { key: 'no-teacher', label: 'Ohne Lehrkraft', icon: 'bi-person-slash', test: g => g.teachers.length === 0, note: 'Gruppen, die niemand betreut.' },
    ];
    let group_chip = '';

    function render_group_chips(groups) {
        const here = $('#groups_chips').empty();
        GROUP_CHIPS.forEach(function (chip) {
            const n = groups.filter(chip.test).length;
            if (n === 0 && group_chip !== chip.key) return;
            const on = group_chip === chip.key;
            const button = $(`<button type='button' class='btn btn-sm people-chip'><i class='bi ${chip.icon}' aria-hidden='true'></i>${chip.label} <span class='people-chip-count'>${n}</span></button>`)
                .toggleClass('active', on).attr('aria-pressed', on ? 'true' : 'false');
            button.on('click', function () { group_chip = on ? '' : chip.key; render_group_chips(groups); filter_groups(); });
            here.append(button);
        });
        $('#groups_chips_row').toggle(here.children().length > 0);
        const chip = GROUP_CHIPS.find(c => c.key === group_chip);
        const action = $('#groups_chip_action').empty();
        if (chip) action.append($(`<p class='small text-body-secondary mb-2'>`).text(chip.note));
        if (group_chip === 'never') {
            const chosen = groups.filter(chip.test);
            const people = new Set(chosen.flatMap(g => never_logged_in(g).map(m => m.email))).size;
            const all = $(`<button type='button' class='btn btn-sm btn-outline-danger'><i class='bi bi-person-dash'></i>Aus allen ${chosen.length} Gruppen die nie Angemeldeten entfernen (${people})</button>`);
            all.on('click', () => remove_never_logged_in(chosen.map(g => g.name)));
            action.append(all);
        }
    }

    function filter_groups() {
        const q = $('#groups_filter').val().trim().toLowerCase();
        const chip = GROUP_CHIPS.find(c => c.key === group_chip);
        $('#groups_here .group-card').each(function () {
            const card = $(this);
            const group = card.data('info');
            const by_name = group.name.toLowerCase().includes(q);
            const by_member = q.length > 1 && group.members.some(m => m.email.includes(q) || (m.name || '').toLowerCase().includes(q));
            card.toggle((!q || by_name || by_member) && (!chip || chip.test(group)));
            if (q && by_member && !by_name) card.prop('open', true);
        });
        $('#groups_here .school-heading').each(function () {
            $(this).toggle($(this).nextUntil('.school-heading', '.group-card:visible').length > 0);
        });
    }

    function load_groups() {
        api_call('/api/groups/list', {}, function (data) {
            if (!data.success) return;
            const here = $('#groups_here').empty();
            const school = $('#groups_school').empty();
            const fresh = $('#groups_new').empty();
            if (!data.imported) {
                here.append(`<div class='alert alert-info'>Die Einladungen stehen noch in Dateien auf dem Server und werden von der Administration gepflegt. Sobald sie importiert sind, verwaltest du deine Gruppen hier.</div>`);
                return;
            }
            if (data.school) {
                const key = encodeURIComponent(data.school.key);
                school.append(data.school.approved
                    ? `<p>Deine Schule: <strong>${esc(data.school.name)}</strong>, hat dem Einsatz zugestimmt · <a href="/datenschutz?schule=${key}"><i class='bi bi-file-earmark-text'></i> Unterlagen für deine Schule</a></p>`
                    : `<details class='mb-3'><summary>Deine Schule: <strong>${esc(data.school.name)}</strong>, <span class='text-warning-emphasis'>hat noch nicht zugestimmt</span> · was heißt das?</summary>`
                        + `<p class='mt-2'>Am besten unterschreibt die Schulleitung die Entscheidung und die Vereinbarung aus den <a href="/datenschutz?schule=${key}">Unterlagen für deine Schule</a>; schick sie dann an die Administration. `
                        + `Bis dahin genügt für eine Schülerin oder einen Schüler ein schriftliches Einverständnis (<a href="/datenschutz/elternbrief?schule=${key}&einverstaendnis=1">Elternbrief mit Einverständniserklärung</a>): Du bewahrst es auf und trägst das Datum in der Gruppe ein. Anmelden können sich alle schon jetzt.</p></details>`);
            } else if (!data.admin) {
                school.append(`<div class='alert alert-warning'>Dir ist noch keine Schule zugeordnet; das macht die Administration. Bis dahin kannst du keine Gruppe anlegen.</div>`);
            }
            if (data.school || data.admin) {
                const form = $(`<form class='row g-2 align-items-end mb-3'>
                    <div class='col-sm-5'><label class='form-label small' for='ti_new_group'>Neue Gruppe</label><input id='ti_new_group' class='form-control' placeholder='zum Beispiel »10a Informatik«' maxlength='60'></div>
                    <div class='col-sm-4 admin-school'></div>
                    <div class='col-sm-3'><button class='btn btn-primary'><i class='bi bi-plus-lg'></i>Gruppe anlegen</button></div>
                </form>`);
                if (data.admin && data.schools.length) {
                    const select = $(`<select id='sel_new_group_school' class='form-select'></select>`);
                    data.schools.forEach(s => select.append($('<option>').val(s.key).text(s.name)));
                    form.find('.admin-school').append(`<label class='form-label small' for='sel_new_group_school'>Schule</label>`).append(select);
                    setTimeout(() => searchable_select('#sel_new_group_school'), 0);
                }
                form.on('submit', function (e) {
                    e.preventDefault();
                    const payload = { name: $('#ti_new_group').val().trim() };
                    if ($('#sel_new_group_school').length) payload.school = $('#sel_new_group_school').val();
                    groups_call('/api/groups/create', payload, load_groups);
                });
                fresh.append(form);
            }
            if (data.groups.length === 0) {
                here.append(`<p class='text-body-secondary'>Noch keine Gruppe.</p>`);
            }
            all_schools = data.schools || [];
            fat_kb = data.fat_kb;
            // A teacher with a few groups sees them open the first time; a link
            // to #gruppe=NAME (from /personen) opens that group.
            const wanted = first_load && location.hash.startsWith('#gruppe=') ? decodeURIComponent(location.hash.slice(8)) : null;
            if (first_load && !data.admin && data.groups.length <= 3) data.groups.forEach(g => open_groups.add(g.name));
            if (wanted) open_groups.add(wanted);
            first_load = false;
            // Under their school when there is more than one; guests last.
            const school_of = g => g.school ? g.school.name : 'ohne Schule';
            const schools = [...new Set(data.groups.map(school_of))];
            const guests = new Set(data.groups.filter(g => g.school && g.school.guests).map(school_of));
            const home = new Set(data.groups.filter(g => g.school && g.school.home).map(school_of));
            schools.sort((a, b) => (home.has(b) - home.has(a)) || (guests.has(a) - guests.has(b)) || a.localeCompare(b, 'de'));
            schools.forEach(function (name) {
                const groups = data.groups.filter(g => school_of(g) === name);
                if (schools.length > 1) here.append($(`<h2 class='school-heading'></h2>`).text(`${name}${guests.has(name) ? ' (ohne Schule)' : ''} · ${groups.length} ${groups.length === 1 ? 'Gruppe' : 'Gruppen'}`));
                groups.forEach(g => here.append(render_group(g, data.admin).data('info', g)));
            });
            $('#groups_filter').toggle(data.groups.length > 3);
            render_group_chips(data.groups);
            filter_groups();
            if (wanted) {
                const card = $('#groups_here .group-card').filter(function () { return $(this).data('group') === wanted; }).first();
                if (card.length) card[0].scrollIntoView({ block: 'start' });
            }
        }, { no_please_wait: true });
    }

    window.addEventListener('load', function () {
        $('#groups_filter').on('input', filter_groups);
        load_groups();
    });
</script>
