<style>
    .not-found {
        max-width: 36em;
        margin: 4em auto 6em auto;
        text-align: center;
    }
    .not-found-code {
        font-family: '0xProto Nerd Font Mono', monospace;
        font-size: 7rem;
        font-weight: bold;
        line-height: 1;
        color: #c9b458;
        animation: not-found-hum 7s infinite;
    }
    .not-found p {
        text-align: center;
        hyphens: manual;
    }
    .not-found h1 {
        margin: 0.4em 0 0.8em 0;
    }
    .not-found-path {
        word-break: break-all;
    }
    .not-found-thin {
        margin-top: 3em;
        font-size: 0.85rem;
        color: var(--bs-secondary-color);
        opacity: 0.6;
    }
    /* Die Ziffern summen wie eine Leuchtstoffröhre: meistens ruhig, selten ein Zucken */
    @keyframes not-found-hum {
        0%, 91%, 93%, 96%, 100% { opacity: 1; }
        92% { opacity: 0.35; }
        94.5% { opacity: 0.6; }
    }
    /* noclip: Die Seite fällt weg, alles wird gelb (siehe das Skript unten) */
    .noclip-veil {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: #c9b458;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s 0.4s;
    }
    .noclipping .noclip-veil {
        opacity: 1;
    }
    .noclipping .not-found {
        animation: noclip-fall 1.2s ease-in forwards;
    }
    @keyframes noclip-fall {
        0% { transform: none; opacity: 1; }
        20% { transform: translate(4px, -3px) skewX(3deg); }
        30% { transform: translate(-3px, 2px) skewX(-2deg); }
        100% { transform: translateY(70vh) scale(0.85); opacity: 0; filter: blur(6px); }
    }
    @media (prefers-reduced-motion: reduce) {
        .not-found-code,
        .noclipping .not-found {
            animation: none;
        }
    }
</style>
<!-- Wer hier im Quelltext liest, sucht einen Ausgang. In alten Spielen wie
     Quake gab es einen Cheat, mit dem man durch Wände ging. Tipp ihn ein. -->
<div class='container'>
    <div class='not-found'>
        <div class='not-found-code' aria-hidden='true'>404</div>
        <h1>Diese Seite gibt es nicht</h1>
        <p>Unter <code class='not-found-path' id='not-found-path'></code> steht nichts. Vielleicht hat sich ein Tippfehler in die Adresse geschlichen, oder die Seite ist umgezogen.</p>
        <p>
            <a class='btn btn-primary' href='/'>Zur Startseite</a>
            <a class='btn btn-outline-secondary' href='/reference'>Zum Handbuch</a>
        </p>
        <p class='not-found-thin'>Manchmal ist eine Wand dünner, als sie aussieht.</p>
    </div>
</div>
<div class='noclip-veil'></div>
<script>
(function () {
    document.getElementById('not-found-path').textContent = location.pathname;
    // noclip, irgendwo auf der Seite getippt (nicht in einem Eingabefeld):
    // Die Seite fällt weg, und du landest in den Backrooms.
    const word = 'noclip';
    let typed = '';
    let falling = false;
    document.addEventListener('keydown', (event) => {
        if (falling || event.ctrlKey || event.metaKey || event.altKey || event.key.length !== 1) return;
        if (event.target.closest && event.target.closest('input, textarea, select, [contenteditable]')) return;
        typed = (typed + event.key.toLowerCase()).slice(-word.length);
        if (typed !== word) return;
        falling = true;
        const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.body.classList.add('noclipping');
        setTimeout(() => { location.href = '/backrooms'; }, still ? 0 : 1400);
    });
})();
</script>
