<style>
    .not-found {
        max-width: 36em;
        margin: 4em auto 6em auto;
        text-align: center;
    }
    .not-found-code {
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        font-family: '0xProto Nerd Font Mono', monospace;
        font-size: 7rem;
        font-weight: bold;
        line-height: 1;
        color: #c9b458;
        animation: not-found-hum 7s infinite;
    }
    .not-found p {
        text-align: center;
        hyphens: manual;
    }
    .not-found h1 {
        margin: 0.4em 0 0.8em 0;
    }
    .not-found-path {
        word-break: break-all;
    }
    .not-found-thin {
        margin-top: 3em;
        font-size: 0.85rem;
        color: var(--bs-secondary-color);
        opacity: 0.6;
    }
    /* Die Ziffern summen wie eine Leuchtstoffröhre: meistens ruhig, selten ein Zucken */
    @keyframes not-found-hum {
        0%, 91%, 93%, 96%, 100% { opacity: 1; }
        92% { opacity: 0.35; }
        94.5% { opacity: 0.6; }
    }
    /* noclip: Du sinkst durch den Boden, die Seite fliegt nach oben weg,
       alles wird gelb (siehe das Skript unten) */
    .noclip-veil {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: #c9b458;
        opacity: 0;
        pointer-events: none;
    }
    body.noclipping .noclip-veil {
        animation: noclip-veil 1.3s ease-in forwards;
    }
    @keyframes noclip-veil {
        0%, 30% { opacity: 0; }
        100% { opacity: 1; }
    }
    /* die ganze Seite, Kopf und Fuß eingeschlossen; der Schleier liegt
       dann direkt in body und bleibt stehen */
    body.noclipping > :not(.noclip-veil) {
        animation: noclip-fall 1.2s ease-in forwards;
    }
    @keyframes noclip-fall {
        0% { transform: none; opacity: 1; }
        20% { transform: translate(4px, -3px) skewX(3deg); }
        30% { transform: translate(-3px, 2px) skewX(-2deg); }
        100% { transform: translateY(-70vh) scale(0.85); opacity: 0; filter: blur(6px); }
    }
    /* Auf dem Tablet: Wer gegen die Ziffern tippt, bringt sie zum Zucken,
       jedes Mal etwas mehr (siehe das Skript unten) */
    .not-found-code.knocked {
        animation: not-found-knock 0.25s ease-out;
    }
    @keyframes not-found-knock {
        0% { transform: translate(0, 0); opacity: 1; }
        30% { transform: translate(calc(var(--knock, 1) * 3px), calc(var(--knock, 1) * -2px)); opacity: 0.4; }
        60% { transform: translate(calc(var(--knock, 1) * -2px), 1px); opacity: 0.8; }
        100% { transform: none; opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
        .not-found-code,
        body.noclipping > :not(.noclip-veil) {
            animation: none;
        }
    }
</style>
<!-- Wer hier im Quelltext liest, sucht einen Ausgang. In alten Spielen wie
     Quake gab es einen Cheat, mit dem man durch Wände ging. Tipp ihn ein.
     Ohne Tastatur: Klopf an die Wand, fünfmal, schnell. -->
<div class='container'>
    <div class='not-found'>
        <div class='not-found-code' aria-hidden='true'>404</div>
        <h1>Diese Seite gibt es nicht</h1>
        <p>Unter <code class='not-found-path' id='not-found-path'></code> steht nichts. Vielleicht hat sich ein Tippfehler in die Adresse geschlichen, oder die Seite ist umgezogen.</p>
        <p>
            <a class='btn btn-primary' href='/'>Zur Startseite</a>
            <a class='btn btn-outline-secondary' href='/reference'>Zum Handbuch</a>
        </p>
        <p class='not-found-thin'>Manchmal ist eine Wand dünner, als sie aussieht.</p>
    </div>
</div>
<div class='noclip-veil'></div>
<script>
(function () {
    document.getElementById('not-found-path').textContent = location.pathname;
    // noclip, irgendwo auf der Seite getippt (nicht in einem Eingabefeld),
    // oder ohne Tastatur fünfmal schnell gegen die 404 getippt: Die Seite
    // fällt weg, und du landest in den Backrooms.
    const word = 'noclip';
    let typed = '';
    let falling = false;
    document.addEventListener('keydown', (event) => {
        if (falling || event.ctrlKey || event.metaKey || event.altKey || event.key.length !== 1) return;
        if (event.target.closest && event.target.closest('input, textarea, select, [contenteditable]')) return;
        typed = (typed + event.key.toLowerCase()).slice(-word.length);
        if (typed === word) fall();
    });
    const code = document.querySelector('.not-found-code');
    let knocks = [];
    code.addEventListener('pointerdown', () => {
        if (falling) return;
        const now = Date.now();
        knocks = knocks.filter((t) => now - t < 2500).concat(now);
        // jedes Klopfen zuckt stärker
        code.style.setProperty('--knock', String(knocks.length));
        code.classList.remove('knocked');
        void code.offsetWidth;
        code.classList.add('knocked');
        if (knocks.length >= 5) fall();
    });
    // danach summen die Ziffern wieder wie vorher
    code.addEventListener('animationend', (event) => {
        if (event.animationName === 'not-found-knock') code.classList.remove('knocked');
    });
    function fall() {
        falling = true;
        const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // der Schleier direkt in body: Läge er in einem Teil, der sich bewegt,
        // bewegte er sich mit
        document.body.appendChild(document.querySelector('.noclip-veil'));
        document.body.classList.add('noclipping');
        setTimeout(() => { location.href = '/level-0-c1d8a2f7'; }, still ? 0 : 1400);
    }
})();
</script>
