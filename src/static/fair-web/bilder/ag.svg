<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- the club room: a long table, three laptops, a small robot, a game on a screen -->
  <rect width="640" height="300" fill="#e7f5ff"/>
  <rect x="0" y="210" width="640" height="90" fill="#d0bfa0"/>
  <rect x="30" y="196" width="590" height="16" rx="3" fill="#8d6e48"/>
  <!-- a window -->
  <rect x="450" y="30" width="150" height="110" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="4"/>
  <line x1="525" y1="30" x2="525" y2="140" stroke="#adb5bd" stroke-width="4"/>
  <circle cx="490" cy="70" r="18" fill="#ffd43b"/>
  <!-- laptop 1: code -->
  <g transform="translate(55 104)">
    <rect width="120" height="80" rx="4" fill="#343a40"/>
    <rect x="8" y="8" width="104" height="64" fill="#1c3a5e"/>
    <rect x="16" y="18" width="50" height="6" fill="#ffd43b"/>
    <rect x="24" y="32" width="70" height="6" fill="#74c0fc"/>
    <rect x="24" y="46" width="40" height="6" fill="#8ce99a"/>
    <path d="M-10 92 H130 L120 80 H0 Z" fill="#868e96"/>
  </g>
  <!-- laptop 2: a game -->
  <g transform="translate(220 104)">
    <rect width="120" height="80" rx="4" fill="#343a40"/>
    <rect x="8" y="8" width="104" height="64" fill="#2b8a3e"/>
    <rect x="20" y="50" width="20" height="14" fill="#ffd43b"/>
    <circle cx="80" cy="30" r="10" fill="#ff8787"/>
    <rect x="8" y="64" width="104" height="8" fill="#8d6e48"/>
    <path d="M-10 92 H130 L120 80 H0 Z" fill="#868e96"/>
  </g>
  <!-- laptop 3: a website -->
  <g transform="translate(385 104)">
    <rect width="120" height="80" rx="4" fill="#343a40"/>
    <rect x="8" y="8" width="104" height="64" fill="#ffffff"/>
    <rect x="8" y="8" width="104" height="14" fill="#5c7cfa"/>
    <rect x="16" y="30" width="40" height="34" fill="#dee2e6"/>
    <rect x="62" y="30" width="42" height="6" fill="#adb5bd"/>
    <rect x="62" y="42" width="34" height="6" fill="#adb5bd"/>
    <path d="M-10 92 H130 L120 80 H0 Z" fill="#868e96"/>
  </g>
  <!-- the robot sitting at the right end of the table: head with eyes and mouth, antenna, arms with grippers -->
  <g transform="translate(530 100)">
    <line x1="30" y1="4" x2="30" y2="-10" stroke="#495057" stroke-width="3"/>
    <circle cx="30" cy="-13" r="5" fill="#ff6b6b"/>
    <rect x="10" y="4" width="40" height="30" rx="6" fill="#dee2e6" stroke="#495057" stroke-width="3"/>
    <circle cx="22" cy="17" r="5" fill="#1c7ed6"/>
    <circle cx="38" cy="17" r="5" fill="#1c7ed6"/>
    <rect x="21" y="26" width="18" height="3" rx="1.5" fill="#495057"/>
    <rect x="22" y="34" width="16" height="6" fill="#868e96"/>
    <rect x="6" y="40" width="48" height="56" rx="8" fill="#dee2e6" stroke="#495057" stroke-width="3"/>
    <circle cx="30" cy="58" r="6" fill="#ffd43b" stroke="#495057" stroke-width="2"/>
    <rect x="18" y="72" width="24" height="5" rx="2" fill="#74c0fc"/>
    <path d="M6 50 L-10 66 L-6 80" fill="none" stroke="#495057" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-12 80 L-6 84 L0 80" fill="none" stroke="#495057" stroke-width="3" stroke-linecap="round"/>
    <path d="M54 50 L70 62 L66 76" fill="none" stroke="#495057" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 76 L66 80 L72 76" fill="none" stroke="#495057" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
