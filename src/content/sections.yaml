# The catalog on the start page, in this order: first what the Workspace
# offers, the tools of the trade (terminal, Git) further down; within a topic
# the basics come first, TCP/IP before the web server.
# short: is the one sentence a phone shows instead of the description, so
# that the cards come sooner; a section with a short description needs none.
- key: introduction
  label: Erste Schritte
  icon: /images/rocket.png
  description: |
    Lerne den Hackschule Workspace kennen und finde dich in der
    Entwicklungsumgebung zurecht.
  entries:
    - about
    - basics
    - keyboard

# Katas (docs/plan-katas.md): small exercises typed into the cards of the
# page.

- key: katas
  label: Katas
  short: Kleine Programmieraufgaben, die du direkt auf der Seite ausführst und prüfst.
  icon: /images/martial-arts-uniform.png
  # one strip of the sets with the person's progress (KataMap)
  carousel: true
  description: |
    Kleine Programmieraufgaben direkt auf der Seite, in Ruby, Python oder
    JavaScript: ohne Terminal und Dateien, mit einem Knopf, der den Code
    ausführt und prüft. Eine Kata übt man, bis sie sitzt, wie in den
    Kampfkünsten; die Übungen bauen aufeinander auf, springen darfst du immer.
  entries:
    - pip-1
    - kata-functions
    - kata-decisions
    - kata-loops
    - pip-2
    - kata-texts
    - kata-lists
    - kata-dicts
    - kata-objects
    - kata-bits
    - kata-recursion
    - kata-functional
    - kata-search
    - pip-3
    - kata-tests

- key: graphics
  compact: true
  label: Grafik
  short: Erzeuge Bilder und Animationen mit Code, von Kurven bis zur 3D-Brille.
  icon: /images/palette.png
  description: |
    Erzeuge Bilder und Animationen mit selbst geschriebenem Code: aus Kurven
    und Kreisen, Pixel für Pixel aus Formeln, mit Strahlen durch eine Szene,
    als Shader auf dem Grafikchip oder räumlich für die 3D-Brille. Dabei beschäftigst du dich mit Pixeln,
    Farben, Koordinaten und Vektoren.
  entries:
    - anaglyph
    - drawing
    # - .turtle (got test)
    # - .drawing (koch curve)
    - fire
    - pixelram
    - raytracing
    - glsl
  #  - .sirds
  # - .p5js
  # - .gif

- key: games
  compact: true
  label: Spiele & 3D-Welten
  short: Programmiere Spiele und Welten, durch die du selbst läufst.
  icon: /images/joystick.png
  description: |
    Programmiere Spiele und Welten, durch die du selbst läufst: ein Spiel auf
    einem kleinen Computer mit 64 KB, die Technik hinter Wolfenstein 3D und
    eine Welt aus Blöcken mit Tag und Nacht.
  entries:
    - tic80
    - raycaster
    - raylib

- key: writing
  compact: true
  label: Texte & Präsentationen
  short: Erstelle Dokumente, Präsentationen und Geschichten, in denen Lesende entscheiden.
  icon: /images/book.png
  description: |
    Computer können Texte nicht nur anzeigen, sondern auch strukturieren,
    gestalten und in interaktive Erlebnisse verwandeln. Erstelle Dokumente,
    Präsentationen und verzweigte Geschichten, in denen Leserinnen und Leser
    eigene Entscheidungen treffen können.
  entries:
    - bif
    - showerjs
    - latex

- key: web
  compact: true
  label: Web
  icon: /images/telephone.png
  description: |
    Baue Webseiten und Anwendungen, die im Browser laufen, und hol dir Daten
    von Diensten im Netz.
  entries:
    - static-website
    - svelte
    - wetter
    - hugo
    - suchmaschine
    - tracking

- key: ki
  label: Künstliche Intelligenz
  short: Baue Programme, die aus Beispielen lernen, Funktion für Funktion.
  icon: /images/brain.png
  description: |
    Wie lernt ein Programm aus Beispielen? Du baust ein winziges
    Sprachmodell, ein Neuron, das selbst lernt, und ein Programm, das nach
    den nächsten Nachbarn entscheidet, ohne Bibliotheken, Funktion für
    Funktion. Dabei siehst du, was diese Verfahren können, und was sie aus
    ihren Daten übernehmen.
  entries:
    - sprachmodell
    - perzeptron
    - naechste-nachbarn

- key: compression
  compact: true
  label: Bilder und Kompression
  short: Mach Daten kleiner und lies echte GIF- und JPEG-Dateien Byte für Byte.
  icon: /images/clamp.png
  description: |
    Daten kleiner machen, ohne etwas zu verlieren: Lauflängen, Huffman-Codes
    und LZW, jedes Verfahren selbst geschrieben. Danach Decoder in C für GIF
    und JPEG, die echte Bilddateien Byte für Byte lesen und zeigen, und
    Botschaften, die in den Pixeln eines Fotos verschwinden.
  entries:
    - rle
    - huffman
    - lzw
    - gif
    - jpeg
    - steganography

- key: networks
  compact: true
  label: Netze & Sicherheit
  short: Lerne, wie Rechner über das Netz reden und wie man Daten dabei schützt.
  icon: /images/handshake.png
  description: |
    Wie Rechner über das Netz miteinander reden, vom Paket bis zur Webseite:
    TCP/IP, ein eigener Webserver, eine Pixelwand für die ganze Klasse. Und wie
    man Daten schützt, mit Verschlüsselung, Signaturen und einem zweiten
    Faktor bei der Anmeldung.
  entries:
    - tcpip
    - dns
    - webserver
    - pixelwand
    - crypto
    - totp

- key: databases
  compact: true
  label: Datenbanken
  short: Speichere, verknüpfe und durchsuche größere Datenmengen mit SQL.
  icon: /images/card-file-box.png
  description: |
    Speichere, verknüpfe und durchsuche größere Datenmengen. Lerne SQL kennen,
    entwirf eine eigene Datenbank für Filme, speichere dieselben Daten
    anschließend als Graph und sieh, wie ein Programm Abfragen sicher stellt.
  entries:
    - mysql
    - sql-joins
    - sql-index
    - filmdatenbank
    - neo4j-filmdatenbank
    - bobby_tables

# .logikgatter (Gatter bis Rechenwerk) nur in der Entwicklung, bis die Reihen
# der Startseite eine zehnte Karte tragen.

# Wie Computer rechnen, Algorithmen und Datenstrukturen, Automaten und
# Sprachen: früher ein Abschnitt, geteilt nach den Namen der Lehrpläne
# (Technische Informatik; Algorithmen und Datenstrukturen; Sprachen und
# Automaten, Syntax und Semantik), damit jede Reihe voll ist
# (docs/plan-lehrplan-luecken.md, »Rechnen«). Icons: Noto Emoji v2.047.

- key: computing
  compact: true
  label: Wie Computer rechnen
  short: Vom einzelnen Gatter über eigene Schaltungen bis zur programmierbaren CPU.
  icon: /images/computer.png
  description: |
    Ein Blick unter die Haube: aus Gattern einen Addierer und ein Rechenwerk
    bauen, in der Werkstatt eigene Schaltungen zusammenstecken und zu
    Bausteinen machen, und am Ende eine kleine CPU in Assembler und C
    programmieren.
  entries:
    - logikgatter
    - logikwerkstatt
    - sandbox-cpu

- key: algorithms
  compact: true
  label: Algorithmen und Datenstrukturen
  short: Sortieren, Listen, Bäume und Heaps von innen, und der kürzeste Weg durch Berlin.
  icon: /images/bar-chart.png
  description: |
    Sortierverfahren und Datenstrukturen selbst bauen und Schritt für Schritt
    zusehen, was sie tun, und ein Routenplaner, der in echten Karten von
    Berlin den kürzesten Weg findet.
  entries:
    - sandbox-sortieren
    - sandbox-datenstrukturen
    - routenplaner

- key: theory
  compact: true
  label: Automaten und Sprachen
  short: Vom endlichen Automaten über reguläre Ausdrücke bis zu Grammatiken und Turingmaschinen.
  icon: /images/robot.png
  description: |
    Was Maschinen erkennen können und was nicht: endliche Automaten, reguläre
    Ausdrücke, Kellerautomaten und die Turingmaschine, dann Grammatiken und
    ein Rechner, der Ausdrücke versteht.
  entries:
    - automata
    - regex
    - kellerautomat
    - turingmaschine
    - grammatiken
    - calculator

# Software entwerfen (docs/plan-lehrplan-luecken.md, »Software«): erst
# planen, dann programmieren; Klassen und ihre Diagramme; ein Projekt der
# ganzen Klasse mit Git.

- key: software
  label: Software entwerfen
  short: Plane ein Programm, bevor du es schreibst, allein oder mit der ganzen Klasse.
  icon: /images/hammer-and-wrench.png
  description: |
    Plane ein Programm, bevor du es schreibst: einen Algorithmus als
    Pseudocode und Struktogramm, ein größeres Programm als Klassendiagramm
    mit den Klassen, die es braucht. Dann programmierst du nach deinem Plan,
    allein oder mit der ganzen Klasse in einem gemeinsamen Git-Repository.
  entries:
    - check-digits
    - supermarkt
    - textadventure
    - class-quiz

- key: terminal
  label: Terminal & Git
  short: Arbeite mit Dateien, Programmen und Git im Terminal.
  icon: /images/penguin.png
  description: |
    Arbeite mit Dateien und Programmen im Terminal. Mit Git kannst du Änderungen
    an deinen Projekten nachvollziehen, frühere Stände wiederherstellen und
    gemeinsam mit anderen daran arbeiten. Und mit beidem einen Diebstahl
    aufklären.
  entries:
    - working-with-files
    - git
    - terminal-mystery

