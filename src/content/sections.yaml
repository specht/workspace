- key: introduction
  label: Einführung
  icon: /images/rocket.png
  description: |
    Lerne den Hackschule Workspace kennen und finde dich in der
    Entwicklungsumgebung zurecht. Hier erfährst du, wie du Projekte und Dateien
    organisierst, deine Arbeit speicherst und mit Tutorials und Checkpoints
    sicher experimentieren kannst.
  entries:
    - about
    - basics
    - keyboard

# Code Bites (Programmieren üben) is off the start page for now (hidden:
# not in the catalog, not pinnable); the exercises stay reachable from the
# profile and by direct links until they get a new place.
- key: practice
  hidden: true
  compact: true
  label: Programmieren üben
  icon: /images/hacker.png
  description: |
    Kurze Aufgaben, die du im Code-Editor in Ruby, Python oder JavaScript löst.
    Automatische Tests sagen dir sofort, ob deine Funktion stimmt. Gut für
    zwischendurch, auch ohne Workspace.
  entries:
    - uebung-zahlen
    - uebung-arrays
    - uebung-strings

- key: graphics
  compact: true
  label: Computergrafik
  icon: /images/palette.png
  description: |
    Erzeuge Bilder, Animationen und räumliche Szenen mit selbst geschriebenem
    Code. Dabei beschäftigst du dich mit Pixeln, Farben, Formen, Koordinaten und
    3D-Geometrie – und kannst sogar einen Blick in das Innere einer Bilddatei
    werfen.
  entries:
    - anaglyph
    - drawing
    # - .turtle (got test)
    # - .drawing (koch curve)
    - fire
    - pixelram
    - feuerwerk
    - tic80
    - raylib
  #  - .sirds
  # - .raytracing
  # - .p5js
  # - .glsl
  # - .gif

- key: writing
  compact: true
  label: Texte & Präsentationen
  icon: /images/book.png
  description: |
    Computer können Texte nicht nur anzeigen, sondern auch strukturieren,
    gestalten und in interaktive Erlebnisse verwandeln. Erstelle Dokumente,
    Präsentationen und verzweigte Geschichten, in denen Leserinnen und Leser
    eigene Entscheidungen treffen können.
  entries:
    - bif
    - showerjs
    - latex

- key: networks
  compact: true
  label: Web & Schnittstellen
  icon: /images/telephone.png
  description: |
    Entwickle Webseiten und interaktive Anwendungen, die direkt im Browser
    ausgeführt werden. Lerne außerdem, wie Programme über Schnittstellen mit
    bestehenden Webdiensten kommunizieren und dort Aktionen auslösen können.
  entries:
    - static-website
    - hugo
    - webserver
    - pixelwand
    - svelte
    - hades

- key: databases
  compact: true
  label: Datenbanken
  icon: /images/card-file-box.png
  description: |
    Speichere, verknüpfe und durchsuche größere Datenmengen. Lerne SQL kennen,
    entwirf eine eigene Datenbank für Filme und speichere dieselben Daten
    anschließend als Graph.
  entries:
    - mysql
    - filmdatenbank
    - neo4j-filmdatenbank
    # off for now, so that both film databases share a row
    # - .bobby_tables

- key: advanced
  compact: true
  label: Experimente
  icon: /images/mirror-ball.png
  description: |
    Gehe einen Schritt tiefer und untersuche, wie Computer Bilder und Daten
    verarbeiten. Trainiere ein kleines Modell zur Ziffernerkennung und wirf
    einen Blick in den Aufbau von JPEG-Dateien.
  entries:
    - digits-experiment
    - jpeg

- key: linux
  label: Terminal & Git
  icon: /images/penguin.png
  description: |
    Arbeite mit Dateien und Programmen über das Terminal und entdecke, wie
    Computer über Netzwerke miteinander kommunizieren. Mit Git kannst du
    Änderungen an deinen Projekten nachvollziehen, frühere Stände wiederherstellen
    und gemeinsam mit anderen daran arbeiten.
  entries:
    - working-with-files
    - tcpip
    - git
  # - .working-with-processes

- key: sandboxes
  compact: true
  label: Sandboxes
  icon: /images/hammer-and-wrench.png
  description: |
    Größere Programmieraufgaben in eigenständigen Apps: Sortierverfahren
    vergleichen, Datenstrukturen selbst bauen, eine kleine CPU programmieren. Jede
    Sandbox prüft deinen Code mit eigenen Tests; mit Git gibst du ihn an die
    Klasse weiter.
  entries:
    - sandbox-sortieren
    - sandbox-datenstrukturen
    - sandbox-cpu

- key: programming_languages
  compact: true
  description: |
    Hier findest du kurze, praktische Einführungen in verschiedene
    Programmiersprachen. Du bekommst jeweils drei Beispiele für Programme
    gezeigt, die du direkt im Workspace ausprobieren kannst: ein einfaches
    »Hello, World!«, ein Programm, das eine Zahl einliest und in ihre Primfaktoren
    zerlegt, und ein Programm, das den Bubblesort-Algorithmus demonstriert. Finde
    deine Lieblingssprache!
  label: Programmiersprachen
  icon: /images/keyboard.png
  entries:
    - fortran
    - cobol
    - basic
    - pascal
    - c
    - smalltalk
    - cpp
    - clisp
    # - perl
    - python
    - lua
    # - php
    - ruby
    - java
    - js
    - nasm
    - cs
    - go
    - dart
    - rust
