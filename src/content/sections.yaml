# The catalog on the start page, in this order: first what the Workspace
# offers, the tools of the trade (terminal, Git) further down; within a topic
# the basics come first, TCP/IP before the web server.
- key: introduction
  label: Erste Schritte
  icon: /images/rocket.png
  description: |
    Lerne den Hackschule Workspace kennen und finde dich in der
    Entwicklungsumgebung zurecht.
  entries:
    - about
    - basics
    - keyboard

# Code Bites (Programmieren üben) is off the start page for now (hidden:
# not in the catalog, not pinnable); the exercises stay reachable from the
# profile and by direct links until they get a new place.
- key: practice
  hidden: true
  compact: true
  label: Programmieren üben
  icon: /images/hacker.png
  description: |
    Kurze Aufgaben, die du im Code-Editor in Ruby, Python oder JavaScript löst.
    Automatische Tests sagen dir sofort, ob deine Funktion stimmt. Gut für
    zwischendurch, auch ohne Workspace.
  entries:
    - uebung-zahlen
    - uebung-arrays
    - uebung-strings

- key: graphics
  compact: true
  label: Grafik & Spiele
  icon: /images/palette.png
  description: |
    Erzeuge Bilder, Animationen, Spiele und räumliche Szenen mit selbst
    geschriebenem Code. Dabei beschäftigst du dich mit Pixeln, Farben, Formen,
    Koordinaten und 3D-Geometrie.
  entries:
    - anaglyph
    - drawing
    # - .turtle (got test)
    # - .drawing (koch curve)
    - fire
    - pixelram
    - tic80
    - raylib
  #  - .sirds
  # - .raytracing
  # - .p5js
  # - .glsl
  # - .gif

- key: writing
  compact: true
  label: Texte & Präsentationen
  icon: /images/book.png
  description: |
    Computer können Texte nicht nur anzeigen, sondern auch strukturieren,
    gestalten und in interaktive Erlebnisse verwandeln. Erstelle Dokumente,
    Präsentationen und verzweigte Geschichten, in denen Leserinnen und Leser
    eigene Entscheidungen treffen können.
  entries:
    - bif
    - showerjs
    - latex

- key: web
  compact: true
  label: Web
  icon: /images/telephone.png
  description: |
    Baue Webseiten und Anwendungen, die im Browser laufen, und hol dir Daten
    von Diensten im Netz.
  entries:
    - static-website
    - svelte
    - wetter

- key: networks
  compact: true
  label: Netze & Sicherheit
  icon: /images/handshake.png
  description: |
    Wie Rechner über das Netz miteinander reden, vom Paket bis zur Webseite:
    TCP/IP, ein eigener Webserver, eine Pixelwand für die ganze Klasse. Und wie
    man Daten schützt, mit Verschlüsselung, Signaturen und sicheren
    Datenbankabfragen.
  entries:
    - tcpip
    - webserver
    - pixelwand
    - crypto
    - bobby_tables

- key: databases
  compact: true
  label: Datenbanken
  icon: /images/card-file-box.png
  description: |
    Speichere, verknüpfe und durchsuche größere Datenmengen. Lerne SQL kennen,
    entwirf eine eigene Datenbank für Filme und speichere dieselben Daten
    anschließend als Graph.
  entries:
    - mysql
    - filmdatenbank
    - neo4j-filmdatenbank

- key: computing
  compact: true
  label: Wie Computer rechnen
  icon: /images/computer.png
  description: |
    Ein Blick unter die Haube: eine kleine CPU programmieren, Sortierverfahren
    und Datenstrukturen selbst bauen, endliche Automaten, ein neuronales Netz,
    das Ziffern erkennt, und der Aufbau von GIF- und JPEG-Dateien.
  entries:
    - sandbox-cpu
    - sandbox-sortieren
    - sandbox-datenstrukturen
    - automata
    - digits-experiment
    - gif
    - jpeg

- key: terminal
  label: Terminal & Git
  icon: /images/penguin.png
  description: |
    Arbeite mit Dateien und Programmen im Terminal. Mit Git kannst du Änderungen
    an deinen Projekten nachvollziehen, frühere Stände wiederherstellen und
    gemeinsam mit anderen daran arbeiten.
  entries:
    - working-with-files
    - git

# Parked for now, so that the sections above fill rows of three: not in the
# catalog, but the pages stay reachable by direct links (static-website links
# to Hugo).
- key: parked
  hidden: true
  label: Zurückgestellt
  icon: /images/bookmark.png
  entries:
    - feuerwerk
    - hugo
    - lzw

- key: programming_languages
  compact: true
  tiles: true
  description: |
    Hier findest du kurze, praktische Einführungen in verschiedene
    Programmiersprachen. Du bekommst jeweils drei Beispiele für Programme
    gezeigt, die du direkt im Workspace ausprobieren kannst: ein einfaches
    »Hello, World!«, ein Programm, das eine Zahl einliest und in ihre Primfaktoren
    zerlegt, und ein Programm, das den Bubblesort-Algorithmus demonstriert. Finde
    deine Lieblingssprache!
  label: Programmiersprachen
  icon: /images/keyboard.png
  entries:
    - fortran
    - cobol
    - basic
    - pascal
    - c
    - smalltalk
    - cpp
    - clisp
    # - perl
    - python
    - lua
    # - php
    - ruby
    - java
    - js
    - nasm
    - cs
    - go
    - dart
    - rust
