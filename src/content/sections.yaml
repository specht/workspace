# The catalog on the start page, in this order: first what the Workspace
# offers, the tools of the trade (terminal, Git) further down; within a topic
# the basics come first, TCP/IP before the web server.
- key: introduction
  label: Erste Schritte
  icon: /images/rocket.png
  description: |
    Lerne den Hackschule Workspace kennen und finde dich in der
    Entwicklungsumgebung zurecht.
  entries:
    - about
    - basics
    - keyboard

- key: graphics
  compact: true
  label: Grafik
  icon: /images/palette.png
  description: |
    Erzeuge Bilder und Animationen mit selbst geschriebenem Code: aus Kurven
    und Kreisen, Pixel für Pixel aus Formeln, mit Strahlen durch eine Szene,
    als Shader auf dem Grafikchip oder räumlich für die 3D-Brille. Dabei beschäftigst du dich mit Pixeln,
    Farben, Koordinaten und Vektoren.
  entries:
    - anaglyph
    - drawing
    # - .turtle (got test)
    # - .drawing (koch curve)
    - fire
    - pixelram
    - raytracing
    - glsl
  #  - .sirds
  # - .p5js
  # - .gif

- key: games
  compact: true
  label: Spiele & 3D-Welten
  icon: /images/joystick.png
  description: |
    Programmiere Spiele und Welten, durch die du selbst läufst: ein Spiel auf
    einem kleinen Computer mit 64 KB, die Technik hinter Wolfenstein 3D und
    eine Welt aus Blöcken mit Tag und Nacht.
  entries:
    - tic80
    - raycaster
    - raylib

- key: writing
  compact: true
  label: Texte & Präsentationen
  icon: /images/book.png
  description: |
    Computer können Texte nicht nur anzeigen, sondern auch strukturieren,
    gestalten und in interaktive Erlebnisse verwandeln. Erstelle Dokumente,
    Präsentationen und verzweigte Geschichten, in denen Leserinnen und Leser
    eigene Entscheidungen treffen können.
  entries:
    - bif
    - showerjs
    - latex

- key: web
  compact: true
  label: Web
  icon: /images/telephone.png
  description: |
    Baue Webseiten und Anwendungen, die im Browser laufen, und hol dir Daten
    von Diensten im Netz.
  entries:
    - static-website
    - svelte
    - wetter

- key: networks
  compact: true
  label: Netze & Sicherheit
  icon: /images/handshake.png
  description: |
    Wie Rechner über das Netz miteinander reden, vom Paket bis zur Webseite:
    TCP/IP, ein eigener Webserver, eine Pixelwand für die ganze Klasse. Und wie
    man Daten schützt, mit Verschlüsselung, Signaturen und einem zweiten
    Faktor bei der Anmeldung.
  entries:
    - tcpip
    - dns
    - webserver
    - pixelwand
    - crypto
    - totp

- key: databases
  compact: true
  label: Datenbanken
  icon: /images/card-file-box.png
  description: |
    Speichere, verknüpfe und durchsuche größere Datenmengen. Lerne SQL kennen,
    entwirf eine eigene Datenbank für Filme, speichere dieselben Daten
    anschließend als Graph und sieh, wie ein Programm Abfragen sicher stellt.
  entries:
    - mysql
    - sql-joins
    - sql-index
    - filmdatenbank
    - neo4j-filmdatenbank
    - bobby_tables

- key: computing
  compact: true
  label: Wie Computer rechnen
  icon: /images/computer.png
  description: |
    Ein Blick unter die Haube: eine kleine CPU programmieren, Sortierverfahren
    und Datenstrukturen selbst bauen, endliche Automaten, ein Rechner, der
    Ausdrücke versteht, und ein Routenplaner, der in echten Karten von Berlin
    den kürzesten Weg findet.
  entries:
    - sandbox-cpu
    - sandbox-sortieren
    - sandbox-datenstrukturen
    - automata
    - calculator
    - routenplaner

- key: compression
  compact: true
  label: Bilder und Kompression
  icon: /images/clamp.png
  description: |
    Daten kleiner machen, ohne etwas zu verlieren: Lauflängen, Huffman-Codes
    und LZW, jedes Verfahren selbst geschrieben. Danach Decoder in C für GIF
    und JPEG, die echte Bilddateien Byte für Byte lesen und zeigen, und
    Botschaften, die in den Pixeln eines Fotos verschwinden.
  entries:
    - rle
    - huffman
    - lzw
    - gif
    - jpeg
    - steganography

- key: terminal
  label: Terminal & Git
  icon: /images/penguin.png
  description: |
    Arbeite mit Dateien und Programmen im Terminal. Mit Git kannst du Änderungen
    an deinen Projekten nachvollziehen, frühere Stände wiederherstellen und
    gemeinsam mit anderen daran arbeiten. Und mit beidem einen Diebstahl
    aufklären.
  entries:
    - working-with-files
    - git
    - terminal-mystery

# Parked for now, so that the sections above fill rows of three (and the
# programming languages rows of four): not in the catalog, but the pages stay
# reachable by direct links (static-website links to Hugo).
- key: parked
  hidden: true
  label: Zurückgestellt
  icon: /images/bookmark.png
  entries:
    - feuerwerk
    - hugo
    - cobol
    - smalltalk

# Hidden: not in the catalog and not pinnable; the pages are found by their
# address (the Backrooms, level-0-…: by typing noclip on the 404 page).
- key: hidden
  hidden: true
  label: Verborgen
  icon: /images/bookmark.png
  entries:
    - level-0-c1d8a2f7
    - level-1-7e3a91c4
    - level-2-b52d0f18
    - level-3-4c9e6a2d

- key: programming_languages
  compact: true
  tiles: true
  description: |
    Hier findest du kurze, praktische Einführungen in verschiedene
    Programmiersprachen. Du bekommst jeweils drei Beispiele für Programme
    gezeigt, die du direkt im Workspace ausprobieren kannst: ein einfaches
    »Hello, World!«, ein Programm, das eine Zahl einliest und in ihre Primfaktoren
    zerlegt, und ein Programm, das den Bubblesort-Algorithmus demonstriert. Finde
    deine Lieblingssprache!
  label: Programmiersprachen
  icon: /images/keyboard.png
  entries:
    - fortran
    - basic
    - pascal
    - c
    - cpp
    - clisp
    # - perl
    - python
    - lua
    # - php
    - ruby
    - java
    - js
    - nasm
    - cs
    - go
    - dart
    - rust
