    extra: true
    prompt: |
      Viele Seiten nehmen ein Passwort nur, wenn es mindestens acht Zeichen hat und darin mindestens ein Kleinbuchstabe, ein Großbuchstabe und eine Ziffer vorkommen. Schreib `strong_password(password)`, die true oder false zurückgibt: `strong_password('Passwort1')` ergibt `true`. Ob so eine Regel ein Passwort wirklich sicher macht, ist eine andere Frage.
    starter: |
