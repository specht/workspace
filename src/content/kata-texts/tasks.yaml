format: 1
activity: kata-texts
tasks:
  - id: reverse-text
    title: "Rückwärts"
    level: 1
    prompt: |
      Schreib eine Funktion `reverse_text(text)`, die den Text rückwärts zurückgibt: `reverse_text('Hallo')` ergibt `'ollaH'`. Mit einer Schleife über die Buchstaben, ohne `reverse`.
    starter: |
      def reverse_text(text)
      end
    check:
      type: function
      language: ruby
      forbid: [String#reverse, Array#reverse]
      cases:
        - call: "reverse_text('Hallo')"
          expect: "'ollaH'"
        - call: "reverse_text('Anna')"
          expect: "'annA'"
        - call: "reverse_text('a b')"
          expect: "'b a'"
          say: "Auch ein Leerzeichen ist ein Zeichen und dreht sich mit."
        - call: "reverse_text('')"
          expect: "''"
          say: "Ein leerer Text bleibt leer."
        - call: "reverse_text('Workspace')"
          expect: "'ecapskroW'"
    feedback:
      - when: { same_as: "def reverse_text(text)\n  result = ''\n  text.each_char do |char|\n    result = result + char\n  end\n  result\nend\n" }
        say: "Du hängst jeden Buchstaben hinten an, so kommt derselbe Text heraus. Wohin muss der neue Buchstabe?"
    hint:
      - "`text.each_char do |char| … end` geht die Buchstaben der Reihe nach durch. Wo muss jeder neue Buchstabe im Ergebnis stehen, vorn oder hinten?"
      - "`char + result` setzt den Buchstaben vor das, was du schon hast."
    solution: |
      ```ruby
      def reverse_text(text)
        result = ''
        text.each_char do |char|
          result = char + result
        end
        result
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `reverse_text(text)`, die den Text rückwärts zurückgibt: `reverse_text('Hallo')` ergibt `'ollaH'`. Mit einer Schleife über die Buchstaben, ohne `reversed` und `[::-1]`.
      starter: |
        def reverse_text(text):
            pass
      check:
        type: function
        language: python
        forbid: [reversed]
        cases:
          - call: "reverse_text('Hallo')"
            expect: "'ollaH'"
          - call: "reverse_text('Anna')"
            expect: "'annA'"
          - call: "reverse_text('a b')"
            expect: "'b a'"
            say: "Auch ein Leerzeichen ist ein Zeichen und dreht sich mit."
          - call: "reverse_text('')"
            expect: "''"
            say: "Ein leerer Text bleibt leer."
          - call: "reverse_text('Workspace')"
            expect: "'ecapskroW'"
      feedback:
        - when: { same_as: "def reverse_text(text):\n    result = ''\n    for char in text:\n        result = result + char\n    return result\n" }
          say: "Du hängst jeden Buchstaben hinten an, so kommt derselbe Text heraus. Wohin muss der neue Buchstabe?"
      hint:
        - "`for char in text:` geht die Buchstaben der Reihe nach durch. Wo muss jeder neue Buchstabe im Ergebnis stehen, vorn oder hinten?"
        - "`char + result` setzt den Buchstaben vor das, was du schon hast."
      solution: |
        ```python
        def reverse_text(text):
            result = ''
            for char in text:
                result = char + result
            return result
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `reverseText(text)`, die den Text rückwärts zurückgibt: `reverseText('Hallo')` ergibt `'ollaH'`. Mit einer Schleife über die Buchstaben, ohne `reverse`.
      starter: |
        function reverseText(text) {
        }
      check:
        type: function
        language: javascript
        forbid: [Array.prototype.reverse, Array.prototype.toReversed]
        cases:
          - call: "reverseText('Hallo')"
            expect: "'ollaH'"
          - call: "reverseText('Anna')"
            expect: "'annA'"
          - call: "reverseText('a b')"
            expect: "'b a'"
            say: "Auch ein Leerzeichen ist ein Zeichen und dreht sich mit."
          - call: "reverseText('')"
            expect: "''"
            say: "Ein leerer Text bleibt leer."
          - call: "reverseText('Workspace')"
            expect: "'ecapskroW'"
      feedback:
        - when: { same_as: "function reverseText(text) {\n  let result = '';\n  for (const char of text) {\n    result = result + char;\n  }\n  return result;\n}\n" }
          say: "Du hängst jeden Buchstaben hinten an, so kommt derselbe Text heraus. Wohin muss der neue Buchstabe?"
      hint:
        - "`for (const char of text) { … }` geht die Buchstaben der Reihe nach durch. Wo muss jeder neue Buchstabe im Ergebnis stehen, vorn oder hinten?"
        - "`char + result` setzt den Buchstaben vor das, was du schon hast."
      solution: |
        ```javascript
        function reverseText(text) {
          let result = '';
          for (const char of text) {
            result = char + result;
          }
          return result;
        }
        ```
  - id: count-vowels
    title: "Vokale zählen"
    level: 1
    prompt: |
      Schreib eine Funktion `count_vowels(text)`, die zählt, wie viele Vokale im Text stehen, also `a`, `e`, `i`, `o` und `u`, klein oder groß: `count_vowels('Hallo Welt')` ergibt `3`.
    starter: |
      def count_vowels(text)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "count_vowels('Hallo Welt')"
          expect: "3"
        - call: "count_vowels('AEIOU')"
          expect: "5"
          say: "Große Vokale zählen auch."
        - call: "count_vowels('xyz')"
          expect: "0"
        - call: "count_vowels('')"
          expect: "0"
        - call: "count_vowels('Programmieren')"
          expect: "5"
    feedback:
      - when: { same_as: "def count_vowels(text)\n  count = 0\n  text.each_char do |char|\n    count += 1 if 'aeiou'.include?(char)\n  end\n  count\nend\n" }
        say: "In `'AEIOU'` zählt dein Code keinen Vokal. Wie wird aus einem großen Buchstaben ein kleiner?"
    hint:
      - "Geh die Buchstaben durch und zähle mit, wie bei den Schleifen. `'aeiou'.include?(char)` fragt, ob `char` ein Vokal ist."
      - "`text.downcase` macht alle Buchstaben klein; dann reicht der Vergleich mit den kleinen Vokalen."
    solution: |
      ```ruby
      def count_vowels(text)
        count = 0
        text.downcase.each_char do |char|
          count += 1 if 'aeiou'.include?(char)
        end
        count
      end
      ```
    python:
      starter: |
        def count_vowels(text):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "count_vowels('Hallo Welt')"
            expect: "3"
          - call: "count_vowels('AEIOU')"
            expect: "5"
            say: "Große Vokale zählen auch."
          - call: "count_vowels('xyz')"
            expect: "0"
          - call: "count_vowels('')"
            expect: "0"
          - call: "count_vowels('Programmieren')"
            expect: "5"
      feedback:
        - when: { same_as: "def count_vowels(text):\n    count = 0\n    for char in text:\n        if char in 'aeiou':\n            count += 1\n    return count\n" }
          say: "In `'AEIOU'` zählt dein Code keinen Vokal. Wie wird aus einem großen Buchstaben ein kleiner?"
      hint:
        - "Geh die Buchstaben durch und zähle mit, wie bei den Schleifen. `char in 'aeiou'` fragt, ob `char` ein Vokal ist."
        - "`text.lower()` macht alle Buchstaben klein; dann reicht der Vergleich mit den kleinen Vokalen."
      solution: |
        ```python
        def count_vowels(text):
            count = 0
            for char in text.lower():
                if char in 'aeiou':
                    count += 1
            return count
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `countVowels(text)`, die zählt, wie viele Vokale im Text stehen, also `a`, `e`, `i`, `o` und `u`, klein oder groß: `countVowels('Hallo Welt')` ergibt `3`.
      starter: |
        function countVowels(text) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "countVowels('Hallo Welt')"
            expect: "3"
          - call: "countVowels('AEIOU')"
            expect: "5"
            say: "Große Vokale zählen auch."
          - call: "countVowels('xyz')"
            expect: "0"
          - call: "countVowels('')"
            expect: "0"
          - call: "countVowels('Programmieren')"
            expect: "5"
      feedback:
        - when: { same_as: "function countVowels(text) {\n  let count = 0;\n  for (const char of text) {\n    if ('aeiou'.includes(char)) {\n      count++;\n    }\n  }\n  return count;\n}\n" }
          say: "In `'AEIOU'` zählt dein Code keinen Vokal. Wie wird aus einem großen Buchstaben ein kleiner?"
      hint:
        - "Geh die Buchstaben durch und zähle mit, wie bei den Schleifen. `'aeiou'.includes(char)` fragt, ob `char` ein Vokal ist."
        - "`text.toLowerCase()` macht alle Buchstaben klein; dann reicht der Vergleich mit den kleinen Vokalen."
      solution: |
        ```javascript
        function countVowels(text) {
          let count = 0;
          for (const char of text.toLowerCase()) {
            if ('aeiou'.includes(char)) {
              count++;
            }
          }
          return count;
        }
        ```
  - id: initials
    title: "Anfangsbuchstaben"
    level: 1
    prompt: |
      Schreib eine Funktion `initials(text)`, die den ersten Buchstaben jedes Wortes zurückgibt, als einen Text: `initials('Hackschule Workspace')` ergibt `'HW'`. Wörter stehen zwischen Leerzeichen, manchmal auch zwischen mehreren.
    starter: |
      def initials(text)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "initials('Hackschule Workspace')"
          expect: "'HW'"
        - call: "initials('ein kleiner Test')"
          expect: "'ekT'"
        - call: "initials('Ada')"
          expect: "'A'"
        - call: "initials('Grace  Hopper')"
          expect: "'GH'"
          say: "Zwei Leerzeichen hintereinander trennen auch nur zwei Wörter."
        - call: "initials('')"
          expect: "''"
          say: "Ein leerer Text hat keine Wörter."
    hint: "`text.split` zerlegt den Text an den Leerzeichen in eine Liste von Wörtern, auch an mehreren hintereinander. `word[0]` ist der erste Buchstabe."
    solution: |
      ```ruby
      def initials(text)
        result = ''
        text.split.each do |word|
          result += word[0]
        end
        result
      end
      ```
    python:
      starter: |
        def initials(text):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "initials('Hackschule Workspace')"
            expect: "'HW'"
          - call: "initials('ein kleiner Test')"
            expect: "'ekT'"
          - call: "initials('Ada')"
            expect: "'A'"
          - call: "initials('Grace  Hopper')"
            expect: "'GH'"
            say: "Zwei Leerzeichen hintereinander trennen auch nur zwei Wörter."
          - call: "initials('')"
            expect: "''"
            say: "Ein leerer Text hat keine Wörter."
      hint: "`text.split()` zerlegt den Text an den Leerzeichen in eine Liste von Wörtern, auch an mehreren hintereinander. `word[0]` ist der erste Buchstabe."
      solution: |
        ```python
        def initials(text):
            result = ''
            for word in text.split():
                result += word[0]
            return result
        ```
    javascript:
      starter: |
        function initials(text) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "initials('Hackschule Workspace')"
            expect: "'HW'"
          - call: "initials('ein kleiner Test')"
            expect: "'ekT'"
          - call: "initials('Ada')"
            expect: "'A'"
          - call: "initials('Grace  Hopper')"
            expect: "'GH'"
            say: "Zwei Leerzeichen hintereinander trennen auch nur zwei Wörter."
          - call: "initials('')"
            expect: "''"
            say: "Ein leerer Text hat keine Wörter."
      feedback:
        - when: { same_as: "function initials(text) {\n  let result = '';\n  for (const word of text.split(' ')) {\n    result += word[0];\n  }\n  return result;\n}\n" }
          say: "Zwischen zwei Leerzeichen liefert `split(' ')` ein leeres Wort, und sein erster Buchstabe ist `undefined`. Überspring die leeren Wörter."
      hint:
        - "`text.split(' ')` zerlegt den Text an jedem Leerzeichen in eine Liste. `word[0]` ist der erste Buchstabe."
        - "Zwischen zwei Leerzeichen steht ein leeres Wort, `''`. Das hat keinen ersten Buchstaben."
      solution: |
        ```javascript
        function initials(text) {
          let result = '';
          for (const word of text.split(' ')) {
            if (word !== '') {
              result += word[0];
            }
          }
          return result;
        }
        ```
  - id: shout
    title: "Großbuchstaben"
    level: 1
    prompt: |
      Schreib eine Funktion `shout(text)`, die jeden Kleinbuchstaben von `a` bis `z` groß macht und alles andere lässt, wie es ist: `shout('Hallo, Welt!')` ergibt `'HALLO, WELT!'`. Ohne `upcase`: Jedes Zeichen hat eine Nummer, `'A'.ord` ist 65, `'a'.ord` ist 97.
    starter: |
      def shout(text)
      end
    check:
      type: function
      language: ruby
      forbid: [String#upcase, String#capitalize, String#swapcase, String#tr]
      cases:
        - call: "shout('hallo')"
          expect: "'HALLO'"
        - call: "shout('Hallo, Welt!')"
          expect: "'HALLO, WELT!'"
          say: "Ein Komma, ein Leerzeichen und ein Großbuchstabe bleiben, wie sie sind."
        - call: "shout('123 abc')"
          expect: "'123 ABC'"
        - call: "shout('')"
          expect: "''"
        - call: "shout('xyz')"
          expect: "'XYZ'"
    feedback:
      - when: { same_as: "def shout(text)\n  result = ''\n  text.each_char do |char|\n    result += (char.ord - 32).chr\n  end\n  result\nend\n" }
        say: "Nur die Kleinbuchstaben `a` bis `z` werden groß. Was ist ein Komma minus 32?"
    hint:
      - "Ein großer Buchstabe hat eine um 32 kleinere Nummer als sein kleiner: `'a'.ord - 32` ist `'A'.ord`. `65.chr` macht aus der Nummer wieder ein Zeichen."
      - "`char >= 'a' && char <= 'z'` fragt, ob `char` ein Kleinbuchstabe ist. Nur dann rechnest du."
    solution: |
      ```ruby
      def shout(text)
        result = ''
        text.each_char do |char|
          if char >= 'a' && char <= 'z'
            result += (char.ord - 32).chr
          else
            result += char
          end
        end
        result
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `shout(text)`, die jeden Kleinbuchstaben von `a` bis `z` groß macht und alles andere lässt, wie es ist: `shout('Hallo, Welt!')` ergibt `'HALLO, WELT!'`. Ohne `upper`: Jedes Zeichen hat eine Nummer, `ord('A')` ist 65, `ord('a')` ist 97.
      starter: |
        def shout(text):
            pass
      check:
        type: function
        language: python
        forbid: [str.upper, str.capitalize, str.title, str.swapcase]
        cases:
          - call: "shout('hallo')"
            expect: "'HALLO'"
          - call: "shout('Hallo, Welt!')"
            expect: "'HALLO, WELT!'"
            say: "Ein Komma, ein Leerzeichen und ein Großbuchstabe bleiben, wie sie sind."
          - call: "shout('123 abc')"
            expect: "'123 ABC'"
          - call: "shout('')"
            expect: "''"
          - call: "shout('xyz')"
            expect: "'XYZ'"
      feedback:
        - when: { same_as: "def shout(text):\n    result = ''\n    for char in text:\n        result += chr(ord(char) - 32)\n    return result\n" }
          say: "Nur die Kleinbuchstaben `a` bis `z` werden groß. Was ist ein Komma minus 32?"
      hint:
        - "Ein großer Buchstabe hat eine um 32 kleinere Nummer als sein kleiner: `ord('a') - 32` ist `ord('A')`. `chr(65)` macht aus der Nummer wieder ein Zeichen."
        - "`'a' <= char <= 'z'` fragt, ob `char` ein Kleinbuchstabe ist. Nur dann rechnest du."
      solution: |
        ```python
        def shout(text):
            result = ''
            for char in text:
                if 'a' <= char <= 'z':
                    result += chr(ord(char) - 32)
                else:
                    result += char
            return result
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `shout(text)`, die jeden Kleinbuchstaben von `a` bis `z` groß macht und alles andere lässt, wie es ist: `shout('Hallo, Welt!')` ergibt `'HALLO, WELT!'`. Ohne `toUpperCase`: Jedes Zeichen hat eine Nummer, `'A'.charCodeAt(0)` ist 65, `'a'.charCodeAt(0)` ist 97.
      starter: |
        function shout(text) {
        }
      check:
        type: function
        language: javascript
        forbid: [String.prototype.toUpperCase, String.prototype.toLocaleUpperCase]
        cases:
          - call: "shout('hallo')"
            expect: "'HALLO'"
          - call: "shout('Hallo, Welt!')"
            expect: "'HALLO, WELT!'"
            say: "Ein Komma, ein Leerzeichen und ein Großbuchstabe bleiben, wie sie sind."
          - call: "shout('123 abc')"
            expect: "'123 ABC'"
          - call: "shout('')"
            expect: "''"
          - call: "shout('xyz')"
            expect: "'XYZ'"
      feedback:
        - when: { same_as: "function shout(text) {\n  let result = '';\n  for (const char of text) {\n    result += String.fromCharCode(char.charCodeAt(0) - 32);\n  }\n  return result;\n}\n" }
          say: "Nur die Kleinbuchstaben `a` bis `z` werden groß. Was ist ein Komma minus 32?"
      hint:
        - "Ein großer Buchstabe hat eine um 32 kleinere Nummer als sein kleiner: `'a'.charCodeAt(0) - 32` ist `'A'.charCodeAt(0)`. `String.fromCharCode(65)` macht aus der Nummer wieder ein Zeichen."
        - "`char >= 'a' && char <= 'z'` fragt, ob `char` ein Kleinbuchstabe ist. Nur dann rechnest du."
      solution: |
        ```javascript
        function shout(text) {
          let result = '';
          for (const char of text) {
            if (char >= 'a' && char <= 'z') {
              result += String.fromCharCode(char.charCodeAt(0) - 32);
            } else {
              result += char;
            }
          }
          return result;
        }
        ```
  - id: palindrome
    title: "Palindrom"
    level: 2
    prompt: |
      Ein Palindrom liest sich vorwärts wie rückwärts, wenn man nicht auf groß und klein achtet: »Anna«, »Otto«, »Reliefpfeiler«. Schreib eine Funktion `palindrome(text)`, die true oder false zurückgibt: `palindrome('Anna')` ergibt `true`.
    starter: |
      def palindrome(text)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "palindrome('Anna')"
          expect: "true"
          say: "Groß und klein zählen nicht: `'Anna'` ist ein Palindrom."
        - call: "palindrome('Otto')"
          expect: "true"
        - call: "palindrome('Hallo')"
          expect: "false"
        - call: "palindrome('Reliefpfeiler')"
          expect: "true"
        - call: "palindrome('')"
          expect: "true"
          say: "Ein leerer Text liest sich rückwärts genauso."
        - call: "palindrome('ab')"
          expect: "false"
    feedback:
      - when: { same_as: "def palindrome(text)\n  text == text.reverse\nend\n" }
        say: "`'Anna'` rückwärts ist `'annA'`, und das ist für den Vergleich ein anderer Text. Mach vorher alles klein."
    hint:
      - "Jetzt darfst du `reverse` benutzen. Vergleiche den Text mit sich selbst rückwärts."
      - "`text.downcase` macht vorher alles klein."
    solution: |
      ```ruby
      def palindrome(text)
        lower = text.downcase
        lower == lower.reverse
      end
      ```
    python:
      prompt: |
        Ein Palindrom liest sich vorwärts wie rückwärts, wenn man nicht auf groß und klein achtet: »Anna«, »Otto«, »Reliefpfeiler«. Schreib eine Funktion `palindrome(text)`, die True oder False zurückgibt: `palindrome('Anna')` ergibt `True`.
      starter: |
        def palindrome(text):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "palindrome('Anna')"
            expect: "True"
            say: "Groß und klein zählen nicht: `'Anna'` ist ein Palindrom."
          - call: "palindrome('Otto')"
            expect: "True"
          - call: "palindrome('Hallo')"
            expect: "False"
          - call: "palindrome('Reliefpfeiler')"
            expect: "True"
          - call: "palindrome('')"
            expect: "True"
            say: "Ein leerer Text liest sich rückwärts genauso."
          - call: "palindrome('ab')"
            expect: "False"
      feedback:
        - when: { same_as: "def palindrome(text):\n    return text == text[::-1]\n" }
          say: "`'Anna'` rückwärts ist `'annA'`, und das ist für den Vergleich ein anderer Text. Mach vorher alles klein."
      hint:
        - "Jetzt darfst du `[::-1]` benutzen: `text[::-1]` ist der Text rückwärts. Vergleiche ihn mit dem Text."
        - "`text.lower()` macht vorher alles klein."
      solution: |
        ```python
        def palindrome(text):
            lower = text.lower()
            return lower == lower[::-1]
        ```
    javascript:
      starter: |
        function palindrome(text) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "palindrome('Anna')"
            expect: "true"
            say: "Groß und klein zählen nicht: `'Anna'` ist ein Palindrom."
          - call: "palindrome('Otto')"
            expect: "true"
          - call: "palindrome('Hallo')"
            expect: "false"
          - call: "palindrome('Reliefpfeiler')"
            expect: "true"
          - call: "palindrome('')"
            expect: "true"
            say: "Ein leerer Text liest sich rückwärts genauso."
          - call: "palindrome('ab')"
            expect: "false"
      feedback:
        - when: { same_as: "function palindrome(text) {\n  return text === [...text].reverse().join('');\n}\n" }
          say: "`'Anna'` rückwärts ist `'annA'`, und das ist für den Vergleich ein anderer Text. Mach vorher alles klein."
      hint:
        - "Jetzt darfst du `reverse` benutzen: `[...text].reverse().join('')` ist der Text rückwärts. Vergleiche ihn mit dem Text."
        - "`text.toLowerCase()` macht vorher alles klein."
      solution: |
        ```javascript
        function palindrome(text) {
          const lower = text.toLowerCase();
          return lower === [...lower].reverse().join('');
        }
        ```
  - id: word-count
