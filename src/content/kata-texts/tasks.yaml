  - id: vigenere
    title: "Die Vigenère-Verschlüsselung"
    extra: true
    prompt: |
      Bei Caesar rückt jeder Buchstabe gleich weit. Vigenère nimmt ein Schlüsselwort aus Kleinbuchstaben: Der erste Buchstabe des Textes rückt so weit wie der erste des Schlüssels (`a` um 0, `b` um 1 …), der zweite wie der zweite, und ist der Schlüssel zu Ende, fängt er von vorn an. Was kein Buchstabe ist, bleibt und verbraucht keinen Buchstaben des Schlüssels. Schreib `vigenere(text, key)`: `vigenere('hallo welt', 'abc')` ergibt `'hbnlp yemv'`. Deine Caesar-Funktion darfst du mitbenutzen, wenn du sie hier hineinschreibst.
    starter: |
      def vigenere(text, key)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "vigenere('hallo welt', 'abc')"
          expect: "'hbnlp yemv'"
          say: "Das Leerzeichen bleibt und verbraucht keinen Buchstaben des Schlüssels."
        - call: "vigenere('Angriff im Morgengrauen', 'key')"
          expect: "'Krebmdp mk Wspqilqvyeil'"
          say: "Großbuchstaben rücken auch und bleiben groß."
        - call: "vigenere('abc', 'a')"
          expect: "'abc'"
        - call: "vigenere('zzz', 'b')"
          expect: "'aaa'"
        - call: "vigenere('Hallo!', 'zz')"
          expect: "'Gzkkn!'"
    hint:
      - "Zähl in einer eigenen Variablen mit, wie viele Buchstaben des Textes schon verschlüsselt sind: `key[i % key.length]` ist der Buchstabe des Schlüssels, der dran ist."
      - "Wie weit er rückt: `key[i % key.length].ord - 97`. Damit rufst du deine Caesar-Funktion für den einen Buchstaben auf."
    solution: |
      ```ruby
      def caesar(text, shift)
        result = ''
        text.each_char do |char|
          if char >= 'a' && char <= 'z'
            result += ((char.ord - 97 + shift) % 26 + 97).chr
          elsif char >= 'A' && char <= 'Z'
            result += ((char.ord - 65 + shift) % 26 + 65).chr
          else
            result += char
          end
        end
        result
      end

      def vigenere(text, key)
        result = ''
        i = 0
        text.each_char do |char|
          if (char >= 'a' && char <= 'z') || (char >= 'A' && char <= 'Z')
            result += caesar(char, key[i % key.length].ord - 97)
            i += 1
          else
            result += char
          end
        end
        result
      end
      ```
    python:
      starter: |
        def vigenere(text, key):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "vigenere('hallo welt', 'abc')"
            expect: "'hbnlp yemv'"
            say: "Das Leerzeichen bleibt und verbraucht keinen Buchstaben des Schlüssels."
          - call: "vigenere('Angriff im Morgengrauen', 'key')"
            expect: "'Krebmdp mk Wspqilqvyeil'"
            say: "Großbuchstaben rücken auch und bleiben groß."
          - call: "vigenere('abc', 'a')"
            expect: "'abc'"
          - call: "vigenere('zzz', 'b')"
            expect: "'aaa'"
          - call: "vigenere('Hallo!', 'zz')"
            expect: "'Gzkkn!'"
      hint:
        - "Zähl in einer eigenen Variablen mit, wie viele Buchstaben des Textes schon verschlüsselt sind: `key[i % len(key)]` ist der Buchstabe des Schlüssels, der dran ist."
        - "Wie weit er rückt: `ord(key[i % len(key)]) - 97`. Damit rufst du deine Caesar-Funktion für den einen Buchstaben auf."
      solution: |
        ```python
        def caesar(text, shift):
            result = ''
            for char in text:
                if 'a' <= char <= 'z':
                    result += chr((ord(char) - 97 + shift) % 26 + 97)
                elif 'A' <= char <= 'Z':
                    result += chr((ord(char) - 65 + shift) % 26 + 65)
                else:
                    result += char
            return result

        def vigenere(text, key):
            result = ''
            i = 0
            for char in text:
                if 'a' <= char <= 'z' or 'A' <= char <= 'Z':
                    result += caesar(char, ord(key[i % len(key)]) - 97)
                    i += 1
                else:
                    result += char
            return result
        ```
    javascript:
      starter: |
        function vigenere(text, key) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "vigenere('hallo welt', 'abc')"
            expect: "'hbnlp yemv'"
            say: "Das Leerzeichen bleibt und verbraucht keinen Buchstaben des Schlüssels."
          - call: "vigenere('Angriff im Morgengrauen', 'key')"
            expect: "'Krebmdp mk Wspqilqvyeil'"
            say: "Großbuchstaben rücken auch und bleiben groß."
          - call: "vigenere('abc', 'a')"
            expect: "'abc'"
          - call: "vigenere('zzz', 'b')"
            expect: "'aaa'"
          - call: "vigenere('Hallo!', 'zz')"
            expect: "'Gzkkn!'"
      hint:
        - "Zähl in einer eigenen Variablen mit, wie viele Buchstaben des Textes schon verschlüsselt sind: `key[i % key.length]` ist der Buchstabe des Schlüssels, der dran ist."
        - "Wie weit er rückt: `key.charCodeAt(i % key.length) - 97`. Damit rufst du deine Caesar-Funktion für den einen Buchstaben auf."
      solution: |
        ```javascript
        function caesar(text, shift) {
          let result = '';
          for (const char of text) {
            if (char >= 'a' && char <= 'z') {
              result += String.fromCharCode(((char.charCodeAt(0) - 97 + shift) % 26 + 26) % 26 + 97);
            } else if (char >= 'A' && char <= 'Z') {
              result += String.fromCharCode(((char.charCodeAt(0) - 65 + shift) % 26 + 26) % 26 + 65);
            } else {
              result += char;
            }
          }
          return result;
        }

        function vigenere(text, key) {
          let result = '';
          let i = 0;
          for (const char of text) {
            if ((char >= 'a' && char <= 'z') || (char >= 'A' && char <= 'Z')) {
              result += caesar(char, key.charCodeAt(i % key.length) - 97);
              i++;
            } else {
              result += char;
            }
          }
          return result;
        }
        ```
