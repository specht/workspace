    starter: |
      def anagram(a, b)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "anagram('Lampe', 'Palme')"
          expect: "true"
        - call: "anagram('Ampel', 'Lampe')"
          expect: "true"
        - call: "anagram('abc', 'abd')"
          expect: "false"
        - call: "anagram('aab', 'abb')"
          expect: "false"
