  - id: lru-misses
    title: "Ein kleiner Cache"
    extra: true
    prompt: |
      Ein Cache hält die letzten Seiten bereit, die jemand aufgerufen hat, höchstens `capacity` viele. Wird eine Seite verlangt, die nicht darin ist, ist das ein Fehlschlag: Sie kommt hinein, und ist der Cache voll, fliegt die, die am längsten nicht mehr verlangt wurde (»least recently used«). Schreib `lru_misses(capacity, requests)`, die die Fehlschläge zählt: `lru_misses(2, ['a', 'b', 'a', 'c', 'b'])` ergibt `4`.
    starter: |
      def lru_misses(capacity, requests)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "lru_misses(2, ['a', 'b', 'a', 'c', 'b'])"
          expect: "4"
          say: "Bei `c` fliegt `b` hinaus, denn `a` wurde gerade erst verlangt."
        - call: "lru_misses(1, ['a', 'a', 'a'])"
          expect: "1"
        - call: "lru_misses(3, [])"
          expect: "0"
        - call: "lru_misses(2, ['a', 'b', 'c', 'a', 'b', 'c'])"
          expect: "6"
        - call: "lru_misses(3, ['a', 'b', 'c', 'a', 'd', 'b', 'e', 'a'])"
          expect: "7"
    feedback:
      - when: { same_as: "def lru_misses(capacity, requests)\n  cache = []\n  misses = 0\n  requests.each do |page|\n    next if cache.include?(page)\n    misses += 1\n    cache.shift if cache.length == capacity\n    cache << page\n  end\n  misses\nend\n" }
        say: "Dein Cache wirft die Seite hinaus, die zuerst kam, auch wenn sie gerade wieder verlangt wurde. Eine verlangte Seite rückt nach hinten, zu den frischen."
    hint:
      - "Eine Liste reicht: vorn die Seite, die am längsten nicht verlangt wurde, hinten die frischeste. Wird eine Seite verlangt, kommt sie nach hinten."
      - "`cache.delete(page)` nimmt sie heraus, `cache << page` hängt sie hinten an, `cache.shift` wirft die vorderste hinaus."
    solution: |
      ```ruby
      def lru_misses(capacity, requests)
        cache = []
        misses = 0
        requests.each do |page|
          if cache.include?(page)
            cache.delete(page)
          else
            misses += 1
            cache.shift if cache.length == capacity
          end
          cache << page
        end
        misses
      end
      ```
