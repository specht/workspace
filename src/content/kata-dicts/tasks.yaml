    java:
      prompt: |
        Ein Cache hält die letzten Seiten bereit, die jemand aufgerufen hat, höchstens `capacity` viele. Wird eine Seite verlangt, die nicht darin ist, ist das ein Fehlschlag: Sie kommt hinein, und ist der Cache voll, fliegt die, die am längsten nicht mehr verlangt wurde (»least recently used«). Schreib `int lruMisses(int capacity, List<String> requests)`, die die Fehlschläge zählt: `lruMisses(2, List.of("a", "b", "a", "c", "b"))` ergibt `4`.
      starter: |
        int lruMisses(int capacity, List<String> requests) {
            return 0;
        }
      check:
        type: function
        language: java
        cases:
          - call: "lruMisses(2, List.of(\"a\", \"b\", \"a\", \"c\", \"b\"))"
            expect: "4"
            say: "Bei `c` fliegt `b` hinaus, denn `a` wurde gerade erst verlangt."
          - call: "lruMisses(1, List.of(\"a\", \"a\", \"a\"))"
            expect: "1"
          - call: "lruMisses(3, List.of())"
            expect: "0"
          - call: "lruMisses(2, List.of(\"a\", \"b\", \"c\", \"a\", \"b\", \"c\"))"
            expect: "6"
          - call: "lruMisses(3, List.of(\"a\", \"b\", \"c\", \"a\", \"d\", \"b\", \"e\", \"a\"))"
            expect: "7"
      feedback:
        - when: { same_as: "int lruMisses(int capacity, List<String> requests) {\n    List<String> cache = new ArrayList<>();\n    int misses = 0;\n    for (String page : requests) {\n        if (cache.contains(page)) {\n            continue;\n        }\n        misses++;\n        if (cache.size() == capacity) {\n            cache.remove(0);\n        }\n        cache.add(page);\n    }\n    return misses;\n}\n" }
          say: "Dein Cache wirft die Seite hinaus, die zuerst kam, auch wenn sie gerade wieder verlangt wurde. Eine verlangte Seite rückt nach hinten, zu den frischen."
      hint:
        - "Eine Liste reicht: vorn die Seite, die am längsten nicht verlangt wurde, hinten die frischeste. Wird eine Seite verlangt, kommt sie nach hinten."
        - "`cache.remove(page)` nimmt sie heraus und sagt mit `true`, ob sie darin war; `cache.add(page)` hängt sie hinten an, `cache.remove(0)` wirft die vorderste hinaus."
      solution: |
        ```java
        int lruMisses(int capacity, List<String> requests) {
            List<String> cache = new ArrayList<>();
            int misses = 0;
            for (String page : requests) {
                if (!cache.remove(page)) {
                    misses++;
                    if (cache.size() == capacity) {
                        cache.remove(0);
                    }
                }
                cache.add(page);
            }
            return misses;
        }
        ```

