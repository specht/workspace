      solution: |
        ```dart
        int lruMisses(int capacity, List<String> requests) {
          final cache = <String>[];
          var misses = 0;
          for (final page in requests) {
            if (!cache.remove(page)) {
              misses++;
              if (cache.length == capacity) {
                cache.removeAt(0);
              }
            }
            cache.add(page);
