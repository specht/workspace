  - id: phone-number
    title: "Im Telefonbuch"
    level: 1
    prompt: |
      Ein Telefonbuch ordnet jedem Namen eine Nummer zu: `{'Ada' => '030 1815', 'Alan' => '040 1912', 'Grace' => '089 1906'}`. Schreib eine Funktion `phone_number(book, name)`, die die Nummer zurückgibt, und `'unbekannt'`, wenn der Name nicht darin steht: `phone_number(book, 'Ada')` ergibt `'030 1815'`.
    starter: |
      def phone_number(book, name)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "phone_number({'Ada' => '030 1815', 'Alan' => '040 1912', 'Grace' => '089 1906'}, 'Ada')"
          expect: "'030 1815'"
        - call: "phone_number({'Ada' => '030 1815', 'Alan' => '040 1912', 'Grace' => '089 1906'}, 'Grace')"
          expect: "'089 1906'"
        - call: "phone_number({'Ada' => '030 1815', 'Alan' => '040 1912', 'Grace' => '089 1906'}, 'Linus')"
          expect: "'unbekannt'"
          say: "Steht der Name nicht im Telefonbuch, kommt `'unbekannt'` zurück."
        - call: "phone_number({}, 'Ada')"
          expect: "'unbekannt'"
        - call: "phone_number({'Ada' => '030 1815', 'Alan' => '040 1912', 'Grace' => '089 1906'}, 'ada')"
          expect: "'unbekannt'"
          say: "Groß und klein zählen hier: `'ada'` steht nicht darin."
    feedback:
      - when: { same_as: "def phone_number(book, name)\n  book[name]\nend\n" }
        say: "Steht ein Name nicht darin, gibt `book[name]` `nil` zurück. Frag vorher mit `book.key?(name)`, ob er darin steht."
    hint:
      - "`book['Ada']` ist die Nummer, die zum Schlüssel `'Ada'` gehört."
      - "`book.key?(name)` fragt, ob der Name darin steht."
    solution: |
      ```ruby
      def phone_number(book, name)
        if book.key?(name)
          book[name]
        else
          'unbekannt'
        end
      end
      ```
    python:
      prompt: |
        Ein Telefonbuch ordnet jedem Namen eine Nummer zu: `{'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}`. Schreib eine Funktion `phone_number(book, name)`, die die Nummer zurückgibt, und `'unbekannt'`, wenn der Name nicht darin steht: `phone_number(book, 'Ada')` ergibt `'030 1815'`.
      starter: |
        def phone_number(book, name):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "phone_number({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'Ada')"
            expect: "'030 1815'"
          - call: "phone_number({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'Grace')"
            expect: "'089 1906'"
          - call: "phone_number({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'Linus')"
            expect: "'unbekannt'"
            say: "Steht der Name nicht im Telefonbuch, kommt `'unbekannt'` zurück."
          - call: "phone_number({}, 'Ada')"
            expect: "'unbekannt'"
          - call: "phone_number({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'ada')"
            expect: "'unbekannt'"
            say: "Groß und klein zählen hier: `'ada'` steht nicht darin."
      feedback:
        - when: { same_as: "def phone_number(book, name):\n    return book.get(name)\n" }
          say: "Steht ein Name nicht darin, gibt `book.get(name)` `None` zurück. Frag vorher mit `name in book`, ob er darin steht."
      hint:
        - "`book['Ada']` ist die Nummer, die zum Schlüssel `'Ada'` gehört."
        - "`name in book` fragt, ob der Name darin steht."
      solution: |
        ```python
        def phone_number(book, name):
            if name in book:
                return book[name]
            return 'unbekannt'
        ```
    javascript:
      prompt: |
        Ein Telefonbuch ordnet jedem Namen eine Nummer zu: `{'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}`. Schreib eine Funktion `phoneNumber(book, name)`, die die Nummer zurückgibt, und `'unbekannt'`, wenn der Name nicht darin steht: `phoneNumber(book, 'Ada')` ergibt `'030 1815'`.
      starter: |
        function phoneNumber(book, name) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "phoneNumber({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'Ada')"
            expect: "'030 1815'"
          - call: "phoneNumber({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'Grace')"
            expect: "'089 1906'"
          - call: "phoneNumber({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'Linus')"
            expect: "'unbekannt'"
            say: "Steht der Name nicht im Telefonbuch, kommt `'unbekannt'` zurück."
          - call: "phoneNumber({}, 'Ada')"
            expect: "'unbekannt'"
          - call: "phoneNumber({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'ada')"
            expect: "'unbekannt'"
            say: "Groß und klein zählen hier: `'ada'` steht nicht darin."
      feedback:
        - when: { same_as: "function phoneNumber(book, name) {\n  return book[name];\n}\n" }
          say: "Steht ein Name nicht darin, gibt `book[name]` `undefined` zurück. Frag vorher mit `name in book`, ob er darin steht."
      hint:
        - "`book['Ada']` ist die Nummer, die zum Schlüssel `'Ada'` gehört."
        - "`name in book` fragt, ob der Name darin steht."
      solution: |
        ```javascript
        function phoneNumber(book, name) {
          if (name in book) {
            return book[name];
          }
          return 'unbekannt';
        }
        ```
  - id: count-items
    title: "Strichliste"
    level: 1
    prompt: |
      Schreib eine Funktion `count_items(items)`, die zählt, wie oft jedes Element in der Liste steht, und das als Hash zurückgibt: `count_items(['Apfel', 'Birne', 'Apfel'])` ergibt `{'Apfel' => 2, 'Birne' => 1}`. Ohne `tally` und `group_by`.
    starter: |
      def count_items(items)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#tally, Array#group_by, Array#count]
      cases:
        - call: "count_items(['Apfel', 'Birne', 'Apfel'])"
          expect: "{'Apfel' => 2, 'Birne' => 1}"
        - call: "count_items([])"
          expect: "{}"
          say: "Eine leere Liste gibt ein leeres Ergebnis."
        - call: "count_items(['a', 'a', 'a'])"
          expect: "{'a' => 3}"
          say: "Kommt ein Element wieder, zählst du weiter."
        - call: "count_items([3, 1, 3, 3])"
          expect: "{3 => 3, 1 => 1}"
          say: "Auch Zahlen lassen sich zählen."
    feedback:
      - when: { same_as: "def count_items(items)\n  counts = {}\n  items.each do |item|\n    counts[item] = 1\n  end\n  counts\nend\n" }
        say: "Kommt ein Element ein zweites Mal, fängt dein Code wieder bei 1 an. Zähl weiter, wo du warst."
    hint:
      - "Fang mit einem leeren Hash an, `{}`. Für jedes Element erhöhst du seinen Zähler um 1."
      - "Beim ersten Mal hat das Element noch keinen Zähler: `counts.fetch(item, 0)` ist dann 0."
    solution: |
      ```ruby
      def count_items(items)
        counts = {}
        items.each do |item|
          counts[item] = counts.fetch(item, 0) + 1
        end
        counts
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `count_items(items)`, die zählt, wie oft jedes Element in der Liste steht, und das als Dictionary zurückgibt: `count_items(['Apfel', 'Birne', 'Apfel'])` ergibt `{'Apfel': 2, 'Birne': 1}`. Ohne `Counter`.
      starter: |
        def count_items(items):
            pass
      check:
        type: function
        language: python
        forbid: [list.count]
        cases:
          - call: "count_items(['Apfel', 'Birne', 'Apfel'])"
            expect: "{'Apfel': 2, 'Birne': 1}"
          - call: "count_items([])"
            expect: "{}"
            say: "Eine leere Liste gibt ein leeres Ergebnis."
          - call: "count_items(['a', 'a', 'a'])"
            expect: "{'a': 3}"
            say: "Kommt ein Element wieder, zählst du weiter."
          - call: "count_items([3, 1, 3, 3])"
            expect: "{3: 3, 1: 1}"
            say: "Auch Zahlen lassen sich zählen."
      feedback:
        - when: { same_as: "def count_items(items):\n    counts = {}\n    for item in items:\n        counts[item] = 1\n    return counts\n" }
          say: "Kommt ein Element ein zweites Mal, fängt dein Code wieder bei 1 an. Zähl weiter, wo du warst."
      hint:
        - "Fang mit einem leeren Dictionary an, `{}`. Für jedes Element erhöhst du seinen Zähler um 1."
        - "Beim ersten Mal hat das Element noch keinen Zähler: `counts.get(item, 0)` ist dann 0."
      solution: |
        ```python
        def count_items(items):
            counts = {}
            for item in items:
                counts[item] = counts.get(item, 0) + 1
            return counts
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `countItems(items)`, die zählt, wie oft jedes Element in der Liste steht, und das als Objekt zurückgibt: `countItems(['Apfel', 'Birne', 'Apfel'])` ergibt `{'Apfel': 2, 'Birne': 1}`. Ohne `Object.groupBy`.
      starter: |
        function countItems(items) {
        }
      check:
        type: function
        language: javascript
        forbid: [Object.groupBy, Map.groupBy]
        cases:
          - call: "countItems(['Apfel', 'Birne', 'Apfel'])"
            expect: "{'Apfel': 2, 'Birne': 1}"
          - call: "countItems([])"
            expect: "{}"
            say: "Eine leere Liste gibt ein leeres Ergebnis."
          - call: "countItems(['a', 'a', 'a'])"
            expect: "{'a': 3}"
            say: "Kommt ein Element wieder, zählst du weiter."
          - call: "countItems([3, 1, 3, 3])"
            expect: "{3: 3, 1: 1}"
            say: "Auch Zahlen lassen sich zählen."
      feedback:
        - when: { same_as: "function countItems(items) {\n  const counts = {};\n  for (const item of items) {\n    counts[item] = 1;\n  }\n  return counts;\n}\n" }
          say: "Kommt ein Element ein zweites Mal, fängt dein Code wieder bei 1 an. Zähl weiter, wo du warst."
      hint:
        - "Fang mit einem leeren Objekt an, `{}`. Für jedes Element erhöhst du seinen Zähler um 1."
        - "Beim ersten Mal hat das Element noch keinen Zähler: `counts[item]` ist dann `undefined`, und `counts[item] || 0` ist 0."
      solution: |
        ```javascript
        function countItems(items) {
          const counts = {};
          for (const item of items) {
            counts[item] = (counts[item] || 0) + 1;
          }
          return counts;
        }
        ```
  - id: total-price
    title: "Was kostet der Einkauf?"
    level: 1
    prompt: |
      Im Schulkiosk hat alles seinen Preis, in Cent: `{'Brötchen' => 50, 'Brezel' => 80, 'Saft' => 150}`. Schreib eine Funktion `total_price(prices, cart)`, die zusammenrechnet, was die Liste `cart` kostet: `total_price(prices, ['Brezel', 'Saft', 'Brezel'])` ergibt `310`.
    starter: |
      def total_price(prices, cart)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "total_price({'Brötchen' => 50, 'Brezel' => 80, 'Saft' => 150}, ['Brezel', 'Saft', 'Brezel'])"
          expect: "310"
        - call: "total_price({'Brötchen' => 50, 'Brezel' => 80, 'Saft' => 150}, [])"
          expect: "0"
          say: "Ein leerer Einkauf kostet nichts."
        - call: "total_price({'Brötchen' => 50, 'Brezel' => 80, 'Saft' => 150}, ['Saft'])"
          expect: "150"
        - call: "total_price({'Brötchen' => 50, 'Brezel' => 80, 'Saft' => 150}, ['Brötchen', 'Brötchen', 'Brötchen', 'Brötchen'])"
          expect: "200"
          say: "Was mehrmals im Einkauf steht, zählt mehrmals."
    feedback:
      - when: { same_as: "def total_price(prices, cart)\n  total = 0\n  prices.each do |item, price|\n    total += price if cart.include?(item)\n  end\n  total\nend\n" }
        say: "Du gehst die Preisliste durch und zählst jedes Produkt einmal. Geh den Einkauf durch: Was zweimal darin steht, kostet zweimal."
    hint: "Geh den Einkauf durch, nicht die Preisliste. `prices['Saft']` ist der Preis eines Safts."
    solution: |
      ```ruby
      def total_price(prices, cart)
        total = 0
        cart.each do |item|
          total += prices[item]
        end
        total
      end
      ```
    python:
      prompt: |
        Im Schulkiosk hat alles seinen Preis, in Cent: `{'Brötchen': 50, 'Brezel': 80, 'Saft': 150}`. Schreib eine Funktion `total_price(prices, cart)`, die zusammenrechnet, was die Liste `cart` kostet: `total_price(prices, ['Brezel', 'Saft', 'Brezel'])` ergibt `310`.
      starter: |
        def total_price(prices, cart):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "total_price({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, ['Brezel', 'Saft', 'Brezel'])"
            expect: "310"
          - call: "total_price({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, [])"
            expect: "0"
            say: "Ein leerer Einkauf kostet nichts."
          - call: "total_price({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, ['Saft'])"
            expect: "150"
          - call: "total_price({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, ['Brötchen', 'Brötchen', 'Brötchen', 'Brötchen'])"
            expect: "200"
            say: "Was mehrmals im Einkauf steht, zählt mehrmals."
      feedback:
        - when: { same_as: "def total_price(prices, cart):\n    total = 0\n    for item, price in prices.items():\n        if item in cart:\n            total += price\n    return total\n" }
          say: "Du gehst die Preisliste durch und zählst jedes Produkt einmal. Geh den Einkauf durch: Was zweimal darin steht, kostet zweimal."
      hint: "Geh den Einkauf durch, nicht die Preisliste. `prices['Saft']` ist der Preis eines Safts."
      solution: |
