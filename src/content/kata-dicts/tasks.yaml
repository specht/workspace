  - id: averages
    title: "Der Durchschnitt je Fach"
    level: 3
    prompt: |
      `grades` ist eine Liste von Noten, jede als Paar aus Fach und Note: `[['Mathe', 2], ['Kunst', 1], ['Mathe', 3]]`. Schreib eine Funktion `averages(grades)`, die für jedes Fach den Durchschnitt seiner Noten zurückgibt: Für diese Liste ergibt es `{'Mathe' => 2.5, 'Kunst' => 1.0}`.
    starter: |
      def averages(grades)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "averages([['Mathe', 2], ['Kunst', 1], ['Mathe', 3]])"
          expect: "{'Mathe' => 2.5, 'Kunst' => 1.0}"
        - call: "averages([])"
          expect: "{}"
        - call: "averages([['Musik', 1], ['Musik', 2]])"
          expect: "{'Musik' => 1.5}"
          say: "Der Durchschnitt von 1 und 2 ist 1.5, nicht 1."
        - call: "averages([['Deutsch', 4], ['Sport', 1], ['Deutsch', 2], ['Deutsch', 3]])"
          expect: "{'Deutsch' => 3.0, 'Sport' => 1.0}"
    feedback:
      - when: { same_as: "def averages(grades)\n  sums = {}\n  counts = {}\n  grades.each do |subject, grade|\n    sums[subject] = sums.fetch(subject, 0) + grade\n    counts[subject] = counts.fetch(subject, 0) + 1\n  end\n  result = {}\n  sums.each do |subject, sum|\n    result[subject] = sum / counts[subject]\n  end\n  result\nend\n" }
        say: "In Ruby ist `3 / 2` gleich `1`: Zwei ganze Zahlen geteilt ergeben eine ganze. Mach eine davon zur Kommazahl, `sum.to_f`."
    hint:
      - "Für den Durchschnitt brauchst du je Fach zwei Zahlen: die Summe der Noten und wie viele es sind. Zwei Hashes, oder einer mit Paaren."
      - "`grades.each do |subject, grade| … end` nimmt jedes Paar gleich auseinander. Am Ende teilst du je Fach die Summe durch die Anzahl."
    solution: |
      ```ruby
      def averages(grades)
        sums = {}
        counts = {}
        grades.each do |subject, grade|
          sums[subject] = sums.fetch(subject, 0) + grade
          counts[subject] = counts.fetch(subject, 0) + 1
        end
        result = {}
        sums.each do |subject, sum|
          result[subject] = sum.to_f / counts[subject]
        end
        result
      end
      ```
    python:
