        - "Eine Liste reicht: vorn die Seite, die am längsten nicht verlangt wurde, hinten die frischeste. Wird eine Seite verlangt, kommt sie nach hinten."
        - "`cache.splice(i, 1)` nimmt sie heraus, `cache.push(page)` hängt sie hinten an, `cache.shift()` wirft die vorderste hinaus."
      solution: |
        ```javascript
        function lruMisses(capacity, requests) {
          const cache = [];
          let misses = 0;
          for (const page of requests) {
            const i = cache.indexOf(page);
            if (i >= 0) {
              cache.splice(i, 1);
            } else {
              misses++;
              if (cache.length === capacity) {
                cache.shift();
              }
            }
            cache.push(page);
          }
          return misses;
        }
