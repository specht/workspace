            expect: "Map.of(\"Mathe\", 2.5, \"Kunst\", 1.0)"
          - call: "averages(List.of())"
            expect: "Map.of()"
          - call: "averages(List.of(Map.entry(\"Musik\", 1), Map.entry(\"Musik\", 2)))"
            expect: "Map.of(\"Musik\", 1.5)"
