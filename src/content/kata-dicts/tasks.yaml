          expect: "{'a' => 2, 'n' => 2}"
          say: "Groß und klein zählen gemeinsam."
        - call: "letter_count('')"
          expect: "{}"
        - call: "letter_count('Hallo Welt')"
          expect: "{'h' => 1, 'a' => 1, 'l' => 3, 'o' => 1, 'w' => 1, 'e' => 1, 't' => 1}"
          say: "Ein Leerzeichen ist kein Buchstabe."
        - call: "letter_count('123')"
          expect: "{}"
        - call: "letter_count('Zz')"
          expect: "{'z' => 2}"
    feedback:
      - when: { same_as: "def letter_count(text)\n  counts = {}\n  text.each_char do |char|\n    next unless (char >= 'a' && char <= 'z') || (char >= 'A' && char <= 'Z')\n    counts[char] = counts.fetch(char, 0) + 1\n  end\n  counts\nend\n" }
