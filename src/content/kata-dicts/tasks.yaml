            expect: "7"
      feedback:
        - when: { same_as: "def lru_misses(capacity, requests):\n    cache = []\n    misses = 0\n    for page in requests:\n        if page in cache:\n            continue\n        misses += 1\n        if len(cache) == capacity:\n            cache.pop(0)\n        cache.append(page)\n    return misses\n" }
          say: "Dein Cache wirft die Seite hinaus, die zuerst kam, auch wenn sie gerade wieder verlangt wurde. Eine verlangte Seite rückt nach hinten, zu den frischen."
      hint:
        - "Eine Liste reicht: vorn die Seite, die am längsten nicht verlangt wurde, hinten die frischeste. Wird eine Seite verlangt, kommt sie nach hinten."
        - "`cache.remove(page)` nimmt sie heraus, `cache.append(page)` hängt sie hinten an, `cache.pop(0)` wirft die vorderste hinaus."
      solution: |
        ```python
        def lru_misses(capacity, requests):
            cache = []
            misses = 0
            for page in requests:
                if page in cache:
                    cache.remove(page)
                else:
                    misses += 1
                    if len(cache) == capacity:
                        cache.pop(0)
                cache.append(page)
            return misses
