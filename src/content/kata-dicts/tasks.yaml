          say: "In Java ist `3 / 2` gleich `1`: Zwei ganze Zahlen geteilt ergeben eine ganze, und das `(double)` danach macht daraus nur noch `1.0`. Mach eine davon vor dem Teilen zur Kommazahl: `(double) sum / count`."
