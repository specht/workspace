    dart:
      prompt: |
        Ein Telefonbuch ordnet jedem Namen eine Nummer zu: `{'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}`. Schreib eine Funktion `String phoneNumber(Map<String, String> book, String name)`, die die Nummer zurückgibt, und `'unbekannt'`, wenn der Name nicht darin steht: `phoneNumber(book, 'Ada')` ergibt `'030 1815'`.
      starter: |
        String phoneNumber(Map<String, String> book, String name) {
          return '';
        }
      check:
        type: function
        language: dart
        cases:
          - call: "phoneNumber({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'Ada')"
            expect: "'030 1815'"
          - call: "phoneNumber({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'Grace')"
            expect: "'089 1906'"
          - call: "phoneNumber({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'Linus')"
            expect: "'unbekannt'"
            say: "Steht der Name nicht im Telefonbuch, kommt `'unbekannt'` zurück."
          - call: "phoneNumber({}, 'Ada')"
            expect: "'unbekannt'"
          - call: "phoneNumber({'Ada': '030 1815', 'Alan': '040 1912', 'Grace': '089 1906'}, 'ada')"
            expect: "'unbekannt'"
            say: "Groß und klein zählen hier: `'ada'` steht nicht darin."
      feedback:
        - when: { same_as: "String phoneNumber(Map<String, String> book, String name) {\n  return book[name]!;\n}\n" }
          say: "Steht ein Name nicht darin, ist `book[name]` `null`, und das `!` bricht dann ab. Frag vorher mit `book.containsKey(name)`, ob er darin steht."
      hint:
        - "`book['Ada']` ist die Nummer, die zum Schlüssel `'Ada'` gehört, oder `null`, wenn es ihn nicht gibt."
        - "`book.containsKey(name)` fragt, ob der Name darin steht. Kürzer: `book[name] ?? 'unbekannt'` nimmt den Text rechts, wenn links `null` steht."
      solution: |
        ```dart
        String phoneNumber(Map<String, String> book, String name) {
          if (book.containsKey(name)) {
            return book[name]!;
          }
          return 'unbekannt';
        }
        ```
    java:
      prompt: |
        Ein Telefonbuch ordnet jedem Namen eine Nummer zu: `Map.of("Ada", "030 1815", "Alan", "040 1912", "Grace", "089 1906")`. Schreib eine Methode `String phoneNumber(Map<String, String> book, String name)`, die die Nummer zurückgibt, und `"unbekannt"`, wenn der Name nicht darin steht: `phoneNumber(book, "Ada")` ergibt `"030 1815"`.
      starter: |
        String phoneNumber(Map<String, String> book, String name) {
            return "";
        }
      check:
        type: function
        language: java
        cases:
          - call: "phoneNumber(Map.of(\"Ada\", \"030 1815\", \"Alan\", \"040 1912\", \"Grace\", \"089 1906\"), \"Ada\")"
            expect: "\"030 1815\""
          - call: "phoneNumber(Map.of(\"Ada\", \"030 1815\", \"Alan\", \"040 1912\", \"Grace\", \"089 1906\"), \"Grace\")"
            expect: "\"089 1906\""
          - call: "phoneNumber(Map.of(\"Ada\", \"030 1815\", \"Alan\", \"040 1912\", \"Grace\", \"089 1906\"), \"Linus\")"
            expect: "\"unbekannt\""
            say: "Steht der Name nicht im Telefonbuch, kommt `\"unbekannt\"` zurück."
          - call: "phoneNumber(Map.of(), \"Ada\")"
            expect: "\"unbekannt\""
          - call: "phoneNumber(Map.of(\"Ada\", \"030 1815\", \"Alan\", \"040 1912\", \"Grace\", \"089 1906\"), \"ada\")"
            expect: "\"unbekannt\""
            say: "Groß und klein zählen hier: `\"ada\"` steht nicht darin."
      feedback:
        - when: { same_as: "String phoneNumber(Map<String, String> book, String name) {\n    return book.get(name);\n}\n" }
          say: "Steht ein Name nicht darin, gibt `book.get(name)` `null` zurück. Frag vorher mit `book.containsKey(name)`, ob er darin steht."
      hint:
        - "`book.get(\"Ada\")` ist die Nummer, die zum Schlüssel `\"Ada\"` gehört, oder `null`, wenn es ihn nicht gibt."
        - "`book.containsKey(name)` fragt, ob der Name darin steht. Kürzer: `book.getOrDefault(name, \"unbekannt\")`."
      solution: |
        ```java
        String phoneNumber(Map<String, String> book, String name) {
            if (book.containsKey(name)) {
                return book.get(name);
            }
            return "unbekannt";
        }
        ```

  - id: count-items
    title: "Strichliste"
    level: 1
    prompt: |
      Schreib eine Funktion `count_items(items)`, die zählt, wie oft jedes Element in der Liste steht, und das als Hash zurückgibt: `count_items(['Apfel', 'Birne', 'Apfel'])` ergibt `{'Apfel' => 2, 'Birne' => 1}`. Ohne `tally` und `group_by`.
    starter: |
      def count_items(items)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#tally, Array#group_by, Array#count]
      cases:
        - call: "count_items(['Apfel', 'Birne', 'Apfel'])"
          expect: "{'Apfel' => 2, 'Birne' => 1}"
        - call: "count_items([])"
          expect: "{}"
          say: "Eine leere Liste gibt ein leeres Ergebnis."
        - call: "count_items(['a', 'a', 'a'])"
          expect: "{'a' => 3}"
          say: "Kommt ein Element wieder, zählst du weiter."
        - call: "count_items([3, 1, 3, 3])"
          expect: "{3 => 3, 1 => 1}"
          say: "Auch Zahlen lassen sich zählen."
    feedback:
      - when: { same_as: "def count_items(items)\n  counts = {}\n  items.each do |item|\n    counts[item] = 1\n  end\n  counts\nend\n" }
        say: "Kommt ein Element ein zweites Mal, fängt dein Code wieder bei 1 an. Zähl weiter, wo du warst."
    hint:
      - "Fang mit einem leeren Hash an, `{}`. Für jedes Element erhöhst du seinen Zähler um 1."
      - "Beim ersten Mal hat das Element noch keinen Zähler: `counts.fetch(item, 0)` ist dann 0."
    solution: |
      ```ruby
      def count_items(items)
        counts = {}
        items.each do |item|
          counts[item] = counts.fetch(item, 0) + 1
        end
        counts
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `count_items(items)`, die zählt, wie oft jedes Element in der Liste steht, und das als Dictionary zurückgibt: `count_items(['Apfel', 'Birne', 'Apfel'])` ergibt `{'Apfel': 2, 'Birne': 1}`. Ohne `Counter`.
      starter: |
        def count_items(items):
            pass
      check:
        type: function
        language: python
        forbid: [list.count]
        cases:
          - call: "count_items(['Apfel', 'Birne', 'Apfel'])"
            expect: "{'Apfel': 2, 'Birne': 1}"
          - call: "count_items([])"
            expect: "{}"
            say: "Eine leere Liste gibt ein leeres Ergebnis."
          - call: "count_items(['a', 'a', 'a'])"
            expect: "{'a': 3}"
            say: "Kommt ein Element wieder, zählst du weiter."
          - call: "count_items([3, 1, 3, 3])"
            expect: "{3: 3, 1: 1}"
            say: "Auch Zahlen lassen sich zählen."
      feedback:
        - when: { same_as: "def count_items(items):\n    counts = {}\n    for item in items:\n        counts[item] = 1\n    return counts\n" }
          say: "Kommt ein Element ein zweites Mal, fängt dein Code wieder bei 1 an. Zähl weiter, wo du warst."
      hint:
        - "Fang mit einem leeren Dictionary an, `{}`. Für jedes Element erhöhst du seinen Zähler um 1."
        - "Beim ersten Mal hat das Element noch keinen Zähler: `counts.get(item, 0)` ist dann 0."
      solution: |
        ```python
        def count_items(items):
            counts = {}
            for item in items:
                counts[item] = counts.get(item, 0) + 1
            return counts
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `countItems(items)`, die zählt, wie oft jedes Element in der Liste steht, und das als Objekt zurückgibt: `countItems(['Apfel', 'Birne', 'Apfel'])` ergibt `{'Apfel': 2, 'Birne': 1}`. Ohne `Object.groupBy`.
      starter: |
        function countItems(items) {
        }
      check:
        type: function
        language: javascript
        forbid: [Object.groupBy, Map.groupBy]
        cases:
          - call: "countItems(['Apfel', 'Birne', 'Apfel'])"
            expect: "{'Apfel': 2, 'Birne': 1}"
          - call: "countItems([])"
            expect: "{}"
            say: "Eine leere Liste gibt ein leeres Ergebnis."
          - call: "countItems(['a', 'a', 'a'])"
            expect: "{'a': 3}"
            say: "Kommt ein Element wieder, zählst du weiter."
          - call: "countItems([3, 1, 3, 3])"
            expect: "{3: 3, 1: 1}"
            say: "Auch Zahlen lassen sich zählen."
      feedback:
        - when: { same_as: "function countItems(items) {\n  const counts = {};\n  for (const item of items) {\n    counts[item] = 1;\n  }\n  return counts;\n}\n" }
          say: "Kommt ein Element ein zweites Mal, fängt dein Code wieder bei 1 an. Zähl weiter, wo du warst."
      hint:
        - "Fang mit einem leeren Objekt an, `{}`. Für jedes Element erhöhst du seinen Zähler um 1."
        - "Beim ersten Mal hat das Element noch keinen Zähler: `counts[item]` ist dann `undefined`, und `counts[item] || 0` ist 0."
      solution: |
        ```javascript
        function countItems(items) {
          const counts = {};
          for (const item of items) {
            counts[item] = (counts[item] || 0) + 1;
          }
          return counts;
        }
        ```
    dart:
      prompt: |
        Schreib eine Funktion `Map<Object, int> countItems(List<Object> items)`, die zählt, wie oft jedes Element in der Liste steht, und das als Map zurückgibt: `countItems(['Apfel', 'Birne', 'Apfel'])` ergibt `{'Apfel': 2, 'Birne': 1}`.
      starter: |
        Map<Object, int> countItems(List<Object> items) {
          return {};
        }
      check:
        type: function
        language: dart
        forbid: [.fold, .where]
        cases:
          - call: "countItems(['Apfel', 'Birne', 'Apfel'])"
            expect: "{'Apfel': 2, 'Birne': 1}"
          - call: "countItems([])"
            expect: "{}"
            say: "Eine leere Liste gibt ein leeres Ergebnis."
          - call: "countItems(['a', 'a', 'a'])"
            expect: "{'a': 3}"
            say: "Kommt ein Element wieder, zählst du weiter."
          - call: "countItems([3, 1, 3, 3])"
            expect: "{3: 3, 1: 1}"
            say: "Auch Zahlen lassen sich zählen."
      feedback:
        - when: { same_as: "Map<Object, int> countItems(List<Object> items) {\n  final counts = <Object, int>{};\n  for (final item in items) {\n    counts[item] = 1;\n  }\n  return counts;\n}\n" }
          say: "Kommt ein Element ein zweites Mal, fängt dein Code wieder bei 1 an. Zähl weiter, wo du warst."
      hint:
        - "Fang mit einer leeren Map an, `<Object, int>{}`. Für jedes Element erhöhst du seinen Zähler um 1."
        - "Beim ersten Mal hat das Element noch keinen Zähler: `counts[item]` ist dann `null`, und `counts[item] ?? 0` ist 0."
      solution: |
        ```dart
        Map<Object, int> countItems(List<Object> items) {
          final counts = <Object, int>{};
          for (final item in items) {
            counts[item] = (counts[item] ?? 0) + 1;
          }
          return counts;
        }
        ```
    java:
      prompt: |
        Schreib eine Methode `Map<String, Integer> countItems(List<String> items)`, die zählt, wie oft jedes Element in der Liste steht, und das als Map zurückgibt: `countItems(List.of("Apfel", "Birne", "Apfel"))` ergibt `{Apfel=2, Birne=1}`. Ohne Streams.
      starter: |
        Map<String, Integer> countItems(List<String> items) {
            return new HashMap<>();
        }
      check:
        type: function
        language: java
        forbid: [.stream, Collectors, Collections.frequency]
        cases:
          - call: "countItems(List.of(\"Apfel\", \"Birne\", \"Apfel\"))"
            expect: "Map.of(\"Apfel\", 2, \"Birne\", 1)"
          - call: "countItems(List.of())"
            expect: "Map.of()"
            say: "Eine leere Liste gibt ein leeres Ergebnis."
          - call: "countItems(List.of(\"a\", \"a\", \"a\"))"
            expect: "Map.of(\"a\", 3)"
            say: "Kommt ein Element wieder, zählst du weiter."
          - call: "countItems(List.of(\"rot\", \"blau\", \"rot\", \"rot\"))"
            expect: "Map.of(\"rot\", 3, \"blau\", 1)"
      feedback:
        - when: { same_as: "Map<String, Integer> countItems(List<String> items) {\n    Map<String, Integer> counts = new HashMap<>();\n    for (String item : items) {\n        counts.put(item, 1);\n    }\n    return counts;\n}\n" }
          say: "Kommt ein Element ein zweites Mal, fängt dein Code wieder bei 1 an. Zähl weiter, wo du warst."
      hint:
        - "Fang mit einer leeren Map an, `new HashMap<>()`. Für jedes Element erhöhst du seinen Zähler um 1."
        - "Beim ersten Mal hat das Element noch keinen Zähler: `counts.getOrDefault(item, 0)` ist dann 0. `counts.put(item, …)` schreibt den neuen Zähler hinein."
      solution: |
        ```java
        Map<String, Integer> countItems(List<String> items) {
            Map<String, Integer> counts = new HashMap<>();
            for (String item : items) {
                counts.put(item, counts.getOrDefault(item, 0) + 1);
            }
            return counts;
        }
        ```

  - id: total-price
    title: "Was kostet der Einkauf?"
    level: 1
    prompt: |
      Im Schulkiosk hat alles seinen Preis, in Cent: `{'Brötchen' => 50, 'Brezel' => 80, 'Saft' => 150}`. Schreib eine Funktion `total_price(prices, cart)`, die zusammenrechnet, was die Liste `cart` kostet: `total_price(prices, ['Brezel', 'Saft', 'Brezel'])` ergibt `310`.
    starter: |
      def total_price(prices, cart)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "total_price({'Brötchen' => 50, 'Brezel' => 80, 'Saft' => 150}, ['Brezel', 'Saft', 'Brezel'])"
          expect: "310"
        - call: "total_price({'Brötchen' => 50, 'Brezel' => 80, 'Saft' => 150}, [])"
          expect: "0"
          say: "Ein leerer Einkauf kostet nichts."
        - call: "total_price({'Brötchen' => 50, 'Brezel' => 80, 'Saft' => 150}, ['Saft'])"
          expect: "150"
        - call: "total_price({'Brötchen' => 50, 'Brezel' => 80, 'Saft' => 150}, ['Brötchen', 'Brötchen', 'Brötchen', 'Brötchen'])"
          expect: "200"
          say: "Was mehrmals im Einkauf steht, zählt mehrmals."
    feedback:
      - when: { same_as: "def total_price(prices, cart)\n  total = 0\n  prices.each do |item, price|\n    total += price if cart.include?(item)\n  end\n  total\nend\n" }
        say: "Du gehst die Preisliste durch und zählst jedes Produkt einmal. Geh den Einkauf durch: Was zweimal darin steht, kostet zweimal."
    hint: "Geh den Einkauf durch, nicht die Preisliste. `prices['Saft']` ist der Preis eines Safts."
    solution: |
      ```ruby
      def total_price(prices, cart)
        total = 0
        cart.each do |item|
          total += prices[item]
        end
        total
      end
      ```
    python:
      prompt: |
        Im Schulkiosk hat alles seinen Preis, in Cent: `{'Brötchen': 50, 'Brezel': 80, 'Saft': 150}`. Schreib eine Funktion `total_price(prices, cart)`, die zusammenrechnet, was die Liste `cart` kostet: `total_price(prices, ['Brezel', 'Saft', 'Brezel'])` ergibt `310`.
      starter: |
        def total_price(prices, cart):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "total_price({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, ['Brezel', 'Saft', 'Brezel'])"
            expect: "310"
          - call: "total_price({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, [])"
            expect: "0"
            say: "Ein leerer Einkauf kostet nichts."
          - call: "total_price({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, ['Saft'])"
            expect: "150"
          - call: "total_price({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, ['Brötchen', 'Brötchen', 'Brötchen', 'Brötchen'])"
            expect: "200"
            say: "Was mehrmals im Einkauf steht, zählt mehrmals."
      feedback:
        - when: { same_as: "def total_price(prices, cart):\n    total = 0\n    for item, price in prices.items():\n        if item in cart:\n            total += price\n    return total\n" }
          say: "Du gehst die Preisliste durch und zählst jedes Produkt einmal. Geh den Einkauf durch: Was zweimal darin steht, kostet zweimal."
      hint: "Geh den Einkauf durch, nicht die Preisliste. `prices['Saft']` ist der Preis eines Safts."
      solution: |
        ```python
        def total_price(prices, cart):
            total = 0
            for item in cart:
                total += prices[item]
            return total
        ```
    javascript:
      prompt: |
        Im Schulkiosk hat alles seinen Preis, in Cent: `{'Brötchen': 50, 'Brezel': 80, 'Saft': 150}`. Schreib eine Funktion `totalPrice(prices, cart)`, die zusammenrechnet, was die Liste `cart` kostet: `totalPrice(prices, ['Brezel', 'Saft', 'Brezel'])` ergibt `310`.
