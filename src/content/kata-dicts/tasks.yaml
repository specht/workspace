        type: function
        language: javascript
        cases:
          - call: "anagramGroups(['lampe', 'regen', 'palme', 'ampel', 'gerne'])"
            expect: "[['lampe', 'palme', 'ampel'], ['regen', 'gerne']]"
          - call: "anagramGroups([])"
            expect: "[]"
          - call: "anagramGroups(['abc'])"
            expect: "[['abc']]"
          - call: "anagramGroups(['ab', 'ba', 'ab'])"
            expect: "[['ab', 'ba', 'ab']]"
            say: "Auch dasselbe Wort zweimal gehört in dieselbe Gruppe."
          - call: "anagramGroups(['eis', 'see', 'sie'])"
            expect: "[['eis', 'sie'], ['see']]"
      hint:
        - "Was haben alle Anagramme gemeinsam? Ihre sortierten Buchstaben: aus `'palme'` und `'ampel'` wird beide Male `'aelmp'`. Das ist ein guter Schlüssel."
        - "Wie beim Gruppieren nach der Länge, nur mit diesem Schlüssel. Eine `Map` behält die Reihenfolge, in der die Schlüssel dazukommen; `[...groups.values()]` sind am Ende die Listen."
      solution: |
        ```javascript
        function anagramGroups(words) {
          const groups = new Map();
          for (const word of words) {
            const key = [...word].sort().join('');
            if (!groups.has(key)) {
              groups.set(key, []);
            }
            groups.get(key).push(word);
          }
          return [...groups.values()];
        }
        ```
