  - id: merge-counts
    title: "Zwei Strichlisten zusammen"
    level: 2
    prompt: |
      Zwei Klassen haben gezählt, welches Obst sie mögen. Schreib eine Funktion `merge_counts(a, b)`, die beide Zählungen zu einer zusammenrechnet: `merge_counts({'Apfel' => 3, 'Birne' => 1}, {'Apfel' => 2, 'Kiwi' => 4})` ergibt `{'Apfel' => 5, 'Birne' => 1, 'Kiwi' => 4}`. Die beiden Zählungen bleiben, wie sie sind.
    starter: |
      def merge_counts(a, b)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "merge_counts({'Apfel' => 3, 'Birne' => 1}, {'Apfel' => 2, 'Kiwi' => 4})"
          expect: "{'Apfel' => 5, 'Birne' => 1, 'Kiwi' => 4}"
          say: "Steht ein Schlüssel in beiden, zählen beide zusammen."
        - call: "merge_counts({}, {'Kiwi' => 1})"
          expect: "{'Kiwi' => 1}"
        - call: "merge_counts({'Kiwi' => 1}, {})"
          expect: "{'Kiwi' => 1}"
        - call: "merge_counts({'a' => 1}, {'a' => 1})"
          expect: "{'a' => 2}"
    feedback:
      - when: { same_as: "def merge_counts(a, b)\n  a.merge(b)\nend\n" }
        say: "`merge` nimmt bei einem Schlüssel, der in beiden steht, den Wert aus `b`, und der aus `a` ist weg. Zähl die beiden zusammen."
    hint:
      - "Fang mit einer Kopie von `a` an, `a.dup`, und geh `b` durch."
      - "Steht der Schlüssel aus `b` schon darin? `result.fetch(key, 0)` ist sein Zähler oder 0."
    solution: |
      ```ruby
      def merge_counts(a, b)
        result = a.dup
        b.each do |key, count|
          result[key] = result.fetch(key, 0) + count
        end
        result
      end
      ```
