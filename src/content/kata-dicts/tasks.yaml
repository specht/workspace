        function totalPrice(prices, cart) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "totalPrice({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, ['Brezel', 'Saft', 'Brezel'])"
            expect: "310"
          - call: "totalPrice({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, [])"
            expect: "0"
            say: "Ein leerer Einkauf kostet nichts."
          - call: "totalPrice({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, ['Saft'])"
            expect: "150"
          - call: "totalPrice({'Brötchen': 50, 'Brezel': 80, 'Saft': 150}, ['Brötchen', 'Brötchen', 'Brötchen', 'Brötchen'])"
