        Map<String, Double> averages(List<Map.Entry<String, Integer>> grades) {
            Map<String, Integer> sums = new HashMap<>();
            Map<String, Integer> counts = new HashMap<>();
            for (Map.Entry<String, Integer> grade : grades) {
                String subject = grade.getKey();
                sums.put(subject, sums.getOrDefault(subject, 0) + grade.getValue());
                counts.put(subject, counts.getOrDefault(subject, 0) + 1);
