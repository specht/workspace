      solution: |
        ```java
        Map<String, List<String>> invert(Map<String, String> colors) {
            Map<String, List<String>> result = new HashMap<>();
            for (String fruit : colors.keySet()) {
                String color = colors.get(fruit);
                if (!result.containsKey(color)) {
                    result.put(color, new ArrayList<>());
                }
                result.get(color).add(fruit);
