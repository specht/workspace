    title: "Wie oft jeder Buchstabe?"
    level: 2
    prompt: |
      Schreib eine Funktion `letter_count(text)`, die zählt, wie oft jeder Buchstabe von `a` bis `z` im Text vorkommt; groß und klein zählen gemeinsam, alles andere zählt nicht: `letter_count('Anna!')` ergibt `{'a' => 2, 'n' => 2}`.
    starter: |
