        - "Wie beim Gruppieren nach der Länge, nur mit diesem Schlüssel. Eine `LinkedHashMap` behält die Reihenfolge, in der die Schlüssel dazukommen, eine `HashMap` nicht; `new ArrayList<>(groups.values())` sind am Ende die Listen."
      solution: |
        ```java
        List<List<String>> anagramGroups(List<String> words) {
            Map<String, List<String>> groups = new LinkedHashMap<>();
            for (String word : words) {
                char[] letters = word.toCharArray();
                Arrays.sort(letters);
                String key = new String(letters);
                if (!groups.containsKey(key)) {
                    groups.put(key, new ArrayList<>());
                }
                groups.get(key).add(word);
            }
            return new ArrayList<>(groups.values());
        }
        ```
