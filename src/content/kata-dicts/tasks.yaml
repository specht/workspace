          - call: "lruMisses(1, ['a', 'a', 'a'])"
            expect: "1"
          - call: "lruMisses(3, [])"
            expect: "0"
          - call: "lruMisses(2, ['a', 'b', 'c', 'a', 'b', 'c'])"
            expect: "6"
          - call: "lruMisses(3, ['a', 'b', 'c', 'a', 'd', 'b', 'e', 'a'])"
            expect: "7"
      feedback:
        - when: { same_as: "function lruMisses(capacity, requests) {\n  const cache = [];\n  let misses = 0;\n  for (const page of requests) {\n    if (cache.includes(page)) {\n      continue;\n    }\n    misses++;\n    if (cache.length === capacity) {\n      cache.shift();\n    }\n    cache.push(page);\n  }\n  return misses;\n}\n" }
          say: "Dein Cache wirft die Seite hinaus, die zuerst kam, auch wenn sie gerade wieder verlangt wurde. Eine verlangte Seite rückt nach hinten, zu den frischen."
