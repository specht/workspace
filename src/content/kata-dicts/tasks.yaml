      prompt: |
        Ein Cache hält die letzten Seiten bereit, die jemand aufgerufen hat, höchstens `capacity` viele. Wird eine Seite verlangt, die nicht darin ist, ist das ein Fehlschlag: Sie kommt hinein, und ist der Cache voll, fliegt die, die am längsten nicht mehr verlangt wurde (»least recently used«). Schreib `lruMisses(capacity, requests)`, die die Fehlschläge zählt: `lruMisses(2, ['a', 'b', 'a', 'c', 'b'])` ergibt `4`.
