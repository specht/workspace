  - id: keys-with-value
    title: "Wer hat so viele Punkte?"
    level: 1
    prompt: |
      `scores` ordnet jedem Namen seine Punkte zu. Schreib eine Funktion `keys_with_value(scores, value)`, die die Namen mit genau `value` Punkten als Liste zurückgibt, in der Reihenfolge, in der sie in `scores` stehen: `keys_with_value({'Ada' => 7, 'Alan' => 5, 'Grace' => 7}, 7)` ergibt `['Ada', 'Grace']`.
    starter: |
      def keys_with_value(scores, value)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "keys_with_value({'Ada' => 7, 'Alan' => 5, 'Grace' => 7}, 7)"
          expect: "['Ada', 'Grace']"
        - call: "keys_with_value({'Ada' => 7, 'Alan' => 5, 'Grace' => 7}, 3)"
          expect: "[]"
          say: "Hat niemand so viele Punkte, ist die Liste leer."
        - call: "keys_with_value({}, 1)"
          expect: "[]"
        - call: "keys_with_value({'Linus' => 0, 'Margaret' => 0}, 0)"
          expect: "['Linus', 'Margaret']"
    hint: "`scores.each do |name, points| … end` geht die Paare der Reihe nach durch, Schlüssel und Wert."
    solution: |
      ```ruby
      def keys_with_value(scores, value)
        names = []
        scores.each do |name, points|
          names << name if points == value
        end
        names
      end
      ```
    python:
      prompt: |
        `scores` ordnet jedem Namen seine Punkte zu. Schreib eine Funktion `keys_with_value(scores, value)`, die die Namen mit genau `value` Punkten als Liste zurückgibt, in der Reihenfolge, in der sie in `scores` stehen: `keys_with_value({'Ada': 7, 'Alan': 5, 'Grace': 7}, 7)` ergibt `['Ada', 'Grace']`.
      starter: |
        def keys_with_value(scores, value):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "keys_with_value({'Ada': 7, 'Alan': 5, 'Grace': 7}, 7)"
            expect: "['Ada', 'Grace']"
          - call: "keys_with_value({'Ada': 7, 'Alan': 5, 'Grace': 7}, 3)"
            expect: "[]"
            say: "Hat niemand so viele Punkte, ist die Liste leer."
          - call: "keys_with_value({}, 1)"
            expect: "[]"
          - call: "keys_with_value({'Linus': 0, 'Margaret': 0}, 0)"
            expect: "['Linus', 'Margaret']"
      hint: "`for name, points in scores.items():` geht die Paare der Reihe nach durch, Schlüssel und Wert."
      solution: |
        ```python
        def keys_with_value(scores, value):
            names = []
            for name, points in scores.items():
                if points == value:
                    names.append(name)
            return names
        ```
    javascript:
      prompt: |
        `scores` ordnet jedem Namen seine Punkte zu. Schreib eine Funktion `keysWithValue(scores, value)`, die die Namen mit genau `value` Punkten als Liste zurückgibt, in der Reihenfolge, in der sie in `scores` stehen: `keysWithValue({'Ada': 7, 'Alan': 5, 'Grace': 7}, 7)` ergibt `['Ada', 'Grace']`.
      starter: |
        function keysWithValue(scores, value) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "keysWithValue({'Ada': 7, 'Alan': 5, 'Grace': 7}, 7)"
            expect: "['Ada', 'Grace']"
          - call: "keysWithValue({'Ada': 7, 'Alan': 5, 'Grace': 7}, 3)"
            expect: "[]"
            say: "Hat niemand so viele Punkte, ist die Liste leer."
          - call: "keysWithValue({}, 1)"
            expect: "[]"
          - call: "keysWithValue({'Linus': 0, 'Margaret': 0}, 0)"
            expect: "['Linus', 'Margaret']"
      hint: "`for (const name in scores) { … }` geht die Schlüssel der Reihe nach durch; `scores[name]` ist der Wert."
      solution: |
        ```javascript
        function keysWithValue(scores, value) {
          const names = [];
          for (const name in scores) {
            if (scores[name] === value) {
              names.push(name);
            }
          }
          return names;
        }
        ```
  - id: letter-count
    title: "Wie oft jeder Buchstabe?"
    level: 2
    prompt: |
      Schreib eine Funktion `letter_count(text)`, die zählt, wie oft jeder Buchstabe von `a` bis `z` im Text vorkommt; groß und klein zählen gemeinsam, alles andere zählt nicht: `letter_count('Anna!')` ergibt `{'a' => 2, 'n' => 2}`.
    starter: |
      def letter_count(text)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#tally, String#count]
      cases:
        - call: "letter_count('Anna!')"
          expect: "{'a' => 2, 'n' => 2}"
          say: "Groß und klein zählen gemeinsam."
        - call: "letter_count('')"
          expect: "{}"
        - call: "letter_count('Hallo Welt')"
          expect: "{'h' => 1, 'a' => 1, 'l' => 3, 'o' => 1, 'w' => 1, 'e' => 1, 't' => 1}"
          say: "Ein Leerzeichen ist kein Buchstabe."
        - call: "letter_count('123')"
          expect: "{}"
        - call: "letter_count('Zz')"
          expect: "{'z' => 2}"
    feedback:
      - when: { same_as: "def letter_count(text)\n  counts = {}\n  text.each_char do |char|\n    next unless (char >= 'a' && char <= 'z') || (char >= 'A' && char <= 'Z')\n    counts[char] = counts.fetch(char, 0) + 1\n  end\n  counts\nend\n" }
        say: "`'A'` und `'a'` sind bei dir zwei Schlüssel. Mach den Text vorher klein."
    hint: "Wie die Strichliste, nur über die Buchstaben des Textes. Welche Zeichen lässt du aus?"
    solution: |
      ```ruby
      def letter_count(text)
        counts = {}
        text.downcase.each_char do |char|
          next unless char >= 'a' && char <= 'z'
          counts[char] = counts.fetch(char, 0) + 1
        end
        counts
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `letter_count(text)`, die zählt, wie oft jeder Buchstabe von `a` bis `z` im Text vorkommt; groß und klein zählen gemeinsam, alles andere zählt nicht: `letter_count('Anna!')` ergibt `{'a': 2, 'n': 2}`.
      starter: |
        def letter_count(text):
            pass
      check:
        type: function
        language: python
        forbid: [str.count]
        cases:
          - call: "letter_count('Anna!')"
            expect: "{'a': 2, 'n': 2}"
            say: "Groß und klein zählen gemeinsam."
          - call: "letter_count('')"
            expect: "{}"
          - call: "letter_count('Hallo Welt')"
            expect: "{'h': 1, 'a': 1, 'l': 3, 'o': 1, 'w': 1, 'e': 1, 't': 1}"
            say: "Ein Leerzeichen ist kein Buchstabe."
          - call: "letter_count('123')"
            expect: "{}"
          - call: "letter_count('Zz')"
