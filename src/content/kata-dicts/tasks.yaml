      feedback:
        - when: { same_as: "int lruMisses(int capacity, List<String> requests) {\n  final cache = <String>[];\n  var misses = 0;\n  for (final page in requests) {\n    if (cache.contains(page)) {\n      continue;\n    }\n    misses++;\n    if (cache.length == capacity) {\n      cache.removeAt(0);\n    }\n    cache.add(page);\n  }\n  return misses;\n}\n" }
