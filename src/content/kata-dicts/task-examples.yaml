    fail:
      - answer: "def phone_number(book, name)\n  book[name]\nend\n"
    python:
      pass:
        - answer: "def phone_number(book, name):\n    if name in book:\n        return book[name]\n    return 'unbekannt'\n"
      fail:
        - answer: "def phone_number(book, name):\n    return book.get(name)\n"
