      pass:
        - answer: "function phoneNumber(book, name) {\n  if (name in book) {\n    return book[name];\n  }\n  return 'unbekannt';\n}\n"
      fail:
        - answer: "function phoneNumber(book, name) {\n  return book[name];\n}\n"
