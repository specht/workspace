# Aufgaben zu »3D-Szenen mit Anaglyphen«.
# Format: docs/aufgaben.md.
# Jede Bauaufgabe hat ihre eigene Datei im Ordner anaglyph/; am Ende liegen
# alle Szenen nebeneinander und lassen sich im Viewer über das Dateifeld laden.
# Die Szenen prüft der Viewer der Lernenden selbst (anaglyph/include/script.js),
# in ihrem Workspace: Prüfart scene.
format: 1
activity: anaglyph
tasks:
  - id: kugel
    title: Eine Kugel
    prompt: Mach aus dem Würfel in `scene.ini` eine Kugel.
    file: anaglyph/scene.ini
    check:
      type: scene
      file: anaglyph/scene.ini
      ignore: [grid]
      expect:
        - { shape: sphere, count: 1 }

  - id: vier-wuerfel
    title: Vier Würfel
    prompt: |
      Lege die Datei `vier-wuerfel.ini` an und baue darin vier Würfel: einen in
      der Mitte, einen rechts daneben, einen darüber und einen davor.
    file: anaglyph/vier-wuerfel.ini
    check:
      type: scene
      file: anaglyph/vier-wuerfel.ini
      ignore: [grid]
      expect:
        - { shape: box, at: [0, 0, 0] }
        - { shape: box, at: [100, 0, 0] }
        - { shape: box, at: [0, 100, 0] }
        - { shape: box, at: [0, 0, 100] }
    feedback:
      - when: { found: [0, 0, -100], missing: [0, 0, 100] }
        say: Der Würfel »davor« steht hinten. Vorne ist +z.
      - when: { found: [0, -100, 0], missing: [0, 100, 0] }
        say: Der Würfel »darüber« steht unten. Oben ist +y.
    solution: |
      Vier `shape = box`, verschoben um `0, 0, 0`, `100, 0, 0`, `0, 100, 0`
      und `0, 0, 100`.

  - id: wuerfelstern
    title: Der Würfelstern
    prompt: |
      Baue in `wuerfelstern.ini` den Stern aus dem Bild: genau drei Würfel, die
      alle im Ursprung stehen.
    file: anaglyph/wuerfelstern.ini
    check:
      type: scene
      file: anaglyph/wuerfelstern.ini
      ignore: [grid]
      expect:
        - shape: box
          count: 3
          at: [0, 0, 0]
          rotate_z: { spacing: 30, modulo: 90 }
    solution: Drei Würfel mit `rotate = 0, 0, -30`, ohne Drehung und `rotate = 0, 0, 30`.

  - id: balken
    title: Der Balken
    prompt: |
      Mach in `balken.ini` aus einem Würfel einen Balken, der zehnmal so breit
      ist, und leg ihn so auf das Gitter, dass er nicht darin versinkt. Ein
      Würfel ist 50 Einheiten groß.
    file: anaglyph/balken.ini
    check:
      type: scene
      file: anaglyph/balken.ini
      ignore: [grid]
      expect:
        - { shape: box, count: 1, size: [500, 50, 50], bottom_y: 0 }
    feedback:
      - when: { source_matches: 'scale\s*=\s*\d+\s*,\s*\d+\s*$' }
        say: Steht da ein Komma in einer Kommazahl? Kommazahlen schreibst du mit Punkt.
    solution: '`scale = 10, 1, 1` und `move = 0, 25, 0`.'

  - id: reihenfolge
    title: Wo landet der Würfel?
    prompt: |
      Ein Würfel wird erst um `100, 0, 0` verschoben und dann um `0, 0, 45`
      gedreht. Wo liegt danach sein Mittelpunkt? Erst überlegen, dann
      ausprobieren.
    prediction: true
    check:
      type: choice
      options:
        - bei (100, 0, 0), nur schräg gestellt
        - bei etwa (71, 71, 0), schräg über dem Gitter
        - bei (0, 100, 0), genau über dem Ursprung
        - bei (145, 0, 0), etwas weiter rechts
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: 'Gedreht wird um den Ursprung, nicht um den Mittelpunkt des Würfels. Wo landet der Punkt (100, 0, 0), wenn du ihn um 45 Grad um die z-Achse drehst?'
      - when: { picked: 3 }
        say: 'Die 45 sind Grad, kein Weg. Wo landet (100, 0, 0) nach einer Drehung um 45 Grad um den Ursprung?'
    solution: |
      Erst verschoben liegt der Würfel bei (100, 0, 0). Die Drehung um 45 Grad um
      die z-Achse dreht ihn danach um den Ursprung, nicht um seine eigene Mitte:
      Er wandert auf einem Kreis nach (100 · cos 45°, 100 · sin 45°, 0) ≈ (71, 71,
      0). Erst gedreht und dann verschoben bleibt er dagegen bei (100, 0, 0) und
      ist nur in sich gedreht.

  - id: reihenfolge-erklaeren
    title: In eigenen Worten
    prompt: |
      Was passiert mit einem Würfel, den du erst skalierst und dann
      verschiebst, und was, wenn du es andersherum machst? Erkläre den
      Unterschied in zwei oder drei Sätzen.
    check:
      type: reflection
      min_words: 20
    examples:
      - |
        Skaliere ich zuerst, wird der Würfel im Ursprung größer und danach um
        genau die angegebene Strecke verschoben. Verschiebe ich zuerst, wird beim
        Skalieren auch sein Abstand zum Ursprung größer: Mit `move = 100, 0, 0`
        und danach `scale = 2` steht er nicht bei 100, sondern bei 200. Jede
        Skalierung findet um den Ursprung statt.
      - |
        Der Würfel ist in beiden Fällen gleich groß, aber er steht woanders. Erst
        skalieren, dann verschieben: Er steht genau dort, wohin ich ihn schiebe.
        Erst verschieben, dann skalieren: Die Skalierung zieht alles vom Ursprung
        weg, auch den schon verschobenen Würfel, und er rutscht weiter nach außen.

  - id: wie-viele
    title: Wie viele?
    prompt: |
      Wie viele Würfel zeichnet `loop x from -100 to 100 step 100`, wenn du
      `step 100` durch `step 50` ersetzt?
    prediction: true
    check:
      type: number
      expect: 5
    solution: |
      Mit `step 50` nimmt `x` die Werte −100, −50, 0, 50 und 100 an, also fünf
      Würfel. Die Grenze 100 gehört noch dazu, weil die Schleife bis
      einschließlich `to 100` läuft.

  - id: wuerfelgitter
    title: Ein Würfel aus Würfeln
    prompt: Baue in `wuerfelgitter.ini` mit Schleifen einen großen Würfel aus 3 × 3 × 3 kleinen Würfeln.
    file: anaglyph/wuerfelgitter.ini
    check:
      type: scene
      file: anaglyph/wuerfelgitter.ini
      ignore: [grid]
      expect:
        - { shape: box, lattice: [3, 3, 3], min_spacing: 50 }
      source:
        contains: [loop]
    solution: Drei verschachtelte Schleifen über x, y und z.

  - id: allee
    title: Eine Allee
    prompt: |
      Pflanze in `allee.ini` zwei Reihen mit je fünf Bäumen, links und rechts
      eines Wegs. Benutze `define` und eine Schleife.
    file: anaglyph/allee.ini
    check:
      type: scene
      file: anaglyph/allee.ini
      ignore: [grid]
      expect:
        - { shape: cylinder, count: 10, rows: 2 }
        - { shape: cone, count: 10, rows: 2 }
      source:
        contains: [define, loop]
    feedback:
      - when: { source_matches: 'shape\s*=\s*\w+\s*\n\s*\n\s*(move|rotate|scale)' }
        say: Nach `shape = baum` steht eine Leerzeile. Die Transformation darunter gilt dann nicht mehr dem Baum.

  - id: umdrehung
    title: Eine Umdrehung
    prompt: Ein Ring dreht sich mit `rotate = 0, t * 45, 0`. Nach wie vielen Sekunden hat er sich einmal ganz gedreht?
    check:
      type: number
      expect: 8
      unit: s
    solution: |
      Eine ganze Drehung sind 360 Grad. Mit `t * 45` kommen in jeder Sekunde 45
      Grad dazu, also dauert sie 360 ÷ 45 = 8 Sekunden.

  - id: sonnensystem
    title: Sonne, Erde, Mond
    prompt: |
      Baue in `sonnensystem.ini` ein kleines Weltall: Der Hintergrund ist
      schwarz. In der Mitte steht eine gelbe Sonne, eine blaue Erde kreist um
      die Sonne, und ein weißer Mond kreist um die Erde. Der Workspace erkennt
      die drei Kugeln an ihren Farben.
    file: anaglyph/sonnensystem.ini
    check:
      type: scene
      file: anaglyph/sonnensystem.ini
      ignore: [grid]
      at_times: [0, 1, 2, 3]
      background: black
      expect:
        - { label: Sonne, shape: sphere, color: [yellow, orange], moves: false }
        - { label: Erde, shape: sphere, color: [blue, cyan], orbits: Sonne }
        - { label: Mond, shape: sphere, color: [white, grey], orbits: Erde }
    feedback:
      - when: { problem: orbit, source_matches: '^\s*rotate[^\n]*\n\s*move' }
        say: |
          Steht bei dir `rotate` vor `move`? Dann dreht sich die Kugel erst um
          sich selbst und wird danach verschoben: Sie bleibt an ihrem Platz.
          Zum Kreisen erst verschieben, dann drehen.
    solution: |
      Die Erde wird erst um `300, 0, 0` verschoben und dann mit
      `rotate = 0, t * 30, 0` um den Ursprung gedreht. Der Mond wird erst um
      die Erde gedreht und dann wie die Erde bewegt, am einfachsten mit zwei
      Gruppen ineinander.

  - id: galerie
    title: Ab in die Galerie
    prompt: |
      Gib deine schönste Szene ab. In der Galerie deiner Klasse erscheint sie aus
      der Ansicht, die in ihrer Zeile `camera = …` steht: Stell die Kamera in der
      Vorschau ein, kopiere sie mit »Kamera kopieren« in die Datei, und prüfe
      hier im Bild, wie die Szene aussehen wird. Du kannst jederzeit eine neue
      abgeben oder deine Abgabe löschen.
    check:
      type: submit
      pick: anaglyph/*.ini
      max_size: 1MB
      gallery: true
      preview: anaglyph
      requires:
        scene_loads: true
        min_objects: 5
