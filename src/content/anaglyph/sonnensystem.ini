; Lösung zu »Sonne, Erde, Mond« und Szene für animation3.mp4
; (tutorial-screenshot in anaglyph.md, write-file <- file:sonnensystem.ini)
background = 0
shade = on
stroke = off

fill = #f9c80e
shape = sphere
scale = 1.2

group
    move = 260, 0, 0
    rotate = 0, t * 30, 0

    fill = #3a6ee8
    shape = sphere
    scale = 0.4

    group
        move = 60, 0, 0
        rotate = 0, t * 120, 0

        fill = 1
        shape = sphere
        scale = 0.12
    end
end
