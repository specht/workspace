# Aufgaben zum Steckbrief »Python«. Format: docs/aufgaben.md.
# Die Dateien liegen ohne geöffneten Ordner direkt in /workspace (hello.py,
# factor.py, bubblesort.py), so wie die Seite sie speichern lässt.
format: 1
activity: python
tasks:
  - id: hallo
    title: Hello, World!
    prompt: |
      Speichere dein erstes Programm als `/workspace/hello.py` und führe es mit
      `python3 hello.py` aus.
    file: hello.py
    check:
      type: files
      path: hello.py
      expect:
        format: text
        contains:
          - pattern: '^\s*print\s*\(\s*["'']Hello, World!["'']\s*\)'
            say: 'In `hello.py` finde ich noch kein `print("Hello, World!")`. Steht es genau so da, mit Klammern, Komma, Ausrufezeichen und Anführungszeichen?'
    feedback:
      - when: { problem: missing }
        say: Es gibt noch keine `/workspace/hello.py`. Hast du beim Speichern mit <kbd>Strg</kbd><kbd>S</kbd> den Namen `hello.py` eingegeben, mit `.py` am Ende?
      - when: { problem: wrong_format }
        say: '`hello.py` ist noch leer. Schreib `print("Hello, World!")` hinein und speichere mit <kbd>Strg</kbd><kbd>S</kbd>.'
    hint: Ein weißer Punkt am Reiter der Datei heißt, dass sie noch nicht gespeichert ist.

  - id: fehler
    title: Die Art des Fehlers
    prompt: |
      Welche Art von Fehler meldet Python für `prin`? Sie steht in der letzten
      Zeile der Meldung vor dem Doppelpunkt.
    check:
      type: answer
      compare: regex
      expect: '(?i)^\W*NameError\W*$'
    feedback:
      - when: { matches: '(?i)^\W*Traceback' }
        say: '`Traceback` ist die Überschrift der Meldung: Darunter steht der Weg durch das Programm bis zum Fehler. Die Art des Fehlers steht in der letzten Zeile.'
      - when: { matches: '(?i)not defined' }
        say: Das ist die Beschreibung des Fehlers. Gesucht ist das eine Wort davor, vor dem Doppelpunkt.
      - when: { matches: '(?i)^\W*print\W*$' }
        say: 'Das ist Pythons Vorschlag hinter »Did you mean«. Gesucht ist die Art des Fehlers.'
    hint: Die Meldung beginnt mit `Traceback`, nennt dann Datei und Zeile (`line 1`) und erst ganz unten, was schiefging.
    solution: |
      `NameError`: Python kennt keinen Namen `prin`. Darüber nennt die Meldung
      die Datei und die Zeile (`line 1`), dahinter schlägt Python `print` vor.
      Ein Name, der auf `Error` endet, sagt dir die Art des Fehlers, und mit
      ihm findest du im Netz Erklärungen.

  - id: ohne-chmod
    title: Ohne chmod
    prediction: true
    prompt: |
      Das Shebang steht in der ersten Zeile, die Datei ist gespeichert. Was
      passiert, wenn du jetzt `./hello.py` eingibst? Überleg erst, dann probier
      es aus.
    check:
      type: choice
      options:
        - 'Die Shell meldet `Permission denied`: Die Datei darf noch nicht als Programm laufen.'
        - 'Es erscheint `Hello, World!`, denn das Shebang sagt, welcher Interpreter die Datei ausführt.'
        - 'Python meldet einen Fehler in Zeile 1, weil es `#!` nicht kennt.'
        - 'Die Shell meldet `command not found`, weil `hello.py` kein Befehl ist.'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: 'Probier es aus. Das Shebang sagt, womit die Datei läuft, aber ob sie überhaupt als Programm laufen darf, steht woanders.'
      - when: { picked: 2 }
        say: 'Für Python ist `#` der Anfang eines Kommentars, die Zeile stört es nicht. Probier es aus: Bis zu Python kommt es gar nicht.'
      - when: { picked: 3 }
        say: 'Mit `./` vorn sucht die Shell nicht nach einem Befehl, sondern nimmt genau diese Datei. Probier es aus.'
    solution: |
      Die Shell meldet `bash: ./hello.py: Permission denied`. Eine neue Datei ist
      nicht ausführbar; das ändert `chmod +x`. Erst dann liest die Shell das
      Shebang und startet `python3` mit der Datei.

  - id: ausfuehrbar
    title: Ein ausführbares Skript
    prompt: |
      `hello.py` hat ein Shebang und ist ausführbar, sodass `./hello.py`
      `Hello, World!` ausgibt.
    file: hello.py
    check:
      type: files
      path: hello.py
      expect:
        executable: true
        contains:
          - pattern: '^#!.*\bpython'
            say: 'In `hello.py` fehlt das Shebang. Die erste Zeile heißt `#!/usr/bin/env python3`.'
          - pattern: '^\s*print\s*\('
            say: 'Das Shebang ist da, aber `print` fehlt. Steht noch `prin` in der Datei?'
    feedback:
      - when: { problem: not_executable }
        say: '`hello.py` ist noch nicht ausführbar. Im Terminal, im Ordner `/workspace`: `chmod +x hello.py`.'
    hint: '`ls -l hello.py` zeigt die Rechte. Steht vorn `-rwxr-xr-x`, ist die Datei ausführbar, bei `-rw-r--r--` noch nicht.'

  - id: vergleiche
    title: Wie oft wird verglichen?
    prompt: |
      Wie oft vergleicht `bubble_sort` zwei Nachbarn (`array[j] > array[j + 1]`),
      wenn `array` 10 Zahlen hat?
    check:
      type: number
      expect: 90
      tolerance: 0
      unit: Vergleiche
    feedback:
      - when: { equals: 100 }
        say: 'Die innere Schleife läuft über `range(len(array) - 1)`. Wie viele Werte hat `j` dann?'
      - when: { equals: 45 }
        say: 'So oft wäre es, wenn die innere Schleife jedes Mal kürzer würde. Hier läuft sie aber immer gleich weit.'
      - when: { equals: 9 }
        say: Das ist ein einziger Durchlauf der inneren Schleife. Wie oft startet die äußere sie?
      - when: { equals: 10 }
        say: So oft läuft die äußere Schleife. Wie oft vergleicht die innere bei jedem dieser Durchläufe?
    hint: '`range(10)` hat 10 Werte, `range(9)` hat 9. Die innere Schleife läuft bei jedem Durchlauf der äußeren ganz durch.'
    solution: |
      90: Die äußere Schleife läuft 10-mal (`range(len(array))`), die innere
      jedes Mal 9-mal (`range(len(array) - 1)`), also 10 · 9 = 90 Vergleiche,
      auch wenn die Zahlen schon sortiert sind. Bei 100 Zahlen wären es
      9.900: Die Arbeit wächst mit dem Quadrat der Länge.

  - id: absteigend
    title: Absteigend sortieren
    prompt: |
      Ändere `bubble_sort` in `bubblesort.py` so, dass die größte Zahl zuerst
      kommt, und starte das Skript noch einmal.
    file: bubblesort.py
    check:
      type: python
      file: bubblesort.py
      cases:
        - call: "bubble_sort(array := [3, 1, 2]) or array"
          expect: '[3, 2, 1]'
          say: Die größte Zahl soll zuerst kommen. Noch sortiert `bubble_sort` aufsteigend.
        - call: "bubble_sort(array := [5, 1, 4, 1, 5, 9, 2, 6]) or array"
          expect: '[9, 6, 5, 5, 4, 2, 1, 1]'
        - call: "bubble_sort(array := []) or array"
          expect: '[]'
    hint: Ein einziges Zeichen in der Zeile mit `if` entscheidet, wann zwei Nachbarn vertauscht werden.
    solution: |
      ```python
      def bubble_sort(array):
          for i in range(len(array)):
              for j in range(len(array) - 1):
                  if array[j] < array[j + 1]:
                      array[j], array[j + 1] = array[j + 1], array[j]
      ```
      Mit `<` statt `>` werden zwei Nachbarn vertauscht, wenn der hintere größer
      ist. So wandert die kleinste Zahl ans Ende.
