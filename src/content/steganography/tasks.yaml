# Aufgaben zu »Geheime Botschaften in Bildern«.
# Format: docs/aufgaben.md. Das Programm liegt in /workspace/stego.
format: 1
activity: steganography
tasks:
  - id: bitebene
    title: Eine Bitebene
    prompt: |
      Schreib `bit_plane(image, bit)` in `stego.rb`: Jeder Kanal wird 255, wenn
      sein Bit Nummer `bit` gesetzt ist, sonst 0. Speichere.
    file: stego/stego.rb
    check:
      type: ruby
      file: stego/stego.rb
      cases:
        - call: channels(bit_plane(from_channels(2, 1, [5, 2, 255, 4, 3, 6]), 0))
          expect: '[255, 0, 255, 0, 255, 0]'
          say: Bit 0 von 5 ist 1, von 2 ist es 0. `v[0]` ist das unterste Bit.
        - call: channels(bit_plane(from_channels(2, 1, [5, 2, 255, 4, 3, 6]), 1))
          expect: '[0, 255, 255, 0, 255, 255]'
          say: Bit 1 von 5 (101) ist 0, von 2 (10) ist es 1. `v[1]` ist das zweite Bit von rechts.
        - call: '[bit_plane(from_channels(3, 2, [0] * 18)).width, bit_plane(from_channels(3, 2, [0] * 18)).height]'
          expect: '[3, 2]'
          say: Die Bitebene ist so groß wie das Bild. Gibst du mit `from_channels(image.width, image.height, …)` ein neues Bild zurück?
    hint:
      - |
        Rechne für die Werte 5, 2 und 255 von Hand: Wie sehen sie im Zweiersystem
        aus, und ist ihr Bit 0 gesetzt, ihr Bit 1? Welche Werte bekommt die
        Bitebene 0 dann an diesen drei Stellen, welche die Bitebene 1?
      - |
        `channels(image)` gibt alle Kanäle als ein Array. Mach daraus mit `map` ein
        neues Array: 255, wo `v[bit]` gesetzt ist, sonst 0. Dieses Array gibst du
        `from_channels` mit, zusammen mit Breite und Höhe des Bildes.
    python:
      prompt: |
        Schreib `bit_plane(image, bit)` in `stego.py`: Jeder Kanal wird 255,
        wenn sein Bit Nummer `bit` gesetzt ist, sonst 0. Speichere.
      file: stego/stego.py
      check:
        type: python
        file: stego/stego.py
        cases:
          - call: channels(bit_plane(from_channels(2, 1, [5, 2, 255, 4, 3, 6]), 0))
            expect: '[255, 0, 255, 0, 255, 0]'
            say: Bit 0 von 5 ist 1, von 2 ist es 0. `(v >> 0) & 1` ist das unterste Bit.
          - call: channels(bit_plane(from_channels(2, 1, [5, 2, 255, 4, 3, 6]), 1))
            expect: '[0, 255, 255, 0, 255, 255]'
            say: Bit 1 von 5 (101) ist 0, von 2 (10) ist es 1. `(v >> 1) & 1` ist das zweite Bit von rechts.
          - call: bit_plane(from_channels(3, 2, [0] * 18)).size
            expect: (3, 2)
            say: Die Bitebene ist so groß wie das Bild. Gibst du mit `from_channels(image.width, image.height, …)` ein neues Bild zurück?
      hint:
        - |
          Rechne für die Werte 5, 2 und 255 von Hand: Wie sehen sie im Zweiersystem
          aus, und ist ihr Bit 0 gesetzt, ihr Bit 1? Welche Werte bekommt die
          Bitebene 0 dann an diesen drei Stellen, welche die Bitebene 1?
        - |
          `channels(image)` gibt alle Kanäle als eine Liste. Mach daraus eine neue
          Liste: 255, wo `(v >> bit) & 1` gesetzt ist, sonst 0. Diese Liste gibst du
          `from_channels` mit, zusammen mit Breite und Höhe des Bildes.

  - id: verstecken
    title: Verstecken und wiederfinden
    prompt: |
      Schreib `hide(image, message)` und `reveal(image)` nach den drei Regeln
      oben: erst die Länge mit 32 Bit, dann jedes Byte, das höchste Bit zuerst,
      Rot, Grün und Blau der Reihe nach. Speichere.
    file: stego/stego.rb
    check:
      type: ruby
      file: stego/stego.rb
      cases:
        - call: reveal(hide(ChunkyPNG::Image.new(20, 10, ChunkyPNG::Color.rgb(200, 100, 50)), 'Hallo'))
          expect: "'Hallo'"
        - call: reveal(hide(ChunkyPNG::Image.new(20, 10, ChunkyPNG::Color.rgb(200, 100, 50)), 'Grüße vom Strand'))
          expect: "'Grüße vom Strand'"
          say: Umlauts sind in UTF-8 zwei Bytes. Zählt die Länge Bytes (`message.b.bytes.length`), nicht Zeichen? Und macht `force_encoding('UTF-8')` aus den Bytes wieder Text?
        - call: channels(hide(ChunkyPNG::Image.new(14, 1, ChunkyPNG::Color.rgb(0, 0, 0)), 'A'))[0, 40]
          expect: '[0] * 31 + [1] + [0, 1, 0, 0, 0, 0, 0, 1]'
          say: Erst kommt die Länge, 1 Byte, als 32 Bit, das höchste Bit zuerst, dann »A« (65) als `01000001`, Rot, Grün und Blau jedes Pixels der Reihe nach.
        - call: channels(hide(ChunkyPNG::Image.new(20, 10, ChunkyPNG::Color.rgb(201, 100, 51)), 'Hallo')).zip(channels(ChunkyPNG::Image.new(20, 10, ChunkyPNG::Color.rgb(201, 100, 51)))).map { |a, b| (a - b).abs }.max
          expect: '1'
          say: Kein Kanal darf sich um mehr als 1 ändern. `(v & ~1) | bit` setzt nur das unterste Bit.
    hint:
      - |
        Schreib die Bits für die Botschaft »A« von Hand auf: zuerst die Länge, 1
        Byte, als 32 Bits, dann 65 als 8 Bits, das höchste zuerst. Wie viele Bits
        sind es zusammen, und in welche Kanäle der ersten Pixel kommen sie?
      - |
        Für `hide`: Die Bytes der Länge (`[länge].pack('N').bytes`) und die Bytes der
        Botschaft (`message.b.bytes`) hintereinander, jedes Byte in 8 Bits zerlegt
        (`7.downto(0).map { |i| byte[i] }`). Sind es mehr Bits als Kanäle, ist die
        Botschaft zu lang. Dann setzt du Kanal für Kanal das unterste Bit mit
        `(v & ~1) | bit`. `reveal` geht denselben Weg zurück: die untersten Bits aller
        Kanäle, aus den ersten 32 die Länge, dann je 8 Bits ein Byte.
      - |
        Ein Gerüst; was hinter `# hier` fehlt, schreibst du:

        ```ruby
        def hide(image, message)
            data = message.b.bytes
            bits = ([data.length].pack('N').bytes + data).flat_map { |byte| 7.downto(0).map { |i| byte[i] } }
            values = channels(image)
            # hier: einen Fehler melden, wenn mehr Bits als Kanäle da sind
            bits.each_with_index do |bit, i|
                # hier: das unterste Bit von values[i] auf bit setzen
            end
            from_channels(image.width, image.height, values)
        end

        def reveal(image)
            bits = channels(image).map { |v| v[0] }
            number = ->(start, count) { bits[start, count].reduce(0) { |n, bit| (n << 1) | bit } }
            length = number.(0, 32)
            # hier: length Bytes ab Bit 32 lesen, je 8 Bits, und daraus wieder Text machen
        end
        ```
    python:
      prompt: |
        Schreib `hide(image, message)` und `reveal(image)` nach den drei Regeln
        oben: erst die Länge mit 32 Bit, dann jedes Byte, das höchste Bit
        zuerst, Rot, Grün und Blau der Reihe nach. Speichere.
      file: stego/stego.py
      check:
        type: python
        file: stego/stego.py
        cases:
          - call: reveal(hide(Image.new('RGB', (20, 10), (200, 100, 50)), 'Hallo'))
            expect: "'Hallo'"
          - call: reveal(hide(Image.new('RGB', (20, 10), (200, 100, 50)), 'Grüße vom Strand'))
            expect: "'Grüße vom Strand'"
            say: Umlauts sind in UTF-8 zwei Bytes. Zählt die Länge Bytes (`len(message.encode())`), nicht Zeichen?
          - call: channels(hide(Image.new('RGB', (14, 1), (0, 0, 0)), 'A'))[:40]
            expect: '[0] * 31 + [1] + [0, 1, 0, 0, 0, 0, 0, 1]'
            say: Erst kommt die Länge, 1 Byte, als 32 Bit, das höchste Bit zuerst, dann »A« (65) als `01000001`, Rot, Grün und Blau jedes Pixels der Reihe nach.
          - call: max(abs(a - b) for a, b in zip(channels(hide(Image.new('RGB', (20, 10), (201, 100, 51)), 'Hallo')), channels(Image.new('RGB', (20, 10), (201, 100, 51)))))
            expect: '1'
            say: Kein Kanal darf sich um mehr als 1 ändern. `(v & ~1) | bit` setzt nur das unterste Bit.
      hint:
        - |
          Schreib die Bits für die Botschaft »A« von Hand auf: zuerst die Länge, 1
          Byte, als 32 Bits, dann 65 als 8 Bits, das höchste zuerst. Wie viele Bits
          sind es zusammen, und in welche Kanäle der ersten Pixel kommen sie?
        - |
          Für `hide`: Die vier Bytes der Länge (`len(data).to_bytes(4, 'big')`) und die
          Bytes der Botschaft (`message.encode()`) hintereinander, jedes Byte in 8 Bits
          zerlegt, das höchste zuerst (`(byte >> i) & 1` für i von 7 bis 0). Sind es
          mehr Bits als Kanäle, ist die Botschaft zu lang. Dann setzt du Kanal für
          Kanal das unterste Bit mit `(v & ~1) | bit`. `reveal` geht denselben Weg
          zurück: die untersten Bits aller Kanäle, aus den ersten 32 die Länge, dann je
          8 Bits ein Byte.
        - |
          Ein Gerüst; was hinter `# hier` fehlt, schreibst du:

          ```python
          def hide(image, message):
              data = message.encode()
              data = len(data).to_bytes(4, 'big') + data
              bits = [(byte >> i) & 1 for byte in data for i in range(7, -1, -1)]
              values = channels(image)
              # hier: einen Fehler melden, wenn mehr Bits als Kanäle da sind
              for i, bit in enumerate(bits):
                  # hier: das unterste Bit von values[i] auf bit setzen
                  ...
              return from_channels(image.width, image.height, values)


          def reveal(image):
              bits = [v & 1 for v in channels(image)]

              def number(start, count):
                  n = 0
                  for bit in bits[start:start + count]:
                      n = (n << 1) | bit
                  return n

              length = number(0, 32)
              # hier: length Bytes ab Bit 32 lesen, je 8 Bits, und daraus wieder Text machen
          ```

  - id: codewort
    title: Das Fundstück
    prompt: |
      Lies mit `reveal` die Botschaft aus `fundstueck.png`. Wie heißt das
      Codewort darin?
    check:
      type: answer
      expect: STRANDKORB
    feedback:
      - when: { matches: 'reveal' }
        say: Das steht in Bitebene 1, der Hinweis. Die Botschaft selbst steckt in Bit 0; lies sie mit deinem `reveal`.
    solution: »Gut gefunden! Wer das liest, hat in die untersten Bits geschaut. Das Codewort ist STRANDKORB.«

  - id: kapazitaet
    title: Wie viel passt?
    prompt: |
      Wie viele Bytes darf eine Botschaft höchstens haben, die `hide` mit einem
      Bit pro Kanal in `strandhaeuser.png` (480 × 320 Pixel) versteckt?
    check:
      type: number
      expect: 57596
      unit: Bytes
    feedback:
      - when: { equals: 57600 }
        say: Fast. Die ersten 4 Bytes brauchst du für die Länge.
      - when: { equals: 460800 }
        say: So viele Bits sind es. Wie viele Bytes sind das, und was kostet die Länge?
      - when: { equals: 19200 }
        say: Jedes Pixel hat drei Kanäle, jeder trägt ein Bit.
    solution: 480 · 320 · 3 = 460.800 Bits sind 57.600 Bytes; 4 davon sind die Länge, bleiben 57.596.

  - id: sichtbar
    title: Ab wann sieht man es?
    prediction: true
    prompt: |
      Du füllst den Himmel aus `moewen.png` ganz mit Daten. Ab wie vielen Bits
      pro Kanal siehst du es? Überleg erst, dann probier es mit `hide(image,
      message, depth)` aus.
    check:
      type: choice
      options:
        - Ab 3 oder 4 Bits
        - Schon ab 1 Bit
        - Erst ab 7 Bits
        - Gar nicht, solange das oberste Bit bleibt
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Mit 1 Bit ändert sich jeder Kanal um höchstens 1 von 256. Das sieht niemand.
      - when: { picked: 3 }
        say: Mit 6 Bits darf sich ein Kanal um 63 ändern, ein Viertel des ganzen Bereichs.
    solution: Mit 1 und 2 Bits (höchstens 1 und 3 Stufen) sieht man nichts. Ab 3 bis 4 Bits wird der glatte Himmel körnig und zerfällt in Bänder, weil jeder Kanal nur noch 16 oder 32 Stufen behält.

  - id: chi
    title: Der Chi-Quadrat-Test
    prompt: |
      Schreib `chi_square(image, top, bottom)`: der Test für die Zeilen `top`
      bis `bottom`, durch die Zahl der Paare geteilt, ohne Paare mit
      \\( e < 5 \\). Speichere.
    file: stego/stego.rb
    check:
      type: ruby
      file: stego/stego.rb
      cases:
        - call: chi_square(from_channels(4, 1, [10, 10, 11, 11, 10, 10, 11, 11, 10, 10, 11, 11]), 0, 1).round(2)
          expect: '0.0'
          say: 10 und 11 kommen je sechsmal vor, genau gleich oft. Dann ist jeder Summand 0.
        - call: chi_square(from_channels(4, 1, [10] * 12), 0, 1).round(2)
          expect: '12.0'
          say: 'Hier ist a = 12, b = 0, also e = 6: (12 − 6)²/6 + (0 − 6)²/6 = 12, bei einem einzigen Paar.'
        - call: chi_square(from_channels(8, 1, [10] * 12 + [200] * 8 + [201] * 4), 0, 1).round(2)
          expect: '6.67'
          say: 'Zwei Paare: (10, 11) ergibt 12, (200, 201) mit a = 8 und b = 4 ergibt (2² + 2²)/6 ≈ 1,33. Durch die Zahl der Paare geteilt: 6,67.'
        - call: chi_square(from_channels(4, 2, [10] * 12 + [12] * 12), 1, 2).round(2)
          expect: '12.0'
          say: Nur die Zeilen von `top` bis `bottom`, hier die zweite Zeile mit den Werten 12.
    hint:
      - |
        Rechne das zweite Beispiel der Prüfung von Hand: 12 Kanäle, alle mit dem Wert
        10. Welches Paar ist das, wie groß sind a, b und e, und was kommt für dieses
        Paar heraus? Alle anderen Paare haben e = 0: Zählen sie mit?
      - |
        Erst die Zeilen ausschneiden (`image.crop(0, top, image.width, bottom - top)`),
        dann zählen: ein Array mit 256 Nullen, und für jeden Kanal wird die Stelle
        seines Werts um 1 größer. Dann für jedes Paar k (die Werte 2k und 2k + 1):
        e ausrechnen, Paare mit e < 5 überspringen, sonst die beiden Summanden
        dazuzählen und mitzählen, wie viele Paare dabei waren. Am Ende teilst du die
        Summe durch diese Zahl.
      - |
        Ein Gerüst:

        ```ruby
        def chi_square(image, top, bottom)
            image = image.crop(0, top, image.width, bottom - top)
            counts = Array.new(256, 0)
            channels(image).each { |v| counts[v] += 1 }
            total = 0.0
            pairs = 0
            128.times do |k|
                a, b = counts[2 * k], counts[2 * k + 1]
                e = (a + b) / 2.0
                # hier: zu seltene Paare überspringen, sonst beide Summanden zu total,
                # und pairs mitzählen
            end
            total / pairs
        end
        ```
    python:
      prompt: |
        Schreib `chi_square(image, top, bottom)`: der Test für die Zeilen
        `top` bis `bottom`, durch die Zahl der Paare geteilt, ohne Paare mit
        \\( e < 5 \\). Speichere.
      file: stego/stego.py
      check:
        type: python
        file: stego/stego.py
        cases:
          - call: round(chi_square(from_channels(4, 1, [10, 10, 11, 11, 10, 10, 11, 11, 10, 10, 11, 11]), 0, 1), 2)
            expect: '0.0'
            say: 10 und 11 kommen je sechsmal vor, genau gleich oft. Dann ist jeder Summand 0.
          - call: round(chi_square(from_channels(4, 1, [10] * 12), 0, 1), 2)
            expect: '12.0'
            say: 'Hier ist a = 12, b = 0, also e = 6: (12 − 6)²/6 + (0 − 6)²/6 = 12, bei einem einzigen Paar.'
          - call: round(chi_square(from_channels(8, 1, [10] * 12 + [200] * 8 + [201] * 4), 0, 1), 2)
            expect: '6.67'
            say: 'Zwei Paare: (10, 11) ergibt 12, (200, 201) mit a = 8 und b = 4 ergibt (2² + 2²)/6 ≈ 1,33. Durch die Zahl der Paare geteilt: 6,67.'
          - call: round(chi_square(from_channels(4, 2, [10] * 12 + [12] * 12), 1, 2), 2)
            expect: '12.0'
            say: Nur die Zeilen von `top` bis `bottom`, hier die zweite Zeile mit den Werten 12.
      hint:
        - |
          Rechne das zweite Beispiel der Prüfung von Hand: 12 Kanäle, alle mit dem Wert
          10. Welches Paar ist das, wie groß sind a, b und e, und was kommt für dieses
          Paar heraus? Alle anderen Paare haben e = 0: Zählen sie mit?
        - |
          Erst die Zeilen ausschneiden (`image.crop((0, top, image.width, bottom))`),
          dann zählen: eine Liste mit 256 Nullen, und für jeden Kanal wird die Stelle
          seines Werts um 1 größer. Dann für jedes Paar k (die Werte 2k und 2k + 1):
          e ausrechnen, Paare mit e < 5 überspringen, sonst die beiden Summanden
          dazuzählen und mitzählen, wie viele Paare dabei waren. Am Ende teilst du die
          Summe durch diese Zahl.
        - |
          Ein Gerüst:

          ```python
          def chi_square(image, top, bottom):
              image = image.crop((0, top, image.width, bottom))
              counts = [0] * 256
              for v in channels(image):
                  counts[v] += 1
              total, pairs = 0.0, 0
              for k in range(128):
                  a, b = counts[2 * k], counts[2 * k + 1]
                  e = (a + b) / 2
                  # hier: zu seltene Paare überspringen, sonst beide Summanden zu total,
                  # und pairs mitzählen
              return total / pairs
          ```

  - id: komprimiert
    title: Gleichmäßig verrät
    prompt: |
      Die komprimierte Spezifikation sieht in der Bitebene aus wie Rauschen.
      Warum findet der Chi-Quadrat-Test sie trotzdem?
    check:
      type: choice
      options:
        - Weil ihre Bits so gleichmäßig 0 und 1 sind, dass beide Werte jedes Paares gleich oft vorkommen, gleicher, als es in einem Foto je wäre
        - Weil zlib am Anfang jeder Datei dieselben zwei Bytes schreibt, und die sucht der Test
        - Weil komprimierte Daten mehr Einsen enthalten als Nullen
        - Er findet sie nicht; er findet nur unkomprimierten Text
      correct: 0
    feedback:
      - when: { picked: 3 }
        say: Rechne den Test für die Zeilen 0 bis 40 der Strandhäuser mit der komprimierten Spezifikation. Was kommt heraus?
      - when: { picked: 1 }
        say: Der Test kennt keine Formate. Er zählt nur, wie oft jeder Wert vorkommt.
    solution: Zufällige unterste Bits verteilen jeden Wert eines Paares gleichmäßig auf beide. Danach kommen 2k und 2k+1 fast genau gleich oft vor, und das ist in einem gewöhnlichen Foto nicht so. Komprimieren hilft gegen das Auge, nicht gegen diesen Test.

  - id: stellen
    title: Stellen mit wechselnder Basis
    prompt: |
      Drei Pixel haben Klassen der Größe 5, 3 und 4. Welche Ziffern bekommen
      sie für die Zahl 37? Schreib sie in der Reihenfolge der Pixel, mit
      Leerzeichen dazwischen.
    check:
      type: answer
      compare: regex
      expect: '^\s*2[\s,]+1[\s,]+2\s*$'
    feedback:
      - when: { matches: '^\s*2[\s,]+1[\s,]+0' }
        say: 37 // 5 ist 7, und 7 // 3 ist 2. Was ist 2 mod 4?
      - when: { matches: '^\s*1[\s,]+' }
        say: Die erste Ziffer ist der Rest von 37 geteilt durch 5.
    solution: '37 mod 5 = 2, weiter mit 7; 7 mod 3 = 1, weiter mit 2; 2 mod 4 = 2. Zurück: (2 · 3 + 1) · 5 + 2 = 37.'

  - id: klassen
    title: Farbklassen
    prompt: |
      Schreib `BoxClasses`, `embed`, `extract` und `capacity` in `stego.rb`.
      Speichere.
    file: stego/stego.rb
    check:
      type: ruby
      file: stego/stego.rb
      timeout: 20
      cases:
        - call: BoxClasses.new(3).members(BoxClasses.new(3).cell(0x5aa0c8)).length
          expect: '27'
          say: Eine Klasse mit 3 Werten pro Kanal hat 3 · 3 · 3 Farben.
        - call: BoxClasses.new(3).members([85, 85, 85]).length
          expect: '1'
          say: Am Rand ist die Klasse kleiner. Die Klasse 85 hat nur den Wert 255 in jedem Kanal, denn 256 = 85 · 3 + 1.
        - call: BoxClasses.new(3).members(BoxClasses.new(3).cell(0x5aa0c8)) == BoxClasses.new(3).members(BoxClasses.new(3).cell(0x5aa0c8)).sort
          expect: 'true'
          say: Die Farben einer Klasse müssen aufsteigend sortiert sein, sonst sind Ziffer und Farbe nicht eindeutig.
        - call: extract(embed(ChunkyPNG::Image.new(30, 10, ChunkyPNG::Color.rgb(90, 160, 200)), 'Treffpunkt', BoxClasses.new(3)), BoxClasses.new(3))
          expect: "'Treffpunkt'"
          say: Liest `extract` vom letzten benutzten Pixel zurück bis zum zwölften, mit der Zahl der Pixel aus den ersten 11?
        - call: extract(embed(ChunkyPNG::Image.new(30, 10, ChunkyPNG::Color.rgb(90, 160, 200)), 'Grüße', BoxClasses.new(5)), BoxClasses.new(5))
          expect: "'Grüße'"
        - call: capacity(ChunkyPNG::Image.new(30, 10, ChunkyPNG::Color.rgb(90, 160, 200)), BoxClasses.new(3)).round(1)
          expect: '1374.2'
          say: 'Jedes Pixel ab dem zwölften trägt log2(27) ≈ 4,75 Bits: 289 · 4,755 ≈ 1374,2.'
    hint:
      - |
        Nimm die Farbe `0x5aa0c8`, also Rot 90, Grün 160 und Blau 200, und Würfel der
        Breite 3: In welcher Klasse liegt sie, und welche Werte von Rot gehören zu
        dieser Klasse? Wie viele Farben hat die Klasse? Und die Klasse 85 ganz am
        Rand: Welche Werte hat sie, wenn es nur Werte bis 255 gibt?
      - |
        `cell` teilt jeden Kanal ganzzahlig durch die Breite. `members` nimmt für jeden
        Kanal die Werte `c * width` bis `c * width + width - 1`, aber höchstens bis
        255, und bildet alle Kombinationen (`product`), als `0xRRGGBB`, aufsteigend.
        `embed` macht aus der Botschaft die große Zahl und geht ab dem zwölften Pixel
        vor: `divmod` mit der Größe der Klasse gibt die nächste Zahl und die Ziffer,
        die Ziffer wählt die Farbe aus `members`. Die Zahl der benutzten Pixel kommt
        in die untersten Bits der ersten 11 Pixel. `extract` liest sie zuerst und geht
        dann vom letzten benutzten Pixel zurück bis zum zwölften:
        `number = number * Größe + Nummer der Farbe`.
      - |
        Ein Gerüst für die Klasse und `embed`; `extract` geht denselben Weg rückwärts:

        ```ruby
        class BoxClasses
            def initialize(width)
                @width = width
            end

            def cell(color)
                [color >> 16, (color >> 8) & 255, color & 255].map { |v| v / @width }
            end

            def members(cell)
                # hier: für jeden Kanal die Werte der Klasse, höchstens bis 255,
                # dann alle Kombinationen als 0xRRGGBB, aufsteigend
            end
        end

        def embed(image, message, classes)
            number = ("\x01".b + message.b).unpack1('H*').to_i(16)
            values = image.pixels.map { |c| c >> 8 }
            used = 0
            (11...values.length).each do |i|
                break if number == 0

                members = classes.members(classes.cell(values[i]))
                # hier: mit divmod die nächste Zahl und die Ziffer, das Pixel bekommt
                # die Farbe mit dieser Nummer, und used zählt mit
            end
            # hier: Fehler, wenn number noch nicht 0 ist; used als 33 Bits in die
            # untersten Bits der ersten 11 Pixel; das Bild aus values zurückgeben
        end
        ```
    python:
      prompt: |
        Schreib `BoxClasses`, `embed`, `extract` und `capacity` in
        `stego.py`. Speichere.
      file: stego/stego.py
      check:
        type: python
        file: stego/stego.py
        timeout: 20
        cases:
          - call: len(BoxClasses(3).members(BoxClasses(3).cell(0x5aa0c8)))
            expect: '27'
            say: Eine Klasse mit 3 Werten pro Kanal hat 3 · 3 · 3 Farben.
          - call: len(BoxClasses(3).members((85, 85, 85)))
            expect: '1'
            say: Am Rand ist die Klasse kleiner. Die Klasse 85 hat nur den Wert 255 in jedem Kanal, denn 256 = 85 · 3 + 1.
          - call: BoxClasses(3).members(BoxClasses(3).cell(0x5aa0c8)) == sorted(BoxClasses(3).members(BoxClasses(3).cell(0x5aa0c8)))
            expect: 'True'
            say: Die Farben einer Klasse müssen aufsteigend sortiert sein, sonst sind Ziffer und Farbe nicht eindeutig.
          - call: extract(embed(Image.new('RGB', (30, 10), (90, 160, 200)), 'Treffpunkt', BoxClasses(3)), BoxClasses(3))
            expect: "'Treffpunkt'"
            say: Liest `extract` vom letzten benutzten Pixel zurück bis zum zwölften, mit der Zahl der Pixel aus den ersten 11?
          - call: extract(embed(Image.new('RGB', (30, 10), (90, 160, 200)), 'Grüße', BoxClasses(5)), BoxClasses(5))
            expect: "'Grüße'"
          - call: round(capacity(Image.new('RGB', (30, 10), (90, 160, 200)), BoxClasses(3)), 1)
            expect: '1374.2'
            say: 'Jedes Pixel ab dem zwölften trägt log2(27) ≈ 4,75 Bits: 289 · 4,755 ≈ 1374,2.'
      hint:
        - |
          Nimm die Farbe `0x5aa0c8`, also Rot 90, Grün 160 und Blau 200, und Würfel der
          Breite 3: In welcher Klasse liegt sie, und welche Werte von Rot gehören zu
          dieser Klasse? Wie viele Farben hat die Klasse? Und die Klasse 85 ganz am
          Rand: Welche Werte hat sie, wenn es nur Werte bis 255 gibt?
        - |
          `cell` teilt jeden Kanal ganzzahlig durch die Breite. `members` nimmt für jeden
          Kanal die Werte `c * width` bis `c * width + width - 1`, aber höchstens bis
          255, und bildet alle Kombinationen, als `0xRRGGBB`, aufsteigend. `embed`
          macht aus der Botschaft die große Zahl und geht ab dem zwölften Pixel vor:
          `divmod` mit der Größe der Klasse gibt die nächste Zahl und die Ziffer, die
          Ziffer wählt die Farbe aus `members`. Die Zahl der benutzten Pixel kommt in
          die untersten Bits der ersten 11 Pixel. `extract` liest sie zuerst und geht
          dann vom letzten benutzten Pixel zurück bis zum zwölften:
          `number = number * Größe + Nummer der Farbe`.
        - |
          Ein Gerüst für die Klasse und `embed`; `extract` geht denselben Weg rückwärts:

          ```python
          class BoxClasses:
              def __init__(self, width):
                  self.width = width

              def cell(self, color):
                  w = self.width
                  return ((color >> 16) // w, ((color >> 8) & 255) // w, (color & 255) // w)

              def members(self, cell):
                  # hier: für jeden Kanal die Werte der Klasse, höchstens bis 255,
                  # dann alle Kombinationen als 0xRRGGBB, aufsteigend
                  ...


          def embed(image, message, classes):
              number = int.from_bytes(b'\x01' + message.encode(), 'big')
              values = colors(image)   # jedes Pixel als 0xRRGGBB
              used = 0
              for i in range(11, len(values)):
                  if number == 0:
                      break
                  members = classes.members(classes.cell(values[i]))
                  # hier: mit divmod die nächste Zahl und die Ziffer, das Pixel bekommt
                  # die Farbe mit dieser Nummer, und used zählt mit
              # hier: Fehler, wenn number noch nicht 0 ist; used als 33 Bits in die
              # untersten Bits der ersten 11 Pixel; das Bild aus values zurückgeben
          ```

          `colors` schreibst du dir selbst: jedes Pixel als `(r << 16) | (g << 8) | b`.

  - id: vorbei
    title: Am Test vorbei?
    prediction: true
    prompt: |
      Du versteckst die ersten 20.000 Zeichen der GIF-Spezifikation mit
      Würfeln der Breite 3 in `strandhaeuser.png`. Was ergibt `chi_square`
      danach für die Zeilen 0 bis 40? Überleg erst, dann probier es aus.
    check:
      type: choice
      options:
        - Eine große Zahl, wie bei einem Foto ohne Botschaft
        - Etwa 1, wie beim LSB-Verfahren
        - Etwa 3, weil jeder Kanal jetzt drei Werte annehmen kann
        - Gar nichts, `chi_square` bricht mit einem Fehler ab
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Probier es aus. Der Test zählt die Paare 2k und 2k+1. Liegen die beiden Werte eines Paares in derselben Klasse?
      - when: { picked: 3 }
        say: Der Test zählt nur, wie oft jeder Wert vorkommt. Das geht mit jedem Bild.
    solution: Über 200, sogar mehr als ohne Botschaft (163). Würfel der Breite 3 machen die Werte 3k, 3k+1 und 3k+2 gleich häufig. Die Paare des Tests liegen quer dazu, 2 und 3 etwa gehören zu verschiedenen Klassen. Für den Test sieht das Bild aus wie ein Foto.

  - id: gruppen
    title: Gruppen statt Paare
    prompt: |
      Gib `chi_square` einen vierten Parameter `width` mit dem Standardwert 2:
      Gruppen von `width` Werten statt Paaren, jede Gruppe geteilt durch
      `width - 1`. Speichere.
    file: stego/stego.rb
    check:
      type: ruby
      file: stego/stego.rb
      cases:
        - call: chi_square(from_channels(5, 1, [30, 31, 32] * 5), 0, 1, 3).round(2)
          expect: '0.0'
          say: 30, 31 und 32 kommen je fünfmal vor, eine ganz gleichmäßige Gruppe.
        - call: chi_square(from_channels(5, 1, [30] * 15), 0, 1, 3).round(2)
          expect: '15.0'
          say: 'Die Gruppe 30, 31, 32 hat e = 15 / 3 = 5: (15 − 5)²/5 + 2 · (0 − 5)²/5 = 30, geteilt durch width − 1 = 2.'
        - call: chi_square(from_channels(9, 1, [100] * 25 + [0, 0]), 0, 1, 5).round(2)
          expect: '25.0'
          say: 'Die Gruppe 100 bis 104 hat e = 5: (20² + 4 · 5²)/5 = 100, geteilt durch 4. Die Gruppe 0 bis 4 mit zwei Werten ist zu selten.'
        - call: chi_square(from_channels(4, 1, [10] * 12), 0, 1).round(2)
          expect: '12.0'
          say: Ohne `width` ist es der Test mit Paaren wie vorher.
    hint:
      - |
        Rechne das zweite Beispiel der Prüfung von Hand: 15 Kanäle mit dem Wert 30,
        Gruppen von 3. Welche Gruppe ist das, was sind ihre drei Zählungen, wie groß
        ist e, und was ergibt die Summe, geteilt durch `width - 1`?
      - |
        Statt der Paare 2k und 2k + 1 gehst du die Gruppen k durch, die Werte
        `k * width` bis `k * width + width - 1`, für k von 0 bis `256 / width - 1`.
        e ist der Durchschnitt der Zählungen der Gruppe, und jede Zählung c trägt
        `(c - e)² / e` bei. Eine Gruppe mit e < 5 lässt du weg, und jede Gruppe teilst
        du durch `width - 1`. Mit `width = 2` muss das genau dein Test von vorher
        sein.
    python:
      prompt: |
