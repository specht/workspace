  - id: fundstueck-2
    title: Das zweite Fundstück
    prompt: |
      In `fundstueck-2.png` steckt eine Botschaft in Würfeln, aber welcher
      Breite? Finde sie mit deinem Test und lies die Botschaft. Wie heißt das
      Codewort?
    check:
      type: answer
      expect: LEUCHTTURM
    feedback:
      - when: { matches: 'STRANDKORB' }
        say: Das ist das Codewort aus dem ersten Fundstück. Das zweite liest du mit `extract` und Würfeln der richtigen Breite.
    solution: Für die Zeilen 0 bis 40 ergibt nur der Test mit Gruppen von fünf etwa 1, alle anderen Breiten 45 und mehr. Mit Würfeln der Breite 5 kommt heraus »Gut gesucht! Mit Paaren findet der Test hier nichts, mit Gruppen von fünf schon. Das Codewort ist LEUCHTTURM.«, dann der Anfang der GIF-Spezifikation.

