# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
format: 1
activity: steganography
examples:
  bitebene:
    pass:
      - files: { stego/stego.rb: loesung/stego.rb }
    fail:
      - files: { stego/stego.rb: stufen/start.rb }
    python:
      pass:
        - files: { stego/stego.py: loesung/stego.py }
      fail:
        - files: { stego/stego.py: stufen/start.py }
  verstecken:
    pass:
      - files: { stego/stego.rb: loesung/stego.rb }
    fail:
      - files: { stego/stego.rb: stufen/start.rb }
    python:
      pass:
        - files: { stego/stego.py: loesung/stego.py }
      fail:
        - files: { stego/stego.py: stufen/start.py }
  codewort:
    pass:
      - answer: STRANDKORB
      - answer: strandkorb
    fail:
      - answer: reveal(bild)
        say: Bit 0
      - answer: STRANDHAUS
  chi:
    pass:
      - files: { stego/stego.rb: loesung/stego.rb }
    fail:
      - files: { stego/stego.rb: stufen/start.rb }
    python:
      pass:
        - files: { stego/stego.py: loesung/stego.py }
      fail:
        - files: { stego/stego.py: stufen/start.py }
  stellen:
    pass:
      - answer: 2 1 2
      - answer: 2, 1, 2
    fail:
      - answer: 2 1 0
        say: 2 mod 4
      - answer: 1 2 2
  klassen:
    pass:
      - files: { stego/stego.rb: loesung/stego.rb }
    fail:
      - files: { stego/stego.rb: stufen/start.rb }
    python:
      pass:
        - files: { stego/stego.py: loesung/stego.py }
      fail:
        - files: { stego/stego.py: stufen/start.py }
