# Katalog der Handbuch-Seiten, erreichbar unter /reference/<slug>.
# Format wie src/content/sections.yaml; die Schlüssel beginnen mit reference-,
# damit sie sich nicht mit den Abschnitten der Startseite überschneiden.
- key: reference-workspace
  label: Workspace
  icon: /images/rocket.png
  description: |
    Handgriffe, die viele Aktivitäten brauchen: das Terminal öffnen,
    Repositories klonen und die Live-Vorschau starten.
  entries:
    - workspace

- key: reference-shortcuts
  label: Shortcuts
  icon: /images/keyboard.png
  description: |
    Bewegen, markieren, bearbeiten, suchen und mehrere Cursor, mit der
    Tastatur statt der Maus; vieles davon gilt in fast jedem Programm.
  entries:
    - shortcuts

- key: reference-terminal
  label: Terminal
  icon: /images/penguin.png
  description: |
    Dateien und Verzeichnisse im Terminal: ansehen, durchsuchen, packen,
    kopieren und löschen.
  entries:
    - terminal

- key: reference-web
  label: HTML und CSS
  icon: /images/pen.png
  description: |
    Webseiten und Folien bauen: Inhalt mit HTML, Aussehen mit CSS, Anordnung
    mit Flexbox und Spalten. Jedes Beispiel als Webseite und als Folie.
  entries:
    - html
    - css
    - layout

- key: reference-presentations
  label: Präsentationen
  icon: /images/book.png
  description: |
    Was nur für Folien mit Shower gilt: Aufbau einer Folie, gute Folien, die
    Klassen der Vorlage, Seitenzahl, Formeln und Präsentieren.
  entries:
    - shower

- key: reference-latex
  label: Dokumente mit LaTeX
  icon: /images/memo.png
  description: |
    Facharbeiten, Protokolle und Bewerbungen mit LaTeX: Gliederung,
    Tabellen, Bilder, Formeln, Quellen, Seitenlayout und Schriften, dazu
    fertige Vorlagen.
  entries:
    - latex

- key: reference-colors
  label: Farben
  icon: /images/palette.png
  description: |
    Farben mit Namen, Farbcodes oder Rot-, Grün- und Blauanteilen angeben, in
    CSS und im Anaglyph-Viewer. Dazu die Farbräume RGB, HSV, YCbCr und
    CIELab und wie man zwischen ihnen umrechnet.
  entries:
    - farben
    - farbraeume

- key: reference-network
  label: Netzwerk und Daten
  icon: /images/handshake.png
  description: |
    Die Befehle fürs Netz im Terminal (ping, nc, dig, ssh), wie Browser und
    Server miteinander reden (HTTP), und die beiden Schreibweisen für Daten,
    die dabei und in Einstellungen vorkommen: JSON und YAML.
  entries:
    - netzwerk
    - http
    - json
    - yaml

- key: reference-git
  label: Git und Git-Server
  icon: /images/git.png
  description: |
    Die Befehle für jeden Tag: Commits, die Geschichte, Branches, Konflikte,
    Teilen und Rückgängigmachen. Dazu, was du einmal einrichtest:
    SSH-Schlüssel, Name und E-Mail, und was zu tun ist, wenn ein Push
    abgelehnt wird.
  entries:
    - git
    - gitlab

- key: reference-databases
  label: Datenbanken
  icon: /images/card-file-box.png
  description: |
    SQL für MySQL nachschlagen, ER-Modelle als Text schreiben und in
    Tabellen übersetzen, und was in den Datensätzen der Aktivitäten steht.
  entries:
    - sql
    - er-modelle
    - datensaetze

- key: reference-stories
  label: Interaktive Geschichten
  icon: /images/books.png
  description: |
    Die Schreibweisen von BIF zum Nachschlagen: Seiten, Entscheidungen,
    Variablen und Bedingungen, Aussehen, Bilder und Zufall, und was die
    Meldungen unter »Problems« bedeuten.
  entries:
    - bif

- key: reference-minicpu
  label: MiniCPU
  icon: /images/computer.png
  description: |
    Der Prozessor der CPU Sandbox: alle Befehle der Stufen 8, 8S und 8X mit
    Opcode, Flags und Takten, Register, Stack, Maschinencode und Assembler;
    dazu die Geräte, der Bildschirm und C für die MiniCPU.
  entries:
    - minicpu
    - minicpu-io
    - minicpu-c

- key: reference-c-grafik
  label: Grafik und Spiele in C
  icon: /images/star.png
  description: |
    C selbst zum Nachschlagen: Typen, Rechnen, Arrays, Structs, Bits, Zeiger,
    Dateien und Fehlermeldungen. PixelRAM für Bilder aus einzelnen Pixeln,
    raylib für Spiele in 3D mit Kamera, Licht, Texturen und Shadern; dazu
    Tastatur, Maus und Zeit. GLSL für die Shader selbst, prozedurale Texturen
    für Holz, Fliesen und Marmor ohne ein einziges Bild.
  entries:
    - c
    - pixelram
    - raylib
    - glsl
    - prozedurale-texturen

- key: reference-algorithms
  label: Algorithmen und Datenstrukturen
  icon: /images/brain.png
  description: |
    Wie Sortierverfahren, Suchen in Graphen und Datenstrukturen arbeiten,
    Schritt für Schritt zum Durchklicken und als Pseudocode zum Übersetzen
    in die eigene Sprache.
  entries:
    - listen
    - sortieren
    - graphen
    - heap
    - baeume
    - hash-tables

- key: reference-automata
  label: Automaten und reguläre Ausdrücke
  icon: /images/key.png
  description: |
    Endliche Automaten, die ein Wort Zeichen für Zeichen lesen, und reguläre
    Ausdrücke (Regex), die Muster für Text beschreiben: wie man beide
    schreibt und benutzt, und wie aus dem einen das andere wird.
  entries:
    - automaten
    - regex

- key: reference-kartografie
  label: Kartografie
  icon: /images/book.png
  description: |
    Räume in Textdateien festhalten, Feld für Feld: Wände, Türen, Leuchten,
    Treppen und Wasser. Für Räume, die man findet, und für solche, die man baut.
  entries:
    - kartografie

- key: reference-people
  label: Personen
  icon: /images/technologist.png
  description: |
    Wer grep, Git, das Bit oder den kürzesten Weg im Navi erfunden hat:
    die Menschen, die im Workspace vorkommen, mit Foto und dem, was sie
    gemacht haben.
  entries:
    - personen
