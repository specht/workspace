# Katalog der Handbuch-Seiten, erreichbar unter /reference/<slug>.
# Format wie src/content/sections.yaml; die Schlüssel beginnen mit reference-,
# damit sie sich nicht mit den Abschnitten der Startseite überschneiden.
- key: reference-workspace
  label: Workspace
  icon: /images/rocket.png
  description: |
    Handgriffe, die viele Aktivitäten brauchen: das Terminal öffnen,
    Repositories klonen und die Live-Vorschau starten.
  entries:
    - workspace

- key: reference-shortcuts
  label: Shortcuts
  icon: /images/keyboard.png
  description: |
    Bewegen, markieren, bearbeiten, suchen und mehrere Cursor, mit der
    Tastatur statt der Maus; vieles davon gilt in fast jedem Programm.
  entries:
    - shortcuts

- key: reference-terminal
  label: Terminal
  icon: /images/penguin.png
  description: |
    Dateien und Verzeichnisse im Terminal: ansehen, durchsuchen, packen,
    kopieren und löschen.
  entries:
    - terminal

- key: reference-web
  label: HTML und CSS
  icon: /images/pen.png
  description: |
    Webseiten und Folien bauen: Inhalt mit HTML, Aussehen mit CSS, Anordnung
    mit Flexbox und Spalten. Jedes Beispiel als Webseite und als Folie.
  entries:
    - html
    - css
    - layout

- key: reference-presentations
  label: Präsentationen
  icon: /images/book.png
  description: |
    Was nur für Folien mit Shower gilt: Aufbau einer Folie, gute Folien, die
    Klassen der Vorlage, Seitenzahl, Formeln und Präsentieren.
  entries:
    - shower

- key: reference-colors
  label: Farben
  icon: /images/palette.png
  description: |
    Farben mit Namen, Farbcodes oder Rot-, Grün- und Blauanteilen angeben, in
    CSS und im Anaglyph-Viewer.
  entries:
    - farben

- key: reference-git
  label: Git und GitLab
  icon: /images/git.png
  description: |
    Einmal einrichten und dann immer wieder brauchen: SSH-Schlüssel, Name und
    E-Mail für Git, und was zu tun ist, wenn ein Push abgelehnt wird.
  entries:
    - gitlab

- key: reference-databases
  label: Datenbanken
  icon: /images/card-file-box.png
  description: |
    ER-Modelle als Text schreiben und in Tabellen übersetzen.
  entries:
    - er-modelle

- key: reference-stories
  label: Interaktive Geschichten
  icon: /images/books.png
  description: |
    Die Schreibweisen von BIF zum Nachschlagen: Seiten, Entscheidungen,
    Variablen und Bedingungen, Aussehen, Bilder und Zufall, und was die
    Meldungen unter »Problems« bedeuten.
  entries:
    - bif

- key: reference-minicpu
  label: MiniCPU
  icon: /images/computer.png
  description: |
    Der Prozessor der CPU Sandbox: alle Befehle der Stufen 8, 8S und 8X mit
    Opcode, Flags und Takten, Register, Stack, Maschinencode und Assembler;
    dazu die Geräte, der Bildschirm und C für die MiniCPU.
  entries:
    - minicpu
    - minicpu-io
    - minicpu-c
