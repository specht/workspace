# Sources for the claims in the person boxes (personen.md), shown on the
# development page /person-sources (src/ruby/include/person_sources.rb).
#
# Per box (the name of its part) a list of claims. text is a piece of the
# box as it reads on the page, without markup; a sentence of the box that
# contains it counts as covered. Each claim has
#
#   sources:  links with the passage that backs the claim (quote, verbatim
#             from the source, in its language)
#   verdict:  partly or wrong, when the sources say something else than the
#             box (note: what they say, a proposal for the box)
#   none:     instead of sources, why the sentence needs none (it is about
#             the Workspace, not about the person)
#
# A claim whose text no longer occurs in the box is listed on the page as
# missing: the box was changed after it was checked.

leibniz:
  - text: (1646–1716), deutscher Philosoph und Mathematiker, ab 1676 Bibliothekar und Hofrat in Hannover
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Leibniz/
        quote: "Born: 1 July 1646, Leipzig, Saxony (now Germany). Died: 14 November 1716, Hannover, Hanover (now Germany) … accepted a position from the Duke of Hanover, Johann Friedrich, … as librarian and Court Councillor … The rest of Leibniz's life, from December 1676 until his death, was spent at Hanover"
  - text: 1673 zeigte er der Royal Society in London das hölzerne Modell einer Rechenmaschine
    sources:
      - url: https://en.wikipedia.org/wiki/Stepped_reckoner
        quote: "He presented a wooden model to the Royal Society of London on 1 February 1673 and received much encouragement."
  - text: Sie war die erste, die alle vier Grundrechenarten konnte, und rechnete noch mit Zehnerziffern
    sources:
      - url: https://en.wikipedia.org/wiki/Stepped_reckoner
        quote: "It was the first calculator that could perform all four basic arithmetic operations."
  - text: Die einzige erhaltene steht heute in der Landesbibliothek in Hannover
    sources:
      - url: https://en.wikipedia.org/wiki/Stepped_reckoner
        quote: "today only one survives in the National Library of Lower Saxony … in Hanover, Germany"
  - text: 1679 schrieb er zum ersten Mal auf, wie man nur mit 0 und 1 zählt und rechnet
    sources:
      - url: https://en.wikipedia.org/wiki/Binary_number#Leibniz
        quote: "His first known work on binary, \"On the Binary Progression\", in 1679, … algorithms for performing basic arithmetic operations such as addition, subtraction, multiplication, and division using binary numbers"
  - text: gedruckt erschien es 1703 als Explication de l'Arithmétique Binaire
    sources:
      - url: https://en.wikipedia.org/wiki/Binary_number#Leibniz
        quote: "His most well known work appears in his article Explication de l'Arithmétique Binaire (published in 1703)."
  - text: Darin deutet er auch die Zeichen des I Ging, Figuren aus sechs ganzen und gebrochenen Strichen, als Zahlen im Zweiersystem
    sources:
      - url: https://fr.wikisource.org/wiki/Leibniz-en.francais-Gerhardt.Math.1a7.djvu/Num%C3%A9ration.binaire
        quote: "Explication de l'arithmétique binaire, qui se sert des seuls caractères 0 et 1, avec des remarques sur son utilité, et sur ce qu'elle donne le sens des anciennes figures chinoises de Fohy"
  - text: Er hatte seine Art zu zählen dem Jesuiten Joachim Bouvet in Peking geschickt, und Bouvet erkannte darin diese alten chinesischen Figuren wieder
    sources:
      - url: https://fr.wikisource.org/wiki/Leibniz-en.francais-Gerhardt.Math.1a7.djvu/Num%C3%A9ration.binaire
        quote: "Il n’y a guères plus de deux ans que j’envoyai au R. P. Bouvet, Jésuite Français célèbre, qui demeure à Pékin, ma manière de compter par 0 et 1, et il n’en fallut pas davantage"
      - url: https://en.wikipedia.org/wiki/Binary_number#Leibniz
        quote: "While corresponding with the Jesuit priest Joachim Bouvet in 1700 … Bouvet demonstrated in his 1701 letters that the I Ching was an independent, parallel invention of binary notation."
  - text: Wie in seinen Beispielen addierst du in den Katas zu Bits Stelle für Stelle mit Übertrag
    none: Workspace

boole:
  - text: (1815–1864), englischer Mathematiker, Professor in Cork in Irland
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Boole/
        quote: "Born: 2 November 1815, Lincoln, Lincolnshire, England. Died: 8 December 1864, Ballintemple, County Cork, Ireland … Boole was appointed to the chair of mathematics at Queens College, Cork in 1849."
  - text: In seinem Buch The Laws of Thought von 1854 rechnete er mit Aussagen, die wahr oder falsch sind, wie mit Zahlen
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Boole/
        quote: "An investigation into the Laws of Thought … (1854) … Boole approached logic in a new way reducing it to a simple algebra, incorporating logic into mathematics."
  - text: Nach ihm heißen true und false in vielen Sprachen Boolean, in Python ist es der Typ bool
    sources:
      - url: https://en.wikipedia.org/wiki/Boolean_data_type
        quote: "It is named after George Boole, who first defined an algebraic system of logic in the mid-19th century. … Python, from version 2.3 forward, has a bool type which is a subclass of int"

eccles-jordan:
  - text: (1875–1966) und F. W. Jordan, britische Physiker
    sources:
      - url: https://en.wikipedia.org/wiki/William_Eccles
        quote: "William Eccles (physicist) (1875–1966), British physicist and pioneer in the development of radio communication"
      - url: https://en.wikipedia.org/wiki/Flip-flop_(electronics)#History
        quote: "The first electronic latch was invented in 1918 by the British physicists William Eccles and F. W. Jordan."
  - text: 1918 meldeten sie eine Schaltung aus zwei Elektronenröhren zum Patent an, die sich gegenseitig in ihrem Zustand halten
    sources:
      - url: https://en.wikipedia.org/wiki/Flip-flop_(electronics)#History
        quote: "It was initially called the Eccles–Jordan trigger circuit and consisted of two active elements (vacuum tubes). … Schematics from the Eccles and Jordan trigger relay patent filed 1918, one drawn as a cascade of amplifiers with a positive feedback path, and the other as a symmetric cross-coupled pair"
  - text: das erste elektronische Latch, ein Speicher für ein Bit
    sources:
      - url: https://en.wikipedia.org/wiki/Flip-flop_(electronics)#History
        quote: "The first electronic latch was invented in 1918"
  - text: Sie hieß zuerst Eccles–Jordan trigger circuit, heute heißt sie Flipflop
    sources:
      - url: https://en.wikipedia.org/wiki/Flip-flop_(electronics)#History
        quote: "It was initially called the Eccles–Jordan trigger circuit"
  - text: 1943 steckte sie in Colossus, dem britischen Rechner, der im Krieg verschlüsselte Nachrichten knackte
    sources:
      - url: https://en.wikipedia.org/wiki/Flip-flop_(electronics)#History
        quote: "The design was used in the 1943 British Colossus codebreaking computer"
  - text: Im RS-Flipflop aus zwei NOR-Gattern halten sich die beiden Gatter genauso gegenseitig fest wie die beiden Röhren
    none: Workspace

snellius:
  - text: (1580–1626), niederländischer Mathematiker, Professor in Leiden
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Snell/
        quote: "Born: 13 June 1580, Leiden, Netherlands. Died: 30 October 1626, Leiden, Netherlands … On 8 February 1613 he succeeded his father as professor of mathematics at the University of Leiden."
  - text: dein Raytracer rechnet die neue Richtung mit dem Brechungsgesetz aus
    none: Workspace
  - text: Snellius fand das Gesetz 1621, veröffentlichte es aber nie
    sources:
      - url: https://en.wikipedia.org/wiki/Snell%27s_law#History
        quote: "In 1621, the Dutch astronomer Willebrord Snellius (1580–1626)—Snell—derived a mathematically equivalent form, that remained unpublished during his lifetime."
  - text: "René Descartes fand es unabhängig von ihm und druckte es 1637"
    note: "Korrigiert; vorher: »gedruckt hat es 1637 René Descartes«"
    sources:
      - url: https://en.wikipedia.org/wiki/Snell%27s_law#History
        quote: "René Descartes independently derived the law using heuristic momentum conservation arguments in terms of sines in his 1637 essay La Dioptrique."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Snell/
        quote: "he did not publish it and only in 1703 did it become known when Christiaan Huygens published Snell's result in Dioptrica."
  - text: Aufgeschrieben hatte es schon um 984 Ibn Sahl in Bagdad
    sources:
      - url: https://en.wikipedia.org/wiki/Snell%27s_law#History
        quote: "first discovered by the Persian scientist Ibn Sahl, at Baghdad court in 984."
  - text: Er peilte von Kirchturm zu Kirchturm, legte ein Netz aus Dreiecken über das Land, maß eine Grundlinie von Hand
    sources:
      - url: https://en.wikipedia.org/wiki/Willebrord_Snellius
        quote: "Snellius's high points were nearly all church spires … a network of fourteen measure points to make a total of 53 triangulation measurements"
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Snell/
        quote: "He used as a baseline the distance from his house to the local church spire, then built a system of triangles."
  - text: wie lang ein Grad auf dem Weg von Nord nach Süd ist, und damit den Umfang der Erde (Eratosthenes Batavus, 1617)
    sources:
      - url: https://en.wikipedia.org/wiki/Willebrord_Snellius
        quote: "in modern units 107.37 km for one degree of latitude … gives a circumference of the Earth of 38,653 km"
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Snell/
        quote: "Eratosthenes Batavus … which contains his methods for measuring the Earth."
  - text: bis ins 20. Jahrhundert ihre Karten gemacht
    sources:
      - url: https://en.wikipedia.org/wiki/Triangulation_(surveying)
        quote: "were used for accurate large-scale land surveying until the rise of global navigation satellite systems in the 1980s"

euler:
  - text: Leonhard Euler (1707–1783), Schweizer Mathematiker.
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Euler/
        quote: "Born: 15 April 1707, Basel, Switzerland. Died: 18 September 1783, St Petersburg, Russia"
      - url: https://en.wikipedia.org/wiki/Leonhard_Euler
        quote: "was a Swiss polymath who was active as a mathematician, physicist, astronomer"
  - text: 1736 zeigte er, dass es keinen Spaziergang durch Königsberg gibt, der jede der sieben Brücken genau einmal überquert.
    note: >-
      Die Jahreszahl ist üblich, aber nicht ganz eindeutig: Euler trug die Lösung 1735 in
      St. Petersburg vor, die Arbeit erschien im Band der Akademie für 1736, gedruckt 1741.
      Kein Fehler, nur zur Kenntnis.
    sources:
      - url: https://en.wikipedia.org/wiki/Seven_Bridges_of_K%C3%B6nigsberg
        quote: "Its mathematical formalization and proof of impossibility by Leonhard Euler, in 1736 … Euler proved that the problem has no solution."
      - url: https://scholarlycommons.pacific.edu/euler-works/53/
        quote: "This is one of Euler's most famous papers: the Königsberg bridge problem. … eventually determining that the Königsberg bridge problem is unsolvable."
      - url: https://en.wikipedia.org/wiki/Leonhard_Euler
        quote: "In 1735, Euler presented a solution to the problem known as the Seven Bridges of Königsberg."
  - text: Dafür kam es nur darauf an, welche Ufer und Inseln durch welche Brücken verbunden sind, nicht auf Straßen und Entfernungen
    sources:
      - url: https://en.wikipedia.org/wiki/Seven_Bridges_of_K%C3%B6nigsberg
        quote: "Since only the connection information is relevant … Only the number of edges (possibly zero) between each pair of nodes is significant."
      - url: https://scholarlycommons.pacific.edu/euler-works/53/
        quote: "In it, Euler reduces the problem to an analysis of the degrees of vertices on a graph,"
  - text: auch hinter dem Stadtplan im Routenplaner
    none: Workspace
  - text: Mit diesem Beweis beginnt die Graphentheorie.
    sources:
      - url: https://en.wikipedia.org/wiki/Leonhard_Euler
        quote: "This solution is considered to be the first theorem of graph theory."
      - url: https://scholarlycommons.pacific.edu/euler-works/53/
        quote: "It is often cited as the earliest paper in both topology and graph theory."
  - text: Ab 1738 sah er auf dem rechten Auge fast nichts mehr
    sources:
      - url: https://en.wikipedia.org/wiki/Leonhard_Euler
        quote: "In 1738, three years after nearly dying of fever, he became almost blind in his right eye."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Euler/
        quote: "his eyesight problems began in 1738 with overstrain due to his cartographic work"
  - text: ab 1766 war er fast blind
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Euler/
        quote: "In 1766 Euler returned to St Petersburg … Soon after his return to Russia, Euler became almost entirely blind after an illness."
      - url: https://en.wikipedia.org/wiki/Leonhard_Euler
        quote: "In 1766 a cataract in his left eye was discovered."
  - text: Er arbeitete trotzdem weiter und diktierte
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Euler/
        quote: "he produced almost half his total works despite the total blindness."
      - url: https://www.cambridge.org/core/books/abs/elements-of-algebra/advertisement-by-the-editors-of-the-original-in-german/16BA8FCDAA4E58716FAF2A2BC54024EE
        quote: "The loss of sight had suggested the idea to him … For this purpose M. Euler pitched on a young man, whom he had engaged as a servant on his departure from Berlin … has not only retained what his illustrious master taught and dictated to him"
  - text: 1775 entstand im Schnitt jede Woche eine neue mathematische Arbeit.
    sources:
      - url: https://en.wikipedia.org/wiki/Leonhard_Euler
        quote: "With the aid of his scribes, Euler's productivity in many areas of study increased; … in 1775, he produced, on average, one mathematical paper per week."

lambert:
  - text: Johann Heinrich Lambert (1728–1777), Mathematiker, Physiker und Astronom aus Mülhausen im Elsass.
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Lambert/
        quote: "Born 26 August 1728 Mülhausen, Alsace (now Mulhouse, France) … Died 25 September 1777 Berlin, Prussia (now Germany)"
  - text: rechnet dein Raytracer mit dot(normal, sun_dir)
    none: Workspace
  - text: Dieses Kosinusgesetz schrieb Lambert 1760 in seinem Buch Photometria auf
    sources:
      - url: https://en.wikipedia.org/wiki/Lambertian_reflectance
        quote: "Lambertian reflectance is named after Johann Heinrich Lambert, … who introduced the concept of perfect diffusion in his 1760 book Photometria."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Lambert/
        quote: "In 1759 he went to Augsburg where he found a publisher for two more of his books, Photometria and Cosmologische Briefe. … 'Lambert's cosine law' states that the brightness of a diffusely radiating plane surface is proportional … to the cosine of the angle formed by the line of sight and the normal to the surface."
  - text: matte Flächen heißen in der Computergrafik bis heute »lambertsch«
    sources:
      - url: https://en.wikipedia.org/wiki/Lambertian_reflectance
        quote: "In computer graphics, Lambertian reflection is often used as a model for diffuse reflection."
  - text: Sein Vater war Schneider, und mit zwölf musste Lambert die Schule verlassen, um in der Werkstatt zu helfen
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Lambert/
        quote: "Lambert's father, Lukas Lambert, was a tailor as his own father had been. … However, when he was twelve years old he had to leave school to help his father with tailoring."
  - text: alles Weitere brachte er sich in seiner freien Zeit selbst bei
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Lambert/
        quote: "Usually his day was fully occupied in helping his father but in the evenings he would study scientific subjects on his own."
  - text: Später arbeitete er an der Akademie in Berlin
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Lambert/
        quote: "Lambert was therefore delighted to go to Berlin in 1764 at the invitation of Euler. … As a member of the physical class for twelve years"
  - text: in einer Arbeit, die 1768 erschien, bewies er als Erster, dass π irrational ist
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Lambert/
        quote: "However Lambert was the first to give a rigorous proof that π is irrational."
      - url: https://en.wikipedia.org/wiki/Proof_that_%CF%80_is_irrational
        quote: "In 1768, Johann Heinrich Lambert published a proof that π is irrational"

fresnel:
  - text: Augustin-Jean Fresnel (1788–1827), französischer Ingenieur und Physiker.
    sources:
      - url: https://en.wikipedia.org/wiki/Augustin-Jean_Fresnel
        quote: "(10 May 1788 – 14 July 1827) was a French civil engineer and physicist"
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Fresnel/
        quote: "10 May 1788 … 14 July 1827 … completing the course there in three years after which he was qualified as a civil engineer"
  - text: Von vorn spiegelt Glas nur etwa 4 Prozent, am Rand der Kugel fast alles.
    sources:
      - url: https://en.wikipedia.org/wiki/Fresnel_equations
        quote: "the power reflectance at normal incidence can be seen to be about 4% … At grazing incidence (θi → 90°), we have cos θi → 0, hence rs → −1 and ts → 0."
  - text: Wie viel Licht die Glaskugel spiegelt und wie viel sie durchlässt, hängt vom Winkel ab
    none: Workspace
  - text: Die Formeln dafür, die Fresnel-Gleichungen, stellte er Anfang der 1820er Jahre auf
    sources:
      - url: https://en.wikipedia.org/wiki/Fresnel_equations
        quote: "In 1821, however, Augustin-Jean Fresnel derived results equivalent to his sine and tangent laws."
      - url: https://en.wikipedia.org/wiki/Augustin-Jean_Fresnel
        quote: "on the detailed derivation of the Fresnel equations and their application to total internal reflection"
  - text: dein Raytracer nimmt die kurze Näherung
    none: Workspace
  - text: die Christophe Schlick 1994 für die Computergrafik fand
    note: >-
      Das Jahr 1994 steht im Literaturverweis des Wikipedia-Artikels (Computer Graphics Forum 13(3), 1994,
      DOI 10.1111/1467-8659.1330233); Wiley und die Eurographics-Bibliothek antworteten mit 403.
    sources:
      - url: https://en.wikipedia.org/wiki/Schlick%27s_approximation
        quote: "In 3D computer graphics, Schlick's approximation, named after Christophe Schlick, is a formula for approximating … \"An Inexpensive BRDF Model for Physically-based Rendering\""
  - text: Damit Leuchttürme weiter zu sehen sind, baute Fresnel eine Linse aus Glasringen, die das Licht bündelt wie eine dicke Linse, aber dünn und leicht bleibt.
    sources:
      - url: https://en.wikipedia.org/wiki/Fresnel_lens
        quote: "reduces the amount of material required compared to a conventional lens … dividing the lens into a set of concentric annular sections … making it visible at greater distances"
  - text: Die erste leuchtete ab dem 25. Juli 1823 im Leuchtturm von Cordouan an der Mündung der Gironde
    sources:
      - url: https://en.wikipedia.org/wiki/Fresnel_lens
        quote: "On 25 July 1823, the world's first lighthouse Fresnel lens was lit."
      - url: https://www.guinnessworldrecords.com/world-records/717348-first-fresnel-lens-in-a-lighthouse
        quote: "The first of these lenses to be installed in a lighthouse was at Cordouan Lighthouse … which was activated on 25 July 1823."
  - text: war über 30 Kilometer weit zu sehen
    sources:
      - url: https://en.wikipedia.org/wiki/Fresnel_lens
        quote: "As expected, the light was visible to the horizon, more than 32 kilometres (20 mi) out."
      - url: https://www.guinnessworldrecords.com/world-records/717348-first-fresnel-lens-in-a-lighthouse
        quote: "It could be seen more than 20 miles (37 km) out at sea."
  - text: die Spiegel davor warfen nur etwa die Hälfte des Lichts zurück
    sources:
      - url: https://en.wikipedia.org/wiki/Augustin-Jean_Fresnel
        quote: "to replace the reflectors then in use, which reflected only about half of the incident light"
  - text: Fresnel-Linsen stecken heute in Overheadprojektoren, Ampeln und Rücklichtern von Autos.
    sources:
      - url: https://en.wikipedia.org/wiki/Fresnel_lens
        quote: "use Fresnel lenses as condensers in overhead projectors … are also used in traffic lights … continue in wide use in automobile tail, marker, and reversing lights"

lovelace:
  - text: Ada Lovelace (1815–1852), englische Mathematikerin, Tochter des Dichters Lord Byron.
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Lovelace/
        quote: "Born 10 December 1815 Piccadilly, Middlesex (now in London), England … Died 27 November 1852 Marylebone, London, England"
      - url: https://en.wikipedia.org/wiki/Ada_Lovelace
        quote: "Augusta Ada King, Countess of Lovelace (née Byron; 10 December 1815 – 27 November 1852), also known as Ada Lovelace, was an English mathematician and writer … She was the only legitimate child of poet Lord Byron"
  - text: 1843 übersetzte sie einen Aufsatz über die Analytical Engine, eine Rechenmaschine, die Charles Babbage entworfen hatte, und schrieb Anmerkungen dazu, etwa dreimal so lang wie der Aufsatz.
    sources:
      - url: https://en.wikipedia.org/wiki/Ada_Lovelace
        quote: "She augmented the paper with seven notes, A to G, about three times longer than the translation."
      - url: https://www.fourmilab.ch/babbage/sketch.html
        quote: "Sketch of The Analytical Engine Invented by Charles Babbage By L. F. MENABREA of Turin … With notes upon the Memoir by the Translator ADA AUGUSTA, COUNTESS OF LOVELACE"
      - url: https://en.wikipedia.org/wiki/Ada_Lovelace
        quote: "The translation and notes were then published in the September 1843 edition of Taylor's Scientific Memoirs under her initials AAL."
  - text: "In der letzten, Note G, steht Schritt für Schritt, wie die Maschine die Bernoulli-Zahlen ausrechnen soll: das erste veröffentlichte Programm."
    sources:
      - url: https://en.wikipedia.org/wiki/Ada_Lovelace
        quote: "Note G described, in complete detail, a method for calculating a sequence of Bernoulli numbers using the Analytical Engine … Though Babbage's personal notes from 1837 to 1840 contain the first programs for the engine, the algorithm in Note G is often called the first published computer program."
  - text: Für jede weitere Zahl wiederholen sich darin die Schritte 13 bis 23, eine Schleife.
    sources:
      - url: https://www.fourmilab.ch/babbage/sketch.html
        quote: "It will be perceived that every unit added to n in B2n-1, entails an additional repetition of operations (13…23) for the computation of B2n-1."
  - text: "Lovelace nannte so etwas einen »cycle of operations«, eine Folge von Schritten, die mehr als einmal ausgeführt wird, und kannte auch schon die Schleife in der Schleife: »a cycle of cycles«."
    sources:
      - url: https://www.fourmilab.ch/babbage/sketch.html
        quote: "A cycle of operations, then, must be understood to signify any set of operations which is repeated more than once. … In many cases of analysis there is a recurring group of one or more cycles; that is, a cycle of a cycle, or a cycle of cycles."
  - text: Die Maschine wurde nie fertig gebaut, und das Programm lief nie.
    sources:
      - url: https://en.wikipedia.org/wiki/Ada_Lovelace
        quote: "The engine was never completed and so the program was never tested."
  - text: "Lovelace sah aber schon, dass sie mehr kann als rechnen: Stünden die Zahlen für Töne, könnte sie Musik komponieren."
    sources:
      - url: https://www.fourmilab.ch/babbage/sketch.html
        quote: "Supposing, for instance, that the fundamental relations of pitched sounds in the science of harmony and of musical composition were susceptible of such expression and adaptations, the engine might compose elaborate and scientific pieces of music of any degree of complexity or extent."
  - text: Die Programmiersprache Ada ist nach ihr benannt.
    sources:
      - url: https://en.wikipedia.org/wiki/Ada_Lovelace
        quote: "The computer language Ada, created on behalf of the United States Department of Defense, was named after Lovelace."

maxwell:
  - text: James Clerk Maxwell (1831–1879), schottischer Physiker.
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Maxwell/
        quote: "Born: 13 June 1831, Edinburgh, Scotland … Died: 5 November 1879, Cambridge, England"
  - text: Er ließ Menschen Farben aus drei Lichtern nachmischen
    sources:
      - url: https://homepages.abdn.ac.uk/j.s.reid/pages/Maxwell/Legacy/MaxTri.html
        quote: "he could measure the amount of primary spectral colours needed to match any other colour"
      - url: https://en.wikipedia.org/wiki/James_Clerk_Maxwell
        quote: "inventing colour matching experiments and Colourimetry"
  - text: stützte so Youngs Idee von drei Empfängern im Auge
    sources:
      - url: https://en.wikipedia.org/wiki/James_Clerk_Maxwell
        quote: "used the recently developed linear algebra to prove Young's theory"
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Maxwell/
        quote: "The results afford most remarkable and important evidence in favour of the theory of three primary colour-perceptions"
      - url: https://mathshistory.st-andrews.ac.uk/Projects/Johnson/chapter-5/
        quote: "develop the theory that the eye recognises three primary colours - red, green and violet."
  - text: aus drei Lichtern mischt auch jedes Pixel deines Bildschirms seine Farbe
    none: Workspace
  - text: Das Farbfoto von 1861 nahm der Fotograf Thomas Sutton für ihn auf.
    sources:
      - url: https://en.wikipedia.org/wiki/James_Clerk_Maxwell
        quote: "Thomas Sutton, inventor of the single-lens reflex camera, took the picture. … He photographed a tartan ribbon three times, through red, green, and blue filters"
      - url: https://mathshistory.st-andrews.ac.uk/Projects/Johnson/chapter-5/
        quote: "Maxwell's final achievement in optics was producing the first ever colour photograph."
  - text: Seine Platten waren für Rot fast blind
    sources:
      - url: https://en.wikipedia.org/wiki/James_Clerk_Maxwell
        quote: "Because Sutton's photographic plates were insensitive to red and barely sensitive to green,"
      - url: https://mathshistory.st-andrews.ac.uk/Projects/Johnson/chapter-5/
        quote: "the collodion process he had used was not red sensitive."
  - text: 'warum das rote Bild trotzdem etwas zeigte, fanden Forscher erst 1961 heraus: Der rote Farbstoff der Schleife warf auch ultraviolettes Licht zurück.'
    note: >-
      Die Erklärung stammt von Ralph M. Evans (1961) und ist seitdem die übliche. Neuere Aufsätze
      von Susanne Klein u. a. (UWE Bristol, z. B. »Maxwell’s disappointment and Sutton’s accident«,
      uwe-repository.worktribe.com/OutputFile/10253233, und mdpi.com/2571-9408/6/2/54) prüfen sie neu;
      sie antworteten mit 403 und konnten nicht gelesen werden. Bitte von Hand ansehen, ob dort
      »fanden heraus« zu stark ist (dann etwa »erklärten Forscher 1961«).
    sources:
      - url: https://en.wikipedia.org/wiki/James_Clerk_Maxwell
        quote: "Researchers in 1961 concluded that the seemingly impossible partial success of the red-filtered exposure … which is strongly reflected by some red dyes"
      - url: https://mathshistory.st-andrews.ac.uk/Projects/Johnson/chapter-5/
        quote: "which was sensitive to the ultraviolet passed by the filter, compensated for the error."
  - text: Berühmt ist Maxwell vor allem für seine Gleichungen von 1865.
    sources:
      - url: https://en.wikipedia.org/wiki/A_Dynamical_Theory_of_the_Electromagnetic_Field
        quote: "is a paper by James Clerk Maxwell on electromagnetism, published in 1865. … formulated twenty equations which were to become known as Maxwell's equations"
  - text: Aus ihnen schloss er, dass Licht eine Welle aus elektrischen und magnetischen Feldern ist.
    sources:
      - url: https://en.wikipedia.org/wiki/A_Dynamical_Theory_of_the_Electromagnetic_Field
        quote: "deduces that light is an electromagnetic wave"
      - url: https://en.wikipedia.org/wiki/James_Clerk_Maxwell
        quote: "light is an electromagnetic disturbance propagated through the field according to electromagnetic laws."

ducos-du-hauron:
  - text: "Louis Ducos du Hauron (1837–1920), französischer Erfinder"
    sources:
      - url: https://en.wikipedia.org/wiki/Louis_Arthur_Ducos_du_Hauron
        quote: "Louis Arthur Ducos du Hauron (8 December 1837 – 31 August 1920) was a French pioneer of color photography."
      - url: https://fr.wikipedia.org/wiki/Louis_Ducos_du_Hauron
        quote: "né à Langon le 8 décembre 1837 et mort à Agen le 31 août 1920"
  - text: "ließ sich 1891 Bilder patentieren, die zwei Ansichten einer Szene in Rot und Blau übereinander drucken"
    sources:
      - url: https://www.cnc.fr/cinema/actualites/lhistoire-de-la-stereoscopie--comment-la-france-a-reve-limage-en-relief_2670854
        quote: "En 1891, il dépose en France un brevet pour des images stéréoscopiques … pouvant produire leur effet sans avoir recours au stéréoscope. … Le principe consiste à superposer les deux images correspondant aux yeux gauche et droit … en utilisant des couleurs différentes, puis à les séparer au moment de la vision grâce à des filtres colorés."
      - url: https://en.wikipedia.org/wiki/Anaglyph_3D
        quote: "Louis Ducos du Hauron produced the first printed anaglyphs in 1891."
  - text: "durch eine Brille mit einem roten und einem blauen Glas sieht jedes Auge nur seine: die Anaglyphen"
    sources:
      - url: https://en.wikipedia.org/wiki/Louis_Arthur_Ducos_du_Hauron
        quote: "In 1891, he introduced the anaglyph stereoscopic print, the \"red and blue glasses\" type of 3D print."
      - url: https://www.cnc.fr/cinema/actualites/lhistoire-de-la-stereoscopie--comment-la-france-a-reve-limage-en-relief_2670854
        quote: "C’est l’anaglyphe, dont Louis Ducos du Hauron développe et nomme le procédé, … même si la séparation des images par la couleur avait déjà été tentée auparavant. … Le principe des fameuses lunettes rouge et bleu (ou rouge et cyan dans leurs versions plus modernes) est déjà là."
  - text: "Dein Viewer macht dasselbe mit Rot und Cyan."
    none: Workspace
  - text: "Schon 1868 hatte er beschrieben, wie man ein farbiges Bild aus drei Aufnahmen durch drei Farbfilter zusammensetzt"
    sources:
      - url: https://en.wikipedia.org/wiki/Louis_Arthur_Ducos_du_Hauron
        quote: "In 1868 he patented his ideas (French Patent No. 83061)"
      - url: https://www.esrf.fr/home/news/general/content-news/general/a-colour-photography-pioneer-comes-to-light-thanks-to-the-synchrotron.html
        quote: "He was the first one to produce three-color prints using three negatives printed into three colour positives … He photographed each scene through green, orange, and violet filters"
      - url: https://fr.wikipedia.org/wiki/Louis_Ducos_du_Hauron
        quote: "obtenues par trois prises de vues successives au travers de trois filtres de couleurs complémentaires"

sierpinski:
  - text: Wacław Sierpiński (1882–1969), polnischer Mathematiker in Warschau
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Sierpinski/
        quote: "Born: 14 March 1882, Warsaw, Russian Empire (now Poland). Died: 21 October 1969, Warsaw, Poland … In 1919 he was promoted to professor at Warsaw and he spent the rest of his life there."
  - text: mit über 700 Aufsätzen und 50 Büchern
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Sierpinski/
        quote: "Sierpiński was the author of the incredible number of 724 papers and 50 books."
  - text: "1916 beschrieb er ein Quadrat, aus dem die Mitte fehlt, und aus jedem der acht Quadrate drumherum wieder die Mitte, ohne Ende: den Sierpinski-Teppich."
    sources:
      - url: https://en.wikipedia.org/wiki/Sierpi%C5%84ski_carpet
        quote: "The Sierpiński carpet is a plane fractal first described by Wacław Sierpiński in 1916. … The square is cut into 9 congruent subsquares in a 3-by-3 grid, and the central subsquare is removed. The same procedure is then applied recursively to the remaining 8 subsquares, ad infinitum."
      - url: https://mathworld.wolfram.com/SierpinskiCarpet.html
        quote: "Sierpiński, W. \"On Curves Which Contain the Image of Any Given Curve.\" Mat. Sbornik 30, 267-287, 1916."
  - text: Auch ein Dreieck aus Dreiecken trägt seinen Namen.
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Sierpinski/
        quote: "About this time he introduced what is now called the Sierpiński triangle or Sierpiński gasket."
      - url: https://en.wikipedia.org/wiki/Sierpi%C5%84ski_triangle
        quote: "Wacław Sierpiński described the Sierpiński triangle in 1915."
  - text: Ein Muster, das in jedem Ausschnitt wieder sich selbst enthält, heißt heute Fraktal.
    sources:
      - url: https://en.wikipedia.org/wiki/Fractal
        quote: "This exhibition of similar patterns at increasingly smaller scales is called self-similarity … The term \"fractal\" was coined by the mathematician Benoît Mandelbrot in 1975."
  - text: Dein Shader rechnet den Teppich mit einer Schleife aus vier Zeilen.
    none: Workspace

luhn:
  - text: Hans Peter Luhn (1896–1964), Ingenieur aus Barmen (heute Wuppertal)
    sources:
      - url: https://en.wikipedia.org/wiki/Hans_Peter_Luhn
        quote: "Hans Peter Luhn (July 1, 1896 – August 19, 1964) … Luhn was born in Barmen, Germany (now part of Wuppertal) on July 1, 1896."
      - url: https://spectrum.ieee.org/hans-peter-luhn-and-the-birth-of-the-hashing-algorithm
        quote: "Luhn was born in Barmen, Germany, in 1896."
  - text: später bei IBM in den USA
    sources:
      - url: https://spectrum.ieee.org/hans-peter-luhn-and-the-birth-of-the-hashing-algorithm
        quote: "Luhn came to the United States in 1924 to scout for potential locations for textile mills. … Luhn knew more about the textiles industry than computer science when he arrived at IBM in 1941."
      - url: https://en.wikipedia.org/wiki/Hans_Peter_Luhn
        quote: "He joined IBM as a senior research engineer in 1941"
  - text: 1953 schlug er in einer Notiz für IBM vor, Schlüssel mit einer Rechnung auf Buckets zu verteilen und Kollisionen in Listen zu sammeln
    sources:
      - url: https://www.gwern.net/doc/cs/algorithm/information/compression/1998-knuth-taocp-v3-sortingandsearching-hashinghistory.pdf
        quote: "The idea of hashing appears to have been originated by H. P. Luhn, who wrote an internal IBM memorandum in January 1953 that suggested the use of chaining; in fact, his suggestion was one of the first applications of linked linear lists. He pointed out the desirability of using buckets that contain more than one element, for external searching."
      - url: https://spectrum.ieee.org/hans-peter-luhn-and-the-birth-of-the-hashing-algorithm
        quote: "In early 1953, Luhn had written an internal IBM memo in which he suggested putting information into \"buckets\" … Luhn's idea was to assign each entry to a numbered bucket, as follows:"
  - text: "die erste Hash Table, mit Chaining"
    sources:
      - url: https://en.wikipedia.org/wiki/Hash_table#History
        quote: "In January 1953, Hans Peter Luhn wrote an internal IBM memorandum that used hashing with chaining."
      - url: https://www.gwern.net/doc/cs/algorithm/information/compression/1998-knuth-taocp-v3-sortingandsearching-hashinghistory.pdf
        quote: "The idea of hashing appears to have been originated by H. P. Luhn"
  - text: Von ihm stammt auch die letzte Ziffer jeder Kreditkartennummer, die Prüfziffer nach dem Luhn-Algorithmus
    sources:
      - url: https://en.wikipedia.org/wiki/Luhn_algorithm
        quote: "Most credit card numbers and many government identification numbers use the algorithm as a simple method of distinguishing valid numbers from mistyped or otherwise incorrect numbers. … Drop the check digit (last digit) of the number to validate."
      - url: https://patents.google.com/patent/US2950048A/en
        quote: "This invention relates to a hand computer for computing a check digit for numbers"
  - text: "Mit ihr fällt eine falsch getippte Ziffer sofort auf."
    sources:
      - url: https://en.wikipedia.org/wiki/Luhn_algorithm
        quote: "will detect all single-digit errors, as well as almost all transpositions of adjacent digits."

menger:
  - text: Karl Menger (1902–1985), österreichischer Mathematiker
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Menger/
        quote: "Born: 13 January 1902 Vienna, Austria. Died: 5 October 1985 Chicago, Illinois, USA"
  - text: ab 1937 in den USA
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Menger/
        quote: "he went to the United States in 1937 to take up the post."
  - text: "1926 fragte er, was die Dimension einer Form eigentlich ist, und beschrieb dafür einen Würfel, aus dem in jeder Stufe Kreuze fehlen: den Menger-Schwamm"
    sources:
      - url: https://en.wikipedia.org/wiki/Menger_sponge
        quote: "It was first described by Karl Menger in 1926, in his studies of the concept of topological dimension."
      - url: https://mathworld.wolfram.com/MengerSponge.html
        quote: "Menger (1926) proved that the Menger sponge is universal for all compact 1-dimensional metric spaces"
  - text: Sierpińskis Teppich in drei Dimensionen
    sources:
      - url: https://en.wikipedia.org/wiki/Menger_sponge
        quote: "It is a three-dimensional generalization of the two-dimensional Sierpinski carpet."
      - url: https://mathworld.wolfram.com/MengerSponge.html
        quote: "The Menger sponge is a fractal which is the three-dimensional analog of the Sierpiński carpet."
  - text: Mit jeder Stufe schrumpft sein Volumen gegen null, und seine Oberfläche wächst ohne Grenze.
    sources:
      - url: https://en.wikipedia.org/wiki/Menger_sponge
        quote: "Therefore, the construction's volume approaches zero while its surface area increases without bound."
  - text: "Mathematisch hat er trotzdem die Dimension 1: Er ist weder ein Körper noch eine Fläche, sondern eine Kurve."
    note: "Korrigiert; vorher: »Mathematisch ist er darum weder ein Körper noch eine Fläche, sondern eine Kurve.«"
    sources:
      - url: https://en.wikipedia.org/wiki/Menger_sponge
        quote: "it has a topological dimension of 1 and is accordingly identified as a curve. … Menger showed, in the 1926 construction, that the sponge is a universal curve"

neumann:
  - text: John von Neumann (1903–1957), Mathematiker aus Budapest
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Von_Neumann/
        quote: "Born: 28 December 1903, Budapest, Hungary. Died: 8 February 1957, Washington D.C., USA"
  - text: ab 1930 in den USA
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Von_Neumann/
        quote: "In 1930 von Neumann became a visiting lecturer at Princeton University, being appointed professor there in 1931."
  - text: "Merge Sort dachte er sich 1945 aus; den Teil, der zwei sortierte Folgen zusammenfügt, schrieb er als eines der ersten Programme für einen Rechner auf, der sein Programm im Speicher hält."
    note: "Korrigiert; vorher: »Merge Sort schrieb er 1945 auf, als eines der ersten Programme für einen Rechner, der sein Programm im Speicher hält.«"
    sources:
      - url: https://bgb-online.e-bookshelf.de/routines-of-substitution-11594746.html
        quote: "the earliest known surviving example of von Neumann’s coding … a routine written in 1945 to ‘mesh’ two sequences of data … intended to be part of a larger program implementing the algorithm now known as mergesort."
      - url: https://en.wikipedia.org/wiki/Merge_sort
        quote: "Merge sort is a divide-and-conquer algorithm that was invented by John von Neumann in 1945. … A detailed description and analysis of bottom-up merge sort appeared in a report by Goldstine and von Neumann as early as 1948."
      - url: https://www.wkiri.com/today/?p=2206
        quote: "Von Neumann conceived of a merge sort algorithm … wrote out an implementation of the merge part of it, which Knuth examined and reported on."
  - text: 'Wie ein solcher Rechner gebaut ist, beschrieb er im selben Jahr: Programm und Daten im selben Speicher.'
    note: >-
      Stimmt. Die Wikipedia weist darauf hin, dass der Bericht Entwürfe von Eckert und Mauchly
      beschreibt, die er nicht nennt; »beschrieb« ist deshalb das richtige Wort.
    sources:
      - url: https://en.wikipedia.org/wiki/First_Draft_of_a_Report_on_the_EDVAC
        quote: "It contains the first published description of the logical design of a computer using the stored-program concept"
      - url: https://en.wikipedia.org/wiki/First_Draft_of_a_Report_on_the_EDVAC
        quote: "a uniform memory containing both numbers (data) and orders (instructions)."
      - url: https://en.wikipedia.org/wiki/Von_Neumann_architecture
        quote: "based on the First Draft of a Report on the EDVAC, written by John von Neumann in 1945,"
  - text: So sind Computer bis heute gebaut
    sources:
      - url: https://en.wikipedia.org/wiki/Von_Neumann_architecture
        quote: "The vast majority of modern computers use the same hardware mechanism"
  - text: auch die MiniCPU der CPU Sandbox
    none: Workspace

hopper:
  - text: Grace Hopper (1906–1992), amerikanische Informatikerin und Konteradmiralin der US Navy.
    sources:
      - url: https://en.wikipedia.org/wiki/Grace_Hopper
        quote: "Grace Brewster Hopper (née Murray; December 9, 1906 – January 1, 1992) … was an American computer scientist, mathematician, and United States Navy rear admiral."
      - url: https://cs.yale.edu/homes/tap/Files/hopper-story.html
        quote: "Grace Brewster Murray was born on December 9, 1906 in New York City. … She died in her sleep in Arlington, Virginia on January 1, 1992. … Upon her retirement from the Navy in 1986 with the rank of Rear Admiral"
  - text: Schon 1952 schrieb sie ein Programm, das aus kurzen Befehlen Maschinencode zusammensetzt, und nannte es Compiler
    sources:
      - url: https://en.wikipedia.org/wiki/Grace_Hopper
        quote: "In 1952, she had an operational link-loader, which at the time was referred to as a compiler."
      - url: https://cs.yale.edu/homes/tap/Files/hopper-story.html
        quote: "she published her first compiler paper in 1952."
  - text: niemand glaubte ihr zunächst, dass ein Rechner so etwas kann
    sources:
      - url: https://en.wikipedia.org/wiki/Grace_Hopper
        quote: "had a running compiler and nobody would touch it. They told me computers could only do arithmetic."
  - text: Sie wollte Programme in englischen Wörtern schreiben und hörte, Computer verstünden kein Englisch.
    sources:
      - url: https://cs.yale.edu/homes/tap/Files/hopper-story.html
        quote: "she was told very quickly that [she] couldn't do this because computers didn't understand English."
  - text: Ihre Sprache FLOW-MATIC benutzte trotzdem englische Wörter, und COBOL übernahm das
    sources:
      - url: https://en.wikipedia.org/wiki/FLOW-MATIC
        quote: "the first programming language to express operations using English-like statements … FLOW-MATIC and its direct descendant AIMACO shaped COBOL, which incorporated several of its elements"
      - url: https://cs.yale.edu/homes/tap/Files/hopper-story.html
        quote: "Admiral hopper moved forward with the development for Univac of the B-O compiler, later known as FLOW-MATIC. … The design was greatly influenced by FLOW-MATIC."
  - text: 1947 fand ihr Team in einem Relais des Rechners Mark II eine Motte und klebte sie ins Logbuch
    sources:
      - url: https://www.computerhistory.org/tdih/september/9/
        quote: "On September 9, 1947, a team of computer scientists and engineers reported a moth caught between the relay contacts of the Harvard Mark II computer in Cambridge, Massachusetts."
      - url: https://en.wikipedia.org/wiki/Grace_Hopper
        quote: "While Hopper was working on a Mark II Computer at Harvard University in 1947, … her associates discovered a moth that was stuck in a relay and impeding the operation of the computer."
  - text: »First actual case of bug being found«
    sources:
      - url: https://www.computerhistory.org/tdih/september/9/
        quote: "First actual case of bug being found."
  - text: Fehler hießen schon vorher Bugs
    sources:
      - url: https://www.computerhistory.org/tdih/september/9/
        quote: "Originating with Thomas Edison in the 1800s, the term \"bug\" is still used widely to describe a mistake or failure in a technical system."
      - url: https://daily.jstor.org/the-bug-in-the-computer-bug-story/
        quote: "‘Bugs’ as such little faults and difficulties are called."
  - text: aber Hopper erzählte die Geschichte so gern, dass sie berühmt wurde
    sources:
      - url: https://www.computerhistory.org/tdih/september/9/
        quote: "Programmer Grace Hopper -- a CHM Fellow (1987) -- was present and made the incident famous later on in her many public lectures."

kleene:
  - text: Stephen Cole Kleene (1909–1994), Mathematiker in Madison, Wisconsin.
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Kleene/
        quote: "5 January 1909 … 25 January 1994 … Madison, Wisconsin, USA … In 1964 he was named Cyrus C Duffee Professor and continued to hold that chair until he retired in 1979."
      - url: https://en.wikipedia.org/wiki/Stephen_Cole_Kleene
        quote: "a full professor in 1948 and the Cyrus C. MacDuffee professor of mathematics in 1964"
  - text: Jedes * in einem regulären Ausdruck, bei grep oder in der Suche von VS Code, ist sein Stern.
    sources:
      - url: https://en.wikipedia.org/wiki/Kleene_star
        quote: "first introduced and widely used it to characterize automata for regular expressions"
      - url: https://en.wikipedia.org/wiki/Stephen_Cole_Kleene
        quote: "the Kleene star (Kleene closure)"
  - text: 1951 wollte er wissen, welche Muster ein Netz aus Nervenzellen erkennen kann, und erfand dafür die Bausteine, die heute reguläre Ausdrücke heißen
    sources:
      - url: https://en.wikipedia.org/wiki/Stephen_Cole_Kleene
        quote: "He also invented regular expressions in 1951 to describe McCulloch-Pitts neural networks"
      - url: https://en.wikipedia.org/wiki/Regular_expression
        quote: "Regular expressions originated in 1951 … motivated by Kleene's attempt to describe early artificial neural networks"
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Kleene/
        quote: "He spent the summer of 1951 at the RAND Corporation and discovered an important characterisation of finite automata."
  - text: zwanzig Jahre bevor es grep gab
    sources:
      - url: https://en.wikipedia.org/wiki/Grep
        quote: "grep was first included in Version 4 Unix."
    note: >-
      Laut Infobox des Wikipedia-Artikels erschien grep im November 1973, also 22 Jahre nach 1951;
      »zwanzig Jahre« ist als runde Zahl in Ordnung.
  - text: Er bewies auch, dass sie und endliche Automaten genau dasselbe können.
    sources:
      - url: https://en.wikipedia.org/wiki/Regular_language
        quote: "The equivalence of regular expressions and finite automata is known as Kleene's theorem"
      - url: https://en.wikipedia.org/wiki/Stephen_Cole_Kleene
        quote: "gave an important characterization of events accepted by a finite automaton"

bezier:
  - text: Pierre Bézier (1910–1999), französischer Ingenieur bei Renault.
    sources:
      - url: https://en.wikipedia.org/wiki/Pierre_B%C3%A9zier
        quote: "1 September 1910 – 25 November 1999 … As an engineer at Renault, he became a leader in the transformation of design and manufacturing"
      - url: https://arxiv.org/pdf/2408.13125
        quote: "At about the same time and not far away, the engineer Pierre Bézier (1910-1999) at Renault was also working on the question of how to mathematically describe the curves given by designers"
  - text: Ab den 1960er Jahren beschrieb er die Formen von Autokarosserien mit diesen Kurven, damit Maschinen sie fräsen können.
    sources:
      - url: https://en.wikipedia.org/wiki/B%C3%A9zier_curve
        quote: "The Bézier curve is named after French engineer Pierre Bézier (1910–1999), who used it in the 1960s for designing curves for the bodywork of Renault cars."
      - url: https://arxiv.org/pdf/2408.13125
        quote: "how to mathematically describe the curves given by designers, such that the tools could be formed in an exact way, based on NC milling."
      - url: https://en.wikipedia.org/wiki/Pierre_B%C3%A9zier
        quote: "began researching CAD/CAM in 1960 while at Renault"
  - text: Paul de Casteljau hatte sie bei Citroën schon 1959 gefunden
    sources:
      - url: https://arxiv.org/pdf/2408.13125
        quote: "On 1 April 1958, de Casteljau started at Citroën in the Tooling department … His initial approach, documented at the French patent office INPI only months after his entry (de Casteljau, 1959), focused on the trajectory of the mill as a 3D-polyline."
      - url: https://en.wikipedia.org/wiki/Pierre_B%C3%A9zier
        quote: "The curves were first developed in 1959 by Paul de Casteljau."
  - text: aber Citroën hielt sie geheim; darum heißen sie nach Bézier.
    note: >-
      Müller ergänzt, dass Bézier de Casteljaus Ansatz über Leute kannte, die von Citroën zu Renault
      gewechselt waren, seine Kurven aber auf eigenem Weg konstruierte. Der Satz der Box stimmt so.
    sources:
      - url: https://arxiv.org/pdf/2408.13125
        quote: "However, due to different corporate policies on communicating intellectual property, Bézier already gained internationally prominence in the late 1960's (Bézier, 1966, 1967, 1968); while de Casteljau was first mentioned in France in the 1970's … Citroën's secrecy also had an influence on knowledge networks"
      - url: https://en.wikipedia.org/wiki/B%C3%A9zier_curve
        quote: "De Casteljau's method was patented in France but not published until the 1980s."
  - text: Jeder Buchstabe einer Schrift auf deinem Bildschirm ist aus Bézierkurven gebaut
    sources:
      - url: https://en.wikipedia.org/wiki/B%C3%A9zier_curve
        quote: "TrueType fonts use composite Bézier curves composed of quadratic Bézier curves."
  - text: "und die meisten Kurven in SVG auch"
    note: "Korrigiert; vorher: »und jede Form in SVG auch«"
    sources:
      - url: https://www.w3.org/TR/SVG2/paths.html
        quote: "A cubic Bézier segment is defined by a start point, an end point, and two control points. … An elliptical arc segment draws a segment of an ellipse."

turing:
  - text: "Alan Turing (1912–1954), britischer Mathematiker."
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Turing/
        quote: "Born 23 June 1912 London, England … Died 7 June 1954 Wilmslow, Cheshire, England"
      - url: https://en.wikipedia.org/wiki/Turing_Award
        quote: "The award is named after Alan Turing, also referred as \"Father of Computer Science\", who was a British mathematician"
  - text: "gab er 1936 seiner Turingmaschine"
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Turing/
        quote: "In 1936 he published On Computable Numbers, with an application to the Entscheidungsproblem."
      - url: https://bletchleypark.org.uk/wp-content/uploads/record_attachments/1800.pdf
        quote: "He published his most important theoretical work in 1936, On computable numbers, with an application to the Entscheidungsproblem, in which he proposed a machine that could perform logical operations, seen as the underlying foundation of digital computation."
  - text: "ein Band ohne Ende, auf dem sie lesen und schreiben kann"
    sources:
      - url: https://plato.stanford.edu/entries/turing-machine/
        quote: "It is supplied with a one-way infinite and one-dimensional tape divided into squares"
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Turing/
        quote: "The Turing machine could write a symbol on the tape, or delete a symbol from the tape."
      - url: https://en.wikipedia.org/wiki/Turing_machine
        quote: "The machine operates on an infinite memory tape divided into discrete cells,"
  - text: "Was ein Computer berechnen kann, kann auch sie"
    sources:
      - url: https://en.wikipedia.org/wiki/Turing_machine
        quote: "Despite the model's simplicity, it is capable of implementing any computer algorithm."
  - text: "er bewies, dass es Fragen gibt, die keine Maschine beantworten kann"
    sources:
      - url: https://plato.stanford.edu/entries/turing-machine/
        quote: "Turing used these abstract devices to prove that there is no effective general method … Finally, based on the uncomputability of PRINT? Turing shows that the Entscheidungsproblem is not decidable."
      - url: https://en.wikipedia.org/wiki/Turing_machine
        quote: "Turing machines proved the existence of fundamental limitations on the power of mechanical computation."
  - text: "Im Zweiten Weltkrieg half er in Bletchley Park, die verschlüsselten Funksprüche der deutschen Wehrmacht zu entziffern."
    sources:
      - url: https://bletchleypark.org.uk/wp-content/uploads/record_attachments/1800.pdf
        quote: "Turing was recruited by the Government Code and Cypher School in 1938 as they prepared for the possibility of war with Germany and reported to Bletchley Park on 4 September 1939, the day after war was declared. … Turing designed a machine for breaking Enigma - the Bombe - which by the autumn of 1940 was being used to help break Enigma-enciphered messages."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Turing/
        quote: "Together with another mathematician W G Welchman, Turing developed the Bombe, a machine based on earlier work by Polish mathematicians, which from late 1940 was decoding all messages sent by the Enigma machines of the Luftwaffe."
  - text: "Der wichtigste Preis der Informatik heißt nach ihm Turing Award."
    sources:
      - url: https://en.wikipedia.org/wiki/Turing_Award
        quote: "It is generally recognized as the highest distinction in the field of computer science … The award is named after Alan Turing"

shannon:
  - text: Claude Shannon (1916–2001).
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Shannon/
        quote: "Born: 30 April 1916 … Died: 24 February 2001"
      - url: https://news.mit.edu/2001/shannon
        quote: "Born in Petoskey, Mich., on April 30, 1916, … died Saturday, February 24 at the Courtyard Nursing Care Center in Medford, Mass."
  - text: Wie viele Bits eine Nachricht mindestens braucht, rechnete er 1948 aus
    sources:
      - url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
        quote: "Reprinted with corrections from The Bell System Technical Journal, Vol. 27, pp. 379–423, 623–656, July, October, 1948. … We will now justify our interpretation of H as the rate of generating information by proving that H determines the channel capacity required with most efficient coding. … As N increases G_N approaches H, the entropy of the source and H′ approaches H."
  - text: gründete damit die Informationstheorie
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Shannon/
        quote: "Shannon published A Mathematical Theory of Communication in the Bell System Technical Journal (1948). … This paper founded the subject of information theory and he proposed a linear schematic model of a communications system."
  - text: das Wort Bit machte er bekannt
    sources:
      - url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
        quote: "If the base 2 is used the resulting units may be called binary digits, or more briefly bits, a word suggested by J. W. Tukey."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Shannon/
        quote: "which introduced the word \"bit\" for the first time"
  - text: Er fuhr Einrad, jonglierte
    sources:
      - url: https://news.mit.edu/2001/shannon
        quote: "At Bell, he was remembered for riding the halls on a unicycle while juggling three balls."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Shannon/
        quote: "he continued to threaten corridor-walkers on his unicycle, sometimes augmenting the hazard by juggling"
  - text: baute die Maus Theseus, die selbst lernte, durch ein Labyrinth zu finden
    sources:
      - url: https://www.technologyreview.com/2018/12/19/138508/mighty-mouse/
        quote: "But Shannon’s electromechanical toy was able to “remember” its path with the help of telephone relay switches. … The mouse, which was featured in Popular Science, Time, and Life magazines the same year the AT&T film was made, learned purely through trial and error."
      - url: https://news.mit.edu/2001/shannon
        quote: "Claude Shannon's electromechanical mouse, which he called Theseus"
  - text: Schon als Student am MIT zeigte er 1937 in seiner Masterarbeit, dass sich Schaltungen aus Relais mit der Algebra von George Boole beschreiben und vereinfachen lassen
    sources:
      - url: https://en.wikipedia.org/wiki/A_Symbolic_Analysis_of_Relay_and_Switching_Circuits
        quote: "A Symbolic Analysis of Relay and Switching Circuits is the title of a master's thesis written by computer science pioneer Claude E. Shannon while attending the Massachusetts Institute of Technology (MIT) in 1937, … In his thesis, Shannon … proved that Boolean algebra could be used to simplify the arrangement of the relays"
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Shannon/
        quote: "Shannon wrote a Master's thesis A Symbolic Analysis of Relay and Switching Circuits on the use of Boole's algebra to analyse and optimise relay switching circuits."
  - text: mit 1 und 0 für einen Kontakt, der geschlossen oder offen ist
    sources:
      - url: https://news.mit.edu/2001/shannon
        quote: "His master's thesis, \"A Symbolic Analysis of Relay and Switching Circuits,\" used Boolean algebra--in which problems are solved by manipulating two symbols, 1 and 0--to establish the theoretical underpinnings of digital circuits."
  - text: Damit begann die Theorie der digitalen Schaltungen.
    sources:
      - url: https://news.mit.edu/2001/shannon
        quote: "This work was the beginning of modern switching theory."
  - text: "Einen Code mit so wenigen Bits wie möglich suchten er und Robert Fano fast gleichzeitig, jeder für sich."
    note: "Korrigiert; vorher: »Einen Code mit so wenigen Bits wie möglich suchte er mit Robert Fano.«"
    sources:
      - url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
        quote: "This method of encoding is substantially the same as one found independently by R. M. Fano."
      - url: https://en.wikipedia.org/wiki/Shannon%E2%80%93Fano_coding
        quote: "Around 1948, both Claude E. Shannon (1948) and Robert M. Fano (1949) independently proposed two different source coding algorithms"
  - text: Der Shannon-Fano-Code kam nah heran, aber nicht immer ganz.
    sources:
      - url: https://en.wikipedia.org/wiki/Shannon%E2%80%93Fano_coding
        quote: "they do not always achieve the lowest possible expected codeword length, as Huffman coding does"
      - url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
        quote: "We see from this that the inefficiency in coding, when only a finite delay of N symbols is used, need not be greater than 1/N plus the difference between the true entropy H and the entropy G_N calculated for sequences of length N."

chomsky:
  - text: Noam Chomsky (geboren 1928), amerikanischer Sprachwissenschaftler am MIT.
    sources:
      - url: https://en.wikipedia.org/wiki/Noam_Chomsky
        quote: "Avram Noam Chomsky (born December 7, 1928) is an American intellectual, philosopher, linguist … He is a laureate professor of linguistics at the University of Arizona and an institute professor emeritus at the Massachusetts Institute of Technology (MIT)."
  - text: Er beschrieb Sprachen durch Regeln, die alle ihre Sätze erzeugen, durch Grammatiken, und machte das 1957 mit seinem Buch Syntactic Structures bekannt.
    sources:
      - url: https://en.wikipedia.org/wiki/Noam_Chomsky
        quote: "in 1957 emerged as a significant figure in linguistics with his landmark work Syntactic Structures, which played a major role in remodeling the study of language. … He created or co-created the universal grammar theory, the generative grammar theory, the Chomsky hierarchy"
      - url: https://en.wikipedia.org/wiki/Chomsky_hierarchy
        quote: "A formal grammar describes how to form strings from a formal language's alphabet that are valid according to the language's syntax."
  - text: 1956 ordnete er Grammatiken danach, was ihre Regeln dürfen; die Ordnung heißt heute Chomsky-Hierarchie.
    sources:
      - url: https://en.wikipedia.org/wiki/Chomsky_hierarchy#History
        quote: "The general idea of a hierarchy of grammars was first described by Noam Chomsky in \"Three models for the description of language\" during the formalization of transformational-generative grammar (TGG)."
      - url: https://doi.org/10.1109/TIT.1956.1056813
        quote: "Three models for the description of language. N. Chomsky. IRE Transactions on Information Theory, 1956 (Crossref: issued 1956-09)"
  - text: Die Syntax von Programmiersprachen beschreibt man seit ALGOL 60 mit kontextfreien Grammatiken, ihrer Stufe 2.
    sources:
      - url: https://en.wikipedia.org/wiki/Context-free_grammar
        quote: "In an early application, grammars are used to describe the structure of programming languages. … Block structure was introduced into computer programming languages by the Algol project (1957–1960), which, as a consequence, also featured a context-free grammar to describe the resulting Algol syntax."
      - url: https://en.wikipedia.org/wiki/Chomsky_hierarchy
        quote: "Type-2 grammars generate the context-free languages."

naur:
  - text: Peter Naur (1928–2016), dänischer Informatiker, zuerst Astronom.
    sources:
      - url: https://en.wikipedia.org/wiki/Peter_Naur
        quote: "Peter Naur (25 October 1928 – 3 January 2016) was a Danish computer science pioneer and 2005 Turing Award winner. … He began his career as an astronomer for which he received his Doctor of Philosophy (Ph.D.) degree in 1957, but his encounter with computers led to a change of profession."
  - text: 1960 gab er den Bericht über die Programmiersprache ALGOL 60 heraus und legte darin die ganze Sprache mit der Schreibweise von John Backus fest, die seitdem Backus-Naur-Form heißt.
    sources:
      - url: https://en.wikipedia.org/wiki/Peter_Naur
        quote: "his role as editor of the influential Report on the Algorithmic Language ALGOL 60 with its pioneering use of BNF was recognized. … He is best remembered as a contributor, with John Backus, to the Backus–Naur form (BNF) notation used in describing the syntax for most programming languages."
      - url: https://www.masswerk.at/algol60/report.htm
        quote: "Revised Report on the Algorithmic Language Algol 60 … [originally] Edited by Peter Naur"
      - url: https://en.wikipedia.org/wiki/Backus%E2%80%93Naur_form
        quote: "John Backus, a programming language designer at IBM, proposed a metalanguage of metalinguistic formulas to define the syntax of the new programming language IAL, known today as ALGOL 58, in 1959. This notation was formalized in the ALGOL 60 report"
  - text: Dafür bekam er 2005 den Turing Award.
    sources:
      - url: https://en.wikipedia.org/wiki/Peter_Naur
        quote: "Naur won the 2005 Association for Computing Machinery (ACM) A.M. Turing Award for his work on defining the programming language ALGOL 60."
  - text: Das Wort »computer science« mochte er nicht und schlug »datalogi« vor; in Dänemark und Schweden heißt die Informatik bis heute so.
    sources:
      - url: https://en.wikipedia.org/wiki/Peter_Naur
        quote: "Naur disliked the term computer science and suggested it be called datalogy or data science. The former term has been adopted in Denmark and Sweden as datalogi"

bauer-samelson:
  - text: Friedrich L. Bauer (1924–2015, im Bild) und Klaus Samelson (1918–1980), Mathematiker in München
    sources:
      - url: https://badw.de/fileadmin/nachrufe/Bauer%20Friedrich%20L..pdf
        quote: "Zum Tode von Friedrich L. Bauer (10.06.1924 – 26.03.2015)"
      - url: https://www.deutsches-museum.de/assets/Forschung/Archiv/Download/Findbuecher_PDF/NL_214_Samelson.pdf
        quote: "Klaus Samelson wurde am 21. Dezember 1918 in Straßburg … geboren. … Erst 1946 konnte er das Studium der Mathematik, Physik und Astronomie in München aufnehmen. … Deswegen trat er eine Stelle an der Mathematischen Fakultät der TH München an … Klaus Samelson starb am 25. Mai 1980 in München infolge einer schweren Krebserkrankung."
  - text: überlegten, wie ein Rechner eine Formel selbst in seine Befehle übersetzen kann
    sources:
      - url: https://softwarepreservation.computerhistory.org/ALGOL/paper/Samelson_Bauer-The_ALCOR_Project-1962.pdf
        quote: "Stimulated by Rutishauser's paper, the computer group of the TH Munich in late 1955 started studying formula translation. This led to the design, by Bauer and Samelson (1), of a formula controlled computer with a very simple and effective control mechanism."
      - url: https://www.deutsches-museum.de/assets/Forschung/Archiv/Download/Findbuecher_PDF/NL_214_Samelson.pdf
        quote: "Zusammen mit Friedrich L. Bauer (1924-2015) setzte er Heinz Rutishausers (1918-1970) Idee, Maschinenprogramme für elektronische Rechenanlage direkt aus der formelhaften mathematischen Beschreibung des Algorithmus zu gewinnen, fort."
  - text: Dafür schlugen sie 1955 einen Speicher vor, bei dem nur zählt, was zuletzt hineinkam
    sources:
      - url: https://history.computer.org/pioneers/bauer.html
        quote: "Based on this technology, he and Klaus Samelson developed in 1955 the stack method of expression evaluation."
      - url: https://softwarepreservation.computerhistory.org/ALGOL/paper/Samelson_Bauer-The_ALCOR_Project-1962.pdf
        quote: "A cellar here is a store of the type which lately has been called pushdown-store or stack, working on the \"last in first out\" principle."
      - url: https://en.wikipedia.org/wiki/Stack_(abstract_data_type)#History
        quote: "proposed the idea of a stack called Operationskeller (\"operational cellar\") in 1955"
  - text: und meldeten ihn 1957 als »Keller« zum Patent an
    sources:
      - url: https://patents.google.com/patent/DE1094019B/de
        quote: "ANMELDETAG: 30.MÄRZ1957 … in einen Speicher (Keller) eingeführt"
      - url: https://badw.de/fileadmin/nachrufe/Bauer%20Friedrich%20L..pdf
        quote: "Bauer und Samelson melden 1957 das Kellerprinzip für beliebig geklammerte arithmetische Terme zum Patent an."
  - text: "Sie sahen schon, dass der Keller auch zu Funktionsaufrufen passt"
    note: "Korrigiert; vorher: »Sie waren überzeugt, dass auch Programme mit Funktionen so einen Keller brauchen, und behielten recht«"
    sources:
      - url: https://softwarepreservation.computerhistory.org/ALGOL/paper/Samelson_Bauer-The_ALCOR_Project-1962.pdf
        quote: "Handling of blocks immediately leads us to the delicate problem of how to handle procedures. Conceptually, dynamic stacking again is the immediate answer to the problem of data storage … Therefore it was decided, to assign static data storage to each procedure separately within the block containing the procedure, which of course rules out recursive procedures. The waste of static storage, in conflict with our original cellar principle, was considered regrettable. There was no great concern, however, over recursive procedures. … They were considered by us to be of very little value"
      - url: https://gwern.net/doc/www/vanemden.wordpress.com/f8004367ead065233b73f0137fd5aba042a4d8a4.html
        quote: "Committee member F.L. Bauer registered his protest by characterizing the addition of recursion"
  - text: "Wohin dein Programm nach einem Aufruf zurückkehrt, liegt auf einem Stack."
    sources:
      - url: https://en.wikipedia.org/wiki/Call_stack
        quote: "the primary purpose of a call stack is to store the return addresses"
  - text: Bauer hielt 1967 an der TU München die erste Vorlesung über Informatik in Deutschland.
    sources:
      - url: https://en.wikipedia.org/wiki/Friedrich_L._Bauer
        quote: "In 1967, he held the first lecture in computer science at a German university at the Technical University of Munich"
      - url: https://www.tum.de/aktuelles/alle-meldungen/pressemitteilungen/detail/33945/
        quote: "Im Wintersemester 1967/68 wurde an der heutigen TU München erstmals der Studiengang … Das Startsignal hierzu gab Prof. Friedrich Ludwig Bauer mit seinem zweisemestrigen Vorlesungszyklus"

adelson-velski-landis:
  - text: Georgi Adelson-Velski (1922–2014)
    sources:
      - url: https://en.wikipedia.org/wiki/Georgy_Adelson-Velsky
        quote: "(8 January 1922 – 26 April 2014) was a Soviet mathematician and computer scientist."
      - url: https://www.chessprogramming.org/Georgy_Adelson-Velsky
        quote: "Georgy Adelson-Velsky died on April 26, 2014, aged 92, in Givatayim, Israel"
  - text: Jewgeni Landis (1921–1997)
    sources:
      - url: https://en.wikipedia.org/wiki/Evgenii_Landis
        quote: "6 October 1921 – 12 December 1997"
  - text: Mathematiker in Moskau
    sources:
      - url: https://en.wikipedia.org/wiki/Evgenii_Landis
        quote: "He studied and worked at the Moscow State University, where his advisor was Alexander Kronrod, and later Ivan Petrovsky."
      - url: https://en.wikipedia.org/wiki/Georgy_Adelson-Velsky
        quote: "at the Institute for Theoretical and Experimental Physics in Moscow"
  - text: "erfanden 1962 den AVL-Baum: den ersten Suchbaum, der sich selbst ausgleicht"
    sources:
      - url: https://en.wikipedia.org/wiki/AVL_tree
        quote: "It was the first self-balancing binary search tree data structure to be invented."
      - url: https://www.chessprogramming.org/Georgy_Adelson-Velsky
        quote: "Georgy Adelson-Velsky, Evgenii Landis (1962). An algorithm for the organization of information."
  - text: Die Buchstaben AVL sind ihre Namen.
    sources:
      - url: https://en.wikipedia.org/wiki/Evgenii_Landis
        quote: "With Georgy Adelson-Velsky, he invented the AVL tree data structure (where \"AVL\" stands for Adelson-Velsky Landis)."
  - text: Adelson-Velski schrieb auch an Kaissa mit, dem Schachprogramm, das 1974 die erste Weltmeisterschaft im Computerschach gewann.
    sources:
      - url: https://www.chessprogramming.org/Kaissa
        quote: "won the 1st World Computer Chess Championship 1974 in Stockholm … Officially the authors of Kaissa appear Georgy Adelson-Velsky, Vladimir Arlazarov and Mikhail Donskoy."
      - url: https://en.wikipedia.org/wiki/Georgy_Adelson-Velsky
        quote: "it evolved into Kaissa, the first world computer chess champion."

codd:
  - text: Edgar F. Codd (1923–2003), britischer Mathematiker
    sources:
      - url: https://en.wikipedia.org/wiki/Edgar_F._Codd
        quote: "Edgar Frank \"Ted\" Codd (19 August 1923 – 18 April 2003) was a British computer scientist"
      - url: https://www.ibm.com/history/edgar-codd
        quote: "Edgar F. \"Ted\" Codd was a mathematician and computer scientist. … Codd earned mathematics and chemistry degrees from Exeter College at Oxford University."
  - text: im Zweiten Weltkrieg Pilot
    sources:
      - url: https://en.wikipedia.org/wiki/Edgar_F._Codd
        quote: "before serving as a pilot in the RAF Coastal Command during the Second World War, flying Sunderlands."
      - url: https://www.ibm.com/history/edgar-codd
        quote: "He flew in the Royal Air Force during World War II"
  - text: dann bei IBM in den USA
    sources:
      - url: https://en.wikipedia.org/wiki/Edgar_F._Codd
        quote: "In 1948, he moved to New York to work for IBM as a mathematical programmer."
  - text: '1970 schlug er vor, Daten in Tabellen zu speichern und mit Abfragen zu holen, ohne zu wissen, wie sie gespeichert sind: das relationale Modell.'
    sources:
      - url: https://en.wikipedia.org/wiki/Edgar_F._Codd
        quote: "issuing his paper \"A Relational Model of Data for Large Shared Data Banks\" in 1970"
      - url: https://www.ibm.com/history/edgar-codd
        quote: "organized information into tables that could be linked … users could access information without knowing the database's physical blueprint."
  - text: Auch die Normalformen stammen von ihm, die erste von 1970, die zweite und dritte von 1971.
    sources:
      - url: https://en.wikipedia.org/wiki/Database_normalization
        quote: "Codd introduced the concept of normalization and what is now known as the first normal form (1NF) in 1970. Codd went on to define the second normal form (2NF) and third normal form (3NF) in 1971"
      - url: https://en.wikipedia.org/wiki/Third_normal_form
        quote: "Third normal form (3NF) is a level of database normalization defined by English computer scientist Edgar F. Codd"
  - text: IBM zögerte lange.
    sources:
      - url: https://en.wikipedia.org/wiki/Edgar_F._Codd
        quote: "To his disappointment, IBM proved slow to exploit his suggestions until commercial rivals started implementing them."
  - text: Zwei Kollegen, Donald Chamberlin und Raymond Boyce, entwickelten aus seiner Idee SQL
    sources:
      - url: https://en.wikipedia.org/wiki/SQL
        quote: "SQL was initially developed at IBM by Donald D. Chamberlin and Raymond F. Boyce … after learning about the relational model from Edgar F. Codd in the early 1970s."
      - url: https://www.ibm.com/history/edgar-codd
        quote: "Don Chamberlin, who with Raymond Boyce co-created Structured Query Language (SQL)."
  - text: die erste SQL-Datenbank zu kaufen gab es 1979 von einer kleinen Firma, die heute Oracle heißt
    sources:
      - url: https://en.wikipedia.org/wiki/Oracle_Database
        quote: "Larry Ellison and his two friends and former co-workers, Bob Miner and Ed Oates, started a consultancy … called Software Development Laboratories (SDL) in 1977, later Oracle Corporation. … First commercially available SQL RDBMS."
      - url: https://en.wikipedia.org/wiki/SQL
        quote: "In June 1979, Relational Software introduced one of the first commercially available implementations of SQL, … Oracle V2 (Version2) for VAX computers."
      - url: https://en.wikipedia.org/wiki/Edgar_F._Codd
        quote: "in 1979 it was copied by Larry Ellison … in his Oracle Database, which actually reached the market before SQL/DS"

backus:
  - text: John Backus (1924–2007), amerikanischer Informatiker.
    sources:
      - url: https://en.wikipedia.org/wiki/John_Backus
        quote: "John Warner Backus (December 3, 1924 – March 17, 2007) was an American computer scientist."
      - url: https://mathshistory.st-andrews.ac.uk/Obituaries/Backus_Spectrum
        quote: "JOHN BACKUS (1924-2007): FATHER OF FORTRAN"
  - text: Ab 1954 leitete er bei IBM das Team, das Fortran und den ersten Fortran-Compiler baute
    sources:
      - url: https://en.wikipedia.org/wiki/John_Backus
        quote: "in 1954 Backus assembled a team to define and develop Fortran"
      - url: https://www.ibm.com/history/fortran
        quote: "was given a budget to hire a small team to test the feasibility of that notion."
      - url: https://en.wikipedia.org/wiki/Fortran
        quote: "In late 1953, John W. Backus submitted a proposal to his superiors at IBM … A draft specification for The IBM Mathematical Formula Translating System was completed by November 1954. … with the first FORTRAN compiler delivered in April 1957."
  - text: der Compiler machte daraus ein Programm, das fast so schnell lief wie eines von Hand
    sources:
      - url: https://www.ibm.com/history/fortran
        quote: "ran nearly as fast as anything that could be crafted by hand"
  - text: Wettermodelle wie das des Deutschen Wetterdiensts rechnen bis heute in Fortran.
    sources:
      - url: https://www.dwd.de/DE/forschung/wettervorhersage/num_modellierung/01_num_vorhersagemodelle/icon_beschreibung.html
        quote: "Der DWD betreibt aktuell als Globalmodell das Modell ICON"
      - url: https://gmd.copernicus.org/articles/18/1001/2025/gmd-18-1001-2025.html
        quote: "For the about half a million lines of Fortran code present in ICON (src/),"
      - url: https://icon-training-2025-scripts-rendering-cc74a6.gitlab-pages.dkrz.de/icon-training-2025-scripts/exercise_programming/icon_exercise_programming.html
        quote: "In the following we will allocate a new ICON variable directly in the Fortran code."
  - text: »Vieles an meiner Arbeit kommt daher, dass ich faul war«, sagte er später
    sources:
      - url: https://www.ibm.com/history/john-backus
        quote: "Much of my work has come from being lazy"
      - url: https://mathshistory.st-andrews.ac.uk/Obituaries/Backus_Spectrum
        quote: "Much of my work has come from being lazy. I didn't like writing programs"
  - text: Er schrieb nicht gern Programme, also baute er etwas, das es leichter macht.
    sources:
      - url: https://www.ibm.com/history/john-backus
        quote: "I didn't like writing programs, so I started work on a system to make them easier to write."
  - text: Die Schreibweise, mit der man festlegt, wie eine Programmiersprache aussieht, heißt nach ihm Backus-Naur-Form.
    sources:
      - url: https://www.ibm.com/history/john-backus
        quote: "a pioneering notation for describing the structure of programming languages."
      - url: https://en.wikipedia.org/wiki/John_Backus
        quote: "Backus developed the Backus–Naur form (BNF), published in the UNESCO report on ALGOL 58."

huffman:
  - text: David A. Huffman (1925–1999), amerikanischer Informatiker.
    sources:
      - url: https://en.wikipedia.org/wiki/David_A._Huffman
        quote: "August 9, 1925 – October 7, 1999"
      - url: https://ethw.org/David_A._Huffman
        quote: "Huffman was born on August 9, 1925 in Ohio. … Huffman died on October 7, 1999 from cancer."
      - url: https://www.cise.ufl.edu/~manuel/huffman/press.release.html
        quote: "Eminent UCSC computer scientist David Huffman dies at age 74"
  - text: Als Student am MIT wollte er 1951 lieber die Hausarbeit schreiben als die Prüfung.
    sources:
      - url: https://triumphsannals.journals.publicknowledgeproject.org/index.php/triumphsannals/article/view/15773
        quote: "In 1951, David Huffman was a student in an electrical engineering course taught by professor Robert Fano. In the course, Fano offered students a choice of taking a final exam or writing a term paper. Huffman did not want to take the final exam, so he opted to work on the term paper."
      - url: https://en.wikipedia.org/wiki/Huffman_coding#History
        quote: "In 1951, David A. Huffman and his MIT information theory classmates were given the choice of a term paper or a final exam."
  - text: Monatelang fand er nichts, und als er schon aufgeben wollte
    note: >-
      »Monatelang« steht in Gary Stix' Porträt in Scientific American (September 1991), hier aus
      zweiter Hand: zitiert in »The Lost Quarter-Century in Data Compression« (Archivkopie auf gwern.net).
    sources:
      - url: https://gwern.net/doc/www/web.archive.org/4eb14dcde0c4d14d27985278b11488a546aaa46a.html
        quote: "Huffman worked on the problem for months, developing a number of approaches"
      - url: https://triumphsannals.journals.publicknowledgeproject.org/index.php/triumphsannals/article/view/15773
        quote: "Huffman spent a lot of time on the problem and was ready to give up when the solution suddenly came to him."
      - url: https://en.wikipedia.org/wiki/Huffman_coding#History
        quote: "Huffman, unable to prove any codes were the most efficient, was about to give up"
  - text: kam ihm die Idee, den Baum von unten zu bauen, aus den zwei seltensten Zeichen
    sources:
      - url: https://en.wikipedia.org/wiki/Huffman_coding#History
        quote: "and start studying for the final when he hit upon the idea of using a frequency-sorted binary tree … Building the tree from the bottom up guaranteed optimality"
      - url: https://en.wikipedia.org/wiki/Huffman_coding
        quote: "Remove the two nodes of highest priority (lowest probability) from the queue"
  - text: Sein Professor Robert Fano hatte mit Claude Shannon von oben gebaut und nicht immer die besten Codes gefunden.
    sources:
      - url: https://en.wikipedia.org/wiki/Huffman_coding#History
        quote: "In doing so, Huffman outdid Fano, who had worked with Claude Shannon to develop a similar code. Building the tree from the bottom up guaranteed optimality, unlike the top-down approach of Shannon–Fano coding."
      - url: https://triumphsannals.journals.publicknowledgeproject.org/index.php/triumphsannals/article/view/15773
        quote: "However, Fano's greedy algorithm would not always produce an optimal code, while Huffman's greedy algorithm would always find an optimal solution."
  - text: Huffman-Codes stecken in ZIP, PNG, JPEG und MP3.
    sources:
      - url: https://en.wikipedia.org/wiki/Huffman_coding
        quote: "Deflate (PKZIP's algorithm) and multimedia codecs such as JPEG and MP3 have a front-end model"
      - url: https://www.rfc-editor.org/rfc/rfc1951
        quote: "compresses data using a combination of the LZ77 algorithm and Huffman coding"
      - url: https://www.w3.org/TR/png-3/
        quote: "PNG compression method 0 is deflate compression with a sliding window"

kemeny-kurtz:
  - text: John G. Kemeny (1926–1992), in Budapest geborener Mathematiker
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Kemeny/
        quote: "31 May 1926 Budapest, Hungary … 26 December 1992 Etna, New Hampshire, USA"
  - text: Thomas E. Kurtz (1928–2024), amerikanischer Informatiker
    sources:
      - url: https://paw.princeton.edu/memorial/thomas-e-kurtz-56
        quote: "Born Feb. 22, 1928, in Oak Park, Ill. … At age 96, Tom died of multiple organ failure from sepsis, Nov. 12, 2024, in Lebanon, N.H."
  - text: erfanden BASIC 1964 am Dartmouth College in den USA
    sources:
      - url: https://paw.princeton.edu/memorial/thomas-e-kurtz-56
        quote: "Tom and John created BASIC"
      - url: https://en.wikipedia.org/wiki/Dartmouth_BASIC
        quote: "John Kemeny and John McGeachie ran the first BASIC program on 1 May 1964 at 4 a.m."
  - text: Der Rechner sollte allen Studierenden so offenstehen wie eine Bibliothek, nicht nur Mathematikern und Ingenieuren.
    sources:
      - url: https://exhibits.library.dartmouth.edu/s/dtss/page/people
        quote: "both promoting the philosophy that computing should be as accessible to an undergraduate student as an open-stack library."
      - url: https://en.wikipedia.org/wiki/Dartmouth_BASIC
        quote: "Our vision was that every student on campus should have access to a computer … only 25% of the students at Dartmouth took STEM-related courses"
  - text: Dazu bauten sie mit Studierenden ein System, an dem viele Menschen gleichzeitig an eigenen Terminals denselben Rechner benutzten
    sources:
      - url: https://exhibits.library.dartmouth.edu/s/dtss/page/people
        quote: "Kemeny and Kurtz quickly realized how much potential students had for developing the system itself;"
      - url: https://paw.princeton.edu/memorial/thomas-e-kurtz-56
        quote: "enabled multiple users, working at separate terminals, to share the machine."
      - url: https://en.wikipedia.org/wiki/Dartmouth_BASIC
        quote: "Students Michael Busch and John McGeachie began working on the operating system design that fall"
  - text: Wer ein Programm eintippte, bekam sofort eine Antwort, statt Lochkarten abzugeben und auf das Ergebnis zu warten.
    sources:
      - url: https://en.wikipedia.org/wiki/Dartmouth_BASIC
        quote: "Students would prepare their programs on punch cards or paper tape … At best, he will waste time standing around waiting for the day's results to appear … they would now use the Model 33 to type directly into the computer"
  - text: Das erste BASIC-Programm lief der Legende nach am 1. Mai 1964 um vier Uhr morgens.
    note: >-
      MacTutor nennt eine andere Zeit: »The first BASIC program was run at Dartmouth at 2 am on 4 May 1964.«
      Dartmouth selbst und Wikipedia nennen den 1. Mai, 4 Uhr; »der Legende nach« passt.
    sources:
      - url: https://exhibits.library.dartmouth.edu/s/dtss/page/people
        quote: "As the legend goes, a group of students ran the first BASIC program on the Dartmouth Time-Sharing System at 4 AM on May 1st, 1964: neither Kemeny nor Kurtz remembered even being there."
      - url: https://en.wikipedia.org/wiki/Dartmouth_BASIC
        quote: "John Kemeny and John McGeachie ran the first BASIC program on 1 May 1964 at 4 a.m."
  - text: Kemeny war als Student Assistent von Albert Einstein gewesen
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Kemeny/
        quote: "While a doctoral student he was appointed as Albert Einstein's mathematical assistant."
  - text: wurde später Präsident von Dartmouth
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Kemeny/
        quote: "He was president of Dartmouth between 1970 and 1981."
      - url: https://paw.princeton.edu/memorial/thomas-e-kurtz-56
        quote: "with department chairman John G. Kemeny, who later became Dartmouth’s president"

mccarthy:
  - text: "John McCarthy (1927–2011), amerikanischer Informatiker am MIT und in Stanford."
    sources:
      - url: https://en.wikipedia.org/wiki/John_McCarthy_(computer_scientist)
        quote: "John McCarthy (September 4, 1927 – October 24, 2011) was an American computer scientist and cognitive scientist. … A year later, he moved to MIT as a research fellow in the autumn of 1956. … In 1962, he became a full professor at Stanford, where he remained until his retirement in 2000."
      - url: https://stanforddaily.com/2011/10/26/leader-in-artificial-intelligence-dies-at-84/
        quote: "moving to the Massachusetts Institute of Technology (MIT) in 1958 … he made the Farm his permanent home when he returned in 1962"
  - text: "1958 erfand er Lisp"
    sources:
      - url: https://en.wikipedia.org/wiki/Lisp_(programming_language)
        quote: "John McCarthy began developing Lisp in 1958 while he was at the Massachusetts Institute of Technology (MIT)."
      - url: https://stanforddaily.com/2011/10/26/leader-in-artificial-intelligence-dies-at-84/
        quote: "creating the world’s second-oldest computer programming language, LISP, that same year"
  - text: "in dem auch die Programme selbst Listen in Klammern sind"
    sources:
      - url: https://en.wikipedia.org/wiki/Lisp_(programming_language)
        quote: "Linked lists are one of Lisp's major data structures, and Lisp source code is made of lists."
  - text: "Dass Ruby oder Python Speicher, den dein Programm nicht mehr braucht, ohne dein Zutun wieder freigeben"
    none: Workspace
  - text: "Diese Garbage Collection erfand er für Lisp."
    sources:
      - url: https://en.wikipedia.org/wiki/Garbage_collection_(computer_science)
        quote: "Garbage collection was invented by American computer scientist John McCarthy around 1959 … to simplify manual memory management in Lisp."
      - url: https://stanforddaily.com/2011/10/26/leader-in-artificial-intelligence-dies-at-84/
        quote: "developing garbage collectors, a way to automatically remove superfluous lines of code"
      - url: https://en.wikipedia.org/wiki/John_McCarthy_(computer_scientist)
        quote: "Around 1959, he invented so-called 'garbage collection' methods"
  - text: "Den Begriff Artificial Intelligence, Künstliche Intelligenz, prägte er 1955 in einem Antrag für eine Sommerkonferenz."
    note: >-
      Der Antrag vom 31. August 1955 stammt von McCarthy, Minsky, Rochester und Shannon gemeinsam;
      der Begriff selbst wird McCarthy zugeschrieben. Kein Fehler, nur zur Kenntnis.
    sources:
      - url: https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/1904
        quote: "A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence, August 31, 1955"
      - url: https://en.wikipedia.org/wiki/John_McCarthy_(computer_scientist)
        quote: "McCarthy, Minsky, Nathaniel Rochester and Claude E. Shannon coined the term \"artificial intelligence\" in a proposal"
      - url: https://stanforddaily.com/2011/10/26/leader-in-artificial-intelligence-dies-at-84/
        quote: "credited for the first use of the term “artificial intelligence” in print"
  - text: "Und schon 1959 schlug er vor, dass viele Menschen an eigenen Terminals gleichzeitig denselben Rechner benutzen."
    sources:
      - url: https://www.saildart.org/TIME.HIS[S80,JMC]3
        quote: "January l, l959 … To: Professor P.M. Morse … A Time Sharing Operator Program for our Projected IBM 709 … The only way quick response can be provided at a bearable cost is by time-sharing. That is, the computer must attend to other customers while one customer is reacting to some output. … Interrogation and display devices (flexowriters are possible but there may be better and cheaper)."
      - url: https://www.computerhistory.org/collections/catalog/102720416
        quote: "A Time Sharing Operator Program for our Projected IBM 709, Letter to the Director of the Comp. Center of M.I.T."

dijkstra:
  - text: Edsger W. Dijkstra (1930–2002), niederländischer Informatiker.
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Dijkstra/
        quote: "Born: 11 May 1930, Rotterdam, The Netherlands. Died: 6 August 2002, Nuenen, The Netherlands"
  - text: Sein Verfahren für den kürzesten Weg erdachte er 1956
    sources:
      - url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm#History
        quote: "Dijkstra thought about the shortest path problem while working as a programmer at the Mathematical Center in Amsterdam in 1956. … In fact, it was published in '59, three years later."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Dijkstra/
        quote: "So I designed a program that would find the shortest route between two cities in the Netherlands,"
  - text: in zwanzig Minuten auf einer Caféterrasse in Amsterdam, ohne Stift und Papier
    sources:
      - url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm#History
        quote: "One morning I was shopping in Amsterdam with my young fiancée, and tired, we sat down on the café terrace … It is the algorithm for the shortest path, which I designed in about twenty minutes. … One of the reasons that it is so nice was that I designed it without pencil and paper."
      - url: https://mirkwood.cs.edinboro.edu/~bennett/class/cmsc3140/fall2025/notes/SP/one.html
        quote: "One morning I was shopping in Amsterdam with my young fiancee, and tired, we sat down on the cafe terrace … the algorithm for the shortest path, which I designed in about twenty minutes … I designed it without pencil and paper."
  - text: Navis und der Routenplaner suchen ihre Wege mit seiner Idee.
    sources:
      - url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm
        quote: "The method is widely used in point-to-point routing for maps and navigation software and serves as a base for many speed-up techniques. … The A* algorithm is a generalization of Dijkstra's algorithm"
  - text: der Routenplaner
    none: Workspace
  - text: Dass du Schleifen und Funktionen schreibst, statt mit goto kreuz und quer durchs Programm zu springen, geht auch auf ihn zurück
    sources:
      - url: https://homepages.cwi.nl/~storm/teaching/reader/Dijkstra68.pdf
        quote: "For a number of years I have been familiar with the observation that the quality of programmers is a decreasing function of the density of go to statements in the programs they produce. More recently I discovered why the use of the go to statement has such disastrous effects, and I became convinced that the go to statement should be abolished from all \"higher level\" programming languages"
      - url: https://en.wikipedia.org/wiki/Structured_programming
        quote: "Structured programming replaces goto with constructs that tend to result in better code. … the influential \"Go To Statement Considered Harmful\" open letter in 1968 by Dutch computer scientist Edsger W. Dijkstra … who coined the term structured programming."
  - text: "»Go To Statement Considered Harmful«, 1968."
    sources:
      - url: https://homepages.cwi.nl/~storm/teaching/reader/Dijkstra68.pdf
        quote: "Go To Statement Considered Harmful … Volume 11 / Number 3 / March, 1968 … Communications of the ACM"
      - url: https://en.wikipedia.org/wiki/Considered_harmful
        quote: "The original title of the letter, as submitted to CACM, was \"A Case Against the Goto Statement\" … CACM editor Niklaus Wirth changed the title to \"Goto Statement Considered Harmful\""

lempel-ziv:
  - text: Abraham Lempel (1936–2023)
    sources:
      - url: https://en.wikipedia.org/wiki/Abraham_Lempel
        quote: "10 February 1936 – 4 February 2023 … was an Israeli computer scientist and one of the fathers of the LZ family of lossless data compression algorithms."
      - url: https://itsoc.org/node/38053
        quote: "Abraham Lempel passed away on February 4, 2023 at the age of 86."
  - text: Jacob Ziv (1931–2023)
    sources:
      - url: https://en.wikipedia.org/wiki/Jacob_Ziv
        quote: "Jacob Ziv (Hebrew: יעקב זיו; 27 November 1931 – 25 March 2023) was an Israeli electrical engineer"
      - url: https://spectrum.ieee.org/remembering-jacob-ziv
        quote: "died on 26 March at the age of 91."
  - text: "Elektroingenieur, beide Professoren am Technion in Haifa"
    note: "Korrigiert; vorher: »Informatiker am Technion in Haifa«"
    sources:
      - url: https://en.wikipedia.org/wiki/Abraham_Lempel
        quote: "Since 1977 he held the title of full professor, and was a professor emeritus at Technion."
      - url: https://spectrum.ieee.org/remembering-jacob-ziv
        quote: "an electrical engineering professor at the Technion"
  - text: Ihre Idee, dass ein Text sich selbst als Wörterbuch nimmt, steckt in jedem GIF
    sources:
      - url: https://www.w3.org/Graphics/GIF/spec-gif89a.txt
        quote: "Variable-Length-Code LZW Compression. … The Variable-Length-Code LZW Compression is a variation of the Lempel-Ziv Compression algorithm in which variable-length codes are used to replace patterns detected in the original data. The algorithm uses a code or translation table constructed from the patterns encountered in the original data; each new pattern is entered into the table and its index is used to replace it in the compressed stream."
      - url: https://en.wikipedia.org/wiki/Lempel%E2%80%93Ziv%E2%80%93Welch
        quote: "It was published by Welch in 1984 as an improvement to the LZ78 algorithm published by Lempel and Ziv in 1978. … The algorithm found wide use when it became part of the GIF image format in 1987."
  - text: ihre andere Fassung von 1977 zusammen mit Huffman-Codes in ZIP, PNG und gzip
    sources:
      - url: https://www.rfc-editor.org/rfc/rfc1951
        quote: "compresses data using a combination of the LZ77 algorithm and Huffman coding."
      - url: https://en.wikipedia.org/wiki/Deflate
        quote: "is a lossless data compression algorithm that uses a combination of LZ77 and Huffman coding. … in the zlib data format, gzip file format, Portable Network Graphics (PNG) image file, and the ZIP file format."
  - text: Viele Webseiten kommen so gepackt in deinen Browser.
    sources:
      - url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Encoding
        quote: "A format using the Lempel-Ziv coding (LZ77), with a 32-bit CRC. This is the original format of the UNIX gzip program."

rabin-scott:
  - text: Michael O. Rabin (1931–2026, im Bild), in Breslau geboren
    sources:
      - url: https://en.wikipedia.org/wiki/Michael_O._Rabin
        quote: "Rabin was born in 1931 in Breslau, Lower Silesia, Prussia, Germany (today Wrocław, in Poland), the son of a rabbi. … Rabin died on April 14, 2026, at the age of 94."
      - url: https://www.newsroom.hlf-foundation.org/news/article/the-hlff-bids-farewell-to-michael-o-rabin/
        quote: "We bid farewell to Michael O. Rabin, who passed away on April 14, 2026."
  - text: in Haifa aufgewachsen
    sources:
      - url: https://en.wikipedia.org/wiki/Michael_O._Rabin
        quote: "In 1935, he emigrated with his family to Mandatory Palestine. … his father sent him to the best high school in Haifa."
  - text: Dana Scott (geboren 1932), amerikanischer Logiker
    sources:
      - url: https://en.wikipedia.org/wiki/Dana_Scott
        quote: "Dana Stewart Scott (born October 11, 1932) is a retired American logician."
  - text: schrieben 1959 als junge Forscher bei IBM einen Aufsatz über endliche Automaten
    sources:
      - url: https://en.wikipedia.org/wiki/Dana_Scott
        quote: "During the summer of 1957, while a graduate student, Scott worked as a research intern at IBM Research in Yorktown Heights, New York. There he began a collaboration with Michael O. Rabin"
      - url: https://en.wikipedia.org/wiki/Michael_O._Rabin
        quote: "In the late 1950s, Rabin was invited for a summer to do research for IBM at the Lamb Estate. … It was there that he and Dana Scott wrote the paper \"Finite Automata and Their Decision Problems\"."
  - text: "Darin darf ein Automat zum ersten Mal raten: der NEA."
    sources:
      - url: https://www.newsroom.hlf-foundation.org/news/article/the-hlff-bids-farewell-to-michael-o-rabin/
        quote: "which introduced the idea of nondeterministic machines, which has proved to be an enormously valuable concept."
      - url: https://en.wikipedia.org/wiki/Dana_Scott
        quote: "Their joint 1959 paper, \"Finite Automata and Their Decision Problem\", introduced the concept of"
  - text: Sie zeigten auch, wie man aus jedem NEA einen DEA baut, der dieselben Wörter annimmt; die Potenzmengenkonstruktion heißt darum auch Rabin-Scott-Konstruktion.
    sources:
      - url: https://en.wikipedia.org/wiki/Powerset_construction
        quote: "is a standard method for converting a nondeterministic finite automaton (NFA) into a deterministic finite automaton (DFA) … that recognizes the same formal language … sometimes called the Rabin–Scott powerset construction (or subset construction) … was first published by Michael O. Rabin and Dana Scott in 1959"
  - text: 1976 bekamen beide dafür den Turing Award
    sources:
      - url: https://www.newsroom.hlf-foundation.org/news/article/the-hlff-bids-farewell-to-michael-o-rabin/
        quote: "He received the 1976 ACM A.M. Turing Award with Dana S. Scott for their joint paper"
      - url: https://en.wikipedia.org/wiki/Dana_Scott
        quote: "Along with Michael O. Rabin he received the 1976 ACM Turing Award for their joint work on automata theory."
  - text: "Rabin machte später aus einem Primzahltest von Gary Miller einen schnellen Zufallstest"
    note: "Korrigiert; vorher: »Rabin fand später einen schnellen Test, ob eine große Zahl eine Primzahl ist«"
    sources:
      - url: https://en.wikipedia.org/wiki/Miller%E2%80%93Rabin_primality_test
        quote: "Gary L. Miller discovered the test in 1976. … Miller's version of the test is deterministic, but its correctness relies on the unproven extended Riemann hypothesis. … Michael O. Rabin modified it to obtain an unconditional probabilistic algorithm in 1980."
  - text: "Wenn openssl ein RSA-Schlüsselpaar erzeugt, prüft es seine Primzahlen mit dem Test von Miller und Rabin."
    sources:
      - url: https://raw.githubusercontent.com/openssl/openssl/master/doc/man3/BN_generate_prime.pod
        quote: "trial division by a number of small primes … and rounds of the Miller-Rabin probabilistic primality test. … The functions do at least 64 rounds of the Miller-Rabin test giving a maximum false positive rate of 2^-128."

mcilroy:
  - text: Douglas McIlroy (geboren 1932), amerikanischer Mathematiker und Informatiker bei den Bell Labs.
    sources:
      - url: https://en.wikipedia.org/wiki/Douglas_McIlroy
        quote: "Malcolm Douglas McIlroy (born April 24, 1932) is an American computer scientist, mathematician, and programmer."
      - url: https://usenix.org/system/files/login/articles/login_spring16_05_mcilroy.pdf
        quote: "Doug McIlroy, now an Adjunct Professor at Dartmouth, headed a small computing research department at Bell Labs."
  - text: Du verkettest Befehle mit |?
    none: Workspace
  - text: 'Die Idee ist von ihm: Schon 1964 schrieb er in einer Notiz, man solle Programme verbinden können wie die Stücke eines Gartenschlauchs.'
    sources:
      - url: https://plan9.io/cm/cs/who/dmr/mdmpipe.html
        quote: "We should have some ways of connecting programs like garden hose."
      - url: https://usenix.org/system/files/login/articles/login_spring16_05_mcilroy.pdf
        quote: "This led me to write (in a 1964 Multics document) about screwing processes together like garden hose."
      - url: https://en.wikipedia.org/wiki/Douglas_McIlroy
        quote: "McIlroy is best known for having originally proposed Unix pipelines"
  - text: 1973 baute Ken Thompson die Pipes in einer Nacht in Unix ein.
    sources:
      - url: https://en.wikipedia.org/wiki/Pipeline_(Unix)
        quote: "His ideas were implemented in 1973 when … \"in one feverish night\", wrote McIlroy … Ken Thompson added the pipe() system call and pipes to the shell and several utilities in Version 3 Unix."
      - url: https://usenix.org/system/files/login/articles/login_spring16_05_mcilroy.pdf
        quote: "Ken did it all in one night: creating the system call, teaching the shell to use it, and fixing programs that previously handled only named files to also deal with standard input and standard output."
  - text: 1986 schrieb Donald Knuth ein Programm über mehrere Seiten, das die häufigsten Wörter eines Texts zählt.
    note: >-
      Quelle ist der Scan der Kolumne (Bilder, kein Textlayer); Knuths Programm füllt dort
      die Seiten 471 bis etwa 479.
    sources:
      - url: https://cs61.seas.harvard.edu/site/pdf/p471-bentley.pdf
        quote: "by Jon Bentley with Special Guest Oysters Don Knuth and Doug McIlroy … A LITERATE PROGRAM … Given a text file and an integer k, print the k most common words in the file (and the number of their occurrences) in decreasing frequency. … June 1986 Volume 29 Number 6"
  - text: McIlroy antwortete mit einer Pipeline aus sechs Befehlen, darunter sort, uniq -c und sort -rn.
    sources:
      - url: https://cs61.seas.harvard.edu/site/pdf/p471-bentley.pdf
        quote: "The following shell script was written on the spot and worked on the first try. … (2) tr A-Z a-z | (3) sort | (4) uniq -c | (5) sort -rn | (6) sed ${1}q"

hart-nilsson-raphael:
  - text: Nils Nilsson (1933–2019, im Bild)
    sources:
      - url: https://en.wikipedia.org/wiki/Nils_John_Nilsson
        quote: "Nils John Nilsson (February 6, 1933 – April 23, 2019) was an American computer scientist."
      - url: https://stanforddaily.com/2019/04/29/nils-nilsson-former-stanford-professor-and-ai-visionary-dies-at-86/
        quote: "died at the age of 86 on April 2 at his home in Medford, Oregon."
  - text: Peter Hart, Nils Nilsson (1933–2019, im Bild) und Bertram Raphael entwarfen A* 1968 am Stanford Research Institute
    sources:
      - url: https://en.wikipedia.org/wiki/A*_search_algorithm
        quote: "Peter Hart, Nils Nilsson and Bertram Raphael of Stanford Research Institute (now SRI International) first published the algorithm in 1968."
      - url: https://stanforddaily.com/2019/04/29/nils-nilsson-former-stanford-professor-and-ai-visionary-dies-at-86/
        quote: "He collaborated with fellow researchers to design the A* algorithm"
  - text: für Shakey, den ersten Roboter, der selbst plante, wie er durch Räume zu einem Ziel kommt
    sources:
      - url: https://en.wikipedia.org/wiki/A*_search_algorithm
        quote: "A* was created as part of the Shakey project"
      - url: https://www.sri.com/hoi/shakey-the-robot/
        quote: "“Shakey” was the first mobile robot with the ability to perceive and reason about its surroundings."
  - text: Figuren in Spielen finden ihre Wege bis heute mit A*.
    sources:
      - url: https://en.wikipedia.org/wiki/A*_search_algorithm
        quote: "A* is often used for the common pathfinding problem in applications such as video games"
      - url: https://www.redblobgames.com/pathfinding/a-star/introduction.html
        quote: "A* is a good choice for most pathfinding needs."

wirth:
  - text: Niklaus Wirth (1934–2024), Schweizer Informatiker an der ETH Zürich.
    sources:
      - url: https://en.wikipedia.org/wiki/Niklaus_Wirth
        quote: "In 1968 he became professor of computer science at ETH Zurich."
      - url: https://ethz.ch/en/news-and-events/eth-news/news/2024/01/computer-pioneer-niklaus-wirth-has-died.html
        quote: "Computer pioneer Niklaus Wirth died on 1 January 2024, just weeks before his 90th birthday. … Wirth was a professor at ETH Zurich from 1968 to 1999."
  - text: Er entwarf Pascal als Sprache, an der man sauberes Programmieren lernt.
    sources:
      - url: https://en.wikipedia.org/wiki/Pascal_(programming_language)
        quote: "intended to encourage good programming practices using structured programming and data structuring … with the explicit goals of teaching programming in a structured fashion"
      - url: https://ethz.ch/en/news-and-events/eth-news/news/2024/01/computer-pioneer-niklaus-wirth-has-died.html
        quote: "quickly became a popular teaching language"
  - text: Eines seiner Bücher heißt Algorithms + Data Structures = Programs
    sources:
      - url: https://en.wikipedia.org/wiki/Algorithms_%2B_Data_Structures_%3D_Programs
        quote: "a 1976 book written by Niklaus Wirth"
  - text: "Ein Programm, das sind Algorithmen plus Datenstrukturen."
    sources:
      - url: https://en.wikipedia.org/wiki/Algorithms_%2B_Data_Structures_%3D_Programs
        quote: "algorithms and data structures are inherently related"
  - text: "1995 warb er für schlanke Software und zitierte einen Kollegen: Software werde schneller langsamer, als die Hardware schneller wird."
    note: "Korrigiert; vorher: »1995 warb er für schlanke Software und schrieb, Software werde schneller langsamer, als die Hardware schneller wird.«"
    sources:
      - url: https://en.wikipedia.org/wiki/Niklaus_Wirth
        quote: "software is getting slower more rapidly than hardware becomes faster"
      - url: https://en.wikipedia.org/wiki/Wirth%27s_law
        quote: "software is getting slower more rapidly than hardware is becoming faster … manages to outgrow hardware in size and sluggishness"
  - text: Der Satz heißt heute Wirthsches Gesetz.
    sources:
      - url: https://ethz.ch/en/news-and-events/eth-news/news/2024/01/computer-pioneer-niklaus-wirth-has-died.html
        quote: "Wirth's law, which states that software slows down faster than hardware speeds up, is named after him."
  - text: 1984 bekam er den Turing Award, den wichtigsten Preis der Informatik.
    sources:
      - url: https://ethz.ch/en/news-and-events/eth-news/news/2024/01/computer-pioneer-niklaus-wirth-has-died.html
        quote: "In 1984, he became the only German-speaking computer scientist yet to have received the Turing Award."
      - url: https://en.wikipedia.org/wiki/Turing_Award
        quote: "generally recognized as the highest distinction in the field of computer science"

hoare:
  - text: Tony Hoare (1934–2026), britischer Informatiker.
    sources:
      - url: https://www.merton.ox.ac.uk/news/professor-sir-charles-anthony-richard-tony-hoare-1934-2026
        quote: "Professor Sir Charles Anthony Richard (Tony) Hoare, Honorary Fellow of the College died peacefully at home on 5 March 2026."
      - url: https://en.wikipedia.org/wiki/Tony_Hoare
        quote: "British computer scientist (1934–2026) … 11 January 1934 – 5 March 2026"
  - text: Quick Sort erfand er 1959 als Austauschstudent in Moskau
    sources:
      - url: https://en.wikipedia.org/wiki/Quicksort
        quote: "The quicksort algorithm was developed in 1959 by Tony Hoare while he was a visiting student at Moscow State University."
      - url: https://www.theregister.com/2026/03/12/in_memoriam_sir_tony_hoare/
        quote: "During his National Service, he learned Russian, and studied at Moscow State University as an exchange student. … He invented it in 1959 and implemented it at Elliott Computers in 1960 for a bet with his boss"
  - text: 'Er sollte ein Programm schreiben, das Russisch übersetzt, und musste dafür die Wörter eines Satzes sortieren.'
    sources:
      - url: https://en.wikipedia.org/wiki/Quicksort
        quote: "At that time, Hoare was working on a machine translation project for the National Physical Laboratory. … he needed to sort the words in Russian sentences before looking them up."
      - url: https://www.cs.ox.ac.uk/people/tony.hoare/index1.html
        quote: "In 1959, as a graduate student at Moscow State University, he studied the machine translation of languages … To assist in efficient look-up of words in a dictionary, he discovered the well-known sorting algorithm Quicksort."
  - text: 1965 baute er in eine Programmiersprache den Wert null ein, »weil es so einfach war«.
    sources:
      - url: https://www.infoq.com/presentations/Null-References-The-Billion-Dollar-Mistake-Tony-Hoare/
        quote: "Tony Hoare introduced Null references in ALGOL W back in 1965 \"simply because it was so easy to implement\", says Mr. Hoare."
      - url: https://en.wikipedia.org/wiki/Tony_Hoare
        quote: "But I couldn't resist the temptation to put in a null reference, simply because it was so easy to implement."
  - text: Später nannte er ihn seinen »Milliarden-Dollar-Fehler«
    sources:
      - url: https://www.infoq.com/presentations/Null-References-The-Billion-Dollar-Mistake-Tony-Hoare/
        quote: "He talks about that decision considering it \"my billion-dollar mistake\"."
      - url: https://www.theregister.com/2026/03/12/in_memoriam_sir_tony_hoare/
        quote: "Later, as in this talk from QCon in 2009, Hoare called Null references The Billion Dollar Mistake."
  - text: Meldungen wie undefined method … for nil in Ruby stammen von dieser Idee.
    none: Workspace

knuth-lamport:
  - text: "Donald Knuth (geboren 1938)"
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Knuth/
        quote: "Born 10 January 1938 Milwaukee, Wisconsin, USA"
  - text: "Leslie Lamport (geboren 1941), amerikanische Informatiker."
    sources:
      - url: https://en.wikipedia.org/wiki/Leslie_Lamport
        quote: "Leslie Barry Lamport (born February 7, 1941) is an American computer scientist and mathematician."
  - text: "Knuth gefiel der Satz seines Buchs The Art of Computer Programming nicht mehr"
    sources:
      - url: https://en.wikipedia.org/wiki/TeX
        quote: "When Knuth received the galley proofs of the new book on 30 March 1977, he found them inferior. Disappointed, Knuth set out to design his own typesetting system."
      - url: https://www.webofstories.com/play/17109
        quote: "they sent me back the galley proofs for the… for the second edition and I was shocked … I couldn't believe it. It looked awful."
  - text: "er schrieb ab 1977 TeX, ein Programm, das Text und Formeln setzt"
    sources:
      - url: https://en.wikipedia.org/wiki/TeX
        quote: "On 13 May 1977, he wrote a memo to himself describing the basic features of TeX."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Knuth/
        quote: "Starting in 1976 Knuth took ten years off his other projects to work on the development of TeX and METAFONT."
  - text: "Lamport baute Anfang der 1980er Jahre LaTeX darauf"
    sources:
      - url: https://en.wikipedia.org/wiki/LaTeX
        quote: "In the early 1980s, Leslie Lamport was working at SRI, where he needed to write TeX macros for his own use."
      - url: https://en.wikipedia.org/wiki/TeX
        quote: "The most widely used format is LaTeX, originally developed by Leslie Lamport"
  - text: "mit denen du sagst, was etwas ist, statt wie es aussehen soll"
    sources:
      - url: https://en.wikipedia.org/wiki/LaTeX
        quote: "LaTeX attempts to follow the design philosophy of separating presentation from content."
  - text: "Die Versionsnummer von TeX nähert sich mit jeder Fehlerkorrektur der Zahl π: 3.141592653."
    sources:
      - url: https://texfaq.org/FAQ-TeXfuture
        quote: "at each bug-fix release the version number acquires one more digit, so that it tends to the limit π"
      - url: https://en.wikipedia.org/wiki/TeX
        quote: "The current version of TeX is 3.141592653; it was last updated in 2021."
  - text: "Lamport bekam 2013 den Turing Award, den wichtigsten Preis der Informatik, für Rechner, die zusammenarbeiten."
    sources:
      - url: https://en.wikipedia.org/wiki/Leslie_Lamport
        quote: "fundamental contributions to the theory and practice of distributed and concurrent systems"
      - url: https://blogs.microsoft.com/blog/2014/03/18/microsofts-leslie-lamport-wins-the-turing-award-the-nobel-prize-in-computing/
        quote: "has been awarded the 2013 Association for Computing Machinery A.M. Turing Award … imposing clear, well-defined coherence on the seemingly chaotic behavior of distributed computing systems"
      - url: https://lamport.azurewebsites.net/pubs/pubs.html
        quote: "2013 ACM Turing Award (2014)"

cerf-kahn:
  - text: Vint Cerf (geboren 1943)
    sources:
      - url: https://services.google.com/fh/files/misc/vint_cerf_technical_biography.pdf
        quote: "Born in Connecticut, Cerf enjoyed mathematics and science from an early age. 1943"
      - url: https://en.wikipedia.org/wiki/Vint_Cerf
        quote: "born June 23, 1943"
  - text: Bob Kahn (geboren 1938)
    sources:
      - url: https://en.wikipedia.org/wiki/Bob_Kahn
        quote: "December 23, 1938"
  - text: amerikanische Informatiker, entwarfen 1973 und 1974 TCP/IP
    note: >-
      Stimmt. Genau genommen beschrieb der Aufsatz von 1974 ein einziges Protokoll, TCP; erst 1978 wurde es
      in TCP und IP geteilt. Für die Box eine harmlose Vereinfachung.
    sources:
      - url: https://www.cs.princeton.edu/courses/archive/fall06/cos561/papers/cerf74.pdf
        quote: "A Protocol for Packet Network Intercommunication … VINTON G. CERF AND ROBERT E. KAHN … Manuscript received November 5, 1973. … © 1974 IEEE. Reprinted, with permission, from IEEE Trans on Comms, Vol Com-22, No 5 May 1974"
      - url: https://www.icann.org/news/announcement-2005-02-16-en
        quote: "In 1973, Cerf joined Kahn in a Defense Advanced Research Projects Agency … In May 1974, they published a paper describing a new method of communication called transmission-control protocol (TCP) … In 1978, Cerf and several colleagues split the original protocol into two parts,"
  - text: "wie Daten in Pakete zerlegt, über viele verschiedene Netze geschickt und am Ziel wieder zusammengesetzt werden"
    sources:
      - url: https://www.cs.princeton.edu/courses/archive/fall06/cos561/papers/cerf74.pdf
        quote: "A protocol that supports the sharing of resources that exist in different packet switching networks is presented. The protocol provides for variation in individual network packet sizes, transmission failures, sequencing, flow control, end-to-end error checking, and the creation and destruction of logical process-to-process connections."
      - url: https://www.icann.org/news/announcement-2005-02-16-en
        quote: "TCP broke serial streams of information into pieces, enclosed these pieces in envelopes called \"datagrams\""
  - text: Am 1. Januar 1983 stellte das ARPANET auf TCP/IP um
    sources:
      - url: https://www.rfc-editor.org/rfc/rfc801.txt
        quote: "The goal is to make a complete switch over from the NCP to IP/TCP by 1 January 1983."
      - url: https://www.networkworld.com/article/808978/lan-wan-happy-25th-tcp-ip.html
        quote: "It was Jan. 1, 1983, when Internet precursor ARPANET switched over fully to TCP/IP."
  - text: der Tag gilt als Geburtstag des Internets
    sources:
      - url: https://services.google.com/fh/files/misc/vint_cerf_technical_biography.pdf
        quote: "January 1, 1983 TCP/IP becomes operational so that networks could now be connected by a universal language. This date is often known as 'the operational birthday of the Internet'."
      - url: https://elists.isoc.org/pipermail/internet-history/2009-November/000960.html
        quote: "At the time, we reckoned the beginning of the Internet to be the Red Flag day when the ARPAnet converted from NCP to TCP/IP: … Jan 1, 1983."
  - text: Jede Verbindung, die du im Workspace aufbaust, mit dem Browser, mit git oder mit netcat, läuft über ihr Protokoll.
    none: Workspace

bayer-mccreight:
  - text: Rudolf Bayer (geboren 1939), deutscher Informatiker
    sources:
      - url: https://en.wikipedia.org/wiki/Rudolf_Bayer
        quote: "Rudolf Bayer (born 3 March 1939) is a German computer scientist."
  - text: Edward M. McCreight, amerikanischer Informatiker
    sources:
      - url: https://en.wikipedia.org/wiki/Edward_M._McCreight
        quote: "Edward Meyers McCreight is an American computer scientist."
  - text: erfanden den B-Baum 1970, als beide beim Flugzeugbauer Boeing forschten
    sources:
      - url: https://db.cit.tum.de/~bayer/Memoiren-Bayer.pdf
        quote: "Am weitaus wichtigsten war die Arbeit über B-Bäume im Herbst 1969: Organization and Maintenance of large Ordered Indexes. Ich erinnere mich noch genau, wie ich in das Büro meines Kollegen Ed McCreight spaziert bin und ihm die wesentliche Idee in kurzer Zeit an der Tafel skizzierte. … es entstand zunächst ein Boeing Technical Report, kurz darauf eine Publikation auf dem 1970 ACM SICFIDET Workshop on DATA DESCRIPTION AND ACCESS"
      - url: https://en.wikipedia.org/wiki/B-tree
        quote: "While working at Boeing Research Labs, Rudolf Bayer and Edward M. McCreight invented B-trees … was first circulated in July 1970 and later published in Acta Informatica."
  - text: Jeder Index, den du mit CREATE INDEX anlegst, ist so ein Baum.
    sources:
      - url: https://dev.mysql.com/doc/refman/8.4/en/mysql-indexes.html
        quote: "Most MySQL indexes (PRIMARY KEY, UNIQUE, INDEX, and FULLTEXT) are stored in B-trees."
      - url: https://en.wikipedia.org/wiki/B-tree
        quote: "The B-tree remains the standard index implementation in almost all relational databases."
  - text: Bayer ging 1972 an die TU München
    sources:
      - url: https://db.cit.tum.de/~bayer/Memoiren-Bayer.pdf
        quote: "Gerade rechtzeitig zur Olympiade kamen wir im Juni 1972 nach München … Ich hatte München als Student verlassen und kam als Ordinarius wieder."
      - url: https://en.wikipedia.org/wiki/Rudolf_Bayer
        quote: "since 1972"
  - text: McCreight baute später bei Xerox PARC den Computer Alto mit
    sources:
      - url: https://en.wikipedia.org/wiki/Edward_M._McCreight
        quote: "He also co-designed the Xerox Alto workstation,"
      - url: https://www.computerhistory.org/collections/catalog/102786358
        quote: "Alto : a personal computer … Charles (Chuck) Thacker … David Boggs … Robert F. Sproull … Edward M. McCreight … Butler W. Lampson … Xerox PARC (Palo Alto Research Center)"
  - text: "Wofür das B steht, ist bis heute offen: Boeing, balanced, Bayer?"
    sources:
      - url: https://en.wikipedia.org/wiki/B-tree
        quote: "Bayer and McCreight never explained what, if anything, the B stands for"
  - text: McCreight erzählte, sie hätten den Namen Boeing nicht benutzen dürfen, ohne erst mit den Anwälten zu reden.
    sources:
      - url: https://en.wikipedia.org/wiki/B-tree
        quote: "We were working for Boeing at the time, but we couldn't use the name without talking to the lawyers. So there's a B."
  - text: "Und Bayer sagte gern: Je länger man darüber nachdenkt, wofür das B steht, desto besser versteht man B-Bäume."
    sources:
      - url: https://en.wikipedia.org/wiki/B-tree
        quote: "What Rudy likes to say is, the more you think about what the B in B-Tree means, the better you understand B-Trees!"

welch:
  - text: Terry Welch (1939–1988), amerikanischer Informatiker
    sources:
      - url: https://en.wikipedia.org/wiki/Terry_Welch
        quote: "Terry Archer Welch (January 20, 1939 – November 22, 1988) was an American computer scientist."
  - text: vereinfachte 1984 das Verfahren von Abraham Lempel und Jacob Ziv aus dem Jahr 1978
    sources:
      - url: https://en.wikipedia.org/wiki/Lempel%E2%80%93Ziv%E2%80%93Welch
        quote: "It was published by Welch in 1984 as an improvement to the LZ78 algorithm published by Lempel and Ziv in 1978."
      - url: https://cmd.inp.nsk.su/old/cmd2/manuals/programming/compression/ch07/208-209.html
        quote: "The June 1984 issue of IEEE Computer had an article entitled \"A Technique for High-Performance Data Compression\""
  - text: so, dass es schnell genug für Festplatten war
    sources:
      - url: https://foldoc.org/LZW
        quote: "LZW was designed by Terry Welch in 1984 for implementation in hardware for high-performance disk controllers."
      - url: https://cmd.inp.nsk.su/old/cmd2/manuals/programming/compression/ch07/208-209.html
        quote: "It discussed the LZW compression algorithm in reference to its possible use in disk and tape-drive controllers"
  - text: Daher das W in LZW.
    sources:
      - url: https://en.wikipedia.org/wiki/Terry_Welch
        quote: "he developed the lossless Lempel–Ziv–Welch (LZW) compression algorithm, which was published in 1984."
  - text: GIF benutzte LZW ab 1987.
    sources:
      - url: https://en.wikipedia.org/wiki/Lempel%E2%80%93Ziv%E2%80%93Welch
        quote: "The algorithm found wide use when it became part of the GIF image format in 1987."
      - url: http://www.libpng.org/pub/png/pnghist.html
        quote: "Meanwhile CompuServe--specifically, Bob Berry--was busily designing a new, portable, compressed image format in 1987. … Berry et al. blithely settled on LZW as the compression method."
  - text: Weil die Firma Unisys ein Patent darauf hatte und ab 1994 Gebühren verlangte
    sources:
      - url: http://www.libpng.org/pub/png/pnghist.html
        quote: "Unisys in 1993 began aggressively pursuing commercial vendors of software-only LZW implementations. … culminating in an agreement--quietly announced on 28 December 1994 … to begin collecting royalties from authors of GIF-supporting software."
      - url: https://foldoc.org/LZW
        quote: "LZW compression and decompression are licensed under Unisys Corporation's 1984 U.S. Patent 4,558,302"
  - text: "entwickelten Freiwillige ein neues Bildformat ohne LZW: PNG."
    sources:
      - url: http://www.libpng.org/pub/png/pnghist.html
        quote: "mixed in with the noise was the genesis of an informal Internet working group led by Thomas Boutell"
      - url: https://en.wikipedia.org/wiki/Lempel%E2%80%93Ziv%E2%80%93Welch
        quote: "culminated in the creation of the patent-unencumbered Portable Network Graphics (PNG) file format in 1995."

ahmed:
  - text: Nasir Ahmed (geboren 1940), Ingenieur aus Indien, in den USA.
    sources:
      - url: https://www.cse.iitd.ac.in/~pkalra/siv864-2019/assignment/DCT-History.pdf
        quote: "NASIR AHMED was born in Bangalore, India, in 1940. … He was with Kansas State University, Manhattan, from 1968 to 1983. Since 1983 he has been a Professor in the Electrical and Computer Engineering Department at the University of New Mexico, Albuquerque."
      - url: https://en.wikipedia.org/wiki/N._Ahmed
        quote: "Nasir Ahmed (born 1940) is an American electrical engineer and computer scientist."
  - text: 1972 wollte er Bilder mit Kosinuswellen verdichten.
    sources:
      - url: https://www.cse.iitd.ac.in/~pkalra/siv864-2019/assignment/DCT-History.pdf
        quote: "This was in early 1972, and I wrote a proposal to the National Science Foundation (NSF) to study a “cosine transform” using Chebyshev polynomials"
  - text: 'Die Stiftung, die Forschung bezahlt, lehnte seinen Antrag ab: Die Idee sei zu einfach.'
    note: >-
      Nach Ahmeds eigener Erinnerung war »too simple« der Kommentar eines Gutachters, nicht
      eine offizielle Begründung der NSF; in einem späteren Interview sagt er »the reviewers«.
      Als Vereinfachung in Ordnung.
    sources:
      - url: https://www.cse.iitd.ac.in/~pkalra/siv864-2019/assignment/DCT-History.pdf
        quote: "Much to my disappointment, NSF did not fund the proposal; I recall one reviewer’s comment to the effect that the whole idea seemed “too simple.”"
      - url: https://spectrum.ieee.org/compression-algorithms
        quote: "But to my surprise, the reviewers said the idea was too simple, so they rejected the proposal."
  - text: 1974 veröffentlichte er die DCT trotzdem, mit T. Natarajan und K. R. Rao.
    sources:
      - url: https://www.cse.iitd.ac.in/~pkalra/siv864-2019/assignment/DCT-History.pdf
        quote: "Hence I decided to work on this problem with my Ph.D. student Mr. T. Natarajan and my friend Dr. Ram Mohan Rao at the University of Texas at Arlington. … I sent them to the IEEE Computer Transactions, and the paper was then published in the January 1974 issue."
      - url: https://spectrum.ieee.org/compression-algorithms
        quote: "the trio published a paper in IEEE Transactions On Computers titled \"Discrete Cosine Transform\" in January 1974."
  - text: Jedes JPEG-Foto ist aus ihr gebaut
    sources:
      - url: https://en.wikipedia.org/wiki/Discrete_cosine_transform
        quote: "It is used in image compression standards such as JPEG,"
      - url: https://en.wikipedia.org/wiki/N._Ahmed
        quote: "It is a core component of the 1992 JPEG image compression technology developed by the JPEG Experts Group"
  - text: fast jedes Video auch
    sources:
      - url: https://en.wikipedia.org/wiki/Discrete_cosine_transform
        quote: "Motion-compensated DCT later became the standard coding technique for video compression from the late 1980s onwards."
      - url: https://spectrum.ieee.org/compression-algorithms
        quote: "DCT has been one of the key components of many past image- and video-coding algorithms for more than three decades."
  - text: eine Abwandlung steckt in MP3
    sources:
      - url: https://en.wikipedia.org/wiki/Discrete_cosine_transform
        quote: "The MDCT is used in most modern audio compression formats, such as Dolby Digital (AC-3), … MP3 (which uses a hybrid DCT-FFT algorithm),"

ritchie:
  - text: Dennis Ritchie (1941–2011), amerikanischer Informatiker bei den Bell Labs.
    sources:
      - url: https://en.wikipedia.org/wiki/Dennis_Ritchie
        quote: "Dennis MacAlistair Ritchie (September 9, 1941 – c. October 12, 2011) was an American computer scientist."
      - url: https://www.cs.princeton.edu/~bwk/dmr.html
        quote: "joined Bell Labs in 1967 … died on October 12, 2011, at the age of 70."
  - text: "Anfang der 1970er Jahre erfand er C, und damit schrieben er und Ken Thompson ihr Betriebssystem Unix neu, das es bis dahin nur in Assembler gab."
    note: "Korrigiert; vorher: »Anfang der 1970er Jahre erfand er C, um darin mit Ken Thompson das Betriebssystem Unix zu schreiben.«"
    sources:
      - url: https://www.cs.princeton.edu/~bwk/dmr.html
        quote: "the two of them created the first recognizable version in late 1969. … dates from very early in the 1970s … By 1973, Unix had been converted from its original assembly-language form into C."
      - url: https://en.wikipedia.org/wiki/Dennis_Ritchie
        quote: "He created, together with long-time colleague Ken Thompson, the operating system Unix. … Ritchie and Thompson used C to write Unix."
  - text: Das Terminal im Workspace läuft unter Linux
    none: Workspace
  - text: auch dessen Kern ist in C geschrieben
    sources:
      - url: https://docs.kernel.org/process/programming-language.html
        quote: "The Linux kernel is written in the C programming language"
  - text: 1978 schrieb er mit Brian Kernighan das Buch The C Programming Language.
    sources:
      - url: https://www.cs.princeton.edu/~bwk/dmr.html
        quote: "was first published in 1978."
      - url: https://en.wikipedia.org/wiki/%22Hello,_World!%22_program
        quote: "an example program in the 1978 book"
  - text: Sein erstes Programm gibt hello, world aus, und seitdem beginnt fast jede Einführung in eine Programmiersprache so.
    sources:
      - url: https://en.wikipedia.org/wiki/%22Hello,_World!%22_program
        quote: "an example program in the 1978 book … Such a program is often the first written by a student of a new programming language."

strasser:
  - text: Wolfgang Straßer (1941–2015), deutscher Informatiker.
    sources:
      - url: https://de.wikipedia.org/wiki/Wolfgang_Straßer
        quote: "(* 10. August 1941 in Metzingen; † 24. Januar 2015 in Tübingen)"
      - url: https://www.cg.tuwien.ac.at/sites/default/files/lost-colleague/Wolfgang%20Strasser/WolfgangStrasser-Obituary.pdf
        quote: "Wolfgang Straßer was born in Metzingen on August 10, 1941."
  - text: Er studierte an der TU Berlin und schrieb dort 1974 seine Doktorarbeit über schnelle Kurven und Flächen auf dem Bildschirm.
    sources:
      - url: https://www.cg.tuwien.ac.at/sites/default/files/lost-colleague/Wolfgang%20Strasser/WolfgangStrasser-Obituary.pdf
        quote: "He studied telecommunications at TU Berlin and received his “Diplom” in 1969. … In 1974 Wolfgang Straßer received his PhD from TU Berlin with a thesis titled “Schnelle Kurven- und Flächendarstellung auf graphischen Sichtgeräten”"
  - text: Darin steht, einige Monate vor Edwin Catmull und unabhängig von ihm, der Tiefenpuffer
    sources:
      - url: https://www.cg.tuwien.ac.at/sites/default/files/lost-colleague/Wolfgang%20Strasser/WolfgangStrasser-Obituary.pdf
        quote: "Independently of Ed Catmull’s work, Wolfgang Straßer’s dissertation already contained a description of the z-buffer algorithm back in 1974"
      - url: https://en.wikipedia.org/wiki/Z-buffering
        quote: "The invention of the z-buffer concept is most often attributed to Edwin Catmull, although Wolfgang Straßer described this idea in his 1974 Ph.D. thesis months before Catmull's invention."
  - text: "Für jeden Bildpunkt wird auch die Z-Koordinate gespeichert, und ein neuer Punkt wird nur gezeichnet, wenn er näher liegt."
    sources:
      - url: https://uni-tuebingen.de/de/62821
        quote: "durch Einführung der sogenannten z-Koordinate, also sozusagen der dritten Dimension für zweidimensionale Bilder … und daher auch nicht in den sogenannten Bildspeicher geschrieben werden müssen."
  - text: Diesen Vergleich schaltet BeginMode3D in der Klötzchenwelt ein.
    none: Workspace
  - text: Die Idee steht ganz hinten, unter »Zukünftige Arbeiten«, mit dem Satz
    note: Kapitel 6 ist das letzte vor dem Literaturverzeichnis (S. 82 des Scans).
    sources:
      - url: https://cgvr.cs.uni-bremen.de/miscellaneous/strasser/Wolfgang_Strasser_Schnelle_Kurven-_und_Flaechendarstellung_auf_grafischen_Sichtgeraeten.pdf#page=82
        quote: "6. Zukünftige Arbeiten … Hier kann nur die Entfernung der verdeckten Flächen Abhilfe schaffen. Dies ist theoretisch in Echtzeit möglich"
  - text: »Beim augenblicklichen Stand der Preise und der Technologie der Halbleiterspeicher ist dieses Verfahren […] nicht realisierbar.«
    sources:
      - url: https://cgvr.cs.uni-bremen.de/miscellaneous/strasser/Wolfgang_Strasser_Schnelle_Kurven-_und_Flaechendarstellung_auf_grafischen_Sichtgeraeten.pdf#page=82
        quote: "Beim augenblicklichen Stand der Preise und der Technologie der Halbleiterspeicher ist dieses Verfahren zur Unterdrückung der verdeckten Flächen nicht realisierbar."
  - text: Heute hat jede Grafikkarte einen Tiefenpuffer, auch die in deinem Handy.
    sources:
      - url: https://uni-tuebingen.de/de/62821
        quote: "das heute von fast jedem computergraphischen System vom Handy bis zur Workstation zur Ausgabe von 3D-Graphik verwendet wird."
  - text: Ab 1986 war Straßer Professor in Tübingen.
    sources:
      - url: https://www.cg.tuwien.ac.at/sites/default/files/lost-colleague/Wolfgang%20Strasser/WolfgangStrasser-Obituary.pdf
        quote: "In 1986 Wolfgang Straßer accepted an offer for a chair position from the University of Tübingen."
      - url: https://de.wikipedia.org/wiki/Wolfgang_Straßer
        quote: "1986 wurde er als ordentlicher Professor an die Eberhard Karls Universität Tübingen berufen"

thompson:
  - text: Ken Thompson (geboren 1943).
    sources:
      - url: https://www.computerhistory.org/fellowawards/hall/ken-thompson/
        quote: "Ken Thompson was born in New Orleans, Louisiana, in 1943."
      - url: https://en.wikipedia.org/wiki/Ken_Thompson
        quote: "Kenneth Lane Thompson (born February 4, 1943) is an American pioneer of computer science."
  - text: Du suchst im Terminal mit grep?
    none: Workspace
  - text: Das hat er 1973 geschrieben
    sources:
      - url: https://en.wikipedia.org/wiki/Grep
        quote: "Before it was named, grep was a private utility written by Ken Thompson to search files for certain patterns. … grep was first included in Version 4 Unix."
      - url: https://swtch.com/~rsc/regexp/regexp1.html
        quote: "or in its descendant grep, which first appeared in the Fourth Edition (1973)"
  - text: 'der Name kommt aus seinem Texteditor, wo der Befehl g/re/p hieß: global, regular expression, print.'
    sources:
      - url: https://en.wikipedia.org/wiki/Grep
        quote: "Its name comes from the ed command g/re/p (global, regular expression, print)."
      - url: https://swtch.com/~rsc/regexp/regexp1.html
        quote: "Thompson chose not to use his algorithm when implementing the text editor ed, which appeared in First Edition Unix (1971)"
  - text: "Wie man aus einem regulären Ausdruck einen Automaten baut, hatte er schon 1968 beschrieben: die Thompson-Konstruktion."
    note: "Korrigiert; vorher: »Den Automaten dahinter baute er nach der Thompson-Konstruktion.«"
    sources:
      - url: https://swtch.com/~rsc/regexp/regexp1.html
        quote: "Thompson chose not to use his algorithm when implementing the text editor ed, which appeared in First Edition Unix (1971) … or in its descendant grep, which first appeared in the Fourth Edition (1973) … Instead, these venerable Unix tools used recursive backtracking!"
      - url: https://swtch.com/~rsc/regexp/regexp1.html
        quote: "Thompson introduced the multiple-state simulation approach in his 1968 paper."
      - url: https://en.wikipedia.org/wiki/Ken_Thompson
        quote: "Thompson had developed the CTSS version of the editor QED, which included regular expressions for searching text."
  - text: Das Terminal selbst läuft unter Linux, und Linux funktioniert wie Unix
    none: Workspace
  - text: das er ab 1969 mit Dennis Ritchie schrieb
    sources:
      - url: https://www.computerhistory.org/fellowawards/hall/ken-thompson/
        quote: "In 1969, Thompson and colleague Dennis Ritchie created the UNIX operating system at Bell Telephone Laboratories."
  - text: Unten rechts in VS Code steht UTF-8
    none: Workspace
  - text: Die Kodierung hat er 1992 mit Rob Pike auf ein Tischset in einem Diner gezeichnet.
    sources:
      - url: https://www.cl.cam.ac.uk/~mgk25/ucs/utf-8-history.txt
        quote: "UTF-8 was designed, in front of my eyes, on a placemat in a New Jersey diner one night in September or so 1992. … I very clearly remember Ken writing on the placemat and wished we had kept it!"
      - url: https://en.wikipedia.org/wiki/Ken_Thompson
        quote: "In 1992, Thompson developed the UTF-8 encoding scheme together with Rob Pike."
  - text: Und die Sprache Go hat er mit erfunden.
    sources:
      - url: https://go.dev/doc/faq
        quote: "Robert Griesemer, Rob Pike and Ken Thompson started sketching the goals for a new language on the white board on September 21, 2007."
      - url: https://en.wikipedia.org/wiki/Ken_Thompson
        quote: "Since 2006, Thompson has worked at Google, where he co-developed the Go language."

smith-alvy:
  - text: "Alvy Ray Smith (geboren 1943), amerikanischer Informatiker."
    sources:
      - url: https://en.wikipedia.org/wiki/Alvy_Ray_Smith
        quote: "born September 8, 1943"
  - text: "Ab 1974 arbeitete er bei Xerox PARC an SuperPaint, einem der ersten Malprogramme mit Farbe"
    sources:
      - url: https://en.wikipedia.org/wiki/Alvy_Ray_Smith
        quote: "In 1974, he joined the Xerox Palo Alto Research Center (PARC), … the first interactive color graphics program."
      - url: http://alvyray.com/Bio/BioLong.htm
        quote: "he was Visiting Scientist with Xerox PARC = Palo Alto Research Center (1974), during its heyday."
  - text: "danach am New York Institute of Technology an weiteren"
    sources:
      - url: https://en.wikipedia.org/wiki/Alvy_Ray_Smith
        quote: "In 1975, Smith joined the new Computer Graphics Laboratory … a series of newer paint programs, including Paint3"
  - text: "Damit man dort Farben nach Farbton, Sättigung und Helligkeit aussuchen konnte, ordnete er den RGB-Würfel zu HSV um."
    sources:
      - url: https://www.alvyray.com/Papers/CG/color78.pdf
        quote: "This paper presents a set of alternative models of the RGB monitor gamut based on the perceptual variables hue (H), saturation (S), and value (V) or brightness (L). … In some situations, such as color mixing, these models are more intuitively satisfying or more convenient to an artist than the colorcube."
      - url: https://en.wikipedia.org/wiki/Alvy_Ray_Smith
        quote: "Smith's major contribution to this software was the creation of the HSV color space."
  - text: "Als er es 1978 veröffentlichte, lief die Umrechnung schon seit etwa vier Jahren in Malprogrammen."
    sources:
      - url: https://www.alvyray.com/Papers/CG/color78.pdf
        quote: "Published in: SIGGRAPH 78 Conference Proceedings, Aug 1978, 12-19. … Particular emphasis is placed on an RGB to HSV nontrigonometric pair of transforms which have been used successfully for about four years in frame buffer painting programs."
  - text: "Mit Edwin Catmull erfand er Ende der 1970er Jahre den Alphakanal, das A in RGBA, das sagt, wie deckend ein Pixel ist."
    sources:
      - url: http://alvyray.com/Memos/CG/Microsoft/7_alpha.pdf
        quote: "Ed Catmull and I invented the notion of the integral alpha in the 1970s at New York Tech. This is the notion that opacity (or, equivalently, transparency) of an image is as fundamental as its color and should therefore be included as part of the image, not as a secondary accompaniment. … We coined the term “alpha” for the new channel. We called the resulting full-color pixel an “RGBA” pixel."
      - url: https://en.wikipedia.org/wiki/Alpha_compositing
        quote: "The concept of an alpha channel was introduced by Alvy Ray Smith and Ed Catmull in the late 1970s … at the New York Institute of Technology Computer Graphics Lab"
  - text: "1986 gründete er mit Catmull Pixar, mit dem Geld von Steve Jobs."
    note: "Korrigiert; vorher: »1986 gründete er mit Catmull und Steve Jobs Pixar.«"
    sources:
      - url: http://alvyray.com/Pixar/PixarHistoryRevisited.htm
        quote: "Four Steve Jobs Myths about Pixar … Steve Jobs co-founded Pixar. … Then in 1986, Steve Jobs came on the scene, providing the investment money so that they could form Pixar"
      - url: http://alvyray.com/Bio/BioLong.htm
        quote: "Ed Catmull cofounded Pixar with me."
      - url: https://en.wikipedia.org/wiki/Alvy_Ray_Smith
        quote: "in February 1986 they became the co-founders of Pixar, Inc. … convinced Steve Jobs to finance the spin-out"

chamberlin-boyce:
  - text: Donald Chamberlin (geboren 1944, im Bild)
    sources:
      - url: https://en.wikipedia.org/wiki/Donald_D._Chamberlin
        quote: "December 21, 1944"
  - text: Raymond Boyce (1946–1974)
    sources:
      - url: https://en.wikipedia.org/wiki/Raymond_F._Boyce
        quote: "Boyce was born in New York City on August 27, 1946. … He died on June 18, 1974, as a result of an aneurysm"
  - text: amerikanische Informatiker bei IBM
    sources:
      - url: https://disciplinas.uvv.br/assets/disciplinas/bd1/early_history_of_sql.pdf
        quote: "Ray Boyce and I first met E.F. (Ted) Codd at a symposium he organized at the IBM T.J. Watson Research Center in Yorktown Heights, New York, in 1972. Ray and I were both recent hires at the Watson Center."
      - url: https://en.wikipedia.org/wiki/Donald_D._Chamberlin
        quote: "American computer scientist"
  - text: "stellten 1974 eine Sprache für Codds Tabellen vor, die sich fast wie Englisch liest: SEQUEL, die Structured English Query Language"
    sources:
      - url: https://s3.us.cloud-object-storage.appdomain.cloud/res-files/2705-sequel-1974.pdf
        quote: "SEQUEL: A STRUCTURED ENGLISH QUERY LANGUAGE by Donald D. Chamberlin Raymond F. Boyce IBM Research Laboratory San Jose, California … A SEQUEL user is presented with a consistent set of keyword English templates which reflect how people use tables to obtain information. … In a series of papers, E. F. Codd (5-9) has introduced the relational model of data"
      - url: https://disciplinas.uvv.br/assets/disciplinas/bd1/early_history_of_sql.pdf
        quote: "In 1974, about one month after presenting a paper on Sequel at a technical conference in Ann Arbor, Michigan, Ray Boyce died suddenly"
  - text: "Schon ihr erstes Beispiel hat die Form, in der du heute jede Abfrage schreibst: SELECT NAME FROM EMP WHERE DEPT = 'TOY'."
    sources:
      - url: https://s3.us.cloud-object-storage.appdomain.cloud/res-files/2705-sequel-1974.pdf
        quote: "As in SQUARE, the simplest SEQUEL expression is a mapping which specifies a table, a domain, a range, and an argument, as illustrated by Q1. Q1. Find the names of employees in the toy department. SELECT NAME FROM EMP WHERE DEPT = 'TOY'"
  - text: Weil der Name SEQUEL schon einer britischen Flugzeugfirma gehörte, wurde daraus SQL.
    note: >-
      Chamberlin selbst schreibt nur von einem Markenproblem (1977). Den Markeninhaber nennt die englische
      Wikipedia »Hawker Siddeley Dynamics Engineering Limited«, einen Teil des britischen Flugzeug- und
      Rüstungskonzerns Hawker Siddeley; learnsql.com schreibt »Hawker Siddeley aircraft company«.
    sources:
      - url: https://disciplinas.uvv.br/assets/disciplinas/bd1/early_history_of_sql.pdf
        quote: "In 1977, because of a trademark issue, the name Sequel was shortened to SQL."
      - url: https://en.wikipedia.org/wiki/SQL#History
        quote: "was later changed to SQL (dropping the vowels) because \"SEQUEL\" was a trademark of the UK-based Hawker Siddeley Dynamics Engineering Limited company."
      - url: https://learnsql.com/blog/sql-or-sequel/
        quote: "due to trademark violations on the acronym SEQUEL, which was already registered by the Hawker Siddeley aircraft company"
  - text: Viele sprechen es trotzdem »Sequel« aus, Chamberlin auch.
    note: >-
      Dass Chamberlin selbst »Sequel« sagt, belegt Wikipedia nur mit einem Blogeintrag, der sich auf ein Video
      stützt; in seiner E-Mail an diesen Blog legt Chamberlin sich nicht fest und nennt beide Aussprachen
      üblich. learnsql.com behauptet ohne Beleg das Gegenteil (»Ess-Cue-Ell«). Der erste Teil des Satzes
      ist gut belegt, »Chamberlin auch« nur schwach.
    sources:
      - url: https://en.wikipedia.org/wiki/SQL#History
        quote: "Regardless, many English-speaking database professionals (including Donald Chamberlin himself … use the acronym-like pronunciation of"
      - url: https://patorjk.com/blog/2012/01/26/pronouncing-sql-s-q-l-or-sequel/
        quote: "Since the language was originally named SEQUEL, many people continued to pronounce the name that way … Both pronunciations are widely used and recognized."
  - text: "Boyce starb noch im selben Jahr, keine 30 Jahre alt."
    note: "Korrigiert; vorher: »Boyce starb noch im selben Jahr, mit 27 Jahren.«"
    sources:
      - url: https://disciplinas.uvv.br/assets/disciplinas/bd1/early_history_of_sql.pdf
        quote: "In 1974, about one month after presenting a paper on Sequel at a technical conference in Ann Arbor, Michigan, Ray Boyce died suddenly of a ruptured brain aneurysm at the age of 26, leaving behind a wife of five years and a 10-month-old daughter."
      - url: https://en.wikipedia.org/wiki/Raymond_F._Boyce
        quote: "Boyce was born in New York City on August 27, 1946. … He died on June 18, 1974, as a result of an aneurysm"

diffie-hellman:
  - text: Whitfield Diffie (geboren 1944, im Bild) und Martin Hellman (geboren 1945), amerikanische Kryptografen in Stanford
    sources:
      - url: https://en.wikipedia.org/wiki/Whitfield_Diffie
        quote: "Bailey Whitfield 'Whit' Diffie (born June 5, 1944) is an American cryptographer and mathematician."
      - url: https://en.wikipedia.org/wiki/Martin_Hellman
        quote: "Martin Edward Hellman (born October 2, 1945) is an American cryptologist and mathematician"
      - url: https://fsi.stanford.edu/node/19279
        quote: "Hellman, Stanford professor emeritus of electrical engineering. … Diffie, who was a part-time researcher at Stanford at the time he and Hellman invented public-key cryptography."
  - text: schlugen 1976 vor, mit zwei Schlüsseln zu verschlüsseln, einem öffentlichen und einem privaten
    sources:
      - url: https://ee.stanford.edu/~hellman/publications/24.pdf
        quote: "IEEE TRANSACTIONS ON INFORMATION THEORY, VOL. IT-22, NO. 6, NOVEMBER 1976 … New Directions in Cryptography … In a public key cryptosystem enciphering and deciphering are governed by distinct keys, E and D, such that computing D from E is computationally infeasible … The enciphering key E can thus be publicly disclosed without compromising the deciphering key D."
      - url: https://fsi.stanford.edu/node/19279
        quote: "Diffie and Hellman's 1976 paper \"New Directions in Cryptography\" stunned the academic and intelligence communities … They called it public-key cryptography."
  - text: Im selben Aufsatz zeigten sie, wie zwei Menschen über eine Leitung, die jeder mitlesen kann, ein gemeinsames Geheimnis verabreden, ohne es je zu schicken
    sources:
      - url: https://ee.stanford.edu/~hellman/publications/24.pdf
        quote: "Public key distribution systems offer a different approach to eliminating the need for a secure key distribution channel. In such a system, two users who wish to exchange a key communicate back and forth until they arrive at a key in common. A third party eavesdropping on this exchange must find it computationally infeasible to compute the key from the information overheard. A possible solution to the public key distribution problem is given in Section III"
      - url: https://en.wikipedia.org/wiki/Diffie%E2%80%93Hellman_key_exchange
        quote: "published by Whitfield Diffie and Martin Hellman in 1976"
  - text: Mit einer Fassung davon verabreden Browser und Server bei https:// heute meist ihren Schlüssel.
    sources:
      - url: https://www.rfc-editor.org/rfc/rfc8446
        quote: "Static RSA and Diffie-Hellman cipher suites have been removed; … all public-key based key exchange mechanisms now provide forward secrecy. … TLS supports three basic key exchange modes:"
      - url: https://en.wikipedia.org/wiki/Diffie%E2%80%93Hellman_key_exchange
        quote: "is used to provide forward secrecy in Transport Layer Security's ephemeral modes"
  - text: Beim britischen Geheimdienst GCHQ hatten James Ellis, Clifford Cocks und Malcolm Williamson dieselben Ideen schon einige Jahre früher, aber das blieb bis 1997 geheim.
    sources:
      - url: https://en.wikipedia.org/wiki/Diffie%E2%80%93Hellman_key_exchange
        quote: "In 1997 it was revealed that James H. Ellis, Clifford Cocks, and Malcolm J. Williamson of GCHQ … had previously shown in 1969"
      - url: https://www.schneier.com/essays/archives/1998/04/the_secret_story_of.html
        quote: "released a document on December 1 1997, claiming to have invented publickey cryptography … C.C. Cocks (another British spook) published a classified paper where he described what was essentially RSA. … in 1974, M. J. Williamson invented another classified algorithm, remarkably similar to Diffie-Hellman."
  - text: Diffie und Hellman bekamen 2015 den Turing Award, den wichtigsten Preis der Informatik.
    sources:
      - url: https://fsi.stanford.edu/node/19279
        quote: "are being honored with the Association for Computing Machinery's 2015 A.M. Turing Award. … The award is often referred to as the \"Nobel Prize of computing\""

catmull:
  - text: Edwin Catmull (geboren 1945), amerikanischer Informatiker.
    sources:
      - url: https://en.wikipedia.org/wiki/Edwin_Catmull
        quote: "Edwin Catmull was born on March 31, 1945, in Parkersburg, West Virginia."
  - text: In seiner Doktorarbeit an der University of Utah beschrieb er 1974 den Tiefenpuffer, unabhängig von Wolfgang Straßer
    sources:
      - url: https://en.wikipedia.org/wiki/Edwin_Catmull
        quote: "In 1974, Catmull earned his doctorate in computer science. … He also independently discovered Z-buffering, which had been described eight months before … by Wolfgang Straßer in his PhD thesis."
      - url: https://continuum.utah.edu/features/the-imaginer/
        quote: "Catmull BS’69 PhD’74 was born in Parkersburg, West Virginia,"
      - url: https://en.wikipedia.org/wiki/Z-buffering
        quote: "Z-buffering was first described in 1974 by Wolfgang Straßer in his PhD thesis … The invention of the z-buffer concept is most often attributed to Edwin Catmull"
  - text: "und dazu Texture Mapping: ein Bild auf eine Fläche legen"
    sources:
      - url: https://en.wikipedia.org/wiki/Texture_mapping
        quote: "The original technique was pioneered by Edwin Catmull in 1974 as part of his doctoral thesis."
  - text: wie die Kacheln auf die Blöcke der Klötzchenwelt
    none: Workspace
  - text: 1986 gründete er mit Alvy Ray Smith und Steve Jobs Pixar
    sources:
      - url: https://en.wikipedia.org/wiki/Pixar
        quote: "with funding from Apple co-founder Steve Jobs, who became its majority shareholder. … the group, which then numbered 40 individuals, was spun out as a corporation in February 1986 by Catmull and Smith."
  - text: das 1995 mit Toy Story den ersten Kinofilm ganz aus dem Computer herausbrachte
    sources:
      - url: https://en.wikipedia.org/wiki/Pixar
        quote: "beginning with Toy Story (1995), which is also the first fully computer-animated feature film"
      - url: https://computerhistory.org/events/creativity-inc-author-ed/
        quote: "Nine years later, Pixar released Toy Story, the first feature-length film created entirely on computers."
  - text: Als Kind wollte er Trickfilmzeichner bei Disney werden.
    sources:
      - url: https://en.wikipedia.org/wiki/Edwin_Catmull
        quote: "Early in his life, Catmull found inspiration in Disney movies, including Peter Pan and Pinocchio, … wanted to be an animator; however, after finishing high school, he had no idea how to get there"
      - url: https://continuum.utah.edu/features/the-imaginer/
        quote: "He dreamed of becoming an animator, and he filled up sketchbooks and created his own flipbooks."
      - url: https://computerhistory.org/events/creativity-inc-author-ed/
        quote: "Thus, through his chosen route of physics, mathematics and computing, Ed Catmull realized his dream to be a Disney animator."
  - text: 1972 animierte er stattdessen am Computer seine eigene linke Hand, eine der ersten Computeranimationen in 3D.
    sources:
      - url: https://en.wikipedia.org/wiki/A_Computer_Animated_Hand
        quote: "A Computer Animated Hand is a 1972 American computer-animated short film produced by Edwin Catmull and Fred Parke. … Catmull used his left hand as the basis for the clip, first creating a model of it. … The short film has been called groundbreaking and revolutionary for being one of the earliest examples of computer animation."
      - url: https://beforesandafters.com/2020/09/07/it-has-become-feasible-to-generate-useful-movies-with-the-computer/
        quote: "in which Catmull's hand had been digitized, modeled and animated as a 3D object."
  - text: Und als Disney 2006 Pixar kaufte
    sources:
      - url: https://continuum.utah.edu/features/the-imaginer/
        quote: "When Disney acquired Pixar Animation Studios in 2006, Catmull became president of both Disney Animation Studios and Pixar."
  - text: "leitete er bis 2018 auch die Trickfilmstudios von Disney"
    note: "Korrigiert; vorher: »leitete er bis 2019 auch die Trickfilmstudios von Disney«"
    sources:
      - url: https://www.awn.com/news/pixar-co-founder-ed-catmull-retiring-after-40-years
        quote: "stepping down from his current role at the end of 2018 … staying on as an employee in an advisory role through July 2019"
      - url: https://en.wikipedia.org/wiki/Edwin_Catmull
        quote: "On October 23, 2018, Catmull announced his plans to retire from Pixar and Disney Animation, … staying on as an adviser through July 2019."

tesler:
  - text: Larry Tesler (1945–2020), amerikanischer Informatiker.
    sources:
      - url: https://en.wikipedia.org/wiki/Larry_Tesler
        quote: "Lawrence Gordon Tesler (April 24, 1945 – February 16, 2020) was an American computer scientist"
  - text: Du kopierst mit StrgC und fügst mit StrgV ein?
    none: Workspace
  - text: Die Namen cut, copy und paste dafür hat er vorgeschlagen
    note: >-
      Tesler selbst (Interactions 2012): »cut and paste« war vorher schon Fachjargon des
      Druckgewerbes, er schlug es als Befehle vor; »copy and paste« entstand in Gypsy.
      Den Satz kann man so lassen; genauer wäre: »Die Befehle cut, copy und paste hat er
      vorgeschlagen«.
    sources:
      - url: https://trisquel.info/files/larry_tesler_modeless_copy_paste.pdf
        quote: "We also proposed modeless postfix syntax with cut and paste. … My suggestion to use cut and paste in both the page-makeup system and the galley editor delighted Ginn management."
      - url: https://trisquel.info/files/larry_tesler_modeless_copy_paste.pdf
        quote: "Before the computer age, the term cut and paste was publishing-industry jargon. The term copy and paste appears to have originated in Gypsy."
  - text: ab 1974 baute er die Befehle mit Kollegen bei Xerox PARC in Texteditoren ein, etwa in Gypsy, den er mit Tim Mott schrieb
    sources:
      - url: https://trisquel.info/files/larry_tesler_modeless_copy_paste.pdf
        quote: "In 1974, after completing the study, Mott came to PARC to help me implement the galley editor, which he dubbed Gypsy. … move text in two steps called cut and paste; … copy text in two steps called copy and paste;"
      - url: https://trisquel.info/files/larry_tesler_modeless_copy_paste.pdf
        quote: "When Gypsy was finished in early 1975, Mott brought it to Ginn. … Other PARC colleagues built on our work. Mott and I had used dedicated keys for cut, copy, paste, and undo."
      - url: https://en.wikipedia.org/wiki/Larry_Tesler
        quote: "While working on Gypsy, Tesler and his colleague Tim Mott started writing ideas down"
  - text: 1980 ging er zu Apple, wo die Befehle in die Computer Lisa und Macintosh kamen.
    sources:
      - url: https://en.wikipedia.org/wiki/Larry_Tesler
        quote: "Tesler started at Apple in July 1980 supporting the development of the Apple Lisa"
      - url: https://trisquel.info/files/larry_tesler_modeless_copy_paste.pdf
        quote: "I went to Apple to work on the Lisa user interface and applications."
      - url: https://trisquel.info/files/larry_tesler_modeless_copy_paste.pdf
        quote: "In the early 1980s, Xerox’s modeless editors influenced Apple’s Lisa and Macintosh as well as Microsoft Word, Office, and Windows. The popularity of Microsoft and Apple products made cut/copy-paste and modeless text editing ubiquitous"
  - text: 'Die Editoren damals hatten Modi: In einem Modus war jede Taste ein Befehl, in einem anderen schrieb sie Text'
    sources:
      - url: https://trisquel.info/files/larry_tesler_modeless_copy_paste.pdf
        quote: "Its command language had numerous modes. Outside text-entry mode, virtually every keystroke and click changed the mode."
      - url: https://trisquel.info/files/larry_tesler_modeless_copy_paste.pdf
        quote: "Languages that use unmodified letter keys to do anything but enter those letters as text need at least two modes: text and command."
  - text: wie heute noch in vim, wo du erst I drückst
    sources:
      - url: https://vimhelp.org/intro.txt.html
        quote: "In Normal mode you can enter all the normal editor commands. … In Insert mode the text you type is inserted into the buffer. … Go from Normal mode to Insert mode by giving the command \"i\", \"I\", \"a\", \"A\", \"o\", \"O\", \"c\", \"C\", \"s\" or S\"."
  - text: Tesler fand das furchtbar.
    sources:
      - url: https://trisquel.info/files/larry_tesler_modeless_copy_paste.pdf
        quote: "I much preferred interactive to batch, but most interactive programs had modes, which always tripped me up. I began to analyze command languages to root out the causes of modes and mode errors."
      - url: https://en.wikipedia.org/wiki/Larry_Tesler
        quote: "Tesler maintained his strong preference for modeless software well beyond his time at PARC."
  - text: »Don't mode me in« war sein Spruch
    sources:
      - url: https://en.wikipedia.org/wiki/Larry_Tesler
        quote: "Along with others, he had also been using the phrase \"Don't Mode Me In\" for years"
      - url: https://daringfireball.net/linked/2020/02/19/
        quote: "He regularly wore a T-shirt warning colleagues not to “Mode Me In.”"
  - text: auf dem Nummernschild seines Autos stand NOMODES
    sources:
      - url: https://en.wikipedia.org/wiki/Larry_Tesler
        quote: "To promote his preference, as of 1995, Tesler equipped his automobile with a personalized California license plate … reading \"NOMODES\"."
      - url: https://daringfireball.net/linked/2020/02/19/
        quote: "His Dodge Valiant bore a customized license plate reading “NO MODES.”"

rivest-shamir-adleman:
  - text: Ron Rivest (geboren 1947), Adi Shamir (geboren 1952) und Leonard Adleman (geboren 1945)
    sources:
      - url: https://en.wikipedia.org/wiki/Ron_Rivest
        quote: "born May 6, 1947) is an American cryptographer and computer scientist"
      - url: https://en.wikipedia.org/wiki/Adi_Shamir
        quote: "Adi Shamir (Hebrew: עדי שמיר; born July 6, 1952) is an Israeli cryptographer and inventor."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Adleman/
        quote: "31 December 1945"
  - text: damals am MIT
    sources:
      - url: https://en.wikipedia.org/wiki/RSA_cryptosystem
        quote: "Rivest, Shamir, and Adleman invented RSA at MIT."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Adleman/
        quote: "immediately secured a job as an assistant professor of mathematics at MIT"
      - url: https://en.wikipedia.org/wiki/Adi_Shamir
        quote: "did research at Massachusetts Institute of Technology (MIT) from 1977 to 1980."
  - text: Das Schlüsselpaar, das du mit openssl genpkey -algorithm RSA erzeugst
    none: Workspace
  - text: "trägt ihre Anfangsbuchstaben: RSA veröffentlichten sie 1977."
    sources:
      - url: https://en.wikipedia.org/wiki/RSA_cryptosystem
        quote: "publicly described the algorithm in 1977 … A detailed description of the algorithm was published in August 1977"
  - text: Rivest und Shamir schlugen eine Idee nach der anderen vor, und Adleman, der Mathematiker, suchte in jeder die Schwachstelle.
    sources:
      - url: https://en.wikipedia.org/wiki/RSA_cryptosystem
        quote: "Rivest and Shamir, as computer scientists, proposed many potential functions … Adleman, as a mathematician, was responsible for finding their weaknesses."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Adleman/
        quote: "Rivest and Shamir were inventing coding systems and Adleman agreed to test each of the systems by trying to break it. … The duo came up with 42 different coding systems and each time Adleman was able to break it."
  - text: 1977 feierten sie Pessach bei einem Studenten, mit viel Wein.
    sources:
      - url: https://en.wikipedia.org/wiki/RSA_cryptosystem
        quote: "In April 1977, they spent Passover at the house of a student and drank a good deal of wine before returning to their homes at around midnight."
      - url: https://www.goodreads.com/notes/10566242-the-code-book/185327722-daniel-dantas?page=5
        quote: "In April 1977, Rivest, Shamir and Adleman spent Passover at the house of a student … had consumed significant amounts of Manischewitz wine"
  - text: Rivest konnte danach nicht schlafen, legte sich mit einem Mathebuch aufs Sofa und hatte bis zum Morgen den größten Teil des Aufsatzes geschrieben.
    sources:
      - url: https://en.wikipedia.org/wiki/RSA_cryptosystem
        quote: "Rivest, unable to sleep, lay on the couch with a math textbook … he had much of the paper ready by daybreak."
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Adleman/
        quote: "Rivest stayed up all night, preparing the manuscript describing the code before he handed it to Adleman."
      - url: https://www.goodreads.com/notes/10566242-the-code-book/185327722-daniel-dantas?page=5
        quote: "Rivest, unable to sleep, lay on his couch reading a mathematics textbook."
  - text: In der gedruckten Fassung von 1978 tauchen zum ersten Mal Alice und Bob auf
    sources:
      - url: https://en.wikipedia.org/wiki/Alice_and_Bob
        quote: "The first mention of Alice and Bob in the context of cryptography was in Rivest, Shamir, and Adleman's 1978 article."
      - url: http://cryptocouple.com/
        quote: "For our scenarios we suppose that A and B (also known as Alice and Bob) are two users of a public-key cryptosystem … This is the first ever mention of Alice and Bob in any connection to cryptography"
  - text: die seitdem in fast jedem Beispiel zur Verschlüsselung Nachrichten tauschen
    sources:
      - url: https://en.wikipedia.org/wiki/Alice_and_Bob
        quote: "Alice and Bob are fictional characters commonly used as placeholders in discussions about cryptographic systems"
  - text: 2002 bekamen die drei den Turing Award, den wichtigsten Preis der Informatik.
    sources:
      - url: https://mathshistory.st-andrews.ac.uk/Biographies/Adleman/
        quote: "Turing Award 2002"
      - url: https://en.wikipedia.org/wiki/Turing_Award
        quote: "It is generally recognized as the highest distinction in the field of computer science … for their ingenious contribution for making public-key cryptography useful in practice"

chen:
  - text: Peter Chen (geboren 1947), Informatiker aus Taiwan
    sources:
      - url: https://en.wikipedia.org/wiki/Peter_Chen
        quote: "3 January 1947"
    note: >-
      Wikipedia nennt als Geburtsort Taichung, Taiwan; ein zweiter, nicht-Wikipedia-Beleg für das Geburtsjahr
      wurde nicht gesucht bzw. nicht gefunden.
  - text: veröffentlichte 1976 am MIT das Entity-Relationship-Modell
    sources:
      - url: https://www.csc.lsu.edu/~chen/pdf/erd-5-pages.pdf
        quote: "The Entity-Relationship Model-Toward a Unified View of Data PETER PIN-SHAN CHEN Massachusetts Institute of Technology … ACM Transactions on Database Systems, Vol. 1, No. 1. March 1976, Pages 9-36."
      - url: https://en.wikipedia.org/wiki/Peter_Chen
        quote: "From 1974 to 1978 Chen was an assistant professor at the MIT Sloan School of Management."
  - text: Rechtecke für Entitäten, Rauten für Beziehungen.
    note: "Korrigiert; vorher: »Rechtecke für Entitäten, Rauten für Beziehungen, Ellipsen für Attribute.« Im Aufsatz von 1976 gibt es keine Ellipsen."
    sources:
      - url: https://www.comp.nus.edu.sg/~lingtw/papers/tods76.chen.pdf
        quote: "Each entity set is represented by a rectangular box, and each relationship set is represented by a diamond-shaped box."
  - text: "Die Chen-Notation, in der Attribute als Ellipsen dazukommen, heißt nach ihm."
    note: >-
      Korrigiert; vorher: »Die Chen-Notation heißt nach ihm.« Der Wikipedia-Artikel spricht von »Chen's notation«;
      ein wörtlicher Satz »heißt nach ihm« wurde nicht gefunden.
    sources:
      - url: https://en.wikipedia.org/wiki/Entity%E2%80%93relationship_model
        quote: "Attributes are drawn as ovals and connected with a line to exactly one entity or relationship set."
      - url: https://en.wikipedia.org/wiki/Entity%E2%80%93relationship_model
        quote: "rectangles to represent entity sets, and diamonds to represent relationships"
  - text: Er wollte eine Sprache, in der man eine Datenbank planen kann, bevor man an Tabellen denkt.
    sources:
      - url: https://www.csc.lsu.edu/~chen/pdf/erd-5-pages.pdf
        quote: "A special diagrammatic technique is introduced as a tool for database design."
      - url: https://www.comp.nus.edu.sg/~lingtw/papers/tods76.chen.pdf
        quote: "There are four steps in designing a database using the entity-relationship model: (1) identify the entity sets and the relationship sets of interest; (2) identify semantic information in the relationship sets such as whether a certain relationship set is an 1:n mapping; (3) define the value sets and attributes; (4) organize data into entity/relationship relations and decide primary keys."

whitted:
  - text: Turner Whitted, amerikanischer Informatiker.
    sources:
      - url: https://en.wikipedia.org/wiki/J._Turner_Whitted
        quote: "an American scientist in academia"
  - text: Bei den Bell Labs zeigte er 1979, wie Raytracing Spiegelungen, Glas und Schatten berechnet
    sources:
      - url: https://ece.ncsu.edu/honor/turner-whitted/
        quote: "as a member of the technical staff at Bell Laboratories, he introduced recursive ray tracing"
      - url: https://www.citedrive.com/en/discovery/an-improved-illumination-model-for-shaded-display/
        quote: "Consideration of all of these factors allows the shader to accurately simulate true reflection, shadows, and refraction,"
      - url: https://techgage.com/print/the-path-to-real-time-ray-tracing
        quote: "Two Spheres Recursive Ray Tracing, Rendered in 1979."
  - text: Trifft ein Strahl eine spiegelnde oder durchsichtige Fläche, schickt das Programm von dort neue Strahlen weiter, und von deren Treffpunkten wieder neue, rekursiv.
    sources:
      - url: https://www.citedrive.com/en/discovery/an-improved-illumination-model-for-shaded-display/
        quote: "In a simplified form, this information is stored in a tree of “rays” extending from the viewer to the first surface encountered and from there to other surfaces and to the light sources. A visible surface algorithm creates this tree for each pixel of the display and passes it to the shader."
  - text: Darum spiegeln sich in einer Kugel aus Chrom auch die anderen Kugeln.
    sources:
      - url: https://www.citedrive.com/en/discovery/an-improved-illumination-model-for-shaded-display/
        quote: "The shader then traverses the tree to determine the intensity of the light received by the viewer."
  - text: Sein berühmtes Bild, eine Glaskugel und eine spiegelnde Kugel über einem Schachbrett
    sources:
      - url: https://techgage.com/print/the-path-to-real-time-ray-tracing
        quote: "two spheres reflecting and refracting a checkerboard"
  - text: 640 × 480 Pixel groß
    note: >-
      Whitted selbst nennt im Interview 640×480. Manche Vorlesungsfolien nennen 512×512; der Aufsatz
      selbst (CACM 1980) konnte nicht gelesen werden (PDF-Kopien nicht erreichbar).
    sources:
      - url: https://techgage.com/print/the-path-to-real-time-ray-tracing
        quote: "At a resolution of 640×480, this worked out to roughly 1/70th of a second per pixel"
  - text: rechnete ein Computer vom Typ VAX-11/780 74 Minuten lang
    sources:
      - url: https://techgage.com/print/the-path-to-real-time-ray-tracing
        quote: "The VAX-11/780 was considerably faster and took only 74 minutes to render the spheres and checkerboard."
  - text: 2014 ging Whitted zu Nvidia
    sources:
      - url: https://ece.ncsu.edu/honor/turner-whitted/
        quote: "Turner Whitted joined NVIDIA in 2014 after 15 years at Microsoft Research"
      - url: https://en.wikipedia.org/wiki/J._Turner_Whitted
        quote: "in 2014 joined NVidia Research"
  - text: deren Grafikkarten seit 2018 Raytracing in Echtzeit können, viele Bilder in der Sekunde
    sources:
      - url: https://itwire.com/entertainment/nvidia-unveils-world-s-first-real-time-ray-tracing-gpu.html
        quote: "Nvidia has announced its new Turing architecture and Quadro RTX video card, the world’s first real-time ray-tracing GPU."

mockapetris:
  - text: "Paul Mockapetris (geboren 1948), amerikanischer Informatiker"
    sources:
      - url: https://en.wikipedia.org/wiki/Paul_Mockapetris
        quote: "Paul V. Mockapetris (born November 18, 1948 in Boston, Massachusetts, US)"
  - text: "entwarf 1983 das DNS"
    sources:
      - url: https://www.rfc-editor.org/rfc/rfc882.html
        quote: "P. Mockapetris … November 1983 … What is needed is a distributed database that performs the same function, … hence avoids the problems caused by a centralized database."
      - url: https://en.wikipedia.org/wiki/Paul_Mockapetris
        quote: "In 1983, he proposed a Domain Name System architecture in RFC 882 and RFC 883, … while working at the USC Information Sciences Institute."
  - text: "Vorher stand jeder Rechner des Internets mit seiner Adresse in einer einzigen Datei, HOSTS.TXT, die alle immer wieder herunterluden."
    sources:
      - url: https://www.rfc-editor.org/rfc/rfc882.html
        quote: "Currently hosts in the ARPA Internet are registered with the Network Information Center (NIC) … (available as the file <NETINFO>HOSTS.TXT on the SRI-NIC host). … The size of this table, and especially the frequency of updates to the table are near the limit of manageability."
      - url: https://en.wikipedia.org/wiki/Hosts_(file)
        quote: "Originally a file named HOSTS.TXT was manually maintained and made available via file sharing by Stanford Research Institute"
  - text: "Das Netz wuchs schnell, und bald ging das nicht mehr."
    note: "Korrigiert; vorher: »Mit Tausenden Rechnern ging das nicht mehr.«"
    sources:
      - url: https://www.rfc-editor.org/rfc/rfc1296.html
        quote: "08/83              562 … 10/84            1,024"
      - url: https://www.rfc-editor.org/rfc/rfc882.html
        quote: "The ARPA Internet illustrates the size-related problems; it is a large system and is likely to grow much larger."
  - text: "Eine solche Datei hat jeder Rechner bis heute, für Namen, die er selbst kennt"
    sources:
      - url: https://en.wikipedia.org/wiki/Hosts_(file)
        quote: "In modern operating systems, the hosts file remains an alternative name resolution mechanism"
  - text: "cat /etc/hosts im Terminal zeigt sie"
    none: Workspace

wilhite:
  - text: Steve Wilhite (1948–2022), amerikanischer Programmierer
    sources:
      - url: https://en.wikipedia.org/wiki/Steve_Wilhite
        quote: "March 3, 1948 … March 14, 2022 … American computer scientist"
      - url: https://www.pbs.org/newshour/nation/stephen-wilhite-inventor-of-the-gif-format-has-died
        quote: "Stephen Wilhite, the inventor of the internet-popular short-video format, the GIF, has died. … He was 74. … His wife, Kathaleen, said Thursday in a phone interview that he died of COVID on March 14."
  - text: entwarf 1987 bei der Firma CompuServe das Format GIF
    note: >-
      Wilhite leitete das Team bei CompuServe, das GIF entwickelte; »entwarf« ist dafür eine vertretbare
      Vereinfachung.
    sources:
      - url: https://www.pbs.org/newshour/nation/stephen-wilhite-inventor-of-the-gif-format-has-died
        quote: "Wilhite was working at CompuServe in 1987 when he invented the GIF."
      - url: https://www.w3.org/Graphics/GIF/spec-gif87.txt
        quote: "'GIF' (tm) is CompuServe's standard for defining generalized color raster images."
      - url: https://en.wikipedia.org/wiki/Steve_Wilhite
        quote: "Wilhite's team at CompuServe developed the GIF (Graphic Interchange Format) in 1987."
  - text: "Farbbilder, die über die langsamen Modems der Zeit schnell genug ankamen und auf jedem Rechner gleich aussahen"
    sources:
      - url: https://en.wikipedia.org/wiki/GIF#History
        quote: "CompuServe introduced GIF on 15 June 1987 to provide a color image format for their file downloading areas. … GIF became popular because it used Lempel–Ziv–Welch data compression. … fairly large images could be downloaded reasonably quickly even with slow modems."
      - url: https://www.w3.org/Graphics/GIF/spec-gif87.txt
        quote: "allows high-quality, high-resolution graphics to be displayed on a variety of graphics hardware and is intended as an exchange and display mechanism for graphics images."
  - text: 2013 bekam er dafür einen Webby Award
    sources:
      - url: https://www.pbs.org/newshour/nation/stephen-wilhite-inventor-of-the-gif-format-has-died
        quote: "won a Webby lifetime achievement award in 2013 for inventing the GIF"
      - url: https://en.wikipedia.org/wiki/Steve_Wilhite
        quote: "Known as the inventor or creator of the GIF, Wilhite received a Webby Lifetime Achievement Award in 2013."
  - text: "sagte bei der Verleihung, wie man es ausspricht: mit weichem G, wie »Jif«"
    note: >-
      Genau genommen zeigte er bei der Verleihung eine Folie (ein GIF) mit »It's pronounced JIF, not GIF«;
      der Satz »sagte« ist dafür eine harmlose Vereinfachung. »Jif« ist eine amerikanische Erdnussbutter-Marke.
    sources:
      - url: https://www.hothardware.com/news/stephen-wilhite-creator-gif-passes-away
        quote: "The invention of the GIF led to his Webby award in 2013, and official clarification on its proper pronunciation. … During his acceptance speech, Wilhite flashed a GIF that read, \"It's pronounced JIF, not GIF,\""
      - url: https://www.pbs.org/newshour/nation/stephen-wilhite-inventor-of-the-gif-format-has-died
        quote: "insisting that the file had only one pronunciation - a soft \"G,\" like Jif peanut butter."

livingstone-jackson:
  - text: Ian Livingstone (geboren 1949, im Bild) und Steve Jackson (geboren 1951), britische Spieleautoren.
    sources:
      - url: https://en.wikipedia.org/wiki/Ian_Livingstone
        quote: "Sir Ian Livingstone (born 29 December 1949"
      - url: https://en.wikipedia.org/wiki/Steve_Jackson_(British_game_designer)
        quote: "born 20 May 1951"
  - text: 1982 erschien ihr Buch »The Warlock of Firetop Mountain«, das erste der Reihe Fighting Fantasy
    sources:
      - url: https://en.wikipedia.org/wiki/The_Warlock_of_Firetop_Mountain
        quote: "Originally published by Puffin Books in 1982, the title is the first gamebook in the Fighting Fantasy series. … written by Steve Jackson and Ian Livingstone, and illustrated by Russ Nicholson"
      - url: https://gamebooks.org/Edition/39
        quote: "August 27, 1982 (original)"
  - text: "Du bist der Held, würfelst deine Kämpfe aus"
    sources:
      - url: https://en.wikipedia.org/wiki/Fighting_Fantasy
        quote: "randomly assigning scores to three statistics (skill, stamina, and luck) … in conjunction with rolling six-sided dice, are used to resolve skill challenges and the combat sections"
      - url: https://en.wikipedia.org/wiki/The_Warlock_of_Firetop_Mountain
        quote: "a Fighting Fantasy gamebook in which YOU become the hero!"
  - text: springst zwischen 400 nummerierten Abschnitten hin und her
    sources:
      - url: https://gamebooks.org/Edition/39
        quote: "400 sections"
      - url: https://en.wikipedia.org/wiki/Fighting_Fantasy
        quote: "divided into a series of numbered sections (usually 400"
  - text: Die Bücher rieten, beim Lesen eine Karte zu zeichnen, Gang für Gang.
    note: >-
      Die Quelle ist die OCR-Fassung des Buchtextes auf archive.org (Abschnitt »Hints on Play«); ob
      dieser Scan rechtmäßig dort liegt, ist unklar, zum Zitieren aus dem Buch selbst aber
      ausreichend. Das Zitat belegt den Rat für dieses eine Buch, nicht für die ganze Reihe.
    sources:
      - url: https://dn720001.ca.archive.org/0/items/ff-1-warlock-of-firetop-mountain/FF1_Warlock_of_Firetop_Mountain_djvu.txt
        quote: "Make notes and draw a map as you explore — this map will be invaluable in Future adventures"
  - text: 1975 hatten die beiden mit einem Schulfreund Games Workshop gegründet
    sources:
      - url: https://en.wikipedia.org/wiki/John_Peake_(game_designer)
        quote: "In early 1975, John Peake and his school friends – Ian Livingstone and Steve Jackson"
      - url: https://en.wikipedia.org/wiki/Steve_Jackson_(British_game_designer)
        quote: "In early 1975, Jackson co-founded the company Games Workshop with school friends John Peake and Ian Livingstone."
  - text: die Firma, die heute Warhammer macht
    sources:
      - url: https://en.wikipedia.org/wiki/Games_Workshop
        quote: "Its best-known products are Warhammer and Warhammer 40,000."
  - text: Livingstone sah 1996 für die Spielefirma Eidos ein Studio an, das sie kaufen wollte, und dort zum ersten Mal Lara Croft auf einem Bildschirm
    sources:
      - url: https://www.nme.com/features/tomb-raider-at-25-ian-livingstone-talks-about-the-birth-of-lara-croft-3084441
        quote: "I remember driving up late on a snowy February [in 1996] … I went to Silicon Dreams first, and then drove on to Derby to meet Jeremy Heath-Smith, the managing director of Core Design. … I don't want to say cornily that it was love at first sight, but it was quite a big moment to see Lara Croft on screen at that point."
      - url: https://mg.co.za/friday/2006-02-23-ten-years-on-should-lara-be-entombed/
        quote: "We had the opportunity to buy the publisher Centregold. As part of the due diligence process, I had to go round their developers. The last game they showed me was Tomb Raider, with Lara in all her glory."
  - text: Jackson gehörte zu den Gründern von Lionhead, dem Studio hinter Fable.
    sources:
      - url: https://en.wikipedia.org/wiki/Lionhead_Studios
        quote: "founded in July 1997 by Peter Molyneux, Mark Webley, Tim Rance, and Steve Jackson."
      - url: https://en.wikipedia.org/wiki/Steve_Jackson_(British_game_designer)
        quote: "set up computer games developer Lionhead Studios with Peter Molyneux"
  - text: Und ein Bericht, den Livingstone 2011 mitschrieb, trug dazu bei, dass Schulen in England seit 2014 Informatik mit Programmieren unterrichten.
    sources:
      - url: https://www.nesta.org.uk/report/next-gen-next-steps/
        quote: "Led by Ian Livingstone and Alex Hope, this review served as a wake-up call. … influenced policy, rallied industry and galvanised educators … New ICT curriculum with computing at core promised by 2014."
      - url: https://en.wikipedia.org/wiki/Ian_Livingstone
        quote: "The 'NextGen' report, co-authored with Alex Hope of visual effects firm Double Negative, was released in 2011."
      - url: https://www.edweek.org/teaching-learning/british-students-required-to-learn-computer-coding/2014/09
        quote: "Under an updated curriculum that went into effect this week, primary and secondary students will now also learn to code."

blinn:
  - text: Jim Blinn (geboren 1949), amerikanischer Informatiker.
    sources:
      - url: https://en.wikipedia.org/wiki/Jim_Blinn
        quote: "James F. Blinn (born 1949) is an American computer scientist"
      - url: https://ethw.org/James_Blinn
        quote: "Blinn was born in Detroit to a family of art teachers in 1949."
  - text: Am Jet Propulsion Laboratory der NASA machte er die Animationen der Vorbeiflüge der Voyager-Sonden
    sources:
      - url: https://ethw.org/James_Blinn
        quote: "Blinn is best known for his work animating the flight of the Pioneer and Voyager spacecraft across Saturn"
      - url: https://en.wikipedia.org/wiki/Jim_Blinn
        quote: "Blinn was affiliated with the Jet Propulsion Laboratory at the California Institute of Technology until 1995. … NASA Exceptional Service medal for Voyager Fly-by animation."
  - text: und Bilder für Carl Sagans Fernsehserie Cosmos (1980)
    sources:
      - url: https://ethw.org/James_Blinn
        quote: "He also did animation for Carl Sagan's popular Cosmos documentary"
      - url: https://en.wikipedia.org/wiki/Jim_Blinn
        quote: "his work on the 1980 Carl Sagan documentary series"
  - text: "Um dort Atome zu zeigen, die sich zu Molekülen verbinden, erfand er Formen, die mit ihren Nachbarn verschmelzen: die Blobby Objects, heute Metaballs."
    sources:
      - url: https://en.wikipedia.org/wiki/Metaballs
        quote: "The technique for rendering metaballs was invented by Jim Blinn in the early 1980s to model atom interactions … for Carl Sagan's 1980 TV series Cosmos."
      - url: https://ethw.org/James_Blinn
        quote: "he developed methods for modeling surfaces called \"blobbies,\""
  - text: "Auch der Glanzpunkt auf deinen Tropfen kommt von ihm"
    none: Workspace
  - text: Die Richtung genau zwischen Licht und Auge ist seine Verbesserung des Phong-Modells von 1977.
    sources:
      - url: https://en.wikipedia.org/wiki/Blinn%E2%80%93Phong_reflection_model
        quote: "is a modification developed by Jim Blinn to the Phong reflection model in 1977. … If, instead, one calculates a halfway vector between the viewer and light-source vectors,"
  - text: "Und nach »Blinns Gesetz« dauert ein Bild immer gleich lange, egal wie schnell die Computer werden: Man rechnet einfach schönere Bilder."
    sources:
      - url: https://en.wikipedia.org/wiki/Jim_Blinn
        quote: "rendering time tends to remain constant, even as computers get faster"
      - url: https://pbr-book.org/4ed/Introduction/A_Brief_History_of_Physically_Based_Rendering
        quote: "This progression is neatly explained by Blinn’s law: “as technology advances, rendering time remains constant.”"

williams:
  - text: Lance Williams (1949–2017), amerikanischer Grafikforscher.
    sources:
      - url: https://en.wikipedia.org/wiki/Lance_Williams_(graphics_researcher)
        quote: "Lance J. Williams (September 25, 1949 – August 20, 2017"
      - url: https://www.price.utah.edu/2017/08/30/celebrated-u-computer-graphics-researcher-dies
        quote: "died Aug. 20 of cancer. … Williams, who was 67, was living in Los Angeles, according to his Facebook page."
  - text: Am New York Institute of Technology erfand er die Mipmaps
    sources:
      - url: https://en.wikipedia.org/wiki/Lance_Williams_(graphics_researcher)
        quote: "While at NYIT, Williams invented the mipmapping technique for texture filtering"
      - url: https://history.siggraph.org/?p=34412
        quote: "After working on 2D and 3D animation systems, Lance left Utah to join NYIT in 1974. … During that time many of his fundamental technical contributions appeared: mip mapping, shadow buffers,"
      - url: https://en.wikipedia.org/wiki/Mipmap
        quote: "Mipmapping was invented by Lance Williams in 1983 and is described in his paper Pyramidal parametrics."
  - text: 'jede Textur noch einmal in halber Größe, in Viertelgröße und so weiter, damit weit entfernte Wände nicht flimmern'
    sources:
      - url: https://learn.microsoft.com/en-us/windows/win32/direct3d9/texture-filtering-with-mipmaps
        quote: "A mipmap is a sequence of textures, each of which is a progressively lower resolution representation of the same image. The height and width of each image, or level, in the mipmap is a power of two smaller than the previous level."
      - url: https://en.wikipedia.org/wiki/Mipmap
        quote: "improve image quality by reducing aliasing and Moiré patterns that occur at large viewing distances"
  - text: Jede Grafikkarte rechnet heute so
    sources:
      - url: https://en.wikipedia.org/wiki/Lance_Williams_(graphics_researcher)
        quote: "which is ubiquitously used today by graphics hardware for PCs and video games"
      - url: https://learn.microsoft.com/en-us/windows/win32/direct3d9/texture-filtering-with-mipmaps
        quote: "After your application selects the mipmap texture set, it must assign values from the D3DTEXTUREFILTERTYPE enumerated type to the D3DSAMP_MIPFILTER sampler state. Direct3D then automatically performs mipmap texture filtering."
  - text: auch die Schatten mit einer Tiefenkarte, den Shadow Maps, hat er 1978 beschrieben
    sources:
      - url: https://en.wikipedia.org/wiki/Shadow_mapping
        quote: "This concept was introduced by Lance Williams in 1978, in a paper entitled \"Casting curved shadows on curved surfaces.\""
      - url: https://www.price.utah.edu/2017/08/30/celebrated-u-computer-graphics-researcher-dies
        quote: "he is best known for inventing texture mip-mapping (demonstrated in his picture above) … shadow mapping, and image-based rendering"
  - text: Auf diesem Foto ist er selbst in Stufen zu sehen, jede halb so groß wie die vorige.
    none: Workspace

stroustrup:
  - text: Bjarne Stroustrup (geboren 1950), dänischer Informatiker.
    sources:
      - url: https://www.stroustrup.com/bio.html
        quote: "Born in Aarhus Denmark 1950."
      - url: https://en.wikipedia.org/wiki/Bjarne_Stroustrup
        quote: "Danish computer scientist"
  - text: Für seine Doktorarbeit in Cambridge hatte er in der Sprache Simula mit Klassen programmiert, doch die Programme liefen zu langsam.
    sources:
      - url: https://www.stroustrup.com/hopl2.pdf
        quote: "I was working on my Ph.D. thesis in the Computing Laboratory of Cambridge University in England. … The initial version of this simulator was written in Simula … On top of that, the run-time performance was such that there was no hope of using the simulator to obtain real data."
  - text: Ab 1979 baute er deshalb bei den Bell Labs Klassen in C ein, erst »C with Classes«, ab 1983 C++.
    sources:
      - url: https://www.stroustrup.com/hopl2.pdf
        quote: "This work started in April of 1979 in the Computing Science Research Center of Bell Laboratories in Murray Hill, New Jersey … In October of 1979 I had a pre-processor, called Cpre, that added Simula-like classes to C running"
      - url: https://www.stroustrup.com/hopl2.pdf
        quote: "C++ evolved from an earlier version called C with Classes. The work and experience with C with Classes from 1979 to 1983 determined the shape of C++."
      - url: https://www.stroustrup.com/bs_faq.html
        quote: "The name C++ (pronounced \"see plus plus\") was coined by Rick Mascitti in the summer of 1983."
  - text: Das ++ ist der Operator, der in C eine Variable um eins erhöht, wie i++ in einer for-Schleife.
    sources:
      - url: https://www.stroustrup.com/bs_faq.html
        quote: "The name signifies the evolutionary nature of the changes from C; \"++\" is the C increment operator."
  - text: »C makes it easy to shoot yourself in the foot; C++ makes it harder, but when you do it blows your whole leg off.«
    sources:
      - url: https://www.stroustrup.com/quotes.html
        quote: "C makes it easy to shoot yourself in the foot; C++ makes it harder, but when you do it blows your whole leg off … Yes, I said something like that (in 1986 or so)."

kajiya:
  - text: Jim Kajiya (geboren 1951), amerikanischer Informatiker
    sources:
      - url: https://de.wikipedia.org/wiki/James_Kajiya
        quote: "James Thomas Kajiya (* 1951), auch Jim Kajiya, ist ein Pionier auf dem Gebiet der Computergrafik."
    note: >-
      Das Geburtsjahr 1951 steht nur in der deutschen Wikipedia; die englische Wikipedia, Microsoft Research und
      das SIGGRAPH-Archiv nennen keins.
  - text: von 1979 bis 1994 am Caltech, danach bei Microsoft Research
    sources:
      - url: https://www.microsoft.com/en-us/research/people/kajiya/
        quote: "Kajiya received his PhD from the University of Utah in 1979, was a professor at Caltech from 1979 through 1994. … Joining Microsoft Research as a senior researcher in 1994, Kajiya built and led the graphics group."
  - text: 1986 schrieb er in einer Gleichung auf, wie viel Licht von einem Punkt einer Fläche ausgeht
    sources:
      - url: https://www.cs.princeton.edu/courses/archive/fall14/cos526/papers/kajiya86.pdf
        quote: "THE RENDERING EQUATION James T. Kajiya California Institute of Technology … The equation states that the transport intensity of light from one surface point to another is simply the sum of the emitted light and the total light intensity which is scattered toward x from all other surface points."
      - url: https://en.wikipedia.org/wiki/Rendering_equation
        quote: "expresses the amount of light leaving a point on a surface as the sum of emitted light and reflected light"
  - text: was sie selbst leuchtet und was aus allen Richtungen auf sie fällt und weitergeworfen wird, die Rendering Equation
    sources:
      - url: https://www.cs.princeton.edu/courses/archive/fall14/cos526/papers/kajiya86.pdf
        quote: "simply the sum of the emitted light and the total light intensity which is scattered toward x from all other surface points"
  - text: Genau lösen kann sie kein Computer.
    sources:
      - url: https://www.cs.princeton.edu/courses/archive/fall14/cos526/papers/kajiya86.pdf
        quote: "The technique we present subsumes a wide variety of rendering algorithms and provides a unified context for viewing them as more or less accurate approximations to the solution of a single equation."
      - url: https://en.wikipedia.org/wiki/Rendering_equation
        quote: "Solving the rendering equation for any given scene is the primary challenge in realistic rendering."
  - text: Kajiya kam ihr mit dem Zufall nahe, mit einem einzigen Strahl von Fläche zu Fläche statt eines ganzen Baums von Strahlen, und nannte das Path Tracing
    sources:
      - url: https://www.cs.princeton.edu/courses/archive/fall14/cos526/papers/kajiya86.pdf
        quote: "Rather than shooting a branching tree, just shoot a path with the rays chosen probabilistically. … However, for this new fast form of ray tracing—called path tracing—we have found that it is very important to maintain the correct proportion of reflection, refraction, and shadow ray types"
      - url: https://en.wikipedia.org/wiki/Path_tracing
        quote: "this paper also introduced and named the method called \"path tracing\""
  - text: "Das macht bounce in deinem Raytracer."
    none: Workspace
  - text: 1989 zeigten er und Timothy Kay, wie man Fell rechnet, ein Problem, an dem die Computergrafik lange festhing.
    sources:
      - url: https://history.siggraph.org/learning/rendering-fur-with-three-dimensional-textures-by-kajiya-and-kay
        quote: "We present a method for rendering scenes with fine detail via an object called a texel, … This technique solves a long outstanding problem in image synthesis: the rendering of furry surfaces."
  - text: Kay baute damit in seiner Doktorarbeit bei Kajiya einen Teddybären.
    sources:
      - url: https://thesis.caltech.edu/3028/
        quote: "From geometry to texture : experiments towards realism in computer graphics … Kay, Timothy L. … Kajiya, James Thomas … This thesis presents a solution to the problem of creating fur. … As an example, a Teddy bear is modeled and rendered."

perlin:
  - text: Informatiker in New York
    sources:
      - url: https://en.wikipedia.org/wiki/Ken_Perlin
        quote: "professor in the Department of Computer Science at New York University"
      - url: https://artport.whitney.org/v2/gatepages/january04.shtml
        quote: "Ken lives in Manhattan, where he is on the faculty of the Courant Institute of New York University."
  - text: Nach den Computerbildern für den Film Tron (1982) störte ihn, wie glatt und sauber Oberflächen aus dem Computer aussahen
    note: >-
      Perlin hat an den Computerbildern für Tron selbst mitgearbeitet (bei MAGI); die Box sagt das
      nicht, ist aber nicht falsch.
    sources:
      - url: https://en.wikipedia.org/wiki/Perlin_noise
        quote: "his problems with the \"machine-like\" look of computer-generated imagery … He developed it after working on Disney's computer animated sci-fi motion picture Tron (1982)"
      - url: https://cdm.link/bespoke-visual-noise-is-the-next-domain-for-robert-henke-so-lets-revisit-perlin-anyway/
        quote: "Working on TRON was a blast, but on some level I was frustrated by the fact that everything looked machine-like."
      - url: https://cs.nyu.edu/~perlin/doc/bio.html
        quote: "Prior to that he was the System Architect for computer generated animation at MAGI, where he worked on TRON."
  - text: er erfand das Rauschen, das seinen Namen trägt
    sources:
      - url: https://en.wikipedia.org/wiki/Perlin_noise
        quote: "developed Perlin noise in 1983"
      - url: https://cdm.link/bespoke-visual-noise-is-the-next-domain-for-robert-henke-so-lets-revisit-perlin-anyway/
        quote: "I ended up developing a simple pseudo-random 'noise' function that fills all of three-dimensional space."
  - text: Dafür bekam er 1997 einen Oscar für technische Leistungen.
    note: >-
      Die englische Wikipedia-Seite über Perlin schreibt »In 1996«; gemeint ist wohl das Preisjahr 1996,
      verliehen 1997. Perlin selbst und die Seite über Perlin-Rauschen nennen 1997.
    sources:
      - url: https://mrl.cs.nyu.edu/~perlin/doc/oscar.html
        quote: "In 1997 I received a Technical Achievement Award from the Academy of Motion Picture Arts and Sciences … To Ken Perlin for the development of Perlin Noise, a technique used to produce natural appearing textures"
      - url: https://en.wikipedia.org/wiki/Perlin_noise
        quote: "In 1997, Perlin was awarded an Academy Award for Technical Achievement for creating the algorithm"
  - text: Wolken, Feuer und ganze Landschaften
    sources:
      - url: https://mrl.cs.nyu.edu/~perlin/doc/oscar.html
        quote: "Used to create realistic visual textures of: marble, water waves, fire, clouds, oil films."
      - url: https://en.wikipedia.org/wiki/Perlin_noise
        quote: "It is also frequently used in video games to make procedurally generated terrain that looks natural."
  - text: in Spielen wie Minecraft entstehen aus Perlin-Rauschen und seinen Verwandten
    sources:
      - url: https://minecraft.wiki/w/Noise_generator
        quote: "There are/were noise generators that use Perlin Noise and Simplex Noise. … This noise generator, which uses Perlin noise, is one which is actually used as a heightmap. … The Multi Noise Biome Source (used for the Nether and the Overworld since 1.18) also uses perlin noise."

crockford:
  - text: "Douglas Crockford (geboren 1955), amerikanischer Programmierer."
    note: >-
      Das Geburtsjahr 1955 steht nur in schwachen Quellen: Wikidata (dort aus der englischen
      Wikipedia übernommen, die das Jahr inzwischen nicht mehr nennt) und, nur in Suchergebnissen
      gesehen, Autorenprofile (bookrastinating.com, bookwyrm), die sich
      beim Tag widersprechen (18. November bzw. 8. Mai 1955). Eine Normdatei (LoC, GND) war nicht
      abrufbar. »Amerikanischer Programmierer« belegt die Wikidata-Beschreibung.
    sources:
      - url: https://www.wikidata.org/wiki/Q3037998
        quote: "American computer programmer … date of birth 1955"
  - text: "Die Einstellungen von VS Code im Workspace stehen in einer Datei settings.json, in JSON."
    none: Workspace
  - text: "Erfunden habe er JSON nicht, sagt er, sondern entdeckt"
    sources:
      - url: https://nofluffjuststuff.com/blog/douglas_crockford/2008/01/the_discovery_of_json
        quote: "I do not claim to have invented JSON. I claim only that I discovered it."
      - url: https://mamund.site44.com/rwcbook/the-json-saga/index.html
        quote: "I do not claim to have invented JSON because it already existed in nature. … I discovered JSON."
  - text: "Es steckte schon in JavaScript."
    sources:
      - url: https://mamund.site44.com/rwcbook/the-json-saga/index.html
        quote: "Obviously, JavaScript was a huge influence, because JSON is JavaScript."
      - url: https://nofluffjuststuff.com/blog/douglas_crockford/2008/01/the_discovery_of_json
        quote: "The earliest claim that I am aware of for the use of JavaScript literals for data transport was Slava Galperin"
  - text: "2001 gab er dem Format seinen Namen, Ende 2002 schrieb er es auf json.org auf."
    note: "Korrigiert; vorher: »Um 2001 gab er dem Format seinen Namen und schrieb es auf json.org auf.«"
    sources:
      - url: https://nofluffjuststuff.com/blog/douglas_crockford/2008/01/the_discovery_of_json
        quote: "I made my discovery in the spring of 2001. … I identified it, gave it a name, and showed how it was useful."
      - url: https://mamund.site44.com/rwcbook/the-json-saga/index.html
        quote: "What I did was I found it, I named it, I described how it was useful. … So I bought JSON.org. … This was very late in 2002."
      - url: https://en.wikipedia.org/wiki/Douglas_Crockford
        quote: "Crockford obtained the domain name json.org in 2002, and put up their description of the format there."
      - url: https://en.wikipedia.org/wiki/JSON
        quote: "The JSON.org website was launched in 2001."
  - text: "Seine eigene Lizenz für ein Programm zu JSON enthält den Satz »The Software shall be used for Good, not Evil.«"
    sources:
      - url: https://www.json.org/license.html
        quote: "The JSON License … Copyright (c) 2002 JSON.org … The Software shall be used for Good, not Evil."
      - url: https://en.wikipedia.org/wiki/Douglas_Crockford
        quote: "The Software shall be used for Good, not Evil"

gosling:
  - text: James Gosling (geboren 1955), kanadischer Informatiker
    sources:
      - url: https://en.wikipedia.org/wiki/James_Gosling
        quote: "James Arthur Gosling (born 19 May 1955) … Canadian computer scientist"
  - text: entwarf Java ab 1991 bei der Firma Sun Microsystems
    sources:
      - url: https://en.wikipedia.org/wiki/Java_(programming_language)#History
        quote: "James Gosling, Mike Sheridan, and Patrick Naughton initiated the Java language project in June 1991."
      - url: https://ibiblio.org/java/slides/hope/01.html
        quote: "The Oak language (now Java) grew out of Gosling's frustration with C++ on his \"Imagination\" project."
  - text: schrieb den ersten Compiler und die erste virtuelle Maschine, die Java-Programme ausführt
    sources:
      - url: https://en.wikipedia.org/wiki/James_Gosling
        quote: "He created the original design of Java and implemented the language's original compiler and virtual machine."
  - text: Minecraft ist in Java geschrieben, die Java Edition läuft bis heute damit.
    sources:
      - url: https://en.wikipedia.org/wiki/Minecraft
        quote: "Originally created by Markus \"Notch\" Persson using the Java programming language … Bedrock is updated concurrently with Mojang's original Java Edition, although with numerous, generally small, differences."
      - url: https://minecraft.wiki/w/Java_Edition
        quote: "Minecraft: Java Edition is the original version of Minecraft, developed by Mojang Studios for Windows, macOS, and Linux."
  - text: Zuerst hieß die Sprache Oak, nach einer Eiche vor seinem Büro.
    note: >-
      Belegt ist, dass Gosling es so erzählt; Elliotte Rusty Harold merkt an, dass frühe Papiere von Sun
      Oak als »Object Architecture Kernel« bezeichnen. Für die Box kein Problem.
    sources:
      - url: https://en.wikipedia.org/wiki/Java_(programming_language)#History
        quote: "The language was initially called Oak after an oak tree that stood outside Gosling's office."
      - url: https://ibiblio.org/java/slides/hope/01.html
        quote: "Gosling claims that he named Oak when he looked out his window and saw a tree. However early Sun papers refer to Oak as the \"Object Architecture Kernel.\""
  - text: Später bekam sie den Namen einer Kaffeesorte von der indonesischen Insel Java
    sources:
      - url: https://en.wikipedia.org/wiki/Java_(programming_language)#History
        quote: "Later the project went by the name Green and was finally renamed Java, from Java coffee, a type of coffee from Indonesia."
      - url: https://www.infoworld.com/article/2077265/so-why-did-they-decide-to-call-it-java.html
        quote: "The lawyers had told us that we couldn't use the name 'OAK' … decided upon a coffee metaphor for their trademark."
  - text: deshalb ist ihr Logo eine dampfende Tasse
    sources:
      - url: https://1000logos.net/java-logo/
        quote: "Created right after the release of the language, the Java logo depicted a blue coffee cup with red steam above it."

berners-lee:
  - text: Tim Berners-Lee (geboren 1955), britischer Physiker und Informatiker.
    sources:
      - url: https://en.wikipedia.org/wiki/Tim_Berners-Lee
        quote: "Sir Timothy John Berners-Lee (born 8 June 1955) … an English computer scientist best known as the inventor of the World Wide Web. … In 1976, Berners-Lee took a first in physics from The Queen's College, Oxford."
      - url: https://home.cern/science/computing/the-birth-of-the-web/
        quote: "Tim Berners-Lee, a British scientist, invented the World Wide Web (WWW) in 1989, while working at CERN."
  - text: Jede Webseite, die du im Browser öffnest, kommt über das World Wide Web
    none: Workspace
  - text: Das schlug er 1989 am Forschungszentrum CERN bei Genf vor
    sources:
      - url: https://web30.web.cern.ch/web-history.html
        quote: "In March 1989, Sir Tim Berners-Lee, while working at CERN, wrote a proposal to develop a distributed information system."
      - url: https://www.w3.org/History/1989/proposal.html
        quote: "Information Management: A Proposal … Tim Berners-Lee, CERN … March 1989, May 1990"
  - text: damit Forschende ihre Dokumente miteinander verknüpfen können
    sources:
      - url: https://home.cern/science/computing/the-birth-of-the-web/
        quote: "to meet the demand for automated information-sharing between scientists"
      - url: https://www.w3.org/History/1989/proposal.html
        quote: "This proposal concerns the management of general information about accelerators and experiments at CERN."
  - text: Bis Ende 1990 schrieb er HTML, HTTP, den ersten Webserver und den ersten Browser.
    sources:
      - url: https://web30.web.cern.ch/web-history.html
        quote: "By Christmas 1990, Sir Berners-Lee had defined the Web’s basic concepts, the html, http and URL … he had written the first browser/editor and server software."
      - url: https://www.w3.org/People/Berners-Lee/
        quote: "He wrote the first web client and server in 1990."
  - text: Er ließ das Web nicht patentieren
    sources:
      - url: https://en.wikipedia.org/wiki/Tim_Berners-Lee
        quote: "Berners-Lee made his idea available freely, with no patent and no royalties due."
      - url: https://www.w3.org/People/Berners-Lee/FAQ.html
        quote: "The decision to make the Web an open system was necessary for it to be universal."
  - text: 1993 gab das CERN es für alle frei
    sources:
      - url: https://home.cern/science/computing/the-birth-of-the-web/
        quote: "On 30 April 1993, CERN put the World Wide Web software in the public domain."

van-rossum:
  - text: Guido van Rossum (geboren 1956), niederländischer Programmierer.
    sources:
      - url: https://en.wikipedia.org/wiki/Guido_van_Rossum
        quote: "born 31 January 1956 … is a Dutch programmer"
  - text: Im Dezember 1989 suchte er ein Hobbyprojekt für die Woche um Weihnachten, wenn sein Büro am Forschungsinstitut CWI in Amsterdam geschlossen war, und begann Python
    sources:
      - url: https://www.python.org/doc/essays/foreword/
        quote: "Over six years ago, in December 1989, I was looking for a \"hobby\" programming project … that would keep me occupied during the week around Christmas. My office (a government-run research lab in Amsterdam) would be closed,"
      - url: https://en.wikipedia.org/wiki/Guido_van_Rossum
        quote: "While working at the Centrum Wiskunde & Informatica (CWI)"
  - text: 1991 erschien die erste Fassung
    sources:
      - url: https://python-history.blogspot.com/2009/01/brief-timeline-of-python.html
        quote: "0.9.0 (released to alt.sources)"
      - url: https://docs.python.org/3/faq/general.html
        quote: "In February 1991, after just over a year of development, I decided to post to USENET."
  - text: Dass in Python die Einrückung bestimmt, welche Zeilen zu einer Schleife gehören, übernahm er aus der Sprache ABC, an der er vorher mitgearbeitet hatte.
    sources:
      - url: https://www.python.org/doc/essays/foreword/
        quote: "Perhaps Python's most controversial feature is its use of indentation for statement grouping, … which derives directly from ABC. … It all started with ABC, a wonderful teaching language that I had helped create in the early eighties."
      - url: https://python-history.blogspot.com/2009/01/personal-history-part-1-cwi.html
        quote: "I started working at CWI in late 1982, fresh out of university, as a programmer in the ABC group"
  - text: Den Namen hat Python nicht von der Schlange, sondern von der britischen Comedy-Truppe Monty Python.
    sources:
      - url: https://docs.python.org/3/faq/general.html
        quote: "When he began implementing Python, Guido van Rossum was also reading the published scripts from “Monty Python’s Flying Circus”, a BBC comedy series from the 1970s."
      - url: https://www.python.org/doc/essays/foreword/
        quote: "I chose Python as a working title for the project, being in a slightly irreverent mood … (and a big fan of Monty Python's Flying Circus)."
  - text: Bis 2018 entschied er als »Benevolent Dictator For Life«, wohlwollender Diktator auf Lebenszeit, über jede Änderung an der Sprache.
    sources:
      - url: https://en.wikipedia.org/wiki/Guido_van_Rossum
        quote: "On 12 July 2018, Van Rossum announced that he would be stepping down"
      - url: https://mail.python.org/pipermail/python-committers/2018-July/005664.html
        quote: "Now that PEP 572 is done, I don't ever want to have to fight so hard for a PEP … I would like to remove myself entirely from the decision process."

griesemer-pike:
  - text: Robert Griesemer (geboren 1964), Schweizer Informatiker
    sources:
      - url: https://en.wikipedia.org/wiki/Robert_Griesemer
        quote: "Robert Griesemer (born 1964) is a Swiss computer scientist."
  - text: Rob Pike (geboren 1956), kanadischer Programmierer
    sources:
      - url: https://en.wikipedia.org/wiki/Rob_Pike
        quote: "Robert Pike (born 1956) is a Canadian programmer and author."
  - text: erfanden 2007 bei Google mit Ken Thompson die Sprache Go
    sources:
      - url: https://go.dev/doc/faq
        quote: "Robert Griesemer, Rob Pike and Ken Thompson started sketching the goals for a new language on the white board on September 21, 2007."
      - url: https://commandcenter.blogspot.com/2012/06/less-is-exponentially-more.html
        quote: "Back around September 2007, I was doing some minor but central work on an enormous Google C++ program"
  - text: 'Pike ärgerte sich damals über C++-Programme, deren Übersetzen 45 Minuten dauerte: Go sollte so schnell übersetzen, dass man darauf nicht warten muss.'
    sources:
      - url: https://commandcenter.blogspot.com/2012/06/less-is-exponentially-more.html
        quote: "my compilations were taking about 45 minutes on our huge distributed compile cluster. … I started another compilation, turned my chair around to face Robert, and started asking pointed questions. … Before the compilation was done, we'd roped Ken in and had decided to do something."
      - url: https://go.dev/doc/faq
        quote: "Finally, working with Go is intended to be fast: it should take at most a few seconds to build a large executable on a single computer."
  - text: Auch Docker, mit dem dein Workspace in einem Container läuft, ist in Go geschrieben.
    sources:
      - url: https://docs.docker.com/get-started/docker-overview/
        quote: "Docker is written in the Go programming language"
  - text: mit dem dein Workspace in einem Container läuft
    none: Workspace
  - text: Griesemer hatte an der ETH Zürich bei Niklaus Wirth promoviert
    note: >-
      Laut Wikipedia betreuten ihn Hanspeter Mössenböck und Niklaus Wirth; nach dem
      Titelblatt der Dissertation (Diss. ETH Nr. 10277, 1993, laut Suchergebnis, selbst nicht
      gelesen) war Mössenböck Referent und Wirth Korreferent. »bei Niklaus Wirth« ist also
      nicht falsch, aber nicht die ganze Wahrheit; bitte am PDF der ETH prüfen:
      https://www.research-collection.ethz.ch/bitstream/handle/20.500.11850/141363/eth-39157-01.pdf
    sources:
      - url: https://en.wikipedia.org/wiki/Robert_Griesemer
        quote: "where he did his doctorate under the supervision of Hanspeter Mössenböck and Niklaus Wirth"
  - text: dem Erfinder von Pascal
    sources:
      - url: https://en.wikipedia.org/wiki/Niklaus_Wirth
        quote: "He designed a series of programming languages, among them Pascal, Modula-2 and Oberon."
  - text: Pike war 1992 dabei, als Ken Thompson UTF-8 auf ein Tischset in einem Diner zeichnete.
    sources:
      - url: https://www.cl.cam.ac.uk/~mgk25/ucs/utf-8-history.txt
        quote: "UTF-8 was designed, in front of my eyes, on a placemat in a New Jersey diner one night in September or so 1992."
      - url: https://www.cl.cam.ac.uk/~mgk25/ucs/utf-8-history.txt
        quote: "I very clearly remember Ken writing on the placemat and wished we had kept it!"
  - text: Den Gopher, das Maskottchen von Go, hat Pikes Frau Renée French gezeichnet.
    sources:
      - url: https://go.dev/doc/faq
        quote: "The mascot and logo were designed by Renée French, who also designed Glenda, the Plan 9 bunny."
      - url: https://go.dev/blog/gopher
        quote: "The gopher therefore exists in many forms, but has always been Renee’s creation."
      - url: https://en.wikipedia.org/wiki/Rob_Pike
        quote: "Pike is married to author and illustrator Renée French; the couple live both in the US and Australia."

abrash:
  - text: Michael Abrash (geboren 1957), amerikanischer Programmierer.
    sources:
      - url: https://en.wikipedia.org/wiki/Michael_Abrash
        quote: "Michael Abrash is an American programmer and technical writer. … Born 1957 (age 68–69)"
    note: >-
      Das Geburtsjahr 1957 steht nur in der Infobox des Wikipedia-Artikels; eine zweite Quelle
      dafür habe ich nicht gefunden.
  - text: Seine Bücher über schnellen Code wie Zen of Code Optimization lasen in den 1990er Jahren alle, die Spiele programmierten.
    sources:
      - url: https://en.wikipedia.org/wiki/Michael_Abrash
        quote: "multiple books on code optimization"
      - url: https://raw.githubusercontent.com/jagregory/abrash-black-book/master/src/intro.md
        quote: "over the past ten years I've run into a lot of people who have found my writings useful"
    note: >-
      Zen of Code Optimization erschien 1994 (Wikipedia). Für »alle, die Spiele programmierten«
      habe ich keine Quelle gefunden, nur Abrashs eigene Aussage, viele hätten seine Texte
      nützlich gefunden; ein Satz von Carmack (»learned a lot from Michael's early articles«)
      steht nur als Amazon-Rezension zitiert auf doomwiki.org (dort 403), nicht geprüft.
      Als Übertreibung im Ton der Box vertretbar.
  - text: 1995 holte John Carmack ihn zu id Software
    sources:
      - url: https://github.com/jagregory/abrash-black-book/blob/master/src/chapter-64.md
        quote: "When I arrived at id at the beginning of March 1995, John already had an engine prototyped and a plan in mind."
      - url: https://www.meta.com/blog/introducing-michael-abrash-oculus-chief-scientist/
        quote: "in the course of which he asked if I'd like to come work at Id"
  - text: zusammen brachten sie Quake (1996) auf PCs ohne 3D-Grafikkarte zum Laufen
    sources:
      - url: https://github.com/jagregory/abrash-black-book/blob/master/src/chapter-70.md
        quote: "Since shipping Quake in the summer of 1996 … was appropriate technology for the degree of complexity possible in a Pentium-based game … VQuake is very similar to software Quake"
      - url: https://en.wikipedia.org/wiki/Quake_(video_game)
        quote: "Quake was programmed by John Carmack, Michael Abrash, and John Cash. … On January 22, 1997, id Software released the first beta of GLQuake."
  - text: Die Wände zeichnet es sortiert, jedes Pixel nur einmal
    sources:
      - url: https://github.com/jagregory/abrash-black-book/blob/master/src/chapter-70.md
        quote: "Taken together, these spans cover every pixel on the screen once and only once, resulting in zero overdraw; … surfaces that are completely hidden by nearer surfaces generate no spans at all."
  - text: und schreibt dabei ihre Entfernung in einen Tiefenpuffer, an dem sich danach Monster und Waffen messen
    sources:
      - url: https://github.com/jagregory/abrash-black-book/blob/master/src/chapter-70.md
        quote: "After all the spans in the world are drawn, the z-buffer is filled in for those spans. … This is a write-only operation, and involves no comparisons or overdraw … Then polygon models are drawn with z-buffering; this involves a z-compare at each polygon-model pixel"
  - text: Bill Gates selbst versuchte, ihn bei Microsoft zu halten.
    sources:
      - url: https://kotaku.com/that-time-bill-gates-starred-in-a-doom-promo-video-1776965033
        quote: "when Carmack asked him to come work for id, Abrash said he'd have to give it some thought … Days later, he got an e-mail from his boss, Bill Gates. … Abrash chose Carmack over Gates."
    note: >-
      Kotaku gibt als Quelle David Kushners Buch Masters of Doom an (Blockzitat daraus).
  - text: Wie Quake das alles macht, erklärt Abrash in seinem Graphics Programming Black Book, das er 2001 frei ins Netz stellte.
    sources:
      - url: https://ubmchannelnews.mediaroom.com/index.php?item=85503
        quote: "Mar 22, 2001 … Dr. Dobb's Journal magazine and Michael Abrash have re-released … freely available for download … behind-the-scenes looks at the technology behind the Doom and Quake 3D games by id Software"
  - text: Ab 2014 forschte er als Chefwissenschaftler von Oculus an VR-Brillen.
    sources:
      - url: https://www.meta.com/blog/introducing-michael-abrash-oculus-chief-scientist/
        quote: "Introducing Michael Abrash, Oculus Chief Scientist … I'm tremendously excited to join Oculus, and when I think back, it's astonishing how unlikely the path to this moment is."
      - url: https://en.wikipedia.org/wiki/Michael_Abrash
        quote: "joined their company as Chief Scientist"

hara:
  - text: Masahiro Hara (geboren 1957)
    sources:
      - url: https://www.japan-acad.go.jp/japanese/news/2023/031301.html
        quote: "原昌宏 … 昭和32年（65歳）"
      - url: https://en.wikipedia.org/wiki/Masahiro_Hara
        quote: "Hara was born in Tokyo in 1957."
  - text: japanischer Ingenieur bei Denso, einem Zulieferer von Toyota
    sources:
      - url: https://en.wikipedia.org/wiki/Masahiro_Hara
        quote: "After graduating from Hosei University, Hara worked at Denso, a Toyota Group subsidiary, where he began developing a barcode system."
      - url: https://www.japan-acad.go.jp/japanese/news/2023/031301.html
        quote: "（株）デンソーウェーブ主席技師"
  - text: Mit nur einem Kollegen entwickelte er den QR-Code, den seine Firma 1994 vorstellte.
    sources:
      - url: https://www.qrcode.com/en/history/
        quote: "Masahiro Hara in charge of the development of the QR Code … He dared to try this with only one other person as his team member. … In 1994, DENSO WAVE (then a division of DENSO CORPORATION) announced the release of its QR Code."
  - text: Autofabriken verwalteten damit ihre Teile, von der Herstellung bis zum Versand.
    sources:
      - url: https://www.qrcode.com/en/history/
        quote: "the QR Code was adopted by the auto industry for use in their electronic Kanban*, and it contributed greatly to making their management work efficient for a wide range of tasks from production to shipping to the issuing of transaction slips."
      - url: https://en.wikipedia.org/wiki/Masahiro_Hara
        quote: "he was tasked with creating a new 2D code to efficiently track automotive components."
  - text: "Für die Suchmuster in den Ecken suchte das Team in Drucksachen nach dem Verhältnis von hell und dunkel, das dort am seltensten vorkommt: 1 : 1 : 3 : 1 : 1."
    sources:
      - url: https://www.qrcode.com/en/history/
        quote: "Eventually, they came up with the least used ratio of black and white areas on printed matter. This ratio was 1:1:3:1:1."
  - text: "Seine Firma hält Patente auf den QR-Code, hat aber erklärt, sie nicht durchzusetzen: Jeder darf QR-Codes erzeugen und lesen, ohne zu fragen."
    sources:
      - url: https://www.qrcode.com/en/history/
        quote: "Although DENSO WAVE would retain the patent rights to the QR Code, it declared that it would not exercise them."
  - text: Nur der Name »QR Code« ist eine eingetragene Marke der Denso Wave Incorporated.
    sources:
      - url: https://www.qrcode.com/en/faq.html
        quote: "The word “QR Code” is registered trademark of DENSO WAVE INCORPORATED in Japan and other countries. … This registered trademark applies only for the word “QR Code”, and not for the QR Code pattern (image)."

muuss:
  - text: Mike Muuss (1958–2000), amerikanischer Informatiker am Ballistic Research Laboratory der US-Armee.
    sources:
      - url: https://en.wikipedia.org/wiki/Mike_Muuss
        quote: "October 16, 1958 … November 20, 2000 … while working at the Ballistic Research Laboratory"
      - url: https://ftp.arl.army.mil/~mike/ping.html
        quote: "In December of 1983 I encountered some odd behavior of the IP network at BRL."
  - text: Du prüfst mit ping, ob ein Rechner antwortet?
    none: Workspace
  - text: Das Programm schrieb er im Dezember 1983 an einem Abend, weil sich das Netz in seinem Labor seltsam verhielt.
    sources:
      - url: https://ftp.arl.army.mil/~mike/ping.html
        quote: "I'm the author of ping for UNIX … Ping is a little thousand-line hack that I wrote in an evening which practically everyone seems to know about. … In December of 1983 I encountered some odd behavior of the IP network at BRL."
  - text: Den Namen hat es vom Geräusch eines Sonars, das am Echo misst, wie weit etwas entfernt ist.
    sources:
      - url: https://ftp.arl.army.mil/~mike/ping.html
        quote: "I named it after the sound that a sonar makes, inspired by the whole principle of echo-location."
  - text: Er schrieb auch BRL-CAD, ein Programm für 3D-Modelle
    sources:
      - url: https://ftp.arl.army.mil/~mike/
        quote: "I'm the architect of BRL-CAD, a substantial third-generation CSG solid modeling system available free of charge"
      - url: https://en.wikipedia.org/wiki/BRL-CAD
        quote: "BRL software developers – led by Mike Muuss – began assembling a suite of utilities"
  - text: "eines der ersten Programme, die Bilder interaktiv mit Raytracing berechneten"
    note: "Korrigiert; vorher: »das erste Programm, das Bilder interaktiv mit Raytracing berechnete«"
    sources:
      - url: https://en.wikipedia.org/wiki/Mike_Muuss
        quote: "as well as the first interactive ray tracing program"
      - url: https://en.wikipedia.org/wiki/Ray_tracing_(graphics)
        quote: "The first implementation of an interactive ray tracer was the LINKS-1 Computer Graphics System built in 1982 at Osaka University's School of Engineering … The next interactive ray tracer, and the first known to have been labeled \"real-time\" was credited at the 2005 SIGGRAPH computer graphics conference as being the REMRT/RT tools developed in 1986 by Mike Muuss for the BRL-CAD solid modeling system."

fox:
  - text: Brian Fox (geboren 1959), amerikanischer Programmierer.
    sources:
      - url: https://en.wikipedia.org/wiki/Brian_Fox_(programmer)
        quote: "Brian Jhan Fox (born 1959) is an American computer programmer and free software advocate."
  - text: Die Shell, die im Terminal deine Befehle liest, ist Bash
    none: Workspace
  - text: Er schrieb sie für das GNU-Projekt von Richard Stallman als freien Ersatz für die alte Bourne Shell
    sources:
      - url: https://en.wikipedia.org/wiki/Bash_(Unix_shell)
        quote: "created in 1989 by Brian Fox for the GNU Project … it is designed as a completely free software alternative for the Bourne shell"
      - url: https://tiswww.case.edu/php/chet/bash/FAQ
        quote: "Bash was originally written by Brian Fox of the Free Software Foundation."
      - url: https://en.wikipedia.org/wiki/Brian_Fox_(programmer)
        quote: "In 1985, Fox worked with Richard Stallman at Stallman's newly created Free Software Foundation (FSF)."
  - text: stellte sie im Juni 1989 vor
    sources:
      - url: https://en.wikipedia.org/wiki/Brian_Fox_(programmer)
        quote: "He is the original author of the GNU Bash shell, which he announced as a beta in June 1989."
      - url: https://openwall.com/lists/oss-security/2014/10/04/3
        quote: "This was announced as a beta, and we've been unable to find any mention of any earlier version."
  - text: Dass Tab Dateinamen ergänzt und ↑ frühere Befehle zurückholt, erledigt Readline
    sources:
      - url: https://man7.org/linux/man-pages/man3/readline.3.html
        quote: "Attempt to perform completion on the text before point. … Fetch the previous command from the history list, moving back in the list."
      - url: https://tiswww.case.edu/php/chet/readline/rltop.html
        quote: "The GNU Readline library provides a set of functions for use by applications that allow users to edit command lines"
  - text: eine Bibliothek, die er ebenfalls geschrieben hat
    sources:
      - url: https://man7.org/linux/man-pages/man3/readline.3.html
        quote: "Brian Fox, Free Software Foundation … Chet Ramey, Case Western Reserve University"
      - url: https://en.wikipedia.org/wiki/Brian_Fox_(programmer)
        quote: "At the FSF, Fox authored GNU Bash, GNU Makeinfo, GNU Info, GNU Finger, GNU Echo and the readline and history libraries."
  - text: 'Der Name ist ein Wortspiel: Die alte Shell hatte Stephen Bourne geschrieben, die neue heißt Bourne-Again Shell, gesprochen wie born again, »wiedergeboren«.'
    sources:
      - url: https://ftp.gnu.org/old-gnu/Manuals/bash-2.05a/html_node/bashref_2.html
        quote: "The name is an acronym for the `Bourne-Again SHell', a pun on Stephen Bourne,"

hejlsberg:
  - text: "Anders Hejlsberg (geboren 1960), dänischer Softwareentwickler."
    sources:
      - url: https://en.wikipedia.org/wiki/Anders_Hejlsberg
        quote: "born 2 December 1960 … Hejlsberg was born in Copenhagen, Denmark, and studied Electrical Engineering at the Technical University of Denmark."
  - text: "Bei Microsoft entwarf er C#, das 2000 erschien"
    sources:
      - url: https://en.wikipedia.org/wiki/C_Sharp_(programming_language)
        quote: "Designed by Anders Hejlsberg (Microsoft) … First appeared July 2000 … It was first widely distributed in July 2000"
      - url: https://en.wikipedia.org/wiki/Anders_Hejlsberg
        quote: "Since 2000, he has been the lead architect of the team developing the C# language."
  - text: "2012 stellte er TypeScript vor, JavaScript mit Typen"
    sources:
      - url: https://en.wikipedia.org/wiki/Anders_Hejlsberg
        quote: "In 2012 Hejlsberg announced a new Microsoft project, TypeScript, a superset of JavaScript."
      - url: https://en.wikipedia.org/wiki/TypeScript
        quote: "TypeScript (TS) is a high-level programming language that adds static typing with optional type annotations to JavaScript. … TypeScript was released to the public in October 2012"
  - text: "in dem du im Workspace schreibst"
    none: Workspace
  - text: "ist in TypeScript geschrieben"
    sources:
      - url: https://api.github.com/repos/microsoft/vscode/languages
        quote: "{\"TypeScript\":214079566,\"CSS\":3224884,\"Rust\":1333139,\"JavaScript\":1116151, …"
      - url: https://en.wikipedia.org/wiki/Visual_Studio_Code
        quote: "C++, TypeScript, JavaScript, HTML, CSS"
  - text: "Als Student schrieb er einen Pascal-Compiler für den Heimcomputer Nascom."
    sources:
      - url: https://en.wikipedia.org/wiki/Anders_Hejlsberg
        quote: "While at the university in 1980, he began writing programs for the Nascom microcomputer, including a Pascal compiler … which was initially marketed as the Blue Label Software Pascal for the Nascom-2."
      - url: https://www.welcometothejungle.com/en/articles/anders-hejlsberg-microsoft-career
        quote: "I ended up writing a subset of Pascal with a little on-screen editor and a little runtime package."
  - text: "Die Firma Borland verkaufte ihn ab 1983 als Turbo Pascal"
    sources:
      - url: https://en.wikipedia.org/wiki/Turbo_Pascal
        quote: "released on 20 November 1983 … was based on the Blue Label Pascal compiler originally produced for the NasSys cassette-based operating system"
      - url: https://www.welcometothejungle.com/en/articles/anders-hejlsberg-microsoft-career
        quote: "We ended up actually doing a royalty contract and that’s how Borland ended up producing Turbo Pascal."
  - text: "für 49,95 Dollar"
    note: "Korrigiert; vorher: »für 49,99 Dollar«"
    sources:
      - url: https://www.welcometothejungle.com/en/articles/anders-hejlsberg-microsoft-career
        quote: "We lowered the price to just $49.95."
      - url: https://en.wikipedia.org/wiki/Turbo_Pascal
        quote: "The program was sold by direct mail order for US$49.95, without going through established sales channels"
  - text: "etwa ein Zehntel dessen, was andere Compiler kosteten"
    sources:
      - url: https://www.welcometothejungle.com/en/articles/anders-hejlsberg-microsoft-career
        quote: "At the time, products like that were typically selling for $500."
      - url: https://en.wikipedia.org/wiki/Turbo_Pascal
        quote: "released by Borland at a price that seemed amazing at that time: $49.95, about one-tenth the price of comparable products."
  - text: "er war berühmt dafür, wie schnell er übersetzte"
    sources:
      - url: https://en.wikipedia.org/wiki/Turbo_Pascal
        quote: "Compiling was much faster than compilers for other languages"
      - url: https://www.welcometothejungle.com/en/articles/anders-hejlsberg-microsoft-career
        quote: "We reduced that to seconds. … It was instantaneous and made compiled languages feel like they were dynamic or interactive languages."
  - text: "2025 kündigte Hejlsberg an, den TypeScript-Compiler in Go neu zu schreiben, damit er etwa zehnmal schneller wird."
    sources:
      - url: https://devblogs.microsoft.com/typescript/typescript-native-port/
        quote: "A 10x Faster TypeScript … Anders Hejlsberg … March 11th, 2025 … Today I'm excited to announce the next steps we're taking to radically improve TypeScript performance. … A 10x performance improvement represents a massive leap in the TypeScript and JavaScript development experience … You can build and run the Go code from our new working repo"

ierusalimschy-celes-figueiredo:
  - text: Roberto Ierusalimschy (geboren 1960)
    sources:
      - url: https://en.wikipedia.org/wiki/Roberto_Ierusalimschy
        quote: "born 21 May 1960"
  - text: Waldemar Celes und Luiz Henrique de Figueiredo, brasilianische Informatiker, entwarfen Lua 1993 in der Gruppe Tecgraf an der Katholischen Universität in Rio de Janeiro
    sources:
      - url: https://www.lua.org/doc/hopl.pdf
        quote: "Lua is a scripting language born in 1993 at PUC-Rio, the Pontifical Catholic University of Rio de Janeiro in Brazil. … Lua was born in 1993 inside Tecgraf, the Computer Graphics Technology Group of PUC-Rio in Brazil. The creators of Lua were Roberto Ierusalimschy, Luiz Henrique de Figueiredo, and Waldemar Celes."
      - url: https://en.wikipedia.org/wiki/Roberto_Ierusalimschy
        quote: "is a Brazilian computer scientist"
  - text: Bis 1992 schottete Brasilien sich mit hohen Handelsschranken gegen Computer und Software aus dem Ausland ab, also bauten sie ihre Werkzeuge selbst.
    sources:
      - url: https://www.lua.org/doc/hopl.pdf
        quote: "From 1977 until 1992, Brazil had a policy of strong trade barriers (called a “market reserve”) for computer hardware and software motivated by a nationalistic feeling that Brazil could and should produce its own hardware and software. In that atmosphere, Tecgraf’s clients could not afford, either politically or financially, to buy customized software from abroad … those reasons led Tecgraf to implement from scratch the basic tools it needed."
  - text: Wer in Roblox ein Spiel baut, schreibt Luau, eine Sprache, die aus Lua entstanden ist.
    sources:
      - url: https://create.roblox.com/docs/luau
        quote: "Luau is the scripting language creators use in Roblox Studio. … It is a fast, small, safe, gradually typed embeddable scripting language derived from Lua 5.1."
      - url: https://luau.org/
        quote: "a small, fast, and embeddable programming language based on Lua with a gradual type system."
  - text: "Lua heißt auf Portugiesisch »Mond«: Eine der Sprachen, aus denen Lua hervorging, hieß SOL, »Sonne«."
    sources:
      - url: https://www.lua.org/history.html
        quote: "which we called Sol: an acronym for Simple Object Language, which also means sun in Portuguese. … Because the new language was a modified version of Sol (sun), a friend at TeCGraf suggested the name Lua (moon, in Portuguese), and Lua was born."
      - url: https://www.lua.org/doc/hopl.pdf
        quote: "These languages, called DEL and SOL, were the ancestors of Lua."

eich:
  - text: Brendan Eich (geboren 1961), amerikanischer Programmierer.
    sources:
      - url: https://en.wikipedia.org/wiki/Brendan_Eich
        quote: "born July 4, 1961 … American computer programmer and technology executive"
  - text: Jeder Button und jedes Menü, das auf einer Webseite aufklappt, läuft mit JavaScript
    none: Workspace
  - text: "Die Sprache schrieb er 1995 bei der Firma Netscape für ihren Browser, die erste Fassung in zehn Tagen."
    sources:
      - url: https://www.cs.tufts.edu/~nr/cs257/archive/brendan-eich/js-hopl.pdf
        quote: "In early 1995, Brendan Eich was recruited to Netscape with the bait of \"come and do Scheme in the browser.\" … he prototyped the first Mocha implementation in ten contiguous days in May, 1995."
      - url: https://en.wikipedia.org/wiki/Brendan_Eich
        quote: "completed the first version in ten days in order to accommodate the Navigator 2.0 Beta release schedule"
  - text: Auch VS Code ist in TypeScript geschrieben, einer Erweiterung von JavaScript.
    sources:
      - url: https://en.wikipedia.org/wiki/Visual_Studio_Code
        quote: "C++, TypeScript, JavaScript, HTML, CSS"
      - url: https://www.typescriptlang.org/
        quote: "TypeScript is JavaScript with syntax for types. … TypeScript is a strongly typed programming language that builds on JavaScript, giving you better tooling at any scale."
  - text: Erst hieß die Sprache Mocha, dann LiveScript.
    sources:
      - url: https://www.cs.tufts.edu/~nr/cs257/archive/brendan-eich/js-hopl.pdf
        quote: "Marc Andreessen proposed the code-name \"Mocha\" for the browser scripting language … JavaScript, under the name \"LiveScript,\" was initially exposed to the public in September 1995 as part of the first beta release of Netscape Navigator 2.0."
  - text: Den Namen JavaScript bekam sie Ende 1995 als Werbung, weil Java gerade in Mode war
    sources:
      - url: https://www.cs.tufts.edu/~nr/cs257/archive/brendan-eich/js-hopl.pdf
        quote: "Netscape Communications Corporation and Sun Microsystems announced JavaScript on December 4, 1995, in a joint press release … The companies were attempting to forge a strong brand linkage between the Java and JavaScript languages even though their technical designs were only superficially similar."
      - url: https://en.wikipedia.org/wiki/JavaScript
        quote: "At the time, the dot-com boom had begun and Java was a popular new language, so Eich considered the JavaScript name a marketing ploy by Netscape."
  - text: mit Java hat sie wenig gemeinsam
    sources:
      - url: https://en.wikipedia.org/wiki/JavaScript
        quote: "Although Java and JavaScript are similar in name and syntax, the two languages are distinct and differ greatly in design."
      - url: https://www.cs.tufts.edu/~nr/cs257/archive/brendan-eich/js-hopl.pdf
        quote: "even though their technical designs were only superficially similar"
  - text: 1998 gründete Eich Mozilla mit, woraus später der Browser Firefox hervorging.
    sources:
      - url: https://en.wikipedia.org/wiki/Brendan_Eich
        quote: "In early 1998, Eich co-founded the free and open-source software project Mozilla"
      - url: https://www.mozilla.org/en-US/about/history/
        quote: "The Mozilla project was created in 1998 with the release of the Netscape browser suite source code. … Firefox 1.0 was released in 2004 and became a big success."

gamma:
  - text: Erich Gamma (geboren 1961), Schweizer Informatiker.
    sources:
      - url: https://en.wikipedia.org/wiki/Erich_Gamma
        quote: "Swiss computer scientist (born 1961) … Erich Gamma is a Swiss computer scientist and one of the four co-authors"
  - text: Der Editor im Workspace ist VS Code
    none: Workspace
  - text: "Ab 2011 leitete er bei Microsoft in Zürich das Team, das zuerst einen Editor im Browser baute und daraus VS Code machte"
    note: "Korrigiert; vorher: »Dessen Entwicklung leitete er ab 2011 bei Microsoft in Zürich«"
    sources:
      - url: https://heise.de/-1256167
        quote: "Erich Gamma, einer der bekanntesten Softwareentwickler der Welt, wechselt von IBM zu Microsoft ins Visual-Studio-Team. … Er darf sich dort \"Microsoft Distinguished Engineer\" nennen und ein neues Entwicklungsteam mit Sitz in Zürich führen"
      - url: https://www.theregister.com/2021/01/28/erich_gamma_on_vs_code/
        quote: "in 2011 Gamma joined Microsoft and started work on the \"Monaco\" project, a code editor in the browser. … the initial team having been in Zurich. … Visual Studio Online \"Monaco\" was launched as a way of editing Azure websites in the browser, but failed to attract users."
      - url: https://www.codemag.com/Article/1809051
        quote: "At Microsoft, Gamma led a small development lab out of Zurich, Switzerland."
  - text: 2015 erschien die erste Fassung
    sources:
      - url: https://www.codemag.com/Article/1809051
        quote: "In April 2015, the team released the initial version of Visual Studio Code."
      - url: https://www.theregister.com/2021/01/28/erich_gamma_on_vs_code/
        quote: "Introduced at the Build event in April 2015, the VS Code open-source editor is nearly six years old."
  - text: Vorher schrieb er mit Kent Beck JUnit, mit dem Java-Programme sich selbst testen
    sources:
      - url: https://martinfowler.com/bliki/Xunit.html
        quote: "JUnit was born on a flight from Zurich to the 1997 OOPSLA in Atlanta. Kent was flying with Erich Gamma, and what else were two geeks to do on a long flight but program? The first version of JUnit was built there, pair programmed, and done test first"
      - url: https://en.wikipedia.org/wiki/Erich_Gamma
        quote: "Gamma, along with Kent Beck, co-wrote the JUnit software testing framework"
  - text: und mit drei anderen das Buch Design Patterns (1994), das bis heute zeigt, wie man größere Programme ordnet
    sources:
      - url: https://en.wikipedia.org/wiki/Design_Patterns
        quote: "The book was written by Erich Gamma, Richard Helm, Ralph Johnson, and John Vlissides, with a foreword by Grady Booch. … The book was originally published on 21 October 1994 … It has been influential to the field of software engineering and is regarded as an important source for object-oriented design theory and practice."

moolenaar:
  - text: Bram Moolenaar (1961–2023), niederländischer Programmierer.
    sources:
      - url: https://en.wikipedia.org/wiki/Bram_Moolenaar
        quote: "Moolenaar was born in Lisse, Netherlands, in 1961."
      - url: https://iccf-holland.org/
        quote: "the founder and treasurer of ICCF Holland, Bram Moolenaar, passed away on August 3, 2023."
  - text: Du hast mit vim eine Datei geschrieben?
    none: Workspace
  - text: Weil es den Editor vi für seinen Amiga nicht gab, baute er ab 1988 einen nach.
    sources:
      - url: https://en.wikipedia.org/wiki/Bram_Moolenaar
        quote: "In 1988, Moolenaar purchased an Amiga computer. … Familiar with vi, which had not been ported to the Amiga at the time, he tested several clones of vi, including Stevie. … Moolenaar took the source code of Stevie and improved upon it."
      - url: https://en.wikipedia.org/wiki/Vim_(text_editor)
        quote: "In 1988, Bram Moolenaar began work on what would become Vim. … He used the codebase for the Stevie editor ported to Amiga (by Tony Andrews et al.) as a starting point."
  - text: Am 2. November 1991 war die erste Fassung fertig
    note: >-
      Version 1.14 war laut Wikipedia am 2. November 1991 fertig und die erste öffentliche
      Fassung (Fish Disk 591, Januar 1992). Davor gab es seit 1988 unveröffentlichte Fassungen;
      »die erste veröffentlichte Fassung« wäre genauer, aber der Satz ist so vertretbar.
    sources:
      - url: https://en.wikipedia.org/wiki/Vim_(text_editor)
        quote: "Version 1.14 (completed 2 November 1991) became the first public release. … It was distributed via Fish Disk #591 in January 1992."
      - url: https://generic.aminet.net/misc/fish/fish-0591.readme
        quote: "Vi IMitation.  A clone of the UNIX text editor \"vi\". … Version 1.14, includes source. … Author:  Bram Moolenaar, et. al."
  - text: damals »Vi IMitation«, später »Vi IMproved«
    sources:
      - url: https://generic.aminet.net/misc/fish/fish-0591.readme
        quote: "Vi IMitation.  A clone of the UNIX text editor \"vi\".  Very useful for editing programs and other plain ASCII text."
      - url: https://en.wikipedia.org/wiki/Bram_Moolenaar
        quote: "In version 1.22 in 1992, Vi IMitation was renamed to \"Vi IMproved\"."
  - text: Vim kostet nichts, aber wer es mag, wird gebeten, für Kinder in Uganda zu spenden
    sources:
      - url: https://vimhelp.org/uganda.txt.html
        quote: "Vim is Charityware. You can use and copy it as much as you like, but you are encouraged to make a donation for needy children in Uganda."
  - text: für die er eine Hilfsorganisation gegründet hatte
    note: >-
      Stimmt. Zur Kenntnis: Laut :help uganda gingen die Aufgaben von ICCF Holland nach
      seinem Tod an die Schwesterorganisation Kuwasha in Kanada, ICCF Holland wurde Ende 2025
      aufgelöst.
    sources:
      - url: https://iccf-holland.org/
        quote: "the founder and treasurer of ICCF Holland, Bram Moolenaar, passed away on August 3, 2023. … ICCF Holland helps needy children in Kibaale, a town in the poor south of Uganda."
      - url: https://vimhelp.org/uganda.txt.html
        quote: "Bram Moolenaar's charity, ICCF Holland, has long supported the education of children in Uganda."
  - text: Mehr als 30 Jahre lang pflegte er Vim selbst.
    sources:
      - url: https://siliconrepublic.com/business/bram-moolenaar-vim-dies-open-source
        quote: "The Vim project wouldn't exist without his ongoing passion to lead and develop Vim and the community for more than 30 years."
      - url: https://en.wikipedia.org/wiki/Bram_Moolenaar
        quote: "Vim was continued by co-contributor Christian Brabandt."

widenius:
  - text: Michael »Monty« Widenius (geboren 1962), finnischer Programmierer.
    sources:
      - url: https://en.wikipedia.org/wiki/Michael_Widenius
        quote: "born 3 March 1962 … Finnish software programmer"
  - text: Die Datenbank MySQL, die du mit mycli abfragst
    none: Workspace
  - text: "begann er 1994 mit David Axmark zu schreiben; 1995 erschien die erste Fassung"
    note: "Korrigiert; vorher: »begann er 1995 mit David Axmark zu schreiben«"
    sources:
      - url: https://en.wikipedia.org/wiki/MySQL
        quote: "Original development of MySQL by Widenius and Axmark began in 1994. … The first version of MySQL appeared on 23 May 1995."
  - text: Das »My« im Namen ist seine Tochter My.
    sources:
      - url: https://dev.mysql.com/doc/refman/8.4/en/history.html
        quote: "MySQL is named after co-founder Monty Widenius's daughter, My."
      - url: https://torquemag.io/2013/05/skysql-mariadb/
        quote: "The MySQL database is named after my first daughter, My."
  - text: 2008 kaufte Sun Microsystems die Firma hinter MySQL für eine Milliarde Dollar
    sources:
      - url: https://www.mactech.com/2008/01/16/sun-accounces-agreement-to-acquire-mysql-open-source-database
        quote: "today announced it has entered into a definitive agreement to acquire MySQL AB … for approximately $1 billion in total consideration"
      - url: https://en.wikipedia.org/wiki/MySQL
        quote: "In January 2008, Sun Microsystems bought MySQL AB for $1 billion."
  - text: bald darauf kaufte Oracle Sun
    sources:
      - url: https://en.wikipedia.org/wiki/MySQL
        quote: "Oracle acquired Sun Microsystems on 27 January 2010."
  - text: Widenius fürchtete, dass MySQL dort nicht frei bleibt, und machte 2009 aus dem freien Quellcode eine eigene Fassung
    sources:
      - url: https://en.wikipedia.org/wiki/MariaDB
        quote: "Concerned that Oracle would restrict MySQL's open-source development … The first release, MariaDB 5.1.38, was published on 29 October 2009."
      - url: https://mariadb.org/about/
        quote: "MariaDB Server will remain Free and Open Source Software licensed under GPLv2, independent of any commercial entities."
  - text: MariaDB, benannt nach seiner jüngeren Tochter Maria
    sources:
      - url: https://en.wikipedia.org/wiki/MariaDB
        quote: "named after founder Michael Widenius' younger daughter, Maria."
      - url: https://torquemag.io/2013/05/skysql-mariadb/
        quote: "The MariaDB database is named after my second daughter, Maria."
  - text: "Auch sein Sohn Max hat eine Datenbank: MaxDB."
    sources:
      - url: https://es.wikipedia.org/wiki/Michael_Widenius
        quote: "y un hijo Max (que dio nombre a MaxDB) de su primer matrimonio"
      - url: https://en.wikipedia.org/wiki/Michael_Widenius
        quote: "3: My, Max and Maria, whose names inspired MySQL, MaxDB and MariaDB."
    note: >-
      Nur Wikipedia (spanisch ausdrücklich, englisch nur allgemein über die Infobox,
      ohne zu sagen, welcher Name zu welchem Kind gehört); eine Aussage von Widenius selbst
      habe ich nicht gefunden. MaxDB war SAP DB, 2003 von SAP und MySQL AB umbenannt.

wium-lie:
  - text: Håkon Wium Lie (geboren 1965), norwegischer Informatiker.
    sources:
      - url: https://en.wikipedia.org/wiki/H%C3%A5kon_Wium_Lie
        quote: "Håkon Wium Lie (born July 26, 1965) … Norwegian web pioneer"
  - text: Jede Farbe, jeder Abstand und jede Schrift einer Webseite steht in CSS
    none: Workspace
  - text: Das schlug er 1994 am CERN vor, wo Tim Berners-Lee das Web erfunden hatte
    sources:
      - url: https://www.w3.org/People/howcome/p/cascade.html
        quote: "Cascading HTML Style Sheets -- A Proposal … 10 Oct 1994 … This document proposes a style sheet scheme for HTML documents. … howcome@info.cern.ch"
      - url: https://www.w3.org/Style/CSS20/history.html
        quote: "Håkon Wium Lie works at CERN – the cradle of the Web … Håkon published the first draft of the Cascading HTML Style Sheets proposal."
      - url: https://en.wikipedia.org/wiki/H%C3%A5kon_Wium_Lie
        quote: "While working with Tim Berners-Lee and Robert Cailliau at CERN in 1994"
  - text: damit der Inhalt in HTML und das Aussehen getrennt bleiben
    sources:
      - url: https://www.w3.org/Style/CSS20/history.html
        quote: "The separation of document structure from the document's layout had been a goal of HTML from its inception in 1990."
      - url: https://www.w3.org/People/howcome/p/cascade.html
        quote: "This will provide publishers with stylistic influence without resorting to page description languages."
  - text: Später war er lange Technikchef des Browsers Opera.
    sources:
      - url: https://en.wikipedia.org/wiki/H%C3%A5kon_Wium_Lie
        quote: "chief technology officer of Opera Software from 1998"
      - url: https://www.technologyreview.com/innovator/hakon-wium-lie/
        quote: "Lie has taken that passion for choice into the private sector as CTO of Oslo Web browser company Opera Software."
    note: >-
      Wikipedia nennt im Artikelkopf 1998 bis zum Verkauf 2016, im Text April 1999 als Eintritt; »lange« passt in jedem Fall.

bak-lund:
  - text: Lars Bak (geboren 1965), dänischer Programmierer
    sources:
      - url: https://en.wikipedia.org/wiki/Lars_Bak_(computer_programmer)
        quote: "Lars Bak (born 1965) is a Danish computer programmer."
  - text: leitete bei Google die Entwicklung von V8, dem Programm, das in Chrome JavaScript ausführt.
    sources:
      - url: https://en.wikipedia.org/wiki/V8_(JavaScript_engine)
        quote: "V8 is a JavaScript and WebAssembly engine developed by Google for its Chrome browser. … It was named after the V8 engine, and its lead developer was Lars Bak."
      - url: https://talks.cam.ac.uk/talk/index/19189/
        quote: "Since joining Google in 2006, Lars has been responsible for the design and implementation of V8."
  - text: Auch Node.js ist um V8 gebaut
    sources:
      - url: https://nodejs.org/en/learn/getting-started/introduction-to-nodejs
        quote: "Node.js runs the V8 JavaScript engine, the core of Google Chrome, outside of the browser."
  - text: und darauf läuft VS Code im Workspace
    none: Workspace
  - text: Mit Kasper Lund, der V8 mit ihm begonnen hatte
    sources:
      - url: https://www.theregister.com/2013/01/18/google_dart_interview/
        quote: "began work on V8 in 2006 with Google software engineer Kasper Lund"
      - url: https://gotocph.com/2017/speakers/230
        quote: "He co-founded the V8 and Dart projects at Google and brought adaptive optimizations to JavaScript as the tech lead for the Crankshaft project."
  - text: erfand er die Sprache Dart, die Google 2011 vorstellte.
    sources:
      - url: https://en.wikipedia.org/wiki/Dart_(programming_language)
        quote: "Dart is a programming language designed by Lars Bak and Kasper Lund and developed by Google. … Dart was unveiled at the GOTO conference in Aarhus, Denmark, October 10–12, 2011."
  - text: 'Dart sollte JavaScript ablösen: Chrome sollte Dart-Programme selbst ausführen.'
    sources:
      - url: https://gist.github.com/1208618
        quote: "The goal of the Dash effort is ultimately to replace JavaScript as the lingua franca of web development … The Dash language effort will be driven by Lars Bak and his team in the Aarhus office. … Developers that target only Chrome can rely on the Dash VM"
      - url: https://www.theregister.com/2013/01/18/google_dart_interview/
        quote: "Google’s objective is that Dart will eventually replace JavaScript as the \"lingua franca\" of web development."
      - url: https://en.wikipedia.org/wiki/Dart_(programming_language)
        quote: "Some criticized the Dart initiative for fragmenting the web because of plans to include a Dart VM in Chrome."
  - text: 2015 schrieben Bak und Lund, dass daraus nichts wird; seitdem wird Dart für das Web in JavaScript übersetzt
    sources:
      - url: https://news.dartlang.org/2015/03/dart-for-entire-web.html
        quote: "We have decided not to integrate the Dart VM into Chrome. … we will focus our web efforts on compiling Dart to JavaScript."
  - text: und groß wurde es mit Flutter
    sources:
      - url: https://www.techtarget.com/searchapparchitecture/tip/4-reasons-Dart-is-still-a-language-worth-learning
        quote: "a 2018 Codementor survey even recommended that developers avoid learning the language … has arguably reinforced Dart's significance as a language worth learning … identified Flutter as one of 2020's most popular development frameworks"
  - text: Den Namen hat V8 von einem Automotor mit acht Zylindern.
    note: >-
      Nur Wikipedia, und dort mit »citation needed«; eine Aussage von Bak oder vom V8-Team zum Namen
      wurde nicht gefunden (gesucht: Interviews in The Register 2013, Cambridge-Vortrag, V8-Seiten).
    sources:
      - url: https://en.wikipedia.org/wiki/V8_(JavaScript_engine)
        quote: "It was named after the V8 engine, and its lead developer was Lars Bak."

matsumoto:
  - text: "Yukihiro Matsumoto (geboren 1965), japanischer Programmierer, den alle »Matz« nennen"
    sources:
      - url: https://en.wikipedia.org/wiki/Yukihiro_Matsumoto
        quote: "Yukihiro Matsumoto (まつもとゆきひろ, Matsumoto Yukihiro; born 14 April 1965), also known as Matz"
      - url: https://www.ruby-lang.org/en/about/
        quote: "Its creator, Yukihiro “Matz” Matsumoto, blended parts of his favorite languages (Perl, Smalltalk, Eiffel, Ada, and Lisp)"
  - text: "veröffentlichte Ruby 1995."
    sources:
      - url: https://www.ruby-lang.org/en/about/
        quote: "Since its public release in 1995, Ruby has drawn devoted coders worldwide."
      - url: https://en.wikipedia.org/wiki/Ruby_(programming_language)
        quote: "The first public release of Ruby 0.95 was announced on Japanese domestic newsgroups on 21 December 1995."
  - text: "»Ich hoffe, dass Ruby jedem Programmierer auf der Welt hilft, produktiv zu sein, Spaß am Programmieren zu haben und glücklich zu sein.«"
    note: >-
      Das Zitat ist belegt, aber keine der gefundenen Quellen sagt, wo und wann Matz es gesagt hat
      (oft einem Google Tech Talk 2008 zugeschrieben, nicht geprüft).
    sources:
      - url: https://en.wikipedia.org/wiki/Ruby_(programming_language)
        quote: "I hope to see Ruby help every programmer in the world to be productive, and to enjoy programming, and to be happy."
      - url: https://www.heroku.com/blog/very-ruby-thanksgiving/
        quote: "I hope to see Ruby help every programmer in the world to be productive, to enjoy programming, and to be happy. … That is the primary purpose of the Ruby language."
  - text: "Er wollte eine Sprache, mit der Programmieren Freude macht"
    sources:
      - url: https://www.heroku.com/blog/very-ruby-thanksgiving/
        quote: "That is the primary purpose of the Ruby language."
  - text: "Auch die Website des Workspace läuft mit Ruby."
    none: Workspace
  - text: "Den Namen wählte er 1993 in einem Chat mit dem Programmierer Keiju Ishitsuka, noch bevor er eine Zeile der Sprache geschrieben hatte"
    sources:
      - url: https://en.wikipedia.org/wiki/Ruby_(programming_language)
        quote: "The name … originated during an online chat session between Matsumoto and Keiju Ishitsuka on 24 February 1993, before any code had been written."
      - url: https://www.ruby-lang.org/en/documentation/faq/1/
        quote: "Well, Ruby was born on February 24, 1993. … I was talking with my colleague about the possibility of an object-oriented scripting language."
  - text: "Der Rubin war der Geburtsstein eines Kollegen."
    sources:
      - url: https://www.ruby-lang.org/en/documentation/faq/1/
        quote: "Influenced by Perl, Matz wanted to use a jewel name for his new language, so he named Ruby after a colleague's birthstone."
      - url: https://en.wikipedia.org/wiki/Ruby_(programming_language)
        quote: "He also noted that one factor influencing the choice of the name was that a colleague's birthstone was ruby."

torvalds:
  - text: Linus Torvalds (geboren 1969).
    sources:
      - url: https://en.wikipedia.org/wiki/Linus_Torvalds
        quote: "Torvalds was born in Helsinki, Finland, on 28 December 1969, the son of journalists Anna and Nils Torvalds,"
  - text: Das Terminal im Workspace läuft unter Linux
    none: Workspace
  - text: Das hat er 1991 als Student in Helsinki angefangen
    sources:
      - url: https://en.wikipedia.org/wiki/Linus_Torvalds
        quote: "The first Linux prototypes were publicly released on the Internet in late 1991 from an FTP server at his university."
  - text: "»nur ein Hobby«, schrieb er damals"
    sources:
      - url: https://groups.google.com/g/comp.os.minix/c/dlNtH7RRrGA/m/SwRavCzVE7gJ
        quote: "I'm doing a (free) operating system (just a hobby, won't be big and professional like gnu) for 386(486) AT clones."
  - text: Heute läuft Linux auf den meisten Servern der Welt
    sources:
      - url: https://w3techs.com/technologies/details/os-linux
        quote: "Linux is used by 63.2% of all the websites whose operating system we know."
  - text: und in jedem Android-Handy
    sources:
      - url: https://developer.android.com/guide/platform
        quote: "Android is an open source, Linux-based software stack created for a wide array of devices and form factors. … The foundation of the Android platform is the Linux kernel."
  - text: 2005 brauchte er für die Arbeit an Linux eine neue Versionsverwaltung und schrieb in wenigen Tagen die erste Fassung von Git.
    sources:
      - url: https://github.blog/open-source/git/git-turns-20-a-qa-with-linus-torvalds/
        quote: "Torvalds famously wrote Git in just 10 days … after Linux kernel developers lost access to their proprietary tool, BitKeeper, due to licensing disagreements. … It was actually fewer than—well, it was about 10 days until I could use it for the kernel, yes. … So honestly, after the first week, I had something that was good for applying patches, but not so much for everything else."
      - url: https://en.wikipedia.org/wiki/Linus_Torvalds
        quote: "On 3 April 2005, Torvalds began development on Git, version control software that later became widely used."

carmack:
  - text: John Carmack (geboren 1970), amerikanischer Programmierer, Mitgründer der Spielefirma id Software.
    sources:
      - url: https://en.wikipedia.org/wiki/John_Carmack
        quote: "John D. Carmack II (born August 21, 1970) is an American computer programmer and video game developer. … He co-founded the video game company id Software."
  - text: Er programmierte die Grafik von Wolfenstein 3D (1992), mit einem Raycaster
    sources:
      - url: https://en.wikipedia.org/wiki/John_Carmack
        quote: "ray casting for Hovertank 3D, Catacomb 3-D, and Wolfenstein 3D"
      - url: https://en.wikipedia.org/wiki/Wolfenstein_3D
        quote: "Wolfenstein 3D is a 1992 first-person shooter game developed by id Software. … He also took the unusual approach of creating the displayed graphics through ray casting."
  - text: wie du ihn in »Raycasting in C« selbst baust
    none: Workspace
  - text: von DOOM (1993) und von Quake (1996)
    sources:
      - url: https://en.wikipedia.org/wiki/Doom_(1993_video_game)
        quote: "Doom is a 1993 first-person shooter game developed and published by id Software for MS-DOS. … using a new 3D game engine from the lead programmer, John Carmack."
      - url: https://en.wikipedia.org/wiki/Quake_engine
        quote: "did most of the programming of the engine, with help from Michael Abrash … The Quake engine was developed from 1995 for the video game Quake, released on June 22, 1996."
  - text: Den BSP-Baum hatten Grafikforscher schon 1980 beschrieben.
    sources:
      - url: https://twobithistory.org/2019/11/06/doom-bsp.html
        quote: "The 1980 paper, written by Henry Fuchs, Zvi Kedem, and Bruce Naylor, introduced the BSP tree."
      - url: https://en.wikipedia.org/wiki/Binary_space_partitioning
        quote: "a fully automated and algorithmic generation of a hierarchical polygonal data structure"
  - text: Carmack griff zu ihm, als Wolfenstein 3D auf das Super Nintendo sollte und der Raycaster dort zu langsam war
    sources:
      - url: https://wolfenstein3d.nl/blackbook10/
        quote: "The SNES CPU is far slower than a 386, and raycasting 320 rays per frame was simply too much for it. … John Carmack replaced the raycaster entirely with a BSP-based wall span renderer."
      - url: https://twobithistory.org/2019/11/06/doom-bsp.html
        quote: "even less powerful than the IBM-compatible PCs of the day … So Carmack began looking for a better algorithm."
      - url: https://git.applefritter.com/Macintosh-SW/Wolf3D-Mac
        quote: "The code was based not on the PC version but of a Super NES version that was done at id software. … it used BSP trees to help determine which walls were to be drawn instead of the ray-casting method."
  - text: und baute danach DOOM darauf
    sources:
      - url: https://twobithistory.org/2019/11/06/doom-bsp.html
        quote: "But Carmack realized that BSP trees would solve Doom's speed problems too."
      - url: https://wolfenstein3d.nl/blackbook10/
        quote: "It was faster, and the experience of building it directly informed the Doom renderer."
  - text: Im Dezember 1997 gab er den Quelltext von DOOM frei.
    sources:
      - url: https://raw.githubusercontent.com/id-Software/DOOM/master/README.TXT
        quote: "Here it is, at long last.  The DOOM source code is released for your non-profit use. … John Carmack 12-23-97"
      - url: https://en.wikipedia.org/wiki/Doom_(1993_video_game)
        quote: "The source code for Doom was released under a non-commercial license in 1997."
  - text: Seitdem haben Leute es auf Taschenrechner und Drucker gebracht
    sources:
      - url: https://en.wikipedia.org/wiki/List_of_Doom_ports
        quote: "A source port to the TI-Nspire graphing calculators (specifically the NDless jailbreak software) was created, titled nDoom."
      - url: https://www.engadget.com/2014-09-15-can-you-play-doom-on-a-printer-yes-you-canon.html
        quote: "Michael Jordon, a researcher with Context Information Security spent four months hacking a Canon Pixma printer … to get it to run the classic shooter."
  - text: und auch PixelRAM spielt DOOM
    none: Workspace

stenberg:
  - text: Daniel Stenberg (geboren 1970), schwedischer Programmierer.
    sources:
      - url: https://en.wikipedia.org/wiki/Daniel_Stenberg
        quote: "Magnus Daniel Stenberg is a Swedish software developer."
      - url: https://en.wikipedia.org/wiki/Daniel_Stenberg
        quote: "November 23, 1970"
  - text: Du holst mit curl Webseiten und Daten aus APIs?
    none: Workspace
  - text: Ende 1996 wollte er einem Chat-Bot beibringen, Wechselkurse aus dem Web zu holen
    sources:
      - url: https://curl.se/docs/history.html
        quote: "Towards the end of 1996, Daniel Stenberg was spending time writing an IRC bot for an Amiga related channel on EFnet. … He then came up with the idea to make currency-exchange calculations available to Internet Relay Chat (IRC) users."
  - text: und erweiterte dafür ein kleines Programm namens HttpGet
    sources:
      - url: https://curl.se/docs/history.html
        quote: "On November 11, 1996 the Brazilian developer Rafael Sagula wrote and released HttpGet version 0.1. … Daniel extended this existing command-line open-source tool. … After a few minor adjustments, it did what he needed. … The first release with Daniel's additions was 0.2, released on December 17, 1996."
  - text: Am 20. März 1998 bekam es den Namen curl.
    sources:
      - url: https://curl.se/docs/history.html
        quote: "With upload capabilities, the name was once again misleading and a second name change was made. … On March 20, 1998 curl 4 was released. … (The version numbering from the previous names was kept.)"
  - text: Er arbeitet bis heute daran.
    sources:
      - url: https://www.iva.se/en/published/ivas-gold-medal-2025-daniel-stenberg--the-architect-behind-a-global-communications-backbone/
        quote: "Stenberg has been the lead developer and driving force behind the curl project"
      - url: https://curl.se/docs/history.html
        quote: "January: Daniel started working full-time on curl, employed by wolfSSL"
  - text: curl steckt inzwischen in Milliarden Geräten, in Handys, Autos und Satelliten.
    sources:
      - url: https://curl.se/
        quote: "used in cars, television sets, routers, printers, audio equipment, mobile phones, tablets, medical devices"
      - url: https://www.iva.se/en/published/ivas-gold-medal-2025-daniel-stenberg--the-architect-behind-a-global-communications-backbone/
        quote: "it is estimated to be installed in 20 to 40 billion instances … not only between traditional computer programmes but also across smartphones, vehicles, satellites and spacecraft."

gruber:
  - text: John Gruber (geboren 1973), amerikanischer Autor eines Blogs über Technik
    sources:
      - url: https://en.wikipedia.org/wiki/John_Gruber
        quote: "John Gruber (born 1973) is a technology blogger, UI designer, and co-creator of the Markdown markup language."
      - url: https://en.wikipedia.org/wiki/John_Gruber
        quote: "Gruber writes the Apple enthusiast blog Daring Fireball."
  - text: erfand 2004 Markdown, mit Hilfe von Aaron Swartz
    sources:
      - url: https://en.wikipedia.org/wiki/Markdown
        quote: "Gruber created the Markdown language in 2004 with Swartz as his \"sounding board\"."
      - url: https://daringfireball.net/projects/markdown/
        quote: "Aaron Swartz deserves a tremendous amount of credit for his feedback on the design of Markdown's formatting syntax."
      - url: https://daringfireball.net/projects/markdown/
        quote: "Markdown 1.0.1 (18 KB) — 17 Dec 2004"
  - text: Er wollte Text so schreiben, wie man eine E-Mail schreibt, mit * und #, und ein Programm macht HTML daraus.
    sources:
      - url: https://daringfireball.net/projects/markdown/
        quote: "Markdown is a text-to-HTML conversion tool for web writers. … Markdown allows you to write using an easy-to-read, easy-to-write plain text format"
      - url: https://daringfireball.net/projects/markdown/syntax
        quote: "the single biggest source of inspiration for Markdown’s syntax is the format of plain text email."
      - url: https://daringfireball.net/projects/markdown/syntax
        quote: "Atx-style headers use 1-6 hash characters at the start of the line, corresponding to header levels 1-6. … Markdown treats asterisks (`*`) and underscores (`_`) as indicators of emphasis."
  - text: Jede README.md in einem Repository ist Markdown
    sources:
      - url: https://en.wikipedia.org/wiki/Markdown
        quote: "also used elsewhere in online forums, collaborative software, documentation pages, and readme files."
      - url: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes
        quote: "For the rendered view of any Markdown file in a repository, including README files, GitHub will automatically generate"
  - text: die Seiten des Workspace sind es auch
    none: Workspace

graydon-hoare:
  - text: Graydon Hoare, Programmierer in Kanada.
    sources:
      - url: https://usesthis.com/interviews/graydon.hoare/
        quote: "My name is Graydon Hoare, I’m a middle-aged socialist boring cishet white guy who lives in Vancouver, Canada."
  - text: Als er 2006 nach Hause kam, war der Aufzug in seinem Haus in Vancouver kaputt
    sources:
      - url: https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/
        quote: "a 29-year-old computer programmer working for Mozilla, the open-source browser company … the elevator was out of order; its software had crashed."
  - text: "Dessen Software war abgestürzt."
    sources:
      - url: https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/
        quote: "the elevator was out of order; its software had crashed."
  - text: Er wohnte im 21. Stock und ärgerte sich auf der Treppe, dass Programmierer nicht einmal einen Aufzug bauen können, der nicht abstürzt.
    sources:
      - url: https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/
        quote: "lived on the 21st floor … we computer people couldn't even make an elevator that works without crashing!"
  - text: Solche Abstürze kommen oft von Fehlern im Umgang mit dem Speicher
    sources:
      - url: https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/
        quote: "Many such crashes, Hoare knew, are due to problems with how a program uses memory."
  - text: so begann er neben seiner Arbeit bei Mozilla Rust
    sources:
      - url: https://en.wikipedia.org/wiki/Rust_(programming_language)
        quote: "In 2006, Rust began as a personal project by Mozilla employee Graydon Hoare."
      - url: https://www.infoq.com/news/2012/08/Interview-Rust
        quote: "finally decided to show one such prototype I'd been working on in my spare time to my manager at the time."
  - text: eine Sprache, deren Compiler rustc solche Fehler gar nicht erst durchlässt
    sources:
      - url: https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/
        quote: "He opened his laptop and began designing a new computer language … If a coder violated the rules, the compiler would refuse to compile the code and turn it into a runnable program."
  - text: Den Namen hat Rust von Rostpilzen, die er »für das Überleben überentwickelt« nennt.
    sources:
      - url: https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/
        quote: "He named it Rust, after a group of remarkably hardy fungi that are, he says, “over-engineered for survival.”"
  - text: Ab 2009 bezahlte Mozilla die Arbeit an Rust
    sources:
      - url: https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/
        quote: "In 2009, Mozilla decided to officially sponsor Rust."
      - url: https://en.wikipedia.org/wiki/Rust_(programming_language)
        quote: "In 2009, Mozilla officially sponsored the project."
  - text: 2013 gab Hoare das Projekt ab
    sources:
      - url: https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/
        quote: "stepped aside from the project in 2013."
      - url: https://en.wikipedia.org/wiki/Rust_(programming_language)
        quote: "In 2013, Graydon Hoare stepped down from Rust."
  - text: Heute steckt Rust in Firefox und im Linux-Kernel.
    sources:
      - url: https://en.wikipedia.org/wiki/Rust_(programming_language)
        quote: "Firefox has components written in Rust as part of the underlying Gecko browser engine. … the Linux kernel began introducing experimental support for Rust code in Version 6.1 in late 2022"
      - url: https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/
        quote: "another group used Rust to rewrite the part of Firefox that rendered CSS"
      - url: https://kernelnewbies.org/Linux_6.1
        quote: "Linux 6.1 was released on Sun, 11 December 2022. … This release adds support for the Rust programming language."

tatham-hall:
  - text: Simon Tatham (geboren 1977, im Bild), britischer Programmierer
    sources:
      - url: https://en.wikipedia.org/wiki/Simon_Tatham
        quote: "(born 3 May 1977)"
      - url: https://en.wikipedia.org/wiki/PuTTY
        quote: "PuTTY was written and is maintained primarily by Simon Tatham, a British programmer."
      - url: https://www.chiark.greenend.org.uk/~sgtatham/
        quote: "a software engineer and free-software author in Cambridge, UK"
  - text: schrieb 1996 mit Hilfe von Julian Hall NASM, den Netwide Assembler
    sources:
      - url: https://en.wikipedia.org/wiki/Netwide_Assembler
        quote: "It was originally written by Simon Tatham with assistance from Julian Hall. … NASM version 0.90 was released in October 1996."
      - url: https://raw.githubusercontent.com/netwide-assembler/nasm/master/AUTHORS
        quote: "Original author and co-conspirator"
      - url: https://www.nasm.us/doc/nasmdocc.html
        quote: "First release version. First support for object file output."
    note: >-
      Die NASM-AUTHORS-Datei nennt Tatham und Hall beide »Original author and co-conspirator«, also gleichrangig;
      Wikipedia formuliert »with assistance from Julian Hall«. Die Box folgt Wikipedia; das ist vertretbar.
  - text: einen freien Assembler, der aus Befehlen wie mov und syscall Maschinencode für x86-Prozessoren macht
    sources:
      - url: https://www.nasm.us/doc/nasmdoc1.html
        quote: "The Netwide Assembler, NASM, is an 80x86 and x86-64 assembler designed for portability and modularity."
      - url: https://en.wikipedia.org/wiki/Netwide_Assembler
        quote: "open-source software released under the terms of a simplified (2-clause) BSD license"
  - text: Heute pflegen andere NASM weiter.
    sources:
      - url: https://www.nasm.us/doc/nasmdocc.html
        quote: "All changes since NASM 0.98p3 have been produced by H. Peter Anvin <hpa@zytor.com>."
  - text: Tatham schrieb auch PuTTY (1999)
    sources:
      - url: https://www.chiark.greenend.org.uk/~sgtatham/putty/changes.html
        quote: "These features were new in 0.45 (released 1999-01-22):"
      - url: https://en.wikipedia.org/wiki/PuTTY
        quote: "PuTTY was written and is maintained primarily by Simon Tatham"
  - text: mit dem man sich von Windows aus über SSH in das Terminal eines Linux-Servers einloggt
    sources:
      - url: https://www.chiark.greenend.org.uk/~sgtatham/
        quote: "an SSH client for Windows, also able to talk to serial ports and speak older insecure protocols like Telnet"
  - text: eine Sammlung kleiner Rätselspiele, die auch im Browser laufen
    sources:
      - url: https://www.chiark.greenend.org.uk/~sgtatham/puzzles/
        quote: "This page contains a collection of small computer programs which implement one-player puzzle games. … The 'js' link (and also the puzzle image itself) links to a version based on JavaScript and WebAssembly."

eifrem-svensson-neubauer:
  - text: Emil Eifrem, Johan Svensson und Peter Neubauer (im Bild), Programmierer in Schweden
    note: >-
      Korrigiert; vorher: »schwedische Programmierer«. Die Quellen sagen, dass die Firma in Schweden
      gegründet wurde und Neubauer in Malmö lebt; seine Staatsangehörigkeit wurde nicht gefunden.
    sources:
      - url: https://en.wikipedia.org/wiki/Neo4j
        quote: "The company was founded in 2007 in Sweden as an open source project by Emil Eifrem, Johan Svensson, and Peter Neubauer"
  - text: "bauten um 2000 ein System, mit dem Firmen ihre Inhalte verwalten"
    note: "Korrigiert; vorher: »bauten um 2000 in Malmö ein System für die Inhalte von Websites«"
    sources:
      - url: https://neo4j.com/blog/emil-eifrem/db-engines-informix-neo4j/
        quote: "It all started when Peter, Johan and I were working on an enterprise content management system (ECM). … This was a very standard architecture in the late 90s and early 2000s."
      - url: https://neo4j.com/emil/
        quote: "It was the year 2000, and I was on a flight to Mumbai. … Peter, Johan and I had been building an enterprise content management system (ECM)"
  - text: ihre Datenbank aus Tabellen kam mit den vielen Verknüpfungen nicht mehr mit
    sources:
      - url: https://neo4j.com/blog/emil-eifrem/db-engines-informix-neo4j/
        quote: "at the bottom of our development stack was a relational database called Informix. … The problem was that as an RDBMS, Informix wasn't optimized to handle the relationships between all our data. … it was always slow and limited no matter what we tried."
  - text: 'Auf einem Flug nach Mumbai zeichnete Eifrem auf eine Serviette, wie man die Daten stattdessen speichern könnte: Knoten mit Eigenschaften und Beziehungen zwischen ihnen.'
    sources:
      - url: https://neo4j.com/emil/
        quote: "You’re reading this because of a napkin. It was the year 2000, and I was on a flight to Mumbai. … Emil Eifrem sketched what today is known as the property graph model on a flight to Mumbai in 2000."
      - url: https://neo4j.com/blog/news/newest-release-neo-4-java/
        quote: "sketched the first property graph model on the back of a napkin on a flight to Mumbai in 2000"
  - text: Daraus wurde Neo4j
    sources:
      - url: https://en.wikipedia.org/wiki/Neo4j
        quote: "the idea for the company dates back to a drawing Eifrem sketched on the back of his napkin during a flight in 2000."
  - text: 2007 gründeten die drei dafür eine Firma.
    sources:
      - url: https://en.wikipedia.org/wiki/Neo4j
        quote: "The company was founded in 2007 in Sweden as an open source project by Emil Eifrem, Johan Svensson, and Peter Neubauer"
      - url: https://www.realtid.se/bors-finans/morgan-stanley-rekordinvesterar-i-svenskt-techbolag/
        quote: "Sedan företaget grundades 2007 i Malmö"
  - text: Die Abfragesprache Cypher erfand Andrés Taylor 2011 bei Neo4j.
    sources:
      - url: https://en.wikipedia.org/wiki/Cypher_(query_language)
        quote: "Cypher was largely an invention of Andrés Taylor while working for Neo4j, Inc. (formerly Neo Technology) in 2011."
      - url: https://neo4j.com/docs/cypher-manual/5/introduction/cypher-overview/
        quote: "It was created in 2011 by Neo4j engineers as an SQL-equivalent language for graph databases."
      - url: https://archive.fosdem.org/2012/schedule/event/neo4j_cypher.html
        quote: "Cypher is a declarative query language recently added to the Neo4j graph database."
  - text: Ihre Muster sind ein Bild des Graphen aus Textzeichen
    sources:
      - url: https://en.wikipedia.org/wiki/Cypher_(query_language)
        quote: "Cypher's syntax is based on ASCII art, which is text-based visual art for computers. … nodes are represented with parentheses around the attributes and information regarding the entity."
      - url: https://neo4j.com/docs/cypher-manual/5/introduction/cypher-overview/
        quote: "It relies on the following ascii-art type of syntax"
  - text: (:Person)-[:DIRECTOR]->(:Movie) ist ein Knoten, ein Pfeil und noch ein Knoten.
    none: Workspace

santamaria:
  - text: "Ramon Santamaria, Programmierer aus Barcelona"
    sources:
      - url: https://console.substack.com/p/console-166
        quote: "I’m from a town near Barcelona, in Spain."
      - url: https://github.com/raysan5/raylib/blob/master/FAQ.md
        quote: "The main raylib developer and maintainer is Ramon Santamaria."
  - text: "begann raylib 2013, um Studierenden ohne Programmiererfahrung beizubringen, wie man Spiele programmiert"
    sources:
      - url: https://en.wikipedia.org/wiki/Raylib
        quote: "raylib development began in August 2013 when Ramon Santamaria created the library to support a game development course … aimed at students with artistic backgrounds and no prior coding experience."
      - url: https://github.com/raysan5/raylib/blob/master/HISTORY.md
        quote: "I started developing videogames in 2006 and some years later I started teaching videogames development … to young people with artistic profiles, most of students had never written a single line of code. … raylib started as a weekend project and after three months of hard work, raylib 1.0 was published on November 2013."
  - text: "Dafür sollte die Bibliothek einfach bleiben"
    sources:
      - url: https://console.substack.com/p/console-166
        quote: "Simplicity, I try to keep raylib as simple as possible for the user"
      - url: https://github.com/raysan5/raylib
        quote: "raylib is a simple and easy-to-use library to enjoy videogames programming."
  - text: "ohne fremde Abhängigkeiten"
    sources:
      - url: https://github.com/raysan5/raylib/blob/master/FAQ.md
        quote: "raylib is self-contained, it has no external dependencies to build it."
      - url: https://www.raylib.com/
        quote: "NO external dependencies, all required libraries included with raylib"
  - text: "alle Funktionen passen auf ein Cheatsheet"
    sources:
      - url: https://github.com/raysan5/raylib/blob/master/FAQ.md
        quote: "all of the raylib functionality is exposed in a simple cheatsheet."
      - url: https://github.com/raysan5/raylib
        quote: "there is a cheatsheet containing all the functions available in the library with a short description of each one."
  - text: "Er pflegt raylib bis heute, mit Hunderten Helfenden auf GitHub."
    sources:
      - url: https://github.com/raysan5/raylib/blob/master/FAQ.md
        quote: "The main raylib developer and maintainer is Ramon Santamaria. … there are 360+ contributors that have helped by adding new features."

coast:
  - text: Steve Coast, englischer Informatiker
    note: >-
      Die Wikipedia nennt ihn »British entrepreneur« und »British computer programmer«; er studierte
      Informatik am University College London (nach eigenen Worten ohne Abschluss). »Informatiker« ist
      vertretbar, aufgewachsen ist er in Kent und London.
    sources:
      - url: https://en.wikipedia.org/wiki/Steve_Coast
        quote: "Stephen Coast (born 20 December 1980) is a British entrepreneur … Coast was an intern at Wolfram Research before studying computing science at University College London (UCL)."
      - url: https://techcrunch.com/2024/08/10/one-man-decided-to-take-on-google-maps-20-years-later-openstreetmap-is-still-going-strong/
        quote: "a University College London “dropout” (Coast’s own words)"
  - text: gründete OpenStreetMap 2004 als Student in London
    sources:
      - url: https://wiki.openstreetmap.org/wiki/History_of_OpenStreetMap
        quote: "Steve Coast founded OpenStreetMap in 2004 while attending University College London."
      - url: https://techcrunch.com/2014/08/09/for-the-love-of-open-mapping-data/
        quote: "The project was founded by Steve Coast when he was still a student."
  - text: Gute Karten von Großbritannien gab es nur gegen Geld
    sources:
      - url: https://wiki.openstreetmap.org/wiki/History_of_OpenStreetMap
        quote: "The initial focus was on the United Kingdom, where government-run and tax-funded projects like the Ordnance Survey … created huge data sets … failed to freely and widely distribute them."
  - text: also fuhr er mit einem GPS-Empfänger die Straßen ab
    note: Er fuhr mit dem Fahrrad, die erste Straße nach einer Runde um den Regent's Park.
    sources:
      - url: https://wiki.openstreetmap.org/wiki/History_of_OpenStreetMap
        quote: "The first contribution was a street that Steve entered on 10 December 2004 after cycling around Regent's Park"
      - url: https://techcrunch.com/2014/08/09/for-the-love-of-open-mapping-data/
        quote: "I had a GPS unit attached to my laptop and there wasn't very much you could do with it because there wasn't any data."
  - text: stellte, was er aufzeichnete, frei ins Netz, damit alle es benutzen und weiterzeichnen dürfen, wie bei Wikipedia
    sources:
      - url: https://techcrunch.com/2014/08/09/for-the-love-of-open-mapping-data/
        quote: "Just like Wikipedia was building an encyclopedia in a very similar way, I copied many of the ways Wikipedia was built with"
      - url: https://en.wikipedia.org/wiki/OpenStreetMap
        quote: "freely licensed under the Open Database License"
  - text: "Über zwei Millionen Freiwillige haben schon mitgezeichnet"
    note: "Korrigiert; vorher: »Heute zeichnen Millionen Freiwillige mit«"
    sources:
      - url: https://wiki.openstreetmap.org/wiki/Stats
        quote: "10 million registered users (2025-Q2) … 2.25 million different user contributors (2025-Q2)"
      - url: https://techcrunch.com/2024/08/10/one-man-decided-to-take-on-google-maps-20-years-later-openstreetmap-is-still-going-strong/
        quote: "Today, OpenStreetMap claims more than 10 million contributors."
  - text: auch die Treppen und Fußwege in Berlin
    note: >-
      Korrigiert; vorher: »auch jede Treppe und jeden Fußweg in Berlin«, »jede« lässt sich nicht prüfen. Belegt ist, dass die Berliner Daten rund 11.000 Treppen und über
      200.000 Fußwege enthalten (Taginfo, Oktober 2026).
    sources:
      - url: https://taginfo.geofabrik.de/europe:germany:berlin/api/4/tag/stats?key=highway&value=steps
        quote: "{\"type\":\"ways\",\"count\":11277,\"count_fraction\":0.0084}"
      - url: https://taginfo.geofabrik.de/europe:germany:berlin/api/4/tag/stats?key=highway&value=footway
        quote: "{\"type\":\"ways\",\"count\":208828,\"count_fraction\":0.156}"
  - text: Der Graph, in dem dein Routenplaner sucht, kommt aus dieser Karte.
    none: Workspace

munroe:
  - text: Randall Munroe (geboren 1984), amerikanischer Zeichner.
    sources:
      - url: https://en.wikipedia.org/wiki/Randall_Munroe
        quote: "Randall Patrick Munroe (born October 17, 1984) is an American cartoonist, author, and engineer"
  - text: Bevor er 2006 nur noch Comics zeichnete, programmierte er Roboter für die NASA.
    sources:
      - url: https://xkcd.com/about/
        quote: "Before starting xkcd, I worked on robots at NASA's Langley Research Center in Virginia."
      - url: https://en.wikipedia.org/wiki/Randall_Munroe
        quote: "Munroe worked as a contract programmer and roboticist for NASA at the Langley Research Center … In late 2006, he left NASA, and moved to Boston to focus on webcomics full time."
  - text: Sein Webcomic xkcd handelt von Mathematik, Naturwissenschaft und Programmieren
    sources:
      - url: https://en.wikipedia.org/wiki/Xkcd
        quote: "a webcomic of romance, sarcasm, math, and language … from statements on life and love to mathematical, programming, and scientific in-jokes"
  - text: im Oktober 2007 erschien Nummer 327, »Exploits of a Mom«, mit der Mutter, die ihren Sohn Robert'); DROP TABLE Students;-- genannt hat
    sources:
      - url: https://xkcd.com/327/info.0.json
        quote: "\"month\": \"10\", \"day\": \"10\", \"year\": \"2007\", \"num\": 327, \"title\": \"Exploits of a Mom\""
      - url: https://xkcd.com/327/
        quote: "Did you really name your son \"Robert'); DROP TABLE Students;--\" ? … Oh, yes. Little Bobby Tables, we call him."
  - text: »Little Bobby Tables« ist seitdem eines der bekanntesten Beispiele für SQL Injection.
    sources:
      - url: https://en.wikipedia.org/wiki/SQL_injection
        quote: "A 2007 xkcd cartoon involved a character Robert'); DROP TABLE Students;-- named to carry out an SQL injection. … As a result of this cartoon, SQL injection is sometimes informally referred to as \"Bobby Tables\"."
      - url: https://www.explainxkcd.com/wiki/index.php/327:_Exploits_of_a_Mom
        quote: "has become rather famous … spawning a site at http://bobby-tables.com about preventing SQL injection"
  - text: "Der Name xkcd bedeutet nichts: Munroe wollte ein Wort, das sich nicht abnutzt."
    sources:
      - url: https://xkcd.com/about/
        quote: "It's not actually an acronym. … It's just a word with no phonetic pronunciation -- a treasured and carefully-guarded point in the space of four-character strings."
      - url: https://en.wikipedia.org/wiki/Randall_Munroe
        quote: "a name without a meaning so he would not eventually grow tired of it"
  - text: Fahr auf xkcd.com mit der Maus über einen Comic
    none: Workspace
  - text: "Jeder hat einen zweiten, versteckten Witz."
    sources:
      - url: https://en.wikipedia.org/wiki/Xkcd
        quote: "usually contains an addition or expansion of the joke in the main comic"
  - text: Bei Nummer 327 heißt die Tochter »Help I'm trapped in a driver's license factory«.
    sources:
      - url: https://xkcd.com/327/
        quote: "Her daughter is named Help I'm trapped in a driver's license factory."

harris:
  - text: Rich Harris, britischer Journalist und Programmierer
    note: >-
      Journalist und Programmierer ist belegt (unten). Für »britisch« keine gute Quelle gefunden: nur
      wikitia.com und shapes.inc (beide nicht verlässlich) nennen ihn »British«; in einem Interview mit
      OfferZen sagt er »I took a job working at a financial publication in London.« Gesucht: Wikipedia
      (Seite zu ihm 404), Interviews bei SurviveJS, OfferZen, Vercel, Svelte-Blog. Vom Maintainer zu prüfen.
    sources:
      - url: https://new-openai.conffab.com/speakers/rich-harris
        quote: "Rich Harris works at Vercel and created Rollup and Svelte; … previously an award‑winning visual journalist at the Guardian and The New York Times."
      - url: https://survivejs.com/blog/rollup-interview/
        quote: "a graphics editor at the New York Times, working on the investigations team — part journalist, part developer."
      - url: https://offerzen.com/blog/rich-harris-on-why-he-created-svelte
        quote: "I took a job working at a financial publication in London."
  - text: baute interaktive Grafiken für Zeitungen, erst beim Guardian, dann bei der New York Times
    sources:
      - url: https://www.icp.org/users/rich-harris
        quote: "Rich Harris is an award-winning interactive journalist at theguardian.com's New York office"
      - url: https://survivejs.com/blog/rollup-interview/
        quote: "a graphics editor at the New York Times, working on the investigations team — part journalist, part developer. … a similar job at the Guardian."
  - text: "2016 schrieb er Svelte: keine Bibliothek, die im Browser mitläuft, sondern einen Compiler."
    sources:
      - url: https://svelte.dev/blog/frameworks-without-the-framework
        quote: "Given that, what if the framework didn't actually run in the browser? … But a compiler can do it for you."
      - url: https://api.github.com/repos/sveltejs/svelte
        quote: "2016-11-20T18:13:05Z"
  - text: Wenn du npm run build eingibst
    none: Workspace
  - text: übersetzt Svelte deine .svelte-Dateien in gewöhnliches JavaScript
    sources:
      - url: https://svelte.dev/blog/frameworks-without-the-framework
        quote: "during your build process Svelte compiles them into tiny standalone JavaScript modules. … just vanilla JS that you didn't have to write."
  - text: Vorher hatte er schon Rollup geschrieben, ein Programm, das viele JavaScript-Dateien zu wenigen zusammenpackt.
    sources:
      - url: https://rollupjs.org/introduction/
        quote: "Rollup is a module bundler for JavaScript which compiles small pieces of code into something larger and more complex,"
      - url: https://survivejs.com/blog/rollup-interview/
        quote: "Rollup is a module bundler."
      - url: https://api.github.com/repos/rollup/rollup
        quote: "2015-05-14T22:26:28Z"
  - text: Ende 2021 ging er von der Zeitung zur Firma Vercel, um nur noch an Svelte zu arbeiten.
    sources:
      - url: https://vercel.com/blog/vercel-welcomes-rich-harris-creator-of-svelte
        quote: "Joining Vercel enables Rich to work on Svelte full-time, giving the project its first dedicated contributor."
      - url: https://svelte.dev/blog/accelerating-sveltes-development
        quote: "Rich Harris, Svelte’s creator, has joined Vercel to work on Svelte full-time."

hanrahan:
  - text: (geboren 1955), amerikanischer Informatiker
    sources:
      - url: https://en.wikipedia.org/wiki/Pat_Hanrahan
        quote: "Patrick M. Hanrahan (born May 8, 1955)"
  - text: Als einer der ersten Mitarbeiter von Pixar entwarf er von 1986 bis 1989 RenderMan mit
    sources:
      - url: https://en.wikipedia.org/wiki/Pat_Hanrahan
        quote: "As a founding employee at Pixar Animation Studios, from 1986 to 1989 Hanrahan was part of the design of the RenderMan Interface Specification and the RenderMan Shading Language."
  - text: mit Jim Lawson dessen Shading Language
    sources:
      - url: https://history.siggraph.org/?p=122073
        quote: "“A language for shading and lighting calculations” by Hanrahan and Lawson"
  - text: 2003 gründete er Tableau mit
    sources:
      - url: https://en.wikipedia.org/wiki/Pat_Hanrahan
        quote: "In 2003 Hanrahan co-founded Tableau Software and remains its chief scientist."
  - text: Jeder Shader, den du schreibst, hat seinen Namen aus dieser Sprache.
    none: Workspace
  - text: drei Oscars für technische Leistungen und 2019 mit Edwin Catmull den Turing Award
    sources:
      - url: https://en.wikipedia.org/wiki/Pat_Hanrahan
        quote: "Hanrahan received three Academy Awards for his work in rendering and computer graphics research."
      - url: https://en.wikipedia.org/wiki/Pat_Hanrahan
        quote: "Hanrahan shared the 2019 ACM A.M. Turing Award with Catmull for their pioneering efforts on computer-generated imagery."
