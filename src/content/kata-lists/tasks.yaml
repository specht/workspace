    starter: |
      def two_sum(numbers, target)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "two_sum([2, 7, 11, 15], 9)"
          expect: "[0, 1]"
        - call: "two_sum([3, 2, 4], 6)"
          expect: "[1, 2]"
          say: "Eine Zahl zählt nicht doppelt: `3 + 3` geht nur mit zwei Dreien."
        - call: "two_sum([3, 3], 6)"
          expect: "[0, 1]"
        - call: "two_sum([1, 2, 3], 7)"
          expect: "[]"
        - call: "two_sum([], 1)"
          expect: "[]"
        - call: "two_sum([5, 1, 4, 2], 6)"
          expect: "[0, 1]"
          say: "Am kleinsten `j` erkennt man das erste Paar: `5 + 1`."
    feedback:
      - when: { same_as: "def two_sum(numbers, target)\n  numbers.each_index do |i|\n    numbers.each_index do |j|\n      return [i, j] if numbers[i] + numbers[j] == target\n    end\n  end\n  []\nend\n" }
        say: "Bei `[3, 2, 4]` und 6 nimmt dein Code die 3 zweimal. `j` muss hinter `i` liegen."
    hint:
      - "Zwei Schleifen ineinander: die äußere für `j`, die innere für alle `i` vor `j`."
      - "Mit einem Hash, der sich merkt, welche Zahl an welchem Index stand, geht es mit einer einzigen Schleife. Das kommt bei den Dictionaries."
    solution: |
      ```ruby
      def two_sum(numbers, target)
        (1...numbers.length).each do |j|
          (0...j).each do |i|
            return [i, j] if numbers[i] + numbers[j] == target
          end
        end
        []
      end
      ```
