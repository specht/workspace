  - id: count-even
    title: "Gerade Zahlen zählen"
    level: 1
    prompt: |
      Schreib eine Funktion `count_even(numbers)`, die zählt, wie viele gerade Zahlen in der Liste stehen: `count_even([1, 2, 3, 4])` ergibt `2`.
    starter: |
      def count_even(numbers)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#count, Array#select, Array#filter, Array#reject]
      cases:
        - call: "count_even([1, 2, 3, 4])"
          expect: "2"
        - call: "count_even([1, 3, 5])"
          expect: "0"
        - call: "count_even([])"
          expect: "0"
        - call: "count_even([0, -2, 7])"
          expect: "2"
          say: "0 und -2 sind auch gerade."
        - call: "count_even([2, 2, 2, 2])"
          expect: "4"
    hint:
      - "Zählen wie bei den Vokalen: eine Variable, die bei 0 anfängt. Wann ist eine Zahl gerade?"
      - "`number % 2 == 0` fragt, ob beim Teilen durch 2 nichts übrig bleibt."
    solution: |
      ```ruby
      def count_even(numbers)
        count = 0
        numbers.each do |number|
          count += 1 if number % 2 == 0
        end
        count
      end
      ```
    python:
      starter: |
        def count_even(numbers):
            pass
      check:
        type: function
        language: python
        forbid: [filter]
        cases:
          - call: "count_even([1, 2, 3, 4])"
            expect: "2"
          - call: "count_even([1, 3, 5])"
            expect: "0"
          - call: "count_even([])"
            expect: "0"
          - call: "count_even([0, -2, 7])"
            expect: "2"
            say: "0 und -2 sind auch gerade."
          - call: "count_even([2, 2, 2, 2])"
            expect: "4"
      hint:
        - "Zählen wie bei den Vokalen: eine Variable, die bei 0 anfängt. Wann ist eine Zahl gerade?"
        - "`number % 2 == 0` fragt, ob beim Teilen durch 2 nichts übrig bleibt."
      solution: |
        ```python
        def count_even(numbers):
            count = 0
            for number in numbers:
                if number % 2 == 0:
                    count += 1
            return count
        ```
