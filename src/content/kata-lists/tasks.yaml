  - id: list-max
    title: "Die größte Zahl"
    level: 1
    prompt: |
      Schreib eine Funktion `list_max(numbers)`, die die größte Zahl einer Liste zurückgibt: `list_max([3, 9, 4])` ergibt `9`. Die Liste ist nie leer. Ohne `max` und `sort`.
    starter: |
      def list_max(numbers)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#max, Array#max_by, Array#minmax, Array#sort, Array#sort_by]
      cases:
        - call: "list_max([3, 9, 4])"
          expect: "9"
        - call: "list_max([7])"
          expect: "7"
        - call: "list_max([-3, -1, -7])"
          expect: "-1"
          say: "Lauter negative Zahlen: Die größte ist `-1`."
        - call: "list_max([5, 5, 2])"
          expect: "5"
        - call: "list_max([1, 2, 3, 100])"
          expect: "100"
          say: "Die größte Zahl steht ganz hinten."
    feedback:
      - when: { same_as: "def list_max(numbers)\n  best = 0\n  numbers.each do |number|\n    best = number if number > best\n  end\n  best\nend\n" }
        say: "Fang mit der ersten Zahl der Liste an, nicht mit 0: Bei lauter negativen Zahlen ist 0 gar nicht dabei."
    hint:
      - "Merk dir die bisher größte Zahl in einer Variablen und vergleich jede Zahl mit ihr."
      - "Womit fängst du an? `numbers[0]` ist die Zahl mit dem Index 0, die erste."
    solution: |
      ```ruby
      def list_max(numbers)
        best = numbers[0]
        numbers.each do |number|
          best = number if number > best
        end
        best
      end
      ```
