        Schreib eine Methode `List<List<Integer>> chunks(List<Integer> items, int size)`, die die Liste in Stücke von je `size` Elementen teilt; das letzte Stück darf kürzer sein: `chunks(List.of(1, 2, 3, 4, 5), 2)` ergibt `[[1, 2], [3, 4], [5]]`.
      starter: |
        List<List<Integer>> chunks(List<Integer> items, int size) {
            return new ArrayList<>();
        }
      check:
        type: function
        language: java
        cases:
          - call: "chunks(List.of(1, 2, 3, 4, 5), 2)"
            expect: "List.of(List.of(1, 2), List.of(3, 4), List.of(5))"
            say: "Das letzte Stück darf kürzer sein."
          - call: "chunks(List.of(1, 2, 3, 4), 2)"
            expect: "List.of(List.of(1, 2), List.of(3, 4))"
          - call: "chunks(List.of(), 3)"
            expect: "List.of()"
            say: "Die leere Liste hat keine Stücke."
          - call: "chunks(List.of(1, 2, 3), 5)"
            expect: "List.of(List.of(1, 2, 3))"
          - call: "chunks(List.of(1, 2, 3), 1)"
            expect: "List.of(List.of(1), List.of(2), List.of(3))"
      hint:
        - "Der Anfang jedes Stücks liegt bei den Indizes 0, `size`, `2 * size` … `items.subList(i, ende)` sind die Elemente ab dem Index `i` bis vor `ende`; am Ende darf `ende` nicht hinter der Liste liegen."
        - "Eine Schleife, in der `i` jedes Mal um `size` wächst: `i += size`. Das Ende des Stücks ist `Math.min(i + size, items.size())`."
      solution: |
        ```java
        List<List<Integer>> chunks(List<Integer> items, int size) {
            List<List<Integer>> result = new ArrayList<>();
            for (int i = 0; i < items.size(); i += size) {
                result.add(new ArrayList<>(items.subList(i, Math.min(i + size, items.size()))));
            }
            return result;
        }
        ```
