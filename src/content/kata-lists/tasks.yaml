  - id: merge-sorted
    title: "Zwei sortierte Listen mischen"
    level: 3
    prompt: |
      `a` und `b` sind aufsteigend sortiert. Schreib eine Funktion `merge_sorted(a, b)`, die daraus eine sortierte Liste macht, ohne zu sortieren: Schau immer auf die vorderste Zahl beider Listen und nimm die kleinere. `merge_sorted([1, 4, 6], [2, 3, 7])` ergibt `[1, 2, 3, 4, 6, 7]`.
    starter: |
      def merge_sorted(a, b)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#sort, Array#sort_by, "Array#sort!", Array#min, Array#max]
      cases:
        - call: "merge_sorted([1, 4, 6], [2, 3, 7])"
          expect: "[1, 2, 3, 4, 6, 7]"
        - call: "merge_sorted([], [1, 2])"
          expect: "[1, 2]"
        - call: "merge_sorted([5], [])"
          expect: "[5]"
        - call: "merge_sorted([1, 2], [2, 3])"
          expect: "[1, 2, 2, 3]"
          say: "Gleiche Zahlen kommen beide hinein."
        - call: "merge_sorted([1, 2, 3], [10, 20])"
          expect: "[1, 2, 3, 10, 20]"
          say: "Ist eine Liste zu Ende, gehört der Rest der anderen noch dazu."
        - call: "merge_sorted([8, 9], [1])"
          expect: "[1, 8, 9]"
    feedback:
      - when: { same_as: "def merge_sorted(a, b)\n  result = []\n  i = 0\n  j = 0\n  while i < a.length && j < b.length\n    if a[i] <= b[j]\n      result << a[i]\n      i += 1\n    else\n      result << b[j]\n      j += 1\n    end\n  end\n  result\nend\n" }
        say: "Ist eine Liste zu Ende, hört deine Schleife auf, aber in der anderen stehen noch Zahlen. Die gehören noch dazu."
    hint:
      - "Zwei Zählvariablen, `i` für `a` und `j` für `b`, zeigen auf die vorderste Zahl, die noch nicht im Ergebnis ist. Die kleinere von `a[i]` und `b[j]` kommt hinein, und ihre Zählvariable rückt weiter."
      - "Das geht, solange beide Listen noch Zahlen haben. Was ist danach mit dem Rest? `a[i..]` ist alles ab dem Index `i`."
    solution: |
      ```ruby
      def merge_sorted(a, b)
        result = []
        i = 0
        j = 0
        while i < a.length && j < b.length
          if a[i] <= b[j]
            result << a[i]
            i += 1
          else
            result << b[j]
            j += 1
          end
        end
        result + a[i..] + b[j..]
      end
      ```
