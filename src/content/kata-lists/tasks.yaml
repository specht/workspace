        - "`number % 2 == 0` fragt, ob beim Teilen durch 2 nichts übrig bleibt."
      solution: |
        ```java
        int countEven(List<Integer> numbers) {
            int count = 0;
            for (int number : numbers) {
                if (number % 2 == 0) {
                    count++;
                }
            }
            return count;
        }
        ```

  - id: contains
    title: "Ist es dabei?"
    level: 1
    prompt: |
      Schreib eine Funktion `contains(items, wanted)`, die true zurückgibt, wenn `wanted` in der Liste steht, und sonst false: `contains([4, 8, 15], 8)` ergibt `true`. Mit einer Schleife, ohne `include?` und `index`.
    starter: |
      def contains(items, wanted)
      end
    check:
      type: function
      language: ruby
      forbid: ["Array#include?", "Array#member?", Array#index, Array#find_index, "Array#any?", Array#find]
      cases:
        - call: "contains([4, 8, 15], 8)"
          expect: "true"
        - call: "contains([4, 8, 15], 16)"
          expect: "false"
        - call: "contains([], 1)"
          expect: "false"
          say: "In der leeren Liste steht nichts."
        - call: "contains([4, 8, 15], 15)"
          expect: "true"
          say: "Auch das letzte Element zählt."
        - call: "contains([7], 7)"
          expect: "true"
    feedback:
      - when: { same_as: "def contains(items, wanted)\n  items.each do |item|\n    if item == wanted\n      return true\n    else\n      return false\n    end\n  end\n  false\nend\n" }
        say: "Dein Code entscheidet schon beim ersten Element. `false` steht erst fest, wenn die ganze Liste durch ist: nach der Schleife."
    hint:
      - "Geh die Liste durch. Findest du `wanted`, bist du sofort fertig: `return true` beendet die Funktion mitten in der Schleife."
      - "Und wenn die Schleife zu Ende ist, ohne dass du es gefunden hast?"
    solution: |
      ```ruby
