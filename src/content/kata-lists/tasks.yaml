          - call: "swapEnds(List.of(1, 2))"
            expect: "List.of(2, 1)"
          - call: "swapEnds(List.of(7))"
            expect: "List.of(7)"
            say: "Mit einem Element gibt es nichts zu tauschen."
          - call: "swapEnds(List.of())"
            expect: "List.of()"
            say: "Die leere Liste bleibt leer."
          - call: "swapEnds(List.of(5, 6, 7))"
            expect: "List.of(7, 6, 5)"
      feedback:
        - when: { same_as: "List<Integer> swapEnds(List<Integer> items) {\n    List<Integer> result = new ArrayList<>(items);\n    if (items.size() < 2) {\n        return result;\n    }\n    result.set(0, result.get(result.size() - 1));\n    result.set(result.size() - 1, result.get(0));\n    return result;\n}\n" }
          say: "Nach `result.set(0, …)` ist das erste Element schon überschrieben, und hinten landet wieder das letzte. Nimm die Werte aus der alten Liste, oder merk dir einen vorher."
      hint:
        - "`new ArrayList<>(items)` ist eine Kopie der Liste, die sich ändern lässt. `items.get(items.size() - 1)` ist das letzte Element, `result.set(i, wert)` ersetzt das Element mit dem Index `i`."
        - "Wenn du das Element mit dem Index 0 ersetzt, ist der alte Wert weg. Woher nimmst du ihn für hinten?"
      solution: |
        ```java
        List<Integer> swapEnds(List<Integer> items) {
            List<Integer> result = new ArrayList<>(items);
            if (items.size() < 2) {
                return result;
            }
            result.set(0, items.get(items.size() - 1));
            result.set(items.size() - 1, items.get(0));
            return result;
        }
        ```

