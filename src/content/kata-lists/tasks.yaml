    starter: |
      def remove_duplicates(items)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#uniq, "Array#uniq!", Array#to_set]
      cases:
        - call: "remove_duplicates([3, 1, 3, 2, 1])"
          expect: "[3, 1, 2]"
          say: "Die Reihenfolge bleibt: Jedes Element steht dort, wo es zum ersten Mal vorkam."
        - call: "remove_duplicates([])"
          expect: "[]"
        - call: "remove_duplicates([5, 5, 5])"
          expect: "[5]"
        - call: "remove_duplicates([1, 2, 3])"
          expect: "[1, 2, 3]"
        - call: "remove_duplicates(['b', 'a', 'b'])"
          expect: "['b', 'a']"
    feedback:
      - when: { same_as: "def remove_duplicates(items)\n  result = []\n  items.each_with_index do |item, i|\n    result << item if item != items[i + 1]\n  end\n  result\nend\n" }
        say: "Du vergleichst nur mit dem Nachbarn. Doppelte können auch weit auseinander stehen: Schau nach, ob das Element schon in deinem Ergebnis ist."
