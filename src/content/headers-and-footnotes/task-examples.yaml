# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): Der fertige Bericht (stufen/reisebericht.docx, von
# LibreOffice gebaut) muss die Prüfung bestehen; die Vorlage und derselbe
# Bericht mit festem Datum scheitern. Alle macht dokumente.py.
format: 1
activity: headers-and-footnotes
examples:
  bericht:
    pass:
      - document: stufen/reisebericht.docx
    fail:
      - document: ../../static/headers-and-footnotes/08 Reisebericht.docx
        say: In der Kopfzeile steht »Reisebericht der 7b« noch nicht
      - document: ../../static/headers-and-footnotes/08 Reisebericht.docx
        say: noch kein Datum
      - document: ../../static/headers-and-footnotes/08 Reisebericht.docx
        say: noch keine Fußnote
      - document: ../../static/headers-and-footnotes/08 Reisebericht.docx
        say: von Hand
      - document: stufen/datum-fest.docx
        say: fest
  runde:
    pass:
      - document: stufen/schulgarten.docx
    fail:
      - document: ../../static/headers-and-footnotes/08 Schulgarten.docx
        say: In der Kopfzeile steht »Unser Schulgarten« noch nicht
      - document: ../../static/headers-and-footnotes/08 Schulgarten.docx
        say: noch keine Fußnote
  titel:
    pass:
      - document: stufen/projektmappe.docx
      - document: stufen/projektmappe-libreoffice.docx
    fail:
      - document: ../../static/headers-and-footnotes/08 Projektmappe.docx
        say: Auf der Titelseite stehen noch
      - document: stufen/projektmappe-ohne-anzahl.docx
        say: wie viele Seiten es sind
      - document: stufen/projektmappe-ohne-kopf.docx
        say: fehlen jetzt
  fallen:
    pass:
      - document: stufen/elternbrief.docx
    fail:
      - document: ../../static/headers-and-footnotes/08 Elternbrief.docx
        say: 0 von 13 Fallen gefunden
      - document: stufen/elternbrief-zwoelf.docx
        say: 12 von 13 Fallen gefunden
