  - id: zaehlen
    title: Wer folgt auf wen
    prompt: |
      Schreib in `sprachmodell/model.rb` die Funktion `follow_counts(tokens)`.
      Die Prüfung ruft sie mit kurzen Listen auf und vergleicht das
      Dictionary, das herauskommt.
    check:
      type: ruby
      file: sprachmodell/model.rb
      cases:
        - call: 'follow_counts(["a", "b", "a", "c", "a", "b"]) == { "a" => { "b" => 2, "c" => 1 }, "b" => { "a" => 1 }, "c" => { "a" => 1 } }'
          expect: true
          say: Unter »a« steht zweimal »b« und einmal »c«; das letzte Wort hat keinen Nachfolger und kommt nicht als Schlüssel vor.
        - call: 'follow_counts(["Der", "Wolf", "kam", "."]) == { "Der" => { "Wolf" => 1 }, "Wolf" => { "kam" => 1 }, "kam" => { "." => 1 } }'
          expect: true
        - call: 'follow_counts(["allein"]) == {}'
          expect: true
          say: Ein einziges Wort hat keinen Nachfolger; das Dictionary bleibt leer.
    solution: |
      ```ruby
      def follow_counts(tokens)
        counts = {}
        (0...tokens.size - 1).each do |i|
          word = tokens[i]
          following = tokens[i + 1]
          counts[word] ||= {}
          counts[word][following] = (counts[word][following] || 0) + 1
        end
        counts
      end
      ```
    python:
      prompt: |
        Schreib in `sprachmodell/model.py` die Funktion `follow_counts(tokens)`.
        Die Prüfung ruft sie mit kurzen Listen auf und vergleicht das
        Dictionary, das herauskommt.
      check:
        type: python
        file: sprachmodell/model.py
        cases:
          - call: 'follow_counts(["a", "b", "a", "c", "a", "b"]) == {"a": {"b": 2, "c": 1}, "b": {"a": 1}, "c": {"a": 1}}'
            expect: true
            say: Unter »a« steht zweimal »b« und einmal »c«; das letzte Wort hat keinen Nachfolger und kommt nicht als Schlüssel vor.
          - call: 'follow_counts(["Der", "Wolf", "kam", "."]) == {"Der": {"Wolf": 1}, "Wolf": {"kam": 1}, "kam": {".": 1}}'
            expect: true
          - call: 'follow_counts(["allein"]) == {}'
            expect: true
            say: Ein einziges Wort hat keinen Nachfolger; das Dictionary bleibt leer.
      solution: |
        ```python
        def follow_counts(tokens):
            counts = {}
            for i in range(len(tokens) - 1):
                word = tokens[i]
                following = tokens[i + 1]
                if word not in counts:
                    counts[word] = {}
                counts[word][following] = counts[word].get(following, 0) + 1
            return counts
        ```

