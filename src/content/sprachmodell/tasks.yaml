  - id: wuerfeln
    title: Würfeln nach der Häufigkeit
    prompt: |
      Schreib in `sprachmodell/model.rb` die Funktion `next_word(counts, word)`.
      Die Prüfung zieht 4000-mal aus `{ "a" => 3, "b" => 1 }` und erwartet
      ungefähr dreimal so oft »a« wie »b«, dazu ein Wort mit nur einem
      Nachfolger und eines, das fehlt.
    check:
      type: ruby
      file: sprachmodell/model.rb
      cases:
        - call: '(1..4000).count { next_word({ "x" => { "a" => 3, "b" => 1 } }, "x") == "a" }.between?(2800, 3200)'
          expect: true
          say: Von 4000 Zügen sollen ungefähr 3000 »a« sein, denn »a« wurde dreimal gezählt und »b« einmal.
        - call: '(1..200).all? { %w[a b].include?(next_word({ "x" => { "a" => 3, "b" => 1 } }, "x")) }'
          expect: true
          say: Jeder Zug soll einer der Nachfolger sein, nie nil und nie etwas anderes.
        - call: 'next_word({ "x" => { "a" => 1 } }, "x")'
          expect: '"a"'
        - call: 'next_word({ "x" => { "a" => 1 } }, "y")'
          expect: ~
          say: Für ein Wort, das nie vorkam, kommt nil zurück.
    solution: |
      ```ruby
      def next_word(counts, word)
        return nil unless counts.key?(word)

        r = rand(counts[word].values.sum)
        counts[word].each do |following, count|
          return following if r < count

          r -= count
        end
      end
      ```
    python:
      prompt: |
        Schreib in `sprachmodell/model.py` die Funktion `next_word(counts, word)`.
        Die Prüfung zieht 4000-mal aus `{"a": 3, "b": 1}` und erwartet
        ungefähr dreimal so oft »a« wie »b«, dazu ein Wort mit nur einem
        Nachfolger und eines, das fehlt.
      check:
        type: python
        file: sprachmodell/model.py
        cases:
          - call: '2800 <= sum(next_word({"x": {"a": 3, "b": 1}}, "x") == "a" for _ in range(4000)) <= 3200'
            expect: true
            say: Von 4000 Zügen sollen ungefähr 3000 »a« sein, denn »a« wurde dreimal gezählt und »b« einmal.
          - call: 'all(next_word({"x": {"a": 3, "b": 1}}, "x") in ("a", "b") for _ in range(200))'
            expect: true
            say: Jeder Zug soll einer der Nachfolger sein, nie None und nie etwas anderes.
          - call: 'next_word({"x": {"a": 1}}, "x")'
            expect: "'a'"
          - call: 'next_word({"x": {"a": 1}}, "y")'
            expect: ~
            say: Für ein Wort, das nie vorkam, kommt None zurück.
      solution: |
        ```python
        def next_word(counts, word):
            if word not in counts:
                return None
            r = random.randrange(sum(counts[word].values()))
            for following, count in counts[word].items():
                if r < count:
                    return following
                r -= count
        ```

  - id: schreiben
    title: Ein Märchen schreiben
    prompt: |
      Schreib in `sprachmodell/model.rb` die Funktion `generate(counts, start, n)`.
      Die Prüfung gibt ihr Dictionaries, in denen jedes Wort nur einen
      Nachfolger hat, so dass das Ergebnis feststeht.
    check:
      type: ruby
      file: sprachmodell/model.rb
      cases:
        - call: 'generate({ "a" => { "b" => 1 }, "b" => { "c" => 1 }, "c" => { "a" => 1 } }, "a", 4)'
          expect: '["a", "b", "c", "a", "b"]'
          say: Das Startwort steht vorn, danach kommen n gezogene Wörter.
        - call: 'generate({ "a" => { "b" => 1 } }, "a", 5)'
          expect: '["a", "b"]'
          say: Nach »b« gibt es keinen Nachfolger; dort hört die Liste auf.
        - call: 'generate({}, "a", 3)'
          expect: '["a"]'
    solution: |
      ```ruby
      def generate(counts, start, n)
        tokens = [start]
        n.times do
          following = next_word(counts, tokens.last)
          break if following.nil?

          tokens << following
        end
        tokens
      end
      ```
    python:
      prompt: |
        Schreib in `sprachmodell/model.py` die Funktion `generate(counts, start, n)`.
        Die Prüfung gibt ihr Dictionaries, in denen jedes Wort nur einen
        Nachfolger hat, so dass das Ergebnis feststeht.
      check:
        type: python
        file: sprachmodell/model.py
        cases:
          - call: 'generate({"a": {"b": 1}, "b": {"c": 1}, "c": {"a": 1}}, "a", 4)'
            expect: "['a', 'b', 'c', 'a', 'b']"
            say: Das Startwort steht vorn, danach kommen n gezogene Wörter.
          - call: 'generate({"a": {"b": 1}}, "a", 5)'
            expect: "['a', 'b']"
            say: Nach »b« gibt es keinen Nachfolger; dort hört die Liste auf.
          - call: 'generate({}, "a", 3)'
            expect: "['a']"
      solution: |
        ```python
        def generate(counts, start, n):
            tokens = [start]
            for _ in range(n):
                following = next_word(counts, tokens[-1])
                if following is None:
                    break
                tokens.append(following)
            return tokens
        ```

