# Aufgaben zu »Ein winziges Sprachmodell«, in Ruby und, unter python:, in
# Python. Format: docs/aufgaben.md. Alles liegt in /workspace/sprachmodell.
# Die Zahlen gehören zu maerchen.txt, wie es
# src/scripts/collect-maerchen/collect-maerchen.rb baut.
format: 1
activity: sprachmodell
tasks:
  - id: naechstes-wort
    title: Was folgt auf »Es«?
    prediction: true
    prompt: |
      In den Märchen beginnen viele Sätze mit »Es«. Welches Wort folgt darauf
      am häufigsten?
    check:
      type: choice
      options:
        - war
        - ist
        - kam
        - gibt
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: »Es ist« steht oft in dem, was jemand sagt. Erzählt wird in den Märchen aber in einer anderen Zeit.
      - when: { picked: 2 }
        say: Märchen erzählen in der Vergangenheit, das passt. Nachzählen kannst du gleich selbst.
      - when: { picked: 3 }
        say: »Es gibt« ist heute häufig. In den Märchen wird in der Vergangenheit erzählt.
    solution: |
      »war«, 41-mal: »Es war einmal …«, »Es war ein König …«.

  - id: woerter
    title: Wie viele Wörter?
    prompt: |
      Wie viele Wörter und Satzzeichen findet `words` in den ganzen Märchen?
      Lies dazu `maerchen.txt` ein, ruf `words` damit auf und lass dir die
      Länge der Liste geben.
    check: { type: number, expect: 93581 }
    feedback:
      - when: { equals: 80122 }
        say: So viele Wörter zählt `wc -w`, das Satzzeichen nicht einzeln zählt. Ruf `words` auf.
    hint: |
      In Ruby liest `File.read("maerchen.txt")` die Datei als einen String, in
      Python `open("maerchen.txt").read()`. Die Länge einer Liste gibt
      `.size` in Ruby und `len(…)` in Python.
    solution: |
      93 581: 79 979 Wörter und 13 602 Satzzeichen. In Ruby
      `words(File.read("maerchen.txt")).size`, in Python
      `len(words(open("maerchen.txt").read()))`.

