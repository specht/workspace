  - id: haeufigstes
    title: Das häufigste Wort
    prompt: |
      Schreib in `sprachmodell/model.rb` die Funktion `most_likely(counts, word)`.
      Die Prüfung ruft sie mit kleinen Dictionaries auf, auch mit einem Wort,
      das darin fehlt.
    check:
      type: ruby
      file: sprachmodell/model.rb
      cases:
        - call: 'most_likely({ "Es" => { "war" => 41, "ist" => 21, "trug" => 13 } }, "Es")'
          expect: '"war"'
        - call: 'most_likely({ "a" => { "b" => 1, "c" => 5, "d" => 2 } }, "a")'
          expect: '"c"'
          say: Gesucht ist der Nachfolger mit der größten Anzahl, nicht der erste.
        - call: 'most_likely({ "a" => { "b" => 1 } }, "x")'
          expect: ~
          say: Für ein Wort, das nie vorkam, gibt es keinen Nachfolger; zurück kommt nil.
    solution: |
      ```ruby
      def most_likely(counts, word)
        return nil unless counts.key?(word)

        counts[word].max_by { |following, count| count }[0]
      end
      ```
    python:
      prompt: |
        Schreib in `sprachmodell/model.py` die Funktion `most_likely(counts, word)`.
        Die Prüfung ruft sie mit kleinen Dictionaries auf, auch mit einem Wort,
        das darin fehlt.
      check:
        type: python
        file: sprachmodell/model.py
        cases:
          - call: 'most_likely({"Es": {"war": 41, "ist": 21, "trug": 13}}, "Es")'
            expect: "'war'"
          - call: 'most_likely({"a": {"b": 1, "c": 5, "d": 2}}, "a")'
            expect: "'c'"
            say: Gesucht ist der Nachfolger mit der größten Anzahl, nicht der größte Schlüssel.
          - call: 'most_likely({"a": {"b": 1}}, "x")'
            expect: ~
            say: Für ein Wort, das nie vorkam, gibt es keinen Nachfolger; zurück kommt None.
      solution: |
        ```python
        def most_likely(counts, word):
            if word not in counts:
                return None
            return max(counts[word], key=counts[word].get)
        ```

