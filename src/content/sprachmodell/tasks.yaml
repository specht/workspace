  - id: paare
    title: Zwei Wörter Kontext
    prompt: |
      Schreib in `sprachmodell/model.rb` die Funktion `pair_counts(tokens)`.
      Die Prüfung ruft sie mit kurzen Listen auf und vergleicht das
      Dictionary.
    check:
      type: ruby
      file: sprachmodell/model.rb
      cases:
        - call: 'pair_counts(["a", "b", "c", "a", "b", "d"]) == { "a b" => { "c" => 1, "d" => 1 }, "b c" => { "a" => 1 }, "c a" => { "b" => 1 } }'
          expect: true
          say: Der Schlüssel sind zwei Wörter mit einem Leerzeichen dazwischen, »a b«; gezählt wird das Wort danach.
        - call: 'pair_counts(["a", "b"]) == {}'
          expect: true
          say: Nach zwei Wörtern kommt nichts mehr; es gibt noch kein Paar mit Nachfolger.
    solution: |
      ```ruby
      def pair_counts(tokens)
        counts = {}
        (0...tokens.size - 2).each do |i|
          pair = "#{tokens[i]} #{tokens[i + 1]}"
          following = tokens[i + 2]
          counts[pair] ||= {}
          counts[pair][following] = (counts[pair][following] || 0) + 1
        end
        counts
      end
      ```
    python:
      prompt: |
        Schreib in `sprachmodell/model.py` die Funktion `pair_counts(tokens)`.
        Die Prüfung ruft sie mit kurzen Listen auf und vergleicht das
        Dictionary.
      check:
        type: python
        file: sprachmodell/model.py
        cases:
          - call: 'pair_counts(["a", "b", "c", "a", "b", "d"]) == {"a b": {"c": 1, "d": 1}, "b c": {"a": 1}, "c a": {"b": 1}}'
            expect: true
            say: Der Schlüssel sind zwei Wörter mit einem Leerzeichen dazwischen, »a b«; gezählt wird das Wort danach.
          - call: 'pair_counts(["a", "b"]) == {}'
            expect: true
            say: Nach zwei Wörtern kommt nichts mehr; es gibt noch kein Paar mit Nachfolger.
      solution: |
        ```python
        def pair_counts(tokens):
            counts = {}
            for i in range(len(tokens) - 2):
                pair = tokens[i] + " " + tokens[i + 1]
                following = tokens[i + 2]
                if pair not in counts:
                    counts[pair] = {}
                counts[pair][following] = counts[pair].get(following, 0) + 1
            return counts
        ```

