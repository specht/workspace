<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 226" width="440" height="226" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Aus der Richtung (x, y) wird um 90 Grad nach rechts gedreht (−y, x): dasselbe Dreieck, gedreht; x und y tauschen die Plätze, eines bekommt ein Minus.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raycaster/NAME.svg 880 -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="440" height="226" fill="#ffffff"/>
  <line x1="210.0" y1="40.0" x2="357.2" y2="40.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="357.2" y1="40.0" x2="357.2" y2="125.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="283.6" y="30.0" font-size="16" fill="#6b7280" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">x</text>
  <text x="365.2" y="87.5" font-size="16" fill="#6b7280" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">y</text>
  <line x1="210.0" y1="40.0" x2="125.0" y2="40.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="125.0" y1="40.0" x2="125.0" y2="187.2" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="167.5" y="30.0" font-size="16" fill="#6b7280" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">−y</text>
  <text x="117.0" y="118.6" font-size="16" fill="#6b7280" text-anchor="end" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">x</text>
  <polyline points="222.1,47.0 215.1,59.1 203.0,52.1" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="210.0" y1="40.0" x2="357.2" y2="125.0" stroke="#2b5fb4" stroke-width="3" marker-end="url(#a-blue)"/>
  <line x1="210.0" y1="40.0" x2="125.0" y2="187.2" stroke="#dc2626" stroke-width="3" marker-end="url(#a-red)"/>
  <text x="353.2" y="151.0" font-size="16" fill="#2b5fb4" text-anchor="middle">vorwärts: (x, y)</text>
  <text x="129.0" y="213.2" font-size="16" fill="#dc2626" text-anchor="middle">nach rechts: (−y, x)</text>
  <circle cx="210.0" cy="40.0" r="7.0" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
