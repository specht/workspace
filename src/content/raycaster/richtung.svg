<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Die Blickrichtung aus dem Winkel: ein Pfeil der Länge 1, cos(player_angle) nach rechts, sin(player_angle) nach unten; y zeigt nach unten, ein größerer Winkel dreht im Uhrzeigersinn.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raycaster/NAME.svg 800 -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="400" height="180" fill="#ffffff"/>
  <line x1="50.0" y1="52.0" x2="247.5" y2="52.0" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="50.0" y1="52.0" x2="207.5" y2="52.0" stroke="#dc2626" stroke-width="3"/>
  <line x1="207.5" y1="52.0" x2="207.5" y2="158.2" stroke="#16a34a" stroke-width="3"/>
  <polyline points="197.5,52.0 197.5,62.0 207.5,62.0" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="128.8" y="40.0" font-size="15" fill="#dc2626" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">cos(player_angle)</text>
  <text x="217.5" y="110.1" font-size="15" fill="#16a34a" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">sin(player_angle)</text>
  <path d="M108.0,52.0 A58,58 0 0 1 98.1,84.4" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="118.0" y="78.0" font-size="15" fill="#6b7280" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">player_angle</text>
  <line x1="50.0" y1="52.0" x2="207.5" y2="158.2" stroke="#2b5fb4" stroke-width="3" marker-end="url(#a-blue)"/>
  <text x="124.6" y="132.4" font-size="16" fill="#2b5fb4" text-anchor="end">Länge 1</text>
  <circle cx="50.0" cy="52.0" r="7.0" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <line x1="330.0" y1="20.0" x2="370.0" y2="20.0" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/>
  <text x="378.0" y="25.0" font-size="16" fill="#dc2626" text-anchor="start">x</text>
  <line x1="330.0" y1="20.0" x2="330.0" y2="58.0" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/>
  <text x="322.0" y="58.0" font-size="16" fill="#16a34a" text-anchor="end">y</text>
</svg>
