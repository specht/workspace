  <!-- Von oben: ein Wandkästchen. Ein Strahl von links trifft seine linke Seite bei hit.y = 1,35, dort ist u = 0,35; ein Strahl von unten trifft die untere Seite bei hit.x = 1,6, dort ist u = 0,6. u läuft an jeder Seite von 0 bis 1.
