# Aufgaben zu »Raycasting in C«.
# Format: docs/aufgaben.md. Gearbeitet wird in /workspace/raycaster.
# Alle Aufgaben prüfen Antworten: Rechnungen mit den Formeln der Seite,
# Vorhersagen und eine Rückmeldung zur eigenen Welt. Den Code an den Stellen
# »Erst selbst« schreiben die Lernenden selbst; geprüft wird er nicht.
format: 1
activity: raycaster
tasks:
  - id: kamera
    title: Deine Kamera
    prompt: |
      Schreib den Rumpf von `update_camera` in `raycaster.c` und speichere.
      Der Workspace dreht die Figur und sieht nach, wohin `dir` und `plane`
      zeigen.
    file: raycaster/raycaster.c
    check:
      type: c
      file: raycaster/raycaster.c
      tolerance: 0.001
      cases:
        - (player_angle = 0, update_camera(), dir_x): 1
        - call: (player_angle = 0, update_camera(), plane_y)
          expect: 0.89
          say: '`plane` zeigt nach links, oder ist nicht `PLANE` lang. Nach rechts gedreht wird aus `(x, y)` der Vektor `(−y, x)`.'
        - (player_angle = 0, update_camera(), plane_x): 0
        - call: (player_angle = 1.5707963, update_camera(), plane_x)
          expect: -0.89
          say: Schaut die Figur nach unten (y wächst nach unten), zeigt rechts von ihr zu kleinerem x.
        - call: (player_angle = 0.5, update_camera(), plane_x * dir_x + plane_y * dir_y)
          expect: 0
          say: '`plane` steht noch nicht senkrecht auf `dir`: Ihr Skalarprodukt müsste 0 sein.'

  - id: delta
    title: Von Linie zu Linie
    prompt: |
      Ein Strahl hat `ray_x = 0.5`. Um wie viel wächst `t`, bis er von einer
      senkrechten Gitterlinie zur nächsten kommt? Das ist `delta_x`.
    check:
      type: number
      expect: 2
      tolerance: 0.001
    feedback:
      - when: { equals: 0.5 }
        say: Das ist `ray_x` selbst. Mit `t` wächst x um `t · ray_x`; damit x um 1 wächst, muss `t` um `1 / ray_x` wachsen.
    hint: 'Ein Punkt auf dem Strahl hat die x-Koordinate `player_x + t · ray_x`. Wie groß muss `t` werden, damit sie um genau 1 wächst?'
    solution: '`delta_x = |1 / ray_x| = 1 / 0.5 = 2`. Der Strahl ist flach in x-Richtung unterwegs; er braucht ein `t` von 2 für jedes Kästchen nach rechts.'

  - id: fischauge
    title: Warum biegen sich die Wände?
    prediction: true
    prompt: |
      Die Figur steht gerade vor einer geraden Wand, aber im Bild biegt sich
      die Wand zu den Rändern hin nach unten. Woran liegt das?
    check:
      type: choice
      options:
        - 'Der direkte Abstand zum Treffpunkt ist für die Strahlen am Rand größer als für den in der Mitte, also wird die Wand dort niedriger gezeichnet.'
        - 'Die DDA rundet beim Springen von Linie zu Linie, und die Fehler werden zum Rand hin größer.'
        - 'Die Kamera-Ebene ist zu lang; mit einem kleineren PLANE wären die Wände gerade.'
        - '`H / distance` ist die falsche Formel; richtig wäre `H / (distance · distance)`.'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Die DDA rechnet den Treffpunkt genau aus, ohne zu runden. Sieh dir an, wie lang die Strahlen zur Mitte und zum Rand derselben Wand sind.
      - when: { picked: 2 }
        say: Mit kleinerem `PLANE` ist die Wölbung schwächer, aber sie bleibt. Der Grund liegt im Abstand selbst.
      - when: { picked: 3 }
        say: Etwas, das doppelt so weit weg ist, erscheint halb so groß, nicht ein Viertel so groß.
    solution: 'Der direkte Abstand wächst zum Rand hin, auch wenn die Wand überall gleich weit vor der Figur steht. Unser Auge misst, wie weit etwas vor uns liegt: den Abstand entlang der Blickrichtung. Den liefert das Skalarprodukt mit `dir`.'

  - id: kollision
    title: Dein is_free
    prompt: |
      Schreib `is_free` in `raycaster.c` und speichere. Der Workspace stellt
      die Figur an ein paar Stellen der Karte und fragt, ob sie dort passt.
    file: raycaster/raycaster.c
    check:
      type: c
      file: raycaster/raycaster.c
      cases:
        - is_free(3.5, 3.5) != 0: true
        - call: is_free(1.2, 3.5) != 0
          expect: false
          say: Links ragt die Figur in die Wand am Rand.
        - call: is_free(1.3, 3.5) != 0
          expect: true
          say: Die Figur reicht nur `PLAYER_RADIUS` weit; die Wand am Rand berührt sie hier noch nicht.
        - call: is_free(10.8, 1.8) != 0
          expect: false
          say: Nur die Ecke rechts unten steht in der Säule. Prüfst du alle vier Ecken?
        - call: is_free(12.2, 3.2) != 0
          expect: false
          say: Nur die Ecke links oben steht in der Säule. Prüfst du alle vier Ecken?
        - is_free(11.5, 2.5) != 0: false

  - id: gleiten
    title: Schräg gegen die Wand
    prediction: true
    prompt: |
      `move_player` könnte den neuen Ort auch auf einmal prüfen:
      `if (is_free(player_x + dx, player_y + dy))` und dann beide
      Koordinaten ändern. Was passiert dann, wenn die Figur schräg gegen eine
      Wand läuft?
    check:
      type: choice
      options:
        - Sie bleibt an der Wand stehen, solange du schräg dagegen läufst.
        - Sie gleitet an der Wand entlang.
        - Sie läuft durch die Wand hindurch.
        - Sie prallt von der Wand zurück.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: 'Der neue Ort liegt schräg vor der Figur, ein Stück in der Wand. `is_free` sagt also für den ganzen Schritt nein. Welche Koordinate ändert sich dann?'
      - when: { picked: 2 }
        say: '`is_free` prüft den neuen Ort, bevor sich die Figur bewegt; liegt er in der Wand, bewegt sie sich gar nicht.'
      - when: { picked: 3 }
        say: 'Nichts in `move_player` bewegt die Figur rückwärts. Sie macht entweder den Schritt oder keinen.'
    solution: 'Der schräge Schritt führt ein Stück in die Wand, also lehnt `is_free` ihn ab, und die Figur bewegt sich gar nicht, obwohl ein Teil der Bewegung, entlang der Wand, frei wäre. Darum prüft `move_player` x und y getrennt: Dann wird nur der Teil abgelehnt, der in die Wand führt.'

  - id: lut
    title: Nachgeschlagen
    prompt: |
      Ziegel ist der Farbton `BRICK` = 1, die volle Ziegelfarbe also
      `COLOR(1, 15)` = 31. Welche Nummer steht in `shade[8][31]`?
    check:
      type: number
      expect: 24
    feedback:
      - when: { equals: 8 }
        say: 8 ist die Helligkeit, die Farbe hat aber auch ihren Farbton. Die Nummer ist `ramp · 16 + level`.
      - when: { equals: 23 }
        say: Fast. `level * light / 15` ist `15 * 8 / 15 = 8`, also `COLOR(1, 8)`.
      - when: { equals: 248 }
        say: Rechne `COLOR(1, 8) = 1 · 16 + 8`.
    hint: 'In `setup_palette`: `ramp = color / LEVELS`, `level = color % LEVELS`, und `shade[light][color] = COLOR(ramp, level * light / 15)`.'
    solution: '`31 / 16 = 1` (Ziegel), `31 % 16 = 15`, also `COLOR(1, 15 · 8 / 15) = COLOR(1, 8) = 16 + 8 = 24`: derselbe Ziegel mit etwa halber Helligkeit.'

  - id: stufen
    title: Wie dunkel wird es?
    prediction: true
    prompt: |
      Boden und Decke werden jetzt zum Horizont hin dunkler, jede Bildzeile
      mit `shaded(color, light)`. Wie sieht der Übergang aus, wenn du das
      Programm gleich startest?
    check:
      type: choice
      options:
        - Ein glatter Verlauf ohne sichtbare Grenzen.
        - Streifen mit deutlichen Kanten zwischen den Helligkeiten.
        - Nur zwei Helligkeiten, hell vorn und schwarz hinten.
        - Jede Bildzeile hat eine andere Farbe.
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: 'Wie viele verschiedene Helligkeiten kann `shaded` aus der Schattentabelle holen?'
      - when: { picked: 2 }
        say: '`light_at` liefert Werte zwischen 0 und 1, und `shaded` macht daraus eine von 16 Stufen, nicht nur zwei.'
      - when: { picked: 3 }
        say: 'Es gibt mehr Bildzeilen als Helligkeiten. Was macht `shaded` mit zwei fast gleichen Werten von `light`?'
    solution: '`shaded` rundet `light` auf eine von 16 Stufen der Palette. Viele Bildzeilen nebeneinander bekommen dieselbe Stufe, und wo die nächste beginnt, sieht man eine Kante. Am Ende der Seite verschwinden die Stufen.'

  - id: zeile
    title: Wie weit ist der Boden?
    prompt: |
      Das Bild ist `H = 180` Pixel hoch. Wie weit ist der Boden in der
      Bildzeile `y = 135` von der Figur entfernt, also `row_distance(135)`?
      Gib den Abstand in Kästchen an.
    check:
      type: number
      expect: 1.978
      tolerance: 0.01
    feedback:
      - when: { between: [2, 2.0001] }
        say: Fast. `row_distance` rechnet mit der Mitte der Zeile, `y + 0.5`.
    hint: '`row_distance(y) = 0.5 · H / |y + 0.5 − H/2|`.'
    solution: '`0.5 · 180 / |135.5 − 90| = 90 / 45.5 ≈ 1.98`: Diese Zeile, ein Viertel des Bildes über dem unteren Rand, zeigt den Boden knapp zwei Kästchen vor der Figur.'

  - id: palette
    title: So viel Dunkel
    prompt: |
      In der Palette von `palette.rb` stehen sehr viele fast schwarze und
      graue Farben, obwohl die Texturen hell und bunt sind. Warum?
    check:
      type: choice
      options:
        - 'Jede der 40 Grundfarben bekommt 16 Helligkeiten bis hinunter zu Schwarz. Je dunkler, desto ähnlicher werden sich die Farben, und die Schattentabelle braucht für jede Helligkeit eine passende Farbe.'
        - 'Das Werkzeug füllt die Palette mit Schwarz auf, weil die Texturen weniger als 256 Farben haben.'
        - 'Die Karte braucht so viele dunkle Farben für ihren durchsichtigen Hintergrund.'
        - 'PixelRAM kann helle Farben nur ungenau darstellen und nimmt lieber dunkle.'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: 'Aufgefüllt wird nur, wenn weniger als 240 Farben übrig bleiben. Aus den Rampen kommen aber 640 Farben, und davon bleiben 240.'
      - when: { picked: 2 }
        say: Die Karte nimmt dafür `shade[4]`, also Farben, die schon in der Palette sind.
      - when: { picked: 3 }
        say: PixelRAM zeigt jede der 256 Farben genau so, wie sie in der Palette steht.
    solution: 'In `2-rampen.png` hat jede Grundfarbe 16 Stufen, von Schwarz bis zur vollen Farbe. Die dunklen Stufen aller Farben liegen nah beieinander, und viele Texel in der Ferne zeigen genau diese Stufen. Die Palette bekommt deshalb viele dunkle Farben, und weil sich Ziegelrot und Moosgrün ganz dunkel kaum unterscheiden, fasst sie sie zu fast grauen zusammen.'

  - id: eigene-welt
    title: Deine Welt
    prompt: |
      Bau dir eine eigene Welt: eine andere Karte, eine neue Wandart, eine
      eigene Textur oder eine der Ideen von oben. Beschreibe in zwei, drei
      Sätzen, was du gebaut hast und was dabei schwierig war.
    check:
      type: reflection
