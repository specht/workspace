# Aufgaben zu »Raycasting in C«.
# Format: docs/aufgaben.md. Gearbeitet wird in /workspace/raycaster.
# Den Code in den Kästen »Jetzt bist du dran« schreiben die Lernenden
# selbst. Eine Aufgabe vom Typ c prüft ihn (kamera, march, gerade,
# kollision, textur-u, mipmap): Sie übersetzt raycaster.c und ruft die
# Funktion auf; gerade und textur-u rufen draw_view mit einem eigenen
# set_pixel auf.
# Die übrigen Aufgaben prüfen Antworten: Rechnungen mit den Formeln der
# Seite, Vorhersagen und eine Rückmeldung zur eigenen Welt.
format: 1
activity: raycaster
tasks:
  - id: kamera
    title: Deine Kamera
    prompt: |
      Schreib den Rumpf von `update_camera` in `raycaster.c` und speichere.
      Der Workspace dreht die Figur und sieht nach, wohin `dir` und `plane`
      zeigen.
    file: raycaster/raycaster.c
    check:
      type: c
      file: raycaster/raycaster.c
      tolerance: 0.001
      cases:
        - (player_angle = 0, update_camera(), dir_x): 1
        - call: (player_angle = 0, update_camera(), plane_y)
          expect: 0.89
          say: '`plane` zeigt nach links, oder ist nicht `PLANE` lang. Nach rechts gedreht wird aus `(x, y)` der Vektor `(−y, x)`.'
        - (player_angle = 0, update_camera(), plane_x): 0
        - call: (player_angle = 1.5707963, update_camera(), plane_x)
          expect: -0.89
          say: Schaut die Figur nach unten (y wächst nach unten), zeigt rechts von ihr zu kleinerem x.
        - call: (player_angle = 0.5, update_camera(), plane_x * dir_x + plane_y * dir_y)
          expect: 0
          say: '`plane` steht noch nicht senkrecht auf `dir`: Ihr Skalarprodukt müsste 0 sein.'

  - id: march
    title: Dein march
    prompt: |
      Schreib `march` in `raycaster.c` und speichere. Der Workspace schickt
      von ein paar Stellen der Karte Strahlen los und misst, wie weit sie
      kommen. Prüf es, bevor `cast_ray` gleich `march` ersetzt.
    file: raycaster/raycaster.c
    check:
      type: c
      file: raycaster/raycaster.c
      tolerance: 0.05
      cases:
        - call: march(1, 0)
          expect: 19.5
          say: 'Die Figur steht bei (3,5; 3,5); nach rechts fängt die Wand bei x = 23 an, 19,5 Kästchen weit weg.'
        - call: march(0, 1)
          expect: 3.5
          say: 'Nach unten (y wächst nach unten) fängt die Wand bei y = 7 an, 3,5 Kästchen weit weg.'
        - call: march(2, 0)
          expect: 19.5
          say: 'Der Strahl `(2, 0)` ist doppelt so lang wie `(1, 0)`, zeigt aber in dieselbe Richtung und trifft dieselbe Wand. Teilst du durch seine Länge `hypot(ray_x, ray_y)`?'
        - call: (player_x = 9.5, player_y = 2.5, march(1, 0))
          expect: 1.5
          say: 'Hier steht die Figur bei (9,5; 2,5), und die Wand rechts fängt bei x = 11 an. Fängt der Strahl bei `player_x` und `player_y` an?'
        - call: march(1, 1)
          expect: 4.95
          say: 'Schräg nach rechts unten kommt der Strahl bis zur Ecke bei (7, 7), √(3,5² + 3,5²) ≈ 4,95 Kästchen weit. Gehst du in x und y zugleich?'

  - id: delta
    title: Von Linie zu Linie
    prompt: |
      Ein Strahl hat `ray_x = 0.5`. Um wie viel wächst `t`, bis er von einer
      senkrechten Gitterlinie zur nächsten kommt? Das ist `delta_x`.
    check:
      type: number
      expect: 2
      tolerance: 0.001
    feedback:
      - when: { equals: 0.5 }
        say: Das ist `ray_x` selbst. Mit `t` wächst x um `t · ray_x`; damit x um 1 wächst, muss `t` um `1 / ray_x` wachsen.
    hint: 'Ein Punkt auf dem Strahl hat die x-Koordinate `player_x + t · ray_x`. Wie groß muss `t` werden, damit sie um genau 1 wächst?'
    solution: '`delta_x = |1 / ray_x| = 1 / 0.5 = 2`. Der Strahl ist flach in x-Richtung unterwegs; er braucht ein `t` von 2 für jedes Kästchen nach rechts.'

  - id: fischauge
    title: Warum biegen sich die Wände?
    prediction: true
    prompt: |
      Die Figur steht gerade vor einer geraden Wand, aber im Bild biegt sich
      die Wand zu den Rändern hin nach unten. Woran liegt das?
    check:
      type: choice
      options:
        - 'Der direkte Abstand zum Treffpunkt ist für die Strahlen am Rand größer als für den in der Mitte, also wird die Wand dort niedriger gezeichnet.'
        - 'Die DDA rundet beim Springen von Linie zu Linie, und die Fehler werden zum Rand hin größer.'
        - 'Die Kamera-Ebene ist zu lang; mit einem kleineren PLANE wären die Wände gerade.'
        - '`H / distance` ist die falsche Formel; richtig wäre `H / (distance · distance)`.'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Die DDA rechnet den Treffpunkt genau aus, ohne zu runden. Sieh dir an, wie lang die Strahlen zur Mitte und zum Rand derselben Wand sind.
      - when: { picked: 2 }
        say: Mit kleinerem `PLANE` ist die Wölbung schwächer, aber sie bleibt. Der Grund liegt im Abstand selbst.
      - when: { picked: 3 }
        say: Etwas, das doppelt so weit weg ist, erscheint halb so groß, nicht ein Viertel so groß.
    solution: 'Der direkte Abstand wächst zum Rand hin, auch wenn die Wand überall gleich weit vor der Figur steht. Unser Auge misst, wie weit etwas vor uns liegt: den Abstand entlang der Blickrichtung. Den liefert das Skalarprodukt mit `dir`.'

  - id: gerade
    title: Dein Abstand entlang der Blickrichtung
    prompt: |
      Rechne `distance` in `draw_view` mit dem Skalarprodukt aus und speichere.
      Der Workspace stellt die Figur gerade vor eine Wand und zählt, wie hoch
      `draw_view` sie in der Mitte und an den Rändern zeichnet.
    file: raycaster/raycaster.c
    check:
      type: c
      file: raycaster/raycaster.c
      tolerance: 1
      setup: |
        // zählt, wie viele Pixel draw_view in jede Spalte setzt
        static int column_pixels[W];
        void set_pixel(int x, int y, uint8_t index)
        {
            (void)y;
            (void)index;
            if (x >= 0 && x < W)
                column_pixels[x]++;
        }

        // die Figur bei (x, y) mit dem Winkel angle: wie viele Pixel hoch ist
        // die Wand in dieser Spalte? Decke und Boden sind zusammen H Pixel.
        int wall_pixels(double x, double y, double angle, int column)
        {
            player_x = x;
            player_y = y;
            player_angle = angle;
            update_camera();
            memset(column_pixels, 0, sizeof column_pixels);
            draw_view();
            return column_pixels[column] - H;
        }
      cases:
        - call: wall_pixels(3.5, 3.5, 3.14159265, 160)
          expect: 72
          say: 'Die Figur steht 2,5 Kästchen vor der Wand am linken Rand und schaut sie an: In der Mitte ist die Wand `H / 2.5`, also 72 Pixel hoch. Beginnt dein Vektor bei der Figur, mit `hit.x - player_x`?'
        - call: wall_pixels(3.5, 3.5, 3.14159265, 0)
          expect: 72
          say: 'Am linken Rand des Bildes ist die Wand niedriger als in der Mitte, obwohl sie gerade vor der Figur steht. Der Abstand soll das Skalarprodukt mit `dir` sein, nicht der direkte Weg.'
        - call: wall_pixels(3.5, 3.5, 3.14159265, 319)
          expect: 72
          say: 'Am rechten Rand des Bildes ist die Wand anders hoch als in der Mitte. Der Abstand soll das Skalarprodukt mit `dir` sein, nicht der direkte Weg.'
        - call: wall_pixels(3.5, 3.5, -1.5707963, 0)
          expect: 72
          say: 'Schaut die Figur nach oben, zur Wand bei y = 1, stimmt die Höhe nicht. Zählen in deinem Skalarprodukt die x-Anteile und die y-Anteile, jeweils vom Treffpunkt minus der Position der Figur?'

  - id: kollision
    title: Dein is_free
    prompt: |
      Schreib `is_free` in `raycaster.c` und speichere. Der Workspace stellt
      die Figur an ein paar Stellen der Karte und fragt, ob sie dort passt.
    file: raycaster/raycaster.c
    check:
      type: c
      file: raycaster/raycaster.c
      cases:
        - is_free(3.5, 3.5) != 0: true
        - call: is_free(1.2, 3.5) != 0
          expect: false
          say: Links ragt die Figur in die Wand am Rand.
        - call: is_free(1.3, 3.5) != 0
          expect: true
          say: Die Figur reicht nur `PLAYER_RADIUS` weit; die Wand am Rand berührt sie hier noch nicht.
        - call: is_free(10.8, 1.8) != 0
          expect: false
          say: Nur die Ecke rechts unten steht in der Säule. Prüfst du alle vier Ecken?
        - call: is_free(12.2, 3.2) != 0
          expect: false
          say: Nur die Ecke links oben steht in der Säule. Prüfst du alle vier Ecken?
        - is_free(11.5, 2.5) != 0: false

  - id: gleiten
    title: Schräg gegen die Wand
    prediction: true
    prompt: |
      `move_player` könnte den neuen Ort auch auf einmal prüfen:
      `if (is_free(player_x + dx, player_y + dy))` und dann beide
      Koordinaten ändern. Was passiert dann, wenn die Figur schräg gegen eine
      Wand läuft?
    check:
      type: choice
      options:
        - Sie bleibt an der Wand stehen, solange du schräg dagegen läufst.
        - Sie gleitet an der Wand entlang.
        - Sie läuft durch die Wand hindurch.
        - Sie prallt von der Wand zurück.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: 'Der neue Ort liegt schräg vor der Figur, ein Stück in der Wand. `is_free` sagt also für den ganzen Schritt nein. Welche Koordinate ändert sich dann?'
      - when: { picked: 2 }
        say: '`is_free` prüft den neuen Ort, bevor sich die Figur bewegt; liegt er in der Wand, bewegt sie sich gar nicht.'
      - when: { picked: 3 }
        say: 'Nichts in `move_player` bewegt die Figur rückwärts. Sie macht entweder den Schritt oder keinen.'
    solution: 'Der schräge Schritt führt ein Stück in die Wand, also lehnt `is_free` ihn ab, und die Figur bewegt sich gar nicht, obwohl ein Teil der Bewegung, entlang der Wand, frei wäre. Darum prüft `move_player` x und y getrennt: Dann wird nur der Teil abgelehnt, der in die Wand führt.'

  - id: lut
    title: Nachgeschlagen
    prompt: |
      Ziegel ist der Farbton `BRICK` = 1, die volle Ziegelfarbe also
      `COLOR(1, 15)` = 31. Welche Nummer steht in `shade[8][31]`?
    check:
      type: number
      expect: 24
    feedback:
      - when: { equals: 8 }
        say: 8 ist die Helligkeit, die Farbe hat aber auch ihren Farbton. Die Nummer ist `ramp · 16 + level`.
      - when: { equals: 23 }
        say: Fast. `level * light / 15` ist `15 * 8 / 15 = 8`, also `COLOR(1, 8)`.
      - when: { equals: 248 }
        say: Rechne `COLOR(1, 8) = 1 · 16 + 8`.
    hint: 'In `setup_palette`: `ramp = color / LEVELS`, `level = color % LEVELS`, und `shade[light][color] = COLOR(ramp, level * light / 15)`.'
    solution: '`31 / 16 = 1` (Ziegel), `31 % 16 = 15`, also `COLOR(1, 15 · 8 / 15) = COLOR(1, 8) = 16 + 8 = 24`: derselbe Ziegel mit etwa halber Helligkeit.'

  - id: stufen
    title: Wie dunkel wird es?
    prediction: true
    prompt: |
      Boden und Decke werden jetzt zum Horizont hin dunkler, jede Bildzeile
      mit `shaded(color, light)`. Wie sieht der Übergang aus, wenn du das
      Programm gleich startest?
    check:
      type: choice
      options:
        - Ein glatter Verlauf ohne sichtbare Grenzen.
        - Streifen mit deutlichen Kanten zwischen den Helligkeiten.
        - Nur zwei Helligkeiten, hell vorn und schwarz hinten.
        - Jede Bildzeile hat eine andere Farbe.
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: 'Wie viele verschiedene Helligkeiten kann `shaded` aus der Schattentabelle holen?'
      - when: { picked: 2 }
        say: '`light_at` liefert Werte zwischen 0 und 1, und `shaded` macht daraus eine von 16 Stufen, nicht nur zwei.'
      - when: { picked: 3 }
        say: 'Es gibt mehr Bildzeilen als Helligkeiten. Was macht `shaded` mit zwei fast gleichen Werten von `light`?'
    solution: '`shaded` rundet `light` auf eine von 16 Stufen der Palette. Viele Bildzeilen nebeneinander bekommen dieselbe Stufe, und wo die nächste beginnt, sieht man eine Kante. Am Ende der Seite verschwinden die Stufen.'

  - id: zeile
    title: Wie weit ist der Boden?
    prompt: |
      Das Bild ist `H = 180` Pixel hoch. Wie weit ist der Boden in der
      Bildzeile `y = 135` von der Figur entfernt, also `row_distance(135)`?
      Gib den Abstand in Kästchen an.
    check:
      type: number
      expect: 1.978
      tolerance: 0.01
    feedback:
      - when: { between: [2, 2.0001] }
        say: Fast. `row_distance` rechnet mit der Mitte der Zeile, `y + 0.5`.
    hint: '`row_distance(y) = 0.5 · H / |y + 0.5 − H/2|`.'
    solution: '`0.5 · 180 / |135.5 − 90| = 90 / 45.5 ≈ 1.98`: Diese Zeile, ein Viertel des Bildes über dem unteren Rand, zeigt den Boden knapp zwei Kästchen vor der Figur.'

  - id: textur-u
    title: Dein u
    prompt: |
      Rechne `u` in `draw_view` aus, gib es mit der Zeile unter dem Kasten an
      `draw_wall_column` weiter und speichere. Der Workspace gibt jeder Spalte
      der Textur ihre Nummer als Farbe und sieht nach, welche Spalte der
      Textur `draw_view` mitten im Bild zeichnet.
    file: raycaster/raycaster.c
    check:
      type: c
      file: raycaster/raycaster.c
      setup: |
        // merkt sich die Farbe, die draw_view in der Bildmitte setzt
        static int middle_color[W];
        void set_pixel(int x, int y, uint8_t index)
        {
            if (x >= 0 && x < W && y == H / 2)
                middle_color[x] = index;
        }

        // Jedes Texel hat als Farbe die Nummer seiner Spalte in der Textur,
        // und das Licht ändert keine Farbe. Welche Spalte der Textur
        // zeichnet draw_view in der Mitte des Bildes?
        int texture_column(double x, double y, double angle)
        {
            for (int t = 0; t < TEXTURES; t++)
                for (int ty = 0; ty < TEX; ty++)
                    for (int tx = 0; tx < TEX; tx++)
                        texture[t][ty][tx] = tx;
        #ifdef MIP_LEVELS
            // mit Mipmaps: die Stufe 0 bekommt dieselben Nummern, und es
            // bleibt bei Stufe 0
            for (int t = 0; t < TEXTURES; t++)
                for (int ty = 0; ty < TEX; ty++)
                    for (int tx = 0; tx < TEX; tx++)
                        mip[t][0][ty][tx] = tx;
            use_mipmaps = false;
        #endif
            for (int light = 0; light < LEVELS; light++)
                for (int color = 0; color < 256; color++)
                    shade[light][color] = color;
            player_x = x;
            player_y = y;
            player_angle = angle;
            update_camera();
            draw_view();
            return middle_color[W / 2];
        }
      cases:
        - call: texture_column(5.5, 2.3, 0)
          expect: 19
          say: 'Die Figur schaut nach rechts auf die Wand bei x = 7 und trifft sie bei `hit.y` ≈ 2,30. Der Nachkommateil 0,30 ist Spalte 19 von 64 der Textur. Nimmst du bei `hit.side == 0` den Nachkommateil von `hit.y`?'
        - call: texture_column(5.6, 3.5, -1.5707963)
          expect: 38
          say: 'Die Figur schaut nach oben auf die Wand bei y = 1 und trifft sie bei `hit.x` ≈ 5,61. Der Nachkommateil 0,61 ist Spalte 38 von 64 der Textur. Nimmst du bei `hit.side == 1` den Nachkommateil von `hit.x`?'

  - id: palette
    title: So viel Dunkel
    prompt: |
      In der Palette von `palette.rb` stehen sehr viele fast schwarze und
      graue Farben, obwohl die Texturen hell und bunt sind. Warum?
    check:
      type: choice
      options:
        - 'Jede der 67 Farben der Texturen bekommt 16 Helligkeiten bis hinunter zu Schwarz. Je dunkler, desto ähnlicher werden sich die Farben, und die Schattentabelle braucht für jede Helligkeit eine passende Farbe.'
        - 'Das Werkzeug füllt die Palette mit Schwarz auf, weil die Texturen weniger als 256 Farben haben.'
        - 'Die Karte braucht so viele dunkle Farben für ihren durchsichtigen Hintergrund.'
        - 'PixelRAM kann helle Farben nur ungenau darstellen und nimmt lieber dunkle.'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: 'Aufgefüllt wird nur, wenn weniger als 240 Farben übrig bleiben. Aus den Rampen kommen aber 1072 Farben, und davon bleiben 240.'
      - when: { picked: 2 }
        say: Die Karte nimmt dafür `shade[4]`, also Farben, die schon in der Palette sind.
      - when: { picked: 3 }
        say: PixelRAM zeigt jede der 256 Farben genau so, wie sie in der Palette steht.
    solution: 'In `1-rampen.png` hat jede Farbe der Texturen 16 Stufen, von Schwarz bis zur vollen Farbe. Die dunklen Stufen aller Farben liegen nah beieinander, und viele Texel in der Ferne zeigen genau diese Stufen. Die Palette bekommt deshalb viele dunkle Farben, und weil sich Ziegelrot und Moosgrün ganz dunkel kaum unterscheiden, fasst sie sie zu fast grauen zusammen.'

  - id: mipmap
    title: Dein mip_level
    prompt: |
      Schreib `mip_level` in `raycaster.c` und speichere. Der Workspace fragt
      nach der Stufe für ein paar Zahlen von Texeln pro Pixel.
    file: raycaster/raycaster.c
    check:
      type: c
      file: raycaster/raycaster.c
      cases:
        - call: mip_level(1)
          expect: 0
          say: 'Fällt ein Texel auf ein Pixel, passt das Original, Stufe 0.'
        - call: mip_level(1.9)
          expect: 0
          say: 'Unter 2 Texeln pro Pixel bleibt es bei Stufe 0.'
        - call: mip_level(2)
          expect: 1
          say: 'Ab 2 Texeln pro Pixel ist es Stufe 1. Vergleichst du mit `>= 2`?'
        - call: mip_level(5)
          expect: 2
          say: '5 Texel pro Pixel: einmal halbiert 2,5, noch einmal 1,25, also Stufe 2.'
        - call: mip_level(100)
          expect: 4
          say: 'Mehr als `MIP_LEVELS - 1`, also Stufe 4, gibt es nicht: `mip` hat keinen Platz für eine Stufe dahinter.'
        - call: (use_mipmaps = false, mip_level(100))
          expect: 0
          say: 'Mit `use_mipmaps` aus ist es immer Stufe 0, sonst schaltet die Taste M die Mipmaps nicht aus.'

  - id: eigene-welt
    title: Deine Welt
    prompt: |
      Bau dir eine eigene Welt: eine andere Karte, eine neue Wandart, eine
      eigene Textur oder eine der Ideen von oben. Beschreibe in zwei, drei
      Sätzen, was du gebaut hast und was dabei schwierig war.
    check:
      type: reflection
    examples:
      - |
        Ich habe die Karte zu einem Labyrinth umgebaut und eine neue Wandart
        mit einer eigenen Kachel aus dem 2D Game Studio dazugenommen; danach musste
        ich `palette.rb` noch einmal laufen lassen. Schwierig war der Rand: Einmal
        fehlte dort eine Wand, und ein Strahl lief aus der Karte heraus, bis das
        Programm abstürzte.
      - |
        Ich habe eine Tür gebaut: eine eigene Wandart, die verschwindet, wenn
        man davorsteht und eine Taste drückt. Schwierig war, dass `is_free` sie
        danach auch als frei zählen muss, sonst sieht man durch die offene Tür,
        kommt aber nicht hindurch.
