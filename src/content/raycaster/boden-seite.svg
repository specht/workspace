<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Von der Seite: Die Augen sind 0,5 über dem Boden, das Bild steht 1 vor ihnen. Eine Bildzeile y − H/2 Pixel unter dem Horizont, im Bild (y − H/2) / H tiefer, sieht den Boden in row_distance(y): ähnliche Dreiecke. Je näher die Zeile am Horizont, desto weiter weg.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raycaster/NAME.svg 880 -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="440" height="230" fill="#ffffff"/>
  <line x1="20.0" y1="180.0" x2="430.0" y2="180.0" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="40.0" y1="105.0" x2="430.0" y2="105.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="428.0" y="97.0" font-size="15" fill="#6b7280" text-anchor="end">Horizont</text>
  <line x1="190.0" y1="30.0" x2="190.0" y2="180.0" stroke="#1f2937" stroke-width="3"/>
  <text x="190.0" y="20.0" font-size="16" fill="#1f2937" text-anchor="middle">Bild</text>
  <line x1="40.0" y1="105.0" x2="366.1" y2="180.0" stroke="#2b5fb4" stroke-width="2"/>
  <circle cx="190.0" cy="139.5" r="4.0" fill="#ffffff" stroke="#2b5fb4" stroke-width="2"/>
  <circle cx="366.1" cy="180.0" r="4.0" fill="#ffffff" stroke="#2b5fb4" stroke-width="2"/>
  <text x="115.0" y="97.0" font-size="16" fill="#1f2937" text-anchor="middle">1</text>
  <line x1="200.0" y1="105.0" x2="200.0" y2="139.5" stroke="#2b5fb4" stroke-width="1.5"/>
  <text x="206.0" y="128.2" font-size="15" fill="#2b5fb4" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">(y − H/2) / H</text>
  <line x1="26.0" y1="105.0" x2="26.0" y2="180.0" stroke="#1f2937" stroke-width="1.5"/>
  <text x="36.0" y="154.5" font-size="16" fill="#1f2937" text-anchor="start">0,5</text>
  <text x="366.1" y="204.0" font-size="15" fill="#2b5fb4" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">row_distance(y)</text>
  <circle cx="40.0" cy="105.0" r="7.0" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <text x="44.0" y="93.0" font-size="16" fill="#1f2937" text-anchor="middle">Auge</text>
</svg>
