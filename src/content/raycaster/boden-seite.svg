<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Von der Seite: Die Augen sind 0,5 über dem Boden. Eine Bildzeile unter dem Horizont sieht den Boden in einem festen Abstand: je näher die Zeile am Horizont, desto weiter weg (ähnliche Dreiecke).
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raycaster/NAME.svg -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <line x1="60.0" y1="330.0" x2="920.0" y2="330.0" stroke="#1f2937" stroke-width="3"/>
  <text x="70.0" y="366.0" font-size="20" fill="#6b7280" text-anchor="start">Boden</text>
  <line x1="250.0" y1="50.0" x2="250.0" y2="290.0" stroke="#1f2937" stroke-width="3"/>
  <text x="250.0" y="34.0" font-size="20" fill="#1f2937" text-anchor="middle">Bild</text>
  <line x1="110.0" y1="170.0" x2="920.0" y2="170.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="900.0" y="158.0" font-size="20" fill="#6b7280" text-anchor="end">Horizont</text>
  <line x1="110.0" y1="170.0" x2="856.7" y2="328.0" stroke="#2b5fb4" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <circle cx="250.0" cy="200.0" r="5.0" fill="#ffffff" stroke="#2b5fb4" stroke-width="2"/>
  <text x="856.7" y="366.0" font-size="18" fill="#2b5fb4" text-anchor="end">Zeile nah am Horizont: weit weg</text>
  <line x1="110.0" y1="170.0" x2="430.0" y2="328.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-red)"/>
  <circle cx="250.0" cy="240.0" r="5.0" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="430.0" y="366.0" font-size="18" fill="#dc2626" text-anchor="middle">Zeile weiter unten: näher</text>
  <line x1="80.0" y1="170.0" x2="80.0" y2="330.0" stroke="#1f2937" stroke-width="1.5"/>
  <text x="70.0" y="256.0" font-size="20" fill="#1f2937" text-anchor="end">0,5</text>
  <circle cx="110.0" cy="170.0" r="9.0" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <text x="114.0" y="152.0" font-size="20" fill="#1f2937" text-anchor="middle">Auge</text>
</svg>
