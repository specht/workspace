  <circle cx="109.6" cy="72.0" r="4.5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="164.8" cy="72.0" r="4.5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="220.0" cy="72.0" r="4.5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="275.2" cy="72.0" r="4.5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="330.4" cy="72.0" r="4.5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <line x1="220.0" y1="26.0" x2="330.4" y2="26.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-red)"/>
