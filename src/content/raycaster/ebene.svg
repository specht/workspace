<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Von oben: Die Spielfigur schaut in Richtung dir; ein Kästchen davor liegt quer die Kamera-Ebene plane. Jeder Strahl geht von der Figur durch einen Punkt dieser Strecke: dir + plane · camera_x, camera_x von −1 links bis +1 rechts.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raycaster/NAME.svg -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker>
