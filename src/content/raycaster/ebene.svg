  <!-- Von oben, die Spielfigur schaut nach oben: dir mit der Länge 1, an seiner Spitze senkrecht dazu die Kamera-Ebene; plane reicht von ihrer Mitte bis zu ihrem rechten Ende. Jeder Strahl geht durch einen Punkt der Ebene, camera_x von -1 (linker Bildrand) bis 1 (rechter Bildrand); zusammen etwa 83 Grad.
       Gemacht von bilder/diagramme.py; als Bild, hell und dunkel:
       src/scripts/render-svg.rb src/content/raycaster/ebene.svg 880 -->
