  <text x="118.6" y="96.0" font-size="15" fill="#6b7280" text-anchor="end" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">camera_x = −1</text>
  <text x="229.0" y="96.0" font-size="15" fill="#6b7280" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">0</text>
