  <line x1="200.0" y1="260.0" x2="536.0" y2="559.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
  <circle cx="410.0" cy="446.9" r="5.0" fill="#ffffff" stroke="#2b5fb4" stroke-width="2"/>
  <line x1="410.0" y1="73.1" x2="410.0" y2="446.9" stroke="#dc2626" stroke-width="4"/>
