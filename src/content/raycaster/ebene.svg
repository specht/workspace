  <circle cx="410.0" cy="166.6" r="5.0" fill="#ffffff" stroke="#2b5fb4" stroke-width="2"/>
  <line x1="200.0" y1="260.0" x2="536.0" y2="260.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
  <circle cx="410.0" cy="260.0" r="5.0" fill="#ffffff" stroke="#2b5fb4" stroke-width="2"/>
