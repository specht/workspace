<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 222" width="440" height="222" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Von oben, die Spielfigur schaut nach oben: dir mit der Länge 1, quer davor die Kamera-Ebene; plane reicht von ihrer Mitte 0,89 nach rechts. Jeder Strahl geht durch einen Punkt der Ebene, camera_x von −1 (linker Bildrand) bis +1 (rechter Bildrand); zusammen etwa 83 Grad.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raycaster/NAME.svg 880 -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="440" height="222" fill="#ffffff"/>
  <line x1="220.0" y1="196.0" x2="76.5" y2="34.8" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="220.0" y1="196.0" x2="148.3" y2="34.8" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="220.0" y1="196.0" x2="220.0" y2="34.8" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="220.0" y1="196.0" x2="291.7" y2="34.8" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="220.0" y1="196.0" x2="363.5" y2="34.8" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M193.4,166.1 A40,40 0 0 1 246.6,166.1" fill="none" stroke="#6b7280" stroke-width="1.5"/>
