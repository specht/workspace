# /workspace/effects; die Funktionen der Lernenden rechnen mit numpy.
format: 1
activity: audio-effects
tasks:
  - id: eq-factor
    title: Zwölf Dezibel mehr
    prediction: true
    prompt: |
      Ein EQ gibt den Frequenzen um 80 Hz 12 dB dazu. Mit welchem Faktor
      wird dort die Höhe der Schwingung multipliziert? Zwei Stellen hinter
      dem Komma genügen.
    check:
      type: number
      expect: 3.98
      tolerance: 0.05
    feedback:
      - when: { equals: 12 }
        say: 12 ist die Zahl in Dezibel. Dezibel sind ein Logarithmus; welcher Faktor steckt dahinter?
      - when: { between: [15.8, 15.9] }
        say: 10 hoch 12/10 ist der Faktor für die Energie. Die Höhe der Schwingung wächst langsamer, die Energie ist ihr Quadrat.
      - when: { equals: 2 }
        say: 6 dB verdoppeln die Höhe. 12 dB sind zweimal 6 dB.
    solution: |
      Fast 4, genauer 10 hoch 12/20 = 3,98: 6 dB verdoppeln die Höhe der
      Schwingung, 12 dB verdoppeln sie zweimal.

  - id: eq-bell
    title: Die Glocke des EQ
    prompt: |
      Schreib in `effects/eq.py` die Funktion `bell(freqs, centre, width, gain)`:
      für jede Frequenz in `freqs` der Faktor, mit dem das EQ ihre Schwingung
      multipliziert. `width` Oktaven neben `centre` wirkt noch die Hälfte der
      Verstärkung `gain` in dB.
    check:
      type: python
      file: effects/eq.py
      cases:
        - call: round(float(bell(np.array([1000.0]), 1000, 1, 12)[0]), 2)
          expect: 3.98
          say: In der Mitte wirkt die ganze Verstärkung, 12 dB, und der Faktor ist 10 hoch 12/20, etwa 3,98. Rechnet deine Funktion die Dezibel mit `10 ** (db / 20)` in einen Faktor um?
        - call: round(float(bell(np.array([2000.0]), 1000, 1, 12)[0]), 2)
          expect: 2.0
          say: 2.000 Hz liegt eine Oktave über 1.000 Hz, eine Breite weit weg; dort wirkt die halbe Verstärkung, 6 dB, fast der Faktor 2.
        - call: round(float(bell(np.array([500.0]), 1000, 1, 12)[0]), 2)
          expect: 2.0
          say: 500 Hz liegt eine Oktave unter 1.000 Hz, genauso weit weg wie 2.000 Hz. Zählt deine Funktion den Abstand in Oktaven, mit `np.log2(freqs / centre)`?
        - call: round(float(bell(np.array([100.0]), 1000, 1, 12)[0]), 2)
          expect: 1.0
          say: Weit weg von der Mitte, mehr als drei Oktaven, ändert das EQ fast nichts; der Faktor ist dort 1.
        - call: round(float(bell(np.array([1000.0]), 1000, 1, -12)[0]), 2)
          expect: 0.25
          say: Mit −12 dB wird die Schwingung leiser, Faktor 10 hoch −12/20, etwa 0,25.
        - call: '[round(float(v), 2) for v in bell(np.array([0.0, 1000.0]), 1000, 1, 12)]'
          expect: '[1.0, 3.98]'
          say: Die erste Frequenz der FFT ist 0 Hz, und `np.log2(0)` ist minus unendlich. Mit `np.maximum(freqs, 1)` wird aus 0 erst 1.
    solution: |
      ```python
      def bell(freqs, centre, width, gain):
          octaves = np.log2(np.maximum(freqs, 1) / centre)
          db = gain * 2 ** (-(octaves / width) ** 2)
          return 10 ** (db / 20)
      ```

