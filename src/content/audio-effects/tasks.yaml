  - id: gain-db
    title: Wie viel leiser
    prompt: |
      Schreib in `effects/compressor.py` die Funktion `gain_db(level, threshold, ratio)`:
      0, wenn der Pegel `level` höchstens beim Threshold liegt, sonst die
      Dezibel, die der Compressor wegnimmt, als negative Zahl.
    check:
      type: python
      file: effects/compressor.py
      cases:
        - call: float(gain_db(-30, -20, 4))
          expect: '0.0'
          say: −30 dB liegt unter dem Threshold von −20 dB; dort gibt der Compressor 0 dB dazu.
        - call: round(gain_db(-8, -20, 4), 6)
          expect: '-9.0'
          say: '12 dB über dem Threshold; bei 4 : 1 bleiben 3 dB übrig, also nimmt der Compressor 9 dB weg und `gain_db` gibt −9 zurück. Rechnest du `(threshold - level) * (1 - 1 / ratio)`?'
        - call: round(gain_db(0, -24, 2), 6)
          expect: '-12.0'
          say: '24 dB über dem Threshold, bei 2 : 1 bleibt die Hälfte; weggenommen werden 12 dB.'
    solution: |
      ```python
      def gain_db(level, threshold, ratio):
          if level <= threshold:
              return 0
          return (threshold - level) * (1 - 1 / ratio)
      ```

