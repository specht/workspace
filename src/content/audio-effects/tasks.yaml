  - id: vocode-frame
    title: Der Träger mit der Stärke der Stimme
    prompt: |
      Schreib in `effects/vocoder.py` die Funktion `vocode_frame(voice, carrier, edges)`:
      eine Kopie von `carrier`, jedes Band so stark wie dasselbe Band in `voice`.
    check:
      type: python
      file: effects/vocoder.py
      cases:
        - call: vocode_frame(np.array([6.0, 8, 0, 0]), np.array([3.0, 4, 1, 1]), [0, 2, 4]).tolist()
          expect: '[6.0, 8.0, 0.0, 0.0]'
          say: 'Im ersten Band ist die Stimme 10 stark (die Wurzel aus 36 + 64), der Träger 5 (die Wurzel aus 9 + 16): Er wird mit 2 multipliziert. Im zweiten ist die Stimme still, also auch das Ergebnis. Rechnest du die Stärke als Wurzel aus der Summe der Quadrate und teilst durch die des Trägers?'
        - call: vocode_frame(np.array([1.0, 1]), np.array([0.0, 0]), [0, 2]).tolist()
          expect: '[0.0, 0.0]'
          say: Ist der Träger in einem Band still, gibt es nichts zu multiplizieren, und durch 0 teilen geht nicht. Dann bleibt das Band 0.
        - call: '(lambda c: (vocode_frame(np.array([2.0, 0]), c, [0, 2]), c.tolist())[1])(np.array([1.0, 0]))'
          expect: '[1.0, 0.0]'
          say: '`carrier` soll sich nicht ändern: Fang mit `out = carrier.copy()` an.'
    solution: |
      ```python
      def vocode_frame(voice, carrier, edges):
          out = carrier.copy()
          for lo, hi in zip(edges[:-1], edges[1:]):
              v = np.sqrt(np.sum(np.abs(voice[lo:hi]) ** 2))
              c = np.sqrt(np.sum(np.abs(carrier[lo:hi]) ** 2))
              out[lo:hi] *= v / c if c > 0 else 0
          return out
      ```

