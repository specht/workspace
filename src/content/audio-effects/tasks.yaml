  - id: echo
    title: Ein Echo mit Rückkopplung
    prompt: |
      Schreib in `effects/echo.py` die Funktion `echo(x, rate, delay, feedback, mix)`:
      der Klang `x` mit seinen Echos, `delay` Sekunden auseinander, jedes
      `feedback`-mal so hoch wie das vorige, mit `mix` dazugemischt.
    check:
      type: python
      file: effects/echo.py
      cases:
        - call: echo(np.array([1.0, 0, 0, 0, 0, 0]), 1, 2, 0.5, 1).tolist()
          expect: '[1.0, 0.0, 0.5, 0.0, 0.25, 0.0]'
          say: Mit der Abtastrate 1 und 2 Sekunden Verzögerung kommt alle zwei Samples ein Echo, halb so hoch wie das vorige. Zählt deine Funktion `y[n - D]` dazu, also auch die Echos selbst?
        - call: '(lambda x: (echo(x, 1, 2, 0.5, 1), x.tolist())[1])(np.array([1.0, 0, 0, 0]))'
          expect: '[1.0, 0.0, 0.0, 0.0]'
          say: '`x` soll sich nicht ändern: Fang mit `y = x.copy()` an, nicht mit `y = x`.'
        - call: echo(np.array([1.0, 0, 0, 0, 0, 0]), 1, 2, 0.5, 0.5).tolist()
          expect: '[1.0, 0.0, 0.25, 0.0, 0.125, 0.0]'
          say: Mit der Mischung 0,5 kommen die Echos halb so laut dazu, der Klang selbst bleibt. Gibt deine Funktion `x + mix * (y - x)` zurück?
    solution: |
      ```python
      def echo(x, rate, delay, feedback, mix):
          D = round(delay * rate)
          y = x.copy()
          for n in range(D, len(y)):
              y[n] += feedback * y[n - D]
          return x + mix * (y - x)
      ```

  - id: chorus-read
    title: Zwischen zwei Samples lesen
    prompt: |
      Schreib in `effects/chorus.py` die Funktion `read(x, pos)`: für jede
      Stelle in `pos` den Wert zwischen den beiden Samples daneben, auf der
      Geraden zwischen ihnen.
    check:
      type: python
      file: effects/chorus.py
      cases:
        - call: read(np.array([0.0, 10, 20, 30]), np.array([0.0, 1.5, 2.25])).tolist()
          expect: '[0.0, 15.0, 22.5]'
          say: An der Stelle 1,5 liegt der Wert genau in der Mitte zwischen 10 und 20, an der Stelle 2,25 ein Viertel des Wegs von 20 nach 30. Mischt deine Funktion die beiden Samples daneben, `(1 - f) * x[i] + f * x[i + 1]`?
        - call: read(np.array([0.0, 10, 20, 30]), np.array([3.0])).tolist()
          expect: '[30.0]'
          say: Die Stelle 3 ist das letzte Sample. Ein `x[i + 1]` gibt es dort nicht; mit `np.clip(…, 0, len(x) - 2)` ist `i` das vorletzte und `f` 1.
    solution: |
      ```python
      def read(x, pos):
          i = np.clip(np.floor(pos).astype(int), 0, len(x) - 2)
          f = pos - i
          return (1 - f) * x[i] + f * x[i + 1]
      ```

  - id: allpass
    title: Ein Allpass
    prompt: |
      Schreib in `effects/reverb.py` die Funktion `allpass(x, rate, delay, g)`:
      `y[n] = -g * x[n] + x[n - D] + g * y[n - D]` mit `D = round(delay * rate)`,
      für die Samples vor `D` nur `-g * x[n]`.
    check:
      type: python
      file: effects/reverb.py
      cases:
        - call: allpass(np.array([1.0, 0, 0, 0, 0]), 1, 2, 0.5).tolist()
          expect: '[-0.5, 0.0, 0.75, 0.0, 0.375]'
          say: Ein Knall der Höhe 1 durch einen Allpass mit D = 2 und g = 0,5 gibt −0,5, dann 1 − 0,25 = 0,75, dann 0,375. Steht `g * y[n - D]` in deiner Formel, und das Minus vor `g * x[n]`?
    solution: |
      ```python
      def allpass(x, rate, delay, g):
          D = round(delay * rate)
          y = np.zeros_like(x)
          for n in range(len(x)):
              y[n] = -g * x[n]
              if n >= D:
                  y[n] += x[n - D] + g * y[n - D]
          return y
      ```

