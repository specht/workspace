# Aufgaben zu »Turtle: Pflanzen, Zufall und Farbe«. Format: docs/aufgaben.md (turtle).
# Geschrieben von einem Skript aus einer Beschreibung je Aufgabe; die Bilder
# (draw) sind Ruby mit denselben Befehlen, für alle drei Sprachen.
format: 1
activity: turtle-3
tasks:

  - id: sun
    title: "Eine Sonne aus allen Farben"
    level: 1
    prompt: |
      Die Sonne aus 36 Strahlen ist schon da, noch schwarz. Gib jedem Strahl seine eigene Farbe: Der erste ist rot, `color 0`, und jeder nächste liegt 10 Grad weiter im Farbkreis.
    starter: |
      36.times do |i|
        forward 150
        back 150
        left 10
      end
    check:
      type: "turtle"
      language: "ruby"
      draw: |
        36.times do |i|
          color i * 10
          forward 150
          back 150
          left 10
        end
      colors: true
      commands: [forward, back, left, right, hue]
    hint:
      - "Die Farbe kommt vor den Strahl, als erste Zeile in der Schleife. Ihre Zahl hängt davon ab, der wievielte Strahl es ist: `i`."
      - "Strahl 0 hat die Farbe 0, Strahl 1 die Farbe 10, Strahl 2 die Farbe 20: `color i * 10`."
    solution: |
      ```ruby
      36.times do |i|
        color i * 10
        forward 150
        back 150
        left 10
      end
      ```
    python:
      prompt: |
        Die Sonne aus 36 Strahlen ist schon da, noch schwarz. Gib jedem Strahl seine eigene Farbe: Der erste ist rot, `color(0)`, und jeder nächste liegt 10 Grad weiter im Farbkreis.
      starter: |
        for i in range(36):
            forward(150)
            back(150)
            left(10)
      check:
        type: "turtle"
        language: "python"
        draw: |
          36.times do |i|
            color i * 10
            forward 150
            back 150
            left 10
          end
        colors: true
        commands: [forward, back, left, right, hue]
      hint:
        - "Die Farbe kommt vor den Strahl, als erste Zeile in der Schleife. Ihre Zahl hängt davon ab, der wievielte Strahl es ist: `i`."
        - "Strahl 0 hat die Farbe 0, Strahl 1 die Farbe 10, Strahl 2 die Farbe 20: `color(i * 10)`."
      solution: |
        ```python
        for i in range(36):
            color(i * 10)
            forward(150)
            back(150)
            left(10)
        ```
    javascript:
      prompt: |
        Die Sonne aus 36 Strahlen ist schon da, noch schwarz. Gib jedem Strahl seine eigene Farbe: Der erste ist rot, `color(0)`, und jeder nächste liegt 10 Grad weiter im Farbkreis.
      starter: |
        for (let i = 0; i < 36; i++) {
          forward(150);
          back(150);
          left(10);
        }
      check:
        type: "turtle"
        language: "javascript"
        draw: |
          36.times do |i|
            color i * 10
            forward 150
            back 150
            left 10
          end
        colors: true
        commands: [forward, back, left, right, hue]
      hint:
        - "Die Farbe kommt vor den Strahl, als erste Zeile in der Schleife. Ihre Zahl hängt davon ab, der wievielte Strahl es ist: `i`."
        - "Strahl 0 hat die Farbe 0, Strahl 1 die Farbe 10, Strahl 2 die Farbe 20: `color(i * 10)`."
      solution: |
        ```javascript
        for (let i = 0; i < 36; i++) {
          color(i * 10);
          forward(150);
          back(150);
          left(10);
        }
        ```

  - id: rainbow-spiral
