    level: 2
    prompt: |
      Zeichne eine Spirale aus 120 Linien: Linie `i` ist `2 * i` Schritte lang (die erste, Linie 0, also gar nicht), und nach jeder dreht sich die Schildkröte 59 Grad nach links. Die Farben laufen einmal durch den ganzen Farbkreis: Linie `i` hat die Farbe `3 * i`.
    check:
      type: "turtle"
      language: "ruby"
      draw: |
        120.times do |i|
          color i * 3
          forward i * 2
          left 59
        end
      colors: true
      commands: [forward, back, left, right, hue]
    hint:
      - "Eine Schleife mit 120 Durchläufen, die mitzählt, der wievielte es ist. Darin drei Befehle: die Farbe, die Linie, die Drehung."
      - "Die Länge und die Farbe rechnest du aus `i` aus: `color i * 3` und `forward i * 2`."
    solution: |
      ```ruby
      120.times do |i|
        color i * 3
        forward i * 2
        left 59
      end
      ```
    python:
      prompt: |
        Zeichne eine Spirale aus 120 Linien: Linie `i` ist `2 * i` Schritte lang (die erste, Linie 0, also gar nicht), und nach jeder dreht sich die Schildkröte 59 Grad nach links. Die Farben laufen einmal durch den ganzen Farbkreis: Linie `i` hat die Farbe `3 * i`.
      check:
        type: "turtle"
        language: "python"
        draw: |
          120.times do |i|
            color i * 3
            forward i * 2
            left 59
          end
        colors: true
        commands: [forward, back, left, right, hue]
      hint:
        - "Eine Schleife mit 120 Durchläufen, die mitzählt, der wievielte es ist. Darin drei Befehle: die Farbe, die Linie, die Drehung."
        - "Die Länge und die Farbe rechnest du aus `i` aus: `color(i * 3)` und `forward(i * 2)`."
      solution: |
