  - id: pop-predict
    title: Wo steht die Schildkröte?
    prediction: true
    prompt: |
      Die Schildkröte schaut nach rechts. Das Programm: `forward 100`, `push`, `left 90`, `forward 50`, `pop`, `forward 50`. Wo steht sie am Ende, und wohin schaut sie?
    check:
      type: choice
      options:
        - Am Ende der kurzen Linie nach oben, und sie schaut nach oben.
        - 150 Schritte rechts vom Anfang, und sie schaut nach rechts.
        - 100 Schritte rechts vom Anfang, und sie schaut nach oben.
        - Wieder am Anfang, und sie schaut nach rechts.
      correct: 1

  - id: tree-push
    title: "Ein Baum ohne Rückweg"
    level: 2
    prompt: |
      Schreib `tree(size, depth)` für den Baum aus »Bäume und Kurven« noch einmal, diesmal ohne `back` und ohne zurückzudrehen: Vor jedem Ast merkt sich die Schildkröte mit `push`, wo sie ist, und kehrt nach ihm mit `pop` dorthin zurück.
    starter: |
      def tree(size, depth)
      end

      left 90
      tree(100, 5)
    check:
      type: "turtle"
      language: "ruby"
      cases:
        - call: "left 90; tree(100, 1)"
          draw: |
            def tree(size, depth)
              return if depth == 0
              forward size
              left 30
              tree(size * 0.7, depth - 1)
              right 60
              tree(size * 0.7, depth - 1)
              left 30
              back size
            end
            left 90
            tree(100, 1)
        - call: "left 90; tree(100, 2)"
          draw: |
            def tree(size, depth)
              return if depth == 0
              forward size
              left 30
              tree(size * 0.7, depth - 1)
              right 60
              tree(size * 0.7, depth - 1)
              left 30
              back size
            end
            left 90
            tree(100, 2)
        - call: "left 90; tree(100, 5)"
          draw: |
            def tree(size, depth)
              return if depth == 0
              forward size
              left 30
              tree(size * 0.7, depth - 1)
              right 60
              tree(size * 0.7, depth - 1)
              left 30
              back size
            end
            left 90
            tree(100, 5)
      commands: [forward, left, right, push, pop]
      show: 2
    hint:
      - "Bei der Tiefe 0 kehrt die Funktion zurück. Sonst zeichnet sie den Stamm, und an seinem Ende wachsen die beiden Äste."
      - "Ein Ast: `push`, 30 Grad drehen, `tree(size * 0.7, depth - 1)`, `pop`. Nach dem `pop` steht die Schildkröte wieder oben am Stamm und schaut nach oben, bereit für den zweiten Ast."
    solution: |
      ```ruby
      def tree(size, depth)
        return if depth == 0
        forward size
        push
        left 30
        tree(size * 0.7, depth - 1)
        pop
        push
        right 30
        tree(size * 0.7, depth - 1)
        pop
      end

      left 90
      tree(100, 5)
      ```
    python:
      prompt: |
        Schreib `tree(size, depth)` für den Baum aus »Bäume und Kurven« noch einmal, diesmal ohne `back` und ohne zurückzudrehen: Vor jedem Ast merkt sich die Schildkröte mit `push`, wo sie ist, und kehrt nach ihm mit `pop` dorthin zurück.
      starter: |
        def tree(size, depth):
            pass

        left(90)
        tree(100, 5)
      check:
        type: "turtle"
        language: "python"
        cases:
          - call: "left(90); tree(100, 1)"
            draw: |
              def tree(size, depth)
                return if depth == 0
                forward size
                left 30
                tree(size * 0.7, depth - 1)
                right 60
                tree(size * 0.7, depth - 1)
                left 30
                back size
              end
              left 90
              tree(100, 1)
          - call: "left(90); tree(100, 2)"
            draw: |
              def tree(size, depth)
                return if depth == 0
                forward size
                left 30
                tree(size * 0.7, depth - 1)
                right 60
                tree(size * 0.7, depth - 1)
                left 30
                back size
              end
              left 90
              tree(100, 2)
          - call: "left(90); tree(100, 5)"
            draw: |
              def tree(size, depth)
                return if depth == 0
                forward size
                left 30
                tree(size * 0.7, depth - 1)
                right 60
                tree(size * 0.7, depth - 1)
                left 30
                back size
              end
              left 90
              tree(100, 5)
        commands: [forward, left, right, push, pop]
        show: 2
      hint:
        - "Bei der Tiefe 0 kehrt die Funktion zurück. Sonst zeichnet sie den Stamm, und an seinem Ende wachsen die beiden Äste."
        - "Ein Ast: `push()`, 30 Grad drehen, `tree(size * 0.7, depth - 1)`, `pop()`. Nach dem `pop` steht die Schildkröte wieder oben am Stamm und schaut nach oben, bereit für den zweiten Ast."
      solution: |
        ```python
        def tree(size, depth):
            if depth == 0:
                return
            forward(size)
            push()
            left(30)
            tree(size * 0.7, depth - 1)
            pop()
            push()
            right(30)
            tree(size * 0.7, depth - 1)
            pop()

        left(90)
        tree(100, 5)
        ```
    javascript:
      prompt: |
        Schreib `tree(size, depth)` für den Baum aus »Bäume und Kurven« noch einmal, diesmal ohne `back` und ohne zurückzudrehen: Vor jedem Ast merkt sich die Schildkröte mit `push`, wo sie ist, und kehrt nach ihm mit `pop` dorthin zurück.
      starter: |
        function tree(size, depth) {
        }

        left(90);
        tree(100, 5);
      check:
        type: "turtle"
        language: "javascript"
        cases:
          - call: "left(90); tree(100, 1)"
            draw: |
              def tree(size, depth)
                return if depth == 0
                forward size
                left 30
                tree(size * 0.7, depth - 1)
                right 60
                tree(size * 0.7, depth - 1)
                left 30
                back size
              end
              left 90
              tree(100, 1)
          - call: "left(90); tree(100, 2)"
            draw: |
              def tree(size, depth)
                return if depth == 0
                forward size
                left 30
                tree(size * 0.7, depth - 1)
                right 60
                tree(size * 0.7, depth - 1)
                left 30
                back size
              end
              left 90
              tree(100, 2)
          - call: "left(90); tree(100, 5)"
            draw: |
              def tree(size, depth)
                return if depth == 0
                forward size
                left 30
                tree(size * 0.7, depth - 1)
                right 60
                tree(size * 0.7, depth - 1)
                left 30
                back size
              end
              left 90
              tree(100, 5)
        commands: [forward, left, right, push, pop]
        show: 2
      hint:
        - "Bei der Tiefe 0 kehrt die Funktion zurück. Sonst zeichnet sie den Stamm, und an seinem Ende wachsen die beiden Äste."
        - "Ein Ast: `push()`, 30 Grad drehen, `tree(size * 0.7, depth - 1)`, `pop()`. Nach dem `pop` steht die Schildkröte wieder oben am Stamm und schaut nach oben, bereit für den zweiten Ast."
      solution: |
        ```javascript
        function tree(size, depth) {
          if (depth === 0) return;
          forward(size);
          push();
          left(30);
          tree(size * 0.7, depth - 1);
          pop();
          push();
          right(30);
          tree(size * 0.7, depth - 1);
          pop();
        }

        left(90);
        tree(100, 5);
        ```

