  - id: wind-tree
    title: "Ein Baum im Wind"
    level: 2
    prompt: |
      Lass deinen Baum mit `push` und `pop` so wachsen, wie Bäume wachsen: Jeder Ast bekommt seinen eigenen zufälligen Winkel und seine eigene zufällige Länge. Lass ihn ein paarmal wachsen, jedes Mal steht ein anderer Baum da.
    starter: |
      def tree(size, depth)
        return if depth == 0
        forward size
        push
        left 30
        tree(size * 0.7, depth - 1)
        pop
        push
        right 30
        tree(size * 0.7, depth - 1)
        pop
      end

      # left 90
      # tree(100, 5)
    check:
      type: "turtle"
      language: "ruby"
      free: {}
      commands: [forward, left, right, color, width, push, pop, random]
    hint:
      - "Statt `left 30` ein Winkel aus dem Zufall: `left random(10, 40)`, für jeden Ast neu."
      - "Auch die Länge darf schwanken: `size * random(0.6, 0.85)`. Mit Kommazahlen gibt `random` eine Kommazahl zurück."
      - "Dick und braun unten, dünn und grün an den Spitzen: `width depth` und eine Farbe, die von `depth` abhängt, wie beim schönen Baum."
    solution: |
      ```ruby
      def tree(size, depth)
        return if depth == 0
        width depth
        color depth <= 2 ? "forestgreen" : "saddlebrown"
        forward size
        push
        left random(10, 40)
        tree(size * random(0.6, 0.85), depth - 1)
        pop
        push
        right random(10, 40)
        tree(size * random(0.6, 0.85), depth - 1)
        pop
      end

      left 90
      tree(80, 9)
      ```
    python:
      prompt: |
        Lass deinen Baum mit `push` und `pop` so wachsen, wie Bäume wachsen: Jeder Ast bekommt seinen eigenen zufälligen Winkel und seine eigene zufällige Länge. Lass ihn ein paarmal wachsen, jedes Mal steht ein anderer Baum da.
      starter: |
        def tree(size, depth):
            if depth == 0:
                return
            forward(size)
            push()
            left(30)
            tree(size * 0.7, depth - 1)
            pop()
            push()
            right(30)
            tree(size * 0.7, depth - 1)
            pop()

        # left(90)
        # tree(100, 5)
      check:
        type: "turtle"
        language: "python"
        free: {}
        commands: [forward, left, right, color, width, push, pop, random]
      hint:
        - "Statt `left(30)` ein Winkel aus dem Zufall: `left(random(10, 40))`, für jeden Ast neu."
        - "Auch die Länge darf schwanken: `size * random(0.6, 0.85)`. Mit Kommazahlen gibt `random` eine Kommazahl zurück."
        - "Dick und braun unten, dünn und grün an den Spitzen: `width depth` und eine Farbe, die von `depth` abhängt, wie beim schönen Baum."
      solution: |
        ```python
        def tree(size, depth):
            if depth == 0:
                return
            width(depth)
            if depth <= 2:
                color("forestgreen")
            else:
                color("saddlebrown")
            forward(size)
            push()
            left(random(10, 40))
            tree(size * random(0.6, 0.85), depth - 1)
            pop()
            push()
            right(random(10, 40))
            tree(size * random(0.6, 0.85), depth - 1)
            pop()

        left(90)
        tree(80, 9)
        ```
    javascript:
      prompt: |
        Lass deinen Baum mit `push` und `pop` so wachsen, wie Bäume wachsen: Jeder Ast bekommt seinen eigenen zufälligen Winkel und seine eigene zufällige Länge. Lass ihn ein paarmal wachsen, jedes Mal steht ein anderer Baum da.
      starter: |
        function tree(size, depth) {
          if (depth === 0) return;
          forward(size);
          push();
          left(30);
          tree(size * 0.7, depth - 1);
          pop();
          push();
          right(30);
          tree(size * 0.7, depth - 1);
          pop();
        }

        // left(90);
        // tree(100, 5);
      check:
        type: "turtle"
        language: "javascript"
        free: {}
