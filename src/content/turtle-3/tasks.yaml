          color(i * 3);
          forward(i * 2);
          left(59);
        }
        ```

  - id: fan
    title: "Ein Fächer von Gold nach Rot"
    level: 2
    prompt: |
      Zeichne einen Fächer aus 19 Strahlen, jeder 150 Schritte lang und 10 Grad weiter gedreht als der davor: der erste nach rechts, der letzte nach links. Der erste Strahl ist ganz `"gold"`, der letzte ganz `"crimson"`, und dazwischen ändert sich die Farbe gleichmäßig.
    check:
      type: "turtle"
      language: "ruby"
      draw: |
        19.times do |i|
          color "gold", "crimson", i / 18.0
          forward 150
          back 150
          left 10
        end
      colors: true
      commands: [forward, back, left, right, mix]
    hint:
      - "Wie die Sonne, nur mit 19 Strahlen und einer gemischten Farbe: `color \"gold\", \"crimson\", anteil`, mit dem Anteil 0 beim ersten Strahl und 1 beim letzten."
      - "Der letzte Strahl ist Strahl 18. Der Anteil ist also `i / 18`. In Ruby ist `i / 18` eine ganze Zahl, fast immer 0: Schreib `i / 18.0`."
    solution: |
      ```ruby
      19.times do |i|
        color "gold", "crimson", i / 18.0
        forward 150
        back 150
        left 10
      end
      ```
    python:
      prompt: |
        Zeichne einen Fächer aus 19 Strahlen, jeder 150 Schritte lang und 10 Grad weiter gedreht als der davor: der erste nach rechts, der letzte nach links. Der erste Strahl ist ganz `"gold"`, der letzte ganz `"crimson"`, und dazwischen ändert sich die Farbe gleichmäßig.
      check:
        type: "turtle"
        language: "python"
        draw: |
          19.times do |i|
            color "gold", "crimson", i / 18.0
            forward 150
            back 150
            left 10
          end
        colors: true
        commands: [forward, back, left, right, mix]
      hint:
        - "Wie die Sonne, nur mit 19 Strahlen und einer gemischten Farbe: `color(\"gold\", \"crimson\", anteil)`, mit dem Anteil 0 beim ersten Strahl und 1 beim letzten."
        - "Der letzte Strahl ist Strahl 18. Der Anteil ist also `i / 18`."
      solution: |
        ```python
        for i in range(19):
            color("gold", "crimson", i / 18)
            forward(150)
            back(150)
