      hint:
        - "Eine Schleife mit 120 Durchläufen, die mitzählt, der wievielte es ist. Darin drei Befehle: die Farbe, die Linie, die Drehung."
        - "Die Länge und die Farbe rechnest du aus `i` aus: `color(i * 3)` und `forward(i * 2)`."
      solution: |
