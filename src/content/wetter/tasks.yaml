# Aufgaben zu »Daten aus dem Netz«.
# Format: docs/aufgaben.md. Das Programm und die Seite liegen in /workspace/wetter.
format: 1
activity: wetter
tasks:
  - id: breitengrad
    title: Wo liegt Berlin?
    prompt: |
      Welchen Breitengrad (`latitude`) nennt die Geocoding-API für Berlin?
      Runde auf zwei Stellen nach dem Komma.
    check:
      type: number
      expect: 52.52
      tolerance: 0.01
    hint: '`jq ''.results[0].latitude''` holt den Wert aus der Antwort.'
    feedback:
      - when: { between: [13.3, 13.5] }
        say: Das ist der Längengrad (`longitude`). Gesucht ist `latitude`.
    solution: Die API nennt 52.52437. Berlin liegt also etwa 52,5 Grad nördlich des Äquators.

  - id: tage
    title: Eine Woche
    prompt: |
      Was musst du an die Adresse der Wetter-API anhängen, damit sie
      Tageswerte für sieben Tage liefert?
    check:
      type: choice
      options:
        - '`&daily=temperature_2m_max&forecast_days=7`'
        - '`&days=7`'
        - '`&current=temperature_2m&forecast_days=7`'
        - '`/7`'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Die API kennt nur die Namen aus ihrer Dokumentation. Wie heißt dort der Parameter für die Zahl der Tage, und welcher sagt, welche Tageswerte du willst?
      - when: { picked: 2 }
        say: '`current` liefert nur die Werte für jetzt. Für jeden Tag brauchst du `daily`.'
    solution: '`daily` sagt, welche Werte du pro Tag willst, `forecast_days` für wie viele Tage. Weitere Parameter hängst du mit `&` an.'

  - id: kein-ort
    title: Ein Ort, den es nicht gibt
    prediction: true
    prompt: |
      Du fragst die Geocoding-API nach `name=Xyzzy`. Was kommt zurück?
      Überleg erst, dann probier es aus.
    check:
      type: choice
      options:
        - Ein Objekt ohne `results`, mit dem Statuscode 200
        - Der Statuscode 404 Not Found
        - Eine Liste `results` mit dem ähnlichsten Ort
        - Gar keine Antwort, curl wartet
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Die Adresse gibt es ja, nur findet die Suche nichts. Eine Suche ohne Treffer ist für diese API kein Fehler.
    solution: 'Die API antwortet mit 200 und einem Objekt, in dem nur `generationtime_ms` steht. Ein Programm muss darum selbst prüfen, ob `results` da ist.'

  - id: wetter-rb
    title: Das Wetter aus deinem Programm
    prompt: |
      Schreibe `wetter.rb` so, dass `ruby wetter.rb München` das Wetter in
      München zeigt, mit einer Meldung für Orte, die es nicht gibt, und
      speichere.
    file: wetter/wetter.rb
    check:
      type: files
      path: wetter/wetter.rb
      expect:
        format: text
        contains:
          - { pattern: 'geocoding-api\.open-meteo\.com|open-meteo/geocoding/v1/search', say: 'In `wetter.rb` fragt noch nichts die Geocoding-API, die zu einem Namen die Koordinaten findet.' }
          - { pattern: 'api\.open-meteo\.com/v1/forecast|open-meteo/api/v1/forecast', say: 'In `wetter.rb` fehlt noch die Anfrage an die Wetter-API.' }
          - { pattern: 'JSON\.parse', say: 'Noch macht `wetter.rb` aus der Antwort kein JSON (`JSON.parse`).' }
          - { pattern: 'ARGV', say: 'Noch nimmt `wetter.rb` den Ort nicht von der Kommandozeile: `ARGV[0]`.' }
    python:
      prompt: |
        Schreibe `wetter.py` so, dass `python3 wetter.py München` das Wetter
        in München zeigt, mit einer Meldung für Orte, die es nicht gibt, und
        speichere.
      file: wetter/wetter.py
      check:
        type: files
        path: wetter/wetter.py
        expect:
          format: text
          contains:
            - { pattern: 'geocoding-api\.open-meteo\.com|open-meteo/geocoding/v1/search', say: 'In `wetter.py` fragt noch nichts die Geocoding-API, die zu einem Namen die Koordinaten findet.' }
            - { pattern: 'api\.open-meteo\.com/v1/forecast|open-meteo/api/v1/forecast', say: 'In `wetter.py` fehlt noch die Anfrage an die Wetter-API.' }
            - { pattern: 'json\.loads?\(', say: 'Noch macht `wetter.py` aus der Antwort kein JSON (`json.load`).' }
            - { pattern: 'sys\.argv', say: 'Noch nimmt `wetter.py` den Ort nicht von der Kommandozeile: `sys.argv[1]`.' }

  - id: cache
    title: Ein Cache
    prompt: |
      Lass `wetter.rb` Antworten zehn Minuten lang in Dateien aufheben und
      sie wiederverwenden, und speichere.
    python:
      prompt: |
        Lass `wetter.py` Antworten zehn Minuten lang in Dateien aufheben und
        sie wiederverwenden, und speichere.
      file: wetter/wetter.py
      check:
        type: files
        path: wetter/wetter.py
        expect:
          format: text
          contains:
            - { pattern: 'write_bytes|write_text|\.write\(|json\.dump\(', say: 'Noch schreibt `wetter.py` keine Antwort in eine Datei (`file.write_bytes(…)`).' }
            - { pattern: 'st_mtime|getmtime', say: 'Noch prüft `wetter.py` nicht, wie alt eine gespeicherte Antwort ist (`file.stat().st_mtime`).' }
    file: wetter/wetter.rb
    check:
      type: files
      path: wetter/wetter.rb
      expect:
        format: text
        contains:
          - { pattern: 'File\.write', say: 'Noch schreibt `wetter.rb` keine Antwort in eine Datei (`File.write`).' }
          - { pattern: 'File\.mtime', say: 'Noch prüft `wetter.rb` nicht, wie alt eine gespeicherte Antwort ist (`File.mtime`).' }

  - id: spiegel
    title: Ein Spiegel für alle
    prompt: |
      Warum schont der Spiegel der Schule das Kontingent bei Open-Meteo,
      auch wenn die ganze Klasse ihn benutzt?
    check:
      type: choice
      options:
        - Er merkt sich jede Antwort für alle; fragen viele nach demselben Ort, fragt er Open-Meteo nur einmal.
        - Er hat bei Open-Meteo ein eigenes, viel größeres Kontingent.
        - Er schickt die Anfragen verschlüsselt, die zählt Open-Meteo nicht.
        - Er fragt nur bei Tag und schläft nachts.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Der Spiegel fragt mit der Adresse des Servers bei Open-Meteo, mit denselben Grenzen wie alle anderen. Was macht er anders als jeder Einzelne?
    solution: Der Spiegel ist ein Cache für alle zusammen. Dreißig Anfragen nach Berlin in einer Viertelstunde kosten Open-Meteo eine, die übrigen kommen aus seinem Speicher.

  - id: webseite
    title: Die Wetterseite
    prompt: |
      Baue `index.html` mit `fetch`, die das Wetter für einen Ort zeigt, mit
      der Quelle Open-Meteo, und speichere.
    file: wetter/index.html
    check:
      type: files
      path: wetter/index.html
      expect:
        format: text
        contains:
          - { pattern: 'fetch\(', say: 'In `index.html` fragt noch nichts eine API (`fetch(…)`).' }
          - { pattern: '\.json\(\)', say: 'Noch liest die Seite die Antwort nicht als JSON: `await response.json()`.' }
          - { pattern: '(?i)open-meteo\.com</a>|Open-Meteo', say: 'Auf der Seite fehlt noch die Quelle der Daten. Die Lizenz von Open-Meteo verlangt sie.' }

  - id: abgabe
    title: Deine Wetterseite
    prompt: |
      Gib den Ordner `wetter` ab, mit `wetter.rb` und `index.html`.
    python:
      prompt: |
        Gib den Ordner `wetter` ab, mit `wetter.py` und `index.html`.
    check:
      type: submit
      paths: [wetter]
      max_size: 5MB

  - id: api-key
    title: Ein Schlüssel für eine API
    prompt: |
      Eine andere Wetter-API verlangt einen API-Schlüssel. Wo gehört er hin?
    check:
      type: choice
      options:
        - In ein Programm auf dem Server, nicht in eine Webseite und nicht in ein öffentliches Repository
        - 'In die Webseite, damit `fetch` ihn bei jeder Anfrage gleich mitschicken kann'
        - 'In die Adresse der Seite, als Parameter, damit er nicht im Quelltext steht'
        - 'Ins Wiki der Klasse, damit alle ihn nutzen können und niemand einen eigenen braucht'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Was in einer Webseite steht, kann jeder lesen, der sie öffnet, zum Beispiel mit <kbd>F12</kbd>.
    solution: Ein API-Schlüssel ist wie ein Passwort. Wer ihn kennt, fragt in deinem Namen und verbraucht dein Kontingent. Er bleibt auf dem Server; die Webseite fragt den eigenen Server, und der fragt die API.
