  - id: triangle
    title: "Was für ein Dreieck?"
    level: 3
    prompt: |
      Aus drei Stäben der Längen `a`, `b` und `c` lässt sich nur dann ein Dreieck legen, wenn je zwei zusammen länger sind als der dritte. Schreib eine Funktion `triangle(a, b, c)`, die `'keins'` zurückgibt, wenn es nicht geht, sonst `'gleichseitig'` (alle drei gleich lang), `'gleichschenklig'` (zwei gleich lang) oder `'ungleichseitig'`.
    starter: |
      def triangle(a, b, c)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "triangle(3, 3, 3)"
          expect: "'gleichseitig'"
        - call: "triangle(3, 3, 5)"
          expect: "'gleichschenklig'"
        - call: "triangle(5, 3, 3)"
          expect: "'gleichschenklig'"
        - call: "triangle(3, 5, 3)"
          expect: "'gleichschenklig'"
        - call: "triangle(3, 4, 5)"
          expect: "'ungleichseitig'"
        - call: "triangle(1, 2, 5)"
          expect: "'keins'"
          say: "Zwei Seiten mit 1 und 2 reichen nicht über eine Seite mit 5 hinweg: Das ist kein Dreieck."
        - call: "triangle(5, 1, 2)"
          expect: "'keins'"
        - call: "triangle(1, 2, 3)"
          expect: "'keins'"
          say: "Mit 1 + 2 = 3 liegen alle drei Ecken auf einer Linie: Ein Dreieck braucht zwei Seiten, die zusammen länger sind als die dritte."
    feedback:
      - when: { same_as: "def triangle(a, b, c)\n  return 'keins' if a + b < c\n  return 'gleichseitig' if a == b && b == c\n  return 'gleichschenklig' if a == b || b == c || a == c\n  'ungleichseitig'\nend\n" }
        say: "Jede Seite kann die längste sein: Prüf alle drei Paare, nicht nur `a + b` gegen `c`."
      - when: { same_as: "def triangle(a, b, c)\n  return 'keins' if a + b <= c || a + c <= b || b + c <= a\n  return 'gleichseitig' if a == b && b == c\n  return 'gleichschenklig' if a == b || b == c\n  'ungleichseitig'\nend\n" }
        say: "Auch `a` und `c` können die beiden gleich langen Seiten sein: bei `3, 5, 3`."
    hint:
      - "Lege die Beispiele im Kopf: 3, 4, 5 geht, 1, 2, 5 nicht. Was ist mit 1, 2, 3?"
