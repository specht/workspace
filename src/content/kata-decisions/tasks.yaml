  - id: rock-paper-scissors
    title: "Schere, Stein, Papier"
    extra: true
    prompt: |
      Zwei spielen Schere, Stein, Papier: Stein schlägt Schere, Schere schlägt Papier, Papier schlägt Stein. Schreib eine Funktion `rock_paper_scissors(first, second)`, die `1` zurückgibt, wenn die erste Hand gewinnt, `2`, wenn die zweite gewinnt, und `0` bei einem Unentschieden: `rock_paper_scissors('Stein', 'Schere')` ergibt `1`. Geht es mit weniger als neun Fällen?
    starter: |
      def rock_paper_scissors(first, second)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "rock_paper_scissors('Stein', 'Schere')"
          expect: "1"
        - call: "rock_paper_scissors('Schere', 'Papier')"
          expect: "1"
        - call: "rock_paper_scissors('Papier', 'Stein')"
          expect: "1"
        - call: "rock_paper_scissors('Schere', 'Stein')"
          expect: "2"
        - call: "rock_paper_scissors('Papier', 'Schere')"
          expect: "2"
        - call: "rock_paper_scissors('Stein', 'Papier')"
          expect: "2"
        - call: "rock_paper_scissors('Stein', 'Stein')"
          expect: "0"
        - call: "rock_paper_scissors('Papier', 'Papier')"
          expect: "0"
        - call: "rock_paper_scissors('Schere', 'Schere')"
          expect: "0"
    hint: |
      Wer gewinnt, hängt nur davon ab, welche Hand die andere schlägt. Eine Tabelle (ein Hash) `{ 'Stein' => 'Schere', … }` sagt das für jede Hand.
    solution: |
      ```ruby
      BEATS = { 'Stein' => 'Schere', 'Schere' => 'Papier', 'Papier' => 'Stein' }

      def rock_paper_scissors(first, second)
        return 0 if first == second
        BEATS[first] == second ? 1 : 2
      end
      ```
