    starter: |
      def pythagorean(a, b, c)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "pythagorean(3, 4, 5)"
          expect: "true"
        - call: "pythagorean(5, 12, 13)"
          expect: "true"
        - call: "pythagorean(2, 3, 4)"
          expect: "false"
        - call: "pythagorean(5, 3, 4)"
          expect: "true"
          say: "Die längste Seite muss nicht die letzte sein: 3, 4 und 5 bilden in jeder Reihenfolge ein rechtwinkliges Dreieck."
        - call: "pythagorean(13, 5, 12)"
          expect: "true"
        - call: "pythagorean(1, 1, 1)"
          expect: "false"
        - call: "pythagorean(6, 8, 10)"
          expect: "true"
