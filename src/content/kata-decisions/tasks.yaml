format: 1
activity: kata-decisions
tasks:
  - id: even
    title: "Gerade oder ungerade"
    level: 1
    prompt: |
      Schreib eine Funktion `even(n)`, die `true` zurückgibt, wenn eine Zahl gerade ist, sonst `false`: `even(4)` ergibt `true`, `even(7)` ergibt `false`. Ohne `even?` und `odd?`.
    starter: |
      def even(n)
      end
    check:
      type: function
      language: ruby
      forbid: [Integer#even?, Integer#odd?]
      cases:
        - call: "even(4)"
          expect: "true"
        - call: "even(7)"
          expect: "false"
        - call: "even(0)"
          expect: "true"
        - call: "even(-2)"
          expect: "true"
        - call: "even(-3)"
          expect: "false"
    feedback:
      - when: { same_as: "def even(n)\n  n % 2\nend\n" }
        say: "`n % 2` ist der Rest, `0` oder `1`. Gefragt ist `true` oder `false`: Ist der Rest gleich 0?"
    hint: "Eine gerade Zahl lässt bei der Division durch 2 keinen Rest. Den Rest liefert `%`."
    solution: |
      ```ruby
      def even(n)
        n % 2 == 0
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `even(n)`, die `True` zurückgibt, wenn eine Zahl gerade ist, sonst `False`: `even(4)` ergibt `True`, `even(7)` ergibt `False`.
      starter: |
        def even(n):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "even(4)"
            expect: "True"
          - call: "even(7)"
            expect: "False"
          - call: "even(0)"
            expect: "True"
          - call: "even(-2)"
            expect: "True"
          - call: "even(-3)"
            expect: "False"
      feedback:
        - when: { same_as: "def even(n):\n    return n % 2\n" }
          say: "`n % 2` ist der Rest, `0` oder `1`. Gefragt ist `True` oder `False`: Ist der Rest gleich 0?"
      hint: "Eine gerade Zahl lässt bei der Division durch 2 keinen Rest. Den Rest liefert `%`."
      solution: |
        ```python
        def even(n):
            return n % 2 == 0
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `even(n)`, die `true` zurückgibt, wenn eine Zahl gerade ist, sonst `false`: `even(4)` ergibt `true`, `even(7)` ergibt `false`.
      starter: |
        function even(n) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "even(4)"
            expect: "true"
          - call: "even(7)"
            expect: "false"
          - call: "even(0)"
            expect: "true"
          - call: "even(-2)"
            expect: "true"
          - call: "even(-3)"
            expect: "false"
      feedback:
        - when: { same_as: "function even(n) {\n  return n % 2;\n}\n" }
          say: "`n % 2` ist der Rest, `0` oder `1`. Gefragt ist `true` oder `false`: Ist der Rest gleich 0?"
      hint: |
        Eine gerade Zahl lässt bei der Division durch 2 keinen Rest. Den Rest liefert `%`. Verglichen wird in JavaScript mit `===`.
      solution: |
        ```javascript
        function even(n) {
          return n % 2 === 0;
        }
        ```

  - id: max-of-two
    title: "Die größere Zahl"
    level: 1
    prompt: |
      Schreib eine Funktion `max_of_two(a, b)`, die die größere der beiden Zahlen zurückgibt: `max_of_two(3, 7)` ergibt `7`. Ohne `max`: mit `if`.
    starter: |
      def max_of_two(a, b)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#max, Array#minmax, Array#sort, Comparable#clamp]
      cases:
        - call: "max_of_two(3, 7)"
          expect: "7"
        - call: "max_of_two(7, 3)"
          expect: "7"
        - call: "max_of_two(-1, -5)"
          expect: "-1"
        - call: "max_of_two(4, 4)"
          expect: "4"
      random:
        count: 4
        call: "max_of_two(a, b)"
        args: { a: -1000..1000, b: -1000..1000 }
        reference: "a > b ? a : b"
    feedback:
      - when: { same_as: "def max_of_two(a, b)\n  a\nend\n" }
        say: "Gib nicht immer `a` zurück: Wenn `b` größer ist, ist `b` die Antwort. Dafür ist `if` da."
    solution: |
      ```ruby
      def max_of_two(a, b)
        if a > b
          a
        else
          b
        end
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `max_of_two(a, b)`, die die größere der beiden Zahlen zurückgibt: `max_of_two(3, 7)` ergibt `7`. Ohne `max`: mit `if`.
      starter: |
        def max_of_two(a, b):
            pass
      check:
        type: function
        language: python
        forbid: [max, sorted]
        cases:
          - call: "max_of_two(3, 7)"
            expect: "7"
          - call: "max_of_two(7, 3)"
            expect: "7"
          - call: "max_of_two(-1, -5)"
            expect: "-1"
          - call: "max_of_two(4, 4)"
            expect: "4"
        random:
          count: 4
          call: "max_of_two(a, b)"
          args: { a: -1000..1000, b: -1000..1000 }
          reference: "a if a > b else b"
      feedback:
        - when: { same_as: "def max_of_two(a, b):\n    return a\n" }
          say: "Gib nicht immer `a` zurück: Wenn `b` größer ist, ist `b` die Antwort. Dafür ist `if` da."
      solution: |
        ```python
        def max_of_two(a, b):
            if a > b:
                return a
            else:
                return b
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `maxOfTwo(a, b)`, die die größere der beiden Zahlen zurückgibt: `maxOfTwo(3, 7)` ergibt `7`. Ohne `Math.max`: mit `if`.
      starter: |
        function maxOfTwo(a, b) {
        }
      check:
        type: function
        language: javascript
        forbid: [Math.max, Array.prototype.sort]
        cases:
          - call: "maxOfTwo(3, 7)"
            expect: "7"
          - call: "maxOfTwo(7, 3)"
            expect: "7"
          - call: "maxOfTwo(-1, -5)"
            expect: "-1"
          - call: "maxOfTwo(4, 4)"
            expect: "4"
        random:
          count: 4
          call: "maxOfTwo(a, b)"
          args: { a: -1000..1000, b: -1000..1000 }
          reference: "a > b ? a : b"
      feedback:
        - when: { same_as: "function maxOfTwo(a, b) {\n  return a;\n}\n" }
          say: "Gib nicht immer `a` zurück: Wenn `b` größer ist, ist `b` die Antwort. Dafür ist `if` da."
      solution: |
        ```javascript
        function maxOfTwo(a, b) {
          if (a > b) {
            return a;
          } else {
            return b;
          }
        }
        ```

  - id: absolute
    title: "Der Betrag"
    level: 1
    prompt: |
      Der Betrag einer Zahl ist ihr Abstand von 0: Er ist nie negativ. Schreib eine Funktion `absolute(n)`: `absolute(-5)` ergibt `5`, `absolute(5)` ergibt `5`. Ohne `abs`.
    starter: |
      def absolute(n)
      end
    check:
      type: function
      language: ruby
      forbid: [Integer#abs, Float#abs, Integer#magnitude, Float#magnitude]
      cases:
        - call: "absolute(-5)"
          expect: "5"
        - call: "absolute(5)"
          expect: "5"
        - call: "absolute(0)"
          expect: "0"
        - call: "absolute(-2.5)"
          expect: "2.5"
    feedback:
      - when: { same_as: "def absolute(n)\n  -n\nend\n" }
        say: "Eine positive Zahl bleibt, wie sie ist: Nur eine negative bekommt das Minus weg."
    solution: |
      ```ruby
      def absolute(n)
        n < 0 ? -n : n
      end
      ```
    python:
      prompt: |
        Der Betrag einer Zahl ist ihr Abstand von 0: Er ist nie negativ. Schreib eine Funktion `absolute(n)`: `absolute(-5)` ergibt `5`, `absolute(5)` ergibt `5`. Ohne `abs`.
      starter: |
        def absolute(n):
            pass
      check:
        type: function
        language: python
        forbid: [abs, math.fabs]
        cases:
          - call: "absolute(-5)"
            expect: "5"
          - call: "absolute(5)"
            expect: "5"
          - call: "absolute(0)"
            expect: "0"
          - call: "absolute(-2.5)"
            expect: "2.5"
      feedback:
        - when: { same_as: "def absolute(n):\n    return -n\n" }
          say: "Eine positive Zahl bleibt, wie sie ist: Nur eine negative bekommt das Minus weg."
      solution: |
        ```python
        def absolute(n):
            if n < 0:
                return -n
            return n
        ```
    javascript:
      prompt: |
        Der Betrag einer Zahl ist ihr Abstand von 0: Er ist nie negativ. Schreib eine Funktion `absolute(n)`: `absolute(-5)` ergibt `5`, `absolute(5)` ergibt `5`. Ohne `Math.abs`.
      starter: |
        function absolute(n) {
        }
      check:
        type: function
        language: javascript
        forbid: [Math.abs]
        cases:
          - call: "absolute(-5)"
            expect: "5"
          - call: "absolute(5)"
            expect: "5"
          - call: "absolute(0)"
            expect: "0"
          - call: "absolute(-2.5)"
            expect: "2.5"
      feedback:
        - when: { same_as: "function absolute(n) {\n  return -n;\n}\n" }
          say: "Eine positive Zahl bleibt, wie sie ist: Nur eine negative bekommt das Minus weg."
      solution: |
        ```javascript
        function absolute(n) {
          return n < 0 ? -n : n;
        }
        ```

