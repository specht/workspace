            expect: "0"
          - call: "rock_paper_scissors('Schere', 'Schere')"
            expect: "0"
      hint: |
        Wer gewinnt, hängt nur davon ab, welche Hand die andere schlägt. Ein Dictionary `{'Stein': 'Schere', …}` sagt das für jede Hand.
      solution: |
        ```python
        BEATS = {'Stein': 'Schere', 'Schere': 'Papier', 'Papier': 'Stein'}

