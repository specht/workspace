  - id: leap-year
    title: "Schaltjahre"
    level: 2
    prompt: |
      Ein Jahr ist ein Schaltjahr, wenn es durch 4 teilbar ist, außer volle Jahrhunderte wie 1900. Davon sind wieder die ausgenommen, die durch 400 teilbar sind: 2000 war ein Schaltjahr. Schreib eine Funktion `leap_year(year)`, die sagt, ob ein Jahr ein Schaltjahr ist.
    starter: |
      def leap_year(year)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "leap_year(2024)"
          expect: "true"
        - call: "leap_year(2023)"
          expect: "false"
        - call: "leap_year(1900)"
          expect: "false"
          say: "1900 war kein Schaltjahr: Volle Jahrhunderte sind keine Schaltjahre …"
        - call: "leap_year(2000)"
          expect: "true"
          say: "… außer, sie sind durch 400 teilbar: 2000 war ein Schaltjahr."
        - call: "leap_year(2100)"
          expect: "false"
        - call: "leap_year(1996)"
          expect: "true"
    feedback:
      - when: { same_as: "def leap_year(year)\n  year % 4 == 0\nend\n" }
        say: "Durch 4 teilbar genügt nicht: 1900 war kein Schaltjahr. Volle Jahrhunderte (durch 100 teilbar) sind ausgenommen, außer durch 400 teilbare."
      - when: { same_as: "def leap_year(year)\n  year % 4 == 0 && year % 100 != 0\nend\n" }
        say: "Fast: 2000 war doch ein Schaltjahr, weil es durch 400 teilbar ist."
    hint:
      - "Geh 1996, 1900 und 2000 von Hand durch: Welche Regel entscheidet jeweils?"
      - "Prüf von der speziellsten Regel zur allgemeinsten: erst 400, dann 100, dann 4."
      - "Mit `&&` und `||` geht es auch in einer Zeile: durch 4 teilbar und (nicht durch 100 teilbar oder durch 400 teilbar)."
    solution: |
      ```ruby
      def leap_year(year)
        year % 400 == 0 || (year % 4 == 0 && year % 100 != 0)
      end
      ```
    python:
      starter: |
        def leap_year(year):
            pass
      check:
        type: function
        language: python
        forbid: [calendar.isleap]
        cases:
          - call: "leap_year(2024)"
            expect: "True"
          - call: "leap_year(2023)"
            expect: "False"
          - call: "leap_year(1900)"
            expect: "False"
            say: "1900 war kein Schaltjahr: Volle Jahrhunderte sind keine Schaltjahre …"
          - call: "leap_year(2000)"
            expect: "True"
            say: "… außer, sie sind durch 400 teilbar: 2000 war ein Schaltjahr."
          - call: "leap_year(2100)"
            expect: "False"
          - call: "leap_year(1996)"
            expect: "True"
      feedback:
        - when: { same_as: "def leap_year(year):\n    return year % 4 == 0\n" }
          say: "Durch 4 teilbar genügt nicht: 1900 war kein Schaltjahr. Volle Jahrhunderte (durch 100 teilbar) sind ausgenommen, außer durch 400 teilbare."
        - when: { same_as: "def leap_year(year):\n    return year % 4 == 0 and year % 100 != 0\n" }
          say: "Fast: 2000 war doch ein Schaltjahr, weil es durch 400 teilbar ist."
      hint:
        - "Geh 1996, 1900 und 2000 von Hand durch: Welche Regel entscheidet jeweils?"
        - "Prüf von der speziellsten Regel zur allgemeinsten: erst 400, dann 100, dann 4."
        - "Mit `and` und `or` geht es auch in einer Zeile: durch 4 teilbar und (nicht durch 100 teilbar oder durch 400 teilbar)."
      solution: |
        ```python
        def leap_year(year):
            return year % 400 == 0 or (year % 4 == 0 and year % 100 != 0)
        ```
    javascript:
      prompt: |
        Ein Jahr ist ein Schaltjahr, wenn es durch 4 teilbar ist, außer volle Jahrhunderte wie 1900. Davon sind wieder die ausgenommen, die durch 400 teilbar sind: 2000 war ein Schaltjahr. Schreib eine Funktion `leapYear(year)`, die sagt, ob ein Jahr ein Schaltjahr ist.
      starter: |
        function leapYear(year) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "leapYear(2024)"
            expect: "true"
          - call: "leapYear(2023)"
            expect: "false"
          - call: "leapYear(1900)"
            expect: "false"
            say: "1900 war kein Schaltjahr: Volle Jahrhunderte sind keine Schaltjahre …"
          - call: "leapYear(2000)"
            expect: "true"
            say: "… außer, sie sind durch 400 teilbar: 2000 war ein Schaltjahr."
          - call: "leapYear(2100)"
            expect: "false"
          - call: "leapYear(1996)"
            expect: "true"
      feedback:
        - when: { same_as: "function leapYear(year) {\n  return year % 4 === 0;\n}\n" }
          say: "Durch 4 teilbar genügt nicht: 1900 war kein Schaltjahr. Volle Jahrhunderte (durch 100 teilbar) sind ausgenommen, außer durch 400 teilbare."
        - when: { same_as: "function leapYear(year) {\n  return year % 4 === 0 && year % 100 !== 0;\n}\n" }
          say: "Fast: 2000 war doch ein Schaltjahr, weil es durch 400 teilbar ist."
      hint:
        - "Geh 1996, 1900 und 2000 von Hand durch: Welche Regel entscheidet jeweils?"
        - "Prüf von der speziellsten Regel zur allgemeinsten: erst 400, dann 100, dann 4."
        - "Mit `&&` und `||` geht es auch in einer Zeile: durch 4 teilbar und (nicht durch 100 teilbar oder durch 400 teilbar)."
      solution: |
        ```javascript
        function leapYear(year) {
          return year % 400 === 0 || (year % 4 === 0 && year % 100 !== 0);
        }
        ```

  - id: grade
    title: "Punkte und Noten"
    level: 2
    prompt: |
      In einer Klassenarbeit gibt es höchstens 100 Punkte. Ab 92 Punkten gibt es eine 1, ab 81 eine 2, ab 67 eine 3, ab 50 eine 4, ab 30 eine 5, darunter eine 6. Schreib eine Funktion `grade(points)`, die die Note zurückgibt: `grade(85)` ergibt `2`.
    starter: |
      def grade(points)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "grade(100)"
          expect: "1"
        - call: "grade(92)"
          expect: "1"
        - call: "grade(91)"
          expect: "2"
          say: "Die Grenze gehört zur besseren Note: Ab 92 Punkten ist es eine 1, mit 91 eine 2."
        - call: "grade(81)"
          expect: "2"
        - call: "grade(80)"
          expect: "3"
        - call: "grade(67)"
          expect: "3"
        - call: "grade(66)"
          expect: "4"
        - call: "grade(50)"
          expect: "4"
        - call: "grade(49)"
          expect: "5"
        - call: "grade(30)"
          expect: "5"
        - call: "grade(29)"
          expect: "6"
        - call: "grade(0)"
          expect: "6"
    feedback:
      - when: { same_as: "def grade(points)\n  if points > 92 then 1\n  elsif points > 81 then 2\n  elsif points > 67 then 3\n  elsif points > 50 then 4\n  elsif points > 30 then 5\n  else 6\n  end\nend\n" }
        say: "»Ab 92« heißt: 92 gehört dazu. `>=` statt `>`."
      - when: { same_as: "def grade(points)\n  if points >= 30 then 5\n  elsif points >= 50 then 4\n  elsif points >= 67 then 3\n  elsif points >= 81 then 2\n  elsif points >= 92 then 1\n  else 6\n  end\nend\n" }
        say: "Die erste passende Bedingung gewinnt: Wer 95 Punkte hat, hat auch mehr als 30. Fang bei der besten Note an."
    hint:
      - "Was ist `grade(85)`, was `grade(81)`, was `grade(80)`? Schreib die drei auf, bevor du programmierst."
      - "`if … elsif … else` prüft der Reihe nach und nimmt die erste Bedingung, die stimmt. In welcher Reihenfolge müssen die Grenzen stehen?"
    solution: |
      ```ruby
      def grade(points)
        if points >= 92 then 1
        elsif points >= 81 then 2
        elsif points >= 67 then 3
        elsif points >= 50 then 4
        elsif points >= 30 then 5
        else 6
        end
      end
      ```
    python:
      starter: |
        def grade(points):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "grade(100)"
            expect: "1"
          - call: "grade(92)"
            expect: "1"
          - call: "grade(91)"
            expect: "2"
            say: "Die Grenze gehört zur besseren Note: Ab 92 Punkten ist es eine 1, mit 91 eine 2."
          - call: "grade(81)"
            expect: "2"
          - call: "grade(80)"
            expect: "3"
          - call: "grade(67)"
            expect: "3"
          - call: "grade(66)"
            expect: "4"
          - call: "grade(50)"
            expect: "4"
          - call: "grade(49)"
            expect: "5"
          - call: "grade(30)"
            expect: "5"
          - call: "grade(29)"
            expect: "6"
          - call: "grade(0)"
            expect: "6"
      feedback:
        - when: { same_as: "def grade(points):\n    if points > 92:\n        return 1\n    elif points > 81:\n        return 2\n    elif points > 67:\n        return 3\n    elif points > 50:\n        return 4\n    elif points > 30:\n        return 5\n    return 6\n" }
          say: "»Ab 92« heißt: 92 gehört dazu. `>=` statt `>`."
        - when: { same_as: "def grade(points):\n    if points >= 30:\n        return 5\n    elif points >= 50:\n        return 4\n    elif points >= 67:\n        return 3\n    elif points >= 81:\n        return 2\n    elif points >= 92:\n        return 1\n    return 6\n" }
          say: "Die erste passende Bedingung gewinnt: Wer 95 Punkte hat, hat auch mehr als 30. Fang bei der besten Note an."
      hint:
        - "Was ist `grade(85)`, was `grade(81)`, was `grade(80)`? Schreib die drei auf, bevor du programmierst."
        - "`if … elif … else` prüft der Reihe nach und nimmt die erste Bedingung, die stimmt. In welcher Reihenfolge müssen die Grenzen stehen?"
      solution: |
        ```python
        def grade(points):
            if points >= 92:
                return 1
            elif points >= 81:
                return 2
            elif points >= 67:
                return 3
            elif points >= 50:
                return 4
            elif points >= 30:
                return 5
            return 6
        ```
