          return 'keins' if # hier: eine Bedingung für jedes Paar, mit ||
          return 'gleichseitig' if # …
          # …
        end
        ```
    solution: |
      ```ruby
      def triangle(a, b, c)
        return 'keins' if a + b <= c || a + c <= b || b + c <= a
        return 'gleichseitig' if a == b && b == c
        return 'gleichschenklig' if a == b || b == c || a == c
        'ungleichseitig'
      end
