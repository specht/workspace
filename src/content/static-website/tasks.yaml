# Aufgaben zu »Statische Webseiten mit HTML & CSS«. Format: docs/aufgaben.md.
# Die Seite liegt in /workspace/website-test; geprüft werden nur Dateien darin.
format: 1
activity: static-website
tasks:
  - id: index
    title: Die erste Seite
    prompt: Speichere die Seite als `website-test/index.html`.
    check:
      type: html
      file: website-test/index.html
      expect:
        parses: true
    feedback:
      - when: { problem: missing }
        say: "`/workspace/website-test/index.html` gibt es noch nicht. Beim Speichern gibst du `website-test/index.html` als Namen ein; VS Code legt den Ordner dann an."

  - id: live
    title: Die Adresse deiner Seite
    prompt: Unter welcher Adresse zeigt »Go Live« deine Seite? Kopiere sie aus der Adresszeile.
    check:
      type: answer
      compare: url
      expect:
        - ${workspace.live_url}/
        - ${workspace.live_url}/index.html
    feedback:
      - when: { matches: '^file:' }
        say: Das ist eine Datei auf deinem Rechner. Gesucht ist die Adresse, die »Go Live« im neuen Tab öffnet.
      - when: { matches: '127\.0\.0\.1|localhost' }
        say: Diese Adresse gilt nur im Workspace selbst. Nimm die aus der Adresszeile des Tabs, den »Go Live« geöffnet hat.

  - id: liste
    title: Deine Liste
    prompt: In `index.html` steht eine Liste mit mindestens drei Punkten zu deinem Thema.
    check:
      type: html
      file: website-test/index.html
      expect:
        parses: true
        elements:
          - selector: li
            min: 3
            say: In `index.html` finde ich noch keine drei Listenpunkte. Jeder Punkt steht in einem eigenen `<li>`, alle zusammen zwischen `<ul>` und `</ul>`.

  - id: link
    title: Ein Link
    prompt: Auf deiner Seite steht ein Link mit einer Adresse in `href`.
    check:
      type: html
      file: website-test/index.html
      expect:
        parses: true
        elements:
          - selector: a
            attr: href
            say: In `index.html` finde ich kein `<a>` mit einer Adresse in `href`. So sieht ein Link aus `<a href="https://…">Text</a>`.

  - id: alt-text
    title: Ein guter Alt-Text
    prompt: |
      Auf deiner Seite steht der Abschnitt »Was frisst ein Axolotl?«. Darin ist
      ein Foto: Ein Axolotl schnappt im Aquarium nach einem roten Wurm. Welcher
      `alt`-Text passt am besten?
    check:
      type: choice
      options:
        - '`alt="Bild von einem Axolotl, der in einem Aquarium einen Wurm frisst"`'
        - '`alt="Ein rosa Axolotl mit Kiemenbüscheln in einem Aquarium"`'
        - '`alt="Ein Axolotl schnappt nach einem roten Wurm"`'
        - '`alt="axolotl-frisst-wurm-aquarium-2034.jpg"`'
        - '`alt=""`'
      correct: 2
    feedback:
      - when: { picked: 0 }
        say: Fast. Aber dass es ein Bild ist, weiß der Screenreader schon; »Bild von« liest er nur zusätzlich vor.
      - when: { picked: 1 }
        say: Das beschreibt das Tier, aber nicht, was dieses Foto zum Abschnitt beiträgt. Hier geht es ums Fressen.
      - when: { picked: 3 }
        say: Den Dateinamen liest der Screenreader vor, aber er sagt nicht, was zu sehen ist.
      - when: { picked: 4 }
        say: Ein leerer Alt-Text ist richtig für Bilder, die nur Schmuck sind. Dieses Foto zeigt, worum es im Abschnitt geht.
    solution: |
      Der `alt`-Text steht für Menschen, die das Bild nicht sehen, etwa mit einem
      Vorleseprogramm. Er sagt, was zu sehen ist und was für den Abschnitt wichtig
      ist: hier, was der Axolotl frisst. »Bild« oder der Dateiname helfen
      niemandem.

  - id: eigenes-bild
    title: Dein eigenes Bild
    prompt: |
      Lege ein eigenes Bild neben `index.html` und binde es mit einem
      relativen Pfad und einem Alt-Text ein.
    check:
      type: html
      file: website-test/index.html
      expect:
        parses: true
        img:
          min: 1
          local: 1
          src_exists: case_sensitive
          alt: required
    feedback:
      - when: { problem: image_missing }
        say: Den Pfad gibt es nicht. Liegt die Datei wirklich neben `index.html`, und stimmt die Endung (`.jpg` oder `.jpeg`, `.png`)?

  - id: bilddatei
    title: Die Bilddatei
    prompt: "Prüfe die Bilddatei selbst: Passt die Endung zum Inhalt, und ist sie nicht zu groß?"
    check:
      type: files
      path: website-test
      template: [index.html, styles.css]
      show: listing
      expect:
        new_files: { min: 1 }
        format_matches_extension: true
        max_size: 5MB
    feedback:
      - when: { problem: too_big }
        say: Das Bild ist sehr groß; die Seite lädt dann lange. Verkleinere es, zum Beispiel mit einem Bildprogramm, auf 1000 bis 2000 Pixel Breite.

  - id: css
    title: Deine erste Regel
    prompt: In `styles.css` steht eine Regel für `body` mit einer Hintergrundfarbe (`background`), einer Schriftfarbe (`color`) und einer Schrift (`font-family`), und `index.html` bindet die Datei ein.
    check:
      type: css
      file: website-test/styles.css
      linked_from: website-test/index.html
      expect:
        parses: true
        declares:
          - { selector: body, property: background, say: "Die Regel für `body` braucht eine Hintergrundfarbe: `background: …;`. Mit `background-color` ginge es auch, gefragt ist hier `background`." }
          - { selector: body, property: color, say: "Die Regel für `body` braucht eine Schriftfarbe: `color: …;`." }
          - { selector: body, property: font-family, say: "Die Regel für `body` braucht eine Schrift: `font-family: …;`, zum Beispiel `system-ui, sans-serif`." }
    feedback:
      - when: { problem: missing }
        say: "`website-test/styles.css` gibt es noch nicht. Lege die Datei im Explorer neben `index.html` an."

  - id: selektor
    title: Was ist .credit?
    prompt: Welche Elemente meint der Selektor `.credit`?
    check:
      type: choice
      options:
        - Alle `<credit>`-Elemente.
        - Alle Elemente mit `class="credit"`.
        - Das Element mit `id="credit"`.
        - Alle Links, die auf eine Bildquelle zeigen.
      correct: 1
    feedback:
      - when: { picked: 2 }
        say: Eine `id` wählst du mit `#credit` aus. Der Punkt steht für eine Klasse.
    solution: |
      Ein Punkt vor dem Namen meint eine Klasse: `.credit` trifft jedes Element
      mit `class="credit"`, ob `<p>`, `<span>` oder `<figcaption>`. Ohne Punkt
      wäre `credit` ein Element namens `<credit>`, mit `#` eine `id`.

  - id: flexbox
    title: Bild und Text nebeneinander
    prompt: "In `styles.css` stellt `main` seine Kinder mit Flexbox nebeneinander, mit Abstand dazwischen."
    check:
      type: css
      file: website-test/styles.css
      expect:
        parses: true
        declares:
          - selector: main
            property: display
            value: flex
            say: "In der Regel für `main` fehlt noch `display: flex;`."
          - selector: main
            property: gap
            say: "`main` ordnet jetzt mit Flexbox an. Gib ihm noch einen Abstand mit `gap`, zum Beispiel `gap: 2rem;`."

  - id: breite
    title: Mehr Platz fürs Bild
    prompt: Was passiert, wenn du bei `main > img` die Breite von `45%` auf `60%` änderst?
    prediction: true
    check:
      type: choice
      options:
        - Das Bild wird breiter, der Text daneben schmaler.
        - Das Bild wird breiter, der Text rutscht darunter.
        - Nichts, Flexbox legt die Breite selbst fest.
        - Das Bild wird höher, aber nicht breiter.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: 'Bild und Text teilen sich die Zeile; das Bild nimmt sich 60 % und der Text den Rest.'
      - when: { picked: 2 }
        say: 'Flexbox richtet sich nach der Breite, die du angibst. Der Text bekommt, was übrig bleibt.'
    solution: "Der Textbereich hat `flex: 1` und nimmt, was übrig bleibt. Bekommt das Bild mehr, bleibt für den Text weniger."

  - id: kleine-bildschirme
    title: Untereinander auf dem Handy
    prompt: In schmalen Fenstern stehen Bild und Text untereinander, mit einer Media Query in `styles.css`.
    check:
      type: css
      file: website-test/styles.css
      expect:
        parses: true
        declares:
          - selector: main
            property: flex-direction
            value: column
            media: max-width
            say: "Ich finde keine Media Query mit `max-width`, in der `main` die Angabe `flex-direction: column;` bekommt. Sie gehört ans Ende von `styles.css`, wie im Beispiel oben."

  - id: media-query
    title: Wann gilt die Media Query?
    prompt: "Wann gelten die Regeln in `@media (max-width: 700px) { … }`?"
    check:
      type: choice
      options:
        - Wenn das Browserfenster höchstens 700 Pixel breit ist.
        - Wenn das Fenster mindestens 700 Pixel breit ist.
        - Nur auf Handys.
        - Immer, aber erst nach 700 Millisekunden.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: '`max-width` heißt höchstens. Für mindestens gibt es `min-width`.'
      - when: { picked: 2 }
        say: 'Die Regel fragt nach der Breite des Fensters, nicht nach dem Gerät. Ein schmales Fenster am Computer zählt genauso.'
    solution: |
      `max-width: 700px` gilt, solange das Fenster höchstens 700 Pixel breit ist,
      auf einem Handy also fast immer, auf einem Rechner nur, wenn du das Fenster
      schmal ziehst. Dann gelten die Regeln darin zusätzlich zu den anderen und
      überschreiben sie, wo sie dasselbe festlegen.

  - id: abgabe
    title: Abgabe
    prompt: |
      Gib deine Webseite ab, wenn sie zu deinem Thema passt. Deine Lehrkraft
      sieht genau diesen Stand. Du kannst jederzeit neu abgeben oder die
      Abgabe löschen.
    check:
      type: submit
      paths: [website-test]
      max_size: 20MB
      requires:
        html_parses: true
