    solution: |
      ```ruby
      def nearest_tour(places)
        tour = [0]
        left = (1...places.size).to_a
        until left.empty?
          here = places[tour.last]
          nearest = left.min_by { |i| distance(here, places[i]) }
          tour << nearest
          left.delete(nearest)
        end
        tour
      end
      ```
