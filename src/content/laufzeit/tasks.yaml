  - id: tour-length
    title: Wie lang ist eine Rundfahrt?
    prompt: |
      Ein Ort ist eine Liste aus Namen, Länge und Breite, `["Brandenburger Tor", 13.377705, 52.516276]`, und eine Rundfahrt eine Liste der Nummern der Orte, `[0, 2, 1]`: vom Ort 0 zum Ort 2, von dort zum Ort 1 und zurück zum Ort 0. Kopier die Funktion `distance(a, b)` von oben in `laufzeit.rb` und schreib `tour_length(tour, places)`, die die Länge einer Rundfahrt in Kilometern ausrechnet.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      cases:
        - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505]]; distance(P[0], P[1]).round(2)"
          expect: "2.21"
          say: "`distance` kopierst du von oben, so wie sie dort steht."
        - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505]]; tour_length([0, 1, 2], P).round(2)"
          expect: "8.17"
          say: "Zur Rundfahrt gehört der Weg zurück zum ersten Ort."
