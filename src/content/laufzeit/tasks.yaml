  - id: fib-memo
    title: Fibonacci mit Gedächtnis
    prompt: |
      Die Fibonacci-Zahlen aus den Katas zur Rekursion: `fib(0)` ist 0, `fib(1)` ist 1, jede weitere ist die Summe der beiden davor. Rekursiv geschrieben ruft `fib(n)` `fib(n - 1)` und `fib(n - 2)` auf, und die rechnen dieselben Zahlen immer wieder aus. Schreib `fib_memo(n)`, die sich jede Zahl merkt, sobald sie ausgerechnet ist, so dass `fib_memo(90)` sofort fertig ist.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      timeout: 5
      slow: "`fib_memo(90)` dauert zu lange: Rechnet deine Funktion dieselben Zahlen immer wieder aus? Merk dir jede in einem Dictionary, sobald du sie hast, und schau dort zuerst nach."
      cases:
        - call: "[fib_memo(0), fib_memo(1), fib_memo(2), fib_memo(10)]"
          expect: "[0, 1, 1, 55]"
        - call: "fib_memo(90)"
          expect: "2880067194370816120"
    hint:
      - "Das Gedächtnis ist ein Dictionary, `memo = {}`, das jeder Aufruf weitergibt: `def fib_memo(n, memo = {})` und innen `fib_memo(n - 1, memo)`."
      - "Steht `n` schon in `memo`, gibt die Funktion den Wert von dort zurück; sonst rechnet sie ihn aus und trägt ihn ein: `memo[n] ||= fib_memo(n - 1, memo) + fib_memo(n - 2, memo)`."
    solution: |
      ```ruby
      def fib_memo(n, memo = {})
        return n if n < 2
        memo[n] ||= fib_memo(n - 1, memo) + fib_memo(n - 2, memo)
      end
      ```
    python:
      prompt: |
        Die Fibonacci-Zahlen aus den Katas zur Rekursion: `fib(0)` ist 0, `fib(1)` ist 1, jede weitere ist die Summe der beiden davor. Rekursiv geschrieben ruft `fib(n)` `fib(n - 1)` und `fib(n - 2)` auf, und die rechnen dieselben Zahlen immer wieder aus. Schreib `fib_memo(n)`, die sich jede Zahl merkt, sobald sie ausgerechnet ist, so dass `fib_memo(90)` sofort fertig ist.
      check:
        type: python
        file: laufzeit/laufzeit.py
        timeout: 5
        slow: "`fib_memo(90)` dauert zu lange: Rechnet deine Funktion dieselben Zahlen immer wieder aus? Merk dir jede in einem Dictionary, sobald du sie hast, und schau dort zuerst nach."
        cases:
          - call: "[fib_memo(0), fib_memo(1), fib_memo(2), fib_memo(10)]"
            expect: "[0, 1, 1, 55]"
          - call: "fib_memo(90)"
            expect: "2880067194370816120"
      hint:
        - "Das Gedächtnis ist ein Dictionary, das jeder Aufruf weitergibt: `def fib_memo(n, memo=None):`, beim ersten Aufruf `memo = {}`, und innen `fib_memo(n - 1, memo)`. (Ein `memo={}` als Vorgabe würde Python nur einmal anlegen und für alle Aufrufe behalten.)"
        - "Steht `n` schon in `memo`, gibt die Funktion `memo[n]` zurück; sonst rechnet sie den Wert aus, trägt ihn ein und gibt ihn zurück."
      solution: |
        ```python
        def fib_memo(n, memo=None):
            if memo is None:
                memo = {}
            if n < 2:
                return n
            if n not in memo:
                memo[n] = fib_memo(n - 1, memo) + fib_memo(n - 2, memo)
            return memo[n]
        ```
    dart:
      prompt: |
