        cases:
          - { call: "[fibMemo(0), fibMemo(1), fibMemo(2), fibMemo(10)]", expect: "[0, 1, 1, 55]" }
          - { call: "fibMemo(90)", expect: 2880067194370816120 }
      hint:
        - "Das Gedächtnis ist eine Map, die jeder Aufruf weitergibt: Beim ersten Aufruf fehlt sie, `memo ??= {};` legt dann eine an, und innen ruft die Funktion `fibMemo(n - 1, memo)` auf."
        - "Steht `n` schon in `memo`, gibt die Funktion den Wert von dort zurück; sonst rechnet sie ihn aus und trägt ihn ein: `return memo[n] ??= fibMemo(n - 1, memo) + fibMemo(n - 2, memo);`."
      solution: |
        ```dart
        int fibMemo(int n, [Map<int, int>? memo]) {
          memo ??= {};
          if (n < 2) {
