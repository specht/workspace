# Aufgaben zu »Wie lange dauert das? Laufzeit und Aufwand«. Format: docs/aufgaben.md.
format: 1
activity: laufzeit
tasks:
  - id: distinct-list
    title: Mit einer Liste
    prompt: |
      Schreib in `laufzeit.rb` eine Funktion `distinct_list(names)`, die zählt, wie viele verschiedene Namen in der Liste `names` stehen. Sie merkt sich in einer zweiten Liste, welche Namen sie schon gesehen hat, und fragt diese Liste bei jedem Namen, ob er schon darin steht.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      cases:
        - call: "distinct_list(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])"
          expect: "2"
        - call: "distinct_list([])"
          expect: "0"
        - call: "distinct_list(['Dorfstraße'] * 5)"
          expect: "1"
        - call: "distinct_list(%w[a b c d e f])"
          expect: "6"
    hint:
      - "Eine leere Liste `seen = []`; für jeden Namen: Steht er noch nicht darin, `seen.include?(name)`, kommt er hinein."
      - "Am Ende ist die Zahl der verschiedenen Namen `seen.size`."
    solution: |
      ```ruby
      def distinct_list(names)
        seen = []
        names.each do |name|
          seen << name unless seen.include?(name)
        end
        seen.size
      end
      ```
    python:
      prompt: |
        Schreib in `laufzeit.py` eine Funktion `distinct_list(names)`, die zählt, wie viele verschiedene Namen in der Liste `names` stehen. Sie merkt sich in einer zweiten Liste, welche Namen sie schon gesehen hat, und fragt diese Liste bei jedem Namen, ob er schon darin steht.
      check:
        type: python
        file: laufzeit/laufzeit.py
        cases:
          - call: "distinct_list(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])"
            expect: "2"
          - call: "distinct_list([])"
            expect: "0"
          - call: "distinct_list(['Dorfstraße'] * 5)"
            expect: "1"
          - call: "distinct_list(list('abcdef'))"
            expect: "6"
      hint:
        - "Eine leere Liste `seen = []`; für jeden Namen: Steht er noch nicht darin, `if name not in seen:`, kommt er hinein."
        - "Am Ende ist die Zahl der verschiedenen Namen `len(seen)`."
      solution: |
        ```python
        def distinct_list(names):
            seen = []
            for name in names:
                if name not in seen:
                    seen.append(name)
            return len(seen)
        ```

  - id: distinct-sorted
    title: Erst sortieren
    prompt: |
      Schreib `distinct_sorted(names)`, die dasselbe zählt, aber anders: Sie sortiert die Namen zuerst. Dann stehen gleiche Namen nebeneinander, und ein neuer Name beginnt dort, wo einer anders ist als der davor.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      timeout: 10
      slow: "Für 300 000 verschiedene Namen braucht deine Funktion zu lange. Vergleicht sie jeden Namen nur mit dem davor, nachdem sie sortiert hat?"
      cases:
        - call: "distinct_sorted(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])"
          expect: "2"
        - call: "distinct_sorted([])"
          expect: "0"
        - call: "distinct_sorted(['b', 'a', 'b', 'a', 'c'])"
          expect: "3"
        - call: "distinct_sorted((1..300_000).map(&:to_s))"
          expect: "300000"
    hint:
      - "`sorted = names.sort` gibt eine sortierte Kopie. Gezählt wird jeder Name, der anders ist als der davor, und der erste."
      - "`sorted.each_with_index do |name, i|` gibt jeden Namen mit seinem Index; der davor ist `sorted[i - 1]`, und beim ersten, `i == 0`, gibt es keinen davor."
    solution: |
      ```ruby
      def distinct_sorted(names)
        sorted = names.sort
        count = 0
        sorted.each_with_index do |name, i|
          count += 1 if i == 0 || name != sorted[i - 1]
        end
        count
      end
      ```
    python:
      prompt: |
        Schreib `distinct_sorted(names)`, die dasselbe zählt, aber anders: Sie sortiert die Namen zuerst. Dann stehen gleiche Namen nebeneinander, und ein neuer Name beginnt dort, wo einer anders ist als der davor.
      check:
        type: python
        file: laufzeit/laufzeit.py
        timeout: 10
        slow: "Für 300 000 verschiedene Namen braucht deine Funktion zu lange. Vergleicht sie jeden Namen nur mit dem davor, nachdem sie sortiert hat?"
        cases:
          - call: "distinct_sorted(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])"
            expect: "2"
          - call: "distinct_sorted([])"
            expect: "0"
          - call: "distinct_sorted(['b', 'a', 'b', 'a', 'c'])"
            expect: "3"
          - call: "distinct_sorted([str(i) for i in range(300000)])"
            expect: "300000"
      hint:
        - "`ordered = sorted(names)` gibt eine sortierte Kopie. Gezählt wird jeder Name, der anders ist als der davor, und der erste."
        - "`for i, name in enumerate(ordered):` gibt jeden Namen mit seinem Index; der davor ist `ordered[i - 1]`, und beim ersten, `i == 0`, gibt es keinen davor."
      solution: |
        ```python
        def distinct_sorted(names):
            ordered = sorted(names)
            count = 0
            for i, name in enumerate(ordered):
                if i == 0 or name != ordered[i - 1]:
                    count += 1
            return count
        ```

  - id: distinct-set
    title: Mit einer Menge
    prompt: |
      Schreib `distinct_set(names)`, die die Namen in eine Menge legt, ein `Set`. Eine Menge enthält jeden Namen nur einmal, und ob sie einen schon hat, weiß sie, ohne zu suchen. Die Zahl der verschiedenen Namen ist dann ihre Größe.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      timeout: 10
      slow: "Für 300 000 verschiedene Namen braucht deine Funktion zu lange. Fragt sie eine Liste, ob ein Name schon darin steht? Eine Menge (`Set`) weiß es sofort."
      cases:
        - call: "distinct_set(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])"
          expect: "2"
        - call: "distinct_set([])"
          expect: "0"
        - call: "distinct_set((1..300_000).map(&:to_s))"
          expect: "300000"
    hint:
      - "Ganz oben in der Datei `require 'set'`, dann `seen = Set.new`."
      - "Jeder Name kommt mit `seen << name` hinein; ein Name, der schon darin ist, kommt nicht zweimal hinein. Am Ende ist `seen.size` die Antwort."
    solution: |
      ```ruby
      require 'set'

      def distinct_set(names)
        seen = Set.new
        names.each { |name| seen << name }
        seen.size
      end
      ```
    python:
      prompt: |
        Schreib `distinct_set(names)`, die die Namen in eine Menge legt, ein `set`. Eine Menge enthält jeden Namen nur einmal, und ob sie einen schon hat, weiß sie, ohne zu suchen. Die Zahl der verschiedenen Namen ist dann ihre Größe.
      check:
        type: python
        file: laufzeit/laufzeit.py
        timeout: 10
        slow: "Für 300 000 verschiedene Namen braucht deine Funktion zu lange. Fragt sie eine Liste, ob ein Name schon darin steht? Eine Menge (`set`) weiß es sofort."
        cases:
          - call: "distinct_set(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])"
            expect: "2"
          - call: "distinct_set([])"
            expect: "0"
          - call: "distinct_set([str(i) for i in range(300000)])"
            expect: "300000"
      hint:
        - "Eine leere Menge ist `seen = set()`."
        - "Jeder Name kommt mit `seen.add(name)` hinein; ein Name, der schon darin ist, kommt nicht zweimal hinein. Am Ende ist `len(seen)` die Antwort."
      solution: |
        ```python
        def distinct_set(names):
            seen = set()
            for name in names:
                seen.add(name)
            return len(seen)
        ```

