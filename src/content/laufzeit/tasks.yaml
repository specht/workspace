        }
        ```
    java:
      prompt: |
        Die Fibonacci-Zahlen aus den Katas zur Rekursion: `fib(0)` ist 0, `fib(1)` ist 1, jede weitere ist die Summe der beiden davor. Rekursiv geschrieben ruft `fib(n)` `fib(n - 1)` und `fib(n - 2)` auf, und die rechnen dieselben Zahlen immer wieder aus. Schreib `public static long fibMemo(int n)`, die sich jede Zahl merkt, sobald sie ausgerechnet ist, so dass `fibMemo(90)` sofort fertig ist. Sie gibt `long` zurück, denn `fib(90)` passt nicht in ein `int`.
      check:
        type: java
        file: laufzeit/Laufzeit.java
        timeout: 15
        slow: "`fibMemo(90)` dauert zu lange: Rechnet deine Methode dieselben Zahlen immer wieder aus? Merk dir jede in einer Map, sobald du sie hast, und schau dort zuerst nach."
        cases:
          - { call: "List.of(Laufzeit.fibMemo(0), Laufzeit.fibMemo(1), Laufzeit.fibMemo(2), Laufzeit.fibMemo(10))", expect: "List.of(0, 1, 1, 55)" }
          - { call: "Laufzeit.fibMemo(90)", expect: "2880067194370816120L" }
      hint:
        - "Das Gedächtnis ist eine Map, die jeder Aufruf weitergibt: `fibMemo(n)` ruft eine zweite Methode `fibMemo(int n, Map<Integer, Long> memo)` mit `new HashMap<>()` auf, und die ruft sich selbst mit derselben Map auf."
        - "Steht `n` noch nicht in `memo`, rechnet sie den Wert aus und trägt ihn ein, `memo.put(n, …)`; dann gibt sie `memo.get(n)` zurück."
      solution: |
        ```java
        public static long fibMemo(int n) {
            return fibMemo(n, new HashMap<>());
        }

        static long fibMemo(int n, Map<Integer, Long> memo) {
            if (n < 2) {
                return n;
            }
            if (!memo.containsKey(n)) {
                memo.put(n, fibMemo(n - 1, memo) + fibMemo(n - 2, memo));
            }
            return memo.get(n);
        }
        ```

