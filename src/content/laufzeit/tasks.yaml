  - id: fib-memo
    title: Fibonacci mit Gedächtnis
    prompt: |
      Die Fibonacci-Zahlen aus den Katas zur Rekursion: `fib(0)` ist 0, `fib(1)` ist 1, jede weitere ist die Summe der beiden davor. Rekursiv geschrieben ruft `fib(n)` `fib(n - 1)` und `fib(n - 2)` auf, und die rechnen dieselben Zahlen immer wieder aus. Schreib `fib_memo(n)`, die sich jede Zahl merkt, sobald sie ausgerechnet ist, so dass `fib_memo(90)` sofort fertig ist.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      timeout: 5
      slow: "`fib_memo(90)` dauert zu lange: Rechnet deine Funktion dieselben Zahlen immer wieder aus? Merk dir jede in einem Dictionary, sobald du sie hast, und schau dort zuerst nach."
      cases:
        - call: "[fib_memo(0), fib_memo(1), fib_memo(2), fib_memo(10)]"
          expect: "[0, 1, 1, 55]"
        - call: "fib_memo(90)"
          expect: "2880067194370816120"
    hint:
      - "Das Gedächtnis ist ein Dictionary, `memo = {}`, das jeder Aufruf weitergibt: `def fib_memo(n, memo = {})` und innen `fib_memo(n - 1, memo)`."
      - "Steht `n` schon in `memo`, gibt die Funktion den Wert von dort zurück; sonst rechnet sie ihn aus und trägt ihn ein: `memo[n] ||= fib_memo(n - 1, memo) + fib_memo(n - 2, memo)`."
    solution: |
      ```ruby
      def fib_memo(n, memo = {})
        return n if n < 2
        memo[n] ||= fib_memo(n - 1, memo) + fib_memo(n - 2, memo)
      end
      ```
    python:
      prompt: |
        Die Fibonacci-Zahlen aus den Katas zur Rekursion: `fib(0)` ist 0, `fib(1)` ist 1, jede weitere ist die Summe der beiden davor. Rekursiv geschrieben ruft `fib(n)` `fib(n - 1)` und `fib(n - 2)` auf, und die rechnen dieselben Zahlen immer wieder aus. Schreib `fib_memo(n)`, die sich jede Zahl merkt, sobald sie ausgerechnet ist, so dass `fib_memo(90)` sofort fertig ist.
      check:
        type: python
        file: laufzeit/laufzeit.py
        timeout: 5
        slow: "`fib_memo(90)` dauert zu lange: Rechnet deine Funktion dieselben Zahlen immer wieder aus? Merk dir jede in einem Dictionary, sobald du sie hast, und schau dort zuerst nach."
        cases:
          - call: "[fib_memo(0), fib_memo(1), fib_memo(2), fib_memo(10)]"
            expect: "[0, 1, 1, 55]"
          - call: "fib_memo(90)"
            expect: "2880067194370816120"
      hint:
        - "Das Gedächtnis ist ein Dictionary, das jeder Aufruf weitergibt: `def fib_memo(n, memo=None):`, beim ersten Aufruf `memo = {}`, und innen `fib_memo(n - 1, memo)`. (Ein `memo={}` als Vorgabe würde Python nur einmal anlegen und für alle Aufrufe behalten.)"
        - "Steht `n` schon in `memo`, gibt die Funktion `memo[n]` zurück; sonst rechnet sie den Wert aus, trägt ihn ein und gibt ihn zurück."
      solution: |
        ```python
        def fib_memo(n, memo=None):
            if memo is None:
                memo = {}
            if n < 2:
                return n
            if n not in memo:
                memo[n] = fib_memo(n - 1, memo) + fib_memo(n - 2, memo)
            return memo[n]
        ```

  - id: pair-with-sum
    title: Zwei, die zusammenpassen
    prompt: |
      Schreib `pair_with_sum?(numbers, target)`: Gibt es in der Liste zwei Zahlen an verschiedenen Stellen, die zusammen `target` ergeben? Mit zwei Schleifen ineinander ginge es, aber die Prüfung gibt deiner Funktion 200 000 Zahlen. Geh die Liste einmal durch und merk dir in einer Menge, welche Zahlen du schon gesehen hast.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      timeout: 5
      slow: "Für 200 000 Zahlen braucht deine Funktion zu lange. Zwei Schleifen ineinander sind 20 Milliarden Paare: Merk dir in einer Menge, was du gesehen hast, und frag bei jeder Zahl, ob `target - x` schon darin ist."
      cases:
        - call: "pair_with_sum?([3, 5, 8], 11)"
          expect: "true"
        - call: "pair_with_sum?([3, 5, 8], 10)"
          expect: "false"
          say: "Eine Zahl zählt nur einmal: 5 und 5 an derselben Stelle ergeben kein Paar."
        - call: "pair_with_sum?([5, 1, 5], 10)"
          expect: "true"
        - call: "pair_with_sum?([], 0)"
          expect: "false"
        - call: "pair_with_sum?((1..200_000).to_a, 399_999)"
          expect: "true"
        - call: "pair_with_sum?((1..200_000).map { |x| 2 * x }, 7)"
          expect: "false"
    hint:
      - "Für jede Zahl `x` passt genau eine andere: `target - x`. Die Frage ist nur, ob sie schon vorkam."
      - "Eine Menge `seen = Set.new`; für jede Zahl: Ist `target - x` in `seen`, gibt es ein Paar; sonst kommt `x` hinein. Erst danach, so zählt keine Zahl doppelt."
    solution: |
      ```ruby
      def pair_with_sum?(numbers, target)
        seen = Set.new
        numbers.each do |x|
          return true if seen.include?(target - x)
          seen << x
        end
        false
      end
      ```
    python:
      prompt: |
        Schreib `has_pair_with_sum(numbers, target)`: Gibt es in der Liste zwei Zahlen an verschiedenen Stellen, die zusammen `target` ergeben? Mit zwei Schleifen ineinander ginge es, aber die Prüfung gibt deiner Funktion 200 000 Zahlen. Geh die Liste einmal durch und merk dir in einer Menge, welche Zahlen du schon gesehen hast.
      check:
        type: python
        file: laufzeit/laufzeit.py
        timeout: 5
        slow: "Für 200 000 Zahlen braucht deine Funktion zu lange. Zwei Schleifen ineinander sind 20 Milliarden Paare: Merk dir in einer Menge, was du gesehen hast, und frag bei jeder Zahl, ob `target - x` schon darin ist."
        cases:
          - call: "has_pair_with_sum([3, 5, 8], 11)"
            expect: "True"
          - call: "has_pair_with_sum([3, 5, 8], 10)"
            expect: "False"
            say: "Eine Zahl zählt nur einmal: 5 und 5 an derselben Stelle ergeben kein Paar."
          - call: "has_pair_with_sum([5, 1, 5], 10)"
            expect: "True"
          - call: "has_pair_with_sum([], 0)"
            expect: "False"
          - call: "has_pair_with_sum(list(range(1, 200001)), 399999)"
            expect: "True"
          - call: "has_pair_with_sum([2 * x for x in range(1, 200001)], 7)"
            expect: "False"
      hint:
        - "Für jede Zahl `x` passt genau eine andere: `target - x`. Die Frage ist nur, ob sie schon vorkam."
        - "Eine Menge `seen = set()`; für jede Zahl: Ist `target - x in seen`, gibt es ein Paar; sonst kommt `x` hinein. Erst danach, so zählt keine Zahl doppelt."
      solution: |
        ```python
        def has_pair_with_sum(numbers, target):
            seen = set()
            for x in numbers:
                if target - x in seen:
                    return True
                seen.add(x)
            return False
        ```

  - id: tour-length
    title: Wie lang ist eine Rundfahrt?
    prompt: |
      Ein Ort ist eine Liste aus Namen, Länge und Breite, `["Brandenburger Tor", 13.377705, 52.516276]`, und eine Rundfahrt eine Liste der Nummern der Orte, `[0, 2, 1]`: vom Ort 0 zum Ort 2, von dort zum Ort 1 und zurück zum Ort 0. Kopier die Funktion `distance(a, b)` von oben in `laufzeit.rb` und schreib `tour_length(tour, places)`, die die Länge einer Rundfahrt in Kilometern ausrechnet.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      cases:
        - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505]]; distance(P[0], P[1]).round(2)"
          expect: "2.21"
          say: "`distance` kopierst du von oben, so wie sie dort steht."
        - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505]]; tour_length([0, 1, 2], P).round(2)"
          expect: "8.17"
          say: "Zur Rundfahrt gehört der Weg zurück zum ersten Ort."
        - call: "P = [['A', 13.4, 52.5], ['B', 13.5, 52.5]]; [tour_length([0, 1], P).round(2), tour_length([1, 0], P).round(2)]"
          expect: "[13.55, 13.55]"
    hint:
      - "Gezählt wird jeder Schritt von einem Ort zum nächsten in der Liste: vom Ort `tour[i]` zum Ort `tour[i + 1]`."
      - "Der letzte Schritt geht zurück zum ersten Ort: `tour[(i + 1) % tour.size]` ist beim letzten Index wieder `tour[0]`."
    solution: |
      ```ruby
      def tour_length(tour, places)
        total = 0.0
        tour.each_with_index do |from, i|
          to = tour[(i + 1) % tour.size]
          total += distance(places[from], places[to])
        end
        total
      end
      ```
    python:
      prompt: |
        Ein Ort ist eine Liste aus Namen, Länge und Breite, `["Brandenburger Tor", 13.377705, 52.516276]`, und eine Rundfahrt eine Liste der Nummern der Orte, `[0, 2, 1]`: vom Ort 0 zum Ort 2, von dort zum Ort 1 und zurück zum Ort 0. Kopier die Funktion `distance(a, b)` von oben in `laufzeit.py` und schreib `tour_length(tour, places)`, die die Länge einer Rundfahrt in Kilometern ausrechnet.
      check:
        type: python
        file: laufzeit/laufzeit.py
        cases:
          - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505]]; round(distance(P[0], P[1]), 2)"
            expect: "2.21"
            say: "`distance` kopierst du von oben, so wie sie dort steht."
          - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505]]; round(tour_length([0, 1, 2], P), 2)"
            expect: "8.17"
            say: "Zur Rundfahrt gehört der Weg zurück zum ersten Ort."
          - call: "P = [['A', 13.4, 52.5], ['B', 13.5, 52.5]]; [round(tour_length([0, 1], P), 2), round(tour_length([1, 0], P), 2)]"
            expect: "[13.55, 13.55]"
      hint:
        - "Gezählt wird jeder Schritt von einem Ort zum nächsten in der Liste: vom Ort `tour[i]` zum Ort `tour[i + 1]`."
        - "Der letzte Schritt geht zurück zum ersten Ort: `tour[(i + 1) % len(tour)]` ist beim letzten Index wieder `tour[0]`."
      solution: |
        ```python
        def tour_length(tour, places):
            total = 0.0
            for i, here in enumerate(tour):
                there = tour[(i + 1) % len(tour)]
                total += distance(places[here], places[there])
            return total
        ```

  - id: best-tour
    title: Alle Reihenfolgen
    prompt: |
      Schreib `best_tour(places)`, die die kürzeste Rundfahrt findet, indem sie alle ausprobiert. Der erste Ort bleibt vorn; die anderen kommen in jeder Reihenfolge dahinter.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      timeout: 10
      cases:
        - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505], ['Rotes Rathaus', 13.408482, 52.518329], ['Checkpoint Charlie', 13.390381, 52.507432], ['Berliner Dom', 13.400966, 52.519082]]; t = best_tour(P); [t.first, t.sort, tour_length(t, P).round(2)]"
          expect: "[0, [0, 1, 2, 3, 4, 5], 8.93]"
          say: "Die Rundfahrt beginnt mit dem Ort 0 und besucht jeden Ort genau einmal; die kürzeste ist 8,93 km lang."
        - call: "P = [['A', 13.4, 52.5], ['B', 13.5, 52.5]]; best_tour(P)"
          expect: "[0, 1]"
    hint:
      - "`(1...places.size).to_a.permutation` gibt alle Reihenfolgen der Orte außer dem ersten. Vor jede kommt die 0."
      - "Von allen Rundfahrten die mit der kleinsten Länge: `min_by { |tour| tour_length(tour, places) }`."
    solution: |
      ```ruby
      def best_tour(places)
        rest = (1...places.size).to_a
        rest.permutation.map { |order| [0] + order }.min_by { |tour| tour_length(tour, places) }
      end
      ```
    python:
      prompt: |
        Schreib `best_tour(places)`, die die kürzeste Rundfahrt findet, indem sie alle ausprobiert. Der erste Ort bleibt vorn; die anderen kommen in jeder Reihenfolge dahinter.
      check:
        type: python
        file: laufzeit/laufzeit.py
        timeout: 10
        cases:
          - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505], ['Rotes Rathaus', 13.408482, 52.518329], ['Checkpoint Charlie', 13.390381, 52.507432], ['Berliner Dom', 13.400966, 52.519082]]; t = best_tour(P); [t[0], sorted(t), round(tour_length(t, P), 2)]"
            expect: "[0, [0, 1, 2, 3, 4, 5], 8.93]"
            say: "Die Rundfahrt beginnt mit dem Ort 0 und besucht jeden Ort genau einmal; die kürzeste ist 8,93 km lang."
          - call: "P = [['A', 13.4, 52.5], ['B', 13.5, 52.5]]; list(best_tour(P))"
            expect: "[0, 1]"
      hint:
        - "Ganz oben `import itertools`; `itertools.permutations(range(1, len(places)))` gibt alle Reihenfolgen der Orte außer dem ersten. Vor jede kommt die 0: `[0] + list(order)`."
        - "Von allen Rundfahrten die mit der kleinsten Länge: `min(tours, key=lambda tour: tour_length(tour, places))`."
      solution: |
        ```python
        import itertools


        def best_tour(places):
            tours = ([0] + list(order) for order in itertools.permutations(range(1, len(places))))
            return min(tours, key=lambda tour: tour_length(tour, places))
        ```

