  - id: best-tour
    title: Alle Reihenfolgen
    prompt: |
      Schreib `best_tour(places)`, die die kürzeste Rundfahrt findet, indem sie alle ausprobiert. Der erste Ort bleibt vorn; die anderen kommen in jeder Reihenfolge dahinter.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      timeout: 10
      cases:
        - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505], ['Rotes Rathaus', 13.408482, 52.518329], ['Checkpoint Charlie', 13.390381, 52.507432], ['Berliner Dom', 13.400966, 52.519082]]; t = best_tour(P); [t.first, t.sort, tour_length(t, P).round(2)]"
          expect: "[0, [0, 1, 2, 3, 4, 5], 8.93]"
          say: "Die Rundfahrt beginnt mit dem Ort 0 und besucht jeden Ort genau einmal; die kürzeste ist 8,93 km lang."
        - call: "P = [['A', 13.4, 52.5], ['B', 13.5, 52.5]]; best_tour(P)"
          expect: "[0, 1]"
    hint:
      - "`(1...places.size).to_a.permutation` gibt alle Reihenfolgen der Orte außer dem ersten. Vor jede kommt die 0."
      - "Von allen Rundfahrten die mit der kleinsten Länge: `min_by { |tour| tour_length(tour, places) }`."
    solution: |
      ```ruby
      def best_tour(places)
        rest = (1...places.size).to_a
        rest.permutation.map { |order| [0] + order }.min_by { |tour| tour_length(tour, places) }
      end
      ```
