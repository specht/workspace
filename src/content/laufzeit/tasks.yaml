  - id: nearest-tour
    title: Immer zum nächsten Ort
    prompt: |
      Schreib `nearest_tour(places)`: Vom ersten Ort aus geht die Rundfahrt immer zu dem Ort, der am nächsten liegt und an dem sie noch nicht war. Sie probiert nichts aus und ist darum schnell, aber nicht immer die kürzeste.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      timeout: 10
      cases:
        - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505], ['Rotes Rathaus', 13.408482, 52.518329], ['Checkpoint Charlie', 13.390381, 52.507432], ['Berliner Dom', 13.400966, 52.519082]]; nearest_tour(P)"
          expect: "[0, 4, 5, 3, 1, 2]"
          say: "Vom Brandenburger Tor ist Checkpoint Charlie am nächsten, von dort der Dom, dann das Rote Rathaus, der Fernsehturm und zuletzt die Siegessäule."
        - call: "P = (0...300).map { |i| [i.to_s, 13.0 + i * 0.001, 52.5] }; t = nearest_tour(P); [t.first(3), t.size]"
          expect: "[[0, 1, 2], 300]"
    hint:
      - "Die Rundfahrt beginnt mit `[0]`; eine zweite Liste hält die Orte, an denen sie noch nicht war, `left = (1...places.size).to_a`."
      - "Solange `left` nicht leer ist: der nächste Ort zum letzten der Rundfahrt, `left.min_by { |i| distance(places[tour.last], places[i]) }`, kommt hinten an die Rundfahrt und aus `left` heraus."
    solution: |
      ```ruby
      def nearest_tour(places)
        tour = [0]
        left = (1...places.size).to_a
        until left.empty?
          here = places[tour.last]
          nearest = left.min_by { |i| distance(here, places[i]) }
          tour << nearest
          left.delete(nearest)
        end
        tour
      end
      ```
    python:
      prompt: |
        Schreib `nearest_tour(places)`: Vom ersten Ort aus geht die Rundfahrt immer zu dem Ort, der am nächsten liegt und an dem sie noch nicht war. Sie probiert nichts aus und ist darum schnell, aber nicht immer die kürzeste.
      check:
        type: python
        file: laufzeit/laufzeit.py
        timeout: 10
        cases:
          - call: "P = [['Brandenburger Tor', 13.377705, 52.516276], ['Berliner Fernsehturm', 13.409423, 52.520825], ['Siegessäule', 13.3501, 52.514505], ['Rotes Rathaus', 13.408482, 52.518329], ['Checkpoint Charlie', 13.390381, 52.507432], ['Berliner Dom', 13.400966, 52.519082]]; nearest_tour(P)"
            expect: "[0, 4, 5, 3, 1, 2]"
            say: "Vom Brandenburger Tor ist Checkpoint Charlie am nächsten, von dort der Dom, dann das Rote Rathaus, der Fernsehturm und zuletzt die Siegessäule."
          - call: "P = [[str(i), 13.0 + i * 0.001, 52.5] for i in range(300)]; t = nearest_tour(P); [t[:3], len(t)]"
            expect: "[[0, 1, 2], 300]"
      hint:
        - "Die Rundfahrt beginnt mit `[0]`; eine zweite Liste hält die Orte, an denen sie noch nicht war, `left = list(range(1, len(places)))`."
        - "Solange `left` nicht leer ist: der nächste Ort zum letzten der Rundfahrt, `min(left, key=lambda i: distance(places[tour[-1]], places[i]))`, kommt hinten an die Rundfahrt und aus `left` heraus."
      solution: |
        ```python
        def nearest_tour(places):
            tour = [0]
            left = list(range(1, len(places)))
            while left:
                here = places[tour[-1]]
                nearest = min(left, key=lambda i: distance(here, places[i]))
                tour.append(nearest)
                left.remove(nearest)
            return tour
        ```

