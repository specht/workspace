# Aufgaben zu »Wie lange dauert das? Laufzeit und Aufwand«. Format: docs/aufgaben.md.
format: 1
activity: laufzeit
tasks:
  - id: distinct-list
    title: Mit einer Liste
    prompt: |
      Schreib in `laufzeit.rb` eine Funktion `distinct_list(names)`, die zählt, wie viele verschiedene Namen in der Liste `names` stehen. Sie merkt sich in einer zweiten Liste, welche Namen sie schon gesehen hat, und fragt diese Liste bei jedem Namen, ob er schon darin steht.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      cases:
        - call: "distinct_list(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])"
          expect: "2"
        - call: "distinct_list([])"
          expect: "0"
        - call: "distinct_list(['Dorfstraße'] * 5)"
          expect: "1"
        - call: "distinct_list(%w[a b c d e f])"
          expect: "6"
    hint:
      - "Eine leere Liste `seen = []`; für jeden Namen: Steht er noch nicht darin, `seen.include?(name)`, kommt er hinein."
      - "Am Ende ist die Zahl der verschiedenen Namen `seen.size`."
    solution: |
      ```ruby
      def distinct_list(names)
        seen = []
        names.each do |name|
          seen << name unless seen.include?(name)
        end
        seen.size
      end
      ```
    python:
      prompt: |
        Schreib in `laufzeit.py` eine Funktion `distinct_list(names)`, die zählt, wie viele verschiedene Namen in der Liste `names` stehen. Sie merkt sich in einer zweiten Liste, welche Namen sie schon gesehen hat, und fragt diese Liste bei jedem Namen, ob er schon darin steht.
      check:
        type: python
        file: laufzeit/laufzeit.py
        cases:
          - call: "distinct_list(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])"
            expect: "2"
          - call: "distinct_list([])"
            expect: "0"
          - call: "distinct_list(['Dorfstraße'] * 5)"
            expect: "1"
          - call: "distinct_list(list('abcdef'))"
            expect: "6"
      hint:
        - "Eine leere Liste `seen = []`; für jeden Namen: Steht er noch nicht darin, `if name not in seen:`, kommt er hinein."
        - "Am Ende ist die Zahl der verschiedenen Namen `len(seen)`."
      solution: |
        ```python
        def distinct_list(names):
            seen = []
            for name in names:
                if name not in seen:
                    seen.append(name)
            return len(seen)
        ```
    dart:
      prompt: |
        Schreib in `laufzeit.dart` eine Funktion `int distinctList(List<String> names)`, die zählt, wie viele verschiedene Namen in der Liste `names` stehen. Sie merkt sich in einer zweiten Liste, welche Namen sie schon gesehen hat, und fragt diese Liste bei jedem Namen, ob er schon darin steht.
      check:
        type: dart
        file: laufzeit/laufzeit.dart
        cases:
          - { call: "distinctList(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])", expect: 2 }
          - { call: "distinctList([])", expect: 0 }
          - { call: "distinctList(List.filled(5, 'Dorfstraße'))", expect: 1 }
          - { call: "distinctList(['a', 'b', 'c', 'd', 'e', 'f'])", expect: 6 }
      hint:
        - "Eine leere Liste `final seen = <String>[];`; für jeden Namen: Steht er noch nicht darin, `!seen.contains(name)`, kommt er hinein."
        - "Am Ende ist die Zahl der verschiedenen Namen `seen.length`."
      solution: |
        ```dart
        int distinctList(List<String> names) {
          final seen = <String>[];
          for (final name in names) {
            if (!seen.contains(name)) {
              seen.add(name);
            }
          }
          return seen.length;
        }
        ```
    java:
      prompt: |
        Schreib in `Laufzeit.java`, in der Klasse `Laufzeit`, eine Methode `public static int distinctList(List<String> names)`, die zählt, wie viele verschiedene Namen in der Liste `names` stehen. Sie merkt sich in einer zweiten Liste, welche Namen sie schon gesehen hat, und fragt diese Liste bei jedem Namen, ob er schon darin steht.
      check:
        type: java
        file: laufzeit/Laufzeit.java
        cases:
          - { call: "Laufzeit.distinctList(List.of(\"Waldstraße\", \"Bahnhofstraße\", \"Waldstraße\"))", expect: 2 }
          - { call: "Laufzeit.distinctList(List.of())", expect: 0 }
          - { call: "Laufzeit.distinctList(Collections.nCopies(5, \"Dorfstraße\"))", expect: 1 }
          - { call: "Laufzeit.distinctList(List.of(\"a\", \"b\", \"c\", \"d\", \"e\", \"f\"))", expect: 6 }
      hint:
        - "Eine leere Liste `List<String> seen = new ArrayList<>();`; für jeden Namen: Steht er noch nicht darin, `!seen.contains(name)`, kommt er hinein. Oben in die Datei gehört `import java.util.*;`."
        - "Am Ende ist die Zahl der verschiedenen Namen `seen.size()`."
      solution: |
        ```java
        import java.util.*;

        public class Laufzeit {
            public static int distinctList(List<String> names) {
                List<String> seen = new ArrayList<>();
                for (String name : names) {
                    if (!seen.contains(name)) {
                        seen.add(name);
                    }
                }
                return seen.size();
            }
        }
        ```

  - id: distinct-sorted
    title: Erst sortieren
    prompt: |
      Schreib `distinct_sorted(names)`, die dasselbe zählt, aber anders: Sie sortiert die Namen zuerst. Dann stehen gleiche Namen nebeneinander, und ein neuer Name beginnt dort, wo einer anders ist als der davor.
    check:
      type: ruby
      file: laufzeit/laufzeit.rb
      timeout: 10
      slow: "Für 300 000 verschiedene Namen braucht deine Funktion zu lange. Vergleicht sie jeden Namen nur mit dem davor, nachdem sie sortiert hat?"
      cases:
        - call: "distinct_sorted(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])"
          expect: "2"
        - call: "distinct_sorted([])"
          expect: "0"
        - call: "distinct_sorted(['b', 'a', 'b', 'a', 'c'])"
          expect: "3"
        - call: "distinct_sorted((1..300_000).map(&:to_s))"
          expect: "300000"
    hint:
      - "`sorted = names.sort` gibt eine sortierte Kopie. Gezählt wird jeder Name, der anders ist als der davor, und der erste."
      - "`sorted.each_with_index do |name, i|` gibt jeden Namen mit seinem Index; der davor ist `sorted[i - 1]`, und beim ersten, `i == 0`, gibt es keinen davor."
    solution: |
      ```ruby
      def distinct_sorted(names)
        sorted = names.sort
        count = 0
        sorted.each_with_index do |name, i|
          count += 1 if i == 0 || name != sorted[i - 1]
        end
        count
      end
      ```
    python:
      prompt: |
        Schreib `distinct_sorted(names)`, die dasselbe zählt, aber anders: Sie sortiert die Namen zuerst. Dann stehen gleiche Namen nebeneinander, und ein neuer Name beginnt dort, wo einer anders ist als der davor.
      check:
        type: python
        file: laufzeit/laufzeit.py
        timeout: 10
        slow: "Für 300 000 verschiedene Namen braucht deine Funktion zu lange. Vergleicht sie jeden Namen nur mit dem davor, nachdem sie sortiert hat?"
        cases:
          - call: "distinct_sorted(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])"
            expect: "2"
          - call: "distinct_sorted([])"
            expect: "0"
          - call: "distinct_sorted(['b', 'a', 'b', 'a', 'c'])"
            expect: "3"
          - call: "distinct_sorted([str(i) for i in range(300000)])"
            expect: "300000"
      hint:
        - "`ordered = sorted(names)` gibt eine sortierte Kopie. Gezählt wird jeder Name, der anders ist als der davor, und der erste."
        - "`for i, name in enumerate(ordered):` gibt jeden Namen mit seinem Index; der davor ist `ordered[i - 1]`, und beim ersten, `i == 0`, gibt es keinen davor."
      solution: |
        ```python
        def distinct_sorted(names):
            ordered = sorted(names)
            count = 0
            for i, name in enumerate(ordered):
                if i == 0 or name != ordered[i - 1]:
                    count += 1
            return count
        ```
    dart:
      prompt: |
        Schreib `int distinctSorted(List<String> names)`, die dasselbe zählt, aber anders: Sie sortiert die Namen zuerst. Dann stehen gleiche Namen nebeneinander, und ein neuer Name beginnt dort, wo einer anders ist als der davor.
      check:
        type: dart
        file: laufzeit/laufzeit.dart
        timeout: 15
        slow: "Für 300 000 verschiedene Namen braucht deine Funktion zu lange. Vergleicht sie jeden Namen nur mit dem davor, nachdem sie sortiert hat?"
        cases:
          - { call: "distinctSorted(['Waldstraße', 'Bahnhofstraße', 'Waldstraße'])", expect: 2 }
          - { call: "distinctSorted([])", expect: 0 }
          - { call: "distinctSorted(['b', 'a', 'b', 'a', 'c'])", expect: 3 }
          - { call: "distinctSorted([for (var i = 1; i <= 300000; i++) '$i'])", expect: 300000 }
      hint:
        - "`final sorted = [...names]..sort();` ist eine sortierte Kopie. Gezählt wird jeder Name, der anders ist als der davor, und der erste."
        - "`for (var i = 0; i < sorted.length; i++)` gibt jeden Index; der Name davor ist `sorted[i - 1]`, und beim ersten, `i == 0`, gibt es keinen davor."
      solution: |
        ```dart
        int distinctSorted(List<String> names) {
          final sorted = [...names]..sort();
          var count = 0;
          for (var i = 0; i < sorted.length; i++) {
            if (i == 0 || sorted[i] != sorted[i - 1]) {
              count++;
            }
          }
          return count;
        }
        ```
    java:
      prompt: |
        Schreib `public static int distinctSorted(List<String> names)`, die dasselbe zählt, aber anders: Sie sortiert die Namen zuerst. Dann stehen gleiche Namen nebeneinander, und ein neuer Name beginnt dort, wo einer anders ist als der davor.
      check:
        type: java
        file: laufzeit/Laufzeit.java
        timeout: 20
        slow: "Für 300 000 verschiedene Namen braucht deine Methode zu lange. Vergleicht sie jeden Namen nur mit dem davor, nachdem sie sortiert hat?"
        cases:
          - { call: "Laufzeit.distinctSorted(List.of(\"Waldstraße\", \"Bahnhofstraße\", \"Waldstraße\"))", expect: 2 }
          - { call: "Laufzeit.distinctSorted(List.of())", expect: 0 }
          - { call: "Laufzeit.distinctSorted(List.of(\"b\", \"a\", \"b\", \"a\", \"c\"))", expect: 3 }
          - { call: "Laufzeit.distinctSorted(List.of(new String(\"Dorfstraße\"), new String(\"Dorfstraße\")))", expect: 1, say: "Zwei gleiche Namen aus einer Datei sind zwei verschiedene Objekte: `==` und `!=` fragen, ob es dasselbe Objekt ist, `equals`, ob derselbe Text darin steht." }
          - { call: "List<String> names = new ArrayList<>(); for (int i = 1; i <= 300000; i++) names.add(String.valueOf(i)); Laufzeit.distinctSorted(names)", expect: 300000 }
      hint:
        - "`List<String> sorted = new ArrayList<>(names);` ist eine Kopie, `Collections.sort(sorted);` sortiert sie. Gezählt wird jeder Name, der anders ist als der davor, und der erste."
        - "`for (int i = 0; i < sorted.size(); i++)` gibt jeden Index; der Name davor ist `sorted.get(i - 1)`, und beim ersten, `i == 0`, gibt es keinen davor. Texte vergleicht man mit `equals`."
      solution: |
        ```java
        public static int distinctSorted(List<String> names) {
            List<String> sorted = new ArrayList<>(names);
            Collections.sort(sorted);
            int count = 0;
            for (int i = 0; i < sorted.size(); i++) {
                if (i == 0 || !sorted.get(i).equals(sorted.get(i - 1))) {
                    count++;
                }
            }
            return count;
        }
        ```

