# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
format: 1
activity: dart
examples:
  hallo:
    pass:
      - files: { hello.dart: hello.dart }
      - files: { hello.dart: { text: "void main() => print(\"Hello, World!\");\n" } }
    fail:
      - files: { hello.dart: hello-error.dart }
        say: print('Hello, World!')
      - files: { hello.dart: { text: "print('Hello, World!');\n" } }
        say: void main()
      - files: { hello.dart: { text: "" } }
      - files: { hallo.dart: hello.dart }
  fehler:
    pass:
      - answer: Method
      - answer: methode
      - answer: Method not found
    fail:
      - answer: prin
      - answer: Error
  int-grenze:
    pass:
      - answer: FormatException
    fail:
      - answer: OverflowException
      - answer: Exception
      - answer: Unhandled exception
  absteigend:
    pass:
      - files: { bubblesort.dart: { text: "void bubbleSort(List<int> numbers) {\n  int n = numbers.length;\n  for (int i = 0; i < n - 1; i++) {\n    for (int j = 0; j < n - i - 1; j++) {\n      if (numbers[j] < numbers[j + 1]) {\n        int temp = numbers[j];\n        numbers[j] = numbers[j + 1];\n        numbers[j + 1] = temp;\n      }\n    }\n  }\n}\n" } }
    fail:
      - files: { bubblesort.dart: bubblesort.dart }
        say: aufsteigend
