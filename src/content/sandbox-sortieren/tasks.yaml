# Begleiter zur Sorting Sandbox. Die Sandbox selbst bleibt ein eigenes Projekt;
# diese Aufgaben lesen nur, was im Workspace liegt.
# Format: docs/aufgaben.md
format: 1
activity: sandbox-sortieren
tasks:
  - id: ssh-schluessel
    title: Dein Schlüssel
    prompt: Dein öffentlicher SSH-Schlüssel liegt in `~/.ssh/id_ed25519.pub`.
    check:
      type: files
      path: .ssh/id_ed25519.pub
      expect:
        exists: true
        format: text
    hint: |
      `~` ist im Workspace `/workspace`. `ls ~/.ssh` zeigt, was dort liegt.
    feedback:
      - when: { problem: missing }
        say: |
          Es gibt noch keinen Schlüssel. Erzeuge ihn mit
          `ssh-keygen -t ed25519 -C "Vorname Nachname"` und bestätige alle
          Rückfragen mit Enter.

  - id: git-name
    title: Git kennt dich
    prompt: Git kennt deinen Namen und die E-Mail-Adresse deines GitLab-Kontos.
    check:
      type: git
      expect:
        identity: true
    feedback:
      - when: { problem: placeholder }
        say: |
          Du hast das Beispiel abgeschrieben. Setze zwischen die
          Anführungszeichen deinen echten Namen und deine E-Mail-Adresse.

  - id: geklont
    title: Die Sandbox ist da
    prompt: |
      Die App liegt in `~/sorting-sandbox`, das Klassen-Repository darin in `algorithms`.
    check:
      type: files
      path: sorting-sandbox/algorithms
      expect:
        exists: true
    feedback:
      - when: { problem: missing }
        say: |
          `sorting-sandbox/algorithms` gibt es nicht. Hast du das Klassen-Repository
          geklont, und zwar **im** Ordner `sorting-sandbox` und unter dem Namen
          `algorithms`?

  - id: klassen-repository
    title: Ein eigenes Repository
    prompt: |
      `algorithms` ist ein eigenes Git-Repository und weiß, wohin es pushen kann.
    check:
      type: git
      repo: sorting-sandbox/algorithms
      expect:
        has_remote: true

  - id: fehlstaende
    title: Wie oft wird getauscht?
    prompt: |
      Bubble Sort sortiert die Liste `[4, 2, 5, 1, 3]`. Wie oft vertauscht er
      zwei Elemente, bis die Liste sortiert ist?
    check:
      type: number
      expect: 6
    hint: |
      Spiel die Durchgänge auf Papier durch, wie in Explore: Im ersten
      Durchgang wandert die 5 nach hinten.
    feedback:
      - when: { equals: 20 }
        say: |
          20 ist die Zahl der Vergleiche des Bubble Sort aus `new-algorithm`:
          5 Durchgänge mit je 4 Vergleichen. Gefragt sind die Vertauschungen.
      - when: { equals: 10 }
        say: |
          10 ist die Zahl aller Paare in der Liste. So oft tauscht Bubble Sort
          nur, wenn jedes Paar falsch herum steht, bei einer umgekehrt sortierten Liste.
    solution: |
      Sechsmal. Erster Durchgang: 4↔2, 5↔1, 5↔3, danach `[2, 4, 1, 3, 5]`.
      Zweiter: 4↔1, 4↔3, danach `[2, 1, 3, 4, 5]`. Dritter: 2↔1. Danach
      tauscht er nichts mehr. Jede Vertauschung bringt genau ein Paar in die
      richtige Reihenfolge, und falsch herum standen sechs: (4, 2), (4, 1),
      (4, 3), (2, 1), (5, 1) und (5, 3).

  - id: rennen-sortiert
    title: Deine erste Wette
    prediction: true
    prompt: |
      Bubble Sort, so wie `new-algorithm` ihn anlegt, tritt gegen den Insertion
      Sort von oben an, auf einer Liste, die schon **sortiert** ist. Wer ist
      zuerst fertig? Prüf deine Wette danach im Race mit der Eingabe »Sorted«.
    check:
      type: choice
      options:
        - Insertion Sort, mit großem Abstand, weil er jedes Element nur einmal mit seinem Vorgänger vergleicht.
        - Bubble Sort, weil er auf einer sortierten Liste nie tauschen muss und einfach durchläuft.
        - Beide gleichzeitig, weil auf einer sortierten Liste keiner von beiden etwas bewegen muss.
        - Insertion Sort, aber nur knapp, weil beide etwa gleich oft vergleichen müssen.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: |
          Tauschen muss er nicht, vergleichen schon: Der Bubble Sort aus
          `new-algorithm` läuft in jedem Durchgang die ganze Liste ab, auch wenn
          längst alles stimmt.
      - when: { picked: 2 }
        say: Bewegen muss keiner etwas. Aber wie oft vergleicht jeder, bis er weiß, dass alles stimmt?
      - when: { picked: 3 }
        say: Wie oft läuft die innere `while`-Schleife des Insertion Sort, wenn jedes Element schon größer ist als sein Vorgänger?
    solution: |
      Insertion Sort braucht auf einer sortierten Liste mit *n* Elementen nur
      *n* − 1 Vergleiche: Die innere Schleife bricht jedes Mal sofort ab. Der
      Bubble Sort aus `new-algorithm` macht *n* Durchgänge mit je *n* − 1
      Vergleichen, bei 48 Elementen also 2256 statt 47.

  - id: verdoppeln
    title: Doppelt so viele Elemente
    prediction: true
    prompt: |
      Analyze misst auf zufälligen Listen. Was passiert mit dem Sandbox-Score
      von Bubble Sort, wenn *n* sich von 512 auf 1024 verdoppelt?
    check:
      type: choice
      options:
        - Er wird etwa doppelt so groß.
        - Er wird etwa viermal so groß.
        - Er wird etwa achtmal so groß.
        - Er wird nur ein wenig größer.
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: |
          So wächst ein Verfahren, das jedes Element ein paar Mal anfasst.
          Bei Bubble Sort heißt doppelt so viele Elemente: doppelt so viele
          Durchgänge, und jeder davon ist doppelt so lang.
      - when: { picked: 2 }
        say: Achtmal so viel wären drei ineinander geschachtelte Schleifen über die Liste. Wie viele hat Bubble Sort?
      - when: { picked: 3 }
        say: Bubble Sort vergleicht in jedem Durchgang Nachbarn über die ganze Liste. Wie viele Durchgänge gibt es bei doppelt so vielen Elementen?
    solution: |
      Etwa viermal: Bubble Sort braucht ungefähr *n*² Schritte, der aus
      `new-algorithm` genau *n* · (*n* − 1) Vergleiche. Doppelt so viele
      Elemente heißt doppelt so viele Durchgänge, jeder doppelt so lang.
      Darum wird in Analyze die Kurve bei *score / n²* flach.

  - id: stabilitaet
    title: Wer springt vorbei?
    prompt: |
      Welche Zeile des Selection Sort oben macht ihn instabil?
    check:
      type: choice
      options:
        - '`elements.swap(i, smallest)`'
        - '`if elements[j] < elements[smallest]:`'
        - '`for j in range(i + 1, n):`'
        - '`smallest = i`'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: |
          Mit `<` bleibt bei gleichen Werten das vordere als Kleinstes
          gewählt. Das schont die Reihenfolge schon. Wo wird ein Element bewegt?
      - when: { picked: 2 }
        say: Diese Zeile sucht nur, sie bewegt kein Element. Instabil wird es dort, wo ein Element seinen Platz wechselt.
      - when: { picked: 3 }
        say: Diese Zeile merkt sich nur einen Index, sie bewegt kein Element. Instabil wird es dort, wo ein Element seinen Platz wechselt.
    solution: |
      Der Tausch. Dabei springt `elements[i]` weit nach hinten, an den alten
      Platz des Kleinsten, und kann an einem gleichen Wert vorbeispringen. In
      `[2a, 2b, 1]` tauscht die 1 mit 2a, und es entsteht `[1, 2b, 2a]`.

  - id: nur-dein-ordner
    title: Was gehört in deinen Commit?
    prompt: |
      Oben steht `git add DEIN_NAME/`. Warum nicht einfach `git add -A`, das
      alles Geänderte aufnimmt?
    check:
      type: choice
      options:
        - Damit nichts außerhalb deines Ordners in deinen Commit gerät, etwa eine Datei einer anderen Person, die du aus Versehen geändert hast.
        - Weil `git add -A` die Dateien der anderen aus dem Repository löscht.
        - Weil `git add -A` in einem Repository mit mehreren Personen nicht funktioniert.
        - Damit der Commit schneller fertig ist.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Löschen würde `git add -A` nur, was du selbst gelöscht hast. Aber es nimmt jede Änderung mit, auch eine an fremden Dateien.
      - when: { picked: 2 }
        say: Es funktioniert schon. Die Frage ist, was es alles mitnimmt.
    solution: Im Ordner `algorithms` liegen die Dateien aller. `git add DEIN_NAME/` nimmt nur deinen Ordner auf; hast du aus Versehen eine fremde Datei verändert, bleibt die Änderung draußen, und beim nächsten `git pull` gibt es keinen Konflikt mit der Person, der die Datei gehört.


  - id: veroeffentlicht
    title: Committet und gepusht
    prompt: |
      Deine Arbeit ist committet und gepusht. Erst dann sieht deine Lehrkraft
      sie in »Class progress« und die anderen nach `git pull` in ihrer App.
      Prüfe das am Ende jeder Stunde.
    check:
      type: git
      repo: sorting-sandbox/algorithms
      expect:
        has_remote: true
        min_commits: 1
        committed: true
        pushed: true
