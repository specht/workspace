# Aufgaben zu »Zwei Faktoren: Einmalcodes selbst gebaut«.
# Format: docs/aufgaben.md. Alles liegt in /workspace/totp; die Werte sind die
# Testwerte aus RFC 4226 (HOTP) und RFC 6238 (TOTP) mit dem Schlüssel
# 12345678901234567890.
format: 1
activity: totp
tasks:
  - id: zweiter-faktor
    title: Wenn das Passwort bekannt ist
    prediction: true
    prompt: |
      Jemand hat dein Passwort erfahren. Bei deinem Konto ist ein zweiter
      Faktor eingeschaltet, eine Authenticator-App auf deinem Handy. Was
      bräuchte er außerdem, um sich anzumelden?
    check:
      type: choice
      options:
        - Den Code, den deine App gerade zeigt, und der gilt nur eine halbe Minute
        - Nichts mehr, das Passwort reicht
        - Dein Passwort noch einmal, ein zweites Mal eingetippt
        - Nur deine E-Mail-Adresse
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Ohne zweiten Faktor wäre es so. Mit ihm fragt der Server nach dem Passwort auch nach einem Code, den nur dein Handy kennt.
      - when: { picked: 2 }
        say: Zweimal dasselbe ist kein zweiter Faktor. Der zweite muss etwas anderes sein, etwas, das du hast, nicht etwas, das du weißt.
    solution: |
      Das Passwort allein reicht nicht mehr. Er bräuchte auch den Code, den nur
      deine App ausrechnen kann, weil nur sie den Schlüssel kennt, und der gilt
      nur für das aktuelle Zeitfenster von 30 Sekunden. Ohne dein Handy kommt er
      nicht hinein.

  - id: bytes
    title: Wie viele Bytes?
    prompt: Manche Dienste geben kürzere Schlüssel aus, etwa `JBSWY3DPEHPK3PXP` mit 16 Zeichen in Base32. Wie viele Bytes stecken darin?
    check:
      type: number
      expect: 10
    feedback:
      - when: { equals: 16 }
        say: Ein Base32-Zeichen ist kein ganzes Byte, sondern 5 Bits.
      - when: { equals: 12 }
        say: Das wäre bei Base64, mit 6 Bits pro Zeichen. Base32 hat 5.
      - when: { equals: 20 }
        say: 20 Bytes hat der Schlüssel der Seite mit seinen 32 Zeichen. Dieser hat 16.
    solution: '16 Zeichen mal 5 Bits sind 80 Bits, durch 8 sind das 10 Bytes.'


  - id: base32
    title: Base32
    prompt: 'Schreib `base32_decode` und `base32_encode` in `totp.rb`.'
    check:
      type: ruby
      file: totp/totp.rb
      cases:
        - call: 'base32_decode(''JBSWY3DPEHPK3PXP'').bytes'
          expect: '[72, 101, 108, 108, 111, 33, 222, 173, 190, 239]'
          say: 'JBSWY3DPEHPK3PXP sind die Bytes von »Hello!« und dann DE AD BE EF.'
        - call: 'base32_decode(''JBSWY3DP'')'
          expect: '''Hello'''
        - call: 'base32_decode(''jbsw y3dp ee======'')'
          expect: '''Hello!'''
          say: 'Kleinbuchstaben, Leerzeichen und = am Ende kommen in echten Schlüsseln vor.'
        - call: 'base32_decode(''JBUQ'')'
          expect: '''Hi'''
          say: 'Bleiben am Ende weniger als 8 Bits übrig, gehören sie zu keinem Byte mehr.'
        - call: 'base32_encode(''Hello!'')'
          expect: '''JBSWY3DPEE'''
          say: 'Fehlen am Ende Bits zu einer Gruppe von 5, kommen Nullen dazu.'
        - call: 'base32_encode(''12345678901234567890'')'
          expect: '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ'''
    hint:
      - |
        Entschlüssle `MZXW6` von Hand. Welche Nummer hat jedes Zeichen in `ALPHABET`
        (`M` ist 12)? Schreib die fünf Zahlen als je 5 Bits hin, häng sie aneinander
        und teil sie in Stücke zu 8 Bits: Welche Bytes sind das, und was bleibt
        übrig? Zum Nachprüfen: Es ist ein kurzes englisches Wort.
      - |
        `base32_decode`: erst alles groß, Leerzeichen und `=` weg. Jedes Zeichen
        wird seine Nummer `ALPHABET.index(c)` als 5 Bits, alles hintereinander, und je
        8 Bits sind ein Byte; was am Ende übrig bleibt, fällt weg. `base32_encode` ist
        der Weg zurück: jedes Byte als 8 Bits, hinten Nullen dazu, bis die Länge durch
        5 teilbar ist, und je 5 Bits ein Zeichen.
      - |
        Ein Gerüst:

        ```ruby
        def base32_decode(text)
            bits = text.upcase.delete(' =').chars.map { |c| … }.join # je 5 Bits
            bits.scan(/.{8}/).map { |byte| … }.pack('C*')
        end

        def base32_encode(data)
            bits = data.bytes.map { |b| … }.join # je 8 Bits
            bits += '0' * … # auffüllen, bis die Länge durch 5 teilbar ist
            bits.scan(/.{5}/).map { |chunk| … }.join
        end
        ```
    python:
      prompt: 'Schreib `base32_decode` und `base32_encode` in `totp.py`.'
      check:
        type: python
        file: totp/totp.py
        cases:
          - call: 'list(base32_decode(''JBSWY3DPEHPK3PXP''))'
            expect: '[72, 101, 108, 108, 111, 33, 222, 173, 190, 239]'
            say: 'JBSWY3DPEHPK3PXP sind die Bytes von »Hello!« und dann DE AD BE EF.'
          - call: 'base32_decode(''JBSWY3DP'')'
            expect: 'b''Hello'''
          - call: 'base32_decode(''jbsw y3dp ee======'')'
            expect: 'b''Hello!'''
            say: 'Kleinbuchstaben, Leerzeichen und = am Ende kommen in echten Schlüsseln vor.'
          - call: 'base32_decode(''JBUQ'')'
            expect: 'b''Hi'''
            say: 'Bleiben am Ende weniger als 8 Bits übrig, gehören sie zu keinem Byte mehr.'
          - call: 'base32_encode(b''Hello!'')'
            expect: '''JBSWY3DPEE'''
            say: 'Fehlen am Ende Bits zu einer Gruppe von 5, kommen Nullen dazu.'
          - call: 'base32_encode(b''12345678901234567890'')'
            expect: '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ'''
      hint:
        - |
          Entschlüssle `MZXW6` von Hand. Welche Nummer hat jedes Zeichen in `ALPHABET`
          (`M` ist 12)? Schreib die fünf Zahlen als je 5 Bits hin, häng sie aneinander
          und teil sie in Stücke zu 8 Bits: Welche Bytes sind das, und was bleibt
          übrig? Zum Nachprüfen: Es ist ein kurzes englisches Wort.
        - |
          `base32_decode`: erst alles groß, Leerzeichen und `=` weg. Jedes Zeichen
          wird seine Nummer `ALPHABET.index(c)` als 5 Bits, alles hintereinander, und je
          8 Bits sind ein Byte; was am Ende übrig bleibt, fällt weg. `base32_encode` ist
          der Weg zurück: jedes Byte als 8 Bits, hinten Nullen dazu, bis die Länge durch
          5 teilbar ist, und je 5 Bits ein Zeichen.
        - |
          Ein Gerüst:

          ```python
          def base32_decode(text):
              text = text.upper().replace(' ', '').replace('=', '')
              bits = ''.join(...)  # je Zeichen 5 Bits
              return bytes(...)  # je 8 Bits eine Zahl; was übrig bleibt, fällt weg

          def base32_encode(data):
              bits = ''.join(...)  # je Byte 8 Bits
              bits += ...  # mit 0 auffüllen, bis die Länge durch 5 teilbar ist
              return ''.join(...)  # je 5 Bits ein Zeichen
          ```

  - id: hotp
    title: HOTP
    prompt: 'Schreib `hotp` in `totp.rb`. Die Codes sind die [Testwerte aus RFC 4226](https://www.rfc-editor.org/rfc/rfc4226.html#appendix-D).'
    check:
      type: ruby
      file: totp/totp.rb
      cases:
        - call: 'hotp(''12345678901234567890'', 0)'
          expect: '''755224'''
        - call: 'hotp(''12345678901234567890'', 1, 8)[-6..]'
          expect: '''287082'''
          say: 'Die Zahl hat mit 8 Stellen hinten dieselben 6 Ziffern.'
        - call: 'hotp(''12345678901234567890'', 1)'
          expect: '''287082'''
        - call: 'hotp(''12345678901234567890'', 2)'
          expect: '''359152'''
        - call: 'hotp(''12345678901234567890'', 5)'
          expect: '''254676'''
        - call: 'hotp(''12345678901234567890'', 9)'
          expect: '''520489'''
    hint:
      - |
        Rechne das Beispiel von der Seite nach, mit der HMAC
        `75a48a19d4cbe100644e8ac1397eea747a2d33ab`: Zähl die Bytes ab, das erste hat
        den Index 0. Welches ist Byte 11, welche 4 Bytes nimmst du ab dort, und was
        macht `& 0x7fffffff` aus dem ersten von ihnen?
      - |
        Vier Zeilen, eine für jeden Schritt: der Zähler als 8 Bytes und daraus die
        HMAC; der Offset, die untersten 4 Bits des letzten Bytes (`& 15`); die 4 Bytes
        ab dem Offset als Zahl, ohne das oberste Bit; und der Rest beim Teilen durch
        `10**digits`, als Text, vorn mit Nullen auf `digits` Stellen aufgefüllt.
      - |
        Ein Gerüst:

        ```ruby
        def hotp(key, counter, digits = 6)
            hash = OpenSSL::HMAC.digest('SHA1', key, …) # der Zähler als 8 Bytes
            offset = … # die untersten 4 Bits des letzten Bytes
            number = hash[offset, 4].unpack1('N') & 0x7fffffff
            … # die letzten digits Ziffern, vorn mit Nullen
        end
        ```
    python:
      prompt: 'Schreib `hotp` in `totp.py`. Die Codes sind die [Testwerte aus RFC 4226](https://www.rfc-editor.org/rfc/rfc4226.html#appendix-D).'
      check:
        type: python
        file: totp/totp.py
        cases:
          - call: 'hotp(b''12345678901234567890'', 0)'
            expect: '''755224'''
          - call: 'hotp(b''12345678901234567890'', 1, 8)[-6:]'
            expect: '''287082'''
            say: 'Die Zahl hat mit 8 Stellen hinten dieselben 6 Ziffern.'
          - call: 'hotp(b''12345678901234567890'', 1)'
            expect: '''287082'''
          - call: 'hotp(b''12345678901234567890'', 2)'
            expect: '''359152'''
          - call: 'hotp(b''12345678901234567890'', 5)'
            expect: '''254676'''
          - call: 'hotp(b''12345678901234567890'', 9)'
            expect: '''520489'''
      hint:
        - |
          Rechne das Beispiel von der Seite nach, mit der HMAC
          `75a48a19d4cbe100644e8ac1397eea747a2d33ab`: Zähl die Bytes ab, das erste hat
          den Index 0. Welches ist Byte 11, welche 4 Bytes nimmst du ab dort, und was
          macht `& 0x7fffffff` aus dem ersten von ihnen?
        - |
          Vier Zeilen, eine für jeden Schritt: der Zähler als 8 Bytes und daraus die
          HMAC; der Offset, die untersten 4 Bits des letzten Bytes (`& 15`); die 4 Bytes
          ab dem Offset als Zahl, ohne das oberste Bit; und der Rest beim Teilen durch
          `10 ** digits`, als Text, vorn mit Nullen auf `digits` Stellen aufgefüllt
          (`zfill`).
        - |
          Ein Gerüst:

          ```python
          def hotp(key, counter, digits=6):
              hash = hmac.new(key, ..., hashlib.sha1).digest()  # der Zähler als 8 Bytes
              offset = ...  # die untersten 4 Bits des letzten Bytes
              number = int.from_bytes(hash[offset:offset + 4], 'big') & 0x7fffffff
              return ...  # die letzten digits Ziffern, vorn mit Nullen
          ```

  - id: totp
    title: TOTP
    prompt: 'Schreib `totp` in `totp.rb`. Die Codes sind die [Testwerte aus RFC 6238](https://www.rfc-editor.org/rfc/rfc6238.html#appendix-B).'
    check:
      type: ruby
      file: totp/totp.rb
      cases:
        - call: 'totp(''12345678901234567890'', 59)'
          expect: '''287082'''
        - call: 'totp(''12345678901234567890'', 1111111109)'
          expect: '''081804'''
          say: 'Ein Code hat immer 6 Ziffern, auch wenn er mit 0 anfängt.'
        - call: 'totp(''12345678901234567890'', 1111111111)'
          expect: '''050471'''
        - call: 'totp(''12345678901234567890'', 1234567890)'
          expect: '''005924'''
        - call: 'totp(''12345678901234567890'', 2000000000)'
          expect: '''279037'''
        - call: 'totp(''12345678901234567890'', 59, 8)'
          expect: '''94287082'''
          say: 'Mit 8 Stellen ist es der Testwert aus RFC 6238.'
        - call: 'totp(''12345678901234567890'', 89) == totp(''12345678901234567890'', 60)'
          expect: true
          say: 'Innerhalb von 30 Sekunden bleibt der Code derselbe.'
    hint:
      - |
        Welchen Zähler haben die Unix-Zeiten 59, 60 und 89? Wann wird er um eins
        größer, und wie lange bleibt er gleich?
      - |
        Eine Zeile genügt: `hotp` mit dem Zähler aus der Zeit. Für die aktuelle Zeit
        als Standardwert schreib `time = Time.now.to_i` in die Parameter.
    python:
      prompt: 'Schreib `totp` in `totp.py`. Die Codes sind die [Testwerte aus RFC 6238](https://www.rfc-editor.org/rfc/rfc6238.html#appendix-B).'
      check:
        type: python
        file: totp/totp.py
        cases:
          - call: 'totp(b''12345678901234567890'', 59)'
            expect: '''287082'''
          - call: 'totp(b''12345678901234567890'', 1111111109)'
            expect: '''081804'''
            say: 'Ein Code hat immer 6 Ziffern, auch wenn er mit 0 anfängt.'
          - call: 'totp(b''12345678901234567890'', 1111111111)'
            expect: '''050471'''
          - call: 'totp(b''12345678901234567890'', 1234567890)'
            expect: '''005924'''
          - call: 'totp(b''12345678901234567890'', 2000000000)'
            expect: '''279037'''
          - call: 'totp(b''12345678901234567890'', 59, 8)'
            expect: '''94287082'''
            say: 'Mit 8 Stellen ist es der Testwert aus RFC 6238.'
          - call: 'totp(b''12345678901234567890'', 89) == totp(b''12345678901234567890'', 60)'
            expect: true
            say: 'Innerhalb von 30 Sekunden bleibt der Code derselbe.'
      hint:
        - |
          Welchen Zähler haben die Unix-Zeiten 59, 60 und 89? Wann wird er um eins
          größer, und wie lange bleibt er gleich?
        - |
          Eine Zeile genügt: `hotp` mit dem Zähler aus der Zeit, `//` teilt mit
          Abrunden. Für die aktuelle Zeit nimm `now=None` als Standardwert und dann
          `int(time.time())`, wenn keine Zeit kam. Nenn den Parameter nicht `time`: So
          heißt schon das Modul, das oben importiert ist.

  - id: uhr
    title: Wenn die Uhr nachgeht
    prediction: true
    prompt: |
      Die Uhr deines Handys geht 20 Sekunden nach. Was passiert, wenn der
      Server nur den Code des aktuellen Zeitfensters annimmt?
    check:
      type: choice
      options:
        - In etwa zwei Dritteln der Fälle zeigt das Handy noch den Code des vorigen Fensters, und die Anmeldung scheitert.
        - Nichts, die Codes hängen nicht von der Uhr ab.
        - Das Handy zeigt dann einen ganz anderen, zufälligen Code.
        - Die Anmeldung klappt immer, nur 20 Sekunden später.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Bei TOTP ist die Uhrzeit der Zähler. Zwei Uhren, die verschieden gehen, zählen verschieden.
      - when: { picked: 2 }
        say: Zufällig ist der Code nicht; das Handy rechnet nur mit seiner eigenen, falschen Uhrzeit.
    solution: In 20 von 30 Sekunden liegt die Uhr des Handys noch im vorigen Fenster. Darum nehmen Server meist auch den Code davor und danach an.

  - id: pruefen
    title: Einen Code prüfen
    prompt: 'Schreib `verify(key, code, time)` in `totp.rb`: `true`, wenn der eingetippte Code für diese Unix-Zeit gilt, sonst `false`; ohne Zeit nimmt es die aktuelle, wie `totp`.'
    check:
      type: ruby
      file: totp/totp.rb
      cases:
        - call: 'verify(''12345678901234567890'', totp(''12345678901234567890'', 1000), 1000)'
          expect: true
        - call: 'verify(''12345678901234567890'', totp(''12345678901234567890'', 970), 1000)'
          expect: true
          say: 'Der Code aus dem Zeitfenster davor gilt auch, für Uhren, die nachgehen.'
        - call: 'verify(''12345678901234567890'', totp(''12345678901234567890'', 1030), 1000)'
          expect: true
          say: 'Und der danach, für Uhren, die vorgehen.'
        - call: 'verify(''12345678901234567890'', totp(''12345678901234567890'', 910), 1000)'
          expect: false
          say: 'Ein Code von vor über einer Minute gilt nicht mehr.'
        - call: 'verify(''12345678901234567890'', ''000000'', 1000)'
          expect: false
        - call: 'verify(''12345678901234567890'', totp(''12345678901234567890'', 1000).insert(3, '' ''), 1000)'
          expect: true
          say: 'Viele Apps zeigen den Code mit einem Leerzeichen in der Mitte. Das darf keinen Unterschied machen.'
    hint:
      - |
        Die Uhr eines Handys geht 20 Sekunden nach. Für welche Zeiten muss der
        Server den Code ausrechnen, damit er trotzdem passt? Und was soll mit einem
        Code geschehen, den jemand mit Leerzeichen eintippt, `287 082`?
      - |
        Rechne `totp` für die Zeit 30 Sekunden davor, für die Zeit selbst und für 30
        Sekunden danach aus und vergleich jeden dieser drei Codes mit dem
        eingetippten, aus dem du vorher die Leerzeichen entfernst. Stimmt einer, ist
        der Code gut.
      - |
        Ein Gerüst; so ruft die Prüfung `verify` auf:

        ```ruby
        def verify(key, code, time = Time.now.to_i)
            code = … # ohne Leerzeichen
            [-30, 0, 30].any? { |d| … }
        end
        ```
    python:
      prompt: 'Schreib `verify(key, code, now=None)` in `totp.py`: `True`, wenn der eingetippte Code für diese Unix-Zeit gilt, sonst `False`; ohne Zeit nimmt es die aktuelle, wie `totp`.'
      check:
        type: python
        file: totp/totp.py
        cases:
          - call: 'verify(b''12345678901234567890'', totp(b''12345678901234567890'', 1000), 1000)'
            expect: true
          - call: 'verify(b''12345678901234567890'', totp(b''12345678901234567890'', 970), 1000)'
            expect: true
            say: 'Der Code aus dem Zeitfenster davor gilt auch, für Uhren, die nachgehen.'
          - call: 'verify(b''12345678901234567890'', totp(b''12345678901234567890'', 1030), 1000)'
            expect: true
            say: 'Und der danach, für Uhren, die vorgehen.'
          - call: 'verify(b''12345678901234567890'', totp(b''12345678901234567890'', 910), 1000)'
            expect: false
            say: 'Ein Code von vor über einer Minute gilt nicht mehr.'
          - call: 'verify(b''12345678901234567890'', ''000000'', 1000)'
            expect: false
          - call: 'verify(b''12345678901234567890'', totp(b''12345678901234567890'', 1000)[:3] + '' '' + totp(b''12345678901234567890'', 1000)[3:], 1000)'
            expect: true
            say: 'Viele Apps zeigen den Code mit einem Leerzeichen in der Mitte. Das darf keinen Unterschied machen.'
      hint:
        - |
          Die Uhr eines Handys geht 20 Sekunden nach. Für welche Zeiten muss der
          Server den Code ausrechnen, damit er trotzdem passt? Und was soll mit einem
          Code geschehen, den jemand mit Leerzeichen eintippt, `287 082`?
        - |
          Rechne `totp` für die Zeit 30 Sekunden davor, für die Zeit selbst und für 30
          Sekunden danach aus und vergleich jeden dieser drei Codes mit dem
          eingetippten, aus dem du vorher die Leerzeichen entfernst. Stimmt einer, ist
          der Code gut.
        - |
          Ein Gerüst; so ruft die Prüfung `verify` auf:

          ```python
          def verify(key, code, now=None):
              ...  # ohne Zeit: die aktuelle, wie in totp
              code = ...  # ohne Leerzeichen
              return any(... for d in (-30, 0, 30))
          ```

  - id: einmal
    title: Nur einmal
    prompt: Warum soll ein Server einen Code, mit dem sich jemand gerade angemeldet hat, kein zweites Mal annehmen, obwohl er noch gilt?
    check:
      type: choice
      options:
        - Wer ihn mitgelesen hat, etwa über die Schulter, könnte sich sonst mit demselben Code gleich noch einmal anmelden.
        - Weil der Code dann schon falsch ist.
        - Weil die App den Code beim Anmelden löscht.
        - Das muss er nicht; ein Code darf so oft benutzt werden, wie er gilt.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Rechnerisch stimmt der Code noch, bis sein Zeitfenster vorbei ist. Deshalb muss sich der Server merken, welcher schon benutzt wurde.
      - when: { picked: 3 }
        say: Dann hätte jemand, der den Code mitliest, bis zu einer Minute Zeit, ihn selbst zu benutzen.
    solution: |
      Ein Code gilt 30 Sekunden, mit dem Fenster davor und danach bis zu 90. Wer
      ihn mitliest, über die Schulter oder auf einer gefälschten Seite, könnte ihn
      in dieser Zeit noch einmal benutzen. Merkt sich der Server benutzte Codes,
      ist der zweite Versuch wertlos.

  - id: wovor
    title: Wovor schützt der zweite Faktor?
    prompt: |
      Wovor schützt dich ein zweiter Faktor, und wovor nicht? Denk an ein
      Passwort, das in einem Datenleck auftaucht, an ein gestohlenes Handy
      und an eine gefälschte Anmeldeseite, auf der du den Code selbst
      eintippst.
    check:
      type: reflection
      min_words: 25
    examples:
      - |
        Taucht mein Passwort in einem Datenleck auf, nützt es allein niemandem,
        weil der Code von meinem Handy fehlt; davor schützt der zweite Faktor.
        Wer mein entsperrtes Handy hat, hat aber beide Faktoren, wenn das
        Passwort auch darauf gespeichert ist. Und tippe ich den Code selbst auf
        einer gefälschten Seite ein, kann sie ihn sofort an die echte
        weiterreichen, solange er gilt. Dagegen helfen Passkeys, weil das Handy
        dort prüft, mit welcher Seite es redet.
      - |
        Der zweite Faktor schützt mich, wenn jemand nur mein Passwort kennt, zum
        Beispiel aus einem Leck. Er schützt nicht, wenn jemand mein Handy
        entsperrt in der Hand hat, und nicht vor einer gefälschten Anmeldeseite,
        denn der Code weiß nicht, wo er eingetippt wird; die Seite kann ihn in
        den 30 Sekunden selbst benutzen.
