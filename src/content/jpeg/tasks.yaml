# Aufgaben zu »Eine JPEG-Datei decodieren«.
# Format: docs/aufgaben.md. Gearbeitet wird in /workspace/jpeg.
# Die Werte stammen aus dem Referenzdecoder in loesung/jpeg.c und sind mit
# Pillow nachgerechnet. Zwei Decoder liefern nicht Pixel für Pixel dasselbe
# (Rundung der iDCT, Hochrechnen von Cb und Cr); deshalb fragen die letzten
# Aufgaben nach Mittelwerten und einem Pixel, mit Toleranz.
#
# The values belong to exactly these files. src/static/jpeg/91-baseline.jpg
# was made from 91.jpg (progressive, by Ian Kobylanski) with ImageMagick
# 7.1.1-43:
#   convert 91.jpg -strip -interlace none -sampling-factor 1x1 -quality 90 91-baseline.jpg
# Another ImageMagick may write other bytes: then work the tasks out again
# with loesung/jpeg.c. beispiele/44-baseline.jpg is a copy for the
# screenshot recipes.
format: 1
activity: jpeg
tasks:
  - id: bloecke
    title: Eine MCU ohne Subsampling
    prompt: |
      Sieh dir das SOF<sub>0</sub>-Segment von `91-baseline.jpg` an, zum
      Beispiel mit `hexdump -C 91-baseline.jpg | head -30`. Wie ist dort eine
      MCU aufgebaut?
    check:
      type: choice
      options:
        - Aus 3 Blöcken, je einer für Y, Cb und Cr; sie ist 8 × 8 Pixel groß.
        - Aus 6 Blöcken, 4 für Y und je einer für Cb und Cr; sie ist 16 × 16 Pixel groß.
        - Aus 4 Blöcken für Y; Cb und Cr stehen in eigenen MCUs.
        - Aus 3 Blöcken; sie ist 16 × 16 Pixel groß.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: So ist es bei `44-baseline.jpg`, wo Y die Sampling-Faktoren 2 und 2 hat. Bei `91-baseline.jpg` steht für alle drei Komponenten `11`.
      - when: { picked: 2 }
        say: Bei Baseline-JPEGs mit mehreren Komponenten in einem Scan enthält jede MCU Blöcke aller Komponenten.
      - when: { picked: 3 }
        say: Ein Block ist immer 8 × 8 Pixel. Hat keine Komponente einen Sampling-Faktor über 1, ist die MCU nicht größer als ein Block.
    hint: Der SOF<sub>0</sub>-Marker ist `ff c0`. Für jede Komponente stehen danach drei Bytes, das mittlere enthält die beiden Sampling-Faktoren.
    solution: 'Alle drei Komponenten haben die Sampling-Faktoren 1 und 1 (`11`). Eine MCU besteht dann aus einem Block Y, einem Block Cb und einem Block Cr und ist 8 × 8 Pixel groß.'

  - id: codes
    title: Eigene Huffman-Tabellen
    prompt: |
      Wie viele Codes hat die AC-Tabelle in Slot 0 von `91-baseline.jpg`?
    check:
      type: number
      expect: 58
    feedback:
      - when: { equals: 162 }
        say: So viele hat die Standardtabelle in `44-baseline.jpg`. `91-baseline.jpg` bringt eigene, kürzere Tabellen mit.
      - when: { equals: 77 }
        say: 77 ist die Segmentlänge. Sie zählt auch die Länge selbst, das Byte mit Tc und Th und die 16 Anzahlen mit.
      - when: { equals: 75 }
        say: Fast. Von den 75 Bytes nach der Länge sind 1 Byte Tc und Th und 16 Bytes die Anzahlen je Codelänge.
    hint: Die Anzahl der Codes ist die Summe der 16 Anzahlen je Codelänge. Die AC-Tabelle in Slot 0 erkennst du am Byte `10` direkt nach der Länge.
    solution: 'Die 16 Anzahlen sind 0, 2, 1, 2, 5, 2, 4, 3, 6, 5, 2, 5, 2, 4, 0, 15, zusammen 58. Ein Encoder, der eigene Tabellen berechnet, gibt nur Codes für Symbole, die im Bild auch vorkommen.'

  - id: dc
    title: Der zweite Block
    prompt: |
      Der DC-Koeffizient des ersten Y-Blocks von `44-baseline.jpg` ist −120.
      Welchen Wert hat der DC-Koeffizient des zweiten Y-Blocks?
    check:
      type: number
      expect: -138
    feedback:
      - when: { equals: -18 }
        say: Das ist die Differenz, die in der Datei steht. Der DC-Koeffizient ist der vorige plus diese Differenz.
      - when: { equals: 138 }
        say: Fast, aber das Vorzeichen stimmt nicht. Ist das höchste der gelesenen Bits 0, ist die Zahl negativ.
    hint: Lass dir in deinem Decoder die DC-Koeffizienten der ersten Blöcke ausgeben. Der zweite Block kommt direkt nach dem ersten, er ist der obere rechte Y-Block der ersten MCU.
    solution: 'In der Datei steht die Differenz −18, also −120 + (−18) = −138.'

  - id: dequant
    title: Dequantisiert
    prompt: |
      Welcher Wert steht nach der Dequantisierung in `coef[0]` des ersten
      Y-Blocks von `91-baseline.jpg`? Lass ihn dir in `decode_block` für den
      ersten Block ausgeben.
    check:
      type: number
      expect: -48
    feedback:
      - when: { equals: -16 }
        say: Das ist der DC-Koeffizient, wie er in der Datei steht. Nach der Dequantisierung ist er mit dem ersten Wert der Quantisierungstabelle multipliziert.
      - when: { equals: 48 }
        say: Fast, aber das Vorzeichen stimmt nicht. Ist das höchste der gelesenen Bits 0, ist die Zahl negativ.
    hint: Der erste Wert der Quantisierungstabelle von `91-baseline.jpg` für Y ist nicht 5 wie in `44-baseline.jpg`. Er steht im DQT-Segment.
    solution: 'In der Datei steht −16, der erste Wert der Quantisierungstabelle ist 3: −16 · 3 = −48.'

  - id: ohne-dequant
    title: Ohne Dequantisierung
    prediction: true
    prompt: |
      Angenommen, dein Decoder vergisst die Dequantisierung und gibt die
      Koeffizienten so, wie sie in der Datei stehen, in die iDCT. Wie sieht
      das Bild dann aus?
    check:
      type: choice
      options:
        - Wie vorher, nur etwas unschärfer.
        - Fast einheitlich grau, die Umrisse nur schwach zu ahnen.
        - Viel zu kontrastreich, fast nur Schwarz und Weiß.
        - Gar nicht, der Decoder bricht ab.
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: Die feinen Muster werden tatsächlich schwächer, aber nicht nur sie. Um welchen Faktor ist der DC-Koeffizient ohne Dequantisierung zu klein?
      - when: { picked: 2 }
        say: Ohne Dequantisierung sind die Koeffizienten kleiner, nicht größer. Was bedeutet das für die Abstände der Pixel zur Mitte 128?
      - when: { picked: 3 }
        say: Die iDCT rechnet mit jeder Zahl, auch mit zu kleinen. Was kommt heraus, wenn alle Koeffizienten um ihren Tabellenwert zu klein sind?
    solution: |
      Fast einheitlich grau: Jeder Koeffizient ist um seinen Wert in der
      Quantisierungstabelle zu klein, der DC-Koeffizient um wenige Male, die
      feinen Muster um viel mehr. Alle Pixel liegen darum nah bei 128, auch in
      Cb und Cr.

  - id: idct
    title: Nach der iDCT
    prompt: |
      Welchen Wert hat das Pixel oben links im ersten Y-Block von
      `91-baseline.jpg` nach der iDCT, verschoben um 128?
    check:
      type: number
      expect: 110
      tolerance: 1
    feedback:
      - when: { between: [-19, -17] }
        say: Fast. Das ist der Wert vor dem Verschieben um 128.
      - when: { between: [122, 124] }
        say: Das wäre nur der DC-Koeffizient, −48 / 8 + 128 = 122. Die AC-Koeffizienten tragen auch etwas bei.
    hint: 'Prüf deine iDCT zuerst an `44-baseline.jpg`: Dort muss die erste Zeile des ersten Blocks `40 41 43 46 46 43 41 42` sein.'
    solution: '110. Die erste Zeile dieses Blocks ist 110 117 113 113 121 125 134 144.'

  - id: mcu-lage
    title: Die Blöcke in der MCU
    prompt: |
      In `44-baseline.jpg` hat jede MCU vier Y-Blöcke. Welchen Y-Wert hat
      das Pixel bei x = 0, y = 8? Lass ihn dir aus deiner Ebene für Y
      ausgeben.
    check:
      type: number
      expect: 70
      tolerance: 1
    feedback:
      - when: { between: [36, 38] }
        say: Das ist der Wert des zweiten Blocks. Der liegt in der MCU rechts neben dem ersten, nicht darunter; die Blöcke einer Komponente kommen Zeile für Zeile.
      - when: { between: [39, 41] }
        say: Das ist der erste Block, oben links. Bei y = 8 beginnt der dritte, links unten.
    hint: Die vier Y-Blöcke einer MCU kommen in der Reihenfolge oben links, oben rechts, unten links, unten rechts.
    solution: '70: x = 0, y = 8 ist das Pixel oben links im dritten Y-Block, links unten in der ersten MCU.'

  - id: mcus
    title: Wie viele MCUs?
    prompt: |
      Wie viele MCUs hat `91-baseline.jpg` mit seinen 1000 × 667 Pixeln?
    check:
      type: number
      expect: 10500
    feedback:
      - when: { equals: 10375 }
        say: Du hast 667 / 8 abgerundet. Die letzte Reihe ist nur teilweise im Bild, gehört aber trotzdem ganz in die Datei.
      - when: { between: [10421, 10422] }
        say: Das sind die Pixel geteilt durch 64. Rechne Spalten und Reihen von MCUs einzeln aus, jeweils aufgerundet.
      - when: { equals: 2646 }
        say: So viele hat `44-baseline.jpg` mit MCUs von 16 × 16 Pixeln. Bei `91-baseline.jpg` ist eine MCU 8 × 8 Pixel groß.
    solution: '1000 / 8 = 125 Spalten und 667 / 8 = 83,4, aufgerundet 84 Reihen: 125 · 84 = 10500 MCUs.'

  - id: blau
    title: Die Farben im Mittel
    prompt: |
      Welchen Mittelwert von Blau gibt `print_average` für `44-baseline.jpg`
      aus?
    check:
      type: number
      expect: 108.9
      tolerance: 1
    feedback:
      - when: { between: [125, 131] }
        say: Dann sind Cb und Cr vertauscht, und Rot hat etwa 110. Cb ist die zweite Komponente, Cr die dritte.
    hint: Stimmt der Wert nicht, sieh dir das Bild an. Ist es zu dunkel oder zu hell, fehlt vielleicht das Verschieben um 128 nach der iDCT.
    solution: 'Rot 125,3, Grün 114,1, Blau 108,9. Andere Decoder liegen höchstens wenige Zehntel daneben.'

  - id: pixel
    title: Ein Pixel mit Details
    prompt: |
      Welchen Rotwert hat in `91-baseline.jpg` das Pixel bei x = 800,
      y = 350? Gib ihn mit `get_pixel_rgb` aus.
    check:
      type: number
      expect: 80
      tolerance: 2
    feedback:
      - when: { between: [150, 170] }
        say: Die AC-Koeffizienten stehen nicht an ihrem Platz. Hast du sie mit `ZIGZAG` in den Block gebracht? Die Mittelwerte stimmen dann trotzdem fast, weil sie nur von den DC-Koeffizienten abhängen.
      - when: { between: [66, 74] }
        say: Dann sind Cb und Cr vertauscht.
    hint: x zählt von links, y von oben, beide ab 0.
    solution: 'Das Pixel hat die Farbe 80, 75, 69 (Rot, Grün, Blau).'

  - id: decoder
    title: Dein Decoder als Ganzes
    prompt: |
      Lass den Workspace deinen Decoder mit beiden Fotos ausprobieren. Er
      übersetzt `jpeg/jpeg.c` und startet dein `main` mit `44-baseline.jpg`
      und mit `91-baseline.jpg`, wie `make` es tut, aber ohne Bildschirm.
      Dann vergleicht er die Helligkeit von 64 Pixeln über das ganze Foto
      und die Farbe von 32 Pixeln in gleichmäßig gefärbten Flächen mit
      einem richtigen Decoder. Um bis zu 4 darf dein Decoder danebenliegen, denn
      zwei Decoder runden nicht gleich.
    file: jpeg/jpeg.c
    check:
      type: c
      file: jpeg/jpeg.c
      seconds: 10
      timeout: 30
      cases:
        - call: image_found("44-baseline.jpg")
          expect: true
          say: Lade die beiden Fotos wie oben unter »Die Beispieldateien« mit `wget` in den Ordner `jpeg`.
        - call: image_found("91-baseline.jpg")
          expect: true
          say: Lade die beiden Fotos wie oben unter »Die Beispieldateien« mit `wget` in den Ordner `jpeg`.
        - call: opened_size("44-baseline.jpg")
          expect: '"1000 x 667"'
          say: Dein Decoder muss mit `screen_open` ein Bild in der Größe aus dem SOF0-Segment öffnen, erst die Breite, dann die Höhe.
        - call: pixels_off("44-baseline.jpg")
          expect: 0
          say: So viele der 64 Pixel sind heller oder dunkler als bei einem richtigen Decoder. Stimmen die Zick-Zack-Reihenfolge, die Dequantisierung jedes Koeffizienten, das Verschieben um 128 und die Lage der vier Y-Blöcke in der MCU?
        - call: colors_off("44-baseline.jpg")
          expect: 0
          say: Bei so vielen der 32 Pixel stimmt die Farbe nicht. Sind Cb und Cr vertauscht, oder liest du sie bei Subsampling an `x` und `y` statt an `x / 2` und `y / 2`?
        - call: pixels_off("91-baseline.jpg")
          expect: 0
          say: Bei `44-baseline.jpg` hat es gestimmt. `91-baseline.jpg` hat kein Subsampling, also MCUs von 8 × 8 Pixeln mit nur einem Y-Block, und eigene Huffman-Tabellen. Rechnet dein Decoder die Größe der MCU aus den Sampling-Faktoren aus?
        - call: colors_off("91-baseline.jpg")
          expect: 0
          say: Bei `91-baseline.jpg` gehört zu jedem Pixel ein eigener Wert von Cb und Cr. Liest du sie an `x · h / hmax` und `y · v / vmax`?
      setup: |
        // PixelRAM in memory: the check draws nothing, it keeps the picture.
        static int hs_jpeg_w, hs_jpeg_h;
        static uint8_t *hs_jpeg_rgb;

        bool screen_open(int w, int h, pixel_mode mode, const char *title)
        {
            (void) mode;
            (void) title;
            free(hs_jpeg_rgb);
            hs_jpeg_w = w;
            hs_jpeg_h = h;
            hs_jpeg_rgb = w > 0 && h > 0 && w <= 8192 && h <= 8192 ? calloc((size_t) w * h, 3) : NULL;
            return hs_jpeg_rgb != NULL;
        }
        void screen_close(void) {}
        void set_title(const char *title) { (void) title; }
        void present(void) {}
        void wait_vblank(void) {}
        int screen_width(void) { return hs_jpeg_w; }
        int screen_height(void) { return hs_jpeg_h; }

        void set_pixel_rgb(int x, int y, uint8_t r, uint8_t g, uint8_t b)
        {
            if (!hs_jpeg_rgb || x < 0 || y < 0 || x >= hs_jpeg_w || y >= hs_jpeg_h)
                return;
            uint8_t *p = hs_jpeg_rgb + 3 * ((size_t) y * hs_jpeg_w + x);
            p[0] = r;
            p[1] = g;
            p[2] = b;
        }

        bool get_pixel_rgb(int x, int y, uint8_t *r, uint8_t *g, uint8_t *b)
        {
            if (!hs_jpeg_rgb || x < 0 || y < 0 || x >= hs_jpeg_w || y >= hs_jpeg_h)
                return false;
            uint8_t *p = hs_jpeg_rgb + 3 * ((size_t) y * hs_jpeg_w + x);
            *r = p[0];
            *g = p[1];
            *b = p[2];
            return true;
        }

        // The photo in the folder of the decoder
        static const char *hs_jpeg_path(const char *name)
        {
            static char path[4096];
            const char *slash = strrchr(HS_FILE, '/');
            snprintf(path, sizeof path, "%.*s/%s", (int) (slash - HS_FILE), HS_FILE, name);
            return path;
        }

        bool image_found(const char *name)
        {
            FILE *f = fopen(hs_jpeg_path(name), "rb");
            if (f)
                fclose(f);
            return f != NULL;
        }

        // The decoder's main, as make PROGRAM=jpeg ARGS=name starts it
        static void hs_jpeg_decode(const char *name)
        {
            char *argv[] = {"jpeg", (char *) hs_jpeg_path(name), NULL};
            ((int (*)(int, char **)) hs_student_main)(2, argv);
        }

        const char *opened_size(const char *name)
        {
            static char size[40];
            hs_jpeg_decode(name);
            if (!hs_jpeg_rgb)
                return "kein Bild";
            snprintf(size, sizeof size, "%d x %d", hs_jpeg_w, hs_jpeg_h);
            return size;
        }

        // 64 pixels over the whole photo and their brightness from a right
        // decoder (0.299 R + 0.587 G + 0.114 B): the same whether Cb and Cr are
        // taken for four pixels or smoothed between them
        static const short hs_jpeg_points[64][2] = {
            {62, 41}, {187, 41}, {312, 41}, {437, 41}, {562, 41}, {687, 41}, {812, 41}, {937, 41},
            {62, 124}, {187, 124}, {312, 124}, {437, 124}, {562, 124}, {687, 124}, {812, 124}, {937, 124},
            {62, 207}, {187, 207}, {312, 207}, {437, 207}, {562, 207}, {687, 207}, {812, 207}, {937, 207},
            {62, 290}, {187, 290}, {312, 290}, {437, 290}, {562, 290}, {687, 290}, {812, 290}, {937, 290},
            {62, 373}, {187, 373}, {312, 373}, {437, 373}, {562, 373}, {687, 373}, {812, 373}, {937, 373},
            {62, 456}, {187, 456}, {312, 456}, {437, 456}, {562, 456}, {687, 456}, {812, 456}, {937, 456},
            {62, 539}, {187, 539}, {312, 539}, {437, 539}, {562, 539}, {687, 539}, {812, 539}, {937, 539},
            {62, 622}, {187, 622}, {312, 622}, {437, 622}, {562, 622}, {687, 622}, {812, 622}, {937, 622},
        };
        static const unsigned char hs_jpeg_luma[2][64] = {
            {
                91, 200, 240, 246, 241, 77, 205, 192, 132, 57, 133, 10, 240, 77, 131, 152,
                127, 54, 57, 86, 7, 85, 146, 121, 44, 83, 90, 169, 104, 73, 143, 135,
                133, 31, 135, 176, 128, 94, 148, 132, 27, 182, 81, 169, 89, 70, 146, 133,
                46, 83, 148, 106, 154, 94, 99, 132, 63, 75, 134, 110, 146, 171, 50, 6,
            },
            {
                73, 111, 231, 92, 44, 147, 169, 123, 139, 23, 181, 157, 54, 24, 152, 185,
                111, 10, 72, 196, 128, 84, 191, 198, 26, 99, 20, 22, 150, 40, 49, 41,
                25, 5, 51, 60, 103, 26, 27, 58, 81, 100, 53, 45, 4, 116, 128, 62,
                88, 91, 107, 101, 20, 21, 88, 77, 59, 75, 85, 73, 118, 36, 110, 63,
            },
        };

        static int hs_jpeg_file(const char *name)
        {
            return strcmp(name, "44-baseline.jpg") == 0 ? 0 : 1;
        }

        int pixels_off(const char *name)
        {
            hs_jpeg_decode(name);
            if (!hs_jpeg_rgb)
                return 64;
            int off = 0;
            for (int i = 0; i < 64; i++)
            {
                uint8_t r = 0, g = 0, b = 0;
                get_pixel_rgb(hs_jpeg_points[i][0], hs_jpeg_points[i][1], &r, &g, &b);
                double y = 0.299 * r + 0.587 * g + 0.114 * b;
                if (fabs(y - hs_jpeg_luma[hs_jpeg_file(name)][i]) > 4)
                    off++;
            }
            return off;
        }

        // Pixels where Cb and Cr are even all around (x, y, Cb, Cr of a right
        // decoder) and no channel is cut off: Cb and Cr come back from R, G, B
        static const int hs_jpeg_color_count[2] = {32, 32};
        static const short hs_jpeg_colors[2][32][4] = {
            {
                {473, 301, 102, 183}, {573, 301, 98, 169}, {573, 395, 97, 167}, {573, 348, 96, 165},
                {473, 254, 100, 167}, {473, 489, 100, 164}, {423, 489, 106, 157}, {523, 301, 106, 156},
                {373, 489, 108, 155}, {23, 254, 148, 103}, {173, 583, 144, 114}, {73, 583, 143, 114},
                {223, 583, 143, 114}, {173, 536, 142, 114}, {123, 583, 143, 115}, {923, 19, 114, 140},
                {23, 630, 142, 116}, {73, 630, 142, 116}, {123, 630, 142, 116}, {123, 536, 142, 117},
                {923, 66, 114, 138}, {873, 113, 116, 139}, {223, 536, 140, 117}, {173, 630, 140, 117},
                {923, 442, 117, 138}, {873, 19, 116, 136}, {823, 66, 117, 136}, {873, 489, 118, 137},
                {923, 348, 118, 136}, {473, 630, 120, 138}, {873, 395, 119, 136}, {873, 442, 119, 136},
            },
            {
                {423, 160, 110, 164}, {723, 254, 119, 164}, {973, 66, 107, 144}, {873, 301, 124, 161},
                {673, 301, 122, 158}, {773, 301, 124, 159}, {823, 301, 125, 158}, {473, 66, 110, 142},
                {723, 301, 126, 156}, {973, 19, 113, 140}, {173, 254, 143, 117}, {473, 254, 142, 117},
                {523, 254, 143, 118}, {973, 160, 113, 137}, {923, 19, 115, 136}, {273, 254, 138, 118},
                {523, 301, 137, 120}, {123, 630, 137, 120}, {173, 395, 139, 123}, {23, 630, 137, 121},
                {73, 630, 137, 121}, {223, 630, 137, 121}, {223, 442, 135, 120}, {23, 489, 136, 121},
                {73, 489, 136, 121}, {123, 489, 136, 121}, {323, 489, 136, 121}, {23, 536, 136, 121},
                {73, 536, 136, 121}, {123, 536, 136, 121}, {323, 536, 136, 121}, {23, 583, 136, 121},
            },
        };

        int colors_off(const char *name)
        {
            int file = hs_jpeg_file(name);
            hs_jpeg_decode(name);
            if (!hs_jpeg_rgb)
                return hs_jpeg_color_count[file];
            int off = 0;
            for (int i = 0; i < hs_jpeg_color_count[file]; i++)
            {
                const short *c = hs_jpeg_colors[file][i];
                uint8_t r = 0, g = 0, b = 0;
                get_pixel_rgb(c[0], c[1], &r, &g, &b);
                double cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
                double cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
                if (fabs(cb - c[2]) > 4 || fabs(cr - c[3]) > 4)
                    off++;
            }
            return off;
        }
    hint:
      - Fehlt eine der beiden Dateien im Ordner `jpeg`, lade sie wie oben unter »Die Beispieldateien« mit `wget`.
      - Sieht das Bild im Browser richtig aus, aber die Prüfung findet Pixel, die danebenliegen? Dann vergleich die erste Zeile des ersten Y-Blocks mit der von oben, `40 41 43 46 46 43 41 42`, und lass dir für ein Pixel Y, Cb und Cr ausgeben.
    solution: Der Decoder öffnet ein Bild von 1000 × 667 Pixeln und liegt für beide Fotos an allen geprüften Pixeln höchstens um 4 neben einem richtigen Decoder.
