# Aufgaben zu »SQL Injection«.
# Format: docs/aufgaben.md. Das Programm liegt in /workspace/bobby_tables.
format: 1
activity: bobby_tables
tasks:
  - id: zweck
    title: Was das Programm tut
    prompt: |
      Teste das Programm mit richtigen und falschen Zugangsdaten. Beschreibe
      kurz, was es tut und wozu es dient.
    check:
      type: reflection
      min_words: 15
    examples:
      - |
        Das Programm fragt nach Login und Passwort und sieht in der Tabelle
        `users` nach, ob es eine Zeile mit genau diesem Login und diesem Passwort
        gibt. Mit `alice` und `asdf` meldet es »Anmeldung erfolgreich. Herzlich
        willkommen, alice.«, mit einem falschen Passwort »Fehler: Login oder
        Passwort falsch.« So eine Anmeldung steht vor jedem geschützten Bereich.
      - |
        Es ist eine Anmeldung: Nur wer einen Login und das passende Passwort
        kennt, wird hereingelassen und mit seinem Namen begrüßt. Alle anderen
        bekommen eine Fehlermeldung.

  - id: abfrage
    title: Die Abfrage
    prompt: |
      Erläutere die SQL-Abfrage, die das Programm schickt: Was steht nach
      `WHERE`, und wann liefert sie eine Zeile zurück?
    check:
      type: reflection
      min_words: 20
    examples:
      - |
        Mit `alice` und `asdf` schickt das Programm
        `SELECT login FROM users WHERE login = 'alice' AND password = 'asdf' LIMIT 1;`.
        Nach `WHERE` stehen zwei Bedingungen, die beide erfüllt sein müssen: Der
        Login muss stimmen und das Passwort auch. Nur dann liefert die Abfrage
        eine Zeile mit dem Login, sonst ist das Ergebnis leer, und das Programm
        meldet einen Fehler.
      - |
        Die Abfrage sucht in `users` nach Zeilen, in denen `login` gleich der
        Eingabe ist und `password` gleich dem eingegebenen Passwort. Wegen `AND`
        reicht ein richtiger Login allein nicht. `LIMIT 1` sorgt dafür, dass
        höchstens eine Zeile zurückkommt.

  - id: apostroph
    title: Ein Name mit Apostroph
    prediction: true
    prompt: |
      Jemand heißt mit Login `o'brien` und tippt irgendein Passwort ein. Was
      macht das Programm? Überleg erst, dann probier es aus.
    check:
      type: choice
      options:
        - 'Es meldet »Fehler: Login oder Passwort falsch.«'
        - 'Es bricht mit einem Fehler der Datenbank ab.'
        - "Es meldet »Herzlich willkommen, o'brien.«"
        - 'Es fragt noch einmal nach dem Login.'
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: 'Das wäre richtig, wenn das Programm den Namen nur vergliche. Setz `o''brien` einmal von Hand in die Abfrage ein, wie das Programm es tut: Wo endet der Text in den Apostrophen?'
      - when: { picked: 2 }
        say: Selbst wenn es diesen Benutzer gäbe, käme die Abfrage gar nicht so weit. Setz den Namen einmal von Hand in die Abfrage ein.
      - when: { picked: 3 }
        say: Das Programm fragt nur einmal; eine Schleife hat es nicht. Setz den Namen einmal von Hand in die Abfrage ein.
    solution: |
      Es bricht ab: Der Apostroph beendet den Text zu früh, und `brien' AND …`
      ist kein gültiges SQL. Die Eingabe wird Teil der Abfrage, und genau das
      nutzt die nächste Aufgabe aus.

  - id: admin
    title: Als admin, ohne Passwort
    prompt: |
      Finde eine Eingabe, mit der du dich als `admin` anmeldest, ohne das
      Passwort zu kennen. Schreib auf, welche SQL-Abfrage dabei entsteht und
      warum sie eine Zeile liefert.
    check:
      type: reflection
      min_words: 20
    examples:
      - |
        Als Login `admin' #`, das Passwort ist egal. Es entsteht
        `SELECT login FROM users WHERE login = 'admin' #' AND password = '' LIMIT 1;`.
        Mein Anführungszeichen schließt den Login, und alles hinter `#` ist ein
        Kommentar: Die Prüfung des Passworts wird gar nicht ausgeführt. Übrig
        bleibt `WHERE login = 'admin'`, und diese Zeile gibt es.
      - |
        Als Login `' OR login = 'admin' #`. Die Abfrage wird zu
        `SELECT login FROM users WHERE login = '' OR login = 'admin' #…`. Den
        leeren Login gibt es nicht, aber wegen `OR` reicht der zweite Teil, und
        der Rest mit dem Passwort ist auskommentiert. Also kommt die Zeile von
        `admin` zurück.

  - id: union
    title: Eine zweite Abfrage
    prompt: |
      Melde dich mit diesem Login und einem leeren Passwort an:
      `mallory' UNION SELECT address FROM users WHERE LOGIN='mallory' ORDER BY login ASC #`.
      Was beobachtest du, und wie kommt es dazu?
    check:
      type: reflection
      min_words: 20
    examples:
      - |
        Das Programm begrüßt mich mit »Herzlich willkommen, 3747 Haven Lane,
        Lansing MI 48933.«, also mit Mallorys Adresse statt eines Namens. Die
        Abfrage ist jetzt
        `SELECT login FROM users WHERE login = 'mallory' UNION SELECT address FROM users WHERE LOGIN='mallory' ORDER BY login ASC`,
        der Rest mit dem Passwort ist auskommentiert. `UNION` hängt die Ergebnisse
        zweier Abfragen untereinander: `mallory` und ihre Adresse. Sortiert steht
        die Adresse vorn, weil sie mit einer Ziffer beginnt, und das Programm gibt
        die erste Spalte der ersten Zeile als Namen aus.
      - |
        Statt eines Namens steht in der Begrüßung eine Adresse. Mit `UNION` habe
        ich eine zweite Abfrage angehängt, die etwas ganz anderes aus der Tabelle
        holt. Das Programm weiß nicht, woher die Zeile kommt; es gibt einfach den
        ersten Wert aus, und nach `ORDER BY` ist das die Adresse.

  - id: passwort-auslesen
    title: Das Passwort des Administrators
    prompt: |
      Formuliere die Eingabe aus der letzten Aufgabe so um, dass das Programm
      das Passwort des Administrators ausgibt.
    check:
      type: reflection
      min_words: 10
    examples:
      - |
        Login `x' UNION SELECT password FROM users WHERE login='admin' #`. Einen
        Login `x` gibt es nicht, also liefert nur die zweite Abfrage eine Zeile:
        das Passwort des Administrators. Das Programm begrüßt mich damit,
        »Herzlich willkommen, YLrelnmPDPB-ZhQ1GzRxiEf.«
      - |
        Ich frage in der zweiten Abfrage nach `password` statt nach `address`
        und nach `admin` statt nach `mallory`:
        `mallory' UNION SELECT password FROM users WHERE login='admin' ORDER BY login DESC #`.
        `DESC` sortiert `mallory` nach hinten, damit das Passwort vorn steht.

  - id: prepared
    title: Ein Prepared Statement
    prompt: |
      Ändere `login.rb` so, dass es die Abfrage mit Platzhaltern vorbereitet
      und mit den Eingaben ausführt, und speichere.
    file: bobby_tables/login.rb
    check:
      type: files
      path: bobby_tables/login.rb
      expect:
        format: text
        contains:
          - { pattern: '^\s*[^#\s].*\.prepare\(', say: 'In `login.rb` bereitet noch nichts eine Abfrage vor: `CLIENT.prepare(…)` mit `?` als Platzhaltern.' }
          - { pattern: '^\s*[^#\s].*\.execute\(', say: 'Noch führt `login.rb` die vorbereitete Abfrage nicht aus: `query.execute(login, password)`.' }
    python:
      prompt: |
        Ändere `login.py` so, dass es die Abfrage mit Platzhaltern vorbereitet
        und mit den Eingaben ausführt, und speichere.
      file: bobby_tables/login.py
      check:
        type: files
        path: bobby_tables/login.py
        expect:
          format: text
          contains:
            - { pattern: '^\s*[^#\s].*prepared\s*=\s*True', say: 'In `login.py` bereitet noch nichts eine Abfrage vor: `connection.cursor(prepared=True)`.' }
            - { pattern: '^\s*[^#\s].*\.execute\([^#]*,\s*[(\[]', say: 'Noch führt `login.py` die Abfrage nicht mit getrennten Werten aus: `cursor.execute("… ? … ?", (login, password))`.' }

  - id: behoben
    title: Noch einmal versuchen
    prompt: |
      Wiederhole die drei Versuche mit dem geänderten Programm: als `admin`
      ohne Passwort, die Adresse von Mallory, das Passwort des
      Administrators. Was passiert jetzt, und warum?
    check:
      type: reflection
      min_words: 20
    examples:
      - |
        Alle drei Versuche scheitern mit »Fehler: Login oder Passwort falsch.«
        Beim Prepared Statement gehen die Abfrage mit ihren Platzhaltern und die
        Werte getrennt an die Datenbank. Mein Login wird nicht mehr in den
        SQL-Text geklebt, sondern nur noch verglichen: Die Datenbank sucht nach
        jemandem, der wirklich `admin' #` heißt, und den gibt es nicht.
      - |
        Jetzt kommt bei allen dreien nur die Fehlermeldung. Anführungszeichen,
        `#` und `UNION` in meiner Eingabe sind für die Datenbank nur noch
        Zeichen in einem Wert und kein SQL mehr, weil die Abfrage schon fertig
        vorbereitet ist, bevor die Werte ankommen.

  - id: warum-prepared
    title: Warum es hilft
    prompt: Warum schützt ein Prepared Statement vor SQL Injection?
    check:
      type: choice
      options:
        - SQL-Code und Werte gehen getrennt an die Datenbank, ein Wert wird nie als SQL gelesen
        - 'Es verschlüsselt die Eingabe, bevor sie über das Netz zur Datenbank geht'
        - 'Es löscht alle Anführungszeichen und Kommentarzeichen aus der Eingabe'
        - 'Es lässt nur Buchstaben und Ziffern zu und lehnt jede andere Eingabe ab'
      correct: 0
    feedback:
      - when: { picked: 2 }
        say: Dann könnte sich niemand namens O'Brien anmelden. Ein Prepared Statement lässt die Eingabe, wie sie ist.
    solution: Die Datenbank bekommt zuerst die Abfrage mit Platzhaltern und danach die Werte. Was in einem Wert steht, auch ein Anführungszeichen oder `#`, bleibt ein Wert und wird nie Teil des SQL-Codes.

  - id: eigener-zugang
    title: Ein Zugang nur für diese Datenbank
    prompt: |
      Das Programm meldet sich mit dem Zugang an, der nur deine
      Testdatenbank erreicht. Was gewinnst du dadurch, solange die Lücke noch
      offen ist?
    check:
      type: choice
      options:
        - Wer die Lücke ausnutzt, erreicht nur diese Datenbank, nicht deine anderen
        - 'Die Lücke lässt sich mit diesem Zugang gar nicht mehr ausnutzen'
        - 'Das Programm läuft schneller, weil der Zugang weniger prüfen muss'
        - 'Nichts, denn jeder Zugang darf in MySQL auf alle Datenbanken'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Die Lücke steckt im Programm. Der Zugang entscheidet nur, wie weit der Schaden reicht.
    solution: Der Zugang begrenzt den Schaden. Eine Lücke in einem Programm, das mit deinem Hauptzugang arbeitet, würde auch deine anderen Datenbanken offenlegen. Gib jedem Programm nur die Rechte, die es braucht.
