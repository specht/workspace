    java:
      prompt: |
        Schreib in `Customer.java` die Klasse `Customer`: Der Konstruktor bekommt
        die Zahl der Artikel und die Ankunftszeit, `getItems()` und `getArrival()`
        geben sie zurück.
      check:
        type: java
        file: supermarkt/Customer.java
        cases:
          - call: 'new Customer(12, 30).getItems()'
            expect: 12
          - call: 'new Customer(12, 30).getArrival()'
            expect: 30
            say: Der zweite Wert im Konstruktor ist die Ankunftszeit.
          - call: 'new Customer(3, 95).getItems()'
            expect: 3
      solution: |
        `Customer.java`:

        ```java
        public class Customer {
            private int items;
            private int arrival;

            public Customer(int items, int arrival) {
                this.items = items;
                this.arrival = arrival;
            }

            public int getItems() {
                return items;
            }

            public int getArrival() {
                return arrival;
            }
        }
        ```

  - id: kasse-vorhersage
    title: Wie lange wartet sie?
    prediction: true
    prompt: |
      An einer leeren Kasse kommt in Sekunde 0 eine Kundin mit 10 Artikeln an,
      in Sekunde 30 eine mit 5 Artikeln:

      ```ruby
      first = Customer.new(10, 0)
      second = Customer.new(5, 30)
      ```

      Wie viele Sekunden wartet die zweite, bis sie drankommt?
    check:
      type: choice
      options: ['0: Sie kommt ja erst nach der ersten.', '30: So lange ist die erste schon dran.', '60', '90: So lange braucht die erste.']
      correct: 2
    solution: |
      Die erste ist bis Sekunde 90 dran (60 + 3 · 10). Die zweite kommt in
      Sekunde 30 und muss bis Sekunde 90 warten: 60 Sekunden.
    python:
      prompt: |
        An einer leeren Kasse kommt in Sekunde 0 eine Kundin mit 10 Artikeln an,
        in Sekunde 30 eine mit 5 Artikeln:

        ```python
        first = Customer(10, 0)
        second = Customer(5, 30)
        ```

        Wie viele Sekunden wartet die zweite, bis sie drankommt?
    javascript:
