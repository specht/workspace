    dart:
      prompt: |
        Schreib die Klasse `Checkout`. Eine neue Kasse ist ab Sekunde 0 frei;
        `freeAt` sagt, ab wann sie frei ist. `serviceTime(customer)` gibt
        60 + 3 Sekunden je Artikel zurück. `serve(customer)` fängt an, sobald die
        Kasse frei und die Kundin da ist, merkt sich, wann die Kasse danach frei ist,
        und gibt zurück, wie viele Sekunden die Kundin gewartet hat. Die Prüfung legt
        für jeden Fall eine neue Kasse an.
      check:
        type: dart
        file: supermarkt/supermarket.dart
        cases:
          - call: Checkout().freeAt
            expect: 0
            say: Eine neue Kasse ist ab Sekunde 0 frei.
          - call: 'Checkout().serviceTime(Customer(10, 0))'
            expect: 90
            say: '60 Sekunden Bezahlen und 3 je Artikel: 60 + 3 · 10.'
          - call: 'final k = Checkout(); k.serve(Customer(10, 0))'
            expect: 0
            say: 'Wer an eine freie Kasse kommt, wartet nicht.'
          - call: 'final k = Checkout(); k.serve(Customer(10, 0)); k.freeAt'
            expect: 90
            say: Nach der ersten Kundin ist die Kasse ab Sekunde 90 frei.
          - call: 'final k = Checkout(); k.serve(Customer(10, 0)); k.serve(Customer(5, 30))'
            expect: 60
            say: Die zweite kommt in Sekunde 30 und kommt in Sekunde 90 dran.
          - call: 'final k = Checkout(); k.serve(Customer(10, 0)); k.serve(Customer(5, 30)); k.freeAt'
            expect: 165
          - call: 'final k = Checkout(); k.serve(Customer(10, 0)); k.serve(Customer(5, 200))'
            expect: 0
            say: 'Kommt jemand, wenn die Kasse schon wieder frei ist, wartet sie nicht; die Kasse fängt erst an, wenn sie da ist.'
          - call: 'final k = Checkout(); k.serve(Customer(10, 0)); k.serve(Customer(5, 200)); k.freeAt'
            expect: 275
            say: 'Die Kasse fängt in Sekunde 200 an, nicht schon in Sekunde 90.'
      solution: |
        ```dart
        class Checkout {
          int _freeAt = 0;

          int get freeAt => _freeAt;

          int serviceTime(Customer customer) => 60 + 3 * customer.items;

          int serve(Customer customer) {
            final start = customer.arrival > _freeAt ? customer.arrival : _freeAt;
            _freeAt = start + serviceTime(customer);
            return start - customer.arrival;
          }
        }
        ```
    java:
      prompt: |
        Schreib die Klasse `Checkout`. Eine neue Kasse ist ab Sekunde 0 frei;
        `getFreeAt()` sagt, ab wann sie frei ist. `serviceTime(customer)` gibt
        60 + 3 Sekunden je Artikel zurück. `serve(customer)` fängt an, sobald die
        Kasse frei und die Kundin da ist, merkt sich, wann die Kasse danach frei ist,
        und gibt zurück, wie viele Sekunden die Kundin gewartet hat. Die Prüfung legt
        für jeden Fall eine neue Kasse an.
      check:
        type: java
        file: supermarkt/Checkout.java
        cases:
          - call: new Checkout().getFreeAt()
            expect: 0
            say: Eine neue Kasse ist ab Sekunde 0 frei.
          - call: 'new Checkout().serviceTime(new Customer(10, 0))'
            expect: 90
            say: '60 Sekunden Bezahlen und 3 je Artikel: 60 + 3 · 10.'
          - call: 'Checkout k = new Checkout(); k.serve(new Customer(10, 0))'
            expect: 0
            say: 'Wer an eine freie Kasse kommt, wartet nicht.'
          - call: 'Checkout k = new Checkout(); k.serve(new Customer(10, 0)); k.getFreeAt()'
            expect: 90
            say: Nach der ersten Kundin ist die Kasse ab Sekunde 90 frei.
          - call: 'Checkout k = new Checkout(); k.serve(new Customer(10, 0)); k.serve(new Customer(5, 30))'
            expect: 60
            say: Die zweite kommt in Sekunde 30 und kommt in Sekunde 90 dran.
          - call: 'Checkout k = new Checkout(); k.serve(new Customer(10, 0)); k.serve(new Customer(5, 30)); k.getFreeAt()'
            expect: 165
          - call: 'Checkout k = new Checkout(); k.serve(new Customer(10, 0)); k.serve(new Customer(5, 200))'
            expect: 0
            say: 'Kommt jemand, wenn die Kasse schon wieder frei ist, wartet sie nicht; die Kasse fängt erst an, wenn sie da ist.'
          - call: 'Checkout k = new Checkout(); k.serve(new Customer(10, 0)); k.serve(new Customer(5, 200)); k.getFreeAt()'
            expect: 275
            say: 'Die Kasse fängt in Sekunde 200 an, nicht schon in Sekunde 90.'
      solution: |
        `Checkout.java`:

        ```java
        public class Checkout {
            private int freeAt = 0;

            public int getFreeAt() {
                return freeAt;
            }

            public int serviceTime(Customer customer) {
                return 60 + 3 * customer.getItems();
            }

            public int serve(Customer customer) {
                int start = Math.max(customer.getArrival(), freeAt);
                freeAt = start + serviceTime(customer);
                return start - customer.getArrival();
            }
        }
        ```

  - id: diagramm-supermarkt
    title: Der Supermarkt im Diagramm
    prompt: |
      Ergänze das Diagramm um die Klasse `Supermarket` mit einem Konstruktor, der
      eine Liste von Kassen bekommt, `checkouts: List<Checkout>`, und den Methoden
      `arrive(customer: Customer): int` und `averageWait(): double`. Dazu
      `Checkout` mit `- freeAt: int`, einem Konstruktor ohne Parameter,
      `serviceTime(customer: Customer): int` und `serve(customer: Customer): int`.
      Verbinde `Supermarket` und `Checkout` mit einer Assoziation `checkouts`, deren
      Multiplizitäten sagen: Ein Supermarkt hat eine oder mehrere Kassen, jede Kasse
      gehört zu genau einem Supermarkt.
    check:
      type: classes
      file: supermarkt/supermarkt.uml
      classes:
        - name: Checkout
          attributes: ["- freeAt: int"]
          methods: ["+ Checkout()", "+ serviceTime(customer: Customer): int", "+ serve(customer: Customer): int"]
        - name: Supermarket
          methods: ["+ Supermarket(checkouts: List<Checkout>)", "+ arrive(customer: Customer): int", "+ averageWait(): double"]
      associations:
        - between: [Supermarket, Checkout]
          multiplicities: ["1", "1..*"]
    solution: |
      ```uml
      class Checkout
        - freeAt: int
        + Checkout()
        + serviceTime(customer: Customer): int
        + serve(customer: Customer): int

      class Supermarket
        - totalWait: int
        - customers: int
        + Supermarket(checkouts: List<Checkout>)
        + arrive(customer: Customer): int
        + averageWait(): double

      association checkouts: Supermarket 1 -- 1..* Checkout
      ```

      Die Attribute für die Summe der Wartezeiten und die Zahl der Kundinnen prüft
      die Aufgabe nicht; sie gehören zum Entwurf, aber jeder darf sie nennen, wie er
      will.
    feedback:
      - when: { problem: multiplicity }
        say: Lies jede Seite für sich. Wie viele Supermärkte hat eine Kasse? Wie viele Kassen ein Supermarkt?
      - when: { problem: missing_association }
        say: 'Eine Assoziation steht für sich, nicht in einer Klasse, `association checkouts: Supermarket … -- … Checkout`.'
      - when: { problem: method }
        say: 'Der Konstruktor bekommt die Kassen als Liste: `+ Supermarket(checkouts: List<Checkout>)`.'
    hint: |
      Eine Multiplizität steht an der Klasse, um deren Anzahl es geht:
      `Supermarket 1 -- 1..* Checkout` heißt, an einer Kasse hängt genau ein
      Supermarkt, an einem Supermarkt mindestens eine Kasse.
    ruby:
      prompt: |
        Ergänze das Diagramm um die Klasse `Supermarket` mit einem Konstruktor, der
        eine Liste von Kassen bekommt, `checkouts: List<Checkout>`, und den Methoden
        `arrive(customer: Customer): int` und `average_wait(): double`. Dazu
