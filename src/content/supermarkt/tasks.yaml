        ```
    dart:
      prompt: |
        Schreib in `supermarket.dart` die Klasse `Customer`: Der Konstruktor
        bekommt die Zahl der Artikel und die Ankunftszeit, die Getter `items` und
        `arrival` geben sie zurück.
      check:
        type: dart
        file: supermarkt/supermarket.dart
        cases:
          - call: 'Customer(12, 30).items'
            expect: 12
          - call: 'Customer(12, 30).arrival'
            expect: 30
            say: Der zweite Wert im Konstruktor ist die Ankunftszeit.
          - call: 'Customer(3, 95).items'
            expect: 3
      solution: |
        ```dart
