  - id: kasse
    title: Die Kasse
    prompt: |
      Schreib die Klasse `Checkout`. Eine neue Kasse ist ab Sekunde 0 frei;
      `free_at` sagt, ab wann sie frei ist. `service_time(customer)` gibt
      60 + 3 Sekunden je Artikel zurück. `serve(customer)` fängt an, sobald die
      Kasse frei und die Kundin da ist, merkt sich, wann die Kasse danach frei ist,
      und gibt zurück, wie viele Sekunden die Kundin gewartet hat. Die Prüfung legt
      für jeden Fall eine neue Kasse an.
    check:
      type: ruby
      file: supermarkt/supermarket.rb
      cases:
        - call: Checkout.new.free_at
          expect: 0
          say: Eine neue Kasse ist ab Sekunde 0 frei.
        - call: 'Checkout.new.service_time(Customer.new(10, 0))'
          expect: 90
          say: '60 Sekunden Bezahlen und 3 je Artikel: 60 + 3 · 10.'
        - call: 'k = Checkout.new; k.serve(Customer.new(10, 0))'
          expect: 0
          say: 'Wer an eine freie Kasse kommt, wartet nicht.'
        - call: 'k = Checkout.new; k.serve(Customer.new(10, 0)); k.free_at'
          expect: 90
          say: Nach der ersten Kundin ist die Kasse ab Sekunde 90 frei.
        - call: 'k = Checkout.new; k.serve(Customer.new(10, 0)); k.serve(Customer.new(5, 30))'
          expect: 60
          say: Die zweite kommt in Sekunde 30 und kommt in Sekunde 90 dran.
        - call: 'k = Checkout.new; k.serve(Customer.new(10, 0)); k.serve(Customer.new(5, 30)); k.free_at'
          expect: 165
        - call: 'k = Checkout.new; k.serve(Customer.new(10, 0)); k.serve(Customer.new(5, 200))'
          expect: 0
          say: 'Kommt jemand, wenn die Kasse schon wieder frei ist, wartet sie nicht; die Kasse fängt erst an, wenn sie da ist.'
        - call: 'k = Checkout.new; k.serve(Customer.new(10, 0)); k.serve(Customer.new(5, 200)); k.free_at'
          expect: 275
          say: 'Die Kasse fängt in Sekunde 200 an, nicht schon in Sekunde 90.'
    solution: |
      ```ruby
      class Checkout
        attr_reader :free_at

        def initialize
          @free_at = 0
        end

        def service_time(customer)
          60 + 3 * customer.items
        end

        def serve(customer)
          start = [customer.arrival, @free_at].max
          @free_at = start + service_time(customer)
          start - customer.arrival
        end
      end
      ```
    python:
      prompt: |
        Schreib die Klasse `Checkout`. Eine neue Kasse ist ab Sekunde 0 frei;
        `free_at` sagt, ab wann sie frei ist. `service_time(customer)` gibt
        60 + 3 Sekunden je Artikel zurück. `serve(customer)` fängt an, sobald die
        Kasse frei und die Kundin da ist, merkt sich, wann die Kasse danach frei ist,
        und gibt zurück, wie viele Sekunden die Kundin gewartet hat. Die Prüfung legt
        für jeden Fall eine neue Kasse an.
      check:
        type: python
        file: supermarkt/supermarket.py
        cases:
          - call: Checkout().free_at
            expect: 0
            say: Eine neue Kasse ist ab Sekunde 0 frei.
          - call: 'Checkout().service_time(Customer(10, 0))'
            expect: 90
            say: '60 Sekunden Bezahlen und 3 je Artikel: 60 + 3 · 10.'
          - call: 'k = Checkout(); k.serve(Customer(10, 0))'
            expect: 0
            say: 'Wer an eine freie Kasse kommt, wartet nicht.'
          - call: 'k = Checkout(); k.serve(Customer(10, 0)); k.free_at'
            expect: 90
            say: Nach der ersten Kundin ist die Kasse ab Sekunde 90 frei.
          - call: 'k = Checkout(); k.serve(Customer(10, 0)); k.serve(Customer(5, 30))'
            expect: 60
            say: Die zweite kommt in Sekunde 30 und kommt in Sekunde 90 dran.
          - call: 'k = Checkout(); k.serve(Customer(10, 0)); k.serve(Customer(5, 30)); k.free_at'
            expect: 165
          - call: 'k = Checkout(); k.serve(Customer(10, 0)); k.serve(Customer(5, 200))'
            expect: 0
            say: 'Kommt jemand, wenn die Kasse schon wieder frei ist, wartet sie nicht; die Kasse fängt erst an, wenn sie da ist.'
          - call: 'k = Checkout(); k.serve(Customer(10, 0)); k.serve(Customer(5, 200)); k.free_at'
            expect: 275
            say: 'Die Kasse fängt in Sekunde 200 an, nicht schon in Sekunde 90.'
      solution: |
        ```python
        class Checkout:
            def __init__(self):
                self._free_at = 0

            @property
            def free_at(self):
                return self._free_at

            def service_time(self, customer):
                return 60 + 3 * customer.items

            def serve(self, customer):
                start = max(customer.arrival, self._free_at)
                self._free_at = start + self.service_time(customer)
                return start - customer.arrival
        ```
    javascript:
      prompt: |
        Schreib die Klasse `Checkout`. Eine neue Kasse ist ab Sekunde 0 frei;
        `freeAt` sagt, ab wann sie frei ist. `serviceTime(customer)` gibt
        60 + 3 Sekunden je Artikel zurück. `serve(customer)` fängt an, sobald die
        Kasse frei und die Kundin da ist, merkt sich, wann die Kasse danach frei ist,
        und gibt zurück, wie viele Sekunden die Kundin gewartet hat. Die Prüfung legt
        für jeden Fall eine neue Kasse an.
      check:
        type: javascript
        file: supermarkt/supermarket.js
        cases:
          - call: new Checkout().freeAt
            expect: 0
            say: Eine neue Kasse ist ab Sekunde 0 frei.
          - call: 'new Checkout().serviceTime(new Customer(10, 0))'
            expect: 90
            say: '60 Sekunden Bezahlen und 3 je Artikel: 60 + 3 · 10.'
          - call: 'const k = new Checkout(); k.serve(new Customer(10, 0))'
            expect: 0
            say: 'Wer an eine freie Kasse kommt, wartet nicht.'
          - call: 'const k = new Checkout(); k.serve(new Customer(10, 0)); k.freeAt'
            expect: 90
            say: Nach der ersten Kundin ist die Kasse ab Sekunde 90 frei.
          - call: 'const k = new Checkout(); k.serve(new Customer(10, 0)); k.serve(new Customer(5, 30))'
            expect: 60
            say: Die zweite kommt in Sekunde 30 und kommt in Sekunde 90 dran.
          - call: 'const k = new Checkout(); k.serve(new Customer(10, 0)); k.serve(new Customer(5, 30)); k.freeAt'
            expect: 165
          - call: 'const k = new Checkout(); k.serve(new Customer(10, 0)); k.serve(new Customer(5, 200))'
            expect: 0
            say: 'Kommt jemand, wenn die Kasse schon wieder frei ist, wartet sie nicht; die Kasse fängt erst an, wenn sie da ist.'
          - call: 'const k = new Checkout(); k.serve(new Customer(10, 0)); k.serve(new Customer(5, 200)); k.freeAt'
            expect: 275
            say: 'Die Kasse fängt in Sekunde 200 an, nicht schon in Sekunde 90.'
      solution: |
        ```javascript
        class Checkout {
          #freeAt = 0;

          get freeAt() {
            return this.#freeAt;
          }

          serviceTime(customer) {
            return 60 + 3 * customer.items;
          }

          serve(customer) {
            const start = Math.max(customer.arrival, this.#freeAt);
