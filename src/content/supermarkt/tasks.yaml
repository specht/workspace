        - call: 's = Supermarket.new([Checkout.new]); s.arrive(Customer.new(10, 0)); s.arrive(Customer.new(10, 45)); s.average_wait'
          expect: 22.5
          say: 'Die beiden warten 0 und 45 Sekunden, im Mittel 22,5; eine ganze Zahl ließe die 0,5 weg.'
    solution: |
      ```ruby
      class Supermarket
        def initialize(checkouts)
          @checkouts = checkouts
          @total_wait = 0
          @customers = 0
        end

        def arrive(customer)
          best = nil
          @checkouts.each do |checkout|
            best = checkout if best.nil? || checkout.free_at < best.free_at
          end
          wait = best.serve(customer)
          @total_wait += wait
          @customers += 1
          wait
        end

        def average_wait
          @total_wait.to_f / @customers
        end
      end
      ```
