        - call: 'a = Checkout.new; b = Checkout.new; s = Supermarket.new([a, b]); s.arrive(Customer.new(10, 0)); b.free_at'
          expect: 0
          say: 'Sind beide Kassen frei, geht die Kundin an die erste in der Liste.'
        - call: 'a = Checkout.new; b = Checkout.new; s = Supermarket.new([a, b]); s.arrive(Customer.new(10, 0)); s.arrive(Customer.new(10, 30)); s.arrive(Customer.new(10, 40)); a.free_at'
