# Aufgaben zu »Klassen entwerfen: die Expresskasse«, in Ruby und,
# unter python:, javascript:, dart: und java:, in den anderen vier Sprachen;
# die Klassendiagramme in den Namen der Sprache (javascript, dart und java
# schreiben gleich). Format: docs/aufgaben.md. Alles liegt in
# /workspace/supermarkt.
format: 1
activity: supermarkt
tasks:
  - id: klasse-oder-attribut
    title: Klasse oder Attribut?
    prompt: |
      In der Geschichte stehen die Nomen Kasse, Kundin, Zahl der Artikel und
      Expresskasse. Drei davon werden Klassen, weil es von ihnen mehrere gibt
      und jede eigene Werte und eigenes Verhalten hat. Welches wird keine
      Klasse, sondern ein Attribut einer anderen?
    check:
      type: choice
      options: [Kasse, Kundin, Zahl der Artikel, Expresskasse]
      correct: 2
    feedback:
      - when: { picked: 3 }
        say: Eine Expresskasse bedient Leute wie jede Kasse, nur nach einer eigenen Regel. Sie tut etwas, also ist sie mehr als ein Wert.
      - when: { picked: 1 }
        say: Eine Kundin kommt an, hat Artikel und wartet. Sie hat mehrere Werte, also ist sie mehr als ein Wert.
    solution: |
      Die Zahl der Artikel ist eine Zahl, die zu einer Kundin gehört; sie hat
      kein eigenes Verhalten. Sie wird das Attribut `items`.

  - id: diagramm-kunde
    title: Die Kundin im Diagramm
    prompt: |
      Schreib in `supermarkt/supermarkt.uml` die Klasse `Customer` mit den
      Attributen `items` und `arrival`, beide `int` und privat, und mit einem
      öffentlichen Konstruktor, der beide bekommt.
    check:
      type: classes
      file: supermarkt/supermarkt.uml
      classes:
        - name: Customer
          attributes: ["- items: int", "- arrival: int"]
          methods: ["+ Customer(items: int, arrival: int)"]
    feedback:
      - when: { problem: missing_class }
        say: Es fehlt noch `class Customer`, mit großem C.
      - when: { problem: attribute }
        say: 'Attribute sind privat (`-`) und haben einen Typ, `- items: int`.'
      - when: { problem: missing_method }
        say: 'Der Konstruktor heißt wie die Klasse und hat keinen Rückgabetyp, `+ Customer(items: int, arrival: int)`.'
    hint:
      - |
        Eine Klasse beginnt mit `class Customer`; alles, was zu ihr gehört,
        steht darunter eingerückt, eine Zeile je Attribut oder Methode.
      - |
        Ein Attribut ist `- name: Typ`, der Konstruktor `+ Customer(…)` mit den
        Parametern in der Klammer, `name: Typ`, durch Komma getrennt.
    solution: |
      ```uml
      class Customer
        - items: int
        - arrival: int
        + Customer(items: int, arrival: int)
      ```

  - id: kunde
    title: Die Kundin im Code
    prompt: |
      Schreib in `supermarket.rb` die Klasse `Customer`: Der Konstruktor bekommt
      die Zahl der Artikel und die Ankunftszeit, `items` und `arrival` geben sie
      zurück.
    check:
      type: ruby
      file: supermarkt/supermarket.rb
      cases:
        - call: 'Customer.new(12, 30).items'
          expect: 12
        - call: 'Customer.new(12, 30).arrival'
          expect: 30
          say: Der zweite Wert im Konstruktor ist die Ankunftszeit.
        - call: 'Customer.new(3, 95).items'
          expect: 3
    solution: |
      ```ruby
      class Customer
        attr_reader :items, :arrival

        def initialize(items, arrival)
          @items = items
          @arrival = arrival
        end
      end
      ```
    python:
      prompt: |
        Schreib in `supermarket.py` die Klasse `Customer`: Der Konstruktor bekommt
        die Zahl der Artikel und die Ankunftszeit, die Properties `items` und
        `arrival` geben sie zurück.
      check:
        type: python
        file: supermarkt/supermarket.py
        cases:
          - call: 'Customer(12, 30).items'
            expect: 12
          - call: 'Customer(12, 30).arrival'
            expect: 30
            say: Der zweite Wert im Konstruktor ist die Ankunftszeit.
          - call: 'Customer(3, 95).items'
            expect: 3
      solution: |
        ```python
        class Customer:
            def __init__(self, items, arrival):
                self._items = items
                self._arrival = arrival

            @property
            def items(self):
                return self._items

            @property
            def arrival(self):
                return self._arrival
        ```
    javascript:
      prompt: |
        Schreib in `supermarket.js` die Klasse `Customer`: Der Konstruktor bekommt
        die Zahl der Artikel und die Ankunftszeit, die Getter `items` und `arrival`
        geben sie zurück.
      check:
        type: javascript
        file: supermarkt/supermarket.js
        cases:
          - call: 'new Customer(12, 30).items'
            expect: 12
          - call: 'new Customer(12, 30).arrival'
            expect: 30
            say: Der zweite Wert im Konstruktor ist die Ankunftszeit.
          - call: 'new Customer(3, 95).items'
            expect: 3
      solution: |
        ```javascript
        class Customer {
          #items;
          #arrival;

          constructor(items, arrival) {
            this.#items = items;
            this.#arrival = arrival;
          }

          get items() {
            return this.#items;
          }

          get arrival() {
            return this.#arrival;
          }
