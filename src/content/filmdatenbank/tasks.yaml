# Aufgaben zu »Filmdatenbank mit MySQL«. Format: docs/aufgaben.md.
# er liest /workspace/filmdatenbank/film.er mit der ER-Werkstatt im Workspace,
# schema und sql lesen die eigene MySQL-Datenbank, angemeldet als die Person.
# Die Namen der Tabellen und Spalten stehen fest, weil die Filmdaten
# (movie-archive/movies-data-films.sql, movies-data-crew.sql) sie erwarten.
format: 1
activity: filmdatenbank
tasks:
  - id: eine-spalte
    title: Genres in einer Spalte?
    prompt: |
      Warum ist eine Spalte `genres` in der Tabelle der Filme, in der zum
      Beispiel `Action, Sci-Fi` steht, ungünstig?
    check:
      type: choice
      options:
        - 'Weil MySQL keine Kommas in Texten speichern kann und den Text dort abschneidet.'
        - Weil man dann für jede Frage nach einem Genre in jedem Text suchen muss, und niemand verhindert `Sci-Fi` neben `SciFi`.
        - 'Weil ein Text höchstens 255 Zeichen lang sein darf und lange Listen von Genres nicht hineinpassen.'
        - 'Weil Genres als Zahlen gespeichert werden müssen, sonst lassen sie sich nicht sortieren.'
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: 'Kommas in Texten sind für MySQL kein Problem. Wie findest du alle Filme mit dem Genre `Sci-Fi`, und was passiert bei einem Tippfehler?'
      - when: { picked: 2 }
        say: 'Platz wäre genug. Was kostet es, in jedem Text nach einem Genre zu suchen, und wer verhindert verschiedene Schreibweisen?'
    solution: |
      Ein Wert pro Zelle: Dann kann die Datenbank Genres zählen, vergleichen
      und sicherstellen, dass es jedes Genre nur einmal gibt.

  - id: modell-filme
    title: Filme und Genres
    prompt: |
      Schreib das Modell mit `movie`, `genre` und der Beziehung `has_genre` in
      `filmdatenbank/film.er`.
    check:
      type: er
      file: filmdatenbank/film.er
      entities:
        - name: movie
          key: [id]
          attributes: ["title: text", "original_title: text, optional", "german_title: text, optional", "year: int", "runtime: int"]
        - name: genre
          key: [id]
          attributes: ["name: text, unique"]
      relationships:
        - between: [movie, genre]
          cardinality: n:m
      tables:
        - name: movie_genre
          columns: [movie_id, genre_id]
          primary_key: [movie_id, genre_id]
    feedback:
      - when: { problem: cardinality }
        say: Ein Film kann mehrere Genres haben, und zu einem Genre gehören viele Filme. Auf beiden Seiten steht also »viele«.
      - when: { problem: missing_table }
        say: Aus der Beziehung soll die Tabelle `movie_genre` werden. Schreib zuerst `movie`, dann `genre`, also `movie n:m genre`.

  - id: vorhersage-n1
    title: Was wäre bei n:1?
    prompt: |
      Angenommen, jeder Film hätte nur ein einziges Genre, und du schreibst
      `relationship has_genre: movie n:1 genre`. Was passiert in der
      Tabellenansicht? Überleg zuerst, dann probier es aus und stell `n:m`
      wieder her.
    prediction: true
    check:
      type: choice
      options:
        - Nichts, `movie_genre` bleibt, wie sie ist.
        - "`movie_genre` verschwindet, und `movie` bekommt eine Spalte `genre_id`."
        - "`movie_genre` verschwindet, und `genre` bekommt eine Spalte `movie_id`."
        - Es entstehen zwei Tabellen zwischen `movie` und `genre`.
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: 'Für eine Beziehung n:1 braucht es keine eigene Tabelle mehr. Wohin kommt die Spalte, die auf das Genre zeigt?'
      - when: { picked: 2 }
        say: 'Andersherum: Zu jedem Film gehört genau ein Genre. Die Spalte kommt in die Tabelle auf der Seite mit dem n, also zu `movie`.'
    solution: |
      Bei n:1 gehört zu jedem Film genau ein Genre. Das passt in eine Spalte
      der Tabelle `movie`: den Fremdschlüssel `genre_id`. Eine eigene Tabelle
      braucht nur eine Beziehung, bei der auf beiden Seiten »viele« steht.

  - id: tabellen-filme
    title: Tabellen anlegen
    prompt: Erzeuge `film.sql` und führe es mit `mysql < film.sql` aus.
    check:
      type: schema
      tables:
        - name: movie
          columns: [id, title, original_title, german_title, year, runtime]
          primary_key: [id]
        - name: genre
          columns: [id, name]
          primary_key: [id]
        - name: movie_genre
          primary_key: [movie_id, genre_id]
          foreign_keys: ["movie_id -> movie.id", "genre_id -> genre.id"]
      setup: Erzeuge in der ER-Werkstatt das SQL und führe im Ordner `filmdatenbank` `mysql < film.sql` aus.

  - id: daten-filme
    title: Filmdaten geladen
    prompt: Lade `movies-data-films.sql` in deine Datenbank.
    check:
      type: schema
      tables:
        - name: movie
          min_rows: 100
        - name: genre
          min_rows: 10
        - name: movie_genre
          min_rows: 100
      setup: Lege zuerst die Tabellen mit `mysql < film.sql` an.

  - id: anzahl-filme
    title: Wie viele Filme?
    prompt: Schreib eine Abfrage, die zählt, wie viele Filme in der Tabelle `movie` stehen.
    check:
      type: sql
      expect_query: SELECT COUNT(*) FROM movie
      tables: { movie: ~ }
      setup: Lade zuerst die Filmdaten, wie unter »Filmdaten laden« beschrieben.

  - id: genres-film
    title: Die Genres von »Back to the Future«
    prompt: Welche Genres hat »Back to the Future« aus dem Jahr 1985? Gefragt sind nur die Namen der Genres.
    check:
      type: sql
      expect_query: |
        SELECT genre.name
        FROM movie
        JOIN movie_genre ON movie.id = movie_genre.movie_id
        JOIN genre ON movie_genre.genre_id = genre.id
        WHERE movie.title = 'Back to the Future' AND movie.year = 1985
      tables: { movie: ~, genre: ~, movie_genre: ~ }
      setup: Lade zuerst die Filmdaten, wie unter »Filmdaten laden« beschrieben.
    feedback:
      - when:
          same_result_as: |
            SELECT movie_genre.genre_id
            FROM movie
            JOIN movie_genre ON movie.id = movie_genre.movie_id
            WHERE movie.title = 'Back to the Future' AND movie.year = 1985
        say: Das sind die IDs der Genres. Für ihre Namen fehlt noch ein `JOIN` mit `genre`.
      - when: { query_matches: '\A(?![\s\S]*\bon\b)[\s\S]*\bjoin\b' }
        say: Zu jedem `JOIN` gehört ein `ON`, das sagt, welche Zeilen zusammengehören.

  - id: animation
    title: Animationsfilme
    prompt: Zeig alle Animationsfilme (Genre `Animation`) mit Titel und Erscheinungsjahr, die ältesten zuerst.
    check:
      type: sql
      expect_query: |
        SELECT movie.title, movie.year
        FROM movie
        JOIN movie_genre ON movie.id = movie_genre.movie_id
        JOIN genre ON movie_genre.genre_id = genre.id
        WHERE genre.name = 'Animation'
        ORDER BY movie.year
      sorted_by: 2
      tables: { movie: ~, genre: ~, movie_genre: ~ }
      setup: Lade zuerst die Filmdaten, wie unter »Filmdaten laden« beschrieben.
    feedback:
      - when: { query_matches: '\A(?![\s\S]*\bon\b)[\s\S]*\bjoin\b' }
        say: Zu jedem `JOIN` gehört ein `ON`, das sagt, welche Zeilen zusammengehören.

  - id: filme-pro-genre
    title: Filme pro Genre
    prompt: Wie viele Filme gibt es in jedem Genre? Zeig den Namen des Genres und die Anzahl, die größten Genres zuerst.
    check:
      type: sql
      expect_query:
        - |
          SELECT genre.name, COUNT(*)
          FROM genre
          JOIN movie_genre ON genre.id = movie_genre.genre_id
          GROUP BY genre.id, genre.name
          ORDER BY COUNT(*) DESC
        - |
          SELECT genre.name, COUNT(movie_genre.movie_id)
          FROM genre
          LEFT JOIN movie_genre ON genre.id = movie_genre.genre_id
          GROUP BY genre.id, genre.name
          ORDER BY COUNT(movie_genre.movie_id) DESC
      sorted_by: 2 DESC
      tables: { genre: ~, movie_genre: ~ }
      setup: Lade zuerst die Filmdaten, wie unter »Filmdaten laden« beschrieben.
    feedback:
      - when: { same_result_as: 'SELECT COUNT(*) FROM movie_genre' }
        say: Das sind alle Zuordnungen zusammen. Mit `GROUP BY genre.name` zählst du jedes Genre für sich.

  - id: modell-crew
    title: Menschen und Tätigkeiten
    prompt: Ergänze `film.er` um `crew`, `job` und die dreistellige Beziehung `credit`.
    check:
      type: er
      file: filmdatenbank/film.er
      entities:
        - name: movie
          key: [id]
        - name: genre
          key: [id]
        - name: crew
          key: [id]
          attributes: ["name: text", "birth_year: int, optional", "death_year: int, optional"]
        - name: job
          key: [id]
          attributes: ["title: text, unique"]
      relationships:
        - between: [movie, genre]
          cardinality: n:m
        - between: [movie, crew, job]
          table: movie_crew
      tables:
        - name: movie_crew
          columns: [movie_id, crew_id, job_id]
          primary_key: [movie_id, crew_id, job_id]
    feedback:
      - when: { problem: missing_relationship }
        say: "Film, Person und Tätigkeit gehören in eine Beziehung, mit Kommas aufgezählt, zum Beispiel `relationship credit: movie, crew, job as movie_crew`."

  - id: tabellen-crew
    title: Alles neu angelegt und geladen
    prompt: |
      Erzeuge das SQL neu und führe `film.sql`, `movies-data-films.sql` und
      `movies-data-crew.sql` nacheinander aus.
    check:
      type: schema
      tables:
        - name: movie
          min_rows: 100
        - name: movie_genre
          min_rows: 100
        - name: crew
          columns: [id, name, birth_year, death_year]
          primary_key: [id]
          min_rows: 100
        - name: job
          columns: [id, title]
          primary_key: [id]
          min_rows: 3
        - name: movie_crew
          primary_key: [movie_id, crew_id, job_id]
          foreign_keys: ["movie_id -> movie.id", "crew_id -> crew.id", "job_id -> job.id"]
          min_rows: 100
      setup: Führe im Ordner `filmdatenbank` `mysql < film.sql` aus und lade dann beide Datendateien.
    feedback:
      - when: { problem: rows }
        say: Eine Tabelle ist leer. `film.sql` löscht alle Tabellen; lade danach `movies-data-films.sql` und `movies-data-crew.sql`, in dieser Reihenfolge.

  - id: besetzung-film
    title: Wer spielt in »Back to the Future«?
    prompt: Wer hat in »Back to the Future« (1985) mitgespielt? Gefragt sind nur die Namen, Tätigkeit `actor`.
    check:
      type: sql
      expect_query: |
        SELECT crew.name
        FROM movie
        JOIN movie_crew ON movie.id = movie_crew.movie_id
        JOIN crew ON movie_crew.crew_id = crew.id
        JOIN job ON movie_crew.job_id = job.id
        WHERE movie.title = 'Back to the Future' AND movie.year = 1985 AND job.title = 'actor'
      tables: { movie: ~, movie_crew: ~, crew: ~, job: ~ }
      setup: Lade zuerst die Personen, wie unter »Das Modell wächst« beschrieben.
    feedback:
      - when:
          same_result_as: |
            SELECT crew.name
            FROM movie
            JOIN movie_crew ON movie.id = movie_crew.movie_id
            JOIN crew ON movie_crew.crew_id = crew.id
            WHERE movie.title = 'Back to the Future' AND movie.year = 1985
        say: Das sind alle, die an dem Film beteiligt waren. Gefragt sind nur die mit der Tätigkeit `actor`; dafür brauchst du noch `job`.

  - id: nolan
    title: Christopher Nolan
    prompt: Bei welchen Filmen hat Christopher Nolan Regie geführt (`director`)? Zeig Titel und Jahr, nach dem Jahr sortiert.
    check:
      type: sql
      expect_query: |
        SELECT movie.title, movie.year
        FROM crew
        JOIN movie_crew ON crew.id = movie_crew.crew_id
        JOIN job ON movie_crew.job_id = job.id
        JOIN movie ON movie_crew.movie_id = movie.id
        WHERE crew.name = 'Christopher Nolan' AND job.title = 'director'
        ORDER BY movie.year
      sorted_by: 2
      tables: { movie: ~, movie_crew: ~, crew: ~, job: ~ }
      setup: Lade zuerst die Personen, wie unter »Das Modell wächst« beschrieben.

  - id: viel-regie
    title: Viel Regie
    prompt: |
      Wer hat bei mindestens fünf Filmen der Datenbank Regie geführt? Zeig den
      Namen und die Anzahl der Filme, die meisten zuerst.
    check:
      type: sql
      expect_query: |
        SELECT crew.name, COUNT(*)
        FROM crew
        JOIN movie_crew ON crew.id = movie_crew.crew_id
        JOIN job ON movie_crew.job_id = job.id
        WHERE job.title = 'director'
        GROUP BY crew.id, crew.name
        HAVING COUNT(*) >= 5
        ORDER BY COUNT(*) DESC
      sorted_by: 2 DESC
      tables: { movie_crew: ~, crew: ~, job: ~ }
      setup: Lade zuerst die Personen, wie unter »Das Modell wächst« beschrieben.
    feedback:
      - when: { query_matches: 'where[\s\S]*count\s*\(' }
        say: In `WHERE` kann noch nicht gezählt werden, dort wird zeilenweise gefiltert. Bedingungen an Gruppen gehören hinter `HAVING`.
    hint:
      - |
        Welche Tabellen brauchst du für »diese Person hat bei einem Film Regie
        geführt«? Geh den Weg im Tabellendiagramm von `crew` über `movie_crew` zu
        `job`. Brauchst du `movie` dafür überhaupt, wenn nur gezählt wird?
      - |
        Verbinde `crew`, `movie_crew` und `job`, behalte mit `WHERE` nur die Zeilen
        mit `director`, gruppiere nach der Person und zähle. `HAVING` behält die
        Gruppen mit mindestens fünf Filmen, `ORDER BY` stellt die meisten nach
        vorn.
      - |
        Ein Gerüst:

        ```sql
        SELECT crew.name, COUNT(*) AS films
        FROM crew
        JOIN movie_crew ON …
        JOIN job ON …
        WHERE …
        GROUP BY crew.id, crew.name
        HAVING …
        ORDER BY …;
        ```

  - id: neue-frage
    title: Was fehlt dem Modell?
    prompt: |
      Denk dir eine Frage an die Filmdatenbank aus, die dieses Modell nicht
      beantworten kann, zum Beispiel für eine Videothek oder ein Kino. Was
      müsste das Modell zusätzlich enthalten: welche Entitäten, welche
      Beziehungen mit welcher Kardinalität?
    check:
      type: reflection
      min_words: 20
    examples:
      - |
        Ein Kino will wissen: »Welche Filme laufen am Samstag ab 20 Uhr, in
        welchem Saal, und wie viele Plätze sind noch frei?« Dafür fehlen die
        Entitäten Saal (Name, Anzahl der Plätze), Vorstellung (Beginn) und
        Ticket. Ein Film hat viele Vorstellungen, eine Vorstellung zeigt genau
        einen Film (1:n), ebenso läuft ein Saal viele Vorstellungen (1:n), und
        zu einer Vorstellung gehören viele Tickets (1:n).
      - |
        Eine Videothek fragt: »Wer hat gerade ein Exemplar von Inception
        ausgeliehen, und seit wann?« Es fehlen Kunde und Exemplar. Ein Film hat
        viele Exemplare (1:n). Zwischen Kunde und Exemplar gibt es die Beziehung
        »leiht aus« mit dem Datum der Ausleihe und der Rückgabe; ein Kunde leiht
        im Lauf der Zeit viele Exemplare, ein Exemplar wird von vielen geliehen,
        also n:m.

  # Normalisierung (Extra): die Tabellen des Filmclubs in der eigenen Datenbank
  - id: vorhersage-geburtsjahr
    title: Ein Geburtsjahr ändern
    extra: true
    prediction: true
    prompt: |
      Jemand im Filmclub ändert bei »Inception« das Geburtsjahr von
      Christopher Nolan und vertippt sich:

      ```sql
      UPDATE club_list SET director_birth_year = 1907 WHERE movie_id = 1499;
      ```

      Was zeigt danach diese Abfrage?

      ```sql
      SELECT DISTINCT director, director_birth_year FROM club_list WHERE director = 'Christopher Nolan';
      ```

      Überleg zuerst. Dann probier es aus, in einer Transaktion: erst
      `START TRANSACTION;`, dann das `UPDATE` und das `SELECT`, zum Schluss
      `ROLLBACK;`.
    check:
      type: choice
      options:
        - 'Eine Zeile mit 1907: Das `UPDATE` ändert Nolans Geburtsjahr bei allen seinen Filmen.'
        - 'Zwei Zeilen, eine mit 1970 und eine mit 1907: Nur die Zeile von »Inception« hat sich geändert.'
        - 'Eine Zeile mit 1970: MySQL lehnt das `UPDATE` ab, weil Nolan sonst zwei Geburtsjahre hätte.'
        - 'Dreizehn Zeilen, eine für jeden Film von Nolan.'
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: 'Das `WHERE` trifft genau eine Zeile, die mit `movie_id = 1499`. Woher sollte MySQL wissen, dass die anderen zwölf Zeilen dieselbe Person meinen?'
      - when: { picked: 2 }
        say: 'Nichts in `club_list` sagt, dass `director_birth_year` in allen Zeilen von Nolan gleich sein muss: kein Schlüssel und keine andere Regel.'
      - when: { picked: 3 }
        say: '`DISTINCT` fasst gleiche Zeilen zusammen. Wie viele verschiedene Paare aus Name und Geburtsjahr gibt es nach dem `UPDATE`?'
    solution: |
      Zwei Zeilen: Das `UPDATE` ändert nur die Zeile von »Inception«, die
      zwölf anderen Filme sagen weiter 1970. Die Tabelle widerspricht sich
      selbst, eine Änderungsanomalie.

  - id: dritte-normalform
    title: Die Regie in eine eigene Tabelle
    extra: true
    prompt: |
      Bring `club_movie` in die dritte Normalform: eine neue Tabelle
      `club_director` mit den Spalten `id`, `name` und `birth_year` und dem
      Primärschlüssel `id`, eine Zeile pro Person. In `club_movie` bleibt
      `director_id` als Fremdschlüssel auf `club_director`; `director` und
      `director_birth_year` stehen dort nicht mehr.
    check:
      type: schema
      tables:
        - name: club_director
          columns: [id, name, birth_year]
          primary_key: [id]
          rows_where:
            - where: "name = 'Christopher Nolan' AND birth_year = 1970"
              rows: 1
              say: In `club_director` fehlt die Zeile für Christopher Nolan, geboren 1970. Stehen Name und Geburtsjahr in den richtigen Spalten?
        - name: club_movie
          columns: [id, title, year, director_id]
          absent_columns: [director, director_birth_year]
          primary_key: [id]
          foreign_keys: ["director_id -> club_director.id"]
          min_rows: 1
      setup: Lege zuerst `club_list`, `club_cast` und `club_movie` an, wie oben unter »Eine Liste für alles« und den beiden Normalformen davor beschrieben.
    feedback:
      - when: { problem: foreign_key }
        say: "`club_movie` hat noch keinen Fremdschlüssel von `director_id` auf `club_director`. Das macht `ADD FOREIGN KEY (director_id) REFERENCES club_director (id)` in einem `ALTER TABLE club_movie`."
    solution: |
      ```sql
      CREATE TABLE club_director (PRIMARY KEY (id)) AS
      SELECT DISTINCT director_id AS id, director AS name, director_birth_year AS birth_year
      FROM club_movie;

      ALTER TABLE club_movie
        DROP COLUMN director, DROP COLUMN director_birth_year,
        ADD FOREIGN KEY (director_id) REFERENCES club_director (id);
      ```

  - id: welche-normalform
    title: Genres mit Namen
    extra: true
    prompt: |
      Jemand speichert zu jedem Film seine Genres gleich mit ihrem Namen, in
      einer Tabelle `movie_genre_named` mit den Spalten `movie_id`,
      `genre_id` und `genre_name`. Der Primärschlüssel besteht aus
      `movie_id` und `genre_id`, eine Zeile ist zum Beispiel
      `(233, 5, 'Comedy')`. Welche Normalform verletzt die Tabelle als
      erste?
    check:
      type: choice
      options:
        - 'Die erste: `genre_name` ist kein einzelner Wert.'
        - 'Die zweite: `genre_name` hängt schon von `genre_id` allein ab, einem Teil des Schlüssels.'
        - 'Die dritte: `genre_name` hängt über die Nichtschlüsselspalte `genre_id` transitiv vom Schlüssel ab.'
        - 'Keine: Die Tabelle ist in der dritten Normalform.'
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: In jeder Zelle von `genre_name` steht ein einziger Name, keine Liste.
      - when: { picked: 2 }
        say: '`genre_id` ist keine Nichtschlüsselspalte, sie gehört zum Schlüssel. Was heißt es, wenn eine Spalte schon von einem Teil des Schlüssels abhängt?'
      - when: { picked: 3 }
        say: 'Wie oft steht `Comedy` in der Tabelle, und was passiert, wenn jemand das Genre umbenennt?'
    solution: |
      Die zweite: Kennst du `genre_id`, kennst du `genre_name`, ganz gleich,
      um welchen Film es geht. Der Name hängt von einem Teil des Schlüssels
      ab und gehört in die Tabelle `genre`, so wie in deiner Datenbank.

  - id: welche-normalform-sprache
    title: Filme mit ihrer Sprache
    extra: true
    prompt: |
      Eine Tabelle `movie_language` hat die Spalten `id`, `title`, `year`,
      `language_code` und `language_name`, der Primärschlüssel ist `id`.
      Jeder Film hat eine Originalsprache; eine Zeile ist zum Beispiel
      `(1176, 'The Lives of Others', 2006, 'de', 'Deutsch')`. Welche
      Normalform verletzt die Tabelle als erste?
    check:
      type: choice
      options:
        - 'Die erste: In `language_code` und `language_name` steht zweimal dieselbe Sprache.'
        - 'Die zweite: `language_name` hängt nur von einem Teil des Schlüssels ab.'
        - 'Die dritte: `language_name` hängt über `language_code` transitiv von `id` ab.'
        - 'Keine: Die Tabelle ist in der dritten Normalform.'
      correct: 2
    feedback:
      - when: { picked: 0 }
        say: In jeder Zelle steht ein einzelner Wert. Die erste Normalform fragt nicht, ob zwei Spalten zusammengehören.
      - when: { picked: 1 }
        say: Der Schlüssel ist eine einzige Spalte, `id`. Von einem Teil davon kann nichts abhängen.
      - when: { picked: 3 }
        say: 'Kennst du `language_code`, kennst du `language_name`. Wie oft steht `Deutsch` in der Tabelle?'
    solution: |
      Die dritte: `id → language_code → language_name`. Die Sprachen kommen
      in eine eigene Tabelle `language(code, name)`, und in `movie_language`
      bleibt `language_code` als Fremdschlüssel.
