# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
format: 1
activity: fire
examples:
  farbe-20:
    pass:
      - answer: 160, 32, 0
      - answer: (160, 32, 0)
      - answer: 160 32 0
      - answer: rgb(160,32,0)
    fail:
      - answer: 288, 160, 0
      - answer: 160, 0, 0
      - answer: 160, 32, 0, 0
      - answer: 1160, 32, 0
  feuer:
    pass:
      - files: { fire.rb: fire.rb }
      # Der Kernel anders geschrieben, wie im Kasten »Jetzt bist du dran«
      - files:
          fire.rb:
            text: |
              c = (2 * get_pixel(x, y + 1) + get_pixel(x - 1, y) + get_pixel(x + 1, y)) / 4
              c += rand(7) - 3 if c > 0
              c = c.clamp(0, 63)
      - files:
          fire.rb:
            text: |
              c = get_pixel(x, y+1) + get_pixel(x, y+1) + get_pixel(x-1, y) + get_pixel(x+1, y)
              c /= 4
              c += rand(7) - 3 if c > 0
              c = c.clamp(0, 63)
    fail:
      - files: { fire.rb: draft1.rb }
        say: get_pixel(x, y + 1)
      # Der Mittelwert der drei: das untere Pixel nur einfach
      - files:
          fire.rb:
            text: |
              c = (get_pixel(x, y + 1) + get_pixel(x - 1, y) + get_pixel(x + 1, y)) / 3
              c += rand(7) - 3 if c > 0
              c = c.clamp(0, 63)
        say: doppelt gezählt
      - files: { fire.rb: stufen/fire3.rb }
        say: clamp(0, 63)
      - files: { fire.rb: stufen/fire4.rb }
        say: if c > 0
