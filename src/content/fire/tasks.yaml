# Aufgaben zu »Feueranimation«. Format: docs/aufgaben.md.
# fire.rb liegt ohne geöffneten Ordner direkt in /workspace; stufen/ hat die
# Stände der Rezepte, fire.rb neben dieser Datei ist das ganze Programm.
format: 1
activity: fire
tasks:
  - id: farbe-20
    title: Farbe 20
    prompt: |
      Welche Farbe bekommt die Nummer 20 mit der neuen Zeile? Schreib Rot,
      Grün und Blau mit Kommas, zum Beispiel `255, 0, 0`.
    check:
      type: answer
      compare: regex
      expect: '^\D*160\s*[,;/ ]\s*32\s*[,;/ ]\s*0\D*$'
    feedback:
      - when: { matches: '^\D*288\D' }
        say: '`i` ist hier nicht 20. Die Schleife läuft von 0 bis 15, und `set_palette(i + 16, …)` setzt die Farbe `i + 16`. Für welches `i` ist das 20?'
      - when: { matches: '^\D*160\s*[,;/ ]\s*0\s*[,;/ ]\s*0\D*$' }
        say: 'Rot stimmt. Und Grün? In der neuen Zeile steht für Grün `i * 8`.'
    hint: Farbe 20 ist `i + 16` mit `i = 4`. Setz 4 für `i` in `i * 8 + 128`, `i * 8` und `0` ein.
    solution: |
      `(160, 32, 0)`: Farbe 20 ist `i + 16` mit `i = 4`, Rot ist 4 · 8 + 128 =
      160, Grün 4 · 8 = 32, Blau 0. Ein dunkles Rot mit einem Hauch Grün auf
      dem Weg zu Orange.

  - id: abschnitt-3
    title: Orange bis Gelb
    prompt: |
      Schreib in `fire.rb` die Zeile für die Farben 32 bis 47 und speichere.
      Führst du das Programm danach aus, reicht der Verlauf von Schwarz über
      Rot und Orange bis Gelb.
    file: fire.rb
    check:
      type: files
      path: fire.rb
      expect:
        format: text
        contains:
          - { pattern: 'set_palette\s*\(\s*(?:i\s*\+\s*32|32\s*\+\s*i)\s*,', say: 'In `fire.rb` finde ich noch keine Zeile für die Farben 32 bis 47. Sie beginnt wie die anderen: `set_palette(i + 32, …`.' }
          - { pattern: 'set_palette\s*\(\s*(?:i\s*\+\s*32|32\s*\+\s*i)\s*,\s*255\s*,\s*(?:(?:i\s*\*\s*8|8\s*\*\s*i)\s*\+\s*128|128\s*\+\s*(?:i\s*\*\s*8|8\s*\*\s*i))\s*,\s*(?:i\s*\*\s*8|8\s*\*\s*i)\s*\)', say: 'Die Zeile mit `i + 32` ist da, aber ein Farbwert stimmt noch nicht. Rot bleibt bei 255. Grün fängt bei 128 an und wächst, Blau fängt bei 0 an und wächst. Ein Kanal, der wächst, ist `i * 8` plus der Wert, mit dem er anfängt.' }
    feedback:
      - when: { problem: missing }
        say: 'Ich finde `/workspace/fire.rb` nicht. Hast du die Datei unter dem Namen `fire.rb` gespeichert, ohne geöffneten Ordner?'

  - id: abschnitt-4
    title: Gelb bis Weiß
    prompt: |
      Schreib in `fire.rb` die Zeile für die Farben 48 bis 63 und speichere.
      Führst du das Programm danach aus, endet der Verlauf rechts in Weiß.
    file: fire.rb
    check:
      type: files
      path: fire.rb
      expect:
        format: text
        contains:
          - { pattern: 'set_palette\s*\(\s*(?:i\s*\+\s*48|48\s*\+\s*i)\s*,', say: 'In `fire.rb` finde ich noch keine Zeile für die Farben 48 bis 63. Sie beginnt wie die anderen: `set_palette(i + 48, …`.' }
          - { pattern: 'set_palette\s*\(\s*(?:i\s*\+\s*48|48\s*\+\s*i)\s*,\s*255\s*,\s*255\s*,\s*(?:(?:i\s*\*\s*8|8\s*\*\s*i)\s*\+\s*128|128\s*\+\s*(?:i\s*\*\s*8|8\s*\*\s*i))\s*\)', say: 'Die Zeile mit `i + 48` ist da, aber ein Farbwert stimmt noch nicht. Rot und Grün bleiben bei 255. Blau fängt bei 128 an und wächst.' }
    feedback:
      - when: { problem: missing }
        say: 'Ich finde `/workspace/fire.rb` nicht. Hast du die Datei unter dem Namen `fire.rb` gespeichert, ohne geöffneten Ordner?'

  - id: blau-63
    title: Ganz genau Weiß?
    prompt: |
      Welchen Blauwert hat die letzte Farbe des Verlaufs, Nummer 63, ganz genau?
    check:
      type: number
      expect: 248
      tolerance: 0
    feedback:
      - when: { equals: 255 }
        say: 'So steht es im Text, aber rechne es nach: Welchen Wert hat `i` bei Farbe 63, und was ergibt dann `i * 8 + 128`?'
      - when: { equals: 632 }
        say: '`i` ist nicht 63: `set_palette(i + 48, …)` setzt die Farbe `i + 48`.'
    hint: Farbe 63 ist `i + 48`. Wie groß ist `i` dann, und läuft die Schleife bis dorthin?
    solution: |
      248: Farbe 63 ist `i + 48` mit `i = 15`, und 15 · 8 + 128 = 248. Die
      Schleife `(0...16)` hört bei 15 auf, deshalb erreicht keiner der vier
      Abschnitte ganz sein Ziel. Das letzte Weiß ist (255, 255, 248); den
      Unterschied sieht man nicht.

  - id: kernel-anwenden
    title: Der Kernel in zwei Schleifen
    prompt: |
      Schreib in `fire.rb` die beiden Schleifen mit dem Kernel und speichere.
      Führst du das Programm danach aus, steigt nach einer kleinen Weile vom
      hellen Rechteck ein weicher Verlauf nach oben.
    file: fire.rb
    check:
      type: files
      path: fire.rb
      expect:
        format: text
        contains:
          - { pattern: '\(\s*0\s*\.\.\.\s*128\s*\)|\(\s*0\s*\.\.\s*127\s*\)|\b128\.times\b|\b0\.upto\s*\(\s*127\s*\)', say: 'In `fire.rb` finde ich noch keine Schleife für `y` von 0 bis 127, etwa `(0...128).each do |y|`.' }
          - { pattern: '\(\s*0\s*\.\.\.\s*256\s*\)|\(\s*0\s*\.\.\s*255\s*\)|\b256\.times\b|\b0\.upto\s*\(\s*255\s*\)', say: 'In `fire.rb` finde ich noch keine Schleife für `x` von 0 bis 255, etwa `(0...256).each do |x|`.' }
          - { pattern: 'get_pixel\s*\(\s*x\s*,\s*y\s*\+\s*1\s*\)\s*\*\s*2\b|\b2\s*\*\s*get_pixel\s*\(\s*x\s*,\s*y\s*\+\s*1\s*\)|get_pixel\s*\(\s*x\s*,\s*y\s*\+\s*1\s*\).*get_pixel\s*\(\s*x\s*,\s*y\s*\+\s*1\s*\)', say: 'Das Pixel darunter, `get_pixel(x, y + 1)`, zählt noch nicht doppelt.' }
          - { pattern: 'get_pixel\s*\(\s*x\s*-\s*1\s*,\s*y\s*\)', say: 'Noch fehlt das linke Pixel. Es liegt in derselben Zeile, ein Pixel weiter links.' }
          - { pattern: 'get_pixel\s*\(\s*x\s*\+\s*1\s*,\s*y\s*\)', say: 'Noch fehlt das rechte Pixel. Es liegt in derselben Zeile, ein Pixel weiter rechts.' }
          - { pattern: '/=?\s*4(?![\d.])', say: 'Die Summe wird noch nicht durch 4 geteilt.' }
          - { pattern: 'set_pixel\s*\(\s*x\s*,\s*y\s*,\s*c\s*\)', say: 'Noch bekommt das Pixel die neue Farbe nicht: `set_pixel(x, y, c)`.' }
    feedback:
      - when: { problem: missing }
        say: 'Ich finde `/workspace/fire.rb` nicht. Hast du die Datei unter dem Namen `fire.rb` gespeichert, ohne geöffneten Ordner?'

  - id: kernel
    title: Ein Pixel mit dem Kernel
    prompt: |
      Unter einem Pixel steht Farbe 40, links von ihm 20 und rechts 30. Welche
      Farbe bekommt es, ohne Zufall?
    check:
      type: number
      expect: 32
      tolerance: 0
    feedback:
      - when: { between: [32.4, 32.6] }
        say: '`c` ist eine ganze Zahl. Was macht `c /= 4` mit dem Rest?'
      - when: { between: [22, 23] }
        say: 'Der Pixel darunter zählt doppelt: `get_pixel(x, y + 1) * 2`.'
      - when: { equals: 30 }
        say: 'Das ist der Mittelwert der drei. Der Kernel zählt aber das untere Pixel doppelt und teilt durch 4.'
    hint: 'Zähle 2 · 40 + 20 + 30 zusammen und teile durch 4, so wie Ruby mit ganzen Zahlen teilt.'
    solution: |
      32: 2 · 40 + 20 + 30 = 130, und 130 / 4 ist in Ruby 32, der Rest fällt
      weg. Das Pixel wird etwas kühler als das darunter: So steigt die Hitze
      und kühlt dabei ab.

  - id: begrenzen
    title: Falsche Farben
    prompt: |
      In den hellen und den dunklen Bereichen tauchen Farben auf, die nicht
      zum Feuer passen. Woran liegt das?
    check:
      type: choice
      options:
        - '`c` gerät durch den Zufall unter 0 oder über 63, und solche Nummern gehören nicht zum Farbverlauf.'
        - '`rand(7)` liefert manchmal Kommazahlen, und die sind keine Farbnummern.'
        - 'Der Kernel teilt durch 4, obwohl er nur drei Pixel ansieht.'
        - 'Zwischen den vier Abschnitten der Palette fehlen Farben.'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: '`rand(7)` liefert ganze Zahlen von 0 bis 6. Was wird aus einem schwarzen Pixel (0), wenn `rand(7) - 3` gerade −3 ergibt?'
      - when: { picked: 2 }
        say: 'Das untere Pixel zählt doppelt, also sind es vier Anteile. Vorher, ohne Zufall, sah alles richtig aus. Was ist seitdem dazugekommen?'
      - when: { picked: 3 }
        say: 'Die vier Abschnitte belegen die Farben 0 bis 63 lückenlos. Welche Nummern kann `c` mit dem Zufall bekommen?'
    solution: |
      Mit `rand(7) - 3` wird aus einem schwarzen Pixel (0) schnell −3 und aus
      einem weißen (63) 66. Diese Nummern hat der Verlauf nicht festgelegt; dort
      stehen andere Farben der Palette. `clamp(0, 63)` hält `c` im Verlauf.

  - id: feuer
    title: Das Feuer brennt
    prompt: |
      In `fire.rb` stehen der Kernel, der Zufall nur für Pixel, die nicht
      schwarz sind, und die Grenzen 0 bis 63. Das Feuer lodert.
    file: fire.rb
    check:
      type: files
      path: fire.rb
      expect:
        format: text
        contains:
          # das untere Pixel doppelt: »… * 2«, »2 * …« oder zweimal in einer Zeile
          - { pattern: 'get_pixel\s*\(\s*x\s*,\s*y\s*\+\s*1\s*\)\s*\*\s*2\b|\b2\s*\*\s*get_pixel\s*\(\s*x\s*,\s*y\s*\+\s*1\s*\)|get_pixel\s*\(\s*x\s*,\s*y\s*\+\s*1\s*\).*get_pixel\s*\(\s*x\s*,\s*y\s*\+\s*1\s*\)', say: 'In `fire.rb` finde ich den Kernel noch nicht: das Pixel darunter, `get_pixel(x, y + 1)`, doppelt gezählt, etwa mit `c = get_pixel(x, y + 1) * 2`.' }
          - { pattern: 'clamp\s*\(\s*0\s*,\s*63\s*\)', say: 'Noch hält nichts `c` zwischen 0 und 63: `c = c.clamp(0, 63)` vor `set_pixel`.' }
          - { pattern: 'rand\s*\(.*\bif\s+c\s*>\s*0', say: 'Der Zufall kommt noch auch zu schwarzen Pixeln dazu, und die ganze Luft glüht. Häng `if c > 0` an die Zeile mit `rand`.' }
    feedback:
      - when: { problem: missing }
        say: 'Ich finde `/workspace/fire.rb` nicht. Hast du die Datei unter dem Namen `fire.rb` gespeichert, ohne geöffneten Ordner?'

  - id: kaelter
    title: Ein wenig kälter
    prediction: true
    prompt: |
      Was passiert mit dem Feuer, wenn du `rand(7) - 3` in `rand(7) - 4`
      änderst? Überleg erst, dann probier es aus.
    check:
      type: choice
      options:
        - Die Flammen werden deutlich niedriger.
        - Die Flammen schlagen höher.
        - Nichts Sichtbares, Zufall bleibt Zufall.
        - Das ganze Bild wird nach und nach weiß.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: 'Welche Werte liefert `rand(7) - 4`, von wo bis wo? Kommt im Mittel etwas dazu oder geht etwas weg? Probier es aus.'
      - when: { picked: 2 }
        say: 'Bisher liegt der Zufall im Mittel bei 0. Wo liegt `rand(7) - 4` im Mittel? Probier es aus.'
      - when: { picked: 3 }
        say: 'Weiß wird es, wenn die Pixel im Mittel heißer werden. `rand(7) - 4` liefert −4 bis +2. Probier es aus.'
    solution: |
      Die Flammen werden viel niedriger. `rand(7) - 4` liefert −4 bis +2, im
      Mittel −1: Jedes Pixel kühlt in jedem Bild ein wenig mehr ab, und das
      summiert sich auf dem Weg nach oben. Mit `rand(7) - 2` füllt das Feuer
      dagegen bald das ganze Bild.

  - id: blaues-feuer
    title: Warum blau?
    prompt: |
      Du vertauschst in den vier `set_palette`-Zeilen Rot und Blau, und das
      Feuer brennt blau. Die Flammen bewegen sich aber genau wie vorher.
      Warum?
    check:
      type: choice
      options:
        - Die Animation rechnet nur mit den Nummern der Farben. Welche Farbe zu einer Nummer gehört, steht allein in der Palette.
        - Pixelflow Canvas vertauscht Rot und Blau erst beim Anzeigen.
        - Der Kernel rechnet jetzt mit den Blauwerten statt mit den Rotwerten.
        - Blaues Feuer ist heißer, darum steigen die Flammen anders auf.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: 'Pixelflow Canvas zeigt jede Nummer in der Farbe, die `set_palette` ihr gibt. Wer hat hier Rot und Blau vertauscht?'
      - when: { picked: 2 }
        say: 'Schau dir an, was `get_pixel` zurückgibt: einen Farbwert oder eine Nummer von 0 bis 63?'
      - when: { picked: 3 }
        say: 'Bewegen sich die Flammen denn anders? Der Kernel weiß nichts von Rot oder Blau, er rechnet mit Nummern.'
    solution: |
      `get_pixel` und `set_pixel` arbeiten mit Nummern von 0 bis 63, und der
      Kernel rechnet nur mit diesen Nummern. Welche Farbe Nummer 63 auf dem
      Bildschirm hat, legt allein `set_palette` fest. Tauschst du dort Rot und
      Blau, laufen dieselben Nummern durch dieselbe Animation, nur in anderen
      Farben.

  - id: wind
    title: Wind von links
    prompt: |
      Ändere in `wind.rb` den Kernel so, dass die Flammen nach rechts wehen,
      als käme der Wind von links, und speichere.
    file: wind.rb
    check:
      type: files
      path: wind.rb
      expect:
        format: text
        contains:
          - { pattern: '\A(?![\s\S]*get_pixel\s*\(\s*x\s*\+\s*\d+\s*,\s*y\s*\+\s*1\s*\))', say: 'In `wind.rb` kommt die Wärme jetzt von rechts unten, `get_pixel(x + 1, y + 1)`, und die Flammen wehen nach links. Der Wind soll von links kommen.' }
          - { pattern: 'get_pixel\s*\(\s*x\s*-\s*\d+\s*,\s*y\s*\+\s*1\s*\)', say: 'In `wind.rb` kommt die Wärme noch von direkt darunter. Nimm statt `get_pixel(x, y + 1)` das Pixel links darunter.' }
    feedback:
      - when: { problem: missing }
        say: 'Ich finde `/workspace/wind.rb` nicht. Hast du `fire.rb` nach `wind.rb` kopiert, etwa mit `cp fire.rb wind.rb`?'

  - id: quadrat
    title: Ein Quadrat, das sich dreht
    extra: true
    prompt: |
      Zeichne in `fire.rb` das Quadrat, das sich dreht, und speichere. Führst
      du das Programm danach aus, dreht sich ein weißes Quadrat langsam im
      Uhrzeigersinn, und aus ihm schlagen Flammen nach oben.
    file: fire.rb
    check:
      type: files
      path: fire.rb
      expect:
        format: text
        contains:
          - { pattern: '\bdraw_line\s*\(', say: 'In `fire.rb` zeichnet noch nichts die Seiten des Quadrats: `draw_line` verbindet zwei Ecken.' }
          - { pattern: 'Math\.cos\s*\(', say: 'Für die x-Koordinate der Ecken fehlt noch `Math.cos`.' }
          - { pattern: 'Math\.sin\s*\(', say: 'Für die y-Koordinate der Ecken fehlt noch `Math.sin`.' }
          - { pattern: '\b128\s*\+\s*30\s*\*|30\s*\*\s*Math\.cos\s*\([^)]*\)\s*\+\s*128\b', say: 'Die Ecken liegen noch nicht auf dem Kreis um die Mitte (128, 80) mit dem Radius 30: x ist 128 plus 30 mal der Kosinus.' }
          - { pattern: '\b80\s*\+\s*30\s*\*|30\s*\*\s*Math\.sin\s*\([^)]*\)\s*\+\s*80\b', say: 'Die Ecken liegen noch nicht auf dem Kreis um die Mitte (128, 80) mit dem Radius 30: y ist 80 plus 30 mal der Sinus.' }
          - { pattern: 'Math::PI\s*(?:/\s*2(?:\.0*)?(?![\d.])|\*\s*0?\.50*(?!\d))|\b0?\.50*\s*\*\s*Math::PI|Math::PI\s*\*\s*\w+\s*/\s*2(?:\.0*)?(?![\d.])|2\s*\*\s*Math::PI\s*(?:\*\s*\w+\s*)?/\s*4', say: 'Die Ecken liegen noch nicht je eine Vierteldrehung auseinander. Ruby rechnet Winkel nicht in Grad: Eine Vierteldrehung ist `Math::PI / 2`.' }
          - { pattern: '\bset_color\s*\(\s*63\s*\)', say: 'Das Quadrat braucht die Farbe 63, die heißeste: `set_color(63)` vor `draw_line`.' }
          - { pattern: '\bangle\s*\+=\s*0?\.03(?!\d)|\bangle\s*=\s*angle\s*\+\s*0?\.03(?!\d)', say: '`angle` wächst noch nicht um 0.03, und ohne das dreht sich das Quadrat nicht.' }
    feedback:
      - when: { problem: missing }
        say: 'Ich finde `/workspace/fire.rb` nicht. Hast du die Datei unter dem Namen `fire.rb` gespeichert, ohne geöffneten Ordner?'
