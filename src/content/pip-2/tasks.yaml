  - id: stairs
    title: "Die Treppe"
    level: 3
    prompt: |
      Eine Treppe nach oben: eine Stufe, dann zwei, drei und vier, jede so hoch wie breit. Deine Zaubersprüche stehen schon da; der Plan darunter braucht nur noch eine Schleife.
    starter: |
      def turn_right
        3.times do
          turn_left
        end
      end

      def walk(n)
        n.times do
          move
        end
      end

      # Die Treppe
    check:
      type: pip
      language: ruby
      commands: [move, turn_left]
      max_lines: 18
      maps:
        - facing: east
          map: |
            #############
            ###########L#
            ###########.#
            ###########.#
            ###########.#
            #######.....#
            #######.#####
            #######.#####
            ####....#####
            ####.########
            ##...########
            #P.##########
            #############
      goal: { lamp: true }
    hint: |
      Jede Stufe ist: `n` Felder geradeaus, links hoch, `n` Felder, rechts wieder in die alte Richtung. `n` zählt von 1 bis 4.
    solution: |
      ```ruby
      def turn_right
        3.times do
          turn_left
        end
      end

      def walk(n)
        n.times do
          move
        end
      end

      (1..4).each do |n|
        walk(n)
        turn_left
        walk(n)
        turn_right
      end
      ```
