  - id: walk
    title: "Ein Spruch mit Zahl"
    level: 2
    prompt: |
      `walk(n)` lässt Pip `n` Felder vorwärts gehen: `walk(3)` drei, `walk(5)` fünf. `n` ist ein Parameter: Beim Aufruf steht dort eine Zahl, und im Zauberspruch hat `n` diesen Wert. Du schreibst nur den Spruch; die Prüfung ruft ihn auf drei Karten auf, mit `walk(3)`, `walk(5)` und `walk(1)`, und jeder Gang ist genau so lang, wie Pip gehen soll.
    starter: |
      def walk(n)
        # n Felder vorwärts
      end
    check:
      type: pip
      language: ruby
      commands: [move, turn_left]
      maps:
        - facing: east
          call: "walk(3)"
          expect: { moves: 3 }
          map: |
            ######
            #P...#
            ######
        - facing: south
          call: "walk(5)"
          expect: { moves: 5 }
          map: |
            ###
            #P#
            #.#
            #.#
            #.#
            #.#
            #.#
            ###
        - facing: west
          call: "walk(1)"
          expect: { moves: 1 }
          map: |
            ####
            #.P#
            ####
    hint: "Eine Schleife, die so oft läuft, wie `n` groß ist."
    solution: |
      ```ruby
      def walk(n)
        n.times do
          move
        end
      end
      ```
