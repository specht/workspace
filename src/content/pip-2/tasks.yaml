  - id: hand-on-wall
    title: "Die Hand an der Wand"
    level: 2
    prompt: |
      Ein kleines Labyrinth. Der Trick des Wichtels: Pip legt die linke Hand an die Wand und nimmt sie nie weg. Bei jedem Schritt dreht sich Pip erst nach links und dann nach rechts, bis vorn frei ist.
    starter: |
      def turn_right
        3.times do
          turn_left
        end
      end

      # Die Hand an der Wand
    check:
      type: pip
      language: ruby
      commands: [move, turn_left, front_clear, on_lamp]
      maps:
        - facing: south
          map: |
            #########
            #P#.....#
            #.#.###.#
            #.#...#.#
            #.###.#.#
            #.....#L#
            #########
      goal: { lamp: true }
    hint: |
      In der Schleife: einmal `turn_left`, dann `turn_right`, solange vorn kein Weg ist, dann ein Schritt.
    solution: |
      ```ruby
      def turn_right
        3.times do
