  - id: turn-right
    title: "Rechtsherum"
    level: 1
    prompt: |
      Schreib den Zauberspruch `turn_right`: Pip dreht sich eine Vierteldrehung nach rechts. Die Prüfung stellt Pip auf zwei Karten und ruft `turn_right` auf.
    starter: |
      def turn_right
        # drei Vierteldrehungen nach links
      end
    check:
      type: pip
      language: ruby
      commands: [move, turn_left]
      maps:
        - facing: east
          call: "turn_right"
          expect: { facing: south, moves: 0 }
          map: |
            #####
            #...#
            #.P.#
            #...#
            #####
        - facing: north
          call: "turn_right"
          expect: { facing: east, moves: 0 }
          map: |
            #####
            #...#
            #.P.#
            #...#
            #####
    hint: "Was im Schacht drei Zeilen waren, steht jetzt im Zauberspruch."
    solution: |
      ```ruby
      def turn_right
        3.times do
          turn_left
        end
      end
      ```
    python:
      prompt: |
        Schreib den Zauberspruch `turn_right()`: Pip dreht sich eine Vierteldrehung nach rechts. Die Prüfung stellt Pip auf zwei Karten und ruft `turn_right()` auf.
      starter: |
        def turn_right():
            # drei Vierteldrehungen nach links
            pass
      check:
        type: pip
        language: python
        commands: [move, turn_left]
        maps:
          - facing: east
            call: "turn_right()"
            expect: { facing: south, moves: 0 }
            map: |
              #####
              #...#
              #.P.#
              #...#
              #####
          - facing: north
            call: "turn_right()"
            expect: { facing: east, moves: 0 }
            map: |
              #####
              #...#
              #.P.#
              #...#
              #####
      hint: "Was im Schacht drei Zeilen waren, steht jetzt im Zauberspruch."
      solution: |
        ```python
        def turn_right():
            for i in range(3):
                turn_left()
        ```
    javascript:
      prompt: |
        Schreib den Zauberspruch `turnRight()`: Pip dreht sich eine Vierteldrehung nach rechts. Die Prüfung stellt Pip auf zwei Karten und ruft `turnRight()` auf.
      starter: |
        function turnRight() {
          // drei Vierteldrehungen nach links
        }
      check:
        type: pip
        language: javascript
        commands: [move, turn_left]
        maps:
          - facing: east
            call: "turnRight();"
            expect: { facing: south, moves: 0 }
            map: |
              #####
              #...#
              #.P.#
              #...#
              #####
          - facing: north
            call: "turnRight();"
            expect: { facing: east, moves: 0 }
            map: |
              #####
              #...#
              #.P.#
              #...#
              #####
      hint: "Was im Schacht drei Zeilen waren, steht jetzt im Zauberspruch."
      solution: |
        ```javascript
        function turnRight() {
          for (let i = 0; i < 3; i++) {
            turnLeft();
          }
        }
        ```
    dart:
      prompt: 'Schreib den Zauberspruch `turnRight()`: Pip dreht sich eine Vierteldrehung
        nach rechts. Die Prüfung stellt Pip auf zwei Karten und ruft `turnRight()` auf.

        '
      starter: |
        void turnRight() {
          // drei Vierteldrehungen nach links
        }
