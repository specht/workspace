  - id: dark-tunnel
    title: "Bis zur Wand"
    level: 1
    prompt: |
      Drei Stollen, alle verschieden lang. Pip geht mit `while` vorwärts, solange vorn frei ist: `front_clear?` sagt es.
    starter: |
      # Dein Plan
    check:
      type: pip
      language: ruby
      commands: [move, turn_left, front_clear]
      maps:
        - facing: east
          map: |
            #######
            #P...L#
            #######
        - facing: east
          map: |
            ############
            #P........L#
            ############
        - facing: east
          map: |
            #####
            #P.L#
            #####
      goal: { lamp: true }
    hint: |
      Was in der Schleife steht, macht Pip, solange die Frage `front_clear?` mit Ja beantwortet wird. In der Schleife reicht ein Schritt.
    solution: |
      ```ruby
      while front_clear?
        move
      end
      ```
