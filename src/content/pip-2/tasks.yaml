  - id: winding
    title: "Um die Ecken"
    level: 3
    prompt: |
      Diese Stollen biegen mal nach links, mal nach rechts ab. Pip geht, bis `on_lamp?` wahr ist: geradeaus, solange es geht, und an einer Wand dorthin, wo es weitergeht.
    starter: |
      # Dein Plan
    check:
      type: pip
      language: ruby
      commands: [move, turn_left, front_clear, on_lamp]
      maps:
        - facing: east
          map: |
            ##########
            #P..######
            ###.######
            ###....###
            ######.###
            ######..L#
            ##########
        - facing: east
          map: |
            #########
            #####L..#
            #######.#
            #P......#
            #########
        - facing: east
          map: |
            ###########
            #P.#######
            ##.#######
            ##....####
            #####.####
            ##L...####
            ###########
      goal: { lamp: true }
    hint: |
      An der Wand dreht sich Pip erst nach links. Ist dort auch Wand, geht es rechts weiter: von links aus noch zwei Vierteldrehungen.
    solution: |
      ```ruby
      until on_lamp?
        if front_clear?
          move
        else
          turn_left
          unless front_clear?
            turn_left
            turn_left
          end
        end
      end
      ```
    python:
      prompt: |
        Diese Stollen biegen mal nach links, mal nach rechts ab. Pip geht, bis `on_lamp()` wahr ist: geradeaus, solange es geht, und an einer Wand dorthin, wo es weitergeht.
      starter: |
        # Dein Plan
      check:
        type: pip
        language: python
        commands: [move, turn_left, front_clear, on_lamp]
        maps:
          - facing: east
            map: |
              ##########
              #P..######
              ###.######
              ###....###
              ######.###
              ######..L#
              ##########
          - facing: east
            map: |
              #########
              #####L..#
              #######.#
              #P......#
              #########
          - facing: east
            map: |
              ###########
              #P.#######
              ##.#######
              ##....####
              #####.####
              ##L...####
              ###########
        goal: { lamp: true }
      hint: |
        An der Wand dreht sich Pip erst nach links. Ist dort auch Wand, geht es rechts weiter: von links aus noch zwei Vierteldrehungen.
      solution: |
        ```python
        while not on_lamp():
            if front_clear():
                move()
            else:
                turn_left()
                if not front_clear():
                    turn_left()
                    turn_left()
        ```
    javascript:
      prompt: |
        Diese Stollen biegen mal nach links, mal nach rechts ab. Pip geht, bis `onLamp()` wahr ist: geradeaus, solange es geht, und an einer Wand dorthin, wo es weitergeht.
      starter: |
        // Dein Plan
      check:
        type: pip
        language: javascript
        commands: [move, turn_left, front_clear, on_lamp]
        maps:
          - facing: east
            map: |
              ##########
              #P..######
              ###.######
              ###....###
              ######.###
              ######..L#
              ##########
          - facing: east
            map: |
              #########
              #####L..#
              #######.#
              #P......#
              #########
          - facing: east
            map: |
              ###########
              #P.#######
              ##.#######
              ##....####
              #####.####
              ##L...####
              ###########
        goal: { lamp: true }
      hint: |
        An der Wand dreht sich Pip erst nach links. Ist dort auch Wand, geht es rechts weiter: von links aus noch zwei Vierteldrehungen.
      solution: |
        ```javascript
        while (!onLamp()) {
          if (frontClear()) {
            move();
          } else {
            turnLeft();
            if (!frontClear()) {
              turnLeft();
              turnLeft();
            }
          }
        }
        ```

  - id: turn-right
    title: "Rechtsherum"
    level: 1
    prompt: |
      Schreib den Zauberspruch `turn_right`: Pip dreht sich eine Vierteldrehung nach rechts. Die Prüfung stellt Pip auf zwei Karten und ruft `turn_right` auf.
    starter: |
      def turn_right
        # drei Vierteldrehungen nach links
      end
    check:
      type: pip
      language: ruby
      commands: [move, turn_left]
      maps:
        - facing: east
          call: "turn_right"
          expect: { facing: south, moves: 0 }
          map: |
            #####
            #...#
            #.P.#
            #...#
            #####
        - facing: north
          call: "turn_right"
          expect: { facing: east, moves: 0 }
          map: |
            #####
            #...#
            #.P.#
            #...#
            #####
    hint: "Was im Schacht drei Zeilen waren, steht jetzt im Zauberspruch."
    solution: |
      ```ruby
      def turn_right
        3.times do
          turn_left
        end
      end
      ```
    python:
      prompt: |
        Schreib den Zauberspruch `turn_right()`: Pip dreht sich eine Vierteldrehung nach rechts. Die Prüfung stellt Pip auf zwei Karten und ruft `turn_right()` auf.
      starter: |
        def turn_right():
            # drei Vierteldrehungen nach links
            pass
      check:
        type: pip
        language: python
        commands: [move, turn_left]
        maps:
          - facing: east
            call: "turn_right()"
            expect: { facing: south, moves: 0 }
            map: |
              #####
              #...#
              #.P.#
              #...#
              #####
          - facing: north
            call: "turn_right()"
            expect: { facing: east, moves: 0 }
            map: |
              #####
              #...#
              #.P.#
              #...#
              #####
      hint: "Was im Schacht drei Zeilen waren, steht jetzt im Zauberspruch."
      solution: |
        ```python
        def turn_right():
            for i in range(3):
                turn_left()
        ```
    javascript:
      prompt: |
        Schreib den Zauberspruch `turnRight()`: Pip dreht sich eine Vierteldrehung nach rechts. Die Prüfung stellt Pip auf zwei Karten und ruft `turnRight()` auf.
      starter: |
        function turnRight() {
          // drei Vierteldrehungen nach links
        }
      check:
        type: pip
        language: javascript
        commands: [move, turn_left]
        maps:
          - facing: east
            call: "turnRight();"
            expect: { facing: south, moves: 0 }
            map: |
              #####
              #...#
              #.P.#
              #...#
              #####
          - facing: north
            call: "turnRight();"
            expect: { facing: east, moves: 0 }
            map: |
              #####
              #...#
              #.P.#
              #...#
              #####
      hint: "Was im Schacht drei Zeilen waren, steht jetzt im Zauberspruch."
      solution: |
        ```javascript
        function turnRight() {
          for (let i = 0; i < 3; i++) {
            turnLeft();
          }
        }
        ```

