# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
# Der Startcode jeder Kata muss von selbst scheitern; das prüft der Test ohne Beispiel.
format: 1
activity: pip-2
examples:
  dark-tunnel:
    pass:
      - answer: "while front_clear?\n  move\nend\n"
    fail:
      - answer: "4.times do\n  move\nend\n"
        say: "In Karte 2"
    python:
      pass:
        - answer: "while front_clear():\n    move()\n"
      fail:
        - answer: "for i in range(4):\n    move()\n"
          say: "In Karte 2"
    javascript:
      pass:
        - answer: "while (frontClear()) {\n  move();\n}\n"
      fail:
        - answer: "for (let i = 0; i < 4; i++) {\n  move();\n}\n"
          say: "In Karte 2"
  dark-stones:
    pass:
      - answer: "while front_clear?\n  move\n  take if on_stone?\nend\n"
    fail:
      - answer: "while front_clear?\n  move\nend\n"
        say: "Funkenstein"
    python:
      pass:
        - answer: "while front_clear():\n    move()\n    if on_stone():\n        take()\n"
      fail:
        - answer: "while front_clear():\n    move()\n"
          say: "Funkenstein"
    javascript:
      pass:
        - answer: "while (frontClear()) {\n  move();\n  if (onStone()) {\n    take();\n  }\n}\n"
      fail:
        - answer: "while (frontClear()) {\n  move();\n}\n"
          say: "Funkenstein"
  winding:
