# Aufgaben zu »Nächste Nachbarn: Wer entscheidet hier?«, in Ruby und, unter
# python:, in Python. Format: docs/aufgaben.md. Alles liegt in
# /workspace/nachbarn. Die Zahlen gehören zu penguins.csv und customers.csv
# in src/static/naechste-nachbarn (customers.csv erzeugt
# src/scripts/collect-naechste-nachbarn mit festem Seed), mit jedem zweiten
# Pinguin und jeder zweiten Kundin oder jedem zweiten Kunden als Beispiel,
# den anderen als Test, in der Reihenfolge der Datei.
format: 1
activity: naechste-nachbarn
tasks:
  - id: abstand-von-hand
    title: Von Hand gemessen
    prompt: |
      Ein Pinguin hat einen Schnabel, der 39 mm lang und 18 mm hoch ist, ein
      anderer einen, der 42 mm lang und 14 mm hoch ist. Wie weit liegen die
      beiden Punkte auseinander?
    check: { type: number, expect: 5 }
    feedback:
      - when: { equals: 7 }
        say: Das ist die Summe der beiden Unterschiede, 3 und 4. Der Abstand ist die Hypotenuse, nicht der Weg über die Katheten.
      - when: { equals: 25 }
        say: Das ist die Summe der Quadrate; die Wurzel fehlt noch.
    hint: |
      Die Unterschiede sind 3 und 4. Quadriere sie, addiere, zieh die Wurzel.
    solution: |
      Die Unterschiede sind 42 − 39 = 3 und 14 − 18 = −4; $\sqrt{9 + 16} = 5$.

  - id: abstand
    title: Der Abstand
    prompt: |
      Schreib in `nachbarn/knn.rb` die Funktion `distance(a, b)`. Die Prüfung
      ruft sie mit zwei und mit drei Merkmalen auf.
    check:
      type: ruby
      file: nachbarn/knn.rb
      cases:
        - call: 'distance([39, 18], [42, 14])'
          expect: 5.0
        - call: 'distance([42, 14], [39, 18])'
          expect: 5.0
          say: Der Abstand von b zu a ist derselbe wie von a zu b; ein negativer Unterschied wird durch das Quadrat positiv.
        - call: 'distance([0, 0, 0], [2, 3, 6])'
          expect: 7.0
          say: Mit drei Merkmalen zählt auch das dritte; geh alle durch, nicht nur zwei.
        - call: 'distance([1.5, 2.5], [1.5, 2.5])'
          expect: 0.0
    solution: |
      ```ruby
      def distance(a, b)
        sum = 0.0
        a.each_index do |i|
          sum += (a[i] - b[i])**2
        end
        Math.sqrt(sum)
      end
      ```
    python:
      prompt: |
        Schreib in `nachbarn/knn.py` die Funktion `distance(a, b)`. Die Prüfung
        ruft sie mit zwei und mit drei Merkmalen auf.
      check:
        type: python
        file: nachbarn/knn.py
        cases:
          - call: 'distance([39, 18], [42, 14])'
            expect: 5.0
          - call: 'distance([42, 14], [39, 18])'
            expect: 5.0
            say: Der Abstand von b zu a ist derselbe wie von a zu b; ein negativer Unterschied wird durch das Quadrat positiv.
          - call: 'distance([0, 0, 0], [2, 3, 6])'
            expect: 7.0
            say: Mit drei Merkmalen zählt auch das dritte; geh alle durch, nicht nur zwei.
          - call: 'distance([1.5, 2.5], [1.5, 2.5])'
            expect: 0.0
      solution: |
        ```python
        import math

        def distance(a, b):
            total = 0.0
            for i in range(len(a)):
                total += (a[i] - b[i]) ** 2
            return math.sqrt(total)
        ```

  - id: nachbarn
    title: Die nächsten Nachbarn
    prompt: |
      Schreib in `nachbarn/knn.rb` die Funktion `nearest(examples, features, k)`.
      Die Prüfung gibt ihr vier Beispiele und fragt nach den zwei, drei und
      einem nächsten.
    check:
      type: ruby
      file: nachbarn/knn.rb
      cases:
        - call: 'nearest([[[0, 0], "a"], [[5, 5], "b"], [[1, 1], "c"], [[2, 0], "d"]], [0, 0.8], 2)'
          expect: '[[[0, 0], "a"], [[1, 1], "c"]]'
          say: Die zwei nächsten zu (0, 0.8) sind a (Abstand 0.8) und c (etwa 1.02), das nächste zuerst.
        - call: 'nearest([[[0, 0], "a"], [[5, 5], "b"], [[1, 1], "c"], [[2, 0], "d"]], [0, 0.8], 3)'
          expect: '[[[0, 0], "a"], [[1, 1], "c"], [[2, 0], "d"]]'
          say: Es sollen genau k Beispiele sein, nach ihrem Abstand sortiert.
        - call: 'nearest([[[0, 0], "a"], [[5, 5], "b"], [[1, 1], "c"], [[2, 0], "d"]], [5, 4], 1)'
          expect: '[[[5, 5], "b"]]'
          say: Zurück kommt eine Liste von Beispielen, auch wenn k 1 ist, jedes mit seinen Merkmalen und seiner Antwort.
    solution: |
      ```ruby
      def nearest(examples, features, k)
        examples.sort_by { |other, _label| distance(other, features) }.first(k)
      end
      ```
    python:
      prompt: |
        Schreib in `nachbarn/knn.py` die Funktion `nearest(examples, features, k)`.
        Die Prüfung gibt ihr vier Beispiele und fragt nach den zwei, drei und
        einem nächsten.
      check:
        type: python
        file: nachbarn/knn.py
        cases:
          - call: 'nearest([[[0, 0], "a"], [[5, 5], "b"], [[1, 1], "c"], [[2, 0], "d"]], [0, 0.8], 2)'
            expect: '[[[0, 0], "a"], [[1, 1], "c"]]'
            say: Die zwei nächsten zu (0, 0.8) sind a (Abstand 0.8) und c (etwa 1.02), das nächste zuerst.
          - call: 'nearest([[[0, 0], "a"], [[5, 5], "b"], [[1, 1], "c"], [[2, 0], "d"]], [0, 0.8], 3)'
            expect: '[[[0, 0], "a"], [[1, 1], "c"], [[2, 0], "d"]]'
            say: Es sollen genau k Beispiele sein, nach ihrem Abstand sortiert.
          - call: 'nearest([[[0, 0], "a"], [[5, 5], "b"], [[1, 1], "c"], [[2, 0], "d"]], [5, 4], 1)'
            expect: '[[[5, 5], "b"]]'
            say: Zurück kommt eine Liste von Beispielen, auch wenn k 1 ist, jedes mit seinen Merkmalen und seiner Antwort.
      solution: |
        ```python
        def nearest(examples, features, k):
            return sorted(examples, key=lambda example: distance(example[0], features))[:k]
        ```

  - id: abstimmen
    title: Die Nachbarn stimmen ab
    prompt: |
      Schreib in `nachbarn/knn.rb` die Funktion `classify(examples, features, k)`.
      Die Prüfung gibt ihr fünf Beispiele, zwei »A« nahe bei (0, 0) und drei
      »B«, und fragt mit verschiedenen k, auch mit einem Gleichstand.
    check:
      type: ruby
      file: nachbarn/knn.rb
      cases:
        - call: 'classify([[[0, 0], "A"], [[1, 0], "A"], [[0, 1], "B"], [[5, 5], "B"], [[6, 5], "B"]], [0.1, 0.3], 3)'
          expect: '"A"'
          say: Die drei nächsten sind A, B und A; die Mehrheit ist A.
        - call: 'classify([[[0, 0], "A"], [[1, 0], "A"], [[0, 1], "B"], [[5, 5], "B"], [[6, 5], "B"]], [0.1, 0.3], 5)'
          expect: '"B"'
          say: Mit k = 5 stimmen alle ab, und B ist dreimal dabei. Zählt deine Funktion, statt nur den nächsten zu nehmen?
        - call: 'classify([[[0, 0], "A"], [[1, 0], "A"], [[0, 1], "B"], [[5, 5], "B"], [[6, 5], "B"]], [0.1, 0.9], 1)'
          expect: '"B"'
        - call: 'classify([[[0, 0], "A"], [[1, 0], "A"], [[0, 1], "B"], [[5, 5], "B"], [[6, 5], "B"]], [0.1, 0.3], 2)'
          expect: '"A"'
          say: Bei k = 2 steht es eins zu eins; dann gewinnt der nähere Nachbar, und das ist A.
    solution: |
      ```ruby
      def classify(examples, features, k)
        labels = nearest(examples, features, k).map { |_features, label| label }
        labels.max_by { |label| labels.count(label) }
      end
      ```
    python:
      prompt: |
        Schreib in `nachbarn/knn.py` die Funktion `classify(examples, features, k)`.
        Die Prüfung gibt ihr fünf Beispiele, zwei »A« nahe bei (0, 0) und drei
        »B«, und fragt mit verschiedenen k, auch mit einem Gleichstand.
      check:
        type: python
        file: nachbarn/knn.py
        cases:
          - call: 'classify([[[0, 0], "A"], [[1, 0], "A"], [[0, 1], "B"], [[5, 5], "B"], [[6, 5], "B"]], [0.1, 0.3], 3)'
            expect: "'A'"
            say: Die drei nächsten sind A, B und A; die Mehrheit ist A.
          - call: 'classify([[[0, 0], "A"], [[1, 0], "A"], [[0, 1], "B"], [[5, 5], "B"], [[6, 5], "B"]], [0.1, 0.3], 5)'
            expect: "'B'"
            say: Mit k = 5 stimmen alle ab, und B ist dreimal dabei. Zählt deine Funktion, statt nur den nächsten zu nehmen?
          - call: 'classify([[[0, 0], "A"], [[1, 0], "A"], [[0, 1], "B"], [[5, 5], "B"], [[6, 5], "B"]], [0.1, 0.9], 1)'
            expect: "'B'"
          - call: 'classify([[[0, 0], "A"], [[1, 0], "A"], [[0, 1], "B"], [[5, 5], "B"], [[6, 5], "B"]], [0.1, 0.3], 2)'
            expect: "'A'"
            say: Bei k = 2 steht es eins zu eins; dann gewinnt der nähere Nachbar, und das ist A.
      solution: |
        ```python
        def classify(examples, features, k):
            labels = [label for _features, label in nearest(examples, features, k)]
            return max(labels, key=labels.count)
        ```

