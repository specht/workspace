  - id: kaution-anteil
    title: Wie oft eine Kaution?
    prompt: |
      Schreib in `nachbarn/knn.rb` die Funktion
      `deposit_share(training, test, k)`. Die Prüfung gibt ihr vier
      Beispiele zum Vergleichen und Testbeispiele, deren Antworten nicht
      zählen.
    check:
      type: ruby
      file: nachbarn/knn.rb
      cases:
        - call: 'deposit_share([[[0, 0], 1], [[0, 1], 1], [[5, 5], 0], [[5, 6], 0]], [[[0.5, 0.5], 0], [[4, 4], 1], [[1, 0], 0], [[6, 6], 1]], 1)'
          expect: 0.5
          say: Für zwei der vier sagt classify 1, also 0.5. Zählt deine Funktion, wo classify 1 sagt, und nicht, wo es richtig liegt?
        - call: 'deposit_share([[[0, 0], 1], [[0, 1], 1], [[5, 5], 0], [[5, 6], 0]], [[[0.5, 0.5], 0]], 1)'
          expect: 1.0
          say: Die Antwort im Testbeispiel (hier 0) zählt nicht; es geht nur darum, was classify sagt.
    solution: |
      ```ruby
      def deposit_share(training, test, k)
        deposits = test.count { |features, _label| classify(training, features, k) == 1 }
        deposits.to_f / test.size
      end
      ```
    python:
      prompt: |
        Schreib in `nachbarn/knn.py` die Funktion
        `deposit_share(training, test, k)`. Die Prüfung gibt ihr vier
        Beispiele zum Vergleichen und Testbeispiele, deren Antworten nicht
        zählen.
      check:
        type: python
        file: nachbarn/knn.py
        cases:
          - call: 'deposit_share([[[0, 0], 1], [[0, 1], 1], [[5, 5], 0], [[5, 6], 0]], [[[0.5, 0.5], 0], [[4, 4], 1], [[1, 0], 0], [[6, 6], 1]], 1)'
            expect: 0.5
            say: Für zwei der vier sagt classify 1, also 0.5. Zählt deine Funktion, wo classify 1 sagt, und nicht, wo es richtig liegt?
          - call: 'deposit_share([[[0, 0], 1], [[0, 1], 1], [[5, 5], 0], [[5, 6], 0]], [[[0.5, 0.5], 0]], 1)'
            expect: 1.0
            say: Die Antwort im Testbeispiel (hier 0) zählt nicht; es geht nur darum, was classify sagt.
      solution: |
        ```python
        def deposit_share(training, test, k):
            deposits = sum(1 for features, _label in test if classify(training, features, k) == 1)
            return deposits / len(test)
        ```

