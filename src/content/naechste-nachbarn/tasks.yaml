  - id: genauigkeit
    title: Wie oft richtig?
    prompt: |
      Schreib in `nachbarn/knn.rb` die Funktion `accuracy(training, test, k)`.
      Die Prüfung gibt ihr vier Beispiele zum Vergleichen und vier
      Testbeispiele, von denen zwei richtig eingeordnet werden.
    check:
      type: ruby
      file: nachbarn/knn.rb
      cases:
        - call: 'accuracy([[[0, 0], "A"], [[0, 1], "A"], [[5, 5], "B"], [[5, 6], "B"]], [[[0.5, 0.5], "A"], [[4, 4], "B"], [[1, 0], "B"], [[6, 6], "A"]], 1)'
          expect: 0.5
          say: Zwei von vier sind richtig, also 0.5. Rechnet deine Funktion mit Kommazahlen? In Ruby ergibt 2 / 4 die ganze Zahl 0.
        - call: 'accuracy([[[0, 0], "A"], [[0, 1], "A"], [[5, 5], "B"], [[5, 6], "B"]], [[[0.5, 0.5], "A"], [[4, 4], "B"]], 1)'
          expect: 1.0
    solution: |
      ```ruby
      def accuracy(training, test, k)
        right = test.count { |features, label| classify(training, features, k) == label }
        right.to_f / test.size
      end
      ```
    python:
      prompt: |
        Schreib in `nachbarn/knn.py` die Funktion `accuracy(training, test, k)`.
        Die Prüfung gibt ihr vier Beispiele zum Vergleichen und vier
        Testbeispiele, von denen zwei richtig eingeordnet werden.
      check:
        type: python
        file: nachbarn/knn.py
        cases:
          - call: 'accuracy([[[0, 0], "A"], [[0, 1], "A"], [[5, 5], "B"], [[5, 6], "B"]], [[[0.5, 0.5], "A"], [[4, 4], "B"], [[1, 0], "B"], [[6, 6], "A"]], 1)'
            expect: 0.5
            say: Zwei von vier sind richtig, also 0.5.
          - call: 'accuracy([[[0, 0], "A"], [[0, 1], "A"], [[5, 5], "B"], [[5, 6], "B"]], [[[0.5, 0.5], "A"], [[4, 4], "B"]], 1)'
            expect: 1.0
      solution: |
        ```python
        def accuracy(training, test, k):
            right = sum(1 for features, label in test if classify(training, features, k) == label)
            return right / len(test)
        ```

