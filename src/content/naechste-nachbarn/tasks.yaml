  - id: verantwortung
    title: Wer entscheidet hier?
    prompt: |
      Der Laden will das Programm einsetzen. Was rätst du ihm? Geh dabei auf
      deine Zahlen ein und darauf, wer verantwortlich ist, wenn das Programm
      jemanden zu Unrecht eine Kaution zahlen lässt.
    check: { type: reflection, min_words: 30 }
    examples:
      - |
        Mit dem Wohnort verlangt das Programm von 84,7 % der Pünktlichen am
        Sandberg eine Kaution, weil der Laden dort früher öfter eine verlangt
        hat. Den Wohnort wegzulassen reicht nicht, die Entfernung verrät ihn
        auch. Besser wäre es, aus `on_time` zu lernen und vor dem Einsatz je
        Stadtteil nachzuzählen. Verantwortlich bleibt der Laden, nicht das
        Programm.
      - |
        Ich würde es nicht allein entscheiden lassen. Es macht nur nach, was
        der Laden früher gemacht hat, auch das Ungerechte, und eine Abstimmung
        macht aus »meistens« sogar »immer«. Wer eine Kaution zahlen soll,
        sollte nachfragen können, und ein Mensch im Laden muss die
        Entscheidung ändern dürfen.
