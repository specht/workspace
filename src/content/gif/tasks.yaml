# Aufgaben zu »Eine GIF-Datei decodieren«.
# Format: docs/aufgaben.md. Gearbeitet wird in /workspace/gif.
# Die Prüfsummen stammen aus dem Referenzdecoder in loesung/gif.c und sind
# mit Pillow nachgerechnet (Adler-32 über RGB aller Pixel, Zeile für Zeile).
format: 1
activity: gif
tasks:
  - id: farben
    title: Die Farbtabelle des Fotos
    prompt: |
      Sieh dir mit `hexdump -C markt.gif | head -1` den Anfang des Fotos an.
      Wie viele Bytes ist seine Global Color Table lang?
    check:
      type: number
      expect: 768
    hint: Die Packed Fields stehen im elften Byte der Datei, bei Offset 0x0A. Die letzten drei Bits sind n, die Tabelle hat 2<sup>n+1</sup> Farben.
    feedback:
      - when: { equals: 256 }
        say: So viele Farben hat die Tabelle. Jede Farbe sind aber drei Bytes.
      - when: { equals: 7 }
        say: 7 steht in den letzten drei Bits der Packed Fields. Die Tabelle hat 2<sup>7+1</sup> Farben, jede mit drei Bytes.
      - when: { equals: 247 }
        say: 0xF7 = 247 ist das ganze Byte mit den Packed Fields. Die Größe steht nur in seinen letzten drei Bits.
    solution: 'Das Byte bei 0x0A ist `f7` = `1111 0111`. Die letzten drei Bits sind 7, also 2<sup>8</sup> = 256 Farben mit je drei Bytes: 768 Bytes.'

  - id: kommentar
    title: Ein Kommentar
    prompt: |
      `diskette.gif` hat eine Comment Extension. Was steht darin?
    check:
      type: answer
      expect: Hackschule
    hint: Rechts im Hexdump stehen die Bytes als Zeichen. Der Kommentar beginnt nach `21 fe` und der Länge des Sub-blocks.
    solution: '`21 fe` ist die Comment Extension, `0a` die Länge, danach zehn Zeichen: `Hackschule`.'

  - id: neuer-code
    title: Ein Code, den es noch nicht gibt
    prompt: |
      Ein anderes Bild mit vier Farben beginnt mit den Codes 4, 3 und 6. Nach
      dem Clear Code 4 und dem Pixel 3 hat die Tabelle die Einträge 0 bis 5,
      aber noch keinen Eintrag 6. Wofür steht der Code 6?
    prediction: true
    check:
      type: choice
      options:
        - Für den Eintrag, der gerade entsteht, den vorigen Eintrag mit dessen erstem Pixel dahinter, also 3 3
        - Für die Farbe 6 der Farbtabelle
        - Für einen Fehler in der Datei, der Decoder muss abbrechen
        - Für ein Pixel, das übersprungen wird
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Das Bild hat nur vier Farben, 0 bis 3. Codes ab 6 stehen für Folgen von Pixeln.
      - when: { picked: 2 }
        say: Ein Fehler wäre ein Code, der größer ist als der nächste freie Eintrag. Genau der nächste freie Eintrag ist erlaubt.
      - when: { picked: 3 }
        say: LZW überspringt nichts; jeder Code außer Clear und End steht für mindestens ein Pixel.
    solution: 'Der Encoder hat nach dem ersten Pixel 3 den Eintrag 6 = 3 3 angelegt und ihn gleich benutzt, weil die nächsten beiden Pixel wieder 3 3 sind. Der Decoder kennt ihn noch nicht, kann ihn aber bauen: der vorige Eintrag (3) und dessen erstes Pixel (3). Die Zeitlupe oben zeigt dasselbe bei der Diskette.'

  - id: pruefsumme-diskette
    title: Die Diskette
    prompt: |
      Welche Prüfsumme gibt dein Decoder für `diskette.gif` aus?
    check:
      type: answer
      expect: ['8e1af5c5', '0x8e1af5c5']
    hint: |
      Stimmt das Bild, aber nicht die Prüfsumme, sieh dir die Farbtabelle an.
      Sieht das Bild falsch aus, vergleiche die ersten Codes mit dem Beispiel
      oben: 4, 1, 6, 3, 8, 9, 9, 6, 0. Mit `printf` in `decode_lzw` siehst du,
      welche Codes dein Programm liest.
    solution: 'Die Prüfsumme ist `8e1af5c5`.'

  - id: pruefsumme-markt
    title: Das Foto
    prompt: |
      Welche Prüfsumme gibt dein Decoder für `markt.gif` aus?
    check:
      type: answer
      expect: ['4e5b2bc9', '0x4e5b2bc9']
    hint: |
      Die Diskette braucht Codes bis 6 Bits und nie einen zweiten Clear Code.
      Das Foto braucht Codes bis 12 Bits, eine volle Tabelle und 39 Clear
      Codes. Prüfe, ob deine Codelänge nach einem Clear Code wieder bei 9 Bits
      beginnt und nie über 12 wächst, und ob die Tabelle bei 4096 Einträgen
      aufhört zu wachsen.
    solution: 'Die Prüfsumme ist `4e5b2bc9`.'

  - id: koernig
    title: Körnig
    prompt: |
      Warum besteht das Gesicht im GIF aus einem Muster einzelner Pixel, im
      JPEG nicht?
    check:
      type: choice
      options:
        - Das Bild hat nur 256 Farben. Wo eine Farbe fehlt, mischt der Encoder Pixel aus Farben, die es gibt, damit es von Weitem richtig aussieht.
        - LZW ist verlustbehaftet und lässt Pixel weg.
        - Der Decoder setzt bei 12 Bits einige Pixel falsch.
        - Das GIF ist kleiner gerechnet als das JPEG.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: LZW ist verlustfrei, der Decoder bekommt jede Pixelnummer genau zurück. Die Muster stehen schon so in der Datei.
      - when: { picked: 2 }
        say: Dann käme eine andere Prüfsumme heraus. Die Muster stehen schon so in der Datei.
      - when: { picked: 3 }
        say: Beide Ausschnitte haben gleich viele Pixel, das JPEG ist für den Vergleich genauso klein gerechnet. Das Muster gibt es nur im GIF.
    solution: 'Beim Umwandeln wurden die vielen Farben des Fotos auf 256 verringert. Damit Verläufe nicht in Stufen zerfallen, verteilt der Encoder den Fehler jedes Pixels auf seine Nachbarn (Dithering, hier nach Floyd und Steinberg). Das Muster ist also Absicht und kostet Platz: Es macht lange gleiche Folgen selten, und die braucht LZW.'

  - id: image-row
    title: Welche Zeile?
    prompt: |
      Schreib `image_row` in `gif.c` und speichere. Der Workspace probiert
      die Funktion für Bilder mit 10, 3 und 427 Zeilen aus, mit und ohne
      Interlacing.
    file: gif/gif.c
    check:
      type: c
      file: gif/gif.c
      cases:
        - call: image_row(5, 10, 0)
          expect: 5
          say: Ohne Interlacing ist die i-te Zeile der Daten die i-te Zeile im Bild.
        - image_row(0, 10, 1): 0
        - call: image_row(1, 10, 1)
          expect: 8
          say: Bei 10 Zeilen hat Durchgang 1 die Zeilen 0 und 8.
        - call: image_row(2, 10, 1)
          expect: 4
          say: Nach den Zeilen 0 und 8 kommt Durchgang 2 mit Zeile 4.
        - image_row(3, 10, 1): 2
        - image_row(5, 10, 1): 1
        - image_row(9, 10, 1): 9
        - call: image_row(1, 3, 1)
          expect: 2
          say: Bei 3 Zeilen hat Durchgang 2 keine einzige Zeile; nach Zeile 0 kommt gleich Zeile 2.
        - image_row(426, 427, 1): 425
    hint: 'Durchgang für Durchgang: Wie viele Zeilen hat er bei `height` Zeilen? Ist `i` kleiner, liegt die Zeile in diesem Durchgang; sonst zieh seine Zeilen von `i` ab.'

  - id: interlacing
    title: Zeilen in anderer Reihenfolge
    prompt: |
      Welche Prüfsumme gibt dein Decoder für `markt-interlaced.gif` aus?
    check:
      type: answer
      expect: ['4e5b2bc9', '0x4e5b2bc9']
    feedback:
      - when: { matches: '^(0x)?0cbf2bc9$' }
        say: Das ist die Prüfsumme der Zeilen in der Reihenfolge, in der sie in der Datei stehen. Sieht das Bild aus wie vier übereinandergelegte Streifen? Dann fehlt noch die Umrechnung mit `image_row`.
    hint: Es ist dasselbe Bild wie `markt.gif`, nur in anderer Reihenfolge gespeichert.
    solution: 'Dieselbe wie bei `markt.gif`: `4e5b2bc9`. Interlacing ändert nur, in welcher Reihenfolge die Zeilen in der Datei stehen, nicht das Bild.'

  - id: animation
    title: Die Diskette im Flug
    prompt: |
      Gib in `animation.c` die Prüfsumme aus, sobald das letzte Bild von
      `flug.gif` gezeichnet ist: nach dem Zeichnen, vor dem Wegräumen, und
      nur beim ersten Durchlauf. Welche Prüfsumme ist es?
    check:
      type: answer
      expect: ['54236d34', '0x54236d34']
    feedback:
      - when: { matches: '^(0x)?8f94af25$' }
        say: Die Disposal Method fehlt noch. Zieht die Diskette eine Spur hinter sich her? Bei Disposal Method 3 kommt zurück, was vor dem Bild unter ihm war.
      - when: { matches: '^(0x)?646c69be$' }
        say: Die durchsichtigen Pixel werden noch gezeichnet. Hat die Diskette eine dunkle Ecke, wo die Landschaft durchscheinen sollte?
      - when: { matches: '^(0x)?51ccbc40$' }
        say: Alle Bilder landen links oben. Die Position aus dem Image Descriptor fehlt noch beim Setzen der Pixel.
      - when: { matches: '^(0x)?79cfe7be$' }
        say: Ist der Himmel am Ende rot? Die Local Color Table steht noch in der Palette, die für den ganzen Bildschirm gilt. Mit `pixel_rgb24` trägt jedes Pixel seine eigene Farbe.
    hint: Das letzte Bild erkennst du daran, dass nach seinen Bilddaten gleich der Trailer `0x3B` kommt.
    solution: 'Die Prüfsumme ist `54236d34`.'
