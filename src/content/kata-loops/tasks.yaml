  - id: perfect
    title: "Vollkommene Zahlen"
    extra: true
    prompt: |
      Eine Zahl ist vollkommen, wenn sie die Summe ihrer Teiler ist, ohne sich selbst: 6 = 1 + 2 + 3. Schreib eine Funktion `perfect_numbers(limit)`, die alle vollkommenen Zahlen bis `limit` als Liste zurückgibt. Bis 10000 sind es vier.
    starter: |
