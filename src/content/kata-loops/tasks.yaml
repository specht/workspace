format: 1
activity: kata-loops
tasks:
  - id: predict-sevens
    title: "Wie viele Siebener?"
    level: 1
    prediction: true
    prompt: |
      Welche Zahl schreibt das Programm oben hin?
    check:
      type: number
      expect: 7
    feedback:
      - when: { equals: 50 }
        say: "Die Schleife läuft 50-mal, aber `count` wird nur größer, wenn die Bedingung gilt."
      - when: { equals: 8 }
        say: "Zähl nach: Welche Vielfachen von 7 liegen zwischen 1 und 50? 56 ist schon zu groß."

  - id: predict-countdown
    title: "Was erscheint?"
    level: 1
    prediction: true
    prompt: |
      Was schreibt das Programm oben hin, Zeile für Zeile?
    check:
      type: choice
      options: ["3, 2, 1, Los!", "3, 2, 1, 0, Los!", "1, 2, 3, Los!", "3, Los!, 2, Los!, 1, Los!"]
      correct: 0

  - id: predict-halving
    title: "Wie oft halbieren?"
    level: 1
    prediction: true
    prompt: |
      Welche Zahl schreibt das Programm oben hin?
    check:
      type: number
      expect: 6
    feedback:
      - when: { equals: 7 }
        say: "Schreib die Werte von `n` auf: 100, 50, 25 … Bei welchem Wert hört die Schleife auf, und wie oft wurde bis dahin halbiert?"
      - when: { equals: 50 }
        say: "`50` ist `n` nach dem ersten Halbieren. Gefragt ist, wie oft halbiert wird, bis `n` nicht mehr größer als 1 ist."

  - id: sum-to
    title: "Von 1 bis n zusammenzählen"
    level: 1
    prompt: |
      Schreib eine Funktion `sum_to(n)`, die alle Zahlen von 1 bis `n` zusammenzählt: `sum_to(4)` ergibt `10`, denn 1 + 2 + 3 + 4 = 10. Mit einer Schleife.
    starter: |
      def sum_to(n)
        total = 0
        # hier: eine Schleife
        total
      end
    check:
      type: function
      language: ruby
      forbid: [Range#sum, Array#sum, Enumerable#sum, Enumerable#inject, Enumerable#reduce]
      cases:
        - call: "sum_to(4)"
          expect: "10"
        - call: "sum_to(1)"
          expect: "1"
        - call: "sum_to(0)"
          expect: "0"
        - call: "sum_to(100)"
          expect: "5050"
      random:
        count: 4
        call: "sum_to(n)"
        args: { n: 1..2000 }
        reference: "n * (n + 1) / 2"
    feedback:
      - when: { same_as: "def sum_to(n)\n  total = 0\n  (1...n).each { |i| total += i }\n  total\nend\n" }
        say: "`1...n` mit drei Punkten hört vor `n` auf. Mit zwei Punkten, `1..n`, ist `n` dabei."
    hint: |
      `(1..n).each do |i| … end` läuft mit `i` von 1 bis `n`. In der Schleife addierst du `i` zu `total`.
    solution: |
      ```ruby
      def sum_to(n)
        total = 0
        (1..n).each do |i|
          total += i
        end
        total
      end
      ```
    python:
      starter: |
        def sum_to(n):
            total = 0
            # hier: eine Schleife
            return total
      check:
        type: function
        language: python
        forbid: [sum]
        cases:
          - call: "sum_to(4)"
            expect: "10"
          - call: "sum_to(1)"
            expect: "1"
          - call: "sum_to(0)"
            expect: "0"
          - call: "sum_to(100)"
            expect: "5050"
        random:
          count: 4
          call: "sum_to(n)"
          args: { n: 1..2000 }
          reference: "n * (n + 1) // 2"
      feedback:
        - when: { same_as: "def sum_to(n):\n    total = 0\n    for i in range(1, n):\n        total += i\n    return total\n" }
          say: "`range(1, n)` hört vor `n` auf. Damit `n` dabei ist, brauchst du `range(1, n + 1)`."
      hint: |
        `for i in range(1, n + 1):` läuft mit `i` von 1 bis `n`. In der Schleife addierst du `i` zu `total`.
      solution: |
        ```python
        def sum_to(n):
            total = 0
            for i in range(1, n + 1):
                total += i
            return total
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `sumTo(n)`, die alle Zahlen von 1 bis `n` zusammenzählt: `sumTo(4)` ergibt `10`, denn 1 + 2 + 3 + 4 = 10. Mit einer Schleife.
      starter: |
        function sumTo(n) {
          let total = 0;
          // hier: eine Schleife
          return total;
        }
      check:
        type: function
        language: javascript
        forbid: [Array.prototype.reduce]
        cases:
          - call: "sumTo(4)"
            expect: "10"
          - call: "sumTo(1)"
            expect: "1"
          - call: "sumTo(0)"
            expect: "0"
          - call: "sumTo(100)"
            expect: "5050"
        random:
          count: 4
          call: "sumTo(n)"
          args: { n: 1..2000 }
          reference: "n * (n + 1) / 2"
      feedback:
        - when: { same_as: "function sumTo(n) {\n  let total = 0;\n  for (let i = 1; i < n; i++) total += i;\n  return total;\n}\n" }
          say: "`i < n` hört vor `n` auf. Damit `n` dabei ist, brauchst du `i <= n`."
      hint: |
        `for (let i = 1; i <= n; i++) { … }` läuft mit `i` von 1 bis `n`. In der Schleife addierst du `i` zu `total`.
      solution: |
        ```javascript
        function sumTo(n) {
          let total = 0;
          for (let i = 1; i <= n; i++) {
            total += i;
          }
          return total;
        }
        ```

  - id: numbers
    title: "Eine Zahlenreihe"
    level: 1
    prompt: |
      Schreib eine Funktion `numbers(n)`, die eine Liste der Zahlen von 1 bis `n` zurückgibt: `numbers(4)` ergibt `[1, 2, 3, 4]`. Mit einer Schleife, die die Liste Zahl für Zahl füllt.
    starter: |
      def numbers(n)
        result = []
        # hier: eine Schleife
        result
      end
    check:
      type: function
      language: ruby
      forbid: [Range#to_a, Range#entries, Enumerable#to_a, Array#fill]
      cases:
        - call: "numbers(4)"
          expect: "[1, 2, 3, 4]"
        - call: "numbers(1)"
          expect: "[1]"
        - call: "numbers(0)"
          expect: "[]"
          say: "Bis 0 gibt es keine Zahl: eine leere Liste."
    hint: "`result << i` hängt `i` hinten an die Liste an."
    solution: |
      ```ruby
      def numbers(n)
        result = []
        (1..n).each do |i|
          result << i
        end
        result
      end
      ```
    python:
      starter: |
        def numbers(n):
            result = []
            # hier: eine Schleife
            return result
      check:
        type: function
        language: python
        forbid: [list]
        cases:
          - call: "numbers(4)"
            expect: "[1, 2, 3, 4]"
          - call: "numbers(1)"
            expect: "[1]"
          - call: "numbers(0)"
            expect: "[]"
            say: "Bis 0 gibt es keine Zahl: eine leere Liste."
      hint: "`result.append(i)` hängt `i` hinten an die Liste an."
      solution: |
        ```python
        def numbers(n):
            result = []
            for i in range(1, n + 1):
                result.append(i)
            return result
        ```
    javascript:
      starter: |
        function numbers(n) {
          const result = [];
          // hier: eine Schleife
          return result;
        }
      check:
        type: function
        language: javascript
        forbid: [Array.from, Array.prototype.keys, Array.prototype.fill]
        cases:
          - call: "numbers(4)"
            expect: "[1, 2, 3, 4]"
          - call: "numbers(1)"
            expect: "[1]"
          - call: "numbers(0)"
            expect: "[]"
            say: "Bis 0 gibt es keine Zahl: eine leere Liste."
      hint: "`result.push(i)` hängt `i` hinten an die Liste an."
      solution: |
        ```javascript
        function numbers(n) {
          const result = [];
          for (let i = 1; i <= n; i++) {
            result.push(i);
          }
          return result;
        }
        ```

  - id: squares
    title: "Quadratzahlen"
    level: 1
    prompt: |
      Schreib eine Funktion `squares(n)`, die die Quadratzahlen von 1² bis n² als Liste zurückgibt: `squares(4)` ergibt `[1, 4, 9, 16]`.
    starter: |
      def squares(n)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "squares(4)"
          expect: "[1, 4, 9, 16]"
        - call: "squares(1)"
          expect: "[1]"
        - call: "squares(0)"
          expect: "[]"
        - call: "squares(10).last"
          expect: "100"
    solution: |
      ```ruby
      def squares(n)
        result = []
        (1..n).each { |i| result << i * i }
        result
      end
      ```
    python:
      starter: |
        def squares(n):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "squares(4)"
            expect: "[1, 4, 9, 16]"
          - call: "squares(1)"
            expect: "[1]"
          - call: "squares(0)"
            expect: "[]"
          - call: "squares(10)[-1]"
            expect: "100"
      solution: |
        ```python
        def squares(n):
            result = []
            for i in range(1, n + 1):
                result.append(i * i)
            return result
        ```
    javascript:
      starter: |
        function squares(n) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "squares(4)"
            expect: "[1, 4, 9, 16]"
          - call: "squares(1)"
            expect: "[1]"
          - call: "squares(0)"
            expect: "[]"
          - call: "squares(10).at(-1)"
            expect: "100"
      solution: |
        ```javascript
        function squares(n) {
          const result = [];
          for (let i = 1; i <= n; i++) result.push(i * i);
          return result;
        }
        ```

  - id: countdown
    title: "Countdown"
    level: 1
    prompt: |
      Schreib eine Funktion `countdown(n)`, die von `n` bis 0 herunterzählt und die Zahlen als Liste zurückgibt: `countdown(3)` ergibt `[3, 2, 1, 0]`.
    starter: |
      def countdown(n)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#reverse, Range#reverse_each]
      cases:
        - call: "countdown(3)"
          expect: "[3, 2, 1, 0]"
        - call: "countdown(0)"
          expect: "[0]"
        - call: "countdown(10).length"
          expect: "11"
    hint: |
      `n.downto(0) do |i| … end` zählt herunter. Oder eine `while`-Schleife, die `n` jedes Mal um 1 kleiner macht.
    solution: |
      ```ruby
      def countdown(n)
        result = []
        n.downto(0) { |i| result << i }
        result
      end
      ```
    python:
      starter: |
        def countdown(n):
            pass
      check:
        type: function
        language: python
        forbid: [reversed, list.reverse]
        cases:
          - call: "countdown(3)"
            expect: "[3, 2, 1, 0]"
          - call: "countdown(0)"
            expect: "[0]"
          - call: "len(countdown(10))"
            expect: "11"
      hint: |
        `range(n, -1, -1)` zählt von `n` herunter bis 0: Die zweite Zahl ist die erste, die nicht mehr dabei ist. Oder eine `while`-Schleife, die `n` jedes Mal um 1 kleiner macht.
      solution: |
        ```python
        def countdown(n):
            result = []
            for i in range(n, -1, -1):
                result.append(i)
            return result
        ```
    javascript:
      starter: |
        function countdown(n) {
        }
      check:
        type: function
        language: javascript
        forbid: [Array.prototype.reverse, Array.prototype.toReversed]
        cases:
          - call: "countdown(3)"
            expect: "[3, 2, 1, 0]"
          - call: "countdown(0)"
            expect: "[0]"
          - call: "countdown(10).length"
            expect: "11"
      hint: "`for (let i = n; i >= 0; i--)` zählt herunter bis 0."
      solution: |
        ```javascript
        function countdown(n) {
          const result = [];
          for (let i = n; i >= 0; i--) result.push(i);
          return result;
        }
        ```

  - id: factorial
    title: "Fakultät"
    level: 2
    prompt: |
      Die Fakultät `n!` ist das Produkt aller Zahlen von 1 bis `n`: 5! = 1 · 2 · 3 · 4 · 5 = 120. Und 0! ist 1. Schreib eine Funktion `factorial(n)`: `factorial(5)` ergibt `120`.
    starter: |
      def factorial(n)
      end
    check:
      type: function
      language: ruby
      forbid: [Enumerable#inject, Enumerable#reduce, Range#inject, Range#reduce]
      cases:
        - call: "factorial(5)"
          expect: "120"
        - call: "factorial(1)"
          expect: "1"
        - call: "factorial(0)"
          expect: "1"
          say: "0! ist 1: das Produkt von gar keiner Zahl."
        - call: "factorial(10)"
          expect: "3628800"
      random:
        count: 4
        call: "factorial(n)"
        args: { n: 2..25 }
        reference: "(1..n).reduce(1, :*)"
    feedback:
      - when: { same_as: "def factorial(n)\n  product = 0\n  (1..n).each { |i| product *= i }\n  product\nend\n" }
        say: "Ein Produkt, das bei 0 anfängt, bleibt 0, was auch immer du damit multiplizierst. Fang bei 1 an."
    hint:
      - "Rechne 4! von Hand und schreib jeden Zwischenwert auf: 1, 2, 6, 24."
      - "Wie bei der Summe, nur mit `*` statt `+`. Womit muss das Produkt anfangen?"
    solution: |
      ```ruby
      def factorial(n)
        product = 1
        (1..n).each { |i| product *= i }
        product
      end
      ```
    python:
      starter: |
        def factorial(n):
            pass
      check:
        type: function
        language: python
        forbid: [math.factorial, math.prod]
        cases:
          - call: "factorial(5)"
            expect: "120"
          - call: "factorial(1)"
            expect: "1"
          - call: "factorial(0)"
            expect: "1"
            say: "0! ist 1: das Produkt von gar keiner Zahl."
          - call: "factorial(10)"
            expect: "3628800"
        random:
          count: 4
          call: "factorial(n)"
          args: { n: 2..25 }
          reference: "math.factorial(n)"
      feedback:
        - when: { same_as: "def factorial(n):\n    product = 0\n    for i in range(1, n + 1):\n        product *= i\n    return product\n" }
          say: "Ein Produkt, das bei 0 anfängt, bleibt 0, was auch immer du damit multiplizierst. Fang bei 1 an."
      hint:
        - "Rechne 4! von Hand und schreib jeden Zwischenwert auf: 1, 2, 6, 24."
        - "Wie bei der Summe, nur mit `*` statt `+`. Womit muss das Produkt anfangen?"
      solution: |
        ```python
        def factorial(n):
            product = 1
            for i in range(1, n + 1):
                product *= i
            return product
        ```
    javascript:
      starter: |
        function factorial(n) {
        }
      check:
        type: function
        language: javascript
        forbid: [Array.prototype.reduce]
        cases:
          - call: "factorial(5)"
            expect: "120"
          - call: "factorial(1)"
            expect: "1"
          - call: "factorial(0)"
            expect: "1"
            say: "0! ist 1: das Produkt von gar keiner Zahl."
          - call: "factorial(10)"
            expect: "3628800"
        random:
          count: 4
          call: "factorial(n)"
          args: { n: 2..18 }
          reference: "(function f(k) { return k <= 1 ? 1 : k * f(k - 1); })(n)"
      feedback:
        - when: { same_as: "function factorial(n) {\n  let product = 0;\n  for (let i = 1; i <= n; i++) product *= i;\n  return product;\n}\n" }
          say: "Ein Produkt, das bei 0 anfängt, bleibt 0, was auch immer du damit multiplizierst. Fang bei 1 an."
      hint:
        - "Rechne 4! von Hand und schreib jeden Zwischenwert auf: 1, 2, 6, 24."
        - "Wie bei der Summe, nur mit `*` statt `+`. Womit muss das Produkt anfangen?"
      solution: |
        ```javascript
        function factorial(n) {
          let product = 1;
          for (let i = 1; i <= n; i++) product *= i;
          return product;
        }
        ```

  - id: digit-sum
    title: "Die Quersumme"
    level: 2
    prompt: |
      Die Quersumme einer Zahl ist die Summe ihrer Ziffern: Die Quersumme von 1234 ist 1 + 2 + 3 + 4 = 10. Schreib eine Funktion `digit_sum(n)`, nur mit Rechnen, ohne die Zahl in einen Text zu verwandeln.
    starter: |
      def digit_sum(n)
      end
    check:
      type: function
      language: ruby
      forbid: [Integer#to_s, Integer#digits, Integer#inspect]
      cases:
        - call: "digit_sum(1234)"
          expect: "10"
        - call: "digit_sum(7)"
          expect: "7"
        - call: "digit_sum(0)"
          expect: "0"
        - call: "digit_sum(9999)"
          expect: "36"
        - call: "digit_sum(1000)"
          expect: "1"
      random:
        count: 4
        call: "digit_sum(n)"
        args: { n: 0..1000000 }
        reference: "n.digits.sum"
    hint:
      - "`1234 % 10` ist 4, die letzte Ziffer. Und `1234 / 10`?"
      - "Wiederhole: letzte Ziffer zur Summe, dann die Zahl durch 10 teilen. Bis wann?"
      - |
        Ein Gerüst:

        ```ruby
        def digit_sum(n)
          total = 0
          while n > 0
            # hier: letzte Ziffer dazu, dann n kleiner machen
          end
          total
        end
        ```
    solution: |
      ```ruby
      def digit_sum(n)
        total = 0
        while n > 0
          total += n % 10
          n /= 10
        end
        total
      end
      ```
    python:
      starter: |
        def digit_sum(n):
            pass
      check:
        type: function
        language: python
        forbid: [str, repr]
        cases:
          - call: "digit_sum(1234)"
            expect: "10"
          - call: "digit_sum(7)"
            expect: "7"
          - call: "digit_sum(0)"
            expect: "0"
          - call: "digit_sum(9999)"
            expect: "36"
          - call: "digit_sum(1000)"
            expect: "1"
        random:
          count: 4
          call: "digit_sum(n)"
          args: { n: 0..1000000 }
          reference: "sum(int(d) for d in str(n))"
      hint:
        - "`1234 % 10` ist 4, die letzte Ziffer. Und `1234 // 10`?"
        - "Wiederhole: letzte Ziffer zur Summe, dann die Zahl durch 10 teilen. Bis wann?"
        - |
          Ein Gerüst:

          ```python
          def digit_sum(n):
              total = 0
              while n > 0:
                  ...  # letzte Ziffer dazu, dann n kleiner machen
              return total
          ```
      solution: |
        ```python
        def digit_sum(n):
            total = 0
            while n > 0:
                total += n % 10
                n //= 10
            return total
        ```
    javascript:
      prompt: |
        Die Quersumme einer Zahl ist die Summe ihrer Ziffern: Die Quersumme von 1234 ist 1 + 2 + 3 + 4 = 10. Schreib eine Funktion `digitSum(n)`, nur mit Rechnen, ohne die Zahl in einen Text zu verwandeln.
      starter: |
        function digitSum(n) {
        }
      check:
        type: function
        language: javascript
        forbid: [Number.prototype.toString, globalThis.String]
        cases:
          - call: "digitSum(1234)"
            expect: "10"
          - call: "digitSum(7)"
            expect: "7"
          - call: "digitSum(0)"
            expect: "0"
          - call: "digitSum(9999)"
            expect: "36"
          - call: "digitSum(1000)"
            expect: "1"
        random:
          count: 4
          call: "digitSum(n)"
          args: { n: 0..1000000 }
          reference: "[...`${n}`].reduce((s, d) => s + Number(d), 0)"
      hint:
        - "`1234 % 10` ist 4, die letzte Ziffer. Und `Math.floor(1234 / 10)`?"
        - "Wiederhole: letzte Ziffer zur Summe, dann die Zahl durch 10 teilen. Bis wann?"
        - |
          Ein Gerüst:

          ```javascript
          function digitSum(n) {
            let total = 0;
            while (n > 0) {
              // hier: letzte Ziffer dazu, dann n kleiner machen
            }
            return total;
          }
          ```
      solution: |
        ```javascript
        function digitSum(n) {
          let total = 0;
          while (n > 0) {
            total += n % 10;
            n = Math.floor(n / 10);
          }
          return total;
        }
        ```

  - id: fibonacci
    title: "Fibonacci"
    level: 2
    prompt: |
      Die Fibonacci-Zahlen beginnen mit 0 und 1, und jede weitere ist die Summe der beiden davor: 0, 1, 1, 2, 3, 5, 8, 13 … Schreib eine Funktion `fibonacci(n)`, die die `n`-te zurückgibt, gezählt ab 0: `fibonacci(0)` ergibt `0`, `fibonacci(7)` ergibt `13`.
    starter: |
      def fibonacci(n)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "fibonacci(0)"
          expect: "0"
        - call: "fibonacci(1)"
          expect: "1"
        - call: "fibonacci(2)"
          expect: "1"
        - call: "fibonacci(7)"
          expect: "13"
        - call: "fibonacci(10)"
          expect: "55"
      random:
        count: 4
        call: "fibonacci(n)"
        args: { n: 15..60 }
        reference: "(1..n).reduce([0, 1]) { |(a, b), _| [b, a + b] }[0]"
    hint:
      - "Schreib die Folge bis `fibonacci(7)` auf und zeig mit dem Finger auf die beiden Zahlen, die du gerade addierst."
      - "Zwei Variablen merken sich die letzten beiden Zahlen, `a` und `b`. Wie sehen sie nach einem Schritt aus?"
    solution: |
      ```ruby
      def fibonacci(n)
        a, b = 0, 1
        n.times { a, b = b, a + b }
        a
      end
      ```
    python:
      starter: |
        def fibonacci(n):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "fibonacci(0)"
            expect: "0"
          - call: "fibonacci(1)"
            expect: "1"
          - call: "fibonacci(2)"
            expect: "1"
          - call: "fibonacci(7)"
            expect: "13"
          - call: "fibonacci(10)"
            expect: "55"
        random:
          count: 4
          call: "fibonacci(n)"
          args: { n: 15..60 }
          reference: "round(((1 + 5 ** 0.5) / 2) ** n / 5 ** 0.5)"
      hint:
        - "Schreib die Folge bis `fibonacci(7)` auf und zeig mit dem Finger auf die beiden Zahlen, die du gerade addierst."
        - "Zwei Variablen merken sich die letzten beiden Zahlen, `a` und `b`. Wie sehen sie nach einem Schritt aus?"
      solution: |
        ```python
        def fibonacci(n):
            a, b = 0, 1
            for i in range(n):
                a, b = b, a + b
            return a
        ```
