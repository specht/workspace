      solution: |
        ```javascript
        function divisorSum(n) {
          let total = 0;
          for (let d = 1; d <= n / 2; d++) if (n % d === 0) total += d;
          return total;
        }

        function perfectNumbers(limit) {
          const result = [];
          for (let n = 2; n <= limit; n++) if (divisorSum(n) === n) result.push(n);
