      ```ruby
      def primes_up_to(n)
        return [] if n < 2
        prime = Array.new(n + 1, true)
        prime[0] = prime[1] = false
        p = 2
        while p * p <= n
          (p * p).step(n, p) { |m| prime[m] = false } if prime[p]
          p += 1
        end
        (2..n).select { |i| prime[i] }
      end
      ```
