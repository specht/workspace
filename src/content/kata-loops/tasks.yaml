      hint: |
        Eine Funktion, die die Teiler einer Zahl zusammenzählt, und eine Schleife über alle Zahlen bis `limit`. Teiler gibt es höchstens bis zur Hälfte der Zahl.
      solution: |
        ```python
        def divisor_sum(n):
            total = 0
            for d in range(1, n // 2 + 1):
                if n % d == 0:
                    total += d
            return total

        def perfect_numbers(limit):
            return [n for n in range(2, limit + 1) if divisor_sum(n) == n]
