        function primesUpTo(n) {
          if (n < 2) return [];
          const prime = new Array(n + 1).fill(true);
          prime[0] = prime[1] = false;
          for (let p = 2; p * p <= n; p++) {
            if (!prime[p]) continue;
            for (let m = p * p; m <= n; m += p) prime[m] = false;
          }
          const result = [];
          for (let i = 2; i <= n; i++) if (prime[i]) result.push(i);
          return result;
        }
