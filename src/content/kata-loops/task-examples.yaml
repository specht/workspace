        - answer: "List<Integer> primesUpTo(int n) {\n    List<Integer> result = new ArrayList<>();\n    boolean[] composite = new boolean[n + 1];\n    for (int p = 2; (long) p * p <= n; p++) {\n        if (composite[p]) continue;\n        for (int m = p * p; m <= n; m += p) {\n            composite[m] = true;\n        }\n    }\n    for (int i = 2; i <= n; i++) {\n        if (!composite[i]) result.add(i);\n    }\n    return result;\n}\n"
