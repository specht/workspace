<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <style id='embedded-fonts'>@font-face{font-family:'IBM Plex Sans';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <rect width="1600" height="900" fill="#ffffff"/>
  <!-- zwei Ebenen: oben das Allgemeine, unten das Beispiel -->
  <path d="M 200 200 H 1400" stroke="#d1d5db" stroke-width="4" stroke-dasharray="2 22" stroke-linecap="round"/>
  <path d="M 200 700 H 1400" stroke="#d1d5db" stroke-width="4" stroke-dasharray="2 22" stroke-linecap="round"/>
  <text x="1400" y="168" text-anchor="end" font-family="'IBM Plex Sans', sans-serif" font-size="42" font-weight="600" fill="#6b7280">allgemein</text>
  <text x="1400" y="768" text-anchor="end" font-family="'IBM Plex Sans', sans-serif" font-size="42" font-weight="600" fill="#6b7280">konkret</text>
  <!-- die Welle: hinab ins Beispiel und wieder hinauf -->
  <path d="M 250 260 C 430 260 450 640 640 640 C 830 640 800 260 990 260 C 1150 260 1180 520 1350 520"
        fill="none" stroke="#f3f4f6" stroke-width="34" stroke-linecap="round"/>
  <path d="M 250 260 C 430 260 450 640 640 640 C 830 640 800 260 990 260 C 1150 260 1180 520 1350 520"
        fill="none" stroke="#2b5fb4" stroke-width="6" stroke-linecap="round"/>

  <!-- vermuten -->
  <g transform="translate(441 450)">
    <circle r="92" fill="#c98500"/>
    <text y="34" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="110" font-weight="600" fill="#ffffff">?</text>
    <text x="120" y="-40" text-anchor="start" font-family="'IBM Plex Sans', sans-serif" font-size="46" font-weight="600" fill="#1f2937">vermuten</text>
  </g>
  <!-- ausprobieren -->
  <g transform="translate(640 640)">
    <circle r="92" fill="#16a34a"/>
    <path d="M -24 -40 L 42 0 L -24 40 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <text y="160" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="46" font-weight="600" fill="#1f2937">ausprobieren</text>
  </g>
  <!-- die Regel selbst fassen -->
  <g transform="translate(990 260)">
    <circle r="92" fill="#0d60ae"/>
    <rect x="-36" y="-48" width="72" height="96" rx="6" fill="#ffffff"/>
    <path d="M -22 -24 H 22 M -22 -6 H 22 M -22 12 H 10" stroke="#0d60ae" stroke-width="7" stroke-linecap="round"/>
    <text y="168" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="46" font-weight="600" fill="#1f2937">Regel fassen</text>
  </g>
</svg>
