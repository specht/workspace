# Seiten nur für Lehrkräfte (docs/teacher-access.md), als Karten unter
# /lehrmaterial (src/static/lehrmaterial.html). Wer keine Lehrkraft ist,
# bekommt unter /lehrmaterial und /lehrmaterial-… eine 403.
- key: lehrmaterial-start
  label: Anfangen
  icon: /images/rocket.png
  description: |
    Die erste Stunde mit dem Workspace: wie sich deine Klasse anmeldet, wie
    du alles vorher mit deinem Testkonto ausprobierst, und was die
    Klassenseite zeigt.
  entries:
    - lehrmaterial-einstieg
    - lehrmaterial-klassenseite
- key: lehrmaterial-unterricht
  label: Im Unterricht
  icon: /images/memo.png
  description: |
    Eine Aktivität zu deinem Lehrplan finden, mit der Klasse in einem
    gemeinsamen Git-Repository arbeiten, eigene Projekte mit Meilensteinen
    und Kriterien begleiten, nachlesen, welche Ideen der Didaktik hinter
    den Aufgaben stehen, Leistungsüberprüfungen vorbereiten.
  entries:
    - lehrmaterial-lehrplan
    - lehrmaterial-git
    - lehrmaterial-projekte
    - lehrmaterial-didaktik
    - lehrmaterial-leistungsueberpruefung
- key: lehrmaterial-schule
  label: Schule und Datenschutz
  icon: /images/key.png
  description: |
    Was der Server speichert, und was deine Schule braucht, um dem Einsatz
    zuzustimmen.
  entries:
    - lehrmaterial-datenschutz
