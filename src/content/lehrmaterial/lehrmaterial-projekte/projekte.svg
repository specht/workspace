<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <style id='embedded-fonts'>@font-face{font-family:'IBM Plex Sans';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <rect width="1600" height="900" fill="#ffffff"/>
  <g transform="translate(0 -90)">
  <!-- der Weg: von links unten nach rechts oben, in Schleifen -->
  <path d="M 70 820 C 250 820 270 560 400 560 C 560 560 520 740 700 740 C 880 740 820 430 1000 430 C 1180 430 1110 640 1290 600 C 1430 570 1440 330 1520 250"
        fill="none" stroke="#f3f4f6" stroke-width="34" stroke-linecap="round"/>
  <path d="M 70 820 C 250 820 270 560 400 560 C 560 560 520 740 700 740 C 880 740 820 430 1000 430 C 1180 430 1110 640 1290 600 C 1430 570 1440 330 1520 250"
        fill="none" stroke="#d1d5db" stroke-width="4" stroke-dasharray="2 22" stroke-linecap="round"/>

  <!-- 1: die Idee auf Papier -->
  <g transform="translate(400 560)">
    <circle r="92" fill="#c98500"/>
    <rect x="-36" y="-48" width="72" height="96" rx="6" fill="#ffffff"/>
    <path d="M -22 -24 H 22 M -22 -6 H 22 M -22 12 H 10" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
    <text y="148" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="46" font-weight="600" fill="#1f2937">Idee</text>
  </g>
  <!-- 2: eine erste Fassung läuft -->
  <g transform="translate(700 740)">
    <circle r="92" fill="#16a34a"/>
    <path d="M -24 -40 L 42 0 L -24 40 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <text y="-118" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="46" font-weight="600" fill="#1f2937">läuft</text>
  </g>
  <!-- 3: vorgeführt -->
  <g transform="translate(1000 430)">
    <circle r="92" fill="#12959f"/>
    <path d="M -54 0 C -30 -36 30 -36 54 0 C 30 36 -30 36 -54 0 Z" fill="#ffffff"/>
    <circle r="20" fill="#12959f"/>
    <circle cx="7" cy="-7" r="6" fill="#ffffff"/>
    <text y="148" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="46" font-weight="600" fill="#1f2937">vorgeführt</text>
  </g>
  <!-- 4: abgegeben -->
  <g transform="translate(1290 600)">
    <circle r="92" fill="#0d60ae"/>
    <path d="M -26 48 V -48" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <path d="M -22 -46 C 0 -58 16 -34 40 -44 V 4 C 16 14 0 -10 -22 2 Z" fill="#ffffff"/>
    <text y="148" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="46" font-weight="600" fill="#1f2937">abgegeben</text>
  </g>
  </g>
