  schatten:
    skip: Die Datei bindet pixelram.h ein, das erst make in den Ordner holt. Von Hand mit pixelram.h geprüft, angenommen stufen/06-akne.c, stufen/06-schatten.c und jede spätere Stufe bis stufen/raytracer.c (auch die weichen Schatten und die Szene von stufen/16-pathtracing.c, weil die Prüfung ihre eigene Szene baut), abgelehnt stufen/05-boden.c (ohne Schattenstrahl), ein Schattenstrahl entlang der Normale statt sun_dir und einer mit !nearest_hit; ein Rezept mit check-task gibt es dafür noch nicht.
