  <rect width="470" height="200" fill="#ffffff"/>
  <rect x="10.0" y="120.0" width="450.0" height="70.0" fill="#f3f4f6"/>
  <line x1="10.0" y1="120.0" x2="460.0" y2="120.0" stroke="#1f2937" stroke-width="2.5"/>
  <text x="452.0" y="110.0" font-size="15" fill="#1f2937" text-anchor="end">Boden, y = 0</text>
  <text x="16.0" y="26.0" font-size="14" fill="#6b7280" text-anchor="start" font-style="italic">stark vergrößert</text>
  <line x1="161.0" y1="128.3" x2="182.2" y2="89.7" stroke="#16a34a" stroke-width="2"/>
  <line x1="156.6" y1="125.9" x2="165.4" y2="130.7" stroke="#16a34a" stroke-width="2"/>
