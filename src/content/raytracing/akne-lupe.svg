  <text x="217.0" y="66.0" font-size="14" fill="#dc2626" text-anchor="start">trifft den Boden selbst,</text>
  <text x="217.0" y="84.0" font-size="14" fill="#dc2626" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">t = 0,0000000000000002</text>
