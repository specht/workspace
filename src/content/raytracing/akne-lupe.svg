  <text x="115.0" y="112.0" font-size="14" fill="#6b7280" text-anchor="end">eigentlich hier</text>
  <circle cx="175.0" cy="136.0" r="5.0" fill="#2b5fb4" stroke="#2b5fb4" stroke-width="1.5"/>
