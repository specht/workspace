  <text x="174.2" y="85.7" font-size="15" fill="#16a34a" text-anchor="end" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">EPS</text>
  <line x1="175.0" y1="136.0" x2="227.1" y2="41.3" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="231.9,32.6 230.5,46.0 221.3,41.0" fill="#d97706"/>
