<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Spiegeln: Ohne Spiegel ginge dir weiter, gestrichelt. Der Anteil entlang der Normalen kehrt sich um: Zweimal dot(dir, n) · n abgezogen, und der Strahl zeigt nach oben. reflect(dir, n) = dir − 2 · dot(dir, n) · n.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raytracing/NAME.svg 1000 -->
  <rect width="500" height="290" fill="#ffffff"/>
  <rect x="30.0" y="150.0" width="440.0" height="125.0" fill="#eef3fb"/>
  <line x1="30.0" y1="150.0" x2="470.0" y2="150.0" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="215.0" y1="150.0" x2="323.0" y2="239.8" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 5"/>
  <polygon points="330.4,245.9 317.9,242.1 324.4,234.4" fill="#6b7280"/>
  <text x="326.4" y="267.9" font-size="15" fill="#6b7280" text-anchor="middle">ohne Spiegel</text>
  <line x1="330.4" y1="245.9" x2="330.4" y2="64.9" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="330.4,54.1 336.0,67.6 324.7,67.6" fill="#16a34a"/>
  <line x1="323.4" y1="150.0" x2="337.4" y2="150.0" stroke="#16a34a" stroke-width="2"/>
  <text x="342.4" y="110.0" font-size="15" fill="#16a34a" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">−2 · dot(dir, n) · n</text>
  <line x1="99.6" y1="54.1" x2="206.7" y2="143.1" stroke="#2b5fb4" stroke-width="2.5"/>
  <polygon points="215.0,150.0 201.0,145.7 208.2,137.0" fill="#2b5fb4"/>
  <text x="93.6" y="46.1" font-size="16" fill="#2b5fb4" text-anchor="end" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">dir</text>
  <line x1="215.0" y1="150.0" x2="322.1" y2="61.0" stroke="#2b5fb4" stroke-width="2.5"/>
  <polygon points="330.4,54.1 323.6,67.1 316.3,58.4" fill="#2b5fb4"/>
  <text x="330.4" y="42.1" font-size="15" fill="#2b5fb4" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">reflect(dir, n)</text>
  <line x1="215.0" y1="150.0" x2="215.0" y2="90.8" stroke="#1f2937" stroke-width="2.5"/>
  <polygon points="215.0,80.0 220.7,93.5 209.3,93.5" fill="#1f2937"/>
  <text x="205.0" y="90.0" font-size="17" fill="#1f2937" text-anchor="end" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">n</text>
</svg>
