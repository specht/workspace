<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 496 236" width="496" height="236" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Eine Kugel auf dem Boden, die Sonne weit weg rechts oben. Von zwei Treffpunkten auf dem Boden geht je ein Strahl in Richtung sun_dir, beide parallel, denn die Sonne ist so weit weg, dass sie von überall in derselben Richtung steht. Der linke stößt an die Kugel: Schatten. Der rechte kommt frei durch.
       Gemacht von bilder/diagramme.py; auf der Seite mit style='width: 31em'.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raytracing/schattenstrahl.svg 992 -->
  <rect width="496" height="236" fill="#ffffff"/>
  <rect x="10.0" y="196.0" width="476.0" height="30.0" fill="#f3f4f6"/>
  <line x1="10.0" y1="196.0" x2="486.0" y2="196.0" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="232.0" cy="134.0" r="62.0" fill="#eef3fb" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="150.0" y1="196.0" x2="182.0" y2="170.6" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="176.0" y1="164.6" x2="188.0" y2="176.6" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="176.0" y1="176.6" x2="188.0" y2="164.6" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="150.0" cy="196.0" r="5.5" fill="#2b5fb4"/>
  <text x="144.0" y="218.0" font-size="16" fill="#1f2937" text-anchor="end" xml:space="preserve">im Schatten</text>
  <line x1="360.0" y1="196.0" x2="470.9" y2="107.8" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 4"/>
  <polygon points="477.4,102.7 465.2,106.3 471.1,113.7" fill="#d97706"/>
  <circle cx="360.0" cy="196.0" r="5.5" fill="#2b5fb4"/>
  <text x="368.0" y="218.0" font-size="16" fill="#1f2937" text-anchor="start" xml:space="preserve">in der Sonne</text>
  <rect x='345.1' y='126.4' width='72.0' height='17.2' rx='4.5' fill='#f384af' fill-opacity='0.2'/><text x='349.6' y='138.7' font-size='15' fill='#e5185d' font-family="'0xProto Nerd Font Mono', 'DejaVu Sans Mono', monospace">sun_dir</text>
