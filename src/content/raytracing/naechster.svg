<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 215" width="540" height="215" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Ein Strahl kann mehrere Kugeln und den Boden treffen. nearest_hit fragt jede Kugel und den Boden nach ihrem t und behält das kleinste: Das ist, was man sieht. Eine Kugel, die der Strahl verfehlt, meldet INFINITY.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raytracing/NAME.svg 1080 -->
  <rect width="540" height="215" fill="#ffffff"/>
  <rect x="10.0" y="175.0" width="520.0" height="30.0" fill="#f3f4f6"/>
  <line x1="10.0" y1="175.0" x2="530.0" y2="175.0" stroke="#1f2937" stroke-width="2"/>
  <text x="522.0" y="197.0" font-size="15" fill="#1f2937" text-anchor="end">Boden</text>
  <circle cx="185.0" cy="40.0" r="30.0" fill="#eef3fb" stroke="#1f2937" stroke-width="2"/>
  <circle cx="255.0" cy="118.0" r="36.0" fill="#eef3fb" stroke="#1f2937" stroke-width="2"/>
  <circle cx="372.0" cy="148.0" r="26.0" fill="#eef3fb" stroke="#1f2937" stroke-width="2"/>
  <line x1="221.1" y1="130.2" x2="445.0" y2="175.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="30.0" y1="92.0" x2="210.6" y2="128.1" stroke="#2b5fb4" stroke-width="2.5"/>
  <polygon points="221.1,130.2 206.8,133.1 209.0,122.0" fill="#2b5fb4"/>
  <text x="223.0" y="45.0" font-size="14" fill="#6b7280" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">t = INFINITY</text>
  <circle cx="221.1" cy="130.2" r="5.0" fill="#2b5fb4" stroke="#2b5fb4" stroke-width="1.5"/>
  <text x="217.1" y="116.2" font-size="14" fill="#2b5fb4" text-anchor="end" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">t = 1,9</text>
  <circle cx="347.1" cy="155.4" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="372.0" y="113.0" font-size="14" fill="#6b7280" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">t = 3,2</text>
  <circle cx="445.0" cy="175.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="455.0" y="165.0" font-size="14" fill="#6b7280" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">t = 4,2</text>
  <circle cx="30.0" cy="92.0" r="6.0" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/>
  <text x="30.0" y="76.0" font-size="15" fill="#1f2937" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">origin</text>
  <text x="300.0" y="30.0" font-size="15" fill="#2b5fb4" text-anchor="start">zu sehen: das kleinste t</text>
</svg>
