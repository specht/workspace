<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 250" width="480" height="250" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Ein Strahl beginnt bei origin und läuft in Richtung dir (Länge 1). Nach der Strecke t ist er bei origin + t · dir; dort trifft er den Rand der Kugel mit center und radius. Den Rand hinten trifft er auch, aber später; ein anderer Strahl geht an der Kugel vorbei.
       Gemacht von bilder/diagramme.py; auf der Seite mit style='width: 30em'.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raytracing/treffer.svg 960 -->
  <rect width="480" height="250" fill="#ffffff"/>
  <circle cx="330.0" cy="112.0" r="70.0" fill="#eef3fb" stroke="#1f2937" stroke-width="2.5"/>
