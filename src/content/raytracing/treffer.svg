<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Ein Strahl origin + t · dir trifft die Kugel um center mit radius dort, wo sein Abstand zu center radius ist: zweimal, vorn und hinten; der kleinere Wert t gilt.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raytracing/NAME.svg -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <circle cx="620.0" cy="215.0" r="120.0" fill="#eef3fb" stroke="#1f2937" stroke-width="2"/>
  <line x1="501.9" y1="236.4" x2="739.6" y2="205.5" stroke="#2b5fb4" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="739.6" y1="205.5" x2="858.6" y2="190.1" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="90.0" y1="290.0" x2="501.9" y2="236.4" stroke="#2b5fb4" stroke-width="3" marker-end="url(#a-blue)"/>
  <line x1="90.0" y1="330.0" x2="179.2" y2="318.4" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <text x="135.0" y="370.0" font-size="20" fill="#1f2937" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">dir, Länge 1</text>
  <line x1="620.0" y1="215.0" x2="549.4" y2="118.0" stroke="#1f2937" stroke-width="2"/>
  <text x="546.7" y="168.5" font-size="20" fill="#1f2937" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">radius</text>
  <circle cx="620.0" cy="215.0" r="5.0" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <text x="632.0" y="245.0" font-size="20" fill="#1f2937" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">center</text>
  <circle cx="501.9" cy="236.4" r="6.0" fill="#2b5fb4" stroke="#2b5fb4" stroke-width="2"/>
  <circle cx="739.6" cy="205.5" r="6.0" fill="#ffffff" stroke="#2b5fb4" stroke-width="2"/>
  <text x="431.9" y="278.4" font-size="20" fill="#2b5fb4" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">t (vorn)</text>
  <text x="773.6" y="179.5" font-size="18" fill="#6b7280" text-anchor="start">hinten</text>
  <circle cx="90.0" cy="290.0" r="7.0" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <text x="90.0" y="268.0" font-size="20" fill="#1f2937" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">origin</text>
  <text x="480.0" y="400.0" font-size="20" fill="#6b7280" text-anchor="middle">Treffpunkt: origin + t · dir</text>
</svg>
