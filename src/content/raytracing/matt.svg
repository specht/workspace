<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 573 242" width="573" height="242" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Matt spiegeln: Zur glatten Spiegelrichtung reflect(dir, n) kommt in jedem Durchgang ein zufälliger Vektor aus einer Kugel mit dem Radius rough. Jeder Durchgang spiegelt in eine etwas andere Richtung, im Mittel verschwimmt das Spiegelbild.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raytracing/NAME.svg 1146 -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="573" height="242" fill="#ffffff"/>
  <g transform="scale(0.55)">
  
  <rect x="80" y="360" width="800" height="40" fill="#eef3fb"/>
  <line x1="80.0" y1="360.0" x2="880.0" y2="360.0" stroke="#1f2937" stroke-width="4.05"/>
  <line x1="229.1" y1="206.1" x2="400.0" y2="360.0" stroke="#2b5fb4" stroke-width="4.05" marker-end="url(#a-blue)"/>
  <text x="219.1" y="194.1" font-size="28" fill="#2b5fb4" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">dir</text>
  <line x1="400.0" y1="360.0" x2="400.0" y2="210.0" stroke="#1f2937" stroke-width="3.375" marker-end="url(#a-ink)"/>
  <text x="388.0" y="204.0" font-size="28" fill="#1f2937" text-anchor="end" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">n</text>
  <circle cx="622.9" cy="159.3" r="78" fill="#eef3fb" stroke="#6b7280" stroke-width="2.025" stroke-dasharray="5 5"/>
  <line x1="400.0" y1="360.0" x2="622.9" y2="159.3" stroke="#6b7280" stroke-width="2.7" stroke-dasharray="7 5"/>
  <circle cx="622.9" cy="159.3" r="4.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.35"/>
  <text x="517.7" y="310.4" font-size="26" fill="#6b7280" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">reflect(dir, n)</text>
  <line x1="622.9" y1="159.3" x2="700.9" y2="159.3" stroke="#6b7280" stroke-width="2.025"/>
  <text x="710.9" y="165.3" font-size="26" fill="#6b7280" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">rough</text>
  <line x1="400.0" y1="360.0" x2="580.0" y2="110.9" stroke="#2b5fb4" stroke-width="3.375" marker-end="url(#a-blue)"/>
  <line x1="400.0" y1="360.0" x2="619.0" y2="202.2" stroke="#2b5fb4" stroke-width="2.025" marker-end="url(#a-blue)"/>
  <line x1="400.0" y1="360.0" x2="603.4" y2="167.1" stroke="#2b5fb4" stroke-width="2.025" marker-end="url(#a-blue)"/>
  <line x1="400.0" y1="360.0" x2="658.0" y2="112.5" stroke="#2b5fb4" stroke-width="2.025" marker-end="url(#a-blue)"/>
  <line x1="400.0" y1="360.0" x2="560.5" y2="171.0" stroke="#2b5fb4" stroke-width="2.025" marker-end="url(#a-blue)"/>
  <text x="568.0" y="100.9" font-size="26" fill="#2b5fb4" text-anchor="end">ein Durchgang</text>
  <text x="714.9" y="209.3" font-size="26" fill="#6b7280" text-anchor="start">jeder Durchgang ein</text>
  <text x="714.9" y="233.3" font-size="26" fill="#6b7280" text-anchor="start">anderer Punkt der Kugel</text>
