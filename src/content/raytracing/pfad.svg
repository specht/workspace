  <polygon points="440.0,22.0 450.1,31.6 440.2,35.9" fill="#2b5fb4"/>
  <text x="396.5" y="178.5" font-size="14" fill="#2b5fb4" text-anchor="start" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">bounce</text>
