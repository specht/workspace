<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 265" width="370" height="265" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Path Tracing: Ein Weg des Lichts, rückwärts verfolgt. Der Strahl vom Auge trifft den Boden im Schatten der Kugel; von dort geht ein zufälliger Strahl weiter und trifft die Wand in der Sonne, von dort wieder einer in den Himmel. An jeder Fläche zählt sunlight das Sonnenlicht, bounce bringt mit, wie hell es dort ist, wohin der zufällige Strahl geht.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raytracing/NAME.svg 740 -->
  <rect width="370" height="265" fill="#ffffff"/>
  <g transform="translate(-170 0)">
  <rect x="10.0" y="215.0" width="520.0" height="40.0" fill="#f3f4f6"/>
