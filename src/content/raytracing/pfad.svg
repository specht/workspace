  <text x="417.1" y="113.7" font-size="14" fill="#d97706" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">sunlight</text>
  <line x1="355.0" y1="55.0" x2="291.0" y2="205.5" stroke="#2b5fb4" stroke-width="2.2"/>
  <polygon points="287.0,215.0 287.1,201.1 297.0,205.3" fill="#2b5fb4"/>
