  <line x1="287.0" y1="215.0" x2="284.5" y2="200.4" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="279.5" y1="195.4" x2="289.5" y2="205.4" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="279.5" y1="205.4" x2="289.5" y2="195.4" stroke="#dc2626" stroke-width="2.2"/>
