<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Je flacher das Licht auf eine Fläche fällt, desto mehr Fläche teilt sich dasselbe Bündel: dot(normal, sun_dir) ist 1, wenn die Sonne senkrecht steht, und 0, wenn sie streift.
       Als Bild, hell und dunkel: src/scripts/render-svg.rb src/content/raytracing/NAME.svg -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="960" height="380" fill="#ffffff"/>
  <line x1="35.0" y1="300.0" x2="295.0" y2="300.0" stroke="#1f2937" stroke-width="3"/>
  <line x1="53.0" y1="300.0" x2="53.0" y2="180.0" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <text x="53.0" y="168.0" font-size="18" fill="#1f2937" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">normal</text>
  <line x1="131.0" y1="195.0" x2="131.0" y2="298.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#a-red)"/>
  <line x1="165.0" y1="195.0" x2="165.0" y2="298.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#a-red)"/>
  <line x1="199.0" y1="195.0" x2="199.0" y2="298.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#a-red)"/>
  <line x1="131.0" y1="310.0" x2="199.0" y2="310.0" stroke="#dc2626" stroke-width="5"/>
  <text x="165.0" y="350.0" font-size="20" fill="#1f2937" text-anchor="middle">senkrecht: dot = 1</text>
  <line x1="325.0" y1="300.0" x2="585.0" y2="300.0" stroke="#1f2937" stroke-width="3"/>
  <line x1="343.0" y1="300.0" x2="343.0" y2="180.0" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <text x="343.0" y="168.0" font-size="18" fill="#1f2937" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">normal</text>
  <line x1="481.2" y1="225.8" x2="406.9" y2="298.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#a-red)"/>
  <line x1="529.2" y1="225.8" x2="455.0" y2="298.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#a-red)"/>
  <line x1="577.3" y1="225.8" x2="503.1" y2="298.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#a-red)"/>
  <line x1="406.9" y1="310.0" x2="503.1" y2="310.0" stroke="#dc2626" stroke-width="5"/>
  <text x="455.0" y="350.0" font-size="20" fill="#1f2937" text-anchor="middle">schräg: dot ≈ 0,71</text>
  <line x1="615.0" y1="300.0" x2="875.0" y2="300.0" stroke="#1f2937" stroke-width="3"/>
  <line x1="633.0" y1="300.0" x2="633.0" y2="180.0" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <text x="633.0" y="168.0" font-size="18" fill="#1f2937" text-anchor="middle" font-family="0xProto Nerd Font Mono, DejaVu Sans Mono, monospace">normal</text>
  <line x1="744.3" y1="264.1" x2="645.6" y2="298.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#a-red)"/>
  <line x1="843.7" y1="264.1" x2="745.0" y2="298.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#a-red)"/>
  <line x1="943.1" y1="264.1" x2="844.4" y2="298.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#a-red)"/>
  <line x1="645.6" y1="310.0" x2="844.4" y2="310.0" stroke="#dc2626" stroke-width="5"/>
  <text x="745.0" y="350.0" font-size="20" fill="#1f2937" text-anchor="middle">flach: dot ≈ 0,34</text>
  <text x="480.0" y="34.0" font-size="20" fill="#6b7280" text-anchor="middle">dasselbe Bündel Sonnenlicht auf mehr Fläche: dot(normal, sun_dir) wird kleiner</text>
</svg>
