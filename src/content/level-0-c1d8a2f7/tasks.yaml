# Aufgaben zur versteckten Aktivität »Die Backrooms«.
# Format: docs/aufgaben.md. Die Vorlage wird nach /workspace/backrooms-starter
# geklont (specht/backrooms-starter).
format: 1
activity: level-0-c1d8a2f7
tasks:
  - id: geklont
    title: Die Vorlage ist da
    prompt: Die Backrooms-Vorlage liegt in `/workspace/backrooms-starter`.
    check:
      type: files
      path: backrooms-starter/level.ini
      expect:
        exists: true
    feedback:
      - when: { problem: missing }
        say: "`/workspace/backrooms-starter/level.ini` gibt es noch nicht. Klone die Vorlage wie oben beschrieben; als Ordner schlägt VS Code `/workspace/` vor, darin entsteht `backrooms-starter`."

  - id: tuer
    title: Eine Tür ins Nichts
    prompt: |
      Du legst `rooms/keller.room` an. In seinem Grundriss steht eine `1`,
      und darunter `[1]` mit `door = gang 6`. Im Gang gibt es aber keine `6`,
      und keine andere Datei nennt den Keller. Was passiert, wenn du die
      Vorschau neu lädst?
    check:
      type: choice
      options:
        - "Das Level lädt wie vorher, ohne Keller: Das Programm liest `keller.room` gar nicht."
        - "Oben links steht ein Fehler: Im Gang gibt es keine Tür `6`."
        - "Der Keller hängt an einer freien Stelle am Gang."
        - "Der Keller steht für sich allein, ohne Verbindung, neben dem Bauwerk."
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Den Fehler gäbe es, wenn das Programm `keller.room` läse. Aber woher weiß es, dass es die Datei gibt?
      - when: { picked: 2 }
        say: Wo ein Raum liegt, bestimmen nur seine Türen, und die müssen in beiden Räumen auf demselben Feld liegen.
      - when: { picked: 3 }
        say: Das Programm sucht nicht im Ordner `rooms` nach Dateien. Womit fängt es an, und wie findet es die nächsten Räume?
    solution: |
      Das Programm fängt beim Raum aus `start =` in `level.ini` an und liest
      danach nur Räume, zu denen eine Tür eines schon gelesenen Raums führt.
      Keine Tür führt zum Keller, also liest es `keller.room` nie, und was
      darin steht, spielt keine Rolle. Erst wenn der Gang `door = keller 1`
      oder eine `6` mit Tür bekommt, gibt es den Keller.

  - id: eigener-raum
    title: Ein Raum nach deiner Idee
    prompt: |
      In `rooms` liegt außer den Räumen der Vorlage und denen, die du auf
      dieser Seite gebaut hast (Kammer, Saal und Salon), ein Raum, den du
      selbst entworfen hast. Sein Name besteht aus Kleinbuchstaben, Ziffern, `-` und `_`, und
      er endet auf `.room`. Damit es ihn im Level gibt, braucht er eine Tür
      zu einem anderen Raum.
    file: backrooms-starter/rooms
    check:
      type: files
      path: backrooms-starter/rooms
      template: [blau.room, gang.room, rot.room, zimmer.room, kammer.room, saal.room, salon.room, vorgang.room, rampe.room, knick1.room, knick2.room, knick3.room, treppe.room, dachboden.room, schacht.room, bad.room]
      show: listing
      expect:
        new_files: { min: 1 }
        name: '^[a-z0-9_-]+\.room$'
    hint: Schreib zuerst den Grundriss in `[map]`, mit einer Ziffer in einer Wand, und dann in einem Raum, den es schon gibt, die passende Tür mit `door = name ziffer`.

