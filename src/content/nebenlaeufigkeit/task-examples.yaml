# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
format: 1
activity: nebenlaeufigkeit
examples:
  verlorene-erhoehung:
    pass:
      - answer: A B A B A B
      - answer: A A B B A B
    fail:
      - answer: A A A B B B
      - answer: A B A B
  deadlock:
    pass:
      - answer: A B
      - answer: B A
    fail:
      - answer: A A A A A A B B B B B B
      - answer: A A
  sicherer-zaehler:
    pass:
      - { files: { nebenlaeufigkeit/Counter.java: loesung/Counter.java } }
    fail:
      - { files: { nebenlaeufigkeit/Counter.java: { text: "public class Counter {\n    public static int countWithThreads(int threads, int times) { return 0; }\n}\n" } } }
    dart:
      pass:
        - { files: { nebenlaeufigkeit/bank.dart: loesung/bank.dart } }
      fail:
        # all deposits at once: one is lost, every time
        - { files: { nebenlaeufigkeit/bank.dart: loesung/bank-parallel.dart } }
  locks-im-code:
    pass:
      - { files: { nebenlaeufigkeit/Bank.java: loesung/Bank.java } }
    fail:
      # each thread takes its own account first and waits a moment: hangs every time
      - { files: { nebenlaeufigkeit/Bank.java: fehler/Bank-deadlock.java } }
    dart:
      pass:
        - { files: { nebenlaeufigkeit/bank.dart: loesung/bank-lock.dart } }
      fail:
        # all at once without the lock: one deposit lost, every time
        - { files: { nebenlaeufigkeit/bank.dart: fehler/bank-ohne-lock.dart } }
  arbeit-weitergeben:
    pass:
      - { files: { nebenlaeufigkeit/Buffer.java: loesung/Buffer.java } }
    fail:
      # without notifyAll a waiting thread is never woken: hangs every time
      - { files: { nebenlaeufigkeit/Buffer.java: fehler/Buffer-ohne-notify.java } }
    dart:
      pass:
        - { files: { nebenlaeufigkeit/primes.dart: loesung/primes.dart } }
      fail:
        - { files: { nebenlaeufigkeit/primes.dart: { text: "import 'dart:isolate';\n\nint countPrimes(int from, int to) => 0;\n\nFuture<int> countPrimesParallel(int limit, int parts) async => 0;\n" } } }
