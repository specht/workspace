  - id: locks-im-code
    title: Locks in fester Reihenfolge
    prompt: |
      Ändere `transfer` in `Bank.java` so, dass `run` nie hängen bleibt: Beide
      Threads sollen die Locks der zwei Konten in derselben Reihenfolge nehmen,
      erst das Konto mit der kleineren `id`, dann das andere. Am Ende muss
      weiter 200 auf beiden Konten zusammen stehen.
    check:
      type: java
      file: nebenlaeufigkeit/Bank.java
      timeout: 20
      slow: "`run` ist nicht fertig geworden: Die Threads warten aufeinander. Nehmen beide die Locks in derselben Reihenfolge, nach der `id` der Konten?"
      cases:
        - { call: "Bank.run(10)", expect: 200 }
        - { call: "Bank.run(100000)", expect: 200 }
    hint:
      - "Bestimme zuerst, welches der beiden Konten `from` und `to` die kleinere `id` hat. Dieses Konto ist `first`, das andere `second`; dann `synchronized (first)` außen und `synchronized (second)` innen."
      - "`Account first = from.id < to.id ? from : to;` und `Account second = first == from ? to : from;`. Am Rechnen innen ändert sich nichts."
    solution: |
      ```java
      static void transfer(Account from, Account to, int amount) {
          Account first = from.id < to.id ? from : to;
          Account second = first == from ? to : from;
          synchronized (first) {
              synchronized (second) {
                  from.balance -= amount;
                  to.balance += amount;
              }
          }
      }
      ```
      Jetzt will jeder Thread zuerst den Lock von Konto 1. Wer ihn hat, bekommt
      auch den zweiten; der andere wartet, ohne schon einen zu halten.
    dart:
      prompt: |
        Schreib in `bank.dart`, unter `deposit` und der Klasse `Lock`, eine Funktion
        `Future<int> depositAllAtOnce(List<int> amounts)`: Sie setzt `balance`
        auf 0, startet alle Einzahlungen zugleich mit `Future.wait`, aber jede
        über denselben `Lock`, damit keine verloren geht, und gibt dann `balance`
        zurück.
      check:
        type: dart
        file: nebenlaeufigkeit/bank.dart
        setup: |
          Future<List<String>> lockOrder() async {
            final lock = Lock();
            final order = <String>[];
            await Future.wait([
              lock.synchronized(() async { order.add('A an'); await Future.delayed(const Duration(milliseconds: 20)); order.add('A aus'); }),
              lock.synchronized(() async { order.add('B an'); order.add('B aus'); }),
            ]);
            return order;
          }
        cases:
          - { call: "depositAllAtOnce([5, 7])", expect: 12, say: "Mit 5 und 7 müssen 12 auf dem Konto sein. Geht jede Einzahlung über `lock.synchronized`?" }
          - { call: "depositAllAtOnce([1, 2, 3, 4])", expect: 10 }
          - { call: "lockOrder()", expect: "['A an', 'A aus', 'B an', 'B aus']", say: "Zwei Aktionen über denselben `Lock` dürfen sich nicht mischen: Die zweite beginnt erst, wenn die erste fertig ist. Ist die Klasse `Lock` noch so wie oben?" }
      hint:
        - "Ein `Lock` für alle Einzahlungen: `final lock = Lock();`. Jede Einzahlung meldest du mit `lock.synchronized(() => deposit(amount))` an."
        - "`await Future.wait([for (final amount in amounts) lock.synchronized(() => deposit(amount))]);`"
      solution: |
        ```dart
        Future<int> depositAllAtOnce(List<int> amounts) async {
          balance = 0;
          final lock = Lock();
          await Future.wait([for (final amount in amounts) lock.synchronized(() => deposit(amount))]);
          return balance;
        }
        ```

  - id: atomar
    title: Ohne eigenen Lock
    extra: true
    prompt: |
      Schreib in `/workspace/nebenlaeufigkeit/AtomicCounter.java` eine Klasse
      `AtomicCounter` mit `public static int countWithThreads(int threads, int times)`
      wie beim `Counter`, aber ohne `synchronized`: Der Zähler ist ein
      `AtomicInteger`, und jeder Thread zählt mit `incrementAndGet()`.
    check:
      type: java
      file: nebenlaeufigkeit/AtomicCounter.java
      timeout: 20
      cases:
        - { call: "AtomicCounter.countWithThreads(1, 10)", expect: 10 }
        - { call: "AtomicCounter.countWithThreads(4, 100000)", expect: 400000, say: "Vier Threads, je 100000-mal: Geht eine Erhöhung verloren, ist der Zähler kein `AtomicInteger`, oder es wird gezählt, bevor alle Threads fertig sind." }
        - { call: "AtomicCounter.countWithThreads(4, 100000)", expect: 400000 }
    hint:
      - "`AtomicInteger count = new AtomicInteger();` oben in der Methode, `import java.util.concurrent.atomic.AtomicInteger;` oben in der Datei. Ein Lambda darf `count` benutzen, weil sich die Variable selbst nie ändert, nur der Wert darin."
      - "Wie beim `Counter`: alle Threads starten, auf alle mit `join()` warten, dann `count.get()` zurückgeben."
    solution: |
      ```java
      import java.util.concurrent.atomic.AtomicInteger;

      public class AtomicCounter {
          public static int countWithThreads(int threads, int times) throws InterruptedException {
              AtomicInteger count = new AtomicInteger();
              Thread[] all = new Thread[threads];
              for (int t = 0; t < threads; t++) {
                  all[t] = new Thread(() -> {
                      for (int i = 0; i < times; i++) count.incrementAndGet();
                  });
                  all[t].start();
              }
              for (Thread thread : all) thread.join();
              return count.get();
          }
      }
      ```
    dart:
      prompt: |
        Schreib in `/workspace/nebenlaeufigkeit/visits.dart`, mit `visit` von oben
        und der Klasse `Lock` (kopier sie hinein), eine Funktion
        `Future<int> visitAll(String path, int n)`: Sie schreibt zuerst `0` in
        die Datei, startet dann `n` Besuche zugleich, jeden über denselben Lock,
        und gibt am Ende die Zahl aus der Datei zurück.
      check:
        type: dart
        file: nebenlaeufigkeit/visits.dart
        cases:
          - { call: "visitAll('/tmp/hs-visits-check.txt', 5)", expect: 5, say: "Fünf Besuche zugleich müssen 5 ergeben. Geht jeder Besuch über `lock.synchronized`?" }
          - { call: "visitAll('/tmp/hs-visits-check.txt', 1)", expect: 1 }
      hint:
        - "`await File(path).writeAsString('0');` setzt den Zähler zurück; oben in die Datei gehört `import 'dart:io';`."
        - "`await Future.wait([for (var i = 0; i < n; i++) lock.synchronized(() => visit(path))]);`, danach die Zahl mit `int.parse(await File(path).readAsString())` lesen."
      solution: |
        ```dart
        Future<int> visitAll(String path, int n) async {
          await File(path).writeAsString('0');
          final lock = Lock();
          await Future.wait([for (var i = 0; i < n; i++) lock.synchronized(() => visit(path))]);
          return int.parse(await File(path).readAsString());
        }
        ```

  - id: arbeit-weitergeben
    title: Arbeit weitergeben
    prompt: |
      Schreib in `/workspace/nebenlaeufigkeit/Buffer.java` einen Monitor `Buffer`:
      `new Buffer(capacity)` hat Platz für `capacity` Zahlen, `put(int x)` legt
      eine hinein und wartet, solange er voll ist, `take()` nimmt die älteste
      heraus und wartet, solange er leer ist. Dazu
      `public static int transfer(int n, int capacity)`: Ein Thread legt die
      Zahlen 1 bis `n` hinein, ein zweiter nimmt `n` Zahlen heraus und zählt
      sie zusammen; die Methode wartet auf beide und gibt die Summe zurück.
    check:
      type: java
      file: nebenlaeufigkeit/Buffer.java
      timeout: 20
      slow: "`transfer` ist nicht fertig geworden: Ein Thread wartet und wird nicht wieder geweckt. Ruft `put` und `take` nach jeder Änderung `notifyAll()` auf?"
      cases:
        - { call: "Buffer.transfer(10, 1)", expect: 55, say: "Mit Platz für nur eine Zahl müssen beide Threads abwechselnd warten." }
        - { call: "Buffer.transfer(1000, 3)", expect: 500500 }
        - { call: "Buffer b = new Buffer(2); b.put(4); b.put(7); b.take()", expect: 4, say: "`take` gibt die Zahl zurück, die am längsten im Puffer liegt." }
    hint:
      - "Ein Array `items` mit `capacity` Plätzen, dazu `count` (wie viele drin sind) und `first` (wo die älteste liegt). Die nächste freie Stelle ist `(first + count) % items.length`."
      - "`put` und `take` sind `synchronized`, warten mit `while (…) wait();` und rufen am Ende `notifyAll()` auf. In `transfer` zählt der zweite Thread in ein `int[] sum = { 0 }`, denn eine lokale Variable kann ein Lambda nicht ändern."
    solution: |
      ```java
      public synchronized void put(int x) throws InterruptedException {
          while (count == items.length) {
              wait();
          }
          items[(first + count) % items.length] = x;
          count++;
          notifyAll();
      }

      public synchronized int take() throws InterruptedException {
          while (count == 0) {
              wait();
          }
          int x = items[first];
          first = (first + 1) % items.length;
          count--;
          notifyAll();
          return x;
      }
      ```
    dart:
      prompt: |
        Schreib in `/workspace/nebenlaeufigkeit/primes.dart`, unter `countPrimes`,
        eine Funktion `Future<int> countPrimesParallel(int limit, int parts)`: Sie
        teilt die Zahlen von 0 bis vor `limit` in `parts` Stücke, zählt jedes Stück
        mit `countPrimes` in einem eigenen Isolate und gibt die Summe zurück.
      check:
        type: dart
        file: nebenlaeufigkeit/primes.dart
        timeout: 20
        cases:
          - { call: "countPrimesParallel(100, 1)", expect: 25 }
          - { call: "countPrimesParallel(100000, 4)", expect: 9592 }
          - { call: "countPrimesParallel(100000, 3)", expect: 9592, say: "100000 lässt sich nicht in drei gleiche Stücke teilen: Fehlt am Ende ein Stück, oder zählt eines doppelt?" }
          - { call: "countPrimesParallel(10, 4)", expect: 4 }
      hint:
        - "Ein Stück ist `size = (limit + parts - 1) ~/ parts` Zahlen lang; Stück `p` geht von `p * size` bis vor `(p + 1) * size`, das letzte nur bis `limit`."
        - "`await Future.wait([for (var p = 0; p < parts; p++) Isolate.run(() => countPrimes(…, …))])` gibt die Zahlen der Stücke als Liste; die Summe bekommst du mit `fold`."
      solution: |
        ```dart
        Future<int> countPrimesParallel(int limit, int parts) async {
          final size = (limit + parts - 1) ~/ parts;
          final counts = await Future.wait([
            for (var p = 0; p < parts; p++)
              Isolate.run(() => countPrimes(p * size, (p + 1) * size < limit ? (p + 1) * size : limit)),
          ]);
          return counts.fold<int>(0, (sum, c) => sum + c);
        }
        ```

  - id: weitergeben-fertig
    title: Was es schon gibt
    prompt: |
      Schreib in `/workspace/nebenlaeufigkeit/Pipeline.java` eine Klasse `Pipeline`
      mit `public static int transfer(int n, int capacity)`, die dasselbe tut wie
      `Buffer.transfer`, aber mit einer `ArrayBlockingQueue<Integer>` statt
      deines eigenen Puffers.
    check:
      type: java
      file: nebenlaeufigkeit/Pipeline.java
      timeout: 20
      slow: "`transfer` ist nicht fertig geworden: Nimmt der zweite Thread genau `n` Zahlen heraus, so viele, wie der erste hineinlegt?"
      cases:
        - { call: "Pipeline.transfer(10, 1)", expect: 55 }
        - { call: "Pipeline.transfer(1000, 3)", expect: 500500 }
    hint:
      - "`BlockingQueue<Integer> queue = new ArrayBlockingQueue<>(capacity);`, dazu oben `import java.util.concurrent.ArrayBlockingQueue;` und `import java.util.concurrent.BlockingQueue;`."
      - "Der Rest bleibt wie in `Buffer.transfer`: `queue.put(i)` im einen Thread, `queue.take()` im anderen."
    dart:
      prompt: |
        Schreib in `/workspace/nebenlaeufigkeit/stream.dart` eine Funktion
        `Future<int> transfer(int n)`: Ein Teil legt die Zahlen 1 bis `n` in einen
        `StreamController<int>` und schließt ihn dann, ein anderer holt sie mit
        `await for` ab und zählt sie zusammen; die Funktion gibt die Summe zurück.
      check:
        type: dart
        file: nebenlaeufigkeit/stream.dart
        cases:
          - { call: "transfer(10)", expect: 55 }
          - { call: "transfer(1000)", expect: 500500 }
          - { call: "transfer(0)", expect: 0, say: "Ohne Zahlen ist die Summe 0. Wird der `StreamController` auch dann geschlossen?" }
      hint:
        - "Der Teil, der hineinlegt, ist eine eigene `async`-Funktion, die du startest, ohne auf sie zu warten. Am Ende ruft sie `controller.close()` auf, sonst wartet `await for` ewig."
        - "`await for (final x in controller.stream) { sum += x; }` zählt; oben in die Datei gehört `import 'dart:async';`."
      solution: |
        ```dart
        Future<int> transfer(int n) async {
          final controller = StreamController<int>();
          Future<void> produce() async {
            for (var i = 1; i <= n; i++) {
              controller.add(i);
              await Future.delayed(Duration.zero);
            }
            await controller.close();
          }

          produce();
          var sum = 0;
          await for (final x in controller.stream) {
            sum += x;
          }
          return sum;
        }
        ```

  - id: mehrere-kerne
    title: Mehrere Kerne
    prompt: |
      Schreib in `/workspace/nebenlaeufigkeit/Primes.java`, in der Klasse `Primes`
      mit `countPrimes` von oben, eine Methode
      `public static int countPrimesParallel(int limit, int parts)`: Sie teilt die
      Zahlen von 0 bis vor `limit` in `parts` Stücke, gibt jedes einem Thread-Pool
      mit `parts` Threads und zählt die Ergebnisse zusammen.
    check:
      type: java
      file: nebenlaeufigkeit/Primes.java
      timeout: 20
      cases:
        - { call: "Primes.countPrimesParallel(100, 1)", expect: 25 }
        - { call: "Primes.countPrimesParallel(100000, 4)", expect: 9592 }
        - { call: "Primes.countPrimesParallel(100000, 3)", expect: 9592, say: "100000 lässt sich nicht in drei gleiche Stücke teilen: Fehlt am Ende ein Stück, oder zählt eines doppelt?" }
        - { call: "Primes.countPrimesParallel(10, 4)", expect: 4 }
    hint:
      - "Ein Stück ist `size = (limit + parts - 1) / parts` Zahlen lang; Stück `p` geht von `p * size` bis vor `Math.min(limit, (p + 1) * size)`. Merk dir die beiden Grenzen in Variablen, bevor du sie im Lambda benutzt."
      - "`pool.submit(() -> countPrimes(from, to))` gibt ein `Future<Integer>`; sammle sie in einer `List<Future<Integer>>`, zähle danach mit `get()` zusammen und ruf `pool.shutdown()` auf. Weil `get()` Ausnahmen werfen kann, braucht die Methode `throws Exception`."
    solution: |
      ```java
      public static int countPrimesParallel(int limit, int parts) throws Exception {
          ExecutorService pool = Executors.newFixedThreadPool(parts);
          int size = (limit + parts - 1) / parts;
          List<Future<Integer>> results = new ArrayList<>();
          for (int p = 0; p < parts; p++) {
              int from = p * size;
              int to = Math.min(limit, (p + 1) * size);
              results.add(pool.submit(() -> countPrimes(from, to)));
          }
          int sum = 0;
          for (Future<Integer> result : results) {
              sum += result.get();
          }
          pool.shutdown();
          return sum;
      }
      ```
    dart:
      prompt: |
        Schreib in `primes.dart` eine Funktion `int countPrimesStep(int from, int step, int limit)`,
        die zählt, wie viele der Zahlen `from`, `from + step`, `from + 2·step` … bis
        vor `limit` Primzahlen sind. Dann `Future<int> countPrimesFair(int limit, int parts)`:
        Isolate `p` zählt mit `countPrimesStep(p, parts, limit)`, und die Funktion
        gibt die Summe zurück.
      check:
        type: dart
        file: nebenlaeufigkeit/primes.dart
        timeout: 20
        cases:
          - { call: "countPrimesStep(1, 2, 20)", expect: 7, say: "Von 1, 3, 5 … 19 sind 3, 5, 7, 11, 13, 17 und 19 Primzahlen, also 7." }
          - { call: "countPrimesFair(100, 1)", expect: 25 }
          - { call: "countPrimesFair(100000, 4)", expect: 9592 }
          - { call: "countPrimesFair(100000, 3)", expect: 9592 }
          - { call: "countPrimesFair(10, 4)", expect: 4 }
      hint:
        - "`countPrimesStep`: eine Schleife `for (var n = from; n < limit; n += step)`; ob `n` eine Primzahl ist, sagt dir `countPrimes(n, n + 1)` (1 oder 0)."
        - "`countPrimesFair` wie `countPrimesParallel`, nur ruft jedes Isolate `countPrimesStep(p, parts, limit)` auf."
      solution: |
        ```dart
        int countPrimesStep(int from, int step, int limit) {
          var count = 0;
          for (var n = from; n < limit; n += step) {
            count += countPrimes(n, n + 1);
          }
          return count;
        }

        Future<int> countPrimesFair(int limit, int parts) async {
          final counts = await Future.wait([
            for (var p = 0; p < parts; p++) Isolate.run(() => countPrimesStep(p, parts, limit)),
          ]);
          return counts.fold<int>(0, (sum, c) => sum + c);
        }
        ```
