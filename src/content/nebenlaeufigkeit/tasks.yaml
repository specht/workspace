# Aufgaben zu »Nebenläufigkeit«. Format: docs/aufgaben.md.
format: 1
activity: nebenlaeufigkeit
tasks:
  - id: verlorene-erhoehung
    title: Eine Erhöhung geht verloren
    prompt: |
      Beide Threads erhöhen den Zähler um eins. Finde eine Reihenfolge der
      sechs Schritte, nach der `counter` am Ende 1 ist und nicht 2.
    check:
      type: interleaving
      shared: { counter: 0 }
      threads:
        A: ["a ← counter", "a ← a + 1", "counter ← a"]
        B: ["b ← counter", "b ← b + 1", "counter ← b"]
      goal: counter == 1
    feedback:
      - when: { problem: goal }
        say: Hier ist jede Erhöhung angekommen. Wann müsste B den Zähler lesen, damit es den neuen Wert von A noch nicht sieht?
    hint:
      - Wann liest B den Zähler, und was hat A bis dahin schon zurückgeschrieben?
      - Lass beide Threads lesen, bevor einer schreibt.

  - id: reihenfolgen-ohne-verlust
    title: Wie oft geht es gut?
    prompt: |
      Es gibt 20 Reihenfolgen der sechs Schritte, in denen jeder Thread seine
      drei Zeilen der Reihe nach ausführt. In wie vielen davon ist `counter`
      am Ende 2?
    check:
      type: number
      expect: 2
    hint: Damit nichts verloren geht, muss ein Thread seinen Wert zurückgeschrieben haben, bevor der andere liest. Wie viele Reihenfolgen erlauben das?
    solution: |
      Nur in zweien: A ganz vor B und B ganz vor A. Sobald sich die Schritte
      mischen, liest ein Thread, bevor der andere geschrieben hat.

  - id: deadlock
    title: Keiner kommt weiter
    prompt: Finde eine Reihenfolge, nach der keiner der beiden Threads mehr einen Schritt machen kann.
    check:
      type: interleaving
      shared: { x: 10, y: 10 }
      locks: [m, n]
      threads:
        A: ["lock m", "lock n", "x ← x - 5", "y ← y + 5", "unlock n", "unlock m"]
        B: ["lock n", "lock m", "y ← y - 3", "x ← x + 3", "unlock m", "unlock n"]
      goal: deadlock
    hint: Jeder Thread braucht beide Locks. Was passiert, wenn jeder schon einen hat?

  - id: was-kommt-heraus
    title: Was kommt heraus?
    prediction: true
    prompt: |
      Was gibt das Programm `Race` aus? Überleg zuerst, dann probier es mehrmals
      aus: Leg `Race.java` in `/workspace/nebenlaeufigkeit` und führe es mit
      `java Race.java` aus.
    check:
      type: choice
      options:
        - 'Immer 200000: Jeder Thread zählt hunderttausendmal.'
        - 'Bei jedem Lauf eine andere Zahl, meist weniger als 200000.'
        - 'Immer 100000: Die beiden Threads zählen dieselben Erhöhungen.'
        - 'Eine Fehlermeldung, weil zwei Threads dieselbe Variable ändern.'
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: 'Denk an das Widget: Aus wie vielen Schritten besteht `count++`, und was passiert, wenn beide Threads zwischen Lesen und Schreiben aufeinandertreffen?'
      - when: { picked: 3 }
        say: 'Java meldet keinen Fehler. Es merkt nicht, dass eine Erhöhung verloren geht. Probier es aus.'
    solution: |
      Eine andere Zahl bei jedem Lauf, meist weniger als 200000: Jedes Mal,
      wenn beide Threads zwischen Lesen und Schreiben aufeinandertreffen,
      geht eine Erhöhung verloren.
    dart:
      prompt: |
        Was gibt `print(balance)` aus, nachdem `Future.wait([deposit(5), deposit(7)])`
        fertig ist? Überleg zuerst, dann probier es aus, in einer Datei
        `/workspace/nebenlaeufigkeit/bank.dart` mit einem `main`, das
        `async` ist, und `dart run bank.dart`.
      check:
        type: choice
        options:
          - '12: Beide Einzahlungen kommen an.'
          - '7, bei jedem Lauf.'
          - 'Mal 5, mal 7, je nachdem, welche Einzahlung zuerst fertig wird.'
          - 'Eine Fehlermeldung, weil zwei Aufrufe dieselbe Variable ändern.'
        correct: 1
      feedback:
        - when: { picked: 0 }
          say: 'Was hat `deposit(7)` in `before` gelesen, als es angefangen hat? War `deposit(5)` da schon fertig?'
        - when: { picked: 2 }
          say: 'Dart macht immer nur eins auf einmal, und `save` braucht für beide gleich lang. Welche Einzahlung schreibt zuletzt?'
      solution: |
        7, jedes Mal: Beide lesen 0, bevor eine zurückschreibt; die zweite
        schreibt zuletzt.

  - id: sicherer-zaehler
    title: Ein Zähler, der nichts verliert
    prompt: |
      Schreib in `/workspace/nebenlaeufigkeit/Counter.java` eine Klasse `Counter`
      mit einer Methode `increment()`, die den Zähler um eins erhöht, und einer
      Methode `get()`, die ihn zurückgibt; beide `synchronized`. Dazu
      `public static int countWithThreads(int threads, int times)`: Sie
      startet `threads` Threads, von denen jeder `times`-mal `increment()` auf
      demselben `Counter` aufruft, wartet mit `join()` auf alle und gibt dann
      den Zählerstand zurück.
    check:
      type: java
      file: nebenlaeufigkeit/Counter.java
      timeout: 20
      cases:
        - { call: "Counter.countWithThreads(1, 10)", expect: 10 }
        - { call: "Counter.countWithThreads(2, 100000)", expect: 200000, say: "Zwei Threads, je 100000-mal: Geht eine Erhöhung verloren, ist `increment` nicht `synchronized`, oder es wird gezählt, bevor alle Threads fertig sind." }
        - { call: "Counter.countWithThreads(4, 100000)", expect: 400000, say: "Vier Threads, je 100000-mal: Geht eine Erhöhung verloren, ist `increment` nicht `synchronized`, oder es wird gezählt, bevor alle Threads fertig sind." }
        - { call: "Counter.countWithThreads(4, 100000)", expect: 400000, say: "Ein zweiter Lauf mit vier Threads: Ein Lost Update zeigt sich nicht bei jedem Lauf." }
    hint:
      - "Ein Thread bekommt seine Arbeit als Lambda: `new Thread(() -> { for (int i = 0; i < times; i++) counter.increment(); })`. Merk dir alle Threads in einem Array `Thread[]`, damit du danach auf jeden mit `join()` warten kannst."
      - "Erst alle starten, dann auf alle warten: zwei Schleifen. Weil `join()` unterbrochen werden kann, braucht `countWithThreads` `throws InterruptedException`."
    solution: |
      ```java
      public class Counter {
          private int count = 0;

          public synchronized void increment() {
              count++;
          }

          public synchronized int get() {
              return count;
          }

          public static int countWithThreads(int threads, int times) throws InterruptedException {
              Counter counter = new Counter();
              Thread[] all = new Thread[threads];
              for (int t = 0; t < threads; t++) {
                  all[t] = new Thread(() -> {
                      for (int i = 0; i < times; i++) {
                          counter.increment();
                      }
                  });
                  all[t].start();
              }
              for (Thread thread : all) {
                  thread.join();
              }
              return counter.get();
          }
      }
      ```
    dart:
      prompt: |
        Schreib in `/workspace/nebenlaeufigkeit/bank.dart`, unter `balance`, `save`
        und `deposit` von oben, eine Funktion `Future<int> depositAll(List<int> amounts)`:
        Sie setzt `balance` auf 0, zahlt jeden Betrag mit `deposit` ein, ohne
        dass einer verloren geht, und gibt dann `balance` zurück.
      check:
        type: dart
        file: nebenlaeufigkeit/bank.dart
        cases:
          - { call: "depositAll([5, 7])", expect: 12, say: "Mit 5 und 7 müssen 12 auf dem Konto sein. Laufen die Einzahlungen zugleich, mit `Future.wait`, liest jede den alten Stand." }
          - { call: "depositAll([1, 2, 3, 4])", expect: 10 }
          - { call: "depositAll([])", expect: 0 }
      hint:
        - "Starte die nächste Einzahlung erst, wenn die vorige fertig ist."
        - "Eine Schleife `for (final amount in amounts)` mit `await deposit(amount);` darin."
      solution: |
        ```dart
        Future<int> depositAll(List<int> amounts) async {
          balance = 0;
          for (final amount in amounts) {
            await deposit(amount);
          }
          return balance;
        }
        ```

  - id: locks-im-code
    title: Locks in fester Reihenfolge
    prompt: |
      Ändere `transfer` in `Bank.java` so, dass `run` nie hängen bleibt: Beide
      Threads sollen die Locks der zwei Konten in derselben Reihenfolge nehmen,
      erst das Konto mit der kleineren `id`, dann das andere. Am Ende muss
      weiter 200 auf beiden Konten zusammen stehen.
    check:
      type: java
      file: nebenlaeufigkeit/Bank.java
      timeout: 20
      slow: "`run` ist nicht fertig geworden: Die Threads warten aufeinander. Nehmen beide die Locks in derselben Reihenfolge, nach der `id` der Konten?"
      cases:
        - { call: "Bank.run(10)", expect: 200 }
        - { call: "Bank.run(100000)", expect: 200 }
    hint:
      - "Bestimme zuerst, welches der beiden Konten `from` und `to` die kleinere `id` hat. Dieses Konto ist `first`, das andere `second`; dann `synchronized (first)` außen und `synchronized (second)` innen."
      - "`Account first = from.id < to.id ? from : to;` und `Account second = first == from ? to : from;`. Am Rechnen innen ändert sich nichts."
    solution: |
      ```java
      static void transfer(Account from, Account to, int amount) {
          Account first = from.id < to.id ? from : to;
          Account second = first == from ? to : from;
          synchronized (first) {
              synchronized (second) {
                  from.balance -= amount;
                  to.balance += amount;
              }
          }
      }
      ```
      Jetzt will jeder Thread zuerst den Lock von Konto 1. Wer ihn hat, bekommt
      auch den zweiten; der andere wartet, ohne schon einen zu halten.
    dart:
      prompt: |
        Schreib in `bank.dart`, unter `deposit` und der Klasse `Lock`, eine Funktion
        `Future<int> depositAllAtOnce(List<int> amounts)`: Sie setzt `balance`
        auf 0, startet alle Einzahlungen zugleich mit `Future.wait`, aber jede
        über denselben `Lock`, damit keine verloren geht, und gibt dann `balance`
        zurück.
      check:
        type: dart
        file: nebenlaeufigkeit/bank.dart
        setup: |
          Future<List<String>> lockOrder() async {
            final lock = Lock();
            final order = <String>[];
            await Future.wait([
              lock.synchronized(() async { order.add('A an'); await Future.delayed(const Duration(milliseconds: 20)); order.add('A aus'); }),
              lock.synchronized(() async { order.add('B an'); order.add('B aus'); }),
            ]);
            return order;
          }
        cases:
          - { call: "depositAllAtOnce([5, 7])", expect: 12, say: "Mit 5 und 7 müssen 12 auf dem Konto sein. Geht jede Einzahlung über `lock.synchronized`?" }
          - { call: "depositAllAtOnce([1, 2, 3, 4])", expect: 10 }
          - { call: "lockOrder()", expect: "['A an', 'A aus', 'B an', 'B aus']", say: "Zwei Aktionen über denselben `Lock` dürfen sich nicht mischen: Die zweite beginnt erst, wenn die erste fertig ist. Ist die Klasse `Lock` noch so wie oben?" }
      hint:
        - "Ein `Lock` für alle Einzahlungen: `final lock = Lock();`. Jede Einzahlung meldest du mit `lock.synchronized(() => deposit(amount))` an."
        - "`await Future.wait([for (final amount in amounts) lock.synchronized(() => deposit(amount))]);`"
      solution: |
        ```dart
        Future<int> depositAllAtOnce(List<int> amounts) async {
          balance = 0;
          final lock = Lock();
          await Future.wait([for (final amount in amounts) lock.synchronized(() => deposit(amount))]);
          return balance;
        }
        ```

  - id: arbeit-weitergeben
    title: Arbeit weitergeben
    prompt: |
      Schreib in `/workspace/nebenlaeufigkeit/Buffer.java` einen Monitor `Buffer`:
      `new Buffer(capacity)` hat Platz für `capacity` Zahlen, `put(int x)` legt
      eine hinein und wartet, solange er voll ist, `take()` nimmt die älteste
      heraus und wartet, solange er leer ist. Dazu
      `public static int transfer(int n, int capacity)`: Ein Thread legt die
      Zahlen 1 bis `n` hinein, ein zweiter nimmt `n` Zahlen heraus und zählt
      sie zusammen; die Methode wartet auf beide und gibt die Summe zurück.
    check:
      type: java
      file: nebenlaeufigkeit/Buffer.java
      timeout: 20
      slow: "`transfer` ist nicht fertig geworden: Ein Thread wartet und wird nicht wieder geweckt. Ruft `put` und `take` nach jeder Änderung `notifyAll()` auf?"
      cases:
        - { call: "Buffer.transfer(10, 1)", expect: 55, say: "Mit Platz für nur eine Zahl müssen beide Threads abwechselnd warten." }
        - { call: "Buffer.transfer(1000, 3)", expect: 500500 }
        - { call: "Buffer b = new Buffer(2); b.put(4); b.put(7); b.take()", expect: 4, say: "`take` gibt die Zahl zurück, die am längsten im Puffer liegt." }
    hint:
      - "Ein Array `items` mit `capacity` Plätzen, dazu `count` (wie viele drin sind) und `first` (wo die älteste liegt). Die nächste freie Stelle ist `(first + count) % items.length`."
      - "`put` und `take` sind `synchronized`, warten mit `while (…) wait();` und rufen am Ende `notifyAll()` auf. In `transfer` zählt der zweite Thread in ein `int[] sum = { 0 }`, denn eine lokale Variable kann ein Lambda nicht ändern."
    solution: |
      ```java
      public synchronized void put(int x) throws InterruptedException {
          while (count == items.length) {
              wait();
          }
          items[(first + count) % items.length] = x;
          count++;
          notifyAll();
      }

      public synchronized int take() throws InterruptedException {
          while (count == 0) {
              wait();
          }
          int x = items[first];
          first = (first + 1) % items.length;
          count--;
          notifyAll();
          return x;
      }
      ```
    dart:
      prompt: |
        Schreib in `/workspace/nebenlaeufigkeit/primes.dart`, unter `countPrimes`,
        eine Funktion `Future<int> countPrimesParallel(int limit, int parts)`: Sie
        teilt die Zahlen von 0 bis vor `limit` in `parts` Stücke, zählt jedes Stück
        mit `countPrimes` in einem eigenen Isolate und gibt die Summe zurück.
      check:
        type: dart
        file: nebenlaeufigkeit/primes.dart
        timeout: 20
        cases:
          - { call: "countPrimesParallel(100, 1)", expect: 25 }
          - { call: "countPrimesParallel(100000, 4)", expect: 9592 }
          - { call: "countPrimesParallel(100000, 3)", expect: 9592, say: "100000 lässt sich nicht in drei gleiche Stücke teilen: Fehlt am Ende ein Stück, oder zählt eines doppelt?" }
          - { call: "countPrimesParallel(10, 4)", expect: 4 }
      hint:
        - "Ein Stück ist `size = (limit + parts - 1) ~/ parts` Zahlen lang; Stück `p` geht von `p * size` bis vor `(p + 1) * size`, das letzte nur bis `limit`."
        - "`await Future.wait([for (var p = 0; p < parts; p++) Isolate.run(() => countPrimes(…, …))])` gibt die Zahlen der Stücke als Liste; die Summe bekommst du mit `fold`."
      solution: |
        ```dart
        Future<int> countPrimesParallel(int limit, int parts) async {
          final size = (limit + parts - 1) ~/ parts;
          final counts = await Future.wait([
            for (var p = 0; p < parts; p++)
              Isolate.run(() => countPrimes(p * size, (p + 1) * size < limit ? (p + 1) * size : limit)),
          ]);
          return counts.fold<int>(0, (sum, c) => sum + c);
        }
        ```
