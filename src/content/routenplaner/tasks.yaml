            expect: "['1', '3']"
            say: 'Den Fußweg von 2 nach 4 darf ein Auto nicht fahren. Er steht nicht in SPEEDS[''car''].'
          - call: '[e[0] for e in build_travel_graph(read_ways(''routenplaner-starter/data/test.tsv''), ''car'')[''edges''][''5'']]'
            expect: "['4']"
            say: 'Der Birkenweg ist eine Einbahnstraße (yes) in Richtung seiner Punkte, 3 → 5 → 4. Von 5 geht es mit dem Auto nur nach 4.'
          - call: 'list(build_travel_graph(read_ways(''routenplaner-starter/data/test.tsv''), ''car'')[''edges''].get(''4'', []))'
            expect: '[]'
            say: 'Von 4 kommt ein Auto nicht weg, gegen die Einbahnstraße nicht und den Fußweg nicht.'
          - call: 'abs(build_travel_graph(read_ways(''routenplaner-starter/data/test.tsv''), ''car'')[''edges''][''1''][0][1] - 9.76) < 0.05'
            expect: true
            say: 'An jeder Kante stehen Sekunden. 67,8 Meter mit 25 km/h, das sind 25 / 3,6 Meter je Sekunde, dauern knapp 10 Sekunden.'
          - call: 'abs(build_travel_graph(read_ways(''routenplaner-starter/data/test.tsv''), ''car'')[''fastest''] - 25.0) < 0.001'
            expect: true
            say: 'fastest ist das größte Tempo in SPEEDS[''car''], in Metern je Sekunde, 90 km/h also 25 m/s.'
          - call: '[e[0] for e in build_travel_graph(read_ways(''routenplaner-starter/data/test.tsv''), ''bike'')[''edges''][''4'']]'
