  - id: kanten
    title: Wenige Kanten, langer Weg
    prompt: Die Breitensuche findet den Weg mit den wenigsten Kanten. Warum ist das auf einer Karte oft nicht der kürzeste Weg?
    check:
      type: choice
      options:
        - Die Kanten sind verschieden lang. Ein langes gerades Stück ist eine Kante, eine kurze Kurve mit vielen Punkten sind viele.
        - Die Breitensuche nimmt die Nachbarn in zufälliger Reihenfolge.
        - Die Breitensuche hört zu früh auf, bevor sie alle Wege gesehen hat.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Die Reihenfolge der Nachbarn ist fest, sie steht so in edges. Auch in anderer Reihenfolge fände sie einen Weg mit genauso wenigen Kanten.
      - when: { picked: 2 }
        say: Sie hört auf, wenn sie das Ziel aus der Queue nimmt, und dann gibt es wirklich keinen Weg mit weniger Kanten. Nur zählt sie Kanten, keine Meter.
    solution: |
      Die Breitensuche zählt Kanten, nicht Meter. Eine Straße ist auf der Karte
      eine Kette vieler Punkte: eine kurze Kurve hat viele Kanten, eine lange
      Gerade wenige. Dijkstra rechnet mit der Länge jeder Kante und findet darum
      den kürzesten Weg in Metern.

  - id: dijkstra
    title: Dijkstra
    prompt: Schreib `dijkstra` in `routes.rb`. Alles über die Daten deiner Funktionen [auf einen Blick](#auf-einen-blick).
    check:
      type: ruby
      file: routenplaner-starter/ruby/routes.rb
      cases:
        - call: dijkstra(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '16')[:path]
          expect: "['11', '12', '13', '14', '15', '16']"
          say: Die Lindenstraße hat mehr Kanten, ist aber nur 340 Meter lang, der Eichenweg fast 800.
        - call: dijkstra(build_graph(read_ways('routenplaner-starter/data/shortcut.tsv')), '41', '45')[:path]
          expect: "['41', '43', '44', '45']"
          say: Auf der Testkarte `data/shortcut.tsv` findet die Suche den Knoten 44 zuerst über 42, nach 600 Metern; über 43 sind es nur 500. Auch ein Knoten, der schon gefunden ist, bekommt einen neuen Abstand und Vorgänger, wenn ein kürzerer Weg zu ihm führt.
        - call: dijkstra(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '11')[:path]
          expect: "['11']"
        - call: dijkstra(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '31')[:path]
          expect: ~
          say: Zum Fußweg 31-32 führt nichts hin; wenn nichts mehr in frontier steht, gibt es keinen Weg.
        - call: dijkstra(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '16')[:visited].first
          expect: "'11'"
        - call: dijkstra(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '16')[:visited].last
          expect: "'16'"
          say: Ist das Ziel dran, steht sein Abstand fest. Die Suche hört dann auf, das Ziel ist der letzte besuchte Knoten.
        - call: dijkstra(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '16')[:visited].include?('22')
          expect: false
          say: Der Knoten 22 ist über 550 Meter vom Start weg, das Ziel nur 340. Bevor er dran wäre, ist die Suche schon fertig.
    hint:
      - |
        Auf `data/detour.tsv` von 11 nach 16: Die Lindenstraße hat fünf Kanten, der
        Eichenweg drei. Welcher Weg ist kürzer in Metern? Im Handbuch unter
        »Dijkstra« kannst du die Suche durchklicken; achte darauf, welcher Knoten
        jeweils als Nächster drankommt und wann sich ein Abstand noch ändert. Auf
        `data/shortcut.tsv` von 41 nach 45 ändert sich ein Abstand: Über welchen
        Nachbarn findet die Suche den Knoten 44 zuerst, und über welchen ist der
        Weg zu ihm kürzer?
      - |
        Gegenüber deiner Breitensuche ändert sich zweierlei. Statt der Queue gibt es
        `frontier`, einen Hash von Knoten zu Metern, und als Nächstes kommt der mit
        den wenigsten Metern (`min_by`). Und ein Nachbar wird nicht nur eingetragen,
        wenn er neu ist, sondern auch, wenn der Weg über diesen Knoten kürzer ist als
        der bisher beste, der in `metres` steht.
      - |
        Ein Gerüst:

        ```ruby
        def dijkstra(graph, start, goal)
            metres = { start => 0 }
            previous = { start => nil }
            frontier = { start => 0 }
            visited = []
            until frontier.empty?
                node, so_far = frontier.min_by { |_id, m| m }
                frontier.delete(node)
                visited << node
                break if node == goal

                graph[:edges][node].each do |neighbour, length|
                    total = so_far + length
                    # hier: ist neighbour neu, oder ist total kürzer als metres[neighbour]?
                    # Dann neuer Abstand, neuer Vorgänger, und neighbour in frontier
                end
            end
            { path: path_to(previous, goal), visited: visited }
        end
        ```
