# Aufgaben zu »Ein Routenplaner für Berlin«. Format: docs/aufgaben.md.
# Alles liegt in /workspace/routenplaner-starter; die Prüfungen lesen die
# kleine Testkarte data/test.tsv (fünf Kreuzungen: der Ahornweg 1-2-3, ein
# Fußweg 2-4 und der Birkenweg 3-5-4, eine Einbahnstraße) und für die Suchen
# data/detour.tsv (die Lindenstraße 11-12-13-14-15-16 geradeaus, der
# Eichenweg 11-21-22-16 als Umweg mit weniger Kanten, ein Fußweg 31-32 ohne
# Verbindung), für Dijkstra auch data/shortcut.tsv (der Kastanienweg 41-42-44,
# der Erlenweg 41-43-44, der Weidenweg 44-45: 44 wird zuerst über 42 gefunden,
# nach 600 Metern, über 43 sind es nur 500); die Werte kommen aus loesung/.
format: 1
activity: routenplaner
tasks:
  - id: fusswege
    title: Wie viele Fußwege?
    prompt: Wie viele Wege in `data/steglitz-zehlendorf.tsv` sind Fußwege, also von der Art `footway`?
    check:
      type: number
      expect: 21234
    feedback:
      - when: { equals: 45181 }
        say: Das sind alle Wege. Gesucht sind nur die, deren Zeile mit `footway` anfängt.
    hint:
      - Jede Zeile der Datei ist ein Weg, und ihr erster Teil ist die Art. Gesucht ist also die Zahl der Zeilen, die mit `footway` anfangen. Zählen musst du sie nicht selbst.
      - '`grep` findet die Zeilen, auf die ein Muster passt, und mit `-c` zählt es sie nur, statt sie anzuzeigen. Im Muster heißt `^` »am Anfang der Zeile«.'
    solution: '21 234, fast die Hälfte aller 45 181 Wege: `grep -c "^footway" data/steglitz-zehlendorf.tsv`.'

  - id: lesen
    title: Die Wege lesen
    prompt: Schreib `read_ways` in `routes.rb`. Alles über die Daten deiner Funktionen [auf einen Blick](#auf-einen-blick).
    check:
      type: ruby
      file: routenplaner-starter/ruby/routes.rb
      cases:
        - read_ways('routenplaner-starter/data/test.tsv').size: 3
        - call: read_ways('routenplaner-starter/data/test.tsv').first[:name]
          expect: "'Ahornweg'"
          say: Der Name ist der dritte Teil der Zeile, nach Art und Einbahnstraße.
        - call: read_ways('routenplaner-starter/data/test.tsv')[1][:kind]
          expect: "'footway'"
        - call: read_ways('routenplaner-starter/data/test.tsv')[2][:oneway]
          expect: "'yes'"
        - call: read_ways('routenplaner-starter/data/test.tsv').first[:points]
          expect: "[['1', 13.3, 52.45], ['2', 13.301, 52.45], ['3', 13.302, 52.45]]"
          say: 'Jeder Punkt ist ein Array aus ID (ein Text), Länge und Breite (Kommazahlen): `["2", 13.301, 52.45]`.'
        - call: read_ways('routenplaner-starter/data/test.tsv')[1][:name]
          expect: "''"
          say: Ein Weg ohne Namen hat den leeren Text als Namen, zwei Tabulatoren hintereinander.
    hint:
      - |
        Nimm dir eine Zeile aus `data/test.tsv` und teile sie von Hand: Was sind die
        vier Teile zwischen den Tabulatoren? Wie zerfällt der letzte, die Punkte,
        wenn du ihn an den Leerzeichen teilst, und welche zwei Teile gehören jeweils
        zu einem Punkt?
      - |
        Für jede Zeile: `split("\t")` gibt Art, Einbahnstraße, Name und Punkte; zwei
        Tabulatoren hintereinander ergeben den leeren Namen. Die Punkte teilst du an
        den Leerzeichen und nimmst je zwei Teile zusammen, ID und Lage
        (`each_slice(2)`). Die Lage teilst du noch einmal am Komma, und `to_f` macht
        Zahlen daraus.
      - |
        Ein Gerüst; was hinter `# hier` fehlt, schreibst du:

        ```ruby
        def read_ways(path)
            File.readlines(path, chomp: true).map do |line|
                kind, oneway, name, points = line.split("\t")
                points = points.split(' ').each_slice(2).map do |id, position|
                    # hier: Länge und Breite aus position, als Zahlen
                    [id, lon, lat]
                end
                # hier: der Hash für diesen Weg
            end
        end
        ```
