          expect: true
          say: Die Einträge in @items sollen ein Heap sein, kein sortiertes Array, keine Liste zum Durchsuchen. Jedes Elternteil (i - 1) / 2 ist höchstens so groß wie sein Kind i.
    hint:
      - |
        Leg von Hand nacheinander 4, 7, 2 und 9 in einen leeren Heap und schreib das
        Array nach jedem Schritt auf. Wo landet die 2, und mit wem wird sie
        getauscht? Nimm dann einmal das Kleinste heraus: Was kommt an die Stelle 0,
        und wohin sinkt es? Im Handbuch unter »push« und »pop« kannst du ein anderes
        Beispiel durchklicken.
      - |
        `push`: hinten anhängen, dann mit dem Elternteil an der Stelle
        `(i - 1) / 2` vergleichen und tauschen, solange das Elternteil größer ist.
        `pop`: das Paar an der Stelle 0 merken, das letzte Paar an die Stelle 0 setzen
        und nach unten tauschen, immer mit dem kleineren der beiden Kinder
        `2 * i + 1` und `2 * i + 2`, solange eines kleiner ist. Verglichen wird nur
        die Priorität, `[0]`. Und Vorsicht: War der herausgenommene Eintrag der
        einzige, ist der Heap danach leer.
      - |
        Ein Gerüst für die beiden Methoden in `MinHeap`:

        ```ruby
        def push(priority, value)
            @items << [priority, value]
            i = @items.size - 1
            while i > 0
                parent = (i - 1) / 2
                # hier: aufhören, wenn das Elternteil nicht größer ist, sonst tauschen
                i = parent
            end
        end

        def pop
            return nil if @items.empty?

            top = @items[0]
            last = @items.pop
            unless @items.empty?
                @items[0] = last
                i = 0
                loop do
                    smallest = i
                    # hier: ist eines der Kinder 2 * i + 1 und 2 * i + 2, wenn es sie gibt, kleiner?
                    break if smallest == i

                    # hier: tauschen und beim Kind weitermachen
                end
            end
            top
        end
        ```
