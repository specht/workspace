            say: 'Auf dem Fußweg darf man nicht Rad fahren, die Einbahnstraße gilt für das Rad hier nicht.'

  - id: rundfahrt
    title: Wie lang ist eine Rundfahrt?
    prompt: Schreib `tour_length` in `routes.rb`.
    check:
      type: ruby
      file: routenplaner-starter/routes.rb
      cases:
        - call: tour_length([[0, 10, 5, 2, 14], [10, 0, 9, 8, 4], [5, 9, 0, 7, 11], [2, 8, 7, 0, 12], [14, 4, 11, 12, 0]], [0, 1, 2, 3, 4])
          expect: 52
          say: 'Von 0 nach 1 sind es 10, dann 9, 7 und 12, und am Ende 14 zurück zum Anfang: 52.'
        - call: tour_length([[0, 10, 5, 2, 14], [10, 0, 9, 8, 4], [5, 9, 0, 7, 11], [2, 8, 7, 0, 12], [14, 4, 11, 12, 0]], [0, 3, 2, 1, 4])
          expect: 36
        - call: tour_length([[0, 1], [3, 0]], [0, 1])
          expect: 4
          say: Hin ist nicht immer so weit wie zurück, etwa mit dem Auto und Einbahnstraßen. Nimm immer costs[von][nach].
    python:
      prompt: Schreib `tour_length` in `routes.py`.
      check:
        type: python
        file: routenplaner-starter/routes.py
        cases:
          - call: 'tour_length([[0, 10, 5, 2, 14], [10, 0, 9, 8, 4], [5, 9, 0, 7, 11], [2, 8, 7, 0, 12], [14, 4, 11, 12, 0]], [0, 1, 2, 3, 4])'
            expect: 52
            say: 'Von 0 nach 1 sind es 10, dann 9, 7 und 12, und am Ende 14 zurück zum Anfang: 52.'
          - call: 'tour_length([[0, 10, 5, 2, 14], [10, 0, 9, 8, 4], [5, 9, 0, 7, 11], [2, 8, 7, 0, 12], [14, 4, 11, 12, 0]], [0, 3, 2, 1, 4])'
            expect: 36
          - call: 'tour_length([[0, 1], [3, 0]], [0, 1])'
            expect: 4
            say: 'Hin ist nicht immer so weit wie zurück, etwa mit dem Auto und Einbahnstraßen. Nimm immer costs[von][nach].'

