                      // hier: ist edge.to() neu, oder ist total kürzer als metres.get(edge.to())?
                      // Dann neuer Abstand, neuer Vorgänger, und edge.to() in frontier
                  }
              }
              return new Search(pathTo(previous, goal), visited);
