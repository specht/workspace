          import 'dart:io';

          // Ob die Funktion name in routes.dart, ohne Kommentare, einen MinHeap
          // anlegt und mit pop aus ihm liest
          bool popsFromMinHeap(String name) {
            final source = File('routenplaner-starter/dart/routes.dart')
                .readAsStringSync()
                .replaceAll(RegExp(r'/\*[\s\S]*?\*/'), '')
                .replaceAll(RegExp(r'//[^\n]*'), '');
            final found = RegExp(r'Search\s+' + name + r'\s*\([^)]*\)\s*(\{|=>)').firstMatch(source);
            if (found == null) return false;
