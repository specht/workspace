          ```

  - id: breitensuche
    title: Breitensuche
    prompt: Schreib `breadth_first` in `routes.rb`.
    check:
      type: ruby
      file: routenplaner-starter/routes.rb
      cases:
        - call: breadth_first(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '16')[:path]
          expect: "['11', '21', '22', '16']"
          say: Über den Eichenweg sind es nur drei Kanten, über die Lindenstraße fünf.
        - call: breadth_first(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '11')[:path]
          expect: "['11']"
        - call: breadth_first(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '31')[:path]
          expect: ~
          say: Zum Fußweg 31-32 führt nichts hin. Dann ist die Queue irgendwann leer, und es gibt keinen Weg.
        - call: breadth_first(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '16')[:visited].first
          expect: "'11'"
          say: In visited kommt jeder Knoten, wenn er aus der Queue genommen wird, der Start also zuerst.
        - call: breadth_first(build_graph(read_ways('routenplaner-starter/data/detour.tsv')), '11', '31')[:visited].sort
          expect: "['11', '12', '13', '14', '15', '16', '21', '22']"
          say: Ohne Weg zum Ziel besucht die Suche alles, was sie vom Start aus erreicht, und jeden Knoten nur einmal.
    hint:
      - |
        Probier es auf der Testkarte `data/detour.tsv` von Hand, mit der Queue auf
        Papier: Start ist 11. Welche Knoten stellst du hinten an, welcher kommt als
        Nächster vorne heraus? Über welchen Vorgänger findest du 16? Im Handbuch
        unter »Breitensuche« kannst du dasselbe an einem anderen Graphen Schritt für
        Schritt durchklicken.
      - |
        Die Suche merkt sich drei Dinge: `previous` (am Anfang nur der Start, ohne
        Vorgänger), die Queue (am Anfang nur der Start) und `visited` (am Anfang
        leer). Einen Nachbarn, der schon gefunden ist, erkennst du daran, dass er in
        `previous` steht. Am Ende baut dein `path_to` den Weg.
      - |
        Ein Gerüst:

        ```ruby
        def breadth_first(graph, start, goal)
            previous = { start => nil }
            queue = [start]
            visited = []
            until queue.empty?
                node = queue.shift
                # hier: node in visited, und beim Ziel aufhören
                graph[:edges][node].each do |neighbour, _metres|
                    # hier: einen neuen Nachbarn mit Vorgänger eintragen und hinten anstellen
                end
            end
            { path: path_to(previous, goal), visited: visited }
        end
        ```
    python:
      prompt: Schreib `breadth_first` in `routes.py`.
      check:
        type: python
        file: routenplaner-starter/routes.py
        cases:
          - call: 'breadth_first(build_graph(read_ways(''routenplaner-starter/data/detour.tsv'')), ''11'', ''16'')[''path'']'
            expect: "['11', '21', '22', '16']"
