  - id: kreis
    title: Auf der echten Karte
    prompt: Die Karte fragt jetzt dein `walk` nach einem Weg durch Steglitz-Zehlendorf, wo jede Straße in beide Richtungen geht. Was passiert?
    prediction: true
    check:
      type: choice
      options:
        - walk geht zwischen zwei Nachbarn hin und her, bis das Programm mit einem Fehler abbricht.
        - walk findet einen Weg, aber einen Umweg.
        - walk findet keinen Weg, und die Seite meldet »Kein Weg gefunden«.
        - walk geht ohne Ende hin und her, und die Seite wartet für immer.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Dafür müsste walk irgendwann am Ziel ankommen. Wohin geht es vom ersten Nachbarn des Starts aus als Erstes?
      - when: { picked: 2 }
        say: Keinen Weg meldet walk erst, wenn alle Nachbarn durch sind und keiner einen Weg gefunden hat. Wird ein Aufruf je fertig?
      - when: { picked: 3 }
        say: Hin und her geht es wirklich. Aber jeder Aufruf wartet auf den nächsten, und jeder wartende Aufruf braucht Platz auf dem Stack. Der ist nicht unendlich groß.
    solution: |
      Jede Straße geht in beide Richtungen: Der Start ist ein Nachbar seines
      ersten Nachbarn. walk geht vom Start zu ihm, von dort zurück zum Start,
      wieder zu ihm und so weiter. Kein Aufruf wird fertig, jeder wartet auf den
      nächsten, und jeder wartende Aufruf liegt auf dem Stack. Nach einigen
      Tausend Aufrufen ist der voll: Stack Overflow.

