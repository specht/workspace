          »Dijkstra« kannst du die Suche durchklicken; achte darauf, welcher Knoten
          jeweils als Nächster drankommt und wann sich ein Abstand noch ändert. Auf
          `data/shortcut.tsv` von 41 nach 45 ändert sich ein Abstand: Über welchen
          Nachbarn findet die Suche den Knoten 44 zuerst, und über welchen ist der
          Weg zu ihm kürzer?
        - |
          Gegenüber deiner Breitensuche ändert sich zweierlei. Statt der Queue gibt es
          `frontier`, eine Map von Knoten zu Metern, und als Nächstes kommt der mit
          den wenigsten Metern: Du gehst die Einträge durch und merkst dir den mit
          dem kleinsten Wert. Und ein Nachbar wird nicht nur eingetragen, wenn er neu
          ist, sondern auch, wenn der Weg über diesen Knoten kürzer ist als der bisher
          beste, der in `metres` steht.
        - |
          Ein Gerüst:

          ```javascript
          function dijkstra(graph, start, goal) {
              const metres = new Map([[start, 0]]);
              const previous = new Map([[start, null]]);
              const frontier = new Map([[start, 0]]);
              const visited = [];
              while (frontier.size > 0) {
                  let node = null;
                  for (const [id, m] of frontier) if (node === null || m < frontier.get(node)) node = id;
                  const soFar = frontier.get(node);
                  frontier.delete(node);
                  visited.push(node);
                  if (node === goal) break;

                  for (const [neighbour, length] of graph.edges[node] || []) {
                      const total = soFar + length;
                      // hier: ist neighbour neu, oder ist total kürzer als metres.get(neighbour)?
                      // Dann neuer Abstand, neuer Vorgänger, und neighbour in frontier
                  }
              }
              return { path: pathTo(previous, goal), visited };
          }
          ```
