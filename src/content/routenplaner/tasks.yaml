  - id: weg
    title: Der Weg zurück
    prompt: Schreib `path_to` in `routes.rb`.
    check:
      type: ruby
      file: routenplaner-starter/routes.rb
      cases:
        - call: path_to({ 'a' => nil, 'b' => 'a', 'c' => 'b' }, 'c')
          expect: "['a', 'b', 'c']"
          say: Der Weg geht vom Start zum Ziel. Du findest ihn rückwärts, also kommt jeder Knoten vorne dazu (`unshift`).
        - call: path_to({ 'a' => nil, 'b' => 'a', 'c' => 'a' }, 'c')
          expect: "['a', 'c']"
        - call: path_to({ 'a' => nil }, 'a')
          expect: "['a']"
          say: Ist das Ziel der Start, ist der Weg nur dieser eine Knoten.
        - call: path_to({ 'a' => nil, 'b' => 'a' }, 'x')
          expect: ~
          say: Hat die Suche das Ziel nie gefunden, steht es nicht in previous, und es gibt keinen Weg.
    hint:
      - |
        Mit `previous = { 'a' => nil, 'b' => 'a', 'c' => 'b' }`: Von welchem Knoten
        aus hat die Suche `c` gefunden? Und den davor? Schreib die Knoten in der
        Reihenfolge auf, in der du sie so findest, und dreh sie dann um.
      - |
        Beginne beim Ziel und geh von Vorgänger zu Vorgänger, bis einer `nil` ist:
        Das war der Start. Jeden Knoten setzt du vorne in den Weg (`unshift`), dann
        steht er am Ende vom Start zum Ziel da. Steht das Ziel gar nicht in
        `previous`, hat die Suche es nie gefunden: Dann gibt es keinen Weg, `nil`.
      - |
        Ein Gerüst:

        ```ruby
        def path_to(previous, goal)
            return nil unless …   # hier: hat die Suche das Ziel gefunden?

            path = []
            node = goal
            while node
                # hier: node vorne in den Weg, dann weiter zu seinem Vorgänger
            end
            path
        end
        ```
    python:
      prompt: Schreib `path_to` in `routes.py`.
      check:
        type: python
        file: routenplaner-starter/routes.py
        cases:
          - call: 'path_to({''a'': None, ''b'': ''a'', ''c'': ''b''}, ''c'')'
            expect: "['a', 'b', 'c']"
            say: 'Der Weg geht vom Start zum Ziel. Du findest ihn rückwärts, also kommt jeder Knoten vorne dazu (`insert(0, …)`).'
          - call: 'path_to({''a'': None, ''b'': ''a'', ''c'': ''a''}, ''c'')'
            expect: "['a', 'c']"
          - call: 'path_to({''a'': None}, ''a'')'
            expect: "['a']"
            say: 'Ist das Ziel der Start, ist der Weg nur dieser eine Knoten.'
          - call: 'path_to({''a'': None, ''b'': ''a''}, ''x'')'
            expect: ~
            say: 'Hat die Suche das Ziel nie gefunden, steht es nicht in previous, und es gibt keinen Weg.'
      hint:
        - |
          Mit `previous = {'a': None, 'b': 'a', 'c': 'b'}`: Von welchem Knoten aus hat
          die Suche `c` gefunden? Und den davor? Schreib die Knoten in der Reihenfolge
          auf, in der du sie so findest, und dreh sie dann um.
        - |
          Beginne beim Ziel und geh von Vorgänger zu Vorgänger, bis einer `None` ist:
          Das war der Start. Jeden Knoten setzt du vorne in den Weg
          (`path.insert(0, node)`), dann steht er am Ende vom Start zum Ziel da. Steht
          das Ziel gar nicht in `previous`, hat die Suche es nie gefunden: Dann gibt es
          keinen Weg, `None`.
        - |
          Ein Gerüst:

          ```python
