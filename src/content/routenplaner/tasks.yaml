              previous.put(start, null);
              Map<String, Double> frontier = new HashMap<>(Map.of(start, 0.0));
              List<String> visited = new ArrayList<>();
              while (!frontier.isEmpty()) {
                  String node = null;
                  for (String id : frontier.keySet()) {
                      if (node == null || frontier.get(id) < frontier.get(node)) node = id;
                  }
                  double soFar = frontier.remove(node);
                  visited.add(node);
                  if (node.equals(goal)) break;

