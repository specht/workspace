        »Dijkstra« kannst du die Suche durchklicken; achte darauf, welcher Knoten
        jeweils als Nächster drankommt und wann sich ein Abstand noch ändert.
      - |
        Gegenüber deiner Breitensuche ändern sich zwei Dinge. Statt der Queue gibt es
        `frontier`, einen Hash von Knoten zu Metern, und als Nächstes kommt der mit
        den wenigsten Metern (`min_by`). Und ein Nachbar wird nicht nur eingetragen,
        wenn er neu ist, sondern auch, wenn der Weg über diesen Knoten kürzer ist als
        der bisher beste, der in `metres` steht.
      - |
        Ein Gerüst:

        ```ruby
        def dijkstra(graph, start, goal)
            metres = { start => 0 }
            previous = { start => nil }
            frontier = { start => 0 }
            visited = []
            until frontier.empty?
                node, so_far = frontier.min_by { |_id, m| m }
                frontier.delete(node)
                visited << node
                break if node == goal

                graph[:edges][node].each do |neighbour, length|
                    total = so_far + length
                    # hier: ist neighbour neu, oder ist total kürzer als metres[neighbour]?
                    # Dann neuer Abstand, neuer Vorgänger, und neighbour in frontier
                end
            end
            { path: path_to(previous, goal), visited: visited }
        end
        ```
