              end = source.indexOf(';', end);
              if (end < 0) end = source.length;
            } else {
              var depth = 1;
              while (end < source.length && depth > 0) {
                final c = source[end++];
                if (c == '{') depth++;
                if (c == '}') depth--;
              }
            }
            final body = source.substring(found.end, end);
            return body.contains('MinHeap') && body.contains('.pop()');
          }
