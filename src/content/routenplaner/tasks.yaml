  - id: grad
    title: Ein Grad ist nicht gleich ein Grad
    prediction: true
    prompt: Warum ist in Berlin ein Grad Länge (nach Osten) kürzer als ein Grad Breite (nach Norden)?
    check:
      type: choice
      options:
        - Die Längengrade laufen an den Polen zusammen. Je weiter nördlich, desto näher liegen sie beieinander.
        - Die Erde ist keine genaue Kugel. Am Äquator ist sie breiter als von Pol zu Pol.
        - Ein Grad Länge ist eine Stunde Zeitverschiebung, das ist kürzer.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Die Erde ist tatsächlich etwas abgeplattet, weil sie sich dreht. Quer durch den Äquator misst sie 12.756 km, von Pol zu Pol 43 km weniger. Das sind aber nur 0,3 Prozent. In Berlin ist ein Grad Länge fast 40 Prozent kürzer.
    solution: |
      Die Längengrade treffen sich an den Polen. Am Äquator ist ein Grad Länge
      etwa 111 km breit, in Berlin (52,5° Nord) nur noch 111 km · cos 52,5° ≈ 68
      km. Ein Grad Breite ist überall etwa 111 km. Darum rechnet `distance` die
      Länge mit dem Kosinus der Breite um.

  - id: abstand
    title: Wie weit ist es?
    prompt: Schreib `distance` in `routes.rb`. Alles über die Daten deiner Funktionen [auf einen Blick](#auf-einen-blick).
    check:
      type: ruby
      file: routenplaner-starter/ruby/routes.rb
      cases:
        - call: (distance(13.3, 52.45, 13.3, 52.451) - 111.2).abs < 0.5
          expect: true
          say: Ein Tausendstel Grad nach Norden sind überall gut 111 Meter.
        - call: (distance(13.3, 52.45, 13.301, 52.45) - 67.8).abs < 0.5
          expect: true
          say: Ein Tausendstel Grad nach Osten ist in Berlin nur knapp 68 Meter lang. Hast du die Länge mit dem Cosinus der Breite verkürzt? Math.cos rechnet im Bogenmaß.
        - call: (distance(13.3205, 52.4572, 13.3064, 52.4560) - 965).abs < 3
          expect: true
          say: Vom Rathaus Steglitz zum Botanischen Garten sind es in Luftlinie gut 960 Meter.
        - call: distance(13.3, 52.45, 13.3, 52.45)
          expect: 0.0
        - call: distance(13.3, 52.45, 13.301, 52.451) == distance(13.301, 52.451, 13.3, 52.45)
          expect: true
          say: Hin ist es so weit wie zurück.
    hint:
      - |
        Rechne zwei Fälle von Hand: Ein Tausendstel Grad nach Norden, wie viele
        Meter sind das mit 111 195 m pro Grad? Und ein Tausendstel Grad nach Osten
        in Berlin, bei 52,45 Grad Breite: Der Cosinus von 52,45° ist etwa 0,61.
      - |
        Die Formel auf der Seite in drei Schritten: der Unterschied der Längen,
        verkürzt mit dem Cosinus der mittleren Breite; der Unterschied der Breiten;
        beide ins Bogenmaß (mal `Math::PI / 180`). Dann Pythagoras, mal dem
        Erdradius 6 371 000 Meter. `Math.cos` erwartet Bogenmaß, also gehört die
        mittlere Breite vor dem Cosinus ebenfalls umgerechnet.
      - |
        Ein Gerüst; die Lücken mit `…` füllst du:

        ```ruby
        def distance(lon1, lat1, lon2, lat2)
            radians = Math::PI / 180
            x = …   # der Unterschied der Längen, im Bogenmaß, mal cos der mittleren Breite
            y = …   # der Unterschied der Breiten, im Bogenmaß
            Math.sqrt(x * x + y * y) * 6_371_000
        end
        ```
