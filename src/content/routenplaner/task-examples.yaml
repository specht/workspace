          routenplaner-starter/ruby/routes.rb:
            text: |
              require_relative 'solution'
              def path_to(previous, goal)
                  return nil unless previous.key?(goal)
                  path = []
                  node = goal
                  while node
                      path << node
                      node = previous[node]
                  end
                  path
              end
