              text: |
                import 'dart:math';

                import 'solution.dart' hide buildTravelGraph;
                export 'solution.dart' hide buildTravelGraph;

                Graph buildTravelGraph(List<Way> ways, String mode) {
                  final table = speeds[mode]!;
                  final graph = Graph();
                  for (final way in ways) {
                    final speed = table[way.kind];
                    if (speed == null) continue;
                    for (var i = 0; i + 1 < way.points.length; i++) {
                      final a = way.points[i], b = way.points[i + 1];
                      graph.nodes[a.id] = a;
                      graph.nodes[b.id] = b;
                      final seconds = distance(a.lon, a.lat, b.lon, b.lat) / (speed / 3.6);
                      graph.edges.putIfAbsent(a.id, () => []).add(Edge(b.id, seconds));
                      graph.edges.putIfAbsent(b.id, () => []).add(Edge(a.id, seconds));
                    }
                  }
                  graph.fastest = table.values.reduce(max) / 3.6;
                  return graph;
                }
          say: Einbahnstraße
