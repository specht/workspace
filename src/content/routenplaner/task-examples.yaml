  heap:
    pass:
      - files: { routenplaner-starter/routes.rb: loesung/routes.rb }
    fail:
      - files: { routenplaner-starter/routes.rb: vorlage/routes.rb }
      # ein sortiertes Array statt eines Heaps: richtig, aber langsam
      - files:
          routenplaner-starter/solution.rb: loesung/routes.rb
          routenplaner-starter/routes.rb:
            text: |
              require_relative 'solution'
              class MinHeap
                  def push(priority, value)
                      @items << [priority, value]
                      @items.sort_by!(&:first)
                      @items.reverse!
                  end
                  def pop
                      @items.pop
                  end
              end
        say: Elternteil
    python:
      pass:
        - files: { routenplaner-starter/routes.py: loesung/routes.py }
      fail:
        - files: { routenplaner-starter/routes.py: vorlage/routes.py }
        - files:
            routenplaner-starter/solution.py: loesung/routes.py
            routenplaner-starter/routes.py:
              text: |
                from solution import *
                class MinHeap:
                    def __init__(self):
                        self.items = []
                    def empty(self):
                        return not self.items
                    def push(self, priority, value):
                        self.items.append((priority, value))
                        self.items.sort(reverse=True)
                    def pop(self):
                        return self.items.pop() if self.items else None
          say: Elternteil
