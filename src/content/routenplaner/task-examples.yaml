        # eine sortierte Liste statt eines Heaps: richtig, aber langsam
        - files:
            routenplaner-starter/dart/solution.dart: loesung/dart/routes.dart
            routenplaner-starter/dart/graph.dart: vorlage/dart/graph.dart
            routenplaner-starter/dart/routes.dart:
              text: |
                import 'solution.dart' hide MinHeap;
                export 'solution.dart' hide MinHeap;

                class MinHeap {
                  final items = <(double, String)>[];
                  bool get isEmpty => items.isEmpty;
                  int get length => items.length;
                  void push(double priority, String value) {
