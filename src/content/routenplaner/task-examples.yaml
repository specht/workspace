  weg:
    pass:
      - files: { routenplaner-starter/routes.rb: loesung/routes-5.rb }
    fail:
      - files: { routenplaner-starter/routes.rb: vorlage/routes.rb }
      # vorwärts statt rückwärts: der Weg vom Ziel zum Start
      - files:
          routenplaner-starter/solution.rb: loesung/routes-5.rb
          routenplaner-starter/routes.rb:
            text: |
              require_relative 'solution'
              def path_to(previous, goal)
                  return nil unless previous.key?(goal)
                  path = []
                  node = goal
                  while node
                      path << node
                      node = previous[node]
                  end
                  path
              end
        say: unshift
    python:
      pass:
        - files: { routenplaner-starter/routes.py: loesung/routes.py }
      fail:
        - files: { routenplaner-starter/routes.py: vorlage/routes.py }
        - files:
            routenplaner-starter/solution.py: loesung/routes.py
            routenplaner-starter/routes.py:
              text: |
                from solution import *
                def path_to(previous, goal):
                    if goal not in previous:
                        return None
                    path = []
                    node = goal
                    while node is not None:
                        path.append(node)
                        node = previous[node]
                    return path
          say: insert
