# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): die Musterlösung löst jede Aufgabe, das leere routes.rb
# der Vorlage keine.
format: 1
activity: routenplaner
examples:
  lesen:
    pass:
      - files: { routenplaner-starter/routes.rb: loesung/routes-5.rb, routenplaner-starter/data/test.tsv: vorlage/data/test.tsv }
    fail:
      - files: { routenplaner-starter/routes.rb: vorlage/routes.rb, routenplaner-starter/data/test.tsv: vorlage/data/test.tsv }
  abstand:
    pass:
      - files: { routenplaner-starter/routes.rb: loesung/routes-5.rb }
    fail:
      - files: { routenplaner-starter/routes.rb: vorlage/routes.rb }
      # ohne den Cosinus: nach Osten zu weit
      - files:
          routenplaner-starter/routes.rb:
            text: |
              def distance(lon1, lat1, lon2, lat2)
                  Math.sqrt((lon2 - lon1)**2 + (lat2 - lat1)**2) * Math::PI / 180 * 6_371_000
              end
        say: Cosinus
  graph:
    pass:
      - files: { routenplaner-starter/routes.rb: loesung/routes-5.rb, routenplaner-starter/data/test.tsv: vorlage/data/test.tsv }
    fail:
      - files: { routenplaner-starter/routes.rb: vorlage/routes.rb, routenplaner-starter/data/test.tsv: vorlage/data/test.tsv }
  weg:
    pass:
      - files: { routenplaner-starter/routes.rb: loesung/routes-5.rb }
    fail:
      - files: { routenplaner-starter/routes.rb: vorlage/routes.rb }
      # vorwärts statt rückwärts: der Weg vom Ziel zum Start
      - files:
          routenplaner-starter/solution.rb: loesung/routes-5.rb
          routenplaner-starter/routes.rb:
            text: |
              require_relative 'solution'
              def path_to(previous, goal)
                  return nil unless previous.key?(goal)
                  path = []
                  node = goal
                  while node
                      path << node
                      node = previous[node]
                  end
                  path
              end
        say: unshift
  breitensuche:
    pass:
      - files: { routenplaner-starter/routes.rb: loesung/routes-5.rb, routenplaner-starter/data/detour.tsv: vorlage/data/detour.tsv }
    fail:
      - files: { routenplaner-starter/routes.rb: vorlage/routes.rb, routenplaner-starter/data/detour.tsv: vorlage/data/detour.tsv }
      # die Meter statt der Kanten: Dijkstra unter dem Namen der Breitensuche
      - files:
          routenplaner-starter/solution.rb: loesung/routes-5.rb
          routenplaner-starter/data/detour.tsv: vorlage/data/detour.tsv
          routenplaner-starter/routes.rb:
            text: |
              require_relative 'solution'
              def breadth_first(graph, start, goal)
                  dijkstra(graph, start, goal)
              end
        say: Eichenweg
  dijkstra:
    pass:
      - files: { routenplaner-starter/routes.rb: loesung/routes-5.rb, routenplaner-starter/data/detour.tsv: vorlage/data/detour.tsv }
    fail:
      - files: { routenplaner-starter/routes.rb: vorlage/routes.rb, routenplaner-starter/data/detour.tsv: vorlage/data/detour.tsv }
      # die Breitensuche unter dem Namen Dijkstra: zählt Kanten, nicht Meter
      - files:
          routenplaner-starter/solution.rb: loesung/routes-5.rb
          routenplaner-starter/data/detour.tsv: vorlage/data/detour.tsv
          routenplaner-starter/routes.rb:
            text: |
              require_relative 'solution'
              def dijkstra(graph, start, goal)
                  breadth_first(graph, start, goal)
              end
        say: Lindenstraße
