  reisen:
    pass:
      - files: { routenplaner-starter/routes.rb: loesung/routes.rb, routenplaner-starter/data/test.tsv: vorlage/data/test.tsv }
    fail:
      - files: { routenplaner-starter/routes.rb: vorlage/routes.rb, routenplaner-starter/data/test.tsv: vorlage/data/test.tsv }
      # ohne Einbahnstraßen
      - files:
          routenplaner-starter/solution.rb: loesung/routes.rb
          routenplaner-starter/data/test.tsv: vorlage/data/test.tsv
          routenplaner-starter/routes.rb:
            text: |
              require_relative 'solution'
              def build_travel_graph(ways, mode)
                  build_travel_graph_both_ways(ways, mode)
              end
              def build_travel_graph_both_ways(ways, mode)
                  speeds = SPEEDS.fetch(mode)
                  nodes = {}
                  edges = Hash.new { |hash, id| hash[id] = [] }
                  ways.each do |way|
                      speed = speeds[way[:kind]]
                      next unless speed
                      way[:points].each_cons(2) do |(a, lon1, lat1), (b, lon2, lat2)|
                          nodes[a] = [lon1, lat1]
                          nodes[b] = [lon2, lat2]
                          seconds = distance(lon1, lat1, lon2, lat2) / (speed / 3.6)
                          edges[a] << [b, seconds]
                          edges[b] << [a, seconds]
                      end
                  end
                  { nodes: nodes, edges: edges, fastest: speeds.values.max / 3.6 }
              end
        say: Einbahnstraße
    python:
      pass:
        - files: { routenplaner-starter/routes.py: loesung/routes.py, routenplaner-starter/data/test.tsv: vorlage/data/test.tsv }
      fail:
