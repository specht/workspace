<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routenplaner</title>
<link rel="stylesheet" href="map.css">
</head>
<body>
<canvas id="map" tabindex="0" aria-label="Die Karte: Straßen und Wege, gezeichnet aus den Daten. Ziehen verschiebt sie, das Mausrad zoomt, ein Klick zeigt den Knoten dort."></canvas>
<aside id="panel">
    <header>
        <h1>Routenplaner</h1>
        <p id="area">Lade die Karte …</p>
    </header>
    <div id="places">
        <label class="place start">
            <span class="dot" aria-hidden="true"></span>
            <span class="label">Start</span>
            <input id="start" type="search" list="place-list" placeholder="Ort suchen …" autocomplete="off" spellcheck="false">
        </label>
        <label class="place goal">
            <span class="dot" aria-hidden="true"></span>
            <span class="label">Ziel</span>
            <input id="goal" type="search" list="place-list" placeholder="Ort suchen …" autocomplete="off" spellcheck="false">
        </label>
        <button id="swap" type="button" title="Start und Ziel tauschen" aria-label="Start und Ziel tauschen">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2v10M2 9l3 3 3-3M11 14V4M8 7l3-3 3 3"/></svg>
        </button>
    </div>
    <datalist id="place-list"></datalist>
    <div id="searches" role="group" aria-label="Wie gesucht wird">
        <button type="button" data-search="bfs" aria-pressed="true">Breitensuche</button>
        <button type="button" data-search="dijkstra" aria-pressed="false">Dijkstra</button>
    </div>
    <p id="info">Wähle Start und Ziel oder klicke auf die Karte.</p>
    <div id="player" hidden>
        <div class="controls">
            <button type="button" data-step="first" title="Zum Anfang der Suche" aria-label="Zum Anfang der Suche">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3 6 8l7 5z"/></svg>
            </button>
            <button type="button" data-step="-1" title="Einen Schritt zurück" aria-label="Einen Schritt zurück">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
            </button>
            <button type="button" id="play" class="play">
                <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10l8-5z"/></svg>
                <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg>
            </button>
            <button type="button" data-step="1" title="Einen Schritt vor" aria-label="Einen Schritt vor">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>
            </button>
            <button type="button" data-step="last" title="Zum Ende der Suche" aria-label="Zum Ende der Suche">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3l7 5-7 5z"/></svg>
            </button>
            <select id="speed" aria-label="Tempo">
                <option value="slow">Langsam</option>
                <option value="medium">Mittel</option>
                <option value="fast" selected>Schnell</option>
            </select>
        </div>
        <input id="progress" type="range" min="0" max="0" value="0" step="1" aria-label="Wie weit die Suche ist">
        <p id="step"></p>
    </div>
    <label id="graph-switch">
        <input type="checkbox" id="graph-view">
        <span>Graph zeigen: Knoten und Kanten aus <code>build_graph</code></span>
    </label>
    <details id="legend">
        <summary>Legende</summary>
        <ul></ul>
    </details>
</aside>
<div id="zoom" role="group" aria-label="Zoom">
    <button type="button" data-zoom="1.5" title="Vergrößern (+)" aria-label="Vergrößern">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <button type="button" data-zoom="0.667" title="Verkleinern (−)" aria-label="Verkleinern">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
    </button>
    <button type="button" id="fit" title="Ganzes Gebiet (0)" aria-label="Ganzes Gebiet zeigen">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
    </button>
</div>
<div id="scale" aria-hidden="true"><span></span></div>
<p id="credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende</p>
<script src="map.js"></script>
</body>
</html>
