# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
format: 1
activity: feuerwerk
examples:
  bewegen:
    skip: Die Datei bindet pixelram.h ein, das erst make in den Ordner holt. Dass die Schritte der Seite die Aufgabe lösen, prüfen die Rezepte mit check-task; die Prüfart selbst testet c_check_test.rb.
  hinzufuegen:
    skip: Die Datei bindet pixelram.h ein, das erst make in den Ordner holt. Dass die Schritte der Seite die Aufgabe lösen, prüfen die Rezepte mit check-task; die Prüfart selbst testet c_check_test.rb.
  funken:
    skip: Die Datei bindet pixelram.h ein, das erst make in den Ordner holt. Von Hand mit pixelram.h geprüft, angenommen stufen/02-explosion.c und stufen/03-feuerwerk.c, abgelehnt stufen/02-explosion.c mit dem leeren // hier der Seite und Schleifen ohne i--, ohne p->life -= dt, ohne move_particle und ohne das Entfernen verloschener Funken; ein Rezept mit check-task gibt es dafür noch nicht.
  verblassen:
    skip: Die Datei bindet pixelram.h ein, das erst make in den Ordner holt. Von Hand mit pixelram.h geprüft, angenommen stufen/03-feuerwerk.c, abgelehnt stufen/02-explosion.c (ohne fade), ein fade mit c > 0 statt c % 16 > 0 und eines, das die unterste Zeile auslässt; ein Rezept mit check-task gibt es dafür noch nicht.
  rakete:
    skip: Die Datei bindet pixelram.h ein, das erst make in den Ordner holt. Von Hand mit pixelram.h geprüft, angenommen stufen/03-feuerwerk.c, abgelehnt stufen/03-feuerwerk.c mit dem leeren // hier der Seite, ohne p->life = 0, mit p->vy <= 0 und ohne p->rocket in der Bedingung; ein Rezept mit check-task gibt es dafür noch nicht.
  erster-funke:
    pass:
      - files: { feuerwerk/feuerwerk.html: { text: "<!DOCTYPE html>\n<html><body><canvas></canvas></body></html>\n" } }
    fail:
      - files: { feuerwerk/index.html: { text: "<!DOCTYPE html>\n" } }
