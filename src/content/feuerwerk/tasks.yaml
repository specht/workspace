# Aufgaben zu »Feuerwerk aus Partikeln«.
# Format: docs/aufgaben.md.
format: 1
activity: feuerwerk
tasks:
  - id: bewegen
    title: Dein move_particle
    prompt: |
      Schreib den Rumpf von `move_particle` in `feuerwerk.c` und speichere. Der
      Workspace wirft einen Funken mit bekannter Geschwindigkeit und sieht
      nach, wo er nach einem Schritt ist.
    file: feuerwerk/feuerwerk.c
    check:
      type: c
      file: feuerwerk/feuerwerk.c
      tolerance: 0.01
      cases:
        - call: '({ Particle p = {0, 100, 10, -50}; move_particle(&p, 0.5); p.vy; })'
          expect: -30
          say: 'Die Schwerkraft macht `vy` in jeder Sekunde um `GRAVITY` größer, in einer halben Sekunde also um 20: aus −50 wird −30.'
        - call: '({ Particle p = {0, 100, 10, -50}; move_particle(&p, 0.5); p.x; })'
          expect: 5
          say: '`x` ändert sich um `vx` mal `dt`: 10 Pixel pro Sekunde, eine halbe Sekunde lang.'
        - call: '({ Particle p = {0, 100, 10, -50}; move_particle(&p, 0.01); p.y; })'
          expect: 99.5
          say: '`y` ändert sich um `vy` mal `dt`: Nach oben ist `vy` negativ, `y` wird kleiner.'
        - call: '({ Particle p = {50, 20, 0, 0}; move_particle(&p, 1); p.vy; })'
          expect: 40
          say: 'Auch ein Funke, der stillsteht, fällt: Nach einer Sekunde ist `vy` so groß wie `GRAVITY`.'

  - id: hinzufuegen
    title: Dein add
    prompt: |
      Schreib `add` in `feuerwerk.c` und speichere. Der Workspace fügt Funken
      hinzu und zählt nach, auch wenn das Array schon voll ist.
    file: feuerwerk/feuerwerk.c
    check:
      type: c
      file: feuerwerk/feuerwerk.c
      cases:
        - call: '({ add(1, 2, 3, 4, 5); count; })'
          expect: 1
          say: 'Nach dem ersten Funken lebt einer: `count` muss danach 1 sein.'
        - call: '({ add(1, 2, 3, 4, 5); add(6, 7, 8, 9, 10); particles[1].x; })'
          expect: 6
          say: 'Der zweite Funke gehört an Index 1, hinter den ersten: an den Index `count`, bevor es größer wird.'
        - call: '({ add(1, 2, 3, 4, 5); particles[0].life; })'
          expect: 5
          say: 'Alle fünf Werte gehören in den Funken, auch `life`.'
        - call: '({ for (int i = 0; i < MAX_PARTICLES + 5; i++) add(0, 0, 0, 0, 1); count; })'
          expect: 2000
          say: 'Ist das Array voll, kommt kein Funke mehr dazu: `count` darf nie größer als `MAX_PARTICLES` werden, sonst schreibt `add` hinter das Array.'

  - id: funken
    title: Deine Schleife über die Funken
    prompt: |
      Schreib in `main` die Schleife über alle lebenden Funken und speichere.
      Der Workspace lässt dein Programm ein paar Sekunden lang laufen, ohne
      Fenster, und sieht nach jedem Bild nach, ob jeder lebende Funke bewegt
      und gezeichnet wurde und ob die verloschenen weg sind.
    file: feuerwerk/feuerwerk.c
    check:
      type: c
      file: feuerwerk/feuerwerk.c
      setup: |
        // PixelRAM ohne Fenster: ein Bild alle 0,05 Sekunden, nach frames
        // Bildern ist Schluss. set_pixel merkt sich, wo in diesem Bild
        // gezeichnet wurde, present sieht sich danach die Partikel an.
        static int frames, frame;
        static uint8_t screen[H][W];
        static int drawn_in[H][W];
        bool screen_open(int width, int height, pixel_mode mode, const char *title)
        {
            (void)width; (void)height; (void)mode; (void)title;
            return true;
        }
        bool use_palette(const char *name) { (void)name; return true; }
        void set_palette(int index, uint8_t r, uint8_t g, uint8_t b) { (void)index; (void)r; (void)g; (void)b; }
        void screen_close(void) {}
        bool should_close(void) { return frame >= frames; }
        double seconds(void) { return frame * 0.05; }
        bool mouse_button_pressed(pixel_mouse_button button) { (void)button; return false; }
        void mouse_position(int *x, int *y) { *x = 0; *y = 0; }
        void clear(uint8_t index) { memset(screen, index, sizeof screen); }
        uint8_t get_pixel(int x, int y)
        {
            return (x >= 0 && x < W && y >= 0 && y < H) ? screen[y][x] : 0;
        }
        void set_pixel(int x, int y, uint8_t index)
        {
            if (x >= 0 && x < W && y >= 0 && y < H)
            {
                screen[y][x] = index;
                drawn_in[y][x] = frame + 1;
            }
        }

        static int missing, dead, fell, still;
        static int last_count;
        static double last_x, last_y;
        void present(void)
        {
            int miss = 0, gone = 0;
            for (int i = 0; i < count; i++)
            {
                if (particles[i].life <= 0)
                {
                    gone = 1;
                    continue;
                }
                int x = (int)particles[i].x, y = (int)particles[i].y;
                if (x < 1 || x >= W - 1 || y < 1 || y >= H - 1)
                    continue;
                // gezeichnet an seiner Stelle, auf ein Pixel genau
                int seen = 0;
                for (int dy = -1; dy <= 1; dy++)
                    for (int dx = -1; dx <= 1; dx++)
                        if (drawn_in[y + dy][x + dx] == frame + 1)
                            seen = 1;
                if (!seen)
                    miss = 1;
            }
            missing += miss;
            dead += gone;
            if (count < last_count)
                fell++;
            if (count > 0 && last_count > 0 && particles[0].x == last_x && particles[0].y == last_y)
                still++;
            last_count = count;
            if (count > 0)
            {
                last_x = particles[0].x;
                last_y = particles[0].y;
            }
            frame++;
        }

        // Bilder, nach denen ein lebender Funke nicht gezeichnet war
        int frames_missing_a_spark(int n) { frames = n; hs_student_main(); return missing; }
        // Bilder, nach denen ein verloschener Funke noch im Array steht
        int frames_with_dead_sparks(int n) { frames = n; hs_student_main(); return dead; }
        // Bilder, nach denen weniger Funken leben als davor
        int frames_where_sparks_went_out(int n) { frames = n; hs_student_main(); return fell; }
        // Bilder, in denen der Funke an Index 0 nicht weitergeflogen ist
        int frames_without_moving(int n) { frames = n; hs_student_main(); return still; }
      cases:
        - call: frames_missing_a_spark(60)
          expect: 0
          say: 'In manchen Bildern ist ein lebender Funke nicht gezeichnet. Ruft die Schleife für jeden Funken `set_pixel` auf? Und wenn der letzte Funke an den Index `i` rückt: Kommt er mit `i--` noch in diesem Bild an die Reihe?'
        - call: frames_without_moving(40)
          expect: 0
          say: 'Die Funken fliegen nicht weiter. Ruft die Schleife für jeden Funken `move_particle(p, dt)` auf?'
        - call: frames_where_sparks_went_out(120) > 0
          expect: true
          say: 'In sechs Sekunden verlischt kein einziger Funke, obwohl jeder höchstens 2,5 Sekunden lebt. Wird `p->life` in jedem Bild um `dt` kürzer, und rückt bei einem verloschenen Funken der letzte an seinen Index?'
        - call: frames_with_dead_sparks(60)
          expect: 0
          say: 'Nach manchen Bildern steht noch ein verloschener Funke im Array, einer mit `life <= 0`. Rückt bei ihm der letzte Funke an seinen Index, und wird `count` kleiner?'

  - id: verblassen
    title: Dein fade
    prompt: |
      Schreib `fade` in `feuerwerk.c` und speichere. Der Workspace malt ein
      paar Pixel in Farben aus den Verläufen, ruft `fade` auf und sieht nach,
      welche Farbe sie danach haben.
    file: feuerwerk/feuerwerk.c
    check:
      type: c
      file: feuerwerk/feuerwerk.c
      setup: |
        // ein Bildschirm ohne Fenster, für get_pixel und set_pixel
        static uint8_t screen[H][W];
        uint8_t get_pixel(int x, int y)
        {
            return (x >= 0 && x < W && y >= 0 && y < H) ? screen[y][x] : 0;
        }
        void set_pixel(int x, int y, uint8_t index)
        {
            if (x >= 0 && x < W && y >= 0 && y < H)
                screen[y][x] = index;
        }

        // ein Pixel bei (x, y) in der Farbe color: welche hat es nach fade()?
        int faded(int x, int y, int color)
        {
            screen[y][x] = color;
            fade();
            return screen[y][x];
        }
      cases:
        - call: faded(100, 50, 37)
          expect: 36
          say: 'Die Farbe 37 ist Blau mit der Helligkeit 5; eine Stufe dunkler ist sie 36.'
        - call: faded(100, 50, 32)
          expect: 32
          say: 'Die Farbe 32 ist Blau mit der Helligkeit 0, schon ganz dunkel: Sie bleibt 32. Prüfst du die Helligkeit `c % 16`, nicht die Farbe selbst? Sonst rutscht 32 auf 31, ins Gold.'
        - call: faded(100, 50, 0)
          expect: 0
          say: 'Der Himmel, Farbe 0, bleibt der Himmel.'
        - call: faded(0, 0, 15)
          expect: 14
          say: 'Das Pixel in der Ecke links oben wird nicht dunkler. Geht `fade` über alle Pixel, `x` von 0 bis `W - 1` und `y` von 0 bis `H - 1`?'
        - call: faded(W - 1, H - 1, 63)
          expect: 62
          say: 'Das Pixel in der Ecke rechts unten wird nicht dunkler. Geht `fade` über alle Pixel, `x` von 0 bis `W - 1` und `y` von 0 bis `H - 1`?'
        - call: '({ screen[50][100] = 37; fade(); fade(); screen[50][100]; })'
          expect: 35
          say: 'Zweimal `fade` macht ein Pixel zwei Stufen dunkler, nicht mehr.'

  - id: erster-funke
    title: Der erste Funke
    prompt: |
      Schreib das Programm mit dem Funken in `feuerwerk.c` und übersetze es mit
      `make PROGRAM=feuerwerk`.
    file: feuerwerk/feuerwerk.c
    check:
      type: files
      path: feuerwerk/feuerwerk.html
      expect:
        format: text
    feedback:
      - when: { problem: missing }
        say: Es gibt noch keine `feuerwerk.html`. Steht im Terminal nach `make PROGRAM=feuerwerk` ein Fehler? Die erste Meldung nennt die Zeile.

  - id: wurfhoehe
    title: Wie hoch steigt der Funke?
    prediction: true
    prompt: |
      Ein Funke startet senkrecht nach oben mit `vy = -100`, also 100 Pixel pro
      Sekunde, und `GRAVITY` ist 40. Wie viele Pixel steigt er, bevor er
      umkehrt? Rechne erst, dann probier es aus: Setze im Programm `vx = 0` und
      `vy = -100`.
    check:
      type: number
      expect: 125
      tolerance: 3
      unit: Pixel
    hint: |
      Er wird jede Sekunde um 40 Pixel pro Sekunde langsamer. Wie lange dauert
      es bis zum Stillstand, und wie schnell war er im Mittel?
    feedback:
      - when: { between: [240, 260] }
        say: Das wäre die Höhe, wenn er die ganze Zeit mit 100 Pixeln pro Sekunde flöge. Er wird aber langsamer, im Mittel ist er nur halb so schnell.
      - when: { between: [2, 3] }
        say: Das ist die Zeit bis zum Umkehrpunkt, in Sekunden. Gefragt ist die Höhe.
    solution: Bis zum Stillstand dauert es 100 ÷ 40 = 2,5 Sekunden, im Mittel fliegt er 50 Pixel pro Sekunde, also 2,5 × 50 = 125 Pixel. Allgemein h = v² ÷ (2g).

  - id: luecke
    title: Wer rückt nach?
    prompt: |
      In `particles` leben 10 Funken, an den Indizes 0 bis 9. Der Funke an
      Index 3 verlischt. Was steht danach an Index 3?
    check:
      type: choice
      options:
        - Der Funke, der vorher an Index 4 stand
        - Der Funke, der vorher an Index 9 stand
        - Nichts, der Platz bleibt frei, bis ein neuer Funke kommt
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: So wäre es, wenn alle folgenden Funken um eins nach vorne rücken. Das Programm schiebt aber nur einen.
      - when: { picked: 2 }
        say: Dann hätte das Array Lücken, und `count` würde nicht mehr stimmen. Schau dir die Zeile `particles[i] = particles[count - 1];` an.
    solution: Der letzte Funke (Index 9) rückt an Index 3, und `count` wird 9. Die Reihenfolge ist egal, und es geht gleich schnell, egal wie viele Funken leben.

  - id: startgeschwindigkeit
    title: Wie schnell muss die Rakete sein?
    prompt: |
      Eine Rakete soll 160 Pixel hoch steigen, bei `GRAVITY` 40. Mit wie
      vielen Pixeln pro Sekunde muss sie starten? Gib die Zahl ohne
      Vorzeichen an.
    check:
      type: number
      expect: 113
      tolerance: 1.5
      unit: Pixel pro Sekunde
    hint: Die Formel steht in `launch`. Was ist dort `H - target_y`?
    feedback:
      - when: { between: [-115, -111] }
        say: Richtig gerechnet, aber ohne Vorzeichen, bitte. Nach oben ist im Programm negativ.
      - when: { between: [79, 81] }
        say: Das ist √(40 × 160). Die Formel hat noch eine 2 unter der Wurzel.
    solution: v = √(2 × 40 × 160) = √12800 ≈ 113 Pixel pro Sekunde.

  - id: rakete
    title: Deine Rakete
    prompt: |
      Schreib in `main`, was eine Rakete zur Rakete macht, und speichere. Der
      Workspace lässt dein Feuerwerk gut drei Sekunden lang laufen, ohne Fenster,
      und sieht nach jedem Bild nach, ob Raketen aufsteigen und am höchsten
      Punkt explodieren.
    file: feuerwerk/feuerwerk.c
    check:
      type: c
      file: feuerwerk/feuerwerk.c
      setup: |
        // PixelRAM ohne Fenster: ein Bild alle 0,05 Sekunden, nach frames
        // Bildern ist Schluss. set_pixel merkt sich, wo in diesem Bild
        // gezeichnet wurde, present sieht sich danach die Partikel an.
        static int frames, frame;
        static uint8_t screen[H][W];
        static int drawn_in[H][W];
        bool screen_open(int width, int height, pixel_mode mode, const char *title)
        {
            (void)width; (void)height; (void)mode; (void)title;
            return true;
        }
        bool use_palette(const char *name) { (void)name; return true; }
        void set_palette(int index, uint8_t r, uint8_t g, uint8_t b) { (void)index; (void)r; (void)g; (void)b; }
        void screen_close(void) {}
        bool should_close(void) { return frame >= frames; }
        double seconds(void) { return frame * 0.05; }
        bool mouse_button_pressed(pixel_mouse_button button) { (void)button; return false; }
        void mouse_position(int *x, int *y) { *x = 0; *y = 0; }
        void clear(uint8_t index) { memset(screen, index, sizeof screen); }
        uint8_t get_pixel(int x, int y)
        {
            return (x >= 0 && x < W && y >= 0 && y < H) ? screen[y][x] : 0;
        }
        void set_pixel(int x, int y, uint8_t index)
        {
            if (x >= 0 && x < W && y >= 0 && y < H)
            {
                screen[y][x] = index;
                drawn_in[y][x] = frame + 1;
            }
        }

        static int turned, most_sparks, most;
        static double highest = H;
        void present(void)
        {
            int sparks = 0;
            for (int i = 0; i < count; i++)
            {
                if (particles[i].rocket)
                {
                    if (particles[i].vy >= 0)
                        turned++;
                    if (particles[i].y < highest)
                        highest = particles[i].y;
                }
                else
                    sparks++;
            }
            if (sparks > most_sparks)
                most_sparks = sparks;
            if (count > most)
                most = count;
            frame++;
        }

        // die meisten Funken nach einem Bild, ohne die Raketen
        int most_sparks_after(int n) { frames = n; hs_student_main(); return most_sparks; }
        // Bilder, nach denen eine Rakete noch lebt, die nicht mehr steigt
        int frames_with_turned_rocket(int n) { frames = n; hs_student_main(); return turned; }
        // wie hoch die Raketen steigen: das kleinste y einer Rakete
        double highest_rocket(int n) { frames = n; hs_student_main(); return highest; }
        // die meisten Partikel nach einem Bild
        int most_particles_after(int n) { frames = n; hs_student_main(); return most; }
      cases:
        - call: most_particles_after(64) < 1500
          expect: true
          say: 'Es werden viel zu viele Partikel, oder das Programm wird sehr langsam: Etwas explodiert immer wieder. Verlischt die Rakete mit `p->life = 0`, wenn sie explodiert? Und explodieren nur Raketen, mit `p->rocket` in der Bedingung?'
        - call: most_sparks_after(64) > 0
          expect: true
          say: 'In gut drei Sekunden explodiert keine Rakete. Fragt die Schleife, ob eine Rakete umkehrt, also `p->rocket` und `p->vy >= 0`, und ruft dann `explode(p)` auf?'
        - call: highest_rocket(64) < 100
          expect: true
          say: 'Die Raketen steigen nicht auf, sie explodieren schon beim Start. Solange `vy` negativ ist, steigt eine Rakete; explodieren soll sie, sobald `vy` nicht mehr negativ ist.'
        - call: frames_with_turned_rocket(64)
          expect: 0
          say: 'Nach manchen Bildern lebt noch eine Rakete, die schon umgekehrt ist. Verlischt sie, wenn sie explodiert, mit `p->life = 0`?'

  - id: abgabe
    title: Dein Feuerwerk
    prompt: |
      Bau mindestens eine der Ideen am Ende der Seite in dein Feuerwerk ein,
      oder eine eigene, und gib die Datei ab. Deine Lehrkraft sieht genau
      diesen Stand; du kannst jederzeit neu abgeben.
    check:
      type: submit
      pick: feuerwerk/*.c
      max_size: 200kB
