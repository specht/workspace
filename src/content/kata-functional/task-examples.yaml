# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
# Der Startcode jeder Kata muss von selbst scheitern; das prüft der Test ohne Beispiel.
format: 1
activity: kata-functional
examples:
  apply-n:
    pass:
      - answer: "def apply_n(f, n, x)\n  n.times do\n    x = f.call(x)\n  end\n  x\nend\n"
    fail:
      - answer: "def apply_n(f, n, x)\n  n.times { f.call(x) }\n  x\nend\n"
        say: "das Ergebnis geht verloren"
      - answer: "def apply_n(f, n, x)\n  f.call(x)\nend\n"
        say: "`apply_n(->(x) { x * 2 }, 3, 1)` ergibt `2`"
    python:
      pass:
        - answer: "def apply_n(f, n, x):\n    for _ in range(n):\n        x = f(x)\n    return x\n"
      fail:
        - answer: "def apply_n(f, n, x):\n    for _ in range(n):\n        f(x)\n    return x\n"
          say: "das Ergebnis geht verloren"
    javascript:
      pass:
        - answer: "function applyN(f, n, x) {\n  for (let i = 0; i < n; i++) {\n    x = f(x);\n  }\n  return x;\n}\n"
      fail:
