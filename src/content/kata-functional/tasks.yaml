  - id: my-map
    title: "map selbst schreiben"
    level: 3
    extra: true
    prompt: |
      Schreib `map` selbst: `my_map(items, f)` gibt eine neue Liste zurück, in der `f` auf jedes Element angewendet ist, `my_map([1, 2, 3], ->(x) { x * 2 })` ergibt `[2, 4, 6]`. Die Liste, die die Funktion bekommt, bleibt, wie sie ist. Ohne `map`, mit einer Schleife oder rekursiv wie McCarthys `maplist`.
    starter: |
      def my_map(items, f)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#map, Array#collect, Array#map!, Array#collect!, Array#flat_map, Array#filter_map]
      cases:
        - call: "my_map([1, 2, 3], ->(x) { x * 2 })"
          expect: "[2, 4, 6]"
        - call: "my_map([], ->(x) { x + 1 })"
          expect: "[]"
        - call: "my_map(['a', 'b'], ->(s) { s.upcase })"
          expect: "['A', 'B']"
        - call: "items = [1, 2]; my_map(items, ->(x) { x * 10 }); items"
          expect: "[1, 2]"
          say: "Die Liste, die `my_map` bekommt, bleibt, wie sie ist."
        - call: "my_map([3], ->(x) { x - 3 })"
          expect: "[0]"
    feedback:
      - when: { same_as: "def my_map(items, f)\n  items.each_index { |i| items[i] = f.call(items[i]) }\n  items\nend\n" }
        say: "Dein Code ändert die Liste, die er bekommt. Bau eine neue und lass die alte, wie sie ist."
    hint:
      - "Mit einer Schleife: eine leere Liste, in die für jedes Element `f.call(item)` kommt."
      - "Rekursiv wie McCarthy: Die leere Liste gibt die leere Liste. Sonst ist das Ergebnis `f` vom ersten Element, und dahinter `my_map` vom Rest, `items[1..]`."
    solution: |
      ```ruby
      def my_map(items, f)
        result = []
        items.each do |item|
          result << f.call(item)
        end
        result
      end
      ```
