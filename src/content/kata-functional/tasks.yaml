format: 1
activity: kata-functional
tasks:
  - id: predict-twice
    title: "Zweimal quadrieren"
    level: 1
    prediction: true
    prompt: |
      Was gibt `puts twice(->(x) { x * x }, 3)` aus?
    check:
      type: number
      expect: 81
    feedback:
      - when: { equals: 9 }
        say: "Das ist `x * x` einmal. `twice` ruft die Funktion zweimal auf: erst mit 3, dann mit dem, was dabei herauskam."
      - when: { equals: 6 }
        say: "Die Funktion multipliziert `x` mit sich selbst. Was ist 3 mal 3, und was ist das Ergebnis mal sich selbst?"
      - when: { equals: 18 }
        say: "`twice` verdoppelt nicht das Ergebnis, sondern ruft die Funktion ein zweites Mal auf, mit dem Ergebnis des ersten Aufrufs."
    python:
      prompt: |
        Was gibt `print(twice(lambda x: x * x, 3))` aus?
    javascript:
      prompt: |
        Was gibt `console.log(twice(x => x * x, 3))` aus?

  - id: apply-n
    title: "n-mal anwenden"
    level: 1
    prompt: |
      Schreib eine Funktion `apply_n(f, n, x)`, die die Funktion `f` `n`-mal hintereinander auf `x` anwendet und das Ergebnis zurückgibt: `apply_n(->(x) { x * 2 }, 3, 1)` ergibt `8`, denn aus 1 wird 2, dann 4, dann 8. Ist `n` gleich 0, kommt `x` unverändert zurück. Die Prüfung ruft deine Funktion mit verschiedenen Lambdas auf; eine Schleife ist hier erlaubt.
    starter: |
      def apply_n(f, n, x)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "apply_n(->(x) { x * 2 }, 3, 1)"
          expect: "8"
        - call: "apply_n(->(x) { x + 10 }, 0, 5)"
          expect: "5"
          say: "Ist `n` gleich 0, wird `f` gar nicht aufgerufen."
        - call: "apply_n(->(x) { x - 1 }, 4, 10)"
          expect: "6"
        - call: "apply_n(->(s) { s + '!' }, 2, 'Hallo')"
          expect: "'Hallo!!'"
          say: "Auch ein String geht: Was `f` bekommt, entscheidet nur `f`."
        - call: "apply_n(->(x) { x * x }, 1, 7)"
          expect: "49"
    feedback:
      - when: { same_as: "def apply_n(f, n, x)\n  n.times { f.call(x) }\n  x\nend\n" }
        say: "Du rufst `f` auf, aber das Ergebnis geht verloren. Merk es dir in `x`, damit der nächste Aufruf damit weiterrechnet."
    hint:
      - "Von Hand: `apply_n(->(x) { x * 2 }, 3, 1)` rechnet 1, 2, 4, 8. Jeder Aufruf von `f` bekommt das Ergebnis des vorigen."
      - "Eine Schleife, die `n`-mal läuft, `n.times do … end`; in ihr wird `x` zu `f.call(x)`."
    solution: |
      ```ruby
      def apply_n(f, n, x)
        n.times do
          x = f.call(x)
        end
        x
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `apply_n(f, n, x)`, die die Funktion `f` `n`-mal hintereinander auf `x` anwendet und das Ergebnis zurückgibt: `apply_n(lambda x: x * 2, 3, 1)` ergibt `8`, denn aus 1 wird 2, dann 4, dann 8. Ist `n` gleich 0, kommt `x` unverändert zurück. Die Prüfung ruft deine Funktion mit verschiedenen Lambdas auf; eine Schleife ist hier erlaubt.
      starter: |
        def apply_n(f, n, x):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "apply_n(lambda x: x * 2, 3, 1)"
            expect: "8"
          - call: "apply_n(lambda x: x + 10, 0, 5)"
            expect: "5"
            say: "Ist `n` gleich 0, wird `f` gar nicht aufgerufen."
          - call: "apply_n(lambda x: x - 1, 4, 10)"
            expect: "6"
          - call: "apply_n(lambda s: s + '!', 2, 'Hallo')"
            expect: "'Hallo!!'"
            say: "Auch ein String geht: Was `f` bekommt, entscheidet nur `f`."
          - call: "apply_n(lambda x: x * x, 1, 7)"
            expect: "49"
      feedback:
        - when: { same_as: "def apply_n(f, n, x):\n    for _ in range(n):\n        f(x)\n    return x\n" }
          say: "Du rufst `f` auf, aber das Ergebnis geht verloren. Merk es dir in `x`, damit der nächste Aufruf damit weiterrechnet."
      hint:
        - "Von Hand: `apply_n(lambda x: x * 2, 3, 1)` rechnet 1, 2, 4, 8. Jeder Aufruf von `f` bekommt das Ergebnis des vorigen."
        - "Eine Schleife, die `n`-mal läuft, `for _ in range(n):`; in ihr wird `x` zu `f(x)`."
      solution: |
        ```python
        def apply_n(f, n, x):
            for _ in range(n):
                x = f(x)
            return x
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `applyN(f, n, x)`, die die Funktion `f` `n`-mal hintereinander auf `x` anwendet und das Ergebnis zurückgibt: `applyN(x => x * 2, 3, 1)` ergibt `8`, denn aus 1 wird 2, dann 4, dann 8. Ist `n` gleich 0, kommt `x` unverändert zurück. Die Prüfung ruft deine Funktion mit verschiedenen Arrow Functions auf; eine Schleife ist hier erlaubt.
      starter: |
        function applyN(f, n, x) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "applyN(x => x * 2, 3, 1)"
            expect: "8"
          - call: "applyN(x => x + 10, 0, 5)"
            expect: "5"
            say: "Ist `n` gleich 0, wird `f` gar nicht aufgerufen."
          - call: "applyN(x => x - 1, 4, 10)"
            expect: "6"
          - call: "applyN(s => s + '!', 2, 'Hallo')"
            expect: "'Hallo!!'"
            say: "Auch ein String geht: Was `f` bekommt, entscheidet nur `f`."
          - call: "applyN(x => x * x, 1, 7)"
            expect: "49"
      feedback:
        - when: { same_as: "function applyN(f, n, x) {\n  for (let i = 0; i < n; i++) {\n    f(x);\n  }\n  return x;\n}\n" }
          say: "Du rufst `f` auf, aber das Ergebnis geht verloren. Merk es dir in `x`, damit der nächste Aufruf damit weiterrechnet."
      hint:
        - "Von Hand: `applyN(x => x * 2, 3, 1)` rechnet 1, 2, 4, 8. Jeder Aufruf von `f` bekommt das Ergebnis des vorigen."
        - "Eine Schleife, die `n`-mal läuft, `for (let i = 0; i < n; i++)`; in ihr wird `x` zu `f(x)`."
      solution: |
        ```javascript
        function applyN(f, n, x) {
          for (let i = 0; i < n; i++) {
            x = f(x);
          }
          return x;
        }
        ```

  - id: make-counter
    title: "Ein Zähler, der weiterzählt"
    level: 3
    prompt: |
      Schreib eine Funktion `make_counter`, die einen Zähler zurückgibt: ein Lambda ohne Parameter, das bei jedem Aufruf die nächste Zahl zurückgibt, beim ersten `1`, dann `2`, dann `3`. Zwei Zähler zählen jeder für sich: Wer `a` dreimal aufruft, ändert nichts an `b`.
    starter: |
      def make_counter
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "counter = make_counter; counter.call"
          expect: "1"
        - call: "counter = make_counter; [counter.call, counter.call, counter.call]"
          expect: "[1, 2, 3]"
        - call: "a = make_counter; b = make_counter; a.call; a.call; a.call; [a.call, b.call]"
          expect: "[4, 1]"
          say: "Jeder Aufruf von `make_counter` baut einen neuen Zähler mit einer eigenen Variablen, die bei 0 beginnt."
    hint:
      - "Der Zähler muss sich von einem Aufruf zum nächsten etwas merken. Wo kann diese Variable stehen, damit sie nicht bei jedem Aufruf wieder 0 ist?"
      - "Leg die Variable in `make_counter` an, vor dem Lambda: `count = 0`. Das Lambda merkt sich sie wie `make_adder` sein `n`, und es darf sie auch ändern."
      - "Im Lambda erhöht `count += 1` die Variable, und das ist zugleich sein Ergebnis: `-> { count += 1 }`."
    solution: |
      ```ruby
      def make_counter
        count = 0
        -> { count += 1 }
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `make_counter`, die einen Zähler zurückgibt: eine Funktion ohne Parameter, die bei jedem Aufruf die nächste Zahl zurückgibt, beim ersten `1`, dann `2`, dann `3`. Zwei Zähler zählen jeder für sich: Wer `a` dreimal aufruft, ändert nichts an `b`. Ein Lambda darf in Python nichts zuweisen; schreib den Zähler deshalb mit `def` innerhalb von `make_counter`.
      starter: |
        def make_counter():
            pass
      check:
        type: function
        language: python
        cases:
          - call: "counter = make_counter(); counter()"
            expect: "1"
          - call: "counter = make_counter(); [counter(), counter(), counter()]"
            expect: "[1, 2, 3]"
          - call: "a = make_counter(); b = make_counter(); a(); a(); a(); [a(), b()]"
            expect: "[4, 1]"
            say: "Jeder Aufruf von `make_counter` baut einen neuen Zähler mit einer eigenen Variablen, die bei 0 beginnt."
      hint:
        - "Der Zähler muss sich von einem Aufruf zum nächsten etwas merken. Wo kann diese Variable stehen, damit sie nicht bei jedem Aufruf wieder 0 ist?"
        - "Leg die Variable in `make_counter` an, vor der inneren Funktion: `count = 0`. Die innere Funktion merkt sich sie wie das Lambda von `make_adder` sein `n`."
        - "Ändern darf die innere Funktion `count` erst, wenn sie mit `nonlocal count` sagt, dass sie die Variable von draußen meint; ohne das hält Python `count` für eine neue Variable der inneren Funktion."
      solution: |
        ```python
        def make_counter():
            count = 0
            def next_number():
                nonlocal count
                count += 1
                return count
            return next_number
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `makeCounter`, die einen Zähler zurückgibt: eine Funktion ohne Parameter, die bei jedem Aufruf die nächste Zahl zurückgibt, beim ersten `1`, dann `2`, dann `3`. Zwei Zähler zählen jeder für sich: Wer `a` dreimal aufruft, ändert nichts an `b`.
      starter: |
        function makeCounter() {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "const counter = makeCounter(); counter()"
            expect: "1"
          - call: "const counter = makeCounter(); [counter(), counter(), counter()]"
            expect: "[1, 2, 3]"
          - call: "const a = makeCounter(); const b = makeCounter(); a(); a(); a(); [a(), b()]"
            expect: "[4, 1]"
            say: "Jeder Aufruf von `makeCounter` baut einen neuen Zähler mit einer eigenen Variablen, die bei 0 beginnt."
      hint:
        - "Der Zähler muss sich von einem Aufruf zum nächsten etwas merken. Wo kann diese Variable stehen, damit sie nicht bei jedem Aufruf wieder 0 ist?"
        - "Leg die Variable in `makeCounter` an, vor der Arrow Function: `let count = 0;`. Die Arrow Function merkt sich sie wie die von `makeAdder` ihr `n`, und sie darf sie auch ändern."
        - "In der Arrow Function erhöht `count += 1` die Variable, und das ist zugleich ihr Ergebnis: `() => count += 1`."
      solution: |
        ```javascript
        function makeCounter() {
          let count = 0;
          return () => count += 1;
        }
        ```

