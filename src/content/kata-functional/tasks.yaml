  - id: with-tax
    title: "Preise mit Steuer"
    level: 1
    prompt: |
      Ein Laden speichert seine Preise ohne Mehrwertsteuer, in Cent. Schreib eine Funktion `with_tax(prices)`, die jeden Preis mit 19 % Mehrwertsteuer zurückgibt, als neue Liste: `with_tax([100, 300])` ergibt `[119, 357]`. Rechne mit ganzen Zahlen, `price * 119 / 100`; die Preise sind volle Euro, so geht es auf. Mit `map`, ohne eigene Schleife.
    starter: |
      def with_tax(prices)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#each, Array#each_with_index, Array#each_index, Integer#times, Integer#upto, Integer#downto, Range#each, Kernel#loop]
      cases:
        - call: "with_tax([100, 300, 1200])"
          expect: "[119, 357, 1428]"
        - call: "with_tax([])"
          expect: "[]"
          say: "Eine leere Liste bleibt leer."
        - call: "with_tax([500])"
          expect: "[595]"
        - call: "with_tax([200, 200])"
          expect: "[238, 238]"
    feedback:
      - when: { same_as: "def with_tax(prices)\n  result = []\n  prices.each { |price| result << price * 119 / 100 }\n  result\nend\n" }
        say: "Dein Code geht die Liste selbst durch, mit `each`, `for` oder `times`, und das ist hier abgeschaltet. Nimm `map`: `prices.map { |price| … }` gibt die neue Liste gleich zurück."
      - when: { same_as: "def with_tax(prices)\n  prices.map { |price| price * 19 / 100 }\nend\n" }
        say: "Das ist nur die Steuer. Der Preis mit Steuer ist der Preis und die Steuer zusammen."
    hint:
      - "Für einen einzigen Preis: `100 * 119 / 100` ist 119. Dasselbe soll mit jedem Preis der Liste geschehen."
      - "`prices.map { |price| … }` gibt die neue Liste zurück; in den Block kommt die Rechnung für einen Preis."
    solution: |
      ```ruby
      def with_tax(prices)
        prices.map { |price| price * 119 / 100 }
      end
      ```
    python:
      prompt: |
        Ein Laden speichert seine Preise ohne Mehrwertsteuer, in Cent. Schreib eine Funktion `with_tax(prices)`, die jeden Preis mit 19 % Mehrwertsteuer zurückgibt, als neue Liste: `with_tax([100, 300])` ergibt `[119, 357]`. Rechne mit ganzen Zahlen, `price * 119 // 100`; die Preise sind volle Euro, so geht es auf. Mit `map` oder einer List Comprehension, ohne eigene Schleife.
      starter: |
        def with_tax(prices):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "with_tax([100, 300, 1200])"
            expect: "[119, 357, 1428]"
          - call: "with_tax([])"
            expect: "[]"
            say: "Eine leere Liste bleibt leer."
          - call: "with_tax([500])"
            expect: "[595]"
          - call: "with_tax([200, 200])"
            expect: "[238, 238]"
      feedback:
        - when: { same_as: "def with_tax(prices):\n    return list(map(lambda price: price * 19 // 100, prices))\n" }
          say: "Das ist nur die Steuer. Der Preis mit Steuer ist der Preis und die Steuer zusammen."
      hint:
        - "Für einen einzigen Preis: `100 * 119 // 100` ist 119. Dasselbe soll mit jedem Preis der Liste geschehen."
        - "`list(map(lambda price: …, prices))` gibt die neue Liste zurück; ohne `list(…)` ist es noch ein `map`-Objekt."
      solution: |
        ```python
        def with_tax(prices):
            return list(map(lambda price: price * 119 // 100, prices))
        ```
    javascript:
      prompt: |
        Ein Laden speichert seine Preise ohne Mehrwertsteuer, in Cent. Schreib eine Funktion `withTax(prices)`, die jeden Preis mit 19 % Mehrwertsteuer zurückgibt, als neue Liste: `withTax([100, 300])` ergibt `[119, 357]`. Rechne mit ganzen Zahlen, `price * 119 / 100`; die Preise sind volle Euro, so geht es auf. Mit `map`, ohne eigene Schleife.
      starter: |
        function withTax(prices) {
        }
      check:
        type: function
        language: javascript
        forbid: [Array.prototype.forEach]
        cases:
          - call: "withTax([100, 300, 1200])"
            expect: "[119, 357, 1428]"
          - call: "withTax([])"
            expect: "[]"
            say: "Eine leere Liste bleibt leer."
          - call: "withTax([500])"
            expect: "[595]"
          - call: "withTax([200, 200])"
            expect: "[238, 238]"
      feedback:
        - when: { same_as: "function withTax(prices) {\n  const result = [];\n  prices.forEach(price => result.push(price * 119 / 100));\n  return result;\n}\n" }
          say: "Dein Code geht die Liste mit `forEach` selbst durch, und das ist hier abgeschaltet. Nimm `map`: `prices.map(price => …)` gibt die neue Liste gleich zurück."
        - when: { same_as: "function withTax(prices) {\n  return prices.map(price => price * 19 / 100);\n}\n" }
          say: "Das ist nur die Steuer. Der Preis mit Steuer ist der Preis und die Steuer zusammen."
      hint:
        - "Für einen einzigen Preis: `100 * 119 / 100` ist 119. Dasselbe soll mit jedem Preis der Liste geschehen."
        - "`prices.map(price => …)` gibt die neue Liste zurück; rechts vom Pfeil steht die Rechnung für einen Preis."
      solution: |
        ```javascript
        function withTax(prices) {
          return prices.map(price => price * 119 / 100);
        }
        ```

  - id: lengths
    title: "Wortlängen"
    level: 1
    prompt: |
      Schreib eine Funktion `lengths(words)`, die zu jedem Wort seine Länge zurückgibt, als neue Liste: `lengths(['Igel', 'Wal'])` ergibt `[4, 3]`. Mit `map`, ohne eigene Schleife.
    starter: |
      def lengths(words)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#each, Array#each_with_index, Array#each_index, Integer#times, Integer#upto, Integer#downto, Range#each, Kernel#loop]
      cases:
        - call: "lengths(['Igel', 'Ameise', 'Wal'])"
          expect: "[4, 6, 3]"
        - call: "lengths([])"
          expect: "[]"
        - call: "lengths(['Straße'])"
          expect: "[6]"
        - call: "lengths(['', 'a'])"
          expect: "[0, 1]"
          say: "Das leere Wort hat die Länge 0."
    feedback:
      - when: { same_as: "def lengths(words)\n  result = []\n  words.each { |word| result << word.length }\n  result\nend\n" }
        say: "Dein Code geht die Liste selbst durch, mit `each`, `for` oder `times`, und das ist hier abgeschaltet. Nimm `map`: `words.map { |word| … }` gibt die neue Liste gleich zurück."
      - when: { same_as: "def lengths(words)\n  words.join.length\nend\n" }
        say: "Du zählst alle Buchstaben zusammen. Gefragt ist eine Liste mit einer Länge für jedes Wort."
    hint:
      - "`'Igel'.length` ist 4. Was soll mit jedem Wort der Liste geschehen?"
      - "`words.map { |word| … }`: In den Block kommt, was aus einem Wort werden soll."
    solution: |
      ```ruby
      def lengths(words)
        words.map { |word| word.length }
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `lengths(words)`, die zu jedem Wort seine Länge zurückgibt, als neue Liste: `lengths(['Igel', 'Wal'])` ergibt `[4, 3]`. Mit `map` oder einer List Comprehension, ohne eigene Schleife.
      starter: |
        def lengths(words):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "lengths(['Igel', 'Ameise', 'Wal'])"
            expect: "[4, 6, 3]"
          - call: "lengths([])"
            expect: "[]"
          - call: "lengths(['Straße'])"
            expect: "[6]"
          - call: "lengths(['', 'a'])"
            expect: "[0, 1]"
            say: "Das leere Wort hat die Länge 0."
      feedback:
        - when: { same_as: "def lengths(words):\n    return len(''.join(words))\n" }
          say: "Du zählst alle Buchstaben zusammen. Gefragt ist eine Liste mit einer Länge für jedes Wort."
      hint:
        - "`len('Igel')` ist 4. Was soll mit jedem Wort der Liste geschehen?"
        - "`map` nimmt auch eine Funktion mit Namen, ohne Klammern dahinter: Welche Funktion gibt die Länge? Und `list(…)` drumherum."
      solution: |
        ```python
        def lengths(words):
            return list(map(len, words))
        ```
    javascript:
      starter: |
        function lengths(words) {
        }
      check:
        type: function
        language: javascript
        forbid: [Array.prototype.forEach]
        cases:
          - call: "lengths(['Igel', 'Ameise', 'Wal'])"
            expect: "[4, 6, 3]"
          - call: "lengths([])"
            expect: "[]"
          - call: "lengths(['Straße'])"
            expect: "[6]"
          - call: "lengths(['', 'a'])"
            expect: "[0, 1]"
            say: "Das leere Wort hat die Länge 0."
      feedback:
        - when: { same_as: "function lengths(words) {\n  const result = [];\n  words.forEach(word => result.push(word.length));\n  return result;\n}\n" }
          say: "Dein Code geht die Liste mit `forEach` selbst durch, und das ist hier abgeschaltet. Nimm `map`: `words.map(word => …)` gibt die neue Liste gleich zurück."
        - when: { same_as: "function lengths(words) {\n  return words.join('').length;\n}\n" }
          say: "Du zählst alle Buchstaben zusammen. Gefragt ist eine Liste mit einer Länge für jedes Wort."
      hint:
        - "`'Igel'.length` ist 4. Was soll mit jedem Wort der Liste geschehen?"
        - "`words.map(word => …)`: Rechts vom Pfeil steht, was aus einem Wort werden soll."
      solution: |
        ```javascript
        function lengths(words) {
          return words.map(word => word.length);
        }
        ```

  - id: evens
    title: "Nur die geraden Zahlen"
    level: 1
    prompt: |
      Schreib eine Funktion `evens(numbers)`, die nur die geraden Zahlen der Liste behält, in ihrer Reihenfolge: `evens([1, 2, 3, 4])` ergibt `[2, 4]`. Mit `select`, ohne eigene Schleife.
    starter: |
      def evens(numbers)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#each, Array#each_with_index, Array#each_index, Integer#times, Integer#upto, Integer#downto, Range#each, Kernel#loop]
      cases:
        - call: "evens([1, 2, 3, 4, 5, 6])"
          expect: "[2, 4, 6]"
        - call: "evens([])"
          expect: "[]"
        - call: "evens([1, 3, 5])"
          expect: "[]"
        - call: "evens([0, -2, 7])"
          expect: "[0, -2]"
          say: "0 und -2 sind auch gerade."
    feedback:
      - when: { same_as: "def evens(numbers)\n  numbers.map { |x| x.even? }\nend\n" }
        say: "Das ist `map`: Es gibt für jede Zahl `true` oder `false`, wie in der Vorhersage oben. Behalten, was passt, tut `select`."
      - when: { same_as: "def evens(numbers)\n  result = []\n  numbers.each { |x| result << x if x.even? }\n  result\nend\n" }
        say: "Dein Code geht die Liste selbst durch, mit `each`, `for` oder `times`, und das ist hier abgeschaltet. Nimm `select`: `numbers.select { |x| … }` gibt die neue Liste gleich zurück."
    hint:
      - "`select` fragt jede Zahl: Soll sie bleiben? Der Block gibt dafür `true` oder `false` zurück."
      - "`x.even?` fragt, ob `x` gerade ist: `numbers.select { |x| … }`."
