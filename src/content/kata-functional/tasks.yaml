  - id: compose
    title: "Zwei Funktionen zu einer"
    level: 3
    extra: true
    prompt: |
      Schreib eine Funktion `compose(f, g)`, die eine neue Funktion zurückgibt: Sie wendet erst `g` an und dann `f` auf das Ergebnis, wie f ∘ g in der Mathematik. `compose(->(x) { x + 1 }, ->(x) { x * 10 }).call(5)` ergibt `51`: erst 5 · 10 = 50, dann 50 + 1. Ruby hat dafür `f << g` fertig; schreib es hier selbst.
    starter: |
      def compose(f, g)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "compose(->(x) { x + 1 }, ->(x) { x * 10 }).call(5)"
          expect: "51"
        - call: "compose(->(x) { x * 10 }, ->(x) { x + 1 }).call(5)"
          expect: "60"
        - call: "compose(->(s) { s + '!' }, ->(s) { s.upcase }).call('hallo')"
          expect: "'HALLO!'"
        - call: "twice = compose(->(x) { x * 2 }, ->(x) { x * 2 }); compose(twice, twice).call(1)"
          expect: "16"
          say: "Was `compose` zurückgibt, ist wieder eine Funktion, und die lässt sich wieder zusammensetzen."
    feedback:
      - when: { same_as: "def compose(f, g)\n  ->(x) { g.call(f.call(x)) }\nend\n" }
        say: "Dein Code wendet erst `f` an und dann `g`. Bei f ∘ g ist es umgekehrt: erst `g`, dann `f`."
    hint:
      - "Was gibt `compose` zurück? Eine Funktion, die ein `x` bekommt. Was rechnet sie mit diesem `x`, Schritt für Schritt?"
      - "Wie `make_adder` gibt `compose` ein Lambda zurück; darin darfst du `f` und `g` aufrufen."
    solution: |
      ```ruby
      def compose(f, g)
        ->(x) { f.call(g.call(x)) }
      end
      ```
