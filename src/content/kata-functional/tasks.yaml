          total += n * n if n.odd?
        end
        total
      end
      ```

      `odd_square_sum([1, 2, 3])` ergibt `10`, denn 1 · 1 + 3 · 3 = 10. Schreib sie als Kette, ohne Schleife: mit `select`, `map` und `sum`. `each`, `for` und `times` sind abgeschaltet.
