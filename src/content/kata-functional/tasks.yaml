        - "Jede der drei Antworten ist ein Schritt: `filter(…)`, darum `map(…)`, darum `sum(…)`. Von innen nach außen gelesen ist es die Reihenfolge der Schleife."
      solution: |
        ```python
        def odd_square_sum(numbers):
            odd = filter(lambda n: n % 2 == 1, numbers)
            squares = map(lambda n: n * n, odd)
            return sum(squares)
        ```
    javascript:
      prompt: |
        Diese Funktion zählt die Quadrate der ungeraden Zahlen einer Liste zusammen, mit einer Schleife:

        ```javascript
        function oddSquareSum(numbers) {
          let total = 0;
          numbers.forEach(n => {
            if (n % 2 !== 0) {
              total += n * n;
            }
          });
          return total;
        }
        ```

        `oddSquareSum([1, 2, 3])` ergibt `10`, denn 1 · 1 + 3 · 3 = 10. Schreib sie als Kette, ohne Schleife: mit `filter`, `map` und `reduce`. `forEach` ist abgeschaltet; eine Schleife mit `for` kann die Prüfung nicht abschalten, die Kata ist aber erst gelöst, wenn keine mehr dasteht.
      starter: |
        function oddSquareSum(numbers) {
          // hier: eine Kette
        }
      check:
        type: function
        language: javascript
        forbid: [Array.prototype.forEach]
        cases:
          - call: "oddSquareSum([1, 2, 3])"
            expect: "10"
          - call: "oddSquareSum([])"
            expect: "0"
          - call: "oddSquareSum([2, 4, 6])"
            expect: "0"
          - call: "oddSquareSum([-3, 5])"
            expect: "34"
            say: "-3 ist auch ungerade, und (-3) · (-3) ist 9."
          - call: "oddSquareSum([1, 1, 1])"
            expect: "3"
      feedback:
        - when: { same_as: "function oddSquareSum(numbers) {\n  let total = 0;\n  numbers.forEach(n => {\n    if (n % 2 !== 0) {\n      total += n * n;\n    }\n  });\n  return total;\n}\n" }
          say: "Dein Code geht die Liste mit `forEach` selbst durch, und das ist hier abgeschaltet. Nimm `filter`, `map` und `reduce`."
        - when: { same_as: "function oddSquareSum(numbers) {\n  return numbers.filter(n => n % 2 === 1).map(n => n * n).reduce((sum, x) => sum + x, 0);\n}\n" }
          say: "In JavaScript ist `-3 % 2` gleich `-1`, nicht `1`: Der Rest hat das Vorzeichen der Zahl. Frag darum, ob der Rest nicht 0 ist, `n % 2 !== 0`."
      hint:
        - "Lies die Schleife als Frage: Welche Zahlen zählen? Was wird aus jeder? Was geschieht am Ende mit allen?"
        - "Jede der drei Antworten ist ein Schritt der Kette: `numbers.filter(…).map(…).reduce(…, 0)`."
      solution: |
        ```javascript
        function oddSquareSum(numbers) {
          return numbers
            .filter(n => n % 2 !== 0)
            .map(n => n * n)
            .reduce((sum, x) => sum + x, 0);
        }
        ```

  - id: first-overdraft
