# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
# Der Startcode jeder Kata muss von selbst scheitern; das prüft der Test ohne Beispiel.
format: 1
activity: kata-functions
examples:
  add:
    pass:
      - answer: "def add(a, b)\n  a + b\nend\n"
    fail:
      - answer: "def add(a, b)\n  a - b\nend\n"
    python:
      pass:
        - answer: "def add(a, b):\n    return a + b\n"
      fail:
        - answer: "def add(a, b):\n    print(a + b)\n"
    javascript:
      pass:
        - answer: "function add(a, b) {\n  return a + b;\n}\n"
      fail:
        - answer: "function add(a, b) {\n  console.log(a + b);\n}\n"
  double:
    pass:
      - answer: "def double(n)\n  2 * n\nend\n"
    fail:
      - answer: "def double(n)\n  n + 2\nend\n"
    python:
      pass:
        - answer: "def double(n):\n    return 2 * n\n"
      fail:
        - answer: "def double(n):\n    return n + 2\n"
    javascript:
      pass:
        - answer: "function double(n) {\n  return 2 * n;\n}\n"
      fail:
        - answer: "function double(n) {\n  return n + 2;\n}\n"
  greet:
    pass:
      - answer: "def greet(name)\n  \"Hallo, #{name}!\"\nend\n"
    fail:
      - answer: "def greet(name)\n  'Hallo ' + name\nend\n"
    python:
      pass:
        - answer: "def greet(name):\n    return f'Hallo, {name}!'\n"
      fail:
        - answer: "def greet(name):\n    return 'Hallo ' + name\n"
    javascript:
      pass:
        - answer: "function greet(name) {\n  return `Hallo, ${name}!`;\n}\n"
      fail:
        - answer: "function greet(name) {\n  return 'Hallo ' + name;\n}\n"
  rectangle:
    pass:
      - answer: "def rectangle_area(width, height)\n  width * height\nend\n"
    fail:
      - answer: "def rectangle_area(width, height)\n  2 * width + 2 * height\nend\n"
    python:
      pass:
        - answer: "def rectangle_area(width, height):\n    return width * height\n"
      fail:
        - answer: "def rectangle_area(width, height):\n    return 2 * width + 2 * height\n"
    javascript:
      pass:
        - answer: "function rectangleArea(width, height) {\n  return width * height;\n}\n"
      fail:
        - answer: "function rectangleArea(width, height) {\n  return 2 * width + 2 * height;\n}\n"
  fahrenheit:
    pass:
      - answer: "def fahrenheit(celsius)\n  celsius * 1.8 + 32\nend\n"
    fail:
      - answer: "def fahrenheit(celsius)\n  celsius * 9 / 5 + 32\nend\n"
      - answer: "def fahrenheit(celsius)\n  (celsius + 32) * 1.8\nend\n"
    python:
      pass:
        - answer: "def fahrenheit(celsius):\n    return celsius * 1.8 + 32\n"
      fail:
        - answer: "def fahrenheit(celsius):\n    return (celsius + 32) * 1.8\n"
    javascript:
      pass:
        - answer: "function fahrenheit(celsius) {\n  return celsius * 1.8 + 32;\n}\n"
      fail:
        - answer: "function fahrenheit(celsius) {\n  return (celsius + 32) * 1.8;\n}\n"
  clock:
    pass:
      - answer: "def clock(seconds)\n  format('%d:%02d', seconds / 60, seconds % 60)\nend\n"
    fail:
      - answer: "def clock(seconds)\n  \"#{seconds / 60}:#{seconds % 60}\"\nend\n"
    python:
      pass:
        - answer: "def clock(seconds):\n    return f'{seconds // 60}:{seconds % 60:02d}'\n"
      fail:
        - answer: "def clock(seconds):\n    return f'{seconds // 60}:{seconds % 60}'\n"
        - answer: "def clock(seconds):\n    return f'{seconds / 60}:{seconds % 60:02d}'\n"
    javascript:
      pass:
        - answer: "function clock(seconds) {\n  const minutes = Math.floor(seconds / 60);\n  return `${minutes}:${String(seconds % 60).padStart(2, '0')}`;\n}\n"
      fail:
        - answer: "function clock(seconds) {\n  return `${Math.floor(seconds / 60)}:${seconds % 60}`;\n}\n"
  average:
    pass:
      - answer: "def average(a, b, c)\n  (a + b + c) / 3.0\nend\n"
    fail:
      - answer: "def average(a, b, c)\n  (a + b + c) / 3\nend\n"
      - answer: "def average(a, b, c)\n  a + b + c / 3.0\nend\n"
    python:
      pass:
        - answer: "def average(a, b, c):\n    return (a + b + c) / 3\n"
      fail:
        - answer: "def average(a, b, c):\n    return a + b + c / 3\n"
        - answer: "def average(a, b, c):\n    return (a + b + c) // 3\n"
    javascript:
      pass:
        - answer: "function average(a, b, c) {\n  return (a + b + c) / 3;\n}\n"
      fail:
        - answer: "function average(a, b, c) {\n  return a + b + c / 3;\n}\n"
  price:
    pass:
      - answer: "def price(count, unit_price, discount)\n  total = count * unit_price\n  total - total * discount / 100.0\nend\n"
    fail:
      - answer: "def price(count, unit_price, discount)\n  count * unit_price - discount\nend\n"
    python:
      pass:
        - answer: "def price(count, unit_price, discount):\n    total = count * unit_price\n    return total - total * discount / 100\n"
      fail:
        - answer: "def price(count, unit_price, discount):\n    return count * unit_price - discount\n"
    javascript:
      pass:
        - answer: "function price(count, unitPrice, discount) {\n  const total = count * unitPrice;\n  return total - total * discount / 100;\n}\n"
      fail:
        - answer: "function price(count, unitPrice, discount) {\n  return count * unitPrice - discount;\n}\n"
  clock-after:
    pass:
      - answer: "def clock_after(hour, minute, minutes)\n  total = (hour * 60 + minute + minutes) % (24 * 60)\n  format('%02d:%02d', total / 60, total % 60)\nend\n"
    fail:
      - answer: "def clock_after(hour, minute, minutes)\n  t = hour * 60 + minute + minutes\n  format('%02d:%02d', t / 60, t % 60)\nend\n"
    python:
      pass:
        - answer: "def clock_after(hour, minute, minutes):\n    total = (hour * 60 + minute + minutes) % (24 * 60)\n    return f'{total // 60:02d}:{total % 60:02d}'\n"
      fail:
        - answer: "def clock_after(hour, minute, minutes):\n    t = hour * 60 + minute + minutes\n    return f'{t // 60:02d}:{t % 60:02d}'\n"
    javascript:
      pass:
        - answer: "function clockAfter(hour, minute, minutes) {\n  const total = (hour * 60 + minute + minutes) % (24 * 60);\n  const two = (n) => String(n).padStart(2, '0');\n  return `${two(Math.floor(total / 60))}:${two(total % 60)}`;\n}\n"
      fail:
        - answer: "function clockAfter(hour, minute, minutes) {\n  const t = hour * 60 + minute + minutes;\n  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');\n}\n"
  last-digit:
    pass:
      - answer: "def last_digit(n)\n  n.abs % 10\nend\n"
    fail:
      - answer: "def last_digit(n)\n  n % 10\nend\n"
      - answer: "def last_digit(n)\n  n.to_s[-1].to_i\nend\n"
        say: "benutzt `Integer#to_s`"
    python:
      pass:
        - answer: "def last_digit(n):\n    return abs(n) % 10\n"
      fail:
        - answer: "def last_digit(n):\n    return n % 10\n"
        - answer: "def last_digit(n):\n    return int(str(n)[-1])\n"
          say: "benutzt `str`"
    javascript:
      pass:
        - answer: "function lastDigit(n) {\n  return Math.abs(n) % 10;\n}\n"
      fail:
        - answer: "function lastDigit(n) {\n  return n % 10;\n}\n"
        - answer: "function lastDigit(n) {\n  return Number(n.toString().slice(-1));\n}\n"
          say: "benutzt `Number.prototype.toString`"
  reverse-digits:
    pass:
      - answer: "def reverse_digits(n)\n  ones = n % 10\n  tens = n / 10 % 10\n  hundreds = n / 100\n  return ones if n < 10\n  return ones * 10 + tens if n < 100\n  ones * 100 + tens * 10 + hundreds\nend\n"
    fail:
      - answer: "def reverse_digits(n)\n  n.to_s.reverse.to_i\nend\n"
        say: "benutzt `Integer#to_s`"
      - answer: "def reverse_digits(n)\n  (n % 10) * 100 + (n / 10 % 10) * 10 + n / 100\nend\n"
    python:
      pass:
        - answer: "def reverse_digits(n):\n    ones = n % 10\n    tens = n // 10 % 10\n    hundreds = n // 100\n    if n < 10:\n        return ones\n    if n < 100:\n        return ones * 10 + tens\n    return ones * 100 + tens * 10 + hundreds\n"
      fail:
        - answer: "def reverse_digits(n):\n    return int(str(n)[::-1])\n"
          say: "benutzt `str`"
        - answer: "def reverse_digits(n):\n    return (n % 10) * 100 + (n // 10 % 10) * 10 + n // 100\n"
    javascript:
      pass:
        - answer: "function reverseDigits(n) {\n  const ones = n % 10;\n  const tens = Math.floor(n / 10) % 10;\n  const hundreds = Math.floor(n / 100);\n  if (n < 10) return ones;\n  if (n < 100) return ones * 10 + tens;\n  return ones * 100 + tens * 10 + hundreds;\n}\n"
      fail:
        - answer: "function reverseDigits(n) {\n  return Number(String(n).split('').reverse().join(''));\n}\n"
          say: "benutzt `globalThis.String`"
        - answer: "function reverseDigits(n) {\n  return (n % 10) * 100 + (Math.floor(n / 10) % 10) * 10 + Math.floor(n / 100);\n}\n"
  duration:
    pass:
      - answer: "def duration(seconds)\n  format('%d:%02d:%02d', seconds / 3600, seconds / 60 % 60, seconds % 60)\nend\n"
    fail:
      - answer: "def duration(seconds)\n  format('%d:%02d:%02d', seconds / 3600, seconds / 60, seconds % 60)\nend\n"
    python:
      pass:
        - answer: "def duration(seconds):\n    return f'{seconds // 3600}:{seconds // 60 % 60:02d}:{seconds % 60:02d}'\n"
      fail:
        - answer: "def duration(seconds):\n    return f'{seconds // 3600}:{seconds // 60:02d}:{seconds % 60:02d}'\n"
    javascript:
      pass:
        - answer: "function duration(seconds) {\n  const two = (n) => String(n).padStart(2, '0');\n  return `${Math.floor(seconds / 3600)}:${two(Math.floor(seconds / 60) % 60)}:${two(seconds % 60)}`;\n}\n"
      fail:
        - answer: "function duration(seconds) {\n  const two = (n) => String(n).padStart(2, '0');\n  return `${Math.floor(seconds / 3600)}:${two(Math.floor(seconds / 60))}:${two(seconds % 60)}`;\n}\n"
