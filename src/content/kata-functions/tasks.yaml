format: 1
activity: kata-functions
tasks:
  - id: add
    title: "Zwei Zahlen addieren"
    level: 1
    prompt: |
      Schreib eine Funktion `add(a, b)`, die die Summe der beiden Zahlen zurückgibt: `add(2, 3)` ergibt `5`.
    starter: |
      def add(a, b)
      end

      puts add(2, 3)
    check:
      type: function
      language: ruby
      cases:
        - call: "add(2, 3)"
          expect: "5"
        - call: "add(-4, 4)"
          expect: "0"
        - call: "add(0, 0)"
          expect: "0"
      random:
        count: 4
        call: "add(a, b)"
        args: { a: -100..100, b: -100..100 }
        reference: "a + b"
    feedback:
      - when: { same_as: "def add(a, b)\n  puts a + b\nend\n" }
        say: "`puts` schreibt die Summe nur hin. Die Funktion soll sie mit `return` (oder als letzte Zeile) zurückgeben."
    solution: |
      ```ruby
      def add(a, b)
        a + b
      end
      ```
    python:
      starter: |
        def add(a, b):
            pass

        print(add(2, 3))
      check:
        type: function
        language: python
        cases:
          - call: "add(2, 3)"
            expect: "5"
          - call: "add(-4, 4)"
            expect: "0"
          - call: "add(0, 0)"
            expect: "0"
        random:
          count: 4
          call: "add(a, b)"
          args: { a: -100..100, b: -100..100 }
          reference: "a + b"
      feedback:
        - when: { same_as: "def add(a, b):\n    print(a + b)\n" }
          say: "`print` schreibt die Summe nur hin. Die Funktion soll sie mit `return` zurückgeben."
      solution: |
        ```python
        def add(a, b):
            return a + b
        ```

