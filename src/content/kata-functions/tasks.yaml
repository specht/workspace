    hint: |
      Zwei Texte hängst du mit `+` aneinander. Oder du setzt den Namen mit `"Hallo, #{name}!"` mitten in den Text.
    solution: |
      ```ruby
      def greet(name)
        "Hallo, #{name}!"
      end
      ```
    python:
      starter: |
        def greet(name):
            pass

        print(greet('Ada'))
      check:
        type: function
        language: python
        cases:
          - call: "greet('Ada')"
            expect: "'Hallo, Ada!'"
          - call: "greet('Grace')"
            expect: "'Hallo, Grace!'"
          - call: "greet('')"
            expect: "'Hallo, !'"
            say: "Auch ein leerer Name bekommt seinen Gruß."
      hint: |
        Zwei Texte hängst du mit `+` aneinander. Oder du setzt den Namen mit `f'Hallo, {name}!'` mitten in den Text.
      solution: |
        ```python
        def greet(name):
            return f'Hallo, {name}!'
        ```

