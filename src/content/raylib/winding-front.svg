<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 50 300 300" width="300" height="300" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <style id='embedded-fonts'>@font-face{font-family:'IBM Plex Sans';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <!-- Eine Seite eines Blocks von außen: Die Ecken 1, 2, 3, 4 laufen gegen
       den Uhrzeigersinn (links unten, rechts unten, rechts oben, links oben),
       die Grafikkarte zeichnet die Seite.
       Die Pfeile laufen von Mitte zu Mitte der Ecken, die Spitze auf dem
       Rand des Kreises; die Linie endet 6 Pixel davor in der Spitze.
       Die Spitze des Kreispfeils liegt mit Spitze und Mitte ihrer Basis auf
       dem Kreis, so folgt sie der Kurve. Als Bild, hell und dunkel:
       src/scripts/render-svg.rb src/content/raylib/winding-front.svg -->
  <style>
    .face { fill: #eef3fb; }
    .edge { stroke: #1f2937; stroke-width: 2.5; marker-end: url(#arrow); }
    .corner { fill: #ffffff; stroke: #1f2937; stroke-width: 2.5; }
    .num { font-size: 22px; fill: #1f2937; text-anchor: middle; }
    .turn { stroke: #2b5fb4; stroke-width: 4; fill: none; }
    .turn-head { fill: #2b5fb4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect x="50" y="50" width="300" height="300" fill="#ffffff"/>
  <rect class="face" x="90" y="90" width="220" height="220"/>
  <path class="turn" d="M 255.00 200.00 A 55 55 0 1 0 180.44 251.40"/>
  <path class="turn-head" d="M 177.24 259.82 L 200.00 255.00 L 183.64 242.99 Z"/>
  <line class="edge" x1="114" y1="310" x2="280" y2="310"/>
  <line class="edge" x1="310" y1="286" x2="310" y2="120"/>
  <line class="edge" x1="286" y1="90" x2="120" y2="90"/>
  <line class="edge" x1="90" y1="114" x2="90" y2="280"/>
  <circle class="corner" cx="90" cy="310" r="24"/>
  <text class="num" x="90" y="318">1</text>
  <circle class="corner" cx="310" cy="310" r="24"/>
  <text class="num" x="310" y="318">2</text>
  <circle class="corner" cx="310" cy="90" r="24"/>
  <text class="num" x="310" y="98">3</text>
  <circle class="corner" cx="90" cy="90" r="24"/>
  <text class="num" x="90" y="98">4</text>
</svg>
