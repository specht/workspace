# Aufgaben zu »Eine Klötzchenwelt in 3D« (raylib).
# Format: docs/aufgaben.md. Die Vorlage wird nach /workspace/raylib-starter
# geklont; die Prüfungen lesen main.c und light.fs dort.
format: 1
activity: raylib
tasks:
  - id: uebersetzt
    title: Übersetzt
    prompt: |
      Übersetze die Vorlage im Terminal mit `make`, so dass `main.html`
      entsteht.
    file: raylib-starter/main.html
    check:
      type: files
      path: raylib-starter/main.html
      expect:
        exists: true
        format: text
    hint: |
      `make` muss im Ordner `raylib-starter` laufen. Steht im Terminal etwas
      anderes vor dem `$`, wechsle mit `cd /workspace/raylib-starter` dorthin.
    feedback:
      - when: { problem: missing }
        say: Es gibt noch keine `raylib-starter/main.html`. Hast du die Vorlage geklont und im Terminal `make` eingegeben?

  - id: von-oben
    title: Von oben
    prediction: true
    prompt: |
      Was siehst du, wenn du die Kamera nach `(Vector3){ 0, 12, 0.1f }`
      stellst? Überleg erst, dann probier es aus.
    check:
      type: choice
      options:
        - Den Würfel genau von oben, als Quadrat mitten im Gitter
        - Den Würfel schräg von der Seite, wie vorher
        - Den Würfel von unten, durch das Gitter hindurch
        - Nichts, die Kamera steckt im Würfel
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: '`position` ist der Ort der Kamera. Bei x = 0 und z = 0,1 steht sie fast genau über dem Würfel, 12 Blöcke hoch.'
      - when: { picked: 2 }
        say: Die Kamera steht bei y = 12, also oben. Von unten schaut sie bei einem negativen y.
      - when: { picked: 3 }
        say: Der Würfel reicht von y = 0 bis y = 1. Die Kamera steht viel höher.
    solution: |
      Die Kamera steht 12 Blöcke über dem Würfel und schaut auf (0, 0, 0)
      hinunter: ein Quadrat mitten im Gitter. Das kleine `0.1f` ist nötig,
      weil die Kamera sonst genau in Richtung `up` schauen würde; dann wüsste
      raylib nicht, wie das Bild gedreht sein soll.

  - id: zellen
    title: Wie viele Felder?
    prompt: |
      Wie viele Felder hat das Array `world`?
    check:
      type: number
      expect: 55296
      tolerance: 0
      unit: Felder
    feedback:
      - when: { equals: 120 }
        say: Das ist 48 + 24 + 48. Die Felder stehen in Reihen, Spalten und Schichten.
    solution: 48 × 24 × 48 = 55 296 Felder. Jedes ist ein `unsigned char`, ein Byte, also braucht die ganze Welt etwa 54 KB.

  - id: saeule
    title: Deine Hügel
    prompt: |
      Füll die Säulen in `generate_world` und speichere. Der Workspace baut
      die Welt und sieht sich die Blöcke an.
    file: raylib-starter/main.c
    check:
      type: c
      file: raylib-starter/main.c
      setup: |
        // Bäume an fester Stelle, ohne raylib: alle bei (3, 3)
        void SetRandomSeed(unsigned int seed) { (void)seed; }
        int GetRandomValue(int min, int max) { (void)max; return min; }

        int hs_height(int x, int z)
        {
            float h = 7.0f + 2.0f * sinf(x * 0.13f) + 1.5f * cosf(z * 0.11f)
                    + 1.5f * sinf((x + z) * 0.07f);
            return (int)h;
        }

        // Säulen, in denen ein Block nicht stimmt; der Baum bleibt außen vor
        int hs_wrong_columns(void)
        {
            int wrong = 0;
            for (int x = 0; x < WIDTH; x++)
                for (int z = 0; z < DEPTH; z++) {
                    if (abs(x - 3) <= 2 && abs(z - 3) <= 2)
                        continue;
                    int height = hs_height(x, z), ok = 1;
                    for (int y = 0; y < HEIGHT; y++) {
                        int want = y >= height ? AIR
                                 : y == height - 1 ? (height <= 5 ? SAND : GRASS)
                                 : y >= height - 3 ? DIRT : STONE;
                        if (world[x][y][z] != want)
                            ok = 0;
                    }
                    wrong += !ok;
                }
            return wrong;
        }
      cases:
        - call: '({ generate_world(); world[20][6][20] == GRASS; })'
          expect: true
          say: 'Bei x = 20, z = 20 ist die Säule 7 hoch, also liegt bei y = 6 Gras: das oberste Feld ist `height - 1`.'
        - call: '({ generate_world(); world[20][7][20] == AIR; })'
          expect: true
          say: 'Über der Säule soll Luft bleiben: Bei x = 20, z = 20 ist sie 7 hoch, y = 7 liegt schon darüber. Läuft die Schleife nur bis `y < height`?'
        - call: '({ generate_world(); world[20][5][20] == DIRT && world[20][4][20] == DIRT; })'
          expect: true
          say: 'Unter dem Gras liegen zwei Lagen Erde, bei y = 5 und y = 4, wenn die Säule 7 hoch ist.'
        - call: '({ generate_world(); world[20][3][20] == STONE && world[20][0][20] == STONE; })'
          expect: true
          say: 'Unter der Erde ist alles Stein, bis y = 0.'
        - call: '({ generate_world(); world[26][2][32] == SAND; })'
          expect: true
          say: 'Bei x = 26, z = 32 ist die Säule nur 3 hoch: Oben liegt dort Sand statt Gras, weil `height` höchstens 5 ist.'
        - call: '({ generate_world(); hs_wrong_columns(); })'
          expect: 0
          say: 'In so vielen Säulen stimmt mindestens ein Block noch nicht.'

  - id: sichtbar
    title: Dein visible
    prompt: |
      Schreib `visible` in `main.c` und speichere. Der Workspace füllt die
      Welt mit Stein, macht ein Feld zu Luft und fragt, welche Blöcke zu
      sehen sind.
    file: raylib-starter/main.c
    check:
      type: c
      file: raylib-starter/main.c
      setup: |
        // eine Welt ganz aus Stein, nur bei (ax, ay, az) ist Luft (ax < 0: nirgends);
        // ist der Block bei (x, y, z) zu sehen?
        bool hs_visible(int ax, int ay, int az, int x, int y, int z)
        {
            for (int i = 0; i < WIDTH; i++)
                for (int j = 0; j < HEIGHT; j++)
                    for (int k = 0; k < DEPTH; k++)
                        world[i][j][k] = STONE;
            if (ax >= 0)
                world[ax][ay][az] = AIR;
            return visible(x, y, z);
        }
      cases:
        - call: hs_visible(-1, 0, 0, 10, 10, 10)
          expect: false
          say: 'Ringsum ist Stein: Dieser Block grenzt nirgends an Luft, man sieht ihn nicht.'
        - call: hs_visible(11, 10, 10, 10, 10, 10)
          expect: true
          say: 'Rechts daneben, bei x + 1, ist Luft: Der Block ist zu sehen.'
        - call: hs_visible(9, 10, 10, 10, 10, 10)
          expect: true
          say: 'Links daneben, bei x − 1, ist Luft: Der Block ist zu sehen.'
        - call: hs_visible(10, 11, 10, 10, 10, 10)
          expect: true
          say: 'Über dem Block, bei y + 1, ist Luft: Der Block ist zu sehen.'
        - call: hs_visible(10, 9, 10, 10, 10, 10)
          expect: true
          say: 'Unter dem Block, bei y − 1, ist Luft: Der Block ist zu sehen.'
        - call: hs_visible(10, 10, 11, 10, 10, 10)
          expect: true
          say: 'Vor dem Block, bei z + 1, ist Luft: Der Block ist zu sehen.'
        - call: hs_visible(10, 10, 9, 10, 10, 10)
          expect: true
          say: 'Hinter dem Block, bei z − 1, ist Luft: Der Block ist zu sehen.'
        - call: hs_visible(11, 11, 10, 10, 10, 10)
          expect: false
          say: 'Die Luft liegt nur schräg daneben, über eine Kante. Zählen sollen nur die sechs Nachbarn, mit denen der Block eine Seite teilt.'
        - call: hs_visible(-1, 0, 0, 0, 10, 10)
          expect: true
          say: 'Der Block liegt am Rand der Welt, bei x = 0: Links davon ist nichts mehr, und `block` sagt dort `AIR`. Liest du die Nachbarn mit `block`?'
        - call: hs_visible(-1, 0, 0, 10, HEIGHT - 1, 10)
          expect: true
          say: 'Der Block liegt ganz oben in der Welt: Darüber ist nichts mehr, und `block` sagt dort `AIR`. Liest du die Nachbarn mit `block`?'

  - id: blickrichtung
    title: Deine Blickrichtung
    prompt: |
      Schreib `view_direction` in `main.c` und speichere. Der Workspace stellt
      die Winkel ein und fragt nach der Blickrichtung.
    file: raylib-starter/main.c
    check:
      type: c
      file: raylib-starter/main.c
      tolerance: 0.0001
      cases:
        - call: '({ yaw = 0; pitch = 0; view_direction().z; })'
          expect: 1.0
          say: 'Mit `yaw = 0` und `pitch = 0` schaust du nach vorne, in z-Richtung: z soll 1 sein, cos(0) = 1.'
        - call: '({ yaw = 0; pitch = 0; view_direction().x; })'
          expect: 0.0
          say: 'Mit `yaw = 0` zeigt der Blick nicht zur Seite: x soll 0 sein, sin(0) = 0.'
        - call: '({ yaw = PI / 2; pitch = 0; view_direction().x; })'
          expect: 1.0
          say: 'Mit `yaw = π/2` schaust du nach rechts, in x-Richtung: x soll 1 sein.'
        - call: '({ yaw = 0; pitch = 0.5f; view_direction().y; })'
          expect: 0.4794255
          say: 'Mit der Neigung 0,5 zeigt der Blick um sin(0,5) ≈ 0,479 nach oben.'
        - call: '({ yaw = 0; pitch = 0.5f; view_direction().z; })'
          expect: 0.8775826
          say: 'Mit der Neigung 0,5 wird der Blick in der Waagerechten kürzer: z ist cos(0) · cos(0,5) ≈ 0,878.'
        - call: '({ yaw = 1.0f; pitch = 0.7f; Vector3 d = view_direction(); sqrtf(d.x * d.x + d.y * d.y + d.z * d.z); })'
          expect: 1.0
          say: 'Die Blickrichtung soll immer 1 lang sein. Nimmst du x und z mit `cosf(pitch)` mal?'

  - id: blick
    title: Andersherum
    prompt: |
      Die Figur hat `yaw = PI` (also 3,14…) und `pitch = 0`. In welche
      Richtung zeigt `view_direction()`?
    check:
      type: choice
      options:
        - (0, 0, −1), nach hinten
        - (0, 0, 1), nach vorne
        - (−1, 0, 0), nach links
        - (0, −1, 0), nach unten
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Das ist die Richtung bei `yaw = 0`. Was sind sin(π) und cos(π)?
      - when: { picked: 3 }
        say: Ohne Neigung bleibt die y-Koordinate 0, sin(0) = 0.
    solution: sin(π) = 0 und cos(π) = −1, also (0, 0, −1). Eine halbe Umdrehung zeigt genau in die Gegenrichtung.

  - id: pro-bild
    title: Ein Schritt pro Bild
    prompt: |
      Die Figur läuft 4,5 Blöcke pro Sekunde, und das Programm schafft 60
      Bilder pro Sekunde. Wie weit bewegt sie sich in einem Bild?
    check:
      type: number
      expect: 0.075
      tolerance: 0.001
      unit: Blöcke
    feedback:
      - when: { equals: 270 }
        say: Das wäre die Strecke in 60 Sekunden. Gesucht ist ein einzelnes Bild, also ein Sechzigstel einer Sekunde.
    solution: 4,5 ÷ 60 = 0,075 Blöcke. Bei 30 Bildern pro Sekunde wäre `dt` doppelt so groß und jeder Schritt 0,15 Blöcke; in einer Sekunde kommt die Figur gleich weit.

  - id: einzeln
    title: Kleben oder gleiten?
    prediction: true
    prompt: |
      Was passiert, wenn das Programm den Schritt in x und z **zusammen**
      ausprobiert und ganz verwirft, sobald die Figur dabei in einem Block
      stecken würde? Du läufst schräg gegen eine Wand.
    check:
      type: choice
      options:
        - Die Figur bleibt an der Wand stehen, statt an ihr entlangzugleiten
        - 'Die Figur geht durch die Wand hindurch, als wäre sie nicht da'
        - Die Figur gleitet an der Wand entlang wie vorher
        - 'Die Figur springt zurück an die Stelle, an der sie gestartet ist'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Verworfen wird ein Schritt nur, wenn die Figur danach in einem Block steckt. Hindurch kommt sie also nie.
      - when: { picked: 2 }
        say: Entlanggleiten heißt, dass ein Teil des Schritts klappt. Wird der Schritt nur ganz oder gar nicht ausgeführt, geht das nicht.
    solution: |
      Schräg gegen eine Wand steckt die Figur nach dem ganzen Schritt in der
      Wand, also wird er verworfen, und sie steht still. Einzeln geprüft
      klappt der Teil entlang der Wand, nur der Teil in die Wand hinein wird
      verworfen: Die Figur gleitet.

  - id: koerper
    title: Dein collides
    prompt: |
      Schreib `collides` in `main.c` und speichere. Der Workspace stellt
      einzelne Blöcke in eine leere Welt und die Figur daneben.
    file: raylib-starter/main.c
    check:
      type: c
      file: raylib-starter/main.c
      setup: |
        // eine leere Welt mit einem einzigen Stein bei (x, y, z)
        void hs_only(int x, int y, int z)
        {
            for (int i = 0; i < WIDTH; i++)
                for (int j = 0; j < HEIGHT; j++)
                    for (int k = 0; k < DEPTH; k++)
                        world[i][j][k] = AIR;
            if (x >= 0)
                world[x][y][z] = STONE;
        }

        bool hs_collides(int bx, int by, int bz, float x, float y, float z)
        {
            hs_only(bx, by, bz);
            return collides((Vector3){ x, y, z });
        }
      cases:
        - call: hs_collides(-1, 0, 0, 10.5f, 5, 10.5f)
          expect: false
          say: 'In einer leeren Welt steckt die Figur nirgends fest.'
        - call: hs_collides(10, 5, 10, 10.5f, 5, 10.5f)
          expect: true
          say: 'Der Stein steht genau im Feld, in dem die Füße stehen.'
        - call: hs_collides(10, 6, 10, 10.5f, 5, 10.5f)
          expect: true
          say: 'Der Stein steht in Kopfhöhe: Die Figur reicht von y = 5 bis 6,7, also auch ins Feld y = 6.'
        - call: hs_collides(10, 7, 10, 10.5f, 5, 10.5f)
          expect: false
          say: 'Der Stein steht bei y = 7, die Figur reicht nur bis 6,7.'
        - call: hs_collides(11, 5, 10, 10.5f, 5, 10.5f)
          expect: false
          say: 'Die Figur reicht in x von 10,2 bis 10,8, das Feld x = 11 berührt sie nicht.'
        - call: hs_collides(11, 5, 10, 10.75f, 5, 10.5f)
          expect: true
          say: 'Die Figur reicht in x bis 11,05 und damit ins Feld x = 11. Läuft deine Schleife bis `<=` zum letzten Feld?'
        - call: hs_collides(9, 5, 9, 10.2f, 5, 10.2f)
          expect: true
          say: 'Der Stein steht schräg links hinten: Die Figur reicht in x und z bis 9,9, also mit einer Ecke in sein Feld. Prüfst du alle Felder, nicht nur die Ränder?'
        - call: hs_collides(-1, 0, 0, 0.1f, 5, 10.5f)
          expect: true
          say: 'Die Figur reicht in x bis −0,2, über den Rand der Welt: Dort steht eine unsichtbare Wand. `(int)(-0.2f)` ist 0, `floorf(-0.2f)` ist −1. Nimmst du `floorf` und `solid`?'

  - id: fallen
    title: Deine Schwerkraft
    prompt: |
      Schreib die Schwerkraft in `move_player` und speichere. Der Workspace
      lässt die Figur über einem Boden aus Stein fallen und springen.
    file: raylib-starter/main.c
    check:
      type: c
      file: raylib-starter/main.c
      tolerance: 0.0001
      setup: |
        // raylib ohne Fenster: keine Maus, nur die Taste in hs_key ist gedrückt
        static int hs_key = -1;
        bool IsCursorHidden(void) { return false; }
        Vector2 GetMouseDelta(void) { return (Vector2){ 0, 0 }; }
        bool IsKeyDown(int key) { return key == hs_key; }

        // Ein Boden aus Stein bis y = 4, die Figur schwebt bei y darüber
        void hs_ground(float y)
        {
            for (int i = 0; i < WIDTH; i++)
                for (int j = 0; j < HEIGHT; j++)
                    for (int k = 0; k < DEPTH; k++)
                        world[i][j][k] = j < 5 ? STONE : AIR;
            feet = (Vector3){ 10.5f, y, 10.5f };
            vy = 0;
            on_ground = false;
            yaw = 0;
            pitch = 0;
        }

        // so viele Bilder mit 60 Bildern pro Sekunde
        void hs_frames(int n)
        {
            for (int i = 0; i < n; i++)
                move_player(1.0f / 60);
        }
      cases:
        - call: '({ hs_ground(8); move_player(0.1f); vy; })'
          expect: -2.2
          say: 'Die Schwerkraft verkleinert `vy` in jeder Sekunde um 22, nach 0,1 Sekunden ist `vy` also −2,2.'
        - call: '({ hs_ground(8); move_player(0.1f); feet.y; })'
          expect: 7.78
          say: 'Mit dem neuen `vy` bewegen sich die Füße um `vy * dt`: 8 − 2,2 · 0,1 = 7,78. Rechnest du erst `vy` und dann den Schritt?'
        - call: '({ hs_ground(8); hs_frames(120); feet.y; })'
          expect: 5.0
          say: 'Nach zwei Sekunden soll die Figur auf dem Boden stehen, genau auf den Steinen bei y = 5: `feet.y = floorf(next.y) + 1.0f`.'
        - call: '({ hs_ground(8); hs_frames(120); on_ground; })'
          expect: true
          say: 'Nach der Landung steht die Figur auf dem Boden: `on_ground` soll `true` sein.'
        - call: '({ hs_ground(8); hs_frames(120); vy; })'
          expect: 0.0
          say: 'Auf dem Boden fällt die Figur nicht weiter: Stößt der Schritt in y auf einen Block, wird `vy` 0.'
        - call: '({ hs_ground(8); hs_frames(120); hs_key = KEY_SPACE; move_player(0.01f); vy; })'
          expect: 7.5
          say: 'Auf dem Boden setzt die Leertaste `vy` auf 7,5.'
        - call: '({ hs_ground(8); hs_key = KEY_SPACE; move_player(0.01f); vy; })'
          expect: -0.22
          say: 'In der Luft springt die Figur nicht noch einmal: Die Leertaste wirkt nur, wenn `on_ground` gilt.'
        - call: '({ hs_ground(8); hs_frames(120); world[10][7][10] = STONE; hs_key = KEY_SPACE; hs_frames(10); feet.y <= 5.3f && vy <= 0; })'
          expect: true
          say: 'Über der Figur steht ein Stein bei y = 7. Springt sie, stößt sie mit dem Kopf an: Sie macht den Schritt nicht, und `vy` wird 0.'

  - id: sprunghoehe
    title: Wie hoch springst du?
    prompt: |
      Ein Sprung beginnt mit `vy = 7.5`, und die Schwerkraft verkleinert `vy`
      um 22 pro Sekunde. Wie viele Blöcke hoch kommen die Füße? Runde auf zwei
      Stellen.
    check:
      type: number
      expect: 1.28
      tolerance: 0.03
      unit: Blöcke
    hint: Oben ist `vy` = 0. Wie lange dauert das, und wie schnell war die Figur im Durchschnitt in dieser Zeit?
    feedback:
      - when: { between: [0.33, 0.35] }
        say: Das ist die Zeit bis nach oben, 7,5 ÷ 22 Sekunden. Gefragt ist die Höhe.
      - when: { between: [2.5, 2.6] }
        say: So weit käme die Figur, wenn sie die ganze Zeit mit 7,5 flöge. Sie wird aber langsamer, im Durchschnitt ist sie halb so schnell.
    solution: |
      Nach 7,5 ÷ 22 ≈ 0,34 Sekunden ist `vy` = 0. Im Durchschnitt war die
      Figur dabei 3,75 Blöcke pro Sekunde schnell, also kommt sie
      0,34 × 3,75 ≈ 1,28 Blöcke hoch: genug für eine Stufe aus einem Block,
      nicht für zwei.

  - id: figur
    title: Ein Körper
    prompt: |
      Bau `collides`, die Schritte in x und z und die Schwerkraft für `vy` in dein
      Programm ein und speichere.
    file: raylib-starter/main.c
    check:
      type: files
      path: raylib-starter/main.c
      expect:
        format: text
        contains:
          - { pattern: 'bool\s+collides\s*\(', say: 'In `main.c` finde ich noch keine Funktion `collides`.' }
          - { pattern: 'vy\s*-=', say: 'Noch keine Schwerkraft: Wo wird `vy` in jedem Bild kleiner?' }
          - { pattern: 'KEY_SPACE', say: 'Noch kann die Figur nicht springen: Mit der Leertaste (`KEY_SPACE`) bekommt `vy` einen Wert nach oben.' }

  - id: zielen
    title: Dein aim
    prompt: |
      Schreib die Schleife in `aim` und speichere. Der Workspace stellt einen
      Block in eine leere Welt und zielt aus der Nähe darauf.
    file: raylib-starter/main.c
    check:
      type: c
      file: raylib-starter/main.c
      setup: |
        // eine leere Welt mit einem Stein bei (x, y, z); das Auge bei
        // (10,5; 5,5; 10,5) schaut in Richtung (dx, dy, dz)
        void hs_aim(int x, int y, int z, float dx, float dy, float dz)
        {
            for (int i = 0; i < WIDTH; i++)
                for (int j = 0; j < HEIGHT; j++)
                    for (int k = 0; k < DEPTH; k++)
                        world[i][j][k] = AIR;
            world[x][y][z] = STONE;
            aim((Vector3){ 10.5f, 5.5f, 10.5f }, Vector3Normalize((Vector3){ dx, dy, dz }));
        }
      cases:
        - call: '({ hs_aim(12, 5, 10, 1, 0, 0); hit; })'
          expect: true
          say: 'Zwei Felder rechts vom Auge steht ein Stein, und der Blick zeigt dorthin: `hit` soll `true` sein.'
        - call: '({ hs_aim(12, 5, 10, 1, 0, 0); hx * 100 + hy * 10 + hz; })'
          expect: 1260
          say: 'Getroffen ist der Stein bei (12, 5, 10): Das Feld des Punkts kommt nach `hx`, `hy`, `hz`.'
        - call: '({ hs_aim(12, 5, 10, 1, 0, 0); ax * 100 + ay * 10 + az; })'
          expect: 1160
          say: 'Vor dem Stein ging der Strahl zuletzt durch das Feld (11, 5, 10): Das gehört nach `ax`, `ay`, `az`.'
        - call: '({ hs_aim(12, 5, 10, -1, 0, 0); hit; })'
          expect: false
          say: 'Der Blick zeigt vom Stein weg, und sonst ist die Welt leer: `hit` soll `false` bleiben.'
        - call: '({ hs_aim(16, 5, 10, 1, 0, 0); hit; })'
          expect: true
          say: 'Der Stein beginnt 5,5 Blöcke vor dem Auge, das ist noch in Reichweite: `t` geht bis 6.'
        - call: '({ hs_aim(17, 5, 10, 1, 0, 0); hit; })'
          expect: false
          say: 'Der Stein beginnt 6,5 Blöcke vor dem Auge, zu weit: `t` geht nur bis 6.'
        - call: '({ hs_aim(11, 4, 11, 1, -1, 1); hx * 100 + hy * 10 + hz; })'
          expect: 1151
          say: 'Schräg nach rechts, unten und vorne trifft der Strahl den Stein bei (11, 4, 11). Gibt jede der drei Koordinaten des Punkts ihr Feld?'

  - id: schritte
    title: Kleine Schritte
    prompt: |
      Warum geht `aim` den Blick in Schritten von 0,02 Blöcken entlang und
      nicht in Schritten von 0,5?
    check:
      type: choice
      options:
        - Mit großen Schritten kann der Strahl über die Ecke eines Blocks hinwegspringen
        - 'Mit großen Schritten wird das Programm langsamer, weil mehr gerechnet wird'
        - 'raylib erlaubt in seinen Funktionen nur Schritte kleiner als 0,1'
        - Ein Block ist 0,02 Einheiten groß
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Größere Schritte sind weniger Schritte, also schneller. Was könnte dabei verloren gehen?
      - when: { picked: 3 }
        say: Ein Block ist eine Einheit groß, von x bis x + 1.
    solution: |
      Ein Strahl, der eine Blockecke nur streift, ist vielleicht nur 0,1 Blöcke
      lang in diesem Block. Mit Schritten von 0,5 landet kein Schritt darin,
      und das Programm zielt durch den Block hindurch.

  - id: bauen
    title: Bauen und abbauen
    prompt: |
      Bau `aim`, das Abbauen mit der linken und das Bauen mit der rechten
      Maustaste in dein Programm ein und speichere.
    file: raylib-starter/main.c
    check:
      type: files
      path: raylib-starter/main.c
      expect:
        format: text
        contains:
          - { pattern: 'void\s+aim\s*\(', say: 'In `main.c` finde ich noch keine Funktion `aim`.' }
          - { pattern: 'MOUSE_BUTTON_RIGHT', say: 'Noch baut die rechte Maustaste nichts: `IsMouseButtonPressed(MOUSE_BUTTON_RIGHT)`.' }
          - { pattern: 'DrawCubeWires\s*\([^;]*\bhx\b|\{\s*hx\s*[+,]', say: 'Noch hat der Block, auf den du schaust, keinen Rahmen.' }

  - id: wiese
    title: Mitten in der Wiese
    prompt: |
      Ein Grasblock liegt mitten in einer flachen Wiese: links, rechts, vorne
      und hinten Gras, darunter Erde, darüber Luft. Wie viele Seiten zeichnet
      `draw_block` für ihn?
    check:
      type: number
      expect: 1
      tolerance: 0
      unit: Seiten
    feedback:
      - when: { equals: 6 }
        say: So viele zeichnet `DrawCube`. `draw_block` lässt jede Seite weg, an die ein fester Block grenzt.
      - when: { equals: 5 }
        say: Unten liegt Erde, die ist auch fest.
    solution: Nur die Oberseite. Auf einer großen Wiese zeichnet das Programm so ein Sechstel der Seiten, die sechs Würfelseiten pro Block wären.

  - id: sonnig
    title: Wie sonnig ist die Oberseite?
    prompt: |
      Die Sonne steht in Richtung `Vector3Normalize((Vector3){ 0.5f, 0.8f, 0.3f })`.
      Welchen Wert hat `sunAmount` im Fragment-Shader für die Oberseite eines
      Blocks? Runde auf zwei Stellen.
    check:
      type: number
      expect: 0.81
      tolerance: 0.01
    hint: Die Normale der Oberseite ist (0, 1, 0). Was bleibt vom Skalarprodukt übrig? Und was macht `Vector3Normalize` mit (0,5; 0,8; 0,3)?
    feedback:
      - when: { between: [0.79, 0.801] }
        say: Das ist der y-Wert vor dem Normalisieren. Der Vektor (0,5; 0,8; 0,3) ist nicht genau 1 lang.
    solution: |
      Mit der Normale (0, 1, 0) bleibt vom Skalarprodukt nur die y-Koordinate
      der Sonnenrichtung. (0,5; 0,8; 0,3) hat die Länge √0,98 ≈ 0,99, also ist
      `sunAmount` = 0,8 ÷ 0,99 ≈ 0,81.

  - id: licht
    title: Licht
    prompt: |
      Zeichne die Welt mit `draw_block` und dem Licht-Shader und speichere.
    file: raylib-starter/main.c
    check:
      type: files
      path: raylib-starter/main.c
      expect:
        format: text
        contains:
          - { pattern: 'rlNormal3f\s*\(', say: 'In `main.c` bekommt noch keine Ecke eine Normale (`rlNormal3f`).' }
          - { pattern: 'LoadShader\s*\(\s*"light\.vs"\s*,\s*"light\.fs"\s*\)', say: 'Noch lädt `main.c` den Shader nicht: `LoadShader("light.vs", "light.fs")`.' }
          - { pattern: 'BeginShaderMode\s*\(', say: 'Der Shader ist geladen, aber noch zeichnet nichts mit ihm: `BeginShaderMode(light)` vor der Schleife über die Welt.' }

  - id: fackel-abstand
    title: Licht in der Ferne
    prompt: |
      Eine Fläche zeigt direkt zu einer Fackel. Wie viel Licht von der Fackel
      kommt bei ihr an, wenn sie zwei Blöcke entfernt ist, verglichen mit
      einer Fläche direkt an der Fackel? Gib einen Anteil an, etwa 0,5 für die
      Hälfte, und runde auf zwei Stellen.
    check:
      type: number
      expect: 0.45
      tolerance: 0.01
    hint: Das Licht wird durch `1.0 + 0.3 * dist * dist` geteilt. Direkt an der Fackel ist der Abstand 0.
    feedback:
      - when: { between: [0.62, 0.63] }
        say: Hast du den Abstand quadriert? Im Shader steht `dist * dist`.
    solution: Bei Abstand 2 wird durch 1 + 0,3 × 4 = 2,2 geteilt, bei Abstand 0 durch 1. Es kommen also 1 ÷ 2,2 ≈ 0,45 an, weniger als die Hälfte.

  - id: fackeln
    title: Fackeln und Nebel
    prompt: |
      Ersetze `light.fs` durch den Shader mit Fackeln und Nebel und speichere.
    file: raylib-starter/light.fs
    check:
      type: files
      path: raylib-starter/light.fs
      expect:
        format: text
        contains:
          - { pattern: 'uniform\s+vec3\s+torches\s*\[', say: 'In `light.fs` gibt es noch keine Liste `torches`.' }
          - { pattern: '\bfog\b', say: 'In `light.fs` fehlt noch der Nebel (`fog`): Er mischt die Farbe mit `sky`, je weiter entfernt ein Pixel ist.' }

  - id: kacheln
    title: Dein tile_for
    prompt: |
      Schreib `tile_for` in `main.c` und speichere. Der Workspace fragt nach
      den Kacheln für jede Blockart, oben, unten und an der Seite.
    file: raylib-starter/main.c
    check:
      type: c
      file: raylib-starter/main.c
      cases:
        - call: tile_for(GRASS, 0) == T_GRASS_TOP
          expect: true
          say: 'Gras zeigt oben die erste Kachel, `T_GRASS_TOP`.'
        - call: tile_for(GRASS, 1) == T_DIRT
          expect: true
          say: 'Gras zeigt unten Erde, `T_DIRT`.'
        - call: tile_for(GRASS, 2) == T_GRASS_SIDE
          expect: true
          say: 'Gras zeigt an den Seiten die Kachel mit dem grünen Rand, `T_GRASS_SIDE`.'
        - call: tile_for(DIRT, 0) == T_DIRT && tile_for(DIRT, 2) == T_DIRT
          expect: true
          say: 'Erde zeigt auf allen Seiten `T_DIRT`.'
        - call: tile_for(STONE, 1) == T_STONE && tile_for(STONE, 2) == T_STONE
          expect: true
          say: 'Stein zeigt auf allen Seiten `T_STONE`.'
        - call: tile_for(WOOD, 2) == T_WOOD_SIDE
          expect: true
          say: 'Holz zeigt an den Seiten Rinde, `T_WOOD_SIDE`.'
        - call: tile_for(WOOD, 0) == T_WOOD_TOP && tile_for(WOOD, 1) == T_WOOD_TOP
          expect: true
          say: 'Holz zeigt oben und unten die Jahresringe, `T_WOOD_TOP`.'
        - call: tile_for(LEAVES, 0) == T_LEAVES && tile_for(LEAVES, 2) == T_LEAVES
          expect: true
          say: 'Laub zeigt auf allen Seiten `T_LEAVES`.'
        - call: tile_for(SAND, 0) == T_SAND && tile_for(SAND, 2) == T_SAND
          expect: true
          say: 'Sand zeigt auf allen Seiten `T_SAND`.'

  - id: texturen
    title: Texturen
    prompt: |
      Lade `textures.png` und gib jeder Seite ihre Kachel, dann speichere.
    file: raylib-starter/main.c
    check:
      type: files
      path: raylib-starter/main.c
      expect:
        format: text
        contains:
          - { pattern: 'LoadTexture\s*\(\s*"textures\.png"\s*\)', say: 'Noch lädt `main.c` keine Textur: `LoadTexture("textures.png")`.' }
          - { pattern: 'rlTexCoord2f\s*\(', say: 'Noch bekommt keine Ecke Texturkoordinaten (`rlTexCoord2f`).' }
          - { pattern: 'rlSetTexture\s*\(\s*[A-Za-z_]\w*\.id\s*\)', say: 'Die Textur ist geladen, aber die Flächen bekommen sie noch nicht: `rlSetTexture(texture.id)` vor der Schleife über die Welt.' }

  - id: abgabe
    title: Deine Welt
    prompt: |
      Gib deine Welt ab: den ganzen Ordner `raylib-starter` mit `main.html`.
      Deine Lehrkraft kann den Code ansehen und deine Welt im Browser
      starten; du kannst jederzeit neu abgeben.
    check:
      type: submit
      paths: [raylib-starter]
      exclude: [raylib-starter/.git, raylib-starter/.build]
      max_size: 5MB
