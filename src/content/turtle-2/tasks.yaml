  - id: beautiful-tree
    title: "Ein schöner Baum"
    level: 3
    prompt: |
      Mach aus dem Baum von eben einen schönen: Jeder Ast ist so dick wie seine Tiefe (`width depth`), die Äste mit der Tiefe 1 und 2 sind grün (`"forestgreen"`), alle anderen braun (`"saddlebrown"`). Die Äste drehen sich um 25 Grad und sind 0,75-mal so lang wie der davor. Zurück geht die Schildkröte mit gehobenem Stift, sonst malt sie den braunen Ast in der Farbe des letzten Blatts nach.
    starter: |
      {{own tree tree}}

      left 90
      tree(80, 7)
    check:
      type: "turtle"
      language: "ruby"
      cases:
        - call: "left 90; tree(80, 3)"
          draw: |
            def tree(size, depth)
              return if depth == 0
              width depth
              color(depth <= 2 ? 'forestgreen' : 'saddlebrown')
              forward size
              left 25
              tree(size * 0.75, depth - 1)
              right 50
              tree(size * 0.75, depth - 1)
              left 25
              pen_up
              back size
              pen_down
            end
            left 90
            tree(80, 3)
        - call: "left 90; tree(80, 7)"
          draw: |
            def tree(size, depth)
              return if depth == 0
              width depth
              color(depth <= 2 ? 'forestgreen' : 'saddlebrown')
              forward size
              left 25
              tree(size * 0.75, depth - 1)
              right 50
              tree(size * 0.75, depth - 1)
              left 25
              pen_up
              back size
              pen_down
            end
            left 90
            tree(80, 7)
      colors: true
      commands: [forward, back, left, right, pen_up, pen_down, color, width]
      show: 1
    hint:
      - "Breite und Farbe setzt die Funktion am Anfang, bevor sie den Ast zeichnet: Dann gelten sie für ihn."
      - "Die Farbe hängt von der Tiefe ab: `color depth <= 2 ? \"forestgreen\" : \"saddlebrown\"`, oder mit `if` und `else`."
      - "Am Ende: Stift hoch, den Ast zurück, Stift wieder runter."
    solution: |
      ```ruby
      def tree(size, depth)
        return if depth == 0
        width depth
        color depth <= 2 ? "forestgreen" : "saddlebrown"
        forward size
        left 25
        tree(size * 0.75, depth - 1)
        right 50
        tree(size * 0.75, depth - 1)
        left 25
        pen_up
        back size
        pen_down
      end

      left 90
      tree(80, 7)
      ```
