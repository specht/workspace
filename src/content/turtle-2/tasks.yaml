  - id: weeping-tree
    title: "Ein Baum, der bis zum Boden hängt"
    level: 3
    prompt: |
      Dreht sich jeder Ast weit genug und wird er nur wenig kürzer, biegen sich die äußeren Äste bis zum Boden. Ändere deinen schönen Baum: Beide Äste drehen sich um 36 Grad und werden 0,84-mal so lang; die Breite ist `depth * 0.7`, die Äste mit einer Tiefe bis 3 sind `"olivedrab"`, die anderen `"sienna"`. Er beginnt mit `tree(52, 10)`.
