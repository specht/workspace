# Aufgaben zu »Turtle: Bäume und Kurven«. Format: docs/aufgaben.md (turtle).
# Geschrieben von einem Skript aus einer Beschreibung je Aufgabe; die Bilder
# (draw) sind Ruby mit denselben Befehlen, für alle drei Sprachen.
format: 1
activity: turtle-2
tasks:

  - id: tree
    title: "Ein Baum"
    level: 3
    prompt: |
      Schreib `tree(size, depth)` für den Baum aus dem Bild oben: Bei der Tiefe 0 zeichnet sie nichts, sonst einen Stamm der Länge `size` mit zwei kleineren Bäumen daran. Danach steht die Schildkröte wieder unten am Stamm und schaut wie vorher.
    starter: |
      def tree(size, depth)
      end

      left 90
      tree(100, 5)
    check:
      type: "turtle"
      language: "ruby"
      cases:
        - call: "left 90; tree(100, 1)"
          draw: |
            def tree(size, depth)
              return if depth == 0
              forward size
              left 30
              tree(size * 0.7, depth - 1)
              right 60
              tree(size * 0.7, depth - 1)
              left 30
              back size
            end
            left 90
            tree(100, 1)
        - call: "left 90; tree(100, 2)"
          draw: |
            def tree(size, depth)
              return if depth == 0
              forward size
              left 30
              tree(size * 0.7, depth - 1)
              right 60
              tree(size * 0.7, depth - 1)
              left 30
              back size
            end
            left 90
            tree(100, 2)
        - call: "left 90; tree(100, 5)"
          draw: |
            def tree(size, depth)
              return if depth == 0
              forward size
              left 30
              tree(size * 0.7, depth - 1)
              right 60
              tree(size * 0.7, depth - 1)
              left 30
              back size
            end
            left 90
            tree(100, 5)
      commands: [forward, back, left, right]
      show: 2
    hint:
      - "Bei der Tiefe 0 kehrt die Funktion sofort zurück. Das ist das Ende der Rekursion: Ohne diese Zeile ruft sie sich für immer selbst auf."
      - "Sonst: den Stamm vorwärts, 30 nach links, `tree(size * 0.7, depth - 1)` für den linken Baum, 60 nach rechts, derselbe Aufruf für den rechten, und 30 nach links zurück."
      - "Am Ende den Stamm zurück: Erst dann steht die Schildkröte nach dem linken Baum wieder dort, wo der rechte anfängt."
    solution: |
      ```ruby
      def tree(size, depth)
        return if depth == 0
        forward size
        left 30
        tree(size * 0.7, depth - 1)
        right 60
        tree(size * 0.7, depth - 1)
        left 30
        back size
      end

      left 90
      tree(100, 5)
      ```
