    title: "Ein schiefer Baum"
    level: 3
    prompt: |
      Echte Bäume wachsen nicht gleichmäßig. Ändere deinen schönen Baum: Der linke Ast dreht sich um 15 Grad und wird 0,8-mal so lang, der rechte dreht sich um 40 Grad und wird 0,6-mal so lang. Breite und Farben bleiben wie eben.
