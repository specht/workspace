          draw: |
            def tree(size, depth)
              return if depth == 0
              width depth * 0.7
              color(depth <= 3 ? 'olivedrab' : 'sienna')
              forward size
              left 36
              tree(size * 0.84, depth - 1)
              right 72
              tree(size * 0.84, depth - 1)
              left 36
              pen_up
              back size
              pen_down
