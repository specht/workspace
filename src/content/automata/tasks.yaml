  - id: explosion
    title: Wenn der DEA explodiert
    prediction: true
    prompt: |
      Für N = 3 hat der DEA 8 Zustände, für N = 5 sind es 32. Wie viele sind
      es für N = 10? Schätze erst, dann probier es aus.
    check:
      type: number
      expect: 1024
    feedback:
      - when: { equals: 62 }
        say: Es kommen nicht in jedem Schritt gleich viele dazu. Was passiert von 3 nach 5?
      - when: { equals: 64 }
        say: Das wäre N = 6.
    solution: '2 hoch 10 = 1024. Der DEA muss sich die letzten N Ziffern merken, und dafür gibt es 2 hoch N Möglichkeiten. Der NEA kommt mit N + 1 Zuständen aus.'

  - id: nea-oder-dea
    title: NEA oder DEA?
    prompt: |
      Du hast jetzt beides gebaut. Was spricht für einen NEA, was für einen
      DEA? Denk an das Schreiben und an das Ausführen.
    check:
      type: reflection
      min_words: 20
    examples:
      - |
        Einen NEA zu schreiben ist leichter: Er darf raten, darum beschreibe ich
        nur das Muster, zum Beispiel »irgendwann kommt 1213 und dann nichts
        mehr«, und brauche wenige Zustände. Ausführen ist beim DEA leichter und
        schneller: Er hat bei jedem Zeichen genau einen nächsten Zustand, während
        ich beim NEA eine ganze Menge von Zuständen mitführen muss.
      - |
        Für den NEA spricht, dass er klein und übersichtlich bleibt. Für den DEA
        spricht, dass ein Programm ihn ganz einfach Zeichen für Zeichen abarbeiten
        kann. Man kann jeden NEA in einen DEA umwandeln, aber der kann
        exponentiell viele Zustände bekommen: Für »das N-letzte Zeichen ist eine 1«
        sind es 2 hoch N.
