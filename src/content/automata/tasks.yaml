# Aufgaben zu »Endliche Automaten«, in Python und in Ruby (unter ruby:).
# Format: docs/aufgaben.md. Alles liegt in /workspace/automata.
format: 1
activity: automata
tasks:
  - id: drehkreuz
    title: Eintritt zwei Euro
    prompt: |
      Das Schwimmbad verlangt jetzt zwei Euro, also zwei Münzen. Ändere
      `TRANSITIONS` in `turnstile.py`: Erst nach der zweiten Münze ist das
      Drehkreuz offen. Wer nach einer Münze schon drückt, kommt nicht durch,
      aber die Münze bleibt drin. Der neue Zustand heißt `q2`.
    check:
      type: python
      file: automata/turnstile.py
      cases:
        - run(['drücken']): "'q0'"
        - call: run(['münze']) == 'q1'
          expect: false
          say: Nach einer Münze darf das Drehkreuz noch nicht offen sein.
        - run(['münze', 'münze']): "'q1'"
        - call: run(['münze', 'drücken', 'münze'])
          expect: "'q1'"
          say: Wer mit einer Münze drückt, behält sie. Nach der zweiten ist es offen.
        - run(['münze', 'münze', 'drücken']): "'q0'"
        - call: run(['münze', 'münze', 'drücken', 'münze']) == 'q1'
          expect: false
          say: Nach dem Durchgehen kostet es wieder zwei Münzen.
        - run(['münze', 'münze', 'münze']): "'q1'"
    hint:
      - |
        Spiel das neue Drehkreuz von Hand durch: Münze, drücken, Münze, Münze,
        drücken. Schreib nach jedem Schritt auf, ob das Drehkreuz zu ist, ob schon
        eine Münze drin ist oder ob es offen ist. Wie viele verschiedene Lagen gibt es,
        und welche davon ist neu?
      - |
        Der neue Zustand `q2` heißt »eine Münze ist drin«. Er braucht wie die anderen
        einen Übergang für `münze` und einen für `drücken`. Und die erste Münze in
        `q0` führt jetzt nicht mehr gleich nach `q1`.
      - |
        Ein Gerüst; drei Ziele fehlen:

        ```python
        TRANSITIONS = {
            ('q0', 'münze'): ...,
            ('q0', 'drücken'): 'q0',
            ('q2', 'münze'): ...,
            ('q2', 'drücken'): ...,  # die Münze bleibt drin
            ('q1', 'münze'): 'q1',
            ('q1', 'drücken'): 'q0',
        }
        ```
    solution: |
      Der Zustand `q2` kommt dazu:
      `('q0', 'münze'): 'q2'`, `('q2', 'münze'): 'q1'`,
      `('q2', 'drücken'): 'q2'`; die übrigen Übergänge bleiben.

    ruby:
      prompt: |
        Das Schwimmbad verlangt jetzt zwei Euro, also zwei Münzen. Ändere
        `TRANSITIONS` in `turnstile.rb`: Erst nach der zweiten Münze ist das
        Drehkreuz offen. Wer nach einer Münze schon drückt, kommt nicht durch,
        aber die Münze bleibt drin. Der neue Zustand heißt `q2`.
      check:
        type: ruby
        file: automata/turnstile.rb
        cases:
          - run(['drücken']): "'q0'"
          - call: run(['münze']) == 'q1'
            expect: false
            say: Nach einer Münze darf das Drehkreuz noch nicht offen sein.
          - run(['münze', 'münze']): "'q1'"
          - call: run(['münze', 'drücken', 'münze'])
            expect: "'q1'"
            say: Wer mit einer Münze drückt, behält sie. Nach der zweiten ist es offen.
          - run(['münze', 'münze', 'drücken']): "'q0'"
          - call: run(['münze', 'münze', 'drücken', 'münze']) == 'q1'
            expect: false
            say: Nach dem Durchgehen kostet es wieder zwei Münzen.
          - run(['münze', 'münze', 'münze']): "'q1'"
      solution: |
        Der Zustand `q2` kommt dazu:
        `['q0', 'münze'] => 'q2'`, `['q2', 'münze'] => 'q1'`,
        `['q2', 'drücken'] => 'q2'`; die übrigen Übergänge bleiben.
      hint:
        - |
          Spiel das neue Drehkreuz von Hand durch: Münze, drücken, Münze, Münze,
          drücken. Schreib nach jedem Schritt auf, ob das Drehkreuz zu ist, ob schon
          eine Münze drin ist oder ob es offen ist. Wie viele verschiedene Lagen gibt es,
          und welche davon ist neu?
        - |
          Der neue Zustand `q2` heißt »eine Münze ist drin«. Er braucht wie die anderen
          einen Übergang für `münze` und einen für `drücken`. Und die erste Münze in
          `q0` führt jetzt nicht mehr gleich nach `q1`.
        - |
          Ein Gerüst; drei Ziele fehlen:

          ```ruby
          TRANSITIONS = {
              ['q0', 'münze'] => …,
              ['q0', 'drücken'] => 'q0',
              ['q2', 'münze'] => …,
              ['q2', 'drücken'] => …, # die Münze bleibt drin
              ['q1', 'münze'] => 'q1',
              ['q1', 'drücken'] => 'q0',
          }
          ```

  - id: rest
    title: Wo endet 1011?
    prompt: |
      Lies `1011` von Hand durch den Automaten im Bild, Ziffer für Ziffer.
      In welchem Zustand endet er? Gib seinen Index an, also 1 für q<sub>1</sub>.
    check:
      type: number
      expect: 2
    feedback:
      - when: { equals: 11 }
        say: 11 ist der Wert der Binärzahl. Gefragt ist der Zustand, sein Index ist der Rest beim Teilen durch 3.
    solution: 'Die Zustände sind q<sub>0</sub>, q<sub>1</sub>, q<sub>2</sub>, q<sub>2</sub>, q<sub>2</sub>: `1011` ist 11, und 11 geteilt durch 3 ist 3 Rest 2.'

  - id: teilbar-5
    title: Teilbar durch 5
    prompt: |
      Kopiere `divisible.py` nach `divisible5.py` und ändere den Automaten
      dort so, dass `accepts` genau die Binärzahlen annimmt, die durch 5
      teilbar sind.
    check:
      type: python
      file: automata/divisible5.py
      cases:
        - accepts('0'): true
        - accepts('1'): false
        - accepts('11'): false
        - accepts('101'): true
        - accepts('110'): false
        - accepts('1010'): true
        - accepts('1111'): true
        - accepts('1001011'): true
        - accepts('1100100'): true
        - accepts('1100101'): false
        - call: accepts(bin(5 ** 40)[2:])
          expect: true
          say: 5 hoch 40 ist durch 5 teilbar, und dein Automat liest die Zahl nur einmal von links nach rechts.
        - accepts(bin(5 ** 40 + 1)[2:]): false
    hint:
      - |
        Geh `1010` von links durch, das ist 10. Welchen Rest beim Teilen durch 5
        haben `1`, `10`, `101` und `1010`? Schau dir an, wie jeder Rest mit dem davor
        und der neuen Ziffer zusammenhängt: Was macht eine Ziffer mehr hinten aus
        einer Binärzahl?
      - |
        Fünf Zustände, `q0` bis `q4`, einer für jeden Rest von 0 bis 4. Eine Ziffer
        mehr hinten verdoppelt die Zahl und zählt die Ziffer dazu, also wird aus Rest
        `r` mit der Ziffer `d` der Rest `(2 * r + d) % 5`. Statt zehn Zeilen von Hand
        geht das mit zwei Schleifen.
      - |
        Ein Gerüst:

        ```python
        START = 'q0'
        ACCEPTING = {...}  # welcher Rest heißt »teilbar durch 5«?
        TRANSITIONS = {}
        for r in range(5):
            for d in '01':
                TRANSITIONS[(f'q{r}', d)] = ...  # der neue Rest als Zustand
        ```
    solution: |
      ```python
      TRANSITIONS = {}
      for r in range(5):
          for d in '01':
              TRANSITIONS[(f'q{r}', d)] = f'q{(2 * r + int(d)) % 5}'
      ```

    ruby:
      prompt: |
        Kopiere `divisible.rb` nach `divisible5.rb` und ändere den Automaten
        dort so, dass `accepts` genau die Binärzahlen annimmt, die durch 5
        teilbar sind.
      check:
        type: ruby
        file: automata/divisible5.rb
        cases:
          - accepts('0'): true
          - accepts('1'): false
          - accepts('11'): false
          - accepts('101'): true
          - accepts('110'): false
          - accepts('1010'): true
          - accepts('1111'): true
          - accepts('1001011'): true
          - accepts('1100100'): true
          - accepts('1100101'): false
          - call: accepts((5 ** 40).to_s(2))
            expect: true
            say: 5 hoch 40 ist durch 5 teilbar, und dein Automat liest die Zahl nur einmal von links nach rechts.
          - accepts((5 ** 40 + 1).to_s(2)): false
      hint:
        - |
          Geh `1010` von links durch, das ist 10. Welchen Rest beim Teilen durch 5
          haben `1`, `10`, `101` und `1010`? Schau dir an, wie jeder Rest mit dem davor
          und der neuen Ziffer zusammenhängt: Was macht eine Ziffer mehr hinten aus
          einer Binärzahl?
        - |
          Fünf Zustände, `q0` bis `q4`, einer für jeden Rest von 0 bis 4. Eine Ziffer
          mehr hinten verdoppelt die Zahl und zählt die Ziffer dazu, also wird aus Rest
          `r` mit der Ziffer `d` der Rest `(2 * r + d) % 5`. Statt zehn Zeilen von Hand
          geht das mit zwei Schleifen.
        - |
          Ein Gerüst:

          ```ruby
          START = 'q0'
          ACCEPTING = [] # welcher Rest heißt »teilbar durch 5«?
          TRANSITIONS = {}
          5.times do |r|
              '01'.each_char do |d|
                  TRANSITIONS[["q#{r}", d]] = … # der neue Rest als Zustand; d.to_i ist die Ziffer
              end
          end
          ```
      solution: |
        ```ruby
        TRANSITIONS = {}
        5.times do |r|
            '01'.each_char do |d|
                TRANSITIONS[["q#{r}", d]] = "q#{(2 * r + d.to_i) % 5}"
            end
        end
        ```

  - id: grenzen
    title: Was kein Automat kann
    prompt: |
      Ein endlicher Automat merkt sich nur seinen Zustand, und davon hat er
      endlich viele. Welche Frage kann darum kein endlicher Automat
      beantworten, egal wie viele Zustände er hat?
    check:
      type: choice
      options:
        - Stehen in einem Wort aus a und b gleich viele a wie b?
        - Endet ein Wort aus a und b auf ab?
        - Ist eine Binärzahl durch 7 teilbar?
        - Kommt in einem Wort irgendwo aba vor?
      correct: 0
    feedback:
      - when: { picked: 2 }
        say: Das geht wie bei 3 und 5, mit sieben Zuständen für die sieben möglichen Reste.
      - when: { picked: 3 }
        say: Dafür reichen vier Zustände, ähnlich wie beim Zahlenschloss.
    solution: Um gleich viele a und b zu erkennen, müsste der Automat mitzählen, wie viele a mehr als b er schon gesehen hat. Das können beliebig viele sein, aber er hat nur endlich viele Zustände.

  - id: schloss
    title: Das Schloss reparieren
    prompt: |
      Ergänze `TRANSITIONS` in `lock.py`, bis das Schloss immer öffnet, wenn
      die letzten vier Ziffern 1213 sind, und sonst nie. `START` und
      `opens` bleiben, wie sie sind.
    check:
      type: python
      file: automata/lock.py
      cases:
        - opens('1213'): true
        - opens('991213'): true
        - opens(''): false
        - opens('1212'): false
        - call: opens('11213')
          expect: true
          say: Nach 1 und noch einer 1 stimmt vom Code immer noch 1.
        - call: opens('121213')
          expect: true
          say: Nach 121 und einer 2 stimmt vom Code noch 12.
        - opens('1211213'): true
        - opens('12131213'): true
        - opens('12133'): false
        - opens('1213121'): false
        - opens('312121213'): true
    hint:
      - |
        Tipp `121213` in Gedanken ein und schreib nach jeder Ziffer den Zustand auf.
        An welcher Stelle geht es zurück nach `q0`, obwohl die letzten Ziffern schon
        wieder der Anfang des Codes sind? In welchem Zustand müsste das Schloss dort
        sein?
      - |
        Frag dich in jedem Zustand für jede Ziffer, die nicht weiter zum Code führt,
        was vom bisher Getippten noch passt: Was ist das längste Ende davon, mit dem
        der Code beginnt? In diesen Zustand führt der neue Pfeil. Nur die Ziffern 1, 2
        und 3 kommen im Code vor; jede andere führt sicher zurück nach `q0`.
      - |
        Geh die Zustände der Reihe nach durch, jeweils mit 1, 2 und 3. Zwei davon
        als Gerüst:

        ```python
        TRANSITIONS = {
            ('q0', '1'): 'q1',
            ('q1', '2'): 'q2',
            ('q2', '1'): 'q3',
            ('q3', '3'): 'q4',
            ('q1', '1'): ...,  # getippt: 11
            ('q3', '2'): ...,  # getippt: 1212
            ...  # die übrigen, auch aus q4
        }
        ```
    solution: |
      Vier Übergänge kommen dazu: `('q1', '1'): 'q1'`, `('q3', '1'): 'q1'`,
      `('q3', '2'): 'q2'` und `('q4', '1'): 'q1'`. Alle anderen fehlenden
      führen zu Recht zurück nach `q0`.

