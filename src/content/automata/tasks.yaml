  - id: generalschluessel
    title: Ein Generalschlüssel
    prompt: |
      Die Hausmeisterin hat einen Generalschlüssel: Das Schloss soll auch
      öffnen, wenn die letzten vier Ziffern 4711 sind. Baue das in den NEA in
      `lock_nfa.py` ein. 1213 muss weiter funktionieren.
    check:
      type: python
      file: automata/lock_nfa.py
      cases:
        - opens('1213'): true
        - opens('4711'): true
        - opens('94711'): true
        - call: opens('44711')
          expect: true
          say: Auch bei der zweiten 4 darf der NEA raten, dass hier der Code beginnt. Er bleibt dafür in q<sub>0</sub>.
        - opens('471'): false
        - opens('4712'): false
        - opens('47121213'): true
        - opens('121213'): true
        - opens('4741711'): false
    hint:
      - |
        Zeichne den NEA für 1213 ab und daneben einen zweiten Weg für 4711: Wo
        beginnt er, über welche Zustände führt er, wo endet er? Was muss in `q0` bei
        einer 4 passieren, damit der NEA trotzdem weiter auf 1213 warten kann?
      - |
        Ein zweiter Weg aus `q0`, so wie der für 1213, über neue Zustände `q5` bis
        `q8`. Bei einer 4 rät `q0` wie bei einer 1: Er bleibt und geht zugleich nach
        `q5`. `ACCEPTING` bekommt einen zweiten Zustand.
      - |
        Ein Gerüst; ein Schritt des neuen Wegs steht schon da:

        ```python
        ACCEPTING = {'q4', ...}  # der Zustand am Ende von 4711
        ...
        TRANSITIONS[('q0', '4')] = ...  # bleiben und raten, dass 4711 beginnt
        TRANSITIONS[('q5', '7')] = {'q6'}
        ...  # die beiden Schritte für 1 und 1
        ```
    solution: |
      ```python
      ACCEPTING = {'q4', 'q8'}
      TRANSITIONS[('q0', '4')] = {'q0', 'q5'}
      TRANSITIONS[('q5', '7')] = {'q6'}
      TRANSITIONS[('q6', '1')] = {'q7'}
      TRANSITIONS[('q7', '1')] = {'q8'}
      ```

    ruby:
      prompt: |
        Die Hausmeisterin hat einen Generalschlüssel: Das Schloss soll auch
        öffnen, wenn die letzten vier Ziffern 4711 sind. Baue das in den NEA in
        `lock_nfa.rb` ein. 1213 muss weiter funktionieren.
      check:
        type: ruby
        file: automata/lock_nfa.rb
        cases:
          - opens('1213'): true
          - opens('4711'): true
          - opens('94711'): true
          - call: opens('44711')
            expect: true
            say: Auch bei der zweiten 4 darf der NEA raten, dass hier der Code beginnt. Er bleibt dafür in q<sub>0</sub>.
          - opens('471'): false
          - opens('4712'): false
          - opens('47121213'): true
          - opens('121213'): true
          - opens('4741711'): false
      solution: |
        ```ruby
        ACCEPTING = Set['q4', 'q8']
        TRANSITIONS[['q0', '4']] = Set['q0', 'q5']
        TRANSITIONS[['q5', '7']] = Set['q6']
        TRANSITIONS[['q6', '1']] = Set['q7']
        TRANSITIONS[['q7', '1']] = Set['q8']
        ```
      hint:
        - |
          Zeichne den NEA für 1213 ab und daneben einen zweiten Weg für 4711: Wo
          beginnt er, über welche Zustände führt er, wo endet er? Was muss in `q0` bei
          einer 4 passieren, damit der NEA trotzdem weiter auf 1213 warten kann?
        - |
          Ein zweiter Weg aus `q0`, so wie der für 1213, über neue Zustände `q5` bis
          `q8`. Bei einer 4 rät `q0` wie bei einer 1: Er bleibt und geht zugleich nach
          `q5`. `ACCEPTING` bekommt einen zweiten Zustand.
        - |
          Ein Gerüst; ein Schritt des neuen Wegs steht schon da:

          ```ruby
          ACCEPTING = Set['q4', …] # der Zustand am Ende von 4711
          # …
          TRANSITIONS[['q0', '4']] = … # bleiben und raten, dass 4711 beginnt
          TRANSITIONS[['q5', '7']] = Set['q6']
          # … die beiden Schritte für 1 und 1
          ```

