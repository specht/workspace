# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
format: 1
activity: automata
examples:
  drehkreuz:
    pass:
      - files: { automata/turnstile.py: loesung/turnstile.py }
    fail:
      - files: { automata/turnstile.py: stufen/turnstile.py }
      - files: { automata/turnstile.py: { text: "def run(inputs):\n    return 'q0'\n" } }
    ruby:
      pass:
        - files: { automata/turnstile.rb: loesung/turnstile.rb }
      fail:
        - files: { automata/turnstile.rb: stufen/turnstile.rb }
        - files: { automata/turnstile.rb: { text: "def run(inputs)\n  'q0'\nend\n" } }
  teilbar-5:
    pass:
      - files: { automata/divisible5.py: loesung/divisible5.py }
    fail:
      - files: { automata/divisible5.py: stufen/divisible.py }
      - files: { automata/divisible5.py: { text: "def accepts(word):\n    return word.endswith('0')\n" } }
    ruby:
      pass:
        - files: { automata/divisible5.rb: loesung/divisible5.rb }
      fail:
        - files: { automata/divisible5.rb: stufen/divisible.rb }
        - files: { automata/divisible5.rb: { text: "def accepts(word)\n  word.end_with?('0')\nend\n" } }
  schloss:
    pass:
      - files: { automata/lock.py: loesung/lock.py }
    fail:
      - files: { automata/lock.py: stufen/lock.py }
      - files: { automata/lock.py: { text: "def opens(word):\n    return word == '1213'\n" } }
    ruby:
      pass:
        - files: { automata/lock.rb: loesung/lock.rb }
      fail:
        - files: { automata/lock.rb: stufen/lock.rb }
        - files: { automata/lock.rb: { text: "def opens(word)\n  word == '1213'\nend\n" } }
  nea-schritt:
    pass:
      - files: { automata/lock_nfa.py: stufen/lock_nfa.py }
    fail:
      - files: { automata/lock_nfa.py: { text: "def opens(digits):\n    return digits == '1213'\n" } }
      - files: { automata/lock_nfa.py: { text: "TRANSITIONS = {('q0', '1'): {'q0', 'q1'}, ('q1', '2'): {'q2'}, ('q2', '1'): {'q3'}, ('q3', '3'): {'q4'}}\n\ndef opens(digits):\n    state = 'q0'\n    for digit in digits:\n        state = sorted(TRANSITIONS.get((state, digit), {'q0'}))[-1]\n    return state == 'q4'\n" } }
    ruby:
      pass:
        - files: { automata/lock_nfa.rb: stufen/lock_nfa.rb }
      fail:
        - files: { automata/lock_nfa.rb: { text: "def opens(digits)\n  digits == '1213'\nend\n" } }
  dea-schritt:
    pass:
      - files: { automata/convert.py: stufen/convert.py, automata/lock_nfa.py: stufen/lock_nfa.py }
      # mit dem Generalschlüssel
      - files: { automata/convert.py: stufen/convert.py, automata/lock_nfa.py: loesung/lock_nfa.py }
    fail:
      # die Seite vor dem Kasten
      - files:
          automata/lock_nfa.py: stufen/lock_nfa.py
          automata/convert.py:
            text: |
              # Die Potenzmengenkonstruktion: Sie baut aus einem NEA einen DEA. Jeder
              # Zustand des DEA ist eine Menge von Zuständen des NEA, nämlich die, in denen
              # der NEA gerade sein könnte.
              from lock_nfa import DIGITS, START, ACCEPTING, TRANSITIONS


              # Alle Zustände, in die der NEA aus states mit symbol kommt.
              def step(states, symbol):
                  …


              def to_dfa():
                  start = frozenset({START})
                  found = {start}
                  todo = [start]
                  transitions = {}
                  while todo:
                      states = todo.pop()
                      for symbol in DIGITS:
                          target = step(states, symbol)
                          transitions[(states, symbol)] = target
                          if target not in found:
                              found.add(target)
                              todo.append(target)
                  return found, transitions


              found, transitions = to_dfa()
              print(len(found), 'Zustände')
              for (states, symbol), target in transitions.items():
                  if target != {START}:
                      print(sorted(states), symbol, '→', sorted(target))
      # eine set statt einer frozenset: to_dfa kann sie nicht aufheben
      - files:
          automata/lock_nfa.py: stufen/lock_nfa.py
          automata/convert.py:
            text: |
              # Die Potenzmengenkonstruktion: Sie baut aus einem NEA einen DEA. Jeder
              # Zustand des DEA ist eine Menge von Zuständen des NEA, nämlich die, in denen
              # der NEA gerade sein könnte.
              from lock_nfa import DIGITS, START, ACCEPTING, TRANSITIONS


              # Alle Zustände, in die der NEA aus states mit symbol kommt.
              def step(states, symbol):
                  new_states = set()
                  for state in states:
                      new_states |= TRANSITIONS.get((state, symbol), set())
                  return new_states


              def to_dfa():
                  start = frozenset({START})
                  found = {start}
                  todo = [start]
                  transitions = {}
                  while todo:
                      states = todo.pop()
                      for symbol in DIGITS:
                          target = step(states, symbol)
                          transitions[(states, symbol)] = target
                          if target not in found:
                              found.add(target)
                              todo.append(target)
                  return found, transitions


              found, transitions = to_dfa()
              print(len(found), 'Zustände')
              for (states, symbol), target in transitions.items():
                  if target != {START}:
                      print(sorted(states), symbol, '→', sorted(target))
        say: frozenset
    ruby:
      pass:
        - files: { automata/convert.rb: stufen/convert.rb, automata/lock_nfa.rb: stufen/lock_nfa.rb }
        # mit dem Generalschlüssel
        - files: { automata/convert.rb: stufen/convert.rb, automata/lock_nfa.rb: loesung/lock_nfa.rb }
      fail:
        # die Seite vor dem Kasten
        - files:
            automata/lock_nfa.rb: stufen/lock_nfa.rb
            automata/convert.rb:
              text: |
                # Die Potenzmengenkonstruktion: Sie baut aus einem NEA einen DEA. Jeder
                # Zustand des DEA ist eine Menge von Zuständen des NEA, nämlich die, in denen
                # der NEA gerade sein könnte.
                require_relative 'lock_nfa'

                # Alle Zustände, in die der NEA aus states mit symbol kommt.
                def step(states, symbol)
                    …
                end

                def to_dfa
                    start = Set[START]
                    found = Set[start]
                    todo = [start]
                    transitions = {}
                    until todo.empty?
                        states = todo.pop
                        DIGITS.each_char do |symbol|
                            target = step(states, symbol)
                            transitions[[states, symbol]] = target
                            unless found.include?(target)
                                found << target
                                todo << target
                            end
                        end
                    end
                    [found, transitions]
                end

                found, transitions = to_dfa
                puts "#{found.size} Zustände"
                transitions.each do |(states, symbol), target|
                    next if target == Set[START]

                    puts "#{states.sort.inspect} #{symbol} → #{target.sort.inspect}"
                end
        # ohne new_states als letzte Zeile: step gibt states zurück, das each liefert
        - files:
            automata/lock_nfa.rb: stufen/lock_nfa.rb
            automata/convert.rb:
              text: |
                # Die Potenzmengenkonstruktion: Sie baut aus einem NEA einen DEA. Jeder
                # Zustand des DEA ist eine Menge von Zuständen des NEA, nämlich die, in denen
                # der NEA gerade sein könnte.
                require_relative 'lock_nfa'

                # Alle Zustände, in die der NEA aus states mit symbol kommt.
                def step(states, symbol)
                    new_states = Set.new
                    states.each do |state|
                        new_states |= TRANSITIONS.fetch([state, symbol], Set.new)
                    end
                end

                def to_dfa
                    start = Set[START]
                    found = Set[start]
                    todo = [start]
                    transitions = {}
                    until todo.empty?
                        states = todo.pop
                        DIGITS.each_char do |symbol|
                            target = step(states, symbol)
                            transitions[[states, symbol]] = target
                            unless found.include?(target)
                                found << target
                                todo << target
                            end
                        end
                    end
                    [found, transitions]
                end

                found, transitions = to_dfa
                puts "#{found.size} Zustände"
                transitions.each do |(states, symbol), target|
                    next if target == Set[START]

                    puts "#{states.sort.inspect} #{symbol} → #{target.sort.inspect}"
                end
          say: q1
  generalschluessel:
    pass:
      - files: { automata/lock_nfa.py: loesung/lock_nfa.py }
    fail:
      - files: { automata/lock_nfa.py: stufen/lock_nfa.py }
      - files: { automata/lock_nfa.py: { text: "def opens(word):\n    return word.endswith('1213')\n" } }
    ruby:
      pass:
        - files: { automata/lock_nfa.rb: loesung/lock_nfa.rb }
      fail:
        - files: { automata/lock_nfa.rb: stufen/lock_nfa.rb }
        - files: { automata/lock_nfa.rb: { text: "def opens(word)\n  word.end_with?('1213')\nend\n" } }
