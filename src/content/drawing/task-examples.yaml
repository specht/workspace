# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
format: 1
activity: drawing
examples:
  erster-pixel:
    pass:
      - files: { rainbow.rb: rainbow.rb }
    fail:
      - files: { rainbow.png: ../static-website/html-css-logo.png }
  ecke:
    pass:
      - answer: 319, 179
      - answer: (319; 179)
    fail:
      - answer: 320, 180
      - answer: 179, 319
  bild-gespeichert:
    pass:
      # Ein PNG aus einer anderen Aktivität: YAML kann keine Bytes über 0x7F
      - files: { rainbow.png: ../static-website/html-css-logo.png }
    fail:
      # Ein WebP, das .png heißt
      - files: { rainbow.png: first-pixel.webp }
  kurven:
    pass:
      - files: { rainbow.rb: stufen/step-4.rb }
      # eigene mittlere Punkte, ohne Leerzeichen
      - files: { rainbow.rb: { text: "set_color(8)\ndraw_cubic_bezier(0,140,80,160,240,120,320,140)\nset_color(9)\ndraw_cubic_bezier(0,170,90,150,230,160,320,170)\n" } }
    fail:
      # der Stand davor: nur der Hintergrund
      - files: { rainbow.rb: stufen/step-3.rb }
        say: "(0, 140)"
      # nur die erste Kurve
      - files: { rainbow.rb: { text: "set_color(7)\ndraw_cubic_bezier(0, 120, 100, 140, 200, 100, 320, 120)\n" } }
        say: "(0, 140)"
      # die zweite Kurve endet nicht am rechten Rand
      - files: { rainbow.rb: { text: "draw_cubic_bezier(0, 140, 100, 150, 200, 110, 300, 140)\ndraw_cubic_bezier(0, 170, 110, 140, 220, 140, 320, 170)\n" } }
        say: "(320, 140)"
  flaechen:
    pass:
      - files: { rainbow.rb: stufen/step-6.rb }
      - files: { rainbow.rb: rainbow.rb }
      # andere Punkte am linken Rand, ohne Leerzeichen
      - files: { rainbow.rb: { text: "set_color(8)\nflood_fill(0,160)\nset_color(9)\nflood_fill(0,175)\n" } }
    fail:
      # der Stand davor: nur die obere Fläche gefüllt
      - files: { rainbow.rb: stufen/step-5.rb }
        say: mittlere Fläche
      # ein Punkt genau auf der Kurve: es wird nur die Kurve gefärbt
      - files: { rainbow.rb: { text: "set_color(8)\nflood_fill(0, 140)\nset_color(9)\nflood_fill(0, 170)\n" } }
        say: nicht genau auf einer Kurve
  zweite-maske:
    pass:
      - files: { rainbow.rb: rainbow.rb }
    fail:
      # der Stand davor: eine Maske
      - files: { rainbow.rb: stufen/step-7.rb }
        say: erst eine Maske
      # die zweite Maske nimmt eine andere Farbe auf
      - files: { rainbow.rb: { text: "set_mask do\n  add_color(16)\nend\n(0..5).each do |i|\n  fill_circle(160, 180, 100 - i)\nend\nset_mask do\n  add_color(20)\nend\n" } }
        say: Farbe 16
      # die zweite Maske über dem Regenbogen
      - files: { rainbow.rb: { text: "set_mask do\n  add_color(16)\nend\nset_mask do\n  add_color(16)\nend\n(0..5).each do |i|\n  fill_circle(160, 180, 100 - i)\nend\n" } }
        say: über dem Regenbogen
