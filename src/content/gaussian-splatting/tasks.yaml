# Aufgaben zu »Gaussian Splatting«. Format: docs/aufgaben.md. Alles liegt in
# /workspace/splatting; die Funktionen der Lernenden rechnen mit numpy
# (pip install numpy pillow, wie die Seite sagt). Die Zahlen gehören zu den
# Programmen in stufen/ und zu pearl-earring.png und modern-arm-chair.ply.
format: 1
activity: gaussian-splatting
tasks:
  - id: ein-splat
    title: Ein Splat
    prompt: |
      Schreib in `splatting/blobs.py` die Funktion `blob(dx, dy, sigma)`: das
      Gewicht eines Pixels, das um `dx` und `dy` von der Mitte eines runden
      Splats mit der Breite `sigma` entfernt ist. Die Prüfung ruft sie mit
      einzelnen Zahlen und mit numpy-Arrays auf.
    check:
      type: python
      file: splatting/blobs.py
      cases:
        - call: 'round(float(blob(0, 0, 1)), 4)'
          expect: 1.0
          say: In der Mitte ist das Gewicht genau 1, denn e hoch 0 ist 1.
        - call: 'round(float(blob(1, 0, 1)), 4)'
          expect: 0.6065
          say: Einen Sigma von der Mitte entfernt ist das Gewicht e hoch −1/2, etwa 0,61. Steht im Nenner 2 · sigma · sigma?
        - call: 'round(float(blob(3, 4, 5)), 4)'
          expect: 0.6065
          say: Der Abstand ist 5, so groß wie sigma; das Gewicht ist wieder etwa 0,61. Wird sigma im Nenner quadriert?
        - call: 'round(float(blob(0, -2, 1)), 4)'
          expect: 0.1353
          say: Unter der Mitte zählt der Abstand genauso wie darüber; dy wird quadriert.
        - call: 'blob(np.array([0.0, 2.0]), np.array([0.0, 0.0]), 2).round(4).tolist()'
          expect: '[1.0, 0.6065]'
          say: Mit Arrays rechnet die Funktion jede Zelle für sich. math.exp geht nur mit einzelnen Zahlen; nimm np.exp.
    solution: |
      ```python
      def blob(dx, dy, sigma):
          return np.exp(-(dx * dx + dy * dy) / (2 * sigma * sigma))
      ```

  - id: gedreht
    title: Gestreckt und gedreht
    prompt: |
      Schreib in `splatting/blobs.py` die Funktion
      `weight(dx, dy, sx, sy, angle)`: das Gewicht eines Pixels für einen Splat
      mit den Breiten `sx` und `sy`, um den Winkel `angle` gedreht. Die
      Prüfung ruft sie ohne und mit Drehung auf und auch mit Arrays.
    check:
      type: python
      file: splatting/blobs.py
      cases:
        - call: 'round(float(weight(3, 0, 3, 1, 0)), 4)'
          expect: 0.6065
          say: Ohne Drehung ist u = dx / sx = 1 und v = 0; das Gewicht ist e hoch −1/2.
        - call: 'round(float(weight(0, 3, 3, 1, 0)), 4)'
          expect: 0.0111
          say: Ohne Drehung ist v = dy / sy = 3; quer zum Splat fällt die Glocke schnell ab.
        - call: 'round(float(weight(0, 3, 3, 1, np.pi / 2)), 4)'
          expect: 0.6065
          say: Um eine Vierteldrehung gedreht liegt die lange Achse senkrecht; ein Pixel 3 unter der Mitte ist dann eine Breite sx entfernt. Stimmen die Vorzeichen von sin in u und v?
        - call: 'round(float(weight(2, 2, 2.0, 1.0, np.pi / 4)), 4)'
          expect: 0.3679
          say: Um ein Achtel gedreht zeigt die lange Achse nach rechts unten; das Pixel bei (2, 2) liegt auf ihr, u ist etwa 1,41 und v 0.
        - call: 'round(float(weight(1, 2, 4, 4, 0.7) - blob(1, 2, 4)), 6)'
          expect: 0.0
          say: Sind beide Breiten gleich, ist der Splat rund, und der Winkel ist egal; dann kommt dasselbe heraus wie bei blob.
        - call: 'weight(np.array([0.0, 3.0]), np.array([0.0, 0.0]), 3, 1, 0).round(4).tolist()'
          expect: '[1.0, 0.6065]'
          say: Mit Arrays rechnet die Funktion jede Zelle für sich; nimm np.cos, np.sin und np.exp.
    solution: |
      ```python
      def weight(dx, dy, sx, sy, angle):
          c = np.cos(angle)
          s = np.sin(angle)
          u = (c * dx + s * dy) / sx
          v = (-s * dx + c * dy) / sy
          return np.exp(-(u * u + v * v) / 2)
      ```

  - id: ueberlappen
    title: Wo zwei Splats sich treffen
    prediction: true
    prompt: |
      Das Programm addiert drei farbige Splats. Der blaue und der grüne
      überlappen sich rechts. Was zeigt das Bild dort, wo sie sich
      überlappen?
    check:
      type: choice
      options:
        - Es wird heller, die Farben addieren sich, Blau und Grün zu einem hellen Türkis.
        - Der Splat, der im Programm später kommt, deckt den früheren ab.
        - Es wird dunkler, weil sich die beiden Splats gegenseitig abschwächen.
        - Die Farbe des stärkeren Splats setzt sich durch, ohne sich zu mischen.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Das Programm rechnet `image +=`, es addiert. Abdecken müsste es die Farbe darunter ersetzen.
      - when: { picked: 2 }
        say: Gewichte und Farben sind nie negativ; eine Summe solcher Zahlen wird nicht kleiner.
      - when: { picked: 3 }
        say: Beide Splats tragen ihre Farbe bei, multipliziert mit ihrem Gewicht an dieser Stelle; keiner verdrängt den anderen.
    solution: |
      Es wird heller: Jeder Splat addiert seine Farbe, multipliziert mit
      seinem Gewicht. Blau (0,1, 0,5, 1,0) und Grün (0,2, 0,9, 0,2) ergeben
      zusammen viel Grün und Blau, ein helles Türkis.

  - id: fehler
    title: Wie weit daneben?
    prompt: |
      Schreib in `splatting/blobs.py` die Funktion `error(image, target)`:
      der mittlere quadratische Fehler zwischen zwei gleich großen Tabellen.
    check:
      type: python
      file: splatting/blobs.py
      cases:
        - call: 'float(error(np.array([0.5, 1.0]), np.array([0.0, 1.0])))'
          expect: 0.125
          say: Die Abweichungen sind 0,5 und 0, die Quadrate 0,25 und 0, ihr Mittelwert 0,125.
        - call: 'float(error(np.array([0.0, 1.0]), np.array([0.5, 1.0])))'
          expect: 0.125
          say: Eine Abweichung nach unten zählt genauso wie eine nach oben; das Quadrat macht beide positiv.
        - call: 'float(error(np.zeros((2, 2, 3)), np.ones((2, 2, 3))))'
          expect: 1.0
          say: Jede der 12 Zahlen weicht um 1 ab; der Mittelwert der Quadrate ist 1, nicht die Summe 12.
        - call: 'float(error(np.array([0.2, 0.4, 0.6]), np.array([0.2, 0.4, 0.6])))'
          expect: 0.0
          say: Sind beide gleich, ist der Fehler 0.
        - call: 'round(float(error(np.array([1.0, 0.0]), np.array([0.0, 0.0]))), 4)'
          expect: 0.5
          say: Die Abweichungen 1 und 0 im Quadrat sind 1 und 0, ihr Mittelwert 0,5. Wird quadriert, nicht nur der Betrag genommen?
    solution: |
      ```python
      def error(image, target):
          return np.mean((image - target) ** 2)
      ```

  - id: erster-schritt
    title: Der erste Schritt bergab
    prompt: |
      Der Fehler ist \\(E(c) = (c - 0{,}7)^2\\), seine Ableitung
      \\(E'(c) = 2\\,(c - 0{,}7)\\). Du beginnst bei \\(c = 0\\) und gehst einen
      Schritt Gradientenabstieg mit der Lernrate \\(\eta = 0{,}1\\). Welchen
      Wert hat \\(c\\) danach?
    check: { type: number, expect: 0.14, tolerance: 0.0001 }
    feedback:
      - when: { equals: -0.14 }
        say: Die Steigung bei 0 ist −1,4; gegen die Steigung heißt, sie abzuziehen, und minus mal minus ist plus.
      - when: { equals: 0.07 }
        say: Die Ableitung hat den Faktor 2; die Steigung bei 0 ist 2 · (0 − 0,7) = −1,4.
      - when: { equals: 0.7 }
        say: Das ist der Tiefpunkt. Ein Schritt mit der Lernrate 0,1 kommt nur ein Stück dorthin.
      - when: { equals: 1.4 }
        say: Das ist der Betrag der Steigung. Multiplizier sie noch mit der Lernrate.
    hint: |
      Erst die Steigung an der Stelle 0 ausrechnen, dann mit 0,1
      multiplizieren und von 0 abziehen.
    solution: |
      Die Steigung bei 0 ist \\(2 \cdot (0 - 0{,}7) = -1{,}4\\). Der Schritt:
      \\(0 - 0{,}1 \cdot (-1{,}4) = 0{,}14\\). Der Regler geht also ein Stück
      nach rechts, auf den Tiefpunkt bei 0,7 zu.

  - id: schritt
    title: Ein Schritt gegen den Gradienten
    prompt: |
      Schreib in `splatting/blobs.py` die Funktion `step(value, gradient, rate)`:
      ein Schritt Gradientenabstieg. Die Prüfung ruft sie mit Zahlen und mit
      numpy-Arrays auf.
    check:
      type: python
      file: splatting/blobs.py
      cases:
        - call: 'round(float(step(1.0, 2.0, 0.1)), 6)'
          expect: 0.8
          say: Gegen die Steigung, also abziehen. 1 − 0,1 · 2 = 0,8.
        - call: 'round(float(step(0.0, -1.4, 0.1)), 6)'
          expect: 0.14
          say: Bei negativer Steigung wird der Wert größer.
        - call: 'step(np.array([1.0, 1.0]), np.array([2.0, -2.0]), 0.5).tolist()'
          expect: '[0.0, 2.0]'
          say: Mit Arrays geht jeder Wert seinen eigenen Schritt, mit seiner eigenen Steigung.
        - call: 'round(float(step(3.0, 0.0, 0.5)), 6)'
          expect: 3.0
          say: Ohne Steigung bleibt der Wert, wo er ist.
    solution: |
      ```python
      def step(value, gradient, rate):
          return value - rate * gradient
      ```

