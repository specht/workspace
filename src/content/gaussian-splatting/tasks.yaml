    feedback:
      - when: { picked: 0 }
        say: Beim Addieren schon, denn a + b = b + a. Beim Mischen nimmt jeder Splat denen dahinter einen Teil des Lichts; wer zuerst kommt, gilt als vorne.
      - when: { picked: 1 }
        say: Es geht nicht nur um die Helligkeit. Die Rechnung hält den ersten Splat für den vordersten; liegt er hinten, malt er über das, was vor ihm liegt.
      - when: { picked: 3 }
        say: Rechnen kann das Programm in jeder Reihenfolge; es rechnet dann nur etwas anderes.
    solution: |
      Ohne Sortieren hält das Programm den ersten Splat der Datei für den
      vordersten. Liegt er in Wahrheit hinten, malt er über die Splats vor
      ihm, und die nehmen ihm später kein Licht mehr weg. Das Bild wird
      fleckig, und Verdecktes scheint durch.

  - id: z-buffer
    title: Warum kein Z-Buffer?
    prediction: true
    prompt: |
      Ein Z-Buffer merkt sich für jedes Pixel die Tiefe dessen, was dort am
      nächsten gemalt wurde, und malt nur, was noch näher liegt. Warum nimmt
      der Viewer ihn nicht statt des Sortierens?
    check:
      type: choice
      options:
        - Ein Z-Buffer hält je Pixel nur das Nächste fest; ein durchscheinender Splat soll aber mit dem mischen, was hinter ihm liegt, und das ist dann oft noch gar nicht gemalt.
        - Splats haben keine Tiefe, die man vergleichen könnte.
        - Ein Z-Buffer ist für so viele Splats zu langsam.
        - Ein Z-Buffer geht nur mit Dreiecken, weil er ihre Ecken braucht.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Jeder Splat hat eine Lage im Raum und damit eine Tiefe von der Kamera aus; danach sortiert der Viewer ja.
      - when: { picked: 2 }
        say: Ein Z-Buffer ist schnell, er braucht nur einen Vergleich je Pixel. Das Problem ist, was er verwirft.
      - when: { picked: 3 }
        say: Ein Z-Buffer vergleicht die Tiefe an jedem Pixel, egal woher sie kommt. Er geht mit allem, was deckt.
    solution: |
      Ein Z-Buffer kennt je Pixel nur das Nächste. Mit Durchscheinendem geht
      das nicht: Was hinter einem halb durchsichtigen Splat liegt, muss noch
      beigemischt werden. Kommt es später, verwirft der Z-Buffer es, und es
      fehlt.

  - id: warum-reihenfolge
    title: Addieren und Mischen
    prompt: |
      Erkläre in eigenen Worten, warum die Reihenfolge der Splats in deinem
      2D-Bild egal war und in der 3D-Szene nicht.
    check: { type: reflection, min_words: 25 }
    solution: |
      In 2D addiert das Programm die Farben der Splats, und eine Summe ist
      in jeder Reihenfolge gleich. In 3D mischt es: Jeder Splat trägt seine
      Farbe mit dem Anteil des Lichts bei, das noch durchkommt, und lässt
      danach weniger durch. Ein Splat vorne nimmt den Splats dahinter Licht
      weg, nicht umgekehrt; darum muss man von vorne nach hinten gehen, also
      nach der Tiefe sortieren, und die hängt von der Kamera ab.
