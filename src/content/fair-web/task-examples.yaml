# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): Die fertige Seite (stufen/) muss jede Prüfung
# bestehen, die Seite vom Anfang (src/static/fair-web) muss an jeder
# scheitern. Die starter der Funktionen werden von selbst mitgeprüft.
