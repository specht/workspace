        ```

  - id: looks-like
    title: Fast dieselbe Domain
    level: 2
    prompt: |
      Schreib `looks_like(a, b)`: `true`, wenn die Domains `a` und `b`
      verschieden sind, aber gleich werden, sobald in beiden `I` und `1` zu `l`,
      `0` zu `o` und `rn` zu `m` werden; sonst `false`.
    starter: |
      def looks_like(a, b)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "looks_like('schuIe-am-see.example', 'schule-am-see.example')"
          expect: "true"
        - call: "looks_like('schule-am-see.example', 'schuIe-am-see.example')"
          expect: "true"
        - call: "looks_like('rnensa.example', 'mensa.example')"
          expect: "true"
        - call: "looks_like('ag-0nline.example', 'ag-online.example')"
          expect: "true"
        - call: "looks_like('pa1ast.example', 'palast.example')"
          expect: "true"
        - call: "looks_like('schule-am-see.example', 'schule-am-see.example')"
          expect: "false"
          say: Zwei gleiche Domains sind dieselbe, keine Fälschung.
        - call: "looks_like('zustell-service.example', 'schule-am-see.example')"
          expect: "false"
    feedback:
      - when: { same_as: "def looks_like(a, b)\n  a.gsub('rn', 'm').tr('I10', 'llo') == b.gsub('rn', 'm').tr('I10', 'llo')\nend\n" }
        say: Zwei gleiche Domains sind dieselbe, keine Fälschung. Prüfe zuerst, ob `a` und `b` verschieden sind.
    hint:
      - "Von Hand: Aus `schuIe-am-see.example` wird `schule-am-see.example`, aus `rnensa.example` wird `mensa.example`. Danach sind sie gleich wie die echten."
      - "`gsub('rn', 'm')` ersetzt jedes `rn`, `tr('I10', 'llo')` ersetzt jedes `I` durch `l`, jede `1` durch `l` und jede `0` durch `o`. Eine eigene Funktion `normalize(domain)` dafür spart doppelten Code."
    solution: |
      ```ruby
      def normalize(domain)
        domain.gsub('rn', 'm').tr('I10', 'llo')
      end

      def looks_like(a, b)
        a != b && normalize(a) == normalize(b)
      end
      ```
    python:
      prompt: |
        Schreib `looks_like(a, b)`: `True`, wenn die Domains `a` und `b`
        verschieden sind, aber gleich werden, sobald in beiden `I` und `1` zu `l`,
        `0` zu `o` und `rn` zu `m` werden; sonst `False`.
      starter: |
        def looks_like(a, b):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "looks_like('schuIe-am-see.example', 'schule-am-see.example')"
            expect: "True"
          - call: "looks_like('schule-am-see.example', 'schuIe-am-see.example')"
            expect: "True"
          - call: "looks_like('rnensa.example', 'mensa.example')"
            expect: "True"
          - call: "looks_like('ag-0nline.example', 'ag-online.example')"
            expect: "True"
          - call: "looks_like('pa1ast.example', 'palast.example')"
            expect: "True"
          - call: "looks_like('schule-am-see.example', 'schule-am-see.example')"
            expect: "False"
            say: Zwei gleiche Domains sind dieselbe, keine Fälschung.
          - call: "looks_like('zustell-service.example', 'schule-am-see.example')"
            expect: "False"
      feedback:
        - when: { same_as: "def normalize(domain):\n    return domain.replace('rn', 'm').replace('I', 'l').replace('1', 'l').replace('0', 'o')\n\ndef looks_like(a, b):\n    return normalize(a) == normalize(b)\n" }
          say: Zwei gleiche Domains sind dieselbe, keine Fälschung. Prüfe zuerst, ob `a` und `b` verschieden sind.
      hint:
        - "Von Hand: Aus `schuIe-am-see.example` wird `schule-am-see.example`, aus `rnensa.example` wird `mensa.example`. Danach sind sie gleich wie die echten."
        - "`replace('rn', 'm')` ersetzt jedes `rn`; für `I`, `1` und `0` je ein weiteres `replace`. Eine eigene Funktion `normalize(domain)` dafür spart doppelten Code."
      solution: |
        ```python
        def normalize(domain):
            return domain.replace('rn', 'm').replace('I', 'l').replace('1', 'l').replace('0', 'o')

        def looks_like(a, b):
            return a != b and normalize(a) == normalize(b)
        ```

