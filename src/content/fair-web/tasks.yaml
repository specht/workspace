  - id: host
    title: Der Rechnername
    level: 2
    prompt: |
      Schreib `host(url)`: den Rechnernamen einer Adresse, ohne Protokoll,
      Pfad, Port und Benutzernamen. Eine Adresse ohne `://` beginnt gleich mit
      dem Rechnernamen.
    starter: |
      def host(url)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "host('https://schule-am-see.example/login')"
          expect: "'schule-am-see.example'"
        - call: "host('https://schule-am-see.example')"
          expect: "'schule-am-see.example'"
          say: Auch ohne Pfad gibt es einen Rechnernamen.
        - call: "host('schule-am-see.example/ag')"
          expect: "'schule-am-see.example'"
          say: Ohne `://` beginnt die Adresse gleich mit dem Rechnernamen, so wie im Text eines Links.
        - call: "host('https://schule-am-see.example:8080/ag')"
          expect: "'schule-am-see.example'"
          say: Der Port hinter dem `:` gehört nicht zum Namen.
        - call: "host('https://schule-am-see.example@konto-pruefung.example/login')"
          expect: "'konto-pruefung.example'"
          say: Vor dem `@` steht nur ein Benutzername. Der Rechner kommt danach.
    hint:
      - "Von Hand: In `https://a.example:8080/b` steht der Name zwischen `://` und dem ersten `/`, und davon bleibt der Teil vor dem `:`."
      - "`url.split('://', 2)` teilt die Adresse beim ersten `://` in zwei Teile. Danach: am ersten `/` teilen, vom `@` den letzten Teil nehmen, am `:` den ersten."
      - "Ein Gerüst:\n```ruby\ndef host(url)\n  rest = url.include?('://') ? url.split('://', 2)[1] : url\n  name = rest.split('/', 2)[0]\n  # hier: alles bis zum @ weg, dann den Port weg\nend\n```"
    solution: |
      ```ruby
      def host(url)
        rest = url.include?('://') ? url.split('://', 2)[1] : url
        name = rest.split('/', 2)[0]
        name = name.split('@').last
        name.split(':')[0]
      end
      ```
    python:
      starter: |
        def host(url):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "host('https://schule-am-see.example/login')"
            expect: "'schule-am-see.example'"
          - call: "host('https://schule-am-see.example')"
            expect: "'schule-am-see.example'"
            say: Auch ohne Pfad gibt es einen Rechnernamen.
          - call: "host('schule-am-see.example/ag')"
            expect: "'schule-am-see.example'"
            say: Ohne `://` beginnt die Adresse gleich mit dem Rechnernamen, so wie im Text eines Links.
          - call: "host('https://schule-am-see.example:8080/ag')"
            expect: "'schule-am-see.example'"
            say: Der Port hinter dem `:` gehört nicht zum Namen.
          - call: "host('https://schule-am-see.example@konto-pruefung.example/login')"
            expect: "'konto-pruefung.example'"
            say: Vor dem `@` steht nur ein Benutzername. Der Rechner kommt danach.
      hint:
        - "Von Hand: In `https://a.example:8080/b` steht der Name zwischen `://` und dem ersten `/`, und davon bleibt der Teil vor dem `:`."
        - "`url.split('://', 1)` teilt die Adresse beim ersten `://` in zwei Teile. Danach: am ersten `/` teilen, vom `@` den letzten Teil nehmen (`[-1]`), am `:` den ersten."
        - "Ein Gerüst:\n```python\ndef host(url):\n    rest = url.split('://', 1)[1] if '://' in url else url\n    name = rest.split('/', 1)[0]\n    # hier: alles bis zum @ weg, dann den Port weg\n```"
      solution: |
        ```python
        def host(url):
            rest = url.split('://', 1)[1] if '://' in url else url
            name = rest.split('/', 1)[0]
            name = name.split('@')[-1]
            return name.split(':')[0]
        ```

  - id: real-domain
    title: Die Domain
    level: 1
    prompt: |
      Schreib `real_domain(url)`: die letzten beiden Teile des Rechnernamens.
      Kopiere deine Funktion `host` aus der Aufgabe darüber dazu.
    starter: |
      # hier deine Funktion host

      def real_domain(url)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "real_domain('https://schule-am-see.example/login')"
          expect: "'schule-am-see.example'"
        - call: "real_domain('https://www.schule-am-see.example/')"
          expect: "'schule-am-see.example'"
        - call: "real_domain('https://schule-am-see.example.konto-pruefung.example/login')"
          expect: "'konto-pruefung.example'"
          say: Die Domain steht am Ende des Rechnernamens. Alles davor kann sich ihr Besitzer ausdenken.
        - call: "real_domain('http://zustell-service.example.paket-track.example/de')"
          expect: "'paket-track.example'"
        - call: "real_domain('https://schule-am-see.example@konto-pruefung.example/')"
          expect: "'konto-pruefung.example'"
    feedback:
      - when: { same_as: "def host(url)\n  rest = url.include?('://') ? url.split('://', 2)[1] : url\n  name = rest.split('/', 2)[0]\n  name = name.split('@').last\n  name.split(':')[0]\nend\n\ndef real_domain(url)\n  host(url).split('.').first(2).join('.')\nend\n" }
        say: "Das sind die ersten beiden Teile, und genau auf die zählt ein Phishing-Link. Die Domain steht am Ende: `last(2)`."
    hint:
      - "`'a.b.c'.split('.')` gibt `['a', 'b', 'c']`, `join('.')` setzt eine Liste wieder mit Punkten zusammen."
      - "`last(2)` gibt die letzten beiden Elemente einer Liste."
    solution: |
      ```ruby
      def real_domain(url)
        host(url).split('.').last(2).join('.')
      end
      ```
    python:
      starter: |
        # hier deine Funktion host

        def real_domain(url):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "real_domain('https://schule-am-see.example/login')"
            expect: "'schule-am-see.example'"
          - call: "real_domain('https://www.schule-am-see.example/')"
            expect: "'schule-am-see.example'"
          - call: "real_domain('https://schule-am-see.example.konto-pruefung.example/login')"
            expect: "'konto-pruefung.example'"
            say: Die Domain steht am Ende des Rechnernamens. Alles davor kann sich ihr Besitzer ausdenken.
          - call: "real_domain('http://zustell-service.example.paket-track.example/de')"
            expect: "'paket-track.example'"
          - call: "real_domain('https://schule-am-see.example@konto-pruefung.example/')"
            expect: "'konto-pruefung.example'"
      feedback:
        - when: { same_as: "def host(url):\n    rest = url.split('://', 1)[1] if '://' in url else url\n    name = rest.split('/', 1)[0]\n    name = name.split('@')[-1]\n    return name.split(':')[0]\n\ndef real_domain(url):\n    return '.'.join(host(url).split('.')[:2])\n" }
          say: "Das sind die ersten beiden Teile, und genau auf die zählt ein Phishing-Link. Die Domain steht am Ende: `[-2:]`."
      hint:
        - "`'a.b.c'.split('.')` gibt `['a', 'b', 'c']`, `'.'.join(parts)` setzt eine Liste `parts` wieder mit Punkten zusammen."
        - "`parts[-2:]` gibt die letzten beiden Elemente einer Liste."
      solution: |
        ```python
        def real_domain(url):
