<h1>Zwergfledermaus</h1>
<p>Die Zwergfledermaus wiegt nur fünf Gramm. Sie fliegt nachts und fängt Insekten, an einem Abend mehrere hundert Mücken.</p>
<p>Im Dunkeln findet sie sich mit Ultraschall zurecht. Den Winter verschläft sie, wie der <a href="/igel.html">Igel</a>; nachts begegnet sie manchmal dem <a href="/eule.html">Waldkauz</a>.</p>
