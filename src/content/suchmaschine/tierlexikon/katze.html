<h1>Hauskatze</h1>
<p>Die Katze lebt seit fast zehntausend Jahren mit Menschen zusammen. Eine Katze schläft bis zu sechzehn Stunden am Tag.</p>
<p>Draußen jagt die Katze Mäuse und leider auch Vögel wie die <a href="/amsel.html">Amsel</a>. Mit dem <a href="/hund.html">Hund</a> versteht sich eine Katze gut, wenn beide zusammen aufwachsen.</p>
