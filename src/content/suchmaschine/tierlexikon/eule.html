<h1>Waldkauz</h1>
<p>Der Waldkauz ist die häufigste Eule in Deutschland. Er jagt nachts Mäuse und hört sie unter dem Laub rascheln.</p>
<p>Tagsüber schläft er in einer Baumhöhle. Kleine Vögel wie die <a href="/amsel.html">Amsel</a> schimpfen laut, wenn sie ihn dort finden. Auch die <a href="/fledermaus.html">Zwergfledermaus</a> ist nachts unterwegs.</p>
