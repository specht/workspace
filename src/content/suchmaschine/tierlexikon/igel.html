<h1>Igel</h1>
<p>Der Igel ist nachts unterwegs und frisst Käfer, Würmer und andere Insekten. Bei Gefahr rollt er sich zu einer Kugel aus Stacheln zusammen.</p>
<p>Von November bis März hält er Winterschlaf, wie die <a href="/fledermaus.html">Zwergfledermaus</a>. Im Garten freut er sich über einen Haufen Laub.</p>
