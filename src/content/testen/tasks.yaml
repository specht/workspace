format: 1
activity: testen
tasks:
  - id: erster-test
    title: Dein erster Test
    prompt: |
      Schreib in `notenrechner/test_noten.rb` den Test von oben, der prüft,
      dass 15 Punkte die Note `1+` sind, und lass ihn mit `ruby test_noten.rb`
      laufen. Die Prüfung führt deinen Test mit einem richtigen `noten.rb` aus
      und mit einem, das für jede Punktzahl die Note eines Punkts weniger
      liefert.
    file: notenrechner/test_noten.rb
    check:
      type: unit_tests
      language: ruby
      file: notenrechner/test_noten.rb
      correct: loesung/noten.rb
      mutants:
        - replace: ['GRADES[points]', 'GRADES[points - 1]']
          say: Dein Test besteht auch mit einem `noten.rb`, das für 15 Punkte `1` liefert. Prüft er mit `assert_equal`, dass `grade(15)` die Note `1+` ist?
    hint:
      - Die Datei beginnt mit zwei Zeilen `require`, dann kommt eine Klasse, die von `Minitest::Test` erbt, mit einer Methode, deren Name mit `test_` beginnt.
      - In der Methode steht eine Zeile `assert_equal '1+', grade(15)`, zuerst der erwartete Wert, dann der Aufruf.
    solution: |
      ```ruby
      require 'minitest/autorun'
      require_relative 'noten'

      class NotenTest < Minitest::Test
        def test_grade_at_the_top
          assert_equal '1+', grade(15)
        end
      end
      ```
    python:
      prompt: |
        Schreib in `notenrechner/test_noten.py` den Test von oben, der prüft,
        dass 15 Punkte die Note `1+` sind, und lass ihn mit `pytest` laufen.
        Die Prüfung führt deinen Test mit einem richtigen `noten.py` aus und
        mit einem, das für jede Punktzahl die Note eines Punkts weniger
        liefert.
      file: notenrechner/test_noten.py
      check:
        type: unit_tests
        language: python
        file: notenrechner/test_noten.py
        correct: loesung/noten.py
        mutants:
          - replace: ['GRADES[points]', 'GRADES[points - 1]']
            say: Dein Test besteht auch mit einem `noten.py`, das für 15 Punkte `1` liefert. Prüft er mit `assert`, dass `grade(15)` die Note `"1+"` ist?
      hint:
        - Die Datei holt sich `grade` mit `from noten import grade`, dann kommt eine Funktion, deren Name mit `test_` beginnt.
        - In der Funktion steht eine Zeile `assert grade(15) == "1+"`.
      solution: |
        ```python
        from noten import grade


        def test_grade_at_the_top():
            assert grade(15) == "1+"
        ```
    javascript:
      prompt: |
        Schreib in `notenrechner/test_noten.js` den Test von oben, der prüft,
        dass 15 Punkte die Note `1+` sind, und lass ihn mit
        `node --test test_noten.js` laufen. Die Prüfung führt deinen Test mit
        einem richtigen `noten.js` aus und mit einem, das für jede Punktzahl
        die Note eines Punkts weniger liefert.
      file: notenrechner/test_noten.js
      check:
        type: unit_tests
        language: javascript
        file: notenrechner/test_noten.js
        correct: loesung/noten.js
        mutants:
          - replace: ['GRADES[points]', 'GRADES[points - 1]']
            say: Dein Test besteht auch mit einem `noten.js`, das für 15 Punkte `1` liefert. Prüft er mit `assert.strictEqual`, dass `grade(15)` die Note `'1+'` ist?
      hint:
        - Die Datei holt sich `test`, `assert` und `grade` mit `require`, dann kommt ein Aufruf `test('…', () => { … })`.
        - In der Funktion steht eine Zeile `assert.strictEqual(grade(15), '1+');`, zuerst der Aufruf, dann der erwartete Wert.
      solution: |
        ```javascript
        const test = require('node:test');
        const assert = require('node:assert');
        const { grade } = require('./noten');

        test('grade at the top', () => {
          assert.strictEqual(grade(15), '1+');
        });
        ```

  - id: rot
    title: Ein Test, der scheitert
    prediction: true
    prompt: |
      Angenommen, du änderst in deinem Test die erwartete Note von `1+` zu `1`
      und lässt ihn noch einmal laufen. Was passiert?
    check:
      type: choice
      options:
        - Der Test besteht trotzdem, denn `grade` rechnet ja richtig.
        - Der Test scheitert und nennt die erwartete Note `1`, die tatsächliche `1+` und die Zeile im Test.
        - Das Testwerkzeug meldet einen Fehler in `noten`, in der Funktion `grade`.
        - Der Test läuft gar nicht erst los, weil die Datei einen Fehler hat.
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: Der Test vergleicht, was `grade(15)` liefert, mit dem, was du hineinschreibst. Stimmen die beiden noch überein?
      - when: { picked: 2 }
        say: Das Testwerkzeug weiß nicht, wer recht hat, `noten` oder der Test. Es sagt nur, dass beide nicht zusammenpassen, und wo.
      - when: { picked: 3 }
        say: '`1` ist so gültig wie `1+`: Die Datei lässt sich lesen, der Test läuft. Was kommt heraus?'
    solution: |
      Der Test scheitert. Das Testwerkzeug nennt beide Werte und die Zeile des
      Tests. Wer recht hat, entscheidet es nicht: Hier ist der Test falsch,
      nicht `grade`.

  - id: grenzen
    title: Die Grenzen von grade
    prompt: |
      `grade` nimmt 0 bis 15 Punkte an und meldet für alles andere einen
      Fehler. An welchen Punktzahlen liegen die Grenzen, an denen sich das
      Verhalten ändert, auf beiden Seiten?
    check:
      type: choice
      options: ['−1', '0', '1', '7', '14', '15', '16', '100']
      correct: [0, 1, 5, 6]
    feedback:
      - when: { picked: 3 }
        say: 7 liegt mitten in den Punkten, die es gibt. Was ändert sich dort?
      - when: { picked: 7 }
        say: 100 ist ein Fehler wie 16. Welche Punktzahl liegt gleich neben dem letzten gültigen Wert?
    hint: Wo endet das, was es gibt, und wo beginnt das, was es nicht gibt? Eine Grenze hat zwei Seiten.
    solution: |
      −1 und 0 an der unteren Grenze, 15 und 16 an der oberen: Auf jeder
      Seite liegt der letzte Wert der einen Klasse und der erste der anderen.

  - id: grade-tests
    title: Tests für grade
    prompt: |
      Schreib in `notenrechner/test_noten.rb` Tests für `grade`: an beiden
      Enden, für Punktzahlen dazwischen und gleich neben den Enden, wo es einen
      Fehler geben muss. Die Prüfung führt sie mit einem richtigen `noten.rb`
      aus, mit dem alle bestehen müssen, und mit fünf fehlerhaften, von denen
      jedes an mindestens einem Test scheitern muss.
    file: notenrechner/test_noten.rb
    check:
      type: unit_tests
      language: ruby
      file: notenrechner/test_noten.rb
      correct: loesung/noten.rb
      mutants:
        - replace: ['points.between?(0, 15)', 'points.between?(0, 16)']
          say: Eine Fassung, die 16 Punkte annimmt, besteht deine Tests. Prüf auch gleich über dem oberen Ende, dort muss es einen Fehler geben.
        - replace: ['points.between?(0, 15)', 'points.between?(1, 15)']
          say: Eine Fassung, die 0 Punkte nicht annimmt, besteht deine Tests. Auch 0 Punkte sind eine Note, die 6.
        - replace: ['points.between?(0, 15)', 'points.between?(-1, 15)']
          say: Eine Fassung, die −1 Punkte annimmt, besteht deine Tests. Prüf auch gleich unter dem unteren Ende.
        - replace: ["'4-', '4', '4+'", "'4', '4-', '4+'"]
          say: 'Eine Fassung, die bei 4 und 5 Punkten die Noten vertauscht, besteht deine Tests. Bei 5 Punkten liegt eine Grenze, die zählt: Darunter ist ein Kurs ein Defizit.'
        - replace: ['GRADES[points]', 'GRADES[points - 1]']
          say: Eine Fassung, die die Note für einen Punkt weniger liefert, besteht deine Tests. Prüf, welche Note herauskommt, nicht nur, ob es einen Fehler gibt.
    hint:
      - 'Drei Arten von Tests: die Enden (0 und 15), etwas dazwischen und das, was es nicht gibt. Schreib für jede Art eine Methode.'
      - Bei 5 Punkten liegt mitten im Bereich noch eine Grenze, die für die Oberstufe zählt. Welche Note gehört zu 5 Punkten?
      - Für die Punkte, die es nicht gibt, steht der Aufruf in einem Block hinter `assert_raises(ArgumentError)`, wie oben bei `'zwölf'`.
    solution: |
      ```ruby
      def test_grade_at_the_ends
        assert_equal '6', grade(0)
        assert_equal '1+', grade(15)
      end

      def test_grade_in_between
        assert_equal '1-', grade(13)
        assert_equal '4', grade(5)
      end

      def test_grade_outside
        assert_raises(ArgumentError) { grade(-1) }
        assert_raises(ArgumentError) { grade(16) }
      end
      ```
    python:
      prompt: |
        Schreib in `notenrechner/test_noten.py` Tests für `grade`: an beiden
        Enden, für Punktzahlen dazwischen und gleich neben den Enden, wo es
        einen Fehler geben muss. Die Prüfung führt sie mit einem richtigen
        `noten.py` aus, mit dem alle bestehen müssen, und mit fünf
        fehlerhaften, von denen jedes an mindestens einem Test scheitern muss.
      file: notenrechner/test_noten.py
      check:
        type: unit_tests
        language: python
        file: notenrechner/test_noten.py
        correct: loesung/noten.py
        mutants:
          - replace: ['0 <= points <= 15', '0 <= points <= 16']
            say: Eine Fassung, die 16 Punkte annimmt, besteht deine Tests. Prüf auch gleich über dem oberen Ende, dort muss es einen Fehler geben.
          - replace: ['0 <= points <= 15', '1 <= points <= 15']
            say: Eine Fassung, die 0 Punkte nicht annimmt, besteht deine Tests. Auch 0 Punkte sind eine Note, die 6.
          - replace: ['0 <= points <= 15', '-1 <= points <= 15']
            say: Eine Fassung, die −1 Punkte annimmt, besteht deine Tests. Prüf auch gleich unter dem unteren Ende.
          - replace: ['"4-", "4", "4+"', '"4", "4-", "4+"']
            say: 'Eine Fassung, die bei 4 und 5 Punkten die Noten vertauscht, besteht deine Tests. Bei 5 Punkten liegt eine Grenze, die zählt: Darunter ist ein Kurs ein Defizit.'
          - replace: ['GRADES[points]', 'GRADES[points - 1]']
            say: Eine Fassung, die die Note für einen Punkt weniger liefert, besteht deine Tests. Prüf, welche Note herauskommt, nicht nur, ob es einen Fehler gibt.
      hint:
        - 'Drei Arten von Tests: die Enden (0 und 15), etwas dazwischen und das, was es nicht gibt. Schreib für jede Art eine Funktion.'
        - Bei 5 Punkten liegt mitten im Bereich noch eine Grenze, die für die Oberstufe zählt. Welche Note gehört zu 5 Punkten?
        - Für die Punkte, die es nicht gibt, steht der Aufruf in einem Block `with pytest.raises(ValueError):`, wie oben bei `"zwölf"`.
      solution: |
        ```python
