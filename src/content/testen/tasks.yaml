          - replace: ['points < 0 ||', 'points < -1 ||']
            say: Eine Fassung, die −1 Punkte annimmt, besteht deine Tests. Prüf auch gleich unter dem unteren Ende.
          - replace: ["'4-', '4', '4+'", "'4', '4-', '4+'"]
            say: 'Eine Fassung, die bei 4 und 5 Punkten die Noten vertauscht, besteht deine Tests. Bei 5 Punkten liegt eine Grenze, die zählt: Darunter ist ein Kurs ein Defizit.'
          - replace: ['GRADES[points]', 'GRADES[points - 1]']
            say: Eine Fassung, die die Note für einen Punkt weniger liefert, besteht deine Tests. Prüf, welche Note herauskommt, nicht nur, ob es einen Fehler gibt.
      hint:
        - 'Drei Arten von Tests: die Enden (0 und 15), etwas dazwischen und das, was es nicht gibt. Schreib für jede Art einen Aufruf von `test`.'
        - Bei 5 Punkten liegt mitten im Bereich noch eine Grenze, die für die Oberstufe zählt. Welche Note gehört zu 5 Punkten?
        - Für die Punkte, die es nicht gibt, steht der Aufruf in einer Funktion in `assert.throws(() => …, RangeError)`, wie oben bei `'zwölf'`.
      solution: |
        ```javascript
