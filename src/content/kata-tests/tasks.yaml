  - id: test-leap-year
    title: "Tests für Schaltjahre"
    level: 2
    prompt: |
      `leap_year(year)` soll sagen, ob ein Jahr ein Schaltjahr ist: Durch 4 teilbare Jahre sind es, außer die durch 100 teilbaren, außer wieder die durch 400 teilbaren. 2024 ist eins, 1900 nicht, 2000 schon. Schreib Tests, die jede der drei falschen Fassungen entlarven.
    starter: |
      # Ein Test je Zeile: assert_equal(erwartet, ergebnis)
      assert_equal(false, leap_year(2023))
    check:
      type: tests
      language: ruby
      function: leap_year
      correct: |
        def leap_year(year)
