  - id: test-max
    title: "Tests für die größere Zahl"
    level: 1
    prompt: |
      `max_of_two(a, b)` soll die größere der beiden Zahlen zurückgeben. Schreib Tests, die jede falsche Fassung entlarven; die Prüfung hat drei. Denk daran, in welcher Reihenfolge die Zahlen kommen können.
    starter: |
      # Ein Test je Zeile: assert_equal(erwartet, ergebnis)
      assert_equal(7, max_of_two(3, 7))
    check:
      type: tests
      language: ruby
      function: max_of_two
      correct: |
        def max_of_two(a, b)
          a > b ? a : b
        end
      mutants:
        - code: |
            def max_of_two(a, b)
              a
            end
          say: "Eine Fassung, die immer die erste Zahl zurückgibt, besteht deine Tests. Wo steht die größere in deinen Tests?"
        - code: |
            def max_of_two(a, b)
              a < b ? a : b
            end
          say: "Eine Fassung, die die kleinere zurückgibt, besteht deine Tests."
        - code: |
            def max_of_two(a, b)
              b
            end
          say: "Eine Fassung, die immer die zweite Zahl zurückgibt, besteht deine Tests. Steht die größere auch einmal vorn?"
    hint: "Eine Fassung gibt immer die erste Zahl zurück, eine immer die zweite. Wie viele Tests brauchst du, um beide zu erwischen?"
    solution: |
      ```ruby
      assert_equal(7, max_of_two(3, 7))
      assert_equal(9, max_of_two(9, 2))
      ```
    python:
      prompt: |
