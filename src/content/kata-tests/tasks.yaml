        `String caesar(String text, int shift)` soll verschlüsseln wie in den Texten: Klein- und Großbuchstaben rücken um `shift` weiter, nach `z` geht es bei `a` weiter, auch rückwärts, und alles andere bleibt. Schreib Tests, die jede der vier falschen Fassungen entlarven.
      starter: |
        // Ein Test je Zeile: assertEqual(erwartet, ergebnis);
        assertEqual("def", caesar("abc", 3));
      check:
        type: tests
        language: java
        function: caesar
        correct: |
          String caesar(String text, int shift) {
              String out = "";
              for (char c : text.toCharArray()) {
                  if (c >= 'a' && c <= 'z') out += (char) (((c - 'a' + shift) % 26 + 26) % 26 + 'a');
                  else if (c >= 'A' && c <= 'Z') out += (char) (((c - 'A' + shift) % 26 + 26) % 26 + 'A');
                  else out += c;
              }
              return out;
          }
