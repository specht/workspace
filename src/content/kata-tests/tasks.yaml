  - id: test-even
    title: "Tests für gerade Zahlen"
    level: 1
    prompt: |
      `even(n)` soll true zurückgeben, wenn `n` gerade ist, und sonst false. Schreib Tests, die jede falsche Fassung entlarven: Die Prüfung hat eine richtige und drei, die sich in verschiedenen Fällen irren. Ein Test ist eine Zeile `assert_equal(erwartet, ergebnis)`; der erste steht schon da. Denk an die 0 und an negative Zahlen.
    starter: |
      # Ein Test je Zeile: assert_equal(erwartet, ergebnis)
      assert_equal(true, even(4))
    check:
      type: tests
      language: ruby
      function: even
      correct: |
        def even(n)
          n % 2 == 0
        end
      mutants:
        - code: |
            def even(n)
              n % 2 == 1
            end
          say: "Eine Fassung, die »gerade« und »ungerade« vertauscht, besteht deine Tests. Prüf auch eine ungerade Zahl."
        - code: |
            def even(n)
              n > 0 && n % 2 == 0
            end
          say: "Eine Fassung, die bei 0 und bei negativen Zahlen immer `false` sagt, besteht deine Tests. Ist 0 gerade? Und -4?"
        - code: |
            def even(n)
              n == 2 || n == 4 || n == 6 || n == 8
            end
          say: "Eine Fassung, die nur 2, 4, 6 und 8 kennt, besteht deine Tests. Nimm auch eine größere gerade Zahl."
    hint:
      - "Was macht jede der falschen Fassungen anders? Sie irren sich bei ungeraden Zahlen, bei 0 und negativen Zahlen, oder bei großen Zahlen."
      - "Für jede Art von Zahl ein Test: eine ungerade, die 0, eine negative gerade, eine große gerade."
    solution: |
      ```ruby
      assert_equal(true, even(4))
      assert_equal(false, even(7))
      assert_equal(true, even(0))
      assert_equal(true, even(-4))
      assert_equal(true, even(100))
      ```
    python:
      prompt: |
        `even(n)` soll True zurückgeben, wenn `n` gerade ist, und sonst False. Schreib Tests, die jede falsche Fassung entlarven: Die Prüfung hat eine richtige und drei, die sich in verschiedenen Fällen irren. Ein Test ist eine Zeile `assert_equal(erwartet, ergebnis)`; der erste steht schon da. Denk an die 0 und an negative Zahlen.
      starter: |
        # Ein Test je Zeile: assert_equal(erwartet, ergebnis)
        assert_equal(True, even(4))
      check:
        type: tests
        language: python
        function: even
        correct: |
          def even(n):
              return n % 2 == 0
        mutants:
          - code: |
              def even(n):
                  return n % 2 == 1
            say: "Eine Fassung, die »gerade« und »ungerade« vertauscht, besteht deine Tests. Prüf auch eine ungerade Zahl."
          - code: |
              def even(n):
                  return n > 0 and n % 2 == 0
            say: "Eine Fassung, die bei 0 und bei negativen Zahlen immer `False` sagt, besteht deine Tests. Ist 0 gerade? Und -4?"
          - code: |
              def even(n):
                  return n in (2, 4, 6, 8)
            say: "Eine Fassung, die nur 2, 4, 6 und 8 kennt, besteht deine Tests. Nimm auch eine größere gerade Zahl."
      hint:
        - "Was macht jede der falschen Fassungen anders? Sie irren sich bei ungeraden Zahlen, bei 0 und negativen Zahlen, oder bei großen Zahlen."
        - "Für jede Art von Zahl ein Test: eine ungerade, die 0, eine negative gerade, eine große gerade."
      solution: |
        ```python
        assert_equal(True, even(4))
        assert_equal(False, even(7))
        assert_equal(True, even(0))
        assert_equal(True, even(-4))
        assert_equal(True, even(100))
        ```
    javascript:
      prompt: |
        `even(n)` soll true zurückgeben, wenn `n` gerade ist, und sonst false. Schreib Tests, die jede falsche Fassung entlarven: Die Prüfung hat eine richtige und drei, die sich in verschiedenen Fällen irren. Ein Test ist eine Zeile `assertEqual(erwartet, ergebnis)`; der erste steht schon da. Denk an die 0 und an negative Zahlen.
      starter: |
        // Ein Test je Zeile: assertEqual(erwartet, ergebnis);
