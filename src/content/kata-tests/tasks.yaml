  - id: test-absolute
    title: "Tests für den Betrag"
    level: 1
    prompt: |
      `absolute(n)` soll den Betrag von `n` zurückgeben: die Zahl ohne ihr Minus, `absolute(-5)` ergibt `5`. Schreib Tests, die jede der drei falschen Fassungen entlarven.
    starter: |
      # Ein Test je Zeile: assert_equal(erwartet, ergebnis)
      assert_equal(5, absolute(-5))
    check:
      type: tests
      language: ruby
      function: absolute
      correct: |
        def absolute(n)
          n < 0 ? -n : n
        end
      mutants:
        - code: |
            def absolute(n)
              n
            end
          say: "Eine Fassung, die jede Zahl so lässt, wie sie ist, besteht deine Tests. Prüf eine negative Zahl."
        - code: |
            def absolute(n)
              -n
            end
          say: "Eine Fassung, die jede Zahl umdreht, besteht deine Tests. Prüf auch eine positive Zahl."
        - code: |
            def absolute(n)
              n < 0 ? -n : 1
            end
          say: "Eine Fassung, die bei positiven Zahlen immer 1 zurückgibt, besteht deine Tests. Nimm eine positive Zahl, die nicht 1 ist."
    hint: "Welche Arten von Zahlen gibt es für den Betrag? Negative, positive und die 0."
    solution: |
      ```ruby
      assert_equal(5, absolute(-5))
      assert_equal(8, absolute(8))
      ```
