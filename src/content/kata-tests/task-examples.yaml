        - answer: "assertEqual(List.of(1, 2, 3, 4), mergeSorted(List.of(1, 4), List.of(2, 3)));\nassertEqual(List.of(1, 2, 2, 3, 9), mergeSorted(List.of(2, 9), List.of(1, 2, 3)));\n"
