# Aufgaben zu »TCP/IP-Verbindungen«.
# Format: docs/aufgaben.md. Alle Aufgaben stehen in tcpip.md, außer codewort:
# dafür fehlt noch der Bot, der das Codewort nennt.
format: 1
activity: tcpip
tasks:
  - id: adresse
    title: Deine Adresse
    prompt: |
      Wie lautet die IPv4-Adresse deines Adapters `eth0`? Im Bild oben steht
      eine andere als bei dir.
    check:
      type: answer
      expect: ${workspace.ip}
      placeholder: z. B. 172.17.0.42
    hint: Suche unter `eth0` die Zeile, die mit `inet` beginnt.
    feedback:
      - when: { matches: '^127\.' }
        say: Das ist die Adresse von `lo`. Gesucht ist die von `eth0`.

  - id: loopback
    title: Abkürzung zu dir selbst
    prompt: Wohin geht ein Paket, das du an `127.0.0.1` schickst?
    check:
      type: choice
      options:
        - Zum Router der Schule
        - Zu einem Server von Google
        - Es verlässt den Rechner nicht
        - Zum Workspace der Person neben dir
      correct: 2
    feedback:
      - when: { picked: 0 }
        say: 'Ein Paket an `127.0.0.1` sieht kein Router. Es bleibt im eigenen Rechner.'
      - when: { picked: 3 }
        say: 'Dafür bräuchtest du die Adresse ihres Workspace. `127.0.0.1` ist immer der eigene Rechner.'
    solution: |
      `127.0.0.1` heißt Loopback: Der Rechner meint sich selbst. Das Paket geht
      nie auf ein Kabel; darum antwortet `ping 127.0.0.1` in Bruchteilen einer
      Millisekunde, auch ohne Netz.

  - id: entfernungen
    title: Drei Entfernungen
    prompt: |
      Miss die Roundtrip-Zeit zu `127.0.0.1`, zu `8.8.8.8` und zu
      `rubiomonocoat.pe`, einem Server mit peruanischer Domain. Trage jeweils
      einen typischen Wert in Millisekunden ein.
    check:
      type: measure
      unit: ms
      tolerance_percent: 50
      fields:
        - { label: 127.0.0.1, run: ping -c 3 -q 127.0.0.1, extract: ping_rtt_avg }
        - { label: 8.8.8.8, run: ping -c 3 -q 8.8.8.8, extract: ping_rtt_avg }
        - { label: rubiomonocoat.pe, run: ping -c 3 -q rubiomonocoat.pe, extract: ping_rtt_avg }

  - id: lichtgeschwindigkeit
    title: Mindestens wie lange?
    prompt: |
      Licht ist in einer Glasfaser etwa 200 000 km pro Sekunde schnell. Berlin
      und Lima liegen rund 11 100 km auseinander. Wie viele Millisekunden
      dauert ein Hin und Zurück mindestens?
    check:
      type: number
      expect: 111
      tolerance: 6
      unit: ms
    feedback:
      - when: { between: [50, 61] }
        say: Das ist nur eine Richtung. Ein Roundtrip geht hin und zurück.
      - when: { between: [0, 1] }
        say: Das sind Sekunden. Gefragt sind Millisekunden.
    solution: 2 × 11 100 km ÷ 200 000 km/s = 0,111 s, also etwa 111 ms.

  - id: standort
    title: Wo steht der Server wirklich?
    prompt: |
      Deine Messung war viel schneller als das Licht. Lies in deiner
      `ping`-Ausgabe genau nach, wer dir antwortet. In welchem Land steht der
      Server vermutlich?
    check:
      type: measure
      compare: text
      fields:
        - { label: Land, run: ping -c 1 -W 2 rubiomonocoat.pe, extract: ping_reply_country }
    hint: Schau in die Zeilen, die mit »64 bytes from« beginnen. Endet der Name nicht auf ein Länderkürzel, such nach der Firma, der er gehört.
    solution: |
      Es antwortet ein Rechner von `combell-ops.net`: Combell ist ein
      belgischer Hoster. Die Endung `.pe` sagt nur, wo die Adresse registriert
      ist, nicht, wo der Server steht.

  - id: ttl-drei
    title: Ein Paket mit TTL 3
    prompt: Ein Paket startet mit TTL 3, und das Ziel ist weit weg. Was passiert?
    prediction: true
    check:
      type: choice
      options:
        - Es wird nach drei Sekunden verworfen.
        - Der dritte Router verwirft es und meldet sich beim Absender.
        - Es wird höchstens dreimal neu gesendet.
        - Jeder der drei ersten Router schickt eine Kopie zurück.
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: TTL hat nichts mit Zeit zu tun, sondern mit Routern.
    solution: |
      Jeder Router zieht von der TTL eins ab. Beim dritten wird sie 0, und er
      verwirft das Paket und schickt dem Absender eine Nachricht »Time Exceeded«
      mit seiner Adresse. Genau damit findet `traceroute` die Router auf dem Weg:
      mit TTL 1, 2, 3 und so weiter.

  - id: router-zaehlen
    title: Router zählen, ohne traceroute
    prompt: |
      Auch `ping` zeigt eine TTL: die der Antwort, wenn sie bei dir ankommt.
      Linux-Server schicken ihre Antworten meist mit TTL 64 los. Wie viele
      Router lagen zwischen dir und dem Server von `rubiomonocoat.pe`? Prüfe
      deine Vermutung danach mit `traceroute`.
    check:
      type: measure
      tolerance: 1
      fields:
        - { label: Router, run: ping -c 3 rubiomonocoat.pe, extract: ping_hops }

  - id: traceroute-erklaeren
    title: In eigenen Worten
    prompt: Erkläre in zwei oder drei Sätzen, wie `traceroute` die Router auf dem Weg herausfindet.
    check:
      type: reflection
      min_words: 20
    examples:
      - |
        `traceroute` schickt zuerst ein Paket mit TTL 1. Der erste Router zieht
        eins ab, kommt auf null, verwirft das Paket und schickt eine
        Fehlermeldung zurück; aus ihrer Absenderadresse kennt `traceroute` den
        ersten Router. Dann kommt ein Paket mit TTL 2, das beim zweiten Router
        hängen bleibt, und so weiter, bis ein Paket das Ziel erreicht.
      - |
        Jeder Router verringert die TTL eines Pakets um eins und wirft es bei
        null weg, mit einer Meldung an den Absender. `traceroute` erhöht die TTL
        von Paket zu Paket um eins, so meldet sich jeder Router auf dem Weg der
        Reihe nach. Ein Stern heißt, dass ein Router sich nicht gemeldet hat.

  - id: mac-adresse
    title: Deine MAC-Adresse
    prompt: |
      Wie lautet die MAC-Adresse deines Adapters `eth0`? Im Bild oben steht
      eine andere als bei dir.
    check:
      type: answer
      expect: ${workspace.mac}
      placeholder: z. B. 02:42:ac:11:00:2a
    hint:
      - '`ip link` zeigt zwei Adapter. Welcher davon verbindet deinen Workspace mit dem Netz?'
      - Unter `eth0` steht eine Zeile, die mit `link/ether` beginnt. Gesucht ist die erste Adresse darin, nicht die hinter `brd`.
    feedback:
      - when: { matches: '^\d{1,3}(\.\d{1,3}){3}(/\d+)?$' }
        say: Das ist eine IP-Adresse. Gesucht ist die MAC-Adresse hinter `link/ether`.
      - when: { matches: '(?i)^ff(:ff){5}$' }
        say: Das ist die Broadcast-Adresse hinter `brd`, die für alle gilt. Gesucht ist die Adresse davor.
      - when: { matches: '^00(:00){5}$' }
        say: Das ist die Adresse von `lo`. Gesucht ist die von `eth0`.
      - when: { matches: '(?i)^[0-9a-f]{2}(-[0-9a-f]{2}){5}$' }
        say: Schreib die Bytes mit Doppelpunkten dazwischen, so wie `ip link` sie zeigt.
    solution: |
      Die Adresse hinter `link/ether` bei `eth0`. Docker hat sie sich beim
      Start des Workspace ausgedacht; die zweite Ziffer (2, 6, A oder E)
      zeigt, dass sie nicht von einem Hersteller stammt.

  - id: arp-wie
    title: Wer kennt die MAC-Adresse?
    prediction: true
    prompt: |
      Dein Workspace will einem anderen Workspace in seinem Netz ein Paket
      schicken. Er kennt dessen IP-Adresse, aber nicht die MAC-Adresse, die
      in den Frame gehört. Wie findet er sie heraus?
    check:
      type: choice
      options:
        - Er fragt alle im Netz, und der Rechner mit dieser IP-Adresse antwortet.
        - Er fragt einen DNS-Server, wie bei einem Namen.
        - Er schickt den Frame an den Router, der die MAC-Adressen aller Rechner kennt.
        - Er sieht in einer Liste nach, die alle Rechner beim Start bekommen.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: DNS übersetzt Namen in IP-Adressen. Die IP-Adresse kennt dein Workspace hier schon; gesucht ist die Adresse eine Schicht tiefer.
      - when: { picked: 2 }
        say: Der Router ist für Ziele außerhalb des eigenen Netzes da. Woher sollte er die MAC-Adressen aller Rechner kennen?
    solution: |
      Mit ARP: Ein Frame an die Broadcast-Adresse `ff:ff:ff:ff:ff:ff` fragt
      alle »Wer hat diese IP-Adresse?«, und nur der Gemeinte antwortet mit
      seiner MAC-Adresse.

  - id: neigh-vorher
    title: Bevor ihr euch etwas schickt
    prediction: true
    prompt: |
      Ihr habt euch noch nichts geschickt. Was zeigt `ip neigh` bei dir für
      die IP-Adresse der anderen Person?
    check:
      type: choice
      options:
        - Nichts, für diese Adresse gibt es keine Zeile.
        - Eine Zeile mit ihrer MAC-Adresse, weil ihr im selben Netz seid.
        - Eine Zeile mit `FAILED`, weil noch kein Paket hinübergegangen ist.
        - Eine Zeile für jeden Workspace der Klasse, auch für ihren.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Woher sollte dein Workspace ihre MAC-Adresse kennen, wenn er nie nach ihr gefragt hat?
    solution: |
      Die Tabelle füllt sich erst, wenn dein Workspace mit ARP nach einer
      Adresse fragt oder selbst gefragt wird. Vorher steht die andere Person
      nicht darin.

  - id: neigh-gegenseite
    title: Wer kennt jetzt wen?
    prediction: true
    prompt: |
      A hat B angepingt. B hat nur geantwortet und selbst nie nach A gefragt.
      Steht A jetzt in der Ausgabe von `ip neigh` bei B?
    check:
      type: choice
      options:
        - Ja, mit der MAC-Adresse von A.
        - Nein, B hat ja nicht gefragt.
        - Nur die IP-Adresse von A, ohne MAC-Adresse.
        - Erst, wenn B selbst A anpingt.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Um zu antworten, braucht B die MAC-Adresse von A. Woher könnte B sie haben, ohne zu fragen?
      - when: { picked: 3 }
        say: Die Antworten auf das `ping` von A sind schon Pakete von B an A. Was braucht B dafür?
    solution: |
      Ja. Die ARP-Frage von A enthielt die IP-Adresse und die MAC-Adresse
      von A, und B hat sich beide gemerkt, um antworten zu können.

  - id: neigh-google
    title: Und 8.8.8.8?
    prediction: true
    prompt: |
      Vorhin hast du `8.8.8.8` angepingt, und Google hat geantwortet. Was
      steht in `ip neigh` für `8.8.8.8`?
    check:
      type: choice
      options:
        - Nichts, für `8.8.8.8` gibt es keine Zeile.
        - Eine Zeile mit der MAC-Adresse von Googles Server.
        - Eine Zeile mit `FAILED`, weil Google zu weit weg ist.
        - Eine Zeile mit der MAC-Adresse von Googles Server, aber erst nach einigen Sekunden.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Eine MAC-Adresse gilt nur im eigenen Netz. Steht Googles Server in deinem Netz?
      - when: { picked: 3 }
        say: Eine MAC-Adresse gilt nur im eigenen Netz. Steht Googles Server in deinem Netz?
      - when: { picked: 2 }
        say: Ein `FAILED` stünde da, wenn dein Workspace gefragt und keine Antwort bekommen hätte. Hat er nach `8.8.8.8` überhaupt gefragt?
    solution: |
      `8.8.8.8` liegt nicht im eigenen Netz. Dein Workspace schickt den Frame
      an den Router (`default via` in `ip route`), und nur dessen MAC-Adresse
      steht in `ip neigh`.

  - id: switch-leer
    title: Ein Switch ohne Tabelle
    prediction: true
    prompt: |
      Ein Switch wurde gerade eingeschaltet, seine Tabelle ist leer. A
      schickt einen Frame an B. Was macht der Switch mit dem Frame?
    check:
      type: choice
      options:
        - Er schickt ihn an alle Ports außer dem, von dem er kam.
        - Er wirft ihn weg, weil er B noch nicht kennt.
        - Er schickt ihn an A zurück, damit A es später noch einmal versucht.
        - Er fragt mit ARP nach, an welchem Port B hängt.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Dann käme in einem frisch eingeschalteten Netz nie etwas an. Wie kann der Switch sicher sein, dass B den Frame bekommt?
      - when: { picked: 3 }
        say: ARP fragt nach der MAC-Adresse zu einer IP-Adresse. Die MAC-Adresse von B steht schon im Frame; der Switch sucht den Port.
    solution: |
      Was er nicht kennt, schickt er an alle anderen Ports; wer nicht gemeint
      ist, wirft den Frame weg. Dabei merkt er sich, an welchem Port A hängt,
      denn die Absender-MAC steht im Frame.

  - id: router-tauscht
    title: Beim zweiten Router
    prompt: |
      Ein Paket von deinem Workspace an `8.8.8.8` kommt beim zweiten Router
      auf dem Weg an. Was steht in diesem Moment als Ziel im Frame, und was
      als Ziel im IP-Paket?
    check:
      type: choice
      options:
        - 'Frame: die MAC-Adresse des zweiten Routers. IP-Paket: 8.8.8.8'
        - 'Frame: die MAC-Adresse von Googles Server. IP-Paket: 8.8.8.8'
        - 'Frame: die MAC-Adresse des zweiten Routers. IP-Paket: die IP-Adresse des zweiten Routers'
        - 'Frame: die MAC-Adresse deines Workspace. IP-Paket: 8.8.8.8'
      correct: 0
    hint:
      - Denk an das Paket mit der Anschrift und dem Zettel für die nächste Etappe. Was davon bleibt, was kommt in jedem Lager neu?
      - Die Ziel-MAC eines Frames gehört immer zu einem Gerät im selben Netz wie sein Absender. Wer hat den Frame zum zweiten Router geschickt, und an wen?
    feedback:
      - when: { picked: 1 }
        say: Die MAC-Adresse von Googles Server kennt nur, wer mit ihm im selben Netz ist. Wer ist das hier?
      - when: { picked: 2 }
        say: Stünde der Router als Ziel im IP-Paket, wäre das Paket bei ihm am Ziel und käme nie bei Google an.
      - when: { picked: 3 }
        say: Die MAC-Adresse deines Workspace stand als Absender im ersten Frame, bis zum ersten Router. Danach gibt es einen neuen Frame.
    solution: |
      Der erste Router hat das Paket in einen neuen Frame gepackt: als
      Absender seine eigene MAC-Adresse, als Ziel die des zweiten Routers.
      Im IP-Paket steht weiter `8.8.8.8`; nur die TTL ist eins kleiner.

  - id: schichten
    title: Wer schickt noch einmal?
    prompt: |
      Ein Paket mit einem Stück einer Webseite geht unterwegs verloren. Welche
      Schicht merkt das und schickt es noch einmal?
    check:
      type: choice
      options:
        - TCP, die Transportschicht
        - IP, die Internetschicht
        - HTTP, die Anwendungsschicht
        - Ethernet, der Netzzugang
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: IP bringt Pakete zum Ziel, aber ohne Garantie. Wer nummeriert die Bytes und wartet auf eine Bestätigung?
      - when: { picked: 2 }
        say: HTTP bekommt davon nichts mit. Es sieht nur die Daten, vollständig und in der richtigen Reihenfolge.
    solution: TCP nummeriert jedes Byte und wartet auf Bestätigungen. Was nicht bestätigt wird, schickt es noch einmal; HTTP darüber merkt davon nichts.

  - id: port
    title: Zwei Programme, eine Adresse
    prediction: true
    prompt: |
      Auf einem Server laufen ein Webserver und ein SSH-Server. Woran erkennt
      der Rechner, für welches der beiden Programme ein ankommendes Paket ist?
    check:
      type: choice
      options:
        - Am Port, an den das Paket geht
        - An der IP-Adresse des Servers
        - An der MAC-Adresse
        - Am Inhalt des Pakets
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Beide Programme laufen auf demselben Rechner, mit derselben IP-Adresse.
    solution: Die IP-Adresse bringt das Paket zum Rechner, der Port zum Programm. Der Webserver wartet an Port 80 oder 443, der SSH-Server an Port 22.

  - id: handshake
    title: Wie lange dauert der Handshake?
    prediction: true
    prompt: |
      Ein `ping` nach `www.anu.edu.au` braucht etwa 0,34 Sekunden. Wie lange
      dauert es, bis `curl` eine TCP-Verbindung dorthin aufgebaut hat?
    check:
      type: choice
      options:
        - Etwa 0,34 Sekunden, so lange wie ein Ping
        - 'Etwa 0,17 Sekunden, ein Weg zum Server'
        - 'Etwa 1 Sekunde, ein Weg für jedes der drei Pakete'
        - 'Weniger als 1 Millisekunde, wie bei 127.0.0.1'
      correct: 0
    feedback:
      - when: { picked: 2 }
        say: Für den Client steht die Verbindung, sobald SYN-ACK zurück ist. Das ACK schickt er los und gleich danach die Daten, ohne zu warten.
      - when: { picked: 1 }
        say: Der Client weiß erst, dass der Server da ist, wenn dessen Antwort zurück ist.
    solution: SYN hin, SYN-ACK zurück, das ist ein Hin und Zurück wie bei `ping`. Das ACK schickt der Client los und gleich dahinter die ersten Daten, ohne auf eine Antwort zu warten.

  - id: erste-webseite
    title: Die erste Webseite
    prompt: |
      Hol `/hypertext/WWW/TheProject.html` von `info.cern.ch` mit `GET`. Was
      steht zwischen `<TITLE>` und `</TITLE>`?
    check:
      type: answer
      expect: The World Wide Web project
    hint: Dieselben Zeilen wie mit `HEAD`, nur mit `GET`, und am Ende eine leere Zeile.
    solution: '»The World Wide Web project«. Die Seite ist vom Dezember 1992; Tim Berners-Lee hat das Web 1989 am CERN erfunden.'

  - id: leere-zeile
    title: Ohne leere Zeile
    prediction: true
    prompt: |
      Du tippst die Request-Line und `Host:`, aber keine leere Zeile danach.
      Was passiert?
    check:
      type: choice
      options:
        - Nichts, der Server wartet auf weitere Header
        - Der Server antwortet mit 400 Bad Request
        - Der Server antwortet ganz normal
        - Die Verbindung bricht sofort ab
      correct: 0
    feedback:
      - when: { picked: 2 }
        say: Woher soll der Server wissen, dass nach `Host:` kein weiterer Header mehr kommt?
    solution: Die leere Zeile sagt »Ende der Header«. Ohne sie wartet der Server, bis du weitertippst oder er nach einer Weile aufgibt.

  - id: spiel-2048
    title: Ein Spiel aus dem Netz
    prompt: |
      Lade 2048 herunter und übersetze es. Die Aufgabe ist gelöst, sobald in
      deinem Workspace ein ausführbares Programm `2048` liegt.
    file: '2048'
    check:
      type: files
      path: '2048'
      expect:
        exists: true
        executable: true
        format: elf
    hint: Hast du `gcc` mit `-o 2048` aufgerufen?

  - id: webserver
    title: Welcher Server?
    prompt: Welche Software nennt der Webserver von `gymnasiumsteglitz.de` im Header `Server`?
    check:
      type: measure
      compare: text
      fields:
        - { label: Server, run: curl -sI https://gymnasiumsteglitz.de, extract: 'http_header:Server' }

  - id: katzenfakt
    title: Nur der Fakt
    prompt: |
      Schreibe einen Befehl, der nur den Text des Fakts ausgibt: ohne Klammern,
      ohne `length` und ohne Anführungszeichen.
    check:
      type: command
      timeout: 10
      output:
        lines: 1
        not_matching: '^[{"\[]'
    feedback:
      - when: { output_matches: '^"' }
        say: Fast. Die Ausgabe steht noch in Anführungszeichen. `jq --help` zeigt dir, was die Option `-r` bewirkt.
      - when: { output_matches: '^\{' }
        say: Die Ausgabe ist noch JSON. Wähle mit jq nur das Feld fact aus.
    solution: '`curl -s https://catfact.ninja/fact | jq -r .fact`'

  - id: zu-langsam
    title: Wer zu langsam tippt
    prediction: true
    prompt: |
      Du bist mit `www.wikipedia.org` verbunden und überlegst noch, was du
      schreiben sollst. Was passiert?
    check:
      type: choice
      options:
        - Nach ein paar Sekunden schließt der Server die Verbindung.
        - Der Server wartet, bis du die erste Zeile geschickt hast, egal wie lange.
        - Der Server schickt von sich aus die Startseite von Wikipedia.
        - Die Verbindung bleibt offen, bis du den Browser schließt.
      correct: 0
    feedback:
      - when: { picked: 2 }
        say: Bei HTTP fängt immer der Browser an. Ohne Anfrage weiß der Server nicht, welche Seite du willst.
    solution: Nach etwa drei Sekunden ohne Anfrage meldet die Konsole, dass der Server die Verbindung geschlossen hat.

  - id: codewort
    title: Codewort vom Bot
    prompt: |
      Verbinde dich mit `netcat hackbot 1234`. Der Bot nennt dir ein Codewort.
      Es ist für jede Person anders.
    check:
      type: answer
      expect: ${person.codeword}
      case_sensitive: false
