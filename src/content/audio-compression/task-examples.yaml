# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
# Angenommen wird der Code der Seite aus stufen/, abgelehnt das Gerüst der
# Seite und in fehler/ je ein typischer Fehler.
format: 1
activity: audio-compression
examples:
  wav-header:
    pass:
      - { files: { audio/wav.py: stufen/wav.py } }
    fail:
      - files: { audio/wav.py: { text: "import struct\n\n\ndef wav_header(n, rate):\n    size = 2 * n\n    riff = struct.pack('<4sI4s', b'RIFF', 36 + size, b'WAVE')\n    # hier: fmt und data\n    return riff + fmt + data\n" } }
        say: fmt
      - { files: { audio/wav.py: fehler/wav-big-endian.py }, say: Little Endian }
      - { files: { audio/wav.py: fehler/wav-groesse-messungen.py }, say: 'Bytes der Messungen' }
      - { files: { audio/wav.py: fehler/wav-byte-rate-fest.py }, say: Byte Rate }
  ton:
    pass:
      - { files: { audio/tones.py: stufen/tones-1.py, audio/wav.py: stufen/wav.py } }
      - { files: { audio/tones.py: stufen/tones-3.py, audio/wav.py: stufen/wav.py } }
    fail:
      - { files: { audio/tones.py: fehler/tone-ohne-rate.py, audio/wav.py: stufen/wav.py }, say: '`rate`' }
      - { files: { audio/tones.py: fehler/tone-zu-laut.py, audio/wav.py: stufen/wav.py }, say: '0,5' }
  unmulaw:
    pass:
      - { files: { audio/mulaw.py: stufen/mulaw.py, audio/wav.py: stufen/wav.py } }
    fail:
      - { files: { audio/mulaw.py: fehler/unmulaw-ohne-vorzeichen.py, audio/wav.py: stufen/wav.py }, say: 'np.sign(y)' }
      - { files: { audio/mulaw.py: fehler/unmulaw-exp.py, audio/wav.py: stufen/wav.py }, say: '1 + MU' }
  residual:
    pass:
      - { files: { audio/predict.py: stufen/predict.py, audio/wav.py: stufen/wav.py } }
    fail:
      - { files: { audio/predict.py: fehler/residual-in-place.py, audio/wav.py: stufen/wav.py }, say: 'x.copy()' }
      - { files: { audio/predict.py: fehler/residual-ohne-anfang.py, audio/wav.py: stufen/wav.py }, say: 'ersten beiden' }
      - { files: { audio/predict.py: fehler/residual-differenz.py, audio/wav.py: stufen/wav.py }, say: 'Geraden' }
  rice:
    pass:
      - { files: { audio/rice.py: stufen/rice-1.py, audio/predict.py: stufen/predict.py, audio/wav.py: stufen/wav.py } }
      - { files: { audio/rice.py: stufen/rice-2.py, audio/predict.py: stufen/predict.py, audio/wav.py: stufen/wav.py } }
    fail:
      - { files: { audio/rice.py: fehler/rice-ohne-fuehrende-nullen.py, audio/predict.py: stufen/predict.py, audio/wav.py: stufen/wav.py }, say: 'beiden Stellen' }
      - { files: { audio/rice.py: fehler/rice-einsen-vorn.py, audio/predict.py: stufen/predict.py, audio/wav.py: stufen/wav.py }, say: 'keine Nullen vorn' }
