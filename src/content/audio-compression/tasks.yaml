  - id: mdct
    title: Die MDCT
    prompt: |
      Schreib in `audio/mdct.py` die Funktion `mdct(x)`: aus `2N` Samples
      die `N` Zahlen der MDCT nach der Formel auf der Seite. Die Prüfung
      vergleicht mit Zahlen, die die Formel ergibt.
    check:
      type: python
      file: audio/mdct.py
      cases:
        - call: len(mdct(np.zeros(16)))
          expect: 8
          say: Aus `2N` Samples werden `N` Zahlen, aus 16 also 8. Läuft die Schleife über `range(N)` mit `N = len(x) // 2`?
        - call: '[round(float(v), 4) for v in mdct(np.array([1.0, 0, 0, 0, 0, 0, 0, 0]))]'
          expect: '[0.5556, -0.9808, 0.1951, 0.8315]'
          say: 'Für eine 1 am Anfang ist jede Zahl der Testton bei `n = 0`: `np.cos(np.pi / N * (0.5 + N / 2) * (k + 0.5))`. Stehen `+ 0.5 + N / 2` und `k + 0.5` in der Formel?'
        - call: '[round(float(v), 4) for v in mdct(np.arange(4.0))]'
          expect: '[-5.0021, -0.9895]'
          say: Für die Samples 0, 1, 2, 3 ergibt die Formel etwa −5,0021 und −0,9895. Wird jedes Sample mit seinem Testton multipliziert und alles zusammengezählt?
        - call: '[round(float(v), 2) for v in imdct(mdct(np.arange(16.0)))]'
          expect: '[-7.0, -5.0, -3.0, -1.0, 1.0, 3.0, 5.0, 7.0, 23.0, 23.0, 23.0, 23.0, 23.0, 23.0, 23.0, 23.0]'
          say: Mit `imdct` von der Seite muss ein einzelner Block die Spiegelbilder zeigen. Steht `imdct` so in der Datei wie auf der Seite?
    solution: |
      ```python
      def mdct(x):
          N = len(x) // 2
          n = np.arange(2 * N)
          X = np.zeros(N)
          for k in range(N):
              X[k] = np.sum(x * np.cos(np.pi / N * (n + 0.5 + N / 2) * (k + 0.5)))
          return X
      ```

