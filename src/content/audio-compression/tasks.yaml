  - id: residual
    title: Die Reste der Vorhersage
    prompt: |
      Schreib in `audio/predict.py` die Funktion `residual(x)`: Sie gibt ein
      gleich langes Array zurück, die ersten beiden Zahlen wie in `x`, ab dem
      Index 2 die Messung minus `2 * x[n - 1] - x[n - 2]`. `x` selbst bleibt
      unverändert.
    check:
      type: python
      file: audio/predict.py
      cases:
        - call: len(residual(np.array([1, 4, 9, 16, 25])))
          expect: 5
          say: Das Array der Reste ist so lang wie das der Messungen; die ersten beiden Zahlen bleiben, wie sie sind.
        - call: '[int(v) for v in residual(np.array([3, 5, 7, 9, 11]))]'
          expect: '[3, 5, 0, 0, 0]'
          say: Auf einer Geraden stimmt jede Schätzung genau, und die Reste sind 0. Die ersten beiden Zahlen bleiben.
        - call: '[int(v) for v in residual(np.array([1, 4, 9, 16, 25]))]'
          expect: '[1, 4, 2, 2, 2]'
          say: Für die 9 ist die Schätzung 2 · 4 − 1 = 7, der Rest also 2.
        - call: '[int(v) for v in residual(np.array([6445, 6866, 7298, 7730, 8163]))]'
          expect: '[6445, 6866, 11, 0, 1]'
          say: Die Messungen aus der Tabelle auf der Seite.
        - call: x = np.array([1, 4, 9, 16]); residual(x); [int(v) for v in x]
          expect: '[1, 4, 9, 16]'
          say: '`residual` darf `x` nicht verändern: Fang mit einer Kopie an, `r = x.copy()`.'
    solution: |
      ```python
      def residual(x):
          r = x.copy()
          r[2:] = x[2:] - (2 * x[1:-1] - x[:-2])
          return r
      ```

  - id: rice
    title: Ein Rice-Code
    prompt: |
      Schreib in `audio/rice.py` die Funktion `rice(u, k)`: der Rice-Code
      der Zahl `u ≥ 0` mit dem Parameter `k ≥ 1` als Text aus Nullen und
      Einsen, erst `u // 2**k` Nullen und eine 1, dann `u % 2**k` mit genau
      `k` Stellen.
    check:
      type: python
      file: audio/rice.py
      cases:
        - call: rice(0, 2)
          expect: "'100'"
          say: Für 0 gibt es keine Nullen vorn, dann die 1 und die beiden Stellen von 0, also `'1'` und `'00'`.
        - call: rice(5, 2)
          expect: "'0101'"
          say: 5 // 4 = 1 Null und die 1, dann 5 % 4 = 1 mit zwei Stellen, `'01'`. Hat der zweite Teil genau `k` Stellen, auch mit führenden Nullen?
        - call: rice(13, 3)
          expect: "'01101'"
          say: 13 // 8 = 1, 13 % 8 = 5 = `'101'`.
        - call: rice(40, 3)
          expect: "'000001000'"
          say: 40 // 8 = 5 Nullen und die 1, dann 40 % 8 = 0 mit drei Stellen.
        - call: len(rice(1000, 4))
          expect: 67
          say: 1000 // 16 = 62 Nullen, die 1 und 4 Stellen.
    solution: |
      ```python
      def rice(u, k):
          return '0' * (u // 2 ** k) + '1' + format(u % 2 ** k, f'0{k}b')
      ```

