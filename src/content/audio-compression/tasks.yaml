  - id: unmulaw
    title: μ-law rückgängig machen
    prompt: |
      Schreib in `audio/mulaw.py` die Funktion `unmulaw(y)`, die `mulaw`
      rückgängig macht, für ein ganzes numpy-Array auf einmal. Die Prüfung
      ruft sie mit einzelnen Zahlen auf und mit allen Werten von −1 bis 1 in
      Schritten von 0,02, die vorher durch `mulaw` gegangen sind.
    check:
      type: python
      file: audio/mulaw.py
      cases:
        - call: round(float(unmulaw(0.0)), 4)
          expect: 0.0
          say: Aus 0 wird mit `mulaw` 0, also muss auch `unmulaw(0)` 0 ergeben.
        - call: round(float(unmulaw(1.0)), 4)
          expect: 1.0
          say: Aus 1 wird mit `mulaw` 1, also muss auch `unmulaw(1)` 1 ergeben. Ist (1 + MU) hoch 1, minus 1, durch MU gleich 1?
        - call: round(float(unmulaw(0.5)), 4)
          expect: 0.0588
          say: Aus 0,5 wird (256 hoch 0,5 − 1) / 255 = 15 / 255, etwa 0,0588. Rechnest du mit `1 + MU` als Basis?
        - call: round(float(unmulaw(-1.0)), 4)
          expect: -1.0
          say: Eine negative Zahl wird zur negativen Zahl mit demselben Betrag. Rechne mit dem Betrag `np.abs(y)` und multipliziere zum Schluss mit `np.sign(y)`.
        - call: round(float(np.abs(unmulaw(mulaw(np.linspace(-1, 1, 101))) - np.linspace(-1, 1, 101)).max()), 6)
          expect: 0.0
          say: Für jede Zahl eines Arrays muss `unmulaw(mulaw(x))` wieder `x` ergeben. Rechnet die Funktion mit numpy (`np.abs`, `np.sign`, `**`) statt mit `math`?
    solution: |
      ```python
      def unmulaw(y):
          return np.sign(y) * ((1 + MU) ** np.abs(y) - 1) / MU
      ```

