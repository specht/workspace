  - id: mithoerschwelle
    title: Die Mithörschwelle der Bänder
    prompt: |
      Schreib in `audio/codec.py` die Funktion `allowed(level)`: für jedes
      Band die Energie aller Verdecker zusammen, in dB, aber nie unter der
      Hörschwelle `QUIET`. Die Prüfung gibt ihr Bänder, die still sind, ein
      lautes Band und zwei laute Bänder.
    check:
      type: python
      file: audio/codec.py
      cases:
        - call: len(allowed(np.full(len(BANDS), -100.0)))
          expect: 25
          say: Für jedes der 25 Bänder gibt es einen Wert.
        - call: bool(np.allclose(allowed(np.full(len(BANDS), -100.0)), QUIET))
          expect: true
          say: Sind alle Bänder still, bleibt in jedem nur die Hörschwelle, `np.maximum(out, QUIET)`.
        - call: round(float(allowed(np.where(np.arange(len(BANDS)) == 10, 80.0, -100.0))[10]), 1)
          expect: 65.0
          say: Ein Band mit 80 dB verdeckt sich selbst bis 80 + spread(0) − 15, etwa 65 dB. Wird `OFFSET` abgezogen, und steht `CENTRES[i] - CENTRES[j]` in `spread`?
        - call: '[round(float(v), 1) for v in allowed(np.where(np.arange(len(BANDS)) == 10, 80.0, -100.0))[9:12]]'
          expect: '[56.7, 65.0, 60.8]'
          say: Neben dem lauten Band liegt die Schwelle darüber höher als darunter, 60,8 und 56,7 dB. Ist es `CENTRES[i] - CENTRES[j]`, die Entfernung vom Verdecker `j` zum Band `i`, und nicht umgekehrt?
        - call: round(float(allowed(np.where((np.arange(len(BANDS)) == 10) | (np.arange(len(BANDS)) == 12), 80.0, -100.0))[11]), 1)
          expect: 62.3
          say: Zwei laute Bänder verdecken das Band zwischen ihnen gemeinsam. Ihre Energien zählen zusammen, `10 ** (dB / 10)`, und erst die Summe wird mit `10 * np.log10` wieder zu dB; der größere der beiden Werte allein ist zu wenig.
    solution: |
      ```python
      def allowed(level):
          out = np.zeros(len(level))
          for i in range(len(level)):
              power = 0
              for j in range(len(level)):
                  power += 10 ** ((level[j] + spread(CENTRES[i] - CENTRES[j]) - OFFSET) / 10)
              out[i] = 10 * np.log10(power)
          return np.maximum(out, QUIET)
      ```

