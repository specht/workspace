  - id: fft
    title: Die FFT
    prompt: |
      Schreib in `audio/freq.py` die Funktion `fft(x)` für ein `x`, dessen
      Länge eine Zweierpotenz ist: Sie ruft sich für die geraden und die
      ungeraden Messungen selbst auf und setzt das Ergebnis daraus zusammen.
      Die Prüfung vergleicht mit der FFT von numpy und misst, ob 16.384
      Messungen in weniger als einer Sekunde gehen.
    check:
      type: python
      file: audio/freq.py
      timeout: 30
      cases:
        - call: '[complex(v) for v in fft(np.array([5.0]))]'
          expect: '[5 + 0j]'
          say: Die FFT einer einzigen Messung ist die Messung selbst.
        - call: len(fft(np.zeros(16)))
          expect: 16
          say: Für `N` Messungen gibt es `N` Ergebnisse, die erste Hälfte mit `+`, die zweite mit `-`.
        - call: bool(np.allclose(fft(np.array([3.0, 1, 4, 1, 5, 9, 2, 6])), np.fft.fft(np.array([3.0, 1, 4, 1, 5, 9, 2, 6]))))
          expect: true
          say: Das Ergebnis passt nicht zur FFT von numpy. Wird `odd` mit dem Faktor `np.exp(-2j * np.pi * np.arange(N // 2) / N)` multipliziert, und steht `even + w` vorn und `even - w` hinten?
        - call: bool(np.allclose(fft(np.sin(np.arange(1024) * 0.3)), np.fft.fft(np.sin(np.arange(1024) * 0.3))))
          expect: true
          say: Bei acht Messungen stimmt es, bei 1.024 nicht mehr. Kommen die Hälften aus `x[0::2]` und `x[1::2]`?
        - call: t = time.perf_counter(); fft(np.zeros(16384)); time.perf_counter() - t < 1
          expect: true
          say: Für 16.384 Messungen braucht `fft` länger als eine Sekunde. Ruft sie sich selbst für die beiden Hälften auf, statt `dft`?
    solution: |
      ```python
      def fft(x):
          N = len(x)
          if N == 1:
              return x.astype(complex)
          even = fft(x[0::2])
          odd = fft(x[1::2])
          w = np.exp(-2j * np.pi * np.arange(N // 2) / N) * odd
          return np.concatenate([even + w, even - w])
      ```

  - id: staerke
    title: Wie stark eine Frequenz ist
    prompt: |
      Schreib in `audio/dial.py` die Funktion `strength(block, freq, rate)`:
      wie hoch die Schwingung mit `freq` Hz in den Messungen `block` ist, bei
      `rate` Messungen in der Sekunde. Die Prüfung gibt ihr Sinustöne der
      Tasten.
    check:
      type: python
      file: audio/dial.py
      cases:
        - call: round(float(strength(0.5 * np.sin(2 * np.pi * 770 * np.arange(800) / 8000), 770, 8000)), 2)
          expect: 0.5
          say: Ein Sinus mit 770 Hz und der Höhe 0,5 ergibt bei 770 Hz die Stärke 0,5. Steht im Testton `freq * n / rate`, und wird der Betrag der Summe mit 2 multipliziert und durch die Zahl der Messungen geteilt?
        - call: round(float(strength(0.5 * np.sin(2 * np.pi * 770 * np.arange(800) / 8000), 1336, 8000)), 2)
          expect: 0.0
          say: Ein Ton mit 770 Hz enthält keine 1.336 Hz. Steht im Testton `freq * n / rate`?
        - call: round(float(strength(0.5 * np.sin(2 * np.pi * 697 * np.arange(800) / 8000), 697, 8000)), 2)
          expect: 0.5
          say: 697 Hz machen in 800 Messungen keine ganze Zahl von Schwingungen; der Testton muss trotzdem genau 697 Hz haben.
        - call: round(float(strength(0.3 * np.sin(2 * np.pi * 1209 * np.arange(4410) / 44100), 1209, 44100)), 2)
          expect: 0.3
          say: Bei 44.100 Messungen in der Sekunde ist die Messung mit dem Index `n` zur Zeit `n / 44100`. Rechnet der Testton mit `rate`?
        - call: key(0.25 * np.sin(2 * np.pi * 852 * np.arange(1000) / 8000) + 0.25 * np.sin(2 * np.pi * 1336 * np.arange(1000) / 8000), 8000)
          expect: "'8'"
          say: 852 Hz und 1.336 Hz sind die Taste 8. Steht `key` so in der Datei wie auf der Seite?
    solution: |
      ```python
      def strength(block, freq, rate):
          n = np.arange(len(block))
          return 2 * abs(np.sum(block * np.exp(-2j * np.pi * freq * n / rate))) / len(block)
      ```

