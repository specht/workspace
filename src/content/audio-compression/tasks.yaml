  - id: entropie
    title: Die Entropie
    prompt: |
      Schreib in `audio/codec.py` die Funktion `entropy(values)`: die
      Entropie der Zahlen in `values`, in Bits je Zahl.
    check:
      type: python
      file: audio/codec.py
      cases:
        - call: entropy(np.array([0, 0, 0, 0])) == 0
          expect: true
          say: Kommt immer dieselbe Zahl, braucht man keine Bits, sie zu nennen. Sind die Wahrscheinlichkeiten `counts / counts.sum()`, so dass sie zusammen 1 ergeben?
        - call: round(entropy(np.array([0, 1])), 4)
          expect: 1.0
          say: Zwei Zahlen, jede in der Hälfte der Fälle, brauchen 1 Bit je Zahl. Rechnest du mit `np.log2`, dem Logarithmus zur Basis 2?
        - call: round(entropy(np.arange(8)), 4)
          expect: 3.0
          say: Acht verschiedene Zahlen, jede gleich oft, brauchen 3 Bits je Zahl. Rechnest du mit `np.log2`, dem Logarithmus zur Basis 2?
        - call: round(entropy(np.array([0, 0, 0, 1])), 4)
          expect: 0.8113
          say: Bei drei Nullen und einer Eins sind es 0,75 · log₂(1/0,75) + 0,25 · log₂(4), etwa 0,81 Bits je Zahl. Sind die Wahrscheinlichkeiten `counts / counts.sum()`?
    solution: |
      ```python
      def entropy(values):
          _, counts = np.unique(values, return_counts=True)
          p = counts / counts.sum()
          return float(np.sum(p * np.log2(1 / p)))
      ```

