  - id: von-hand
    title: Eine Frequenz von Hand
    prompt: |
      Rechne für die acht Samples aus der Tabelle \(c_2\), \(s_2\) und
      daraus die Stärke \(A_2\) aus. Wie groß ist \(A_2\)?
    check:
      type: number
      expect: 1
      tolerance: 0.01
    feedback:
      - when: { between: [3.99, 4.01] }
        say: Das ist \(\sqrt{c_2^2 + s_2^2}\). Die Stärke ist das noch mal \(2 / N\), bei acht Samples also mal 2/8.
      - when: { between: [0.49, 0.51] }
        say: Geteilt durch 8 ist nur die halbe Höhe; die Formel teilt durch \(N\) und multipliziert mit 2.
      - when: { between: [-0.01, 0.01] }
        say: Mit dem Kosinus heben sich die Produkte auf, aber nicht mit dem Sinus. Beide gehören in die Wurzel.
    solution: |
      \(c_2 = 1 - 1 + 1 - 1 = 0\) und \(s_2 = 2 + 2 = 4\), also
      \(A_2 = \frac{2}{8}\sqrt{0^2 + 4^2} = 1\).

  - id: dft
    title: Die DFT
    prompt: |
      Schreib in `audio/freq.py` die Funktion `dft(x)`, die für jedes `k` von
      0 bis `N - 1` die Summe \(X_k\) ausrechnet und alle als numpy-Array
      zurückgibt. Die Prüfung vergleicht mit der FFT von numpy.
    check:
      type: python
      file: audio/freq.py
      cases:
        - call: len(dft(np.zeros(8)))
          expect: 8
          say: Für `N` Samples gibt es `N` Ergebnisse, eines für jedes `k` von 0 bis `N - 1`.
        - call: round(float(abs(dft(np.array([1.0, 2, 1, 0, 1, 2, 1, 0]))[0])), 4)
          expect: 8.0
          say: Für `k = 0` ist der Testton überall 1, und die Summe ist die Summe aller Samples, hier 8.
        - call: round(float(abs(dft(np.array([1.0, 2, 1, 0, 1, 2, 1, 0]))[2])), 4)
          expect: 4.0
          say: Für die Samples aus der Tabelle ist der Betrag von \(X_2\) gleich \(\sqrt{c_2^2 + s_2^2} = 4\). Steht im Testton `k * n / N`, mit dem Array `n` der Indizes?
        - call: bool(np.allclose(dft(np.array([3.0, 1, 4, 1, 5, 9, 2, 6])), np.fft.fft(np.array([3.0, 1, 4, 1, 5, 9, 2, 6]))))
          expect: true
          say: Die Beträge stimmen, aber nicht die Zahlen selbst. Hat der Testton das Minus, `np.exp(-2j * np.pi * k * n / N)`?
    solution: |
      ```python
      def dft(x):
          N = len(x)
          n = np.arange(N)
          X = np.zeros(N, dtype=complex)
          for k in range(N):
              X[k] = np.sum(x * np.exp(-2j * np.pi * k * n / N))
          return X
      ```

