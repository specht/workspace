# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
format: 1
activity: webserver
examples:
  antwort:
    pass:
      - files: { webserver/server.rb: stufen/2.rb }
    fail:
      - files: { webserver/server.rb: stufen/1.rb }
    python:
      pass:
        - files: { webserver/server.py: stufen/2.py }
      fail:
        - files: { webserver/server.py: stufen/1.py }
  respond:
    pass:
      - files: { webserver/server.rb: stufen/3.rb }
    fail:
      - files: { webserver/server.rb: stufen/2.rb }
        say: respond
      # Zeichen statt Bytes gezählt
      - files:
          webserver/server.rb:
            text: |
              def respond(client, status, type, body)
                client.print "HTTP/1.1 #{status}\r\n"
                client.print "Content-Type: #{type}\r\n"
                client.print "Content-Length: #{body.length}\r\n"
                client.print "Connection: close\r\n"
                client.print "\r\n"
                client.print body
                client.close
              end
        say: bytesize
    python:
      pass:
        - files: { webserver/server.py: stufen/3.py }
      fail:
        - files: { webserver/server.py: stufen/2.py }
          say: respond
        # nur Text, keine Bytes
        - files:
            webserver/server.py:
              text: |
                import socket
                def respond(client, status, content_type, body):
                    data = body.encode()
                    client.sendall(f'HTTP/1.1 {status}\r\nContent-Type: {content_type}\r\n'
                                   f'Content-Length: {len(data)}\r\nConnection: close\r\n\r\n'.encode() + data)
          say: isinstance
  dateien:
    # Der Befehl fragt sonst den laufenden Server. Hier steht seine Ausgabe,
    # wie der Server der Stufe 4 und der Stufe 3 sie auf curl -sI geben.
    pass:
      - answer: "printf 'HTTP/1.1 200 OK\\r\\nContent-Type: text/css; charset=utf-8\\r\\nContent-Length: 1501\\r\\nConnection: close\\r\\n\\r\\n'"
    fail:
      - answer: "printf 'HTTP/1.1 404 Not Found\\r\\nContent-Type: text/plain; charset=utf-8\\r\\nContent-Length: 35\\r\\nConnection: close\\r\\n\\r\\n'"
        say: serve_file
      - answer: "printf 'HTTP/1.1 200 OK\\r\\nContent-Type: application/octet-stream\\r\\nContent-Length: 1501\\r\\n\\r\\n'"
        say: TYPES
      - answer: "true"
  webseite:
    pass:
      - files: { webserver/public/index.html: stufen/public/index.html }
    fail:
      - files: { webserver/public/style.css: stufen/public/style.css }
      - files: { webserver/public/index.html: { text: "Hallo\n" } }
        say: "<html"
  hallo:
    skip: Der Befehl fragt den Server, der dafür im Workspace laufen muss. Dass die Schritte der Seite die Aufgabe lösen, prüfen die Rezepte mit check-task.
  weiterleitung:
    pass:
      - files: { webserver/server.rb: stufen/6.rb }
    fail:
      - files: { webserver/server.rb: stufen/5.rb }
        say: redirect
      # die Adresse fest statt aus location
      - files:
          webserver/server.rb:
            text: |
              def redirect(client, location)
                client.print "HTTP/1.1 303 See Other\r\nLocation: /results\r\nContent-Length: 0\r\nConnection: close\r\n\r\n"
                client.close
              end
        say: Location
    python:
      pass:
        - files: { webserver/server.py: stufen/6.py }
      fail:
        - files: { webserver/server.py: stufen/5.py }
          say: redirect
        # ohne die leere Zeile
        - files:
            webserver/server.py:
              text: |
                import socket
                def redirect(client, location):
                    client.sendall(f'HTTP/1.1 303 See Other\r\nLocation: {location}\r\nContent-Length: 0\r\nConnection: close\r\n'.encode())
          say: leere Zeile
  umfrage:
    pass:
      - files: { webserver/server.rb: stufen/6.rb }
    fail:
      - files: { webserver/server.rb: stufen/5.rb }
        say: POST
    python:
      pass:
        - files: { webserver/server.py: stufen/6.py }
      fail:
        - files: { webserver/server.py: stufen/5.py }
          say: POST
        # f.read() beim Ausliefern einer Datei ist noch kein Lesen des Bodys
        - files:
            webserver/server.py:
              text: |
                if method == 'POST':
                    length = int(headers.get('content-length', 0))
                    body = open('public/poll.html').read()
                    send(client, '303 See Other')
          say: reader.read
