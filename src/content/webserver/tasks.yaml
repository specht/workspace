# Aufgaben zu »Ein eigener Webserver«.
# Format: docs/aufgaben.md. Der Server liegt in /workspace/webserver.
format: 1
activity: webserver
tasks:
  - id: request-line
    title: Die erste Zeile
    prompt: |
      Was ist die erste Zeile, die `curl localhost:8000/time` an deinen Server
      schickt?
    check:
      type: choice
      options:
        - '`GET /time HTTP/1.1`'
        - '`GET localhost:8000/time`'
        - '`HTTP/1.1 200 OK`'
        - '`Host: localhost:8000`'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Wohin die Anfrage geht, steht in einem Header weiter unten. In der ersten Zeile steht nur der Pfad.
      - when: { picked: 2 }
        say: So beginnt die Antwort des Servers, nicht die Anfrage.
      - when: { picked: 3 }
        say: Das ist ein Header. Davor kommt die Request-Line mit Methode, Pfad und Version.
    solution: Die Request-Line ist Methode, Pfad und Version, durch Leerzeichen getrennt. Der Rechner, an den die Anfrage geht, steht im Header `Host`.

  - id: antwort
    title: Die erste Antwort
    prompt: |
      Lass deinen Server mit einer vollständigen HTTP-Antwort antworten, jede
      Verbindung in einem eigenen Thread (`Thread.new`), und speichere.
    file: webserver/server.rb
    check:
      type: files
      path: webserver/server.rb
      expect:
        format: text
        contains:
          - { pattern: 'HTTP/1\.1 (200|#\{)', say: 'In `server.rb` finde ich noch keine Status-Line wie `HTTP/1.1 200 OK`.' }
          - { pattern: 'Content-Length', say: 'Noch fehlt der Header `Content-Length`: Er sagt dem Browser, wie viele Bytes kommen.' }
          - { pattern: 'Thread\.new', say: 'Noch bedient der Server eine Verbindung nach der anderen. Mit `Thread.new` bekommt jede einen eigenen Thread.' }

    python:
      prompt: |
        Lass deinen Server mit einer vollständigen HTTP-Antwort antworten, jede
        Verbindung in einem eigenen Thread (`threading.Thread`), und speichere.
      file: webserver/server.py
      check:
        type: files
        path: webserver/server.py
        expect:
          format: text
          contains:
            - { pattern: 'HTTP/1\.1 (200|\{)', say: 'In `server.py` finde ich noch keine Status-Line wie `HTTP/1.1 200 OK`.' }
            - { pattern: 'Content-Length', say: 'Noch fehlt der Header `Content-Length`: Er sagt dem Browser, wie viele Bytes kommen.' }
            - { pattern: 'threading\.Thread', say: 'Noch bedient der Server eine Verbindung nach der anderen. Mit `threading.Thread` bekommt jede einen eigenen Thread.' }

  - id: bytes
    title: Zeichen oder Bytes?
    prompt: |
      Der Inhalt einer Antwort ist `"Grüße\n"`. Welchen Wert muss
      `Content-Length` haben?
    check:
      type: number
      expect: 8
      tolerance: 0
      unit: Bytes
    hint: In UTF-8 sind ü und ß je zwei Bytes lang, `\n` ist ein Byte.
    feedback:
      - when: { equals: 6 }
        say: Das sind die Zeichen. `Content-Length` zählt Bytes, und ein Umlaut ist in UTF-8 länger als ein Byte.
    solution: G, r, e und `\n` sind je ein Byte, ü und ß je zwei. Zusammen 8 Bytes, `"Grüße\n".bytesize`.

    python:
      solution: G, r, e und `\n` sind je ein Byte, ü und ß je zwei. Zusammen 8 Bytes, `len('Grüße\n'.encode())`.

  - id: respond
    title: Eine Funktion für jede Antwort
    prompt: |
      Schreib `respond(client, status, type, body)` in `server.rb` und
      speichere. Der Workspace ruft `respond` mit einem `StringIO` statt einer
      Verbindung auf, das aufschreibt, was ankommt, und sieht nach:
      Status-Line, Header, leere Zeile, Inhalt, und ob die Verbindung danach
      zu ist. Der Server muss dafür nicht laufen.
    file: webserver/server.rb
    check:
      type: ruby
      file: webserver/server.rb
      cases:
        - call: 'respond(c = StringIO.new, ''404 Not Found'', ''text/plain; charset=utf-8'', "Weg\n"); c.string.lines.first'
          expect: '"HTTP/1.1 404 Not Found\r\n"'
          say: 'Die erste Zeile ist die Status-Line: `HTTP/1.1`, ein Leerzeichen, `status` und `"\r\n"`.'
        - call: 'respond(c = StringIO.new, ''200 OK'', ''text/css; charset=utf-8'', "h1 {}\n"); c.string.include?("Content-Type: text/css; charset=utf-8\r\n")'
          expect: true
          say: Der Header `Content-Type` nimmt seinen Wert aus `type`.
        - call: 'respond(c = StringIO.new, ''200 OK'', ''text/plain; charset=utf-8'', "Grüße\n"); c.string[/content-length: *(\d+)/i, 1]'
          expect: '"8"'
          say: '`Content-Length` zählt die Bytes von `body`, nicht die Zeichen: `"Grüße\n"` hat 8 Bytes, `body.bytesize`.'
        - call: 'respond(c = StringIO.new, ''200 OK'', ''text/plain; charset=utf-8'', "Grüße\n"); c.string.include?("Connection: close\r\n")'
          expect: true
          say: 'Es fehlt der Header `Connection: close`.'
        - call: 'respond(c = StringIO.new, ''200 OK'', ''text/plain; charset=utf-8'', "Grüße\n"); c.string.split("\r\n\r\n", 2)[1]'
          expect: '"Grüße\n"'
          say: Nach den Headern kommen die leere Zeile und dann genau `body`, sonst nichts.
        - call: 'respond(c = StringIO.new, ''200 OK'', ''text/plain; charset=utf-8'', "Hallo\n"); c.closed?'
          expect: true
          say: 'Nach der Antwort schließt `respond` die Verbindung: `client.close`.'
    solution: |
      `respond` schickt `"HTTP/1.1 #{status}\r\n"`, dann `Content-Type` mit
      `type`, `Content-Length` mit `body.bytesize` und `Connection: close`,
      die leere Zeile `"\r\n"` und `body`, und schließt mit `client.close`.

    python:
      prompt: |
        Schreib `respond(client, status, content_type, body)` in `server.py`
        und speichere. Der Workspace ruft `respond` mit einem Ende von
        `socket.socketpair()` statt einer echten Verbindung auf, liest am
        anderen Ende, was ankommt, und sieht nach: Status-Line, Header, leere
        Zeile, Inhalt, als Text und als Bytes. Der Server muss dafür nicht
        laufen.
      file: webserver/server.py
      check:
        type: python
        file: webserver/server.py
        cases:
          - call: 'callable(sent := lambda *args: (s := socket.socketpair(), respond(s[0], *args), s[0].close(), s[1].recv(65536))[-1])'
            expect: true
          - call: 'sent(''404 Not Found'', ''text/plain; charset=utf-8'', ''Weg\n'').split(b''\r\n'')[0]'
            expect: "b'HTTP/1.1 404 Not Found'"
            say: 'Die erste Zeile ist die Status-Line: `HTTP/1.1`, ein Leerzeichen, `status` und `\r\n`.'
          - call: 'b''Content-Type: text/css; charset=utf-8\r\n'' in sent(''200 OK'', ''text/css; charset=utf-8'', ''h1 {}\n'')'
            expect: true
            say: Der Header `Content-Type` nimmt seinen Wert aus `content_type`.
          - call: '[line.lower() for line in sent(''200 OK'', ''text/plain; charset=utf-8'', ''Grüße\n'').split(b''\r\n'') if line.lower().startswith(b''content-length'')]'
            expect: "[b'content-length: 8']"
            say: '`Content-Length` zählt die Bytes von `body`, nicht die Zeichen: `''Grüße\n''` hat 8 Bytes, `len(data)` nach `encode()`.'
          - call: 'b''Connection: close\r\n'' in sent(''200 OK'', ''text/plain; charset=utf-8'', ''Grüße\n'')'
            expect: true
            say: 'Es fehlt der Header `Connection: close`.'
          - call: 'sent(''200 OK'', ''text/plain; charset=utf-8'', ''Grüße\n'').split(b''\r\n\r\n'', 1)[1]'
            expect: "'Grüße\\n'.encode()"
            say: Nach den Headern kommen die leere Zeile und dann genau `body`, als Bytes, sonst nichts.
          - call: 'sent(''200 OK'', ''image/png'', b''\x89PNG'').split(b''\r\n\r\n'', 1)[1]'
            expect: "b'\\x89PNG'"
            say: '`body` darf schon Bytes sein, etwa ein Bild. Dann schickt `respond` sie, wie sie sind; nur Text wird mit `encode()` zu Bytes (`isinstance(body, str)`).'
      solution: |
        `respond` macht aus Text Bytes (`body.encode()`, wenn
        `isinstance(body, str)`), schickt `f'HTTP/1.1 {status}\r\n'`, dann
        `Content-Type` mit `content_type`, `Content-Length` mit `len(data)` und
        `Connection: close`, die leere Zeile und die Bytes.

  - id: statuscodes
    title: Eine Seite, die es nicht gibt
    prediction: true
    prompt: |
      Dein Server antwortet auf `/missing` mit `404 Not Found` und dem
      Text »Die Seite /missing gibt es nicht.« Was zeigt der Browser?
      Überleg erst, dann probier es aus.
    check:
      type: choice
      options:
        - Den Text deines Servers
        - Eine eigene Fehlerseite des Browsers ohne deinen Text
        - Eine leere weiße Seite
        - Die Startseite deines Servers
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Der Browser zeigt, was der Server schickt, auch bei einem Fehler. Der Statuscode sagt nur, dass es ein Fehler ist.
    solution: Der Browser zeigt den Inhalt, den der Server schickt. Der Statuscode 404 ist für Programme gedacht, für Suchmaschinen etwa, die wissen wollen, ob es die Seite wirklich gibt.

  - id: dateien
    title: Alles außer /time aus public
    prompt: |
      Starte deinen Server neu, frag ihn mit `curl -sI localhost:8000/style.css`
      nach den Headern von `/style.css` und trag den Befehl hier ein. Der
      Workspace führt ihn aus und sieht nach, was dein Server antwortet: Geht
      der Pfad an `serve_file`, kommt `200 OK` mit dem `Content-Type` für CSS,
      sonst eine 404.
    check:
      type: command
      timeout: 10
      output:
        matching: '^(HTTP/1\.[01] 200 |[A-Za-z-]+: )'
        not_matching: '(?i)^content-type: (?!text/css)'
    feedback:
      - when: { output_matches: '(Failed to connect|Couldn.t connect|Connection refused)' }
        say: Unter Port 8000 antwortet gerade niemand. Starte deinen Server im linken Terminal und prüfe dann noch einmal.
      - when: { output_matches: '% Total' }
        say: Ohne `-s` schreibt `curl` hier eine Fortschrittsanzeige dazu. Schreib `curl -sI …`.
      - when: { output_matches: '^HTTP/1\.[01] 404' }
        say: 'Dein Server antwortet auf `/style.css` mit 404. Geht jeder Pfad außer `/time` an `serve_file`, und hast du den Server nach der Änderung neu gestartet? Liegt `style.css` in `public`?'
      - when: { output_matches: '(?i)^content-type: ' }
        say: '`/style.css` kommt an, aber nicht als `text/css`. Nimmt `serve_file` den `Content-Type` aus `TYPES`, an der Endung der Datei?'
    hint: Läuft dein Server nicht, gibt `curl -s` gar nichts aus.
    solution: '`curl -sI localhost:8000/style.css` ergibt `HTTP/1.1 200 OK` und `Content-Type: text/css; charset=utf-8`: Außer `/time` geht jeder Pfad an `serve_file`, und das findet die Datei in `public`.'

  - id: webseite
    title: Eine Seite aus public
    prompt: |
      Lege `public/index.html` an und lass deinen Server die Dateien aus
      `public` ausliefern.
    file: webserver/server.rb
    check:
      type: files
      path: webserver/public/index.html
      expect:
        exists: true
        format: text
        contains:
          - { pattern: '<html', say: '`public/index.html` sieht noch nicht nach HTML aus: Es fehlt `<html`.' }
    feedback:
      - when: { problem: missing }
        say: Es gibt noch keine `webserver/public/index.html`. Der Ordner `public` gehört neben `server.rb`.

    python:
      file: webserver/server.py

  - id: sicherheit
    title: Nur aus public
    prompt: |
      Warum prüft der Server mit `start_with?(PUBLIC_DIR + '/')`, wo die Datei
      liegt, bevor er sie schickt?
    check:
      type: choice
      options:
        - Sonst könnte jemand mit `/../server.rb` Dateien außerhalb von public lesen
        - 'Sonst findet der Server Dateien in Unterordnern von public nicht'
        - 'Sonst schickt der Server zu einer Datei den falschen Content-Type'
        - 'Sonst muss der Server bei jeder Anfrage alle Dateien durchsuchen'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Gefunden wird die Datei auch ohne die Prüfung. Die Frage ist, welche Dateien jemand bekommen darf.
    solution: '`..` heißt »eine Ebene höher«. Ohne Prüfung bekäme jeder, der danach fragt, jede Datei, die der Server lesen kann: den Quelltext, Passwörter in Konfigurationsdateien. Die Prüfung erlaubt nur Dateien in public.'

    python:
      prompt: |
        Warum prüft der Server mit `startswith(PUBLIC_DIR + '/')`, wo die Datei
        liegt, bevor er sie schickt?

  - id: parameter
    title: Ein Name in der Adresse
    prediction: true
    prompt: |
      Was wird dein Server gleich auf `/hello?name=Ada%20Lovelace` antworten?
    check:
      type: choice
      options:
        - Hallo, Ada Lovelace!
        - Hallo, Ada%20Lovelace!
        - Hallo, Ada!
        - Hallo, Unbekannt!
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: '`URI.decode_www_form` macht aus den kodierten Zeichen wieder normale.'
      - when: { picked: 3 }
        say: Der Parameter `name` ist da, also gibt es einen Namen.
    solution: '`%20` ist ein kodiertes Leerzeichen. `URI.decode_www_form` wandelt es zurück, und der Server begrüßt »Ada Lovelace«.'

    python:
      feedback:
        - when: { picked: 1 }
          say: '`parse_qsl` macht aus den kodierten Zeichen wieder normale.'
        - when: { picked: 3 }
          say: Der Parameter `name` ist da, also gibt es einen Namen.
      solution: '`%20` ist ein kodiertes Leerzeichen. `parse_qsl` wandelt es zurück, und der Server begrüßt »Ada Lovelace«.'

  - id: hallo
    title: Dein Server grüßt
    prompt: |
      Frag deinen laufenden Server mit `curl -s` nach
      `/hello?name=Ada%20Lovelace` und trag den Befehl hier ein. Der
      Workspace führt ihn aus und sieht nach, was dein Server antwortet.
    check:
      type: command
      timeout: 10
      output:
        matching: '^Hallo, Ada Lovelace!$'
    feedback:
      - when: { output_matches: '(Failed to connect|Couldn.t connect|Connection refused)' }
        say: Unter Port 8000 antwortet gerade niemand. Starte deinen Server im linken Terminal und prüfe dann noch einmal.
      - when: { output_matches: '% Total' }
        say: Ohne `-s` schreibt `curl` hier eine Fortschrittsanzeige dazu. Schreib `curl -s …`.
      - when: { output_matches: 'gibt es nicht' }
        say: Dein Server kennt `/hello` noch nicht und sucht eine Datei. Hast du ihn nach der Änderung neu gestartet?
      - when: { output_matches: 'Unbekannt' }
        say: Dein Server antwortet, findet aber den Namen nicht. Fragt `/hello` in `params` nach `name`?
      - when: { output_matches: '%20' }
        say: Im Namen steht noch `%20`. Nimm den Namen aus `params`, dort ist er schon dekodiert.
      - when: { output_matches: '^Hallo, Ada!' }
        say: Gefragt ist nach `name=Ada%20Lovelace`, mit Nachnamen.
    hint: 'Setz die Adresse in Anführungszeichen, wie oben. Läuft dein Server nicht, gibt `curl -s` gar nichts aus.'
    solution: '`curl -s "localhost:8000/hello?name=Ada%20Lovelace"` ergibt `Hallo, Ada Lovelace!`: Dein Server hat den Parameter gelesen und `%20` wieder in ein Leerzeichen verwandelt.'

  - id: mutex
    title: Zwei auf einmal
    prompt: |
      Ohne Mutex: `$visits` ist 10, und zwei Besucher kommen genau
      gleichzeitig. Was kann passieren?
    check:
      type: choice
      options:
        - Beide bekommen »Nummer 11«, und `$visits` ist danach 11 statt 12
        - 'Der Server stürzt ab, weil zwei Threads dieselbe Variable ändern'
        - 'Einer der beiden wartet und bekommt gar keine Antwort'
        - 'Nichts, die Zahl stimmt immer, auch mit mehreren Threads'
      correct: 0
    feedback:
      - when: { picked: 3 }
        say: '`$visits += 1` ist lesen, eins dazuzählen, schreiben. Was passiert, wenn beide Threads lesen, bevor einer schreibt?'
    solution: Beide Threads lesen 10, beide schreiben 11. Ein Besuch geht verloren. Der Mutex sorgt dafür, dass immer nur ein Thread zählt.

    python:
      prompt: |
        Ohne Lock: `visits` ist 10, und zwei Besucher kommen genau
        gleichzeitig. Was kann passieren?
      feedback:
        - when: { picked: 3 }
          say: '`visits += 1` ist lesen, eins dazuzählen, schreiben. Was passiert, wenn beide Threads lesen, bevor einer schreibt?'
      solution: Beide Threads lesen 10, beide schreiben 11. Ein Besuch geht verloren. Der Lock sorgt dafür, dass immer nur ein Thread zählt.

  - id: weiterleitung
    title: Sieh dort nach
    prompt: |
      Schreib `redirect(client, location)` in `server.rb` und speichere. Der
      Workspace ruft `redirect` mit einem `StringIO` statt einer Verbindung
      auf, das aufschreibt, was ankommt, und sieht nach: `303 See Other`, die
      drei Header, die leere Zeile, und ob die Verbindung danach zu ist. Der
      Server muss dafür nicht laufen.
    file: webserver/server.rb
    check:
      type: ruby
      file: webserver/server.rb
      cases:
        - call: 'redirect(c = StringIO.new, ''/results''); c.string.lines.first'
          expect: '"HTTP/1.1 303 See Other\r\n"'
          say: 'Die erste Zeile ist die Status-Line: `HTTP/1.1 303 See Other` und `"\r\n"`.'
        - call: 'redirect(c = StringIO.new, ''/poll.html''); c.string.include?("Location: /poll.html\r\n")'
          expect: true
          say: 'Der Header `Location` sagt, wohin der Browser gehen soll, mit dem Wert aus `location`.'
        - call: 'redirect(c = StringIO.new, ''/results''); c.string[/content-length: *(\d+)/i, 1]'
          expect: '"0"'
          say: 'Eine Antwort ohne Inhalt hat trotzdem `Content-Length`, mit 0.'
        - call: 'redirect(c = StringIO.new, ''/results''); c.string.include?("Connection: close\r\n")'
          expect: true
          say: 'Es fehlt der Header `Connection: close`.'
        - call: 'redirect(c = StringIO.new, ''/results''); c.string.end_with?("\r\n\r\n")'
          expect: true
          say: Nach den Headern kommt die leere Zeile, und danach nichts mehr.
        - call: 'redirect(c = StringIO.new, ''/results''); c.closed?'
          expect: true
          say: 'Danach schließt `redirect` die Verbindung, wie `respond`: `client.close`.'
    solution: |
      `redirect` schickt `"HTTP/1.1 303 See Other\r\n"`, dann
      `"Location: #{location}\r\n"`, `Content-Length: 0` und
      `Connection: close`, die leere Zeile, und schließt mit `client.close`.

    python:
      prompt: |
        Schreib `redirect(client, location)` in `server.py` und speichere. Der
        Workspace ruft `redirect` mit einem Ende von `socket.socketpair()`
        statt einer echten Verbindung auf, liest am anderen Ende, was ankommt,
        und sieht nach: `303 See Other`, die drei Header und die leere Zeile.
        Der Server muss dafür nicht laufen.
      file: webserver/server.py
      check:
        type: python
        file: webserver/server.py
        cases:
          - call: 'callable(moved := lambda location: (s := socket.socketpair(), redirect(s[0], location), s[0].close(), s[1].recv(65536))[-1])'
            expect: true
          - call: 'moved(''/results'').split(b''\r\n'')[0]'
            expect: "b'HTTP/1.1 303 See Other'"
            say: 'Die erste Zeile ist die Status-Line: `HTTP/1.1 303 See Other` und `\r\n`.'
          - call: 'b''Location: /poll.html\r\n'' in moved(''/poll.html'')'
            expect: true
            say: 'Der Header `Location` sagt, wohin der Browser gehen soll, mit dem Wert aus `location`.'
          - call: '[line.lower() for line in moved(''/results'').split(b''\r\n'') if line.lower().startswith(b''content-length'')]'
            expect: "[b'content-length: 0']"
            say: 'Eine Antwort ohne Inhalt hat trotzdem `Content-Length`, mit 0.'
          - call: 'b''Connection: close\r\n'' in moved(''/results'')'
            expect: true
            say: 'Es fehlt der Header `Connection: close`.'
          - call: 'moved(''/results'').endswith(b''\r\n\r\n'')'
            expect: true
            say: Nach den Headern kommt die leere Zeile, und danach nichts mehr.
      solution: |
        `redirect` schickt als Bytes `HTTP/1.1 303 See Other`, dann
        `f'Location: {location}'`, `Content-Length: 0` und
        `Connection: close`, jede Zeile mit `\r\n`, und die leere Zeile.

  - id: umfrage
    title: Eine Umfrage
    prompt: |
      Lass deinen Server Stimmen mit `POST` annehmen, sie unter einem Lock
      zählen und mit `303 See Other` auf das Ergebnis weiterleiten. Starte ihn
      neu, stimme mit `curl -si -d choice=curry localhost:8000/vote` ab und
      trag den Befehl hier ein. Der Workspace führt ihn aus und sieht nach,
      was dein Server antwortet.
    check:
      type: command
      timeout: 10
      output:
        containing:
          - '^HTTP/1\.[01] 303\b'
          - '^(?i:location):\s*/results\s*$'
    feedback:
      - when: { output_matches: '(Failed to connect|Couldn.t connect|Connection refused)' }
        say: 'Unter Port 8000 antwortet gerade niemand. Starte deinen Server im linken Terminal und prüfe dann noch einmal.'
      - when: { output_matches: '% Total' }
        say: 'Ohne `-s` schreibt `curl` hier eine Fortschrittsanzeige dazu. Schreib `curl -si …`.'
      - when: { output_matches: '^HTTP/1\.[01] 303\b' }
        say: 'Die Weiterleitung mit `303` kommt an, aber ohne die Zeile `Location: /results`. Wohin soll der Browser danach gehen?'
      - when: { output_matches: '^HTTP/1\.[01] 404\b' }
        say: 'Dein Server kennt `/vote` noch nicht und sucht eine Datei. Hast du ihn nach der Änderung neu gestartet?'
      - when: { output_matches: '^HTTP/1\.[01] 200\b' }
        say: 'Dein Server antwortet auf die Stimme mit `200` und einer Seite. Gefragt ist eine Weiterleitung mit `303 See Other` auf `/results`.'
      - when: { output_matches: '^<' }
        say: 'Ohne `-i` zeigt `curl` nur den Body, nicht die Statuszeile und die Header. Schreib `curl -si …`.'
    hint: 'Ohne `-i` sieht der Workspace die Statuszeile nicht. Läuft dein Server nicht, gibt `curl -s` gar nichts aus.'
    solution: '`curl -si -d choice=curry localhost:8000/vote` zeigt `HTTP/1.1 303 See Other` und `Location: /results`: Dein Server hat die Stimme angenommen, gezählt und weitergeleitet. Wie oft gezählt wurde, zeigt `curl localhost:8000/results`.'

  - id: body
    title: Wie lang ist der Body?
    prompt: |
      Warum liest der Server den Body mit `client.read` und der Zahl aus
      `Content-Length` und nicht mit `client.gets`?
    check:
      type: choice
      options:
        - Hinter dem Body steht kein Zeilenumbruch, `client.gets` würde warten
        - '`client.gets` kann keine Umlaute und Sonderzeichen lesen'
        - '`client.read` ist schneller, weil es alles auf einmal liest'
        - 'Der Body ist verschlüsselt und muss als Ganzes gelesen werden'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Umlaute sind für `gets` kein Problem. Was sucht `gets`, um zu wissen, wo eine Zeile aufhört?
    solution: '`client.gets` liest bis zum nächsten Zeilenumbruch. Nach `choice=curry` kommt keiner, und der Browser wartet auf die Antwort, also warten beide. Nur `Content-Length` sagt, wann der Body zu Ende ist.'

    python:
      prompt: |
        Warum liest der Server den Body mit `reader.read` und der Zahl aus
        `Content-Length` und nicht mit `reader.readline`?
      check:
        type: choice
        options:
          - Hinter dem Body steht kein Zeilenumbruch, `reader.readline()` würde warten
          - '`readline` kann keine Umlaute und Sonderzeichen lesen'
          - '`read` ist schneller, weil es alles auf einmal liest'
          - 'Der Body ist verschlüsselt und muss als Ganzes gelesen werden'
        correct: 0
      feedback:
        - when: { picked: 1 }
          say: Umlaute sind für `readline` kein Problem. Was sucht `readline`, um zu wissen, wo eine Zeile aufhört?
      solution: '`reader.readline()` liest bis zum nächsten Zeilenumbruch. Nach `choice=curry` kommt keiner, und der Browser wartet auf die Antwort, also warten beide. Nur `Content-Length` sagt, wann der Body zu Ende ist.'

  - id: neu-laden
    title: Neu laden
    prediction: true
    prompt: |
      Du hast abgestimmt und siehst die Ergebnisseite. Was passiert, wenn du
      sie neu lädst? Überleg erst, dann probier es aus.
    check:
      type: choice
      options:
        - Der Browser holt `/results` noch einmal, die Zahlen bleiben gleich
        - Der Browser schickt die Stimme noch einmal, sie zählt doppelt
        - Der Browser fragt, ob er das Formular noch einmal senden soll
        - Der Server antwortet mit 405
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Was hat der Browser zuletzt geholt, `POST /vote` oder `GET /results`? Sieh links im Terminal nach.
      - when: { picked: 2 }
        say: Das fragt der Browser, wenn die Seite die Antwort auf ein `POST` ist. Hier ist sie die Antwort auf ein `GET`.
    solution: Nach `303 See Other` holt der Browser `/results` mit `GET`. Neuladen wiederholt nur dieses `GET`, die Stimme zählt einmal. Ohne die Weiterleitung wäre die Ergebnisseite die Antwort auf das `POST`, und Neuladen würde es noch einmal schicken.

