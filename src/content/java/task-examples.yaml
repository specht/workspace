# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
format: 1
activity: java
examples:
  hallo:
    pass:
      - files: { HelloWorld.java: HelloWorld.java }
      # die Form mit Klasse aus älteren Büchern geht auch
      - files: { HelloWorld.java: { text: "public class HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n    }\n}\n" } }
    fail:
      - files: { HelloWorld.java: error-HelloWorld.java }
        say: IO.println
      - files: { HelloWorld.java: { text: "IO.println(\"Hello, World!\");\n" } }
        say: void main
      - files: { HelloWorld.java: { text: "" } }
      - files: { helloworld.java: HelloWorld.java }
  uebersetzt:
    pass:
      - files: { HelloWorld.class: { text: "class file" } }
    fail:
      - files: { HelloWorld.java: HelloWorld.java }
        say: HelloWorld.class
  fehler:
    pass:
      - answer: method printn(String)
      - answer: printn
      - answer: 'symbol: method printn(String)'
    fail:
      - answer: println
      - answer: cannot find symbol
      - answer: String
  int-grenze:
    pass:
      - answer: NumberFormatException
      - answer: java.lang.NumberFormatException
    fail:
      - answer: InputMismatchException
      - answer: Exception
      - answer: main
  absteigend:
    pass:
      - files: { BubbleSort.java: { text: "public class BubbleSort {\n    public static void bubbleSort(int[] array) {\n        int n = array.length;\n        for (int i = 0; i < n - 1; i++) {\n            for (int j = 0; j < n - i - 1; j++) {\n                if (array[j] < array[j + 1]) {\n                    int temp = array[j];\n                    array[j] = array[j + 1];\n                    array[j + 1] = temp;\n                }\n            }\n        }\n    }\n}\n" } }
    fail:
      - files: { BubbleSort.java: BubbleSort.java }
        say: aufsteigend
