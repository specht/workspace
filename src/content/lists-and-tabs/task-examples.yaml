# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): Das fertige Blatt (stufen/) muss die Prüfung
# bestehen, die Vorlage (src/static/lists-and-tabs) an ihr scheitern.
# Beide macht dokumente.py.
format: 1
activity: lists-and-tabs
examples:
  packliste:
    pass:
      - document: stufen/packliste.docx
    fail:
      - document: ../../static/lists-and-tabs/03 Packliste.docx
        say: Tab
  runde:
    pass:
      - document: stufen/flohmarkt.docx
    fail:
      - document: ../../static/lists-and-tabs/03 Flohmarkt.docx
        say: getippt
  handgriffe:
    pass:
      - document: stufen/wandertag.docx
    fail:
      - document: ../../static/lists-and-tabs/03 Wandertag.docx
        say: linksbündiger Tabstopp
      - document: stufen/wandertag-eine-ebene.docx
        say: nicht auf Ebene 2
  fallen:
    pass:
      - document: stufen/sportfest.docx
    fail:
      - document: ../../static/lists-and-tabs/03 Sportfest.docx
        say: 0 von 8 Fallen gefunden
      - document: stufen/sportfest-sieben.docx
        say: 7 von 8 Fallen gefunden
