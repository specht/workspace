      ```ruby
      # Die Gatter sind schon da. Deine Funktion gibt ihre Eingänge nur an sie weiter.
      def not_(a)
        a == 1 ? 0 : 1
      end

      def and_(a, b)
        a == 1 && b == 1 ? 1 : 0
      end

      def or_(a, b)
        a == 1 || b == 1 ? 1 : 0
      end

      def xor_(a, b)
        a != b ? 1 : 0
      end

      def half_adder(a, b)
        [xor_(a, b), and_(a, b)]
      end

      def full_adder(a, b, c_in)
        s1, c1 = half_adder(a, b)
        s, c2 = half_adder(s1, c_in)
        [s, or_(c1, c2)]
      end

      def add4c(a, b, c)
        s = [0, 0, 0, 0]
        3.downto(0) do |i|
          s[i], c = full_adder(a[i], b[i], c)
        end
        [s, c]
      end

      def alu(op, a, b)
        if op == 'add' || op == 'sub'
          sub = op == 'sub' ? 1 : 0
          r, c = add4c(a, b.map { |bit| xor_(bit, sub) }, sub)
          cf = xor_(c, sub)
        else
          r = (0..3).map do |i|
            if op == 'and' then and_(a[i], b[i])
            elsif op == 'or' then or_(a[i], b[i])
            else xor_(a[i], b[i])
            end
          end
          cf = 0
        end
        zf = not_(or_(or_(r[0], r[1]), or_(r[2], r[3])))
        [r, zf, cf]
      end
      ```
