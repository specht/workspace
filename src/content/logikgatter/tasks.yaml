# Aufgaben zu »Vom Gatter zum Rechenwerk«, in Ruby und in Python (unter python:).
# Format: docs/aufgaben.md. Die Katas mit gates: (GateCheck) lassen die Eingänge
# nur durch die Gatter gehen. Eine Änderung an einer Kata gehört in beide Sprachen.
format: 1
activity: logikgatter
tasks:
  - id: de-morgan
    title: Zwei Schaltungen
    prediction: true
    prompt: |
      Rechne beide Schaltungen für alle vier Kombinationen von `a` und `b` im Kopf
      oder auf Papier durch. Für wie viele der vier Kombinationen liefern sie
      dasselbe?
    check:
      type: choice
      options:
        - Für keine
        - Für eine
        - Für zwei
        - Für alle vier
      correct: 3
      shuffle: false
    feedback:
      - when: { picked: 0 }
        say: Rechne eine Zeile von Hand, a = 0 und b = 0. Was liefert die erste Schaltung, was die zweite?
      - when: { picked: 1 }
        say: Rechne alle vier Zeilen. Eine Tabelle mit a, b und den beiden Ergebnissen nebeneinander hilft.
      - when: { picked: 2 }
        say: Rechne alle vier Zeilen. Eine Tabelle mit a, b und den beiden Ergebnissen nebeneinander hilft.
    hint: |
      Fang mit a = 0 und b = 0 an. Die erste Schaltung: 0 oder 0 ist 0, das NICHT
      macht daraus 1. Die zweite: nicht 0 ist 1, zweimal, und 1 und 1 ist 1.
    solution: |
      Für alle vier: Beide liefern 1, wenn a und b beide 0 sind, und sonst 0.

  - id: nand-not-and
    title: "NICHT und UND aus NAND"
    level: 1
    prompt: |
      Schreib `not_(a)` und `and_(a, b)` nur mit `nand`: Deine Funktionen geben ihre Eingänge an `nand` weiter und rechnen nicht selbst. Der Unterstrich ist nötig, weil `not` und `and` in Ruby schon Wörter der Sprache sind. Die Prüfung ruft `not_(0)`, `not_(1)` und `and_` für 00, 01, 10 und 11 auf, erst mit 0 und 1 und dann mit Signalen, die nur `nand` lesen kann.
    starter: |
      # Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.
      def nand(a, b)
        a == 1 && b == 1 ? 0 : 1
      end

      def not_(a)
      end

      def and_(a, b)
      end
    check:
      type: function
      language: ruby
      gates: [nand]
      cases:
        - call: "not_(0)"
          expect: "1"
        - call: "not_(1)"
          expect: "0"
        - call: "and_(0, 0)"
          expect: "0"
        - call: "and_(0, 1)"
          expect: "0"
        - call: "and_(1, 0)"
          expect: "0"
        - call: "and_(1, 1)"
          expect: "1"
    feedback:
      - when: { same_as: "# Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.\ndef nand(a, b)\n  a == 1 && b == 1 ? 0 : 1\nend\n\ndef not_(a)\n  nand(a, 0)\nend\n\ndef and_(a, b)\n  not_(nand(a, b))\nend\n" }
        say: "`nand(a, 0)` ist immer 1, was auch immer `a` ist: Eine 0 an einem Eingang reicht, und das UND im NAND ist 0. Was liefert `nand(a, a)`?"
      - when: { same_as: "# Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.\ndef nand(a, b)\n  a == 1 && b == 1 ? 0 : 1\nend\n\ndef not_(a)\n  nand(a, a)\nend\n\ndef and_(a, b)\n  nand(a, b)\nend\n" }
        say: "`and_` gibt noch das NAND selbst zurück, also genau das Gegenteil von UND. Dreh das Ergebnis mit deinem `not_` um."
    hint:
      - "Schau in die Wahrheitstabelle von NAND: Was kommt bei `nand(0, 0)` heraus und was bei `nand(1, 1)`, wenn also beide Eingänge gleich sind?"
      - "`not_(a)` ist ein `nand`, an dessen beiden Eingängen `a` liegt. Und ein UND ist ein NAND, dessen Ergebnis umgedreht wird: Dafür hast du jetzt `not_`."
    solution: |
      ```ruby
      # Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.
      def nand(a, b)
        a == 1 && b == 1 ? 0 : 1
      end

      def not_(a)
        nand(a, a)
      end

      def and_(a, b)
        not_(nand(a, b))
      end
      ```
    python:
      prompt: |
        Schreib `not_(a)` und `and_(a, b)` nur mit `nand`: Deine Funktionen geben ihre Eingänge an `nand` weiter und rechnen nicht selbst. Der Unterstrich ist nötig, weil `not` und `and` in Python schon Wörter der Sprache sind. Die Prüfung ruft `not_(0)`, `not_(1)` und `and_` für 00, 01, 10 und 11 auf, erst mit 0 und 1 und dann mit Signalen, die nur `nand` lesen kann.
      starter: |
        # Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.
        def nand(a, b):
            return 0 if a == 1 and b == 1 else 1

        def not_(a):
            pass

        def and_(a, b):
            pass
      check:
        type: function
        language: python
        gates: [nand]
        cases:
          - call: "not_(0)"
            expect: "1"
          - call: "not_(1)"
            expect: "0"
          - call: "and_(0, 0)"
            expect: "0"
          - call: "and_(0, 1)"
            expect: "0"
          - call: "and_(1, 0)"
            expect: "0"
          - call: "and_(1, 1)"
            expect: "1"
      feedback:
        - when: { same_as: "# Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.\ndef nand(a, b):\n    return 0 if a == 1 and b == 1 else 1\n\ndef not_(a):\n    return nand(a, 0)\n\ndef and_(a, b):\n    return not_(nand(a, b))\n" }
          say: "`nand(a, 0)` ist immer 1, was auch immer `a` ist: Eine 0 an einem Eingang reicht, und das UND im NAND ist 0. Was liefert `nand(a, a)`?"
        - when: { same_as: "# Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.\ndef nand(a, b):\n    return 0 if a == 1 and b == 1 else 1\n\ndef not_(a):\n    return nand(a, a)\n\ndef and_(a, b):\n    return nand(a, b)\n" }
          say: "`and_` gibt noch das NAND selbst zurück, also genau das Gegenteil von UND. Dreh das Ergebnis mit deinem `not_` um."
      hint:
        - "Schau in die Wahrheitstabelle von NAND: Was kommt bei `nand(0, 0)` heraus und was bei `nand(1, 1)`, wenn also beide Eingänge gleich sind?"
        - "`not_(a)` ist ein `nand`, an dessen beiden Eingängen `a` liegt. Und ein UND ist ein NAND, dessen Ergebnis umgedreht wird: Dafür hast du jetzt `not_`."
      solution: |
        ```python
        # Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.
        def nand(a, b):
            return 0 if a == 1 and b == 1 else 1

        def not_(a):
            return nand(a, a)

        def and_(a, b):
            return not_(nand(a, b))
        ```

  - id: nand-or-xor
    title: "ODER und XOR aus NAND"
    level: 3
    prompt: |
      Schreib `or_(a, b)` und `xor_(a, b)`, wieder nur mit `nand`. Deine Funktionen `not_` und `and_` aus der Karte davor darfst du hierher kopieren und benutzen. Die Prüfung ruft `or_` und `xor_` für 00, 01, 10 und 11 auf, erst mit 0 und 1 und dann mit Signalen, die nur `nand` lesen kann.
    starter: |
      # Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.
      def nand(a, b)
        a == 1 && b == 1 ? 0 : 1
      end

      # Hier darfst du not_ und and_ aus der Karte davor einfügen.

      def or_(a, b)
      end

      def xor_(a, b)
      end
    check:
      type: function
      language: ruby
      gates: [nand]
      cases:
        - call: "or_(0, 0)"
          expect: "0"
        - call: "or_(0, 1)"
          expect: "1"
        - call: "or_(1, 0)"
          expect: "1"
        - call: "or_(1, 1)"
          expect: "1"
        - call: "xor_(0, 0)"
          expect: "0"
        - call: "xor_(0, 1)"
          expect: "1"
        - call: "xor_(1, 0)"
          expect: "1"
        - call: "xor_(1, 1)"
          expect: "0"
    feedback:
      - when: { same_as: "# Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.\ndef nand(a, b)\n  a == 1 && b == 1 ? 0 : 1\nend\n\ndef not_(a)\n  nand(a, a)\nend\n\ndef or_(a, b)\n  nand(a, b)\nend\n\ndef xor_(a, b)\n  x = nand(a, b)\n  nand(nand(a, x), nand(b, x))\nend\n" }
        say: "`nand(a, b)` liefert für 00 eine 1, das ODER dort aber 0. Was muss mit den beiden Eingängen passieren, bevor sie ins NAND gehen?"
    hint:
      - "Für das ODER: Erinnere dich an die Regel von De Morgan oben. Wann ist `a` oder `b` gleich 0, und wie sieht das als UND aus?"
      - "a oder b ist dasselbe wie nicht ((nicht a) und (nicht b)). Welches Gatter rechnet »nicht (… und …)« in einem Schritt?"
      - "Für das XOR: Es ist 1, wenn `a` oder `b` 1 ist, aber nicht beide. Mit deinen Funktionen: das ODER von `a` und `b`, UND das NAND von `a` und `b`."
    solution: |
      ```ruby
      # Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.
      def nand(a, b)
        a == 1 && b == 1 ? 0 : 1
      end

      def not_(a)
        nand(a, a)
      end

      def or_(a, b)
        nand(not_(a), not_(b))
      end

      def xor_(a, b)
        x = nand(a, b)
        nand(nand(a, x), nand(b, x))
      end
      ```
    python:
      prompt: |
        Schreib `or_(a, b)` und `xor_(a, b)`, wieder nur mit `nand`. Deine Funktionen `not_` und `and_` aus der Karte davor darfst du hierher kopieren und benutzen. Die Prüfung ruft `or_` und `xor_` für 00, 01, 10 und 11 auf, erst mit 0 und 1 und dann mit Signalen, die nur `nand` lesen kann.
      starter: |
        # Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.
        def nand(a, b):
            return 0 if a == 1 and b == 1 else 1

        # Hier darfst du not_ und and_ aus der Karte davor einfügen.

        def or_(a, b):
            pass

        def xor_(a, b):
            pass
      check:
        type: function
        language: python
        gates: [nand]
        cases:
          - call: "or_(0, 0)"
            expect: "0"
          - call: "or_(0, 1)"
            expect: "1"
          - call: "or_(1, 0)"
            expect: "1"
          - call: "or_(1, 1)"
            expect: "1"
          - call: "xor_(0, 0)"
            expect: "0"
          - call: "xor_(0, 1)"
            expect: "1"
          - call: "xor_(1, 0)"
            expect: "1"
          - call: "xor_(1, 1)"
            expect: "0"
      feedback:
        - when: { same_as: "# Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.\ndef nand(a, b):\n    return 0 if a == 1 and b == 1 else 1\n\ndef not_(a):\n    return nand(a, a)\n\ndef or_(a, b):\n    return nand(a, b)\n\ndef xor_(a, b):\n    x = nand(a, b)\n    return nand(nand(a, x), nand(b, x))\n" }
          say: "`nand(a, b)` liefert für 00 eine 1, das ODER dort aber 0. Was muss mit den beiden Eingängen passieren, bevor sie ins NAND gehen?"
      hint:
        - "Für das ODER: Erinnere dich an die Regel von De Morgan oben. Wann ist `a` oder `b` gleich 0, und wie sieht das als UND aus?"
        - "a oder b ist dasselbe wie nicht ((nicht a) und (nicht b)). Welches Gatter rechnet »nicht (… und …)« in einem Schritt?"
        - "Für das XOR: Es ist 1, wenn `a` oder `b` 1 ist, aber nicht beide. Mit deinen Funktionen: das ODER von `a` und `b`, UND das NAND von `a` und `b`."
      solution: |
        ```python
        # Gegeben: das NAND-Gatter. Deine Funktionen geben ihre Eingänge nur an nand weiter.
        def nand(a, b):
            return 0 if a == 1 and b == 1 else 1

        def not_(a):
            return nand(a, a)

        def or_(a, b):
            return nand(not_(a), not_(b))

        def xor_(a, b):
            x = nand(a, b)
            return nand(nand(a, x), nand(b, x))
        ```

  - id: half-adder-gates
    title: Summe und Übertrag
    prompt: |
      Welche Gatter liefern die Summe `s` und den Übertrag `c`? Vergleich die
      beiden Spalten der Tabelle mit den Wahrheitstabellen der Gatter oben.
    check:
      type: choice
      options:
        - "s: ODER, c: UND"
        - "s: XOR, c: UND"
        - "s: UND, c: XOR"
        - "s: XOR, c: ODER"
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: ODER liefert für 1 und 1 eine 1, die Summe ist dort aber 0.
      - when: { picked: 2 }
        say: Umgekehrt. UND ist nur für 1 und 1 gleich 1. Welche der beiden Spalten ist das?
      - when: { picked: 3 }
        say: ODER liefert schon für 0 und 1 eine 1, einen Übertrag gibt es dort aber nicht.
    solution: |
      Die Summe ist XOR: 1, wenn genau eins der beiden Bits 1 ist. Der Übertrag ist
      UND: 1 nur bei 1 + 1.

  - id: half-adder
    title: "Ein Halbaddierer"
    level: 1
    prompt: |
      Schreib `half_adder(a, b)`. Es gibt eine Liste `[s, c]` zurück, die Summe und den Übertrag: `half_adder(1, 1)` ergibt `[0, 1]`. Die Gatter `not_`, `and_`, `or_` und `xor_` stehen schon da, und deine Funktion gibt ihre Eingänge nur an sie weiter. Die Prüfung ruft `half_adder` für 00, 01, 10 und 11 auf, erst mit 0 und 1 und dann mit Signalen, die nur die Gatter lesen können.
    starter: |
      # Die Gatter sind schon da. Deine Funktion gibt ihre Eingänge nur an sie weiter.
      def not_(a)
        a == 1 ? 0 : 1
      end

      def and_(a, b)
        a == 1 && b == 1 ? 1 : 0
      end

      def or_(a, b)
        a == 1 || b == 1 ? 1 : 0
      end

      def xor_(a, b)
        a != b ? 1 : 0
      end

      def half_adder(a, b)
      end
    check:
      type: function
      language: ruby
      gates: [not_, and_, or_, xor_]
      cases:
        - call: "half_adder(0, 0)"
          expect: "[0, 0]"
        - call: "half_adder(0, 1)"
          expect: "[1, 0]"
        - call: "half_adder(1, 0)"
          expect: "[1, 0]"
        - call: "half_adder(1, 1)"
          expect: "[0, 1]"
    feedback:
      - when: { same_as: "# Die Gatter sind schon da. Deine Funktion gibt ihre Eingänge nur an sie weiter.\ndef not_(a)\n  a == 1 ? 0 : 1\nend\n\ndef and_(a, b)\n  a == 1 && b == 1 ? 1 : 0\nend\n\ndef or_(a, b)\n  a == 1 || b == 1 ? 1 : 0\nend\n\ndef xor_(a, b)\n  a != b ? 1 : 0\nend\n\ndef half_adder(a, b)\n  [or_(a, b), and_(a, b)]\nend\n" }
        say: "Mit ODER wäre die Summe von 1 und 1 gleich 1, im Zweiersystem ist 1 + 1 aber `10`: Summe 0, Übertrag 1."
    hint:
      - "Oben hast du herausgefunden, welches Gatter die Summe liefert und welches den Übertrag. Beide bekommen `a` und `b`."
      - "Zurück kommt eine Liste mit zwei Einträgen: zuerst das Ergebnis des einen Gatters, dann das des anderen."
    solution: |
      ```ruby
      # Die Gatter sind schon da. Deine Funktion gibt ihre Eingänge nur an sie weiter.
      def not_(a)
        a == 1 ? 0 : 1
      end

      def and_(a, b)
        a == 1 && b == 1 ? 1 : 0
      end

      def or_(a, b)
        a == 1 || b == 1 ? 1 : 0
      end

      def xor_(a, b)
        a != b ? 1 : 0
      end

      def half_adder(a, b)
        [xor_(a, b), and_(a, b)]
      end
      ```
    python:
      prompt: |
        Schreib `half_adder(a, b)`. Es gibt eine Liste `[s, c]` zurück, die Summe und den Übertrag: `half_adder(1, 1)` ergibt `[0, 1]`. Die Gatter `not_`, `and_`, `or_` und `xor_` stehen schon da, und deine Funktion gibt ihre Eingänge nur an sie weiter. Die Prüfung ruft `half_adder` für 00, 01, 10 und 11 auf, erst mit 0 und 1 und dann mit Signalen, die nur die Gatter lesen können.
      starter: |
        # Die Gatter sind schon da. Deine Funktion gibt ihre Eingänge nur an sie weiter.
        def not_(a):
            return 0 if a == 1 else 1

        def and_(a, b):
            return 1 if a == 1 and b == 1 else 0

        def or_(a, b):
            return 1 if a == 1 or b == 1 else 0

        def xor_(a, b):
            return 1 if a != b else 0

        def half_adder(a, b):
            pass
      check:
        type: function
        language: python
        gates: [not_, and_, or_, xor_]
        cases:
          - call: "half_adder(0, 0)"
            expect: "[0, 0]"
          - call: "half_adder(0, 1)"
            expect: "[1, 0]"
          - call: "half_adder(1, 0)"
            expect: "[1, 0]"
          - call: "half_adder(1, 1)"
            expect: "[0, 1]"
      feedback:
        - when: { same_as: "# Die Gatter sind schon da. Deine Funktion gibt ihre Eingänge nur an sie weiter.\ndef not_(a):\n    return 0 if a == 1 else 1\n\ndef and_(a, b):\n    return 1 if a == 1 and b == 1 else 0\n\ndef or_(a, b):\n    return 1 if a == 1 or b == 1 else 0\n\ndef xor_(a, b):\n    return 1 if a != b else 0\n\ndef half_adder(a, b):\n    return xor_(a, b), and_(a, b)\n" }
          say: "`return s, c` gibt in Python ein Tupel `(s, c)` zurück, keine Liste. Die Aufgabe will eine Liste: `return [s, c]`."
        - when: { same_as: "# Die Gatter sind schon da. Deine Funktion gibt ihre Eingänge nur an sie weiter.\ndef not_(a):\n    return 0 if a == 1 else 1\n\ndef and_(a, b):\n    return 1 if a == 1 and b == 1 else 0\n\ndef or_(a, b):\n    return 1 if a == 1 or b == 1 else 0\n\ndef xor_(a, b):\n    return 1 if a != b else 0\n\ndef half_adder(a, b):\n    return [or_(a, b), and_(a, b)]\n" }
          say: "Mit ODER wäre die Summe von 1 und 1 gleich 1, im Zweiersystem ist 1 + 1 aber `10`: Summe 0, Übertrag 1."
      hint:
        - "Oben hast du herausgefunden, welches Gatter die Summe liefert und welches den Übertrag. Beide bekommen `a` und `b`."
        - "Zurück kommt eine Liste mit zwei Einträgen: zuerst das Ergebnis des einen Gatters, dann das des anderen."
      solution: |
        ```python
        # Die Gatter sind schon da. Deine Funktion gibt ihre Eingänge nur an sie weiter.
        def not_(a):
            return 0 if a == 1 else 1

        def and_(a, b):
            return 1 if a == 1 and b == 1 else 0

        def or_(a, b):
            return 1 if a == 1 or b == 1 else 0

        def xor_(a, b):
            return 1 if a != b else 0

        def half_adder(a, b):
            return [xor_(a, b), and_(a, b)]
        ```

  - id: full-adder-rows
    title: Wann gibt es einen Übertrag?
    prompt: |
      In wie vielen der acht Zeilen der Wahrheitstabelle eines Volladdierers ist
      `c_out` gleich 1?
    check:
      type: number
      expect: 4
    feedback:
      - when: { equals: 1 }
        say: Nur bei 1 + 1 + 1? Auch 1 + 1 + 0 = 10 ergibt einen Übertrag.
      - when: { equals: 3 }
        say: Fast. Hast du 111 mitgezählt? 1 + 1 + 1 = 11 hat auch einen Übertrag.
    hint: |
      Schreib die acht Zeilen auf, von 000 bis 111, und rechne in jeder a + b + c_in
      im Zweiersystem aus. Der Übertrag ist die linke Ziffer.
    solution: |
      In vier Zeilen: 011, 101, 110 und 111. Ein Übertrag entsteht, sobald
      mindestens zwei der drei Bits 1 sind.

  - id: full-adder
    title: "Ein Volladdierer"
    level: 2
    prompt: |
      Schreib `full_adder(a, b, c_in)`, das `[s, c_out]` zurückgibt: `full_adder(1, 1, 1)` ergibt `[1, 1]`, denn 1 + 1 + 1 ist im Zweiersystem `11`. Bau ihn aus zwei Halbaddierern; deinen `half_adder` darfst du dafür hierher kopieren. Die Prüfung ruft `full_adder` für alle acht Kombinationen auf, erst mit 0 und 1 und dann mit Signalen, die nur die Gatter lesen können.
    starter: |
      # Die Gatter sind schon da. Deine Funktion gibt ihre Eingänge nur an sie weiter.
      def not_(a)
        a == 1 ? 0 : 1
      end

      def and_(a, b)
        a == 1 && b == 1 ? 1 : 0
      end

      def or_(a, b)
        a == 1 || b == 1 ? 1 : 0
      end

      def xor_(a, b)
        a != b ? 1 : 0
      end

      # Hier darfst du half_adder aus der Karte »Ein Halbaddierer« einfügen.

      def full_adder(a, b, c_in)
      end
    check:
      type: function
      language: ruby
      gates: [not_, and_, or_, xor_]
      cases:
        - call: "full_adder(0, 0, 0)"
          expect: "[0, 0]"
        - call: "full_adder(0, 0, 1)"
          expect: "[1, 0]"
        - call: "full_adder(0, 1, 0)"
          expect: "[1, 0]"
        - call: "full_adder(0, 1, 1)"
          expect: "[0, 1]"
        - call: "full_adder(1, 0, 0)"
          expect: "[1, 0]"
        - call: "full_adder(1, 0, 1)"
          expect: "[0, 1]"
        - call: "full_adder(1, 1, 0)"
          expect: "[0, 1]"
        - call: "full_adder(1, 1, 1)"
          expect: "[1, 1]"
    feedback:
