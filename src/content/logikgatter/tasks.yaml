  - id: sub-trick
    title: Subtrahieren mit einem Addierer
    prompt: |
      Ein Rechenwerk hat nur einen Addierer. Wie rechnet es `0101` − `0011`, also
      5 − 3, mit 4 Bit?
    check:
      type: choice
      options:
        - "0101 + 1100 + 1: b mit allen Bits umgedreht, und 1 dazu"
        - "0101 + 1100: b mit allen Bits umgedreht"
        - "0101 + 0011, danach alle Bits umdrehen"
        - "Gar nicht: Dafür braucht es ein eigenes Subtrahierwerk."
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: "Rechne nach: 0101 + 1100 = 1 0001, mit 4 Bit also 0001. Das ist um eins zu klein."
      - when: { picked: 2 }
        say: "0101 + 0011 = 1000, umgedreht 0111, also 7. Gesucht ist 2."
      - when: { picked: 3 }
        say: Es geht mit dem Addierer, dank des Zweierkomplements aus der Kata »Negative Zahlen in einem Byte«.
    hint: |
      Im Zweierkomplement mit 4 Bit ist −3 dasselbe wie 16 − 3 = 13, also 1101. Wie
      kommst du von 0011 auf 1101?
    solution: |
      0101 + 1100 + 1 = 1 0010, mit 4 Bit 0010, also 2. 1100 + 1 = 1101 ist
      16 − 3, das Zweierkomplement von 3.

