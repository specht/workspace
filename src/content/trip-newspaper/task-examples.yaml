# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): Der fertige Artikel muss die Prüfung bestehen; die
# leere Vorlage und derselbe Artikel, eilig gebaut, scheitern. Als PDF
# besteht der Artikel, die leere Vorlage nicht. Alle macht dokumente.py.
format: 1
activity: trip-newspaper
examples:
  artikel:
    pass:
      - document: stufen/artikel.docx
    fail:
      - document: ../../static/trip-newspaper/10 Artikel.docx
        say: Wörter
      - document: stufen/artikel-eilig.docx
        say: Listenzeichen
      - document: stufen/artikel-eilig.docx
        say: getippt
      - document: stufen/artikel-eilig.docx
        say: keinen Alternativtext
  pdf:
    pass:
      - document: stufen/artikel.pdf
    fail:
      - document: stufen/vorlage.pdf
        say: Wörter
  eilig:
    pass:
      - document: stufen/artikel.docx
    fail:
      - document: ../../static/trip-newspaper/10 Artikel in Eile.docx
        say: Listenzeichen
      - document: ../../static/trip-newspaper/10 Artikel in Eile.docx
        say: unterstrichen
  kasten:
    pass:
      - document: stufen/kasten-word.docx
      - document: stufen/kasten-libreoffice.docx
    fail:
      - document: ../../static/trip-newspaper/10 Kletterwald.docx
        say: noch kein Rahmen
      - document: stufen/kasten-ohne-farbe.docx
        say: noch keine Farbe
