  - id: square-function
    title: "Quadrate jeder Größe"
    level: 2
    prompt: |
      Schreib eine Funktion `square(size)`, die ein Quadrat mit der Seitenlänge `size` zeichnet. Unten im Programm zeichnet `square(150)` eins.
    starter: |
      def square(size)
      end

      square(150)
    check:
      type: "turtle"
      language: "ruby"
      cases:
        - call: "square(150)"
          draw: "4.times { forward 150; left 90 }"
        - call: "square(40)"
          draw: "4.times { forward 40; left 90 }"
      commands: [forward, back, left, right]
    hint:
      - "Das Quadrat mit der Schleife von eben gehört in die Funktion, eingerückt."
      - "Statt `100` steht dort `size`: Dann zeichnet `square(40)` die Seiten 40 Schritte lang."
    solution: |
      ```ruby
      def square(size)
        4.times do
          forward size
          left 90
        end
      end

      square(150)
      ```
    python:
      prompt: |
        Schreib eine Funktion `square(size)`, die ein Quadrat mit der Seitenlänge `size` zeichnet. Unten im Programm zeichnet `square(150)` eins.
      starter: |
        def square(size):
            pass

        square(150)
      check:
        type: "turtle"
        language: "python"
        cases:
          - call: "square(150)"
            draw: "4.times { forward 150; left 90 }"
          - call: "square(40)"
            draw: "4.times { forward 40; left 90 }"
        commands: [forward, back, left, right]
      hint:
        - "Das Quadrat mit der Schleife von eben gehört in die Funktion, eingerückt."
        - "Statt `100` steht dort `size`: Dann zeichnet `square(40)` die Seiten 40 Schritte lang."
      solution: |
        ```python
        def square(size):
            for i in range(4):
                forward(size)
                left(90)

        square(150)
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `square(size)`, die ein Quadrat mit der Seitenlänge `size` zeichnet. Unten im Programm zeichnet `square(150)` eins.
      starter: |
        function square(size) {
        }

        square(150);
      check:
        type: "turtle"
        language: "javascript"
        cases:
          - call: "square(150)"
            draw: "4.times { forward 150; left 90 }"
          - call: "square(40)"
            draw: "4.times { forward 40; left 90 }"
        commands: [forward, back, left, right]
      hint:
        - "Das Quadrat mit der Schleife von eben gehört in die Funktion, eingerückt."
        - "Statt `100` steht dort `size`: Dann zeichnet `square(40)` die Seiten 40 Schritte lang."
      solution: |
        ```javascript
