    check:
      type: "turtle"
      language: "ruby"
      draw: "4.times { forward 100; left 90 }"
      max_lines: 4
      commands: [forward, back, left, right]
    hint:
      - "Wiederholt werden zwei Befehle: 100 vorwärts und 90 nach links."
      - "`4.times do`, darunter die beiden Befehle eingerückt, dann `end`."
    solution: |
      ```ruby
      4.times do
        forward 100
        left 90
      end
      ```
