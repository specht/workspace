  - id: polygon
    title: "Vielecke"
    level: 3
    prompt: |
      Schreib eine Funktion `polygon(corners, side)`, die ein Vieleck mit `corners` Ecken und gleich langen Seiten der Länge `side` zeichnet: `polygon(5, 100)` ein Fünfeck, `polygon(8, 60)` ein Achteck.
    starter: |
      def polygon(corners, side)
      end

      polygon(5, 100)
    check:
      type: "turtle"
      language: "ruby"
      cases:
        - call: "polygon(5, 100)"
          draw: "5.times { forward 100; left 72 }"
        - call: "polygon(8, 60)"
          draw: "8.times { forward 60; left 45 }"
        - call: "polygon(7, 80)"
          draw: "7.times { forward 80; left 360.0 / 7 }"
      commands: [forward, back, left, right]
    hint:
      - "Die Schleife läuft so oft, wie das Vieleck Ecken hat: `corners` mal."
      - "An allen Ecken zusammen dreht sich die Schildkröte einmal ganz herum, um 360 Grad. An einer Ecke ist es also 360 geteilt durch die Zahl der Ecken."
      - "In Ruby ist `360 / 7` eine ganze Zahl, 51, und das Siebeneck schließt sich nicht. Mit `360.0 / corners` rechnet Ruby mit Kommazahlen."
    solution: |
      ```ruby
      def polygon(corners, side)
        corners.times do
          forward side
          left 360.0 / corners
        end
      end

      polygon(5, 100)
      ```
    python:
      prompt: |
        Schreib eine Funktion `polygon(corners, side)`, die ein Vieleck mit `corners` Ecken und gleich langen Seiten der Länge `side` zeichnet: `polygon(5, 100)` ein Fünfeck, `polygon(8, 60)` ein Achteck.
      starter: |
        def polygon(corners, side):
            pass

        polygon(5, 100)
      check:
        type: "turtle"
        language: "python"
        cases:
          - call: "polygon(5, 100)"
            draw: "5.times { forward 100; left 72 }"
          - call: "polygon(8, 60)"
            draw: "8.times { forward 60; left 45 }"
          - call: "polygon(7, 80)"
            draw: "7.times { forward 80; left 360.0 / 7 }"
        commands: [forward, back, left, right]
      hint:
        - "Die Schleife läuft so oft, wie das Vieleck Ecken hat: `corners` mal."
        - "An allen Ecken zusammen dreht sich die Schildkröte einmal ganz herum, um 360 Grad. An einer Ecke ist es also 360 geteilt durch die Zahl der Ecken."
        - "`360 / corners` ergibt in Python eine Kommazahl, auch bei 7 Ecken; `360 // corners` würde abrunden, und das Siebeneck schlösse sich nicht."
      solution: |
        ```python
        def polygon(corners, side):
            for i in range(corners):
                forward(side)
                left(360 / corners)

        polygon(5, 100)
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `polygon(corners, side)`, die ein Vieleck mit `corners` Ecken und gleich langen Seiten der Länge `side` zeichnet: `polygon(5, 100)` ein Fünfeck, `polygon(8, 60)` ein Achteck.
      starter: |
        function polygon(corners, side) {
        }

        polygon(5, 100);
      check:
        type: "turtle"
        language: "javascript"
        cases:
          - call: "polygon(5, 100)"
            draw: "5.times { forward 100; left 72 }"
          - call: "polygon(8, 60)"
            draw: "8.times { forward 60; left 45 }"
          - call: "polygon(7, 80)"
            draw: "7.times { forward 80; left 360.0 / 7 }"
        commands: [forward, back, left, right]
      hint:
        - "Die Schleife läuft so oft, wie das Vieleck Ecken hat: `corners` mal."
        - "An allen Ecken zusammen dreht sich die Schildkröte einmal ganz herum, um 360 Grad. An einer Ecke ist es also 360 geteilt durch die Zahl der Ecken."
        - "`360 / corners` ergibt in JavaScript eine Kommazahl, auch bei 7 Ecken."
      solution: |
        ```javascript
        function polygon(corners, side) {
          for (let i = 0; i < corners; i++) {
            forward(side);
            left(360 / corners);
          }
        }

        polygon(5, 100);
        ```

