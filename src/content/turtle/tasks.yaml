# Aufgaben zu »Turtle: Bilder aus Befehlen«. Format: docs/aufgaben.md (turtle).
# Geschrieben von einem Skript aus einer Beschreibung je Aufgabe; die Bilder
# (draw) sind Ruby mit denselben Befehlen, für alle drei Sprachen.
format: 1
activity: turtle
tasks:

  - id: steps
    title: "Eine Treppe"
    level: 1
    prompt: |
      Die Schildkröte soll eine Treppe mit drei Stufen zeichnen, jede 50 Schritte breit und 50 Schritte hoch. Die erste Stufe steht schon da: Ergänze die beiden anderen.
    starter: |
      forward 50
      left 90
      forward 50
      right 90
    check:
      type: "turtle"
      language: "ruby"
      draw: "3.times { forward 50; left 90; forward 50; right 90 }"
      commands: [forward, back, left, right]
    hint:
      - "Eine Stufe sind vier Befehle: ein Stück nach rechts, eine Drehung nach oben, ein Stück nach oben und eine Drehung zurück."
      - "Schreib die vier Zeilen der ersten Stufe noch zweimal darunter."
    solution: |
      ```ruby
      forward 50
      left 90
      forward 50
      right 90
      forward 50
      left 90
      forward 50
      right 90
      forward 50
      left 90
      forward 50
      right 90
      ```
    python:
      prompt: |
        Die Schildkröte soll eine Treppe mit drei Stufen zeichnen, jede 50 Schritte breit und 50 Schritte hoch. Die erste Stufe steht schon da: Ergänze die beiden anderen.
      starter: |
        forward(50)
        left(90)
        forward(50)
        right(90)
      check:
        type: "turtle"
        language: "python"
        draw: "3.times { forward 50; left 90; forward 50; right 90 }"
        commands: [forward, back, left, right]
      hint:
        - "Eine Stufe sind vier Befehle: ein Stück nach rechts, eine Drehung nach oben, ein Stück nach oben und eine Drehung zurück."
        - "Schreib die vier Zeilen der ersten Stufe noch zweimal darunter."
      solution: |
        ```python
        forward(50)
        left(90)
        forward(50)
        right(90)
        forward(50)
        left(90)
        forward(50)
        right(90)
        forward(50)
        left(90)
        forward(50)
        right(90)
        ```
    javascript:
      prompt: |
        Die Schildkröte soll eine Treppe mit drei Stufen zeichnen, jede 50 Schritte breit und 50 Schritte hoch. Die erste Stufe steht schon da: Ergänze die beiden anderen.
      starter: |
        forward(50);
        left(90);
        forward(50);
        right(90);
      check:
        type: "turtle"
        language: "javascript"
        draw: "3.times { forward 50; left 90; forward 50; right 90 }"
        commands: [forward, back, left, right]
      hint:
        - "Eine Stufe sind vier Befehle: ein Stück nach rechts, eine Drehung nach oben, ein Stück nach oben und eine Drehung zurück."
        - "Schreib die vier Zeilen der ersten Stufe noch zweimal darunter."
      solution: |
        ```javascript
