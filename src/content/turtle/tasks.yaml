  - id: sierpinski
    title: "Das Sierpiński-Dreieck"
    level: 3
    extra: true
    prompt: |
      Schreib `sierpinski(size, depth)` für das Dreieck aus dem Bild oben, mit Seiten der Länge `size`. Danach steht die Schildkröte wieder, wo sie angefangen hat, und schaut wie vorher.
    starter: |
      def sierpinski(size, depth)
      end

      sierpinski(256, 4)
    check:
      type: "turtle"
      language: "ruby"
      cases:
        - call: "sierpinski(256, 0)"
          draw: |
            def sierpinski(size, depth)
              return 3.times { forward size; left 120 } if depth == 0
              half = size / 2.0
              sierpinski(half, depth - 1); forward half
              sierpinski(half, depth - 1); back half
              left 60; forward half; right 60
              sierpinski(half, depth - 1)
              left 60; back half; right 60
            end
            sierpinski(256, 0)
        - call: "sierpinski(256, 1)"
          draw: |
            def sierpinski(size, depth)
              return 3.times { forward size; left 120 } if depth == 0
              half = size / 2.0
              sierpinski(half, depth - 1); forward half
              sierpinski(half, depth - 1); back half
              left 60; forward half; right 60
              sierpinski(half, depth - 1)
              left 60; back half; right 60
            end
            sierpinski(256, 1)
        - call: "sierpinski(256, 4)"
          draw: |
            def sierpinski(size, depth)
              return 3.times { forward size; left 120 } if depth == 0
              half = size / 2.0
              sierpinski(half, depth - 1); forward half
              sierpinski(half, depth - 1); back half
              left 60; forward half; right 60
              sierpinski(half, depth - 1)
              left 60; back half; right 60
            end
            sierpinski(256, 4)
      commands: [forward, back, left, right]
      show: 2
    hint:
      - "Die Stufe 0 ist das Dreieck von ganz am Anfang, mit `size` statt 150."
      - "Jede andere Stufe besteht aus drei Dreiecken der Stufe darunter, halb so groß: `sierpinski(size / 2, depth - 1)`, links unten, rechts unten und oben. In Ruby `size / 2.0`."
      - "Zwischen ihnen läuft die Schildkröte: die halbe Seite nach rechts für das zweite; zurück und die halbe linke Seite hinauf (60 nach links, vorwärts, 60 nach rechts) für das dritte; dann denselben Weg zurück."
    solution: |
      ```ruby
      def sierpinski(size, depth)
        if depth == 0
          3.times do
            forward size
            left 120
          end
          return
        end
        half = size / 2.0
        sierpinski(half, depth - 1)
        forward half
        sierpinski(half, depth - 1)
        back half
        left 60
        forward half
        right 60
        sierpinski(half, depth - 1)
        left 60
        back half
        right 60
      end

