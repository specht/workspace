# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): Der fertige Artikel (stufen/kraniche.docx, von
# LibreOffice gebaut: das Foto mit Unterschrift in einem Rahmen rechts) muss
# die Prüfung bestehen, die Vorlage an ihr scheitern, und der Artikel mit
# noch getippten Nummern an den Unterschriften. Alle macht dokumente.py.
format: 1
activity: pictures-in-text
examples:
  artikel:
    pass:
      - document: stufen/kraniche.docx
    fail:
      - document: ../../static/pictures-in-text/05 Kraniche.docx
        say: Breite gezogen
      - document: ../../static/pictures-in-text/05 Kraniche.docx
        say: keinen Alternativtext
      - document: ../../static/pictures-in-text/05 Kraniche.docx
        say: wie ein großer Buchstabe
      - document: stufen/kraniche-getippt.docx
        say: getippte Nummern
  runde:
    pass:
      - document: stufen/vogelhaeuser.docx
    fail:
      - document: ../../static/pictures-in-text/05 Vogelhaeuser.docx
        say: Breite gezogen
  zuschneiden:
    pass:
      - document: stufen/tier-des-monats.docx
      - document: stufen/tier-des-monats-libreoffice.docx
    fail:
      - document: ../../static/pictures-in-text/05 Tier des Monats.docx
        say: noch nicht zugeschnitten
      - document: stufen/tier-des-monats-ohne-kopf.docx
        say: Oben ist zu viel weggeschnitten
      - document: stufen/tier-des-monats-gestaucht.docx
        say: in die Höhe gezogen
  fallen:
    pass:
      - document: stufen/schulfest.docx
    fail:
      - document: ../../static/pictures-in-text/05 Schulfest.docx
        say: 0 von 10 Fallen gefunden
      - document: stufen/schulfest-neun.docx
        say: 9 von 10 Fallen gefunden
