# Aufgaben zu »Was das Auge nicht sieht«. Format: docs/aufgaben.md.
# Die Vorlage (src/static/formatting-marks/01 Einladung.docx) und die
# gebaute Einladung (stufen/einladung.docx) macht dokumente.py.
format: 1
activity: formatting-marks
tasks:
  - id: groesser
    title: Eine Stufe größer
    prediction: true
    prompt: |
      Die Klassenleitung will die Einladung besser lesbar machen: Sie markiert
      alles und macht die Schrift überall eine Stufe größer, im Brief von 12 auf
      14 pt. Was passiert mit der Einladung?
    check:
      type: choice
      options:
        - Sie wird nur größer. Alles bleibt, wo es war.
        - Die Überschrift bleibt in der Mitte und das Datum rechts; nur der Brief braucht mehr Zeilen.
        - Die Überschrift rückt nach rechts, das Datum rutscht in eine neue Zeile, und im Brief folgt auf jede lange Zeile eine kurze.
        - Der Brief bleibt, wie er ist, weil er schon über die ganze Breite geht.
      correct: 2
      shuffle: false
    feedback:
      - when: { picked: 0 }
        say: So wäre es, wenn die Einladung ordentlich gebaut wäre. Ob sie das ist, sieht man auf dem Papier nicht.
      - when: { picked: 1 }
        say: Das wäre richtig, wenn die Überschrift wirklich zentriert und das Datum wirklich rechtsbündig wäre.
    solution: |
      Die Überschrift und das Datum stehen nur mit Leerzeichen an ihrem Platz,
      und am Ende jeder Zeile des Briefs steht ein Zeilenumbruch von Hand. Mit
      größerer Schrift werden die Leerzeichen breiter und die Zeilen länger.

  - id: absaetze
    title: Absätze zählen
    prompt: |
      Schalte die Formatierungszeichen ein. Wie viele Absätze hat die
      Einladung? Zähl jedes ¶, auch die allein in einer Zeile.
    check:
      type: number
      expect: 16
      tolerance: 0
    feedback:
      - when: { between: [9, 9] }
        say: Das sind die Absätze mit Text. Die leeren Zeilen sind auch Absätze, jede mit ihrem ¶.
      - when: { between: [18, 18] }
        say: Der Brief geht über drei Zeilen, ist aber ein einziger Absatz. Am Ende seiner ersten beiden Zeilen steht ↵, nicht ¶.
    hint:
      - Ein Absatz endet mit ¶. Ein ↵ beendet nur die Zeile, nicht den Absatz.
      - Die Überschrift, die Zeile darunter und das Datum sind schon drei; zähl die leeren Zeilen dazwischen mit.
    solution: |
      16: neun Absätze mit Text und sieben leere.

  - id: zeilenende
    title: Am Ende der ersten Zeile
    prompt: |
      Welches Zeichen steht am Ende der ersten Zeile des Briefs, hinter
      »Auf dem«?
    check:
      type: choice
      options:
        - "¶: Dort endet ein Absatz."
        - "↵: ein Zeilenumbruch von Hand"
        - "Nichts: Dort hat das Programm die Zeile umgebrochen."
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: Sieh genau hin. Der Pfeil ↵ und das ¶ sehen verschieden aus.
      - when: { picked: 2 }
        say: Bricht das Programm um, steht am Zeilenende tatsächlich nichts. Hier steht aber etwas.
    solution: |
      Ein ↵: Jemand hat <kbd>Shift</kbd>+<kbd>Enter</kbd> gedrückt, wie
      früher den Hebel an der Schreibmaschine.

  - id: einladung
    title: Die Einladung, sauber gebaut
    # passed after many checks: another round; after one or two: the traps
    next:
      practice: runde
      challenge: fallen
    prompt: |
      Prüfe deine Einladung. Die Prüfung liest dein Dokument und markiert auf
      deiner Seite jede Stelle, an der noch etwas fehlt. Speichere in Word oder
      LibreOffice, bevor du prüfst.
    check:
      type: document
      file: formatting-marks/01 Einladung.docx
      # the letter's date is the day of the download, the Elternabend a
      # Tuesday at least a week later (»am Dienstag, dem 9. März«)
      dates:
        '2. März': heute
        '9. März': Dienstag
      rules:
        - text
        - spaces
        - empty_paragraphs
        - line_breaks
        - { align: center, paragraph: 'Einladung zum Elternabend' }
        - { align: center, paragraph: 'Klassenfahrt der 7b an den Kranichsee' }
        - { align: right, paragraph: '2. März' }
        - { gaps: 6pt, before: ['Liebe Eltern', 'im Mai fährt', 'Der Elternabend ist', 'Bitte sagen Sie', 'Mit freundlichen Grüßen'] }
    hint:
      - "Schalte zuerst die Formatierungszeichen ein: im Programm unter *Ansicht* oder mit dem Knopf **¶**. Lösch dann jeden Punkt (·) vor einem Wort am Zeilenanfang, jedes ¶ allein in einer Zeile und jedes ↵ am Zeilenende: Stell den Cursor davor und drück <kbd>Entf</kbd>."
      - "Stell den Cursor in den Absatz, den du ändern willst. Zentrieren und rechtsbündig: die Knöpfe neben fett und kursiv. Den Abstand nach einem Absatz: im Absatz-Dialog, im Feld für den Abstand danach."
      - "Doppelte Leerzeichen findet <kbd>Strg</kbd>+<kbd>H</kbd>: Such nach zwei Leerzeichen, ersetze durch eins und klick *Alle ersetzen*. Speichere danach und prüfe noch einmal."
    word:
      hint:
        - "Schalte zuerst die Formatierungszeichen ein: im Register *Start* mit dem Knopf **¶**. Lösch dann jeden Punkt (·) vor einem Wort am Zeilenanfang, jedes ¶ allein in einer Zeile und jedes ↵ am Zeilenende: Stell den Cursor davor und drück <kbd>Entf</kbd>."
        - "Stell den Cursor in den Absatz, den du ändern willst. Zentrieren und rechtsbündig: im Register *Start* in der Gruppe *Absatz*, oder <kbd>Strg</kbd>+<kbd>E</kbd> und <kbd>Strg</kbd>+<kbd>R</kbd>. Den Abstand nach einem Absatz: im Register *Layout*, im Feld *Abstand: Nach*."
        - "Doppelte Leerzeichen findet <kbd>Strg</kbd>+<kbd>H</kbd>: Such nach zwei Leerzeichen, ersetze durch eins und klick *Alle ersetzen*. Speichere danach und prüfe noch einmal."
    libreoffice:
      hint:
        - "Schalte zuerst die Formatierungszeichen ein: *Ansicht* <i class='bi bi-chevron-right' aria-hidden='true'></i> *Formatierungszeichen* oder <kbd>Strg</kbd>+<kbd>F10</kbd>. Lösch dann jeden Punkt (·) vor einem Wort am Zeilenanfang, jedes ¶ allein in einer Zeile und jedes ↵ am Zeilenende: Stell den Cursor davor und drück <kbd>Entf</kbd>."
        - "Stell den Cursor in den Absatz, den du ändern willst. Zentrieren und rechtsbündig: die Knöpfe in der Leiste oben neben fett und kursiv, oder <kbd>Strg</kbd>+<kbd>E</kbd> und <kbd>Strg</kbd>+<kbd>R</kbd>. Den Abstand nach einem Absatz: *Format* <i class='bi bi-chevron-right' aria-hidden='true'></i> *Absatz…* <i class='bi bi-chevron-right' aria-hidden='true'></i> *Einzüge und Abstände*, im Feld *Unter dem Absatz*."
        - "Doppelte Leerzeichen findet <kbd>Strg</kbd>+<kbd>H</kbd>: Such nach zwei Leerzeichen, ersetze durch eins und klick *Alle ersetzen*. Speichere danach und prüfe noch einmal."
    nextcloud:
      hint:
        - "Schalte zuerst die Formatierungszeichen ein: *Ansicht* <i class='bi bi-chevron-right' aria-hidden='true'></i> *Formatierungszeichen*. Lösch dann jeden Punkt (·) vor einem Wort am Zeilenanfang, jedes ¶ allein in einer Zeile und jedes ↵ am Zeilenende: Stell den Cursor davor und drück <kbd>Entf</kbd>."
        - "Stell den Cursor in den Absatz, den du ändern willst. Zentrieren und rechtsbündig: die Knöpfe im Register *Start* neben fett und kursiv. Den Abstand nach einem Absatz: *Format* <i class='bi bi-chevron-right' aria-hidden='true'></i> *Absatz*, im Feld *Unter dem Absatz*."
        - "Doppelte Leerzeichen findet *Suchen und Ersetzen*: Such nach zwei Leerzeichen, ersetze durch eins und klick *Alle ersetzen*. Speichere danach und prüfe noch einmal."

  - id: ausdruck
    title: Zwei gleiche Ausdrucke
    prompt: |
      Zwei Einladungen sehen ausgedruckt genau gleich aus. Die eine ist mit
      Leerzeichen und leeren Absätzen gebaut, die andere mit Ausrichtung und
      Abstand. Woran erkennst du, welche welche ist?
    check:
      type: choice
      options:
        - Am Ausdruck gar nicht, nur in der Datei, an den Formatierungszeichen oder wenn sich die Schrift ändert.
        - Die mit Leerzeichen hat größere Lücken zwischen den Wörtern.
        - Die mit leeren Absätzen hat mehr Seiten.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Die Leerzeichen stehen vor der Überschrift, nicht zwischen den Wörtern. Auf dem Papier ist dort einfach weiß.
      - when: { picked: 2 }
        say: Ein leerer Absatz ist so hoch wie ein Abstand von 12 pt. Auf dem Papier ist beides gleich hoch.
    solution: |
      Am Ausdruck gar nicht. Den Unterschied sieht man erst mit den
      Formatierungszeichen oder sobald sich etwas ändert, die Schrift oder ein
      Wort.

  # ---- Extras: another round, six traps, a secret message

  - id: runde
    title: Noch eine Runde
    extra: true
    prompt: |
      Der Aushang für den Tag der Abfahrt ist genauso in Eile getippt wie die
      Einladung. Bau ihn sauber: Überschrift zentriert, Unterschrift
      rechtsbündig, Abstand statt leerer Absätze, Zeilen, die das Programm
      selbst umbricht.
    check:
      type: document
      file: formatting-marks/01 Abfahrt.docx
      rules:
        - text
        - spaces
        - empty_paragraphs
        - line_breaks
        - { align: center, paragraph: 'Abfahrt an den Kranichsee' }
        - { align: right, paragraph: 'Eure Klassenleitung' }
        - { gaps: 6pt, before: ['Wir treffen uns', 'Denkt an eure', 'Eure Klassenleitung'] }
    hint:
      - Es sind dieselben Fehler wie in der Einladung. Schalte zuerst die Formatierungszeichen ein und geh die Zeilen von oben nach unten durch.
      - "Vor der Überschrift und vor der Unterschrift stehen Leerzeichen; zwischen den Absätzen stehen leere Absätze; am Ende der ersten Zeile des Treffpunkts steht ein ↵."
      - "Doppelte Leerzeichen findet Suchen und Ersetzen: zwei Leerzeichen suchen, durch eins ersetzen, *Alle ersetzen*."

  - id: fallen
    title: Sechs Fallen
    extra: true
    prompt: |
      Der Brief der 7b an die Jugendherberge sieht fertig aus. Trotzdem sind
      sechs Stellen so gebaut wie in der Einladung. Die Prüfung sagt dir nur,
      wie viele du schon gefunden hast, nicht wo die anderen sind; zu jeder
      Falle gibt es Tipps, einen nach dem anderen.
    check:
      type: document
      file: formatting-marks/01 Brief an die Jugendherberge.docx
      traps: true
      rules:
        - text
        - align: center
          paragraph: 'Ankunft am Kranichsee'
          label: Die Überschrift stand nur mit Leerzeichen in der Mitte.
          hints:
            - Fang ganz oben an.
            - Steht die Überschrift wirklich in der Mitte, oder sieht sie nur so aus? Die Formatierungszeichen zeigen es.
            - Vor der Überschrift stehen Leerzeichen. Lösch sie und zentriere den Absatz.
        - align: right
          paragraph: '12. März'
          label: Das Datum stand nur mit Leerzeichen rechts.
          hints:
            - Sieh dir die zweite Zeile an.
            - Was schiebt das Datum an den rechten Rand?
            - Vor dem Datum stehen Leerzeichen. Lösch sie und richte den Absatz rechtsbündig aus.
        - spaces: true
          in: ['wir sind die Klasse 7b']
          label: Nach »Lehrkräfte.« standen zwei Leerzeichen.
          hints:
            - Im ersten langen Absatz versteckt sich etwas zwischen zwei Sätzen.
            - Zähl mit den Formatierungszeichen die Punkte (·) zwischen den Sätzen.
            - Nach »Lehrkräfte.« stehen zwei Leerzeichen. Eins ist zu viel.
        - spaces: true
          in: ['Können wir unser Gepäck']
          label: Der Einzug war aus Leerzeichen gemacht.
          hints:
            - Ein Absatz fängt nicht ganz links an. Woraus ist der Einzug gemacht?
            - Sieh dir den Anfang des Absatzes mit den Fragen an.
            - Vor »Können wir« stehen Leerzeichen. Lösch sie. Ein Brief braucht keinen Einzug; wer einen will, stellt ihn im Absatz-Dialog ein (Einzug der ersten Zeile).
        - gaps: 6pt
          before: ['Zwei von uns essen']
          label: Ein Abstand kam von einem leeren Absatz.
          hints:
            - Sind alle Abstände zwischen den Absätzen gleich gebaut?
            - Sieh dir den Abstand nach dem Absatz mit den Fragen an.
            - Dort steht ein leerer Absatz, ein ¶ allein in einer Zeile. Lösch ihn und gib dem Absatz davor 12 pt Abstand nach, wie den anderen.
        - line_breaks: true
          in: ['Zwei von uns essen']
          label: Eine Zeile endete mit einem Umbruch von Hand.
          hints:
            - Eine Zeile endet anders als die anderen, obwohl man es auf dem Papier nicht sieht.
            - Sieh dir das Ende der Zeilen im Absatz über das Essen an.
            - Hinter »ihr« steht ein ↵. Lösch es und setz ein Leerzeichen, wo vorher keins war.
    solution: |
      Die sechs Fallen: die Überschrift mit Leerzeichen in der Mitte, das
      Datum mit Leerzeichen rechts, zwei Leerzeichen nach »Lehrkräfte.«, ein
      Einzug aus Leerzeichen, ein leerer Absatz statt Abstand und ein ↵ am
      Ende einer Zeile, die sowieso dort umgebrochen wäre.

  - id: tauschen
    title: Erst a, dann e
    extra: true
    prediction: true
    prompt: |
      In einem Text sollen alle a und e die Plätze tauschen. Jemand ersetzt
      zuerst alle a durch e und danach alle e durch a. Was steht dann im
      Text?
    check:
      type: choice
      options:
        - Die a und die e haben die Plätze getauscht.
        - Wo vorher ein a oder ein e stand, steht jetzt überall ein a.
        - Wo vorher ein a oder ein e stand, steht jetzt überall ein e.
        - Der Text ist wieder so wie am Anfang.
      correct: 1
      shuffle: false
    feedback:
      - when: { picked: 0 }
        say: Geh es Schritt für Schritt durch. Was ist nach dem ersten Ersetzen aus den a geworden, und was macht der zweite Schritt mit ihnen?
      - when: { picked: 2 }
        say: Der zweite Schritt macht aus jedem e ein a. Welche e gibt es nach dem ersten Schritt?
      - when: { picked: 3 }
        say: Kann man nach dem ersten Schritt noch erkennen, welches e vorher ein a war?
    solution: |
      Nach dem ersten Schritt steht überall ein e, wo vorher ein a oder ein e
      stand, und niemand kann sie mehr auseinanderhalten. Der zweite Schritt
      macht aus all diesen e ein a.

  - id: botschaft
    title: Die Geheimbotschaft
    extra: true
    prompt: |
      Entschlüssle die Geheimbotschaft mit Suchen und Ersetzen und prüfe sie.
      Die Prüfung sagt nur, ob alles stimmt, nicht, was in der Botschaft
      steht.
    check:
      type: document
      file: formatting-marks/01 Geheimbotschaft.docx
      rules:
        - contains: ['Wir treffen uns um neun Uhr', 'hinter der Jugendherberge', 'beim Bootssteg', 'verratet keinem etwas', 'Losungswort heißt Kranichfeder']
          label: Die Botschaft ist entschlüsselt
          say: Ein Teil der Botschaft ist noch verschlüsselt oder vertippt. Abgetippt schleichen sich Fehler ein; Suchen und Ersetzen tauscht jeden Buchstaben genau.
    hint:
      - Ersetze nicht erst a durch e und gleich danach e durch a; was dann passiert, steht in deiner Vermutung. Ist es schon passiert, macht <kbd>Strg</kbd>+<kbd>Z</kbd> jedes Ersetzen einzeln rückgängig.
      - "Nimm ein Zeichen als Zwischenlager, das im Text nicht vorkommt, zum Beispiel §: erst alle a durch §, dann alle e durch a, dann alle § durch e."
      - "Mit i und o und mit n und r genauso: erst alle i durch §, dann alle o durch i, dann alle § durch o; dann n, r und §. Das sind neun Mal *Alle ersetzen*."
    solution: |
      »Streng geheim. Wir treffen uns um neun Uhr hinter der Jugendherberge,
      beim Bootssteg. Bringt eine Lampe mit und verratet keinem etwas. Das
      Losungswort heißt Kranichfeder.«
