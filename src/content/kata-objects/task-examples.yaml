      pass:
      - answer: |
          class Song {
            constructor(title, seconds) {
              this.title = title;
              this.seconds = seconds;
            }
          }

          class Playlist {
            constructor() {
              this.songs = [];
            }

            add(song) {
              this.songs.push(song);
            }

            totalSeconds() {
              let total = 0;
              for (const song of this.songs) {
                total += song.seconds;
              }
              return total;
            }

            longestTitle() {
              let longest = null;
              for (const song of this.songs) {
                if (longest === null || song.seconds > longest.seconds) {
                  longest = song;
                }
              }
              return longest === null ? null : longest.title;
            }
          }
