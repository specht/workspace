  playlist:
    pass:
    - answer: |
        class Song
          attr_reader :title, :seconds

          def initialize(title, seconds)
            @title = title
            @seconds = seconds
          end
        end

        class Playlist
          def initialize
            @songs = []
          end

          def add(song)
            @songs << song
          end

          def total_seconds
            @songs.sum { |song| song.seconds }
          end

          def longest_title
            longest = nil
            @songs.each do |song|
