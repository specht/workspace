        end
    python:
      pass:
      - answer: |
          class Song:
              def __init__(self, title, seconds):
                  self.title = title
                  self.seconds = seconds

          class Playlist:
              def __init__(self):
                  self.songs = []

              def add(self, song):
                  self.songs.append(song)

              def total_seconds(self):
                  return sum(song.seconds for song in self.songs)

              def longest_title(self):
                  longest = None
                  for song in self.songs:
                      if longest is None or song.seconds > longest.seconds:
                          longest = song
                  return longest.title if longest else None
