                if (amount > money) {
                    return false;
                }
                money -= amount;
                return true;
            }

            int balance() {
                return money;
            }
        }
        ```

  - id: playlist
    title: "Die Playlist rechnet"
    level: 2
    prompt: |
      Die Klassen `Song` und `Playlist` von oben stehen schon da. Schreib in `Playlist` zwei Methoden: `total_seconds` gibt zurück, wie lange alle Songs zusammen dauern, und `longest_title` den Titel des längsten Songs; dauern zwei gleich lang, den, der zuerst kam. In einer leeren Playlist ergibt `total_seconds` `0` und `longest_title` `nil`.
    starter: |
      class Song
        attr_reader :title, :seconds

        def initialize(title, seconds)
          @title = title
          @seconds = seconds
        end
      end

      class Playlist
        def initialize
          @songs = []
        end

        def add(song)
          @songs << song
        end

        def total_seconds
        end

        def longest_title
        end
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "p = Playlist.new; p.add(Song.new('Intro', 95)); p.add(Song.new('Outro', 210)); p.total_seconds"
          expect: "305"
        - call: "p = Playlist.new; p.add(Song.new('Intro', 95)); p.add(Song.new('Outro', 210)); p.longest_title"
          expect: "'Outro'"
        - call: "p = Playlist.new; p.add(Song.new('A', 120)); p.add(Song.new('B', 300)); p.add(Song.new('C', 60)); p.longest_title"
