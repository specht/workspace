  - id: predict-two-counters
    title: "Zwei Zähler"
    level: 1
    prediction: true
    prompt: |
      Was gibt die letzte Zeile aus?

      ```ruby
      a = Counter.new
      b = Counter.new
      a.increment
      a.increment
      b.increment
      puts a.value
      ```
    check:
      type: number
      expect: 2
    feedback:
      - when: { equals: 3 }
        say: "Dann hätten `a` und `b` einen gemeinsamen Zähler. Jedes Objekt hat aber sein eigenes Attribut `value`: Wie oft wurde `a.increment` aufgerufen?"
      - when: { equals: 1 }
        say: "Das ist der Stand von `b`. Gefragt ist `a`."
      - when: { equals: 0 }
        say: "`increment` ändert das Attribut des Objekts, und das bleibt, wenn die Methode fertig ist."
    python:
      prompt: |
        Was gibt die letzte Zeile aus?

        ```python
        a = Counter()
        b = Counter()
        a.increment()
        a.increment()
        b.increment()
        print(a.value)
        ```
    javascript:
      prompt: |
        Was gibt die letzte Zeile aus?

        ```javascript
        const a = new Counter();
        const b = new Counter();
        a.increment();
        a.increment();
        b.increment();
        console.log(a.value);
        ```
    dart:
      prompt: |
        Was gibt die letzte Zeile aus?

        ```dart
        final a = Counter();
        final b = Counter();
        a.increment();
        a.increment();
        b.increment();
        print(a.value);
        ```
    java:
      prompt: |
        Was gibt die letzte Zeile aus?

        ```java
        Counter a = new Counter();
        Counter b = new Counter();
        a.increment();
        a.increment();
        b.increment();
        IO.println(a.value);
        ```

  - id: rectangle
    title: "Ein Rechteck"
    level: 1
    prompt: |
      Schreib eine Klasse `Rectangle`, deren Objekte mit Breite und Höhe gebaut werden, `Rectangle.new(3, 4)`, und die zwei Methoden hat: `area` gibt die Fläche zurück (`12`), `perimeter` den Umfang (`14`). Die Prüfung baut auch zwei Rechtecke nebeneinander.
    starter: |
      class Rectangle
        def initialize(width, height)
        end
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "Rectangle.new(3, 4).area"
          expect: "12"
        - call: "Rectangle.new(3, 4).perimeter"
          expect: "14"
        - call: "Rectangle.new(5, 5).area"
          expect: "25"
        - call: "r = Rectangle.new(2, 7); r.perimeter"
          expect: "18"
        - call: "a = Rectangle.new(1, 2); b = Rectangle.new(10, 20); a.area + b.area"
          expect: "202"
          say: "Jedes Rechteck merkt sich seine eigene Breite und Höhe, in seinen Attributen `@width` und `@height`."
    hint:
      - "`initialize` bekommt Breite und Höhe, aber die Parameter sind weg, wenn `initialize` fertig ist. Was muss das Objekt sich merken, damit `area` später daran kommt?"
      - "Schreib in `initialize` `@width = width` und `@height = height`. Dann können `area` und `perimeter` mit `@width` und `@height` rechnen."
    solution: |
      ```ruby
      class Rectangle
        def initialize(width, height)
          @width = width
          @height = height
        end

        def area
          @width * @height
        end

        def perimeter
          2 * (@width + @height)
        end
      end
      ```
    python:
      prompt: |
        Schreib eine Klasse `Rectangle`, deren Objekte mit Breite und Höhe gebaut werden, `Rectangle(3, 4)`, und die zwei Methoden hat: `area()` gibt die Fläche zurück (`12`), `perimeter()` den Umfang (`14`). Die Prüfung baut auch zwei Rechtecke nebeneinander.
      starter: |
