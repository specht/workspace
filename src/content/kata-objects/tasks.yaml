  - id: total-area
    title: "Flächen zusammenzählen"
    level: 3
    prompt: |
      Schreib zwei Klassen, `Square` (gebaut mit einer Seitenlänge) und `Rectangle` (mit Breite und Höhe), beide mit einer Methode `area`. Dann eine Funktion `total_area(shapes)`, die die Flächen aller Formen einer Liste zusammenzählt. `total_area` fragt jede Form nur nach `area`, ohne nachzusehen, von welcher Klasse sie ist: Die Prüfung gibt ihr auch eine Form, die du nicht kennst.
    starter: |
      class Square
      end

      class Rectangle
      end

      def total_area(shapes)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "Square.new(5).area"
          expect: "25"
        - call: "Rectangle.new(3, 4).area"
          expect: "12"
        - call: "total_area([Square.new(2), Rectangle.new(3, 4)])"
          expect: "16"
        - call: "total_area([Square.new(1), Square.new(1), Rectangle.new(1, 5)])"
          expect: "7"
        - call: "total_area([])"
          expect: "0"
        - call: "Triangle = Struct.new(:area); total_area([Triangle.new(6), Square.new(2)])"
          expect: "10"
          say: "Die Prüfung gibt `total_area` eine Form, die keine deiner Klassen ist, aber auch `area` kann. Frag jede Form nur nach `shape.area`, ohne nachzusehen, was sie ist."
    hint:
      - "Beide Klassen merken sich ihre Maße in `initialize` und haben eine Methode `area`, jede mit ihrer eigenen Rechnung."
      - "`total_area` geht durch die Liste und zählt `shape.area` zusammen, mit einer Schleife oder `shapes.sum { |shape| shape.area }`."
    solution: |
      ```ruby
      class Square
        def initialize(side)
          @side = side
        end

        def area
          @side * @side
        end
      end

      class Rectangle
        def initialize(width, height)
          @width = width
          @height = height
        end

        def area
          @width * @height
        end
      end

      def total_area(shapes)
        shapes.sum { |shape| shape.area }
      end
      ```
