        - "Der Stack merkt sich seine Elemente in einer Liste, `private List<Object> items = new ArrayList<>();`. Oben ist ihr Ende."
        - "`items.add(x)` legt drauf, `items.remove(items.size() - 1)` nimmt das letzte weg und gibt es zurück, `items.get(items.size() - 1)` schaut nur. Bei einer leeren Liste brechen beide ab; darum fragst du vorher `if (items.isEmpty())`."
      solution: |
        ```java
        class Stack {
            private List<Object> items = new ArrayList<>();

            void push(Object x) {
                items.add(x);
            }

            Object pop() {
                if (items.isEmpty()) {
                    return null;
                }
                return items.remove(items.size() - 1);
            }

            Object peek() {
                if (items.isEmpty()) {
                    return null;
                }
                return items.get(items.size() - 1);
            }

            int size() {
                return items.size();
            }
        }
