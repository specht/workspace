            expect: "14"
          - call: "Rectangle(5, 5).area()"
            expect: "25"
          - call: "r = Rectangle(2, 7); r.perimeter()"
            expect: "18"
          - call: "a = Rectangle(1, 2); b = Rectangle(10, 20); a.area() + b.area()"
            expect: "202"
            say: "Jedes Rechteck merkt sich seine eigene Breite und Höhe, in seinen Attributen `self.width` und `self.height`."
      hint:
        - "`__init__` bekommt Breite und Höhe, aber die Parameter sind weg, wenn `__init__` fertig ist. Was muss das Objekt sich merken, damit `area` später daran kommt?"
        - "Schreib in `__init__` `self.width = width` und `self.height = height`. Dann können `area` und `perimeter` mit `self.width` und `self.height` rechnen."
      solution: |
        ```python
        class Rectangle:
            def __init__(self, width, height):
                self.width = width
                self.height = height

            def area(self):
