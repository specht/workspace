      Schreib eine Klasse `Fraction` für Brüche, gebaut mit Zähler und Nenner, `Fraction.new(2, 4)`, die sich gleich gekürzt merkt, also als 1/2. `to_s` zeigt sie als `1/2`, und `add(other)` gibt einen neuen, gekürzten Bruch mit der Summe zurück, ohne die beiden zu ändern. `Integer#gcd` gibt den größten gemeinsamen Teiler: `12.gcd(18)` ergibt `6`.
