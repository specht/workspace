        - call: "Fraction.new(2, 4).to_s"
          expect: "'1/2'"
          say: "Der Bruch soll sich gleich gekürzt merken: Teil Zähler und Nenner in `initialize` durch ihren größten gemeinsamen Teiler."
        - call: "Fraction.new(3, 5).to_s"
          expect: "'3/5'"
        - call: "Fraction.new(1, 2).add(Fraction.new(1, 3)).to_s"
          expect: "'5/6'"
        - call: "Fraction.new(1, 2).add(Fraction.new(1, 2)).to_s"
          expect: "'1/1'"
        - call: "Fraction.new(1, 6).add(Fraction.new(1, 3)).to_s"
          expect: "'1/2'"
        - call: "f = Fraction.new(1, 4); f.add(Fraction.new(1, 4)); f.to_s"
          expect: "'1/4'"
          say: "`add` gibt einen neuen Bruch zurück und lässt `f` selbst, wie er ist."
    hint:
      - "Für die Summe von a/b und c/d gilt: Zähler a·d + c·b, Nenner b·d. Danach kürzen."
      - "Kürzt `initialize` schon, muss `add` nur `Fraction.new(…, …)` mit dem ungekürzten Ergebnis bauen; dafür braucht `add` Zähler und Nenner des anderen Bruchs, also zwei Methoden, die sie zurückgeben (`attr_reader`)."
    solution: |
      ```ruby
      class Fraction
        attr_reader :numerator, :denominator

        def initialize(numerator, denominator)
          divisor = numerator.gcd(denominator)
          @numerator = numerator / divisor
          @denominator = denominator / divisor
        end

        def add(other)
          Fraction.new(@numerator * other.denominator + other.numerator * @denominator,
                       @denominator * other.denominator)
        end

        def to_s
          "#{@numerator}/#{@denominator}"
        end
      end
      ```
