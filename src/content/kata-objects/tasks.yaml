      hint:
        - "Der Stack merkt sich seine Elemente in einer Liste, `final _items = <Object>[];`. Oben ist ihr Ende. `pop` und `peek` geben `Object?` zurück: ein Element oder `null`."
        - "`_items.add(x)` legt drauf, `_items.removeLast()` nimmt das letzte weg, `_items.last` schaut nur. Bei einer leeren Liste brechen beide ab; darum fragst du vorher `if (_items.isEmpty)`."
      solution: |
        ```dart
        class Stack {
          final _items = <Object>[];

          void push(Object x) {
            _items.add(x);
          }

          Object? pop() {
            if (_items.isEmpty) {
              return null;
            }
            return _items.removeLast();
          }

          Object? peek() {
            if (_items.isEmpty) {
              return null;
            }
            return _items.last;
          }

          int size() {
            return _items.length;
          }
        }
