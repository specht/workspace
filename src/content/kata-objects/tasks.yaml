  - id: account
    title: "Ein Konto, das nicht ins Minus geht"
    level: 2
    prompt: |
      Schreib eine Klasse `Account` für ein Konto, das mit einem Kontostand gebaut wird, `Account.new(10)`. `deposit(amount)` zahlt ein, `balance` gibt den Kontostand zurück. `withdraw(amount)` hebt ab und gibt `true` zurück, aber nur, wenn genug da ist; sonst bleibt der Kontostand, wie er ist, und `withdraw` gibt `false` zurück.
    starter: |
      class Account
        def initialize(balance)
        end

        def deposit(amount)
        end

        def withdraw(amount)
        end

        def balance
        end
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "a = Account.new(10); a.deposit(5); a.balance"
          expect: "15"
        - call: "a = Account.new(10); a.withdraw(4)"
          expect: "true"
        - call: "a = Account.new(10); a.withdraw(4); a.balance"
          expect: "6"
        - call: "a = Account.new(10); a.withdraw(11)"
          expect: "false"
          say: "Auf dem Konto sind nur 10. Wer 11 abheben will, bekommt nichts, und `withdraw` sagt es mit `false`."
        - call: "a = Account.new(10); a.withdraw(11); a.balance"
          expect: "10"
          say: "Ein Abheben, das nicht geht, darf den Kontostand nicht ändern: Prüf zuerst, ob genug da ist, und zieh erst dann ab."
        - call: "a = Account.new(10); a.withdraw(10); a.balance"
          expect: "0"
          say: "Alles abheben geht: Danach steht das Konto auf 0, nicht im Minus."
        - call: "a = Account.new(0); b = Account.new(0); a.deposit(3); b.balance"
          expect: "0"
    hint:
      - "Das Konto merkt sich seinen Stand in einem Attribut, `@balance`. Alle vier Methoden arbeiten damit."
      - "In `withdraw` kommt zuerst die Frage, ob `amount` größer ist als der Kontostand. Wenn ja: `return false`, ohne etwas zu ändern."
      - "Sonst ziehst du ab und gibst `true` zurück: `@balance -= amount`, dann `true`."
    solution: |
      ```ruby
      class Account
        def initialize(balance)
          @balance = balance
        end

        def deposit(amount)
          @balance += amount
        end

        def withdraw(amount)
          return false if amount > @balance
          @balance -= amount
          true
        end

        def balance
          @balance
        end
      end
      ```
