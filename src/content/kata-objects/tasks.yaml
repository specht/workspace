  - id: stack
    title: "Ein Stack als Klasse"
    level: 3
    extra: true
    prompt: |
      Schreib eine Klasse `Stack` für einen Stapel, bei dem nur das oberste Element zugänglich ist: `push(x)` legt `x` oben drauf, `pop` nimmt das oberste weg und gibt es zurück, `peek` gibt es zurück, ohne es wegzunehmen, `size` sagt, wie viele Elemente drauf liegen. Ist der Stack leer, geben `pop` und `peek` `nil` zurück.
    starter: |
      class Stack
        def initialize
        end
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "s = Stack.new; s.push(1); s.push(2); s.pop"
          expect: "2"
        - call: "s = Stack.new; s.push(1); s.push(2); s.pop; s.pop"
          expect: "1"
        - call: "s = Stack.new; s.push(1); s.push(2); s.peek"
          expect: "2"
        - call: "s = Stack.new; s.push(1); s.push(2); s.peek; s.size"
          expect: "2"
          say: "`peek` schaut nur nach, es nimmt nichts weg."
        - call: "s = Stack.new; s.pop"
          expect: "nil"
        - call: "Stack.new.peek"
          expect: "nil"
        - call: "s = Stack.new; s.push('a'); s.pop; s.size"
          expect: "0"
    hint:
      - "Der Stack merkt sich seine Elemente in einer Liste, `@items = []`. Oben ist ihr Ende."
      - "`@items.push(x)` legt drauf, `@items.pop` nimmt das letzte weg und gibt es zurück, bei einer leeren Liste `nil`; `@items.last` schaut nur."
    solution: |
      ```ruby
      class Stack
        def initialize
          @items = []
        end

        def push(x)
          @items.push(x)
        end

        def pop
          @items.pop
        end

        def peek
          @items.last
        end

        def size
          @items.length
        end
      end
      ```
    python:
      prompt: |
        Schreib eine Klasse `Stack` für einen Stapel, bei dem nur das oberste Element zugänglich ist: `push(x)` legt `x` oben drauf, `pop()` nimmt das oberste weg und gibt es zurück, `peek()` gibt es zurück, ohne es wegzunehmen, `size()` sagt, wie viele Elemente drauf liegen. Ist der Stack leer, geben `pop()` und `peek()` `None` zurück.
      starter: |
        class Stack:
            def __init__(self):
                pass
      check:
        type: function
        language: python
        cases:
          - call: "s = Stack(); s.push(1); s.push(2); s.pop()"
            expect: "2"
          - call: "s = Stack(); s.push(1); s.push(2); s.pop(); s.pop()"
            expect: "1"
          - call: "s = Stack(); s.push(1); s.push(2); s.peek()"
            expect: "2"
          - call: "s = Stack(); s.push(1); s.push(2); s.peek(); s.size()"
            expect: "2"
            say: "`peek` schaut nur nach, es nimmt nichts weg."
          - call: "s = Stack(); s.pop()"
            expect: "None"
            say: "Bei einem leeren Stack gibt `pop()` `None` zurück, statt mit einem Fehler abzubrechen: Frag vorher, ob die Liste leer ist."
          - call: "Stack().peek()"
            expect: "None"
          - call: "s = Stack(); s.push('a'); s.pop(); s.size()"
            expect: "0"
      hint:
        - "Der Stack merkt sich seine Elemente in einer Liste, `self.items = []`. Oben ist ihr Ende."
        - "`self.items.append(x)` legt drauf, `self.items.pop()` nimmt das letzte weg; bei einer leeren Liste bricht es mit einem Fehler ab, darum fragst du vorher `if not self.items:`. `self.items[-1]` schaut nur."
      solution: |
        ```python
        class Stack:
            def __init__(self):
                self.items = []

            def push(self, x):
                self.items.append(x)

            def pop(self):
                if not self.items:
                    return None
                return self.items.pop()

            def peek(self):
                if not self.items:
                    return None
                return self.items[-1]

            def size(self):
                return len(self.items)
        ```
