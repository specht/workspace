# Aufgaben zu »Filmdatenbank als Graph mit Neo4j«. Format: docs/aufgaben.md.
# Die Abfrage-Aufgaben (type: cypher) laufen in der eigenen Neo4j-Datenbank
# der Person, angemeldet als sie, nur lesend (src/ruby/include/
# cypher_check.rb); die anderen fragen, was man am Modell verstanden hat.
format: 1
activity: neo4j-filmdatenbank
tasks:
  - id: zwischentabelle
    title: Wo ist movie_genre geblieben?
    prediction: true
    prompt: |
      In MySQL ordnete die Tabelle `movie_genre` Filme ihren Genres zu. Was
      wird im Graphen aus ihr?
    check:
      type: choice
      options:
        - Ein eigener Knoten mit dem Label `MovieGenre`.
        - Beziehungen vom Typ `IN_GENRE` zwischen `Movie` und `Genre`.
        - Eine Eigenschaft `genres` an jedem `Movie`-Knoten.
        - Nichts, Neo4j braucht dafür weiterhin eine Tabelle.
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: Ein Knoten pro Zuordnung ginge, aber er hätte nichts Eigenes zu speichern. Die Zuordnung selbst ist eine Verbindung.
      - when: { picked: 2 }
        say: Dann stünden Genres wieder als Liste im Film, wie im JSON vom Anfang der Filmdatenbank. Wer fragt »Welche Filme sind Comedy?«, müsste in jedem Film suchen.
    solution: |
      Eine Zwischentabelle verbindet nur zwei andere Zeilen. Im Graphen übernehmen
      das Beziehungen: Aus jeder Zeile von `movie_genre` wird eine Kante
      `IN_GENRE` vom Film zu seinem Genre, und die Tabelle selbst verschwindet.

  - id: taetigkeit
    title: Wo steckt die Tätigkeit?
    prediction: true
    prompt: |
      Wo steht im Graphen, dass Robert Zemeckis bei »Back to the Future«
      Regie geführt hat, und nicht etwa mitgespielt?
    check:
      type: choice
      options:
        - Im Typ der Beziehung, `DIRECTOR`.
        - In einer Eigenschaft `job` am Knoten von Robert Zemeckis.
        - In einem Knoten `Job` mit dem Namen `director`.
        - Im Label des Personenknotens, `:Director`.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Dieselbe Person kann bei einem Film Regie führen und bei einem anderen schreiben. Die Tätigkeit gehört zur Verbindung von Person und Film, nicht zur Person.
      - when: { picked: 3 }
        say: Ein Label beschreibt, was ein Knoten ist. Robert Zemeckis ist eine Person, Regie hat er nur bei bestimmten Filmen geführt.
    solution: |
      In MySQL stand die Tätigkeit als Verweis auf `job` in `movie_crew`. Im
      Graphen ist sie der Typ der Beziehung: `(:Person)-[:DIRECTOR]->(:Movie)`.
      Wer mitgespielt hat, hängt mit `ACTOR` am Film.

  - id: zweimal-create
    title: Zemeckis noch einmal
    prediction: true
    prompt: |
      Robert Zemeckis hat auch bei »Forrest Gump« (1994) Regie geführt.
      Jemand ergänzt den kleinen Graphen so:

      ```cypher
      CREATE (:Person {name: 'Robert Zemeckis'})-[:DIRECTOR]->(:Movie {title: 'Forrest Gump', year: 1994});
      ```

      Was zeigt danach diese Abfrage im Neo4j Browser?

      ```cypher
      MATCH (p:Person {name: 'Robert Zemeckis'})-[:DIRECTOR]->(m:Movie)
      RETURN p, m;
      ```

      Überleg zuerst, dann probier beides aus.
    check:
      type: choice
      options:
        - 'Einen Knoten Robert Zemeckis mit Pfeilen zu beiden Filmen.'
        - 'Zwei Knoten Robert Zemeckis, jeder mit einem Pfeil zu einem Film.'
        - 'Nichts Neues: Neo4j lehnt das `CREATE` ab, weil es Robert Zemeckis schon gibt.'
        - 'Nur »Back to the Future«: `CREATE` legt einen Knoten, den es schon gibt, nicht noch einmal an.'
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: 'Woher sollte `CREATE` wissen, dass der Knoten im Muster derselbe ist wie der von vorhin? Die Namen wie `zemeckis` galten nur in dem einen Befehl.'
      - when: { picked: 2 }
        say: 'Gibt es im kleinen Graphen eine Regel, die zwei Personen mit demselben Namen verbietet? Probier es aus.'
      - when: { picked: 3 }
        say: '`CREATE` legt an, was in seinem Muster steht, jedes Mal. Probier es aus und zähl die Knoten.'
    solution: |
      Zwei Knoten: `CREATE` legt immer neu an, auch eine Person mit einem Namen,
      den es schon gibt. Einen vorhandenen Knoten findest du mit `MATCH` und
      hängst dann mit `CREATE` an ihn an.

  - id: koenig-der-loewen
    title: Der König der Löwen
    prompt: |
      Wie lang ist »The Lion King« aus dem Jahr 1994, und wie heißt der Film
      auf Deutsch? Gib die Laufzeit und den deutschen Titel aus.
    check:
      type: cypher
      expect_query: "MATCH (m:Movie {title: 'The Lion King', year: 1994}) RETURN m.runtime, m.german_title"
      nodes: { Movie: 2735, Person: 14445, Genre: 20 }
      setup: Lade zuerst die Filmdaten, wie unter »Die Filmdaten laden« beschrieben.
    hint: Der deutsche Titel steht in der Eigenschaft `german_title`.
    feedback:
      - when: { same_result_as: "MATCH (m:Movie {title: 'The Lion King'}) RETURN m.runtime, m.german_title" }
        say: Das sind zwei Filme. »The Lion King« gibt es von 1994 und als Neuverfilmung von 2019; gefragt ist der von 1994.

  - id: richtung
    title: Die Pfeilrichtung
    prompt: |
      Was findet `MATCH (g:Genre)-[:IN_GENRE]->(m:Movie) RETURN m`?
    check:
      type: choice
      options:
        - Alle Filme mit einem Genre, wie mit dem Pfeil in die andere Richtung.
        - Nichts, denn alle `IN_GENRE`-Beziehungen zeigen vom Film zum Genre.
        - Alle Genres.
        - Eine Fehlermeldung, weil die Richtung falsch ist.
      correct: 1
    hint: Die Daten legen jede `IN_GENRE`-Beziehung vom Film zum Genre an. Probier es aus.
    feedback:
      - when: { picked: 0 }
        say: 'In Cypher zählt die Richtung des Pfeils. Wie wurden die `IN_GENRE`-Beziehungen angelegt, vom Film zum Genre oder umgekehrt?'
      - when: { picked: 3 }
        say: 'Cypher meldet dabei keinen Fehler. Es findet nur nichts, was zu diesem Muster passt.'
    solution: |
      Ein Muster mit Pfeil passt nur auf Beziehungen in dieser Richtung. Keine
      verläuft vom Genre zum Film, also gibt es kein Ergebnis, aber auch keinen
      Fehler. Ohne Spitze, `(g:Genre)-[:IN_GENRE]-(m:Movie)`, passt jede
      Richtung.

  - id: scifi
    title: Science-Fiction ab 2010
    prompt: |
      Welche Science-Fiction-Filme (Genre `Sci-Fi`) ab dem Jahr 2010 enthält
      die Datenbank? Zeig Titel und Jahr, die neuesten zuerst.
    check:
      type: cypher
      expect_query: "MATCH (m:Movie)-[:IN_GENRE]->(:Genre {name: 'Sci-Fi'}) WHERE m.year >= 2010 RETURN m.title, m.year ORDER BY m.year DESC"
      sorted_by: 2 DESC
      nodes: { Movie: 2735, Person: 14445, Genre: 20 }
      setup: Lade zuerst die Filmdaten, wie unter »Die Filmdaten laden« beschrieben.
    feedback:
      - when: { same_result_as: "MATCH (m:Movie)-[:IN_GENRE]->(:Genre {name: 'Sci-Fi'}) WHERE m.year > 2010 RETURN m.title, m.year" }
        say: Ab 2010 heißt, 2010 gehört dazu. Mit `>` fehlen die Filme aus 2010.

  - id: drei-stunden
    title: Länger als drei Stunden
    prompt: |
      Welche Filme sind länger als drei Stunden? Zeig Titel und Laufzeit.
    check:
      type: cypher
      expect_query: "MATCH (m:Movie) WHERE m.runtime > 180 RETURN m.title, m.runtime"
      nodes: { Movie: 2735, Person: 14445, Genre: 20 }
      setup: Lade zuerst die Filmdaten, wie unter »Die Filmdaten laden« beschrieben.
    feedback:
      - when: { query_matches: 'runtime\s*>=?\s*3\b' }
        say: Die Laufzeit steht in Minuten, nicht in Stunden.

  - id: comedy-scifi
    title: Comedy und Science-Fiction
    prompt: |
      Welche Filme gehören zugleich zu `Comedy` und zu `Sci-Fi`? Zeig die
      Titel.
    check:
      type: cypher
      expect_query: "MATCH (:Genre {name: 'Comedy'})<-[:IN_GENRE]-(m:Movie)-[:IN_GENRE]->(:Genre {name: 'Sci-Fi'}) RETURN m.title"
      nodes: { Movie: 2735, Person: 14445, Genre: 20 }
      setup: Lade zuerst die Filmdaten, wie unter »Die Filmdaten laden« beschrieben.
    hint: Ein Muster darf zwei Beziehungen vom selben Film aus haben, `(g1:Genre)<-[:IN_GENRE]-(m:Movie)-[:IN_GENRE]->(g2:Genre)`.
    feedback:
      - when: { same_result_as: "MATCH (m:Movie)-[:IN_GENRE]->(g:Genre) WHERE g.name IN ['Comedy', 'Sci-Fi'] RETURN DISTINCT m.title" }
        say: Das sind die Filme, die zu einem der beiden Genres gehören. Gefragt sind die, die zu beiden gehören.

  - id: nolan
    title: Christopher Nolan
    prompt: |
      Bei welchen Filmen führte Christopher Nolan Regie? Zeig Titel und Jahr,
      nach dem Jahr sortiert.
    check:
      type: cypher
      expect_query: "MATCH (:Person {name: 'Christopher Nolan'})-[:DIRECTOR]->(m:Movie) RETURN m.title, m.year ORDER BY m.year"
      sorted_by: 2
      nodes: { Movie: 2735, Person: 14445, Genre: 20 }
      setup: Lade zuerst die Filmdaten, wie unter »Die Filmdaten laden« beschrieben.
    feedback:
      - when: { same_result_as: "MATCH (:Person {name: 'Christopher Nolan'})-[]->(m:Movie) RETURN DISTINCT m.title, m.year" }
        say: Das sind alle Filme, an denen er beteiligt war, auch als Autor oder Produzent. Gefragt ist nur `DIRECTOR`.

  - id: zimmer
    title: Hans Zimmer
    prompt: |
      An welchen Filmen war Hans Zimmer beteiligt, und als was? Zeig den
      Titel und die Art der Beteiligung.
    check:
      type: cypher
      expect_query: "MATCH (:Person {name: 'Hans Zimmer'})-[r]->(m:Movie) RETURN m.title, type(r)"
      nodes: { Movie: 2735, Person: 14445, Genre: 20 }
      setup: Lade zuerst die Filmdaten, wie unter »Die Filmdaten laden« beschrieben.
    hint: Die Art der Beteiligung ist der Typ der Beziehung. `type(r)` gibt ihn als Text zurück.
    feedback:
      - when: { query_matches: 'return\s+(.*,\s*)?r\s*(,|$)' }
        say: '`r` ist die ganze Beziehung. Ihr Typ, zum Beispiel `COMPOSER`, steht in `type(r)`.'

  - id: viel-regie
    title: Wer führte am häufigsten Regie?
    prompt: |
      Welche Personen haben bei mindestens 15 Filmen Regie geführt? Zeig den
      Namen und die Zahl der Filme, die meisten zuerst.
    check:
      type: cypher
      expect_query: "MATCH (p:Person)-[:DIRECTOR]->(m:Movie) WITH p, count(m) AS n WHERE n >= 15 RETURN p.name, n ORDER BY n DESC"
      sorted_by: 2 DESC
      nodes: { Movie: 2735, Person: 14445, Genre: 20 }
      setup: Lade zuerst die Filmdaten, wie unter »Die Filmdaten laden« beschrieben.
    hint: Zählen und danach filtern geht mit `WITH p, count(m) AS n WHERE n >= 15`.
    feedback:
      - when: { same_result_as: "MATCH (p:Person)-[:DIRECTOR]->(m:Movie) WITH p, count(m) AS n WHERE n > 15 RETURN p.name, n" }
        say: Mindestens 15 heißt, 15 gehört dazu. Mit `>` fehlen die mit genau 15 Filmen.

  - id: muster
    title: Das richtige Muster
    prompt: |
      Gesucht sind Personen, die in einem Film mitgespielt **und** bei
      demselben Film Regie geführt haben. Welches Muster findet sie?
    check:
      type: choice
      options:
        - '`(p:Person)-[:ACTOR]->(m:Movie), (q:Person)-[:DIRECTOR]->(m)`'
        - '`(p:Person)-[:ACTOR]->(m:Movie)<-[:DIRECTOR]-(p)`'
        - '`(p:Person)-[:ACTOR]->(:Movie)<-[:DIRECTOR]-(:Person)`'
        - '`(p:Person)-[:ACTOR|DIRECTOR]->(m:Movie)`'
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: Hier dürfen `p` und `q` verschiedene Menschen sein. Dass es dieselbe Person ist, sagt das Muster nur, wenn beide Enden denselben Namen tragen.
      - when: { picked: 2 }
        say: Der Knoten am Ende von `DIRECTOR` hat keinen Namen, also kann es jede Person sein.
      - when: { picked: 3 }
        say: '`ACTOR|DIRECTOR` heißt »das eine oder das andere«. Gefragt sind beide Beziehungen.'
    solution: |
      `p` kommt im Muster zweimal vor, also muss es beide Male dieselbe Person
      sein: einmal mit `ACTOR` zum Film `m` und einmal mit `DIRECTOR` zu demselben
      `m`. Zwei verschiedene Variablen fänden dagegen jeden Film mit irgendeinem
      Schauspieler und irgendeiner Regie.

  - id: paare
    title: Wie viele Paare?
    prompt: |
      In einem Film spielen drei Personen mit. Wie viele Zeilen liefert
      `MATCH (a:Person)-[:ACTOR]->(m)<-[:ACTOR]-(b:Person) RETURN a.name, b.name`
      für diesen Film, also **ohne** `WHERE a.id < b.id`?
    prediction: true
    check:
      type: choice
      options:
        - '3'
        - '6'
        - '9'
        - '1'
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: 'Jedes Paar kommt zweimal vor: einmal als (a, b) und einmal als (b, a).'
      - when: { picked: 2 }
        say: 'Dieselbe Beziehung kommt in einem Muster nie zweimal vor, also sind a und b immer zwei verschiedene Personen.'
    solution: |
      Sechs: Jedes der drei Paare kommt zweimal vor, als (A, B) und als (B, A).
      Mit sich selbst wird niemand gepaart, weil eine Beziehung in einem Muster
      nur einmal verwendet wird. `a.id < b.id` lässt von jedem Paar genau eine
      Reihenfolge übrig: drei Zeilen.

  - id: vergleich
    title: MySQL oder Neo4j?
    prompt: |
      Du hast dieselben Filmdaten in MySQL und in Neo4j abgefragt. Nenne eine
      Frage, die du lieber in MySQL stellst, und eine, die du lieber in Neo4j
      stellst, und begründe beides.
    check:
      type: reflection
      min_words: 30
    examples:
      - |
        In MySQL frage ich lieber »Wie viele Filme gibt es in jedem Genre, und
        wie lang sind sie im Schnitt?«: Das ist eine Tabelle mit Zahlen, und
        `GROUP BY` mit `COUNT` und `AVG` macht genau das. In Neo4j frage ich
        lieber »Über welche Filme und Menschen sind Dwayne Johnson und Eddie
        Murphy verbunden?«: `shortestPath` findet den Weg mit einer Zeile, in SQL
        bräuchte ich für jeden Schritt zwei Joins mehr und müsste vorher wissen,
        wie viele Schritte es sind.
      - |
        MySQL: »Welches sind die zehn längsten Filme aus den 1990er-Jahren?« Das
        ist eine Liste aus einer einzigen Tabelle, gefiltert, sortiert und
        begrenzt, und das Ergebnis ist eine Tabelle. Neo4j: »Mit wem hat Tom Hanks am häufigsten
        gemeinsam gespielt?« In Neo4j ist das ein kurzes Muster von Person über
        Film zu Person; in SQL brauchte dieselbe Frage jede Tabelle zweimal und
        viele Joins.
