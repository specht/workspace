    check:
      type: python
      file: video/difference.py
      cases:
        - call: encode(np.zeros((3, 8, 8)), 10).shape
          expect: (3, 8, 8)
          say: '`encode` gibt alle gebauten Bilder als Array zurück, mit `np.array(decoded)`.'
        - call: 'p = np.array([np.full((4, 4), 128.0 + 3 * k) for k in range(10)]); bool(np.abs(encode(p, 32)[-1] - p[-1]).max() < 6)'
          expect: 'True'
          say: Zehn Ebenen, jede um 3 heller als die vorige. Bei Schritt 32 wird jeder einzelne Unterschied von 3 zu 0 gerundet; beim letzten Bild ist der Fehler 27, wenn `encode` zum vorigen Original rechnet. Rechnet es den Unterschied zu `decoded[-1]`?
    solution: |
      ```python
      def encode(planes, step):
          decoded = [code(planes[0] - 128, step) + 128]
          for plane in planes[1:]:
              decoded.append(decoded[-1] + code(plane - decoded[-1], step))
          return np.array(decoded)
      ```

  - id: best-vector
    title: Den Block wiederfinden
    prompt: |
      Schreib in `video/motion.py` die Funktion `best_vector(current,
      reference, y, x, n, radius)`: die Verschiebung `(dx, dy)` mit der
      kleinsten Summe der Unterschiede zwischen dem Block
      `current[y:y + n, x:x + n]` und dem Stück von `reference`, das bei
      `y + dy` und `x + dx` beginnt. Stücke über den Rand lässt sie aus.
    check:
      type: python
      file: video/motion.py
      cases:
        - call: 'ref = np.arange(400.0).reshape(20, 20) * 37 % 101; cur = np.roll(ref, (1, -2), axis=(0, 1)); best_vector(cur, ref, 8, 8, 4, 3)'
          expect: (2, -1)
          say: Die Prüfung verschiebt ein Muster um eine Zeile nach unten und zwei Spalten nach links. Der Block bei (8, 8) war vorher also zwei Spalten weiter rechts und eine Zeile höher, `(2, -1)`, erst `dx`, dann `dy`. Nimmt `best_vector` die kleinste Summe, und beginnt das Stück bei `y + dy` und `x + dx`?
        - call: 'ref = np.arange(400.0).reshape(20, 20) * 37 % 101; best_vector(ref, ref, 0, 0, 4, 3)'
          expect: (0, 0)
          say: Ein Block oben links, im selben Bild gesucht, passt am besten ohne Verschiebung. Verschiebungen nach oben und links gehen über den Rand; lässt `best_vector` sie mit `continue` aus? Ein negativer Index zählt in numpy von hinten.
        - call: 'ref = np.arange(400.0).reshape(20, 20) * 37 % 101; cur = np.roll(ref, (1, -2), axis=(0, 1)); all(abs(int(v)) <= 1 for v in best_vector(cur, ref, 8, 8, 4, 1))'
          expect: 'True'
          say: Mit `radius = 1` probiert `best_vector` nur Verschiebungen von −1 bis 1, auch wenn die beste weiter weg liegt.
    solution: |
      ```python
      def best_vector(current, reference, y, x, n, radius):
          block = current[y:y + n, x:x + n]
          height, width = reference.shape
          best, best_sad = (0, 0), None
          for dy in range(-radius, radius + 1):
              for dx in range(-radius, radius + 1):
                  top, left = y + dy, x + dx
                  if top < 0 or left < 0 or top + n > height or left + n > width:
                      continue
                  sad = np.abs(block - reference[top:top + n, left:left + n]).sum()
                  if best_sad is None or sad < best_sad:
                      best, best_sad = (dx, dy), sad
          return best
      ```

