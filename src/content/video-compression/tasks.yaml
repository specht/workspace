# Aufgaben zu »Video komprimieren«. Format: docs/aufgaben.md. Alles liegt in
# /workspace/video; die Funktionen der Lernenden rechnen mit numpy, das im
# Workspace-Image ist. Die Zahlen gehören zu den Programmen in stufen/.
format: 1
activity: video-compression
tasks:
  - id: full-hd
    title: Eine Sekunde Full HD
    prompt: |
      Ein Video in Full HD hat Bilder mit 1.920 × 1.080 Pixeln, jedes Pixel
      3 Bytes, und 25 Bilder in der Sekunde. Wie viele Megabit braucht eine
      Sekunde, unkomprimiert? Ein Megabit sind 1.000.000 Bit.
    check:
      type: number
      expect: 1244.16
      tolerance: 1
    feedback:
      - when: { between: [155, 156] }
        say: Das sind Megabytes. Ein Byte hat 8 Bits.
      - when: { between: [414, 415] }
        say: Jedes Pixel hat drei Bytes, eines für Rot, eines für Grün und eines für Blau.
      - when: { between: [49.5, 50.5] }
        say: Das ist ein einziges Bild. In der Sekunde kommen 25.
      - when: { between: [1186, 1187] }
        say: So viele Mebibit sind es, 1.048.576 Bit je Mebibit. Gefragt ist das Megabit mit 1.000.000 Bit.
    solution: |
      1.920 · 1.080 · 3 = 6.220.800 Bytes je Bild, mal 25 sind 155.520.000
      Bytes in der Sekunde, mal 8 sind 1.244.160.000 Bit, also etwa 1.244
      Mbit/s. Ein Stream in Full HD hat meist nur einige Mbit/s, ein
      Zweihundertstel davon oder weniger.

  - id: held
    title: Weniger Bilder
    prompt: |
      Schreib in `video/frames.py` die Funktion `held(frames, step)`: genauso
      viele Bilder wie `frames`, die Bilder 0, `step`, `2 * step`, … je
      `step`-mal hintereinander. Die Prüfung gibt ihr kleine Arrays, in denen
      jedes »Bild« eine Zahl ist, und eines aus echten Bildern.
    check:
      type: python
      file: video/frames.py
      cases:
        - call: '[int(f) for f in held(np.arange(6), 2)]'
          expect: '[0, 0, 2, 2, 4, 4]'
          say: Aus den Bildern 0 bis 5 werden bei `step = 2` die Bilder 0, 2 und 4, jedes zweimal. Wird jedes Bild wiederholt, `np.repeat`, und nicht die ganze Folge, `np.tile`?
        - call: '[int(f) for f in held(np.arange(7), 3)]'
          expect: '[0, 0, 0, 3, 3, 3, 6]'
          say: Bei 7 Bildern und `step = 3` bleiben 0, 3 und 6; das Ergebnis hat wieder 7 Bilder, das letzte nur einmal. Wird es mit `[:len(frames)]` abgeschnitten?
        - call: held(np.zeros((5, 4, 4, 3)), 2).shape
          expect: (5, 4, 4, 3)
          say: Bei echten Bildern bleibt jedes Bild ganz, nur ihre Folge ändert sich. Wiederholt `np.repeat` entlang der ersten Achse, `axis=0`?
    solution: |
      ```python
      def held(frames, step):
          return np.repeat(frames[::step], step, axis=0)[:len(frames)]
      ```

  - id: interlace
    title: Halbbilder
    prompt: |
      Schreib in `video/frames.py` die Funktion `interlace(frames)`: Bild `k`
      des Ergebnisses hat die geraden Zeilen von Bild `k` und die ungeraden
      von Bild `k + 1`; das Ergebnis hat ein Bild weniger, und `frames`
      bleibt unverändert. Die Prüfung gibt ihr Bilder, in denen jedes Pixel
      die Nummer seines Bildes ist.
    check:
      type: python
      file: video/frames.py
      cases:
        - call: interlace(np.zeros((5, 4, 2, 3))).shape
          expect: (4, 4, 2, 3)
          say: Aus 5 Bildern werden 4, denn das letzte hat kein Bild nach sich.
        - call: '[int(v) for v in interlace(np.arange(4).reshape(4, 1, 1, 1) * np.ones((4, 4, 1, 1), dtype=int))[0, :, 0, 0]]'
          expect: '[0, 1, 0, 1]'
          say: Die Zeilen von Bild 0 des Ergebnisses kommen abwechselnd aus Bild 0 (die geraden, 0 und 2) und Bild 1 (die ungeraden, 1 und 3), dem nächsten, nicht dem vorigen.
        - call: '[int(v) for v in interlace(np.arange(4).reshape(4, 1, 1, 1) * np.ones((4, 4, 1, 1), dtype=int))[2, :, 0, 0]]'
          expect: '[2, 3, 2, 3]'
          say: Bild 2 des Ergebnisses hat die geraden Zeilen von Bild 2 und die ungeraden von Bild 3, dem nächsten, nicht dem vorigen.
        - call: f = np.arange(3).reshape(3, 1, 1, 1) * np.ones((3, 2, 1, 1), dtype=int); interlace(f); [int(v) for v in f[:, 1, 0, 0]]
          expect: '[0, 1, 2]'
          say: '`interlace` darf `frames` nicht verändern: Fang mit einer Kopie an, `frames[:-1].copy()`.'
    solution: |
      ```python
      def interlace(frames):
          out = frames[:-1].copy()
          out[:, 1::2] = frames[1:, 1::2]
          return out
      ```

  - id: combing
    title: Halbbilder einer schnellen Fahrt
    prediction: true
    prompt: |
      Die Kamera fährt schnell die Felswand hinauf. Wie sieht ein einzelnes
      Bild aus `interlace(fast)` aus, dort wo sich etwas bewegt?
    check:
