  - id: ycbcr
    title: Helligkeit und Farbe
    prompt: |
      Schreib in `video/chroma.py` die Funktion `to_ycbcr(rgb)`: Die letzte
      Achse von `rgb` sind R, G und B, die letzte Achse des Ergebnisses Y, Cb
      und Cr, nach den Formeln auf der Seite. Die Prüfung gibt ihr einzelne
      Pixel, auch als Bytes wie aus einem Bild, und ein Array mit vier Achsen.
    check:
      type: python
      file: video/chroma.py
      cases:
        - call: '[round(float(v), 1) for v in to_ycbcr(np.array([100, 100, 100]))]'
          expect: '[100.0, 128.0, 128.0]'
          say: Ein Grau mit R = G = B = 100 hat Y = 100, und Cb und Cr sind 128. Steht in den Formeln für Cb und Cr die 128 am Anfang?
        - call: '[round(float(v), 1) for v in to_ycbcr(np.array([200, 100, 50]))]'
          expect: '[124.2, 86.1, 182.1]'
          say: Für R = 200, G = 100, B = 50 ergeben die Formeln Y = 124,2, Cb = 86,1 und Cr = 182,1. Stimmen die Zahlen und die Vorzeichen in deinen Formeln?
        - call: '[round(float(v), 1) for v in to_ycbcr(np.array([200, 100, 50], dtype=np.uint8))]'
          expect: '[124.2, 86.1, 182.1]'
          say: Mit Bytes aus einem Bild (`uint8`) kommt etwas anderes heraus. Rechnet deine Funktion mit Kommazahlen, etwa `0.299 * r`?
        - call: to_ycbcr(np.zeros((2, 3, 4, 3))).shape
          expect: (2, 3, 4, 3)
          say: Das Ergebnis hat dieselbe Form wie `rgb`, Y, Cb und Cr in der letzten Achse. Legt `np.stack` die drei mit `axis=-1` zusammen?
    solution: |
      ```python
      def to_ycbcr(rgb):
          r, g, b = rgb[..., 0], rgb[..., 1], rgb[..., 2]
          y = 0.299 * r + 0.587 * g + 0.114 * b
          cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b
          cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b
          return np.stack([y, cb, cr], axis=-1)
      ```

