  - id: differences
    title: Unterschiede von Bild zu Bild
    prompt: |
      Schreib in `video/difference.py` die Funktion `differences(frames)`: ein
      Bild weniger als `frames`, Bild `k` ist Bild `k + 1` minus Bild `k`, als
      ganze Zahlen, auch negative.
    check:
      type: python
      file: video/difference.py
      cases:
        - call: differences(np.array([3, 5, 4], dtype=np.uint8)).tolist()
          expect: '[2, -1]'
          say: Aus den Bytes 3, 5 und 4 werden die Unterschiede 2 und −1. Kommt 255 heraus statt −1, rechnet numpy mit Bytes modulo 256; wandle vorher mit `astype(int)` um.
        - call: differences(np.zeros((5, 2, 2, 3), dtype=np.uint8)).shape
          expect: (4, 2, 2, 3)
          say: Aus 5 Bildern werden 4 Unterschiede, jeder so groß wie ein Bild.
    solution: |
      ```python
      def differences(frames):
          return frames[1:].astype(int) - frames[:-1]
      ```

