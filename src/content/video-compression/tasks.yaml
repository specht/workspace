  - id: bytes-420
    title: Ein Bild in 4:2:0
    prompt: |
      Ein Bild hat 960 × 400 Pixel. Y bleibt für jedes Pixel, Cb und Cr gibt es
      nur einmal für jedes Quadrat aus 2 × 2 Pixeln, und jeder Wert ist ein
      Byte. Wie viele Bytes hat das Bild?
    check:
      type: number
      expect: 576000
    feedback:
      - when: { between: [1152000, 1152000] }
        say: So viele sind es mit drei Bytes für jedes Pixel, wie in RGB. Cb und Cr gibt es aber nur für jedes vierte Pixel.
      - when: { between: [384000, 384000] }
        say: Das ist Y allein. Cb und Cr kommen dazu, je einmal für 2 × 2 Pixel.
      - when: { between: [480000, 480000] }
        say: Cb und Cr sind zwei Ebenen, und beide gibt es für jedes Quadrat aus 2 × 2 Pixeln.
      - when: { between: [768000, 768000] }
        say: Das wäre 4:2:2, mit Cb und Cr halb so breit wie das Bild. Bei 4:2:0 sind sie auch halb so hoch.
      - when: { between: [144000, 144000] }
        say: Das ist die Zahl aller Werte geteilt durch vier. Y bleibt aber für jedes Pixel.
    solution: |
      Y: 960 · 400 = 384.000 Bytes. Cb und Cr: je 480 · 200 = 96.000 Bytes.
      Zusammen 576.000 Bytes, halb so viel wie die 1.152.000 Bytes in RGB:
      anderthalb Bytes je Pixel statt drei.

  - id: subsample
    title: Chroma Subsampling
    prompt: |
      Schreib in `video/chroma.py` die Funktion `subsample(plane, n)`: eine
      Ebene, `n`-mal kleiner in jeder Richtung, jeder Wert der Mittelwert eines
      Quadrats aus `n` × `n` Werten.
    check:
      type: python
      file: video/chroma.py
      cases:
        - call: subsample(np.arange(16).reshape(4, 4)).tolist()
          expect: '[[2.5, 4.5], [10.5, 12.5]]'
          say: 'Aus 0 bis 15 in vier Zeilen wird bei `n = 2` der Mittelwert jedes Quadrats: oben links (0 + 1 + 4 + 5) / 4 = 2,5. Bildet deine Funktion den Mittelwert aus vier Werten, die in einem Quadrat beieinander liegen, mit `reshape(height // n, n, width // n, n)`?'
        - call: subsample(np.arange(36).reshape(6, 6), 3).tolist()
          expect: '[[7.0, 10.0], [25.0, 28.0]]'
          say: Bei `n = 3` mittelt jedes Quadrat neun Werte. Rechnet deine Funktion mit `n` statt mit 2?
        - call: subsample(np.zeros((400, 960))).shape
          expect: (200, 480)
          say: Eine Ebene von 400 × 960 Werten wird bei `n = 2` zu 200 × 480.
    solution: |
      ```python
      def subsample(plane, n=2):
          height, width = plane.shape
          return plane.reshape(height // n, n, width // n, n).mean(axis=(1, 3))
      ```

  - id: quantize
    title: Quantisieren
    prompt: |
      Schreib in `video/blocks.py` die Funktionen `quantize(blocks, step)`
      (die Koeffizienten aller Blöcke, durch `step` geteilt und gerundet) und
      `restore(levels, step)` (zurück zu Pixeln). Die Prüfung gibt ihnen
      Blöcke aus 8 × 8 und 4 × 4 Pixeln.
    check:
      type: python
      file: video/blocks.py
      cases:
        - call: round(float(quantize(np.full((1, 1, 8, 8), 40.0), 10)[0, 0, 0, 0]), 6)
          expect: '32.0'
          say: Ein Block, in dem überall 40 steht, hat oben links den Koeffizienten 40 · 8 = 320, durch 10 geteilt 32. Teilt `quantize` die Koeffizienten aus `dct(blocks)` durch `step`?
        - call: int(np.count_nonzero(quantize(np.full((1, 1, 8, 8), 40.0), 10)))
          expect: '1'
          say: Bei einem Block mit überall 40 bleibt nur der Koeffizient oben links; die anderen sind fast 0 und werden mit `np.round` genau 0.
        - call: '[int(v) for v in quantize(np.arange(16.0).reshape(1, 1, 4, 4), 4).flatten()][:5]'
          expect: '[8, -1, 0, 0, -4]'
          say: Die Koeffizienten werden auf ganze Zahlen gerundet, mit `np.round`.
        - call: float(quantize(np.full((1, 1, 4, 4), 7.0), 8)[0, 0, 0, 0])
          expect: '4.0'
          say: 7 · 4 / 8 = 3,5 wird gerundet zu 4. Rundet `quantize` mit `np.round`?
        - call: 'lv = np.zeros((1, 1, 8, 8)); lv[0, 0, 0, 0] = 32; [round(float(v), 6) for v in np.unique(restore(lv, 10))]'
          expect: '[40.0]'
          say: Aus dem Koeffizienten 32 bei Schritt 10 wird wieder 320, und das ist ein Block, in dem überall 40 steht. Multipliziert `restore` mit `step`, bevor es `idct` aufruft?
        - call: restore(quantize(np.zeros((2, 3, 4, 4)), 5), 5).shape
          expect: (2, 3, 4, 4)
          say: '`restore` gibt Blöcke derselben Form zurück, die `quantize` bekam.'
    solution: |
      ```python
      def quantize(blocks, step):
          return np.round(dct(blocks) / step)


      def restore(levels, step):
          return idct(levels * step)
      ```

