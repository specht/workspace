  - id: predict
    title: Vorhersage aus den Nachbarn
    prompt: |
      Schreib in `video/blocks.py` die Funktion `predict(above, left, mode)`:
      einen Block aus `n` × `n` Pixeln, bei `'vertical'` in jeder Zeile
      `above`, bei `'horizontal'` in jeder Spalte `left`, bei `'dc'` überall
      der Mittelwert aller `2 * n` Nachbarn.
    check:
      type: python
      file: video/blocks.py
      cases:
        - call: predict(np.array([1., 2., 3., 4.]), np.array([5., 6., 7., 8.]), 'vertical').tolist()
          expect: '[[1.0, 2.0, 3.0, 4.0], [1.0, 2.0, 3.0, 4.0], [1.0, 2.0, 3.0, 4.0], [1.0, 2.0, 3.0, 4.0]]'
          say: Bei `'vertical'` wiederholt jede Spalte den Wert über ihr, jede Zeile ist also `above`.
        - call: predict(np.array([1., 2., 3., 4.]), np.array([5., 6., 7., 8.]), 'horizontal').tolist()
          expect: '[[5.0, 5.0, 5.0, 5.0], [6.0, 6.0, 6.0, 6.0], [7.0, 7.0, 7.0, 7.0], [8.0, 8.0, 8.0, 8.0]]'
          say: Bei `'horizontal'` wiederholt jede Zeile den Wert links von ihr. Wird `left` mit `left[:, None]` zu einer Spalte?
        - call: predict(np.array([1., 2., 3., 4.]), np.array([5., 6., 7., 8.]), 'dc').tolist()
          expect: '[[4.5, 4.5, 4.5, 4.5], [4.5, 4.5, 4.5, 4.5], [4.5, 4.5, 4.5, 4.5], [4.5, 4.5, 4.5, 4.5]]'
          say: Bei `'dc'` ist jedes Pixel der Mittelwert aller acht Nachbarn, (1 + 2 + 3 + 4 + 5 + 6 + 7 + 8) / 8 = 4,5.
        - call: predict(np.zeros(8), np.zeros(8), 'dc').shape
          expect: (8, 8)
          say: Bei 8 Nachbarn oben und 8 links ist der Block 8 × 8 groß. Nimmt `predict` die Größe aus `len(above)`?
    solution: |
      ```python
      def predict(above, left, mode):
          n = len(above)
          if mode == 'vertical':
              return np.tile(above, (n, 1))
          if mode == 'horizontal':
              return np.tile(left[:, None], (1, n))
          return np.full((n, n), (above.sum() + left.sum()) / (2 * n))
      ```

  - id: best-mode
    title: Die beste Vorhersage
    prompt: |
      Schreib in `video/blocks.py` die Funktion `best_mode(block, above,
      left)`: die Art aus `MODES`, bei der die Summe der Beträge von `block -
      predict(above, left, mode)` am kleinsten ist.
    check:
      type: python
      file: video/blocks.py
      cases:
        - call: "a = np.array([10., 20., 30., 40.]); l = np.array([90., 80., 70., 60.]); best_mode(np.tile(a, (4, 1)), a, l)"
          expect: "'vertical'"
          say: Ein Block, dessen Zeilen alle `above` sind, wird von `'vertical'` genau vorhergesagt, der Rest ist 0. Nimmt `best_mode` die Art mit dem kleinsten Fehler?
        - call: "a = np.array([10., 20., 30., 40.]); l = np.array([90., 80., 70., 60.]); best_mode(np.tile(l[:, None], (1, 4)), a, l)"
          expect: "'horizontal'"
          say: Ein Block, dessen Spalten alle `left` sind, passt am besten zu `'horizontal'`. Nimmt `best_mode` den kleinsten Fehler, nicht den größten?
        - call: best_mode(np.full((4, 4), 5.0), np.array([0., 10., 0., 10.]), np.array([10., 0., 10., 0.]))
          expect: "'dc'"
          say: Ein ruhiger Block mit überall 5 neben Nachbarn, die abwechselnd 0 und 10 sind, passt am besten zu ihrem Mittelwert, `'dc'`.
    solution: |
      ```python
      def best_mode(block, above, left):
          best, best_error = None, None
          for mode in MODES:
              error = np.abs(block - predict(above, left, mode)).sum()
              if best is None or error < best_error:
                  best, best_error = mode, error
          return best
      ```

