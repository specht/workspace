  - id: compensate
    title: Die Vorhersage aus dem vorigen Bild
    prompt: |
      Schreib in `video/motion.py` die Funktion `compensate(reference, vectors,
      n)`: eine Ebene so groß wie `reference`, jeder Block das Stück von
      `reference`, das um seinen Vektor verschoben liegt.
    check:
      type: python
      file: video/motion.py
      cases:
        - call: 'r = np.arange(36.0).reshape(6, 6); compensate(r, np.zeros((3, 3, 2), dtype=int), 2).tolist() == r.tolist()'
          expect: 'True'
          say: Sind alle Vektoren `(0, 0)`, ist die Vorhersage `reference` selbst.
        - call: 'r = np.arange(36.0).reshape(6, 6); v = np.zeros((3, 3, 2), dtype=int); v[1, 1] = (-1, 1); compensate(r, v, 2)[2:4, 2:4].tolist()'
          expect: '[[19.0, 20.0], [25.0, 26.0]]'
          say: Der Block in Reihe 1 und Spalte 1 beginnt bei (2, 2); mit dem Vektor `(-1, 1)`, eine Spalte nach links und eine Zeile nach unten, kommt er aus `reference[3:5, 1:3]`. Ist der erste Wert `dx`, die Verschiebung der Spalten?
    solution: |
      ```python
      def compensate(reference, vectors, n):
          predicted = np.zeros_like(reference)
          for r, c in np.ndindex(vectors.shape[:2]):
              dx, dy = vectors[r, c]
              y, x = r * n, c * n
              predicted[y:y + n, x:x + n] = reference[y + dy:y + dy + n, x + dx:x + dx + n]
          return predicted
      ```

