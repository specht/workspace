        - call: "from_roman('VI')"
          expect: "6"
        - call: "from_roman('MMXXVI')"
          expect: "2026"
        - call: "from_roman('XL')"
          expect: "40"
        - call: "from_roman('MMMCMXCIX')"
          expect: "3999"
    feedback:
      - when: { same_as: "VALUES = { 'I' => 1, 'V' => 5, 'X' => 10, 'L' => 50, 'C' => 100, 'D' => 500, 'M' => 1000 }\n\ndef from_roman(text)\n  total = 0\n  text.each_char do |char|\n    total += VALUES[char]\n  end\n  total\nend\n" }
        say: "`IV` ist 4, nicht 6: Ein Zeichen vor einem größeren wird abgezogen. Schau beim Zeichen auf das nächste."
    hint: "Ein Hash ordnet jedem Zeichen seinen Wert zu. Geh die Zeichen mit ihrem Index durch, dann kannst du das nächste ansehen: `text[i + 1]`."
    solution: |
      ```ruby
      VALUES = { 'I' => 1, 'V' => 5, 'X' => 10, 'L' => 50, 'C' => 100, 'D' => 500, 'M' => 1000 }

      def from_roman(text)
        total = 0
        text.each_char.with_index do |char, i|
          value = VALUES[char]
          if i + 1 < text.length && VALUES[text[i + 1]] > value
            total -= value
          else
            total += value
          end
        end
        total
      end
      ```
