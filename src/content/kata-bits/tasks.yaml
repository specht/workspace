  - id: to-hex
    title: "Hexadezimal"
    level: 2
    prompt: |
      Im Sechzehnersystem gibt es sechzehn Ziffern: `0` bis `9`, dann `a` bis `f` für 10 bis 15. Farben im Netz schreibt man so (`#ff8800`). Schreib eine Funktion `to_hex(n)`, die `n` als Text im Sechzehnersystem zurückgibt, mit kleinen Buchstaben: `to_hex(255)` ergibt `'ff'`. Ohne `to_s(16)`.
    starter: |
