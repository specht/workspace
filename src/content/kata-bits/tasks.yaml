          expect: "true"
        - call: "power_of_two(12)"
          expect: "false"
        - call: "power_of_two(1)"
          expect: "true"
          say: "1 ist 2 hoch 0, also auch eine Zweierpotenz."
        - call: "power_of_two(0)"
          expect: "false"
          say: "0 ist keine Zweierpotenz."
        - call: "power_of_two(1024)"
          expect: "true"
        - call: "power_of_two(1023)"
          expect: "false"
        - call: "power_of_two(6)"
          expect: "false"
    feedback:
      - when: { same_as: "def power_of_two(n)\n  n % 2 == 0\nend\n" }
