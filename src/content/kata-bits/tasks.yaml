format: 1
activity: kata-bits
tasks:
  - id: to-binary
    title: "Eine Zahl in Bits"
    level: 1
    prompt: |
      Schreib eine Funktion `to_binary(n)`, die eine Zahl ab 0 als Text aus Nullen und Einsen zurückgibt, so wie sie im Rechner steht: `to_binary(13)` ergibt `'1101'`, denn 13 = 8 + 4 + 1. Ohne `to_s(2)`.
    starter: |
      def to_binary(n)
      end
    check:
      type: function
      language: ruby
      forbid: [Integer#to_s, Integer#digits, Integer#inspect, Kernel#format, Kernel#sprintf]
      cases:
        - call: "to_binary(13)"
          expect: "'1101'"
        - call: "to_binary(0)"
          expect: "'0'"
          say: "Die 0 ist `'0'`, nicht ein leerer Text."
        - call: "to_binary(1)"
          expect: "'1'"
        - call: "to_binary(8)"
          expect: "'1000'"
        - call: "to_binary(255)"
          expect: "'11111111'"
        - call: "to_binary(1024)"
          expect: "'10000000000'"
      random:
        count: 4
        call: "to_binary(n)"
        args: { n: 1..100000 }
        reference: "n.to_s(2)"
    feedback:
      - when: { same_as: "def to_binary(n)\n  return '0' if n == 0\n  result = ''\n  while n > 0\n    result += (n % 2 == 1 ? '1' : '0')\n    n /= 2\n  end\n  result\nend\n" }
        say: "Der Rest beim Teilen durch 2 ist das letzte Bit, das ganz rechts. Dein Code hängt jedes neue Bit hinten an, so stehen sie verkehrt herum: Aus 13 wird `'1011'`."
    hint:
      - "`n % 2` ist das letzte Bit, das ganz rechts. `n / 2` streicht es weg. Wiederhole, bis nichts mehr übrig ist, wie bei der Quersumme."
      - "Jedes neue Bit gehört vor die, die du schon hast."
    solution: |
      ```ruby
      def to_binary(n)
        return '0' if n == 0
        result = ''
        while n > 0
          result = (n % 2 == 1 ? '1' : '0') + result
          n /= 2
        end
        result
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `to_binary(n)`, die eine Zahl ab 0 als Text aus Nullen und Einsen zurückgibt, so wie sie im Rechner steht: `to_binary(13)` ergibt `'1101'`, denn 13 = 8 + 4 + 1. Ohne `bin`.
      starter: |
        def to_binary(n):
            pass
      check:
        type: function
        language: python
        forbid: [bin, oct, hex, format, str.format]
        cases:
          - call: "to_binary(13)"
            expect: "'1101'"
          - call: "to_binary(0)"
            expect: "'0'"
            say: "Die 0 ist `'0'`, nicht ein leerer Text."
          - call: "to_binary(1)"
            expect: "'1'"
          - call: "to_binary(8)"
            expect: "'1000'"
          - call: "to_binary(255)"
            expect: "'11111111'"
          - call: "to_binary(1024)"
            expect: "'10000000000'"
        random:
          count: 4
          call: "to_binary(n)"
          args: { n: 1..100000 }
          reference: "bin(n)[2:]"
      feedback:
        - when: { same_as: "def to_binary(n):\n    if n == 0:\n        return '0'\n    result = ''\n    while n > 0:\n        result += str(n % 2)\n        n //= 2\n    return result\n" }
          say: "Der Rest beim Teilen durch 2 ist das letzte Bit, das ganz rechts. Dein Code hängt jedes neue Bit hinten an, so stehen sie verkehrt herum: Aus 13 wird `'1011'`."
      hint:
        - "`n % 2` ist das letzte Bit, das ganz rechts. `n // 2` streicht es weg. Wiederhole, bis nichts mehr übrig ist, wie bei der Quersumme."
        - "Jedes neue Bit gehört vor die, die du schon hast."
      solution: |
        ```python
        def to_binary(n):
            if n == 0:
                return '0'
            result = ''
            while n > 0:
                result = str(n % 2) + result
                n //= 2
            return result
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `toBinary(n)`, die eine Zahl ab 0 als Text aus Nullen und Einsen zurückgibt, so wie sie im Rechner steht: `toBinary(13)` ergibt `'1101'`, denn 13 = 8 + 4 + 1. Ohne `toString(2)`.
      starter: |
        function toBinary(n) {
        }
      check:
        type: function
        language: javascript
        forbid: [Number.prototype.toString, Number.prototype.toFixed]
        cases:
          - call: "toBinary(13)"
            expect: "'1101'"
          - call: "toBinary(0)"
            expect: "'0'"
            say: "Die 0 ist `'0'`, nicht ein leerer Text."
          - call: "toBinary(1)"
            expect: "'1'"
          - call: "toBinary(8)"
            expect: "'1000'"
          - call: "toBinary(255)"
            expect: "'11111111'"
          - call: "toBinary(1024)"
            expect: "'10000000000'"
        random:
          count: 4
          call: "toBinary(n)"
          args: { n: 1..100000 }
          reference: "n.toString(2)"
      feedback:
        - when: { same_as: "function toBinary(n) {\n  if (n === 0) {\n    return '0';\n  }\n  let result = '';\n  while (n > 0) {\n    result += (n % 2);\n    n = Math.floor(n / 2);\n  }\n  return result;\n}\n" }
          say: "Der Rest beim Teilen durch 2 ist das letzte Bit, das ganz rechts. Dein Code hängt jedes neue Bit hinten an, so stehen sie verkehrt herum: Aus 13 wird `'1011'`."
      hint:
        - "`n % 2` ist das letzte Bit, das ganz rechts. `Math.floor(n / 2)` streicht es weg. Wiederhole, bis nichts mehr übrig ist, wie bei der Quersumme."
        - "Jedes neue Bit gehört vor die, die du schon hast."
      solution: |
        ```javascript
        function toBinary(n) {
          if (n === 0) {
            return '0';
          }
          let result = '';
          while (n > 0) {
            result = (n % 2) + result;
            n = Math.floor(n / 2);
          }
          return result;
        }
        ```
  - id: from-binary
    title: "Bits zurück in eine Zahl"
    level: 1
    prompt: |
      Schreib eine Funktion `from_binary(bits)`, die einen Text aus Nullen und Einsen in die Zahl zurückverwandelt: `from_binary('1101')` ergibt `13`. Ohne `to_i(2)`.
    starter: |
      def from_binary(bits)
      end
    check:
      type: function
      language: ruby
      forbid: [String#to_i, String#hex, String#oct]
      cases:
        - call: "from_binary('1101')"
          expect: "13"
        - call: "from_binary('0')"
          expect: "0"
        - call: "from_binary('1')"
          expect: "1"
        - call: "from_binary('10000000')"
          expect: "128"
        - call: "from_binary('11111111')"
          expect: "255"
        - call: "from_binary('0011')"
          expect: "3"
          say: "Nullen vorn ändern nichts."
    feedback:
      - when: { same_as: "def from_binary(bits)\n  value = 0\n  bits.each_char do |bit|\n    value += 1 if bit == '1'\n  end\n  value\nend\n" }
        say: "Du zählst die Einsen. Aber eine Eins ist umso mehr wert, je weiter links sie steht: Mit jeder Stelle nach rechts verdoppelt sich, was schon da ist."
    hint: "Lies von links nach rechts. Bei jedem Bit verdoppelt sich, was du schon hast, und das neue Bit kommt dazu: `'110'` ist 1, dann 1·2 + 1 = 3, dann 3·2 + 0 = 6."
    solution: |
      ```ruby
      def from_binary(bits)
        value = 0
        bits.each_char do |bit|
          value = value * 2 + (bit == '1' ? 1 : 0)
        end
        value
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `from_binary(bits)`, die einen Text aus Nullen und Einsen in die Zahl zurückverwandelt: `from_binary('1101')` ergibt `13`. Ohne `int`.
      starter: |
        def from_binary(bits):
            pass
      check:
        type: function
        language: python
        forbid: [int]
        cases:
          - call: "from_binary('1101')"
            expect: "13"
          - call: "from_binary('0')"
            expect: "0"
          - call: "from_binary('1')"
            expect: "1"
          - call: "from_binary('10000000')"
            expect: "128"
          - call: "from_binary('11111111')"
            expect: "255"
          - call: "from_binary('0011')"
            expect: "3"
            say: "Nullen vorn ändern nichts."
      feedback:
        - when: { same_as: "def from_binary(bits):\n    value = 0\n    for bit in bits:\n        if bit == '1':\n            value += 1\n    return value\n" }
          say: "Du zählst die Einsen. Aber eine Eins ist umso mehr wert, je weiter links sie steht: Mit jeder Stelle nach rechts verdoppelt sich, was schon da ist."
      hint: "Lies von links nach rechts. Bei jedem Bit verdoppelt sich, was du schon hast, und das neue Bit kommt dazu: `'110'` ist 1, dann 1·2 + 1 = 3, dann 3·2 + 0 = 6."
      solution: |
        ```python
        def from_binary(bits):
            value = 0
            for bit in bits:
                value = value * 2 + (1 if bit == '1' else 0)
            return value
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `fromBinary(bits)`, die einen Text aus Nullen und Einsen in die Zahl zurückverwandelt: `fromBinary('1101')` ergibt `13`. Ohne `parseInt` und `Number`.
      starter: |
        function fromBinary(bits) {
        }
      check:
        type: function
        language: javascript
        forbid: [globalThis.parseInt, Number.parseInt, globalThis.Number]
        cases:
          - call: "fromBinary('1101')"
            expect: "13"
          - call: "fromBinary('0')"
            expect: "0"
          - call: "fromBinary('1')"
            expect: "1"
          - call: "fromBinary('10000000')"
            expect: "128"
          - call: "fromBinary('11111111')"
            expect: "255"
          - call: "fromBinary('0011')"
            expect: "3"
            say: "Nullen vorn ändern nichts."
      feedback:
        - when: { same_as: "function fromBinary(bits) {\n  let value = 0;\n  for (const bit of bits) {\n    if (bit === '1') {\n      value += 1;\n    }\n  }\n  return value;\n}\n" }
          say: "Du zählst die Einsen. Aber eine Eins ist umso mehr wert, je weiter links sie steht: Mit jeder Stelle nach rechts verdoppelt sich, was schon da ist."
      hint: "Lies von links nach rechts. Bei jedem Bit verdoppelt sich, was du schon hast, und das neue Bit kommt dazu: `'110'` ist 1, dann 1·2 + 1 = 3, dann 3·2 + 0 = 6."
      solution: |
        ```javascript
        function fromBinary(bits) {
          let value = 0;
          for (const bit of bits) {
            value = value * 2 + (bit === '1' ? 1 : 0);
          }
          return value;
        }
        ```
  - id: bit
    title: "Ein einzelnes Bit"
    level: 1
    prompt: |
      Die Bits einer Zahl zählt man von rechts, beim Bit 0. Schreib eine Funktion `bit(n, i)`, die das Bit `i` von `n` zurückgibt, 0 oder 1: `bit(13, 2)` ergibt `1`, denn 13 ist `1101`. Nur mit Rechnen, ohne die Zahl in einen Text zu verwandeln und ohne `n[i]`.
    starter: |
      def bit(n, i)
      end
    check:
      type: function
      language: ruby
      forbid: [Integer#to_s, Integer#digits, Integer#inspect, Kernel#format, Kernel#sprintf]
      cases:
        - call: "bit(13, 0)"
          expect: "1"
          say: "Bit 0 ist das ganz rechts."
        - call: "bit(13, 1)"
          expect: "0"
        - call: "bit(13, 2)"
          expect: "1"
        - call: "bit(13, 3)"
          expect: "1"
        - call: "bit(13, 4)"
          expect: "0"
          say: "Weiter links stehen nur noch Nullen."
        - call: "bit(1024, 10)"
          expect: "1"
      random:
        count: 4
        call: "bit(n, 5)"
        args: { n: 0..1000 }
        reference: "n[5]"
    hint: "`n % 2` ist Bit 0. Teilst du `n` durch 2, rücken alle Bits einen Platz nach rechts, und Bit 1 wird zu Bit 0."
    solution: |
      ```ruby
      def bit(n, i)
        i.times do
          n /= 2
        end
        n % 2
      end
      ```
    python:
      prompt: |
        Die Bits einer Zahl zählt man von rechts, beim Bit 0. Schreib eine Funktion `bit(n, i)`, die das Bit `i` von `n` zurückgibt, 0 oder 1: `bit(13, 2)` ergibt `1`, denn 13 ist `1101`. Nur mit Rechnen, ohne die Zahl in einen Text zu verwandeln.
      starter: |
        def bit(n, i):
            pass
      check:
        type: function
        language: python
        forbid: [bin, oct, hex, format, str.format, str]
        cases:
          - call: "bit(13, 0)"
            expect: "1"
            say: "Bit 0 ist das ganz rechts."
          - call: "bit(13, 1)"
            expect: "0"
          - call: "bit(13, 2)"
            expect: "1"
          - call: "bit(13, 3)"
            expect: "1"
          - call: "bit(13, 4)"
            expect: "0"
            say: "Weiter links stehen nur noch Nullen."
          - call: "bit(1024, 10)"
            expect: "1"
        random:
          count: 4
          call: "bit(n, 5)"
          args: { n: 0..1000 }
          reference: "(n >> 5) & 1"
      hint: "`n % 2` ist Bit 0. Teilst du `n` durch 2 (`//`), rücken alle Bits einen Platz nach rechts, und Bit 1 wird zu Bit 0."
      solution: |
        ```python
        def bit(n, i):
            for _ in range(i):
                n //= 2
            return n % 2
        ```
    javascript:
      prompt: |
        Die Bits einer Zahl zählt man von rechts, beim Bit 0. Schreib eine Funktion `bit(n, i)`, die das Bit `i` von `n` zurückgibt, 0 oder 1: `bit(13, 2)` ergibt `1`, denn 13 ist `1101`. Nur mit Rechnen, ohne die Zahl in einen Text zu verwandeln.
      starter: |
        function bit(n, i) {
        }
      check:
        type: function
        language: javascript
        forbid: [Number.prototype.toString, Number.prototype.toFixed, globalThis.String]
        cases:
          - call: "bit(13, 0)"
            expect: "1"
            say: "Bit 0 ist das ganz rechts."
          - call: "bit(13, 1)"
            expect: "0"
          - call: "bit(13, 2)"
            expect: "1"
          - call: "bit(13, 3)"
            expect: "1"
          - call: "bit(13, 4)"
            expect: "0"
            say: "Weiter links stehen nur noch Nullen."
          - call: "bit(1024, 10)"
            expect: "1"
        random:
          count: 4
          call: "bit(n, 5)"
          args: { n: 0..1000 }
          reference: "(n >> 5) & 1"
      hint: "`n % 2` ist Bit 0. Teilst du `n` durch 2 und rundest ab, rücken alle Bits einen Platz nach rechts, und Bit 1 wird zu Bit 0."
      solution: |
        ```javascript
        function bit(n, i) {
          for (let k = 0; k < i; k++) {
            n = Math.floor(n / 2);
          }
          return n % 2;
        }
        ```
  - id: binary-length
    title: "Wie viele Bits?"
    level: 1
    prompt: |
      Schreib eine Funktion `binary_length(n)`, die zählt, wie viele Bits `n` braucht: `binary_length(13)` ergibt `4`, denn 13 ist `1101`. Die 0 braucht ein Bit. Nur mit Rechnen.
    starter: |
      def binary_length(n)
      end
    check:
      type: function
      language: ruby
      forbid: [Integer#to_s, Integer#digits, Integer#inspect, Kernel#format, Kernel#sprintf, Integer#bit_length]
      cases:
        - call: "binary_length(13)"
          expect: "4"
        - call: "binary_length(0)"
          expect: "1"
          say: "Die 0 braucht ein Bit."
        - call: "binary_length(1)"
          expect: "1"
        - call: "binary_length(8)"
          expect: "4"
          say: "Die 8 ist `1000`: vier Bits."
        - call: "binary_length(255)"
          expect: "8"
        - call: "binary_length(256)"
          expect: "9"
      random:
        count: 4
        call: "binary_length(n)"
        args: { n: 1..1000000 }
        reference: "n.bit_length"
    feedback:
      - when: { same_as: "def binary_length(n)\n  length = 0\n  while n > 0\n    n /= 2\n    length += 1\n  end\n  length\nend\n" }
        say: "Fast: Bei der 0 läuft deine Schleife nie, und es kommt 0 heraus. Die 0 braucht aber ein Bit."
    hint: "Wie oft kann man `n` durch 2 teilen, bis 1 übrig ist? Jedes Teilen streicht ein Bit."
    solution: |
      ```ruby
      def binary_length(n)
        length = 1
        while n > 1
          n /= 2
          length += 1
        end
        length
      end
      ```
    python:
      starter: |
        def binary_length(n):
            pass
      check:
        type: function
        language: python
        forbid: [bin, oct, hex, format, str.format, str, int.bit_length, math.log2, math.log]
        cases:
          - call: "binary_length(13)"
            expect: "4"
          - call: "binary_length(0)"
            expect: "1"
            say: "Die 0 braucht ein Bit."
          - call: "binary_length(1)"
            expect: "1"
          - call: "binary_length(8)"
            expect: "4"
            say: "Die 8 ist `1000`: vier Bits."
          - call: "binary_length(255)"
            expect: "8"
          - call: "binary_length(256)"
            expect: "9"
        random:
          count: 4
          call: "binary_length(n)"
          args: { n: 1..1000000 }
          reference: "n.bit_length()"
      feedback:
        - when: { same_as: "def binary_length(n):\n    length = 0\n    while n > 0:\n        n //= 2\n        length += 1\n    return length\n" }
          say: "Fast: Bei der 0 läuft deine Schleife nie, und es kommt 0 heraus. Die 0 braucht aber ein Bit."
      hint: "Wie oft kann man `n` durch 2 teilen, bis 1 übrig ist? Jedes Teilen streicht ein Bit."
      solution: |
        ```python
        def binary_length(n):
            length = 1
            while n > 1:
                n //= 2
                length += 1
            return length
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `binaryLength(n)`, die zählt, wie viele Bits `n` braucht: `binaryLength(13)` ergibt `4`, denn 13 ist `1101`. Die 0 braucht ein Bit. Nur mit Rechnen.
      starter: |
        function binaryLength(n) {
        }
      check:
        type: function
        language: javascript
        forbid: [Number.prototype.toString, Number.prototype.toFixed, globalThis.String, Math.log2, Math.clz32, Math.log]
        cases:
          - call: "binaryLength(13)"
            expect: "4"
          - call: "binaryLength(0)"
            expect: "1"
            say: "Die 0 braucht ein Bit."
          - call: "binaryLength(1)"
            expect: "1"
          - call: "binaryLength(8)"
            expect: "4"
            say: "Die 8 ist `1000`: vier Bits."
          - call: "binaryLength(255)"
            expect: "8"
          - call: "binaryLength(256)"
            expect: "9"
        random:
          count: 4
          call: "binaryLength(n)"
          args: { n: 1..1000000 }
          reference: "n.toString(2).length"
      feedback:
        - when: { same_as: "function binaryLength(n) {\n  let length = 0;\n  while (n > 0) {\n    n = Math.floor(n / 2);\n    length++;\n  }\n  return length;\n}\n" }
          say: "Fast: Bei der 0 läuft deine Schleife nie, und es kommt 0 heraus. Die 0 braucht aber ein Bit."
      hint: "Wie oft kann man `n` durch 2 teilen, bis 1 übrig ist? Jedes Teilen streicht ein Bit."
      solution: |
        ```javascript
