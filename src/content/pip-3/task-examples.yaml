        - answer: "function neighbors(cave, x, y) {\n  const result = [];\n  for (const [dx, dy] of [[1, 0], [0, -1], [-1, 0], [0, 1]]) {\n    if (cave[y + dy][x + dx] !== '#') result.push([x + dx, y + dy]);\n  }\n  return result;\n}\n\nfunction distance(cave, start, goal) {\n  const steps = { [start]: 0 };\n  const queue = [start];\n  while (queue.length > 0) {\n    const node = queue.shift();\n    if (node[0] === goal[0] && node[1] === goal[1]) return steps[node];\n    for (const neighbor of neighbors(cave, node[0], node[1])) {\n      if (neighbor in steps) continue;\n      steps[neighbor] = steps[node] + 1;\n      queue.push(neighbor);\n    }\n  }\n  return null;\n}\n"
