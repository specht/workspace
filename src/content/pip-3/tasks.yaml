        List<List<Integer>> neighbors(List<String> cave, int x, int y) {
            List<List<Integer>> result = new ArrayList<>();
            int[][] moves = {{1, 0}, {0, -1}, {-1, 0}, {0, 1}};
            for (int[] m : moves) {
                if (cave.get(y + m[1]).charAt(x + m[0]) != '#') result.add(List.of(x + m[0], y + m[1]));
            }
            return result;
        }

        Integer distance(List<String> cave, List<Integer> start, List<Integer> goal) {
            Map<List<Integer>, Integer> steps = new HashMap<>();
            steps.put(start, 0);
            ArrayDeque<List<Integer>> queue = new ArrayDeque<>();
            queue.add(start);
            while (!queue.isEmpty()) {
                List<Integer> node = queue.poll();
                if (node.equals(goal)) return steps.get(node);
                for (List<Integer> neighbor : neighbors(cave, node.get(0), node.get(1))) {
                    if (steps.containsKey(neighbor)) continue;
                    steps.put(neighbor, steps.get(node) + 1);
                    queue.add(neighbor);
                }
            }
            return null;
        }
