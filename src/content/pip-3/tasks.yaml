            say: "Oben und unten."
      feedback:
        - when: { same_as: "def neighbors(cave, x, y):\n    result = []\n    for dx, dy in [(1, 0), (0, 1), (-1, 0), (0, -1)]:\n        if cave[y + dy][x + dx] != '#':\n            result.append((x + dx, y + dy))\n    return result\n" }
          say: "Die Reihenfolge stimmt nicht: Osten, Norden, Westen, Süden, also rechts, oben, links, unten. Norden ist oben, dort wird y kleiner."
