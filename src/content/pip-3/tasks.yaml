      solution: |
        ```python
        from collections import deque

        def find(cave, tile):
            for y, row in enumerate(cave):
                x = row.find(tile)
                if x != -1:
                    return (x, y)
            return None

        def neighbors(cave, x, y):
            result = []
            for dx, dy in [(1, 0), (0, -1), (-1, 0), (0, 1)]:
                if cave[y + dy][x + dx] != '#':
                    result.append((x + dx, y + dy))
            return result

        def way(cave, start, goal):
            predecessor = {start: None}
            queue = deque([start])
            while queue:
                node = queue.popleft()
                if node == goal:
                    break
                for neighbor in neighbors(cave, *node):
                    if neighbor not in predecessor:
                        predecessor[neighbor] = node
                        queue.append(neighbor)
            if goal not in predecessor:
                return None
            path = []
            node = goal
            while node is not None:
                path.insert(0, node)
                node = predecessor[node]
            return path

        def face(direction):
            while facing() != direction:
                turn_left()

        DIRECTIONS = {(1, 0): 'east', (0, -1): 'north', (-1, 0): 'west', (0, 1): 'south'}

        cave = cave_map()
        path = way(cave, find(cave, 'P'), find(cave, 'L'))
        for (x1, y1), (x2, y2) in zip(path, path[1:]):
            face(DIRECTIONS[(x2 - x1, y2 - y1)])
            move()
