        List<(int, int)>? way(List<String> cave, (int, int) start, (int, int) goal) {
          final predecessor = <(int, int), (int, int)?>{start: null};
          final queue = [start];
          while (queue.isNotEmpty) {
            final node = queue.removeAt(0);
            if (node == goal) break;
            for (final neighbor in neighbors(cave, node.$1, node.$2)) {
              if (predecessor.containsKey(neighbor)) continue;
              predecessor[neighbor] = node;
              queue.add(neighbor);
            }
          }
          if (!predecessor.containsKey(goal)) return null;
          final path = <(int, int)>[];
          for ((int, int)? node = goal; node != null; node = predecessor[node]) {
            path.insert(0, node);
          }
          return path;
