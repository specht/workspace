        ```dart
        (int, int)? find(List<String> cave, String tile) {
          for (var y = 0; y < cave.length; y++) {
            final x = cave[y].indexOf(tile);
            if (x != -1) return (x, y);
          }
          return null;
        }

        List<(int, int)> neighbors(List<String> cave, int x, int y) {
          final result = <(int, int)>[];
          for (final (dx, dy) in [(1, 0), (0, -1), (-1, 0), (0, 1)]) {
            if (cave[y + dy][x + dx] != '#') result.add((x + dx, y + dy));
          }
          return result;
        }

        List<(int, int)>? way(List<String> cave, (int, int) start, (int, int) goal) {
          final predecessor = <(int, int), (int, int)?>{start: null};
          final queue = [start];
          while (queue.isNotEmpty) {
            final node = queue.removeAt(0);
            if (node == goal) break;
            for (final neighbor in neighbors(cave, node.$1, node.$2)) {
              if (predecessor.containsKey(neighbor)) continue;
              predecessor[neighbor] = node;
              queue.add(neighbor);
            }
          }
          if (!predecessor.containsKey(goal)) return null;
          final path = <(int, int)>[];
          for ((int, int)? node = goal; node != null; node = predecessor[node]) {
            path.insert(0, node);
          }
          return path;
        }

        (int, int) nextStep(List<String> cave) {
          final mampfer = find(cave, 'M')!;
          final path = way(cave, find(cave, 'P')!, mampfer);
          return path == null ? mampfer : path[path.length - 2];
        }
