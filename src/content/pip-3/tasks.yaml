  - id: next-step
    title: "Was tut der Mampfer?"
    extra: true
    prompt: |
      Schreib `next_step(cave)`: das Feld, auf das der Mampfer (`M`) als Nächstes geht, wenn Pip (`P`) einen Schritt macht. Er sucht von Pip aus, die Nachbarn in der Reihenfolge Osten, Norden, Westen, Süden, und geht auf den Vorgänger seines Feldes. Findet er keinen Weg, bleibt er stehen. Lampen gibt es hier keine.
    starter: |
      def next_step(cave)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "next_step(['#######', '#M...P#', '#######'])"
          expect: "[2, 1]"
        - call: "next_step(['########', '#....M.#', '#.####.#', '#..P...#', '########'])"
          expect: "[6, 1]"
          say: "Der kürzere Weg führt rechts herum."
        - call: "next_step(['#####', '#M..#', '#.#.#', '#..P#', '#####'])"
          expect: "[2, 1]"
          say: "Zwei Wege sind gleich lang: Pips Suche findet zuerst den über Norden."
        - call: "next_step(['#####', '#M#P#', '#####'])"
          expect: "[1, 1]"
          say: "Der Mampfer findet keinen Weg und bleibt stehen."
    hint: "Mit `find` und `way`: der Weg von Pip zum Mampfer. Das Feld vor seinem letzten ist das, auf das der Mampfer geht."
    solution: |
      ```ruby
      def find(cave, tile)
        cave.each_with_index do |row, y|
          x = row.index(tile)
          return [x, y] if x
        end
        nil
      end

      def neighbors(cave, x, y)
        result = []
        [[1, 0], [0, -1], [-1, 0], [0, 1]].each do |dx, dy|
          result << [x + dx, y + dy] if cave[y + dy][x + dx] != '#'
        end
        result
      end

      def way(cave, start, goal)
        predecessor = { start => nil }
        queue = [start]
        until queue.empty?
          node = queue.shift
          break if node == goal
          neighbors(cave, *node).each do |neighbor|
            next if predecessor.key?(neighbor)
            predecessor[neighbor] = node
            queue << neighbor
          end
        end
        return nil unless predecessor.key?(goal)

        path = []
        node = goal
        while node
          path.unshift(node)
          node = predecessor[node]
        end
        path
      end

      def next_step(cave)
        mampfer = find(cave, 'M')
        path = way(cave, find(cave, 'P'), mampfer)
        path ? path[-2] : mampfer
      end
      ```
