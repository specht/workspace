  - id: find
    title: "Wo ist was?"
    level: 1
    prompt: |
      Der Wichtel gibt dir seine Karte: eine Liste von Zeilen, jede ein Text, `#` ist Fels. Schreib eine Funktion `find(cave, tile)`, die die Stelle von `tile` auf der Karte als `[x, y]` zurückgibt, x die Spalte und y die Zeile, beide ab 0, und `nil`, wenn es nicht vorkommt. Kommt es mehrmals vor, gilt das erste von oben, in seiner Zeile das erste von links.
    starter: |
      def find(cave, tile)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "find(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 'L')"
          expect: "[5, 1]"
        - call: "find(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 'P')"
          expect: "[1, 1]"
          say: "Pip steht oben links, auf x = 1, y = 1."
        - call: "find(['#########', '#P....#.#', '###.#.#.#', '#...#...#', '#.###.#L#', '#.....#.#', '#########'], 'L')"
          expect: "[7, 4]"
        - call: "find(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 'M')"
          expect: "nil"
          say: "Wo es nicht vorkommt."
        - call: "find(['#######', '#.o.P.#', '#o....#', '#######'], 'o')"
          expect: "[2, 1]"
          say: "Das erste von oben."
    feedback:
      - when: { same_as: "def find(cave, tile)\n  cave.each_with_index do |row, y|\n    x = row.index(tile)\n    return [y, x] if x\n  end\n  nil\nend\n" }
        say: "Deine Funktion gibt `[y, x]` zurück: zuerst kommt x, die Spalte, dann y, die Zeile."
    hint: "Geh die Zeilen mit ihrem Index durch; in jeder Zeile sucht `index` (Python: `find`, JavaScript: `indexOf`) das Zeichen."
    solution: |
      ```ruby
      def find(cave, tile)
        cave.each_with_index do |row, y|
          x = row.index(tile)
          return [x, y] if x
        end
        nil
      end
      ```
    python:
      prompt: |
        Der Wichtel gibt dir seine Karte: eine Liste von Zeilen, jede ein Text, `#` ist Fels. Schreib eine Funktion `find(cave, tile)`, die die Stelle von `tile` auf der Karte als Tupel `(x, y)` zurückgibt, x die Spalte und y die Zeile, beide ab 0, und `None`, wenn es nicht vorkommt. Kommt es mehrmals vor, gilt das erste von oben, in seiner Zeile das erste von links.
      starter: |
        def find(cave, tile):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "find(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 'L')"
            expect: "(5, 1)"
          - call: "find(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 'P')"
            expect: "(1, 1)"
            say: "Pip steht oben links, auf x = 1, y = 1."
          - call: "find(['#########', '#P....#.#', '###.#.#.#', '#...#...#', '#.###.#L#', '#.....#.#', '#########'], 'L')"
            expect: "(7, 4)"
          - call: "find(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 'M')"
            expect: "None"
            say: "Wo es nicht vorkommt."
          - call: "find(['#######', '#.o.P.#', '#o....#', '#######'], 'o')"
            expect: "(2, 1)"
            say: "Das erste von oben."
      feedback:
        - when: { same_as: "def find(cave, tile):\n    for y, row in enumerate(cave):\n        x = row.find(tile)\n        if x != -1:\n            return [x, y]\n    return None\n" }
          say: "Deine Funktion gibt eine Liste `[x, y]` zurück; die Prüfung erwartet ein Tupel `(x, y)`."
      hint: "Geh die Zeilen mit ihrem Index durch; in jeder Zeile sucht `index` (Python: `find`, JavaScript: `indexOf`) das Zeichen."
      solution: |
        ```python
        def find(cave, tile):
            for y, row in enumerate(cave):
                x = row.find(tile)
                if x != -1:
                    return (x, y)
            return None
        ```
    javascript:
      prompt: |
        Der Wichtel gibt dir seine Karte: eine Liste von Zeilen, jede ein Text, `#` ist Fels. Schreib eine Funktion `find(cave, tile)`, die die Stelle von `tile` auf der Karte als `[x, y]` zurückgibt, x die Spalte und y die Zeile, beide ab 0, und `null`, wenn es nicht vorkommt. Kommt es mehrmals vor, gilt das erste von oben, in seiner Zeile das erste von links.
      starter: |
        function find(cave, tile) {
        }
      check:
        type: function
        language: javascript
        cases:
          - call: "find(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 'L')"
            expect: "[5, 1]"
          - call: "find(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 'P')"
            expect: "[1, 1]"
            say: "Pip steht oben links, auf x = 1, y = 1."
          - call: "find(['#########', '#P....#.#', '###.#.#.#', '#...#...#', '#.###.#L#', '#.....#.#', '#########'], 'L')"
            expect: "[7, 4]"
          - call: "find(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 'M')"
            expect: "null"
            say: "Wo es nicht vorkommt."
          - call: "find(['#######', '#.o.P.#', '#o....#', '#######'], 'o')"
            expect: "[2, 1]"
            say: "Das erste von oben."
      feedback:
        - when: { same_as: "function find(cave, tile) {\n  for (let y = 0; y < cave.length; y++) {\n    const x = cave[y].indexOf(tile);\n    if (x !== -1) return [y, x];\n  }\n  return null;\n}\n" }
          say: "Deine Funktion gibt `[y, x]` zurück: zuerst kommt x, die Spalte, dann y, die Zeile."
      hint: "Geh die Zeilen mit ihrem Index durch; in jeder Zeile sucht `index` (Python: `find`, JavaScript: `indexOf`) das Zeichen."
      solution: |
        ```javascript
        function find(cave, tile) {
          for (let y = 0; y < cave.length; y++) {
            const x = cave[y].indexOf(tile);
            if (x !== -1) return [x, y];
          }
          return null;
        }
        ```

  - id: neighbors
    title: "Nebenan"
    level: 1
    prompt: |
      Schreib `neighbors(cave, x, y)`: die Felder neben dem Feld x, y, auf die man gehen kann, also alles außer `#`, als Liste von Positionen (`[x, y]`), in der Reihenfolge Osten, Norden, Westen, Süden: rechts, oben, links, unten. Nach unten wird y größer. Jede Karte hat ringsum Fels, du musst also nicht prüfen, ob du über den Rand schaust.
    starter: |
      def neighbors(cave, x, y)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "neighbors(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 1, 1)"
          expect: "[[2, 1], [1, 2]]"
          say: "Rechts und unten ist frei."
        - call: "neighbors(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 3, 2)"
          expect: "[[4, 2], [3, 1], [3, 3]]"
        - call: "neighbors(['#########', '#P....#.#', '###.#.#.#', '#...#...#', '#.###.#L#', '#.....#.#', '#########'], 3, 1)"
          expect: "[[4, 1], [2, 1], [3, 2]]"
        - call: "neighbors(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], 5, 1)"
          expect: "[[5, 2]]"
          say: "Nur unten ist frei."
        - call: "neighbors(['#########', '#P....#.#', '###.#.#.#', '#...#...#', '#.###.#L#', '#.....#.#', '#########'], 5, 2)"
          expect: "[[5, 1], [5, 3]]"
          say: "Oben und unten."
    feedback:
      - when: { same_as: "def neighbors(cave, x, y)\n  result = []\n  [[1, 0], [0, 1], [-1, 0], [0, -1]].each do |dx, dy|\n    result << [x + dx, y + dy] if cave[y + dy][x + dx] != '#'\n  end\n  result\nend\n" }
        say: "Die Reihenfolge stimmt nicht: Osten, Norden, Westen, Süden, also rechts, oben, links, unten. Norden ist oben, dort wird y kleiner."
    hint: "Die vier Richtungen als Liste von Verschiebungen: `[1, 0]`, `[0, -1]`, `[-1, 0]`, `[0, 1]`. Für jede schaust du in `cave[y + dy][x + dx]`."
    solution: |
      ```ruby
      def neighbors(cave, x, y)
        result = []
        [[1, 0], [0, -1], [-1, 0], [0, 1]].each do |dx, dy|
          result << [x + dx, y + dy] if cave[y + dy][x + dx] != '#'
        end
        result
      end
      ```
