        Map<List<Integer>, String> directions = Map.of(List.of(1, 0), "east", List.of(0, -1), "north", List.of(-1, 0), "west", List.of(0, 1), "south");

        void main() {
            List<String> cave = caveMap();
            List<List<Integer>> path = way(cave, find(cave, "P"), find(cave, "L"));
            for (int i = 1; i < path.size(); i++) {
                face(directions.get(List.of(path.get(i).get(0) - path.get(i - 1).get(0), path.get(i).get(1) - path.get(i - 1).get(1))));
                move();
            }
        }
