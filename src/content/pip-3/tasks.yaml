  - id: distance
    title: "Wie weit?"
    level: 2
    prompt: |
      Schreib `distance(cave, start, goal)`: wie viele Schritte der kürzeste Weg von `start` nach `goal` hat, beide Positionen wie bei `find`, und `nil`, wenn es keinen Weg gibt. So sucht der Mampfer: eine Breitensuche, die sich zu jedem gefundenen Feld merkt, wie weit es vom Start ist. Nimm deine Funktion `neighbors` von oben mit hinein.
    starter: |
      def distance(cave, start, goal)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "distance(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], [1, 1], [5, 1])"
          expect: "6"
        - call: "distance(['#########', '#P....#.#', '###.#.#.#', '#...#...#', '#.###.#L#', '#.....#.#', '#########'], [1, 1], [7, 4])"
          expect: "9"
        - call: "distance(['######', '#P#..#', '#.#.##', '#...L#', '######'], [1, 1], [4, 3])"
          expect: "5"
        - call: "distance(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], [2, 1], [2, 1])"
          expect: "0"
          say: "Start und Ziel sind dasselbe Feld."
        - call: "distance(['#######', '#P.#..#', '#..#.L#', '#######'], [1, 1], [5, 2])"
          expect: "nil"
          say: "Hier gibt es keinen Weg."
    hint:
      - "Ein Hash `steps` merkt sich zu jedem gefundenen Feld seinen Abstand; der Start hat 0."
      - "Eine Queue, am Anfang nur der Start. Nimm vorne eines heraus (`shift`): Jeder Nachbar, der noch nicht in `steps` steht, bekommt den Abstand des Feldes plus 1 und kommt hinten in die Queue."
    solution: |
      ```ruby
      def neighbors(cave, x, y)
        result = []
        [[1, 0], [0, -1], [-1, 0], [0, 1]].each do |dx, dy|
          result << [x + dx, y + dy] if cave[y + dy][x + dx] != '#'
        end
        result
      end

      def distance(cave, start, goal)
        steps = { start => 0 }
        queue = [start]
        until queue.empty?
          node = queue.shift
          return steps[node] if node == goal
          neighbors(cave, *node).each do |neighbor|
            next if steps.key?(neighbor)
            steps[neighbor] = steps[node] + 1
            queue << neighbor
          end
        end
        nil
      end
      ```
    python:
      prompt: |
        Schreib `distance(cave, start, goal)`: wie viele Schritte der kürzeste Weg von `start` nach `goal` hat, beide Positionen wie bei `find`, und `None`, wenn es keinen Weg gibt. So sucht der Mampfer: eine Breitensuche, die sich zu jedem gefundenen Feld merkt, wie weit es vom Start ist. Nimm deine Funktion `neighbors` von oben mit hinein.
      starter: |
        def distance(cave, start, goal):
            pass
      check:
        type: function
        language: python
        cases:
          - call: "distance(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], (1, 1), (5, 1))"
            expect: "6"
          - call: "distance(['#########', '#P....#.#', '###.#.#.#', '#...#...#', '#.###.#L#', '#.....#.#', '#########'], (1, 1), (7, 4))"
            expect: "9"
          - call: "distance(['######', '#P#..#', '#.#.##', '#...L#', '######'], (1, 1), (4, 3))"
            expect: "5"
          - call: "distance(['#######', '#P..#L#', '#.#...#', '#...#.#', '#######'], (2, 1), (2, 1))"
            expect: "0"
            say: "Start und Ziel sind dasselbe Feld."
          - call: "distance(['#######', '#P.#..#', '#..#.L#', '#######'], (1, 1), (5, 2))"
            expect: "None"
            say: "Hier gibt es keinen Weg."
      hint:
        - "Ein Dictionary `steps` merkt sich zu jedem gefundenen Feld seinen Abstand; der Start hat 0. Positionen als Tupel gehen als Schlüssel, Listen nicht."
        - "Eine Queue (`collections.deque`), am Anfang nur der Start. Nimm vorne eines heraus (`popleft`): Jeder Nachbar, der noch nicht in `steps` steht, bekommt den Abstand des Feldes plus 1 und kommt hinten hinein."
      solution: |
        ```python
        from collections import deque

        def neighbors(cave, x, y):
            result = []
            for dx, dy in [(1, 0), (0, -1), (-1, 0), (0, 1)]:
                if cave[y + dy][x + dx] != '#':
                    result.append((x + dx, y + dy))
            return result

        def distance(cave, start, goal):
            steps = {start: 0}
            queue = deque([start])
            while queue:
                node = queue.popleft()
                if node == goal:
                    return steps[node]
                for neighbor in neighbors(cave, *node):
                    if neighbor not in steps:
                        steps[neighbor] = steps[node] + 1
                        queue.append(neighbor)
            return None
        ```
