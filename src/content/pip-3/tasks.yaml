  - id: escape
    title: "Der kürzeste Weg"
    level: 3
    prompt: |
      Jetzt alles zusammen: Lies mit `cave_map` die Karte, such mit deiner Funktion `way` den kürzesten Weg von Pip zur Lampe und lauf ihn ab, mit `face` vor jedem Schritt. Der Mampfer ist so schnell wie Pip, nur der kürzeste Weg ist schnell genug. Die Prüfung schickt Pip durch drei Höhlen; zwei baut der Wichtel für dich.
    starter: |
      # deine Funktionen find, neighbors, way und face von oben

      cave = cave_map
    check:
      type: pip
      language: ruby
      commands: [move, turn_left, cave_map, facing]
      maps:
        - facing: south
          map: |
            #############
            #P#.......#.#
            #.#.#####.#.#
            #...........#
            ###.#.#####.#
            #...#.......#
            #.#.#.###.#.#
            #.#...#.#.#.#
            #.#.###.#.#.#
            #L......#..M#
            #############
        - generate: chase
          size: [6, 5]
        - generate: chase
          size: [6, 5]
      goal: { lamp: true }
    hint:
      - "`find(cave, 'P')` und `find(cave, 'L')` geben dir Start und Ziel für `way`."
      - "Von einem Feld zum nächsten: x + 1 ist Osten, y − 1 Norden, x − 1 Westen, y + 1 Süden. Ein Dictionary von der Verschiebung zur Richtung hilft."
    solution: |
      ```ruby
      def find(cave, tile)
        cave.each_with_index do |row, y|
          x = row.index(tile)
          return [x, y] if x
        end
        nil
      end

      def neighbors(cave, x, y)
        result = []
        [[1, 0], [0, -1], [-1, 0], [0, 1]].each do |dx, dy|
          result << [x + dx, y + dy] if cave[y + dy][x + dx] != '#'
        end
        result
      end

      def way(cave, start, goal)
        predecessor = { start => nil }
        queue = [start]
        until queue.empty?
          node = queue.shift
          break if node == goal
          neighbors(cave, *node).each do |neighbor|
            next if predecessor.key?(neighbor)
            predecessor[neighbor] = node
            queue << neighbor
          end
        end
        return nil unless predecessor.key?(goal)

        path = []
        node = goal
        while node
          path.unshift(node)
          node = predecessor[node]
        end
        path
      end

      def face(direction)
        turn_left until facing == direction
      end

      DIRECTIONS = { [1, 0] => 'east', [0, -1] => 'north', [-1, 0] => 'west', [0, 1] => 'south' }

      cave = cave_map
      path = way(cave, find(cave, 'P'), find(cave, 'L'))
      path.each_cons(2) do |(x1, y1), (x2, y2)|
        face(DIRECTIONS[[x2 - x1, y2 - y1]])
        move
      end
      ```
