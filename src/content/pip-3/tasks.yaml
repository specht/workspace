          - { call: "nextStep(List.of(\"#####\", \"#M..#\", \"#.#.#\", \"#..P#\", \"#####\"))", expect: "List.of(2, 1)", say: "Zwei Wege sind gleich lang: Pips Suche findet zuerst den über Norden." }
