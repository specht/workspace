            ArrayDeque<List<Integer>> queue = new ArrayDeque<>();
            queue.add(start);
            while (!queue.isEmpty()) {
                List<Integer> node = queue.poll();
                if (node.equals(goal)) break;
                for (List<Integer> neighbor : neighbors(cave, node.get(0), node.get(1))) {
                    if (predecessor.containsKey(neighbor)) continue;
                    predecessor.put(neighbor, node);
                    queue.add(neighbor);
                }
            }
            if (!predecessor.containsKey(goal)) return null;
            List<List<Integer>> path = new ArrayList<>();
            for (List<Integer> node = goal; node != null; node = predecessor.get(node)) {
                path.add(0, node);
            }
            return path;
        }
        ```

