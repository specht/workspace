      solution: |
        ```java
        List<Integer> find(List<String> cave, String tile) {
            for (int y = 0; y < cave.size(); y++) {
                int x = cave.get(y).indexOf(tile);
                if (x != -1) return List.of(x, y);
            }
            return null;
        }

        List<List<Integer>> neighbors(List<String> cave, int x, int y) {
            List<List<Integer>> result = new ArrayList<>();
            int[][] moves = {{1, 0}, {0, -1}, {-1, 0}, {0, 1}};
            for (int[] m : moves) {
                if (cave.get(y + m[1]).charAt(x + m[0]) != '#') result.add(List.of(x + m[0], y + m[1]));
            }
            return result;
        }

        List<List<Integer>> way(List<String> cave, List<Integer> start, List<Integer> goal) {
            Map<List<Integer>, List<Integer>> predecessor = new HashMap<>();
            predecessor.put(start, null);
            ArrayDeque<List<Integer>> queue = new ArrayDeque<>();
            queue.add(start);
            while (!queue.isEmpty()) {
                List<Integer> node = queue.poll();
                if (node.equals(goal)) break;
                for (List<Integer> neighbor : neighbors(cave, node.get(0), node.get(1))) {
                    if (predecessor.containsKey(neighbor)) continue;
                    predecessor.put(neighbor, node);
                    queue.add(neighbor);
                }
            }
            if (!predecessor.containsKey(goal)) return null;
            List<List<Integer>> path = new ArrayList<>();
            for (List<Integer> node = goal; node != null; node = predecessor.get(node)) {
                path.add(0, node);
            }
            return path;
        }

        List<Integer> nextStep(List<String> cave) {
            List<Integer> mampfer = find(cave, "M");
            List<List<Integer>> path = way(cave, find(cave, "P"), mampfer);
            return path == null ? mampfer : path.get(path.size() - 2);
        }
