      ```ruby
      def find(cave, tile)
        cave.each_with_index do |row, y|
          x = row.index(tile)
          return [x, y] if x
        end
        nil
      end

      def neighbors(cave, x, y)
        result = []
        [[1, 0], [0, -1], [-1, 0], [0, 1]].each do |dx, dy|
          result << [x + dx, y + dy] if cave[y + dy][x + dx] != '#'
        end
        result
      end

      def way(cave, start, goal)
        predecessor = { start => nil }
        queue = [start]
        until queue.empty?
          node = queue.shift
          break if node == goal
          neighbors(cave, *node).each do |neighbor|
            next if predecessor.key?(neighbor)
            predecessor[neighbor] = node
            queue << neighbor
          end
        end
        return nil unless predecessor.key?(goal)

        path = []
        node = goal
        while node
          path.unshift(node)
          node = predecessor[node]
        end
        path
      end

      def face(direction)
        turn_left until facing == direction
      end

      DIRECTIONS = { [1, 0] => 'east', [0, -1] => 'north', [-1, 0] => 'west', [0, 1] => 'south' }

