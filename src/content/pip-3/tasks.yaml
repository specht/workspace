        ```javascript
        function find(cave, tile) {
          for (let y = 0; y < cave.length; y++) {
            const x = cave[y].indexOf(tile);
            if (x !== -1) return [x, y];
          }
          return null;
        }

        function neighbors(cave, x, y) {
          const result = [];
          for (const [dx, dy] of [[1, 0], [0, -1], [-1, 0], [0, 1]]) {
            if (cave[y + dy][x + dx] !== '#') result.push([x + dx, y + dy]);
          }
          return result;
        }

        function way(cave, start, goal) {
          const predecessor = { [start]: null };
          const queue = [start];
          while (queue.length > 0) {
            const node = queue.shift();
            if (node[0] === goal[0] && node[1] === goal[1]) break;
            for (const neighbor of neighbors(cave, node[0], node[1])) {
              if (neighbor in predecessor) continue;
              predecessor[neighbor] = node;
              queue.push(neighbor);
            }
          }
          if (!(goal in predecessor)) return null;
          const path = [];
          for (let node = goal; node !== null; node = predecessor[node]) path.unshift(node);
          return path;
        }

        function face(direction) {
          while (facing() !== direction) turnLeft();
        }

        const DIRECTIONS = { '1,0': 'east', '0,-1': 'north', '-1,0': 'west', '0,1': 'south' };

        const cave = caveMap();
        const path = way(cave, find(cave, 'P'), find(cave, 'L'));
        for (let i = 1; i < path.length; i++) {
