      solution: |
        ```dart
        (int, int)? find(List<String> cave, String tile) {
          for (var y = 0; y < cave.length; y++) {
            final x = cave[y].indexOf(tile);
            if (x != -1) return (x, y);
          }
          return null;
        }

        List<(int, int)> neighbors(List<String> cave, int x, int y) {
          final result = <(int, int)>[];
          for (final (dx, dy) in [(1, 0), (0, -1), (-1, 0), (0, 1)]) {
            if (cave[y + dy][x + dx] != '#') result.add((x + dx, y + dy));
          }
          return result;
