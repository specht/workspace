  - id: steps
    title: "Was kostet ein Weg?"
    extra: true
    prompt: |
      Ein Weg ist eine Liste von Feldern, wie `way` sie liefert. Schreib `steps(path, facing)`: wie viele Schritte er Pip kostet, wenn Pip am Anfang in Richtung `facing` schaut (`'east'`, `'north'`, `'west'` oder `'south'`) und sich nur nach links drehen kann. Jeder Schritt vorwärts zählt, jede Drehung auch.
    starter: |
      def steps(path, facing)
      end
    check:
      type: function
      language: ruby
      cases:
        - call: "steps([[1, 1], [2, 1], [3, 1]], 'east')"
          expect: "2"
        - call: "steps([[1, 1], [2, 1], [2, 0]], 'east')"
          expect: "3"
          say: "Einmal links: ein Schritt mehr."
        - call: "steps([[1, 1], [2, 1], [2, 2]], 'east')"
          expect: "5"
          say: "Rechts sind drei Drehungen nach links."
        - call: "steps([[3, 1], [2, 1], [1, 1]], 'east')"
          expect: "4"
          say: "Umdrehen: zwei Drehungen."
        - call: "steps([[2, 2]], 'south')"
          expect: "0"
          say: "Ein Weg aus einem Feld kostet nichts."
    hint: "Nach links dreht Pip in der Reihenfolge Osten, Norden, Westen, Süden weiter. Wie viele Drehungen von einer Richtung zur anderen? Der Abstand in dieser Liste, modulo 4."
    solution: |
      ```ruby
      def steps(path, facing)
        directions = { [1, 0] => 'east', [0, -1] => 'north', [-1, 0] => 'west', [0, 1] => 'south' }
        order = %w[east north west south]
        total = 0
        path.each_cons(2) do |(x1, y1), (x2, y2)|
          want = directions[[x2 - x1, y2 - y1]]
          total += (order.index(want) - order.index(facing)) % 4 + 1
          facing = want
        end
        total
      end
      ```
