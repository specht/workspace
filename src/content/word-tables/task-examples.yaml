# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): Das Programm als Tabelle (stufen/) muss die Prüfung
# bestehen, die Vorlage (src/static/word-tables) an ihr scheitern. Beide
# macht dokumente.py.
format: 1
activity: word-tables
examples:
  programm:
    pass:
      - document: stufen/programm.docx
    fail:
      - document: ../../static/word-tables/04 Programm.docx
        say: Tabelle
  runde:
    pass:
      - document: stufen/sportfest.docx
    fail:
      - document: ../../static/word-tables/04 Sportfest.docx
        say: Tabelle
  handgriffe:
    pass:
      - document: stufen/punktestand.docx
    fail:
      - document: ../../static/word-tables/04 Punktestand.docx
        say: »7d« finde ich noch nicht in der Tabelle
      - document: stufen/punktestand-wie-woerter.docx
        say: Typ »Zahl«
  fallen:
    pass:
      - document: stufen/projektwoche.docx
    fail:
      - document: ../../static/word-tables/04 Projektwoche.docx
        say: 0 von 9 Fallen gefunden
      - document: stufen/projektwoche-acht.docx
        say: 8 von 9 Fallen gefunden
