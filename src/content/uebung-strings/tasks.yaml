# Übungsset »Strings«: Aufgaben aus Code Bites (src/codebites/tasks).
# Gelöst ist eine Aufgabe, sobald ihr Code im Code-Editor alle Tests besteht.
# Format: docs/aufgaben.md
format: 1
activity: uebung-strings
tasks:
  - id: reverse-string
    title: String umkehren
    prompt: 'Implementiere eine Funktion `reverse_string`, die einen gegebenen String umkehrt.'
    check:
      type: code
      codebite: reverse_string

  - id: count-vowels
    title: Vokale zählen
    prompt: 'Implementiere eine Funktion `count_vowels`, die die Anzahl der Vokale in einem gegebenen String zählt. Als Vokale gelten die Buchstaben a, e, i, o und u (sowohl in Groß- als auch in Kleinbuchstaben).'
    check:
      type: code
      codebite: count_vowels
