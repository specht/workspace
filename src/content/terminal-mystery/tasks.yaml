# Aufgaben zu »Ein Krimi im Terminal«. Format: docs/aufgaben.md.
# Die Akten kommen aus beispiele/bitstein.tar.gz, gebaut von
# beispiele/make_case.rb, und liegen nach dem Entpacken in /workspace/bitstein.
# Die Zahlen unten stammen aus diesem Archiv; das Skript gibt sie aus.
# Befehle laufen in /workspace/bitstein (dir), wie im Terminal der Seite;
# mit bitstein/ davor oder cd bitstein laufen sie in /workspace.
format: 1
activity: terminal-mystery
tasks:
  - id: entpackt
    title: Die Akten
    prompt: Lade das Archiv mit den Akten herunter und entpacke es in deinem Home-Verzeichnis.
    check:
      type: files
      path: bitstein/tatort.txt
      expect:
        format: text
    feedback:
      - when: { problem: missing }
        say: Es fehlt `bitstein/tatort.txt`. Entpacke das Archiv mit `tar xzf bitstein.tar.gz` in `~`, also in `/workspace`.

  - id: hinweise
    title: Die Hinweise
    prompt: |
      Schreib einen Befehl, der aus `tatort.txt` genau die Zeilen ausgibt, die
      mit `HINWEIS` anfangen.
    check:
      type: command
      dir: bitstein
      timeout: 10
      output:
        lines: 5
        matching: '^HINWEIS:'
    feedback:
      - when: { output_matches: 'Bitte nicht berühren' }
        say: Eine Zeile zu viel, das Schild an Vitrine 4. Dort steht `HINWEIS` mitten in der Zeile. Mit `^` passt das Muster nur am Anfang einer Zeile.
      - when: { output_matches: 'No such file' }
        say: Diese Datei gibt es nicht. Der Befehl läuft im Ordner `bitstein`, wie in deinem Terminal; schreib den Namen so, wie `ls` ihn dort zeigt.
    solution: "`grep '^HINWEIS' tatort.txt`"

  - id: gross-klein
    title: Groß oder klein
    prompt: In wie vielen Zeilen von `tatort.txt` steht `hinweis`, egal ob groß oder klein geschrieben?
    check:
      type: number
      expect: 181
    feedback:
      - when: { equals: 6 }
        say: Das sind die Zeilen mit `HINWEIS` in Großbuchstaben. Mit `-i` zählt `grep` auch `Hinweis` und `hinweis`.
      - when: { equals: 5 }
        say: Das sind nur die Zeilen, die mit `HINWEIS` anfangen. Gesucht ist das Wort überall und in jeder Schreibweise, mit `-i`.
    hint: '`grep -c` zählt Zeilen, `grep -i` macht Groß und Klein gleich.'
    solution: "`grep -ic hinweis tatort.txt` ergibt 181."

  - id: zeugin
    title: Die Zeugin
    prompt: |
      Schreib einen Befehl, der aus `strassen/moewenweg.txt` genau die Zeile
      der Zeugin ausgibt, und nur sie.
    check:
      type: command
      dir: bitstein
      timeout: 10
      output:
        lines: 1
        matching: 'befragung-3817'
    feedback:
      - when: { output_matches: 'befragung-2290' }
        say: Das ist Herr Kowalczyk aus Hausnummer 32, er hat sein eigenes Auto gesehen. Die Zeugin wohnt in Nummer 23.
    hint: '`head -n 23` gibt die ersten 23 Zeilen aus. Was ist davon die letzte?'
    solution: "`head -n 23 strassen/moewenweg.txt | tail -n 1`"

  - id: nachtwaechter
    title: Der Nachtwächter
    prompt: Welche Nummer hat die Befragung des Nachtwächters Ole Brandt?
    check:
      type: answer
      compare: regex
      expect: '^\s*(befragungen/)?(befragung-)?1290(\.txt)?\s*$'
    feedback:
      - when: { matches: '3315|4909|7510' }
        say: In dieser Befragung kommt Ole Brandt vor, aber befragt wurde jemand anders. Schau, wer in der zweiten Zeile steht.
    hint: '`grep -l` nennt nur die Dateien, in denen das Muster vorkommt.'
    solution: "`grep -l \"Ole Brandt\" befragungen/*` nennt vier Dateien; befragt wurde er in `befragung-1290.txt`."

  - id: autos
    title: Das gelbe Auto
    prompt: |
      Schreib einen Befehl, der aus `fahrzeuge.txt` genau die Autos ausgibt,
      die zur Aussage der Zeugin passen.
    check:
      type: command
      dir: bitstein
      timeout: 10
      output:
        lines: 4
        matching: '^BS-K\S* \d*7 +gelb '
    feedback:
      - when: { output_matches: '^BS-K\S* \d*[0-689] ' }
        say: Da ist noch ein Auto dabei, dessen Kennzeichen nicht auf 7 endet.
      - when: { output_matches: '^BS-[A-JL-Z]' }
        say: Da ist noch ein Kennzeichen dabei, das nicht mit `BS-K` anfängt. Mit `^` passt das Muster nur am Anfang der Zeile.
      - when: { output_matches: '^BS-K\S* \d+ +(?!gelb)' }
        say: Da ist noch ein Auto dabei, das nicht gelb ist.
    hint: "Mehrere `grep` hintereinander, mit `|` verbunden: Jedes siebt weiter aus, was das vorige übrig lässt."
    solution: "`grep '^BS-K' fahrzeuge.txt | grep gelb | grep '7 '`"

  - id: beide-vereine
    title: In beiden Vereinen
    prompt: |
      Schreib einen Befehl, der alle ausgibt, die im Schachclub und im
      Fitnessstudio Muskelkater sind, jeden Namen einmal.
    check:
      type: command
      dir: bitstein
      timeout: 10
      output:
        lines: 6
        matching: '^[A-ZÄÖÜ]\S* [A-ZÄÖÜ]\S*$'
    feedback:
      - when: { output_matches: '^\s+\d+ ' }
        say: Vor den Namen stehen noch Zahlen. `uniq -c` zählt; `uniq -d` gibt nur die doppelten Zeilen aus.
    hint: Schreib beide Listen sortiert untereinander. Wer in beiden Vereinen ist, steht dann zweimal direkt hintereinander.
    solution: "`sort vereine/schachclub.txt vereine/muskelkater.txt | uniq -d`"

  - id: verdaechtige
    title: Zwei Verdächtige
    prompt: Wer hat eins der vier Autos und ist im Schachclub und im Fitnessstudio?
    check:
      type: choice
      options:
        - Konstantin Reuter und Marlene Voss
        - Emil Schütte und Ayşe Demir
        - Konstantin Reuter und Emil Schütte
        - Marlene Voss und Ayşe Demir
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Beide haben ein passendes Auto. Aber Emil Schütte ist nur im Schachclub und Ayşe Demir nur im Fitnessstudio.
      - when: { picked: 2 }
        say: Emil Schütte ist im Schachclub, aber nicht im Fitnessstudio.
      - when: { picked: 3 }
        say: Ayşe Demir trainiert im Muskelkater, ist aber nicht im Schachclub.
    solution: |
      `sort` beide Mitgliederlisten zusammen und `uniq -d` lässt nur die Namen,
      die doppelt vorkommen: die sechs, die in beiden Vereinen sind. Von ihnen
      haben nur Konstantin Reuter und Marlene Voss eins der vier gelben Autos mit
      `BS-K…` und einer 7 am Ende.

  - id: karte
    title: Die gelöschte Karte
    prompt: Mit welcher Karte wurde in der Nacht der Hintereingang geöffnet?
    check:
      type: answer
      compare: regex
      expect: '^\s*(Karte\s*)?4471\s*$'
    feedback:
      - when: { matches: '100[1-5]' }
        say: Diese Karte steht noch im Protokoll, sie war immer schon da. Gesucht ist eine, die jemand aus `zugaenge.log` gelöscht hat.
    hint: '`git log --author=Wartung` zeigt, was die Wartung committet hat. `git show` und die ersten Zeichen des Hashs zeigen, was sich dabei geändert hat.'
    solution: "`git show` des Commits »Wartung beendet«: Er löscht zwei Zeilen mit Karte 4471, 23:12 und 23:38 Uhr am Hintereingang."

  - id: taeter
    title: Wer war es?
    prompt: Wer hat die Goldene Diskette gestohlen? Vor- und Nachname.
    check:
      type: answer
      expect: Konstantin Reuter
    feedback:
      - when: { matches: '^\s*Marlene\s+Voss\s*$' }
        say: Marlene Voss hat ein gelbes Auto und ist in beiden Vereinen. Aber was sagt die Alarmanlage, und wem gehört die Karte?
      - when: { matches: '^\s*Dieter\s+Reuter\s*$' }
        say: Dieter Reuter hat die Firma gegründet und ist im Schachclub. Aber sein Auto ist silbern, und ins Fitnessstudio geht er nicht.
      - when: { matches: '^\s*Reuter\s*$' }
        say: In Bitstein wohnen vier Reuters. Welcher?
      - when: { matches: '^\s*(Paula|Jonas)\s+Reuter\s*$' }
        say: Schau in `personen.txt` nach, was die vier Reuters arbeiten.
      - when: { matches: 'Ole|Brandt' }
        say: Der Nachtwächter hat den Dieb gesehen, nicht gemacht.
    solution: Konstantin Reuter, Elektriker bei Elektro Reuter. Die Firma hat die Anlage 2024 eingebaut und die Karte 4471 nie zurückgegeben.

  # Nur mit dem Fallserver (CASE_SERVER = true, docs/entwicklung.md); die
  # Seite zeigt sie sonst nicht. Die Werte kommen aus beispiele/make_case.rb.
  - id: vpn
    title: Wer kam in der Nacht?
    prompt: Von welcher Adresse hat sich die Wartung in der Nacht der Tat mit dem VPN des Museums verbunden?
    check:
      type: answer
      expect: 10.8.0.23
    feedback:
      - when: { matches: '10\.8\.0\.31' }
        say: Das war die echte Wartung, am 3. März um 10 Uhr morgens. Gesucht ist die Nacht vom 14. auf den 15. März.
    hint: '`grep wartung logs/vpn.log`'
    solution: |
      `logs/vpn.log` auf dem Museumsserver zeigt um 23:02 Uhr eine Verbindung der
      Wartung von `10.8.0.23`, kurz vor der Karte 4471 an der Hintertür.

  - id: geraet
    title: Wessen Gerät?
    prompt: Wem gehört das Gerät mit dieser Adresse?
    check:
      type: answer
      expect: [Elektro Reuter, Reuter, Konstantin Reuter]
    feedback:
      - when: { matches: 'Nordlicht' }
        say: Nordlicht hat die Adresse 10.8.0.31. Welche hatte die Wartung in der Nacht?
    hint: Die Adressen der Geräte stehen in `geraete.txt`.
    solution: |
      In `geraete.txt` gehört `10.8.0.23` zum Laptop von Elektro Reuter, der
      Firma, die die Alarmanlage eingebaut hat und noch immer ihr Wartungspasswort
      kennt.

  - id: loeschbefehl
    title: Der Befehl aus der Nacht
    prompt: Mit welchem Befehl wurden die beiden Zeilen aus `zugaenge.log` gelöscht? Schreib ihn so ab, wie er in der `.bash_history` steht.
    check:
      type: answer
      compare: regex
      expect: '^\s*sed\s+-i\s+[''"]?/4471/d[''"]?\s+zugaenge\.log\s*$'
    feedback:
      - when: { matches: 'nano' }
        say: Mit `nano` wurden die Einstellungen geändert. Gesucht ist der Befehl, der die Zeilen mit der Karte löscht.
      - when: { matches: '^\s*git' }
        say: Das ist der Commit danach. Gesucht ist der Befehl davor, der die Zeilen löscht.
    hint: Vor und nach dem Löschen hat er mit `tail -n 3 zugaenge.log` nachgesehen. Dazwischen steht der Befehl, der `zugaenge.log` ändert, auch wenn du ihn noch nicht kennst.
    solution: "`sed -i '/4471/d' zugaenge.log` um 23:40 Uhr: `sed` löscht (`d`) jede Zeile, in der 4471 steht, und schreibt die Datei gleich zurück (`-i`)."

  - id: wartungspasswort
    title: Das Passwort der Wartung
    prompt: Wie lautet das Passwort der Wartung, mit dem du auf die Alarmanlage kommst?
    check:
      type: answer
      expect: Leuchtturm-2024
    hint: Auf `museum.bitstein` liegen die Unterlagen der Wartungsfirmen im Ordner `wartung`. `grep -ri passwort` sucht in allen Dateien darunter, ohne auf Groß- und Kleinschreibung zu achten.
    solution: "`grep -ri passwort wartung` findet es im Übergabeprotokoll von 2025: Elektro Reuter hat es beim Einbau gesetzt, und geändert hat es nie jemand. Damit kam auch in der Nacht jemand hinein."

  - id: eindringling
    title: Wer ist noch da?
    prompt: Neben dir ist auf der Alarmanlage noch `wartung` angemeldet. Was versucht er gerade?
    check:
      type: choice
      options:
        - Die Datei `.bash_history` zu löschen, in der steht, was in der Nacht getippt wurde.
        - Die Alarmanlage noch einmal auszuschalten.
        - Sich abzumelden.
        - Eine neue Zugangskarte anzulegen.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Dafür müsste er `einstellungen.txt` ändern. Welche Datei nennt sein Prozess in `ps aux`?
      - when: { picked: 3 }
        say: Karten stehen in `karten.txt`. Welche Datei nennt sein Prozess in `ps aux`?
    solution: "`ps aux` zeigt den Prozess `rm -i /home/wartung/.bash_history` des Benutzers `wartung`, und `who` die Adresse 10.8.0.23, den alten Laptop von Elektro Reuter. Jemand will die Spuren der Nacht beseitigen."

  - id: beweis
    title: Beweise sichern
    prompt: Kopier die `.bash_history` der Wartung mit `scp` nach `bitstein/beweis.txt` in deinem Workspace.
    check:
      type: files
      path: bitstein/beweis.txt
      expect:
        format: text
        contains:
          - { pattern: '4471', say: 'In der Datei fehlt der Befehl mit der Karte 4471. Ist es die `.bash_history` von der Alarmanlage?' }
          - 'Wartung beendet'
    feedback:
      - when: { problem: missing }
        say: 'Es gibt noch keine `bitstein/beweis.txt`. `scp` kopiert in deinem Workspace, also ohne Verbindung zum Museum: `scp -J … ~/bitstein/beweis.txt`.'

  - id: kamera-bilder
    title: Die Bilder der Ausstellung
    prompt: Kopier mit `scp` alle Bilder der Kamera 1 vom Museum nach `bitstein/kameras/` in deinem Workspace.
    check:
      type: files
      path: bitstein/kameras
      show: listing
      expect:
        new_files: { min: 7 }
        name: '^cam[123]_20260314_\d{6}\.jpg$'
        format_matches_extension: true
    feedback:
      - when: { problem: missing }
        say: 'Es gibt noch keinen Ordner `bitstein/kameras`. Leg ihn in deinem Workspace an, `mkdir -p ~/bitstein/kameras`, und kopier dann mit `scp` hinein.'
      - when: { problem: no_new_files }
        say: 'Kamera 1 hat in der Nacht sieben Bilder aufgenommen. `ls kameras/cam1_*` auf dem Museum zeigt sie; mit Anführungszeichen um den Pfad holt `scp` alle auf einmal.'
    hint: '`scp ''e123@museum.bitstein:kameras/cam1_*'' ~/bitstein/kameras/`, mit deinem Benutzer statt `e123`, in deinem Workspace.'

  - id: kamera-auto
    title: Das Auto auf dem Parkplatz
    prompt: Vier gelbe Autos passen zu dem, was die Zeugin gesehen hat. Welches davon fährt auf Kamera 3 vom Parkplatz?
    check:
      type: choice
      options:
        - Der Kombi `BS-KR 2417`
        - Der Kleinwagen `BS-KM 3107`
        - Der Transporter `BS-KE 8807`
        - Der Kleinwagen `BS-KD 1147`
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Ein Kleinwagen ist kurz, und hinten fällt sein Dach ab. Wie lang ist das Dach des Autos auf Kamera 3?
      - when: { picked: 3 }
        say: Ein Kleinwagen ist kurz, und hinten fällt sein Dach ab. Wie lang ist das Dach des Autos auf Kamera 3?
      - when: { picked: 2 }
        say: Ein Transporter ist hoch und kastenförmig, hinten mit großen Türen. Sieht das Auto auf Kamera 3 so aus?
    hint: Die Karte hat den Hintereingang um 23:38 geöffnet. Welche Bilder der Kamera 3 sind aus dieser Minute?
    solution: '`cam3_20260314_2338*` sind vier Bilder von 23:38:14 bis 23:38:48: Jemand legt eine Tasche in den Kofferraum eines gelben Kombis, der ohne Licht rückwärts ausparkt. Von den vier Autos ist nur `BS-KR 2417` ein Kombi, das von Konstantin Reuter.'
