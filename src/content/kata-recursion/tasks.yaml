  - id: flatten
    title: "Listen in Listen"
    level: 3
    prompt: |
      In einer Liste können wieder Listen stehen, beliebig tief: `[1, [2, [3, 4]], 5]`. Schreib `flatten(items)`, die alle Zahlen in einer flachen Liste zurückgibt, in ihrer Reihenfolge: `[1, 2, 3, 4, 5]`. Ohne `flatten`.
    starter: |
      def flatten(items)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#flatten, "Array#flatten!"]
      recursive: true
      cases:
        - call: "flatten([1, [2, [3, 4]], 5])"
          expect: "[1, 2, 3, 4, 5]"
        - call: "flatten([])"
          expect: "[]"
        - call: "flatten([[[[7]]]])"
          expect: "[7]"
          say: "Auch ganz tief drinnen."
        - call: "flatten([1, 2, 3])"
          expect: "[1, 2, 3]"
        - call: "flatten([[], [1, []], 2])"
          expect: "[1, 2]"
          say: "Leere Listen geben nichts."
    feedback:
      - when: { same_as: "def flatten(items)\n  result = []\n  items.each do |item|\n    if item.is_a?(Array)\n      result += item\n    else\n      result << item\n    end\n  end\n  result\nend\n" }
        say: "Das macht nur eine Ebene flach: In `[2, [3, 4]]` bleibt `[3, 4]` eine Liste. Ruf für jede Liste in der Liste wieder `flatten` auf."
    hint:
      - "Geh die Elemente durch. `item.is_a?(Array)` fragt, ob ein Element selbst eine Liste ist."
      - "Ist es eine, machst du sie mit `flatten` flach, bevor sie ins Ergebnis kommt."
    solution: |
      ```ruby
      def flatten(items)
        result = []
        items.each do |item|
          if item.is_a?(Array)
            result += flatten(item)
          else
            result << item
          end
        end
        result
      end
      ```
