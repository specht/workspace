  - id: power
    title: "Potenz"
    level: 2
    prompt: |
      Schreib `power(base, exponent)` für einen Exponenten ab 0: `power(2, 10)` ergibt `1024`. Jede Zahl hoch 0 ist 1, und base hoch n ist base mal base hoch n - 1. Ohne `**` und `pow`. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
    starter: |
      def power(base, exponent)
      end
    check:
      type: function
      language: ruby
      forbid: [Integer#pow]
      recursive: true
      loops: false
      cases:
        - call: "power(2, 10)"
          expect: "1024"
        - call: "power(5, 0)"
          expect: "1"
          say: "Hoch 0 ist 1: Dort hört die Rekursion auf."
        - call: "power(3, 1)"
          expect: "3"
        - call: "power(10, 6)"
          expect: "1000000"
        - call: "power(-2, 3)"
          expect: "-8"
    feedback:
      - when: { same_as: "def power(base, exponent)\n  return base if exponent == 1\n  base * power(base, exponent - 1)\nend\n" }
        say: "Bei `power(5, 0)` kommt dein Code nie zum Ende: Er hört erst bei 1 auf und zählt an 0 vorbei. Fang bei 0 an."
    hint: "Wie bei der Fakultät: ein Fall, in dem du sofort fertig bist, und einer, der sich selbst mit einer kleineren Zahl aufruft."
    solution: |
      ```ruby
      def power(base, exponent)
        return 1 if exponent == 0
        base * power(base, exponent - 1)
      end
      ```
    python:
      starter: |
        def power(base, exponent):
            pass
      check:
        type: function
        language: python
        forbid: [pow, math.pow]
        recursive: true
        loops: false
        cases:
          - call: "power(2, 10)"
            expect: "1024"
          - call: "power(5, 0)"
            expect: "1"
            say: "Hoch 0 ist 1: Dort hört die Rekursion auf."
          - call: "power(3, 1)"
            expect: "3"
          - call: "power(10, 6)"
            expect: "1000000"
          - call: "power(-2, 3)"
            expect: "-8"
      hint: "Wie bei der Fakultät: ein Fall, in dem du sofort fertig bist, und einer, der sich selbst mit einer kleineren Zahl aufruft."
      solution: |
        ```python
        def power(base, exponent):
            if exponent == 0:
                return 1
            return base * power(base, exponent - 1)
        ```
    javascript:
      prompt: |
        Schreib `power(base, exponent)` für einen Exponenten ab 0: `power(2, 10)` ergibt `1024`. Jede Zahl hoch 0 ist 1, und base hoch n ist base mal base hoch n - 1. Ohne `**` und `Math.pow`. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
      starter: |
        function power(base, exponent) {
        }
      check:
        type: function
        language: javascript
        forbid: [Math.pow]
        recursive: true
        loops: false
        cases:
          - call: "power(2, 10)"
            expect: "1024"
          - call: "power(5, 0)"
            expect: "1"
            say: "Hoch 0 ist 1: Dort hört die Rekursion auf."
          - call: "power(3, 1)"
            expect: "3"
          - call: "power(10, 6)"
            expect: "1000000"
          - call: "power(-2, 3)"
            expect: "-8"
      hint: "Wie bei der Fakultät: ein Fall, in dem du sofort fertig bist, und einer, der sich selbst mit einer kleineren Zahl aufruft."
      solution: |
        ```javascript
        function power(base, exponent) {
          if (exponent === 0) {
            return 1;
          }
          return base * power(base, exponent - 1);
        }
        ```
  - id: fibonacci
    title: "Fibonacci, rekursiv"
    level: 2
    prompt: |
      Jede Fibonacci-Zahl ist die Summe der beiden davor; die nullte ist 0, die erste 1. Schreib `fibonacci(n)` genau so, mit zwei Aufrufen von sich selbst: `fibonacci(10)` ergibt `55`. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
    starter: |
      def fibonacci(n)
      end
    check:
      type: function
      language: ruby
      recursive: true
      loops: false
      cases:
        - call: "fibonacci(10)"
          expect: "55"
        - call: "fibonacci(0)"
          expect: "0"
          say: "Die nullte ist 0."
        - call: "fibonacci(1)"
          expect: "1"
          say: "Die erste ist 1."
        - call: "fibonacci(2)"
          expect: "1"
        - call: "fibonacci(20)"
          expect: "6765"
