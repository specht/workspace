format: 1
activity: kata-recursion
tasks:
  - id: factorial
    title: "Fakultät, rekursiv"
    level: 1
    prompt: |
      Die Fakultät kennst du aus den Schleifen: 5! = 5 · 4 · 3 · 2 · 1. Es geht auch so: 5! = 5 · 4!, und 0! = 1. Schreib `factorial(n)` genau so: Die Funktion ruft sich selbst mit `n - 1` auf, bis `n` 0 ist. `factorial(5)` ergibt `120`. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
    starter: |
      def factorial(n)
      end
    check:
      type: function
      language: ruby
      recursive: true
      loops: false
      cases:
        - call: "factorial(5)"
          expect: "120"
        - call: "factorial(0)"
          expect: "1"
          say: "0! ist 1: Dort hört die Rekursion auf."
        - call: "factorial(1)"
          expect: "1"
        - call: "factorial(10)"
          expect: "3628800"
        - call: "factorial(20)"
          expect: "2432902008176640000"
    hint:
      - "Zwei Fälle: Wann bist du sofort fertig? Und wie hilft dir `factorial(n - 1)` sonst?"
      - "Ein Gerüst:\n\n```ruby\ndef factorial(n)\n  return 1 if n == 0\n  # n mal die Fakultät von n - 1\nend\n```"
    solution: |
      ```ruby
      def factorial(n)
        return 1 if n == 0
        n * factorial(n - 1)
      end
      ```
    python:
      starter: |
        def factorial(n):
            pass
      check:
        type: function
        language: python
        recursive: true
        loops: false
        cases:
          - call: "factorial(5)"
            expect: "120"
          - call: "factorial(0)"
            expect: "1"
            say: "0! ist 1: Dort hört die Rekursion auf."
          - call: "factorial(1)"
            expect: "1"
          - call: "factorial(10)"
            expect: "3628800"
          - call: "factorial(20)"
            expect: "2432902008176640000"
      hint:
        - "Zwei Fälle: Wann bist du sofort fertig? Und wie hilft dir `factorial(n - 1)` sonst?"
        - "Ein Gerüst:\n\n```python\ndef factorial(n):\n    if n == 0:\n        return 1\n    # n mal die Fakultät von n - 1\n```"
      solution: |
        ```python
        def factorial(n):
            if n == 0:
                return 1
            return n * factorial(n - 1)
        ```
    javascript:
      starter: |
        function factorial(n) {
        }
      check:
        type: function
        language: javascript
        recursive: true
        loops: false
        cases:
          - call: "factorial(5)"
            expect: "120"
          - call: "factorial(0)"
            expect: "1"
            say: "0! ist 1: Dort hört die Rekursion auf."
          - call: "factorial(1)"
            expect: "1"
          - call: "factorial(10)"
            expect: "3628800"
          - call: "factorial(20)"
            expect: "2432902008176640000"
      hint:
        - "Zwei Fälle: Wann bist du sofort fertig? Und wie hilft dir `factorial(n - 1)` sonst?"
        - "Ein Gerüst:\n\n```javascript\nfunction factorial(n) {\n  if (n === 0) {\n    return 1;\n  }\n  // n mal die Fakultät von n - 1\n}\n```"
      solution: |
        ```javascript
        function factorial(n) {
          if (n === 0) {
            return 1;
          }
          return n * factorial(n - 1);
        }
        ```
  - id: total
    title: "Die Summe, rekursiv"
    level: 1
    prompt: |
      Die Summe einer Liste ist ihre erste Zahl plus die Summe des Rests; die leere Liste hat die Summe 0. Schreib `total(numbers)` so: `total([3, 4, 5])` ergibt `12`. `numbers[1..]` ist der Rest der Liste. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
    starter: |
      def total(numbers)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#sum, Array#reduce, Array#inject, Array#each]
      recursive: true
      loops: false
      cases:
        - call: "total([3, 4, 5])"
          expect: "12"
        - call: "total([])"
          expect: "0"
          say: "Die leere Liste hat die Summe 0: Dort hört die Rekursion auf."
        - call: "total([7])"
          expect: "7"
        - call: "total([1, -1, 1, -1, 10])"
          expect: "10"
    hint:
      - "Wann bist du sofort fertig? Bei der leeren Liste, `numbers.empty?`."
      - "Sonst: die erste Zahl, `numbers[0]`, plus `total` vom Rest."
    solution: |
      ```ruby
      def total(numbers)
        return 0 if numbers.empty?
        numbers[0] + total(numbers[1..])
      end
      ```
    python:
      prompt: |
        Die Summe einer Liste ist ihre erste Zahl plus die Summe des Rests; die leere Liste hat die Summe 0. Schreib `total(numbers)` so: `total([3, 4, 5])` ergibt `12`. `numbers[1:]` ist der Rest der Liste. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
      starter: |
        def total(numbers):
            pass
      check:
        type: function
        language: python
        forbid: [sum]
        recursive: true
        loops: false
        cases:
          - call: "total([3, 4, 5])"
            expect: "12"
          - call: "total([])"
            expect: "0"
            say: "Die leere Liste hat die Summe 0: Dort hört die Rekursion auf."
          - call: "total([7])"
            expect: "7"
          - call: "total([1, -1, 1, -1, 10])"
            expect: "10"
      hint:
        - "Wann bist du sofort fertig? Bei der leeren Liste, `not numbers`."
        - "Sonst: die erste Zahl, `numbers[0]`, plus `total` vom Rest."
      solution: |
        ```python
        def total(numbers):
            if not numbers:
                return 0
            return numbers[0] + total(numbers[1:])
        ```
    javascript:
      prompt: |
        Die Summe einer Liste ist ihre erste Zahl plus die Summe des Rests; die leere Liste hat die Summe 0. Schreib `total(numbers)` so: `total([3, 4, 5])` ergibt `12`. `numbers.slice(1)` ist der Rest der Liste. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
      starter: |
        function total(numbers) {
        }
      check:
        type: function
        language: javascript
        forbid: [Array.prototype.reduce, Array.prototype.forEach]
        recursive: true
        loops: false
        cases:
          - call: "total([3, 4, 5])"
            expect: "12"
          - call: "total([])"
            expect: "0"
            say: "Die leere Liste hat die Summe 0: Dort hört die Rekursion auf."
          - call: "total([7])"
            expect: "7"
          - call: "total([1, -1, 1, -1, 10])"
            expect: "10"
      hint:
        - "Wann bist du sofort fertig? Bei der leeren Liste, `numbers.length === 0`."
        - "Sonst: die erste Zahl, `numbers[0]`, plus `total` vom Rest."
      solution: |
        ```javascript
        function total(numbers) {
          if (numbers.length === 0) {
            return 0;
          }
          return numbers[0] + total(numbers.slice(1));
        }
        ```
  - id: countdown
    title: "Countdown, rekursiv"
    level: 1
    prompt: |
      Schreib `countdown(n)`, die die Liste von `n` herunter bis 1 zurückgibt: `countdown(3)` ergibt `[3, 2, 1]`, `countdown(0)` ergibt `[]`. Der Countdown von 3 ist die 3 und dann der Countdown von 2. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
    starter: |
      def countdown(n)
      end
    check:
      type: function
      language: ruby
      forbid: [Integer#downto, Integer#times, Range#each, Range#to_a, Array#reverse]
      recursive: true
      loops: false
      cases:
        - call: "countdown(3)"
          expect: "[3, 2, 1]"
        - call: "countdown(0)"
          expect: "[]"
          say: "Bei 0 ist die Liste leer: Dort hört die Rekursion auf."
        - call: "countdown(1)"
          expect: "[1]"
        - call: "countdown(6)"
          expect: "[6, 5, 4, 3, 2, 1]"
    feedback:
      - when: { same_as: "def countdown(n)\n  return [] if n == 0\n  countdown(n - 1) + [n]\nend\n" }
        say: "So zählt es hinauf: Die Zahl `n` steht hinter dem Rest. Wohin gehört sie?"
    hint: "Eine Liste aus einer Zahl ist `[n]`, und `+` hängt zwei Listen aneinander."
    solution: |
      ```ruby
      def countdown(n)
        return [] if n == 0
        [n] + countdown(n - 1)
      end
      ```
    python:
      starter: |
        def countdown(n):
            pass
      check:
        type: function
        language: python
        forbid: [range, reversed]
        recursive: true
        loops: false
        cases:
          - call: "countdown(3)"
            expect: "[3, 2, 1]"
          - call: "countdown(0)"
            expect: "[]"
            say: "Bei 0 ist die Liste leer: Dort hört die Rekursion auf."
          - call: "countdown(1)"
            expect: "[1]"
          - call: "countdown(6)"
            expect: "[6, 5, 4, 3, 2, 1]"
      feedback:
        - when: { same_as: "def countdown(n):\n    if n == 0:\n        return []\n    return countdown(n - 1) + [n]\n" }
          say: "So zählt es hinauf: Die Zahl `n` steht hinter dem Rest. Wohin gehört sie?"
      hint: "Eine Liste aus einer Zahl ist `[n]`, und `+` hängt zwei Listen aneinander."
      solution: |
        ```python
        def countdown(n):
            if n == 0:
                return []
            return [n] + countdown(n - 1)
        ```
    javascript:
      starter: |
        function countdown(n) {
        }
      check:
        type: function
        language: javascript
        forbid: [Array.from, Array.prototype.reverse, Array.prototype.fill]
        recursive: true
        loops: false
        cases:
          - call: "countdown(3)"
            expect: "[3, 2, 1]"
          - call: "countdown(0)"
            expect: "[]"
            say: "Bei 0 ist die Liste leer: Dort hört die Rekursion auf."
          - call: "countdown(1)"
            expect: "[1]"
          - call: "countdown(6)"
            expect: "[6, 5, 4, 3, 2, 1]"
      feedback:
        - when: { same_as: "function countdown(n) {\n  if (n === 0) {\n    return [];\n  }\n  return countdown(n - 1).concat([n]);\n}\n" }
          say: "So zählt es hinauf: Die Zahl `n` steht hinter dem Rest. Wohin gehört sie?"
      hint: "Eine Liste aus einer Zahl ist `[n]`, und `concat` hängt zwei Listen aneinander."
      solution: |
        ```javascript
        function countdown(n) {
          if (n === 0) {
            return [];
          }
          return [n].concat(countdown(n - 1));
        }
        ```
  - id: text-length
    title: "Wie lang, ohne zu messen?"
    level: 1
    prompt: |
      Schreib `text_length(text)`, die die Zeichen eines Textes zählt, ohne `length` und `size`; `text[1..]` ist der Text ohne sein erstes Zeichen: Ein leerer Text hat die Länge 0, jeder andere ist um eins länger als der Text ohne sein erstes Zeichen. `text_length('Hallo')` ergibt `5`. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
    starter: |
      def text_length(text)
      end
    check:
      type: function
      language: ruby
      forbid: [String#length, String#size, String#chars, String#each_char, String#count]
      recursive: true
      loops: false
      cases:
        - call: "text_length('Hallo')"
          expect: "5"
        - call: "text_length('')"
          expect: "0"
          say: "Ein leerer Text hat die Länge 0: Dort hört die Rekursion auf."
        - call: "text_length('a')"
          expect: "1"
        - call: "text_length('Rekursion')"
          expect: "9"
    hint:
