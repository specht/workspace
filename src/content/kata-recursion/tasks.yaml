      starter: |
        def text_length(text):
            pass
      check:
        type: function
        language: python
        forbid: [len, str.count]
        recursive: true
        loops: false
        cases:
          - call: "text_length('Hallo')"
            expect: "5"
          - call: "text_length('')"
            expect: "0"
            say: "Ein leerer Text hat die Länge 0: Dort hört die Rekursion auf."
          - call: "text_length('a')"
            expect: "1"
          - call: "text_length('Rekursion')"
            expect: "9"
      hint:
        - "Wann bist du sofort fertig? Beim leeren Text, `''`."
        - "Sonst: 1 plus die Länge des Rests."
      solution: |
        ```python
