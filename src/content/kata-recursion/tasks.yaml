    hint: "Zwei Zahlen stehen fest, `fibonacci(0)` und `fibonacci(1)`. Jede andere ist `fibonacci(n - 1) + fibonacci(n - 2)`."
    solution: |
      ```ruby
      def fibonacci(n)
        return n if n < 2
        fibonacci(n - 1) + fibonacci(n - 2)
      end
      ```
    python:
