    javascript:
      prompt: |
        Schreib `textLength(text)`, die die Zeichen eines Textes zählt, ohne `length`; `text.slice(1)` ist der Text ohne sein erstes Zeichen: Ein leerer Text hat die Länge 0, jeder andere ist um eins länger als der Text ohne sein erstes Zeichen. `textLength('Hallo')` ergibt `5`. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
      starter: |
        function textLength(text) {
        }
      check:
        type: function
        language: javascript
        recursive: true
        loops: false
        cases:
          - call: "textLength('Hallo')"
            expect: "5"
          - call: "textLength('')"
            expect: "0"
            say: "Ein leerer Text hat die Länge 0: Dort hört die Rekursion auf."
          - call: "textLength('a')"
            expect: "1"
          - call: "textLength('Rekursion')"
            expect: "9"
      hint:
        - "Wann bist du sofort fertig? Beim leeren Text, `''`."
        - "Sonst: 1 plus die Länge des Rests."
