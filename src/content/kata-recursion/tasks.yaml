  - id: palindrome
    title: "Palindrom, rekursiv"
    level: 2
    prompt: |
      Ein Text ist ein Palindrom, wenn sein erstes und sein letztes Zeichen gleich sind und das, was dazwischen steht, wieder ein Palindrom ist; ein Text mit weniger als zwei Zeichen ist immer eins. Schreib `palindrome(text)` so, ohne den Text umzudrehen: `palindrome('rentner')` ergibt true. Die Texte sind klein geschrieben. Ohne Schleife: Die Funktion ruft sich selbst auf; die Prüfung sieht nach.
    starter: |
      def palindrome(text)
      end
    check:
      type: function
      language: ruby
      forbid: [String#reverse, Array#reverse]
      recursive: true
      loops: false
      cases:
        - call: "palindrome('rentner')"
          expect: "true"
        - call: "palindrome('')"
          expect: "true"
        - call: "palindrome('a')"
          expect: "true"
        - call: "palindrome('ab')"
          expect: "false"
        - call: "palindrome('abba')"
          expect: "true"
        - call: "palindrome('abca')"
          expect: "false"
          say: "Das erste und das letzte Zeichen sind gleich, aber `'bc'` ist kein Palindrom."
    feedback:
      - when: { same_as: "def palindrome(text)\n  return true if text.length < 2\n  text[0] == text[-1]\nend\n" }
        say: "Das erste und das letzte Zeichen reichen nicht: Bei `'abca'` stimmen sie, aber dazwischen steht `'bc'`. Frag für das, was dazwischen steht, wieder `palindrome`."
    hint: "`text[0]` ist das erste Zeichen, `text[-1]` das letzte, `text[1...-1]` das, was dazwischen steht."
    solution: |
      ```ruby
      def palindrome(text)
        return true if text.length < 2
        text[0] == text[-1] && palindrome(text[1...-1])
      end
      ```
