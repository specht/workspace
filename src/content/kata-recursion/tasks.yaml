        Ein Text ist ein Palindrom, wenn sein erstes und sein letztes Zeichen gleich sind und das, was dazwischen steht, wieder ein Palindrom ist; ein Text mit weniger als zwei Zeichen ist immer eins. Schreib `boolean palindrome(String text)` so, ohne den Text umzudrehen: `palindrome("rentner")` ergibt `true`. Die Texte sind klein geschrieben. Ohne Schleife: Die Methode ruft sich selbst auf; die Prüfung sieht nach.
      starter: |
        boolean palindrome(String text) {
            return false;
        }
      check:
        type: function
        language: java
        forbid: [StringBuilder, StringBuffer, .reversed]
        recursive: true
        loops: false
        cases:
          - call: "palindrome(\"rentner\")"
            expect: "true"
          - call: "palindrome(\"\")"
            expect: "true"
          - call: "palindrome(\"a\")"
            expect: "true"
          - call: "palindrome(\"ab\")"
            expect: "false"
          - call: "palindrome(\"abba\")"
            expect: "true"
          - call: "palindrome(\"abca\")"
            expect: "false"
            say: "Das erste und das letzte Zeichen sind gleich, aber `\"bc\"` ist kein Palindrom."
      feedback:
        - when: { same_as: "boolean palindrome(String text) {\n    if (text.length() < 2) {\n        return true;\n    }\n    return text.charAt(0) == text.charAt(text.length() - 1);\n}\n" }
          say: "Das erste und das letzte Zeichen reichen nicht: Bei `\"abca\"` stimmen sie, aber dazwischen steht `\"bc\"`. Frag für das, was dazwischen steht, wieder `palindrome`."
      hint: "`text.charAt(0)` ist das erste Zeichen, `text.charAt(text.length() - 1)` das letzte, `text.substring(1, text.length() - 1)` das, was dazwischen steht. Zeichen (`char`) vergleicht man mit `==`."
      solution: |
        ```java
        boolean palindrome(String text) {
            if (text.length() < 2) {
                return true;
            }
            return text.charAt(0) == text.charAt(text.length() - 1) && palindrome(text.substring(1, text.length() - 1));
        }
        ```

