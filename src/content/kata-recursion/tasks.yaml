  - id: subset-sum
    title: "Geht die Summe auf?"
    extra: true
    prompt: |
      Schreib `subset_sum(numbers, target)`, die true zurückgibt, wenn einige der Zahlen zusammen genau `target` ergeben, jede höchstens einmal, und sonst false: `subset_sum([3, 34, 4, 12, 5, 2], 9)` ergibt true (4 + 5). Für die erste Zahl gibt es zwei Möglichkeiten: Sie ist dabei, oder nicht. Die Zahlen sind größer als 0.
    starter: |
      def subset_sum(numbers, target)
      end
    check:
      type: function
      language: ruby
      recursive: true
      loops: false
      cases:
        - call: "subset_sum([3, 34, 4, 12, 5, 2], 9)"
          expect: "true"
        - call: "subset_sum([3, 34, 4, 12, 5, 2], 30)"
          expect: "false"
        - call: "subset_sum([], 0)"
          expect: "true"
          say: "Nichts zusammen ergibt 0."
        - call: "subset_sum([], 5)"
          expect: "false"
        - call: "subset_sum([7], 7)"
          expect: "true"
        - call: "subset_sum([2, 4, 6], 5)"
          expect: "false"
          say: "Lauter gerade Zahlen geben keine ungerade Summe."
    hint:
      - "Zwei Fälle, in denen du sofort fertig bist: `target` ist 0 (dann ja), oder es sind keine Zahlen mehr übrig (dann nein)."
      - "Sonst: mit der ersten Zahl, `subset_sum(rest, target - numbers[0])`, oder ohne sie, `subset_sum(rest, target)`. Geht eins davon, geht es."
    solution: |
      ```ruby
      def subset_sum(numbers, target)
        return true if target == 0
        return false if numbers.empty? || target < 0
        rest = numbers[1..]
        subset_sum(rest, target - numbers[0]) || subset_sum(rest, target)
      end
      ```
