  - id: fast-fibonacci
    title: "Fibonacci mit Gedächtnis"
    extra: true
    prompt: |
      Deine rekursive Fibonacci-Funktion rechnet dieselben Zahlen wieder und wieder aus: `fibonacci(70)` dauert Jahre. Schreib `fast_fibonacci(n)`, rekursiv wie vorher, aber mit einem Gedächtnis: einem Hash, in dem jede Zahl steht, sobald sie einmal ausgerechnet ist. `fast_fibonacci(70)` ergibt `190392490709135`, in weniger als drei Sekunden.
    starter: |
      def fast_fibonacci(n)
      end
    check:
      type: function
      language: ruby
      recursive: true
      timeout: 3
      slow: "Zu langsam: Dein Code rechnet dieselben Zahlen immer wieder aus. Schau im Gedächtnis nach, bevor du rechnest, und schreib jedes Ergebnis hinein."
      cases:
        - call: "fast_fibonacci(70)"
          expect: "190392490709135"
        - call: "fast_fibonacci(0)"
          expect: "0"
        - call: "fast_fibonacci(1)"
          expect: "1"
        - call: "fast_fibonacci(10)"
          expect: "55"
        - call: "fast_fibonacci(50)"
          expect: "12586269025"
    hint:
      - "Ein Hash außerhalb der Funktion, `MEMO = {}`, merkt sich die Zahlen. Steht `n` schon darin, gibst du sie gleich zurück."
      - "`MEMO[n] ||= …` rechnet nur, wenn `MEMO[n]` noch fehlt, und schreibt das Ergebnis hinein."
    solution: |
      ```ruby
      MEMO = {}

      def fast_fibonacci(n)
        return n if n < 2
        MEMO[n] ||= fast_fibonacci(n - 1) + fast_fibonacci(n - 2)
      end
      ```
    python:
      prompt: |
        Deine rekursive Fibonacci-Funktion rechnet dieselben Zahlen wieder und wieder aus: `fibonacci(70)` dauert Jahre. Schreib `fast_fibonacci(n)`, rekursiv wie vorher, aber mit einem Gedächtnis: einem Dictionary, in dem jede Zahl steht, sobald sie einmal ausgerechnet ist. `fast_fibonacci(70)` ergibt `190392490709135`, in weniger als drei Sekunden.
      starter: |
        def fast_fibonacci(n):
            pass
      check:
        type: function
        language: python
        recursive: true
        timeout: 3
        slow: "Zu langsam: Dein Code rechnet dieselben Zahlen immer wieder aus. Schau im Gedächtnis nach, bevor du rechnest, und schreib jedes Ergebnis hinein."
        cases:
          - call: "fast_fibonacci(70)"
            expect: "190392490709135"
          - call: "fast_fibonacci(0)"
            expect: "0"
          - call: "fast_fibonacci(1)"
            expect: "1"
          - call: "fast_fibonacci(10)"
            expect: "55"
          - call: "fast_fibonacci(50)"
            expect: "12586269025"
      hint:
        - "Ein Dictionary außerhalb der Funktion, `memo = {}`, merkt sich die Zahlen. Steht `n` schon darin, gibst du sie gleich zurück."
        - "Erst nachsehen (`n in memo`), sonst rechnen und hineinschreiben."
      solution: |
        ```python
        memo = {}

        def fast_fibonacci(n):
            if n < 2:
                return n
            if n not in memo:
