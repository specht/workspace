          expect: "['abc', 'acb', 'bac', 'bca', 'cab', 'cba']"
        - call: "permutations('')"
          expect: "['']"
          say: "Der leere Text hat eine Reihenfolge: sich selbst."
        - call: "permutations('a')"
          expect: "['a']"
        - call: "permutations('ab')"
          expect: "['ab', 'ba']"
        - call: "permutations('abcd')"
          expect: "['abcd', 'abdc', 'acbd', 'acdb', 'adbc', 'adcb', 'bacd', 'badc', 'bcad', 'bcda', 'bdac', 'bdca', 'cabd', 'cadb', 'cbad', 'cbda', 'cdab', 'cdba', 'dabc', 'dacb', 'dbac', 'dbca', 'dcab', 'dcba']"
    feedback:
