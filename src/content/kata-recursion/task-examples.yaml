      fail:
        - answer: "def countdown(n):\n    if n == 0:\n        return []\n    return countdown(n - 1) + [n]\n"
    javascript:
      pass:
        - answer: "function countdown(n) {\n  if (n === 0) {\n    return [];\n  }\n  return [n].concat(countdown(n - 1));\n}\n"
      fail:
        - answer: "function countdown(n) {\n  if (n === 0) {\n    return [];\n  }\n  return countdown(n - 1).concat([n]);\n}\n"
