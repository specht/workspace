# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
# Der Startcode jeder Kata muss von selbst scheitern; das prüft der Test ohne Beispiel.
format: 1
activity: kata-recursion
examples:
  factorial:
    pass:
      - answer: "def factorial(n)\n  return 1 if n == 0\n  n * factorial(n - 1)\nend\n"
    fail:
      - answer: "def factorial(n)\n  result = 1\n  (1..n).each { |i| result *= i }\n  result\nend\n"
    python:
      pass:
        - answer: "def factorial(n):\n    if n == 0:\n        return 1\n    return n * factorial(n - 1)\n"
      fail:
        - answer: "def factorial(n):\n    result = 1\n    for i in range(1, n + 1):\n        result *= i\n    return result\n"
    javascript:
      pass:
        - answer: "function factorial(n) {\n  if (n === 0) {\n    return 1;\n  }\n  return n * factorial(n - 1);\n}\n"
      fail:
        - answer: "function factorial(n) {\n  let result = 1;\n  for (let i = 1; i <= n; i++) {\n    result *= i;\n  }\n  return result;\n}\n"
  total:
    pass:
      - answer: "def total(numbers)\n  return 0 if numbers.empty?\n  numbers[0] + total(numbers[1..])\nend\n"
    python:
      pass:
        - answer: "def total(numbers):\n    if not numbers:\n        return 0\n    return numbers[0] + total(numbers[1:])\n"
    javascript:
      pass:
        - answer: "function total(numbers) {\n  if (numbers.length === 0) {\n    return 0;\n  }\n  return numbers[0] + total(numbers.slice(1));\n}\n"
