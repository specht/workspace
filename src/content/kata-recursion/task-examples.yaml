    pass:
      - answer: "def factorial(n)\n  return 1 if n == 0\n  n * factorial(n - 1)\nend\n"
    fail:
      - answer: "def factorial(n)\n  result = 1\n  (1..n).each { |i| result *= i }\n  result\nend\n"
