    fail:
      - answer: "def flatten(items)\n  result = []\n  items.each do |item|\n    if item.is_a?(Array)\n      result += item\n    else\n      result << item\n    end\n  end\n  result\nend\n"
    python:
      pass:
        - answer: "def flatten(items):\n    result = []\n    for item in items:\n        if isinstance(item, list):\n            result += flatten(item)\n        else:\n            result.append(item)\n    return result\n"
