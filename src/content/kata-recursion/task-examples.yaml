    fail:
      - answer: "def hanoi(n, source, target, spare)\n  return [] if n == 0\n  hanoi(n - 1, source, target, spare) + [[source, target]] + hanoi(n - 1, spare, target, source)\nend\n"
    python:
      pass:
        - answer: "def hanoi(n, source, target, spare):\n    if n == 0:\n        return []\n    return hanoi(n - 1, source, spare, target) + [[source, target]] + hanoi(n - 1, spare, target, source)\n"
      fail:
        - answer: "def hanoi(n, source, target, spare):\n    if n == 0:\n        return []\n    return hanoi(n - 1, source, target, spare) + [[source, target]] + hanoi(n - 1, spare, target, source)\n"
    javascript:
      pass:
        - answer: "function hanoi(n, source, target, spare) {\n  if (n === 0) {\n    return [];\n  }\n  return [...hanoi(n - 1, source, spare, target), [source, target], ...hanoi(n - 1, spare, target, source)];\n}\n"
      fail:
        - answer: "function hanoi(n, source, target, spare) {\n  if (n === 0) {\n    return [];\n  }\n  return [...hanoi(n - 1, source, target, spare), [source, target], ...hanoi(n - 1, spare, target, source)];\n}\n"
