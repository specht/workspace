format: 1
activity: kata-demo
tasks:
  - id: greet
    title: Eine Begrüßung
    level: 1
    prompt: |
      Schreib eine Funktion `greet(name)`, die eine Begrüßung zurückgibt:
      `greet('Ada')` ergibt `'Hallo, Ada!'`.
    starter: |
      def greet(name)
      end

      puts greet('Ada')
    check:
      type: function
      language: ruby
      cases:
        - greet('Ada'): "'Hallo, Ada!'"
        - greet('Linus'): "'Hallo, Linus!'"
        - call: greet('')
          expect: "'Hallo, !'"
          say: Auch ein leerer Name bekommt seinen Gruß.
    hint: Zwei Texte hängst du mit `+` aneinander, oder du schreibst `"Hallo, #{name}!"`.
    solution: |
      ```ruby
      def greet(name)
        "Hallo, #{name}!"
      end
      ```
    python:
      starter: |
        def greet(name):
            pass

        print(greet('Ada'))
      check:
        type: function
        language: python
        cases:
          - greet('Ada'): "'Hallo, Ada!'"
          - greet('Linus'): "'Hallo, Linus!'"
          - call: greet('')
            expect: "'Hallo, !'"
            say: Auch ein leerer Name bekommt seinen Gruß.
      hint: Zwei Texte hängst du mit `+` aneinander, oder du schreibst `f'Hallo, {name}!'`.
      solution: |
        ```python
        def greet(name):
            return f'Hallo, {name}!'
        ```

  - id: ggt
    title: Der größte gemeinsame Teiler
    level: 3
    prompt: |
      Schreib eine Funktion `gcd(a, b)`, die den größten gemeinsamen Teiler
      zweier Zahlen zurückgibt: `gcd(60, 48)` ergibt `12`.
    starter: |
      def gcd(a, b)
      end
    check:
      type: function
      language: ruby
      forbid: [Integer#gcd, Integer#lcm]
      cases:
        - gcd(60, 48): 12
        - gcd(48, 60): 12
        - gcd(17, 5): 1
        - call: gcd(7, 7)
          expect: 7
          say: Der größte Teiler einer Zahl mit sich selbst ist sie selbst.
      random:
        count: 4
        call: gcd(a, b)
        args: { a: 1..1000, b: 1..1000 }
        reference: a.gcd(b)
    feedback:
      - when: { same_as: "def gcd(a, b) = [a, b].min" }
        say: Die kleinere Zahl ist nur manchmal ein Teiler der größeren. Probier `gcd(12, 8)` von Hand.
    hint:
      - Rechne `gcd(60, 48)` von Hand. Welche Zahlen teilen beide?
      - "Euklid: Was `a` und `b` teilt, teilt auch `a - b`. Was passiert, wenn du das wiederholst?"
    solution: |
      ```ruby
      def gcd(a, b)
        b.zero? ? a : gcd(b, a % b)
      end
      ```
    python:
      starter: |
        def gcd(a, b):
            pass
      check:
        type: function
        language: python
        forbid: [math.gcd, math.lcm]
        cases:
          - gcd(60, 48): 12
          - gcd(48, 60): 12
          - gcd(17, 5): 1
          - call: gcd(7, 7)
            expect: 7
            say: Der größte Teiler einer Zahl mit sich selbst ist sie selbst.
        random:
          count: 4
          call: gcd(a, b)
          args: { a: 1..1000, b: 1..1000 }
          reference: math.gcd(a, b)
      feedback:
        - when: { same_as: "def gcd(a, b):\n    return min(a, b)\n" }
          say: Die kleinere Zahl ist nur manchmal ein Teiler der größeren. Probier `gcd(12, 8)` von Hand.
      solution: |
        ```python
        def gcd(a, b):
            while b:
                a, b = b, a % b
            return a
        ```

  - id: ziffern
    title: Ziffern rückwärts
    extra: true
    prompt: |
      Schreib eine Funktion `reverse_digits(n)`, die die Ziffern einer Zahl
      umdreht: `reverse_digits(1234)` ergibt `4321`. Ohne Texte: nur mit
      Rechnen, `%` und `//` (in Ruby `/`).
    starter: |
      def reverse_digits(n)
      end
    check:
      type: function
      language: ruby
      forbid: [Integer#to_s, Integer#digits, String#reverse]
      cases:
        - reverse_digits(1234): 4321
        - reverse_digits(7): 7
        - call: reverse_digits(1200)
          expect: 21
          say: Nullen am Ende werden vorn zu nichts.
    python:
      prompt: |
        Schreib eine Funktion `reverse_digits(n)`, die die Ziffern einer Zahl
        umdreht: `reverse_digits(1234)` ergibt `4321`. Ohne Texte: nur mit
        Rechnen, `%` und `//`.
      starter: |
        def reverse_digits(n):
            pass
      check:
        type: function
        language: python
        forbid: [str, repr]
        cases:
          - reverse_digits(1234): 4321
          - reverse_digits(7): 7
          - call: reverse_digits(1200)
            expect: 21
            say: Nullen am Ende werden vorn zu nichts.
