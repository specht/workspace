# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
format: 1
activity: pixelwand
examples:
  alle:
    pass:
      - files: { pixelwand/server.rb: stufen/server2.rb }
    fail:
      - files: { pixelwand/server.rb: stufen/server1.rb }
        say: Bo
      # die Seite vor dem Kasten: on(:open) ist da, die Nachricht geht noch als Echo zurück
      - files:
          pixelwand/server.rb:
            text: |
              require 'faye/websocket'
              require 'rackup'

              # Alle offenen Verbindungen. Faye ruft die on-Blöcke aller Verbindungen
              # nacheinander auf, nie zwei gleichzeitig: Die Liste braucht keinen Lock.
              $clients = []

              def broadcast(text)
                $clients.each { |client| client.send(text) }
              end

              App = lambda do |env|
                if Faye::WebSocket.websocket?(env)
                  ws = Faye::WebSocket.new(env)

                  ws.on(:open) do
                    $clients << ws
                    broadcast("Jemand ist dazugekommen. Jetzt sind wir #{$clients.size}.")
                  end

                  # Was kommt, geht an alle
                  ws.on(:message) do |event|
                    puts "Empfangen: #{event.data}"
                    ws.send("Echo: #{event.data}")
                  end

                  ws.rack_response
                else
                  [200, { 'content-type' => 'text/html; charset=utf-8' },
                   [File.read(File.join(__dir__, 'index.html'))]]
                end
              end

              puts "Der Server wartet auf Port 8000 ..."
              Rackup::Server.start(app: App, Host: '0.0.0.0', Port: 8000, server: 'puma', Silent: true)
        say: broadcast(event.data)
      # ws.on(:close) ohne delete
