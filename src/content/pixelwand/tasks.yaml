# Aufgaben zu »Eine Pixelwand für alle«.
# Format: docs/aufgaben.md. Der Server liegt in /workspace/pixelwand.
format: 1
activity: pixelwand
tasks:
  - id: handshake
    title: Der Handshake
    prompt: |
      Mit welchem Statuscode antwortet der Server auf die Anfrage, mit der der
      Browser eine WebSocket-Verbindung öffnet?
    check:
      type: choice
      options:
        - 101 Switching Protocols
        - 200 OK
        - 301 Moved Permanently
        - 404 Not Found
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: '200 heißt: Hier ist die Antwort, und danach ist Schluss. Der Server will aber, dass die Verbindung offen bleibt und das Protokoll wechselt.'
    solution: 101 Switching Protocols sagt dem Browser, dass der Server einverstanden ist und ab jetzt WebSocket statt HTTP gesprochen wird, auf derselben Verbindung.

  - id: wer-bekommt-was
    title: Wer bekommt die Nachricht?
    prediction: true
    prompt: |
      Ada und Bo haben die Seite offen, der Server ist auf dem Stand »An
      alle«. Ada schickt »Hallo«. Wer sieht die Nachricht? Überleg erst, dann
      probier es mit zwei Tabs aus.
    check:
      type: choice
      options:
        - Ada und Bo
        - Nur Bo
        - Nur Ada
        - Niemand, bis jemand die Seite neu lädt
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Steht Ada selbst auch in `$clients`?
      - when: { picked: 3 }
        say: Neu laden muss niemand. Die Verbindung ist offen, und der Server schickt von sich aus.
    solution: '`broadcast` schickt an jede Verbindung in `$clients`, auch an Adas eigene. So sieht Ada ihre Nachricht erst, wenn der Server sie verteilt hat, genau wie alle anderen.'
    python:
      feedback:
        - when: { picked: 1 }
          say: Steht Ada selbst auch in `clients`?
        - when: { picked: 3 }
          say: Neu laden muss niemand. Die Verbindung ist offen, und der Server schickt von sich aus.
      solution: '`broadcast` schickt an jede Verbindung in `clients`, auch an Adas eigene. So sieht Ada ihre Nachricht erst, wenn der Server sie verteilt hat, genau wie alle anderen.'

  - id: pixel-zahl
    title: Das ganze Bild
    prompt: |
      Wie viele Farbnummern stehen in der Liste `pixels` der Nachricht, die ein
      neuer Besuch zuerst bekommt?
    check:
      type: number
      expect: 2560
      tolerance: 0
      unit: Farbnummern
    feedback:
      - when: { equals: 104 }
        say: Das ist 64 + 40. Das Bild ist ein Rechteck aus Zeilen und Spalten.
    solution: 64 × 40 = 2560, eine Farbnummer pro Pixel, Zeile für Zeile.

  - id: vertrauen
    title: Jeder kann alles schicken
    prompt: |
      Deine Webseite schickt nur gültige Pixel. Warum prüft der Server trotzdem
      jede Nachricht?
    check:
      type: choice
      options:
        - Jeder kann sich mit dem Server verbinden und beliebige Nachrichten schicken, nicht nur deine Seite
        - 'JSON verliert unterwegs manchmal Zahlen, wenn das Netz langsam ist'
        - 'Ohne die Prüfung kann der Server das JSON nicht lesen'
        - 'Der Browser rundet die Koordinaten manchmal falsch und schickt Pixel außerhalb der Wand'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Was ankommt, ist genau das, was abgeschickt wurde. Die Frage ist, wer etwas abschickt.
    solution: Eine WebSocket-Verbindung kann jedes Programm öffnen, auch die Konsole im Browser. Ein Server darf keiner Nachricht trauen, nur weil seine eigene Seite sie anders schicken würde.

  - id: pixelwand
    title: Die Pixelwand
    prompt: |
      Bau die Pixelwand: Der Server bewahrt das Bild auf, prüft jede
      Nachricht und schickt jeden Pixel an alle. Speichere.
    file: pixelwand/server.rb
    check:
      type: files
      path: pixelwand/server.rb
      expect:
        format: text
        contains:
          - { pattern: 'JSON\.parse', say: 'In `server.rb` liest der Server noch kein JSON (`JSON.parse`).' }
          - { pattern: 'Faye::WebSocket', say: 'In `server.rb` öffnet noch nichts eine WebSocket-Verbindung (`Faye::WebSocket.new(env)`).' }
          - { pattern: 'between\?|<\s*WIDTH|>=\s*0', say: 'Noch prüft der Server nicht, ob ein Pixel im Bild liegt, zum Beispiel mit `x.between?(0, WIDTH - 1)`.' }
    python:
      file: pixelwand/server.py
      check:
        type: files
        path: pixelwand/server.py
        expect:
          format: text
          contains:
            - { pattern: 'json\.loads', say: 'In `server.py` liest der Server noch kein JSON (`json.loads`).' }
            - { pattern: 'websockets', say: 'In `server.py` öffnet noch nichts eine WebSocket-Verbindung (`serve` aus `websockets.sync.server`).' }
            - { pattern: '<\s*WIDTH|<=\s*15|>=\s*0|range\(', say: 'Noch prüft der Server nicht, ob ein Pixel im Bild liegt, zum Beispiel mit `0 <= x < WIDTH`.' }

  - id: counter
    title: 200 Pixel
    prediction: true
    prompt: |
      `flood.js` schickt 200 Pixel auf einmal, vier Threads verarbeiten sie.
      Welche Zahl steht danach im Terminal des Servers bei »Pixel Nr. …«?
      Überleg erst, dann probier es aus.
    check:
      type: choice
      options:
        - Deutlich weniger als 200
        - Genau 200
        - Ein paar weniger als 200, 195 oder so
        - Mehr als 200
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Jeder Thread liest `$painted`, speichert das Bild und schreibt erst danach. Was haben die anderen Threads in der Zwischenzeit gelesen?
      - when: { picked: 2 }
        say: Bei deinem Webserver wäre das eine gute Schätzung. Hier liegt zwischen Lesen und Schreiben das Speichern, und das dauert.
    solution: Während ein Thread das Bild speichert, lesen die anderen denselben alten Wert von `$painted`. Mehrere Threads schreiben dann dieselbe Zahl zurück, und Pixel gehen beim Zählen verloren. Am Ende steht der Zähler weit unter 200, oft nur bei einem Drittel.
    python:
      feedback:
        - when: { picked: 1 }
          say: Jeder Thread liest `painted`, speichert das Bild und schreibt erst danach. Was haben die anderen Threads in der Zwischenzeit gelesen?
        - when: { picked: 2 }
          say: Bei deinem Webserver wäre das eine gute Schätzung. Hier liegt zwischen Lesen und Schreiben das Speichern, und das dauert.
      solution: Während ein Thread das Bild speichert, lesen die anderen denselben alten Wert von `painted`. Mehrere Threads schreiben dann dieselbe Zahl zurück, und Pixel gehen beim Zählen verloren. Am Ende steht der Zähler weit unter 200, oft nur bei der Hälfte.

  - id: lock
    title: Ein Lock
    prompt: |
      Schütze Bild und Zähler mit einem Lock, sodass der Server nach
      `node flood.js` bei 200 ankommt, und speichere.
    file: pixelwand/server.rb
    check:
      type: files
      path: pixelwand/server.rb
      expect:
        format: text
        contains:
          - { pattern: 'Thread\.new', say: 'In `server.rb` gibt es noch keine Threads, die Nachrichten abarbeiten (`Thread.new`).' }
          - { pattern: 'Mutex\.new', say: 'In `server.rb` gibt es noch keinen Lock: `$lock = Mutex.new`.' }
          - { pattern: '\.synchronize\b', say: 'Der Lock ist da, aber noch schützt er nichts: `$lock.synchronize do … end` um das Ändern von Bild und Zähler.' }
    python:
      file: pixelwand/server.py
      check:
        type: files
        path: pixelwand/server.py
        expect:
          format: text
          contains:
            - { pattern: 'threading\.Thread', say: 'In `server.py` gibt es noch keine Threads, die Nachrichten abarbeiten (`threading.Thread`).' }
            - { pattern: 'Lock\(\)', say: 'In `server.py` gibt es noch keinen Lock: `lock = threading.Lock()`.' }
            - { pattern: 'with\s+lock\b|\.acquire\(', say: 'Der Lock ist da, aber noch schützt er nichts: `with lock:` um das Ändern von Bild und Zähler.' }

  - id: abgabe
    title: Deine Pixelwand
    prompt: |
      Gib deine Pixelwand ab: den Ordner `pixelwand` mit `server.rb` und
      `index.html`.
    check:
      type: submit
      paths: [pixelwand]
      exclude: [pixelwand/.venv]
      max_size: 5MB
    python:
      prompt: |
        Gib deine Pixelwand ab: den Ordner `pixelwand` mit `server.py` und
        `index.html`. Die virtuelle Umgebung `.venv` bleibt draußen.
