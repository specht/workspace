# Aufgaben zu »Eine Pixelwand für alle«.
# Format: docs/aufgaben.md. Der Server liegt in /workspace/pixelwand.
format: 1
activity: pixelwand
tasks:
  - id: handshake
    title: Der Handshake
    prompt: |
      Mit welchem Statuscode antwortet der Server auf die Anfrage, mit der der
      Browser eine WebSocket-Verbindung öffnet?
    check:
      type: choice
      options:
        - 101 Switching Protocols
        - 200 OK
        - 301 Moved Permanently
        - 404 Not Found
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: '200 heißt: Hier ist die Antwort, und danach ist Schluss. Der Server will aber, dass die Verbindung offen bleibt und das Protokoll wechselt.'
    solution: 101 Switching Protocols sagt dem Browser, dass der Server einverstanden ist und ab jetzt WebSocket statt HTTP gesprochen wird, auf derselben Verbindung.

  - id: wer-bekommt-was
    title: Wer bekommt die Nachricht?
    prediction: true
    prompt: |
      Ada und Bo haben die Seite offen, der Server ist auf dem Stand »An
      alle«. Ada schickt »Hallo«. Wer sieht die Nachricht? Überleg erst, dann
      probier es mit zwei Tabs aus.
    check:
      type: choice
      options:
        - Ada und Bo
        - Nur Bo
        - Nur Ada
        - Niemand, bis jemand die Seite neu lädt
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Steht Ada selbst auch in `$clients`?
      - when: { picked: 3 }
        say: Neu laden muss niemand. Die Verbindung ist offen, und der Server schickt von sich aus.
    solution: '`broadcast` schickt an jede Verbindung in `$clients`, auch an Adas eigene. So sieht Ada ihre Nachricht erst, wenn der Server sie verteilt hat, genau wie alle anderen.'
    python:
      feedback:
        - when: { picked: 1 }
          say: Steht Ada selbst auch in `clients`?
        - when: { picked: 3 }
          say: Neu laden muss niemand. Die Verbindung ist offen, und der Server schickt von sich aus.
      solution: '`broadcast` schickt an jede Verbindung in `clients`, auch an Adas eigene. So sieht Ada ihre Nachricht erst, wenn der Server sie verteilt hat, genau wie alle anderen.'

  - id: alle
    title: An alle, und wieder weg
    prompt: |
      Lass in `server.rb` jede Nachricht an alle gehen und schreib
      `ws.on(:close)`, und speichere. Der Workspace ruft dein `App` mit einer
      Verbindung zum Ausprobieren auf, während Bo schon verbunden ist: Sie
      öffnet, schickt »Hallo« und schließt. Bekommt Bo das »Hallo«,
      verschwindet die Verbindung aus `$clients`, und erfährt Bo danach, dass
      noch 1 da ist? Der Server muss dafür nicht laufen.
    file: pixelwand/server.rb
    check:
      type: ruby
      file: pixelwand/server.rb
      cases:
        - call: >-
            ws = Object.new; def ws.on(event, &block) = (@on ||= {}).store(event, block); def ws.send(text) = nil; def ws.rack_response = []; def ws.fire(event, data = nil) = @on[event]&.call(Struct.new(:data).new(data)); bo = Object.new; def bo.got = (@got ||= []); def bo.send(text) = got << text; Faye::WebSocket.define_singleton_method(:websocket?) { |env| true }; Faye::WebSocket.define_singleton_method(:new) { |env| ws }; ($clients ||= []).replace([bo]); App.call({}); ws.fire(:open); ws.fire(:message, 'Hallo'); ws.fire(:close); true
          expect: true
          say: Der Workspace konnte dein `App` nicht mit einer Verbindung zum Ausprobieren aufrufen.
        - call: bo.got.include?('Hallo')
          expect: true
          say: 'Bo ist verbunden und hat »Hallo« nicht bekommen: In `ws.on(:message)` geht jede Nachricht mit `broadcast(event.data)` an alle, statt mit »Echo:« zurück.'
        - call: $clients == [bo]
          expect: true
          say: 'Die Verbindung ist zu, steht aber noch in `$clients`: In `ws.on(:close)` gehört `$clients.delete(ws)` hin.'
        - call: bo.got.last != 'Hallo' && bo.got.last.include?('1')
          expect: true
          say: 'Zuletzt erfährt Bo, wie viele es noch sind, nämlich 1: ein `broadcast` mit `$clients.size` in `ws.on(:close)`, nach dem `delete`.'
    solution: |
      In `ws.on(:message)` steht `broadcast(event.data)`. `ws.on(:close)`
      nimmt die Verbindung mit `$clients.delete(ws)` heraus und sagt dann mit
      `broadcast` und `$clients.size` allen, wie viele es noch sind.

    python:
      prompt: |
        Füll in `handle` in `server.py` die beiden Stellen mit `...` und
        speichere. Der Workspace ruft `handle` mit einer Verbindung zum
        Ausprobieren auf, während Bo schon verbunden ist: Sie schickt
        »Hallo« und schließt. Bekommt Bo das »Hallo«, verschwindet die
        Verbindung aus `clients`, und erfährt Bo danach, dass noch 1 da ist?
        Der Server muss dafür nicht laufen.
      file: pixelwand/server.py
      check:
        type: python
        file: pixelwand/server.py
        cases:
          - call: >-
              (Fake := type('Fake', (), {'__init__': lambda self, texts=(): setattr(self, 'texts', texts) or setattr(self, 'got', []), '__iter__': lambda self: iter(self.texts), 'send': lambda self, text: self.got.append(text)}), bo := Fake(), clients.add(bo), handle(Fake(['Hallo'])), True)[-1]
            expect: true
            say: Der Workspace konnte `handle` nicht mit einer Verbindung zum Ausprobieren aufrufen.
          - call: '''Hallo'' in bo.got'
            expect: true
            say: 'Bo ist verbunden und hat »Hallo« nicht bekommen: In der Schleife geht jede Nachricht mit `broadcast(message)` an alle.'
          - call: clients == {bo}
            expect: true
            say: 'Die Verbindung ist zu, steht aber noch in `clients`: Im `finally` gehört `clients.discard(ws)` hin.'
          - call: bo.got[-1] != 'Hallo' and '1' in bo.got[-1]
            expect: true
            say: 'Zuletzt erfährt Bo, wie viele es noch sind, nämlich 1: ein `broadcast` mit `len(clients)` im `finally`, nach dem `discard`.'
      solution: |
        In der Schleife steht `broadcast(message)`. Im `finally` nimmt
        `clients.discard(ws)` die Verbindung heraus, und `broadcast` mit
        `len(clients)` sagt allen, wie viele es noch sind.

  - id: pruefung
    title: Nur glauben, was passt
    prompt: |
      Schreib in `ws.on(:message)` in `server.rb` die Prüfung und speichere.
      Der Workspace ruft dein `App` mit einer Verbindung zum Ausprobieren auf
      und schickt ihr Nachrichten: einen gültigen Pixel, Text, der kein JSON
      ist, JSON, das kein Hash ist, Werte, die keine ganzen Zahlen sind,
      Pixel knapp außerhalb des Bildes und Farben außerhalb von 0 bis 15.
      Nur der gültige Pixel darf auf die Wand und an alle gehen. Der Server
      muss dafür nicht laufen.
    file: pixelwand/server.rb
    check:
      type: ruby
      file: pixelwand/server.rb
      cases:
        - call: >-
            ws = Object.new; def ws.on(event, &block) = (@on ||= {}).store(event, block); def ws.send(text) = $sent << text; def ws.rack_response = []; Faye::WebSocket.define_singleton_method(:websocket?) { |env| true }; Faye::WebSocket.define_singleton_method(:new) { |env| ws }; App.call({}); $clients.replace([ws]); paint = ->(text) { $sent = []; ws.instance_variable_get(:@on)[:message].call(Struct.new(:data).new(text)); $sent.map { |m| JSON.parse(m) }.select { |m| m['type'] == 'pixel' } }; true
          expect: true
          say: Der Workspace konnte dein `App` nicht mit einer Verbindung zum Ausprobieren aufrufen.
        - call: 'paint.(''{"x": 3, "y": 2, "color": 4}'').size'
          expect: 1
          say: 'Ein gültiger Pixel, `{"x": 3, "y": 2, "color": 4}`, muss auf die Wand und mit `broadcast` an alle gehen.'
        - call: $pixels[2 * WIDTH + 3]
          expect: 4
          say: Der gültige Pixel steht danach in `$pixels`, am Index `y * WIDTH + x`.
        - call: 'paint.(''Hallo'')'
          expect: '[]'
          say: 'Text, der kein JSON ist, lässt `JSON.parse` einen Fehler werfen: abfangen und überspringen, mit `rescue next`.'
        - call: 'paint.(''[1, 2, 3]'')'
          expect: '[]'
          say: 'JSON, das kein Hash ist, wird übersprungen: `message.is_a?(Hash)`.'
        - call: 'paint.(''{"y": 0, "color": 4}'')'
          expect: '[]'
          say: 'Fehlt `x`, ist es `nil`, keine ganze Zahl: überspringen.'
        - call: 'paint.(''{"x": "0", "y": 0, "color": 4}'')'
          expect: '[]'
          say: '`"0"` ist ein Text, keine ganze Zahl (`Integer`).'
        - call: 'paint.(''{"x": 1.5, "y": 0, "color": 4}'')'
          expect: '[]'
          say: '`1.5` ist keine ganze Zahl (`Integer`).'
        - call: 'paint.(''{"x": 64, "y": 0, "color": 4}'')'
          expect: '[]'
          say: '`x` geht von 0 bis `WIDTH - 1`; 64 liegt schon außerhalb.'
        - call: 'paint.(''{"x": -1, "y": 0, "color": 4}'')'
          expect: '[]'
          say: 'Ein negatives `x` liegt außerhalb des Bildes, auch wenn `$pixels[-1]` keinen Fehler gibt.'
        - call: 'paint.(''{"x": 0, "y": 40, "color": 4}'')'
          expect: '[]'
          say: '`y` geht von 0 bis `HEIGHT - 1`; 40 liegt schon außerhalb.'
        - call: 'paint.(''{"x": 0, "y": 0, "color": 16}'')'
          expect: '[]'
          say: Farben gehen von 0 bis 15.
        - call: 'paint.(''{"x": 0, "y": 0, "color": -1}'')'
          expect: '[]'
          say: Farben gehen von 0 bis 15, eine negative gibt es nicht.
        - call: $pixels.count(0) == WIDTH * HEIGHT - 1
          expect: true
          say: Nur der gültige Pixel darf `$pixels` ändern, auch wenn eine Nachricht danach nicht an alle geht.
    solution: |
      `JSON.parse(event.data) rescue next` überspringt, was kein JSON ist;
      danach `next unless message.is_a?(Hash)`, `values_at('x', 'y',
      'color')`, `next unless [x, y, color].all?(Integer)` und `next unless`
      mit `between?(0, WIDTH - 1)`, `between?(0, HEIGHT - 1)` und
      `between?(0, 15)`.

    python:
      prompt: |
        Schreib in `handle` in `server.py` die Prüfung und speichere. Der
        Workspace ruft `handle` mit einer Verbindung zum Ausprobieren auf und
        schickt ihr Nachrichten: einen gültigen Pixel, Text, der kein JSON
        ist, JSON, das kein `dict` ist, Werte, die keine ganzen Zahlen sind,
        Pixel knapp außerhalb des Bildes und Farben außerhalb von 0 bis 15.
        Nur der gültige Pixel darf auf die Wand und an alle gehen. Der Server
        muss dafür nicht laufen.
      file: pixelwand/server.py
      check:
        type: python
        file: pixelwand/server.py
        cases:
          - call: >-
              (Fake := type('Fake', (), {'__init__': lambda self, texts=(): setattr(self, 'texts', texts) or setattr(self, 'got', []), '__iter__': lambda self: iter(self.texts), 'send': lambda self, text: self.got.append(text)}), bo := Fake(), clients.add(bo), paint := lambda text: (bo.got.clear(), handle(Fake([text])), [m for m in map(__import__('json').loads, bo.got) if m.get('type') == 'pixel'])[-1], True)[-1]
            expect: true
            say: Der Workspace konnte `handle` nicht mit einer Verbindung zum Ausprobieren aufrufen.
          - call: 'len(paint(''{"x": 3, "y": 2, "color": 4}''))'
            expect: 1
            say: 'Ein gültiger Pixel, `{"x": 3, "y": 2, "color": 4}`, muss auf die Wand und mit `broadcast` an alle gehen.'
          - call: pixels[2 * WIDTH + 3]
            expect: 4
            say: Der gültige Pixel steht danach in `pixels`, am Index `y * WIDTH + x`.
          - call: 'paint(''Hallo'')'
            expect: '[]'
            say: 'Text, der kein JSON ist, lässt `json.loads` einen `ValueError` werfen: abfangen und überspringen, mit `continue`.'
          - call: 'paint(''[1, 2, 3]'')'
            expect: '[]'
            say: 'JSON, das kein `dict` ist, wird übersprungen: `isinstance(message, dict)`.'
          - call: 'paint(''{"y": 0, "color": 4}'')'
            expect: '[]'
            say: 'Fehlt `x`, ist `message.get(''x'')` gleich `None`, keine ganze Zahl: überspringen.'
          - call: 'paint(''{"x": "0", "y": 0, "color": 4}'')'
            expect: '[]'
            say: '`"0"` ist ein Text, keine ganze Zahl (`int`).'
          - call: 'paint(''{"x": 1.5, "y": 0, "color": 4}'')'
            expect: '[]'
            say: '`1.5` ist keine ganze Zahl (`int`).'
          - call: 'paint(''{"x": 64, "y": 0, "color": 4}'')'
            expect: '[]'
            say: '`x` geht von 0 bis `WIDTH - 1`; 64 liegt schon außerhalb.'
          - call: 'paint(''{"x": -1, "y": 0, "color": 4}'')'
            expect: '[]'
            say: 'Ein negatives `x` liegt außerhalb des Bildes, auch wenn `pixels[-1]` keinen Fehler gibt.'
          - call: 'paint(''{"x": 0, "y": 40, "color": 4}'')'
            expect: '[]'
            say: '`y` geht von 0 bis `HEIGHT - 1`; 40 liegt schon außerhalb.'
          - call: 'paint(''{"x": 0, "y": 0, "color": 16}'')'
            expect: '[]'
            say: Farben gehen von 0 bis 15.
          - call: 'paint(''{"x": 0, "y": 0, "color": -1}'')'
            expect: '[]'
            say: Farben gehen von 0 bis 15, eine negative gibt es nicht.
          - call: pixels.count(0) == WIDTH * HEIGHT - 1
            expect: true
            say: Nur der gültige Pixel darf `pixels` ändern, auch wenn eine Nachricht danach nicht an alle geht.
      solution: |
        `json.loads(text)` in `try` mit `except ValueError: continue`, danach
        `continue`, wenn `message` kein `dict` ist, wenn `x`, `y` oder `color`
        keine ganzen Zahlen sind (`type(value) is int`) und wenn nicht
        `0 <= x < WIDTH and 0 <= y < HEIGHT and 0 <= color <= 15`.

  - id: pixel-zahl
    title: Das ganze Bild
    prompt: |
      Wie viele Farbnummern stehen in der Liste `pixels` der Nachricht, die ein
      neuer Besuch zuerst bekommt?
    check:
      type: number
      expect: 2560
      tolerance: 0
      unit: Farbnummern
    feedback:
      - when: { equals: 104 }
        say: Das ist 64 + 40. Das Bild ist ein Rechteck aus Zeilen und Spalten.
    solution: 64 × 40 = 2560, eine Farbnummer pro Pixel, Zeile für Zeile.

  - id: vertrauen
    title: Jeder kann alles schicken
    prompt: |
      Deine Webseite schickt nur gültige Pixel. Warum prüft der Server trotzdem
      jede Nachricht?
    check:
      type: choice
      options:
        - Jeder kann sich mit dem Server verbinden und beliebige Nachrichten schicken, nicht nur deine Seite
        - 'JSON verliert unterwegs manchmal Zahlen, wenn das Netz langsam ist'
        - 'Ohne die Prüfung kann der Server das JSON nicht lesen'
        - 'Der Browser rundet die Koordinaten manchmal falsch und schickt Pixel außerhalb der Wand'
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Was ankommt, ist genau das, was abgeschickt wurde. Die Frage ist, wer etwas abschickt.
    solution: Eine WebSocket-Verbindung kann jedes Programm öffnen, auch die Konsole im Browser. Ein Server darf keiner Nachricht trauen, nur weil seine eigene Seite sie anders schicken würde.

  - id: pixelwand
    title: Die Pixelwand
    prompt: |
      Bau die Pixelwand: Der Server bewahrt das Bild auf, prüft jede
      Nachricht und schickt jeden Pixel an alle. Speichere.
    file: pixelwand/server.rb
    check:
      type: files
      path: pixelwand/server.rb
      expect:
        format: text
        contains:
          - { pattern: 'JSON\.parse', say: 'In `server.rb` liest der Server noch kein JSON (`JSON.parse`).' }
          - { pattern: 'Faye::WebSocket', say: 'In `server.rb` öffnet noch nichts eine WebSocket-Verbindung (`Faye::WebSocket.new(env)`).' }
          - { pattern: 'between\?|<\s*WIDTH|>=\s*0', say: 'Noch prüft der Server nicht, ob ein Pixel im Bild liegt, zum Beispiel mit `x.between?(0, WIDTH - 1)`.' }
    python:
      file: pixelwand/server.py
      check:
        type: files
        path: pixelwand/server.py
        expect:
          format: text
          contains:
            - { pattern: 'json\.loads', say: 'In `server.py` liest der Server noch kein JSON (`json.loads`).' }
            - { pattern: 'websockets', say: 'In `server.py` öffnet noch nichts eine WebSocket-Verbindung (`serve` aus `websockets.sync.server`).' }
            - { pattern: '<\s*WIDTH|<=\s*15|>=\s*0|range\(', say: 'Noch prüft der Server nicht, ob ein Pixel im Bild liegt, zum Beispiel mit `0 <= x < WIDTH`.' }

  - id: counter
    title: 200 Pixel
    prediction: true
    prompt: |
      `flood.js` schickt 200 Pixel auf einmal, vier Threads verarbeiten sie.
      Welche Zahl steht danach im Terminal des Servers bei »Pixel Nr. …«?
      Überleg erst, dann probier es aus.
    check:
      type: choice
      options:
        - Deutlich weniger als 200
        - Genau 200
        - Ein paar weniger als 200, 195 oder so
        - Mehr als 200
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Jeder Thread liest `$painted`, speichert das Bild und schreibt erst danach. Was haben die anderen Threads in der Zwischenzeit gelesen?
      - when: { picked: 2 }
        say: Bei deinem Webserver wäre das eine gute Schätzung. Hier liegt zwischen Lesen und Schreiben das Speichern, und das dauert.
    solution: Während ein Thread das Bild speichert, lesen die anderen denselben alten Wert von `$painted`. Mehrere Threads schreiben dann dieselbe Zahl zurück, und Pixel gehen beim Zählen verloren. Am Ende steht der Zähler weit unter 200, oft nur bei einem Drittel.
    python:
      feedback:
        - when: { picked: 1 }
          say: Jeder Thread liest `painted`, speichert das Bild und schreibt erst danach. Was haben die anderen Threads in der Zwischenzeit gelesen?
        - when: { picked: 2 }
          say: Bei deinem Webserver wäre das eine gute Schätzung. Hier liegt zwischen Lesen und Schreiben das Speichern, und das dauert.
      solution: Während ein Thread das Bild speichert, lesen die anderen denselben alten Wert von `painted`. Mehrere Threads schreiben dann dieselbe Zahl zurück, und Pixel gehen beim Zählen verloren. Am Ende steht der Zähler weit unter 200, oft nur bei der Hälfte.

  - id: lock
    title: Ein Lock
    prompt: |
      Schütze Bild und Zähler mit einem Lock, sodass der Server nach
      `node flood.js` bei 200 ankommt, und speichere.
    file: pixelwand/server.rb
    check:
      type: files
      path: pixelwand/server.rb
      expect:
        format: text
        contains:
          - { pattern: 'Thread\.new', say: 'In `server.rb` gibt es noch keine Threads, die Nachrichten abarbeiten (`Thread.new`).' }
          - { pattern: 'Mutex\.new', say: 'In `server.rb` gibt es noch keinen Lock: `$lock = Mutex.new`.' }
          - { pattern: '\.synchronize\b', say: 'Der Lock ist da, aber noch schützt er nichts: `$lock.synchronize do … end` um das Ändern von Bild und Zähler.' }
    python:
      file: pixelwand/server.py
      check:
        type: files
        path: pixelwand/server.py
        expect:
          format: text
          contains:
            - { pattern: 'threading\.Thread', say: 'In `server.py` gibt es noch keine Threads, die Nachrichten abarbeiten (`threading.Thread`).' }
            - { pattern: 'Lock\(\)', say: 'In `server.py` gibt es noch keinen Lock: `lock = threading.Lock()`.' }
            - { pattern: 'with\s+lock\b|\.acquire\(', say: 'Der Lock ist da, aber noch schützt er nichts: `with lock:` um das Ändern von Bild und Zähler.' }

  - id: abgabe
    title: Deine Pixelwand
    prompt: |
      Gib deine Pixelwand ab: den Ordner `pixelwand` mit `server.rb` und
      `index.html`.
    check:
      type: submit
      paths: [pixelwand]
      max_size: 5MB
    python:
      prompt: |
        Gib deine Pixelwand ab: den Ordner `pixelwand` mit `server.py` und
        `index.html`.
