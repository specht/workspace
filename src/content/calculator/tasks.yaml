          - 'calculate(''2^3^2'')': '512'
          - call: 'calculate(''-2^2'')'
            expect: '-4'
            say: 'Wie in der Mathematik: erst hoch, dann das Vorzeichen.'
          - call: 'calculate(''2^-1'')'
            expect: '0.5'
            say: 'Nach dem Hoch darf ein Vorzeichen stehen.'
          - call: 'calculate(''(2+1)^2*2'')'
            expect: '18'
            say: 'Hoch bindet stärker als Mal.'
      hint:
        - |
          Schreib die Bäume für `2 ^ 3 ^ 2` und `-2 ^ 2` von Hand auf, so wie sie
          werden sollen: Was hängt tiefer, also was wird zuerst gerechnet? Vergleich mit
          `8 - 3 - 2`: Warum hängt dort der linke Teil tiefer, und was in `expression`
          sorgt dafür?
        - |
          `factor` ruft statt `atom` jetzt `power` auf. `power` holt sich erst ein
          `atom`. Kommt danach ein `^`, nimmt es ihn heraus und ruft für den Rest
          `factor` auf, einmal, nicht in einer Schleife: So hängt der rechte Teil
          tiefer. In `evaluate` kommt `^` dazu, in Python `**`.
        - |
          Ein Gerüst:

          ```python
          def power(tokens):
              tree = atom(tokens)
              if first(tokens) == '^':
                  tokens.pop(0)
                  tree = ...  # ein Knoten mit '^', tree und dem nächsten Faktor
              return tree
          ```

          Dazu in `factor` `power(tokens)` statt `atom(tokens)`, und in `evaluate`
          ein Fall für `'^'`.

