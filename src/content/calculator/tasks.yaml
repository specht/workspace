# Aufgaben zu »Ein Rechner für Ausdrücke«. Format: docs/aufgaben.md.
# Alles liegt in /workspace/calculator; die Werte kommen aus loesung/.
# Bäume sind Listen: eine Zahl (ein Blatt), ein Name, [Zeichen, links, rechts]
# oder ["neg", Kind]; so sehen sie in Ruby und in Python gleich aus.
format: 1
activity: calculator
tasks:
  - id: links-nach-rechts
    title: Links oder rechts?
    prediction: true
    prompt: Was ergibt `8 - 3 - 2`? Überleg zuerst, bevor du es ausprobierst.
    check:
      type: number
      expect: 3
    feedback:
      - when: { equals: 7 }
        say: Das wäre `8 - (3 - 2)`. Ohne Klammern wird von links nach rechts gerechnet, erst `8 - 3`.
    solution: '3: erst 8 - 3 = 5, dann 5 - 2 = 3.'

  - id: zerlegen
    title: Zerlegen
    prompt: 'Schreib `tokenize` in `calculator.rb`.'
    check:
      type: ruby
      file: calculator/calculator.rb
      cases:
        - 'tokenize(''12+3*(4-1)'')': '[12, "+", 3, "*", "(", 4, "-", 1, ")"]'
        - call: 'tokenize('' 7 '')'
          expect: '[7]'
          say: 'Leerzeichen trennen nur, sie werden keine Tokens.'
        - 'tokenize('''')': '[]'
        - call: 'tokenize(''100 / 25'')'
          expect: '[100, "/", 25]'
          say: 'Eine Zahl mit mehreren Ziffern ist ein einziges Token.'
        - call: 'tokenize(''3.25*2'')'
          expect: '[3.25, "*", 2]'
          say: 'Mit einem Punkt und Ziffern danach ist die Zahl eine Kommazahl.'
        - 'tokenize(''2^(1-4)'')': '[2, "^", "(", 1, "-", 4, ")"]'
        - call: 'tokenize(''2 # 3'')'
          raises: true
          say: 'Ein Zeichen, das in keinem Ausdruck vorkommt, ist ein Fehler, kein Token.'
        - call: 'tokenize(''7'').first.is_a?(Integer)'
          expect: true
          say: 'Eine Zahl ohne Punkt bleibt ein Integer: 7, nicht 7.0.'
    hint:
      - |
        Geh `12+3*(4-1)` von Hand durch, Zeichen für Zeichen, und schreib zu jedem
        auf, was passiert: Welches Zeichen wird ein Token für sich, wo fängt eine
        Zahl an, und woran merkst du, dass sie zu Ende ist? Was passiert mit dem
        Leerzeichen in `1 + 2`?
      - |
        Ein Index `i` läuft in einer `while`-Schleife durch den Text, nicht in
        `each`, weil eine Zahl ihn um mehrere Zeichen weiterschiebt. Bei einer Ziffer
        merkst du dir `start = i` und gehst weiter, solange Ziffern kommen; kommen
        danach ein Punkt und eine Ziffer, ebenso. `text[start...i]` ist dann die
        ganze Zahl.
      - |
        Ein Gerüst:

        ```ruby
        def tokenize(text)
            tokens = []
            i = 0
            while i < text.length
                c = text[i]
                if c == ' '
                    i += 1
                elsif '+-*/^()'.include?(c)
                    … # ein Token für sich
                elsif c =~ /[0-9]/
                    start = i
                    … # weiter, solange Ziffern kommen, vielleicht ein Punkt mit Ziffern
                    … # to_i oder to_f, je nachdem, ob ein Punkt darin ist
                else
                    raise ArgumentError, "…" # welches Zeichen, an welcher Stelle
                end
            end
            tokens
        end
        ```
    python:
      prompt: 'Schreib `tokenize` in `calculator.py`.'
      check:
        type: python
        file: calculator/calculator.py
        cases:
          - 'tokenize(''12+3*(4-1)'')': '[12, "+", 3, "*", "(", 4, "-", 1, ")"]'
          - call: 'tokenize('' 7 '')'
            expect: '[7]'
            say: 'Leerzeichen trennen nur, sie werden keine Tokens.'
          - 'tokenize('''')': '[]'
          - call: 'tokenize(''100 / 25'')'
            expect: '[100, "/", 25]'
            say: 'Eine Zahl mit mehreren Ziffern ist ein einziges Token.'
          - call: 'tokenize(''3.25*2'')'
            expect: '[3.25, "*", 2]'
            say: 'Mit einem Punkt und Ziffern danach ist die Zahl eine Kommazahl.'
          - 'tokenize(''2^(1-4)'')': '[2, "^", "(", 1, "-", 4, ")"]'
          - call: 'tokenize(''2 # 3'')'
            raises: true
            say: 'Ein Zeichen, das in keinem Ausdruck vorkommt, ist ein Fehler, kein Token.'
          - call: 'isinstance(tokenize(''7'')[0], int)'
            expect: true
            say: 'Eine Zahl ohne Punkt bleibt ein int: 7, nicht 7.0.'
      hint:
        - |
          Geh `12+3*(4-1)` von Hand durch, Zeichen für Zeichen, und schreib zu jedem
          auf, was passiert: Welches Zeichen wird ein Token für sich, wo fängt eine
          Zahl an, und woran merkst du, dass sie zu Ende ist? Was passiert mit dem
          Leerzeichen in `1 + 2`?
        - |
          Ein Index `i` läuft in einer `while`-Schleife durch den Text, nicht in
          `for`, weil eine Zahl ihn um mehrere Zeichen weiterschiebt. Bei einer Ziffer
          merkst du dir `start = i` und gehst weiter, solange Ziffern kommen; kommen
          danach ein Punkt und eine Ziffer, ebenso. `text[start:i]` ist dann die ganze
          Zahl.
        - |
          Ein Gerüst:

          ```python
          def tokenize(text):
              tokens = []
              i = 0
              while i < len(text):
                  c = text[i]
                  if c == ' ':
                      i += 1
                  elif c in '+-*/^()':
                      ...  # ein Token für sich
                  elif c.isdigit():
                      start = i
                      ...  # weiter, solange Ziffern kommen, vielleicht ein Punkt mit Ziffern
                      ...  # int oder float, je nachdem, ob ein Punkt darin ist
                  else:
                      raise ValueError('…')  # welches Zeichen, an welcher Stelle
              return tokens
          ```

  - id: klammern
    title: Was ein Automat nicht kann
    prompt: Warum kann kein endlicher Automat für jeden Ausdruck entscheiden, ob seine Klammern zusammenpassen?
    check:
      type: choice
      options:
        - Er müsste sich merken, wie viele Klammern gerade offen sind. Dafür gibt es keine Obergrenze, aber er hat nur endlich viele Zustände.
        - Klammern sind keine Buchstaben, und ein Automat liest nur Buchstaben und Ziffern.
        - Er liest von links nach rechts, aber ob eine Klammer zugeht, sieht man erst von rechts.
        - Er könnte es, aber bei langen Ausdrücken wäre er zu langsam.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Ein Automat kann jedes Zeichen lesen, auch Klammern. Das Problem ist, was er sich merken muss.
      - when: { picked: 2 }
        say: Von links nach rechts reicht, wenn man mitzählt. Das Zählen ist das Problem.
      - when: { picked: 3 }
        say: Ein Automat braucht für jedes Zeichen genau einen Schritt, schneller geht es kaum.

  - id: baum
    title: Ein Baum aus Tokens
    prompt: 'Schreib `parse` in `calculator.rb`: aus Tokens einen Baum, mit `+`, `-`, `*`, `/`, Klammern und einem Minus als Vorzeichen.'
    check:
      type: ruby
      file: calculator/calculator.rb
      cases:
        - call: 'parse(tokenize(''7''))'
          expect: '7'
          say: 'Eine Zahl allein ist schon ein Baum, ein Blatt.'
        - call: 'parse(tokenize(''2+3*4''))'
          expect: '["+", 2, ["*", 3, 4]]'
          say: 'Punkt vor Strich: Das Multiplizieren hängt unter dem Plus.'
        - 'parse(tokenize(''(2+3)*4''))': '["*", ["+", 2, 3], 4]'
        - call: 'parse(tokenize(''8-3-2''))'
          expect: '["-", ["-", 8, 3], 2]'
          say: 'Von links nach rechts: Erst 8 - 3, davon dann 2 weg.'
        - 'parse(tokenize(''2*(3+(4-1))''))': '["*", 2, ["+", 3, ["-", 4, 1]]]'
        - call: 'parse(tokenize(''-(1+2)''))'
          expect: '["neg", ["+", 1, 2]]'
          say: 'Ein Minus vorn ist ein Vorzeichen: ["neg", …] mit einem einzigen Kind.'
        - 'parse(tokenize(''2*-3''))': '["*", 2, ["neg", 3]]'
    hint:
      - |
        Bau den Baum für `2 * (3 + 4)` von Hand mit der Grammatik. Schreib die
        Aufrufe eingerückt untereinander, so wie sie ineinanderstecken:
        `expression`, darin `term`, darin `factor`, darin `atom` … Bei welchem Aufruf
        wird welches Token herausgenommen, und was gibt jeder Aufruf zurück?
      - |
        `term` ist gebaut wie `expression`, nur mit `*` und `/` und mit `factor`
        statt `term`. `factor` schaut, ob ein `-` kommt: Dann nimmt es ihn heraus und
        gibt `["neg", …]` mit dem nächsten Faktor zurück, sonst ruft es `atom` auf.
        `atom` nimmt das nächste Token: Eine Zahl ist schon ihr Baum, bei `(` kommt
        ein ganzer Ausdruck und danach das `)`.
      - |
        Ein Gerüst; `expression` steht schon auf der Seite:

        ```ruby
        def term(tokens)
            tree = factor(tokens)
            … # wie in expression, mit * und /
            tree
        end

        def factor(tokens)
            if tokens.first == '-'
                tokens.shift
                return … # ein Knoten mit "neg" und dem nächsten Faktor
            end
            atom(tokens)
        end

        def atom(tokens)
            token = tokens.shift
            if token == '('
                … # ein ganzer Ausdruck, dann das ) herausnehmen
            end
            token # eine Zahl
        end

        def parse(tokens)
            tokens = tokens.dup
            tree = expression(tokens)
            … # sind noch Tokens übrig, stimmt etwas nicht
            tree
        end
        ```
    python:
      prompt: 'Schreib `parse` in `calculator.py`: aus Tokens einen Baum, mit `+`, `-`, `*`, `/`, Klammern und einem Minus als Vorzeichen.'
      check:
        type: python
        file: calculator/calculator.py
        cases:
          - call: 'parse(tokenize(''7''))'
            expect: '7'
            say: 'Eine Zahl allein ist schon ein Baum, ein Blatt.'
          - call: 'parse(tokenize(''2+3*4''))'
            expect: '["+", 2, ["*", 3, 4]]'
            say: 'Punkt vor Strich: Das Multiplizieren hängt unter dem Plus.'
          - 'parse(tokenize(''(2+3)*4''))': '["*", ["+", 2, 3], 4]'
          - call: 'parse(tokenize(''8-3-2''))'
            expect: '["-", ["-", 8, 3], 2]'
            say: 'Von links nach rechts: Erst 8 - 3, davon dann 2 weg.'
          - 'parse(tokenize(''2*(3+(4-1))''))': '["*", 2, ["+", 3, ["-", 4, 1]]]'
          - call: 'parse(tokenize(''-(1+2)''))'
            expect: '["neg", ["+", 1, 2]]'
            say: 'Ein Minus vorn ist ein Vorzeichen: ["neg", …] mit einem einzigen Kind.'
          - 'parse(tokenize(''2*-3''))': '["*", 2, ["neg", 3]]'
      hint:
        - |
          Bau den Baum für `2 * (3 + 4)` von Hand mit der Grammatik. Schreib die
          Aufrufe eingerückt untereinander, so wie sie ineinanderstecken:
          `expression`, darin `term`, darin `factor`, darin `atom` … Bei welchem Aufruf
          wird welches Token herausgenommen, und was gibt jeder Aufruf zurück?
        - |
          `term` ist gebaut wie `expression`, nur mit `*` und `/` und mit `factor`
          statt `term`. `factor` schaut, ob ein `-` kommt: Dann nimmt es ihn heraus und
          gibt `['neg', …]` mit dem nächsten Faktor zurück, sonst ruft es `atom` auf.
          `atom` nimmt das nächste Token: Eine Zahl ist schon ihr Baum, bei `(` kommt
          ein ganzer Ausdruck und danach das `)`. `first(tokens)` gibt `tokens[0]`
          zurück, oder `None`, wenn die Liste leer ist.
        - |
          Ein Gerüst; `expression` steht schon auf der Seite:

          ```python
          def first(tokens):
              return tokens[0] if tokens else None

          def term(tokens):
              tree = factor(tokens)
              ...  # wie in expression, mit * und /
              return tree

          def factor(tokens):
              if first(tokens) == '-':
                  tokens.pop(0)
                  return ...  # ein Knoten mit 'neg' und dem nächsten Faktor
              return atom(tokens)

          def atom(tokens):
              token = tokens.pop(0)
              if token == '(':
                  ...  # ein ganzer Ausdruck, dann das ) herausnehmen
              return token  # eine Zahl

          def parse(tokens):
              tokens = list(tokens)
              tree = expression(tokens)
              ...  # sind noch Tokens übrig, stimmt etwas nicht
              return tree
          ```

  - id: ausrechnen
    title: Ausrechnen
    prompt: 'Schreib `evaluate` in `calculator.rb`.'
    check:
      type: ruby
      file: calculator/calculator.rb
      cases:
        - 'evaluate(["+", 2, ["*", 3, 4]])': '14'
        - 'evaluate(5)': '5'
        - 'calculate(''8-3-2'')': '3'
        - 'calculate(''-(1+2)*4'')': '-12'
        - 'calculate(''2*(3+(4-1))'')': '12'
        - 'calculate(''10/4*2'')': '5.0'
        - call: 'calculate(''7/2'')'
          expect: '3.5'
          say: 'Teilen gibt immer eine Kommazahl. In Ruby ist 7 / 2 aber 3; mit to_f wird daraus 7.0 / 2.'
    hint:
      - |
        Rechne `["+", 2, ["*", 3, 4]]` von Hand aus: Welcher Knoten kann zuerst
        ausgerechnet werden, und was setzt du danach an seine Stelle? Was ist mit
        `["neg", 5]`, das nur einen Teilbaum hat?
      - |
        Ist `tree` eine Zahl (`tree.is_a?(Numeric)`), ist sie schon der Wert. Sonst
        nimmst du mit `op, *args = tree` das Rechenzeichen und die Teilbäume, rechnest
        die Teilbäume mit `evaluate` aus und entscheidest mit `case op`, was mit den
        Werten passiert. Beim Teilen: `to_f`.
      - |
        Ein Gerüst:

        ```ruby
        def evaluate(tree, variables = {})
            return tree if tree.is_a?(Numeric)
            op, *args = tree
            values = args.map { |arg| evaluate(arg, variables) }
            case op
            when '+' then …
            when '-' then …
            when '*' then …
            when '/' then … # immer eine Kommazahl
            when 'neg' then … # nur ein Wert
            end
        end
        ```
    python:
      prompt: 'Schreib `evaluate` in `calculator.py`.'
      check:
        type: python
        file: calculator/calculator.py
        cases:
          - 'evaluate(["+", 2, ["*", 3, 4]])': '14'
          - 'evaluate(5)': '5'
          - 'calculate(''8-3-2'')': '3'
          - 'calculate(''-(1+2)*4'')': '-12'
          - 'calculate(''2*(3+(4-1))'')': '12'
          - 'calculate(''10/4*2'')': '5.0'
          - call: 'calculate(''7/2'')'
            expect: '3.5'
            say: 'Teilen gibt immer eine Kommazahl: 7 / 2 ist 3.5.'
      hint:
        - |
          Rechne `['+', 2, ['*', 3, 4]]` von Hand aus: Welcher Knoten kann zuerst
          ausgerechnet werden, und was setzt du danach an seine Stelle? Was ist mit
          `['neg', 5]`, das nur einen Teilbaum hat?
        - |
          Ist `tree` eine Zahl (`isinstance(tree, (int, float))`), ist sie schon der
          Wert. Sonst nimmst du mit `op, *args = tree` das Rechenzeichen und die
          Teilbäume, rechnest die Teilbäume mit `evaluate` aus und entscheidest mit
          `if op == …`, was mit den Werten passiert.
        - |
          Ein Gerüst:

          ```python
          def evaluate(tree, variables={}):
              if isinstance(tree, (int, float)):
                  return tree
              op, *args = tree
              values = [evaluate(arg, variables) for arg in args]
              if op == '+':
                  return ...
              if op == '-':
                  return ...
              ...  # *, / und 'neg', das nur einen Wert hat
          ```

  - id: fehler
    title: Fehler
    prompt: 'Sorg dafür, dass `calculate` bei einem falschen Ausdruck mit einem Fehler abbricht (`raise`), statt irgendetwas auszurechnen.'
    check:
      type: ruby
      file: calculator/calculator.rb
      cases:
        - call: 'calculate(''(1+2'')'
          raises: true
          say: 'Eine Klammer, die nie zugeht, ist ein Fehler.'
        - call: 'calculate(''1+'')'
          raises: true
          say: 'Nach dem Plus fehlt etwas. Das ist ein Fehler, keine Null.'
        - call: 'calculate(''1 2'')'
          raises: true
          say: 'Zwischen zwei Zahlen fehlt ein Rechenzeichen. Bleiben nach dem Ausdruck Tokens übrig, ist das ein Fehler.'
        - call: 'calculate('')'')'
          raises: true
        - call: 'calculate('''')'
          raises: true
          say: 'Ein leerer Ausdruck hat keinen Wert.'
        - call: 'calculate(''2*(3+4)'')'
          expect: '14'
          say: 'Richtige Ausdrücke gehen weiterhin.'
    hint:
      - |
        Nimm die vier Beispiele von der Seite, `1 +`, `(1 + 2`, `) 3` und `1 2`, und
        geh jedes in Gedanken durch deinen Parser: In welcher Methode merkt er als
        Erstes, dass etwas nicht stimmt? Was tut er an dieser Stelle jetzt, und was
        gibt `tokens.shift` zurück, wenn die Liste leer ist?
      - |
        Drei Stellen sind in `atom`: Ist kein Token mehr da (`nil`), hört der
        Ausdruck zu früh auf. Ist das Token keine Zahl und keine `(`, passt es hier
        nicht hin. Und nach dem Ausdruck in der Klammer muss das nächste Token ein
        `)` sein, bevor du es herausnimmst. Die vierte Stelle ist `parse`: Sind danach
        noch Tokens übrig, gehören sie zu keinem Ausdruck.
      - |
        Ein Gerüst für `atom`; die Bedingungen und die Meldungen schreibst du:

        ```ruby
        def atom(tokens)
            token = tokens.shift
            raise ArgumentError, '…' if … # kein Token mehr
            if token == '('
                tree = expression(tokens)
                raise ArgumentError, '…' unless … # kommt ein )?
                tokens.shift
                return tree
            end
            raise ArgumentError, "…" unless … # eine Zahl?
            token
        end
        ```
    python:
      prompt: 'Sorg dafür, dass `calculate` bei einem falschen Ausdruck mit einem Fehler abbricht (`raise`), statt irgendetwas auszurechnen.'
      check:
        type: python
        file: calculator/calculator.py
        cases:
          - call: 'calculate(''(1+2'')'
            raises: true
            say: 'Eine Klammer, die nie zugeht, ist ein Fehler.'
          - call: 'calculate(''1+'')'
            raises: true
            say: 'Nach dem Plus fehlt etwas. Das ist ein Fehler, keine Null.'
          - call: 'calculate(''1 2'')'
            raises: true
            say: 'Zwischen zwei Zahlen fehlt ein Rechenzeichen. Bleiben nach dem Ausdruck Tokens übrig, ist das ein Fehler.'
          - call: 'calculate('')'')'
            raises: true
          - call: 'calculate('''')'
            raises: true
            say: 'Ein leerer Ausdruck hat keinen Wert.'
          - call: 'calculate(''2*(3+4)'')'
            expect: '14'
            say: 'Richtige Ausdrücke gehen weiterhin.'
      hint:
        - |
          Nimm die vier Beispiele von der Seite, `1 +`, `(1 + 2`, `) 3` und `1 2`, und
          geh jedes in Gedanken durch deinen Parser: In welcher Funktion merkt er als
          Erstes, dass etwas nicht stimmt? Was tut er an dieser Stelle jetzt, und was
          passiert bei `tokens.pop(0)`, wenn die Liste leer ist?
        - |
          Drei Stellen sind in `atom`: Ist kein Token mehr da, hört der Ausdruck zu
          früh auf. Ist das Token keine Zahl und keine `(`, passt es hier nicht hin. Und
          nach dem Ausdruck in der Klammer muss das nächste Token ein `)` sein, bevor du
          es herausnimmst. Die vierte Stelle ist `parse`: Sind danach noch Tokens
          übrig, gehören sie zu keinem Ausdruck.
        - |
          Ein Gerüst für `atom`; die Bedingungen und die Meldungen schreibst du:

          ```python
          def atom(tokens):
              if ...:  # kein Token mehr
                  raise ValueError('…')
              token = tokens.pop(0)
              if token == '(':
                  tree = expression(tokens)
                  if ...:  # kommt kein )?
                      raise ValueError('…')
                  tokens.pop(0)
                  return tree
              if ...:  # keine Zahl?
                  raise ValueError('…')
              return token
          ```

  - id: hoch-vorhersage
    title: Hoch und noch mal hoch
    prediction: true
    prompt: Was ergibt `2 ^ 3 ^ 2`, wenn `^` »hoch« heißt, so wie in der Mathematik?
    check:
      type: number
      expect: 512
    feedback:
      - when: { equals: 64 }
        say: Das wäre `(2 ^ 3) ^ 2`. In der Mathematik wird hoch von oben nach unten gerechnet, also von rechts nach links.
    solution: '512, weil 2 ^ (3 ^ 2) = 2 ^ 9 gerechnet wird.'

  - id: potenz
    title: Hoch
    prompt: 'Bau `^` in `calculator.rb` ein.'
    check:
      type: ruby
      file: calculator/calculator.rb
      cases:
        - call: 'parse(tokenize(''2^3^2''))'
          expect: '["^", 2, ["^", 3, 2]]'
          say: 'Hoch wird von rechts nach links gerechnet: 2 hoch (3 hoch 2).'
        - 'calculate(''2^3^2'')': '512'
        - call: 'calculate(''-2^2'')'
          expect: '-4'
          say: 'Wie in der Mathematik: erst hoch, dann das Vorzeichen.'
        - call: 'calculate(''2^-1'')'
          expect: '0.5'
          say: 'Nach dem Hoch darf ein Vorzeichen stehen.'
        - call: 'calculate(''(2+1)^2*2'')'
          expect: '18'
          say: 'Hoch bindet stärker als Mal.'
    hint:
      - |
        Schreib die Bäume für `2 ^ 3 ^ 2` und `-2 ^ 2` von Hand auf, so wie sie
        werden sollen: Was hängt tiefer, also was wird zuerst gerechnet? Vergleich mit
        `8 - 3 - 2`: Warum hängt dort der linke Teil tiefer, und was in `expression`
        sorgt dafür?
      - |
        `factor` ruft statt `atom` jetzt `power` auf. `power` holt sich erst ein
        `atom`. Kommt danach ein `^`, nimmt es ihn heraus und ruft für den Rest
        `factor` auf, einmal, nicht in einer Schleife: So hängt der rechte Teil
        tiefer. In `evaluate` kommt `^` dazu, in Ruby `**`.
      - |
        Ein Gerüst:

        ```ruby
        def power(tokens)
            tree = atom(tokens)
            if tokens.first == '^'
                tokens.shift
                tree = … # ein Knoten mit "^", tree und dem nächsten Faktor
            end
            tree
        end
        ```

        Dazu in `factor` `power(tokens)` statt `atom(tokens)`, und in `evaluate`
        ein Fall für `'^'`.
    python:
      prompt: 'Bau `^` in `calculator.py` ein.'
      check:
        type: python
        file: calculator/calculator.py
        cases:
          - call: 'parse(tokenize(''2^3^2''))'
