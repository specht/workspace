      hint:
        - "Zwei Zahlen grenzen den Bereich ein, in dem die gesuchte noch stehen kann: `low = 0` und `high = len(numbers) - 1`. Die Mitte ist `(low + high) // 2`."
        - "Ist `numbers[middle]` zu klein, rückt `low` hinter die Mitte, ist sie zu groß, rückt `high` davor. Solange `low <= high`, ist noch etwas übrig."
      solution: |
        ```python
        def binary_search(numbers, wanted):
            low = 0
            high = len(numbers) - 1
            while low <= high:
                middle = (low + high) // 2
                if numbers[middle] == wanted:
                    return middle
                if numbers[middle] < wanted:
                    low = middle + 1
                else:
                    high = middle - 1
            return None
        ```
