            expect: "1"
          - call: "min_index([1, 2, 3])"
            expect: "0"
            say: "Die kleinste kann auch vorn stehen."
      feedback:
        - when: { same_as: "def min_index(numbers):\n    best = 0\n    for i in range(1, len(numbers)):\n        if numbers[i] <= numbers[best]:\n            best = i\n    return best\n" }
          say: "Bei gleich kleinen zählt die erste. Mit `<=` nimmt dein Code die letzte."
      hint: "Wie die größte Zahl aus den Listen, nur merkst du dir den Index statt der Zahl: `best` fängt bei 0 an, und du vergleichst `numbers[i]` mit `numbers[best]`."
      solution: |
        ```python
        def min_index(numbers):
            best = 0
            for i in range(1, len(numbers)):
                if numbers[i] < numbers[best]:
                    best = i
            return best
        ```
