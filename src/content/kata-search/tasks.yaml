      ```ruby
      def search_steps(numbers, wanted)
        low = 0
        high = numbers.length - 1
        steps = 0
        while low <= high
          steps += 1
          middle = (low + high) / 2
          return steps if numbers[middle] == wanted
          if numbers[middle] < wanted
            low = middle + 1
          else
            high = middle - 1
          end
        end
        steps
      end
