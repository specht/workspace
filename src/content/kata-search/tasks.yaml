          say: "Mit `low < high` hört die Suche auf, wenn noch ein Feld übrig ist, und genau dort kann die Zahl stehen: Bei `[4]` findet dein Code die 4 nicht. Such, solange `low <= high`."
      hint:
        - "Zwei Zahlen grenzen den Bereich ein, in dem die gesuchte noch stehen kann: `low = 0` und `high = numbers.size() - 1`. Die Mitte ist `(low + high) / 2`; Java teilt zwei `int` ganzzahlig."
        - "Ist `numbers.get(middle)` zu klein, rückt `low` hinter die Mitte, ist sie zu groß, rückt `high` davor. Solange `low <= high`, ist noch etwas übrig."
      solution: |
        ```java
        Integer binarySearch(List<Integer> numbers, int wanted) {
            int low = 0;
            int high = numbers.size() - 1;
            while (low <= high) {
                int middle = (low + high) / 2;
                if (numbers.get(middle) == wanted) {
                    return middle;
                }
                if (numbers.get(middle) < wanted) {
                    low = middle + 1;
                } else {
                    high = middle - 1;
                }
            }
            return null;
        }
        ```

