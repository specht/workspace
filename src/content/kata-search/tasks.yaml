          expect: "false"
          say: "Dieselben Zahlen reichen nicht: Jede muss gleich oft vorkommen."
        - call: "is_permutation([], [])"
          expect: "true"
        - call: "is_permutation([1, 2], [1, 2, 3])"
          expect: "false"
        - call: "is_permutation([5, 5], [5, 5])"
          expect: "true"
    feedback:
