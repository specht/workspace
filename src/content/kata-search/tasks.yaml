        int rotationPoint(List<Integer> numbers) {
            int low = 0;
            int high = numbers.size() - 1;
            while (low < high) {
                int middle = (low + high) / 2;
                if (numbers.get(middle) > numbers.get(high)) {
                    low = middle + 1;
                } else {
                    high = middle;
                }
            }
            return low;
        }
