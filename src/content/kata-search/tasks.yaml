      hint: "Deine binäre Suche mit einem Zähler, der in jedem Durchlauf der Schleife um eins wächst."
      solution: |
        ```python
        def search_steps(numbers, wanted):
            low = 0
            high = len(numbers) - 1
            steps = 0
            while low <= high:
                steps += 1
                middle = (low + high) // 2
                if numbers[middle] == wanted:
                    return steps
                if numbers[middle] < wanted:
                    low = middle + 1
                else:
                    high = middle - 1
            return steps
        ```
