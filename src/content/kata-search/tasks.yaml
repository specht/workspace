      - when: { same_as: "def binary_search(numbers, wanted)\n  low = 0\n  high = numbers.length - 1\n  while low < high\n    middle = (low + high) / 2\n    return middle if numbers[middle] == wanted\n    if numbers[middle] < wanted\n      low = middle + 1\n    else\n      high = middle - 1\n    end\n  end\n  nil\nend\n" }
        say: "Mit `low < high` hört die Suche auf, wenn noch ein Feld übrig ist, und genau dort kann die Zahl stehen: Bei `[4]` findet dein Code die 4 nicht. Such, solange `low <= high`."
    hint:
