format: 1
activity: kata-search
tasks:
  - id: linear-search
    title: "Wo steht es?"
    level: 1
    prompt: |
      Schreib eine Funktion `linear_search(items, wanted)`, die den Index zurückgibt, an dem `wanted` zum ersten Mal in der Liste steht, und `nil`, wenn es nicht darin steht: `linear_search([4, 8, 15, 8], 8)` ergibt `1`. Mit einer Schleife, ohne `index`.
    starter: |
      def linear_search(items, wanted)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#index, Array#find_index, Array#rindex]
      cases:
        - call: "linear_search([4, 8, 15, 8], 8)"
          expect: "1"
          say: "Es zählt das erste Mal."
        - call: "linear_search([4, 8, 15], 16)"
          expect: "nil"
        - call: "linear_search([], 1)"
          expect: "nil"
        - call: "linear_search([7], 7)"
          expect: "0"
        - call: "linear_search([1, 2, 3], 3)"
          expect: "2"
          say: "Auch der letzte Index."
    feedback:
      - when: { same_as: "def linear_search(items, wanted)\n  result = nil\n  items.each_with_index do |item, i|\n    result = i if item == wanted\n  end\n  result\nend\n" }
        say: "Dein Code merkt sich das letzte Vorkommen, weil er weitersucht. Beim ersten bist du fertig: `return`."
    hint: "Wie `contains` aus den Listen, nur gibst du den Index zurück. `items.each_with_index do |item, i| … end` gibt dir beides."
    solution: |
      ```ruby
      def linear_search(items, wanted)
        items.each_with_index do |item, i|
          return i if item == wanted
        end
        nil
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `linear_search(items, wanted)`, die den Index zurückgibt, an dem `wanted` zum ersten Mal in der Liste steht, und `None`, wenn es nicht darin steht: `linear_search([4, 8, 15, 8], 8)` ergibt `1`. Mit einer Schleife, ohne `index`.
      starter: |
        def linear_search(items, wanted):
            pass
      check:
        type: function
        language: python
        forbid: [list.index]
        cases:
          - call: "linear_search([4, 8, 15, 8], 8)"
            expect: "1"
            say: "Es zählt das erste Mal."
          - call: "linear_search([4, 8, 15], 16)"
            expect: "None"
          - call: "linear_search([], 1)"
            expect: "None"
          - call: "linear_search([7], 7)"
            expect: "0"
          - call: "linear_search([1, 2, 3], 3)"
            expect: "2"
            say: "Auch der letzte Index."
      feedback:
        - when: { same_as: "def linear_search(items, wanted):\n    result = None\n    for i in range(len(items)):\n        if items[i] == wanted:\n            result = i\n    return result\n" }
          say: "Dein Code merkt sich das letzte Vorkommen, weil er weitersucht. Beim ersten bist du fertig: `return`."
      hint: "Wie `contains` aus den Listen, nur gibst du den Index zurück. `for i in range(len(items)):` zählt die Indizes durch."
      solution: |
        ```python
        def linear_search(items, wanted):
            for i in range(len(items)):
                if items[i] == wanted:
                    return i
            return None
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `linearSearch(items, wanted)`, die den Index zurückgibt, an dem `wanted` zum ersten Mal in der Liste steht, und `null`, wenn es nicht darin steht: `linearSearch([4, 8, 15, 8], 8)` ergibt `1`. Mit einer Schleife, ohne `indexOf` und `findIndex`.
      starter: |
        function linearSearch(items, wanted) {
        }
      check:
        type: function
        language: javascript
        forbid: [Array.prototype.indexOf, Array.prototype.findIndex, Array.prototype.lastIndexOf]
        cases:
          - call: "linearSearch([4, 8, 15, 8], 8)"
            expect: "1"
            say: "Es zählt das erste Mal."
          - call: "linearSearch([4, 8, 15], 16)"
            expect: "null"
          - call: "linearSearch([], 1)"
            expect: "null"
          - call: "linearSearch([7], 7)"
            expect: "0"
          - call: "linearSearch([1, 2, 3], 3)"
            expect: "2"
            say: "Auch der letzte Index."
      feedback:
        - when: { same_as: "function linearSearch(items, wanted) {\n  let result = null;\n  for (let i = 0; i < items.length; i++) {\n    if (items[i] === wanted) {\n      result = i;\n    }\n  }\n  return result;\n}\n" }
          say: "Dein Code merkt sich das letzte Vorkommen, weil er weitersucht. Beim ersten bist du fertig: `return`."
      hint: "Wie `contains` aus den Listen, nur gibst du den Index zurück. `for (let i = 0; i < items.length; i++)` zählt die Indizes durch."
      solution: |
        ```javascript
        function linearSearch(items, wanted) {
          for (let i = 0; i < items.length; i++) {
            if (items[i] === wanted) {
              return i;
            }
          }
          return null;
        }
        ```
    dart:
      prompt: |
        Schreib eine Funktion `int? linearSearch(List<int> items, int wanted)`, die den Index zurückgibt, an dem `wanted` zum ersten Mal in der Liste steht, und `null`, wenn es nicht darin steht: `linearSearch([4, 8, 15, 8], 8)` ergibt `1`. Das `?` in `int?` erlaubt das `null`. Mit einer Schleife, ohne `indexOf`.
      starter: |
        int? linearSearch(List<int> items, int wanted) {
          return -1;
        }
      check:
        type: function
        language: dart
        forbid: [.indexOf, .indexWhere, .lastIndexOf]
        cases:
          - { call: "linearSearch([4, 8, 15, 8], 8)", expect: "1", say: "Es zählt das erste Mal." }
          - { call: "linearSearch([4, 8, 15], 16)", expect: "null" }
          - { call: "linearSearch([], 1)", expect: "null" }
          - { call: "linearSearch([7], 7)", expect: "0" }
          - { call: "linearSearch([1, 2, 3], 3)", expect: "2", say: "Auch der letzte Index." }
      feedback:
        - when: { same_as: "int? linearSearch(List<int> items, int wanted) {\n  int? result;\n  for (var i = 0; i < items.length; i++) {\n    if (items[i] == wanted) {\n      result = i;\n    }\n  }\n  return result;\n}\n" }
          say: "Dein Code merkt sich das letzte Vorkommen, weil er weitersucht. Beim ersten bist du fertig: `return`."
      hint: "Wie `contains` aus den Listen, nur gibst du den Index zurück. `for (var i = 0; i < items.length; i++)` zählt die Indizes durch."
      solution: |
        ```dart
        int? linearSearch(List<int> items, int wanted) {
          for (var i = 0; i < items.length; i++) {
            if (items[i] == wanted) {
              return i;
            }
          }
          return null;
        }
        ```
    java:
      prompt: |
        Schreib eine Methode `Integer linearSearch(List<Integer> items, int wanted)`, die den Index zurückgibt, an dem `wanted` zum ersten Mal in der Liste steht, und `null`, wenn es nicht darin steht: `linearSearch(List.of(4, 8, 15, 8), 8)` ergibt `1`. Ein `Integer` darf `null` sein, ein `int` nicht. Mit einer Schleife, ohne `indexOf`.
      starter: |
        Integer linearSearch(List<Integer> items, int wanted) {
            return -1;
        }
      check:
        type: function
        language: java
        forbid: [.indexOf, .lastIndexOf]
        cases:
          - { call: "linearSearch(List.of(4, 8, 15, 8), 8)", expect: "1", say: "Es zählt das erste Mal." }
          - { call: "linearSearch(List.of(4, 8, 15), 16)", expect: "null" }
          - { call: "linearSearch(List.of(), 1)", expect: "null" }
          - { call: "linearSearch(List.of(7), 7)", expect: "0" }
          - { call: "linearSearch(List.of(1, 2, 3), 3)", expect: "2", say: "Auch der letzte Index." }
      feedback:
        - when: { same_as: "Integer linearSearch(List<Integer> items, int wanted) {\n    Integer result = null;\n    for (int i = 0; i < items.size(); i++) {\n        if (items.get(i) == wanted) {\n            result = i;\n        }\n    }\n    return result;\n}\n" }
          say: "Dein Code merkt sich das letzte Vorkommen, weil er weitersucht. Beim ersten bist du fertig: `return`."
      hint: "Wie `contains` aus den Listen, nur gibst du den Index zurück. `for (int i = 0; i < items.size(); i++)` zählt die Indizes durch."
      solution: |
        ```java
        Integer linearSearch(List<Integer> items, int wanted) {
            for (int i = 0; i < items.size(); i++) {
                if (items.get(i) == wanted) {
                    return i;
                }
            }
            return null;
        }
        ```

  - id: min-index
    title: "Wo steht die kleinste?"
    level: 1
    prompt: |
      Schreib eine Funktion `min_index(numbers)`, die den Index der kleinsten Zahl zurückgibt; kommt sie mehrmals vor, den ersten: `min_index([5, 2, 9, 2])` ergibt `1`. Die Liste ist nie leer. Ohne `min` und `index`.
    starter: |
      def min_index(numbers)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#min, Array#min_by, Array#index, Array#each_with_index, Array#sort]
      cases:
        - call: "min_index([5, 2, 9, 2])"
          expect: "1"
          say: "Kommt die kleinste mehrmals vor, zählt die erste."
        - call: "min_index([7])"
          expect: "0"
        - call: "min_index([3, 1])"
          expect: "1"
        - call: "min_index([-1, -5, 0])"
          expect: "1"
        - call: "min_index([1, 2, 3])"
          expect: "0"
          say: "Die kleinste kann auch vorn stehen."
    feedback:
      - when: { same_as: "def min_index(numbers)\n  best = 0\n  (1...numbers.length).each do |i|\n    best = i if numbers[i] <= numbers[best]\n  end\n  best\nend\n" }
        say: "Bei gleich kleinen zählt die erste. Mit `<=` nimmt dein Code die letzte."
    hint: "Wie die größte Zahl aus den Listen, nur merkst du dir den Index statt der Zahl: `best` fängt bei 0 an, und du vergleichst `numbers[i]` mit `numbers[best]`."
    solution: |
      ```ruby
      def min_index(numbers)
        best = 0
        (1...numbers.length).each do |i|
          best = i if numbers[i] < numbers[best]
        end
        best
      end
      ```
    python:
      starter: |
        def min_index(numbers):
            pass
      check:
        type: function
        language: python
        forbid: [min, list.index, sorted]
