        ```python
        def binary_search(numbers, wanted):
            low = 0
            high = len(numbers) - 1
            while low <= high:
                middle = (low + high) // 2
                if numbers[middle] == wanted:
                    return True
                if numbers[middle] < wanted:
                    low = middle + 1
                else:
                    high = middle - 1
