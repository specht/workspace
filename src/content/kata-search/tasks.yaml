  - id: last-index
    title: "Von hinten gesucht"
    level: 1
    prompt: |
      Schreib eine Funktion `last_index(items, wanted)`, die den Index zurückgibt, an dem `wanted` zum letzten Mal steht, und `nil`, wenn es nicht darin steht: `last_index([4, 8, 15, 8], 8)` ergibt `3`. Such von hinten, dann bist du beim ersten Fund fertig. Ohne `rindex`.
    starter: |
      def last_index(items, wanted)
      end
    check:
      type: function
      language: ruby
      forbid: [Array#rindex, Array#index, Array#find_index, Array#reverse]
      cases:
        - call: "last_index([4, 8, 15, 8], 8)"
          expect: "3"
        - call: "last_index([4, 8, 15], 16)"
          expect: "nil"
        - call: "last_index([], 1)"
          expect: "nil"
        - call: "last_index([7, 7, 7], 7)"
          expect: "2"
        - call: "last_index([1, 2, 3], 1)"
          expect: "0"
          say: "Auch der Index 0, wenn es nur vorn steht."
    feedback:
      - when: { same_as: "def last_index(items, wanted)\n  i = items.length - 1\n  while i > 0\n    return i if items[i] == wanted\n    i -= 1\n  end\n  nil\nend\n" }
        say: "Mit `i > 0` kommt der Index 0 nie dran: `[1, 2, 3]` findet die 1 nicht."
    hint: "Zähl vom letzten Index, `items.length - 1`, herunter bis 0, wie bei der Liste rückwärts."
    solution: |
      ```ruby
      def last_index(items, wanted)
        i = items.length - 1
        while i >= 0
          return i if items[i] == wanted
          i -= 1
        end
        nil
      end
      ```
    python:
      prompt: |
        Schreib eine Funktion `last_index(items, wanted)`, die den Index zurückgibt, an dem `wanted` zum letzten Mal steht, und `None`, wenn es nicht darin steht: `last_index([4, 8, 15, 8], 8)` ergibt `3`. Such von hinten, dann bist du beim ersten Fund fertig. Ohne `index`.
      starter: |
        def last_index(items, wanted):
            pass
      check:
        type: function
        language: python
        forbid: [list.index, reversed]
        cases:
          - call: "last_index([4, 8, 15, 8], 8)"
            expect: "3"
          - call: "last_index([4, 8, 15], 16)"
            expect: "None"
          - call: "last_index([], 1)"
            expect: "None"
          - call: "last_index([7, 7, 7], 7)"
            expect: "2"
          - call: "last_index([1, 2, 3], 1)"
            expect: "0"
            say: "Auch der Index 0, wenn es nur vorn steht."
      feedback:
        - when: { same_as: "def last_index(items, wanted):\n    for i in range(len(items) - 1, 0, -1):\n        if items[i] == wanted:\n            return i\n    return None\n" }
          say: "`range(len(items) - 1, 0, -1)` hört vor 0 auf: `[1, 2, 3]` findet die 1 nicht."
      hint: "Zähl vom letzten Index herunter bis 0: `range(len(items) - 1, -1, -1)`."
      solution: |
        ```python
        def last_index(items, wanted):
            for i in range(len(items) - 1, -1, -1):
                if items[i] == wanted:
                    return i
            return None
        ```
    javascript:
      prompt: |
        Schreib eine Funktion `lastIndex(items, wanted)`, die den Index zurückgibt, an dem `wanted` zum letzten Mal steht, und `null`, wenn es nicht darin steht: `lastIndex([4, 8, 15, 8], 8)` ergibt `3`. Such von hinten, dann bist du beim ersten Fund fertig. Ohne `lastIndexOf`.
