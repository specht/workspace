        ```javascript
        function binarySearch(numbers, wanted) {
          let low = 0;
          let high = numbers.length - 1;
          while (low <= high) {
            const middle = Math.floor((low + high) / 2);
            if (numbers[middle] === wanted) {
              return middle;
            }
            if (numbers[middle] < wanted) {
              low = middle + 1;
            } else {
              high = middle - 1;
            }
          }
          return null;
        }
        ```
