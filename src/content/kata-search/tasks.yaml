    hint: "Für jede Zahl aus `queries` eine binäre Suche in `numbers`. Deine Funktion von vorhin darfst du hier hineinschreiben und aufrufen."
    solution: |
      ```ruby
      def count_found(numbers, queries)
        queries.count do |wanted|
          low = 0
          high = numbers.length - 1
          found = false
          while low <= high && !found
            middle = (low + high) / 2
            if numbers[middle] == wanted
              found = true
            elsif numbers[middle] < wanted
              low = middle + 1
            else
              high = middle - 1
            end
          end
          found
        end
      end
      ```
