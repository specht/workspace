    solution: |
      ```ruby
      def binary_search(numbers, wanted)
        low = 0
        high = numbers.length - 1
        while low <= high
          middle = (low + high) / 2
          return middle if numbers[middle] == wanted
          if numbers[middle] < wanted
            low = middle + 1
          else
            high = middle - 1
          end
        end
        nil
      end
      ```
