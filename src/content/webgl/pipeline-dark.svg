  <line x1="292.0" y1="128.0" x2="292" y2="176.8" stroke="#e3e6ea" stroke-width="1.5" marker-end="url(#arrow-mid)"/>
  <line x1="210.0" y1="230.0" x2="175.2" y2="230" stroke="#e3e6ea" stroke-width="1.5" marker-end="url(#arrow-mid)"/>
