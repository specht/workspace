<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1054 136" width="1054" height="136" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <style id='embedded-fonts'>@font-face{font-family:'IBM Plex Sans';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <!-- Die Pipeline in einer Reihe: Ecken, Vertex-Shader, Rasterung, Fragment-Shader, Z-Buffer, Bild; die beiden Shader blau.
