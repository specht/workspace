<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 450 320" width="450" height="320" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Die Pipeline in zwei Reihen: Ecken, Vertex-Shader, Rasterung, dann darunter von rechts nach links Fragment-Shader, Z-Buffer, Bild; die beiden Shader blau.
       Gemacht von bilder/diagramme.py; als Bild, hell und dunkel:
       src/scripts/render-svg.rb src/content/webgl/pipeline.svg 900 -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect width="450" height="320" fill="#ffffff"/>
  <rect x="10" y="34" width="126" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
  <text x="73.0" y="66.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Ecken</text>
  <text x="73.0" y="90.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">Zahlen aus</text>
  <text x="73.0" y="107.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">JavaScript</text>
  <rect x="166" y="34" width="126" height="92" rx="8" fill="#eef3fb" stroke="#2b5fb4" stroke-width="2.2"/>
  <text x="229.0" y="66.0" font-size="15" fill="#2b5fb4" text-anchor="middle" font-weight="bold">Vertex-Shader</text>
  <text x="229.0" y="90.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">rechnet jede</text>
  <text x="229.0" y="107.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">Ecke um</text>
  <rect x="322" y="34" width="126" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
  <text x="385.0" y="66.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Rasterung</text>
  <text x="385.0" y="90.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">findet die Pixel</text>
  <text x="385.0" y="107.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">jedes Dreiecks</text>
  <rect x="322" y="196" width="126" height="92" rx="8" fill="#eef3fb" stroke="#2b5fb4" stroke-width="2.2"/>
  <text x="385.0" y="228.0" font-size="15" fill="#2b5fb4" text-anchor="middle" font-weight="bold">Fragment-Shader</text>
  <text x="385.0" y="252.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">färbt jedes</text>
  <text x="385.0" y="269.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">Pixel</text>
  <rect x="166" y="196" width="126" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
  <text x="229.0" y="228.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Z-Buffer</text>
  <text x="229.0" y="252.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">nur das Nächste</text>
  <text x="229.0" y="269.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">bleibt</text>
  <rect x="10" y="196" width="126" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
  <text x="73.0" y="248.0" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Bild</text>
  <line x1="138.0" y1="80.0" x2="163.0" y2="80.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="294.0" y1="80.0" x2="319.0" y2="80.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="385.0" y1="128.0" x2="385.0" y2="193.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320.0" y1="242.0" x2="295.0" y2="242.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="164.0" y1="242.0" x2="139.0" y2="242.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="229.0" y="22.0" font-size="14" fill="#2b5fb4" text-anchor="middle" font-weight="normal">schreibst du</text>
  <text x="385.0" y="310.0" font-size="14" fill="#2b5fb4" text-anchor="middle" font-weight="normal">schreibst du</text>
</svg>
