<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 434" width="380" height="434" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
  <!-- Die Pipeline in drei Reihen zu zwei Kästen: Ecken, Vertex-Shader, darunter von rechts nach links Rasterung, Fragment-Shader, darunter Z-Buffer, Bild; die beiden Shader blau.
       Gemacht von bilder/diagramme.py; als Bild, hell und dunkel:
       src/scripts/render-svg.rb src/content/webgl/pipeline.svg 760 -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5fb4"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="380" height="434" fill="#ffffff"/>
  <rect x="8" y="34" width="160" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
  <text x="88.0" y="66.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Ecken</text>
  <text x="88.0" y="90.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">Zahlen aus</text>
  <text x="88.0" y="107.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">JavaScript</text>
  <rect x="212" y="34" width="160" height="92" rx="8" fill="#eef3fb" stroke="#2b5fb4" stroke-width="2.2"/>
  <text x="292.0" y="66.0" font-size="15" fill="#2b5fb4" text-anchor="middle" font-weight="bold">Vertex-Shader</text>
  <text x="292.0" y="90.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">rechnet jede</text>
  <text x="292.0" y="107.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">Ecke um</text>
  <text x="292.0" y="22.0" font-size="14" fill="#2b5fb4" text-anchor="middle" font-weight="normal">schreibst du</text>
  <rect x="212" y="184" width="160" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
  <text x="292.0" y="216.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Rasterung</text>
  <text x="292.0" y="240.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">findet die Pixel</text>
  <text x="292.0" y="257.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">jedes Dreiecks</text>
  <rect x="8" y="184" width="160" height="92" rx="8" fill="#eef3fb" stroke="#2b5fb4" stroke-width="2.2"/>
  <text x="88.0" y="216.0" font-size="15" fill="#2b5fb4" text-anchor="middle" font-weight="bold">Fragment-Shader</text>
  <text x="88.0" y="240.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">färbt jedes</text>
  <text x="88.0" y="257.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">Pixel</text>
  <text x="88.0" y="172.0" font-size="14" fill="#2b5fb4" text-anchor="middle" font-weight="normal">schreibst du</text>
  <rect x="8" y="334" width="160" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
  <text x="88.0" y="366.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Z-Buffer</text>
  <text x="88.0" y="390.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">nur das Nächste</text>
  <text x="88.0" y="407.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal">bleibt</text>
  <rect x="212" y="334" width="160" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
  <text x="292.0" y="386.0" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Bild</text>
  <line x1="170.0" y1="80.0" x2="209.0" y2="80.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="292.0" y1="128.0" x2="292.0" y2="181.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210.0" y1="230.0" x2="171.0" y2="230.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="88.0" y1="278.0" x2="88.0" y2="331.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170.0" y1="380.0" x2="209.0" y2="380.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
