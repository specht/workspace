  <line x1="692.0" y1="80.0" x2="717.0" y2="80.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="870.0" y1="80.0" x2="895.0" y2="80.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
