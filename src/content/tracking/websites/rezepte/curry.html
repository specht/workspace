<!-- Der Schnipsel einer Werbefirma, wie viele Websites ihn einbauen: Er lädt
     ein unsichtbares Bild von ihrem Server und sagt dabei, welche Seite das ist
     und worum es auf ihr geht. Ihr Server ist dein Tracker auf Port 8000. -->
<script>
  const tracker = location.origin.replace(/-\d+\./, '-8000.');
  const keywords = document.querySelector('meta[name="keywords"]').content;
  new Image().src = tracker + '/pixel.gif?page=' + encodeURIComponent(location.host + location.pathname) +
    '&keywords=' + encodeURIComponent(keywords);
</script>
