# Sources for the claims in the history boxes of the activities
# (<div class='history' id='history-…'>), keyed by the box's id without
# »history-«; the format of reference/personen/sources.yaml. Shown on the
# development page /person-sources (src/ruby/include/person_sources.rb);
# history_sources_test.rb wants a source for every sentence.

let-it-be:
  - text: Das Bandecho auf der Hi-Hat von »Let It Be«, 1970
    sources:
      - url: https://en.wikipedia.org/wiki/Let_It_Be_(song)
        quote: "On 26 March 1970, Phil Spector remixed the song for the Let It Be album."
  - text: Phil Spector mischte »Let It Be« von den Beatles für das Album neu und gab Ringo Starrs Hi-Hat in der zweiten Strophe ein Bandecho, so viel, dass sie fast alle Aufmerksamkeit auf sich zieht
    sources:
      - url: https://en.wikipedia.org/wiki/Let_It_Be_(song)
        quote: "Starr's drumming was augmented by Spector's \"tape-delay-effect\" to his hi-hats during the song's second verse"
      - url: https://beatlesanswers.org/songs/let-it-be
        quote: "adding such a degree of tape echo to Ringo's hi-hat that this instrument becomes virtually the sole focus of attention"
  - text: Starr gefiel Spectors Fassung nicht
    sources:
      - url: https://en.wikipedia.org/wiki/Let_It_Be_(song)
        quote: "Ringo Starr disliked Phil Spector's version"
  - text: 2003 erschien auf »Let It Be... Naked« eine Fassung ohne Spectors Zutaten, mit Starrs einfachem Schlagzeug
    sources:
      - url: https://en.wikipedia.org/wiki/Let_It_Be_(song)
        quote: "Still another version of the song appeared on the Let It Be... Naked album in 2003. … features his original \"stripped-down-approach\" drumming"
  - text: Hör dir die zweite Strophe in beiden Fassungen an
    none: eine Einladung zum Anhören, die Links sind die offiziellen Aufnahmen auf dem Kanal »The Beatles - Topic«

believe:
  - text: Cher, »Believe«, 1998
    sources:
      - url: https://en.wikipedia.org/wiki/Believe_(Cher_song)
        quote: "\"Believe\" was released as the lead single from Cher's 22nd studio album, Believe (1998), on October 19, 1998."
  - text: Ein Jahr zuvor brachte die Firma Antares Auto-Tune heraus
    sources:
      - url: https://en.wikipedia.org/wiki/Auto-Tune
        quote: "released on September 19, 1997, by the American company Antares Audio Technologies"
  - text: Erfunden hatte es Andy Hildebrand, der für Exxon aus den Echos von Schall im Boden herausgelesen hatte, wo man nach Öl bohren soll, mit denselben Verfahren, auch der Autokorrelation
    sources:
      - url: https://priceonomics.com/the-inventor-of-auto-tune/
        quote: "Upon graduating, he was plucked up by oil conglomerate Exxon, and tasked with using seismic data to pinpoint drill locations. … you emit sounds on the surface of the Earth (or in the ocean), listen to reverberations that come up … he could utilize some of the very same processing methods he'd used in the oil industry"
      - url: https://en.wikipedia.org/wiki/Auto-Tune
        quote: "Hildebrand's method for detecting pitch involved autocorrelation"
  - text: »Believe« war die erste Aufnahme, die Auto-Tune hörbar als Effekt nutzt
    sources:
      - url: https://en.wikipedia.org/wiki/Auto-Tune
        quote: "was the first commercial recording to use AutoTune as a stylistic effect"
  - text: Die Produzenten stellten es so extrem ein, dass Chers Stimme sofort von Ton zu Ton springt
    sources:
      - url: https://en.wikipedia.org/wiki/Auto-Tune
        quote: "the \"Believe\" producers used extreme settings to create unnaturally rapid corrections"
  - text: Der Effekt wurde als »Cher-Effekt« bekannt
    sources:
      - url: https://en.wikipedia.org/wiki/Auto-Tune
        quote: "used AutoTune to deliberately distort vocals, a technique that became known as the \"Cher effect\""
  - text: Um ihren Trick zu schützen, behaupteten die Produzenten zuerst, es sei ein Vocoder gewesen
    sources:
      - url: https://en.wikipedia.org/wiki/Auto-Tune
        quote: "In an attempt to protect their method, the producers initially claimed the effect was achieved with a vocoder."
  - text: Hör dir »Believe« auf YouTube an und achte darauf, wo Chers Stimme von Ton zu Ton springt, statt zu gleiten
    none: eine Einladung zum Anhören, der Link ist das offizielle Video auf Chers Kanal

loudness-war:
  - text: Der Loudness War, 2008
    sources:
      - url: https://en.wikipedia.org/wiki/Loudness_war
        quote: "a trend of increasing audio levels in recorded music"
    note: 2008 ist das Jahr von »Death Magnetic«, des Beispiels im Kasten; der Trend selbst ist älter
  - text: Lange wurde Musik immer lauter aufgenommen
    sources:
      - url: https://en.wikipedia.org/wiki/Loudness_war
        quote: "a trend of increasing audio levels in recorded music"
  - text: Ist der höchste Wert erreicht, den ein Sample auf einer CD haben kann, geht es nur noch mit einem Compressor weiter, mit immer höherer Ratio
    sources:
      - url: https://en.wikipedia.org/wiki/Loudness_war
        quote: "Once the maximum amplitude of a CD is reached … Engineers can apply an increasingly high ratio of compression to a recording"
  - text: Metallicas Album »Death Magnetic« ist auf der CD so laut, dass die Spitzen über den höchsten Wert hinausgehen und abgeschnitten werden, was verzerrt klingt
    sources:
      - url: https://en.wikipedia.org/wiki/Loudness_war
        quote: "The CD version of the album has a high average loudness that pushes peaks beyond the point of digital clipping"
  - text: Dieselben Lieder im Spiel »Guitar Hero« haben viel mehr Abstand zwischen leise und laut und sind weniger abgeschnitten
    sources:
      - url: https://en.wikipedia.org/wiki/Loudness_war
        quote: "The Guitar Hero version of the album songs exhibit much higher dynamic range and less clipping"
  - text: Heute machen die meisten großen Streamingdienste jedes Lied von sich aus gleich laut, Spotify und YouTube auf −14 LUFS, ein Maß dafür, wie laut Menschen einen Klang hören
    sources:
      - url: https://en.wikipedia.org/wiki/Loudness_war
        quote: "most major streaming services began normalizing audio by default, which can be turned off if not wanted. … Spotify −14 LUFS … YouTube −14 LUFS"
  - text: aus »Death Magnetic« auf YouTube an und achte darauf, wie die lauten Stellen klingen
    sources:
      - url: https://en.wikipedia.org/wiki/The_Day_That_Never_Comes
        quote: "the lead single from their ninth studio album, Death Magnetic"
    note: eine Einladung zum Anhören; der Link ist das offizielle Video auf Metallicas Kanal

vocoder:
  - text: Der Vocoder, 1937
    sources:
      - url: https://en.wikipedia.org/wiki/Vocoder
        quote: "The vocoder was invented in 1937 by Homer Dudley at Bell Labs as a means of synthesizing human speech."
  - text: Homer Dudley erfand ihn bei den Bell Labs, um Sprache mit weniger Bandbreite durch Telefonleitungen zu schicken
    sources:
      - url: https://en.wikipedia.org/wiki/Vocoder
        quote: "The vocoder was invented in 1937 by Homer Dudley at Bell Labs … used as a voice codec for telecommunications … to conserve bandwidth in transmission"
  - text: Statt der Welle gehen nur die Stärken der Bänder durch die Leitung, und am anderen Ende macht ein Vocoder daraus wieder Sprache
    none: wie ein Vocoder als Codec arbeitet, das Verfahren des Abschnitts
  - text: Im Zweiten Weltkrieg verschlüsselte das System SIGSALY damit Telefongespräche
    sources:
      - url: https://en.wikipedia.org/wiki/Vocoder
        quote: "SIGSALY was used for encrypted voice communications during World War II."
  - text: 1939 zeigten die Bell Labs auf der Weltausstellung in New York den Voder, der Sprache aus zehn Bändern erzeugte, gespielt mit Tasten
    sources:
      - url: https://en.wikipedia.org/wiki/Vocoder
        quote: "was introduced to the public at the AT&T building at the 1939–1940 New York World's Fair … 10 bands of resonator filters"
      - url: https://en.wikipedia.org/wiki/Voder
        quote: "The Voder … was operated by a keyboard"
  - text: Kraftwerk nahmen in den Siebzigern für ihre Alben »Ralf & Florian« und »Autobahn« einen eigens gebauten Vocoder, und Florian Schneider sang auf der Bühne durch ihn
    sources:
      - url: https://en.wikipedia.org/wiki/Kraftwerk
        quote: "Kraftwerk used a custom-built vocoder on its albums Ralf & Florian and Autobahn … Schneider processing his voice with a vocoder live"
  - text: vom Electric Light Orchestra auf YouTube an, 1977
    sources:
      - url: https://en.wikipedia.org/wiki/Mr._Blue_Sky
        quote: "The song features a heavily vocoded voice singing the phrase \"Mr. Blue Sky\""
    note: das Album »Out of the Blue« erschien 1977; der Link ist das offizielle Video auf ELOVEVO, in Deutschland abspielbar (geprüft)
  - text: Wo singt eine Stimme durch den Vocoder, und was singt sie
    none: eine Frage zum Anhören
  - text: Imogen Heap sang »Hide and Seek« 2004 durch die Einstellung »Vocoder« eines Harmonizers, als ihr Rechner keinen Strom mehr hatte
    sources:
      - url: https://en.wikipedia.org/wiki/Hide_and_Seek_(Imogen_Heap_song)
        quote: "\"Hide and Seek\" was recorded during a late-night studio session, where Heap decided to record her voice using the \"vocoder\" setting on a DigiTech Vocalist Workstation harmonizer after her computer lost power."
    note: aufgenommen 2004 nach dem Kasten der Wikipedia (»Recorded 2004«), erschienen am 19. Mai 2005
  - text: Welche Töne ihre Stimme singt, bestimmte ein Keyboard
    sources:
      - url: https://en.wikipedia.org/wiki/Hide_and_Seek_(Imogen_Heap_song)
        quote: "Heap uses a keyboard-controlled digital harmonizer (similar to a vocoder) on the song to generate distorted harmonies of her voice"
  - text: Der Harmonizer setzt die Stimme auf jeden Ton, den sie dort spielte, so dass sie mehrstimmig mit sich selbst singt
    sources:
      - url: https://en.wikipedia.org/wiki/Hide_and_Seek_(Imogen_Heap_song)
        quote: "Heap uses a keyboard-controlled digital harmonizer (similar to a vocoder) on the song to generate distorted harmonies of her voice, lending the song its altered a cappella sound."
  - text: auf YouTube an
    none: der Link
    note: das offizielle Video auf ImogenHeapVEVO (oEmbed); ob es in Deutschland abspielbar ist, war am 11. November 2026 von hier nicht zu prüfen (YouTube antwortete mit einem Captcha)
  - text: Wo wechseln die Töne, während sie ein Wort singt
    none: eine Frage zum Anhören

sped-up:
  - text: Nightcore, »sped up« und »slowed«, 2001
    sources:
      - url: https://en.wikipedia.org/wiki/Nightcore
        quote: "The term \"nightcore\" was first used in 2001 as the name for a school project"
  - text: »Nightcore« war der Name eines Schulprojekts
    sources:
      - url: https://en.wikipedia.org/wiki/Nightcore
        quote: "The term \"nightcore\" was first used in 2001 as the name for a school project"
  - text: Lieder, etwa 35 % schneller abgespielt, und damit höher
    sources:
      - url: https://en.wikipedia.org/wiki/Nightcore
        quote: "speeds up its source material by approximately 35%, which also raises the pitch"
  - text: In den frühen 2020er-Jahren wurde das durch TikTok wieder beliebt
    sources:
      - url: https://en.wikipedia.org/wiki/Nightcore
        quote: "Nightcore saw a general resurgence in popularity in the early 2020s due to TikTok"
  - text: Bei FIFTY FIFTYs »Cupid« wurde 2023 zuerst die schnellere Fassung eines Fans auf TikTok bekannt, dann brachte die Plattenfirma eine eigene heraus
    sources:
      - url: https://en.wikipedia.org/wiki/Cupid_(Fifty_Fifty_song)
        quote: "a user-generated sped-up version became popular on TikTok due to a dance challenge started by the group … an official sped-up rendition of \"Twin\" version was released on various streaming platforms"
  - text: 'Den umgekehrten Weg geht »slowed and reverb«: ein Lied langsamer abgespielt, also tiefer, und mit Hall dazu, beliebt auf YouTube und TikTok'
    sources:
      - url: https://en.wikipedia.org/wiki/Slowed_and_reverb
        quote: "slowing down and adding reverb to a previously existing song … The style became especially popular on YouTube. … Remixes using the technique also became popular on the video-sharing service TikTok."
  - text: Hör dir »Cupid« in drei Fassungen an
    none: eine Einladung zum Anhören; die Links sind die offiziellen Aufnahmen auf »FIFTY FIFTY - Topic«
  - text: Achte auf die Stimmen
    none: eine Frage zum Anhören

songify:
  - text: Auto-Tune the News, 2009
    sources:
      - url: https://en.wikipedia.org/wiki/The_Gregory_Brothers
        quote: "National television networks featured the Gregory Brothers' early political satires in the spring of 2009"
  - text: Die Gregory Brothers machten auf ihrem YouTube-Kanal »schmoyoho« aus Aufnahmen von Politikern, Nachrichtensprechern und Kommentatoren Lieder
    sources:
      - url: https://en.wikipedia.org/wiki/The_Gregory_Brothers
        quote: "using the YouTube username 'schmoyoho' … recorded voices of politicians, news anchors, and political pundits were digitally manipulated to conform to a melody"
  - text: Sie veränderten die Stimmen am Rechner, bis sie einer Melodie folgten
    sources:
      - url: https://en.wikipedia.org/wiki/The_Gregory_Brothers
        quote: "recorded voices of politicians, news anchors, and political pundits were digitally manipulated to conform to a melody"
  - text: Ab 2011 hieß die Reihe »Songify the News«
    sources:
      - url: https://en.wikipedia.org/wiki/The_Gregory_Brothers
        quote: "rebranded in 2011 as Songify the News"
  - text: Hör dir zwei ihrer Lieder auf YouTube an
    sources:
      - url: https://en.wikipedia.org/wiki/Double_Rainbow_(viral_video)
        quote: "the Gregory Brothers auto-tuned the video under the name \"Double Rainbow Song\""
      - url: https://knowyourmeme.com/videos/10446-eharmony-video-bio
        quote: "Songify This - CAN'T HUG EVERY CAT -- a song about loving cats"
    note: beide Links sind Uploads auf dem Kanal »schmoyoho« (YouTube oEmbed geprüft)
  - text: Woran hörst du, wo sie Sätze wiederholt oder umgestellt haben
    none: eine Frage zum Anhören

around-the-world:
  - text: Daft Punk, »Around the World«, 1997
    sources:
      - url: https://en.wikipedia.org/wiki/Around_the_World_(Daft_Punk_song)
        quote: "The song was written and released on April 1997 by Virgin as the second single from their debut studio album, Homework (1997)."
  - text: Das Lied lebt von einer gleichmäßigen Basslinie und einer Roboterstimme, die immer wieder »Around the world« singt
    sources:
      - url: https://en.wikipedia.org/wiki/Around_the_World_(Daft_Punk_song)
        quote: "The key hook is a steady bassline and a robotic voice singing"
  - text: Im Video von Michel Gondry tanzen fünf Gruppen auf einer Bühne, die eine Schallplatte darstellt, und jede Gruppe ist ein Instrument
    sources:
      - url: https://en.wikipedia.org/wiki/Around_the_World_(Daft_Punk_song)
        quote: "Michel Gondry's music video for the song features five groups of characters on a platform representing a vinyl record."
  - text: die Roboter die Stimme, die Sportler die Bassgitarre, die auf und ab steigt, die Discotänzerinnen das hohe Keyboard, die Skelette die Gitarre und die Mumien den Drumcomputer
    sources:
      - url: https://en.wikipedia.org/wiki/Around_the_World_(Daft_Punk_song)
        quote: "According to Gondry's notes, the robots represent the vocals. … the athletes symbolizes the ascending/descending bass guitar. … The femininity of the disco girls represents the high-pitched keyboard. … The skeletons dance to the guitar, and the mummies represent the drum machine."
  - text: So sieht man, was ein EQ trennt
    none: der Bezug zum Abschnitt
  - text: Schau dir das Video auf YouTube an und folge einer Gruppe
    none: eine Einladung zum Ansehen; der Link ist das offizielle Video auf dem Kanal von Daft Punk

drop:
  - text: Martin Garrix, »Animals«, 2013
    sources:
      - url: https://en.wikipedia.org/wiki/Animals_(Martin_Garrix_song)
        quote: "released as a digital download on 17 June 2013 on iTunes"
  - text: Der Breakdown ist zuerst gefiltert, damit die Energie sinkt; im Build-up steigert sich alles bis zu einem letzten Takt fast ohne Musik, dann setzt der Drop mit einer gewaltigen Kick-Drum ein
    sources:
      - url: https://www.musicradar.com/tuition/tech/anatomy-of-a-hit-martin-garrix-animals-636619
        quote: "it's initially filtered to lower the energy level … leading into a final one-bar gap with a practically naked spoken vocal sample … a monstrous 4/4 kick"
    note: die Worte stammen aus dem Auszug der Suchmaschine; der Artikel selbst ließ sich nicht abrufen
  - text: Am Ende nimmt Garrix den Bass noch einmal heraus, als Gegensatz
    sources:
      - url: https://www.musicradar.com/tuition/tech/anatomy-of-a-hit-martin-garrix-animals-636619
        quote: "Garrix again filters the bass from the mix to strip away weight and provide contrast"
    note: aus dem Auszug der Suchmaschine
  - text: Mit »Animals« wurde er der jüngste Produzent, dessen Lied auf Platz eins des Musikladens Beatport kam
    sources:
      - url: https://en.wikipedia.org/wiki/Animals_(Martin_Garrix_song)
        quote: "the youngest producer to ever have a song reach number one on the electronic music store Beatport"
  - text: Wann wird die Musik dünner, und wie wirkt der Drop danach
    none: eine Frage zum Anhören; der Link ist das offizielle Video auf dem Kanal STMPD RCRDS

# ---- Office: word processing (docs/plan-textverarbeitung.md)

schreibmaschine:
  - text: Von der Schreibmaschine zur Textverarbeitung
    none: 'die Überschrift des Kastens'
  - text: An einer Schreibmaschine schob ein Hebel am Ende jeder Zeile die Walze
    sources:
      - url: https://en.wikipedia.org/wiki/Carriage_return
        quote: "The term originally described a lever on mechanical typewriters … the lever returned the moving carriage … and usually advanced the paper (zusammengefasst)"
  - text: Daher kommt das Zeichen ↵, und daher tippten viele zwei Leerzeichen nach dem Punkt
    sources:
      - url: https://en.wikipedia.org/wiki/Carriage_return
        quote: "The ↵ symbol was later adopted to represent the combined carriage return and line feed action (zusammengefasst)"
      - url: https://en.wikipedia.org/wiki/Sentence_spacing
        quote: '"the majority of mechanical typewriters, including all the widely distributed models, remained monospaced"; "it was created for monospaced fonts of the typewriter and is no longer needed with modern proportional fonts"'
  - text: 1955 schlug Ulrich Steinhilper
    sources:
      - url: https://de.wikipedia.org/wiki/Ulrich_Steinhilper
        quote: '"1953 kam er zu IBM-Deutschland und wurde dort Verkäufer für elektrische Schreibmaschinen."; "1955 hatte er die Idee zur elektronischen Textverarbeitung als Pendant zur damals schon gebräuchlichen Datenverarbeitung."; "1972 verlieh IBM Steinhilper den „World Achievement Award“"'
  - text: Die Amerikanerin Evelyn Berezin baute 1968 die »Data Secretary«
    sources:
      - url: https://en.wikipedia.org/wiki/Evelyn_Berezin
        quote: '"created the first computerized word processor and dubbed it the Data Secretary"; "Her device was similar size to that of a small refrigerator at the time."; "stored in document form on a tape drive"'

libreoffice:
  - text: Woher LibreOffice kommt
    none: 'die Überschrift des Kastens'
  - text: 1985 gründete Marco Börries mit 16 Jahren
    sources:
      - url: https://de.wikipedia.org/wiki/Star_Division
        quote: "Die Hamburger Softwarefirma Star Division wurde im Jahr 1985 vom 16-jährigen Marco Börries in Lüneburg gegründet."
      - url: https://de.wikipedia.org/wiki/Marco_B%C3%B6rries
        quote: "Inspiriert von einem während seiner Schulzeit am Gymnasium Oedeme stattfindenden Schüleraustausch im Silicon Valley"
  - text: Ihr Textprogramm StarWriter lief bald auch auf den Heimcomputern von Schneider
    sources:
      - url: https://en.wikipedia.org/wiki/StarOffice
        quote: '"StarWriter 1.0 was written by Marco Börries in 1985 for the Zilog Z80."; "It was later ported to the Amstrad CPC (marketed by Schneider in Germany) under CP/M."'
  - text: 1999 kaufte die Firma Sun StarOffice
    sources:
      - url: https://en.wikipedia.org/wiki/StarOffice
        quote: "Sun Microsystems acquired the company, copyright and trademark of StarOffice in 1999 for US$73.5 million, which released the source code the following year as a free and open source office suite called OpenOffice.org"
  - text: 2010 machten Entwicklerinnen und Entwickler daraus LibreOffice
    sources:
      - url: https://en.wikipedia.org/wiki/The_Document_Foundation
        quote: '"Established in 2010 by members of the OpenOffice.org community"; "is incorporated as a Stiftung (foundation) under German law"; "the foundation was finally incorporated on 17 February 2012" (Sitz: Berlin)'
  - text: LibreOffice ist freie Software
    sources:
      - url: https://en.wikipedia.org/wiki/The_Document_Foundation
        quote: "a free and open-source office suite"

bravo:
  - text: Schrift auf dem Bildschirm, 1974
    none: 'die Überschrift des Kastens'
  - text: Lange zeigte ein Bildschirm nur eine Schrift in einer Größe
    none: 'die Lage vor Bravo, die der nächste Satz belegt (»multi-font capability« war das Neue)'
  - text: Bei Xerox PARC in Kalifornien schrieben Butler Lampson, Charles Simonyi
    sources:
      - url: https://en.wikipedia.org/wiki/Bravo_(editor)
        quote: '"Bravo was the first WYSIWYG document preparation program."; "It was produced at Xerox PARC by Butler Lampson, Charles Simonyi and colleagues"; "became operational on September 14, 1974."; "It provided multi-font capability using the bitmap displays on the Xerox Alto personal computer."'
  - text: Heute heißt das WYSIWYG
    sources:
      - url: https://en.wikipedia.org/wiki/WYSIWYG
        quote: "WYSIWYG (\"what you see is what you get\")"

trennmuster:
  - text: Wie ein Programm Wörter trennt
    none: 'die Überschrift des Kastens'
  - text: Für jedes Wort im Wörterbuch nachzusehen
    none: 'die Begründung für Muster, die der Kasten danach erklärt'
  - text: Für das Satzprogramm TeX von Donald Knuth erfand sein Doktorand Frank Liang 1983
    sources:
      - url: https://www.tug.org/docs/liang/liang-thesis.pdf
        quote: '"Word Hy-phen-a-tion by Com-put-er", Franklin Mark Liang, Report No. STAN-CS-83-977, August 1983: "an improved word hyphenation algorithm for the TeX82 typesetting system … based on the idea of hyphenating and inhibiting patterns"; "greatly indebted to my adviser, Donald Knuth"'
      - url: https://searchworks.stanford.edu/view/1071255
        quote: '"Knuth, Donald E. primary advisor"; "Thesis Ph.D. Stanford University 1983"'
  - text: Aus ihnen rechnet das Programm die Trennstellen jedes Worts aus
    sources:
      - url: https://www.tug.org/docs/liang/liang-thesis.pdf
        quote: '"these patterns find 89% of the hyphens in a pocket dictionary word list, with essentially no error" (die Muster gelten für Buchstabenfolgen, nicht für einzelne Wörter)'
  - text: Die Silbentrennung von LibreOffice benutzt Muster
    sources:
      - url: https://github.com/hunspell/hyphen
        quote: '"Hyphen - hyphenation library to use converted TeX hyphenation patterns"; "Used by LibreOffice, Scribus and OpenOffice.org"'

pdf:
  - text: Das PDF, 1993
    none: 'die Überschrift des Kastens'
  - text: Die Firma Adobe stellte das Portable Document Format 1993 vor
    sources:
      - url: https://en.wikipedia.org/wiki/PDF
        quote: "developed by Adobe in 1993 to present documents, including text formatting and images, in a manner independent of application software, hardware, and operating systems"
  - text: Seit 2008 ist es eine offene Norm, ISO 32000
    sources:
      - url: https://en.wikipedia.org/wiki/PDF
        quote: '"PDF was standardized as ISO 32000 in 2008."; "released as an open standard on July 1, 2008"; Adobe issued a patent license "granting royalty-free rights for all patents owned by Adobe"'
  - text: Darum kann LibreOffice es genauso wie Word
    none: 'eine Folgerung aus dem Satz davor; beide Programme exportieren PDF (die Blätter erklären, wo)'

# ---- Office: spreadsheets (docs/plan-tabellenkalkulation.md)

visicalc:
  - text: Die Tafel, die selbst rechnet, 1979
    sources:
      - url: https://en.wikipedia.org/wiki/VisiCalc
        quote: "originally released for the Apple II by VisiCorp on October 17, 1979"
  - text: Bevor es Tabellenkalkulationen gab
    sources:
      - url: https://en.wikipedia.org/wiki/VisiCalc
        quote: "found an error or wanted to change a parameter, he had to erase and rewrite several sequential entries in the table"
  - text: Dan Bricklin sah einem Professor zu
    sources:
      - url: https://en.wikipedia.org/wiki/VisiCalc
        quote: '"Dan Bricklin conceived of VisiCalc while watching a presentation at Harvard Business School (HBS)."; "The pair formed the Software Arts company, and developed the VisiCalc program in two months during the winter of 1978–79."; "When you made a change in one place, all other things changed instantly and automatically." (Ted Nelson)'

'1900':
  - text: Der 29. Februar 1900, den es nie gab
    none: 'die Überschrift des Kastens'
  - text: 1983 kam Lotus 1-2-3 heraus
    sources:
      - url: https://en.wikipedia.org/wiki/Lotus_1-2-3
        quote: '"Lotus 1-2-3 was released on 26 January 1983"; "It was the first killer application of the IBM PC"; "significantly contributed to the success of IBM PC-compatibles in the business market"'
  - text: Lotus zählte die Tage als Zahlen wie heute Excel
    sources:
      - url: https://learn.microsoft.com/en-us/troubleshoot/microsoft-365-apps/excel/wrongly-assumes-1900-is-leap-year
        quote: "When Lotus 1-2-3 was first released, the program assumed that the year 1900 was a leap year, even though it actually was not a leap year."
  - text: Den gab es nicht
    none: 'die Regel des gregorianischen Kalenders'
  - text: Für Lotus war die Rechnung so einfacher
    sources:
      - url: https://learn.microsoft.com/en-us/troubleshoot/microsoft-365-apps/excel/wrongly-assumes-1900-is-leap-year
        quote: "This made it easier for the program to handle leap years and caused no harm to almost all date calculations in Lotus 1-2-3."
  - text: Microsoft übernahm den Fehler in Multiplan und Excel
    sources:
      - url: https://learn.microsoft.com/en-us/troubleshoot/microsoft-365-apps/excel/wrongly-assumes-1900-is-leap-year
        quote: "When Microsoft Multiplan and Microsoft Excel were released, they also assumed that 1900 was a leap year. This assumption allowed Microsoft Multiplan and Microsoft Excel to use the same serial date system used by Lotus 1-2-3"
  - text: Excel hat ihn bis heute
    sources:
      - url: https://learn.microsoft.com/en-us/troubleshoot/microsoft-365-apps/excel/wrongly-assumes-1900-is-leap-year
        quote: "Almost all dates in current Microsoft Excel worksheets and other documents would be decreased by one day."
  - text: LibreOffice zählt vom 30. Dezember 1899 an
    sources:
      - url: https://help.libreoffice.org/latest/en-US/text/shared/optionen/01060500.html
        quote: "1899-12-30 (default): Sets 1899-12-30 as day zero."
      - url: https://learn.microsoft.com/en-us/troubleshoot/microsoft-365-apps/excel/wrongly-assumes-1900-is-leap-year
        quote: '"The WEEKDAY function returns incorrect values for dates before March 1, 1900." (ab dem 1. März stimmen beide überein; im Rechner nachgeprüft: 02.03.2027 ist in beiden 46448)'

r1c1:
  - text: Zeile 1, Spalte 1, 1982
    sources:
      - url: https://en.wikipedia.org/wiki/Multiplan
        quote: "introduced in 1982 as a competitor to VisiCalc"
  - text: Die Adressen A1, B2, C3 stammen von VisiCalc
    sources:
      - url: https://en.wikipedia.org/wiki/Multiplan
        quote: "Microsoft's decision to use R1C1 addressing instead of the A1 addressing introduced by VisiCalc"
  - text: Microsoft gab seiner ersten Tabellenkalkulation
    sources:
      - url: https://en.wikipedia.org/wiki/Multiplan
        quote: "\"RC[-1]\" (meaning \"current row, previous column\") is expressed as \"A1\" in cell B1, then \"A2\" in cell B2"
  - text: Den Weg, den sich eine Formel merkt
    none: 'eine Folgerung aus dem Satz davor, mit dem Bild des ersten Blatts'
  - text: Multiplan verkaufte sich über eine Million Mal
    sources:
      - url: https://en.wikipedia.org/wiki/Multiplan
        quote: "Although over a million copies were sold, Multiplan was not able to mount an effective challenge to Lotus 1-2-3."
  - text: Excel löste es ab
    sources:
      - url: https://en.wikipedia.org/wiki/Multiplan
        quote: '"Multiplan was replaced by Microsoft Excel"; "which offers both addressing modes, although A1 is Excel''s default addressing mode"'

reinhart-rogoff:
  - text: Der Bereich, der zu kurz war, 2013
    none: 'die Überschrift des Kastens'
  - text: Drei Jahre zuvor hatten die Ökonomen Carmen Reinhart und Kenneth Rogoff
    sources:
      - url: https://en.wikipedia.org/wiki/Growth_in_a_Time_of_Debt
        quote: 'growth "roughly cut in half" when debt exceeded 90% of GDP (Reinhart and Rogoff, 2010)'
  - text: Politikerinnen und Politiker in Europa und den USA beriefen sich darauf
    sources:
      - url: https://en.wikipedia.org/wiki/Growth_in_a_Time_of_Debt
        quote: 'cited in the U.S. Republican "Path to Prosperity" budget and by EU Commissioner Olli Rehn; "Serious empirical research has shown that at such high levels, public debt acts as a permanent drag on growth." (Rehn)'
  - text: 2013 bekamen Thomas Herndon
    sources:
      - url: https://en.wikipedia.org/wiki/Growth_in_a_Time_of_Debt
        quote: 'Thomas Herndon, Michael Ash and Robert Pollin of the University of Massachusetts Amherst, after obtaining the spreadsheet from the authors, reported errors (April 2013)'
  - text: In einem Mittelwert fehlten mehrere Länder
    sources:
      - url: https://en.wikipedia.org/wiki/Growth_in_a_Time_of_Debt
        quote: '"coding errors, selective exclusion of available data, and unconventional weighting of summary statistics"; Reinhart and Rogoff acknowledged a coding error that omitted some countries'
  - text: Neu gerechnet wuchsen die Länder mit hohen Schulden
    sources:
      - url: https://en.wikipedia.org/wiki/Growth_in_a_Time_of_Debt
        quote: 'average growth above 90% debt was 2.2%, not the published −0.1%'

playfair:
  - text: Die ersten Diagramme, 1786
    none: 'die Überschrift des Kastens'
  - text: Zahlen zur Wirtschaft standen lange nur in Tabellen
    sources:
      - url: https://en.wikipedia.org/wiki/William_Playfair
        quote: 'regarded as a founder of statistical graphics; introduced the "line, area and bar chart" of economic data in 1786'
  - text: Der schottische Ingenieur William Playfair zeichnete sie
    sources:
      - url: https://en.wikipedia.org/wiki/William_Playfair
        quote: '"Scottish engineer and political economist"; introduced the "line, area and bar chart" in The Commercial and Political Atlas (1786)'
      - url: https://commons.wikimedia.org/wiki/File:Playfair_TimeSeries.png
        quote: '"Exports and Imports to and from Denmark & Norway from 1700 to 1780" (das Bild unter dem Kasten)'
  - text: Wo die rote Linie über der gelben liegt
    none: 'aus dem Bild abgelesen, beschriftet »Balance in favour of England«'
  - text: 1801 zeichnete Playfair in seinem Statistical Breviary
    sources:
      - url: https://en.wikipedia.org/wiki/William_Playfair
        quote: "what were likely the first pie chart and circle graph"
  - text: Die drei Diagramme dieses Blatts sind also über zweihundert Jahre alt
    none: 'eine Folgerung aus 1786 und 1801'

takahashi:
  - text: Ein Wort pro Folie, 2001
    sources:
      - url: https://ja.wikipedia.org/wiki/高橋メソッド
        quote: '2001年に高橋が講演するにあたり、あいにくプレゼンテーションツールを持ち合わせていなかったことから (2001, als Takahashi einen Vortrag hielt und kein Präsentationsprogramm zur Hand hatte)'
  - text: Der japanische Programmierer Masayoshi Takahashi bereitete einen kurzen Vortrag für die RubyConf vor, eine Konferenz über die Programmiersprache Ruby
    sources:
      - url: https://en.wikipedia.org/wiki/Takahashi_method
        quote: 'Takahashi, a programmer, developed the method after preparing a short presentation for RubyConf.'
  - text: Ein Präsentationsprogramm hatte er nicht zur Hand; er baute seine Folien als Webseite in HTML
    sources:
      - url: https://ja.wikipedia.org/wiki/高橋メソッド
        quote: 'あいにくプレゼンテーションツールを持ち合わせていなかったことから、巨大な文字だけで構成されたHTMLで発表した (kein Präsentationsprogramm zur Hand, darum ein HTML aus riesigen Buchstaben)'
  - text: Auf jede schrieb er nur ein oder zwei kurze Wörter, in riesiger Schrift, ohne Bilder und ohne Diagramme
    sources:
      - url: https://en.wikipedia.org/wiki/Takahashi_method
        quote: 'Only a few words are printed on each slide—often only one or two short words, using very large characters. … no pictures and no charts are used'
  - text: So eine Folie ist in einem Augenblick gelesen, und danach hört das Publikum wieder zu
    none: 'eine Folgerung aus wenigen großen Wörtern, im Sinn des Blatts'
  - text: Auf Konferenzen von Entwicklerinnen und Entwicklern halten seitdem viele ihre Vorträge so; man nennt es die Takahashi-Methode
    sources:
      - url: https://en.wikipedia.org/wiki/Takahashi_method
        quote: 'widely adopted at developer conferences'
  - text: Für dein Referat ist ein Wort pro Folie zu wenig, aber die Methode zeigt, wie wenig auf einer Folie stehen muss
    none: 'die Folgerung des Blatts für den Unterricht'

