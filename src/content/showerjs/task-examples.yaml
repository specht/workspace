# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
# Die Vorlage kommt aus einem eigenen Repository; die Beispiele bauen ihren
# Aufbau mit wenigen Folien nach.
