# Aufgaben zu »Ein Textadventure aus Objekten: Nachts in der Schule«. Format: docs/aufgaben.md.
format: 1
activity: textadventure
tasks:
  - id: modell
    title: Erst der Plan
    prompt: |
      Leg `textadventure/textadventure.uml` an und zeichne darin die drei Klassen, die du im Spiel gefunden hast: `Room`, `Item` und `Player`, jede mit den Attributen, die sie braucht, und die Beziehungen zwischen ihnen. Ein Raum hat Gegenstände, die Spielerin steht in einem Raum und hat eine Tasche mit Gegenständen.
    check:
      type: classes
      file: textadventure/textadventure.uml
      classes:
        - name: Room
          attributes: [name, description]
        - name: Item
          attributes: [name, description]
        - name: Player
      associations:
        - between: [Room, Item]
        - between: [Player, Room]
        - between: [Player, Item]
    hint:
      - "Jede Klasse ist ein Kasten: `class Room`, darunter eingerückt die Attribute, `- name: String`. Raum und Gegenstand haben einen Namen und eine Beschreibung."
      - "Eine Beziehung ist eine Zeile für sich, `association items: Room 0..1 -> 0..* Item`: ein Raum kennt beliebig viele Gegenstände. Die Spielerin kennt genau einen Raum und beliebig viele Gegenstände in ihrer Tasche."
    solution: |
      ```uml
      class Room
        - name: String
        - description: String

      class Item
        - name: String
        - description: String

      class Player

      association items: Room 0..1 -> 0..* Item
      association room: Player 0..* -> 1 Room
      association bag: Player 0..1 -> 0..* Item
      ```

  - id: raum
    title: Ein Raum mit Ausgängen
    prompt: |
      Schreib in `adventure.rb` eine Klasse `Room`. Ein Raum wird mit Namen und Beschreibung gebaut, `Room.new("Küche", "Es riecht nach Kaffee.")`; `name` und `description` geben sie zurück. `connect(direction, room)` legt einen Ausgang in eine Richtung an, `exit_to(direction)` gibt den Raum in dieser Richtung zurück oder `nil`, wenn es dort nicht weitergeht, und `directions` die Richtungen der Ausgänge, in der Reihenfolge, in der sie angelegt wurden.
    check:
      type: ruby
      file: textadventure/adventure.rb
      cases:
        - call: "Room.new('Küche', 'Es riecht nach Kaffee.').name"
          expect: "'Küche'"
        - call: "Room.new('Küche', 'Es riecht nach Kaffee.').description"
          expect: "'Es riecht nach Kaffee.'"
        - call: "k = Room.new('Küche', ''); f = Room.new('Flur', ''); k.connect('süden', f); k.exit_to('süden').name"
          expect: "'Flur'"
        - call: "k = Room.new('Küche', ''); f = Room.new('Flur', ''); k.connect('süden', f); k.exit_to('süden').equal?(f)"
          expect: "true"
          say: "`exit_to` soll den Raum selbst zurückgeben, den `connect` bekommen hat, keine Kopie."
        - call: "k = Room.new('Küche', ''); k.exit_to('norden')"
          expect: "nil"
          say: "Gibt es in einer Richtung keinen Ausgang, gibt `exit_to` `nil` zurück."
        - call: "k = Room.new('Küche', ''); k.connect('süden', Room.new('Flur', '')); k.connect('osten', Room.new('Bad', '')); k.directions"
          expect: "['süden', 'osten']"
        - call: "Room.new('Küche', '').directions"
          expect: "[]"
    hint:
      - "Die Ausgänge merkt sich der Raum in einem Dictionary, `@exits = {}` in `initialize`: die Richtung als Schlüssel, der Raum als Wert."
      - "`connect` trägt ein, `@exits[direction] = room`; `exit_to` schlägt nach, `@exits[direction]`, und das ist von selbst `nil`, wenn es den Schlüssel nicht gibt. `@exits.keys` sind die Richtungen."
    solution: |
      ```ruby
      class Room
        attr_reader :name, :description

        def initialize(name, description)
          @name = name
          @description = description
          @exits = {}
        end

        def connect(direction, room)
          @exits[direction] = room
        end

        def exit_to(direction)
          @exits[direction]
        end

        def directions
          @exits.keys
        end
      end
      ```
    python:
      prompt: |
        Schreib in `adventure.py` eine Klasse `Room`. Ein Raum wird mit Namen und Beschreibung gebaut, `Room("Küche", "Es riecht nach Kaffee.")`; die Attribute `name` und `description` halten sie. `connect(direction, room)` legt einen Ausgang in eine Richtung an, `exit_to(direction)` gibt den Raum in dieser Richtung zurück oder `None`, wenn es dort nicht weitergeht, und `directions()` die Richtungen der Ausgänge als Liste, in der Reihenfolge, in der sie angelegt wurden.
      check:
        type: python
        file: textadventure/adventure.py
        cases:
          - call: "Room('Küche', 'Es riecht nach Kaffee.').name"
            expect: "'Küche'"
          - call: "Room('Küche', 'Es riecht nach Kaffee.').description"
            expect: "'Es riecht nach Kaffee.'"
          - call: "k = Room('Küche', ''); f = Room('Flur', ''); k.connect('süden', f); k.exit_to('süden').name"
            expect: "'Flur'"
          - call: "k = Room('Küche', ''); f = Room('Flur', ''); k.connect('süden', f); k.exit_to('süden') is f"
            expect: "True"
            say: "`exit_to` soll den Raum selbst zurückgeben, den `connect` bekommen hat, keine Kopie."
          - call: "k = Room('Küche', ''); k.exit_to('norden')"
            expect: "None"
            say: "Gibt es in einer Richtung keinen Ausgang, gibt `exit_to` `None` zurück, statt mit einem `KeyError` abzubrechen: `self._exits.get(direction)`."
          - call: "k = Room('Küche', ''); k.connect('süden', Room('Flur', '')); k.connect('osten', Room('Bad', '')); k.directions()"
            expect: "['süden', 'osten']"
          - call: "Room('Küche', '').directions()"
            expect: "[]"
      hint:
        - "Die Ausgänge merkt sich der Raum in einem Dictionary, `self._exits = {}` in `__init__`: die Richtung als Schlüssel, der Raum als Wert. Der Unterstrich sagt: Das geht nur den Raum selbst etwas an (mehr dazu bei der Kapselung)."
        - "`connect` trägt ein, `self._exits[direction] = room`; `exit_to` schlägt mit `self._exits.get(direction)` nach, das `None` ergibt, wenn es den Schlüssel nicht gibt. `list(self._exits.keys())` sind die Richtungen."
      solution: |
        ```python
        class Room:
            def __init__(self, name, description):
                self.name = name
                self.description = description
                self._exits = {}

            def connect(self, direction, room):
                self._exits[direction] = room

            def exit_to(self, direction):
                return self._exits.get(direction)

            def directions(self):
                return list(self._exits.keys())
        ```
    dart:
      prompt: |
        Schreib in `adventure.dart` eine Klasse `Room`. Ein Raum wird mit Namen und Beschreibung gebaut, `Room('Küche', 'Es riecht nach Kaffee.')`; `name` und `description` halten sie. `connect(direction, room)` legt einen Ausgang in eine Richtung an, `exitTo(direction)` gibt den Raum in dieser Richtung zurück oder `null`, wenn es dort nicht weitergeht (darum ist sein Rückgabetyp `Room?`), und der Getter `directions` gibt die Richtungen der Ausgänge als Liste, in der Reihenfolge, in der sie angelegt wurden.
      check:
        type: dart
        file: textadventure/adventure.dart
        cases:
          - call: "Room('Küche', 'Es riecht nach Kaffee.').name"
            expect: "'Küche'"
          - call: "Room('Küche', 'Es riecht nach Kaffee.').description"
            expect: "'Es riecht nach Kaffee.'"
          - call: "final k = Room('Küche', ''); final f = Room('Flur', ''); k.connect('süden', f); k.exitTo('süden')?.name"
            expect: "'Flur'"
          - call: "final k = Room('Küche', ''); final f = Room('Flur', ''); k.connect('süden', f); identical(k.exitTo('süden'), f)"
            expect: "true"
            say: "`exitTo` soll den Raum selbst zurückgeben, den `connect` bekommen hat, keine Kopie."
          - call: "Room('Küche', '').exitTo('norden')"
            expect: "null"
            say: "Gibt es in einer Richtung keinen Ausgang, gibt `exitTo` `null` zurück: Das tut `_exits[direction]` von selbst, wenn es den Schlüssel nicht gibt."
          - call: "final k = Room('Küche', ''); k.connect('süden', Room('Flur', '')); k.connect('osten', Room('Bad', '')); k.directions"
            expect: "['süden', 'osten']"
          - call: "Room('Küche', '').directions"
            expect: "[]"
      hint:
        - "Die Ausgänge merkt sich der Raum in einer Map, `final Map<String, Room> _exits = {};`: die Richtung als Schlüssel, der Raum als Wert. Der Unterstrich macht sie privat: Außerhalb deiner Datei kommt niemand an sie heran (mehr dazu bei der Kapselung)."
        - "`connect` trägt ein, `_exits[direction] = room;`; `exitTo` schlägt nach, `Room? exitTo(String direction) => _exits[direction];`, und das ist `null`, wenn es den Schlüssel nicht gibt. `_exits.keys.toList()` sind die Richtungen."
      solution: |
        ```dart
        class Room {
          final String name;
          final String description;
          final Map<String, Room> _exits = {};

          Room(this.name, this.description);

          void connect(String direction, Room room) {
            _exits[direction] = room;
          }

          Room? exitTo(String direction) => _exits[direction];

          List<String> get directions => _exits.keys.toList();
        }
        ```
    java:
      prompt: |
        Schreib in `Room.java` die Klasse `Room`. Ein Raum wird mit Namen und Beschreibung gebaut, `new Room("Küche", "Es riecht nach Kaffee.")`; `getName()` und `getDescription()` geben sie zurück. `connect(direction, room)` legt einen Ausgang in eine Richtung an, `exitTo(direction)` gibt den Raum in dieser Richtung zurück oder `null`, wenn es dort nicht weitergeht, und `getDirections()` gibt die Richtungen der Ausgänge als `List<String>`, in der Reihenfolge, in der sie angelegt wurden.
      check:
        type: java
        file: textadventure/Room.java
        cases:
          - call: 'new Room("Küche", "Es riecht nach Kaffee.").getName()'
            expect: '"Küche"'
          - call: 'new Room("Küche", "Es riecht nach Kaffee.").getDescription()'
            expect: '"Es riecht nach Kaffee."'
          - call: 'Room k = new Room("Küche", ""); Room f = new Room("Flur", ""); k.connect("süden", f); k.exitTo("süden").getName()'
            expect: '"Flur"'
          - call: 'Room k = new Room("Küche", ""); Room f = new Room("Flur", ""); k.connect("süden", f); k.exitTo("süden") == f'
            expect: 'true'
            say: "`exitTo` soll den Raum selbst zurückgeben, den `connect` bekommen hat, keine Kopie."
          - call: 'new Room("Küche", "").exitTo("norden")'
            expect: 'null'
            say: "Gibt es in einer Richtung keinen Ausgang, gibt `exitTo` `null` zurück: Das tut `exits.get(direction)` von selbst, wenn es den Schlüssel nicht gibt."
          - call: 'Room k = new Room("Küche", ""); k.connect("süden", new Room("Flur", "")); k.connect("osten", new Room("Bad", "")); k.connect("norden", new Room("Hof", "")); k.getDirections()'
            expect: 'List.of("süden", "osten", "norden")'
            say: "Die Richtungen kommen in der Reihenfolge, in der sie angelegt wurden. Eine `HashMap` merkt sich keine Reihenfolge, eine `LinkedHashMap` schon."
          - call: 'new Room("Küche", "").getDirections()'
            expect: 'List.of()'
      hint:
        - "Die Ausgänge merkt sich der Raum in einer Map, `private final Map<String, Room> exits = new LinkedHashMap<>();`: die Richtung als Schlüssel, der Raum als Wert. Eine `LinkedHashMap` behält die Reihenfolge, in der eingetragen wurde. Dazu kommen oben in die Datei `import java.util.LinkedHashMap;` und die anderen Klassen aus `java.util`, die du benutzt."
        - "`connect` trägt ein, `exits.put(direction, room);`; `exitTo` gibt `exits.get(direction)` zurück, und das ist `null`, wenn es den Schlüssel nicht gibt. `new ArrayList<>(exits.keySet())` ist die Liste der Richtungen."
      solution: |
        ```java
        import java.util.ArrayList;
        import java.util.LinkedHashMap;
        import java.util.List;
        import java.util.Map;

        public class Room {
            private final String name;
            private final String description;
            private final Map<String, Room> exits = new LinkedHashMap<>();

            public Room(String name, String description) {
                this.name = name;
                this.description = description;
            }

            public String getName() {
                return name;
            }

            public String getDescription() {
                return description;
            }

            public void connect(String direction, Room room) {
                exits.put(direction, room);
            }

            public Room exitTo(String direction) {
                return exits.get(direction);
            }

            public List<String> getDirections() {
                return new ArrayList<>(exits.keySet());
            }
        }
        ```

