  - id: gegenstaende
    title: Gegenstände im Raum
    prompt: |
      Schreib eine Klasse `Item` für Gegenstände, gebaut mit Namen und Beschreibung, `Item.new("kiste", "Eine schwere Holzkiste.")`, mit `name` und `description`. Ein Raum bekommt eine Liste seiner Gegenstände: `items` gibt sie zurück, `add_item(item)` legt einen hinein, und `take(name)` nimmt den Gegenstand mit diesem Namen heraus und gibt ihn zurück, oder `nil`, wenn keiner so heißt.
    check:
      type: ruby
      file: textadventure/adventure.rb
      cases:
        - call: "Item.new('kiste', 'Eine schwere Holzkiste.').description"
          expect: "'Eine schwere Holzkiste.'"
        - call: "Room.new('Keller', '').items"
          expect: "[]"
        - call: "r = Room.new('Keller', ''); r.add_item(Item.new('kiste', '')); r.add_item(Item.new('lampe', '')); r.items.map(&:name)"
          expect: "['kiste', 'lampe']"
        - call: "r = Room.new('Keller', ''); r.add_item(Item.new('kiste', '')); r.take('kiste').name"
          expect: "'kiste'"
        - call: "r = Room.new('Keller', ''); r.add_item(Item.new('kiste', '')); r.add_item(Item.new('lampe', '')); r.take('kiste'); r.items.map(&:name)"
          expect: "['lampe']"
          say: "Was herausgenommen ist, liegt nicht mehr im Raum: `take` entfernt es aus der Liste."
        - call: "r = Room.new('Keller', ''); r.add_item(Item.new('kiste', '')); r.take('lampe')"
          expect: "nil"
        - call: "r = Room.new('Keller', ''); r.add_item(Item.new('kiste', '')); r.take('lampe'); r.items.map(&:name)"
          expect: "['kiste']"
          say: "Gibt es keinen Gegenstand mit dem Namen, bleibt die Liste, wie sie ist."
    hint:
      - "`Item` sieht aus wie der Anfang von `Room`: zwei Attribute und `attr_reader`. Der Raum bekommt in `initialize` `@items = []` und ein `:items` beim `attr_reader`."
      - "In `take` suchst du den Gegenstand mit `@items.find { |item| item.name == name }`, nimmst ihn mit `@items.delete(item)` heraus, wenn es ihn gibt, und gibst ihn zurück."
    solution: |
      ```ruby
      class Item
        attr_reader :name, :description

        def initialize(name, description)
          @name = name
          @description = description
        end
      end
      ```

      und in `Room`, neben `@items = []` in `initialize` und `:items` beim `attr_reader`:

      ```ruby
      def add_item(item)
        @items << item
      end

      def take(name)
        item = @items.find { |i| i.name == name }
        @items.delete(item) if item
        item
      end
      ```
