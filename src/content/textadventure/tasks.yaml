        und in `Room`, neben `self.items = []` in `__init__`:

        ```python
        def add_item(self, item):
            self.items.append(item)

        def take(self, name):
            for item in self.items:
                if item.name == name:
                    self.items.remove(item)
                    return item
            return None
        ```
