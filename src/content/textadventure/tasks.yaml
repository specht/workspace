          - call: "g = Game(Player(Room('Flur', ''))); [g.is_over(), g.handle('ende'), g.is_over(), g.is_won()]"
            expect: "[False, 'Bis bald.', True, False]"
          - call: "h = Room('Halle', ''); out = GoalRoom('Schulhof', 'Geschafft!'); h.connect('süden', out); g = Game(Player(h)); g.handle('gehe süden'); [g.is_won(), g.is_over(), Room('x', '').is_goal(), issubclass(GoalRoom, Room)]"
            expect: "[True, True, False, True]"
