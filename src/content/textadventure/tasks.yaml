      def all_rooms(start)
        seen = [start]
        queue = [start]
        until queue.empty?
          room = queue.shift
          room.directions.each do |direction|
            other = room.exit_to(direction)
            next if seen.include?(other)
            seen << other
            queue << other
          end
        end
        seen
      end
