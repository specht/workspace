            expect: "['Kaffee um drei.', 'Du nimmst zettel.', 'Kaffee um drei.', 'Hier gibt es nichts mit dem Namen lampe.']"
          - call: "g = Game(Player(Room('Flur', ''))); g.handle('tanze')"
