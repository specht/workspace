      - Ein Raum schließt mit `lock(direction, key_name)` die Tür in einer Richtung ab; `locked?(direction)` sagt, ob sie zu ist, und `unlock(key_name)` schließt alle Türen auf, zu denen der Schlüssel passt, und gibt `true` zurück, wenn es mindestens eine gab. `describe` schreibt ` (verschlossen)` hinter eine verschlossene Richtung, und `go` lässt die Spielerin nicht hindurch.
