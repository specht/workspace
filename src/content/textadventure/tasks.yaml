      solution: |
        In `Room`, neben `private final Map<String, String> locks = new HashMap<>();`:

        ```java
        public void lock(String direction, String keyName) {
            locks.put(direction, keyName);
        }

        public boolean isLocked(String direction) {
            return locks.containsKey(direction);
        }

        public boolean unlock(String keyName) {
            return locks.values().removeIf(key -> key.equals(keyName));
        }
        ```

        und in `describe`:

        ```java
        List<String> ways = new ArrayList<>();
        for (String direction : getDirections()) {
            ways.add(isLocked(direction) ? direction + " (verschlossen)" : direction);
        }
        ```

        In `Item`:

        ```java
        public String use(Player player) {
            return "Damit kannst du hier nichts anfangen.";
        }
        ```

        `Key.java` (und `Food.java` ebenso, mit `player.remove(this);` und `return "Du isst " + getName() + ". " + getDescription();`):

        ```java
        public class Key extends Item {
            public Key(String name, String description) {
                super(name, description);
            }

            @Override
            public String use(Player player) {
                if (player.getRoom().unlock(getName())) {
                    return "Du schließt die Tür auf.";
                }
                return "Hier passt " + getName() + " in kein Schloss.";
            }
        }
        ```

        In `Player`:

        ```java
        public void remove(Item item) {
            bag.remove(item);
        }

        public String use(String name) {
            for (Item item : bag) {
                if (item.getName().equals(name)) {
                    return item.use(this);
                }
            }
            return "Du hast nichts mit dem Namen " + name + ".";
        }
        ```

