        - `is_over()` sagt, ob das Spiel zu Ende ist, `is_won()`, ob die Spielerin am Ziel steht. Das Ziel ist ein `GoalRoom`, ein Raum, dessen `is_goal()` `True` ist (`Room` sagt `False`); wer ihn betritt, hat gewonnen, und das Spiel ist zu Ende.
