      hint:
        - "`Item` sieht aus wie der Anfang von `Room`: zwei Attribute. Der Raum bekommt in `__init__` `self.items = []`."
        - "In `take` gehst du durch `self.items`; hat ein Gegenstand den Namen, nimmst du ihn mit `self.items.remove(item)` heraus und gibst ihn zurück. Nach der Schleife gibst du `None` zurück."
