  - id: gegenstaende
    title: Gegenstände im Raum
    prompt: |
      Schreib eine Klasse `Item` für Gegenstände, gebaut mit Namen und Beschreibung, `Item.new("kiste", "Eine schwere Holzkiste.")`, mit `name` und `description`. Ein Raum bekommt eine Liste seiner Gegenstände: `items` gibt sie zurück, `add_item(item)` legt einen hinein, und `take(name)` nimmt den Gegenstand mit diesem Namen heraus und gibt ihn zurück, oder `nil`, wenn keiner so heißt.
    check:
      type: ruby
      file: textadventure/adventure.rb
      cases:
        - call: "Item.new('kiste', 'Eine schwere Holzkiste.').description"
          expect: "'Eine schwere Holzkiste.'"
        - call: "Room.new('Keller', '').items"
          expect: "[]"
        - call: "r = Room.new('Keller', ''); r.add_item(Item.new('kiste', '')); r.add_item(Item.new('lampe', '')); r.items.map(&:name)"
          expect: "['kiste', 'lampe']"
        - call: "r = Room.new('Keller', ''); r.add_item(Item.new('kiste', '')); r.take('kiste').name"
          expect: "'kiste'"
        - call: "r = Room.new('Keller', ''); r.add_item(Item.new('kiste', '')); r.add_item(Item.new('lampe', '')); r.take('kiste'); r.items.map(&:name)"
          expect: "['lampe']"
          say: "Was herausgenommen ist, liegt nicht mehr im Raum: `take` entfernt es aus der Liste."
        - call: "r = Room.new('Keller', ''); r.add_item(Item.new('kiste', '')); r.take('lampe')"
          expect: "nil"
        - call: "r = Room.new('Keller', ''); r.add_item(Item.new('kiste', '')); r.take('lampe'); r.items.map(&:name)"
          expect: "['kiste']"
          say: "Gibt es keinen Gegenstand mit dem Namen, bleibt die Liste, wie sie ist."
    hint:
      - "`Item` sieht aus wie der Anfang von `Room`: zwei Attribute und `attr_reader`. Der Raum bekommt in `initialize` `@items = []` und ein `:items` beim `attr_reader`."
      - "In `take` suchst du den Gegenstand mit `@items.find { |item| item.name == name }`, nimmst ihn mit `@items.delete(item)` heraus, wenn es ihn gibt, und gibst ihn zurück."
    solution: |
      ```ruby
      class Item
        attr_reader :name, :description

        def initialize(name, description)
          @name = name
          @description = description
        end
      end
      ```

      und in `Room`, neben `@items = []` in `initialize` und `:items` beim `attr_reader`:

      ```ruby
      def add_item(item)
        @items << item
      end

      def take(name)
        item = @items.find { |i| i.name == name }
        @items.delete(item) if item
        item
      end
      ```
    python:
      prompt: |
        Schreib eine Klasse `Item` für Gegenstände, gebaut mit Namen und Beschreibung, `Item("kiste", "Eine schwere Holzkiste.")`, mit den Attributen `name` und `description`. Ein Raum bekommt eine Liste seiner Gegenstände im Attribut `items`: `add_item(item)` legt einen hinein, und `take(name)` nimmt den Gegenstand mit diesem Namen heraus und gibt ihn zurück, oder `None`, wenn keiner so heißt.
      check:
        type: python
        file: textadventure/adventure.py
        cases:
          - call: "Item('kiste', 'Eine schwere Holzkiste.').description"
            expect: "'Eine schwere Holzkiste.'"
          - call: "Room('Keller', '').items"
            expect: "[]"
          - call: "r = Room('Keller', ''); r.add_item(Item('kiste', '')); r.add_item(Item('lampe', '')); [i.name for i in r.items]"
            expect: "['kiste', 'lampe']"
          - call: "r = Room('Keller', ''); r.add_item(Item('kiste', '')); r.take('kiste').name"
            expect: "'kiste'"
          - call: "r = Room('Keller', ''); r.add_item(Item('kiste', '')); r.add_item(Item('lampe', '')); r.take('kiste'); [i.name for i in r.items]"
            expect: "['lampe']"
            say: "Was herausgenommen ist, liegt nicht mehr im Raum: `take` entfernt es aus der Liste."
          - call: "r = Room('Keller', ''); r.add_item(Item('kiste', '')); r.take('lampe')"
            expect: "None"
          - call: "r = Room('Keller', ''); r.add_item(Item('kiste', '')); r.take('lampe'); [i.name for i in r.items]"
            expect: "['kiste']"
            say: "Gibt es keinen Gegenstand mit dem Namen, bleibt die Liste, wie sie ist."
      hint:
        - "`Item` sieht aus wie der Anfang von `Room`: zwei Attribute. Der Raum bekommt in `__init__` `self.items = []`."
        - "In `take` gehst du durch `self.items`; hat ein Gegenstand den Namen, nimmst du ihn mit `self.items.remove(item)` heraus und gibst ihn zurück. Nach der Schleife gibst du `None` zurück."
      solution: |
        ```python
        class Item:
            def __init__(self, name, description):
                self.name = name
                self.description = description
        ```

        und in `Room`, neben `self.items = []` in `__init__`:

        ```python
        def add_item(self, item):
            self.items.append(item)

        def take(self, name):
            for item in self.items:
                if item.name == name:
                    self.items.remove(item)
                    return item
            return None
        ```

  - id: beschreibung
    title: Was die Spielerin sieht
    prompt: |
      Schreib in `Room` eine Methode `describe`, die den Raum als Text beschreibt, Zeile für Zeile: den Namen, die Beschreibung, dann `Hier liegt: ` mit den Namen der Gegenstände, durch Komma und Leerzeichen getrennt (die Zeile fehlt, wenn nichts da liegt), und zuletzt `Ausgänge: ` mit den Richtungen, ebenso getrennt, oder `Ausgänge: keine`. Die Zeilen trennt `"\n"`, wie im Beispiel oben auf der Seite.
    check:
      type: ruby
      file: textadventure/adventure.rb
      cases:
        - call: "k = Room.new('Küche', 'Es riecht nach Kaffee.'); k.add_item(Item.new('schlüssel', '')); k.add_item(Item.new('apfel', '')); k.connect('süden', Room.new('Flur', '')); k.describe.split(\"\\n\")"
          expect: "['Küche', 'Es riecht nach Kaffee.', 'Hier liegt: schlüssel, apfel', 'Ausgänge: süden']"
        - call: "f = Room.new('Flur', 'Ein langer Flur.'); f.connect('norden', Room.new('Küche', '')); f.connect('osten', Room.new('Keller', '')); f.describe.split(\"\\n\")"
          expect: "['Flur', 'Ein langer Flur.', 'Ausgänge: norden, osten']"
          say: "Liegt nichts im Raum, fehlt die Zeile `Hier liegt:` ganz."
        - call: "Room.new('Zelle', 'Kahl.').describe.split(\"\\n\")"
          expect: "['Zelle', 'Kahl.', 'Ausgänge: keine']"
          say: "Ohne Ausgänge heißt die letzte Zeile `Ausgänge: keine`."
        - call: "Room.new('Zelle', 'Kahl.').describe.end_with?(\"\\n\")"
          expect: "false"
          say: "Nach der letzten Zeile kommt kein Zeilenumbruch mehr: `join(\"\\n\")` setzt ihn nur zwischen die Zeilen."
    hint:
      - "Sammle die Zeilen in einer Liste, `lines = [@name, @description]`, hänge die beiden anderen an und setz sie am Ende mit `lines.join(\"\\n\")` zusammen."
      - "`@items.map(&:name).join(', ')` gibt die Namen mit Komma; die Zeile hängst du nur an, `unless @items.empty?`."
      - "Für die Ausgänge: `directions.empty? ? 'keine' : directions.join(', ')`."
    solution: |
      ```ruby
      def describe
        lines = [@name, @description]
        lines << "Hier liegt: #{@items.map(&:name).join(', ')}" unless @items.empty?
        lines << "Ausgänge: #{directions.empty? ? 'keine' : directions.join(', ')}"
        lines.join("\n")
      end
      ```
    python:
      prompt: |
        Schreib in `Room` eine Methode `describe()`, die den Raum als Text beschreibt, Zeile für Zeile: den Namen, die Beschreibung, dann `Hier liegt: ` mit den Namen der Gegenstände, durch Komma und Leerzeichen getrennt (die Zeile fehlt, wenn nichts da liegt), und zuletzt `Ausgänge: ` mit den Richtungen, ebenso getrennt, oder `Ausgänge: keine`. Die Zeilen trennt `"\n"`, wie im Beispiel oben auf der Seite.
      check:
        type: python
        file: textadventure/adventure.py
        cases:
          - call: "k = Room('Küche', 'Es riecht nach Kaffee.'); k.add_item(Item('schlüssel', '')); k.add_item(Item('apfel', '')); k.connect('süden', Room('Flur', '')); k.describe().split(\"\\n\")"
            expect: "['Küche', 'Es riecht nach Kaffee.', 'Hier liegt: schlüssel, apfel', 'Ausgänge: süden']"
          - call: "f = Room('Flur', 'Ein langer Flur.'); f.connect('norden', Room('Küche', '')); f.connect('osten', Room('Keller', '')); f.describe().split(\"\\n\")"
            expect: "['Flur', 'Ein langer Flur.', 'Ausgänge: norden, osten']"
            say: "Liegt nichts im Raum, fehlt die Zeile `Hier liegt:` ganz."
          - call: "Room('Zelle', 'Kahl.').describe().split(\"\\n\")"
            expect: "['Zelle', 'Kahl.', 'Ausgänge: keine']"
            say: "Ohne Ausgänge heißt die letzte Zeile `Ausgänge: keine`."
          - call: "Room('Zelle', 'Kahl.').describe().endswith(\"\\n\")"
            expect: "False"
            say: "Nach der letzten Zeile kommt kein Zeilenumbruch mehr: `\"\\n\".join(lines)` setzt ihn nur zwischen die Zeilen."
      hint:
        - "Sammle die Zeilen in einer Liste, `lines = [self.name, self.description]`, hänge die beiden anderen an und setz sie am Ende mit `\"\\n\".join(lines)` zusammen."
        - "`\", \".join(item.name for item in self.items)` gibt die Namen mit Komma; die Zeile hängst du nur an, `if self.items:`."
        - "Für die Ausgänge: `\", \".join(self.directions())`, oder `keine`, wenn die Liste leer ist."
      solution: |
        ```python
        def describe(self):
            lines = [self.name, self.description]
            if self.items:
                lines.append("Hier liegt: " + ", ".join(item.name for item in self.items))
            exits = self.directions()
            lines.append("Ausgänge: " + (", ".join(exits) if exits else "keine"))
            return "\n".join(lines)
        ```

  - id: spielerin
    title: Die Spielerin geht und nimmt
    prompt: |
      Schreib eine Klasse `Player`, gebaut mit dem Raum, in dem die Spielerin anfängt, `Player.new(hall)`. `room` gibt ihren Raum zurück, `inventory` ihre Tasche, eine Liste, anfangs leer. `go(direction)` geht in diese Richtung und gibt die Beschreibung des neuen Raums zurück; gibt es dort keinen Ausgang, bleibt sie stehen, und `go` gibt `Da geht es nicht weiter.` zurück. `take(name)` nimmt einen Gegenstand aus dem Raum in die Tasche und gibt `Du nimmst schlüssel.` zurück, mit seinem Namen; liegt keiner mit diesem Namen da, `Hier liegt nichts mit dem Namen schlüssel.`
    check:
      type: ruby
      file: textadventure/adventure.rb
      cases:
        - call: "h = Room.new('Flur', ''); Player.new(h).room.name"
          expect: "'Flur'"
        - call: "Player.new(Room.new('Flur', '')).inventory"
          expect: "[]"
        - call: "h = Room.new('Flur', 'Lang.'); k = Room.new('Küche', 'Warm.'); h.connect('norden', k); p = Player.new(h); p.go('norden')"
          expect: "\"Küche\\nWarm.\\nAusgänge: keine\""
          say: "`go` gibt zurück, was der neue Raum über sich sagt: `@room.describe`."
        - call: "h = Room.new('Flur', ''); k = Room.new('Küche', ''); h.connect('norden', k); p = Player.new(h); p.go('norden'); p.room.name"
          expect: "'Küche'"
        - call: "h = Room.new('Flur', ''); p = Player.new(h); p.go('osten')"
          expect: "'Da geht es nicht weiter.'"
        - call: "h = Room.new('Flur', ''); p = Player.new(h); p.go('osten'); p.room.name"
          expect: "'Flur'"
          say: "Gibt es keinen Ausgang, bleibt die Spielerin, wo sie ist."
        - call: "h = Room.new('Flur', ''); h.add_item(Item.new('schlüssel', '')); p = Player.new(h); p.take('schlüssel')"
          expect: "'Du nimmst schlüssel.'"
        - call: "h = Room.new('Flur', ''); h.add_item(Item.new('schlüssel', '')); p = Player.new(h); p.take('schlüssel'); [p.inventory.map(&:name), h.items.map(&:name)]"
          expect: "[['schlüssel'], []]"
          say: "Der Gegenstand wechselt vom Raum in die Tasche: `@room.take(name)` gibt ihn heraus, und er kommt in `@inventory`."
        - call: "h = Room.new('Flur', ''); p = Player.new(h); p.take('lampe')"
          expect: "'Hier liegt nichts mit dem Namen lampe.'"
    hint:
      - "Die Spielerin merkt sich `@room` und `@inventory = []`. Beide braucht man von außen: `attr_reader :room, :inventory`."
      - "In `go` fragst du `@room.exit_to(direction)`. Ist das `nil`, gibst du `Da geht es nicht weiter.` zurück; sonst weist du `@room` den neuen Raum zu und gibst `@room.describe` zurück."
      - "In `take` holst du mit `@room.take(name)` den Gegenstand; ist er `nil`, gibst du die Meldung zurück, sonst legst du ihn in `@inventory`."
    solution: |
      ```ruby
      class Player
        attr_reader :room, :inventory

        def initialize(room)
          @room = room
          @inventory = []
        end

        def go(direction)
          target = @room.exit_to(direction)
          return "Da geht es nicht weiter." if target.nil?
          @room = target
          @room.describe
        end

        def take(name)
          item = @room.take(name)
          return "Hier liegt nichts mit dem Namen #{name}." if item.nil?
          @inventory << item
          "Du nimmst #{item.name}."
        end
      end
      ```
    python:
      prompt: |
        Schreib eine Klasse `Player`, gebaut mit dem Raum, in dem die Spielerin anfängt, `Player(hall)`. Das Attribut `room` ist ihr Raum, `inventory` ihre Tasche, eine Liste, anfangs leer. `go(direction)` geht in diese Richtung und gibt die Beschreibung des neuen Raums zurück; gibt es dort keinen Ausgang, bleibt sie stehen, und `go` gibt `Da geht es nicht weiter.` zurück. `take(name)` nimmt einen Gegenstand aus dem Raum in die Tasche und gibt `Du nimmst schlüssel.` zurück, mit seinem Namen; liegt keiner mit diesem Namen da, `Hier liegt nichts mit dem Namen schlüssel.`
      check:
        type: python
        file: textadventure/adventure.py
        cases:
          - call: "h = Room('Flur', ''); Player(h).room.name"
            expect: "'Flur'"
          - call: "Player(Room('Flur', '')).inventory"
            expect: "[]"
          - call: "h = Room('Flur', 'Lang.'); k = Room('Küche', 'Warm.'); h.connect('norden', k); p = Player(h); p.go('norden')"
            expect: "'Küche\\nWarm.\\nAusgänge: keine'"
            say: "`go` gibt zurück, was der neue Raum über sich sagt: `self.room.describe()`."
          - call: "h = Room('Flur', ''); k = Room('Küche', ''); h.connect('norden', k); p = Player(h); p.go('norden'); p.room.name"
            expect: "'Küche'"
          - call: "h = Room('Flur', ''); p = Player(h); p.go('osten')"
            expect: "'Da geht es nicht weiter.'"
          - call: "h = Room('Flur', ''); p = Player(h); p.go('osten'); p.room.name"
            expect: "'Flur'"
            say: "Gibt es keinen Ausgang, bleibt die Spielerin, wo sie ist."
          - call: "h = Room('Flur', ''); h.add_item(Item('schlüssel', '')); p = Player(h); p.take('schlüssel')"
            expect: "'Du nimmst schlüssel.'"
          - call: "h = Room('Flur', ''); h.add_item(Item('schlüssel', '')); p = Player(h); p.take('schlüssel'); [[i.name for i in p.inventory], [i.name for i in h.items]]"
            expect: "[['schlüssel'], []]"
            say: "Der Gegenstand wechselt vom Raum in die Tasche: `self.room.take(name)` gibt ihn heraus, und er kommt in `self.inventory`."
          - call: "h = Room('Flur', ''); p = Player(h); p.take('lampe')"
            expect: "'Hier liegt nichts mit dem Namen lampe.'"
      hint:
        - "Die Spielerin merkt sich `self.room` und `self.inventory = []`."
        - "In `go` fragst du `self.room.exit_to(direction)`. Ist das `None`, gibst du `Da geht es nicht weiter.` zurück; sonst weist du `self.room` den neuen Raum zu und gibst `self.room.describe()` zurück."
        - "In `take` holst du mit `self.room.take(name)` den Gegenstand; ist er `None`, gibst du die Meldung zurück, sonst hängst du ihn an `self.inventory`."
      solution: |
        ```python
        class Player:
            def __init__(self, room):
                self.room = room
                self.inventory = []

            def go(self, direction):
                target = self.room.exit_to(direction)
                if target is None:
                    return "Da geht es nicht weiter."
                self.room = target
                return self.room.describe()

            def take(self, name):
                item = self.room.take(name)
                if item is None:
                    return f"Hier liegt nichts mit dem Namen {name}."
                self.inventory.append(item)
                return f"Du nimmst {item.name}."
        ```

  - id: diagramm
    title: Gegenstände, die etwas können
    prompt: |
      Leg `textadventure/textadventure.uml` an und zeichne darin die Klasse `Item` mit einer Methode `+ use(player: Player): String` und die Klassen `Key` und `Food`, die von `Item` erben und `use` überschreiben. Dazu die Klasse `Player` mit einer Methode `+ use(name: String): String`.
