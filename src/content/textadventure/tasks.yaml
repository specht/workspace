        - `look()` gibt die Beschreibung ihres Raums.
        - `go(direction)` geht in diese Richtung und gibt die Beschreibung des neuen Raums. Gibt es dort keinen Ausgang, bleibt sie stehen: `Da geht es nicht weiter.`
        - `take(name)` nimmt einen Gegenstand aus dem Raum in ihre Tasche: `Du nimmst schlüssel.`, oder `Hier liegt nichts mit dem Namen schlüssel.`
        - `has(name)` sagt, ob ein Gegenstand dieses Namens in ihrer Tasche ist, und `bag()` gibt `In deiner Tasche: schlüssel, apfel` zurück oder `Deine Tasche ist leer.`

