      class Key < Item
        def use(player)
          if player.room.unlock(name)
            "Du schließt die Tür auf."
          else
            "Hier passt #{name} in kein Schloss."
          end
        end
      end

      class Food < Item
        def use(player)
          player.remove(self)
          "Du isst #{name}. #{description}"
        end
      end

      # in Player:
      def remove(item)
        @bag.delete(item)
      end

      def use(name)
        item = @bag.find { |i| i.name == name }
        return "Du hast nichts mit dem Namen #{name}." if item.nil?
        item.use(self)
      end
