      solution: |
        ```python
        # in Item:
        def shines(self):
            return False


        class Lamp(Item):
            def use(self, player):
                return f"{self.name} leuchtet schon."

            def shines(self):
                return True


        # in Room:
        def is_dark(self):
            return False


        class DarkRoom(Room):
            def is_dark(self):
                return True


        # in Player:
        def has_light(self):
            return any(item.shines() for item in self._bag)

        def look(self):
            if self.room.is_dark() and not self.has_light():
                return "Es ist stockdunkel. Du siehst nichts."
            return self.room.describe()

