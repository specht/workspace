      solution: |
        In `Room`, neben `self.locks = {}` in `__init__`:

        ```python
        def lock(self, direction, key_name):
            self.locks[direction] = key_name

        def is_locked(self, direction):
            return direction in self.locks

        def unlock(self, key_name):
            doors = [d for d, key in self.locks.items() if key == key_name]
            for direction in doors:
                del self.locks[direction]
            return len(doors) > 0
        ```

        in `describe` die Ausgänge mit `[f"{d} (verschlossen)" if self.is_locked(d) else d for d in self.directions()]`, in `Player.go` vor dem Gehen `if self.room.is_locked(direction): return f"Die Tür nach {direction} ist verschlossen."`, und:

        ```python
        class Item:
            # …
            def use(self, player):
                return "Damit kannst du hier nichts anfangen."


        class Key(Item):
            def use(self, player):
                if player.room.unlock(self.name):
                    return "Du schließt die Tür auf."
                return f"Hier passt {self.name} in kein Schloss."


        class Food(Item):
            def use(self, player):
                player.inventory.remove(self)
                return f"Du isst {self.name}. {self.description}"


        class Player:
            # …
            def use(self, name):
                for item in self.inventory:
                    if item.name == name:
                        return item.use(self)
                return f"Du hast nichts mit dem Namen {name}."
        ```

  - id: welt
    title: Deine eigene Welt
    prompt: |
      Schreib in `adventure.rb` eine Funktion `build_world`, die deine eigene Welt baut und die Spielerin in ihrem ersten Raum zurückgibt. Die Welt hat mindestens drei Räume, die man vom ersten Raum aus erreicht, mindestens eine verschlossene Tür und irgendwo einen Schlüssel. Die Funktion `all_rooms(start)`, die alle erreichbaren Räume findet, kopierst du dazu in deine Datei:

      ```ruby
      def all_rooms(start)
        seen = [start]
        queue = [start]
        until queue.empty?
          room = queue.shift
          room.directions.each do |direction|
            other = room.exit_to(direction)
            next if seen.include?(other)
            seen << other
            queue << other
          end
        end
        seen
      end
      ```
    check:
      type: ruby
      file: textadventure/adventure.rb
      cases:
        - call: "build_world.is_a?(Player)"
          expect: "true"
          say: "`build_world` gibt die Spielerin zurück, als Letztes: `Player.new(…)`."
        - call: "all_rooms(build_world.room).length >= 3"
          expect: "true"
          say: "Vom ersten Raum aus erreicht man noch keine drei Räume. Verbinde sie mit `connect`, in beide Richtungen, wo man zurückgehen können soll."
        - call: "all_rooms(build_world.room).any? { |r| r.directions.any? { |d| r.locked?(d) } }"
          expect: "true"
          say: "In deiner Welt ist keine Tür verschlossen: `lock(direction, key_name)` an einem Raum."
        - call: "all_rooms(build_world.room).any? { |r| r.items.any? { |i| i.is_a?(Key) } }"
          expect: "true"
          say: "In keinem erreichbaren Raum liegt ein Schlüssel, `Key.new(…)`."
    hint:
      - "Zeichne deine Welt zuerst auf Papier: Kästen für die Räume, Pfeile für die Ausgänge, eine Tür, die verschlossen ist, und wo der Schlüssel liegt."
      - "Die kleine Welt oben auf der Seite ist ein Anfang: Bau weitere Räume dazu, verbinde sie mit `connect` und schließ eine Tür mit `lock` ab. Der Name des Schlüssels, `Key.new(\"schlüssel\", …)`, ist derselbe wie der in `lock`."
    solution: |
      ```ruby
      def build_world
        hall = Room.new("Flur", "Ein langer Flur mit knarrenden Dielen.")
        kitchen = Room.new("Küche", "Es riecht nach Kaffee.")
        cellar = Room.new("Keller", "Kalt und feucht. In der Ecke steht eine Kiste.")
        hall.connect("norden", kitchen)
        kitchen.connect("süden", hall)
        hall.connect("osten", cellar)
        cellar.connect("westen", hall)
        hall.lock("osten", "schlüssel")
        kitchen.add_item(Key.new("schlüssel", "Ein kleiner Messingschlüssel."))
        kitchen.add_item(Food.new("apfel", "Knackig und süß."))
        cellar.add_item(Item.new("kiste", "Eine schwere Holzkiste."))
        Player.new(hall)
      end
      ```
    python:
      prompt: |
        Schreib in `adventure.py` eine Funktion `build_world()`, die deine eigene Welt baut und die Spielerin in ihrem ersten Raum zurückgibt. Die Welt hat mindestens drei Räume, die man vom ersten Raum aus erreicht, mindestens eine verschlossene Tür und irgendwo einen Schlüssel. Die Funktion `all_rooms(start)`, die alle erreichbaren Räume findet, kopierst du dazu in deine Datei:

        ```python
        def all_rooms(start):
            seen = [start]
            queue = [start]
            while queue:
                room = queue.pop(0)
                for direction in room.directions():
                    other = room.exit_to(direction)
                    if other not in seen:
                        seen.append(other)
                        queue.append(other)
            return seen
        ```
