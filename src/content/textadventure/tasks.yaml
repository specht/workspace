    hint:
      - "Der Raum merkt sich die Schlösser in einem zweiten Dictionary, `@locks = {}`: die Richtung als Schlüssel, der Name des passenden Schlüssels als Wert. `locked?` fragt `@locks.key?(direction)`."
      - "`unlock` sucht die Richtungen, deren Wert `key_name` ist, `@locks.select { |_, key| key == key_name }.keys`, löscht sie aus `@locks` und gibt zurück, ob es welche gab."
      - "`Key#use(player)` ruft `player.room.unlock(name)` auf und gibt je nach Ergebnis die eine oder andere Meldung zurück. `Player#use(name)` findet den Gegenstand wie `Room#take`, nimmt ihn aber nicht heraus, und gibt `item.use(self)` zurück: `self` ist die Spielerin."
    solution: |
      In `Room`, neben `@locks = {}` in `initialize`:

      ```ruby
      def lock(direction, key_name)
        @locks[direction] = key_name
      end

      def locked?(direction)
        @locks.key?(direction)
      end

      def unlock(key_name)
        doors = @locks.select { |_, key| key == key_name }.keys
        doors.each { |direction| @locks.delete(direction) }
        !doors.empty?
      end
      ```

      in `describe` die Ausgänge mit `directions.map { |d| locked?(d) ? "#{d} (verschlossen)" : d }`, in `Player#go` vor dem Gehen `return "Die Tür nach #{direction} ist verschlossen." if @room.locked?(direction)`, und:

      ```ruby
      class Item
        # …
        def use(player)
          "Damit kannst du hier nichts anfangen."
        end
      end

      class Key < Item
        def use(player)
          if player.room.unlock(name)
            "Du schließt die Tür auf."
          else
            "Hier passt #{name} in kein Schloss."
          end
        end
      end

      class Food < Item
        def use(player)
          player.inventory.delete(self)
          "Du isst #{name}. #{description}"
        end
      end

      class Player
        # …
        def use(name)
          item = @inventory.find { |i| i.name == name }
          return "Du hast nichts mit dem Namen #{name}." if item.nil?
          item.use(self)
        end
      end
      ```
