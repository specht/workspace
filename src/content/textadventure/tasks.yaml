      - "`class Key < Item` und `class Food < Item` schreiben nur ihr eigenes `use`. Der Schlüssel fragt `player.room.unlock(name)`; der Apfel ruft `player.remove(self)` auf, und die Spielerin bekommt eine Methode `remove(item)`, die `@bag.delete(item)` tut."
      - "In `go` kommt nach der Frage nach dem Ausgang eine zweite: `return \"Die Tür nach #{direction} ist verschlossen.\" if @room.locked?(direction)`."
