      hint:
        - "`Item` sieht aus wie der Anfang von `Room`: zwei Attribute und ein Konstruktor `Item(this.name, this.description);`. Der Raum bekommt `final List<Item> items = [];`."
        - "In `take` gehst du mit `for (final item in items)` durch die Liste; hat ein Gegenstand den Namen, nimmst du ihn mit `items.remove(item)` heraus und gibst ihn sofort zurück. Nach der Schleife gibst du `null` zurück."
      solution: |
        ```dart
        class Item {
          final String name;
          final String description;

          Item(this.name, this.description);
        }
        ```

        und in `Room`, neben `final List<Item> items = [];`:

        ```dart
        void addItem(Item item) {
