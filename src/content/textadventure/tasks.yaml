      hint:
        - "`Game` merkt sich die Spielerin, `self._player`, und `self._over = False`. `handle` trennt die Zeile: `parts = line.strip().lower().split(\" \", 1)`; das Verb ist `parts[0]`, das Wort `parts[1]`, wenn es eines gibt, sonst `\"\"`."
        - "Ein `if verb == \"gehe\":` mit einem `elif` je Befehl; jeder ruft die Methode der Spielerin auf. Bei `ende` setzt du `self._over = True`."
