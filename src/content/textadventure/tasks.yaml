  - id: welt
    title: Deine eigene Welt
    prompt: |
      Schreib in `adventure.rb` eine Funktion `build_world`, die deine eigene Welt baut und die Spielerin in ihrem ersten Raum zurückgibt, und eine Liste `WALKTHROUGH` mit dem Weg zum Ziel, Befehl für Befehl, so wie man ihn tippt. Deine Welt hat mindestens vier Räume, die man vom ersten aus erreicht, ein Ziel, und auf dem Weg dorthin eine verschlossene Tür, deren Schlüssel man vorher finden muss. Die Prüfung spielt deinen Weg durch. Die Funktion `all_rooms(start)`, die alle erreichbaren Räume findet, kopierst du dazu in deine Datei:

      ```ruby
      def all_rooms(start)
        seen = [start]
        queue = [start]
        until queue.empty?
          room = queue.shift
          room.directions.each do |direction|
            other = room.exit_to(direction)
            next if seen.include?(other)
            seen << other
            queue << other
          end
        end
        seen
      end
      ```
