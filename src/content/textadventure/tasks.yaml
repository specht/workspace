    title: Die Spielerin geht und nimmt
    prompt: |
      Schreib eine Klasse `Player`, gebaut mit dem Raum, in dem die Spielerin anfängt, `Player.new(hall)`; `room` gibt ihn zurück. Was die Spielerin tut, gibt einen Text zurück, den das Spiel später zeigt:

      - `look` gibt die Beschreibung ihres Raums.
      - `go(direction)` geht in diese Richtung und gibt die Beschreibung des neuen Raums. Gibt es dort keinen Ausgang, bleibt sie stehen: `Da geht es nicht weiter.`
      - `take(name)` nimmt einen Gegenstand aus dem Raum in ihre Tasche: `Du nimmst schlüssel.`, oder `Hier liegt nichts mit dem Namen schlüssel.`
      - `has?(name)` sagt, ob ein Gegenstand dieses Namens in ihrer Tasche ist, und `bag` gibt `In deiner Tasche: schlüssel, apfel` zurück oder `Deine Tasche ist leer.`

      Die Tasche selbst, die Liste, gibt sie nicht heraus: Wer etwas über sie wissen will, fragt sie.
    check:
      type: ruby
      file: textadventure/adventure.rb
      cases:
        - call: "Player.new(Room.new('Flur', '')).room.name"
          expect: "'Flur'"
        - call: "Player.new(Room.new('Flur', 'Lang.')).look"
          expect: "\"Flur\\nLang.\\nAusgänge: keine\""
          say: "`look` gibt zurück, was der Raum über sich sagt: `@room.describe`."
        - call: "h = Room.new('Flur', 'Lang.'); k = Room.new('Küche', 'Warm.'); h.connect('norden', k); p = Player.new(h); [p.go('norden'), p.room.name]"
          expect: "[\"Küche\\nWarm.\\nAusgänge: keine\", 'Küche']"
        - call: "h = Room.new('Flur', ''); p = Player.new(h); [p.go('osten'), p.room.name]"
          expect: "['Da geht es nicht weiter.', 'Flur']"
          say: "Gibt es keinen Ausgang, bleibt die Spielerin, wo sie ist."
        - call: "h = Room.new('Flur', ''); h.add_item(Item.new('schlüssel', '')); p = Player.new(h); [p.take('schlüssel'), p.has?('schlüssel'), h.items.map(&:name)]"
          expect: "['Du nimmst schlüssel.', true, []]"
          say: "Der Gegenstand wechselt vom Raum in die Tasche: `@room.take(name)` gibt ihn heraus, und er kommt in `@bag`."
        - call: "h = Room.new('Flur', ''); p = Player.new(h); [p.take('lampe'), p.has?('lampe')]"
          expect: "['Hier liegt nichts mit dem Namen lampe.', false]"
        - call: "Player.new(Room.new('Flur', '')).bag"
          expect: "'Deine Tasche ist leer.'"
        - call: "h = Room.new('Flur', ''); h.add_item(Item.new('schlüssel', '')); h.add_item(Item.new('apfel', '')); p = Player.new(h); p.take('schlüssel'); p.take('apfel'); p.bag"
          expect: "'In deiner Tasche: schlüssel, apfel'"
    hint:
      - "Die Spielerin merkt sich `@room` und `@bag = []`. Nur den Raum braucht man von außen: `attr_reader :room`."
      - "`look` ist `@room.describe`. In `go` fragst du `@room.exit_to(direction)`; ist das `nil`, kommt die Meldung, sonst weist du `@room` den neuen Raum zu und gibst `look` zurück."
      - "`take` holt mit `@room.take(name)` den Gegenstand und legt ihn in `@bag`. `has?` ist `@bag.any? { |item| item.name == name }`, `bag` setzt die Namen mit `join(', ')` zusammen."
    solution: |
      ```ruby
      class Player
        attr_reader :room

        def initialize(room)
          @room = room
          @bag = []
        end

        def look
          @room.describe
        end

        def go(direction)
          target = @room.exit_to(direction)
          return "Da geht es nicht weiter." if target.nil?
          @room = target
          look
        end

        def take(name)
          item = @room.take(name)
          return "Hier liegt nichts mit dem Namen #{name}." if item.nil?
          @bag << item
          "Du nimmst #{item.name}."
        end

        def has?(name)
          @bag.any? { |item| item.name == name }
        end

        def bag
          return "Deine Tasche ist leer." if @bag.empty?
          "In deiner Tasche: #{@bag.map(&:name).join(', ')}"
        end
      end
      ```
