        - "Die kleine Welt oben auf der Seite ist ein Anfang: Bau weitere Räume dazu, verbinde sie mit `connect` und schließ eine Tür mit `lock` ab. Der Name des Schlüssels, `Key(\"schlüssel\", …)`, ist derselbe wie der in `lock`."
      solution: |
        ```python
        def build_world():
            hall = Room("Flur", "Ein langer Flur mit knarrenden Dielen.")
            kitchen = Room("Küche", "Es riecht nach Kaffee.")
            cellar = Room("Keller", "Kalt und feucht. In der Ecke steht eine Kiste.")
            hall.connect("norden", kitchen)
