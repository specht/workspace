            say: "`look` gibt zurück, was der Raum über sich sagt: `room.describe()`."
          - call: 'Room h = new Room("Flur", "Lang."); Room k = new Room("Küche", "Warm."); h.connect("norden", k); Player p = new Player(h); List.of(p.go("norden"), p.getRoom().getName())'
            expect: 'List.of("Küche\nWarm.\nAusgänge: keine", "Küche")'
          - call: 'Room h = new Room("Flur", ""); Player p = new Player(h); List.of(p.go("osten"), p.getRoom().getName())'
            expect: 'List.of("Da geht es nicht weiter.", "Flur")'
            say: "Gibt es keinen Ausgang, bleibt die Spielerin, wo sie ist."
          - call: 'Room h = new Room("Flur", ""); h.addItem(new Item("schlüssel", "")); Player p = new Player(h); List.of(p.take("schlüssel"), p.has("schlüssel"), h.getItems().size())'
            expect: 'List.of("Du nimmst schlüssel.", true, 0)'
            say: "Der Gegenstand wechselt vom Raum in die Tasche: `room.take(name)` gibt ihn heraus, und er kommt in `bag`."
          - call: 'Room h = new Room("Flur", ""); Player p = new Player(h); List.of(p.take("lampe"), p.has("lampe"))'
            expect: 'List.of("Hier liegt nichts mit dem Namen lampe.", false)'
          - call: 'new Player(new Room("Flur", "")).bag()'
            expect: '"Deine Tasche ist leer."'
          - call: 'Room h = new Room("Flur", ""); h.addItem(new Item("schlüssel", "")); h.addItem(new Item("apfel", "")); Player p = new Player(h); p.take("schlüssel"); p.take("apfel"); p.bag()'
            expect: '"In deiner Tasche: schlüssel, apfel"'
      hint:
        - "Die Spielerin merkt sich `private Room room;` und `private final List<Item> bag = new ArrayList<>();`. Nur den Raum gibt ein Getter heraus, `getRoom()`."
        - "`look` ist `room.describe()`. In `go` fragst du `room.exitTo(direction)`; ist das `null`, kommt die Meldung, sonst weist du `room` den neuen Raum zu und gibst `look()` zurück."
        - "`take` holt mit `room.take(name)` den Gegenstand und legt ihn in `bag`. `has` geht durch die Tasche und vergleicht die Namen mit `equals`; `bag()` sammelt die Namen und setzt sie mit `String.join(\", \", names)` zusammen."
      solution: |
        ```java
        import java.util.ArrayList;
        import java.util.List;

        public class Player {
            private Room room;
            private final List<Item> bag = new ArrayList<>();

            public Player(Room room) {
                this.room = room;
            }

            public Room getRoom() {
                return room;
            }

            public String look() {
                return room.describe();
            }

            public String go(String direction) {
                Room target = room.exitTo(direction);
                if (target == null) {
                    return "Da geht es nicht weiter.";
                }
                room = target;
                return look();
            }

            public String take(String name) {
                Item item = room.take(name);
                if (item == null) {
                    return "Hier liegt nichts mit dem Namen " + name + ".";
                }
                bag.add(item);
                return "Du nimmst " + item.getName() + ".";
            }

            public boolean has(String name) {
                for (Item item : bag) {
                    if (item.getName().equals(name)) {
                        return true;
                    }
                }
                return false;
            }

            public String bag() {
                if (bag.isEmpty()) {
                    return "Deine Tasche ist leer.";
                }
                List<String> names = new ArrayList<>();
                for (Item item : bag) {
                    names.add(item.getName());
                }
                return "In deiner Tasche: " + String.join(", ", names);
            }
        }
        ```

