        ```

  - id: spiel
    title: Das Spiel als Objekt
    prompt: |
      Schreib die Klasse `Game`, gebaut mit der Spielerin, `Game.new(player)`. Sie ist das, was zwischen dem Terminal und deinen Objekten vermittelt:

      - `start` gibt zurück, was die Spielerin am Anfang sieht.
      - `handle(line)` nimmt eine getippte Zeile, klein geschrieben und ohne Leerzeichen außen, und gibt die Antwort zurück: `gehe`, `nimm`, `benutze`, `schau` und `tasche` wie bisher, dazu der neue Befehl `untersuche`, für den die Spielerin `examine(name)` bekommt: die Beschreibung eines Gegenstands in ihrer Tasche oder im Raum, sonst `Hier gibt es nichts mit dem Namen zettel.` `ende` antwortet `Bis bald.` und beendet das Spiel, jedes andere Wort `Das verstehe ich nicht. Befehle: gehe, nimm, benutze, untersuche, schau, tasche, ende`.
      - `over?` sagt, ob das Spiel zu Ende ist, `won?`, ob die Spielerin am Ziel steht. Das Ziel ist ein `GoalRoom`, ein Raum, dessen `goal?` `true` ist (`Room` sagt `false`); wer ihn betritt, hat gewonnen, und das Spiel ist zu Ende.
    check:
      type: ruby
      file: textadventure/adventure.rb
      cases:
        - call: "Game.new(Player.new(Room.new('Flur', 'Lang.'))).start"
          expect: "\"Flur\\nLang.\\nAusgänge: keine\""
        - call: "h = Room.new('Flur', ''); k = Room.new('Küche', 'Warm.'); h.connect('norden', k); g = Game.new(Player.new(h)); [g.handle('gehe norden'), g.over?]"
          expect: "[\"Küche\\nWarm.\\nAusgänge: keine\", false]"
        - call: "h = Room.new('Flur', ''); h.add_item(Item.new('schlüssel', '')); g = Game.new(Player.new(h)); [g.handle('  Nimm Schlüssel  '), g.handle('tasche')]"
          expect: "['Du nimmst schlüssel.', 'In deiner Tasche: schlüssel']"
          say: "`handle` schreibt die Zeile klein und nimmt die Leerzeichen außen weg, bevor es Verb und Wort trennt: `line.strip.downcase.split(\" \", 2)`."
        - call: "h = Room.new('Flur', ''); h.add_item(Item.new('zettel', 'Kaffee um drei.')); g = Game.new(Player.new(h)); [g.handle('untersuche zettel'), g.handle('nimm zettel'), g.handle('untersuche zettel'), g.handle('untersuche lampe')]"
          expect: "['Kaffee um drei.', 'Du nimmst zettel.', 'Kaffee um drei.', 'Hier gibt es nichts mit dem Namen lampe.']"
        - call: "g = Game.new(Player.new(Room.new('Flur', ''))); g.handle('tanze')"
          expect: "'Das verstehe ich nicht. Befehle: gehe, nimm, benutze, untersuche, schau, tasche, ende'"
        - call: "g = Game.new(Player.new(Room.new('Flur', ''))); [g.over?, g.handle('ende'), g.over?, g.won?]"
          expect: "[false, 'Bis bald.', true, false]"
        - call: "h = Room.new('Halle', ''); out = GoalRoom.new('Schulhof', 'Geschafft!'); h.connect('süden', out); g = Game.new(Player.new(h)); g.handle('gehe süden'); [g.won?, g.over?, Room.new('x', '').goal?, GoalRoom.superclass]"
          expect: "[true, true, false, Room]"
          say: "Wer einen `GoalRoom` betritt, hat gewonnen: `won?` fragt den Raum der Spielerin, `goal?`, und nach jedem Befehl ist das Spiel zu Ende, wenn er es ist."
    hint:
      - "`Game` merkt sich die Spielerin und `@over = false`. `handle` trennt die Zeile in Verb und Wort, `verb, word = line.strip.downcase.split(\" \", 2)`, und `word` wird mit `word.to_s` ein Text, auch wenn nach dem Verb nichts kam."
      - "Ein `case verb` mit einem `when` je Befehl; jeder ruft die Methode der Spielerin auf und gibt ihre Antwort zurück. Bei `ende` setzt du `@over = true`."
      - "`won?` ist `@player.room.goal?`. Nach dem `case` setzt du `@over = true if won?` und gibst den Text zurück."
    solution: |
      ```ruby
      # in Room:
      def goal?
        false
      end

      class GoalRoom < Room
        def goal?
          true
        end
      end

      # in Player:
      def examine(name)
        item = @bag.find { |i| i.name == name } || @room.items.find { |i| i.name == name }
        return "Hier gibt es nichts mit dem Namen #{name}." if item.nil?
        item.description
      end

      class Game
        def initialize(player)
          @player = player
          @over = false
        end

        def start
          @player.look
        end

        def over?
          @over
        end

        def won?
          @player.room.goal?
        end

        def handle(line)
          verb, word = line.strip.downcase.split(" ", 2)
          word = word.to_s
          text = case verb
                 when "gehe" then @player.go(word)
                 when "nimm" then @player.take(word)
                 when "benutze" then @player.use(word)
                 when "untersuche" then @player.examine(word)
                 when "schau" then @player.look
                 when "tasche" then @player.bag
                 when "ende"
                   @over = true
                   "Bis bald."
                 else
                   "Das verstehe ich nicht. Befehle: gehe, nimm, benutze, untersuche, schau, tasche, ende"
                 end
          @over = true if won?
          text
        end
      end
      ```
