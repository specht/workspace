          - call: 'Room r = new Room("Keller", ""); r.addItem(new Item("kiste", "")); r.take("lampe"); r.getItems().stream().map(Item::getName).toList()'
            expect: 'List.of("kiste")'
            say: "Gibt es keinen Gegenstand mit dem Namen, bleibt die Liste, wie sie ist."
      hint:
        - "`Item` sieht aus wie der Anfang von `Room`: zwei private Attribute, ein Konstruktor und zwei Getter. Der Raum bekommt `private final List<Item> items = new ArrayList<>();`."
        - "In `take` gehst du mit `for (Item item : items)` durch die Liste; hat ein Gegenstand den Namen (`item.getName().equals(name)`, Texte vergleicht man in Java mit `equals`), nimmst du ihn mit `items.remove(item)` heraus und gibst ihn sofort zurück. Nach der Schleife gibst du `null` zurück."
      solution: |
        `Item.java`:

        ```java
        public class Item {
            private final String name;
            private final String description;

            public Item(String name, String description) {
                this.name = name;
                this.description = description;
            }

            public String getName() {
                return name;
            }

            public String getDescription() {
                return description;
            }
        }
        ```

        und in `Room`, neben `private final List<Item> items = new ArrayList<>();`:

        ```java
        public List<Item> getItems() {
            return items;
        }

        public void addItem(Item item) {
            items.add(item);
        }

        public Item take(String name) {
            for (Item item : items) {
                if (item.getName().equals(name)) {
                    items.remove(item);
                    return item;
                }
            }
            return null;
        }
        ```

