# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
# Die Stufen in stufen/ sind der Code nach jedem Kapitel; was ein Kapitel
# verlangt, fehlt der Stufe davor. In fehler/ stehen häufige Fehler, in Ruby
# und Python, je eine Änderung an der Lösung.
format: 1
activity: textadventure
examples:
  raum:
    pass:
      - { files: { textadventure/adventure.rb: stufen/1-raum/adventure.rb } }
      - { files: { textadventure/adventure.rb: loesung/adventure.rb } }
    fail:
      - { files: { textadventure/adventure.rb: { text: "# noch leer\n" } } }
    python:
      pass:
        - { files: { textadventure/adventure.py: stufen/1-raum/adventure.py } }
        - { files: { textadventure/adventure.py: loesung/adventure.py } }
      fail:
        - { files: { textadventure/adventure.py: { text: "# noch leer\n" } } }
  gegenstaende:
    pass:
      - { files: { textadventure/adventure.rb: stufen/2-gegenstaende/adventure.rb } }
      - { files: { textadventure/adventure.rb: loesung/adventure.rb } }
    fail:
      - { files: { textadventure/adventure.rb: { text: "# noch leer\n" } } }
      - { files: { textadventure/adventure.rb: stufen/1-raum/adventure.rb } }
      - { files: { textadventure/adventure.rb: fehler/nimmt-nicht-heraus.rb }, say: "Was herausgenommen ist" }
    python:
      pass:
        - { files: { textadventure/adventure.py: stufen/2-gegenstaende/adventure.py } }
        - { files: { textadventure/adventure.py: loesung/adventure.py } }
      fail:
        - { files: { textadventure/adventure.py: { text: "# noch leer\n" } } }
        - { files: { textadventure/adventure.py: stufen/1-raum/adventure.py } }
        - { files: { textadventure/adventure.py: fehler/nimmt-nicht-heraus.py }, say: "Was herausgenommen ist" }
  beschreibung:
