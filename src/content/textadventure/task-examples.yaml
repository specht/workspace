    fail:
      - { files: { textadventure/adventure.rb: { text: "# noch leer\n" } } }
      - { files: { textadventure/adventure.rb: stufen/2-gegenstaende/adventure.rb } }
      - { files: { textadventure/adventure.rb: fehler/leere-zeile.rb }, say: "fehlt die Zeile" }
    python:
      pass:
        - { files: { textadventure/adventure.py: stufen/3-beschreibung/adventure.py } }
        - { files: { textadventure/adventure.py: loesung/adventure.py } }
      fail:
        - { files: { textadventure/adventure.py: { text: "# noch leer\n" } } }
        - { files: { textadventure/adventure.py: stufen/2-gegenstaende/adventure.py } }
        - { files: { textadventure/adventure.py: fehler/leere-zeile.py }, say: "fehlt die Zeile" }
