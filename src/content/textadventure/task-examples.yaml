# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
# Die Stufen in stufen/ sind der Code nach jedem Kapitel; was ein Kapitel
# verlangt, fehlt der Stufe davor. In fehler/ stehen häufige Fehler, in Ruby
# und Python, je eine Änderung an der Lösung. Stufen, Lösung und Fehler
# schreibt src/scripts/textadventure/gen.py aus einer Quelle je Sprache.
format: 1
activity: textadventure
examples:
  modell:
    pass:
      - { files: { textadventure/textadventure.uml: { text: "class Room\n  - name: String\n  - description: String\n\nclass Item\n  - name: String\n  - description: String\n\nclass Player\n\nassociation items: Room 0..1 -> 0..* Item\nassociation room: Player 0..* -> 1 Room\nassociation bag: Player 0..1 -> 0..* Item\n" } } }
      - { files: { textadventure/textadventure.uml: loesung/textadventure.uml } }
    fail:
      - { files: { textadventure/textadventure.uml: { text: "class Room\nclass Item\nclass Player\n" } } }
