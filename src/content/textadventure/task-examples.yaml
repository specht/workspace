# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): was jede Prüfung annehmen und was sie ablehnen muss.
# Die Stufen in stufen/ sind der Code nach jedem Kapitel; was ein Kapitel
# verlangt, fehlt der Stufe davor. In fehler/ stehen häufige Fehler, in Ruby,
# Python und Dart, je eine Änderung an der Lösung; in Java (eine Datei je
# Klasse) liegen Stufen, Lösung und Fehler als Ordner in java/. Stufen, Lösung und Fehler
# schreibt src/scripts/textadventure/gen.py aus einer Quelle je Sprache.
