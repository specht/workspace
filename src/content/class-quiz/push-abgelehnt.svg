<path d='M 330 200 L 460 200' fill='none' stroke='#d97706' stroke-width='5' stroke-linecap='round'/>
<circle cx='230' cy='200' r='17' fill='#2b5fb4' stroke='#ffffff' stroke-width='4'/><text x='230' y='206' text-anchor='middle' font-family="'IBM Plex Sans', 'DejaVu Sans', sans-serif" font-size='16' font-weight='700' fill='#ffffff'>A</text>
<circle cx='330' cy='200' r='17' fill='#2b5fb4' stroke='#ffffff' stroke-width='4'/><text x='330' y='206' text-anchor='middle' font-family="'IBM Plex Sans', 'DejaVu Sans', sans-serif" font-size='16' font-weight='700' fill='#ffffff'>B</text>
