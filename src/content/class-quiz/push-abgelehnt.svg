<circle cx='330' cy='70' r='17' fill='#2b5fb4' stroke='#ffffff' stroke-width='4'/><text x='330' y='76' text-anchor='middle' font-family="'IBM Plex Sans', 'DejaVu Sans', sans-serif" font-size='16' font-weight='700' fill='#ffffff'>B</text>
