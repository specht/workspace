# Die Themen, die jede Aktivität im Meta-Block nennt (topics:), unabhängig
# von einem Land: Aus ihnen leitet der Plan eines Landes seine Zeile ab,
# wenn er keine eigene für die Aktivität hat (docs/plan-bundeslaender.md).
# Gegliedert nach den Inhaltsbereichen der Bildungsstandards Informatik der
# Gesellschaft für Informatik; fein genug, um zu tragen, was die Namen der
# Pläne von Berlin und Brandenburg unterscheiden. Ein Thema heißt, was die
# Aktivität wirklich übt, nicht alles, was sie berührt.

