# Die Bildungspläne von Baden-Württemberg für Informatik am Gymnasium
# (docs/plan-bundeslaender.md). Ein Entwurf: Die Zeile jeder Aktivität wird
# aus ihren Themen abgeleitet (topics:, themen.yaml), über die Zuordnung
# unten; eine Lehrkraft in Baden-Württemberg prüft sie
# (docs/plan-bundeslaender.md, »Was die Lehrkraft prüft«). Was sie
# bestätigt oder ändert, kommt als eigene Zeile unter lines:.
# Stand der Quellen: 27. Oktober 2026.
title: Bildungspläne von Baden-Württemberg
states:
  baden-wuerttemberg: Baden-Württemberg
status: Entwurf
status_text: Entwurf, von einer Lehrkraft in Baden-Württemberg zu prüfen
intro: >-
  Welche Aktivitäten des Workspace zu welchem Teil der Bildungspläne von Baden-Württemberg für Informatik am
  Gymnasium passen: der Aufbaukurs in Klasse 7, das Profilfach IMP in den Klassen 8 bis 10 und Informatik in der
  Kursstufe. Dieselbe Zeile steht für Lehrkräfte oben auf jeder Aktivität. Nur Lehrkräfte sehen diese Seite.
label: Bildungsplan Baden-Württemberg (Entwurf)
levels:
  - level: Klasse 7
    title: Klasse 7
    id: klasse-7
    source: >-
      Bildungsplan 2016, Aufbaukurs Informatik (Klasse 7); bis zum Bildungsplan des neuen Pflichtfachs
      »Informatik und Medienbildung« gilt er für Klasse 7 weiter
    url: https://www.bildungsplaene-bw.de/,Lde/LS/BP2016BW/ALLG/SEK1/INF7
    pdf: 'https://www.bildungsplaene-bw.de/site/bildungsplan-rebrush2024/bpExport/4615778/Lde/index.html?_page=0&requestMode=PDF&_finish=Erstellen'
    # für wen eine Aktivität sein darf, um hier zu stehen (age: und die
    # Berliner Zeile, CurriculumGraph::AGES): Sek I, Sek I und Oberstufe
    ages: [0, 1]
    groups:
      Inhaltsbezogene Kompetenzen:
        - Daten und Codierung
        - Algorithmen
        - Rechner und Netze
        - Informationsgesellschaft und Datensicherheit
  - level: IMP 8–10
    title: Profilfach IMP, Klassen 8 bis 10
    id: imp
    source: >-
      Bildungsplan 2016, Gymnasium, Profilfach Informatik, Mathematik, Physik (IMP), Teil Informatik; läuft aus,
      sein Nachfolger NIT (Naturwissenschaft, Informatik und Technik) hat noch keinen eigenen Bildungsplan
    url: https://www.bildungsplaene-bw.de/,Lde/LS/BP2016BW/ALLG/GYM/IMP
    pdf: 'https://www.bildungsplaene-bw.de/site/bildungsplan-rebrush2024/bpExport/4590964/Lde/index.html?_page=0&requestMode=PDF&_finish=Erstellen'
    ages: [0, 1]
    groups:
      Inhaltsbezogene Kompetenzen Informatik:
        - Daten und Codierung
        - Algorithmen
        - Rechner und Netze
        - Informationsgesellschaft und Datensicherheit
  - level: Kursstufe
    title: Kursstufe, Basisfach und Leistungsfach
    id: kursstufe
    source: Bildungsplan 2016, Gymnasium, Informatik (Schulversuch), Versuchsfassung 2020, Klassen 11/12
    url: https://www.bildungsplaene-bw.de/,Lde/LS/BP2016BW/ALLG/GYM/INF
    pdf: 'https://www.bildungsplaene-bw.de/site/bildungsplan-rebrush2024/bpExport/5101992/Lde/index.html?_page=0&requestMode=PDF&_finish=Erstellen'
    ages: [1, 2]
    groups:
      Daten und Codierung:
        - Bitebene
        - Datenstrukturen
        - Relationale Datenbanksysteme
      Algorithmen:
        - Strukturierte und objektorientierte Programmierung
        - Algorithmen auf Datenstrukturen
        - Rekursion
      Weitere Bereiche:
        - Rechner und Netze
        - Informationsgesellschaft und Datensicherheit
        - Automaten und formale Sprachen
        - Projektmanagement
notes:
  IMP 8–10:
    Rechner und Netze: Logik und Schaltnetze (Klasse 10) übt noch keine Aktivität.
  Kursstufe:
    Automaten und formale Sprachen: Grammatiken und Kellerautomaten nur im Leistungsfach.
# Thema (themen.yaml) => wo es im Plan steht: »Stufe: Name (Einzelheiten)«.
