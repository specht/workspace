# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): Das fertige Tagebuch (stufen/reisetagebuch.docx)
# muss die Prüfung bestehen; die Vorlage und die Stufen, in denen je eine
# Sache fehlt, scheitern an ihr. Alle macht dokumente.py.
format: 1
activity: paragraph-styles
examples:
  tagebuch:
    pass:
      - document: stufen/reisetagebuch.docx
    fail:
      - document: ../../static/paragraph-styles/06 Reisetagebuch.docx
        say: nur wie Überschriften aussehen
      - document: stufen/noch-von-hand.docx
        say: noch von Hand formatiert
      - document: stufen/ebene-3.docx
        say: nicht gleich 3
      - document: stufen/vorlage-wie-vorher.docx
        say: sieht noch aus wie am Anfang
      - document: stufen/titel-von-hand.docx
        say: soll aber »Untertitel« haben
      - document: stufen/text-von-hand.docx
        say: von Hand. Markier sie
      - document: stufen/text-von-hand.docx
        say: Ändere sie einmal, zum Beispiel ihre Schrift
  runde:
    pass:
      - document: stufen/tiere-am-see.docx
    fail:
      - document: ../../static/paragraph-styles/06 Tiere am See.docx
        say: nur wie Überschriften aussehen
  handgriffe:
    pass:
      - document: stufen/bauanleitung.docx
      - document: stufen/bauanleitung-libreoffice.docx
      - document: stufen/bauanleitung-libreoffice.odt
    fail:
      - document: ../../static/paragraph-styles/06 Bauanleitung.docx
        say: »Streichen« steht noch vor »Sägen«
      - document: ../../static/paragraph-styles/06 Bauanleitung.docx
        say: noch die Vorlage »Standard«
      - document: stufen/bauanleitung-zitat.docx
        say: die das Programm mitbringt
      - document: stufen/bauanleitung-reihenfolge.docx
        say: Navigator
  fallen:
    pass:
      - document: stufen/ostsee.docx
    fail:
      - document: ../../static/paragraph-styles/06 Ostsee.docx
        say: 0 von 11 Fallen gefunden
      - document: stufen/ostsee-zehn.docx
        say: 10 von 11 Fallen gefunden
