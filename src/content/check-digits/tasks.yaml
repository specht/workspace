        ```java
        public static int[] findError(int[][] grid) {
            int row = -1;
            for (int r = 0; r < grid.length; r++) {
                if (parity(grid[r]) == 1) {
                    row = r;
                }
            }
            int column = -1;
            for (int c = 0; c < grid[0].length; c++) {
                int[] bits = new int[grid.length];
                for (int r = 0; r < grid.length; r++) {
                    bits[r] = grid[r][c];
                }
                if (parity(bits) == 1) {
                    column = c;
                }
            }
            if (row == -1 || column == -1) {
                return null;
            }
            return new int[] {row, column};
        }
