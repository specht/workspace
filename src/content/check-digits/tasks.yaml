      ruft sie mit einem Gitter aus fünf Zeilen und fünf Spalten auf: ohne
      Fehler, mit einem gekippten Bit in Zeile 1 und Spalte 2 und mit einem
      gekippten Paritätsbit in Zeile 3 und Spalte 4 (gezählt ab 0); dazu mit
