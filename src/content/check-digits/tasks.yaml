# Aufgaben zu »Prüfziffern: erst planen, dann programmieren«, in Ruby und,
# unter python:, dart: und java:, in Python, Dart und Java. Format: docs/aufgaben.md. Alles liegt in
# /workspace/check-digits.
format: 1
activity: check-digits
tasks:
  - id: eine-ziffer
    title: Eine Ziffer falsch
    prediction: true
    prompt: |
      Die Kassiererin tippt statt der dritten Ziffer eine andere ein, sonst
      stimmt alles. Was macht die Kasse?
    check:
      type: choice
      options:
        - Sie piept, egal welche Ziffer sie falsch tippt.
        - Sie piept nur bei manchen falschen Ziffern.
        - Sie piept nicht; dafür müsste sie alle Waren der Welt kennen.
      correct: 0
    feedback:
      - when: { picked: 1 }
        say: Bei zwei falschen Ziffern kann das passieren. Bei einer einzigen nie, das zeigt das nächste Kapitel.
      - when: { picked: 2 }
        say: Die Kasse muss keine Ware kennen. Sie rechnet mit den Ziffern selbst nach.
    solution: |
      Sie piept jedes Mal. Die letzte Ziffer ist aus den anderen zwölf
      berechnet; stimmt eine der zwölf nicht, passt die Rechnung nicht mehr.

  - id: von-hand
    title: Von Hand gerechnet
    prompt: |
      Berechne die Prüfziffer zu den ersten zwölf Ziffern `4 260111 02043`,
      von Hand oder mit dem Taschenrechner.
    check: { type: number, expect: 4 }
    feedback:
      - when: { equals: 36 }
        say: 36 ist die Summe. Die Prüfziffer ist, was bis zum nächsten Vielfachen von 10 fehlt.
      - when: { equals: 6 }
        say: 6 ist der Rest der Summe. Gesucht ist, was bis zur nächsten durch 10 teilbaren Zahl fehlt.
      - when: { equals: 0 }
        say: Prüf die Gewichte noch einmal; die erste Ziffer zählt einfach, die zweite dreifach.
    hint:
      - |
        Schreib die zwölf Ziffern untereinander und daneben abwechselnd 1 und 3,
        mit 1 beginnend. Multipliziere jede Ziffer mit ihrem Gewicht.
      - |
        Die Produkte sind 4, 6, 6, 0, 1, 3, 1, 0, 2, 0, 4, 9.
    solution: |
      Die Summe ist 4 + 6 + 6 + 0 + 1 + 3 + 1 + 0 + 2 + 0 + 4 + 9 = 36; bis 40
      fehlen 4. Der ganze Code ist `4 260111 020434`.


  - id: rechts-lesen
    title: Eine Ziffer aus Strichen
    prompt: |
      Rechts von der Mitte steht eine Ziffer mit dem Muster `1000010`. Welche
      Ziffer ist es?
    check: { type: number, expect: 3 }
    feedback:
      - when: { equals: 7 }
        say: '`1000010` ist kein L-Muster: Rechts steht R. Vertausch erst 0 und 1, dann such in der Tabelle für L.'
    hint:
      - Rechts steht jede Ziffer in R, und R ist L mit vertauschtem Hell und Dunkel.
      - Aus `1000010` wird mit vertauschten 0 und 1 `0111101`.
    solution: |
      Die 3. Vertauscht man 0 und 1, wird aus `1000010` das L-Muster
      `0111101`, und das gehört in der Tabelle zur 3. Bei den Nudeln steht
      sie rechts an fünfter Stelle.

  - id: erste-ziffer
    title: Die versteckte erste Ziffer
    prompt: |
      Auf einer anderen Ware stehen die sechs Ziffern links von der Mitte in
      den Fassungen L G G L L G. Mit welcher Ziffer beginnt ihr Code?
    check: { type: number, expect: 5 }
    hint:
      - Die erste Ziffer hat keine eigenen Striche; sie steckt im Muster der Fassungen links.
      - Such das Muster L G G L L G in der Tabelle der ersten Ziffern.
    solution: |
      Mit der 5: Das Muster L G G L L G steht in der Tabelle bei der 5.
  - id: raetsel
    title: Ein Struktogramm lesen
    prediction: true
    prompt: |
      Was gibt `mystery(4021)` zurück? Geh das Struktogramm Zeile für Zeile
      durch und schreib dir die Werte von `n` und `s` auf.
    check: { type: number, expect: 7 }
    feedback:
      - when: { equals: 4 }
        say: Die Schleife läuft, solange `n > 0` ist, also mehr als einmal.
      - when: { equals: 1 }
        say: '`n mod 10` ist die letzte Ziffer; danach wird `n` um eine Ziffer kürzer. Wie oft geht das bei 4021?'
      - when: { equals: 4021 }
        say: '`s` beginnt bei 0 und bekommt bei jedem Durchlauf `n mod 10` dazu.'
    solution: |
      7. Die Schleife nimmt die Ziffern von hinten: 1, 2, 0, 4. `mystery`
      berechnet die Quersumme.

  - id: zweites-mod
    title: Wozu das zweite mod?
    prompt: |
      Die Prüfziffer ist `(10 - total mod 10) mod 10`. Wann ändert das zweite
      `mod 10` etwas am Ergebnis?
    check:
      type: choice
      options:
        - Nie; es steht nur zur Sicherheit da.
        - Wenn total durch 10 teilbar ist.
        - Wenn total größer als 100 ist.
      correct: 1
    feedback:
      - when: { picked: 0 }
        say: Rechne `10 - total mod 10` für total = 40. Ist das eine Ziffer?
      - when: { picked: 2 }
        say: '`total mod 10` ist immer eine Ziffer von 0 bis 9, egal wie groß total ist. Welche davon macht Ärger?'
    solution: |
      Ist total durch 10 teilbar, ist `10 - total mod 10` gleich 10, und eine
      Prüfziffer ist eine Ziffer. Das zweite `mod 10` macht daraus 0.

