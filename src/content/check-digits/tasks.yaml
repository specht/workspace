  - id: isbn
    title: Bücher prüfen
    prompt: |
      Schreib `valid_isbn?(isbn)` nach deinem Plan. Die Prüfung ruft sie mit
      ISBNs mit und ohne Bindestriche auf, mit einem X am Ende, mit einem X an
      der falschen Stelle und mit falschen Ziffern.
    check:
      type: ruby
      file: check-digits/check_digits.rb
      cases:
        - call: 'valid_isbn?("3-12-345678-1")'
          expect: true
          say: Die Bindestriche zählen nicht mit; nimm sie vor dem Rechnen heraus.
        - call: 'valid_isbn?("3123456781")'
          expect: true
        - call: 'valid_isbn?("3-12-345603-X")'
          expect: true
          say: Am Ende steht hier X für 10.
        - call: 'valid_isbn?("3-12-345603-0")'
          expect: false
        - call: 'valid_isbn?("3-12-345687-1")'
          expect: false
          say: Zwei Ziffern sind vertauscht; die Summe ist dann nicht mehr durch 11 teilbar.
        - call: 'valid_isbn?("3-12-34X603-0")'
          expect: false
          say: Ein X darf nur am Ende stehen.
        - call: 'valid_isbn?("3-12-34567-1")'
          expect: false
          say: Neun Ziffern sind zu wenig.
    solution: |
      ```ruby
      def valid_isbn?(isbn)
        text = isbn.delete('-')
        return false unless text.length == 10

        total = 0
        text.chars.each_with_index do |c, i|
          if c == 'X' && i == 9
            value = 10
          elsif ('0'..'9').include?(c)
            value = c.to_i
          else
            return false
          end
          total = total + (10 - i) * value
        end
        total % 11 == 0
      end
      ```
    python:
      prompt: |
        Schreib `is_valid_isbn(isbn)` nach deinem Plan. Die Prüfung ruft sie mit
        ISBNs mit und ohne Bindestriche auf, mit einem X am Ende, mit einem X an
        der falschen Stelle und mit falschen Ziffern.
      check:
        type: python
        file: check-digits/check_digits.py
        cases:
          - call: 'is_valid_isbn("3-12-345678-1")'
            expect: true
            say: Die Bindestriche zählen nicht mit; nimm sie vor dem Rechnen heraus.
          - call: 'is_valid_isbn("3123456781")'
            expect: true
          - call: 'is_valid_isbn("3-12-345603-X")'
            expect: true
            say: Am Ende steht hier X für 10.
          - call: 'is_valid_isbn("3-12-345603-0")'
            expect: false
          - call: 'is_valid_isbn("3-12-345687-1")'
            expect: false
            say: Zwei Ziffern sind vertauscht; die Summe ist dann nicht mehr durch 11 teilbar.
          - call: 'is_valid_isbn("3-12-34X603-0")'
            expect: false
            say: Ein X darf nur am Ende stehen.
          - call: 'is_valid_isbn("3-12-34567-1")'
            expect: false
            say: Neun Ziffern sind zu wenig.
      solution: |
        ```python
        def is_valid_isbn(isbn):
            text = isbn.replace('-', '')
            if len(text) != 10:
                return False
            total = 0
            for i, c in enumerate(text):
                if c == 'X' and i == 9:
                    value = 10
                elif c in '0123456789':
                    value = int(c)
                else:
                    return False
                total = total + (10 - i) * value
            return total % 11 == 0
        ```

  - id: zahlendreher-vorhersage
    title: Zahlendreher
    prediction: true
    prompt: |
      Die Kassiererin vertauscht zwei benachbarte Ziffern, die verschieden
      sind, etwa `42` statt `24`. Merkt die Kasse das?
    check:
      type: choice
      options:
        - Immer.
        - Meistens, aber nicht immer.
        - Etwa bei jedem zweiten Zahlendreher.
        - Nie; die Summe der Ziffern bleibt ja gleich.
      correct: 1
    feedback:
      - when: { picked: 3 }
        say: Die Summe der Ziffern bleibt gleich, aber die beiden Ziffern tauschen ihre Gewichte.
    solution: |
      Meistens: Die beiden Ziffern tauschen ihre Gewichte 1 und 3, und das
      ändert die Summe fast immer so, dass die Prüfziffer nicht mehr passt.

