  - id: isbn-dreher
    title: Und bei Büchern?
    prediction: true
    extra: true
    prompt: |
      Wie viele Zahlendreher aus zwei verschiedenen Ziffern merkt die ISBN
      nicht?
    check:
      type: choice
      options: [Keinen., Auch etwa jeden neunten., Mehr als bei EAN.]
      correct: 0
    solution: |
      Keinen. Vertauschen zwei benachbarte Ziffern a und b, ändert sich die
      Summe um a − b, und das ist nie durch 11 teilbar. Darum rechnet die ISBN
      mit 11 und nimmt dafür das X in Kauf.
