# Beispiele für die Prüfungen in tasks.yaml (docs/aufgaben.md, »Beispiele
# für die Prüfungen«): Die fertige Tabelle muss die Prüfung bestehen, auch
# mit den Formaten, wie Excel sie speichert (sein Euro-Zeichen als Text im
# Format); die Vorlage und die Tabelle ohne Formate scheitern. Alle macht
# dokumente.py.
format: 1
activity: number-formats
examples:
  einzahlungen:
    pass:
      - document: stufen/einzahlungen.xlsx
      - document: stufen/excel-format.xlsx
    fail:
      - document: ../../static/number-formats/02 Einzahlungen.xlsx
        say: Text, nicht als Zahl
      - document: stufen/ohne-format.xlsx
        say: als Währung formatiert
  runde:
    pass:
      - document: stufen/klassenkasse.xlsx
    fail:
      - document: ../../static/number-formats/02 Klassenkasse.xlsx
        say: Text, nicht als Zahl
  handgriffe:
    pass:
      - document: stufen/anzahlung.xlsx
    fail:
      - document: ../../static/number-formats/02 Anzahlung.xlsx
        say: "zum Beispiel C4, steht nichts, keine Formel"
  fallen:
    pass:
      - document: stufen/wandertag.xlsx
    fail:
      - document: ../../static/number-formats/02 Wandertag.xlsx
        say: 0 von 5 Fallen gefunden
      - document: stufen/wandertag-vier.xlsx
        say: 4 von 5 Fallen gefunden
