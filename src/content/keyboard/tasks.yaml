# Aufgaben zum Keyboard-Tutorial. Format: docs/aufgaben.md.
# Jede Aufgabe ist ein Kapitel des Tutorials (keyboard-Prüfung): erledigt,
# wenn alle Schritte des Kapitels in /workspace/.hs-kbd-tutorial/.state.json
# abgehakt sind. Die Schritte stehen in
# src/vscode-extensions/keyboard-tutorial/tutorial/sections.yaml.
format: 1
activity: keyboard
tasks:
  - id: tastatur
    title: Die Tastatur
    prompt: Erledige im Keyboard-Tutorial das Kapitel »Die Tastatur«.
    check:
      type: keyboard
      section: Die Tastatur

  - id: navigieren
    title: Navigieren im Dokument
    prompt: Erledige das Kapitel »Navigieren im Dokument«.
    check:
      type: keyboard
      section: Navigieren im Dokument

  - id: markieren
    title: Text markieren
    prompt: Erledige das Kapitel »Text markieren«.
    check:
      type: keyboard
      section: Text markieren

  - id: kopieren-ohne-markierung
    title: Kopieren ohne Markierung
    prediction: true
    prompt: |
      In Visual Studio Code steht der Cursor mitten in einer Zeile, nichts ist
      markiert. Du drückst <kbd>Strg</kbd><kbd>C</kbd>, gehst zwei Zeilen
      tiefer und drückst <kbd>Strg</kbd><kbd>V</kbd>. Was passiert?
      Überleg erst, dann probier es aus.
    check:
      type: choice
      options:
        - Nichts, weil nichts markiert war.
        - Das Wort, in dem der Cursor stand, wird an der neuen Stelle eingefügt.
        - Die ganze Zeile wird als eigene Zeile über der neuen Zeile eingefügt.
        - Eingefügt wird, was vorher in der Zwischenablage war.
      correct: 2
    feedback:
      - when: { picked: 0 }
        say: Viele Programme machen es so. Visual Studio Code nicht. Probier es aus.
      - when: { picked: 1 }
        say: Das Wort markiert erst ein Doppelklick oder <kbd>Strg</kbd><kbd>D</kbd>. Probier es aus.
      - when: { picked: 3 }
        say: Die Zwischenablage ändert sich, auch ohne Markierung. Probier es aus.
    solution: |
      Ohne Markierung kopiert Visual Studio Code die ganze Zeile, und
      <kbd>Strg</kbd><kbd>V</kbd> fügt sie als eigene Zeile über der Zeile
      mit dem Cursor ein.

  - id: bearbeiten
    title: Text bearbeiten
    prompt: Erledige das Kapitel »Text bearbeiten«.
    check:
      type: keyboard
      section: Text bearbeiten

  - id: suchen
    title: Suchen und Ersetzen
    prompt: Erledige das Kapitel »Suchen und Ersetzen«.
    check:
      type: keyboard
      section: Suchen und Ersetzen

  - id: mehrere-stellen
    title: Mehrere Stellen gleichzeitig
    prompt: Erledige das Kapitel »Mehrere Stellen gleichzeitig bearbeiten«.
    check:
      type: keyboard
      section: Mehrere Stellen gleichzeitig bearbeiten

  - id: code
    title: Code bearbeiten
    prompt: Erledige das Kapitel »Code bearbeiten«.
    check:
      type: keyboard
      section: Code bearbeiten
