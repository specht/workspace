      # Dein Plan, ein Befehl pro Zeile
    check:
      type: pip
      language: ruby
      commands: [move, turn_left, take]
      maps:
        - facing: east
          map: |
            #######
            #P..###
            ###o###
            ###.###
            ###L###
            #######
      goal: { lamp: true, stones: all }
    hint: "Erst auf das Feld des Steins gehen, dann `take`. Steht Pip daneben, greift Pip ins Leere."
    solution: |
      ```ruby
      move
      move
      turn_left
      turn_left
      turn_left
      move
      take
      move
      move
      ```
