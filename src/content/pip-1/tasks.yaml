  - id: first-stone
    title: "Der erste Funkenstein"
    level: 1
    prompt: |
      Auf dem Weg nach unten liegt ein Funkenstein. Pip hebt ihn mit `take` auf, wenn Pip auf seinem Feld steht. Bring Pip mit dem Stein zur Lampe.
