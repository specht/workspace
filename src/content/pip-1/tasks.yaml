  - id: room
    title: "Vier Wände"
    level: 1
    prompt: |
      In diesem Raum liegt an jeder Wand ein Funkenstein, an jeder an derselben Stelle. Pip macht an jeder Wand dasselbe: Schreib es einmal in die Schleife, und Pip wiederholt es viermal.
    starter: |
      4.times do
        # was Pip an jeder Wand entlang macht
      end
    check:
      type: pip
      language: ruby
      commands: [move, turn_left, take]
      maps:
        - facing: east
          map: |
            ######
            #.o..#
            #...o#
            #o...#
            #P.o.#
            ######
      goal: { stones: all }
    hint: |
      Schau dir die erste Wand an: Wie viele Schritte bis zum Stein, wie viele danach bis zur Ecke? An der Ecke dreht sich Pip nach links.
