format: 1
activity: pip-1
tasks:
  - id: entrance
    title: "Zur ersten Lampe"
    level: 1
    prompt: |
      Bring Pip mit den Knöpfen zur Lampe und schau zu, wie der Plan mitwächst.
    check:
      type: pip
      language: ruby
      commands: [move, turn_left]
      buttons: [move, turn_left]
      maps:
        - facing: south
          map: |
            #######
            #P#####
            #.#####
            #....L#
            #######
      goal: { lamp: true }
    hint: |
      Pip schaut nach unten. Wohin schaut Pip nach einer Drehung nach links? Probier es aus: Mit *Rückgängig* nimmst du jeden Klick wieder heraus.
    python:
      check:
        type: pip
        language: python
        commands: [move, turn_left]
        buttons: [move, turn_left]
        maps:
          - facing: south
            map: |
              #######
              #P#####
              #.#####
              #....L#
              #######
        goal: { lamp: true }
    javascript:
      check:
        type: pip
        language: javascript
        commands: [move, turn_left]
        buttons: [move, turn_left]
        maps:
          - facing: south
            map: |
              #######
              #P#####
              #.#####
              #....L#
              #######
        goal: { lamp: true }

  - id: predict
    title: "Wo steht Pip?"
    prediction: true
    prompt: |
      Pip schaut nach rechts. Wo steht Pip nach dem Plan oben?
    check:
      type: choice
      options: ["Auf Feld 1", "Auf Feld 2", "Auf Feld 3", "Pip läuft gegen die Wand"]
      correct: 0

  - id: shaft
    title: "Hinunter zur Lampe"
    level: 1
    prompt: |
      Unten im Schacht steht die erste alte Lampe. Schreib Pip einen Plan mit `move` und `turn_left`, der Pip zur Lampe bringt.
    starter: |
      # Dein Plan, ein Befehl pro Zeile
    check:
      type: pip
      language: ruby
      commands: [move, turn_left]
      maps:
        - facing: east
          map: |
            #######
            #P..###
            ###.###
            ###.###
            ###L###
            #######
      goal: { lamp: true }
    hint: |
      Nach zwei Schritten muss Pip nach rechts abbiegen, aber Pip kann sich nur nach links drehen. Wie oft nach links ergibt einmal rechts?
    solution: |
      ```ruby
      move
      move
      turn_left
      turn_left
      turn_left
      move
      move
      move
      ```
    python:
      prompt: |
        Unten im Schacht steht die erste alte Lampe. Schreib Pip einen Plan mit `move()` und `turn_left()`, der Pip zur Lampe bringt.
      starter: |
        # Dein Plan, ein Befehl pro Zeile
      check:
        type: pip
        language: python
        commands: [move, turn_left]
        maps:
          - facing: east
            map: |
              #######
              #P..###
              ###.###
              ###.###
              ###L###
              #######
        goal: { lamp: true }
      hint: |
        Nach zwei Schritten muss Pip nach rechts abbiegen, aber Pip kann sich nur nach links drehen. Wie oft nach links ergibt einmal rechts?
      solution: |
        ```python
        move()
        move()
        turn_left()
        turn_left()
        turn_left()
        move()
        move()
        move()
        ```
    javascript:
      prompt: |
        Unten im Schacht steht die erste alte Lampe. Schreib Pip einen Plan mit `move()` und `turnLeft()`, der Pip zur Lampe bringt.
      starter: |
